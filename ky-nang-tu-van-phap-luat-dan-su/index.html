<script id="pn-data" type="application/json">{"meta":{"id":"ky-nang-tu-van-phap-luat-dan-su","name":"Kỹ năng tư vấn pháp luật dân sự","title":"Kỹ năng tư vấn pháp luật dân sự","menuTitle":"Kỹ năng tư vấn","asof":"06/11/2026","note":"Ngân hàng tình huống: 20 tình huống (Chương 2–6), mỗi tình huống 8 câu ABCD theo 5 bước tư vấn, dựng từ bản án trong Hồ sơ TVPLDS và án lệ của Hội đồng Thẩm phán TANDTC. Chương 1 ôn qua Tóm tắt lý thuyết.","laws":[{"re":"BLDS|Bộ luật Dân sự","base":"https://hethongphapluat.com/bo-luat-dan-su-2015"},{"re":"HNGĐ|Hôn nhân và gia đình","base":"https://hethongphapluat.com/luat-hon-nhan-va-gia-dinh-2014"}],"exam":{"n":0,"nc":3,"min":60,"sizes":[0],"times":[30,45,60]}},"chapters":[{"n":1,"name":"Khái quát chung về tư vấn pháp luật dân sự","ch":"Chương 1"},{"n":2,"name":"Kỹ năng tư vấn về chủ thể quan hệ pháp luật dân sự","ch":"Chương 2"},{"n":3,"name":"Kỹ năng tư vấn về tài sản, quyền sở hữu và các quyền khác đối với tài sản","ch":"Chương 3"},{"n":4,"name":"Kỹ năng tư vấn pháp luật về hợp đồng","ch":"Chương 4"},{"n":5,"name":"Kỹ năng tư vấn về trách nhiệm bồi thường thiệt hại ngoài hợp đồng","ch":"Chương 5"},{"n":6,"name":"Kỹ năng tư vấn pháp luật về thừa kế","ch":"Chương 6"}],"q":[{"id":"TH2.01.1","g":2,"lv":"TH","q":"Trong vụ việc, ai là khách hàng và khách hàng yêu cầu tư vấn về vấn đề gì?","o":["Chị Hiền; yêu cầu tư vấn thủ tục ly hôn đơn phương với anh Bảo vì anh không còn khả năng chung sống","Ông Tư; xác định năng lực hành vi, người giám hộ và việc quản lý tài sản cho anh Bảo","Anh Bảo; yêu cầu tư vấn về chế độ trợ cấp xã hội hằng tháng dành cho người khuyết tật nặng","UBND xã S; yêu cầu tư vấn về trình tự cấp và thu hồi giấy xác nhận khuyết tật"],"a":1,"e":"Người trực tiếp đến tư vấn là ông Tư — cha đẻ, người đang nuôi dưỡng anh Bảo. Yêu cầu của ông xoay quanh tình trạng năng lực hành vi của anh Bảo, ai chăm sóc, đại diện, quản lý tài sản cho anh và thủ tục cần làm; ông không yêu cầu ly hôn hay tư vấn chế độ trợ cấp.","b":"Điều 22, Điều 53 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"TH","q":"Để xác định người giám hộ đương nhiên của anh Bảo, luật sư cần ông Tư bổ sung ngay thông tin, giấy tờ nào?","o":["Giấy chứng nhận quyền sử dụng đất của ông Tư, bà Kim để chứng minh điều kiện nuôi dưỡng","Hợp đồng lao động của anh Bảo trước khi bị tai nạn để xác định thu nhập","Giấy chứng nhận kết hôn và giấy khai sinh các con của anh Bảo (nếu có)","Biên bản xử lý vụ tai nạn giao thông năm 2024 của cơ quan công an"],"a":2,"e":"Thứ tự người giám hộ đương nhiên của người thành niên mất năng lực hành vi là vợ/chồng → con cả (con tiếp theo) có đủ điều kiện → cha, mẹ (Điều 53). Vì vậy phải biết anh Bảo còn vợ hợp pháp không và có con thành niên đủ điều kiện làm giám hộ không; giấy tờ đất, hợp đồng lao động hay biên bản tai nạn không giải quyết được vấn đề này.","b":"Điều 53 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Căn cứ nào quyết định việc yêu cầu Tòa án tuyên bố anh Bảo mất năng lực hành vi dân sự hay chỉ là người có khó khăn trong nhận thức, làm chủ hành vi?","o":["Giấy xác nhận khuyết tật dạng thần kinh, tâm thần do UBND xã S cấp năm 2025","Lời khai của ông Tư, bà Kim và hàng xóm về tình trạng sức khỏe hằng ngày của anh Bảo","Văn bản thỏa thuận giữa gia đình ông Tư và chị Hiền về việc chăm sóc anh Bảo","Kết luận giám định pháp y tâm thần về khả năng nhận thức, làm chủ hành vi của anh Bảo"],"a":3,"e":"Tòa án tuyên bố một người mất năng lực hành vi dân sự (Điều 22) hoặc có khó khăn trong nhận thức, làm chủ hành vi (Điều 23) trên cơ sở kết luận giám định pháp y tâm thần. Giấy xác nhận khuyết tật là căn cứ hưởng chính sách, không thay thế kết luận giám định; lời khai và thỏa thuận gia đình không có giá trị quyết định.","b":"Khoản 1 Điều 22, khoản 1 Điều 23 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Nếu anh Bảo bị tuyên bố mất năng lực hành vi dân sự, ai là người giám hộ đương nhiên theo thứ tự đầu tiên?","o":["Chị Hiền, vì là vợ của anh Bảo","Ông Tư, vì là người đang trực tiếp nuôi dưỡng anh Bảo","Người do UBND xã S cử ngay từ đầu theo đề nghị của gia đình","Bà Kim, vì là mẹ đẻ và đang sống cùng anh Bảo"],"a":0,"e":"Khoản 1 Điều 53 BLDS 2015: trường hợp chồng là người mất năng lực hành vi dân sự thì vợ là người giám hộ. Cha mẹ chỉ là người giám hộ đương nhiên khi người mất năng lực hành vi chưa có vợ, chồng, con hoặc có nhưng đều không đủ điều kiện (khoản 3). UBND cấp xã chỉ cử người giám hộ khi không có người giám hộ đương nhiên (Điều 54).","b":"Điều 53, Điều 54 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.5","g":2,"lv":"VD","q":"Chị Hiền viết \"Giấy trả chồng\", bỏ mặc việc chăm sóc và giữ sổ tiết kiệm của anh Bảo. Gia đình ông Tư có thể làm gì để trở thành người giám hộ?","o":["Không làm được gì, vì chị Hiền là người giám hộ đương nhiên trong suốt thời kỳ hôn nhân","Yêu cầu thay đổi người giám hộ vì chị Hiền vi phạm nghiêm trọng nghĩa vụ giám hộ","Tự lập văn bản cử ông Tư làm người giám hộ, chỉ cần có chữ ký của chị Hiền là đủ","Phải khởi kiện ly hôn thay anh Bảo trước, sau đó mới được đăng ký làm người giám hộ"],"a":1,"e":"Điều 60 BLDS 2015 cho phép thay đổi người giám hộ khi người giám hộ không còn đủ điều kiện (Điều 49) hoặc vi phạm nghiêm trọng nghĩa vụ giám hộ; khi thay đổi người giám hộ đương nhiên thì xác định lại theo Điều 53 (con cả thành niên đủ điều kiện, nếu không có thì cha mẹ). Giám hộ không xác lập bằng văn bản tự lập giữa các bên, và không phải ly hôn mới thay đổi được.","b":"Điều 49, Điều 53, Điều 60 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.6","g":2,"lv":"VD","q":"Sau khi trở thành người giám hộ, ông Tư muốn rút sổ tiết kiệm 300 triệu đồng của anh Bảo để mua đất đứng tên ông Tư. Nhận định nào đúng?","o":["Được làm, vì người giám hộ được toàn quyền định đoạt tài sản của người được giám hộ","Được làm nếu bà Kim (người cùng nuôi dưỡng) đồng ý bằng văn bản có chứng thực","Không được; giao dịch này không vì lợi ích của anh Bảo và cần người giám sát việc giám hộ đồng ý","Được làm nếu ông Tư lập giấy cam kết sau này trả lại đủ tiền cho anh Bảo"],"a":2,"e":"Điều 59 BLDS 2015: người giám hộ quản lý tài sản của người được giám hộ như tài sản của mình; việc định đoạt tài sản có giá trị lớn phải được người giám sát việc giám hộ đồng ý; người giám hộ không được xác lập giao dịch với người được giám hộ liên quan đến tài sản của người này, trừ giao dịch vì lợi ích của người được giám hộ và có sự đồng ý của người giám sát. Dùng tiền của anh Bảo mua đất đứng tên ông Tư không vì lợi ích của anh Bảo.","b":"Điều 59 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.7","g":2,"lv":"VD","q":"Phương thức giải quyết phù hợp nhất để xác lập tư cách pháp lý cho ông Tư là gì?","o":["Khiếu nại đến UBND xã S yêu cầu thu hồi \"Giấy trả chồng\" và buộc chị Hiền quay về chăm sóc","Khởi kiện vụ án dân sự đòi chị Hiền bồi thường chi phí chăm sóc anh Bảo từ tháng 6/2026","Thương lượng với chị Hiền, lập văn bản thỏa thuận chuyển giám hộ có chứng thực là đủ","Yêu cầu Tòa án tuyên bố anh Bảo mất năng lực hành vi dân sự, sau đó xác định và đăng ký giám hộ"],"a":3,"e":"Yêu cầu tuyên bố một người mất năng lực hành vi dân sự là việc dân sự thuộc thẩm quyền Tòa án (khoản 1 Điều 27, Điều 376–378 BLTTDS 2015); có quyết định của Tòa án mới xác định được người giám hộ và đăng ký giám hộ. Thỏa thuận với chị Hiền có thể hỗ trợ nhưng không thay được quyết định của Tòa án; khiếu nại hay kiện đòi bồi thường không giải quyết được tư cách giám hộ.","b":"Khoản 1 Điều 27, Điều 376–378 BLTTDS 2015; Điều 22, Điều 46 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.8","g":2,"lv":"VD","q":"Khi trả lời tư vấn, luật sư nên cảnh báo rủi ro nào cho ông Tư trong thời gian chưa có quyết định của Tòa án?","o":["Ông Tư có thể bị xử phạt hành chính vì đã nhận chăm sóc anh Bảo khi chưa đăng ký giám hộ","Ông Tư chưa có tư cách đại diện cho anh Bảo; chị Hiền vẫn đang giữ tài sản của anh","Anh Bảo sẽ bị cắt trợ cấp xã hội ngay khi gia đình nộp đơn yêu cầu lên Tòa án","Mọi giao dịch anh Bảo đã xác lập trước khi bị tai nạn đều bị vô hiệu kể từ ngày nộp đơn"],"a":1,"e":"Trước khi Tòa án tuyên bố và giám hộ được xác lập, ông Tư không phải người đại diện theo pháp luật của anh Bảo (Điều 136), nên không thực hiện được giao dịch nhân danh anh Bảo; chị Hiền vẫn là vợ và đang giữ sổ tiết kiệm. Việc chăm sóc không bị xử phạt; giao dịch anh Bảo xác lập trước đó không đương nhiên vô hiệu; nộp đơn không làm mất trợ cấp.","b":"Điều 136 BLDS 2015","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"TH","q":"Anh Cường tham gia vụ việc với những tư cách nào?","o":["Người thừa kế thế vị của cụ Đức, cụ Nhàn vì ông Tâm đã mất năng lực hành vi","Người giám hộ của ông Tâm và người được cụ Nhàn tặng cho 127,1 m²","Người quản lý di sản do các đồng thừa kế cử, có quyền chia di sản","Người làm chứng cho việc cụ Nhàn lập di chúc năm 2005 để lại đất cho ông Vinh"],"a":1,"e":"Anh Cường là con cả, người giám hộ (đại diện theo pháp luật) của ông Tâm, đồng thời là bên được tặng cho 127,1 m² năm 2007. Ông Tâm còn sống nên anh Cường không thừa kế thế vị; người quản lý di sản hiện là ông Vinh.","b":"Điều 53, Điều 136, Điều 652 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"TH","q":"Để chứng minh hiệu lực hợp đồng tặng cho năm 2007, anh Cường cần chuẩn bị tài liệu nào quan trọng nhất?","o":["Hồ sơ công chứng, chứng thực hợp đồng tặng cho năm 2007, có thông tin về người làm chứng","Giấy khai sinh của anh Cường để chứng minh quan hệ cháu nội với cụ Nhàn","Bảng kê chi phí anh Cường chăm sóc ông Tâm và cụ Nhàn từ năm 2007","Ảnh chụp ngôi nhà anh Cường đã xây trên đất và biên lai nộp thuế đất hằng năm"],"a":0,"e":"Ông Vinh tấn công hợp đồng về hình thức (người không biết chữ, không có người làm chứng). Tài liệu quyết định là hồ sơ lưu tại tổ chức hành nghề công chứng/cơ quan chứng thực thể hiện thủ tục đã thực hiện. Các tài liệu khác không chứng minh được hình thức hợp đồng.","b":"Điều 117, Điều 119 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Theo quy định tố tụng, ông Tâm (đã bị tuyên bố mất năng lực hành vi dân sự) thực hiện quyền khởi kiện như thế nào?","o":["Ông Tâm tự ký đơn khởi kiện, Tòa án sẽ xem xét năng lực của ông sau khi thụ lý","Ông Tâm không có quyền khởi kiện chia di sản vì đã bị tuyên bố mất năng lực hành vi","Thông qua người đại diện hợp pháp của ông Tâm","Do UBND xã nơi ông Tâm cư trú khởi kiện thay với tư cách cơ quan quản lý giám hộ"],"a":2,"e":"Điều 69 BLTTDS 2015: đương sự là người mất năng lực hành vi dân sự thì việc thực hiện quyền, nghĩa vụ tố tụng do người đại diện hợp pháp của họ thực hiện. Ông Tâm vẫn là người thừa kế, vẫn có quyền dân sự, chỉ không tự thực hiện được.","b":"Điều 69 BLTTDS 2015; Điều 136 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Vì sao anh Cường không nên (và không được) làm người đại diện cho ông Tâm nếu ông Vinh yêu cầu hủy hợp đồng tặng cho trong cùng vụ án?","o":["Vì anh Cường chưa đủ 30 tuổi nên không đủ điều kiện làm người đại diện trong tố tụng","Vì người giám hộ không bao giờ được tham gia tố tụng thay cho người được giám hộ","Vì anh Cường không có giấy ủy quyền có công chứng của ông Tâm","Vì quyền lợi của anh Cường (giữ 127,1 m²) đối lập với quyền lợi của ông Tâm trong vụ án"],"a":3,"e":"Điểm a khoản 1 Điều 87 BLTTDS 2015: người cũng là đương sự trong cùng vụ việc với người được đại diện mà quyền, lợi ích hợp pháp của họ đối lập với người được đại diện thì không được làm người đại diện. Người giám hộ là đại diện theo pháp luật nên không cần giấy ủy quyền; tuổi không phải điều kiện ở đây.","b":"Điểm a khoản 1 Điều 87 BLTTDS 2015","cid":"TH2.02"},{"id":"TH2.02.5","g":2,"lv":"VD","q":"Khi anh Cường không được làm người đại diện, quyền lợi của ông Tâm được bảo vệ bằng cách nào?","o":["Người giám hộ khác đủ điều kiện, hoặc Tòa án chỉ định người đại diện","Vụ án bị tạm đình chỉ cho đến khi ông Tâm khỏi bệnh và tự tham gia tố tụng","Ông Vinh, người đang quản lý di sản, đương nhiên đại diện cho ông Tâm trong vụ án","Ông Tâm mất quyền hưởng di sản vì không có người đại diện hợp lệ"],"a":0,"e":"Có thể thay đổi người giám hộ (Điều 60 BLDS 2015) để người con khác đủ điều kiện làm người giám hộ; nếu người đại diện theo pháp luật thuộc trường hợp khoản 1 Điều 87 thì Tòa án chỉ định người đại diện (Điều 88 BLTTDS 2015). Ông Vinh có lợi ích đối lập nên càng không thể đại diện; vụ án không bị đình chỉ vì lý do này.","b":"Điều 60 BLDS 2015; Điều 87, Điều 88 BLTTDS 2015","cid":"TH2.02"},{"id":"TH2.02.6","g":2,"lv":"VD","q":"Tháng 10/2026, thời hiệu yêu cầu chia di sản là quyền sử dụng đất của cụ Đức (chết năm 1998) và cụ Nhàn (chết năm 2007) còn hay hết?","o":["Đều đã hết, vì thời hiệu yêu cầu chia di sản là 10 năm kể từ thời điểm mở thừa kế","Đều còn; thời hiệu 30 năm đối với bất động sản, đến năm 2028 và năm 2037","Di sản của cụ Đức đã hết thời hiệu từ năm 2008, chỉ di sản của cụ Nhàn còn thời hiệu","Không áp dụng thời hiệu vì đất chưa được chia và vẫn do người thừa kế quản lý"],"a":1,"e":"Khoản 1 Điều 623 BLDS 2015: thời hiệu yêu cầu chia di sản là 30 năm đối với bất động sản, kể từ thời điểm mở thừa kế. 1998 + 30 = 2028; 2007 + 30 = 2037. Tháng 10/2026 cả hai đều còn, nhưng di sản của cụ Đức chỉ còn khoảng 2 năm.","b":"Khoản 1 Điều 623 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.7","g":2,"lv":"VD","q":"Phương án tố tụng hợp lý nhất cho anh Cường là gì?","o":["Anh Cường đứng đơn nhân danh ông Tâm, đồng thời tự bảo vệ hợp đồng tặng cho trong cùng tư cách","Chờ ông Vinh khởi kiện trước rồi mới tham gia để không phải tạm ứng án phí","Người đại diện khác khởi kiện cho ông Tâm; anh Cường tham gia với tư cách đương sự riêng","Khiếu nại đến UBND xã yêu cầu chia đất cho ông Tâm theo biên bản họp gia đình"],"a":2,"e":"Tách bạch hai lợi ích: người đại diện độc lập lo quyền thừa kế của ông Tâm; anh Cường tự bảo vệ hợp đồng tặng cho với tư cách đương sự riêng. Chờ ông Vinh khởi kiện có thể làm hết thời hiệu với di sản của cụ Đức (năm 2028); UBND xã chỉ hòa giải, không có thẩm quyền chia di sản.","b":"Điều 68, Điều 87, Điều 88 BLTTDS 2015","cid":"TH2.02"},{"id":"TH2.02.8","g":2,"lv":"VD","q":"Khi trả lời tư vấn, rủi ro nào cần nêu rõ cho anh Cường về hợp đồng tặng cho năm 2007?","o":["Hợp đồng đương nhiên vô hiệu vì cụ Nhàn đã 80 tuổi, không còn năng lực hành vi dân sự","Hợp đồng chỉ có hiệu lực nếu ông Vinh, người quản lý di sản, đồng ý bằng văn bản","Hợp đồng không thể bị xem xét lại vì anh Cường đã được cấp giấy chứng nhận","Nếu không có người làm chứng cho người không biết chữ, hợp đồng có thể vô hiệu"],"a":3,"e":"Tuổi cao không làm mất năng lực hành vi; việc tặng cho không cần ông Vinh đồng ý; giấy chứng nhận đã cấp vẫn có thể bị xem xét khi hợp đồng là căn cứ cấp giấy bị tranh chấp. Rủi ro thật sự nằm ở thủ tục chứng nhận cho người không đọc, không viết được, vốn bắt buộc có người làm chứng.","b":"Điều 117, Điều 119, Điều 122 BLDS 2015","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"TH","q":"Bà Hương tham gia giải quyết vụ việc bằng cách nào khi đang ở Hoa Kỳ?","o":["Bắt buộc phải về Việt Nam dự mọi phiên hòa giải và phiên tòa","Không được tham gia vì không còn quốc tịch Việt Nam, chỉ được nhận lại giá trị","Do Đại sứ quán Hoa Kỳ tại Hà Nội đại diện theo yêu cầu của bà","Qua người đại diện theo ủy quyền với văn bản ủy quyền hợp lệ"],"a":3,"e":"Đương sự có thể ủy quyền cho người khác tham gia tố tụng (Điều 85, 86 BLTTDS 2015; Điều 138 BLDS 2015). Văn bản ủy quyền lập ở nước ngoài phải được công chứng tại cơ quan đại diện Việt Nam hoặc hợp pháp hóa lãnh sự để sử dụng tại Việt Nam. Quốc tịch nước ngoài không làm mất quyền thừa kế.","b":"Điều 138 BLDS 2015; Điều 85, 86 BLTTDS 2015","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"TH","q":"Để chứng minh bà Hương đủ điều kiện nhận nhà ở bằng hiện vật, giấy tờ nào là then chốt?","o":["Giấy tờ chứng minh nguồn gốc Việt Nam và hộ chiếu có thị thực, dấu nhập cảnh hợp lệ","Hợp đồng lao động và giấy xác nhận thu nhập của bà tại Hoa Kỳ","Xác nhận của UBND phường về việc bà từng cư trú tại căn nhà trước năm 1990","Giấy chứng nhận kết hôn của bà được hợp pháp hóa lãnh sự"],"a":0,"e":"Điều 44 Luật Đất đai 2024 gắn quyền sở hữu nhà ở gắn liền với đất ở của người gốc Việt Nam định cư ở nước ngoài với điều kiện được phép nhập cảnh vào Việt Nam theo pháp luật nhà ở. Vì vậy cần chứng minh nguồn gốc Việt Nam và việc nhập cảnh hợp pháp; các giấy tờ khác không chứng minh điều kiện này.","b":"Điều 44 Luật Đất đai 2024; Điều 8 Luật Nhà ở 2023","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Hai cụ chết năm 2012, 2013 nhưng tranh chấp được giải quyết năm 2026. Theo Án lệ 68/2023/AL, Tòa án áp dụng pháp luật về đất đai, nhà ở nào để xác định quyền nhận hiện vật?","o":["Pháp luật về đất đai, nhà ở có hiệu lực tại thời điểm hai cụ chết (năm 2012, 2013)","Pháp luật đất đai, nhà ở hiện hành tại thời điểm giải quyết","Pháp luật về thừa kế của nơi bà Hương đang cư trú (Hoa Kỳ)","Pháp luật do các đương sự thỏa thuận lựa chọn tại phiên hòa giải"],"a":1,"e":"Án lệ 68/2023/AL: người để lại di sản chết trước khi Luật Đất đai 2013, Luật Nhà ở 2014 có hiệu lực nhưng tranh chấp giải quyết sau đó thì áp dụng các luật này (pháp luật hiện hành) để xác định quyền nhận di sản bằng hiện vật. Nay là Luật Đất đai 2024, Luật Nhà ở 2023. Thời điểm mở thừa kế vẫn dùng để xác định người thừa kế, di sản.","b":"Án lệ 68/2023/AL","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Vấn đề pháp lý mấu chốt quyết định yêu cầu của bà Hương là gì?","o":["Bà Hương có được sở hữu nhà ở tại Việt Nam để nhận hiện vật không","Bà Hương có phải đóng thuế thu nhập tại Hoa Kỳ đối với phần di sản nhận ở Việt Nam không","Anh Dũng có phải là người thừa kế hàng thứ nhất vì đã chăm sóc hai cụ nhiều năm không","Hai cụ có để lại di chúc miệng cho anh Dũng trước khi chết hay không"],"a":0,"e":"Anh Dũng phản đối việc bà Hương nhận hiện vật với lý do bà là người nước ngoài. Vì vậy điều quyết định là năng lực chủ thể của bà Hương đối với nhà ở, đất ở theo Điều 44 Luật Đất đai 2024 và Luật Nhà ở 2023. Anh Dũng là cháu, rõ ràng không thuộc hàng thứ nhất; thuế ở nước ngoài và di chúc miệng không liên quan.","b":"Điều 44 Luật Đất đai 2024; Án lệ 68/2023/AL","cid":"TH2.03"},{"id":"TH2.03.5","g":2,"lv":"VD","q":"Anh Dũng đề nghị nhận hiện vật phần của bà Hương và thanh toán giá trị cho bà. Luật sư của bà Hương nên phản bác thế nào?","o":["Anh Dũng không có bất kỳ quyền gì đối với nhà đất vì không phải người thừa kế","Bà Hương được nhận cả phần công sức của anh Dũng vì anh ở nhờ nhà đất của hai cụ","Bà Hương được nhận hiện vật; công sức của anh Dũng thanh toán bằng tiền","Phần của bà Hương phải sung công quỹ nhà nước vì bà là người nước ngoài"],"a":2,"e":"Theo Án lệ 68/2023/AL, giao toàn bộ hiện vật phần thừa kế của người Việt Nam định cư ở nước ngoài đủ điều kiện sở hữu nhà ở cho người khác là không đúng. Anh Dũng có công trông nom, bảo quản nên được xem xét công sức, nhưng điều đó không biến anh thành người được nhận hiện vật phần của bà Hương. Không có căn cứ sung công.","b":"Án lệ 68/2023/AL; Điều 44 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.6","g":2,"lv":"VD","q":"Giả sử nhà đất được định giá 30 tỷ đồng, Tòa án trích 1,2 tỷ đồng trả công sức cho anh Dũng; phần còn lại chia đều cho hai người thừa kế. Phần của bà Hương là bao nhiêu?","o":["15 tỷ đồng","13,8 tỷ đồng","14,4 tỷ đồng","28,8 tỷ đồng"],"a":2,"e":"Di sản còn lại sau khi trích công sức: 30 − 1,2 = 28,8 tỷ đồng. Hai người con là hàng thừa kế thứ nhất, hưởng phần bằng nhau (khoản 2 Điều 651 BLDS 2015): 28,8 : 2 = 14,4 tỷ đồng. 15 tỷ là chưa trừ công sức; 13,8 tỷ là trừ cả 1,2 tỷ vào một người.","b":"Điều 651 BLDS 2015; Án lệ 68/2023/AL","cid":"TH2.03"},{"id":"TH2.03.7","g":2,"lv":"VD","q":"Nếu bà Hương không được phép nhập cảnh vào Việt Nam (không thuộc đối tượng được sở hữu nhà ở), quyền của bà đối với di sản là gì?","o":["Bà mất quyền thừa kế vì không thuộc đối tượng được sở hữu nhà ở","Bà vẫn được nhận hiện vật là nhà ở nhưng không được cấp giấy chứng nhận","Phần của bà chuyển cho bà Hằng mà bà Hằng không phải thanh toán","Bà được hưởng giá trị của nhà ở gắn liền với đất ở tương ứng phần thừa kế"],"a":3,"e":"Theo Điều 44 Luật Đất đai 2024, người gốc Việt Nam định cư ở nước ngoài không thuộc đối tượng được sở hữu nhà ở gắn liền với quyền sử dụng đất ở thì chỉ được hưởng giá trị, không được cấp giấy chứng nhận. Quyền thừa kế không mất; người khác nhận hiện vật phải thanh toán giá trị cho bà.","b":"Điều 44 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.8","g":2,"lv":"VD","q":"Hình thức tư vấn nào phù hợp nhất với bà Hương? Vì sao?","o":["Bằng văn bản qua người đại diện, thư điện tử, vì khách hàng ở nước ngoài","Tư vấn trực tiếp tại văn phòng, vì bà Hương bắt buộc phải về Việt Nam ngay để làm thủ tục","Chỉ tư vấn qua điện thoại cho nhanh và tiết kiệm chi phí, không cần lưu lại tài liệu","Không cần tư vấn, vì Tòa án sẽ tự áp dụng án lệ mà không cần đương sự đề nghị"],"a":0,"e":"Khách hàng ở nước ngoài, vụ việc có giá trị lớn và cần hồ sơ ủy quyền, chứng minh nguồn gốc nên văn bản là phù hợp, có thể kết hợp gọi video. Bắt khách hàng về nước là không cần thiết; tư vấn miệng không lưu được căn cứ; Tòa án áp dụng án lệ nhưng đương sự vẫn cần chủ động đề nghị và chứng minh.","b":"Án lệ 68/2023/AL; Điều 44 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.04.1","g":2,"lv":"TH","q":"Khách hàng trong vụ việc là ai và có tư cách gì đối với Công ty TNHH S?","o":["Ông Đông — giám đốc, người đại diện theo pháp luật hiện tại của công ty","Ngân hàng — bên dự kiến cho công ty vay vốn khi ông Đông đứng tên","Ông Hùng — người thực góp vốn, chưa có tên trong đăng ký doanh nghiệp","Công ty TNHH S — pháp nhân có tranh chấp nội bộ giữa các thành viên"],"a":2,"e":"Người đến tư vấn là ông Hùng. Ông thực góp vốn, được bản án năm 2021 công nhận phần vốn góp 55,7313%, nhưng đăng ký doanh nghiệp lần 7 không ghi tên ông. Xác định đúng tư cách này giúp chọn yêu cầu khởi kiện và thủ tục cập nhật.","b":"Điều 46, Điều 48 Luật Doanh nghiệp 2020","cid":"TH2.04"},{"id":"TH2.04.2","g":2,"lv":"TH","q":"Tài liệu nào luật sư cần yêu cầu bổ sung để xác định cơ cấu vốn góp hiện nay?","o":["Sổ đăng ký thành viên, điều lệ, đăng ký doanh nghiệp và chứng từ góp vốn","Giấy khai sinh của ông Hùng và ông Đông để chứng minh quan hệ anh em ruột","Hợp đồng lao động của nhân viên công ty và bảng lương các năm 2015–2019","Hóa đơn bán mủ cao su và báo cáo doanh thu của công ty năm gần nhất"],"a":0,"e":"Cơ cấu vốn góp, tư cách thành viên thể hiện qua sổ đăng ký thành viên (Điều 48 Luật Doanh nghiệp 2020), điều lệ, đăng ký doanh nghiệp và chứng từ góp vốn. Giấy khai sinh chỉ chứng minh quan hệ anh em; hợp đồng lao động, hóa đơn bán hàng không liên quan đến phần vốn góp.","b":"Điều 47, Điều 48 Luật Doanh nghiệp 2020","cid":"TH2.04"},{"id":"TH2.04.3","g":2,"lv":"VD","q":"Tranh chấp giữa ông Hùng với các thành viên khác về phần vốn góp, tư cách thành viên thuộc loại tranh chấp nào?","o":["Tranh chấp hành chính về quyết định đăng ký doanh nghiệp thay đổi lần thứ 7","Tranh chấp về hợp đồng vay tài sản giữa ông Hùng và ông Đông","Tranh chấp lao động về chức danh giám đốc giữa người lao động và công ty","Tranh chấp kinh doanh, thương mại giữa các thành viên công ty"],"a":3,"e":"Khoản 4 Điều 30 BLTTDS 2015: tranh chấp giữa công ty với các thành viên của công ty; giữa các thành viên của công ty với nhau liên quan đến việc thành lập, hoạt động, chuyển nhượng phần vốn góp… là tranh chấp kinh doanh, thương mại thuộc thẩm quyền Tòa án. Việc đăng ký doanh nghiệp là thủ tục hành chính thực hiện sau khi xác định quyền.","b":"Khoản 4 Điều 30 BLTTDS 2015","cid":"TH2.04"},{"id":"TH2.04.4","g":2,"lv":"VD","q":"Thỏa thuận để ông Đông đứng tên thay vốn góp, chức danh giám đốc nhằm vay vốn ngân hàng (vì ông Hùng có nợ xấu) cần được đánh giá thế nào?","o":["Hoàn toàn hợp pháp vì đã được Hội đồng thành viên biểu quyết thông qua","Có dấu hiệu giả tạo, có thể vô hiệu; quyền xác định theo vốn thực góp","Làm ông Hùng mất toàn bộ quyền đối với phần vốn đã góp vì tự nguyện cho người khác đứng tên","Chỉ là thỏa thuận miệng giữa hai anh em nên Tòa án không cần xem xét"],"a":1,"e":"Thỏa thuận nhằm che giấu người góp vốn thật để được vay vốn là dấu hiệu giả tạo (Điều 124 BLDS 2015); giao dịch bị che giấu được xem xét theo bản chất. Việc Hội đồng thành viên thông qua không làm thỏa thuận hợp pháp. Trên thực tế, bản án đã công nhận phần vốn ông Hùng thực góp nên ông không mất quyền.","b":"Điều 124 BLDS 2015","cid":"TH2.04"},{"id":"TH2.04.5","g":2,"lv":"VD","q":"Ông Hùng đã góp 11.293.869.000 đồng nhưng đã chuyển nhượng 2.934.172.000 đồng. Phần vốn góp còn lại của ông chiếm tỷ lệ bao nhiêu trên vốn điều lệ 15 tỷ đồng?","o":["8.359.697.000 đồng, khoảng 55,73%","11.293.869.000 đồng, khoảng 75,29%","5.000.000.000 đồng, 33,33%","2.934.172.000 đồng, khoảng 19,56%"],"a":0,"e":"11.293.869.000 − 2.934.172.000 = 8.359.697.000 đồng; 8.359.697.000 : 15.000.000.000 = 55,7313%. Đây đúng là con số bản án đã công nhận. 33,33% chỉ là tỷ lệ trên giấy đăng ký, không phản ánh vốn thực góp.","b":"Điều 47 Luật Doanh nghiệp 2020","cid":"TH2.04"},{"id":"TH2.04.6","g":2,"lv":"VD","q":"Bản án năm 2021 không xác định phần vốn còn lại (44,2687%) của ai nên không thi hành được. Hướng xử lý đúng về tố tụng là gì?","o":["Khởi kiện lại đúng yêu cầu \"xác định phần vốn góp của ông Hùng là 8.359.697.000 đồng\"","Đề nghị cơ quan đăng ký kinh doanh tự chia phần vốn còn lại cho các thành viên hiện hữu","Đề nghị Tòa án giải thích bản án, hoặc khởi kiện yêu cầu mới về phần vốn còn lại","Không làm gì được nữa vì bản án đã có hiệu lực pháp luật và không thể thay đổi"],"a":2,"e":"Yêu cầu đã được bản án có hiệu lực giải quyết không được khởi kiện lại (điểm c khoản 1 Điều 192 BLTTDS 2015). Nội dung chưa rõ thì đề nghị Tòa án đã ra bản án giải thích (Điều 486); phần chưa được giải quyết (phần vốn còn lại của ai) là yêu cầu mới, có thể khởi kiện. Cơ quan đăng ký kinh doanh không có thẩm quyền xác định phần vốn góp có tranh chấp.","b":"Điểm c khoản 1 Điều 192, Điều 486 BLTTDS 2015","cid":"TH2.04"},{"id":"TH2.04.7","g":2,"lv":"VD","q":"Trong thời gian giải quyết, ông Đông vẫn là người đại diện theo pháp luật. Biện pháp nào giúp hạn chế rủi ro cho ông Hùng?","o":["Tự thu giữ con dấu, sổ sách, tài liệu của công ty để ông Đông không giao dịch được","Yêu cầu Tòa án áp dụng biện pháp khẩn cấp tạm thời cấm chuyển dịch phần vốn góp, tài sản","Thông báo trên mạng xã hội rằng ông Đông không còn là giám đốc của công ty","Đề nghị ngân hàng cho ông Hùng vay vốn thay ông Đông để giải quyết khó khăn"],"a":1,"e":"Biện pháp khẩn cấp tạm thời (Điều 111, 114 BLTTDS 2015) là cách hợp pháp để giữ nguyên hiện trạng trong khi chờ giải quyết. Tự thu giữ con dấu, tài liệu có thể vi phạm pháp luật; thông báo trên mạng không có giá trị pháp lý và có thể xâm phạm uy tín người khác; vay vốn không giải quyết tranh chấp.","b":"Điều 111, Điều 114 BLTTDS 2015","cid":"TH2.04"},{"id":"TH2.04.8","g":2,"lv":"VD","q":"Sau khi có bản án xác định đầy đủ cơ cấu vốn góp, việc ông Hùng trở lại làm người đại diện theo pháp luật được thực hiện thế nào?","o":["Tự động có hiệu lực khi bản án có hiệu lực, công ty không cần làm thủ tục gì","Tòa án ra quyết định bổ nhiệm ông Hùng làm giám đốc trong bản án","Ông Đông ký giấy ủy quyền lại chức danh giám đốc cho ông Hùng","Hội đồng thành viên quyết định theo điều lệ, sau đó công ty đăng ký thay đổi người đại diện"],"a":3,"e":"Người đại diện theo pháp luật do điều lệ, Hội đồng thành viên xác định (Điều 12 Luật Doanh nghiệp 2020; Điều 137 BLDS 2015) và phải đăng ký thay đổi. Tòa án xác định quyền, không bổ nhiệm giám đốc; ủy quyền của ông Đông chỉ tạo đại diện theo ủy quyền, không thay đổi người đại diện theo pháp luật.","b":"Điều 12 Luật Doanh nghiệp 2020; Điều 137 BLDS 2015","cid":"TH2.04"},{"id":"TH3.01.1","g":3,"lv":"TH","q":"Ông Hiệp muốn khởi kiện nhân danh tất cả các đồng thừa kế. Ông cần giấy tờ gì để có tư cách đó?","o":["Giấy chứng nhận quyền sử dụng đất năm 2001 đứng tên hai cụ là đủ để đứng đơn cho tất cả","Văn bản ủy quyền của các đồng thừa kế cho ông Hiệp tham gia tố tụng","Xác nhận của UBND phường về việc ông Hiệp là người đang trực tiếp quản lý nhà","Biên bản hòa giải không thành tại UBND phường có chữ ký của ông Hiệp"],"a":1,"e":"Nhà đất là di sản chưa chia, thuộc các đồng thừa kế. Muốn đứng đơn nhân danh họ, ông Hiệp phải được ủy quyền (Điều 138 BLDS 2015; Điều 85, 86 BLTTDS 2015). Giấy chứng nhận chứng minh tài sản, biên bản hòa giải chứng minh đã hòa giải, nhưng không chứng minh quyền đại diện.","b":"Điều 138 BLDS 2015; Điều 85, 86 BLTTDS 2015","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"TH","q":"Tài liệu nào có giá trị chứng minh mạnh nhất về ranh giới phía Tây giữa hai thửa đất?","o":["Lời khai của hàng xóm lâu năm về việc hai nhà cùng dùng chung bức tường","Ảnh chụp mái tôn, máng xối và đòn tay của nhà ông Nam gác lên tường","Hồ sơ cấp giấy chứng nhận năm 2001, có biên bản ranh giới, mốc giới","Giấy mua nhà năm 1970 của mẹ ông Nam có xác nhận của chính quyền cũ"],"a":2,"e":"Ranh giới xác định theo thỏa thuận, quyết định của cơ quan có thẩm quyền hoặc tập quán, ranh giới đã tồn tại liên tục (Điều 175 BLDS 2015). Hồ sơ cấp giấy có biên bản ranh giới, mốc giới và bản vẽ thửa đất là chứng cứ trực tiếp. Lời khai, ảnh chụp chỉ hỗ trợ; giấy mua nhà năm 1970 của ông Nam không thể hiện ranh giới cụ thể.","b":"Điều 175 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Hành vi để nước mưa từ mái nhà ông Nam đổ xuống sân nhà hai cụ vi phạm quy định nào?","o":["Điều 250 BLDS 2015 về trách nhiệm dẫn nước mưa từ mái nhà","Điều 254 BLDS 2015 về quyền lối đi qua bất động sản liền kề","Điều 236 BLDS 2015 về xác lập quyền sở hữu theo thời hiệu do chiếm hữu","Điều 255 BLDS 2015 về quyền mắc đường dây tải điện, thông tin liên lạc"],"a":0,"e":"Điều 250 BLDS 2015 quy định trách nhiệm lắp đặt đường dẫn nước mưa của chủ sở hữu nhà, công trình. Lối đi qua (Điều 254), mắc đường dây (Điều 255) và xác lập quyền sở hữu theo thời hiệu (Điều 236) không điều chỉnh việc thoát nước mưa.","b":"Điều 250 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Ông Nam lập luận đã sử dụng bức tường hơn 50 năm nên tường là của ông. Nhận định nào đúng?","o":["Đúng, vì chiếm hữu bất động sản đủ 30 năm thì đương nhiên trở thành chủ sở hữu","Đúng, vì yêu cầu của gia đình ông Hiệp đã hết thời hiệu khởi kiện từ lâu","Tòa án không xem xét lập luận này vì ông Nam chưa có giấy tờ về nhà đất","Chưa đủ, vì chiếm hữu tài sản đã đăng ký cho người khác khó coi là ngay tình"],"a":3,"e":"Điều 236 BLDS 2015 chỉ cho phép xác lập quyền sở hữu theo thời hiệu khi chiếm hữu không có căn cứ pháp luật nhưng ngay tình, liên tục, công khai 30 năm với bất động sản. Yêu cầu bảo vệ quyền sở hữu không bị áp dụng thời hiệu khởi kiện (khoản 2 Điều 155). Việc chưa có giấy tờ không làm Tòa án từ chối xem xét lập luận, nhưng ông Nam phải chứng minh.","b":"Khoản 2 Điều 155, Điều 236 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.5","g":3,"lv":"VD","q":"Việc ông Nam gác đòn tay, xà ngang vào đoạn tường 8,63 m của nhà hai cụ có hợp pháp không?","o":["Hợp pháp, vì tường giáp ranh giữa hai nhà luôn là tài sản chung của hai chủ","Không hợp pháp; không được đặt kết cấu vào tường của người khác khi chưa được đồng ý","Hợp pháp, nếu ông Nam trả tiền thuê tường hằng năm cho các đồng thừa kế","Chỉ là vi phạm hành chính về trật tự xây dựng, không phải vấn đề dân sự"],"a":1,"e":"Theo Điều 176 BLDS 2015, mốc giới, tường ngăn được xây trên phần đất của mình; ngay cả với tường nhà chung, chủ sở hữu liền kề cũng không được đục tường để đặt kết cấu xây dựng khi chưa được đồng ý. Tường không đương nhiên là tài sản chung; việc trả tiền chỉ hợp pháp khi có thỏa thuận. Đây là xâm phạm quyền sở hữu, có thể yêu cầu chấm dứt (Điều 169).","b":"Điều 169, Điều 176 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.6","g":3,"lv":"VD","q":"Ông Nam yêu cầu hủy giấy chứng nhận đã cấp cho hai cụ. Về tố tụng, điều gì sẽ xảy ra?","o":["Tòa án dân sự không có quyền xem xét, ông Nam phải khởi kiện vụ án hành chính riêng trước","Yêu cầu bị bác ngay mà không cần xem xét vì ông Nam không có giấy tờ đất","Tòa án xem xét hủy quyết định cá biệt trong cùng vụ án, đưa UBND tỉnh vào tham gia tố tụng","Vụ án bị tạm đình chỉ vô thời hạn cho đến khi UBND tỉnh tự kiểm tra lại giấy"],"a":2,"e":"Điều 34 BLTTDS 2015: khi giải quyết vụ việc dân sự, Tòa án có quyền hủy quyết định cá biệt trái pháp luật xâm phạm quyền, lợi ích của đương sự; cơ quan ban hành phải được đưa vào tham gia tố tụng. Hồ sơ cho thấy giấy chứng nhận cấp đúng trình tự nên yêu cầu khó được chấp nhận, nhưng vẫn được xem xét.","b":"Điều 34 BLTTDS 2015","cid":"TH3.01"},{"id":"TH3.01.7","g":3,"lv":"VD","q":"Phương án nào vừa bảo vệ quyền lợi khách hàng vừa có tính khả thi cao?","o":["Tự tháo dỡ mái tôn, máng xối của ông Nam vào ban đêm rồi thông báo cho chính quyền","Khởi kiện, đề nghị thẩm định tại chỗ, kết hợp giải pháp kỹ thuật an toàn","Khiếu nại đến UBND tỉnh yêu cầu xử phạt ông Nam và buộc tháo dỡ ngay trong 7 ngày","Bỏ qua vì bức tường đã tồn tại hơn 50 năm, không còn quyền yêu cầu"],"a":1,"e":"Tự tháo dỡ là tự xử lý tài sản người khác, có thể phát sinh trách nhiệm. Khiếu nại không giải quyết tranh chấp quyền sở hữu. Khởi kiện kèm thẩm định tại chỗ cho chứng cứ khách quan; giải pháp kỹ thuật, thỏa thuận tránh nguy cơ sập nhà trong phố cổ, tăng khả năng thi hành.","b":"Điều 169, Điều 175, Điều 250 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.8","g":3,"lv":"VD","q":"Khi trả lời tư vấn, rủi ro nào cần cảnh báo cho ông Hiệp?","o":["Gia đình ông Hiệp có thể mất quyền sử dụng toàn bộ 172 m² đất nếu thua kiện","Ông Hiệp phải bồi thường cho ông Nam vì đã xây cao tường làm vướng mái nhà","Vụ án sẽ hết thời hiệu nếu không khởi kiện trong 3 năm kể từ ngày hòa giải","Thiếu ủy quyền sẽ kéo dài vụ án; Tòa án có thể chọn giải pháp kỹ thuật thay vì tháo hết"],"a":3,"e":"Yêu cầu bảo vệ quyền sở hữu không áp dụng thời hiệu (khoản 2 Điều 155); không có căn cứ để mất 172 m² hay phải bồi thường cho ông Nam. Rủi ro thực tế nằm ở tư cách đại diện và cách Tòa án xử lý kết cấu nhà để bảo đảm an toàn.","b":"Khoản 2 Điều 155 BLDS 2015; Điều 85 BLTTDS 2015","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"TH","q":"Chứng cứ quan trọng nhất chứng minh chị Thanh là người bỏ tiền nhận chuyển nhượng là gì?","o":["Giấy chứng nhận quyền sử dụng đất đứng tên anh Tiến cấp năm 2010","Lời khai của hàng xóm về việc anh Tiến trồng cây ăn quả trên đất từ năm 2010","Chứng từ chuyển tiền năm 2010, tin nhắn và thư điện tử giữa hai chị em","Hợp đồng chuyển nhượng năm 2026 giữa anh Tiến và Công ty Minh Châu đã công chứng"],"a":2,"e":"Không có văn bản nhờ đứng tên, nên chứng từ chuyển tiền cùng trao đổi bằng tin nhắn, thư điện tử là chứng cứ trực tiếp về nguồn tiền và ý chí nhờ đứng tên. Giấy chứng nhận đứng tên anh Tiến lại bất lợi cho chị Thanh; các tài liệu còn lại không chứng minh nguồn tiền.","b":"Án lệ 02/2016/AL; Điều 93, 94 BLTTDS 2015","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"TH","q":"Vì sao chị Thanh phải nhờ em trai đứng tên khi nhận chuyển nhượng đất trồng cây lâu năm?","o":["Vì chị không thuộc đối tượng được nhận chuyển nhượng loại đất này","Vì năm 2010 chị Thanh chưa đủ 18 tuổi nên không tự giao kết hợp đồng được","Vì đất trồng cây lâu năm không được phép chuyển nhượng cho bất kỳ cá nhân nào","Vì hai chị em muốn tránh nộp thuế thu nhập cá nhân khi chuyển nhượng đất"],"a":0,"e":"Người gốc Việt Nam định cư ở nước ngoài (không còn quốc tịch Việt Nam) chỉ có các quyền theo Điều 44 Luật Đất đai 2024 (chủ yếu về nhà ở gắn liền với đất ở, đất trong dự án), không được nhận chuyển nhượng đất trồng cây lâu năm như cá nhân trong nước. Đây là lý do của việc nhờ đứng tên, cũng là lý do chị không đòi lại được đất.","b":"Điều 44 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Theo Án lệ 02/2016/AL, đối tượng tranh chấp thực chất giữa chị Thanh và anh Tiến là gì?","o":["Quyền sử dụng 5.000 m² đất trồng cây lâu năm tại huyện C","Số tiền thu được từ việc chuyển nhượng đất, gồm tiền gốc và khoản chênh lệch","Quyền sở hữu số cây ăn quả anh Tiến đã trồng trên đất từ năm 2010","Hiệu lực hợp đồng chuyển nhượng giữa anh Tiến và Công ty Minh Châu"],"a":1,"e":"Đất đã được chuyển nhượng hợp pháp cho người thứ ba, chị Thanh không thuộc đối tượng được nhận loại đất này. Án lệ 02/2016/AL xác định tranh chấp là về số tiền, gồm tiền gốc người nhờ đứng tên bỏ ra và khoản chênh lệch giá chia theo công sức.","b":"Án lệ 02/2016/AL","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Chị Thanh có yêu cầu hủy hợp đồng chuyển nhượng giữa anh Tiến và Công ty Minh Châu để lấy lại đất được không?","o":["Được, vì anh Tiến bán đất không có sự đồng ý của chị Thanh là người bỏ tiền","Được, nếu chị Thanh trả lại cho Công ty Minh Châu đủ 3,0 tỷ đồng","Chỉ được nếu Công ty Minh Châu đồng ý hủy hợp đồng và nhận lại tiền","Khó được chấp nhận vì Công ty Minh Châu là người thứ ba ngay tình"],"a":3,"e":"Khoản 2 Điều 133 BLDS 2015: tài sản phải đăng ký đã được đăng ký mà sau đó được chuyển giao cho người thứ ba ngay tình thì giao dịch với người thứ ba không bị vô hiệu. Hơn nữa chị Thanh cũng không được nhận loại đất này. Yêu cầu hủy hợp đồng vừa khó vừa không mang lại lợi ích.","b":"Khoản 2 Điều 133 BLDS 2015","cid":"TH3.02"},{"id":"TH3.02.5","g":3,"lv":"VD","q":"Áp dụng Án lệ 02/2016/AL, nếu không xác định được chính xác công sức của anh Tiến, chị Thanh được nhận bao nhiêu?","o":["0,6 tỷ đồng","3,0 tỷ đồng","1,8 tỷ đồng","1,2 tỷ đồng"],"a":2,"e":"Tiền gốc trả lại cho chị Thanh: 0,6 tỷ. Khoản chênh lệch: 3,0 − 0,6 = 2,4 tỷ đồng là lợi nhuận chung; không xác định được công sức thì coi như mỗi bên một nửa: 1,2 tỷ. Chị Thanh nhận 0,6 + 1,2 = 1,8 tỷ đồng; anh Tiến được 1,2 tỷ đồng công sức.","b":"Án lệ 02/2016/AL","cid":"TH3.02"},{"id":"TH3.02.6","g":3,"lv":"VD","q":"Anh Tiến chỉ đồng ý trả 600 triệu đồng. Lập luận nào giúp luật sư bác bỏ đề xuất này?","o":["Phần tăng thêm là lợi nhuận chung từ tiền của chị Thanh và công sức của anh Tiến, phải chia cho cả hai","Anh Tiến phải trả toàn bộ 3,0 tỷ đồng vì không có công sức gì đối với thửa đất","Anh Tiến phải bồi thường thêm vì vi phạm hợp đồng ủy quyền có công chứng với chị Thanh","Khoản chênh lệch 2,4 tỷ đồng phải nộp vào ngân sách nhà nước vì giao dịch vô hiệu"],"a":0,"e":"Án lệ 02/2016/AL nhận định khoản chênh lệch là lợi nhuận chung, chia theo công sức; việc sung công khoản chênh lệch không có căn cứ. Anh Tiến có công quản lý, tôn tạo nên không mất trắng; hai chị em không có hợp đồng ủy quyền công chứng.","b":"Án lệ 02/2016/AL","cid":"TH3.02"},{"id":"TH3.02.7","g":3,"lv":"VD","q":"Phương án nào phù hợp nhất với chị Thanh?","o":["Khởi kiện đòi lại 5.000 m² đất và yêu cầu hủy giấy chứng nhận của Công ty Minh Châu","Khiếu nại đến UBND huyện yêu cầu hủy giấy chứng nhận đã cấp cho Công ty Minh Châu","Tố cáo anh Tiến tội lừa đảo chiếm đoạt tài sản để buộc trả toàn bộ 3,0 tỷ đồng","Thương lượng ở mức 1,8 tỷ đồng; không đạt thì khởi kiện đòi tiền"],"a":3,"e":"Đòi đất, hủy giấy chứng nhận của người thứ ba ngay tình không khả thi. Tố cáo hình sự thiếu căn cứ khi anh Tiến không có thủ đoạn gian dối chiếm đoạt ngay từ đầu và đã thừa nhận nguồn tiền. Thương lượng dựa trên mức án lệ cho kết quả dự đoán được; khởi kiện là phương án dự phòng.","b":"Án lệ 02/2016/AL; Điều 111, 114 BLTTDS 2015","cid":"TH3.02"},{"id":"TH3.02.8","g":3,"lv":"VD","q":"Rủi ro nào làm giảm số tiền chị Thanh được nhận?","o":["Chị Thanh không về Việt Nam dự phiên tòa nên Tòa án đình chỉ giải quyết","Anh Tiến chứng minh được chi phí cải tạo, trồng cây và công sức lớn hơn","Công ty Minh Châu bán lại đất cho người khác với giá cao hơn 3,0 tỷ đồng","Chị Thanh không có quốc tịch Việt Nam nên mất quyền khởi kiện tại Tòa án Việt Nam"],"a":1,"e":"Khoản chênh lệch chia theo công sức; nếu anh Tiến chứng minh được công sức, chi phí lớn thì tỷ lệ chia nghiêng về anh. Chị Thanh có thể ủy quyền, không bắt buộc dự phiên tòa; quốc tịch nước ngoài không làm mất quyền khởi kiện; giao dịch tiếp theo của Công ty Minh Châu không liên quan.","b":"Án lệ 02/2016/AL","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"TH","q":"Trong vụ việc, khách hàng là ai và yêu cầu chính là gì?","o":["Bà Na; yêu cầu hủy hợp đồng chuyển nhượng năm 2019 vì bán nhầm cho người nước ngoài","Ông Park; yêu cầu xác định thửa đất là tài sản chung để chia","Chị Ngọc; yêu cầu công nhận thửa đất là tài sản riêng có trước hôn nhân","Ông Park; yêu cầu được cấp giấy chứng nhận quyền sử dụng đất đứng tên mình"],"a":1,"e":"Ông Park là người đến tư vấn, đang yêu cầu ly hôn và chia tài sản. Ông không thể yêu cầu cấp giấy chứng nhận đứng tên mình vì là người nước ngoài; chị Ngọc là phía đối lập; bà Na chỉ là người làm chứng quan trọng.","b":"Điều 59 Luật HNGĐ 2014","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"TH","q":"Tài liệu nào luật sư cần thu thập để áp dụng đúng Án lệ 82/2025/AL?","o":["Tờ khai đăng ký kết hôn, chứng cứ lễ cưới, lời xác nhận của bà Na","Bằng lái xe quốc tế và giấy phép lao động của ông Park tại Việt Nam","Hợp đồng lao động và bảng lương của chị Ngọc các năm 2018–2019","Giấy khai sinh và giấy tờ nhân thân của bà Na, người bán đất"],"a":0,"e":"Tình huống án lệ có ba dấu hiệu: đã nộp tờ khai đăng ký kết hôn, đã tổ chức lễ cưới, bên chuyển nhượng xác nhận chuyển nhượng cho cả vợ chồng. Vì vậy phải có tài liệu chứng minh từng dấu hiệu; các giấy tờ còn lại không liên quan.","b":"Án lệ 82/2025/AL","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Vấn đề pháp lý mấu chốt của vụ việc là gì?","o":["Ông Park là người nước ngoài có được kết hôn với công dân Việt Nam hay không","Bà Na có quyền chuyển nhượng thửa đất 291 m² vào thời điểm năm 2019 hay không","Quyền sử dụng đất chị Ngọc nhận chuyển nhượng trước ngày đăng ký kết hôn là tài sản chung hay riêng","Chị Ngọc có phải nộp thuế thu nhập cá nhân khi nhận chuyển nhượng thửa đất không"],"a":2,"e":"Tranh chấp xoay quanh việc thửa đất là tài sản chung hay riêng (Điều 33, 43 Luật HNGĐ 2014) khi giao dịch xảy ra trước ngày được cấp Giấy chứng nhận kết hôn. Việc kết hôn đã được đăng ký hợp lệ; quyền của bà Na và nghĩa vụ thuế không bị tranh chấp.","b":"Điều 33, Điều 43 Luật HNGĐ 2014; Án lệ 82/2025/AL","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Áp dụng Án lệ 82/2025/AL, thửa đất được xác định là gì?","o":["Tài sản riêng của chị Ngọc vì hợp đồng ký trước ngày cấp Giấy chứng nhận kết hôn","Tài sản riêng của ông Park vì ông là người chuyển tiền mua đất","Tài sản của bà Na vì giao dịch vô hiệu do che giấu người mua là người nước ngoài","Tài sản chung của vợ chồng theo Án lệ 82/2025/AL"],"a":3,"e":"Án lệ 82/2025/AL: một bên là người nước ngoài, hai bên đã nộp tờ khai đăng ký kết hôn và tổ chức lễ cưới, bên Việt Nam đứng tên nhận chuyển nhượng và được cấp giấy chứng nhận trước khi đăng ký kết hôn, bên chuyển nhượng xác nhận chuyển nhượng cho cả vợ chồng → Tòa án phải xác định là tài sản chung.","b":"Án lệ 82/2025/AL","cid":"TH3.03"},{"id":"TH3.03.5","g":3,"lv":"VD","q":"Ông Park là người nước ngoài. Khi chia tài sản chung là quyền sử dụng đất, phần của ông được giải quyết thế nào?","o":["Ông Park được nhận một nửa thửa đất và được cấp giấy chứng nhận đứng tên mình","Ông Park mất phần tài sản vì người nước ngoài không được sử dụng đất tại Việt Nam","Giao đất cho chị Ngọc, chị Ngọc thanh toán cho ông Park giá trị phần ông được hưởng","Thửa đất bị Nhà nước thu hồi vì đã có người nước ngoài góp tiền mua"],"a":2,"e":"Người nước ngoài không phải là người sử dụng đất nhận chuyển nhượng theo Luật Đất đai 2024, nên không được nhận hiện vật là quyền sử dụng đất. Quyền tài sản của ông Park vẫn được bảo đảm bằng việc nhận giá trị (Điều 59 Luật HNGĐ 2014). Không có căn cứ thu hồi đất hay tước phần tài sản của ông.","b":"Điều 59 Luật HNGĐ 2014; Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.6","g":3,"lv":"VD","q":"Thửa đất được định giá 4,0 tỷ đồng, Tòa án chia đôi. Ông Park được nhận bao nhiêu và theo hình thức nào?","o":["2,0 tỷ đồng, bằng tiền do chị Ngọc thanh toán","2,1 tỷ đồng (giá mua năm 2019), bằng tiền","4,0 tỷ đồng vì ông là người trả tiền","145,5 m² đất"],"a":0,"e":"Tài sản chung chia theo giá trị tại thời điểm giải quyết: 4,0 : 2 = 2,0 tỷ đồng. Giá mua năm 2019 không phải giá trị tại thời điểm chia; ông không được nhận đất; tài sản chung nên không thuộc trọn về người trả tiền.","b":"Điều 59 Luật HNGĐ 2014","cid":"TH3.03"},{"id":"TH3.03.7","g":3,"lv":"VD","q":"Biện pháp nào nên đề nghị ngay khi khởi kiện để bảo vệ quyền lợi của ông Park?","o":["Tự giữ bản chính giấy chứng nhận quyền sử dụng đất đứng tên chị Ngọc","Yêu cầu biện pháp khẩn cấp tạm thời cấm chuyển dịch","Thông báo cho Đại sứ quán Hàn Quốc để can thiệp bảo hộ công dân","Đề nghị cơ quan thuế phong tỏa thửa đất cho đến khi có bản án"],"a":1,"e":"Chị Ngọc đứng tên một mình nên có thể chuyển nhượng, thế chấp đất. Biện pháp cấm chuyển dịch quyền về tài sản (Điều 114 BLTTDS 2015) là công cụ phù hợp. Tự giữ giấy tờ của người khác có thể vi phạm; đại sứ quán, cơ quan thuế không có thẩm quyền này.","b":"Điều 111, Điều 114 BLTTDS 2015","cid":"TH3.03"},{"id":"TH3.03.8","g":3,"lv":"VD","q":"Rủi ro lớn nhất nếu ông Park không chứng minh được nguồn tiền mua đất và lời xác nhận của bà Na là gì?","o":["Ông Park có thể bị trục xuất khỏi Việt Nam vì đã góp tiền mua đất","Quan hệ hôn nhân bị tuyên bố là kết hôn trái pháp luật","Ông Park phải bồi thường cho chị Ngọc vì đã yêu cầu chia tài sản không có căn cứ","Thửa đất có thể bị xác định là tài sản riêng của chị Ngọc"],"a":3,"e":"Nguyên tắc chung: tài sản mỗi người có trước khi kết hôn là tài sản riêng (Điều 43 Luật HNGĐ 2014). Án lệ 82/2025/AL chỉ áp dụng khi chứng minh được các tình tiết tương tự; thiếu chứng cứ thì nguyên tắc chung được áp dụng. Không có căn cứ cho các hậu quả còn lại.","b":"Điều 43 Luật HNGĐ 2014; Án lệ 82/2025/AL","cid":"TH3.03"},{"id":"TH3.04.1","g":3,"lv":"TH","q":"Chứng cứ nào có giá trị nhất để chứng minh ông Tâm đã tặng cho anh Dũng tờ vé số?","o":["Video ghi lại lúc ông Tâm đưa vé kèm lời nói và lời khai của những người chứng kiến","Giấy chứng nhận đăng ký hộ kinh doanh của xưởng mộc do ông Tâm đứng tên","Hợp đồng lao động giữa anh Dũng và ông Tâm có ghi chế độ thưởng Tết","Hóa đơn mua gỗ của xưởng trong ngày 07/01/2026 có chữ ký của anh Dũng"],"a":0,"e":"Tặng cho bằng lời nói và hành vi giao vé. Chứng cứ trực tiếp là video ghi lại hành vi, lời nói và lời khai người chứng kiến (Điều 94 BLTTDS 2015). Các giấy tờ của xưởng không chứng minh việc tặng cho.","b":"Điều 94, Điều 95 BLTTDS 2015","cid":"TH3.04"},{"id":"TH3.04.2","g":3,"lv":"TH","q":"Luật sư cần thu thập thêm tài liệu nào để xác định chính xác số tiền ông Tâm đã nhận?","o":["Sổ hộ khẩu của gia đình ông Tâm, bà Lụa để chứng minh tài sản chung","Giấy phép xây dựng nhà xưởng và hợp đồng thuê mặt bằng của ông Tâm","Xác nhận của công ty xổ số về người lĩnh, số tiền và thuế","Bảng chấm công của anh Dũng trong tháng 01/2026 tại xưởng mộc"],"a":2,"e":"Số tiền phải hoàn trả dựa trên số tiền thực nhận. Công ty xổ số lưu thông tin người lĩnh thưởng, giá trị giải và thuế thu nhập cá nhân đã khấu trừ; các tài liệu khác không cho biết số tiền.","b":"Điều 97 BLTTDS 2015","cid":"TH3.04"},{"id":"TH3.04.3","g":3,"lv":"VD","q":"Hợp đồng tặng cho tờ vé số giữa ông Tâm và anh Dũng có hiệu lực từ thời điểm nào?","o":["Từ thời điểm tờ vé trúng giải đặc biệt vào chiều cùng ngày","Từ thời điểm anh Dũng nhận tờ vé","Từ thời điểm ông Tâm đến công ty xổ số lĩnh thưởng và nhận tiền","Chỉ có hiệu lực khi hai bên lập văn bản tặng cho có công chứng"],"a":1,"e":"Khoản 1 Điều 458 BLDS 2015: hợp đồng tặng cho động sản có hiệu lực kể từ thời điểm bên được tặng cho nhận tài sản, trừ trường hợp có thỏa thuận khác. Tờ vé là động sản không phải đăng ký nên không cần công chứng; việc trúng thưởng, lĩnh thưởng diễn ra sau khi hợp đồng đã có hiệu lực.","b":"Khoản 1 Điều 458 BLDS 2015","cid":"TH3.04"},{"id":"TH3.04.4","g":3,"lv":"VD","q":"Bà Lụa cho rằng tặng cho vô hiệu vì không có sự đồng ý của bà. Nhận định nào đúng?","o":["Đúng, vì mọi tài sản chung đều phải có thỏa thuận bằng văn bản của vợ chồng khi định đoạt","Đúng một nửa: việc tặng cho chỉ có hiệu lực đối với phần tài sản của ông Tâm","Sai, vì tờ vé số là tài sản riêng của ông Tâm do ông tự mua","Sai; vé chưa mở thưởng là động sản không phải đăng ký, giá trị nhỏ"],"a":3,"e":"Án lệ 80/2025/AL và Điều 35 Luật HNGĐ 2014: chỉ việc định đoạt bất động sản, động sản phải đăng ký quyền sở hữu, tài sản đang là nguồn tạo thu nhập chủ yếu của gia đình mới cần thỏa thuận bằng văn bản. Tờ vé giá 10.000 đồng không thuộc các trường hợp đó. Tờ vé có thể là tài sản chung, nhưng điều đó không làm việc tặng cho vô hiệu.","b":"Án lệ 80/2025/AL; Điều 35 Luật HNGĐ 2014","cid":"TH3.04"},{"id":"TH3.04.5","g":3,"lv":"VD","q":"Đối tượng của hợp đồng tặng cho trong vụ việc là gì?","o":["Tờ vé số chưa mở thưởng mà ông Tâm đã trao cho anh Dũng","Khoản tiền thưởng 2 tỷ đồng mà tờ vé trúng sau đó","Một nửa khoản tiền thưởng tương ứng phần tài sản của ông Tâm","Quyền được ông Tâm chia lợi nhuận của xưởng khi có thưởng"],"a":0,"e":"Án lệ 80/2025/AL nhận định đối tượng tặng cho là tờ vé số chưa mở thưởng, không phải số tiền trúng thưởng. Vì vậy lập luận \"ông Tâm chỉ được định đoạt một nửa tiền thưởng\" không được chấp nhận; quyền nhận thưởng gắn với người sở hữu tờ vé.","b":"Án lệ 80/2025/AL","cid":"TH3.04"},{"id":"TH3.04.6","g":3,"lv":"VD","q":"Ông Tâm đã thực nhận 1,8 tỷ đồng và đưa anh Dũng 50 triệu đồng. Anh Dũng có quyền yêu cầu ông Tâm trả thêm bao nhiêu?","o":["0,9 tỷ đồng","2,0 tỷ đồng","1,8 tỷ đồng","1,75 tỷ đồng"],"a":3,"e":"Anh Dũng là chủ sở hữu tờ vé nên có quyền với toàn bộ số tiền thực nhận sau thuế: 1,8 tỷ đồng. Trừ 0,05 tỷ đồng đã nhận: 1,8 − 0,05 = 1,75 tỷ đồng (chưa kể lãi chậm trả). 2,0 tỷ là giá trị giải trước thuế; 0,9 tỷ là cách tính \"một nửa\" không có căn cứ.","b":"Điều 579 BLDS 2015; Án lệ 80/2025/AL","cid":"TH3.04"},{"id":"TH3.04.7","g":3,"lv":"VD","q":"Căn cứ pháp lý để buộc ông Tâm trả lại tiền thưởng là gì?","o":["Quy định về hợp đồng vay tài sản, vì ông Tâm đã mượn lại tờ vé","Nghĩa vụ hoàn trả do chiếm hữu, được lợi không có căn cứ","Quy định về hợp đồng lao động và chế độ tiền thưởng của người lao động","Quy định về bồi thường thiệt hại do vi phạm hợp đồng mua bán vé số"],"a":1,"e":"Ông Tâm lĩnh thưởng thay rồi giữ tiền thuộc về anh Dũng là chiếm hữu, được lợi không có căn cứ, phải hoàn trả (Điều 579 BLDS 2015). Giữa hai bên không có hợp đồng vay; tiền thưởng xổ số không phải tiền thưởng theo hợp đồng lao động.","b":"Điều 579 BLDS 2015","cid":"TH3.04"},{"id":"TH3.04.8","g":3,"lv":"VD","q":"Việc nào luật sư nên khuyến nghị anh Dũng làm ngay?","o":["Đăng video lên mạng xã hội để gây áp lực buộc ông Tâm trả tiền","Chờ ông Tâm tự nguyện trả dần trong vài năm để giữ quan hệ chủ thợ","Lập vi bằng, lấy lời khai, yêu cầu phong tỏa tài khoản khi khởi kiện","Tố cáo bà Lụa vì đã phản đối việc tặng cho và giữ tiền thưởng của chồng"],"a":2,"e":"Chứng cứ điện tử, lời khai cần được bảo toàn sớm; phong tỏa tài khoản (Điều 114 BLTTDS 2015) ngăn tẩu tán tiền. Đăng lên mạng có nguy cơ xâm phạm danh dự, uy tín người khác; chờ đợi làm tăng rủi ro tiền bị tiêu tán; bà Lụa phản đối không phải hành vi vi phạm.","b":"Điều 111, Điều 114 BLTTDS 2015","cid":"TH3.04"},{"id":"TH4.01.1","g":4,"lv":"TH","q":"Trong vụ án, vợ chồng bà Bình có tư cách tố tụng nào?","o":["Nguyên đơn, vì đã có yêu cầu được cơ cấu lại nợ trước khi Quỹ khởi kiện","Bị đơn","Người làm chứng về việc Quỹ giải ngân hai khoản vay","Người có quyền lợi, nghĩa vụ liên quan đứng về phía Quỹ tín dụng"],"a":1,"e":"Quỹ tín dụng TA khởi kiện yêu cầu vợ chồng bà Bình trả nợ và xử lý tài sản thế chấp, nên vợ chồng bà là bị đơn (khoản 3 Điều 68 BLTTDS 2015). Xác định đúng tư cách để biết quyền: trình bày ý kiến, đưa yêu cầu phản tố, đề nghị hòa giải.","b":"Điều 68 BLTTDS 2015","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"TH","q":"Để kiểm tra Quỹ tính lãi có đúng không, luật sư cần yêu cầu khách hàng cung cấp tài liệu nào?","o":["Giấy chứng nhận quyền sử dụng đất và quyền sở hữu nhà đang thế chấp","Giấy chứng nhận kết hôn của vợ chồng bà Bình để xác định nghĩa vụ chung","Sao kê, chứng từ trả nợ và các thông báo điều chỉnh lãi suất, thông báo thu hồi nợ trước hạn","Hóa đơn, hợp đồng sửa chữa nhà để chứng minh mục đích sử dụng vốn vay"],"a":2,"e":"Đối chiếu lãi cần biết đã trả bao nhiêu, đến ngày nào, lãi suất từng thời kỳ và thời điểm chuyển nợ quá hạn. Các tài liệu khác chứng minh tài sản, quan hệ vợ chồng hay mục đích vay, không giúp kiểm tra cách tính lãi.","b":"Điều 466, Điều 468 BLDS 2015","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Tổng số nợ gốc còn lại của hai hợp đồng tín dụng là bao nhiêu?","o":["800.000.000 đồng","799.849.200 đồng","499.997.300 đồng","799.997.300 đồng"],"a":1,"e":"299.851.900 + 499.997.300 = 799.849.200 đồng. 800 triệu là số tiền vay ban đầu, chưa trừ khoản gốc đã trả (148.100 đồng và 2.700 đồng).","b":"Điều 466 BLDS 2015","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Lãi suất nợ gốc quá hạn của hợp đồng 5912 và hợp đồng 6237 theo thỏa thuận lần lượt là bao nhiêu?","o":["21,3%/năm và 17,1%/năm","20%/năm và 20%/năm","14,2%/năm và 11,4%/năm","28,4%/năm và 22,8%/năm"],"a":0,"e":"Lãi nợ gốc quá hạn bằng 150% lãi suất trong hạn: 14,2% × 1,5 = 21,3%/năm; 11,4% × 1,5 = 17,1%/năm. Giới hạn 20%/năm của Điều 468 BLDS 2015 không áp dụng cho tổ chức tín dụng khi luật chuyên ngành có quy định khác; 28,4% và 22,8% là nhân đôi, sai.","b":"Điều 468 BLDS 2015; Luật Các tổ chức tín dụng 2024","cid":"TH4.01"},{"id":"TH4.01.5","g":4,"lv":"VD","q":"Hợp đồng thế chấp ký năm 2020 có bảo đảm cho hai khoản vay ký năm 2023 không?","o":["Không, vì hợp đồng thế chấp phải được ký cùng ngày với hợp đồng vay mới có hiệu lực","Không, vì một tài sản chỉ được dùng để bảo đảm cho một khoản vay duy nhất","Chỉ bảo đảm cho khoản vay thứ nhất vì khoản vay thứ hai có lãi suất khác","Có, vì các bên đã thỏa thuận bảo đảm cả nghĩa vụ phát sinh sau và hợp đồng đã công chứng, đăng ký"],"a":3,"e":"Điều 293, 294 BLDS 2015 cho phép bảo đảm nghĩa vụ hiện tại và nghĩa vụ trong tương lai; một tài sản có thể bảo đảm nhiều nghĩa vụ (Điều 296). Khi nghĩa vụ phát sinh trong tương lai được hình thành, bên bảo đảm không phải xác lập lại biện pháp bảo đảm.","b":"Điều 293, Điều 294, Điều 296 BLDS 2015","cid":"TH4.01"},{"id":"TH4.01.6","g":4,"lv":"VD","q":"Khi nghiên cứu luật áp dụng, luật sư phát hiện có án lệ về lãi suất trong hợp đồng tín dụng là Án lệ số 08/2016/AL. Xử lý thế nào là đúng kỹ năng tra cứu?","o":["Kiểm tra hiệu lực: Án lệ 08/2016/AL đã đương nhiên bị bãi bỏ nên không viện dẫn","Viện dẫn ngay vì án lệ đã công bố thì có hiệu lực vĩnh viễn, không thể bị bãi bỏ","Viện dẫn như một văn bản quy phạm pháp luật có giá trị cao hơn Bộ luật Dân sự","Chỉ viện dẫn nếu phía Quỹ tín dụng đồng ý áp dụng án lệ trong vụ án"],"a":0,"e":"Tra cứu pháp lý phải kiểm tra hiệu lực của nguồn luật. Án lệ có thể bị bãi bỏ (Nghị quyết 04/2019/NQ-HĐTP); Án lệ 08/2016/AL đã đương nhiên bị bãi bỏ (Tạp chí Tòa án nhân dân). Án lệ không phải văn bản quy phạm pháp luật và việc áp dụng không phụ thuộc ý kiến bên kia.","b":"Nghị quyết 04/2019/NQ-HĐTP","cid":"TH4.01"},{"id":"TH4.01.7","g":4,"lv":"VD","q":"Phương án nào có lợi nhất cho vợ chồng bà Bình?","o":["Phản đối toàn bộ yêu cầu vì Quỹ không có quyền thu hồi nợ trước hạn đối với hợp đồng 6237","Yêu cầu Tòa án hủy hợp đồng thế chấp năm 2020 để giữ lại nhà ở của gia đình","Đối chiếu tiền lãi; hòa giải cơ cấu lại nợ; cân nhắc tự bán tài sản thế chấp","Không tham gia tố tụng để kéo dài thời gian, chờ Quỹ tự giảm yêu cầu"],"a":2,"e":"Vi phạm nghĩa vụ trả lãi là căn cứ thu hồi trước hạn theo thỏa thuận; hợp đồng thế chấp hợp lệ. Thương lượng trong tố tụng và tự bán tài sản (Điều 303 BLDS 2015 cho phép thỏa thuận phương thức xử lý) thường cho kết quả tốt hơn. Vắng mặt khiến Tòa án xét xử vắng mặt, mất quyền trình bày.","b":"Điều 303 BLDS 2015; Điều 205, Điều 227 BLTTDS 2015","cid":"TH4.01"},{"id":"TH4.01.8","g":4,"lv":"VD","q":"Rủi ro nào cần nêu rõ khi trả lời tư vấn?","o":["Vợ chồng bà Bình bị truy cứu trách nhiệm hình sự vì chậm trả nợ kéo dài","Tài sản thế chấp bị xử lý; lãi tiếp tục phát sinh đến khi trả hết nợ","Quỹ có quyền tịch thu ngay mọi tài sản khác của vợ chồng bà Bình mà không cần bản án","Hai hợp đồng tín dụng sẽ bị tuyên vô hiệu và vợ chồng bà Bình phải trả gấp đôi"],"a":1,"e":"Chậm trả nợ là vi phạm dân sự, không đương nhiên là tội phạm. Quỹ chỉ có quyền ưu tiên với tài sản thế chấp; tài sản khác chỉ bị xử lý qua thi hành án nếu tiền bán tài sản thế chấp không đủ. Hợp đồng không có dấu hiệu vô hiệu. Lãi tiếp tục tính theo thỏa thuận đến khi trả hết nợ.","b":"Điều 299, Điều 307 BLDS 2015","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"TH","q":"Ông Phong là bên nào trong quan hệ hợp đồng và yêu cầu chính của ông là gì?","o":["Bên được tặng cho; yêu cầu công nhận hợp đồng tặng cho đã công chứng năm 2019","Bên thuê đất làm bãi xe; yêu cầu giảm tiền thuê theo hợp đồng với anh Phúc","Bên tặng cho; muốn lấy lại đất vì con không thực hiện cam kết","Bên nhận ủy quyền làm thủ tục đất đai; yêu cầu được trả thù lao"],"a":2,"e":"Ông Phong là bên tặng cho, đến tư vấn để lấy lại đất. Anh Phúc là bên được tặng cho; người thuê bãi xe là người thứ ba; giấy ủy quyền chỉ là văn bản phục vụ thủ tục, ông Phong là bên ủy quyền.","b":"Điều 457, Điều 462 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"TH","q":"Văn bản nào có giá trị chứng minh điều kiện tặng cho dù hợp đồng không ghi?","o":["Giấy ủy quyền ngày 25/3/2019 và bản cam kết ngày 12/4/2019 do anh Phúc viết","Giấy chứng nhận quyền sử dụng đất đứng tên anh Phúc cấp tháng 6/2019","Hợp đồng cho thuê bãi xe giữa vợ chồng anh Phúc và người thuê đất","Sổ hộ khẩu của ông Phong thể hiện việc ông đang ở nhờ nhà người em"],"a":0,"e":"Án lệ 14/2017/AL căn cứ vào các văn bản, tài liệu khác có liên quan (giấy ủy quyền, bản cam kết) thể hiện thỏa thuận về điều kiện. Giấy chứng nhận và hợp đồng thuê chỉ chứng minh tình trạng đất; sổ hộ khẩu không liên quan.","b":"Án lệ 14/2017/AL; Điều 121 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Vấn đề pháp lý mấu chốt của vụ việc là gì?","o":["Ông Phong có đủ năng lực hành vi dân sự khi ký hợp đồng tặng cho năm 2019 không","Hợp đồng tặng cho quyền sử dụng đất có bắt buộc phải công chứng, chứng thực không","Vợ chồng anh Phúc có được cho người khác thuê đất làm bãi xe hay không","Hợp đồng không ghi điều kiện có là tặng cho có điều kiện không"],"a":3,"e":"Anh Phúc phản bác bằng lý do hợp đồng không ghi điều kiện. Nếu xác định là tặng cho có điều kiện thì ông Phong mới có quyền đòi lại tài sản theo Điều 462. Năng lực của ông Phong và hình thức hợp đồng không bị tranh chấp; việc cho thuê chỉ là biểu hiện vi phạm.","b":"Án lệ 14/2017/AL; Điều 462 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"lv":"VD","q":"Theo Án lệ 14/2017/AL, Tòa án giải quyết thế nào về điều kiện không ghi trong hợp đồng tặng cho?","o":["Tòa án công nhận điều kiện và xác định đó là hợp đồng tặng cho tài sản có điều kiện","Không xem xét vì Tòa án chỉ căn cứ vào nội dung hợp đồng đã công chứng","Tuyên hợp đồng tặng cho vô hiệu toàn bộ vì nội dung không đầy đủ","Chuyển hợp đồng tặng cho thành hợp đồng mua bán, buộc anh Phúc trả tiền đất"],"a":0,"e":"Giải pháp pháp lý của Án lệ 14/2017/AL: khi văn bản, tài liệu khác thể hiện các bên đã thỏa thuận điều kiện hợp pháp, Tòa án phải công nhận điều kiện đó và xác định hợp đồng là tặng cho có điều kiện. Hợp đồng không vô hiệu và không bị chuyển hóa thành loại hợp đồng khác.","b":"Án lệ 14/2017/AL","cid":"TH4.02"},{"id":"TH4.02.5","g":4,"lv":"VD","q":"Khi anh Phúc không thực hiện điều kiện, ông Phong có quyền gì?","o":["Chỉ được yêu cầu anh Phúc xin lỗi và tiếp tục chăm sóc theo đạo lý gia đình","Tự thu hồi đất, chấm dứt hợp đồng thuê bãi xe và đuổi người thuê ra khỏi đất","Đòi lại tài sản và yêu cầu bồi thường thiệt hại","Yêu cầu UBND phường thu hồi giấy chứng nhận đã cấp cho anh Phúc"],"a":2,"e":"Khoản 3 Điều 462 BLDS 2015: trường hợp phải thực hiện nghĩa vụ sau khi tặng cho mà bên được tặng cho không thực hiện thì bên tặng cho có quyền đòi lại tài sản và yêu cầu bồi thường thiệt hại. Tự thu hồi là tự xử lý; UBND phường không có thẩm quyền hủy hợp đồng.","b":"Khoản 3 Điều 462 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.6","g":4,"lv":"VD","q":"Ông Phong biết anh Phúc từ chối thực hiện cam kết vào tháng 9/2026. Thời hiệu khởi kiện tranh chấp hợp đồng tặng cho của ông là bao lâu?","o":["Đã hết, vì hợp đồng tặng cho đã được ký từ ngày 27/4/2019","03 năm kể từ ngày ông Phong biết hoặc phải biết quyền, lợi ích của mình bị xâm phạm","30 năm, vì tài sản tặng cho là bất động sản nên áp dụng thời hiệu dài nhất","02 năm kể từ ngày ký hợp đồng tặng cho có công chứng"],"a":1,"e":"Điều 429 BLDS 2015: thời hiệu khởi kiện yêu cầu Tòa án giải quyết tranh chấp hợp đồng là 03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích của mình bị xâm phạm. Thời hiệu 30 năm là thời hiệu chia di sản là bất động sản; 02 năm là thời hiệu tranh chấp thương mại.","b":"Điều 429 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.7","g":4,"lv":"VD","q":"Phương án nào phù hợp nhất với ông Phong?","o":["Khởi kiện yêu cầu tuyên hợp đồng tặng cho vô hiệu do giả tạo, che giấu hợp đồng khác","Yêu cầu, hòa giải; không đạt thì khởi kiện kèm yêu cầu cấm chuyển dịch","Khiếu nại công chứng viên vì đã không ghi điều kiện tặng cho vào hợp đồng","Chấp nhận mất đất vì hợp đồng đã được công chứng và cấp giấy chứng nhận"],"a":1,"e":"Hợp đồng không giả tạo; đây là tặng cho có điều kiện bị vi phạm. Khiếu nại công chứng viên không lấy lại được đất. Lộ trình yêu cầu, hòa giải, khởi kiện kèm biện pháp khẩn cấp tạm thời vừa giữ quan hệ gia đình vừa bảo đảm tài sản không bị chuyển dịch.","b":"Khoản 3 Điều 462 BLDS 2015; Điều 114 BLTTDS 2015","cid":"TH4.02"},{"id":"TH4.02.8","g":4,"lv":"VD","q":"Hình thức tư vấn nào phù hợp nhất với ông Phong? Vì sao?","o":["Chỉ gửi thư điện tử cho nhanh và tiết kiệm chi phí đi lại của khách hàng","Không cần tư vấn chi tiết, vì Tòa án sẽ tự áp dụng Án lệ 14/2017/AL","Chỉ tư vấn qua điện thoại, vì vụ việc đơn giản và chỉ có hai bên","Trực tiếp, kèm văn bản tóm tắt; khách hàng cao tuổi, việc gia đình"],"a":3,"e":"Khách hàng 75 tuổi, vụ việc nhạy cảm trong gia đình, cần giải thích kỹ và trao đổi về phương án hòa giải; văn bản tóm tắt giúp ông lưu giữ, thực hiện đúng. Thư điện tử, điện thoại không bảo đảm khách hàng hiểu đầy đủ.","b":"Điều 462 BLDS 2015","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"TH","q":"Vợ chồng anh Tâm có tư cách gì đối với căn nhà?","o":["Chủ sở hữu hợp pháp phần diện tích 45 m² kể từ ngày trả đủ tiền năm 2012","Bên nhận chuyển nhượng theo giao dịch có điều kiện, đang chiếm hữu, sử dụng nhà","Người thuê nhà trực tiếp của Nhà nước theo hợp đồng thuê của gia đình bà Chi","Người được bà Chi tặng cho phần nhà để sử dụng lâu dài"],"a":1,"e":"Vợ chồng anh Tâm trả tiền theo giấy cam kết chuyển quyền sở hữu khi bà Chi được hóa giá; họ chưa bao giờ là chủ sở hữu vì điều kiện chưa xảy ra, cũng không ký hợp đồng thuê với Nhà nước. Giao dịch có đền bù nên không phải tặng cho.","b":"Điều 120 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"TH","q":"Tài liệu nào luật sư cần bổ sung để xác định điều kiện của giao dịch có còn xảy ra được không?","o":["Giấy chứng nhận kết hôn của vợ chồng anh Tâm để xác định tài sản chung","Hóa đơn tiền điện, nước mà vợ chồng anh Tâm đã thanh toán từ năm 2012","Lời khai của hàng xóm về việc vợ chồng anh Tâm sử dụng nhà liên tục","Văn bản của cơ quan quản lý nhà về việc không bán nhà và không công nhận quyền sở hữu cho bà Chi"],"a":3,"e":"Điều kiện của giao dịch là \"khi Nhà nước bán nhà cho bà Chi\". Chỉ văn bản của cơ quan quản lý nhà mới cho biết điều kiện còn khả năng xảy ra hay không. Các tài liệu còn lại không chứng minh được điều này.","b":"Điều 120 BLDS 2015; Án lệ 39/2020/AL","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Bà Chi có quyền chuyển nhượng phần nhà đang thuê của Nhà nước cho vợ chồng anh Tâm không?","o":["Có, vì gia đình bà đã sử dụng liên tục từ năm 1982 nên được coi là chủ sở hữu","Có, nếu giấy cam kết được UBND phường xác nhận chữ ký","Không, vì bà chỉ là người thuê","Có, nếu vợ chồng anh Tâm đã trả đủ tiền theo thỏa thuận"],"a":2,"e":"Người thuê chỉ có quyền chiếm hữu, sử dụng theo hợp đồng thuê; quyền định đoạt thuộc chủ sở hữu (Nhà nước). Thời gian sử dụng dài, xác nhận của UBND phường hay việc đã trả tiền không tạo ra quyền định đoạt. Vì vậy các bên mới phải đặt điều kiện \"khi được hóa giá\".","b":"Điều 192, Điều 194 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Theo Án lệ 39/2020/AL, giấy cam kết giữa bà Chi và vợ chồng anh Tâm được xác định thế nào?","o":["Giao dịch có điều kiện, vô hiệu vì điều kiện không thể xảy ra","Hợp đồng mua bán nhà có hiệu lực, buộc bà Chi làm thủ tục chuyển quyền sở hữu","Hợp đồng thuê lại nhà giữa bà Chi và vợ chồng anh Tâm, tiền trả là tiền thuê","Giao dịch giả tạo nhằm che giấu hợp đồng vay tiền có bảo đảm bằng nhà"],"a":0,"e":"Giải pháp pháp lý của Án lệ 39/2020/AL: hợp đồng chuyển nhượng quyền sở hữu nhà là giao dịch dân sự có điều kiện nhưng vô hiệu do điều kiện của hợp đồng không thể xảy ra (Nhà nước không hóa giá, không công nhận quyền sở hữu). Không có căn cứ coi là thuê nhà hay vay tiền.","b":"Án lệ 39/2020/AL; Điều 120 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.5","g":4,"lv":"VD","q":"Hậu quả pháp lý của giao dịch vô hiệu đối với các bên là gì?","o":["Vợ chồng anh Tâm được ở lại không thời hạn cho đến khi bà Chi trả tiền","Bà Chi được giữ lại 1,2 tỷ đồng vì việc Nhà nước không bán nhà không phải lỗi của bà","Nhà nước tịch thu 1,2 tỷ đồng vì đây là giao dịch về tài sản công","Các bên hoàn trả cho nhau những gì đã nhận; bên có lỗi gây thiệt hại phải bồi thường"],"a":3,"e":"Khoản 2, khoản 4 Điều 131 BLDS 2015: giao dịch vô hiệu thì các bên khôi phục lại tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận; bên có lỗi gây thiệt hại phải bồi thường. Vợ chồng anh Tâm trả lại nhà, bà Chi trả lại tiền; không có căn cứ tịch thu.","b":"Khoản 2, khoản 4 Điều 131 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.6","g":4,"lv":"VD","q":"Nếu Tòa án xác định cả hai bên có lỗi ngang nhau và thiệt hại do chênh lệch giá là 400 triệu đồng, vợ chồng anh Tâm được bồi thường khoản này bao nhiêu?","o":["400 triệu đồng","200 triệu đồng","Không được bồi thường","800 triệu đồng"],"a":1,"e":"Thiệt hại được chia theo mức độ lỗi; lỗi ngang nhau thì mỗi bên chịu một nửa: 400 : 2 = 200 triệu đồng. Ngoài ra vợ chồng anh Tâm vẫn được nhận lại 1,2 tỷ đồng đã trả và chi phí sửa chữa hợp lý nếu được chấp nhận.","b":"Khoản 4 Điều 131 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.7","g":4,"lv":"VD","q":"Phương án nào phù hợp nhất cho vợ chồng anh Tâm?","o":["Kiên quyết yêu cầu Tòa án công nhận hợp đồng mua bán và buộc bà Chi xin hóa giá","Yêu cầu giải quyết hậu quả giao dịch vô hiệu: hoàn trả, bồi thường","Tiếp tục ở trong nhà, không tham gia tố tụng để buộc bà Chi phải thương lượng","Khiếu nại quyết định về lộ giới để buộc Nhà nước hóa giá nhà cho bà Chi"],"a":1,"e":"Yêu cầu công nhận mua bán trái với Án lệ 39/2020/AL, sẽ bị bác. Vắng mặt làm mất quyền trình bày. Khiếu nại về lộ giới gần như không có khả năng thay đổi quy hoạch. Tập trung vào hậu quả của giao dịch vô hiệu mới bảo vệ được tiền của khách hàng.","b":"Án lệ 39/2020/AL; Điều 131 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.8","g":4,"lv":"VD","q":"Rủi ro nào cần cảnh báo nếu vợ chồng anh Tâm vẫn chỉ yêu cầu công nhận việc mua bán?","o":["Bị truy cứu trách nhiệm hình sự vì đã mua bán tài sản thuộc sở hữu nhà nước","Phải nộp thuế thu nhập cá nhân đối với giao dịch chuyển nhượng năm 2012","Yêu cầu bị bác, phải chịu án phí với phần không được chấp nhận và chậm đòi lại tiền","Mất toàn bộ 1,2 tỷ đồng vì đã tự nguyện giao tiền cho người không có quyền bán"],"a":2,"e":"Yêu cầu trái án lệ sẽ không được chấp nhận; đương sự chịu án phí đối với yêu cầu không được chấp nhận. Tuy vậy, quyền đòi lại tiền vẫn còn khi giao dịch vô hiệu; không có căn cứ hình sự hay nghĩa vụ thuế vì chưa có chuyển nhượng hợp pháp.","b":"Điều 147 BLTTDS 2015; Điều 131 BLDS 2015","cid":"TH4.03"},{"id":"TH4.04.1","g":4,"lv":"TH","q":"Trong quan hệ ủy quyền dự định xác lập, chị Trang và anh Toàn lần lượt là ai?","o":["Bên ủy quyền và bên được ủy quyền","Bên bán căn hộ và bên mua căn hộ theo hợp đồng chuyển nhượng","Bên cho thuê căn hộ và bên thuê căn hộ trong thời gian chị Trang ở Đức","Người giám hộ và người được giám hộ trong thời gian chị Trang vắng mặt"],"a":0,"e":"Chị Trang giao cho anh Toàn thực hiện công việc nhân danh chị (quản lý, cho thuê, bán căn hộ) nên chị là bên ủy quyền, anh Toàn là bên được ủy quyền (Điều 562 BLDS 2015). Quan hệ mua bán, thuê chỉ hình thành khi anh Toàn giao dịch với người thứ ba.","b":"Điều 562 BLDS 2015","cid":"TH4.04"},{"id":"TH4.04.2","g":4,"lv":"TH","q":"Để soạn phạm vi ủy quyền an toàn, luật sư cần chị Trang cung cấp thông tin nào?","o":["Thông tin về công việc, nơi ở và hợp đồng lao động của chị Trang tại Đức","Danh sách người thân của anh Toàn có thể được ủy quyền lại khi cần","Giá bán tối thiểu, giá cho thuê dự kiến và tài khoản đứng tên chị Trang để nhận tiền","Bằng lái xe và giấy tờ phương tiện của anh Toàn để đi lại làm thủ tục"],"a":2,"e":"Phạm vi đại diện xác định theo nội dung ủy quyền (Điều 141). Giá tối thiểu, cách nhận tiền là các giới hạn giúp kiểm soát rủi ro anh Toàn bán dưới giá hoặc giữ tiền. Các thông tin còn lại không phục vụ việc xác định phạm vi.","b":"Điều 141 BLDS 2015","cid":"TH4.04"},{"id":"TH4.04.3","g":4,"lv":"VD","q":"Nếu hợp đồng ủy quyền không ghi thời hạn như anh Toàn đề nghị, hợp đồng có hiệu lực trong bao lâu?","o":["Không thời hạn, cho đến khi chị Trang về nước","3 năm theo thời hạn hợp đồng lao động của chị Trang","6 tháng kể từ ngày ký","01 năm kể từ ngày xác lập việc ủy quyền"],"a":3,"e":"Điều 563 BLDS 2015: thời hạn ủy quyền do các bên thỏa thuận hoặc do pháp luật quy định; nếu không có thỏa thuận và pháp luật không quy định thì hợp đồng ủy quyền có hiệu lực 01 năm kể từ ngày xác lập. Chị Trang đi 3 năm nên phải ghi rõ thời hạn.","b":"Điều 563 BLDS 2015","cid":"TH4.04"},{"id":"TH4.04.4","g":4,"lv":"VD","q":"Anh Toàn muốn được ủy quyền lại cho vợ khi bận. Điều kiện để việc ủy quyền lại hợp pháp là gì?","o":["Anh Toàn được tự do ủy quyền lại cho bất kỳ ai mà không cần thông báo cho chị Trang","Có sự đồng ý của chị Trang (hoặc do bất khả kháng), không vượt phạm vi ban đầu và đúng hình thức","Chỉ cần vợ anh Toàn đồng ý nhận ủy quyền và ký vào văn bản ủy quyền lại","Ủy quyền lại luôn bị cấm trong mọi trường hợp đối với tài sản là nhà ở"],"a":1,"e":"Điều 564 BLDS 2015: bên được ủy quyền được ủy quyền lại khi có sự đồng ý của bên ủy quyền hoặc do sự kiện bất khả kháng nếu không áp dụng ủy quyền lại thì mục đích không thể thực hiện được; phạm vi ủy quyền lại không vượt quá phạm vi ủy quyền ban đầu; hình thức phải phù hợp với hình thức ủy quyền ban đầu.","b":"Điều 564 BLDS 2015","cid":"TH4.04"},{"id":"TH4.04.5","g":4,"lv":"VD","q":"Anh Toàn đề nghị nếu không có người mua thì anh tự mua lại căn hộ với giá 4,5 tỷ đồng theo hợp đồng ủy quyền. Nhận định nào đúng?","o":["Không được; người đại diện không được giao dịch với chính mình","Được, vì giá anh Toàn trả không thấp hơn mức tối thiểu chị Trang đã đặt ra","Được, vì anh Toàn là em ruột nên giao dịch trong gia đình không bị hạn chế","Được, nếu có hai người làm chứng ký vào hợp đồng mua bán căn hộ"],"a":0,"e":"Khoản 3 Điều 141 BLDS 2015: người đại diện không được xác lập, thực hiện giao dịch dân sự với chính mình hoặc với bên thứ ba mà mình cũng là người đại diện của người đó, trừ trường hợp pháp luật có quy định khác. Nếu muốn mua, anh Toàn phải giao dịch trực tiếp với chị Trang.","b":"Khoản 3 Điều 141 BLDS 2015","cid":"TH4.04"},{"id":"TH4.04.6","g":4,"lv":"VD","q":"Hình thức hợp đồng ủy quyền nào phù hợp để anh Toàn thực hiện được việc bán căn hộ?","o":["Thỏa thuận miệng giữa hai chị em trước sự chứng kiến của cha mẹ","Tin nhắn qua ứng dụng nhắn tin có lưu lại lịch sử trao đổi","Văn bản viết tay có chữ ký của hai bên và hai người làm chứng","Văn bản ủy quyền có công chứng, vì hợp đồng mua bán căn hộ phải công chứng"],"a":3,"e":"Hợp đồng mua bán nhà ở phải công chứng; khi công chứng, người ký thay phải xuất trình văn bản ủy quyền hợp lệ. Trên thực tế, ủy quyền để bán nhà được lập bằng văn bản công chứng. Thỏa thuận miệng, tin nhắn hay giấy viết tay không đáp ứng yêu cầu này.","b":"Điều 119, Điều 562 BLDS 2015; Luật Công chứng 2024","cid":"TH4.04"},{"id":"TH4.04.7","g":4,"lv":"VD","q":"Khi ở Đức, chị Trang muốn chấm dứt ủy quyền (không có thù lao). Chị phải làm gì để tránh rủi ro?","o":["Chỉ cần nhắn tin thông báo cho anh Toàn là việc ủy quyền chấm dứt ngay","Không chấm dứt được trước khi hết thời hạn ủy quyền đã ghi trong hợp đồng","Báo trước hợp lý cho anh Toàn và thông báo cho người thứ ba","Phải bồi thường cho anh Toàn toàn bộ thu nhập dự kiến từ việc cho thuê căn hộ"],"a":2,"e":"Khoản 1 Điều 569 BLDS 2015: ủy quyền không có thù lao thì bên ủy quyền có quyền đơn phương chấm dứt bất cứ lúc nào nhưng phải báo trước cho bên được ủy quyền một thời gian hợp lý; phải báo cho người thứ ba biết, nếu không thì hợp đồng với người thứ ba vẫn có hiệu lực, trừ khi người thứ ba biết hoặc phải biết.","b":"Khoản 1 Điều 569 BLDS 2015","cid":"TH4.04"},{"id":"TH4.04.8","g":4,"lv":"VD","q":"Điều khoản nào luật sư nên khuyến nghị đưa vào hợp đồng để hạn chế rủi ro anh Toàn giữ tiền bán căn hộ?","o":["Cho phép anh Toàn nhận tiền mặt từ bên mua rồi chuyển dần cho chị Trang","Bên mua thanh toán thẳng vào tài khoản đứng tên chị Trang; anh Toàn có nghĩa vụ báo cáo","Không ghi gì về việc nhận tiền để anh Toàn linh hoạt khi giao dịch","Anh Toàn được giữ lại 30% tiền bán làm thù lao và chi phí giao dịch"],"a":1,"e":"Bên được ủy quyền có nghĩa vụ báo cáo, giao lại tài sản, lợi ích thu được (Điều 565 BLDS 2015), nhưng quy định thanh toán thẳng vào tài khoản chị Trang là cách phòng ngừa hiệu quả nhất. Để linh hoạt hoặc cho giữ tiền mặt làm tăng rủi ro; thù lao 30% không phải là biện pháp phòng ngừa.","b":"Điều 141, Điều 565 BLDS 2015","cid":"TH4.04"},{"id":"TH5.01.1","g":5,"lv":"TH","q":"Bà Hạnh (vợ ông Cường) cũng bị thương tật 11%. Về tư cách yêu cầu bồi thường, nhận định nào đúng?","o":["Bà Hạnh có quyền yêu cầu riêng; ông Cường chỉ yêu cầu thay bà khi có văn bản ủy quyền","Ông Cường đương nhiên được yêu cầu thay bà Hạnh vì là chồng, không cần giấy tờ gì","Thiệt hại của bà Hạnh được gộp chung vào yêu cầu của ông Cường rồi chia đôi","Bà Hạnh không có quyền yêu cầu vì chỉ ngồi sau xe, không phải người điều khiển"],"a":0,"e":"Mỗi người bị xâm phạm sức khỏe có quyền yêu cầu bồi thường thiệt hại của mình (Điều 584, 590 BLDS 2015). Quan hệ vợ chồng không tạo ra quyền đại diện trong tố tụng; muốn ông Cường đứng ra thì bà Hạnh phải ủy quyền (Điều 138 BLDS 2015; Điều 85 BLTTDS 2015).","b":"Điều 138, Điều 590 BLDS 2015; Điều 85 BLTTDS 2015","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"TH","q":"Tài liệu nào luật sư nên yêu cầu bổ sung để mở thêm nguồn chi trả bồi thường cho ông Cường?","o":["Giấy phép lái xe của ông Cường để chứng minh ông không có lỗi","Giấy chứng nhận bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe","Sổ hộ khẩu của gia đình anh Hoàng để xác định ông Xuân là chủ hộ","Giấy khai sinh của con trai ông Cường để chứng minh quan hệ cha con"],"a":1,"e":"Chủ xe cơ giới phải mua bảo hiểm bắt buộc trách nhiệm dân sự (Nghị định 67/2023/NĐ-CP); doanh nghiệp bảo hiểm chi trả trong mức trách nhiệm cho thiệt hại về người do xe gây ra. Đây là nguồn tiền độc lập, giảm rủi ro người gây thiệt hại không có tài sản. Các giấy tờ còn lại không tạo thêm nguồn chi trả.","b":"Nghị định 67/2023/NĐ-CP","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Xe đứng tên ông Xuân nhưng do anh Hoàng (24 tuổi) được giao sử dụng hằng ngày và có lỗi gây tai nạn. Ai là người phải bồi thường?","o":["Ông Xuân, vì chủ sở hữu nguồn nguy hiểm cao độ phải bồi thường trong mọi trường hợp","Ông Xuân và anh Hoàng liên đới bồi thường theo quy định của luật","Anh Hoàng, vì là người thành niên gây thiệt hại và được giao chiếm hữu, sử dụng xe","Không ai phải bồi thường nữa vì ông Xuân đã đưa tiền hỗ trợ điều trị"],"a":2,"e":"Khoản 1 Điều 586 BLDS 2015: người từ đủ 18 tuổi gây thiệt hại thì tự bồi thường. Điều 601: chủ sở hữu đã giao nguồn nguy hiểm cao độ cho người khác chiếm hữu, sử dụng thì người này phải bồi thường, trừ trường hợp có thỏa thuận khác. Tiền ông Xuân đưa là trả thay một phần, không chấm dứt trách nhiệm.","b":"Khoản 1 Điều 586, Điều 601 BLDS 2015","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"lv":"VD","q":"Thiệt hại vật chất (chưa kể tổn thất tinh thần, chưa trừ tiền đã nhận) của ông Cường gồm chi phí điều trị, thu nhập bị mất và thu nhập của người chăm sóc là bao nhiêu?","o":["300 triệu đồng","396 triệu đồng","538 triệu đồng","438 triệu đồng"],"a":3,"e":"Theo Điều 590 BLDS 2015: chi phí điều trị 300 triệu đồng; thu nhập thực tế bị mất của ông Cường 12 × 8 = 96 triệu đồng; thu nhập bị mất của người chăm sóc 6 × 7 = 42 triệu đồng. Tổng: 300 + 96 + 42 = 438 triệu đồng. 396 triệu là bỏ sót người chăm sóc; 538 triệu là cộng nhầm cả 100 triệu phẫu thuật chưa phát sinh.","b":"Khoản 1 Điều 590 BLDS 2015","cid":"TH5.01"},{"id":"TH5.01.5","g":5,"lv":"VD","q":"Nếu các bên không thỏa thuận được, mức bồi thường tổn thất tinh thần tối đa cho ông Cường là bao nhiêu (mức lương cơ sở 2.530.000 đồng)?","o":["126,5 triệu đồng","25,3 triệu đồng","253 triệu đồng","75,9 triệu đồng"],"a":0,"e":"Khoản 2 Điều 590 BLDS 2015: mức bồi thường tổn thất về tinh thần khi sức khỏe bị xâm phạm không quá 50 lần mức lương cơ sở: 50 × 2,53 = 126,5 triệu đồng. 25,3 triệu (10 lần) là mức tối đa khi danh dự, nhân phẩm, uy tín bị xâm phạm; 253 triệu (100 lần) là mức tối đa khi tính mạng bị xâm phạm.","b":"Khoản 2 Điều 590 BLDS 2015","cid":"TH5.01"},{"id":"TH5.01.6","g":5,"lv":"VD","q":"Ông Cường thừa nhận đã nhận 22 triệu đồng, còn ông Xuân khai đã đưa 32 triệu đồng mà không có giấy tờ. Khoản được khấu trừ xác định thế nào?","o":["Khấu trừ 32 triệu đồng theo lời khai của ông Xuân vì ông là người đưa tiền","Khấu trừ mức trung bình 27 triệu đồng vì hai bên đều không có giấy tờ","Trừ 22 triệu đồng; phần chênh lệch do ông Xuân chứng minh","Không khấu trừ khoản nào vì việc đưa tiền không được lập thành văn bản"],"a":2,"e":"Tình tiết đương sự thừa nhận thì không phải chứng minh (Điều 92 BLTTDS 2015) nên 22 triệu đồng được khấu trừ. Bên khẳng định đã đưa thêm 10 triệu đồng phải chứng minh (Điều 91). Không có quy tắc lấy trung bình.","b":"Điều 91, Điều 92 BLTTDS 2015","cid":"TH5.01"},{"id":"TH5.01.7","g":5,"lv":"VD","q":"Chi phí phẫu thuật tiếp theo (dự kiến 100 triệu đồng) chưa phát sinh. Luật sư nên hướng dẫn ông Cường thế nào?","o":["Bỏ qua khoản này vì chưa có hóa đơn nên chắc chắn không được Tòa án chấp nhận","Yêu cầu kèm chỉ định của bác sĩ; khi phát sinh có thể yêu cầu thay đổi","Chờ phẫu thuật xong mới khởi kiện toàn bộ để có đủ hóa đơn chứng từ","Yêu cầu anh Hoàng đặt cọc trước 100 triệu đồng tại Tòa án để bảo đảm"],"a":1,"e":"Chi phí hợp lý cho việc cứu chữa, phục hồi sức khỏe được bồi thường (khoản 1 Điều 590); chi phí tương lai cần có căn cứ (chỉ định của cơ sở y tế). Khi mức bồi thường không còn phù hợp với thực tế, bên bị thiệt hại có quyền yêu cầu thay đổi mức bồi thường (khoản 3 Điều 585). Chờ quá lâu có thể ảnh hưởng thời hiệu.","b":"Khoản 3 Điều 585, khoản 1 Điều 590 BLDS 2015","cid":"TH5.01"},{"id":"TH5.01.8","g":5,"lv":"VD","q":"Thời hạn cuối cùng để ông Cường khởi kiện yêu cầu bồi thường là khi nào (biết thiệt hại từ ngày tai nạn)?","o":["Ngày 06/7/2026","Ngày 06/7/2027","Không có thời hạn","Ngày 06/7/2028"],"a":3,"e":"Điều 588 BLDS 2015: thời hiệu khởi kiện yêu cầu bồi thường thiệt hại là 03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm. 06/7/2025 + 03 năm = 06/7/2028.","b":"Điều 588 BLDS 2015","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"TH","q":"Để chứng minh thiệt hại và nguyên nhân, bộ chứng cứ nào là quan trọng nhất?","o":["Giấy phép kinh doanh của người thuê ki-ốt và hợp đồng thuê mặt bằng","Biên bản hiện trạng của UBND phường, kết quả giám định nguyên nhân, vi bằng hiện trạng","Sổ hộ khẩu của gia đình bà Mai để chứng minh nhân khẩu đang ở trong nhà","Hợp đồng mua vật liệu xây dựng của Công ty Đại Phát cho tòa nhà 9 tầng"],"a":1,"e":"Để có trách nhiệm bồi thường phải chứng minh có thiệt hại, hành vi (sự kiện) gây thiệt hại và mối quan hệ nhân quả (Điều 584). Biên bản hiện trạng, kết quả giám
