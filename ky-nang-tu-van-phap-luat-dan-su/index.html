định và vi bằng chứng minh trực tiếp các yếu tố này; các giấy tờ còn lại không chứng minh được.","b":"Điều 584 BLDS 2015; Điều 93, 94 BLTTDS 2015","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"TH","q":"Ngoài các tài liệu đã có, luật sư nên đề nghị tìm hiểu thêm thông tin nào để mở rộng khả năng được bồi thường?","o":["Bảo hiểm trách nhiệm đối với bên thứ ba của công trình","Thu nhập hằng tháng của Giám đốc Công ty Bình Minh để đánh giá khả năng chi trả","Lịch sử nộp thuế cho thuê ki-ốt của bà Mai trong 3 năm gần nhất","Số lượng căn hộ dự kiến bán và giá bán của tòa nhà 9 tầng"],"a":0,"e":"Nếu công trình, nhà thầu có bảo hiểm trách nhiệm đối với bên thứ ba thì doanh nghiệp bảo hiểm có thể chi trả, tăng khả năng thi hành. Các thông tin còn lại không liên quan đến nguồn bồi thường.","b":"Điều 605 BLDS 2015; pháp luật về xây dựng, kinh doanh bảo hiểm","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Theo Điều 605 BLDS 2015, chủ thể nào phải bồi thường cho bà Mai?","o":["Chỉ Công ty Bình Minh, vì là đơn vị trực tiếp thi công ép cọc, đào tầng hầm","Chỉ Công ty Đại Phát, vì là chủ đầu tư được cấp giấy phép xây dựng","UBND phường K, vì đã để công trình thi công gây nứt nhà dân","Công ty Đại Phát (người được giao quản lý công trình) và Công ty Bình Minh (người thi công có lỗi) liên đới bồi thường"],"a":3,"e":"Điều 605 BLDS 2015: chủ sở hữu, người chiếm hữu, người được giao quản lý, sử dụng công trình phải bồi thường thiệt hại do công trình gây ra; khi người thi công có lỗi thì phải liên đới bồi thường. Trách nhiệm liên đới cho phép bà Mai yêu cầu một hoặc cả hai bồi thường toàn bộ (Điều 587, Điều 288).","b":"Điều 587, Điều 605 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"lv":"VD","q":"Tổng thiệt hại bà Mai có thể yêu cầu gồm chi phí sửa chữa, chi phí thuê nhà ở tạm và tiền cho thuê ki-ốt bị mất trong 4 tháng là bao nhiêu?","o":["240 triệu đồng","268 triệu đồng","308 triệu đồng","280 triệu đồng"],"a":2,"e":"Điều 589 BLDS 2015: tài sản bị hư hỏng (sửa chữa 240 triệu); chi phí hợp lý để hạn chế thiệt hại (thuê nhà ở tạm 4 × 7 = 28 triệu); lợi ích gắn với việc sử dụng, khai thác tài sản bị mất (tiền cho thuê 4 × 10 = 40 triệu). Tổng: 240 + 28 + 40 = 308 triệu đồng.","b":"Điều 589 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.5","g":5,"lv":"VD","q":"Công ty Đại Phát cho rằng lỗi hoàn toàn do nhà thầu nên mình không phải bồi thường. Lập luận này đúng hay sai?","o":["Sai; chủ đầu tư vẫn phải bồi thường, phân chia giữa hai công ty là việc nội bộ","Đúng; theo nguyên tắc chung chỉ người có lỗi trực tiếp mới phải bồi thường thiệt hại","Đúng, nếu hợp đồng thi công ghi nhà thầu chịu mọi rủi ro đối với bên thứ ba","Sai; vì là chủ đầu tư nên Công ty Đại Phát phải bồi thường gấp đôi thiệt hại"],"a":0,"e":"Điều 605 đặt trách nhiệm trước hết lên chủ sở hữu, người được giao quản lý công trình; người thi công có lỗi thì liên đới. Thỏa thuận trong hợp đồng thi công chỉ ràng buộc hai công ty với nhau, không chống lại được bên thứ ba bị thiệt hại. Không có căn cứ bồi thường gấp đôi.","b":"Điều 587, Điều 605 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.6","g":5,"lv":"VD","q":"Công trình vẫn đang thi công, nhà bà Mai có nguy cơ hư hỏng thêm. Phương thức nào cần làm ngay?","o":["Chờ công trình hoàn thành rồi mới khởi kiện để tính đủ toàn bộ thiệt hại","Tự tháo dỡ hàng rào công trường để buộc nhà thầu dừng thi công","Đề nghị cơ quan quản lý xây dựng kiểm tra, tạm dừng thi công","Đăng bài trên mạng xã hội kêu gọi người mua tẩy chay dự án của Công ty Đại Phát"],"a":2,"e":"Ngăn chặn thiệt hại tiếp diễn là ưu tiên: thủ tục hành chính qua cơ quan quản lý xây dựng có thể tạm dừng thi công, buộc biện pháp an toàn. Chờ đợi làm thiệt hại tăng và có nguy cơ mất an toàn; tự tháo dỡ hoặc kêu gọi tẩy chay có thể làm phát sinh trách nhiệm cho chính bà Mai.","b":"Điều 177 BLDS 2015; pháp luật về xây dựng","cid":"TH5.02"},{"id":"TH5.02.7","g":5,"lv":"VD","q":"Mức hỗ trợ 50 triệu đồng của Công ty Bình Minh nên được đánh giá thế nào khi tư vấn?","o":["Nên nhận ngay để tránh tranh chấp kéo dài, không cần yêu cầu thêm khoản nào","Quá thấp; có thể nhận như khoản tạm ứng, ghi rõ chưa phải bồi thường cuối cùng","Đúng bằng mức bồi thường pháp luật quy định cho nhà ba tầng bị nứt, lún","Không được nhận vì nhận tiền sẽ làm mất quyền khởi kiện về sau"],"a":1,"e":"Pháp luật không quy định mức bồi thường cố định; thiệt hại thực tế có căn cứ là 308 triệu đồng. Có thể nhận khoản tiền như tạm ứng, nhưng phải ghi rõ để không bị hiểu là đã thỏa thuận bồi thường xong. Nhận tạm ứng không làm mất quyền khởi kiện.","b":"Điều 585, Điều 589 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.8","g":5,"lv":"VD","q":"Khi trả lời tư vấn, khuyến nghị nào về chứng cứ là quan trọng nhất trước khi sửa chữa nhà?","o":["Sửa chữa ngay để ổn định cuộc sống, sau đó mới thu thập chứng cứ về thiệt hại","Chỉ cần tự chụp ảnh bằng điện thoại là đủ chứng minh mức độ thiệt hại","Nhờ các hộ hàng xóm viết giấy xác nhận nhà bị nứt, lún do công trình","Lập vi bằng, đề nghị giám định bổ sung và lưu giữ biên bản trước khi sửa chữa nhà"],"a":3,"e":"Sửa chữa sẽ làm thay đổi hiện trạng, mất chứng cứ về mức độ thiệt hại. Vi bằng và giám định là chứng cứ có giá trị cao; ảnh chụp hay giấy xác nhận của hàng xóm chỉ hỗ trợ.","b":"Điều 93, Điều 94 BLTTDS 2015","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"TH","q":"Thông tin, chứng cứ nào cần thu thập ngay để không bị mất?","o":["Giấy chứng nhận đăng ký hộ kinh doanh và giấy chứng nhận an toàn thực phẩm của tiệm","Học bạ và thông tin trường học của em Huy để xác định độ tuổi","Vi bằng ghi nhận nội dung video, đường dẫn, tài khoản đăng và số lượt xem","Hợp đồng thuê mặt bằng và hóa đơn tiền điện của tiệm bánh"],"a":2,"e":"Thông tin trên mạng có thể bị xóa bất cứ lúc nào; vi bằng do thừa phát lại lập là chứng cứ có giá trị về nội dung, thời điểm, mức độ lan truyền. Các giấy tờ còn lại không bị mất và không chứng minh hành vi xâm phạm.","b":"Điều 93, Điều 94 BLTTDS 2015","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"TH","q":"Để chứng minh khoản \"thu nhập bị giảm sút\", chị Lan cần cung cấp tài liệu nào?","o":["Sổ sách thu nhập trước, sau sự việc; tin nhắn hủy đơn","Ảnh chụp tiệm bánh lúc đông khách trước ngày video được đăng","Giấy khám bệnh của chị Lan vì mất ngủ kéo dài sau sự việc","Hóa đơn kiểm nghiệm sản phẩm và chi phí đăng thông báo cải chính"],"a":0,"e":"Thu nhập thực tế bị mất, giảm sút (điểm b khoản 1 Điều 592) phải được chứng minh bằng số liệu so sánh trước, sau sự việc. Giấy khám bệnh liên quan tổn thất tinh thần; hóa đơn kiểm nghiệm là chi phí hạn chế, khắc phục thiệt hại.","b":"Điểm b khoản 1 Điều 592 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Ngoài bồi thường tiền, chị Lan có quyền yêu cầu biện pháp nào để bảo vệ uy tín?","o":["Yêu cầu cơ quan công an tạm giữ em Huy để điều tra hành vi đăng video","Yêu cầu nhà trường buộc thôi học em Huy vì vi phạm đạo đức học sinh","Tự đăng thông tin cá nhân, địa chỉ của em Huy lên mạng để cảnh báo","Yêu cầu gỡ bỏ video, cải chính thông tin sai sự thật và xin lỗi công khai"],"a":3,"e":"Điều 34 BLDS 2015: cá nhân bị đưa tin làm ảnh hưởng xấu đến danh dự, nhân phẩm, uy tín có quyền yêu cầu người đưa tin gỡ bỏ, cải chính thông tin, xin lỗi và bồi thường. Đăng thông tin cá nhân của em Huy có thể xâm phạm quyền của người chưa thành niên; tạm giữ, đuổi học không thuộc quyền yêu cầu dân sự.","b":"Điều 34 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"lv":"VD","q":"Thiệt hại vật chất chị Lan có thể yêu cầu (chưa kể tổn thất tinh thần) là bao nhiêu?","o":["12 triệu đồng","42 triệu đồng","30 triệu đồng","67,3 triệu đồng"],"a":1,"e":"Điều 592: chi phí hợp lý để hạn chế, khắc phục thiệt hại 12 triệu đồng; thu nhập thực tế bị giảm sút 2 × 15 = 30 triệu đồng. Tổng 42 triệu đồng. 67,3 triệu là đã cộng thêm mức tổn thất tinh thần tối đa 25,3 triệu.","b":"Khoản 1 Điều 592 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.5","g":5,"lv":"VD","q":"Mức bồi thường tổn thất tinh thần tối đa khi không thỏa thuận được là bao nhiêu (mức lương cơ sở 2.530.000 đồng)?","o":["25,3 triệu đồng","126,5 triệu đồng","12,65 triệu đồng","253 triệu đồng"],"a":0,"e":"Khoản 2 Điều 592 BLDS 2015: tổn thất về tinh thần khi danh dự, nhân phẩm, uy tín bị xâm phạm, nếu không thỏa thuận được thì tối đa không quá 10 lần mức lương cơ sở: 10 × 2,53 = 25,3 triệu đồng. 126,5 triệu là mức tối đa khi sức khỏe bị xâm phạm.","b":"Khoản 2 Điều 592 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.6","g":5,"lv":"VD","q":"Cha mẹ em Huy cho rằng con chưa thành niên nên không ai phải bồi thường. Nhận định nào đúng?","o":["Đúng, vì người chưa thành niên không có năng lực chịu trách nhiệm bồi thường","Sai; cha mẹ phải bồi thường toàn bộ, em Huy không phải bồi thường gì","Em Huy bồi thường bằng tài sản riêng; thiếu thì cha mẹ trả","Đúng, nếu em Huy đã xóa video và nhắn tin xin lỗi chị Lan"],"a":2,"e":"Khoản 2 Điều 586 BLDS 2015: người từ đủ 15 tuổi đến chưa đủ 18 tuổi gây thiệt hại thì phải bồi thường bằng tài sản của mình; nếu không đủ tài sản thì cha, mẹ phải bồi thường phần còn thiếu bằng tài sản của mình. Cha mẹ bồi thường toàn bộ là quy định dành cho người chưa đủ 15 tuổi. Xóa video không xóa trách nhiệm với thiệt hại đã xảy ra.","b":"Khoản 2 Điều 586 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.7","g":5,"lv":"VD","q":"Giả sử Tòa án buộc bồi thường tổng cộng 60 triệu đồng. Em Huy có 10 triệu đồng tiết kiệm riêng. Nghĩa vụ được phân chia thế nào?","o":["Cha mẹ em Huy trả toàn bộ 60 triệu đồng vì em Huy chưa thành niên","Em Huy trả 10 triệu đồng; cha mẹ trả 50 triệu đồng còn thiếu","Em Huy, cha và mẹ mỗi người trả 20 triệu đồng theo nguyên tắc chia đều","Em Huy trả 60 triệu đồng, được trả dần khi đủ 18 tuổi và đi làm"],"a":1,"e":"Theo khoản 2 Điều 586, tài sản của em Huy được dùng trước: 10 triệu đồng; phần còn thiếu 60 − 10 = 50 triệu đồng do cha mẹ bồi thường. Không có quy tắc chia đều; cũng không thể để thiệt hại treo đến khi em Huy có thu nhập.","b":"Khoản 2 Điều 586 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.8","g":5,"lv":"VD","q":"Phương án giải quyết nào phù hợp nhất?","o":["Đăng video đáp trả, nêu tên trường và địa chỉ nhà em Huy để mọi người biết","Chỉ khởi kiện ngay, không cần gửi văn bản yêu cầu hay thông báo trước","Bỏ qua vì người gây thiệt hại chỉ là học sinh, khó đòi được bồi thường","Yêu cầu gỡ, xin lỗi, bồi thường; báo cơ quan chức năng; sau cùng mới kiện"],"a":3,"e":"Thỏa thuận giúp gỡ thông tin nhanh, hạn chế thiệt hại; xử lý hành chính có tác dụng răn đe; khởi kiện là phương án cuối. Đăng video đáp trả kèm thông tin cá nhân của học sinh có thể khiến chị Lan vi phạm pháp luật. Bỏ qua thì uy tín tiếp tục bị ảnh hưởng.","b":"Điều 34, Điều 584 BLDS 2015","cid":"TH5.03"},{"id":"TH5.04.1","g":5,"lv":"TH","q":"Chứng cứ nào giúp xác định ai đang chiếm hữu, sử dụng con chó tại thời điểm gây thiệt hại?","o":["Giấy chứng nhận tiêm phòng dại của con chó và sổ theo dõi thú y","Camera, người làm chứng tại công viên và tin nhắn giữa ông Bảo với anh Quân về việc nhờ trông chó","Hợp đồng hợp tác giữa anh Khánh và ứng dụng giao hàng công nghệ","Hóa đơn sửa điện thoại và biên nhận đền tiền hàng cho chủ hàng"],"a":1,"e":"Khoản 1 Điều 603 phân biệt trách nhiệm của chủ sở hữu và người chiếm hữu, sử dụng súc vật; vì vậy phải chứng minh ai đang dắt chó và nội dung thỏa thuận nhờ trông giữ. Giấy tiêm phòng, hợp đồng lao động, hóa đơn sửa chữa không chứng minh việc chiếm hữu.","b":"Khoản 1 Điều 603 BLDS 2015","cid":"TH5.04"},{"id":"TH5.04.2","g":5,"lv":"TH","q":"Khoản tiền 2 triệu đồng anh Khánh đã đền cho chủ hàng có được tính vào thiệt hại không? Cần chứng cứ gì?","o":["Không, vì hàng hóa thuộc sở hữu của chủ hàng chứ không phải của anh Khánh","Có, nhưng chỉ khi chủ hàng tự khởi kiện yêu cầu chủ chó bồi thường","Có, đây là thiệt hại thực tế; cần biên nhận đền tiền","Không, vì khoản này đã được bảo hiểm của ứng dụng giao hàng chi trả"],"a":2,"e":"Anh Khánh đã bỏ tiền đền hàng hỏng nên đây là thiệt hại tài sản thực tế của anh, phát sinh từ sự kiện chó cắn (Điều 589). Cần biên nhận chứng minh đã đền. Đề bài không nêu bảo hiểm chi trả.","b":"Điều 589 BLDS 2015","cid":"TH5.04"},{"id":"TH5.04.3","g":5,"lv":"VD","q":"Ai phải bồi thường cho anh Khánh?","o":["Ông Bảo, vì chủ sở hữu súc vật phải bồi thường trong mọi trường hợp","Ông Bảo và anh Quân, mỗi người chịu một nửa theo quy định của luật","UBND phường, vì đã để chó vào công viên mà không kiểm tra","Anh Quân, vì là người chiếm hữu, sử dụng chó khi gây thiệt hại và không có thỏa thuận khác"],"a":3,"e":"Khoản 1 Điều 603 BLDS 2015: người chiếm hữu, sử dụng súc vật phải bồi thường thiệt hại trong thời gian chiếm hữu, sử dụng, trừ trường hợp có thỏa thuận khác. Anh Quân đang trông giữ, dắt chó và tự tháo xích. Luật không chia đôi mặc định giữa chủ sở hữu và người chiếm hữu.","b":"Khoản 1 Điều 603 BLDS 2015","cid":"TH5.04"},{"id":"TH5.04.4","g":5,"lv":"VD","q":"Tổng thiệt hại vật chất (chưa kể tổn thất tinh thần) anh Khánh có thể yêu cầu là bao nhiêu?","o":["41 triệu đồng","39 triệu đồng","35 triệu đồng","31 triệu đồng"],"a":0,"e":"Sức khỏe (Điều 590): điều trị 25 triệu + thu nhập bị mất 15 × 0,4 = 6 triệu = 31 triệu đồng. Tài sản (Điều 589): sửa điện thoại 8 triệu + tiền hàng đã đền 2 triệu = 10 triệu đồng. Tổng 31 + 10 = 41 triệu đồng. 31 triệu là bỏ sót thiệt hại tài sản.","b":"Điều 589, Điều 590 BLDS 2015","cid":"TH5.04"},{"id":"TH5.04.5","g":5,"lv":"VD","q":"Ngoài thiệt hại vật chất, anh Khánh có thể yêu cầu khoản nào? Mức tối đa khi không thỏa thuận được là bao nhiêu?","o":["Không có khoản nào khác ngoài các chi phí đã có hóa đơn","Tổn thất tinh thần do sức khỏe bị xâm phạm, tối đa 126,5 triệu","Tổn thất tinh thần do danh dự, uy tín bị xâm phạm, tối đa 25,3 triệu đồng","Tiền phạt vi phạm bằng 8% giá trị thiệt hại theo quy định về hợp đồng"],"a":1,"e":"Khoản 2 Điều 590 BLDS 2015: người chịu trách nhiệm bồi thường khi sức khỏe người khác bị xâm phạm phải bồi thường khoản tiền bù đắp tổn thất về tinh thần, tối đa 50 lần mức lương cơ sở = 126,5 triệu đồng. Phạt vi phạm chỉ có trong quan hệ hợp đồng; 25,3 triệu là mức của danh dự, uy tín.","b":"Khoản 2 Điều 590 BLDS 2015","cid":"TH5.04"},{"id":"TH5.04.6","g":5,"lv":"VD","q":"Nếu chứng minh được ông Bảo đã nhắn tin cam kết \"có chuyện gì với con chó anh chịu hết\", hậu quả pháp lý thay đổi thế nào?","o":["Không thay đổi gì, anh Quân vẫn là người duy nhất phải bồi thường cho anh Khánh","Anh Khánh mất quyền yêu cầu bồi thường vì hai bên đã thỏa thuận với nhau","Có thỏa thuận khác; ông Bảo có thể là người phải bồi thường","Ông Bảo và anh Quân phải bồi thường gấp đôi thiệt hại vì cùng có lỗi"],"a":2,"e":"Khoản 1 Điều 603 cho phép \"thỏa thuận khác\" về trách nhiệm trong thời gian người khác chiếm hữu, sử dụng súc vật. Vì vậy cần thu thập tin nhắn giữa hai người và nên khởi kiện có cả hai để Tòa án xác định đúng người phải bồi thường. Quyền của anh Khánh không mất.","b":"Khoản 1 Điều 603 BLDS 2015","cid":"TH5.04"},{"id":"TH5.04.7","g":5,"lv":"VD","q":"Phương án tố tụng nào giúp anh Khánh tránh rủi ro xác định sai bị đơn?","o":["Chỉ khởi kiện ông Bảo vì ông là chủ sở hữu và có điều kiện kinh tế tốt hơn","Khởi kiện UBND phường vì không quản lý chó thả rông trong công viên","Chờ ông Bảo và anh Quân tự thỏa thuận với nhau ai sẽ bồi thường","Khởi kiện anh Quân, đưa ông Bảo vào tham gia tố tụng; trước đó gửi yêu cầu đến cả hai"],"a":3,"e":"Hai người đổ trách nhiệm cho nhau, việc có thỏa thuận khác hay không chưa rõ. Khởi kiện người chiếm hữu, đồng thời đưa chủ sở hữu vào tố tụng giúp Tòa án giải quyết triệt để. Chỉ kiện ông Bảo dễ bị bác nếu không có thỏa thuận; UBND phường không phải người gây thiệt hại.","b":"Khoản 1 Điều 603 BLDS 2015; Điều 68 BLTTDS 2015","cid":"TH5.04"},{"id":"TH5.04.8","g":5,"lv":"VD","q":"Hình thức tư vấn nào phù hợp nhất với anh Khánh? Vì sao?","o":["Trực tiếp, kèm bảng kê thiệt hại; cần thu thập chứng cứ nhanh","Chỉ cần gửi đường dẫn Bộ luật Dân sự cho anh Khánh tự đọc và tự xử lý","Bắt buộc phải lập thư tư vấn dài vì mọi vụ việc đều phải tư vấn bằng văn bản","Không cần tư vấn, đề nghị anh Khánh nhờ công an phường giải quyết toàn bộ"],"a":0,"e":"Lựa chọn hình thức tư vấn tùy tính chất vụ việc. Vụ việc ít chủ thể, thiệt hại không lớn, cần hành động nhanh để giữ chứng cứ nên tư vấn trực tiếp là phù hợp; bảng kê thiệt hại bằng văn bản giúp khách hàng thương lượng. Gửi văn bản luật cho khách tự đọc không phải là tư vấn; không có quy định bắt buộc mọi vụ việc phải có thư tư vấn.","b":"Điều 589, Điều 590, Điều 603 BLDS 2015","cid":"TH5.04"},{"id":"TH6.01.1","g":6,"lv":"TH","q":"Khách hàng trong vụ việc là ai và có tư cách gì?","o":["Ông Hiếu — người thừa kế theo pháp luật muốn hủy di chúc và chia đều nhà đất","Bà Hằng — người làm chứng khi cụ Sáu lập di chúc tại văn phòng công chứng","Bà Hoa và ông Dũng — người hưởng di sản theo di chúc","Văn phòng công chứng — tổ chức đã chứng nhận di chúc năm 2010"],"a":2,"e":"Người nhờ tư vấn là vợ chồng bà Hoa, được cụ Sáu để lại toàn bộ nhà đất theo di chúc. Bà Hằng là người thừa kế theo pháp luật, không phải người làm chứng (người làm chứng là hai người khác). Ông Hiếu là bên đối lập.","b":"Điều 624 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"TH","q":"Tài liệu nào cần thu thập để xác định nhà đất là tài sản riêng của cụ Sáu hay tài sản chung của hộ?","o":["Giấy tờ mua nhà năm 1974 và hồ sơ cấp giấy chứng nhận năm 2005 (thành viên hộ, nguồn gốc đất)","Biên bản hòa giải không thành tại UBND xã năm 2009 giữa ông Hiếu và vợ chồng bà Hoa","Giấy chứng nhận kết hôn của bà Hoa và ông Dũng để xác định tài sản chung vợ chồng","Giấy khám sức khỏe của ông Hiếu để xác định khả năng lao động"],"a":0,"e":"Giấy chứng nhận ghi \"hộ\" nên phải đối chiếu nguồn gốc tạo lập (cụ Sáu tự mua năm 1974) và hồ sơ cấp giấy (thành viên hộ tại thời điểm công nhận quyền sử dụng đất). Các tài liệu còn lại không xác định được chủ thể có quyền.","b":"Khoản 25 Điều 3 Luật Đất đai 2024; Điều 212 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Ông Hiếu cho rằng di chúc vô hiệu vì được lập sau khi gia đình có tranh chấp. Nhận định nào đúng?","o":["Đúng, di chúc lập trong thời gian gia đình đang có tranh chấp luôn bị vô hiệu","Đúng, nếu ông Hiếu không được thông báo trước về việc cụ Sáu lập di chúc","Sai, nhưng di chúc chỉ có hiệu lực khi tất cả các con đều ký đồng ý","Sai; người lập di chúc có quyền định đoạt tài sản của mình, tranh chấp trước đó không làm di chúc vô hiệu"],"a":3,"e":"Người lập di chúc có quyền chỉ định người thừa kế, phân định phần di sản (Điều 626 BLDS 2015) mà không cần sự đồng ý của người khác. Di chúc chỉ vô hiệu khi không đáp ứng điều kiện hợp pháp (năng lực, tự nguyện, nội dung, hình thức). Thời điểm lập sau tranh chấp không phải là điều kiện.","b":"Điều 626, Điều 630 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"lv":"VD","q":"Ông Hiếu cho rằng cụ Sáu bị dụ dỗ khi lập di chúc. Ai có nghĩa vụ chứng minh?","o":["Vợ chồng bà Hoa phải chứng minh cụ Sáu hoàn toàn minh mẫn và không bị dụ dỗ","Ông Hiếu phải chứng minh, vì di chúc là văn bản công chứng hợp pháp","Văn phòng công chứng phải chứng minh vì đã chứng nhận di chúc","Tòa án tự xác minh toàn bộ, các đương sự không có nghĩa vụ chứng minh"],"a":1,"e":"Tình tiết, sự kiện đã được ghi trong văn bản được công chứng hợp pháp thì không phải chứng minh (Điều 92 BLTTDS 2015); bên đưa ra yêu cầu phản bác phải chứng minh (Điều 91). Ông Hiếu có thể đề nghị giám định, nhưng gánh nặng chứng minh thuộc về ông.","b":"Điều 91, Điều 92 BLTTDS 2015","cid":"TH6.01"},{"id":"TH6.01.5","g":6,"lv":"VD","q":"Ông Dũng là con rể, không thuộc hàng thừa kế theo pháp luật của cụ Sáu. Ông có được hưởng di sản không?","o":["Có; người lập di chúc có quyền để lại di sản cho bất kỳ ai","Không; chỉ người thuộc hàng thừa kế theo pháp luật mới được hưởng di sản","Chỉ được hưởng nếu ông Hiếu và bà Hằng đồng ý bằng văn bản có công chứng","Chỉ được hưởng tối đa một phần ba di sản vì không phải con đẻ của cụ Sáu"],"a":0,"e":"Điều 609, Điều 626 BLDS 2015: cá nhân có quyền lập di chúc để định đoạt tài sản cho bất kỳ người nào; hàng thừa kế chỉ áp dụng khi thừa kế theo pháp luật. Không có quy tắc giới hạn một phần ba hay cần sự đồng ý của người thừa kế khác.","b":"Điều 609, Điều 624, Điều 626 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.6","g":6,"lv":"VD","q":"Ông Hiếu có được hưởng phần di sản bắt buộc (không phụ thuộc vào nội dung di chúc) không?","o":["Có, vì ông là con trai duy nhất nên được hưởng phần bắt buộc theo truyền thống","Có, bằng hai phần ba suất của một người thừa kế theo pháp luật","Không, vì đã thành niên và có khả năng lao động","Có, nếu ông đang sống cùng cụ Sáu tại thời điểm cụ chết"],"a":2,"e":"Điều 644 BLDS 2015: chỉ con chưa thành niên, cha, mẹ, vợ, chồng; con thành niên mà không có khả năng lao động mới được hưởng phần bằng 2/3 suất thừa kế theo pháp luật dù không được di chúc cho. Ông Hiếu thành niên, có khả năng lao động nên không thuộc diện này.","b":"Điều 644 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.7","g":6,"lv":"VD","q":"Nếu Tòa án xác định nhà đất là tài sản chung của cụ Sáu với một thành viên khác của hộ, hiệu lực của di chúc thế nào?","o":["Di chúc vô hiệu toàn bộ vì cụ Sáu đã định đoạt cả tài sản không phải của mình","Di chúc vẫn có hiệu lực với toàn bộ nhà đất vì đã được công chứng","Di chúc có hiệu lực, nhưng bà Hoa phải chia đều nhà đất với ông Hiếu","Di chúc chỉ có hiệu lực đối với phần tài sản thuộc quyền của cụ Sáu"],"a":3,"e":"Người lập di chúc chỉ định đoạt được tài sản của mình. Phần di chúc liên quan đến tài sản không thuộc quyền của cụ Sáu không có hiệu lực; phần còn lại vẫn có hiệu lực (Điều 643 BLDS 2015). Không có căn cứ chia đều với ông Hiếu.","b":"Điều 643 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.8","g":6,"lv":"VD","q":"Phương án nào phù hợp nhất cho vợ chồng bà Hoa?","o":["Khởi kiện yêu cầu công nhận di chúc, chia di sản theo di chúc; chuẩn bị hồ sơ công chứng và hồ sơ cấp giấy","Tự làm thủ tục sang tên tại văn phòng đăng ký đất đai mà không cần ý kiến của ông Hiếu","Đề nghị UBND xã hủy giấy năm 1989 vì đã xác nhận sai cho ông Hiếu","Chờ đến khi ông Hiếu chấp nhận di chúc rồi mới làm thủ tục nhận di sản"],"a":0,"e":"Có tranh chấp nên không làm được văn bản nhận di sản tại tổ chức hành nghề công chứng một cách suôn sẻ; khởi kiện là cách giải quyết dứt điểm. UBND xã không có thẩm quyền hủy giấy năm 1989; chờ đợi không giải quyết được tranh chấp. Thời hiệu 30 năm còn đến năm 2042.","b":"Điều 623, Điều 630 BLDS 2015; Điều 26 BLTTDS 2015","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"TH","q":"Khách hàng ban đầu đặt yêu cầu \"chia thừa kế\" toàn bộ 154,4 m². Ở bước tiếp xúc khách hàng, luật sư cần làm rõ điều gì trước tiên?","o":["Ba chị em có đủ khả năng tài chính để nộp tạm ứng án phí hay không","Thửa đất còn là di sản chưa chia hay đã được chia xong trên thực tế và trên sổ địa chính","Ông Hưng có bao nhiêu người con và ai đang trực tiếp làm quán trên đất","Ba chị em có dự định bán lại đất sau khi lấy lại được hay không"],"a":1,"e":"Yêu cầu khởi kiện đúng hay sai phụ thuộc vào việc đất còn là di sản hay đã được chia xong. Đây là thông tin quyết định, phải làm rõ trước khi chọn yêu cầu; các câu hỏi còn lại chỉ phụ.","b":"Án lệ 24/2018/AL","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"TH","q":"Tài liệu nào chứng minh việc chia đất năm 2002 đã \"được điều chỉnh trên sổ sách giấy tờ về đất đai\" theo Án lệ 24/2018/AL?","o":["Trích lục bản đồ, sổ địa chính thể hiện việc chia","Giấy chứng tử của cụ Hòa và cụ Vân để xác định thời điểm mở thừa kế","Ảnh chụp quán của con ông Hưng đang kinh doanh trên phần đất tranh chấp","Giấy khai sinh của ba chị em để chứng minh là con của hai cụ"],"a":0,"e":"Án lệ 24/2018/AL đòi hỏi việc phân chia đã thực hiện trên thực tế và đã được điều chỉnh trên sổ sách giấy tờ về đất đai. Trích lục bản đồ, sổ địa chính là chứng cứ trực tiếp của điều kiện này; các giấy tờ khác không chứng minh được.","b":"Án lệ 24/2018/AL","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Áp dụng Án lệ 24/2018/AL, 154,4 m² đất được xác định thế nào?","o":["Vẫn là di sản thừa kế của hai cụ, phải chia đều cho 7 người con","Là tài sản riêng của ông Hưng vì ông đã trông coi, quản lý trong nhiều năm","Không còn là di sản; đã thuộc quyền của các cá nhân được chia","Là tài sản chung của con trai ông Hưng vì đang làm quán trên đất"],"a":2,"e":"Giải pháp pháp lý của Án lệ 24/2018/AL: nhà đất là tài sản chung của vợ chồng mà một người chết trước, người còn lại và các thừa kế đã thỏa thuận phân chia, việc chia đã thực hiện trên thực tế và điều chỉnh trên sổ sách, không xâm phạm quyền lợi của ai thì phải xác định nhà đất đó đã chuyển thành quyền sử dụng hợp pháp của các cá nhân. Việc trông coi không làm ông Hưng có quyền.","b":"Án lệ 24/2018/AL; Điều 213, Điều 218 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"lv":"VD","q":"Ba chị em nên đưa ra yêu cầu khởi kiện nào?","o":["Yêu cầu chia thừa kế toàn bộ 154,4 m² đất mà ông Hưng đang quản lý","Yêu cầu tuyên biên bản chia đất năm 2002 vô hiệu để chia lại từ đầu","Yêu cầu chia lại toàn bộ 464 m² đất của hai cụ cho 7 người con","Đòi lại quyền sử dụng 44,4 m² đã được chia đang bị chiếm hữu"],"a":3,"e":"Theo Án lệ 24/2018/AL, người được chia chỉ có quyền khởi kiện đòi lại nhà đất được chia đang bị người khác chiếm hữu (Điều 166 BLDS 2015), không có quyền yêu cầu chia di sản. Yêu cầu hủy biên bản năm 2002 đi ngược lợi ích của chính ba chị em.","b":"Án lệ 24/2018/AL; Điều 166 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.5","g":6,"lv":"VD","q":"Yêu cầu đòi lại 44,4 m² của ba chị em có bị áp dụng thời hiệu khởi kiện không?","o":["Có, thời hiệu 03 năm kể từ năm 2025 khi ông Hưng không thừa nhận","Không, vì là yêu cầu bảo vệ quyền đối với tài sản","Có, thời hiệu 30 năm kể từ năm 2000 khi cụ Hòa chết","Có, thời hiệu 10 năm kể từ năm 2002 khi lập biên bản chia đất"],"a":1,"e":"Khoản 2 Điều 155 BLDS 2015: không áp dụng thời hiệu khởi kiện đối với yêu cầu bảo vệ quyền sở hữu, trừ trường hợp luật liên quan có quy định khác (áp dụng cả với quyền sử dụng đất). Thời hiệu 30 năm là thời hiệu yêu cầu chia di sản, không phải yêu cầu đòi lại tài sản.","b":"Khoản 2 Điều 155, Điều 166 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.6","g":6,"lv":"VD","q":"Trước khi nộp đơn khởi kiện tranh chấp quyền sử dụng 44,4 m², ba chị em cần làm thủ tục gì?","o":["Hòa giải tại UBND cấp xã nơi có đất tranh chấp","Xin phép UBND tỉnh trước khi khởi kiện tranh chấp đất đai","Nộp đơn khiếu nại tới văn phòng đăng ký đất đai để điều chỉnh sổ địa chính","Không cần thủ tục gì, nộp đơn thẳng lên Tòa án nhân dân khu vực"],"a":0,"e":"Tranh chấp về việc ai là người có quyền sử dụng đất phải được hòa giải tại UBND cấp xã nơi có đất trước khi Tòa án thụ lý (Điều 235, 236 Luật Đất đai 2024). Chưa qua hòa giải thì đơn khởi kiện có thể bị trả lại. Văn phòng đăng ký đất đai không giải quyết tranh chấp.","b":"Điều 235, Điều 236 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.7","g":6,"lv":"VD","q":"Con trai ông Hưng đang làm quán trên 44,4 m². Về tố tụng, cần xử lý thế nào?","o":["Không cần quan tâm vì con ông Hưng không ký biên bản chia đất năm 2002","Khởi kiện riêng con ông Hưng bằng một vụ án khác sau khi thắng kiện ông Hưng","Đưa con ông Hưng vào tham gia tố tụng, yêu cầu di dời tài sản, trả lại đất trong cùng vụ án","Đề nghị công an phường cưỡng chế con ông Hưng di dời quán ngay"],"a":2,"e":"Người đang trực tiếp chiếm hữu, sử dụng đất có quyền, nghĩa vụ liên quan; đưa vào cùng vụ án giúp bản án thi hành được (Điều 68 BLTTDS 2015). Khởi kiện tách rời gây kéo dài; công an không có thẩm quyền cưỡng chế tranh chấp dân sự.","b":"Điều 68 BLTTDS 2015; Điều 166 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.8","g":6,"lv":"VD","q":"Rủi ro nào cần nêu rõ nếu ba chị em vẫn giữ yêu cầu \"chia thừa kế\"?","o":["Ba chị em có thể bị truy cứu trách nhiệm hình sự vì khởi kiện sai","Ba chị em mất quyền sử dụng 44,4 m² vĩnh viễn","Ông Hưng được công nhận toàn bộ 154,4 m² đất đang tranh chấp","Yêu cầu bị bác vì đất không còn là di sản; chịu án phí"],"a":3,"e":"Tòa án giải quyết trong phạm vi yêu cầu; yêu cầu chia di sản khi tài sản không còn là di sản sẽ bị bác, đương sự chịu án phí với yêu cầu không được chấp nhận (Điều 147 BLTTDS 2015). Ba chị em vẫn có thể khởi kiện đúng yêu cầu đòi lại tài sản; quyền của họ không mất.","b":"Án lệ 24/2018/AL; Điều 147 BLTTDS 2015","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"lv":"TH","q":"Bà Giang tham gia vụ việc với tư cách gì và yêu cầu của bà là gì?","o":["Người thừa kế theo pháp luật; yêu cầu chia đều thửa ruộng cho các anh chị em","Người được tặng cho; yêu cầu công nhận việc cụ Mười cho miệng năm 2010","Người quản lý di sản; yêu cầu được trả công trông coi thửa ruộng từ năm 2014","Người thừa kế theo di chúc; yêu cầu nhận cả thửa, hủy giấy của anh Út"],"a":3,"e":"Bà Giang được cụ Mười để lại thửa ruộng theo di chúc công chứng. Bà không yêu cầu chia đều; người viện dẫn việc \"cho miệng\" là anh Út; bà canh tác đất để sử dụng chứ không phải người quản lý di sản đòi công.","b":"Điều 624 BLDS 2015","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"lv":"TH","q":"Tài liệu nào giúp xác định chính xác diện tích di sản theo hướng của Án lệ 72/2024/AL?","o":["Kết quả đo đạc thực tế trong tứ cận và xác nhận không tranh chấp ranh giới của các hộ giáp ranh","Lời khai của anh Út về việc được bố cho miệng thửa ruộng năm 2010","Sổ hộ khẩu của cụ Mười thể hiện các thành viên trong gia đình","Giấy khai sinh của bà Giang để chứng minh quan hệ cha con với cụ Mười"],"a":0,"e":"Án lệ 72/2024/AL xác định di sản theo diện tích đo đạc thực tế khi di chúc có tứ cận và không có tranh chấp tứ cận. Vì vậy cần cả số đo thực tế và xác nhận các hộ giáp ranh không tranh chấp. Các tài liệu còn lại không xác định được diện tích.","b":"Án lệ 72/2024/AL","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"lv":"VD","q":"Vấn đề pháp lý mấu chốt trong tranh chấp giữa bà Giang và anh Út là gì?","o":["Xác định di sản theo diện tích nào khi di chúc chỉ ghi tứ cận","Bà Giang có phải nộp thuế sử dụng đất nông nghiệp cho phần ruộng được thừa kế không","Cụ Mười có đủ tuổi và đủ điều kiện để lập di chúc có công chứng năm 2014 không","Kênh Năm giáp phía Đông thửa ruộng có thuộc đất công do xã quản lý không"],"a":0,"e":"Anh Út dùng cụm từ \"khoảng 3 sào\" để giới hạn quyền của bà Giang. Vấn đề cốt lõi là xác định phạm vi di sản theo di chúc chỉ ghi tứ cận, đúng tình huống của Án lệ 72/2024/AL. Các vấn đề khác không bị tranh chấp.","b":"Án lệ 72/2024/AL","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"lv":"VD","q":"Theo cách tính của anh Út (3 sào, mỗi sào Bắc Bộ 360 m²), phần \"còn lại\" anh đòi chia đều là bao nhiêu?","o":["1.080 m²","3.250 m²","2.170 m²","1.250 m²"],"a":2,"e":"3 sào × 360 m² = 1.080 m²; phần \"còn lại\" theo anh Út: 3.250 − 1.080 = 2.170 m². Đây là con số luật sư cần chỉ ra để phản bác, vì theo Án lệ 72/2024/AL toàn bộ 3.250 m² trong tứ cận là di sản để lại cho bà Giang.","b":"Án lệ 72/2024/AL","cid":"TH6.03"},{"id":"TH6.03.5","g":6,"lv":"VD","q":"Áp dụng Án lệ 72/2024/AL, bà Giang được hưởng bao nhiêu diện tích?","o":["1.080 m², đúng bằng 3 sào ghi trong di chúc","3.250 m², theo diện tích đo đạc thực tế trong phạm vi tứ cận","1.625 m², chia đôi với anh Út vì anh đã có giấy chứng nhận","Không được hưởng vì di chúc không ghi diện tích cụ thể nên vô hiệu"],"a":1,"e":"Giải pháp pháp lý của Án lệ 72/2024/AL: di sản là quyền sử dụng đất được định đoạt theo di chúc hợp pháp, di chúc xác định tứ cận, không có tranh chấp tứ cận thì Tòa án xác định di sản theo diện tích đo đạc thực tế. Không ghi diện tích không làm di chúc vô hiệu.","b":"Án lệ 72/2024/AL; Điều 630 BLDS 2015","cid":"TH6.03"},{"id":"TH6.03.6","g":6,"lv":"VD","q":"Anh Út cho rằng bố đã \"cho miệng\" anh thửa ruộng năm 2010. Lập luận này được đánh giá thế nào?","o":["Có giá trị vì lời nói của cha mẹ với con cái luôn được pháp luật tôn trọng","Có giá trị vì anh Út đã được cơ quan nhà nước cấp giấy chứng nhận năm 2016","Có giá trị nếu anh Út là con trai trưởng, người thờ cúng trong gia đình","Không có căn cứ; tặng cho đất phải có văn bản, công chứng, đăng ký"],"a":3,"e":"Hợp đồng tặng cho quyền sử dụng đất phải lập thành văn bản có công chứng, chứng thực và có hiệu lực từ khi đăng ký (Điều 459 BLDS 2015; Luật Đất đai). Giấy chứng nhận cấp dựa trên lời khai không đúng có thể bị Tòa án hủy (Điều 34 BLTTDS 2015). Vị trí con trưởng không tạo ra quyền.","b":"Điều 459 BLDS 2015; Điều 34 BLTTDS 2015","cid":"TH6.03"},{"id":"TH6.03.7","g":6,"lv":"VD","q":"Phương án nào phù hợp nhất cho bà Giang?","o":["Khởi kiện công nhận theo diện tích thực tế, hủy giấy của anh Út","Đề nghị UBND xã thu hồi ngay giấy chứng nhận đã cấp cho anh Út năm 2016","Chấp nhận nhận 1.080 m² để giữ hòa khí trong gia đình, phần còn lại chia đều","Tự rào toàn bộ thửa ruộng và tiếp tục canh tác, không cần làm thủ tục gì"],"a":0,"e":"Khởi kiện tại Tòa án cho phép giải quyết cùng lúc quyền thừa kế và yêu cầu hủy quyết định cá biệt (Điều 34 BLTTDS 2015); biện pháp cấm chuyển dịch ngăn anh Út giao dịch với người thứ ba. UBND xã không có thẩm quyền thu hồi giấy chứng nhận khi đang tranh chấp; chấp nhận 1.080 m² là từ bỏ quyền có căn cứ.","b":"Án lệ 72/2024/AL; Điều 34, Điều 114 BLTTDS 2015","cid":"TH6.03"},{"id":"TH6.03.8","g":6,"lv":"VD","q":"Rủi ro nào cần cảnh báo bà Giang?","o":["Di chúc công chứng có thể bị thay thế bằng lời khai của anh Út về việc cho miệng","Nếu đất là tài sản chung thì di chúc chỉ có hiệu lực một phần; nếu tứ cận bị tranh chấp thì phải xác định lại","Bà Giang phải trả lại toàn bộ hoa lợi thu được từ thửa ruộng kể từ năm 2014","Thời hiệu yêu cầu chia di sản của cụ Mười đã hết vì cụ chết từ năm 2018"],"a":1,"e":"Hồ sơ cho thấy cụ khai hoang sau khi góa vợ nên là tài sản riêng, nhưng nếu có chứng cứ khác thì phạm vi di chúc thu hẹp (Điều 643); Án lệ 72/2024/AL chỉ áp dụng khi không tranh chấp tứ cận. Lời khai không thay được di chúc công chứng; bà Giang canh tác hợp pháp; thời hiệu 30 năm còn đến năm 2048.","b":"Điều 623, Điều 643 BLDS 2015; Án lệ 72/2024/AL","cid":"TH6.03"},{"id":"TH6.04.1","g":6,"lv":"TH","q":"Chị Phượng có tư cách gì trong vụ án chia di sản?","o":["Người thừa kế thế vị của bà Ngự vì đã chăm sóc bà nội đến khi mất","Người có quyền lợi, nghĩa vụ liên quan đang quản lý, sử dụng di sản","Nguyên đơn trong vụ án chia di sản do bà Thưởng, bà Xuân khởi kiện","Người làm chứng về việc ông bà nội không để lại di chúc"],"a":1,"e":"Chị Phượng không khởi kiện và không phải người thừa kế (bố chị còn sống nên không có thừa kế thế vị theo Điều 652). Việc giải quyết vụ án ảnh hưởng đến chỗ ở và công sức của chị nên chị là người có quyền lợi, nghĩa vụ liên quan (khoản 4 Điều 68 BLTTDS 2015).","b":"Điều 652 BLDS 2015; Điều 68 BLTTDS 2015","cid":"TH6.04"},{"id":"TH6.04.2","g":6,"lv":"TH","q":"Để chứng minh công sức quản lý, tôn tạo di sản, chị Phượng cần cung cấp những gì?","o":["Hóa đơn, hợp đồng sửa chữa năm 2019, chứng từ chi phí và người làm chứng","Giấy khai sinh của bà Thưởng để chứng minh quan hệ với người để lại di sản","Giấy phép kinh doanh của ông Đức để xác định khả năng thanh toán giá trị","Bản án ly hôn của ông Trải để xác định chị Phượng sống với ai từ nhỏ"],"a":0,"e":"Công sức tôn tạo được chứng minh bằng chứng từ chi phí sửa chữa, bảo quản; công sức chăm sóc, quản lý cần lời khai người làm chứng. Các giấy tờ của người thừa kế khác không chứng minh công sức của chị Phượng.","b":"Án lệ 05/2016/AL; Điều 91 BLTTDS 2015","cid":"TH6.04"},{"id":"TH6.04.3","g":6,"lv":"VD","q":"Vì sao chị Phượng không phải là người thừa kế di sản của ông bà nội?","o":["Vì chị là cháu gái nên không được hưởng di sản của ông bà nội theo tập quán","Vì ông bà không để lại di chúc nên chỉ các con mới được hưởng di sản","Vì bố chị còn sống nên không có thừa kế thế vị","Vì chị đã thành niên và có khả năng lao động"],"a":2,"e":"Điều 652 BLDS 2015: cháu được hưởng phần di sản mà cha, mẹ của cháu được hưởng nếu còn sống khi cha, mẹ của cháu chết trước hoặc cùng thời điểm với người để lại di sản. Ông Trải còn sống, thuộc hàng thừa kế thứ nhất, nên chị Phượng không thừa kế. Giới tính, tuổi không phải là điều kiện.","b":"Điều 651, Điều 652 BLDS 2015","cid":"TH6.04"},{"id":"TH6.04.4","g":6,"lv":"VD","q":"Theo Án lệ 05/2016/AL, công sức quản lý, tôn tạo di sản của chị Phượng được xem xét thế nào?","o":["Tòa án phải xem xét dù chưa có yêu cầu; nên đưa yêu cầu độc lập","Chỉ được xem xét nếu tất cả bốn người thừa kế đồng ý bằng văn bản","Không được xem xét vì chị Phượng không phải người thừa kế của ông bà nội","Chỉ được xem xét nếu chị Phượng khởi kiện thành một vụ án riêng sau khi chia xong"],"a":0,"e":"Án lệ 05/2016/AL: Tòa án phải xem xét công sức đóng góp vào việc quản lý, tôn tạo di sản và nhu cầu chỗ ở của người đang quản lý dù họ chưa yêu cầu. Kỹ năng tư vấn tốt là chủ động đưa yêu cầu độc lập (Điều 201 BLTTDS 2015) để Tòa án xem xét đầy đủ, có số liệu cụ thể.","b":"Án lệ 05/2016/AL; Điều 201 BLTTDS 2015","cid":"TH6.04"},{"id":"TH6.04.5","g":6,"lv":"VD","q":"Ông Trải định làm văn bản \"từ chối nhận di sản\" để chị Phượng được nhận phần của ông. Tư vấn thế nào là đúng?","o":["Đúng, phần di sản bị từ chối đương nhiên chuyển cho con của người từ chối","Không nên; phần bị từ chối chia cho người thừa kế khác, ông nên nhận rồi giao cho con","Đúng, nếu văn bản từ chối nhận di sản được công chứng và ghi rõ người nhận","Ông Trải không được định đoạt phần thừa kế của mình khi chưa chia di sản xong"],"a":1,"e":"Điều 620 BLDS 2015 cho phép từ chối nhận di sản; khi đó người từ chối không được hưởng và phần di sản được chia cho những người thừa kế còn lại cùng hàng (Điều 651). Muốn chị Phượng được hưởng, ông Trải phải nhận rồi định đoạt cho chị (thỏa thuận trong vụ án hoặc tặng cho).","b":"Điều 457, Điều 620, Điều 651 BLDS 2015","cid":"TH6.04"},{"id":"TH6.04.6","g":6,"lv":"VD","q":"Nhà định giá 6 tỷ đồng, không trích công sức. Phần di sản của mỗi người con (trong đó có ông Trải) là bao nhiêu?","o":["1,2 tỷ đồng","3 tỷ đồng","0,75 tỷ đồng","1,5 tỷ đồng"],"a":3,"e":"Ông Hưng chết trước: ½ nhà (3 tỷ) chia cho 5 người (bà Ngự và 4 con), mỗi người 0,6 tỷ. Bà Ngự chết sau: 3 + 0,6 = 3,6 tỷ chia 4 con, mỗi người 0,9 tỷ. Mỗi con: 0,6 + 0,9 = 1,5 tỷ đồng, tức ¼ giá trị nhà (Điều 651 BLDS 2015). 1,2 tỷ là chia nhầm 6 tỷ cho 5 người.","b":"Điều 651, Điều 660 BLDS 2015","cid":"TH6.04"},{"id":"TH6.04.7","g":6,"lv":"VD","q":"Giả sử Tòa án trích 400 triệu đồng thanh toán công sức, chi phí cho chị Phượng rồi mới chia phần còn lại. Mỗi người con được bao nhiêu?","o":["1,4 tỷ đồng","1,5 tỷ đồng","1,1 tỷ đồng","1,6 tỷ đồng"],"a":0,"e":"Khoản thanh toán công sức, chi phí bảo quản được trừ trước khi chia (Điều 658, Điều 660 BLDS 2015; Án lệ 05/2016/AL): 6.000 − 400 = 5.600 triệu đồng; chia 4: 1.400 triệu đồng = 1,4 tỷ đồng mỗi người.","b":"Điều 658, Điều 660 BLDS 2015; Án lệ 05/2016/AL","cid":"TH6.04"},{"id":"TH6.04.8","g":6,"lv":"VD","q":"Khuyến nghị nào phù hợp nhất cho chị Phượng?","o":["Không tham gia tố tụng vì chị không phải người thừa kế nên không bị ảnh hưởng","Tự ý thay khóa cửa, không cho bà Thưởng, bà Xuân vào nhà cho đến khi xử xong","Nộp yêu cầu độc lập về công sức, chi phí; ông Trải đề nghị giao phần của mình cho chị; chuẩn bị tài chính","Tố cáo bà Thưởng, bà Xuân về tội chiếm đoạt tài sản vì đòi chia nhà"],"a":2,"e":"Đây là cách tận dụng Án lệ 05/2016/AL và quyền định đoạt của ông Trải, đồng thời tạo cơ sở để chị tiếp tục ở. Vắng mặt làm mất quyền trình bày; tự thay khóa có thể xâm phạm quyền của đồng thừa kế; việc các cô khởi kiện chia di sản là hợp pháp, không có dấu hiệu tội phạm.","b":"Án lệ 05/2016/AL; Điều 201 BLTTDS 2015; Điều 660 BLDS 2015","cid":"TH6.04"}],"vb":[{"name":"Văn bản nền tảng","rows":[{"t":"Bộ luật Dân sự số 91/2015/QH13","d":"24/11/2015","org":"Quốc hội","note":"Căn cứ chính của học phần.","url":"https://hethongphapluat.com/bo-luat-dan-su-2015"},{"t":"Luật Luật sư số 65/2006/QH11, được sửa đổi, bổ sung năm 2012","d":"29/06/2006","org":"Quốc hội","note":"Tham khảo cho hoạt động cung cấp dịch vụ pháp lý."},{"t":"Luật Trợ giúp pháp lý số 11/2017/QH14","d":"20/06/2017","org":"Quốc hội","note":"Tham khảo khi xác định phạm vi trợ giúp pháp lý."},{"t":"Luật Công chứng số 46/2024/QH15","d":"26/11/2024","org":"Quốc hội","note":"Áp dụng khi tư vấn giao dịch, hồ sơ công chứng và thừa kế."},{"t":"Nghị quyết số 02/2022/NQ-HĐTP","d":"06/09/2022","org":"Hội đồng Thẩm phán TAN hiệt hại khi tài sản bị xâm phạm","c":[]},{"t":"Thiệt hại khi danh dự, nhân phẩm, uy tín bị xâm phạm","c":[]},{"t":"Mức bồi thường theo thỏa thuận và quy định pháp luật","c":[]}]}],"cs":"Bộ luật Dân sự 2015; Nghị quyết 02/2022/NQ-HĐTP"},{"t":"Chương 6. Kỹ năng tư vấn pháp luật về thừa kế","c":[{"t":"Chủ thể trong quan hệ thừa kế","c":[{"t":"Người có quyền để lại di sản","c":[]},{"t":"Người được hưởng di sản","c":[]},{"t":"Người quản lý di sản","c":[]},{"t":"Người được di tặng","c":[]}]},{"t":"Các hình thức thừa kế","c":[{"t":"Thừa kế theo di chúc","c":[]},{"t":"Thừa kế theo pháp luật","c":[]}]},{"t":"Di sản và phân chia di sản","c":[{"t":"Xác định di sản","c":[]},{"t":"Thanh toán nghĩa vụ tài sản do người chết để lại","c":[]},{"t":"Xác định người được hưởng di sản","c":[]},{"t":"Phân chia di sản","c":[]}]}],"cs":"Bộ luật Dân sự 2015; pháp luật liên quan"}]},"th":[{"name":"Chương 2. Kỹ năng tư vấn về chủ thể quan hệ pháp luật dân sự","items":[{"cid":"TH2.01","title":"Con trai mất khả năng nhận thức, vợ \"trả chồng\" về nhà cha mẹ — Nguồn: Hồ sơ TVPLDS 1 – Tư vấn pháp luật cá nhân","text":"Anh Trần Văn Bảo đăng ký kết hôn với chị Nguyễn Thị Hiền năm 2007 tại UBND xã S. Cuối năm 2024, anh Bảo bị tai nạn giao thông, chấn thương sọ não, hôn mê hơn một tháng; sau đó bị liệt nửa người, không nói được, nằm một chỗ, không tự chăm sóc bản thân. UBND xã S đã cấp cho anh giấy xác nhận khuyết tật dạng thần kinh, tâm thần và anh được hưởng trợ cấp xã hội hằng tháng. Ngày 12/6/2026, chị Hiền viết \"Giấy trả chồng\", giao anh Bảo cho cha mẹ anh là ông Trần Văn Tư và bà Lê Thị Kim chăm sóc rồi về sống với cha mẹ đẻ. Từ đó, chị Hiền không thăm hỏi, không đóng góp chi phí, chỉ đưa lại 1.200.000 đồng tiền trợ cấp một lần. Ông Tư, bà Kim phải dùng tiền của gia đình để nuôi dưỡng, chữa bệnh cho anh Bảo; tiền trợ cấp và một sổ tiết kiệm đứng tên anh Bảo hiện do chị Hiền giữ. Ngày 02/11/2026, ông Tư đến văn phòng luật sư hỏi: tình trạng pháp lý của anh Bảo là gì; ai có quyền chăm sóc, đại diện và quản lý tài sản cho anh Bảo; gia đình ông phải làm thủ tục gì.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là ông Trần Văn Tư (cha đẻ anh Bảo), người đang trực tiếp nuôi dưỡng anh Bảo. Yêu cầu: xác định tình trạng năng lực hành vi dân sự của anh Bảo; xác định người giám hộ, người đại diện, người quản lý tài sản của anh Bảo. Giấy tờ cần có, cần bổ sung: giấy tờ tùy thân của ông Tư, anh Bảo; giấy chứng nhận kết hôn; giấy khai sinh của các con anh Bảo (nếu có) để biết anh Bảo có con thành niên không; hồ sơ bệnh án, giấy xác nhận khuyết tật; \"Giấy trả chồng\"; thông tin sổ tiết kiệm, quyết định hưởng trợ cấp.","Xác định vấn đề pháp lý: (i) anh Bảo thuộc tình trạng mất năng lực hành vi dân sự hay có khó khăn trong nhận thức, làm chủ hành vi — chỉ Tòa án tuyên bố được, trên cơ sở kết luận giám định pháp y tâm thần; (ii) người giám hộ đương nhiên của anh Bảo là ai (vợ trước, rồi đến con cả thành niên, cuối cùng là cha mẹ); chị Hiền bỏ mặc có là căn cứ thay đổi người giám hộ không; (iii) quản lý tài sản, tiền trợ cấp của người được giám hộ; (iv) nghĩa vụ chăm sóc của vợ chồng.","Xác định luật áp dụng: tuyên bố mất năng lực hành vi dân sự → Điều 22 BLDS 2015 (khó khăn nhận thức → Điều 23); giám hộ → Điều 46, 47, 49, 53, 54 BLDS 2015 (khoản 1 Điều 53: vợ là người giám hộ của chồng mất năng lực hành vi; khoản 2: con cả; khoản 3: cha mẹ); thay đổi người giám hộ → Điều 60; quản lý tài sản → Điều 59; người giám hộ là người đại diện theo pháp luật → Điều 136; thủ tục → khoản 1 Điều 27, Điều 376–378 BLTTDS 2015; đăng ký giám hộ → Luật Hộ tịch 2014; nghĩa vụ chăm sóc giữa vợ chồng → Điều 19 Luật HNGĐ 2014.","Phương án giải quyết: phương thức tố tụng dân sự — yêu cầu giải quyết việc dân sự. Bước 1: ông Tư (người có quyền, lợi ích liên quan) nộp đơn yêu cầu Tòa án tuyên bố anh Bảo mất năng lực hành vi dân sự, kèm đề nghị trưng cầu giám định pháp y tâm thần. Bước 2: xác định người giám hộ — chị Hiền là người giám hộ đương nhiên nhưng đã từ bỏ việc chăm sóc, giữ tiền của anh Bảo, nên có căn cứ yêu cầu thay đổi người giám hộ (người giám hộ vi phạm nghiêm trọng nghĩa vụ, không còn đủ điều kiện); nếu anh Bảo không có con thành niên đủ điều kiện thì ông Tư, bà Kim là người giám hộ đương nhiên. Bước 3: đăng ký giám hộ tại UBND cấp xã; yêu cầu chị Hiền bàn giao sổ tiết kiệm, tiền trợ cấp (lập biên bản). Có thể kết hợp thương lượng với chị Hiền để chị đồng ý chuyển việc giám hộ. Khả thi cao vì có hồ sơ bệnh án, xác nhận khuyết tật và văn bản \"trả chồng\".","Trả lời tư vấn: rủi ro — chưa có quyết định của Tòa án thì ông Tư chưa có tư cách đại diện cho anh Bảo trong giao dịch (rút tiết kiệm, nhận trợ cấp); chị Hiền vẫn là vợ hợp pháp, có thể xác lập giao dịch với tài sản của anh Bảo. Khuyến nghị: nộp đơn yêu cầu ngay, lưu giữ hóa đơn chi phí chăm sóc; khi đã là người giám hộ, việc định đoạt tài sản có giá trị lớn của anh Bảo phải có sự đồng ý của người giám sát việc giám hộ. Hình thức tư vấn: bằng văn bản, vì khách hàng cần lộ trình thủ tục nhiều bước và danh mục giấy tờ để thực hiện."],"basis":"Điều 19 Luật HNGĐ 2014; Điều 22, 23, 46, 47, 49, 53, 54, 59, 60, 136 BLDS 2015; khoản 1 Điều 27, Điều 376–378 BLTTDS 2015","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4","TH2.01.5","TH2.01.6","TH2.01.7","TH2.01.8"]},{"cid":"TH2.02","title":"Người giám hộ vừa đại diện cho cha, vừa được bà nội tặng cho đất — Nguồn: Bản án số 815/2024/DS-PT (Hồ sơ TVPLDS 5 – Thừa kế)","text":"Cụ Trần Minh Đức (chết năm 1998) và cụ Châu Thị Nhàn (chết năm 2007) không để lại di chúc chung; hai cụ có 4 người con: bà Dung, ông Tâm, ông Vinh và bà Thủy. Hai cụ tạo lập được thửa đất ở 189,5 m² và thửa đất vườn 2.030,6 m², hiện do ông Vinh quản lý. Năm 2020, Tòa án tuyên bố ông Tâm mất năng lực hành vi dân sự; vợ ông Tâm đã chết, anh Trần Huy Cường (con cả) là người giám hộ, đã đăng ký giám hộ tại UBND xã. Năm 2007, trước khi chết, cụ Nhàn (80 tuổi, không biết chữ) ký hợp đồng tặng cho anh Cường 127,1 m² trong thửa đất ở; anh Cường đã được cấp giấy chứng nhận. Ông Vinh cho rằng cụ Nhàn đã cho ông thửa đất ở từ năm 1995 và lập di chúc năm 2005 cho ông; ông tuyên bố nếu bị kiện chia thừa kế sẽ yêu cầu hủy hợp đồng tặng cho năm 2007 vì cụ Nhàn không biết chữ, không có người làm chứng. Tháng 10/2026, anh Cường đến hỏi: anh có thể nhân danh ông Tâm khởi kiện chia di sản của ông bà nội, đồng thời tự bảo vệ hợp đồng tặng cho của mình trong cùng vụ án không?","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là anh Trần Huy Cường, có hai tư cách: người giám hộ (đại diện theo pháp luật) của ông Tâm và cá nhân được cụ Nhàn tặng cho 127,1 m². Yêu cầu: khởi kiện chia di sản cho ông Tâm và bảo vệ quyền sử dụng 127,1 m². Cần bổ sung: quyết định tuyên bố ông Tâm mất năng lực hành vi dân sự; giấy đăng ký giám hộ; giấy chứng tử hai cụ; giấy tờ nhân thân các con; giấy chứng nhận hai thửa đất; hợp đồng tặng cho năm 2007 (có công chứng, chứng thực không, có người làm chứng không); bản di chúc năm 2005 mà ông Vinh nêu.","Xác định vấn đề pháp lý: quan hệ thừa kế theo pháp luật (di sản của cụ Đức), thừa kế theo di chúc hoặc theo pháp luật (di sản của cụ Nhàn); quan hệ giám hộ, đại diện trong tố tụng. Vấn đề cần làm rõ: (i) người giám hộ có quyền nhân danh người mất năng lực hành vi khởi kiện không; (ii) anh Cường có được làm người đại diện cho ông Tâm khi lợi ích của anh đối lập với lợi ích của ông Tâm (nếu hợp đồng tặng cho bị hủy thì 127,1 m² trở lại khối di sản, phần của ông Tâm tăng lên) không; (iii) ai đại diện thay; (iv) thời hiệu chia di sản.","Xác định luật áp dụng: giám hộ, đại diện → Điều 22, 53, 58, 136 BLDS 2015; năng lực hành vi tố tụng → Điều 69 BLTTDS 2015 (người mất năng lực hành vi dân sự thực hiện quyền, nghĩa vụ tố tụng qua người đại diện); người không được làm đại diện → điểm a khoản 1 Điều 87 BLTTDS 2015; chỉ định người đại diện → Điều 88 BLTTDS 2015; thay đổi người giám hộ → Điều 60 BLDS 2015; thời hiệu → khoản 1 Điều 623 BLDS 2015 (30 năm với bất động sản: di sản cụ Đức đến năm 2028, cụ Nhàn đến năm 2037); di chúc → Điều 630 BLDS 2015.","Phương án giải quyết: phương thức thỏa thuận (họp gia đình phân chia) trước; không đạt thì tố tụng dân sự. Phân tích: anh Cường là người giám hộ nên về nguyên tắc được nhân danh ông Tâm khởi kiện; nhưng trong cùng vụ án, nếu ông Vinh yêu cầu hủy hợp đồng tặng cho thì quyền lợi của anh Cường (giữ 127,1 m²) đối lập với quyền lợi của ông Tâm (127,1 m² nhập lại di sản) → anh Cường không được làm người đại diện cho ông Tâm (điểm a khoản 1 Điều 87). Phương án: (1) đề nghị người con khác của ông Tâm đủ điều kiện làm người giám hộ, hoặc đề nghị Tòa án chỉ định người đại diện cho ông Tâm (Điều 88); (2) anh Cường tham gia với tư cách người có quyền lợi, nghĩa vụ liên quan để bảo vệ hợp đồng tặng cho (cung cấp hồ sơ công chứng/chứng thực, người làm chứng); (3) khởi kiện sớm vì thời hiệu chia di sản của cụ Đức hết năm 2028. Khả thi: yêu cầu chia di sản có căn cứ; hiệu lực hợp đồng tặng cho phụ thuộc hình thức lập năm 2007.","Trả lời tư vấn: rủi ro — nếu anh Cường vẫn làm người đại diện cho ông Tâm, Tòa án không chấp nhận tư cách đại diện, kéo dài vụ án; nếu thời điểm tặng cho cụ Nhàn không biết chữ mà không có người làm chứng, hợp đồng có thể bị tuyên vô hiệu về hình thức. Khuyến nghị: chuẩn bị người đại diện khác cho ông Tâm trước khi nộp đơn; thu thập hồ sơ chứng thực năm 2007; tránh nhận mình làm người đại diện cho cả hai lợi ích. Hình thức tư vấn: bằng văn bản, vì vụ việc nhiều chủ thể, nhiều yêu cầu và khách hàng cần tài liệu để trao đổi với gia đình."],"basis":"Điều 22, 53, 58, 60, 136, 623, 630 BLDS 2015; Điều 69, Điều 87, Điều 88 BLTTDS 2015","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4","TH2.02.5","TH2.02.6","TH2.02.7","TH2.02.8"]},{"cid":"TH2.03","title":"Người thừa kế mang quốc tịch nước ngoài muốn nhận nhà bằng hiện vật — Nguồn: Án lệ số 68/2023/AL","text":"Cụ Lý Vĩnh Khang chết năm 2012, cụ Nguyễn Ngọc Hoa chết năm 2013, đều không để lại di chúc. Di sản là nhà, đất 698 m² tại quận P, TP. Hồ Chí Minh. Hai cụ có hai người con: bà Lý Túy Hằng (sống tại Việt Nam) và bà Lý Lan Hương (sinh tại Việt Nam, định cư tại Hoa Kỳ từ năm 1990, đã mang quốc tịch Hoa Kỳ, không còn quốc tịch Việt Nam, nhập cảnh Việt Nam bằng hộ chiếu Hoa Kỳ có thị thực). Anh Nguyễn Quang Dũng (cháu ruột cụ Hoa) ở cùng, chăm sóc hai cụ và trông nom nhà đất từ năm 2013 đến nay. Bà Hằng khởi kiện chia di sản. Anh Dũng đề nghị được hưởng công sức và được nhận hiện vật phần của bà Hương, thanh toán giá trị cho bà vì cho rằng người nước ngoài không được nhận nhà đất. Bà Hương ủy quyền cho người thân liên hệ luật sư, muốn nhận phần của mình bằng hiện vật để về Việt Nam sinh sống.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là bà Lý Lan Hương — người thừa kế hàng thứ nhất, người gốc Việt Nam định cư ở nước ngoài, tham gia qua người đại diện theo ủy quyền. Yêu cầu: được chia di sản và nhận hiện vật là nhà ở. Cần bổ sung: văn bản ủy quyền hợp lệ (công chứng tại cơ quan đại diện Việt Nam ở nước ngoài hoặc hợp pháp hóa lãnh sự); hộ chiếu, thị thực, giấy tờ chứng minh gốc Việt Nam; giấy chứng tử hai cụ; giấy tờ nhà đất; tài liệu về công sức của anh Dũng.","Xác định vấn đề pháp lý: thừa kế theo pháp luật; năng lực chủ thể của người gốc Việt Nam định cư ở nước ngoài đối với nhà ở, quyền sử dụng đất ở. Vấn đề cần làm rõ: (i) người để lại di sản chết trước khi Luật Đất đai 2013, Luật Nhà ở 2014 có hiệu lực nhưng tranh chấp giải quyết nay thì áp dụng luật nào; (ii) bà Hương có thuộc đối tượng được sở hữu nhà ở tại Việt Nam để nhận hiện vật không; (iii) công sức của anh Dũng được xem xét thế nào.","Xác định luật áp dụng: Án lệ số 68/2023/AL (áp dụng pháp luật về đất đai, nhà ở có hiệu lực tại thời điểm giải quyết; người Việt Nam định cư ở nước ngoài đủ điều kiện sở hữu nhà ở được nhận di sản là nhà ở bằng hiện vật); Điều 44 Luật Đất đai 2024 (người gốc Việt Nam định cư ở nước ngoài được phép nhập cảnh được sở hữu nhà ở gắn liền với quyền sử dụng đất ở; không thuộc đối tượng thì chỉ được hưởng giá trị); Điều 8 Luật Nhà ở 2023; Điều 650, 651, 660 BLDS 2015 (chia di sản); khoản 1 Điều 623 BLDS 2015 (thời hiệu 30 năm).","Phương án giải quyết: phương thức tố tụng dân sự (bà Hương là bị đơn hoặc người có quyền lợi liên quan trong vụ án chia di sản), kết hợp thỏa thuận phân chia hiện vật. Phân tích: theo Án lệ 68/2023/AL, Tòa án áp dụng pháp luật đất đai, nhà ở hiện hành; bà Hương là người gốc Việt Nam, được phép nhập cảnh, thuộc đối tượng được sở hữu nhà ở gắn liền với đất ở (Điều 44 Luật Đất đai 2024) nên được nhận hiện vật nếu di sản chia được bằng hiện vật. Việc giao toàn bộ phần của bà Hương cho anh Dũng với lý do bà là người nước ngoài là không có căn cứ. Công sức trông nom, bảo quản của anh Dũng được xem xét bằng một khoản tiền hoặc phần giá trị, không làm mất quyền nhận hiện vật của bà Hương. Khả thi cao vì có án lệ.","Trả lời tư vấn: rủi ro — văn bản ủy quyền lập ở nước ngoài không hợp lệ thì người đại diện không được tham gia tố tụng; nếu nhà đất không chia được bằng hiện vật (diện tích, kết cấu) thì bà Hương có thể phải nhận giá trị; phải chịu một phần chi phí trả công sức cho anh Dũng. Khuyến nghị: hoàn thiện ủy quyền, giấy tờ chứng minh gốc Việt; yêu cầu Tòa án áp dụng Án lệ 68/2023/AL; đề xuất phương án chia hiện vật cụ thể. Hình thức tư vấn: bằng văn bản (thư tư vấn gửi qua người đại diện, thư điện tử), vì khách hàng ở nước ngoài và cần văn bản để ủy quyền."],"basis":"Án lệ 68/2023/AL; Điều 44 Luật Đất đai 2024; Điều 8 Luật Nhà ở 2023; Điều 138, 623, 650, 651, 660 BLDS 2015","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4","TH2.03.5","TH2.03.6","TH2.03.7","TH2.03.8"]},{"cid":"TH2.04","title":"Thành viên nhờ người khác đứng tên vốn góp và chức danh giám đốc — Nguồn: Bản án số 74/2025/KDTM-PT (Hồ sơ TVPLDS 2 – Pháp nhân)","text":"Công ty TNHH S (công ty TNHH hai thành viên trở lên) có vốn điều lệ 15 tỷ đồng, 3 thành viên mỗi người đứng tên 5 tỷ đồng. Ngày 21/9/2015, Hội đồng thành viên họp, thống nhất để ông Nguyễn Mạnh Đông (em ruột ông Nguyễn Mạnh Hùng) đứng tên thay phần vốn góp của ông Hùng và giữ chức danh giám đốc, đại diện theo pháp luật, để vay vốn ngân hàng (vì ông Hùng có nợ xấu); khi vay xong ông Đông sẽ trả lại vốn góp và chức danh. Ông Đông không vay được vốn nhưng không trả lại. Biên bản họp Hội đồng thành viên ngày 28/5/2018 xác nhận ông Hùng thực góp 11.293.869.000 đồng. Bản án phúc thẩm năm 2021 xác định ông Hùng đã chuyển nhượng cho người khác 2.934.172.000 đồng, công nhận ông Hùng có phần vốn góp 8.359.697.000 đồng (55,7313%), nhưng không xác định phần vốn còn lại của ai nên không thi hành được. Năm 2019, công ty đã đăng ký thay đổi lần thứ 7, ghi 3 thành viên khác (không có ông Hùng) mỗi người 33,33%. Tháng 10/2026, ông Hùng nhờ tư vấn để được ghi nhận là thành viên, lấy lại quyền quản lý công ty.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là ông Nguyễn Mạnh Hùng — người thực góp vốn, đã được bản án công nhận phần vốn góp. Yêu cầu: được ghi nhận là thành viên, cập nhật đăng ký doanh nghiệp, lấy lại quyền quản lý. Giấy tờ đã có: biên bản họp ngày 21/9/2015, 28/5/2018; bản án phúc thẩm năm 2021. Cần bổ sung: điều lệ công ty, sổ đăng ký thành viên, giấy chứng nhận đăng ký doanh nghiệp các lần thay đổi; chứng từ góp vốn; hồ sơ thi hành án và quyết định/thông báo không thi hành được; nghị quyết Hội đồng thành viên năm 2018, 2019.","Xác định vấn đề pháp lý: tranh chấp giữa thành viên công ty về phần vốn góp, tư cách thành viên và người đại diện theo pháp luật của pháp nhân. Vấn đề cần làm rõ: (i) hiệu lực của thỏa thuận nhờ đứng tên vốn góp, chức danh nhằm vay vốn ngân hàng khi người góp thật có nợ xấu; (ii) cơ cấu vốn góp hiện nay của các thành viên sau bản án năm 2021; (iii) cách xử lý bản án không thi hành được; (iv) thủ tục cập nhật đăng ký doanh nghiệp và người đại diện theo pháp luật.","Xác định luật áp dụng: pháp nhân, đại diện của pháp nhân → Điều 74, 85, 137 BLDS 2015; giao dịch giả tạo → Điều 124 BLDS 2015; công ty TNHH hai thành viên trở lên, góp vốn, sổ đăng ký thành viên → Điều 46, 47, 48 Luật Doanh nghiệp 2020; người đại diện theo pháp luật → Điều 12 Luật Doanh nghiệp 2020; tranh chấp giữa các thành viên công ty → khoản 4 Điều 30 BLTTDS 2015; giải thích bản án → Điều 486 BLTTDS 2015; không khởi kiện lại yêu cầu đã được giải quyết → điểm c khoản 1 Điều 192 BLTTDS 2015.","Phương án giải quyết: phương thức thỏa thuận nội bộ (họp Hội đồng thành viên) trước; không đạt thì tố tụng dân sự — vụ án kinh doanh, thương mại; sau đó thủ tục hành chính đăng ký thay đổi doanh nghiệp. Phân tích: thỏa thuận để ông Đông đứng tên thay nhằm vay vốn trong khi ông Hùng có nợ xấu là giao dịch che giấu chủ thể thật đối với ngân hàng, nhưng phần vốn ông Hùng thực góp đã được bản án công nhận (8.359.697.000 đồng, 55,7313%); phần còn lại 6.640.303.000 đồng (44,2687%) chưa xác định chủ. Phương án: (1) đề nghị Tòa án đã xử giải thích bản án nếu nội dung chưa rõ; (2) khởi kiện yêu cầu xác định phần vốn góp còn lại của các thành viên khác và tư cách thành viên của ông Hùng (yêu cầu mới, không trùng yêu cầu đã giải quyết); (3) có bản án rồi thì công ty làm thủ tục thay đổi đăng ký thành viên, triệu tập Hội đồng thành viên bầu lại người đại diện theo pháp luật. Khả thi: phần vốn của ông Hùng đã có bản án xác nhận nên có lợi thế.","Trả lời tư vấn: rủi ro — khởi kiện lại đúng yêu cầu đã được bản án giải quyết sẽ bị trả lại đơn hoặc đình chỉ; ông Đông, với tư cách đại diện theo pháp luật, có thể xác lập giao dịch bất lợi (chuyển nhượng, thế chấp tài sản công ty); thỏa thuận đứng tên thay để lách điều kiện vay vốn có thể bị xem xét trách nhiệm. Khuyến nghị: yêu cầu biện pháp khẩn cấp tạm thời cấm thay đổi hiện trạng tài sản, cấm chuyển dịch phần vốn góp; xác định đúng yêu cầu khởi kiện mới; chuẩn bị chứng cứ góp vốn. Hình thức tư vấn: bằng văn bản, vì vụ việc doanh nghiệp phức tạp, nhiều văn bản và cần phương án tố tụng rõ ràng."],"basis":"Điều 74, 85, 124, 137 BLDS 2015; Điều 12, 46, 47, 48 Luật Doanh nghiệp 2020; khoản 4 Điều 30, Điều 192, Điều 486 BLTTDS 2015","mcq":["TH2.04.1","TH2.04.2","TH2.04.3","TH2.04.4","TH2.04.5","TH2.04.6","TH2.04.7","TH2.04.8"]}]},{"name":"Chương 3. Kỹ năng tư vấn về tài sản, quyền sở hữu và các quyền khác đối với tài sản","items":[{"cid":"TH3.01","title":"Nhà bên cạnh gác đòn tay lên tường, mái tôn lấn sang không gian — Nguồn: Bản án số 307/2024/DS-PT (Hồ sơ TVPLDS 3 – Tài sản)","text":"Vợ chồng cụ Nguyễn Cửu Lâm và cụ Hà Thị Sương (đều đã chết, không để lại di chúc) có nhà và đất 172 m² tại phường M, được UBND tỉnh cấp giấy chứng nhận năm 2001 đứng tên hai cụ. Theo giấy chứng nhận, tường phía Tây là một đường thẳng dài 20,88 m, dày 0,25 m. Nhà liền kề phía Tây của ông Hà Văn Nam (nhà mua năm 1970, đất chưa có giấy tờ) đã tự ý gác đòn tay, xà ngang lên đoạn tường dài 8,63 m; mái tôn, đuôi mái ngói và máng xối lấn sang không gian phía trên thửa đất của hai cụ, nước mưa từ mái nhà ông Nam đổ xuống sân nhà hai cụ. Khi các con của hai cụ xây cao tường thì vướng các vật này; ông Nam không tháo dỡ. UBND phường hòa giải không thành. Ông Nam cho rằng bức tường là của ông, đã tồn tại hơn 50 năm, hai nhà cùng sử dụng không tranh chấp; nếu bị kiện ông sẽ yêu cầu hủy giấy chứng nhận đã cấp cho hai cụ. Ông Nguyễn Cửu Hiệp (một trong 11 người con, cháu của hai cụ) đến văn phòng luật sư, đại diện cho anh chị em nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là ông Nguyễn Cửu Hiệp — một trong các đồng thừa kế của cụ Lâm, cụ Sương; ông muốn đại diện cho các anh chị em. Yêu cầu: buộc ông Nam tháo dỡ đòn tay, xà, mái tôn, máng xối; trả lại nguyên trạng đoạn tường 8,63 m; xử lý nước mưa. Cần bổ sung: giấy chứng nhận năm 2001 và hồ sơ cấp giấy (biên bản xác định ranh giới, mốc giới năm 1999 có chữ ký của hộ liền kề); giấy chứng tử hai cụ, giấy tờ xác định những người thừa kế; văn bản ủy quyền của các đồng thừa kế cho ông Hiệp; biên bản hòa giải tại UBND phường; ảnh hiện trạng, vi bằng.","Xác định vấn đề pháp lý: quan hệ quyền sở hữu và quyền đối với bất động sản liền kề. Vấn đề cần làm rõ: (i) tư cách khởi kiện của ông Hiệp (tài sản là di sản chưa chia, thuộc nhiều đồng thừa kế); (ii) bức tường thuộc quyền sở hữu của ai, ranh giới giữa hai thửa xác định theo căn cứ nào; (iii) việc gác kết cấu lên tường, lấn không gian, để nước mưa chảy sang có trái pháp luật không; (iv) ông Nam có thể xác lập quyền sở hữu bức tường theo thời hiệu không; (v) yêu cầu hủy giấy chứng nhận của ông Nam.","Xác định luật áp dụng: ranh giới, không gian theo chiều thẳng đứng → Điều 175 BLDS 2015; mốc giới ngăn cách, tường chung → Điều 176 BLDS 2015; nước mưa từ mái nhà → Điều 250 BLDS 2015; bảo vệ quyền sở hữu, yêu cầu chấm dứt hành vi cản trở → Điều 164, 169 BLDS 2015; không áp dụng thời hiệu khởi kiện → khoản 2 Điều 155 BLDS 2015; xác lập quyền sở hữu theo thời hiệu → Điều 236 BLDS 2015 (phải ngay tình, liên tục, công khai 30 năm); đại diện theo ủy quyền → Điều 138 BLDS 2015; Tòa án xem xét hủy quyết định cá biệt → Điều 34 BLTTDS 2015.","Phương án giải quyết: phương thức tố tụng dân sự (đã hòa giải tại UBND phường không thành), song song thương lượng. Phân tích: giấy chứng nhận năm 2001 và hồ sơ ranh giới năm 1999 thể hiện bức tường 20,88 m thuộc thửa đất của hai cụ; ông Nam chưa có giấy tờ, không chứng minh được tường của mình. Ông Nam không thể viện dẫn Điều 236 vì việc chiếm hữu tài sản đã được đăng ký cho người khác không phải là ngay tình. Gác đòn tay, xà vào tường, lấn không gian và để nước mưa chảy sang là xâm phạm quyền của chủ sở hữu (Điều 175, 250). Phương án: (1) đề nghị Tòa án xem xét, thẩm định tại chỗ, đo đạc; (2) buộc ông Nam tháo dỡ, lắp máng thoát nước về phía đất mình, có giải pháp kỹ thuật bảo đảm an toàn kết cấu nhà phố cổ; (3) phương án dung hòa: thỏa thuận cho ông Nam dùng tường có trả tiền, cam kết không gây hư hại. Yêu cầu hủy giấy chứng nhận của ông Nam khó được chấp nhận nếu việc cấp giấy đúng trình tự.","Trả lời tư vấn: rủi ro — ông Hiệp không có ủy quyền của các đồng thừa kế thì chỉ đứng đơn với tư cách cá nhân, Tòa án phải đưa những người còn lại vào tham gia, kéo dài vụ án; tháo dỡ có thể ảnh hưởng an toàn hai nhà, Tòa án có thể chọn giải pháp kỹ thuật thay vì tháo toàn bộ; UBND tỉnh sẽ tham gia vụ án nếu có yêu cầu hủy giấy chứng nhận. Khuyến nghị: lấy văn bản ủy quyền của các đồng thừa kế; lập vi bằng hiện trạng; chuẩn bị hồ sơ cấp giấy năm 2001. Hình thức tư vấn: bằng văn bản, vì khách hàng phải trao đổi lại với nhiều đồng thừa kế."],"basis":"Điều 138, 155, 164, 169, 175, 176, 236, 250 BLDS 2015; Điều 34 BLTTDS 2015","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4","TH3.01.5","TH3.01.6","TH3.01.7","TH3.01.8"]},{"cid":"TH3.02","title":"Nhờ em trai đứng tên mua đất, em bán đất lấy tiền — Nguồn: Án lệ số 02/2016/AL","text":"Năm 2010, chị Nguyễn Thị Thanh (người gốc Việt Nam, quốc tịch Úc, không còn quốc tịch Việt Nam) gửi về 600 triệu đồng nhờ em trai là anh Nguyễn Văn Tiến đứng tên nhận chuyển nhượng 5.000 m² đất trồng cây lâu năm ở huyện C để sau này về quê làm trang trại. Hai chị em không lập văn bản, nhưng có tin nhắn, thư điện tử và chứng từ chuyển tiền thể hiện việc này. Anh Tiến trực tiếp quản lý, cải tạo đất, trồng cây ăn quả từ năm 2010. Tháng 3/2026, anh Tiến chuyển nhượng toàn bộ thửa đất cho Công ty TNHH Minh Châu với giá 3,0 tỷ đồng, hợp đồng đã công chứng, công ty đã được cấp giấy chứng nhận. Anh Tiến chỉ đồng ý trả lại chị Thanh 600 triệu đồng. Chị Thanh nhờ tư vấn để đòi quyền lợi.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là chị Nguyễn Thị Thanh — người bỏ tiền nhận chuyển nhượng, nhờ em đứng tên. Yêu cầu: đòi quyền lợi đối với số tiền 3,0 tỷ đồng anh Tiến đã bán đất. Giấy tờ đã có: chứng từ chuyển tiền năm 2010, tin nhắn, thư điện tử. Cần bổ sung: hợp đồng nhận chuyển nhượng năm 2010 (giá mua thực tế); hợp đồng chuyển nhượng năm 2026 cho Công ty Minh Châu; tài liệu về chi phí cải tạo, trồng cây của anh Tiến; hộ chiếu, giấy tờ chứng minh nguồn gốc Việt Nam; văn bản ủy quyền nếu chị ở nước ngoài.","Xác định vấn đề pháp lý: quan hệ nhờ đứng tên nhận chuyển nhượng quyền sử dụng đất. Vấn đề cần làm rõ: (i) chị Thanh có được nhận chuyển nhượng đất trồng cây lâu năm không, thỏa thuận nhờ đứng tên có hiệu lực không; (ii) đối tượng tranh chấp là đất hay số tiền bán đất; (iii) xác định khoản chênh lệch giá và công sức của anh Tiến; (iv) quyền của Công ty Minh Châu — người thứ ba nhận chuyển nhượng.","Xác định luật áp dụng: Án lệ số 02/2016/AL (người Việt Nam định cư ở nước ngoài nhờ người trong nước đứng tên nhận chuyển nhượng; xác định tiền gốc, khoản chênh lệch là lợi nhuận chung và công sức của người đứng tên; không xác định được công sức thì coi như ngang nhau); Điều 44 Luật Đất đai 2024 (quyền của người gốc Việt Nam định cư ở nước ngoài); Điều 123, 124, 131 BLDS 2015 (giao dịch vô hiệu, hậu quả); Điều 133 BLDS 2015 (bảo vệ người thứ ba ngay tình); Điều 357 BLDS 2015 (lãi chậm trả).","Phương án giải quyết: phương thức thương lượng trước; không đạt thì tố tụng dân sự — khởi kiện yêu cầu anh Tiến thanh toán tiền. Phân tích: chị Thanh là người gốc Việt Nam không thuộc đối tượng được nhận chuyển nhượng đất trồng cây lâu năm, nên không thể đòi lại đất; đất đã chuyển cho Công ty Minh Châu ngay tình, được cấp giấy chứng nhận (Điều 133). Theo Án lệ 02/2016/AL, tranh chấp thực chất là về số tiền: chị Thanh được nhận lại tiền gốc 600 triệu đồng; khoản chênh lệch 3,0 − 0,6 = 2,4 tỷ đồng là lợi nhuận chung, chia theo công sức; anh Tiến có công quản lý, tôn tạo nên được hưởng một phần; nếu không xác định được chính xác công sức thì chia ngang nhau → chị Thanh được 0,6 + 1,2 = 1,8 tỷ đồng. Phương án: (1) thương lượng trên mức 1,8 tỷ đồng; (2) khởi kiện. Khả thi cao vì có chứng từ chuyển tiền.","Trả lời tư vấn: rủi ro — thiếu chứng cứ nguồn tiền thì anh Tiến có thể cho rằng đất là của mình; anh Tiến chứng minh được chi phí, công sức lớn thì phần của chị Thanh giảm; anh Tiến tẩu tán tiền. Khuyến nghị: thu thập đầy đủ chứng từ chuyển tiền, tin nhắn; yêu cầu biện pháp khẩn cấp tạm thời phong tỏa tài khoản, tài sản của anh Tiến nếu có dấu hiệu tẩu tán; không yêu cầu hủy hợp đồng với Công ty Minh Châu. Hình thức tư vấn: bằng văn bản (gửi qua thư điện tử), vì khách hàng ở nước ngoài và cần tài liệu để ủy quyền."],"basis":"Án lệ 02/2016/AL; Điều 44 Luật Đất đai 2024; Điều 123, 124, 131, 133, 357 BLDS 2015","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4","TH3.02.5","TH3.02.6","TH3.02.7","TH3.02.8"]},{"cid":"TH3.03","title":"Đất vợ đứng tên mua trước ngày đăng ký kết hôn, chồng là người nước ngoài — Nguồn: Án lệ số 82/2025/AL","text":"Ông Park Ji Hoon (quốc tịch Hàn Quốc) và chị Nguyễn Thị Ngọc nộp tờ khai đăng ký kết hôn tại Sở Tư pháp ngày 05/3/2019 và tổ chức lễ cưới ngày 20/3/2019. Ngày 09/4/2019, chị Ngọc đứng tên ký hợp đồng nhận chuyển nhượng thửa đất 291 m² tại thị xã L với giá 2,1 tỷ đồng, được cấp giấy chứng nhận ngày 22/4/2019 mang tên chị. Ngày 15/5/2019, hai người được cấp Giấy chứng nhận kết hôn. Tiền mua đất do ông Park chuyển từ tài khoản của ông sang tài khoản chị Ngọc; bà Trần Thị Na (bên bán) xác nhận bán đất cho cả hai vợ chồng và chị Ngọc nói với bà rằng ông Park là người nước ngoài nên không đứng tên được. Năm 2026, ông Park yêu cầu ly hôn và chia tài sản; chị Ngọc cho rằng thửa đất là tài sản riêng vì mua trước khi đăng ký kết hôn bằng tiền của mình. Thửa đất hiện được định giá 4,0 tỷ đồng. Ông Park nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là ông Park Ji Hoon — người chồng, người nước ngoài, nguyên đơn ly hôn. Yêu cầu: xác định thửa đất là tài sản chung và được chia. Giấy tờ đã có: chứng từ chuyển khoản; Giấy chứng nhận kết hôn. Cần bổ sung: tờ khai đăng ký kết hôn (ngày nộp), giấy tờ, ảnh lễ cưới; hợp đồng chuyển nhượng; xác nhận (lời khai) của bà Na; tài liệu về nguồn tiền của ông Park; hộ chiếu, giấy tờ cư trú, bản dịch hợp pháp hóa (nếu có).","Xác định vấn đề pháp lý: quan hệ hôn nhân có yếu tố nước ngoài; chế độ tài sản của vợ chồng. Vấn đề cần làm rõ: (i) quyền sử dụng đất do chị Ngọc nhận chuyển nhượng trước ngày được cấp Giấy chứng nhận kết hôn nhưng sau khi đã nộp tờ khai, tổ chức lễ cưới là tài sản chung hay riêng; (ii) ông Park — người nước ngoài — được chia tài sản là quyền sử dụng đất bằng hình thức nào; (iii) nguyên tắc chia tài sản chung khi ly hôn.","Xác định luật áp dụng: Án lệ số 82/2025/AL (một bên là người nước ngoài, đã nộp tờ khai đăng ký kết hôn, tổ chức lễ cưới; bên Việt Nam đứng tên nhận chuyển nhượng trước khi đăng ký kết hôn, bên chuyển nhượng xác nhận bán cho cả vợ chồng → tài sản chung); Điều 33, 43, 59 Luật HNGĐ 2014 (tài sản chung, tài sản riêng, chia tài sản khi ly hôn); Điều 208 BLDS 2015 (xác lập quyền sở hữu chung); Luật Đất đai 2024 (người nước ngoài không phải là người sử dụng đất nhận chuyển nhượng); Điều 127 Luật HNGĐ 2014 (ly hôn có yếu tố nước ngoài).","Phương án giải quyết: phương thức tố tụng dân sự (yêu cầu chia tài sản trong vụ án ly hôn), kết hợp hòa giải. Phân tích: tuy hợp đồng ký trước ngày cấp Giấy chứng nhận kết hôn, hai bên đã nộp tờ khai, tổ chức lễ cưới; tiền do ông Park chuyển; bên bán xác nhận bán cho cả vợ chồng; chị Ngọc đứng tên một mình vì ông Park là người nước ngoài → theo Án lệ 82/2025/AL, thửa đất là tài sản chung. Khi chia, ông Park không được nhận quyền sử dụng đất bằng hiện vật nên Tòa án giao đất cho chị Ngọc, buộc chị thanh toán giá trị phần ông Park được hưởng; chia đôi có tính đến công sức, hoàn cảnh (Điều 59): nếu chia đôi, ông Park nhận 4,0 : 2 = 2,0 tỷ đồng. Phương án: (1) thỏa thuận chị Ngọc thanh toán một khoản tiền; (2) đề nghị Tòa án chia. Khả thi cao vì có chứng từ chuyển tiền và lời xác nhận của bên bán.","Trả lời tư vấn: rủi ro — thiếu chứng cứ về nguồn tiền và lời xác nhận của bà Na thì Tòa án có thể xác định là tài sản riêng của chị Ngọc; chị Ngọc có thể chứng minh công sức đóng góp lớn hơn làm tỷ lệ chia thay đổi; chị Ngọc chuyển nhượng đất trong thời gian giải quyết. Khuyến nghị: yêu cầu biện pháp khẩn cấp tạm thời cấm chuyển dịch quyền đối với thửa đất; củng cố chứng cứ; chuẩn bị phương án nhận giá trị. Hình thức tư vấn: bằng văn bản (có bản dịch nếu khách hàng cần), vì khách hàng là người nước ngoài và vụ việc giá trị lớn."],"basis":"Án lệ 82/2025/AL; Điều 33, 43, 59, 127 Luật HNGĐ 2014; Điều 208 BLDS 2015; Luật Đất đai 2024","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4","TH3.03.5","TH3.03.6","TH3.03.7","TH3.03.8"]},{"cid":"TH3.04","title":"Chủ xưởng tặng vé số cho thợ, vé trúng giải đặc biệt — Nguồn: Án lệ số 80/2025/AL","text":"Sáng 07/01/2026, ông Trần Thanh Tâm (chủ xưởng mộc, đã kết hôn với bà Lê Thị Lụa) mua 10 tờ vé số giá 10.000 đồng/tờ. Trước mặt các thợ, ông đưa một tờ cho anh Nguyễn Văn Dũng và nói: \"Vé này tặng chú, trúng thì là của chú\". Chiều cùng ngày, tờ vé trúng giải đặc biệt 2 tỷ đồng. Ông Tâm hỏi xin lại tờ vé để \"đi lĩnh hộ cho nhanh\", anh Dũng đưa. Ông Tâm lĩnh thưởng, thực nhận 1,8 tỷ đồng sau thuế, nhưng chỉ đưa anh Dũng 50 triệu đồng. Bà Lụa cho rằng vé mua bằng tiền chung của vợ chồng, việc tặng cho không có sự đồng ý của bà nên vô hiệu; nếu có tặng thì chồng bà chỉ được cho phần của ông là một nửa tiền thưởng. Có 6 người thợ chứng kiến; một người quay video lúc ông Tâm đưa vé. Anh Dũng nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là anh Nguyễn Văn Dũng — người được tặng cho tờ vé số. Yêu cầu: nhận lại số tiền trúng thưởng. Giấy tờ, chứng cứ đã có: video lúc ông Tâm đưa vé; danh sách 6 người làm chứng; biên nhận 50 triệu đồng (nếu có). Cần bổ sung: thông tin tờ vé (số seri, đài, ngày mở thưởng); xác nhận của công ty xổ số về người lĩnh thưởng, số tiền trả, thuế đã khấu trừ; tin nhắn trao đổi với ông Tâm; lời khai bằng văn bản của những người chứng kiến.","Xác định vấn đề pháp lý: hợp đồng tặng cho động sản; tài sản chung của vợ chồng. Vấn đề cần làm rõ: (i) việc tặng cho tờ vé số chưa mở thưởng có hiệu lực từ khi nào; (ii) ông Tâm định đoạt tờ vé có cần sự đồng ý của bà Lụa không; (iii) đối tượng tặng cho là tờ vé hay khoản tiền thưởng; (iv) nghĩa vụ hoàn trả của ông Tâm khi giữ tiền thưởng.","Xác định luật áp dụng: Án lệ số 80/2025/AL (vé số chưa mở thưởng là động sản không phải đăng ký quyền sở hữu, vợ hoặc chồng tặng cho không cần sự đồng ý của người kia); Điều 457, khoản 1 Điều 458 BLDS 2015 (hợp đồng tặng cho, tặng cho động sản có hiệu lực từ khi bên được tặng cho nhận tài sản); khoản 2 Điều 32, Điều 35 Luật HNGĐ 2014 (giao dịch thông thường, định đoạt tài sản chung); Điều 579 BLDS 2015 (nghĩa vụ hoàn trả của người chiếm hữu, được lợi về tài sản không có căn cứ); Điều 357 BLDS 2015 (lãi chậm trả).","Phương án giải quyết: phương thức thương lượng (có người làm chứng) trước; không đạt thì tố tụng dân sự — khởi kiện yêu cầu ông Tâm trả tiền. Phân tích: tờ vé chưa mở thưởng là động sản không phải đăng ký, giá trị 10.000 đồng không đáng kể so với chi tiêu hằng ngày; hợp đồng tặng cho có hiệu lực khi anh Dũng nhận vé (khoản 1 Điều 458); ông Tâm tặng cho không cần bà Lụa đồng ý (Án lệ 80/2025/AL). Đối tượng tặng cho là tờ vé, không phải khoản tiền thưởng, nên lập luận \"chỉ được cho một nửa tiền thưởng\" không có căn cứ. Ông Tâm lĩnh thưởng thay rồi giữ tiền phải hoàn trả: 1,8 tỷ − 0,05 tỷ = 1,75 tỷ đồng (Điều 579). Phương án: (1) văn bản yêu cầu trả 1,75 tỷ đồng; (2) khởi kiện, kèm biện pháp phong tỏa tài khoản. Khả thi cao vì có video và người làm chứng.","Trả lời tư vấn: rủi ro — ông Tâm có thể lập luận \"nói đùa\", không có ý tặng; người làm chứng là thợ trong xưởng có thể ngại khai; ông Tâm tiêu tán tiền. Khuyến nghị: lưu giữ video gốc, lập vi bằng nội dung video; lấy lời khai người làm chứng sớm; yêu cầu biện pháp khẩn cấp tạm thời phong tỏa tài khoản nhận tiền thưởng; khoản 50 triệu đồng đã nhận được trừ vào số phải trả. Hình thức tư vấn: trực tiếp kết hợp văn bản — trao đổi trực tiếp để nắm tình tiết, sau đó gửi văn bản nêu căn cứ và các việc cần làm."],"basis":"Án lệ 80/2025/AL; Điều 457, 458, 579, 357 BLDS 2015; khoản 2 Điều 32, Điều 35 Luật HNGĐ 2014","mcq":["TH3.04.1","TH3.04.2","TH3.04.3","TH3.04.4","TH3.04.5","TH3.04.6","TH3.04.7","TH3.04.8"]}]},{"name":"Chương 4. Kỹ năng tư vấn pháp luật về hợp đồng","items":[{"cid":"TH4.01","title":"Vợ chồng vay hai khoản tín dụng, ngừng trả lãi, bị thu hồi nợ trước hạn — Nguồn: Bản án số 60/2025/DS-PT (Hồ sơ TVPLDS 4 – Hợp đồng)","text":"Ngày 17/3/2023, vợ chồng bà Nguyễn Thị Bình, ông Vũ Tuấn Anh ký hợp đồng tín dụng số 5912 với Quỹ tín dụng nhân dân TA, vay 300 triệu đồng, thời hạn 12 tháng, lãi suất 14,2%/năm, trả gốc một lần khi đến hạn, trả lãi hằng tháng; nếu quá hạn thì lãi suất nợ gốc quá hạn bằng 150% lãi suất trong hạn. Ngày 09/10/2023, hai vợ chồng ký tiếp hợp đồng số 6237, vay 500 triệu đồng, thời hạn 12 tháng, lãi suất 11,4%/năm, điều khoản quá hạn tương tự; hợp đồng có điều khoản cho phép Quỹ thu hồi nợ trước hạn nếu bên vay vi phạm nghĩa vụ trả nợ. Cả hai khoản vay được bảo đảm bằng hợp đồng thế chấp số 4174 ký ngày 28/02/2020 (đã công chứng, đăng ký), tài sản là nhà ba tầng và 93 m² đất của vợ chồng; hợp đồng thế chấp ghi bảo đảm cho các khoản vay hiện có và phát sinh sau. Vợ chồng bà Bình trả lãi đến tháng 11 và 12/2023 thì ngừng; nợ gốc còn 299.851.900 đồng và 499.997.300 đồng. Quỹ khởi kiện yêu cầu trả gốc, lãi trong hạn, lãi quá hạn của cả hai hợp đồng, nếu không trả thì xử lý tài sản thế chấp. Vợ chồng bà Bình nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xá
