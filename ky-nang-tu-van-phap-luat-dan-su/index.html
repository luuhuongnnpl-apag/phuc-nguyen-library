c định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là vợ chồng bà Nguyễn Thị Bình, ông Vũ Tuấn Anh — bên vay, bên thế chấp, là bị đơn. Yêu cầu: biết nghĩa vụ trả nợ thực tế, cách tính lãi có đúng không, có giữ được nhà không. Giấy tờ đã có: hai hợp đồng tín dụng, giấy nhận nợ; hợp đồng thế chấp; thông báo thụ lý, đơn khởi kiện. Cần bổ sung: sao kê trả nợ, chứng từ trả lãi; các thông báo điều chỉnh lãi suất, thông báo thu hồi nợ trước hạn của Quỹ; bảng tính lãi Quỹ nộp Tòa án; thông tin thu nhập, khả năng trả nợ.","Xác định vấn đề pháp lý: quan hệ hợp đồng tín dụng (vay tài sản có lãi với tổ chức tín dụng) và hợp đồng thế chấp. Vấn đề cần làm rõ: (i) căn cứ thu hồi nợ trước hạn hợp đồng 6237; (ii) cách tính lãi trong hạn, lãi quá hạn (mức 150%) có hợp pháp không; (iii) hợp đồng thế chấp ký năm 2020 có bảo đảm cho hai khoản vay năm 2023 không; (iv) quyền xử lý tài sản thế chấp và phương án giữ nhà.","Xác định luật áp dụng: hợp đồng vay → Điều 463, 466, 468 BLDS 2015 (lãi suất của tổ chức tín dụng theo luật về các tổ chức tín dụng); Luật Các tổ chức tín dụng 2024 và quy định của Ngân hàng Nhà nước về cho vay (lãi nợ gốc quá hạn không vượt 150% lãi suất trong hạn); Nghị quyết số 01/2019/NQ-HĐTP về lãi, lãi suất; thế chấp → Điều 293, 294, 317, 299, 303 BLDS 2015 (bảo đảm nghĩa vụ trong tương lai, xử lý tài sản thế chấp). Lưu ý: Án lệ số 08/2016/AL về lãi suất trong hợp đồng tín dụng đã đương nhiên bị bãi bỏ, không viện dẫn.","Phương án giải quyết: phương thức tố tụng dân sự (tham gia với tư cách bị đơn), kết hợp thỏa thuận trong tố tụng. Phân tích: vợ chồng bà Bình vi phạm nghĩa vụ trả lãi nên Quỹ có quyền thu hồi trước hạn theo điều khoản đã thỏa thuận; tổng nợ gốc 299.851.900 + 499.997.300 = 799.849.200 đồng; lãi quá hạn 14,2% × 150% = 21,3%/năm và 11,4% × 150% = 17,1%/năm là trong giới hạn; hợp đồng thế chấp năm 2020 ghi rõ bảo đảm cả nghĩa vụ phát sinh sau nên có hiệu lực với hai khoản vay (Điều 293, 294). Phương án: (1) đối chiếu bảng tính lãi (không tính lãi chồng lãi, đúng thời điểm chuyển quá hạn); (2) đề nghị hòa giải: cơ cấu lại thời hạn trả nợ, miễn giảm một phần lãi quá hạn; (3) chủ động bán tài sản thế chấp theo thỏa thuận với Quỹ để được giá cao hơn bán đấu giá. Khả thi: phản đối toàn bộ yêu cầu không có cơ sở; thương lượng là phương án tối ưu.","Trả lời tư vấn: rủi ro — không trả nợ thì tài sản thế chấp bị xử lý; lãi tiếp tục phát sinh đến khi trả hết nợ; chi phí xử lý tài sản, án phí tăng. Khuyến nghị: kiểm tra từng khoản lãi, chỉ ra sai sót (nếu có); đề xuất lộ trình trả nợ khả thi; cân nhắc tự bán nhà có sự đồng ý của Quỹ; tham gia đầy đủ phiên hòa giải, phiên tòa. Hình thức tư vấn: trực tiếp kết hợp văn bản (bảng tính nghĩa vụ trả nợ), vì khách hàng cần hiểu các con số và quyết định phương án."],"basis":"Điều 293, 294, 299, 303, 317, 463, 466, 468 BLDS 2015; Luật Các tổ chức tín dụng 2024; Nghị quyết 01/2019/NQ-HĐTP","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4","TH4.01.5","TH4.01.6","TH4.01.7","TH4.01.8"]},{"cid":"TH4.02","title":"Cha tặng đất cho con, con không xây nhà và chăm sóc như cam kết — Nguồn: Án lệ số 14/2017/AL","text":"Năm 2019, ông Lò Văn Phong (68 tuổi) được cấp giấy chứng nhận quyền sử dụng 72 m² đất ở tại phường T, TP. Điện Biên Phủ. Ngày 25/3/2019, ông lập giấy ủy quyền cho con trai là anh Lò Văn Phúc làm thủ tục, trong đó ghi \"anh Phúc có trách nhiệm xây nhà cho bố ở và chăm sóc bố đến cuối đời\". Ngày 12/4/2019, anh Phúc viết bản cam kết: \"được bố cho đất, sẽ xây nhà để bố ở cùng, không chuyển nhượng cho ai\". Ngày 27/4/2019, ông Phong và vợ chồng anh Phúc ký hợp đồng tặng cho có công chứng; hợp đồng không ghi điều kiện. Anh Phúc được cấp giấy chứng nhận tháng 6/2019. Từ đó đến nay, vợ chồng anh Phúc không xây nhà, đã cho người khác thuê đất làm bãi xe, ông Phong vẫn ở nhờ nhà người em. Tháng 9/2026, ông Phong yêu cầu trả lại đất thì anh Phúc cho rằng việc tặng cho không có điều kiện. Ông Phong nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là ông Lò Văn Phong — bên tặng cho. Yêu cầu: lấy lại 72 m² đất đã tặng cho. Giấy tờ đã có: hợp đồng tặng cho công chứng ngày 27/4/2019; giấy ủy quyền ngày 25/3/2019; bản cam kết ngày 12/4/2019. Cần bổ sung: bản chính giấy ủy quyền, bản cam kết (giám định chữ viết nếu cần); hồ sơ công chứng; giấy chứng nhận đứng tên anh Phúc, tình trạng đăng ký (có thế chấp, chuyển nhượng không); hợp đồng cho thuê bãi xe; người làm chứng về việc anh Phúc không chăm sóc ông Phong.","Xác định vấn đề pháp lý: quan hệ hợp đồng tặng cho quyền sử dụng đất. Vấn đề cần làm rõ: (i) hợp đồng không ghi điều kiện nhưng các văn bản khác thể hiện điều kiện thì có được xác định là tặng cho có điều kiện không; (ii) điều kiện có hợp pháp không và anh Phúc đã vi phạm chưa; (iii) quyền của ông Phong khi bên được tặng cho không thực hiện điều kiện; (iv) thời hiệu khởi kiện; (v) quyền của người thuê đất.","Xác định luật áp dụng: Án lệ số 14/2017/AL (hợp đồng tặng cho không ghi điều kiện nhưng văn bản, tài liệu khác thể hiện các bên đã thỏa thuận điều kiện hợp pháp thì Tòa án công nhận điều kiện, xác định là tặng cho có điều kiện); Điều 120, 121 BLDS 2015 (giao dịch có điều kiện, giải thích giao dịch); Điều 462 BLDS 2015 (tặng cho tài sản có điều kiện — bên được tặng cho không thực hiện nghĩa vụ thì bên tặng cho có quyền đòi lại tài sản và yêu cầu bồi thường); Điều 429 BLDS 2015 (thời hiệu 03 năm kể từ ngày biết quyền bị xâm phạm); Điều 34 BLTTDS 2015 (xem xét giấy chứng nhận).","Phương án giải quyết: phương thức hòa giải tại cơ sở, thương lượng trong gia đình trước; không đạt thì tố tụng dân sự — khởi kiện yêu cầu hủy hợp đồng tặng cho, buộc trả lại đất, đề nghị Tòa án xem xét giấy chứng nhận. Phân tích: giấy ủy quyền và bản cam kết do anh Phúc viết thể hiện rõ nghĩa vụ xây nhà cho bố ở, chăm sóc bố, không chuyển nhượng → theo Án lệ 14/2017/AL, đây là tặng cho có điều kiện; điều kiện hợp pháp, không trái đạo đức xã hội. Đã hơn 7 năm anh Phúc không xây nhà, không chăm sóc, lại cho thuê đất → vi phạm điều kiện; ông Phong có quyền đòi lại tài sản (khoản 3 Điều 462). Thời hiệu: tính từ khi ông Phong biết anh Phúc từ chối thực hiện (tháng 9/2026), còn trong hạn 03 năm. Phương án: (1) văn bản yêu cầu thực hiện điều kiện hoặc trả lại đất; (2) hòa giải; (3) khởi kiện kèm biện pháp cấm chuyển dịch. Khả thi cao vì có văn bản do chính anh Phúc viết.","Trả lời tư vấn: rủi ro — anh Phúc chối chữ viết thì phải giám định; anh Phúc chuyển nhượng, thế chấp đất cho người thứ ba ngay tình trước khi có biện pháp ngăn chặn thì khó lấy lại hiện vật; Tòa án có thể xem xét công sức, chi phí anh Phúc đã bỏ ra (thuế, phí). Khuyến nghị: giữ bản chính các văn bản; khởi kiện sớm kèm yêu cầu biện pháp khẩn cấp tạm thời cấm chuyển dịch quyền sử dụng đất; thông báo cho người thuê. Hình thức tư vấn: trực tiếp bằng lời nói kết hợp văn bản — khách hàng cao tuổi cần được giải thích trực tiếp, kèm văn bản tóm tắt các việc phải làm."],"basis":"Án lệ 14/2017/AL; Điều 120, 121, 429, 462 BLDS 2015; Điều 34, 111, 114 BLTTDS 2015","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4","TH4.02.5","TH4.02.6","TH4.02.7","TH4.02.8"]},{"cid":"TH4.03","title":"Mua lại nhà thuê của Nhà nước với điều kiện \"khi được hóa giá\" — Nguồn: Án lệ số 39/2020/AL","text":"Gia đình bà Trần Vân Chi được Nhà nước cho thuê tầng trệt căn nhà thuộc sở hữu nhà nước tại quận 1, TP. Hồ Chí Minh từ năm 1982. Năm 2012, bà Chi lập giấy cam kết với vợ chồng anh Lê Minh Tâm: bà nhận 1,2 tỷ đồng và giao cho vợ chồng anh Tâm sử dụng khoảng 45 m²; \"khi Nhà nước bán (hóa giá) nhà cho bà Chi thì vợ chồng anh Tâm nộp tiền hóa giá phần diện tích này và bà Chi làm thủ tục chuyển quyền sở hữu\". Vợ chồng anh Tâm đã trả đủ 1,2 tỷ đồng, sửa chữa nhà hết 150 triệu đồng và sử dụng đến nay. Năm 2025, cơ quan quản lý nhà thông báo phần lớn diện tích (42 m²) nằm trong lộ giới mở rộng đường, Nhà nước không bán và không công nhận quyền sở hữu cho bà Chi. Bà Chi yêu cầu vợ chồng anh Tâm trả lại nhà. Vợ chồng anh Tâm nhờ tư vấn: có thể yêu cầu công nhận việc mua bán không; nếu không thì quyền lợi của họ ra sao?","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là vợ chồng anh Lê Minh Tâm — bên nhận chuyển nhượng theo giấy cam kết năm 2012. Yêu cầu: công nhận việc mua bán; nếu không được thì bảo vệ quyền lợi về tiền đã trả, chi phí sửa chữa. Giấy tờ đã có: giấy cam kết năm 2012; chứng từ giao 1,2 tỷ đồng. Cần bổ sung: hợp đồng thuê nhà của bà Chi với cơ quan quản lý nhà; văn bản năm 2025 về việc không bán nhà; chứng từ sửa chữa 150 triệu đồng; thông tin giá nhà, giá thuê tương đương hiện nay.","Xác định vấn đề pháp lý: quan hệ hợp đồng chuyển nhượng quyền sở hữu nhà có điều kiện. Vấn đề cần làm rõ: (i) bà Chi có quyền định đoạt nhà đang thuê của Nhà nước không; (ii) giấy cam kết là giao dịch có điều kiện; điều kiện (được hóa giá) không thể xảy ra thì hậu quả thế nào; (iii) hậu quả của giao dịch vô hiệu: hoàn trả, bồi thường theo lỗi, chi phí sửa chữa; (iv) quyền của bà Chi đòi lại nhà.","Xác định luật áp dụng: Án lệ số 39/2020/AL (người thuê nhà thuộc sở hữu nhà nước cam kết chuyển quyền sở hữu sau khi được hóa giá; Nhà nước không hóa giá → giao dịch có điều kiện vô hiệu do điều kiện không thể xảy ra); Điều 120 BLDS 2015 (giao dịch có điều kiện); khoản 6 Điều 402 BLDS 2015 (hợp đồng có điều kiện); Điều 117, 122, 131 BLDS 2015 (điều kiện có hiệu lực, giao dịch vô hiệu và hậu quả); Điều 166 BLDS 2015 (quyền đòi lại tài sản); Luật Nhà ở 2023 (nhà ở thuộc tài sản công).","Phương án giải quyết: phương thức thương lượng trước; không đạt thì tố tụng dân sự (vợ chồng anh Tâm là bị đơn nếu bà Chi khởi kiện, có thể đưa yêu cầu phản tố). Phân tích: bà Chi chỉ là người thuê, không có quyền định đoạt; giấy cam kết là giao dịch có điều kiện, điều kiện không vi phạm điều cấm nhưng nay không thể xảy ra (nhà nằm trong lộ giới, Nhà nước không bán) → theo Án lệ 39/2020/AL, giao dịch vô hiệu; yêu cầu công nhận mua bán không có cơ sở. Hậu quả (Điều 131): các bên hoàn trả cho nhau những gì đã nhận — vợ chồng anh Tâm trả lại nhà; bà Chi trả lại 1,2 tỷ đồng; bên có lỗi gây thiệt hại phải bồi thường (cả hai bên đều biết nhà là nhà thuê của Nhà nước nên lỗi có thể được xác định ngang nhau); chi phí sửa chữa hợp lý 150 triệu đồng được xem xét. Phương án: (1) thương lượng nhận lại tiền, chi phí sửa chữa và một phần thiệt hại do trượt giá; (2) phản tố trong vụ án bà Chi khởi kiện. Khả thi: đòi lại tiền và chi phí có cơ sở; công nhận mua bán không khả thi.","Trả lời tư vấn: rủi ro — yêu cầu công nhận mua bán sẽ bị bác, chịu án phí với phần không được chấp nhận; nếu lỗi được xác định ngang nhau thì thiệt hại do chênh lệch giá chỉ được bồi thường một phần; bà Chi không có khả năng hoàn trả ngay. Khuyến nghị: chuyển trọng tâm sang yêu cầu giải quyết hậu quả hợp đồng vô hiệu; tính toán đầy đủ tiền đã trả, chi phí, thiệt hại; chỉ giao lại nhà khi bà Chi hoàn trả tiền (đề nghị thi hành đồng thời). Hình thức tư vấn: bằng văn bản, vì khách hàng phải từ bỏ kỳ vọng ban đầu và cần căn cứ rõ ràng để quyết định."],"basis":"Án lệ 39/2020/AL; Điều 117, 120, 122, 131, 166, 402 BLDS 2015; Luật Nhà ở 2023","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4","TH4.03.5","TH4.03.6","TH4.03.7","TH4.03.8"]},{"cid":"TH4.04","title":"Ủy quyền cho em trai bán nhà khi đi làm việc ở nước ngoài — Nguồn: Dựng theo quy định BLDS 2015 về đại diện và hợp đồng ủy quyền (không dựng từ án lệ)","text":"Chị Phạm Thu Trang sở hữu căn hộ chung cư tại Hà Nội (giấy chứng nhận đứng tên riêng chị, chưa kết hôn). Tháng 12/2026, chị sang Đức làm việc theo hợp đồng 3 năm. Trước khi đi, chị muốn ủy quyền cho em trai là anh Phạm Văn Toàn quản lý, cho thuê căn hộ và khi có giá tốt (không thấp hơn 4,5 tỷ đồng) thì bán, nhận tiền và gửi cho chị. Anh Toàn đề nghị: (1) hợp đồng ủy quyền không ghi thời hạn cho gọn; (2) được ủy quyền lại cho vợ anh khi anh bận; (3) nếu không có người mua thì anh tự mua lại căn hộ với giá 4,5 tỷ đồng. Chị Trang cũng lo nếu sau này muốn chấm dứt ủy quyền thì làm thế nào. Chị đến văn phòng công chứng nhờ tư vấn trước khi ký.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là chị Phạm Thu Trang — chủ sở hữu căn hộ, bên ủy quyền. Yêu cầu: soạn, ký hợp đồng ủy quyền an toàn cho việc quản lý, cho thuê, bán căn hộ khi đi nước ngoài. Giấy tờ cần có: căn cước của chị Trang, anh Toàn; giấy chứng nhận căn hộ; giấy xác nhận tình trạng hôn nhân (chứng minh tài sản riêng); thông tin tài khoản nhận tiền; dự kiến giá bán, giá cho thuê.","Xác định vấn đề pháp lý: quan hệ đại diện theo ủy quyền, hợp đồng ủy quyền. Vấn đề cần làm rõ: (i) hình thức hợp đồng ủy quyền để thực hiện được việc bán căn hộ; (ii) thời hạn ủy quyền khi không ghi; (iii) điều kiện ủy quyền lại; (iv) anh Toàn có được tự mua căn hộ của chị Trang theo ủy quyền không; (v) quyền đơn phương chấm dứt và cách bảo vệ khi chấm dứt; (vi) phạm vi ủy quyền (giá tối thiểu, nhận tiền).","Xác định luật áp dụng: đại diện theo ủy quyền → Điều 135, 138, 140, 141 BLDS 2015 (khoản 3 Điều 141: người đại diện không được xác lập giao dịch với chính mình); hợp đồng ủy quyền → Điều 562, 563 (thời hạn: không có thỏa thuận, pháp luật không quy định thì 01 năm), 564 (ủy quyền lại), 565–568 (quyền, nghĩa vụ), 569 (đơn phương chấm dứt); hậu quả vượt phạm vi → Điều 143 BLDS 2015; hình thức → Luật Công chứng 2024 và quy định về giao dịch nhà ở (hợp đồng mua bán căn hộ phải công chứng nên ủy quyền bán cần lập thành văn bản công chứng).","Phương án giải quyết: phương thức thỏa thuận dân sự — soạn hợp đồng ủy quyền có công chứng trước khi xuất cảnh. Phân tích: (1) phải ghi thời hạn rõ ràng (ví dụ 3 năm), vì nếu không ghi thì hợp đồng ủy quyền chỉ có hiệu lực 01 năm (Điều 563), sẽ hết hạn khi chị còn ở Đức; (2) ủy quyền lại chỉ được khi chị Trang đồng ý hoặc do sự kiện bất khả kháng, phạm vi không vượt quá ủy quyền ban đầu, hình thức phù hợp (Điều 564) — nên ghi rõ có hay không; (3) anh Toàn không được nhân danh chị bán căn hộ cho chính mình (khoản 3 Điều 141); nếu muốn mua thì chị Trang trực tiếp ký hoặc ký hợp đồng mua bán qua cơ quan đại diện; (4) ghi phạm vi: giá tối thiểu 4,5 tỷ đồng, nhận tiền vào tài khoản đứng tên chị Trang, nghĩa vụ báo cáo; (5) chấm dứt: ủy quyền không có thù lao thì chị có quyền đơn phương chấm dứt bất cứ lúc nào nhưng phải báo trước một thời gian hợp lý và báo cho người thứ ba biết (Điều 569); có thể hủy tại cơ quan đại diện Việt Nam ở Đức.","Trả lời tư vấn: rủi ro — ủy quyền không thời hạn mặc nhiên hết sau 01 năm; anh Toàn bán dưới giá hoặc giữ tiền (cần quy định nhận tiền qua tài khoản chị Trang); ủy quyền lại cho người chị không biết; chị chấm dứt mà không thông báo cho người thứ ba thì giao dịch với người thứ ba ngay tình vẫn có hiệu lực. Khuyến nghị: lập hợp đồng ủy quyền công chứng có thời hạn, phạm vi, giá tối thiểu, cách nhận tiền, có hoặc không cho ủy quyền lại; giữ liên lạc với văn phòng công chứng để thông báo khi chấm dứt. Hình thức tư vấn: trực tiếp tại văn phòng công chứng, kết hợp bản thảo hợp đồng bằng văn bản để chị Trang xem trước khi ký."],"basis":"Điều 135, 138, 140, 141, 143, 562, 563, 564, 565, 569 BLDS 2015; Luật Công chứng 2024","mcq":["TH4.04.1","TH4.04.2","TH4.04.3","TH4.04.4","TH4.04.5","TH4.04.6","TH4.04.7","TH4.04.8"]}]},{"name":"Chương 5. Kỹ năng tư vấn về trách nhiệm bồi thường thiệt hại ngoài hợp đồng","items":[{"cid":"TH5.01","title":"Tai nạn giao thông, cha mẹ người gây tai nạn đã đưa tiền nhưng không có giấy tờ — Nguồn: Bản án số 136/2023/DS-ST (Hồ sơ TVPLDS 6 – Bồi thường thiệt hại ngoài hợp đồng)","text":"Khoảng 15 giờ ngày 06/7/2025, ông Tô Văn Cường điều khiển xe mô tô chở vợ là bà Trần Thị Hạnh trên tỉnh lộ 922 thì bị anh Liêu Hoàng (24 tuổi) điều khiển xe mô tô đi ngược chiều, lấn sang phần đường của ông Cường, đâm vào. Xe anh Hoàng đứng tên cha anh là ông Liêu Xuân; ông Xuân giao xe cho anh Hoàng sử dụng hằng ngày. Cơ quan công an kết luận nguyên nhân do anh Hoàng đi không đúng phần đường. Ông Cường gãy xương bánh chè, mất phần mềm mu bàn chân, điều trị liên tục 12 tháng, chi phí theo hóa đơn 300 triệu đồng; bác sĩ chỉ định tiếp tục phẫu thuật, dự kiến 100 triệu đồng. Tỷ lệ thương tật của ông Cường 46%, của bà Hạnh 11%. Trước tai nạn, ông Cường làm thợ xây, thu nhập ổn định 8 triệu đồng/tháng, phải nghỉ việc 12 tháng; con trai ông nghỉ làm 6 tháng để chăm sóc ông (thu nhập 7 triệu đồng/tháng). Vợ chồng ông Xuân đã nhiều lần đưa tiền \"hỗ trợ\", không lập giấy tờ; ông Cường thừa nhận đã nhận 22 triệu đồng, còn ông Xuân nói đã đưa 32 triệu đồng. Tháng 11/2026, ông Cường nhờ tư vấn để yêu cầu bồi thường.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là ông Tô Văn Cường — người bị thiệt hại về sức khỏe. Bà Hạnh cũng bị thiệt hại nhưng là chủ thể có quyền yêu cầu riêng; nếu bà muốn ông Cường đứng ra thì phải có văn bản ủy quyền. Giấy tờ đã có: kết luận của cơ quan công an; hóa đơn điều trị; kết luận giám định thương tật. Cần bổ sung: hồ sơ bệnh án, chỉ định phẫu thuật tiếp; xác nhận thu nhập của ông Cường và con trai (hợp đồng, bảng lương, xác nhận chủ thầu); giấy chứng nhận bảo hiểm trách nhiệm dân sự bắt buộc của chủ xe; đăng ký xe của ông Xuân; người làm chứng hoặc tin nhắn về các lần nhận tiền.","Xác định vấn đề pháp lý: bồi thường thiệt hại ngoài hợp đồng do sức khỏe bị xâm phạm, do nguồn nguy hiểm cao độ gây ra. Vấn đề cần làm rõ: (i) ai phải bồi thường (anh Hoàng là người thành niên trực tiếp gây thiệt hại, được giao chiếm hữu, sử dụng xe; trách nhiệm của ông Xuân với tư cách chủ sở hữu); (ii) các khoản thiệt hại được bồi thường và mức tổn thất tinh thần; (iii) chi phí phẫu thuật chưa phát sinh; (iv) khoản tiền đã nhận được khấu trừ bao nhiêu khi hai bên khai khác nhau; (v) trách nhiệm của doanh nghiệp bảo hiểm; (vi) thời hiệu.","Xác định luật áp dụng: căn cứ phát sinh trách nhiệm → Điều 584 BLDS 2015; nguyên tắc bồi thường, thay đổi mức bồi thường → Điều 585 BLDS 2015 (khoản 3); năng lực chịu trách nhiệm → khoản 1 Điều 586 BLDS 2015; nguồn nguy hiểm cao độ → Điều 601 BLDS 2015 (chủ sở hữu đã giao xe cho người khác chiếm hữu, sử dụng thì người này phải bồi thường, trừ thỏa thuận khác); thiệt hại do sức khỏe bị xâm phạm → Điều 590 BLDS 2015 (tổn thất tinh thần tối đa 50 lần mức lương cơ sở); thời hiệu → Điều 588 BLDS 2015; hướng dẫn → Nghị quyết 02/2022/NQ-HĐTP; nghĩa vụ chứng minh → Điều 91 BLTTDS 2015; bảo hiểm bắt buộc trách nhiệm dân sự chủ xe → Nghị định 67/2023/NĐ-CP.","Phương án giải quyết: phương thức thỏa thuận (thương lượng có lập biên bản) và yêu cầu doanh nghiệp bảo hiểm của chủ xe bồi thường; không đạt thì tố tụng dân sự — khởi kiện anh Hoàng. Phân tích: anh Hoàng có lỗi, đã thành niên, trực tiếp sử dụng xe được giao nên là người phải bồi thường (khoản 1 Điều 586, Điều 601); ông Xuân không bắt buộc bồi thường nếu không có thỏa thuận khác; tiền ông Xuân đưa là trả thay, được khấu trừ. Thiệt hại của ông Cường (Điều 590): chi phí điều trị 300 triệu đồng; thu nhập bị mất 12 × 8 = 96 triệu đồng; thu nhập bị mất của người chăm sóc 6 × 7 = 42 triệu đồng → thiệt hại vật chất 438 triệu đồng; tổn thất tinh thần tối đa 50 × 2,53 = 126,5 triệu đồng. Khấu trừ: ông Cường thừa nhận 22 triệu đồng; 10 triệu đồng chênh lệch do phía ông Xuân phải chứng minh. Chi phí phẫu thuật tiếp: yêu cầu kèm chỉ định của bác sĩ; nếu chưa được chấp nhận thì khi phát sinh có quyền yêu cầu thay đổi mức bồi thường (khoản 3 Điều 585). Khả thi cao vì có kết luận của cơ quan công an và hóa đơn.","Trả lời tư vấn: rủi ro — thiếu chứng cứ thu nhập thì khoản thu nhập bị mất có thể được tính theo mức thu nhập trung bình của lao động cùng loại; anh Hoàng không có tài sản, thi hành án khó; thời hiệu 03 năm kể từ ngày biết quyền bị xâm phạm (đến ngày 06/7/2028). Khuyến nghị: yêu cầu ngay doanh nghiệp bảo hiểm bắt buộc của xe gây tai nạn chi trả; củng cố chứng cứ thu nhập, chỉ định phẫu thuật; lập văn bản ghi nhận mọi khoản tiền nhận thêm; bà Hạnh lập văn bản ủy quyền nếu muốn ông Cường đứng ra giải quyết. Hình thức tư vấn: bằng văn bản kèm bảng tính các khoản thiệt hại, vì có nhiều con số và khách hàng cần dùng khi thương lượng."],"basis":"Điều 584, 585, 586, 588, 590, 601 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP; Điều 91 BLTTDS 2015; Nghị định 67/2023/NĐ-CP","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4","TH5.01.5","TH5.01.6","TH5.01.7","TH5.01.8"]},{"cid":"TH5.02","title":"Thi công tòa nhà bên cạnh làm nứt, lún nhà dân — Nguồn: Dựng theo Điều 589, 605 BLDS 2015 (không dựng từ án lệ)","text":"Bà Đỗ Thị Mai sở hữu nhà ba tầng tại phường K; tầng 1 cho thuê làm ki-ốt với giá 10 triệu đồng/tháng, gia đình bà ở tầng 2, 3. Từ tháng 3/2026, Công ty cổ phần Đại Phát (chủ đầu tư) xây tòa nhà 9 tầng sát bên, nhà thầu thi công là Công ty TNHH Bình Minh. Trong quá trình ép cọc, đào tầng hầm, nhà bà Mai bị nứt tường, lún sàn, nghiêng; UBND phường lập biên bản hiện trạng ngày 15/4/2026. Kết quả giám định của tổ chức kiểm định xây dựng xác định nguyên nhân do thi công không có biện pháp chống đỡ, chi phí sửa chữa 240 triệu đồng. Gia đình bà phải thuê nhà ở tạm 4 tháng (7 triệu đồng/tháng); người thuê ki-ốt chấm dứt hợp đồng, bà mất 4 tháng tiền thuê. Công ty Đại Phát cho rằng lỗi của nhà thầu; Công ty Bình Minh đề nghị chỉ hỗ trợ 50 triệu đồng. Công trình vẫn đang thi công. Bà Mai nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là bà Đỗ Thị Mai — chủ sở hữu nhà bị thiệt hại. Yêu cầu: được bồi thường đầy đủ, ngăn thiệt hại tiếp diễn. Giấy tờ đã có: biên bản hiện trạng của UBND phường; kết quả giám định. Cần bổ sung: giấy chứng nhận quyền sở hữu nhà; hợp đồng thuê nhà ở tạm, chứng từ trả tiền; hợp đồng cho thuê ki-ốt và văn bản chấm dứt; ảnh, video, vi bằng hiện trạng theo thời gian; giấy phép xây dựng của công trình bên cạnh; thông tin bảo hiểm công trình, bảo hiểm trách nhiệm đối với bên thứ ba.","Xác định vấn đề pháp lý: bồi thường thiệt hại ngoài hợp đồng do tài sản bị xâm phạm, do công trình xây dựng gây ra. Vấn đề cần làm rõ: (i) chủ thể chịu trách nhiệm: chủ đầu tư, nhà thầu thi công, quan hệ liên đới; (ii) các khoản thiệt hại về tài sản được bồi thường; (iii) biện pháp ngăn chặn thiệt hại tiếp diễn; (iv) phương thức giải quyết.","Xác định luật áp dụng: căn cứ phát sinh trách nhiệm → Điều 584 BLDS 2015; bồi thường thiệt hại do nhà cửa, công trình xây dựng gây ra → Điều 605 BLDS 2015 (chủ sở hữu, người chiếm hữu, người được giao quản lý, sử dụng công trình phải bồi thường; người thi công có lỗi thì liên đới bồi thường); trách nhiệm liên đới → Điều 587 BLDS 2015; thiệt hại do tài sản bị xâm phạm → Điều 589 BLDS 2015; bảo đảm an toàn công trình liền kề → Điều 177 BLDS 2015; pháp luật về xây dựng (trách nhiệm bảo đảm an toàn cho công trình lân cận); thời hiệu → Điều 588 BLDS 2015.","Phương án giải quyết: kết hợp ba phương thức. (1) Thủ tục hành chính: đề nghị UBND phường, cơ quan quản lý trật tự xây dựng kiểm tra, yêu cầu tạm dừng thi công, áp dụng biện pháp chống đỡ để ngăn thiệt hại tiếp diễn. (2) Thỏa thuận dân sự: gửi văn bản yêu cầu bồi thường đến cả chủ đầu tư và nhà thầu. (3) Tố tụng dân sự: khởi kiện cả hai công ty, yêu cầu liên đới bồi thường. Phân tích: công trình gây thiệt hại → Công ty Đại Phát (chủ đầu tư, người được giao quản lý công trình) chịu trách nhiệm; Công ty Bình Minh thi công không có biện pháp chống đỡ là có lỗi → liên đới bồi thường (Điều 605); việc hai bên đổ lỗi cho nhau không làm giảm quyền của bà Mai. Thiệt hại (Điều 589): sửa chữa 240 triệu đồng; chi phí thuê nhà ở tạm 4 × 7 = 28 triệu đồng (chi phí hợp lý hạn chế thiệt hại); lợi ích gắn với việc khai thác tài sản bị mất 4 × 10 = 40 triệu đồng → tổng 308 triệu đồng; mức hỗ trợ 50 triệu đồng là quá thấp.","Trả lời tư vấn: rủi ro — thiệt hại tiếp tục tăng nếu công trình không dừng, chứng cứ hiện trạng bị thay đổi khi sửa chữa; nhà nghiêng có nguy cơ mất an toàn cho người ở. Khuyến nghị: lập vi bằng, đề nghị giám định bổ sung trước khi sửa chữa; gửi đơn đề nghị tạm dừng thi công ngay; khởi kiện yêu cầu hai công ty liên đới bồi thường 308 triệu đồng và chi phí phát sinh; đề nghị biện pháp khẩn cấp tạm thời buộc thực hiện biện pháp ngăn chặn thiệt hại nếu cần. Hình thức tư vấn: bằng văn bản, vì khách hàng cần gửi văn bản đến cơ quan nhà nước và hai doanh nghiệp."],"basis":"Điều 177, 584, 587, 588, 589, 605 BLDS 2015; Điều 111, 114 BLTTDS 2015; pháp luật về xây dựng","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4","TH5.02.5","TH5.02.6","TH5.02.7","TH5.02.8"]},{"cid":"TH5.03","title":"Học sinh 16 tuổi đăng video bịa đặt về tiệm bánh — Nguồn: Dựng theo Điều 34, 586, 592 BLDS 2015 (không dựng từ án lệ)","text":"Chị Võ Thị Lan là chủ hộ kinh doanh tiệm bánh ngọt tại phường H. Ngày 10/8/2026, em Trịnh Gia Huy (16 tuổi, học sinh lớp 10, sống cùng cha mẹ) đăng lên mạng xã hội video ghép hình ảnh tiệm bánh với lời bình \"tiệm này dùng trứng thối, bột mốc, ăn vào ngộ độc\" vì trước đó bị chị Lan nhắc nhở khi gây ồn trong tiệm. Video có hơn 300.000 lượt xem, nhiều khách hủy đơn. Chị Lan chi 12 triệu đồng để kiểm nghiệm sản phẩm và đăng thông báo cải chính; kết quả kiểm nghiệm đạt yêu cầu. Theo sổ sách, thu nhập (lợi nhuận) bình quân của tiệm giảm 15 triệu đồng/tháng trong 2 tháng 8 và 9/2026. Chị Lan nhiều đêm mất ngủ, phải đi khám. Em Huy có khoản tiết kiệm riêng 10 triệu đồng. Cha mẹ em Huy cho rằng con chưa thành niên nên không ai phải bồi thường. Chị Lan nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là chị Võ Thị Lan — chủ hộ kinh doanh, người bị xâm phạm uy tín. Yêu cầu: buộc gỡ video, cải chính, xin lỗi và bồi thường. Chứng cứ đã có: video, số lượt xem; hóa đơn kiểm nghiệm, chi phí đăng cải chính; kết quả kiểm nghiệm. Cần bổ sung: vi bằng ghi nhận nội dung video, đường dẫn, tài khoản đăng; sổ sách doanh thu, lợi nhuận trước và sau sự việc; tin nhắn hủy đơn của khách; giấy khám bệnh; thông tin cha mẹ em Huy.","Xác định vấn đề pháp lý: xâm phạm uy tín của cá nhân kinh doanh, bồi thường thiệt hại ngoài hợp đồng do người chưa thành niên gây ra. Vấn đề cần làm rõ: (i) đủ căn cứ phát sinh trách nhiệm không; (ii) biện pháp bảo vệ quyền nhân thân (gỡ bỏ, cải chính, xin lỗi); (iii) các khoản thiệt hại, mức tổn thất tinh thần; (iv) ai bồi thường khi người gây thiệt hại 16 tuổi.","Xác định luật áp dụng: quyền được bảo vệ danh dự, nhân phẩm, uy tín → Điều 34 BLDS 2015 (yêu cầu gỡ bỏ, cải chính thông tin sai sự thật, xin lỗi, bồi thường); căn cứ phát sinh trách nhiệm → Điều 584 BLDS 2015; thiệt hại do danh dự, nhân phẩm, uy tín bị xâm phạm → Điều 592 BLDS 2015 (tổn thất tinh thần tối đa 10 lần mức lương cơ sở); người từ đủ 15 đến dưới 18 tuổi gây thiệt hại → khoản 2 Điều 586 BLDS 2015; thời hiệu → Điều 588 BLDS 2015; xử lý vi phạm hành chính về cung cấp thông tin sai sự thật trên mạng → pháp luật xử phạt vi phạm hành chính trong lĩnh vực thông tin.","Phương án giải quyết: phương thức thỏa thuận (yêu cầu cha mẹ em Huy và em Huy gỡ video, đăng xin lỗi, bồi thường), song song đề nghị cơ quan có thẩm quyền xử lý hành vi đăng tin sai sự thật; không đạt thì tố tụng dân sự. Phân tích: đăng thông tin bịa đặt, có lỗi cố ý, gây giảm sút thu nhập → đủ căn cứ (Điều 584). Thiệt hại (Điều 592): chi phí hợp lý hạn chế, khắc phục 12 triệu đồng; thu nhập bị giảm sút 2 × 15 = 30 triệu đồng → 42 triệu đồng; tổn thất tinh thần tối đa 10 × 2,53 = 25,3 triệu đồng. Em Huy 16 tuổi phải bồi thường bằng tài sản của mình; không đủ thì cha mẹ bồi thường phần còn thiếu (khoản 2 Điều 586); quan điểm \"không ai phải bồi thường\" là sai. Khả thi cao vì kết quả kiểm nghiệm chứng minh thông tin sai sự thật.","Trả lời tư vấn: rủi ro — video bị xóa trước khi lập vi bằng thì khó chứng minh; thu nhập giảm do yếu tố khác (mùa vụ) có thể bị trừ; vụ việc kéo dài làm uy tín tiếp tục bị ảnh hưởng. Khuyến nghị: lập vi bằng ngay; yêu cầu gỡ video và đăng cải chính trên cùng nền tảng; chuẩn bị sổ sách so sánh cùng kỳ; khởi kiện trong thời hạn 03 năm (đến tháng 8/2029). Hình thức tư vấn: trực tiếp kết hợp văn bản — trao đổi trực tiếp để trấn an, thống nhất cách ứng xử với gia đình em Huy, sau đó gửi văn bản (mẫu thư yêu cầu gỡ bỏ, xin lỗi, bồi thường)."],"basis":"Điều 34, 584, 586, 588, 592 BLDS 2015","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4","TH5.03.5","TH5.03.6","TH5.03.7","TH5.03.8"]},{"cid":"TH5.04","title":"Chó nhờ trông giữ bị thả rông, cắn người giao hàng — Nguồn: Dựng theo Điều 589, 590, 603 BLDS 2015 (không dựng từ án lệ)","text":"Ông Ngô Đức Bảo nuôi một con chó béc-giê. Đầu tháng 9/2026, ông đi công tác 2 tuần, nhờ anh Lương Văn Quân (hàng xóm) trông giữ và cho ăn, hai bên không thỏa thuận gì về trách nhiệm nếu chó gây thiệt hại. Chiều 08/9/2026, anh Quân dắt chó ra công viên, tháo dây xích cho chó chạy. Chó lao vào cắn anh Đặng Minh Khánh (giao hàng công nghệ) đang dừng xe giao hàng. Anh Khánh bị thương ở chân, điều trị và tiêm phòng dại hết 25 triệu đồng, nghỉ việc 15 ngày (thu nhập ổn định 400.000 đồng/ngày); điện thoại bị rơi vỡ, sửa hết 8 triệu đồng; hàng hóa bị hỏng, anh đã phải đền cho chủ hàng 2 triệu đồng. Anh Quân nói chó là của ông Bảo nên ông Bảo phải đền; ông Bảo nói chó đang do anh Quân giữ. Anh Khánh nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là anh Đặng Minh Khánh — người bị thiệt hại về sức khỏe và tài sản. Yêu cầu: xác định ai phải bồi thường, được bồi thường những khoản nào. Giấy tờ, chứng cứ cần có: hồ sơ bệnh án, hóa đơn điều trị, tiêm phòng; xác nhận thu nhập (sao kê thu nhập trên ứng dụng giao hàng); hóa đơn sửa điện thoại; biên nhận đền tiền hàng cho chủ hàng; camera, người làm chứng tại công viên; biên bản của công an phường (nếu có); tin nhắn giữa ông Bảo và anh Quân về việc nhờ trông chó.","Xác định vấn đề pháp lý: bồi thường thiệt hại ngoài hợp đồng do súc vật gây ra, thiệt hại về sức khỏe và tài sản. Vấn đề cần làm rõ: (i) ai chịu trách nhiệm: chủ sở hữu (ông Bảo) hay người đang chiếm hữu, sử dụng (anh Quân); (ii) có thỏa thuận khác giữa hai người không; (iii) các khoản thiệt hại về sức khỏe và tài sản; (iv) lỗi của anh Khánh (nếu có).","Xác định luật áp dụng: bồi thường thiệt hại do súc vật gây ra → Điều 603 BLDS 2015 (khoản 1: chủ sở hữu phải bồi thường; người chiếm hữu, sử dụng phải bồi thường trong thời gian chiếm hữu, sử dụng súc vật, trừ trường hợp có thỏa thuận khác); thiệt hại do sức khỏe bị xâm phạm → Điều 590 BLDS 2015; thiệt hại do tài sản bị xâm phạm → Điều 589 BLDS 2015; nguyên tắc bồi thường, lỗi của người bị thiệt hại → Điều 585 BLDS 2015; thời hiệu → Điều 588 BLDS 2015; pháp luật về thú y (nghĩa vụ xích, rọ mõm khi đưa chó ra nơi công cộng).","Phương án giải quyết: phương thức thỏa thuận (thương lượng, hòa giải tại tổ dân phố) trước; không đạt thì tố tụng dân sự — khởi kiện anh Quân, đưa ông Bảo vào với tư cách người có quyền lợi, nghĩa vụ liên quan; có thể đề nghị cơ quan có thẩm quyền xử phạt hành vi thả rông chó nơi công cộng. Phân tích: tại thời điểm chó cắn, anh Quân là người chiếm hữu, sử dụng chó; giữa ông Bảo và anh Quân không có thỏa thuận khác → anh Quân phải bồi thường (khoản 1 Điều 603); anh Khánh đang dừng xe giao hàng, không có lỗi. Thiệt hại: sức khỏe — chi phí điều trị 25 triệu đồng, thu nhập bị mất 15 × 0,4 = 6 triệu đồng; tài sản — sửa điện thoại 8 triệu đồng, tiền hàng đã đền 2 triệu đồng → tổng thiệt hại vật chất 41 triệu đồng; tổn thất tinh thần do sức khỏe bị xâm phạm, không thỏa thuận được tối đa 50 × 2,53 = 126,5 triệu đồng. Khả thi cao.","Trả lời tư vấn: rủi ro — nếu ông Bảo và anh Quân có thỏa thuận khác (ông Bảo nhận chịu trách nhiệm) thì người phải bồi thường thay đổi, nên khởi kiện có cả hai để tránh nhầm bị đơn; thiếu chứng cứ thu nhập thì khoản thu nhập bị mất có thể bị giảm; phải theo dõi sức khỏe sau tiêm phòng dại. Khuyến nghị: thu thập camera, người làm chứng ngay; lập bảng kê thiệt hại kèm chứng từ; gửi văn bản yêu cầu bồi thường đến cả hai người; khởi kiện trong 03 năm (đến ngày 08/9/2029). Hình thức tư vấn: trực tiếp bằng lời nói kết hợp bảng kê thiệt hại bằng văn bản, vì vụ việc đơn giản, cần hướng dẫn nhanh việc thu thập chứng cứ."],"basis":"Điều 585, 588, 589, 590, 603 BLDS 2015","mcq":["TH5.04.1","TH5.04.2","TH5.04.3","TH5.04.4","TH5.04.5","TH5.04.6","TH5.04.7","TH5.04.8"]}]},{"name":"Chương 6. Kỹ năng tư vấn pháp luật về thừa kế","items":[{"cid":"TH6.01","title":"Di chúc công chứng để lại nhà đất cho con gái và con rể, con trai phản đối — Nguồn: Hồ sơ TVPLDS 5 – Thừa kế theo di chúc (bản án phúc thẩm về tranh chấp thừa kế)","text":"Năm 1974, cụ Nguyễn Thị Sáu mua nhà và 184 m² đất tại xã B, tỉnh Đồng Nai bằng tiền của mình. Năm 2005, nhà đất được cấp giấy chứng nhận ghi \"hộ bà Nguyễn Thị Sáu\". Cụ Sáu có 3 người con: bà Nguyễn Thị Hoa, bà Nguyễn Thị Hằng và ông Nguyễn Văn Hiếu (đều đã thành niên, có khả năng lao động). Năm 2009, ông Hiếu và vợ chồng bà Hoa tranh chấp về nhà đất, UBND xã hòa giải không thành. Ngày 08/12/2010, tại văn phòng công chứng, cụ Sáu lập di chúc để lại toàn bộ nhà đất cho bà Hoa và chồng bà Hoa là ông Lê Văn Dũng, có hai người làm chứng. Ngày 14/12/2012 cụ Sáu chết. Ông Hiếu không công nhận di chúc, cho rằng cụ già yếu bị vợ chồng bà Hoa dụ dỗ, di chúc lập sau khi có tranh chấp; nhà đất cấp cho \"hộ\" nên không phải của riêng cụ; ông còn xuất trình giấy năm 1989 cụ Sáu viết cho ông nhà đất, có chữ ký của hai chị và xác nhận của UBND xã. Tháng 10/2026, vợ chồng bà Hoa nhờ tư vấn để được nhận di sản theo di chúc.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là bà Nguyễn Thị Hoa và ông Lê Văn Dũng — người được hưởng di sản theo di chúc. Yêu cầu: công nhận di chúc hợp pháp và được nhận nhà đất. Giấy tờ đã có: bản di chúc công chứng ngày 08/12/2010. Cần bổ sung: hồ sơ công chứng di chúc (lời chứng, thông tin người làm chứng); giấy chứng tử cụ Sáu; giấy tờ mua nhà năm 1974; hồ sơ cấp giấy chứng nhận năm 2005 (danh sách thành viên hộ tại thời điểm cấp); biên bản hòa giải năm 2009; bản sao giấy năm 1989 ông Hiếu xuất trình; tài liệu y tế về tình trạng sức khỏe của cụ Sáu năm 2010.","Xác định vấn đề pháp lý: thừa kế theo di chúc. Vấn đề cần làm rõ: (i) di chúc có hợp pháp không (năng lực, ý chí tự nguyện của người lập, nội dung, hình thức); (ii) nhà đất là tài sản riêng của cụ Sáu hay tài sản chung của hộ — quyết định phạm vi hiệu lực của di chúc; (iii) ông Dũng (con rể, không thuộc hàng thừa kế) có được hưởng theo di chúc không; (iv) ông Hiếu có thuộc diện được hưởng phần di sản bắt buộc không; (v) giá trị của giấy năm 1989; (vi) thời hiệu.","Xác định luật áp dụng: di chúc lập năm 2010, thừa kế mở năm 2012 nên điều kiện di chúc hợp pháp xét theo BLDS 2005 (nội dung tương ứng Điều 630, 635, 636 BLDS 2015 về di chúc hợp pháp, di chúc có công chứng); quyền của người lập di chúc → Điều 626 BLDS 2015; người thừa kế không phụ thuộc nội dung di chúc → Điều 644 BLDS 2015; hiệu lực từng phần của di chúc → Điều 643 BLDS 2015; hộ gia đình sử dụng đất → Điều 3 Luật Đất đai 2024 (giải thích từ ngữ), Điều 212 BLDS 2015; thời hiệu → khoản 1 Điều 623 BLDS 2015; tình tiết không phải chứng minh (văn bản công chứng hợp pháp) → Điều 92 BLTTDS 2015.","Phương án giải quyết: phương thức thỏa thuận (gia đình thống nhất, lập văn bản nhận di sản theo di chúc tại tổ chức hành nghề công chứng) — khó vì ông Hiếu phản đối; vì vậy tố tụng dân sự: khởi kiện yêu cầu công nhận di chúc và chia di sản theo di chúc. Phân tích: di chúc lập tại văn phòng công chứng, có hai người làm chứng; ông Hiếu cho rằng cụ bị dụ dỗ thì phải chứng minh. Việc lập di chúc sau khi có tranh chấp không làm di chúc vô hiệu — đó là quyền định đoạt của người lập di chúc. Ông Dũng tuy không thuộc hàng thừa kế vẫn được hưởng theo di chúc. Ông Hiếu đã thành niên, có khả năng lao động nên không được hưởng phần bắt buộc. Nhà đất do cụ Sáu tự mua năm 1974; nếu xác minh hồ sơ năm 2005 cho thấy không có thành viên hộ nào có quyền sử dụng đất chung (không đóng góp tạo lập) thì là tài sản riêng của cụ, di chúc có hiệu lực toàn bộ; nếu có thành viên có quyền chung thì di chúc chỉ có hiệu lực với phần của cụ Sáu. Giấy năm 1989 chưa được thực hiện đăng ký, sau đó giấy chứng nhận vẫn cấp cho hộ cụ Sáu; ông Hiếu chưa có yêu cầu trong vụ án. Thời hiệu chia di sản là bất động sản: 30 năm, đến tháng 12/2042. Khả thi cao.","Trả lời tư vấn: rủi ro — nếu Tòa án xác định nhà đất có phần thuộc thành viên khác của hộ thì di chúc chỉ có hiệu lực một phần; ông Hiếu có thể khởi kiện riêng dựa trên giấy năm 1989, kéo dài tranh chấp; ông Hiếu yêu cầu giám định tình trạng sức khỏe tâm thần của cụ Sáu khi lập di chúc. Khuyến nghị: thu thập ngay hồ sơ công chứng di chúc và hồ sơ cấp giấy chứng nhận năm 2005; chuẩn bị người làm chứng; xác định rõ yêu cầu khởi kiện (công nhận di chúc, chia theo di chúc). Hình thức tư vấn: bằng văn bản, vì khách hàng cần căn cứ để khởi kiện và trao đổi với người đại diện theo ủy quyền."],"basis":"Điều 609, 624, 626, 630, 635, 643, 644, 623, 212 BLDS 2015; Điều 3 Luật Đất đai 2024; Điều 92 BLTTDS 2015","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4","TH6.01.5","TH6.01.6","TH6.01.7","TH6.01.8"]},{"cid":"TH6.02","title":"Đất mẹ đã chia cho các con từ lâu, anh trai chiếm phần của các em gái — Nguồn: Án lệ số 24/2018/AL","text":"Cụ Phạm Văn Hòa chết năm 2000, không để lại di chúc. Vợ cụ là cụ Ngô Thị Vân và 7 người con quản lý 464 m² đất (tài sản chung của hai cụ) tại thị trấn Q, Hà Nội. Năm 2002, cụ Vân họp gia đình, lập biên bản chia đất cho các con; ba con gái là bà Lan, bà Liên, bà Loan được chia chung 44,4 m² mặt đường, liền với phần 110 m² ông Phạm Văn Hưng (con trai) được chia; mọi người đều ký. Năm 2004, việc chia đã được thể hiện trên bản đồ, sổ địa chính; các con khác đã xây nhà trên phần của mình. Ông Hưng được nhờ trông coi phần của ba chị em. Cụ Vân chết năm 2023. Năm 2025, ba chị em cần xây nhà thì ông Hưng không thừa nhận, nói đó là đất của cha mẹ chưa chia, đã cho con trai mình làm quán. Ba chị em muốn khởi kiện \"chia thừa kế\" toàn bộ 154,4 m² và nhờ luật sư tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là bà Lan, bà Liên, bà Loan — những người được chia chung 44,4 m² năm 2002. Yêu cầu ban đầu: khởi kiện chia thừa kế. Giấy tờ đã có: biên bản họp gia đình chia đất năm 2002 có chữ ký các bên. Cần bổ sung: trích lục bản đồ, sổ địa chính thể hiện việc chia năm 2004; giấy chứng nhận các con khác đã được cấp; giấy chứng tử hai cụ; người làm chứng việc nhờ ông Hưng trông coi; ảnh hiện trạng quán của con ông Hưng; biên bản hòa giải tại UBND (nếu đã có).","Xác định vấn đề pháp lý: quan hệ thừa kế đã được phân chia trên thực tế; quyền sử dụng đất của cá nhân bị người khác chiếm hữu. Vấn đề cần làm rõ: (i) 154,4 m² còn là di sản thừa kế không; (ii) yêu cầu khởi kiện đúng là chia thừa kế hay đòi lại quyền sử dụng đất; (iii) thời hiệu; (iv) thủ tục hòa giải bắt buộc đối với tranh chấp đất đai; (v) quyền của con ông Hưng đang sử dụng đất.","Xác định luật áp dụng: Án lệ số 24/2018/AL (nhà đất là tài sản chung của vợ chồng, một người chết trước, người còn lại và các thừa kế đã thỏa thuận phân chia, việc chia đã thực hiện trên thực tế và điều chỉnh trên sổ sách về đất đai → đã chuyển thành quyền của các cá nhân, không còn là di sản; người được chia chỉ có quyền khởi kiện đòi lại phần đất bị người khác chiếm hữu); Điều 213, 218, 220 BLDS 2015; quyền đòi lại tài sản → Điều 166 BLDS 2015; không áp dụng thời hiệu → khoản 2 Điều 155 BLDS 2015; hòa giải tranh chấp đất đai → Điều 235, 236 Luật Đất đai 2024 (hòa giải tại UBND cấp xã là điều kiện trước khi khởi kiện tranh chấp ai là người có quyền sử dụng đất; cần theo dõi dự thảo Luật Đất đai sửa đổi có thể thay đổi điều kiện này).","Phương án giải quyết: phương thức hòa giải tại UBND cấp xã (bắt buộc với tranh chấp về quyền sử dụng đất) → không thành thì tố tụng dân sự — khởi kiện ông Hưng đòi lại 44,4 m². Phân tích: việc chia năm 2002 có sự đồng ý của cụ Vân và các thừa kế, đã thực hiện trên thực tế và thể hiện trên sổ sách địa chính năm 2004, không xâm phạm quyền của ai → theo Án lệ 24/2018/AL, đất không còn là di sản; yêu cầu \"chia thừa kế\" 154,4 m² sẽ không được chấp nhận. Ba chị em chỉ có quyền đòi lại 44,4 m² được chia (Điều 166); yêu cầu này không bị áp dụng thời hiệu. Phương án: (1) hòa giải tại UBND cấp xã; (2) khởi kiện đòi lại 44,4 m², buộc con ông Hưng di dời quán, đưa con ông Hưng vào tham gia tố tụng; (3) sau khi có kết quả, đăng ký cấp giấy chứng nhận cho phần 44,4 m². Khả thi cao vì có biên bản chia và sổ địa chính.","Trả lời tư vấn: rủi ro — khởi kiện sai yêu cầu (chia thừa kế) sẽ bị bác và chịu án phí; chưa hòa giải tại UBND cấp xã thì đơn có thể bị trả lại; nếu sổ địa chính không thể hiện phần của ba chị em thì phải chứng minh bằng biên bản và người làm chứng. Khuyến nghị: đổi yêu cầu thành đòi lại 44,4 m²; nộp đơn hòa giải tại UBND cấp xã trước; thu thập trích lục địa chính. Hình thức tư vấn: bằng văn bản, vì khách hàng gồm ba người, cần thống nhất yêu cầu và ủy quyền cho một người đại diện."],"basis":"Án lệ 24/2018/AL; Điều 155, 166, 213, 218, 220 BLDS 2015; Điều 235, 236 Luật Đất đai 2024","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4","TH6.02.5","TH6.02.6","TH6.02.7","TH6.02.8"]},{"cid":"TH6.03","title":"Di chúc chỉ ghi tứ cận, không ghi diện tích; đo thực tế lớn hơn — Nguồn: Án lệ số 72/2024/AL","text":"Cụ Nguyễn Văn Mười góa vợ từ năm 1980; năm 1992 cụ khai hoang và được cấp giấy chứng nhận đứng tên riêng một thửa ruộng sau nhà ở xã T, tỉnh Hà Nam. Năm 2014, cụ lập di chúc có công chứng để lại cho con gái là bà Nguyễn Thị Giang \"thửa ruộng sau nhà, khoảng 3 sào, phía Đông giáp kênh Năm, phía Tây giáp đất ông Sang, phía Nam giáp đường xóm, phía Bắc giáp đất bà Hai\". Từ năm 2014, bà Giang trực tiếp canh tác toàn bộ thửa ruộng; các anh chị em khác không phản đối. Cụ Mười chết năm 2018. Năm 2016, anh Nguyễn Văn Út (con trai) tự kê khai và được cấp giấy chứng nhận đối với toàn bộ thửa ruộng, cho rằng bố đã cho miệng anh năm 2010 nhưng không có chứng cứ. Đo đạc thực tế, diện tích trong tứ cận là 3.250 m²; các hộ giáp ranh không tranh chấp. Anh Út cho rằng nếu chia theo di chúc thì bà Giang chỉ được 3 sào (1.080 m²), phần còn lại phải chia đều cho các anh em. Bà Giang nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là bà Nguyễn Thị Giang — người thừa kế theo di chúc. Yêu cầu: được công nhận quyền thừa kế toàn bộ thửa ruộng theo di chúc và hủy giấy chứng nhận đã cấp cho anh Út. Giấy tờ đã có: di chúc công chứng năm 2014. Cần bổ sung: giấy chứng tử cụ Mười; giấy chứng nhận năm 1992 của cụ Mười; hồ sơ cấp giấy chứng nhận năm 2016 cho anh Út; kết quả đo đạc, xác nhận của các hộ giáp ranh; chứng cứ bà Giang canh tác liên tục; biên bản họp gia đình (nếu có).","Xác định vấn đề pháp lý: thừa kế theo di chúc; tranh chấp quyền sử dụng đất. Vấn đề cần làm rõ: (i) di chúc có hợp pháp không; (ii) di chúc không ghi diện tích cụ thể (chỉ ước \"khoảng 3 sào\") nhưng ghi rõ tứ cận thì di sản xác định thế nào; (iii) giá trị của việc anh Út được cấp giấy chứng nhận năm 2016 dựa trên lời khai được \"cho miệng\"; (iv) thủ tục yêu cầu hủy giấy chứng nhận.","Xác định luật áp dụng: Án lệ số 72/2024/AL (di sản là quyền sử dụng đất được định đoạt theo di chúc hợp pháp; di chúc xác định tứ cận nhưng không thể hiện diện tích cụ thể, các bên không tranh chấp tứ cận → di sản xác định theo diện tích đo đạc thực tế); Điều 624, 630, 634 BLDS 2015 (di chúc, di chúc hợp pháp, di chúc bằng văn bản có công chứng); Điều 643 BLDS 2015 (hiệu lực của di chúc); khoản 1 Điều 623 BLDS 2015 (thời hiệu 30 năm); Điều 34 BLTTDS 2015 (hủy quyết định cá biệt); Điều 235, 236 Luật Đất đai 2024 (hòa giải, giải quyết tranh chấp đất đai).","Phương án giải quyết: phương thức hòa giải trong gia đình, tại UBND cấp xã; không thành thì tố tụng dân sự — khởi kiện yêu cầu công nhận quyền thừa kế theo di chúc đối với diện tích đo đạc thực tế trong tứ cận và hủy giấy chứng nhận đã cấp cho anh Út. Phân tích: di chúc công chứng, đất là tài sản riêng của cụ Mười, nội dung xác định rõ tứ cận, không ai tranh chấp tứ cận → theo Án lệ 72/2024/AL, di sản bà Giang được hưởng là toàn bộ 3.250 m² đo thực tế, không phải 3 sào × 360 m² = 1.080 m²; cách tính của anh Út sẽ tạo ra phần \"còn lại\" 2.170 m² không có căn cứ. Anh Út không chứng minh được việc tặng cho năm 2010 (tặng cho quyền sử dụng đất phải lập thành văn bản, công chứng và đăng ký), nên giấy chứng nhận năm 2016 cấp không đúng đối tượng. Bà Giang canh tác liên tục từ năm 2014, phù hợp với ý chí của cụ Mười. Khả thi cao.","Trả lời tư vấn: rủi ro — nếu chứng minh được đất là tài sản chung (khai hoang trong thời kỳ hôn nhân) thì di chúc chỉ có hiệu lực với phần của cụ Mười; nếu hộ giáp ranh tranh chấp tứ cận thì diện tích phải xác định lại; anh Út chuyển nhượng, thế chấp đất theo giấy chứng nhận đứng tên mình. Khuyến nghị: yêu cầu biện pháp khẩn cấp tạm thời cấm chuyển dịch; lấy xác nhận không tranh chấp ranh giới của các hộ liền kề; chuẩn bị hồ sơ đo đạc. Hình thức tư vấn: bằng văn bản, vì vụ việc có yêu cầu hủy giấy chứng nhận và số liệu diện tích cần lưu giữ."],"basis":"Án lệ 72/2024/AL; Điều 623, 624, 630, 634, 643 BLDS 2015; Điều 34 BLTTDS 2015; Điều 235, 236 Luật Đất đai 2024","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4","TH6.03.5","TH6.03.6","TH6.03.7","TH6.03.8"]},{"cid":"TH6.04","title":"Cháu nội ở, chăm sóc bà và sửa nhà; các cô kiện chia di sản — Nguồn: Án lệ số 05/2016/AL","text":"Ông Trần Văn Hưng (chết năm 2005) và bà Lê Thị Ngự (chết năm 2016) không để lại di chúc; di sản là căn nhà 80 m² tại quận 5, TP. Hồ Chí Minh (tài sản chung của hai ông bà). Hai ông bà có 4 người con: bà Thưởng, bà Xuân, ông Trải và ông Đức (đều còn sống). Chị Trần Thị Phượng (con ông Trải) sống trong nhà từ nhỏ, chăm sóc bà nội đến khi bà mất, sau đó tiếp tục quản lý; năm 2019, chị bỏ 350 triệu đồng sửa chữa, gia cố mái, nâng nền chống ngập (có hóa đơn, hợp đồng thi công). Năm 2026, bà Thưởng và bà Xuân khởi kiện chia di sản, yêu cầu được nhận nhà, thanh toán giá trị cho những người khác và buộc chị Phượng ra khỏi nhà. Chị Phượng được Tòa án đưa vào tham gia tố tụng; chị không có chỗ ở khác. Ông Trải muốn để phần của mình cho chị Phượng và định làm văn bản \"từ chối nhận di sản\". Nhà được định giá 6 tỷ đồng. Chị Phượng nhờ tư vấn.","ask":["Tiếp xúc khách hàng: xác định khách hàng, tư cách và yêu cầu của khách hàng; giấy tờ khách hàng đã có; thông tin, giấy tờ cần bổ sung.","Xác định vấn đề pháp lý: quan hệ pháp luật phát sinh và các vấn đề pháp lý cần làm rõ.","Xác định luật áp dụng: với từng vấn đề pháp lý mấu chốt, nêu căn cứ pháp luật (điều, khoản, văn bản) và án lệ có thể áp dụng.","Phương án giải quyết: chọn phương thức giải quyết; phân tích, kết luận từng vấn đề; đề xuất phương án và đánh giá tính khả thi.","Trả lời tư vấn: rủi ro pháp lý; kết luận, khuyến nghị và việc khách hàng cần làm tiếp; hình thức tư vấn phù hợp và lý do."],"guide":["Tiếp xúc khách hàng: khách hàng là chị Trần Thị Phượng — cháu nội, người đang quản lý, sử dụng di sản, được đưa vào vụ án. Yêu cầu: được tiếp tục ở, được tính công sức chăm sóc, quản lý, tôn tạo nhà. Giấy tờ đã có: hóa đơn, hợp đồng sửa chữa năm 2019. Cần bổ sung: thông báo thụ lý, đơn khởi kiện; giấy tờ nhà; giấy chứng tử ông bà; xác nhận cư trú của chị Phượng; người làm chứng việc chăm sóc bà nội; chứng cứ chi phí khác (thuế, điện nước, sửa chữa nhỏ); ý kiến bằng văn bản của ông Trải.","Xác định vấn đề pháp lý: thừa kế theo pháp luật; quyền của người quản lý, tôn tạo di sản không phải người thừa kế. Vấn đề cần làm rõ: (i) chị Phượng có phải người thừa kế không (bố còn sống nên không thừa kế thế vị); (ii) công sức quản lý, tôn tạo di sản được xem xét thế nào khi chị chưa có yêu cầu; (iii) ông Trải muốn để phần cho chị Phượng thì làm cách nào; (iv) nhu cầu chỗ ở khi chia hiện vật; (v) thời hiệu.","Xác định luật áp dụng: Án lệ số 05/2016/AL (Tòa án phải xem xét công sức quản lý, tôn tạo di sản và nhu cầu chỗ ở của người đang quản lý dù họ chưa có yêu cầu riêng); thừa kế theo pháp luật → Điều 649, 650, 651 BLDS 2015; thừa kế thế vị → Điều 652 BLDS 2015; từ chối nhận di sản → Điều 620 BLDS 2015; thanh toán chi phí bảo quản di sản → Điều 658 BLDS 2015; phân chia di sản → Điều 660 BLDS 2015; tặng cho tài sản → Điều 457, 459 BLDS 2015; thời hiệu → khoản 1 Điều 623 BLDS 2015; yêu cầu độc lập → Điều 201 BLTTDS 2015.","Phương án giải quyết: phương thức tố tụng dân sự (tham gia vụ án với tư cách người có quyền lợi, nghĩa vụ liên quan, đưa ra yêu cầu độc lập), kết hợp hòa giải trong tố tụng. Phân tích: chị Phượng không phải người thừa kế vì ông Trải còn sống. Theo Án lệ 05/2016/AL, Tòa án phải xem xét công sức quản lý, tôn tạo và nhu cầu chỗ ở; tuy vậy, để chắc chắn chị nên đưa yêu cầu độc lập về thanh toán công sức, chi phí 350 triệu đồng. Về phần của ông Trải: nếu ông \"từ chối nhận di sản\" thì phần đó chia cho những người thừa kế khác, không chuyển cho chị Phượng; cách đúng là ông Trải nhận phần thừa kế rồi đề nghị Tòa án giao phần của ông cho chị Phượng (thỏa thuận được ghi nhận) hoặc tặng cho sau khi chia. Mỗi người con hưởng ¼ di sản: không trích công sức thì 6 : 4 = 1,5 tỷ đồng. Phương án: (1) yêu cầu độc lập về công sức; (2) đề nghị giao nhà cho ông Trải (và chị Phượng) nhận hiện vật, thanh toán giá trị cho người khác, nếu có khả năng tài chính; (3) hòa giải.","Trả lời tư vấn: rủi ro — ông Trải làm văn bản từ chối nhận di sản sẽ làm chị Phượng mất cơ hội nhận phần của bố; nếu chị không có khả năng thanh toán giá trị thì Tòa án có thể giao nhà cho người khác, chị chỉ được thanh toán công sức; chi phí sửa chữa thiếu chứng từ có thể không được tính đủ. Khuyến nghị: ông Trải không làm văn bản từ chối mà có ý kiến đề nghị giao phần của mình cho chị Phượng; nộp yêu cầu độc lập trước phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải; chuẩn bị phương án tài chính. Hình thức tư vấn: trực tiếp kết hợp văn bản, vì có hai chủ thể (chị Phượng, ông Trải) cần thống nhất cách làm."],"basis":"Án lệ 05/2016/AL; Điều 457, 459, 620, 623, 649, 650, 651, 652, 658, 660 BLDS 2015; Điều 201 BLTTDS 2015","mcq":["TH6.04.1","TH6.04.2","TH6.04.3","TH6.04.4","TH6.04.5","TH6.04.6","TH6.04.7","TH6.04.8"]}]}]}</script>
