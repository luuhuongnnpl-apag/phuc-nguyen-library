<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Địa vị pháp lý doanh nghiệp"><title>Địa vị pháp lý doanh nghiệp</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Địa vị pháp lý doanh nghiệp</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">DOANH NGHIỆP</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Khái niệm và phạm</text><text x="100" y="261" text-anchor="middle" class="h">vi</text><text x="23" y="291" class="d">Tổ chức có tên, tài</text><text x="23" y="310" class="d">sản, trụ sở; được</text><text x="23" y="329" class="d">thành lập hoặc đăng</text><text x="23" y="348" class="d">ký theo luật để kinh</text><text x="23" y="367" class="d">doanh</text><text x="23" y="394" class="s">• Thành lập và quản</text><text x="23" y="413" class="s">lý</text><text x="23" y="432" class="s">• Tổ chức lại, giải</text><text x="23" y="451" class="s">thể, hoạt động liên</text><text x="23" y="470" class="s">quan</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Các loại hình</text><text x="223" y="270" class="d">Bốn loại hình doanh</text><text x="223" y="289" class="d">nghiệp có chế độ pháp</text><text x="223" y="308" class="d">lý khác nhau</text><text x="223" y="335" class="s">• Công ty TNHH, công</text><text x="223" y="354" class="s">ty cổ phần</text><text x="223" y="373" class="s">• Công ty hợp danh,</text><text x="223" y="392" class="s">doanh nghiệp tư nhân</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Quyền và nghĩa vụ</text><text x="423" y="270" class="d">Tự do kinh doanh đi</text><text x="423" y="289" class="d">cùng trách nhiệm tuân</text><text x="423" y="308" class="d">thủ pháp luật</text><text x="423" y="335" class="s">• Ngành nghề luật</text><text x="423" y="354" class="s">không cấm</text><text x="423" y="373" class="s">• Thuế, kế toán, lao</text><text x="423" y="392" class="s">động, điều kiện kinh</text><text x="423" y="411" class="s">doanh</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Chủ thể quản trị</text><text x="623" y="270" class="d">Nhận diện người đại</text><text x="623" y="289" class="d">diện và cá nhân chi</text><text x="623" y="308" class="d">phối thực tế</text><text x="623" y="335" class="s">• Người đại diện</text><text x="623" y="354" class="s">theo pháp luật</text><text x="623" y="373" class="s">• Chủ sở hữu hưởng</text><text x="623" y="392" class="s">lợi, thông tin phải</text><text x="623" y="411" class="s">lưu giữ</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Giới hạn pháp lý</text><text x="823" y="270" class="d">Cấm gian dối trong</text><text x="823" y="289" class="d">đăng ký, vốn và hoạt</text><text x="823" y="308" class="d">động doanh nghiệp</text><text x="823" y="335" class="s">• Kê khai giả mạo,</text><text x="823" y="354" class="s">khống vốn</text><text x="823" y="373" class="s">• Định giá sai tài</text><text x="823" y="392" class="s">sản góp vốn</text></svg>