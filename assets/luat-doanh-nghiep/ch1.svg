<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Mind map Chương 1 – Địa vị pháp lý của doanh nghiệp</title><desc id="desc">Sơ đồ tư duy gồm khái niệm, loại hình, quyền và nghĩa vụ, chủ thể liên quan, nhận diện pháp lý và hành vi bị nghiêm cấm.</desc>
<defs><style>
text{font-family:'Be Vietnam Pro',Arial,sans-serif;fill:#18324b}.center{fill:#174e70}.centerText{fill:#fff;font-size:28px;font-weight:700}.node{fill:#fff;stroke:#7ba6bd;stroke-width:3}.head{font-size:24px;font-weight:700}.body{font-size:18px}.line{fill:none;stroke:#7ba6bd;stroke-width:5;stroke-linecap:round}
</style></defs>
<rect width="1400" height="900" rx="30" fill="#f4f7fa"/>
<path class="line" d="M700 450 C560 450 520 170 380 170 M700 450 C560 450 520 370 380 370 M700 450 C560 450 520 570 380 570 M700 450 C840 450 880 170 1020 170 M700 450 C840 450 880 370 1020 370 M700 450 C840 450 880 570 1020 570"/>
<rect class="center" x="520" y="360" width="360" height="180" rx="28"/><text class="centerText" x="700" y="430" text-anchor="middle">ĐỊA VỊ PHÁP LÝ</text><text class="centerText" x="700" y="470" text-anchor="middle">DOANH NGHIỆP</text><text x="700" y="510" text-anchor="middle" style="fill:#d8e9f2;font-size:17px">Chương 1 · Khái quát chung</text>
<rect class="node" x="45" y="90" width="340" height="160" rx="22"/><text class="head" x="75" y="132">1. Khái niệm và phạm vi</text><text class="body" x="75" y="174">• Tổ chức có tên, tài sản, trụ sở</text><text class="body" x="75" y="207">• Thành lập để kinh doanh</text>
<rect class="node" x="45" y="290" width="340" height="160" rx="22"/><text class="head" x="75" y="332">2. Loại hình doanh nghiệp</text><text class="body" x="75" y="374">• TNHH · Cổ phần · Hợp danh</text><text class="body" x="75" y="407">• Doanh nghiệp tư nhân</text>
<rect class="node" x="45" y="490" width="340" height="160" rx="22"/><text class="head" x="75" y="532">3. Quyền và nghĩa vụ</text><text class="body" x="75" y="574">• Tự do kinh doanh ngành nghề</text><text class="body" x="75" y="607">• Thuế · Kế toán · Lao động</text>
<rect class="node" x="1015" y="90" width="340" height="160" rx="22"/><text class="head" x="1045" y="132">4. Chủ thể liên quan</text><text class="body" x="1045" y="174">• Doanh nghiệp và thương nhân</text><text class="body" x="1045" y="207">• Phân biệt hộ kinh doanh</text>
<rect class="node" x="1015" y="290" width="340" height="160" rx="22"/><text class="head" x="1045" y="332">5. Nhận diện pháp lý</text><text class="body" x="1045" y="374">• Người đại diện theo pháp luật</text><text class="body" x="1045" y="407">• Chủ sở hữu hưởng lợi</text>
<rect class="node" x="1015" y="490" width="340" height="160" rx="22"/><text class="head" x="1045" y="532">6. Giới hạn và cấm đoán</text><text class="body" x="1045" y="574">• Điều kiện kinh doanh</text><text class="body" x="1045" y="607">• Kê khai giả · Khống vốn</text>
<text x="700" y="820" text-anchor="middle" style="font-size:18px;fill:#52697b">Căn cứ chính: Luật Doanh nghiệp 2020, sửa đổi 2022 và 2025 · Luật Thương mại 2005</text>
</svg>