<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Thành lập, đăng ký và vốn góp"><title>Thành lập, đăng ký và vốn góp</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Thành lập, đăng ký và vốn góp</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">THÀNH LẬP</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Quyền thành lập</text><text x="23" y="270" class="d">Xác định đúng chủ thể</text><text x="23" y="289" class="d">có quyền và trường</text><text x="23" y="308" class="d">hợp bị cấm, hạn chế</text><text x="23" y="335" class="s">• Quyền thành lập,</text><text x="23" y="354" class="s">quản lý</text><text x="23" y="373" class="s">• Quyền góp vốn, mua</text><text x="23" y="392" class="s">cổ phần</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Hồ sơ đăng ký</text><text x="223" y="270" class="d">Hồ sơ thay đổi theo</text><text x="223" y="289" class="d">loại hình và thông</text><text x="223" y="308" class="d">tin phải kê khai</text><text x="223" y="335" class="s">• Giấy đề nghị, Điều</text><text x="223" y="354" class="s">lệ</text><text x="223" y="373" class="s">• Danh sách thành</text><text x="223" y="392" class="s">viên hoặc cổ đông</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Đăng ký và nhận</text><text x="500" y="261" text-anchor="middle" class="h">diện</text><text x="423" y="291" class="d">Cơ quan đăng ký ghi</text><text x="423" y="310" class="d">nhận thông tin pháp</text><text x="423" y="329" class="d">lý cơ bản</text><text x="423" y="356" class="s">• Tên, trụ sở, ngành</text><text x="423" y="375" class="s">nghề</text><text x="423" y="394" class="s">• Chi nhánh, văn</text><text x="423" y="413" class="s">phòng đại diện</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Tài sản góp vốn</text><text x="623" y="270" class="d">Tài sản phải thuộc</text><text x="623" y="289" class="d">quyền hợp pháp và</text><text x="623" y="308" class="d">chuyển cho công ty</text><text x="623" y="335" class="s">• Tiền, vàng, quyền</text><text x="623" y="354" class="s">tài sản</text><text x="623" y="373" class="s">• Định giá và chuyển</text><text x="623" y="392" class="s">quyền sở hữu</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Sau đăng ký</text><text x="823" y="270" class="d">Doanh nghiệp cập nhật</text><text x="823" y="289" class="d">thông tin khi có thay</text><text x="823" y="308" class="d">đổi</text><text x="823" y="335" class="s">• Điều chỉnh vốn,</text><text x="823" y="354" class="s">thành viên</text><text x="823" y="373" class="s">• Chủ sở hữu hưởng</text><text x="823" y="392" class="s">lợi và dữ liệu đăng</text><text x="823" y="411" class="s">ký</text></svg>