<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Công ty hợp danh và doanh nghiệp tư nhân"><title>Công ty hợp danh và doanh nghiệp tư nhân</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Công ty hợp danh và doanh nghiệp tư nhân</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">LOẠI HÌNH ĐẶC THÙ</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Công ty hợp danh</text><text x="23" y="270" class="d">Có ít nhất hai thành</text><text x="23" y="289" class="d">viên hợp danh là cá</text><text x="23" y="308" class="d">nhân</text><text x="23" y="335" class="s">• Thành viên hợp</text><text x="23" y="354" class="s">danh</text><text x="23" y="373" class="s">• Thành viên góp vốn</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Trách nhiệm tài sản</text><text x="223" y="270" class="d">Phân biệt trách nhiệm</text><text x="223" y="289" class="d">vô hạn và hữu hạn</text><text x="223" y="316" class="s">• Hợp danh: liên</text><text x="223" y="335" class="s">đới, vô hạn</text><text x="223" y="354" class="s">• Góp vốn: trong</text><text x="223" y="373" class="s">phạm vi vốn cam kết</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Quản lý hợp danh</text><text x="423" y="270" class="d">Thành viên hợp danh</text><text x="423" y="289" class="d">đại diện, quản lý và</text><text x="423" y="308" class="d">chịu nghĩa vụ đặc thù</text><text x="423" y="335" class="s">• Hội đồng thành</text><text x="423" y="354" class="s">viên</text><text x="423" y="373" class="s">• Trung thành, hạn</text><text x="423" y="392" class="s">chế cạnh tranh</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Doanh nghiệp tư</text><text x="700" y="261" text-anchor="middle" class="h">nhân</text><text x="623" y="291" class="d">Một cá nhân làm chủ;</text><text x="623" y="310" class="d">không có tư cách pháp</text><text x="623" y="329" class="d">nhân</text><text x="623" y="356" class="s">• Chủ doanh nghiệp</text><text x="623" y="375" class="s">• Trách nhiệm bằng</text><text x="623" y="394" class="s">toàn bộ tài sản</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Giới hạn và chuyển</text><text x="900" y="261" text-anchor="middle" class="h">đổi</text><text x="823" y="291" class="d">Không phát hành chứng</text><text x="823" y="310" class="d">khoán; có điều kiện</text><text x="823" y="329" class="d">hạn chế và chuyển đổi</text><text x="823" y="356" class="s">• Không đồng thời</text><text x="823" y="375" class="s">giữ tư cách bị cấm</text><text x="823" y="394" class="s">• Chuyển đổi sang</text><text x="823" y="413" class="s">loại hình công ty</text></svg>