<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Công ty trách nhiệm hữu hạn"><title>Công ty trách nhiệm hữu hạn</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Công ty trách nhiệm hữu hạn</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">CÔNG TY TNHH</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Hai thành viên trở</text><text x="100" y="261" text-anchor="middle" class="h">lên</text><text x="23" y="291" class="d">Có từ 02 đến 50 thành</text><text x="23" y="310" class="d">viên; thành viên góp</text><text x="23" y="329" class="d">vốn và cùng quản trị</text><text x="23" y="356" class="s">• Hội đồng thành</text><text x="23" y="375" class="s">viên</text><text x="23" y="394" class="s">• Thành viên, phần</text><text x="23" y="413" class="s">vốn góp</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Một thành viên</text><text x="223" y="270" class="d">Một tổ chức hoặc cá</text><text x="223" y="289" class="d">nhân làm chủ sở hữu</text><text x="223" y="316" class="s">• Chủ sở hữu quyết</text><text x="223" y="335" class="s">định</text><text x="223" y="354" class="s">• Cơ cấu quản lý</text><text x="223" y="373" class="s">theo tư cách chủ sở</text><text x="223" y="392" class="s">hữu</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Vốn và trách nhiệm</text><text x="423" y="270" class="d">Có tư cách pháp nhân;</text><text x="423" y="289" class="d">trách nhiệm hữu hạn</text><text x="423" y="308" class="d">theo luật</text><text x="423" y="335" class="s">• Vốn điều lệ và</text><text x="423" y="354" class="s">thời hạn góp</text><text x="423" y="373" class="s">• Xử lý phần vốn</text><text x="423" y="392" class="s">chưa góp</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Chuyển nhượng vốn</text><text x="623" y="270" class="d">Phần vốn góp chịu cơ</text><text x="623" y="289" class="d">chế ưu tiên và điều</text><text x="623" y="308" class="d">kiện chuyển nhượng</text><text x="623" y="335" class="s">• Chào bán cho thành</text><text x="623" y="354" class="s">viên còn lại</text><text x="623" y="373" class="s">• Mua lại, thừa kế,</text><text x="623" y="392" class="s">chuyển nhượng</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Quản trị</text><text x="823" y="270" class="d">Thẩm quyền phân định</text><text x="823" y="289" class="d">giữa chủ sở hữu/Hội</text><text x="823" y="308" class="d">đồng thành viên và</text><text x="823" y="327" class="d">người điều hành</text><text x="823" y="354" class="s">• Chủ tịch, Giám đốc</text><text x="823" y="373" class="s">• Kiểm soát và nghị</text><text x="823" y="392" class="s">quyết</text></svg>