<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Tổ chức lại, giải thể và phục hồi, phá sản"><title>Tổ chức lại, giải thể và phục hồi, phá sản</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Tổ chức lại, giải thể và phục hồi, phá sản</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">CHẤM DỨT / TÁI CẤU TRÚC</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Tổ chức lại</text><text x="23" y="270" class="d">Thay đổi cấu trúc</text><text x="23" y="289" class="d">pháp lý, chủ thể hoặc</text><text x="23" y="308" class="d">quy mô doanh nghiệp</text><text x="23" y="335" class="s">• Chia, tách</text><text x="23" y="354" class="s">• Hợp nhất, sáp</text><text x="23" y="373" class="s">nhập, chuyển đổi</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Giải thể</text><text x="223" y="270" class="d">Chấm dứt theo căn cứ</text><text x="223" y="289" class="d">luật định và phải</text><text x="223" y="308" class="d">thanh toán hết nghĩa</text><text x="223" y="327" class="d">vụ</text><text x="223" y="354" class="s">• Căn cứ giải thể</text><text x="223" y="373" class="s">• Thanh lý, thanh</text><text x="223" y="392" class="s">toán, hoàn tất thủ</text><text x="223" y="411" class="s">tục</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Phục hồi</text><text x="423" y="270" class="d">Tái cơ cấu để khôi</text><text x="423" y="289" class="d">phục khả năng thanh</text><text x="423" y="308" class="d">toán và hoạt động</text><text x="423" y="335" class="s">• Nguy cơ mất khả</text><text x="423" y="354" class="s">năng thanh toán</text><text x="423" y="373" class="s">• Phương án phục hồi</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Phá sản</text><text x="623" y="270" class="d">Thủ tục tư pháp khi</text><text x="623" y="289" class="d">doanh nghiệp mất khả</text><text x="623" y="308" class="d">năng thanh toán</text><text x="623" y="335" class="s">• Mốc 06 tháng</text><text x="623" y="354" class="s">• Đơn yêu cầu, mở</text><text x="623" y="373" class="s">thủ tục, tuyên bố</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Hậu quả pháp lý</text><text x="823" y="270" class="d">Bảo vệ chủ nợ, người</text><text x="823" y="289" class="d">lao động và xử lý tài</text><text x="823" y="308" class="d">sản theo thứ tự luật</text><text x="823" y="327" class="d">định</text><text x="823" y="354" class="s">• Kế thừa nghĩa vụ</text><text x="823" y="373" class="s">khi tổ chức lại</text><text x="823" y="392" class="s">• Thứ tự phân chia</text><text x="823" y="411" class="s">tài sản</text></svg>