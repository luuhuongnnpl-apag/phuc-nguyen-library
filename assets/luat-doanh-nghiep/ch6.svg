<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Quản trị, doanh nghiệp nhà nước và nhóm công ty"><title>Quản trị, doanh nghiệp nhà nước và nhóm công ty</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Quản trị, doanh nghiệp nhà nước và nhóm công ty</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">QUẢN TRỊ</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Nguyên tắc quản trị</text><text x="23" y="270" class="d">Người quản lý hành</text><text x="23" y="289" class="d">động trung thực, cẩn</text><text x="23" y="308" class="d">trọng và trung thành</text><text x="23" y="335" class="s">• Trách nhiệm người</text><text x="23" y="354" class="s">đại diện</text><text x="23" y="373" class="s">• Không lạm dụng tài</text><text x="23" y="392" class="s">sản, thông tin</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Cơ cấu quản lý</text><text x="223" y="270" class="d">Cơ quan quản trị khác</text><text x="223" y="289" class="d">nhau theo từng loại</text><text x="223" y="308" class="d">hình</text><text x="223" y="335" class="s">• TNHH và hợp danh</text><text x="223" y="354" class="s">• Công ty cổ phần</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Doanh nghiệp nhà</text><text x="500" y="261" text-anchor="middle" class="h">nước</text><text x="423" y="291" class="d">Nhà nước nắm giữ trên</text><text x="423" y="310" class="d">50% vốn hoặc quyền</text><text x="423" y="329" class="d">biểu quyết</text><text x="423" y="356" class="s">• Nhận diện theo tỷ</text><text x="423" y="375" class="s">lệ sở hữu</text><text x="423" y="394" class="s">• Quyền đại diện chủ</text><text x="423" y="413" class="s">sở hữu</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Quản lý vốn nhà</text><text x="700" y="261" text-anchor="middle" class="h">nước</text><text x="623" y="291" class="d">Áp dụng luật chuyên</text><text x="623" y="310" class="d">ngành và văn bản</text><text x="623" y="329" class="d">hướng dẫn hiện hành</text><text x="623" y="356" class="s">• VBHN 60/VBHN-VPQH</text><text x="623" y="375" class="s">• Nghị định</text><text x="623" y="394" class="s">366/2025/NĐ-CP</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Nhóm công ty</text><text x="823" y="270" class="d">Công ty mẹ, công ty</text><text x="823" y="289" class="d">con có quan hệ chi</text><text x="823" y="308" class="d">phối nhưng độc lập</text><text x="823" y="327" class="d">pháp lý</text><text x="823" y="354" class="s">• Quan hệ sở hữu,</text><text x="823" y="373" class="s">kiểm soát</text><text x="823" y="392" class="s">• Trách nhiệm và</text><text x="823" y="411" class="s">giao dịch liên quan</text></svg>