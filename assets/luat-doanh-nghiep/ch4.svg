<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Công ty cổ phần"><title>Công ty cổ phần</title><style>text{font-family:Arial,sans-serif;fill:#21364b}.edge{fill:none;stroke:#7890a7;stroke-width:3}.card{fill:#f5f8fc;stroke:#9aafc2;stroke-width:2}.bar{fill:#527da3}.h{font-size:16px;font-weight:700}.d{font-size:12px}.s{font-size:12px;fill:#3e647f}</style><rect width="1000" height="540" rx="24" fill="#fff"/><text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#19344f">Công ty cổ phần</text><rect x="370" y="78" width="260" height="72" rx="18" fill="#19344f"/><text x="500" y="121" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">CÔNG TY CỔ PHẦN</text><path d="M500 150 Q100 170 100 210" class="edge"/><rect x="10" y="210" width="180" height="290" rx="16" class="card"/><rect x="10" y="210" width="180" height="8" rx="4" class="bar"/><text x="100" y="240" text-anchor="middle" class="h">Cấu trúc vốn</text><text x="23" y="270" class="d">Vốn điều lệ chia</text><text x="23" y="289" class="d">thành cổ phần; tối</text><text x="23" y="308" class="d">thiểu 03 cổ đông</text><text x="23" y="335" class="s">• Cổ phần phổ thông</text><text x="23" y="354" class="s">• Cổ phần ưu đãi</text><path d="M500 150 Q300 170 300 210" class="edge"/><rect x="210" y="210" width="180" height="290" rx="16" class="card"/><rect x="210" y="210" width="180" height="8" rx="4" class="bar"/><text x="300" y="240" text-anchor="middle" class="h">Quyền cổ đông</text><text x="223" y="270" class="d">Quyền tài sản và</text><text x="223" y="289" class="d">quyền quản trị gắn</text><text x="223" y="308" class="d">với loại cổ phần</text><text x="223" y="335" class="s">• Biểu quyết, dự họp</text><text x="223" y="354" class="s">• Cổ tức, ưu tiên</text><text x="223" y="373" class="s">mua, tiếp cận thông</text><text x="223" y="392" class="s">tin</text><path d="M500 150 Q500 170 500 210" class="edge"/><rect x="410" y="210" width="180" height="290" rx="16" class="card"/><rect x="410" y="210" width="180" height="8" rx="4" class="bar"/><text x="500" y="240" text-anchor="middle" class="h">Huy động vốn</text><text x="423" y="270" class="d">Chào bán cổ phần,</text><text x="423" y="289" class="d">phát hành chứng khoán</text><text x="423" y="308" class="d">theo điều kiện</text><text x="423" y="335" class="s">• Chào bán riêng lẻ</text><text x="423" y="354" class="s">• Chào bán ra công</text><text x="423" y="373" class="s">chúng, trái phiếu</text><path d="M500 150 Q700 170 700 210" class="edge"/><rect x="610" y="210" width="180" height="290" rx="16" class="card"/><rect x="610" y="210" width="180" height="8" rx="4" class="bar"/><text x="700" y="240" text-anchor="middle" class="h">Cơ cấu quản trị</text><text x="623" y="270" class="d">Đại hội đồng cổ đông</text><text x="623" y="289" class="d">quyết định cao nhất;</text><text x="623" y="308" class="d">Hội đồng quản trị</text><text x="623" y="327" class="d">quản lý</text><text x="623" y="354" class="s">• Đại hội đồng cổ</text><text x="623" y="373" class="s">đông</text><text x="623" y="392" class="s">• Hội đồng quản trị,</text><text x="623" y="411" class="s">Giám đốc, kiểm soát</text><path d="M500 150 Q900 170 900 210" class="edge"/><rect x="810" y="210" width="180" height="290" rx="16" class="card"/><rect x="810" y="210" width="180" height="8" rx="4" class="bar"/><text x="900" y="240" text-anchor="middle" class="h">Kiểm soát lợi ích</text><text x="823" y="270" class="d">Bảo vệ cổ đông và</text><text x="823" y="289" class="d">minh bạch giao dịch</text><text x="823" y="308" class="d">có liên quan</text><text x="823" y="335" class="s">• Công bố lợi ích</text><text x="823" y="354" class="s">liên quan</text><text x="823" y="373" class="s">• Thẩm quyền chấp</text><text x="823" y="392" class="s">thuận, trách nhiệm</text></svg>