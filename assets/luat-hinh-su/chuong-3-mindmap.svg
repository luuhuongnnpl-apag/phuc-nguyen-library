<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t d"><title id="t">CHƯƠNG 3 · HÌNH PHẠT VÀ CÁC BIỆN PHÁP TƯ PHÁP</title><desc id="d">Mind map theo đề mục 3.1–3.2 của đề cương; ngày chốt 28/10/2026</desc><defs><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#243447}.head{font-size:27px;font-weight:700;fill:#fff}.sub{font-size:18px;fill:#eaf1f7}.bh{font-size:21px;font-weight:700;fill:#fff}.tx{font-size:18px}.card{fill:#fff;stroke:#d2dce5;stroke-width:2}.line{fill:none;stroke:#9aabba;stroke-width:4}.c1{fill:#356b8c}.c2{fill:#547b52}.c3{fill:#8b6544}</style></defs><rect width="1600" height="1100" fill="#f5f7fa"/><rect x="100" y="25" width="1400" height="115" rx="22" fill="#263f59"/><text x="800" y="72" text-anchor="middle" class="head">CHƯƠNG 3 · HÌNH PHẠT VÀ CÁC BIỆN PHÁP TƯ PHÁP</text><text x="800" y="108" text-anchor="middle" class="sub">Mind map theo đề mục 3.1–3.2 của đề cương; ngày chốt 28/10/2026</text><path class="line" d="M800 140 V175 H280 V210"/><rect class="card" x="35" y="210" width="490" height="820" rx="18"/><path class="c1" d="M53 210 H507 Q525 210 525 228 V280 H35 V228 Q35 210 53 210Z"/><text x="57" y="255" class="bh">3.1. Hình phạt</text><text x="57" y="328" class="tx">• Khái niệm, mục đích: Điều 30–31</text><text x="57" y="386" class="tx">• Hình phạt chính, bổ sung: Điều 32–33</text><text x="57" y="444" class="tx">• Quyết định: Điều 50–52</text><text x="57" y="502" class="tx">• Tổng hợp: Điều 55–58</text><text x="57" y="560" class="tx">• Miễn hình phạt: Điều 59 BLHS</text><path class="line" d="M800 140 V175 H800 V210"/><rect class="card" x="555" y="210" width="490" height="820" rx="18"/><path class="c2" d="M53 210 H1027 Q1045 210 1045 228 V280 H555 V228 Q555 210 573 210Z"/><text x="577" y="255" class="bh">3.2. Biện pháp tư pháp</text><text x="577" y="328" class="tx">• Có căn cứ và mục đích riêng</text><text x="577" y="386" class="tx">• Tịch thu vật, tiền liên quan tội phạm</text><text x="577" y="444" class="tx">• Trả lại tài sản, sửa chữa/bồi thường</text><text x="577" y="502" class="tx">• Bắt buộc chữa bệnh theo luật</text><text x="577" y="560" class="tx">• Căn cứ: Điều 46–49 BLHS</text><path class="line" d="M800 140 V175 H1320 V210"/><rect class="card" x="1075" y="210" width="490" height="820" rx="18"/><path class="c3" d="M53 210 H1547 Q1565 210 1565 228 V280 H1075 V228 Q1075 210 1093 210Z"/><text x="1097" y="255" class="bh">Phân biệt và cập nhật</text><text x="1097" y="328" class="tx">• Không đồng nhất với hình phạt</text><text x="1097" y="386" class="tx">• Cá thể hóa theo từng bị cáo</text><text x="1097" y="444" class="tx">• Đối chiếu Luật 86/2025/QH15</text><text x="1097" y="502" class="tx">• Kiểm tra quy định chuyển tiếp</text><text x="1097" y="560" class="tx">• Rà soát pháp luật tại ngày chốt</text></svg>