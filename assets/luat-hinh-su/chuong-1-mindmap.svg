<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t d"><title id="t">CHƯƠNG 1 · NHỮNG VẤN ĐỀ CƠ BẢN VỀ LUẬT HÌNH SỰ</title><desc id="d">Mind map theo đề mục 1.1–1.3 của đề cương; ngày chốt 28/10/2026</desc><defs><style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#243447}.head{font-size:27px;font-weight:700;fill:#fff}.sub{font-size:18px;fill:#eaf1f7}.bh{font-size:21px;font-weight:700;fill:#fff}.tx{font-size:18px}.card{fill:#fff;stroke:#d2dce5;stroke-width:2}.line{fill:none;stroke:#9aabba;stroke-width:4}.c1{fill:#356b8c}.c2{fill:#547b52}.c3{fill:#8b6544}</style></defs><rect width="1600" height="1100" fill="#f5f7fa"/><rect x="100" y="25" width="1400" height="115" rx="22" fill="#263f59"/><text x="800" y="72" text-anchor="middle" class="head">CHƯƠNG 1 · NHỮNG VẤN ĐỀ CƠ BẢN VỀ LUẬT HÌNH SỰ</text><text x="800" y="108" text-anchor="middle" class="sub">Mind map theo đề mục 1.1–1.3 của đề cương; ngày chốt 28/10/2026</text><path class="line" d="M800 140 V175 H280 V210"/><rect class="card" x="35" y="210" width="490" height="820" rx="18"/><path class="c1" d="M53 210 H507 Q525 210 525 228 V280 H35 V228 Q35 210 53 210Z"/><text x="57" y="255" class="bh">1.1. Khái niệm, đối tượng, phương pháp</text><text x="57" y="328" class="tx">• Luật hình sự: tội phạm và hình phạt</text><text x="57" y="386" class="tx">• Đối tượng: quan hệ khi xác định TNHS</text><text x="57" y="444" class="tx">• Phương pháp: quyền lực nhà nước</text><text x="57" y="502" class="tx">• Căn cứ: Điều 1, 2 BLHS</text><path class="line" d="M800 140 V175 H800 V210"/><rect class="card" x="555" y="210" width="490" height="820" rx="18"/><path class="c2" d="M53 210 H1027 Q1045 210 1045 228 V280 H555 V228 Q555 210 573 210Z"/><text x="577" y="255" class="bh">1.2. Nhiệm vụ, nguyên tắc</text><text x="577" y="328" class="tx">• Bảo vệ lợi ích được pháp luật bảo vệ</text><text x="577" y="386" class="tx">• Phòng ngừa, đấu tranh tội phạm</text><text x="577" y="444" class="tx">• Hợp pháp, bình đẳng trước pháp luật</text><text x="577" y="502" class="tx">• Nghiêm minh gắn với nhân đạo</text><text x="577" y="560" class="tx">• Căn cứ: Điều 1, 3, 4 BLHS</text><path class="line" d="M800 140 V175 H1320 V210"/><rect class="card" x="1075" y="210" width="490" height="820" rx="18"/><path class="c3" d="M53 210 H1547 Q1565 210 1565 228 V280 H1075 V228 Q1075 210 1093 210Z"/><text x="1097" y="255" class="bh">1.3. Nguồn của luật hình sự</text><text x="1097" y="328" class="tx">• BLHS quy định tội phạm, hình phạt</text><text x="1097" y="386" class="tx">• Án lệ hỗ trợ áp dụng thống nhất</text><text x="1097" y="444" class="tx">• Điều ước quốc tế liên quan</text><text x="1097" y="502" class="tx">• Không gian: Điều 5–6 BLHS</text><text x="1097" y="560" class="tx">• Thời gian: Điều 7 BLHS</text></svg>