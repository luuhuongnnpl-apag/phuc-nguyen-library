<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Phúc Nguyên Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap">
<style>
/* Bố cục theo bản phác của giảng viên: băng tiêu đề xanh thép có logo; hàng trên gồm khung Học phần (trái) và Tài liệu học tập (phải); hàng dưới gồm Hướng dẫn sử dụng và Dữ liệu truy cập */
:root{
  --bg:#f2f4f9; --paper:#ffffff; --ink:#18263a; --muted:#5a6678; --line:#dfe3ec;
  --band:#1d5677; --band-2:#16455f; --on-band:#ffffff; --on-band-2:#cfe0ea;
  --head:#1f4f7a; --frame:#b9b3da; --tint:#eef2f9;
  --red:#d33a3a; --red-soft:#fdecec; --ok:#1f7a4d; --bad:#b3261e;
  --f-display:"Merriweather",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --paper:#141d2c; --ink:#e6ebf3; --muted:#9ca8bb; --line:#27334a;
  --band:#143e57; --band-2:#0f3146; --on-band:#ffffff; --on-band-2:#b8d0de;
  --head:#9cc4e6; --frame:#4a4673; --tint:#1a2638;
  --red:#ef6b6b; --red-soft:#3a1d1f; --ok:#6fd3a0; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --paper:#141d2c; --ink:#e6ebf3; --muted:#9ca8bb; --line:#27334a;
  --band:#143e57; --band-2:#0f3146; --on-band:#ffffff; --on-band-2:#b8d0de;
  --head:#9cc4e6; --frame:#4a4673; --tint:#1a2638;
  --red:#ef6b6b; --red-soft:#3a1d1f; --ok:#6fd3a0; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--head);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.logo img{width:90%;height:90%;object-fit:contain;display:block}

/* Băng tiêu đề */
.band{background:var(--band);color:var(--on-band)}
.band .wrap{display:flex;align-items:center;gap:clamp(14px,3vw,28px);padding-block:18px 16px;position:relative}
.band .logo{width:clamp(70px,11vw,112px);aspect-ratio:1}
.band .titles{flex:1;min-width:0;text-align:center}
.band .kicker{font:900 clamp(12px,1.8vw,16px) var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-band-2)}
.band h1{font-size:clamp(28px,6vw,58px);font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.band .copy{font-size:12px;color:var(--on-band-2);margin-top:4px}
.band .who{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;font-size:12.5px;color:var(--on-band-2);text-align:right;line-height:1.35}
.band .who button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;margin-top:4px}
.subbar{background:var(--band-2);color:var(--on-band)}
.subbar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.subbar button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
.subbar h2{font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.subbar .sp{flex:1}
.subbar a{font-size:13.5px;font-weight:600;color:#fff}

/* Khung */
main.wrap{padding-block:22px 40px;display:grid;gap:20px}
.grid-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:20px;align-items:start}
.grid-bot{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,5fr);gap:20px;align-items:stretch}
.frame{background:var(--paper);border:2px dashed var(--frame);border-radius:24px;padding:20px clamp(16px,2.6vw,28px) 24px;min-width:0}
.ftitle{font:900 clamp(20px,2.6vw,28px) var(--f-display);text-transform:uppercase;color:var(--head);letter-spacing:.01em;margin-bottom:14px;display:inline-block;border-bottom:3px solid currentColor;line-height:1.25;padding-bottom:2px}
.center{text-align:center}

/* Học phần */
.courses{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.courses button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;text-align:left}
.courses button:hover{background:var(--tint)}
.courses .nm{flex:1;min-width:0;font:700 15.5px/1.3 var(--f-display);text-transform:uppercase;color:var(--head)}
.courses .soon .nm{color:var(--muted)}
.courses .st{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.courses .open .st{background:var(--head);color:var(--paper)}
.courses .soon .st{color:var(--muted);border:1px solid var(--line)}
.book{flex:none;width:30px;height:24px}

/* Tài liệu học tập */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 20px}
.doc{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0}
.doc .ph{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;background:var(--tint);position:relative}
.doc img{width:100%;height:100%;object-fit:cover;display:block}
.doc.soon img{filter:grayscale(.85) opacity(.6)}
.doc .ph .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;background:rgba(10,20,35,.72);color:#fff;border-radius:999px;padding:2px 9px}
.doc .ttl{font:900 15.5px/1.3 var(--f-display);text-transform:uppercase;color:var(--head);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.doc .ttl:hover{text-decoration:underline}
.doc.soon .ttl{color:var(--muted);cursor:default;text-decoration:none}
.doc .sub{font-size:12.5px;color:var(--muted);margin-top:-4px}

/* Hướng dẫn */
.guide{margin:0;padding-left:26px;display:grid;gap:6px;font:700 clamp(15px,1.8vw,17.5px)/1.45 var(--f-display);color:var(--head)}
.guide li::marker{font-weight:900}
.thanks{margin:10px 0 0 26px;font:700 16px var(--f-display);color:var(--head)}

/* Dữ liệu truy cập */
.stats{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.stats li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--head)}
.stats .lbl{font:700 16px var(--f-display);color:var(--head);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.stats button.lbl:hover{text-decoration:underline}
.stats .val{font:900 17px var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.stats .val.na{font:500 12.5px var(--f-body);color:var(--muted)}
.fb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.bubble{width:58px;height:50px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font:900 34px/1 Georgia,serif;position:relative;padding-top:12px}
.bubble::after{content:"";position:absolute;left:12px;bottom:-10px;border:10px solid transparent;border-top-color:var(--red);border-bottom:0}
.sendfb{font-style:italic;color:var(--muted);font-size:14.5px;text-decoration:none;border-bottom:1px solid currentColor;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;padding:0}
.sendfb:hover{color:var(--head)}

/* Danh sách góp ý */
.fb-list{display:grid;gap:10px;margin-top:12px}
.fb-item{background:var(--tint);border-radius:12px;padding:12px 14px}
.fb-item .m{font-size:12.5px;color:var(--muted)}
.fb-item p{margin:4px 0 0;max-width:70ch}
.info{background:var(--tint);border-radius:12px;padding:12px 16px;font-size:14.5px;color:var(--muted)}

/* Trang học phần */
.viewer{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px))}
.in-course .band{display:none}
.viewer iframe{flex:1;width:100%;border:0;background:var(--bg)}
.soon-page{padding-block:30px 50px}
.soon-page .frame{max-width:720px;margin:0 auto;display:grid;gap:12px}
.soon-page p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--band);border-color:var(--band);color:var(--on-band)}

/* Cổng nhập mã */
.gate{position:fixed;inset:0;z-index:50;overflow-y:auto;background:rgba(8,18,32,.62);display:grid;place-items:center;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{position:relative;width:min(480px,100%);background:var(--paper);border:2px dashed var(--frame);border-radius:24px;overflow:hidden}
.gate-top{background:var(--band);color:var(--on-band);padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gate-top .logo{width:96px;height:96px}
.gate-top .kicker{font:900 13px var(--f-display);letter-spacing:.08em;color:var(--on-band-2)}
.gate-top h1{font-size:28px;text-transform:uppercase;font-weight:900}
.gate-form{padding:22px 26px 24px;display:grid;gap:10px}
.gate-form p{margin:0;color:var(--muted);font-size:14.5px}
label.lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
input[type=text],input[type=month],input[type=date],input[type=number],input[type=password]{width:100%;font:600 17px var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
#code-in,#k-in{letter-spacing:.06em;text-transform:uppercase}
.gate-x{position:absolute;right:10px;top:8px;z-index:2;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font:400 24px/1 var(--f-body);cursor:pointer}
.gate-x:hover{background:rgba(255,255,255,.3)}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.demo{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:13.5px}
.demo code{font:700 14px var(--f-body);letter-spacing:.06em;color:var(--head)}

/* Quản lý mã */
.admin{display:grid;gap:16px}
.admin .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.admin .row>div{display:grid;gap:6px;flex:1;min-width:150px}
.big{font:900 22px var(--f-display);letter-spacing:.04em;color:var(--head);word-break:break-all}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--tint);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.msg{font-size:13.5px;color:var(--muted)}
.admin-link{font-size:13px;color:var(--muted);text-align:center}
.admin-link button{background:none;border:0;color:var(--head);font-weight:700;cursor:pointer;text-decoration:underline}

@media (max-width:900px){.grid-top,.grid-bot{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.band .who{position:static;text-align:left}.band .wrap{flex-wrap:wrap;justify-content:center}.band .titles{flex-basis:100%}.docs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.doc .ttl{font-size:13.5px}}

/* Tài liệu học phần */
.tl-nav{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-block:18px 0}
.tl-pill{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font:900 15px var(--f-display);text-transform:uppercase;color:var(--head);padding:2px 0}
.tl-pill .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--head);border:1.5px solid var(--frame)}
.tl-pill:hover .ic{background:var(--head);color:var(--paper)}
.tl-main{padding-block:14px 44px;display:grid;gap:20px}
.tl-head,.ch-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tl-head .kicker,.ch-head .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;flex-basis:100%}
.tl-head h2,.ch-head h2{font:900 clamp(22px,3.4vw,32px)/1.2 var(--f-display);text-transform:uppercase;color:var(--head)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 20px}
.ch-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0;background:none;cursor:pointer;padding:0;min-width:0}
.ch-card .ph{width:100%;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:var(--tint);display:block}
.ch-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.ch-card:hover img{transform:scale(1.04)}
.ch-card .no{font:900 15px var(--f-display);text-transform:uppercase;color:var(--head)}
.ch-card .nm{font:700 14px/1.35 var(--f-display);color:var(--ink)}
.ch-card .cnt{font-size:12px;color:var(--muted)}
.ch-card .ph.blank{display:grid;place-items:center;background:linear-gradient(135deg,var(--tint),var(--paper));font:900 44px var(--f-display);color:var(--head);opacity:.85}
.ch-card.soon{cursor:default;opacity:.62}
.ch-card.soon:hover img{transform:none}
.law-g{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--paper)}
.law-g summary{cursor:pointer;padding:11px 16px;font:700 15px var(--f-display);color:var(--head);display:flex;justify-content:space-between;gap:10px;list-style:none}
.law-g summary::-webkit-details-marker{display:none}
.law-g summary .n{font:600 12px var(--f-body);color:var(--muted);background:var(--tint);border-radius:999px;padding:1px 9px;align-self:center}
.law-g ol{margin:0;padding:0 18px 14px 36px;display:grid;gap:8px}
.law-g li{max-width:80ch}
.law-g li b{font-weight:600}
.law-g .meta{display:block;font-size:12.5px;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ref-g h4{margin:0 0 6px;font:900 14px var(--f-display);text-transform:uppercase;color:var(--head)}
.ref-g ul{margin:0;padding-left:20px;display:grid;gap:6px;font-style:italic;color:var(--ink)}
.mm-tabs{display:flex;gap:8px;flex-wrap:wrap}
.mm-tabs button{border:1.5px solid var(--frame);background:var(--paper);color:var(--head);border-radius:999px;padding:7px 16px;font:700 14px var(--f-display);cursor:pointer}
.mm-tabs button[aria-selected="true"]{background:var(--head);border-color:var(--head);color:var(--paper)}
.ch-pager{display:flex;justify-content:space-between;gap:10px}

/* Tờ sơ đồ: giữ nền giấy trắng ở cả hai chế độ sáng, tối như slide in */
.sheet{position:relative;overflow:hidden;background:#fff;color:#14304f;border:2px dashed var(--frame);border-radius:24px;padding:18px 16px 60px;--ln:#8592a3}
.sheet-deco{position:absolute;right:-90px;top:-90px;width:230px;height:230px;border-radius:50%;background:#1d4f74;pointer-events:none}
.sheet-logo{position:absolute;left:18px;top:16px;width:58px;height:58px;object-fit:contain}
.draft{position:relative;z-index:1;margin:0 auto 6px;width:max-content;max-width:100%;font-size:12px;font-weight:700;color:#8a4b0f;background:#fdf0dc;border-radius:999px;padding:3px 12px}
.mm-tools{position:absolute;z-index:3;right:16px;bottom:12px;display:flex;gap:6px}
.mm-tools button{border:1px solid #c9d0da;background:#fff;color:#14304f;border-radius:8px;min-width:34px;height:32px;font:700 14px var(--f-body);cursor:pointer;padding:0 10px}
.mm-vp{position:relative;z-index:1;overflow:auto;max-width:100%}
.mm-sizer{position:relative;margin:0 auto}
.mm-canvas{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;padding:4px 8px 10px}
.mm-title{text-align:center;padding:4px 70px 18px}
.mm-title .h1{font:900 46px/1.1 var(--f-display);text-transform:uppercase;color:#12395c;letter-spacing:.01em}
.mm-title .h2{font:900 24px/1.2 var(--f-display);text-transform:uppercase;color:#12395c;margin-top:4px}
.mm-tree{display:flex;justify-content:center}
.mm-node{display:flex;flex-direction:column;align-items:center}.mm-detail-single{max-width:240px;margin-top:5px;padding:5px 8px;border:1px solid #c8d3df;border-radius:9px;background:#f7f9fc;color:#34465b;font:400 12px/1.4 var(--f-body);text-align:center}.mm-detail-branches{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px 10px;position:relative;padding:22px 4px 0;margin-top:2px;max-width:720px}.mm-detail-branches:before{content:"";position:absolute;top:0;left:50%;height:11px;border-left:1.5px solid var(--ln)}.mm-detail-branches:after{content:"";position:absolute;top:11px;left:8%;right:8%;border-top:1.5px solid var(--ln)}.mm-detail-node{position:relative;display:flex;justify-content:center;max-width:180px;flex:0 1 150px}.mm-detail-node:before{content:"";position:absolute;top:-11px;left:50%;height:11px;border-left:1.5px solid var(--ln)}.mm-detail-box{height:100%;box-sizing:border-box;border:1.2px solid #aab8c8;border-radius:10px;background:#f7f9fc;padding:6px 9px;color:#34465b;font:500 12px/1.38 var(--f-body);text-align:center;overflow-wrap:anywhere}
.mm-box{position:relative;background:#fff;border:1.5px solid #8592a3;border-radius:14px;padding:7px 11px;font:700 13.5px/1.32 var(--f-display);color:#14304f;text-align:center;max-width:140px}
.mm-box.d0{font-size:21px;padding:10px 46px;border-radius:16px;max-width:none;border-color:#6b7787}
.mm-box.d1{font-size:18px;padding:10px 16px;border-radius:20px;max-width:230px;border-color:#6b7787;border-width:1.8px}
.mm-box.d2{font-size:15px;max-width:175px;padding:7px 12px;border-radius:16px}
.mm-box.has-d{max-width:200px}
.mm-box.d1.has-d{max-width:260px}
.mm-d{display:block;margin-top:4px;font:400 12.5px/1.42 var(--f-body);color:#2f3f55}
ul.mm-d{text-align:left;padding-left:14px;margin:4px 0 0}
ul.mm-d li{margin:1px 0}
.mm-kids.row{display:flex;align-items:flex-start;gap:14px;padding-top:30px;position:relative}
.mm-kids.row::before{content:"";position:absolute;top:0;left:50%;height:15px;border-left:1.5px solid var(--ln)}
.mm-kids.row>.mm-kid{position:relative;display:flex;justify-content:center}
.mm-kids.row>.mm-kid::before{content:"";position:absolute;top:-15px;left:-7px;right:-7px;border-top:1.5px solid var(--ln)}
.mm-kids.row>.mm-kid:first-child::before{left:50%}
.mm-kids.row>.mm-kid:last-child::before{right:50%}
.mm-kids.row>.mm-kid:only-child::before{display:none}
.mm-kids.row>.mm-kid::after{content:"";position:absolute;top:-15px;left:50%;height:15px;border-left:1.5px solid var(--ln)}
.mm-kids.stack{display:flex;flex-direction:column;align-items:center}
.mm-sk{position:relative;padding-top:16px;display:flex;justify-content:center}
.mm-sk::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid var(--ln)}

  {id:"phap-luat-doanh-nghiep-thuong-mai-tmdt",name:"Pháp luật về doanh nghiệp và thương mại, thương mại điện tử",img:"assets/phap-luat-doanh-nghiep-thuong-mai-tmdt-cover.svg",tl:"phap-luat-doanh-nghiep-thuong-mai-tmdt"},

const ALL=[...COURSES];
const course=id=>ALL.find(c=>c.id===id);
const book=c=>`<svg class="book" viewBox="0 0 30 24" aria-hidden="true"><path d="M3 5 L15 2 L27 5 L27 19 L15 22 L3 19 Z" fill="${c}"/><path d="M15 2 L15 22" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/><path d="M5 18 L15 20.5 L25 18" stroke="#fff" stroke-width="1.4" fill="none" opacity=".85"/><path d="M3 5 L15 2 L27 5 L15 8 Z" fill="#fff" opacity=".35"/></svg>`;

/* ===== Chuẩn hóa mã lớp ===== */
function norm(s){return String(s||"").toUpperCase().replace(/\s+/g,"").replace(/[–—]/g,"-")}

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const KEY="pnlib-ma-lop";
let session=null,isOwner=false,visits=null,feedback=null,fbErr="",cmt=null;
const onClaude=!!(window.claude&&window.claude.use);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ===== Tiện ích ngày tháng ===== */
const pad2=n=>String(n).padStart(2,"0");
function fmtDate(iso){const p=String(iso||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
/* ===== Kho dữ liệu trên Claude: mã lớp, lượt dùng, góp ý (thay cho máy chủ Google khi mở trên Claude) ===== */
let DB=null,UID=null,dbReadyRes;const dbReady=new Promise(r=>dbReadyRes=r);
const BE=()=>!!DB;
function call(params){return DB?dbCall(params):Promise.reject(new Error("nobackend"))}
const okCode=c=>/^[A-Z0-9][A-Z0-9_-]{2,23}$/.test(c);
async function luotDocs(){try{return (await DB.collection("luot").get()).docs.map(d=>({id:d.id,x:d.data()||{}}))}catch(e){return null}}
async function dbCall(p){const a=p.action;
  if(a==="check"){const code=norm(p.code);if(!okCode(code))return {ok:false,why:"notfound"};
    const m=await DB.doc("ma/"+code).get();if(!m.exists)return {ok:false,why:"notfound"};
    const x=m.data()||{}, courses=Array.isArray(x.courses)&&x.courses.length?x.courses:["*"];if(todayISO()>x.han)return {ok:false,why:"expired",han:x.han};
    if(p.course&& !courses.includes("*")&&!courses.includes(p.course))return {ok:false,why:"course",courses};
    if(!UID)return {ok:true,han:x.han,note:x.note,max:x.max,courses};
    const mine=DB.doc("luot/"+UID);let codes=[];try{const s=await mine.get();if(s.exists)codes=((s.data()||{}).codes||[]).slice()}catch(e){}
    if(codes.includes(code))return {ok:true,han:x.han,note:x.note,max:x.max,courses};
    const all=await luotDocs();const used=all?all.filter(d=>(d.x.codes||[]).includes(code)).length:0;
    if(all&&x.max&&used>=x.max)return {ok:false,why:"full",max:x.max};
    try{await mine.set({codes:codes.concat(code),t:Date.now()})}catch(e){}
    return {ok:true,han:x.han,note:x.note,used:used+1,max:x.max,courses}}
  if(a==="stats"){const all=await luotDocs();let fb=0;try{(await DB.collection("gopy").get()).docs.forEach(d=>{fb+=((d.data()||{}).items||[]).length})}catch(e){}
    return {ok:true,users:all?all.length:null,feedback:fb}}
  if(a==="fb_list"){const items=[];(await DB.collection("gopy").get()).docs.forEach(d=>((d.data()||{}).items||[]).forEach(x=>items.push(x)));
    items.sort((u,v)=>String(u.ts||u.time).localeCompare(String(v.ts||v.time)));return {ok:true,items}}
  if(a==="fb_add"){if(!UID)return {ok:false,why:"nouser"};const ref=DB.doc("gopy/"+UID);let items=[];try{const s=await ref.get();if(s.exists)items=((s.data()||{}).items||[]).slice()}catch(e){}
    items.push({time:todayISO(),ts:new Date().toISOString(),course:String(p.course||"").slice(0,80),text:String(p.text||"").slice(0,1500)});if(items.length>40)items=items.slice(-40);
    await ref.set({items});return {ok:true}}
  if(a.indexOf("admin_")===0){if(!isOwner)return {ok:false,why:"key"};
    if(a==="admin_list"){const ms=await DB.collection("ma").get(),all=await luotDocs()||[];
      return {ok:true,items:ms.docs.map(d=>{const x=d.data()||{};return {code:d.id,note:x.note||"",han:x.han,max:x.max||0,courses:Array.isArray(x.courses)&&x.courses.length?x.courses:["*"],used:all.filter(l=>(l.x.codes||[]).includes(d.id)).length,created:x.created||""}}).sort((u,v)=>String(u.created).localeCompare(String(v.created)))}}
    if(a==="admin_create"){const code=norm(p.code),max=parseInt(p.max,10);
      if(!okCode(code))return {ok:false,why:"badcode"};if(!/^\d{4}-\d{2}-\d{2}$/.test(p.han||""))return {ok:false,why:"badhan"};if(!(max>=1&&max<=1000))return {ok:false,why:"badmax"};
      if((await DB.doc("ma/"+code).get()).exists)return {ok:false,why:"exists"};
      const courses=String(p.courses||"*")==="*"?["*"]:String(p.courses||"").split(",").filter(x=>COURSES.some(c=>c.id===x));if(!courses.length)return {ok:false,why:"badcourses"};await DB.doc("ma/"+code).set({note:String(p.note||"").slice(0,80),han:p.han,max,courses,created:new Date().toISOString()});return {ok:true,code,courses}}
    if(a==="admin_delete"){const code=norm(p.code);await DB.doc("ma/"+code).delete();
      const all=await luotDocs()||[];for(const d of all){const cs=d.x.codes||[];if(cs.includes(code)){const rest=cs.filter(c=>c!==code);
        if(rest.length)await DB.doc("luot/"+d.id).set(Object.assign({},d.x,{codes:rest}));else await DB.doc("luot/"+d.id).delete()}}
      return {ok:true}}}
  return {ok:false,why:"action"}}

/* ===== Mã lớp trên bản web: đọc data/ma-lop.json (chỉ chứa dấu băm của mã) ===== */
let MA=null;
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const codeHash=(salt,code)=>sha("PNLIB2|"+salt+"|"+norm(code));
async function loadMa(force){if(MA&&!force)return MA;const r=await fetch(GH.path+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("ma");MA=await r.json();return MA}
/* Đếm số người đã dùng mỗi mã: dịch vụ đếm miễn phí Abacus (không cần tài khoản). Mỗi trình duyệt chỉ được đếm một lần cho mỗi mã. */
const CNT="https://abacus.jasoncameron.dev",CNS="phucnguyen-library",SEATS="pnlib-da-dung";
function seatsMine(){try{return JSON.parse(store.get(SEATS)||"{}")||{}}catch(e){return {}}}
async function cntGet(k){try{const r=await fetch(CNT+"/get/"+CNS+"/"+k,{cache:"no-store"});if(r.status===404)return 0;if(!r.ok)return null;return (await r.json()).value|0}catch(e){return null}}
async function claimSeat(k,max){if(!k||!max)return {ok:true};const mine=seatsMine();if(mine[k])return {ok:true};
  let v=null;for(let i=0;i<3&&v==null;i++){try{const r=await fetch(CNT+"/hit/"+CNS+"/"+k,{cache:"no-store"});if(r.ok)v=(await r.json()).value|0;else if(r.status===429)await new Promise(z=>setTimeout(z,2500))}catch(e){}}
  if(v==null)return {ok:true}; /* dịch vụ đếm không phản hồi: vẫn cho vào, lần sau sẽ đếm */
  if(v>max)return {ok:false,why:"full",max};
  mine[k]=1;store.set(SEATS,JSON.stringify(mine));return {ok:true}}
async function staticCheck(code,courseId){const d=await loadMa();const h=await codeHash(d.salt,code);const k=(d.codes||[]).find(x=>x.h===h);
  if(!k)return {ok:false,why:"notfound"};if(todayISO()>k.han)return {ok:false,why:"expired",han:k.han};
  const cs=Array.isArray(k.courses)&&k.courses.length?k.courses:["*"];
  if(courseId&&!cs.includes("*")&&!cs.includes(courseId))return {ok:false,why:"course",courses:cs};
  return {ok:true,han:k.han,note:k.note,courses:cs,k:k.k,max:k.max|0}}
async function checkCode(raw,courseId){const code=norm(raw);
  if(!okCode(code))return {ok:false,why:"Mã gồm 3–24 ký tự: chữ cái không dấu, chữ số, gạch ngang hoặc gạch dưới."};
  if(onClaude)await dbReady;
  let r;try{r=DB?await dbCall({action:"check",code,course:courseId||""}):await staticCheck(code,courseId||"")}catch(e){r={ok:false,why:"net"}}
  if(r&&r.ok&&!DB){const c=await claimSeat(r.k,r.max);if(!c.ok)r=c}
  if(r&&r.ok)return {ok:true,s:{code,label:r.note?String(r.note):"Mã "+code,han:r.han,courses:Array.isArray(r.courses)&&r.courses.length?r.courses:["*"]}};
  const W={notfound:"Mã không đúng hoặc đã bị xóa. Kiểm tra lại hoặc hỏi giảng viên.",expired:"Mã đã hết hạn"+(r&&r.han?" ngày "+fmtDate(r.han):"")+". Hỏi giảng viên mã mới.",full:"Mã này đã đủ "+(r&&r.max||"")+" người sử dụng. Hỏi giảng viên.",course:"Mã này không có quyền truy cập học phần đang chọn. Hãy nhập mã phù hợp.",net:"Chưa tải được danh sách mã lớp. Kiểm tra mạng rồi thử lại."};
  return {ok:false,expired:r&&r.why==="expired",why:W[r&&r.why]||"Chưa kiểm tra được mã, thử lại sau."}}

/* ===== Quản lý mã lớp =====
   Một mã dùng chung cho cả lớp. Bản web GitHub: mã lưu trong data/ma-lop.json (sinh viên chỉ thấy dấu băm).
   Danh sách mã gốc và token GitHub được mã hóa bằng mật khẩu quản trị, nên chỉ cần kết nối GitHub một lần;
   từ đó mỗi lần cấp hoặc xóa mã, trang tự lưu ngược lên GitHub.
   Bản Claude: chủ trang quản lý mã trong kho dữ liệu của artifact. */
let ST=null; /* phiên quản trị trên bản web: {pw,list,salt,sha,tok} */
const AKEY="pnlib-quan-tri"; /* ghi nhớ đăng nhập quản trị trên trình duyệt này */
function adminScopeLabel(xs){
  if(!Array.isArray(xs)||!xs.length||xs.includes("*"))return "Tất cả học phần";
  return xs.map(id=>{const c=course(id);return c?c.name:id}).join(", ");
}
const b64e=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pwKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function openVault(admin,pw){const k=await pwKey(pw,admin.salt,admin.iter);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(admin.iv)},k,b64d(admin.data));return JSON.parse(new TextDecoder().decode(pt))}
async function sealVault(obj,pw){const salt=b64e(rnd(16)),iv=b64e(rnd(12)),iter=250000,k=await pwKey(pw,salt,iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:b64d(iv)},k,new TextEncoder().encode(JSON.stringify(obj)));return {salt,iter,iv,data:b64e(new Uint8Array(ct))}}
async function buildFile(){const codes=[];
  for(const x of ST.list)codes.push({h:await codeHash(ST.salt,x.code),han:x.han,courses:x.courses,note:x.note||"",k:x.k,max:x.max|0});
  return {v:2,ghi_chu:"Tự sinh bởi trang Quản lý mã lớp. Không sửa tay.",salt:ST.salt,updated:new Date().toISOString(),codes,admin:await sealVault({codes:ST.list,tok:ST.tok||""},ST.pw)}}
const ghURL=()=>`https://api.github.com/repos/${GH.repo}/contents/${GH.path}`;
const ghHead=t=>({Authorization:"Bearer "+t,Accept:"application/vnd.github+json"});
async function ghGet(t){const r=await fetch(ghURL()+"?ref="+GH.branch+"&t="+Date.now(),{headers:ghHead(t),cache:"no-store"});
  if(r.status===404)return null;if(!r.ok)throw new Error("gh"+r.status);const j=await r.json();
  return {sha:j.sha,data:JSON.parse(new TextDecoder().decode(b64d(String(j.content||"").replace(/\s/g,""))))}}
async function ghPut(t,obj,sha){const body={message:"Cập nhật mã lớp",branch:GH.branch,content:b64e(new TextEncoder().encode(JSON.stringify(obj,null,1)+"\n"))};if(sha)body.sha=sha;
  const r=await fetch(ghURL(),{method:"PUT",headers:Object.assign(ghHead(t),{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error("gh"+r.status);return (await r.json()).content.sha}
const ghErr=e=>{const m=String(e&&e.message||"");return m==="gh401"?"Token GitHub sai hoặc đã hết hạn. Kết nối lại GitHub ở khung bên dưới.":(m==="gh403"||m==="gh404")?"Token GitHub chưa có quyền ghi (Contents: Read and write) cho kho phuc-nguyen-library.":m==="gh409"||m==="gh422"?"Dữ liệu trên GitHub vừa thay đổi ở nơi khác. Đăng xuất rồi đăng nhập lại.":"Không kết nối được GitHub. Kiểm tra mạng rồi thử lại."};
/* Lưu ngược lên GitHub; lỗi thì hoàn tác thay đổi trên trang để không có trạng thái "chưa lưu" */
async function persist(undo){try{const file=await buildFile();ST.sha=await ghPut(ST.tok,file,ST.sha);MA=file;return {ok:true}}
  catch(e){if(undo)undo();return {ok:false,why:ghErr(e)}}}
const TOKEN_URL="https://github.com/settings/personal-access-tokens/new?name=Phuc+Nguyen+Library+-+ma+lop&description=Luu+ma+lop+tu+trang+quan+tri&target_name=luuhuongnnpl-apag&expires_in=none&contents=write";

const ADM={
  web:()=>!DB,
  async list(){if(!DB){const items=await Promise.all(ST.list.map(async x=>Object.assign({},x,{used:await cntGet(x.k)})));return {ok:true,items}}return dbCall({action:"admin_list"})},
  async create(o){if(DB)return dbCall(Object.assign({action:"admin_create"},o,{courses:o.courses.join(",")||"*"}));
    if(ST.list.some(x=>x.code===o.code))return {ok:false,why:"exists"};
    const item={code:o.code,note:o.note,han:o.han,max:o.max,courses:o.courses.length?o.courses:["*"],k:"pnl-"+Array.from(rnd(8)).map(x=>x.toString(16).padStart(2,"0")).join(""),created:new Date().toISOString()};
    ST.list.push(item);return persist(()=>{ST.list=ST.list.filter(x=>x!==item)})},
  async del(code){if(DB)return dbCall({action:"admin_delete",code});const before=ST.list;ST.list=ST.list.filter(x=>x.code!==code);return persist(()=>{ST.list=before})}
};

function bindToken(){const f=$("#t-form");if(!f)return;
  f.addEventListener("submit",async e=>{e.preventDefault();const t=$("#t-in").value.trim();
    if(!t){$("#t-err").textContent="Dán token GitHub vào ô trên.";return}
    $("#t-err").textContent="";$("#t-msg").textContent="Đang kết nối…";
    try{const g=await ghGet(t);const old=ST.tok,oldSha=ST.sha;ST.tok=t;ST.sha=g?g.sha:null;
      const r=await persist(()=>{ST.tok=old;ST.sha=oldSha});
      if(r.ok){route("quan-ly-ma");setTimeout(()=>{if($("#c-msg"))$("#c-msg").textContent="Đã kết nối GitHub. Từ nay mỗi lần cấp mã sẽ tự lưu."},0)}
      else{$("#t-msg").textContent="";$("#t-err").textContent=r.why}}
    catch(err){$("#t-msg").textContent="";$("#t-err").textContent=ghErr(err)}})}

/* Đọc CSV câu trả lời Google Form (cột: Dấu thời gian, Học phần, Nội dung góp ý) */
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch=='"')q=true;else if(ch==","){r.push(f);f=""}else if(ch=="\n"){r.push(f);rows.push(r);r=[];f=""}else if(ch!="\r")f+=ch}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
async function loadFeedback(){ if(!CONFIG.responsesCsvUrl)return;
  try{const res=await fetch(CONFIG.responsesCsvUrl,{cache:"no-store"});const rows=parseCSV(await res.text()).slice(1).filter(r=>r.some(x=>x.trim()));
    feedback=rows.map(r=>({time:r[0]||"",course:r.length>2?r[1]:"",text:r.length>2?r.slice(2).join(" "):(r[1]||"")})).filter(x=>x.text.trim())}
  catch(e){fbErr="Không tải được danh sách góp ý lúc này. Thử lại sau."}}
async function loadVisits(){ if(!CONFIG.goatcounter)return;
  try{const s=document.createElement("script");s.async=true;s.dataset.goatcounter=`https://${CONFIG.goatcounter}.goatcounter.com/count`;s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);
    const r=await fetch(`https://${CONFIG.goatcounter}.goatcounter.com/counter/TOTAL.json`);const j=await r.json();visits=parseInt(String(j.count).replace(/\D/g,""),10)}catch(e){}}

I","d":"Làm rõ điều kiện sử dụng dữ liệu đã công bố hợp pháp để huấn luyện AI và cơ chế xác lập quyền đối với kết quả có sử dụng AI"}],"l":"stack"}],"l":"row"}]}]},{"n":2,"t":"Bảo hộ quyền sở hữu trí tuệ","maps":[{"k":"1. Quyền tác giả và quyền liên quan đến quyền …","h1":"Chương 2","h2":"Bảo hộ quyền sở hữu trí tuệ","c":[{"t":"Quyền tác giả và quyền liên quan đến quyền tác giả","c":[{"t":"Đối tượng và điều kiện bảo hộ","c":[{"t":"Đối tượng quyền tác giả","d":"Tác phẩm văn học, nghệ thuật, khoa học được thể hiện dưới hình thức vật chất nhất định; không bảo hộ ý tưởng, quy trình, phương pháp, khái niệm, nguyên lý, số liệu với tư cách tác phẩm"},{"t":"Đối tượng quyền liên quan gồm","d":"Cuộc biểu diễn, bản ghi âm, ghi hình, chương trình phát sóng và tín hiệu cáp mang chương trình được mã hóa theo luật"},{"t":"Điều kiện cốt lõi","d":"Sáng tạo và định hình; quyền liên quan phải đáp ứng điều kiện luật định về tính nguyên gốc, định hình, công bố hoặc phát sóng tương ứng"}],"l":"stack"},{"t":"Chủ thể và xác lập quyền","d":"Tác giả là người trực tiếp sáng tạo · Quyền tác giả phát sinh từ thời điểm tác phẩm được sáng tạo và thể hiện dưới hình thức vật chất nhất định · Không phụ thuộc đăng ký · Quyền liên quan phát sinh khi cuộc biểu diễn, bản ghi âm/ghi hình, chương trình phát sóng được định hình hoặc thực hiện theo điều kiện luật định","c":[{"t":"Chủ sở hữu quyền tác giả có thể là","d":"Tác giả, đồng tác giả, tổ chức/cá nhân giao nhiệm vụ hoặc giao kết hợp đồng, người được thừa kế/chuyển giao hoặc Nhà nước trong trường hợp luật định"},{"t":"Giấy chứng nhận đăng ký là","d":"Chứng cứ thuận lợi khi có tranh chấp, không phải điều kiện bắt buộc phát sinh quyền"}],"l":"stack"},{"t":"Nội dung và giới hạn quyền","d":"Quyền tác giả gồm quyền nhân thân và quyền tài sản · Quyền công bố thuộc nhóm quyền nhân thân có thời hạn, các quyền nhân thân khác theo luật có thể được bảo hộ vô thời hạn · Phải xác định đúng đối tượng và hành vi khai thác · Ngoại lệ và giới hạn quyền phải thuộc trường hợp luật định, tuân thủ điều kiện về mục đích, phạm vi, ghi nguồn và không ảnh hưởng bất hợp lý đến khai thác bình thường, lợi ích hợp pháp của chủ thể quyền","c":[{"t":"Quyền tài sản bao gồm","d":"Các quyền khai thác như làm tác phẩm phái sinh, biểu diễn, sao chép, phân phối, truyền đạt đến công chúng và cho thuê trong trường hợp luật định"},{"t":"Quyền liên quan gồm","d":"Quyền của người biểu diễn, nhà sản xuất bản ghi âm/ghi hình và tổ chức phát sóng"}],"l":"stack"},{"t":"Thời hạn bảo hộ","d":"Một số quyền nhân thân luật định được bảo hộ vô thời hạn · Quyền công bố và quyền tài sản có thời hạn theo loại tác phẩm · Tác phẩm điện ảnh, nhiếp ảnh, mỹ thuật ứng dụng, khuyết danh có quy tắc 75 năm từ công bố lần đầu · Trường hợp chưa công bố trong 25 năm từ khi định hình có thể áp dụng mốc 100 năm từ định hình theo luật · Quyền của người biểu diễn, nhà sản xuất bản ghi âm/ghi hình và tổ chức phát sóng: 50 năm theo mốc tính riêng luật định","c":[{"t":"Tác phẩm thông thường","d":"Suốt cuộc đời tác giả và 50 năm tiếp theo năm tác giả chết · Đồng tác giả tính từ năm đồng tác giả cuối cùng chết"}],"l":"stack"}],"l":"row"}],"h3":"Quyền tác giả và quyền liên quan đến quyền tác giả"},{"k":"2. Quyền sở hữu công nghiệp","h1":"Chương 2","h2":"Bảo hộ quyền sở hữu trí tuệ","c":[{"t":"Quyền sở hữu công nghiệp","c":[{"t":"Đối tượng và điều kiện bảo hộ","d":"Tên thương mại, chỉ dẫn địa lý, bí mật kinh doanh có điều kiện và cơ chế bảo hộ riêng · Không áp dụng một tiêu chuẩn duy nhất cho tất cả","c":[{"t":"Sáng chế","d":"Giải pháp kỹ thuật dưới dạng sản phẩm hoặc quy trình; điều kiện bảo hộ bằng độc quyền sáng chế gồm tính mới, trình độ sáng tạo, khả năng áp dụng công nghiệp"},{"t":"Kiểu dáng công nghiệp","d":"Hình dáng bên ngoài của sản phẩm · Phải có tính mới, tính sáng tạo và khả năng áp dụng công nghiệp"},{"t":"Nhãn hiệu","d":"Dấu hiệu có khả năng phân biệt hàng hóa, dịch vụ của các chủ thể · Xem xét dấu hiệu được bảo hộ và các trường hợp loại trừ"}],"l":"stack"},{"t":"Chủ thể và xác lập quyền","d":"Đối với sáng chế, kiểu dáng công nghiệp, nhãn hiệu, quyền thường được xác lập trên cơ sở quyết định cấp văn bằng bảo hộ hoặc công nhận đăng ký quốc tế · Quyền đối với tên thương mại được xác lập trên cơ sở sử dụng hợp pháp · Quyền đối với bí mật kinh doanh được xác lập khi có được hợp pháp và duy trì tính bí mật · Chỉ dẫn địa lý theo quyết định cấp giấy chứng nhận · Cần phân biệt người sáng tạo, người nộp đơn, chủ đơn, chủ văn bằng và chủ thể nhận chuyển giao quyền","c":[{"t":"Chủ thể quyền có thể là","d":"Tổ chức, cá nhân tạo ra, đầu tư, đăng ký, sử dụng hợp pháp hoặc được chuyển giao quyền theo điều kiện luật định"}],"l":"stack"},{"t":"Nội dung và giới hạn quyền","d":"Chủ sở hữu có quyền sử dụng, cho phép người khác sử dụng và ngăn cấm người khác sử dụng đối tượng trong phạm vi luật định · Quyền độc quyền không tuyệt đối · Có giới hạn về phạm vi, thời gian, lãnh thổ, hành vi sử dụng và các trường hợp ngoại lệ theo luật · Cần lưu ý nghĩa vụ sử dụng nhãn hiệu, nghĩa vụ trả thù lao cho tác giả sáng chế/kiểu dáng/thiết kế bố trí trong trường hợp luật định, và cơ chế sử dụng trước · Không được suy luận quyền sở hữu công nghiệp chỉ từ việc nộp đơn hoặc quảng cáo · Phải kiểm tra tình trạng văn bằng, phạm vi yêu cầu bảo hộ và hiệu lực"},{"t":"Thời hạn bảo hộ","d":"Giấy chứng nhận đăng ký chỉ dẫn địa lý có hiệu lực vô thời hạn kể từ ngày cấp · Một số đối tượng khác có thời hạn riêng theo luật","c":[{"t":"Bằng độc quyền sáng chế","d":"20 năm kể từ ngày nộp đơn · Bằng độc quyền giải pháp hữu ích: 10 năm kể từ ngày nộp đơn"},{"t":"Bằng độc quyền kiểu dáng công nghiệp","d":"5 năm kể từ ngày nộp đơn, có thể gia hạn hai lần liên tiếp, mỗi lần 5 năm"},{"t":"Giấy chứng nhận đăng ký nhãn hiệu","d":"10 năm kể từ ngày nộp đơn, có thể gia hạn nhiều lần liên tiếp, mỗi lần 10 năm"}],"l":"stack"}],"l":"row"}],"h3":"Quyền sở hữu công nghiệp"},{"k":"3. Quyền đối với giống cây trồng","h1":"Chương 2","h2":"Bảo hộ quyền sở hữu trí tuệ","c":[{"t":"Quyền đối với giống cây trồng","c":[{"t":"Đối tượng và điều kiện bảo hộ","d":"Giống cây trồng được bảo hộ phải có tính mới, tính khác biệt, tính đồng nhất, tính ổn định và tên phù hợp · Tính mới gắn với việc vật liệu nhân giống hoặc sản phẩm thu hoạch đã được bán/phân phối nhằm mục đích khai thác giống với sự đồng ý của người có quyền trong thời hạn luật định · Tính khác biệt, đồng nhất, ổn định được đánh giá theo đặc tính có thể nhận biết, mô tả và kiểm tra theo quy định chuyên ngành · Không phải mọi giống cây trồng hoặc giống đang được lưu hành đều đương nhiên được cấp bằng"},{"t":"Chủ thể và xác lập quyền","d":"Tác giả giống là người trực tiếp chọn tạo hoặc phát hiện và phát triển giống · Cần kiểm tra hợp đồng nghiên cứu, quyết định giao nhiệm vụ, nguồn kinh phí, quan hệ lao động và văn bản chuyển giao quyền · Quyền được xác lập trên cơ sở quyết định cấp Bằng bảo hộ giống cây trồng · Quyền có thể được chuyển giao, thừa kế theo điều kiện luật định · Bằng bảo hộ ghi nhận giống, loài cây trồng, chủ bằng, tác giả giống và thời hạn bảo hộ","c":[{"t":"Chủ thể có quyền đăng ký có thể là","d":"Tổ chức/cá nhân đầu tư, giao nhiệm vụ hoặc nhận chuyển giao theo luật"}],"l":"stack"},{"t":"Nội dung và giới hạn quyền","d":"Chủ bằng có quyền cho phép hoặc ngăn cấm các hành vi sản xuất/nhân giống, chế biến nhằm mục đích nhân giống, chào hàng, bán, xuất nhập khẩu và lưu giữ vật liệu nhân giống theo phạm vi luật định · Quyền chủ bằng có thể được chuyển giao, cấp phép · Việc khai thác phải tuân thủ quy định về hợp đồng và đăng ký khi pháp luật yêu cầu · Các trường hợp ngoại lệ, giới hạn quyền và quyền của người nông dân phải được áp dụng đúng điều kiện luật định · Không được mặc nhiên coi mọi hoạt động nghiên cứu, sử dụng hoặc nhân giống đều xâm phạm · Phải xác định mục đích, loại vật liệu, hành vi và ngoại lệ"},{"t":"Thời hạn bảo hộ","d":"Bằng bảo hộ có hiệu lực trên toàn lãnh thổ Việt Nam kể từ ngày cấp · 25 năm đối với giống cây thân gỗ và cây leo thân gỗ · 20 năm đối với giống cây trồng khác · Thời hạn , nghị quyết HĐTP…"}],"l":"stack"},{"t":"Tập quán","d":"Quy tắc xử sự có nội dung rõ ràng, được hình thành và lặp lại nhiều lần trong thời gian dài, được thừa nhận rộng rãi · Chỉ áp dụng khi các bên không có thỏa thuận và pháp luật không quy định · Không trái nguyên tắc luật định"},{"t":"Áp dụng tương tự pháp luật","d":"Không có tập quán thì áp dụng quy định pháp luật điều chỉnh quan hệ dân sự tương tự"},{"t":"Án lệ, lẽ công bằng","d":"Không thể áp dụng tương tự pháp luật thì áp dụng nguyên tắc cơ bản, án lệ, lẽ công bằng · Tòa án không được từ chối giải quyết vụ việc dân sự vì lý do chưa có điều luật để áp dụng"}],"l":"row"}],"h3":"Nguồn của Luật Dân sự"},{"k":"4. Quan hệ pháp luật dân sự","h1":"Chương 1","h2":"Khái quát chung về Luật Dân sự","c":[{"t":"Quan hệ pháp luật dân sự","c":[{"t":"Đặc trưng","d":"Tiền đề là quan hệ tài sản (lợi ích vật chất) · Trách nhiệm pháp lý trước hết là trách nhiệm về tài sản · Địa vị pháp lý các bên bình đẳng","c":[{"t":"Chủ thể đa dạng","d":"Cá nhân, pháp nhân, tổ chức"}],"l":"stack"},{"t":"Thành phần","c":[{"t":"Chủ thể","d":"Cá nhân, pháp nhân tham gia quan hệ pháp luật dân sự · Điều kiện là có năng lực chủ thể (năng lực pháp luật và năng lực hành vi dân sự)"},{"t":"Khách thể","d":"Lợi ích vật chất hoặc tinh thần mà pháp luật bảo vệ: tài sản · Hành vi, dịch vụ · Kết quả hoạt động tinh thần sáng tạo · Giá trị nhân thân · Giá trị quyền sử dụng đất"},{"t":"Nội dung","c":[{"t":"Quyền dân sự","d":"Cách xử sự được phép (tự thực hiện hành vi, yêu cầu người khác thực hiện, yêu cầu bảo vệ khi bị xâm phạm)"},{"t":"Nghĩa vụ dân sự","d":"Cách xử sự bắt buộc · Không thực hiện đúng thì phải chịu trách nhiệm"}],"l":"stack"}],"l":"row"},{"t":"Sự kiện pháp lý","c":[{"t":"Hành vi pháp lý","d":"Hành vi có mục đích của chủ thể nhằm phát sinh hậu quả pháp lý: hành vi hợp pháp (hợp đồng, hành vi pháp lý đơn phương), hành vi bất hợp pháp (gây thiệt hại), quyết định của cơ quan nhà nước có thẩm quyền"},{"t":"Sự biến pháp lý","d":"Sự kiện xảy ra không phụ thuộc ý chí của chủ thể: sự biến tuyệt đối (thiên tai), sự biến tương đối (do con người gây ra nhưng không phụ thuộc chủ thể của quan hệ)"},{"t":"Xử sự pháp lý","d":"Hành vi không nhằm phát sinh hậu quả pháp lý nhưng pháp luật quy định làm phát sinh hậu quả (ví dụ: tìm thấy tài sản bị chôn giấu)"},{"t":"Thời hạn","d":"Đến một thời điểm nhất định, theo quy định pháp luật làm phát sinh hoặc chấm dứt hậu quả pháp lý"}],"l":"stack"},{"t":"Phân loại","d":"Quan hệ tài sản – quan hệ nhân thân · Tuyệt đối (chỉ chủ thể quyền được xác định, ví dụ quyền sở hữu) – tương đối (cả chủ thể quyền và chủ thể nghĩa vụ được xác định, ví dụ hợp đồng) · Vật quyền (chủ thể tự thực hiện quyền đối với vật) – trái quyền (thực hiện quyền thông qua hành vi của bên có nghĩa vụ)"}],"l":"row"}],"h3":"Quan hệ pháp luật dân sự"}]},{"n":2,"t":"Chủ thể của quan hệ pháp luật dân sự","img":"assets/ds/ch2.jpg","maps":[{"k":"1. Cá nhân (1/2)","h1":"Chương 2","h2":"Chủ thể của quan hệ pháp luật dân sự","c":[{"t":"Cá nhân","l":"row","c":[{"t":"Năng lực pháp luật dân sự","c":[{"t":"Thời điểm bắt đầu, kết thúc","d":"Có từ khi người đó sinh ra và chấm dứt khi người đó chết"},{"t":"Nội dung","d":"Quyền nhân thân không gắn với tài sản và quyền nhân thân gắn với tài sản · Quyền sở hữu, quyền thừa kế và quyền khác đối với tài sản · Quyền tham gia quan hệ dân sự và có nghĩa vụ phát sinh từ quan hệ đó"},{"t":"Không bị hạn chế","d":"Năng lực pháp luật dân sự của cá nhân không bị hạn chế, trừ trường hợp luật khác có liên quan quy định"}],"l":"stack"},{"t":"Năng lực hành vi dân sự","c":[{"t":"Năng lực hành vi dân sự đầy đủ","d":"Người thành niên (từ đủ 18 tuổi trở lên) · Trừ người mất năng lực hành vi, hạn chế năng lực hành vi hoặc có khó khăn trong nhận thức, làm chủ hành vi"},{"t":"Năng lực hành vi dân sự một phần (người chưa thành niên)","c":[{"t":"Dưới 6 tuổi","d":"Giao dịch do người đại diện theo pháp luật xác lập, thực hiện"},{"t":"Từ đủ 6 đến dưới 15 tuổi","d":"Giao dịch phải được người đại diện đồng ý, trừ giao dịch phục vụ nhu cầu sinh hoạt hằng ngày phù hợp lứa tuổi"},{"t":"Từ đủ 15 đến dưới 18 tuổi","d":"Tự mình xác lập, thực hiện, trừ giao dịch liên quan bất động sản, động sản phải đăng ký và giao dịch khác luật quy định phải được người đại diện đồng ý"}],"l":"stack"},{"t":"Người có khó khăn trong nhận thức, làm chủ hành vi","d":"Người thành niên do tình trạng thể chất hoặc tinh thần mà không đủ khả năng nhận thức, làm chủ hành vi nhưng chưa đến mức mất năng lực hành vi dân sự · Tòa án ra quyết định tuyên bố theo yêu cầu của chính người đó, người có quyền, lợi ích liên quan hoặc cơ quan, tổ chức hữu quan, trên cơ sở kết luận giám định pháp y tâm thần · Tòa án chỉ định người giám hộ và xác định quyền, nghĩa vụ của người giám hộ"},{"t":"Người bị hạn chế năng lực hành vi dân sự","d":"Người nghiện ma túy, nghiện các chất kích thích khác dẫn đến phá tán tài sản của gia đình · Tòa án tuyên bố theo yêu cầu của người có quyền, lợi ích liên quan hoặc cơ quan, tổ chức hữu quan · Quyết định người đại diện theo pháp luật và phạm vi đại diện · Giao dịch liên quan đến tài sản phải có sự đồng ý của người đại diện, trừ giao dịch phục vụ nhu cầu sinh hoạt hằng ngày hoặc luật có quy định khác"},{"t":"Người mất năng lực hành vi dân sự","d":"Người do bị bệnh tâm thần hoặc mắc bệnh khác mà không thể nhận thức, làm chủ được hành vi · Tòa án tuyên bố theo yêu cầu, trên cơ sở kết luận giám định pháp y tâm thần · Giao dịch dân sự phải do người đại diện theo pháp luật xác lập, thực hiện"}],"l":"row"}]}],"h3":"Cá nhân (phần 1/2)"},{"k":"2. Cá nhân (2/2)","h1":"Chương 2","h2":"Chủ thể của quan hệ pháp luật dân sự","c":[{"t":"Cá nhân","l":"row","c":[{"t":"Tuyên bố vắng mặt, mất tích, chết","c":[{"t":"Thông báo tìm kiếm người vắng mặt","c":[{"t":"Biệt tích 06 tháng liền trở lên","d":"Người có quyền, lợi ích liên quan yêu cầu Tòa án thông báo tìm kiếm và áp dụng biện pháp quản lý tài sản"}],"l":"stack"},{"t":"Tuyên bố mất tích","d":"Biệt tích 02 năm liền trở lên, đã thông báo tìm kiếm nhưng khôn tránh nghĩa vụ với người thứ ba thì vô hiệu"}],"l":"stack"},{"t":"Vô hiệu tương đối","d":"Do người chưa thành niên, người mất, hạn chế năng lực hành vi, người có khó khăn trong nhận thức xác lập · Do bị nhầm lẫn · Do bị lừa dối, đe dọa, cưỡng ép · Do người xác lập không nhận thức và làm chủ được hành vi của mình · Do không tuân thủ quy định về hình thức · Phải có người có quyền yêu cầu và Tòa án tuyên bố, thời hiệu 02 năm"},{"t":"Ngoại lệ về hình thức: đã thực hiện 2/3 nghĩa vụ","d":"Giao dịch phải lập văn bản nhưng không đúng quy định, hoặc phải công chứng, chứng thực mà không thực hiện, nhưng một bên hoặc các bên đã thực hiện ít nhất 2/3 nghĩa vụ: theo yêu cầu, Tòa án công nhận hiệu lực"},{"t":"Hậu quả pháp lý","d":"Không làm phát sinh, thay đổi, chấm dứt quyền, nghĩa vụ kể từ thời điểm giao dịch được xác lập · Khôi phục tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận · Không hoàn trả được bằng hiện vật thì trị giá thành tiền · Bên ngay tình trong việc thu hoa lợi, lợi tức không phải hoàn trả hoa lợi, lợi tức đó · Bên có lỗi gây thiệt hại phải bồi thường · Bảo vệ quyền lợi của người thứ ba ngay tình"}],"l":"row"}]}],"h3":"Giao dịch dân sự (phần 2/2)"},{"k":"3. Đại diện (1/2)","h1":"Chương 3","h2":"Giao dịch dân sự, đại diện, thời hạn và thời hiệu","c":[{"t":"Đại diện","l":"row","c":[{"t":"Đại diện theo pháp luật","c":[{"t":"Đại diện theo pháp luật của cá nhân","d":"Cha, mẹ đối với con chưa thành niên · Người giám hộ đối với người được giám hộ · Người giám hộ của người có khó khăn trong nhận thức là người đại diện nếu được Tòa án chỉ định · Người do Tòa án chỉ định khi không xác định được người đại diện nêu trên · Người do Tòa án chỉ định đối với người bị hạn chế năng lực hành vi dân sự"},{"t":"Đại diện theo pháp luật của pháp nhân","d":"Người được pháp nhân chỉ định theo điều lệ · Người có thẩm quyền đại diện theo quy định của pháp luật · Người do Tòa án chỉ định trong quá trình tố tụng tại Tòa án · Một pháp nhân có thể có nhiều người đại diện theo pháp luật, mỗi người có phạm vi và thời hạn đại diện riêng"}],"l":"stack"},{"t":"Đại diện theo ủy quyền","d":"Đại diện được xác lập theo sự ủy quyền giữa người được đại diện và người đại diện · Cá nhân, pháp nhân ủy quyền cho cá nhân, pháp nhân khác · Thành viên hộ gia đình, tổ hợp tác, tổ chức không có tư cách pháp nhân thỏa thuận cử người đại diện","c":[{"t":"Người từ đủ 15 đến dưới 18 tuổi có thể là","d":"Người đại diện theo ủy quyền, trừ giao dịch pháp luật quy định phải do người từ đủ 18 tuổi xác lập"}],"l":"stack"},{"t":"Thời hạn đại diện","d":"Xác định theo văn bản ủy quyền, quyết định của cơ quan có thẩm quyền, điều lệ của pháp nhân hoặc theo quy định pháp luật","c":[{"t":"Không xác định được","d":"Đại diện trong giao dịch cụ thể thì tính đến thời điểm chấm dứt giao dịch đó; trường hợp khác là 01 năm kể từ thời điểm phát sinh quyền đại diện"}],"l":"stack"},{"t":"Phạm vi đại diện","d":"Chỉ được xác lập, thực hiện giao dịch trong phạm vi đại diện, vì lợi ích của người được đại diện · Có thể đại diện cho nhiều người nhưng không được xác lập giao dịch với chính mình hoặc với người thứ ba mà mình cũng là người đại diện, trừ trường hợp pháp luật có quy định khác · Phải thông báo cho bên giao dịch biết về phạm vi đại diện của mình"}]}],"h3":"Đại diện (phần 1/2)"},{"k":"4. Đại diện (2/2)","h1":"Chương 3","h2":"Giao dịch dân sự, đại diện, thời hạn và thời hiệu","c":[{"t":"Đại diện","l":"row","c":[{"t":"Hậu quả pháp lý của hành vi đại diện","d":"Giao dịch trong phạm vi đại diện làm phát sinh quyền, nghĩa vụ đối với người được đại diện · Người đại diện có quyền xác lập, thực hiện hành vi cần thiết để đạt mục đích đại diện · Người đại diện biết hoặc phải biết việc xác lập giao dịch do bị nhầm lẫn, lừa dối, đe dọa, cưỡng ép thì không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi người được đại diện biết mà vẫn đồng ý"},{"t":"Giao dịch do người không có quyền đại diện xác lập","d":"Không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi: người được đại diện công nhận · Biết mà không phản đối trong thời hạn hợp lý · Hoặc có lỗi làm bên kia không biết · Người không có quyền đại diện phải thực hiện nghĩa vụ với bên giao dịch, trừ khi bên đó biết hoặc phải biết · Bên giao dịch có quyền đơn phương chấm dứt, hủy bỏ giao dịch và yêu cầu bồi thường, trừ khi biết hoặc phải biết về việc không có quyền đại diện"},{"t":"Giao dịch vượt quá phạm vi đại diện","d":"Phần vượt quá không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi người được đại diện đồng ý · Biết mà không phản đối trong thời hạn hợp lý · Hoặc có lỗi làm bên kia không biết · Người đại diện phải thực hiện nghĩa vụ đối với phần vượt quá, trừ khi bên giao dịch biết hoặc phải biết · Bên giao dịch có quyền đơn phương chấm dứt, hủy bỏ phần vượt quá hoặc toàn bộ giao dịch và yêu cầu bồi thường"},{"t":"Chấm dứt đại diện","c":[{"t":"Theo ủy quyền","d":"Theo thỏa thuận · Hết thời hạn ủy quyền · Công việc đã hoàn thành · Một bên đơn phương chấm dứt · Người đại diện hoặc người được đại diện chết, chấm dứt tồn tại · Người đại diện không còn đủ điều kiện · Căn cứ khác làm việc đại diện không thể thực hiện"},{"t":"Theo pháp luật","d":"Người được đại diện đã thành niên hoặc năng lực hành vi đã được khôi phục · Người được đại diện chết · Pháp nhân được đại diện chấm dứt tồn tại · Căn cứ khác"}],"l":"stack"}]}],"h3":"Đại diện (phần 2/2)"},{"k":"5. Thời hạn","h1":"Chương 3","h2":"Giao dịch dân sự, đại diện, thời hạn và thời hiệu","c":[{"t":"Thời hạn","c":[{"t":"Cách tính thời hạn","d":"Theo thỏa thuận của các bên, nếu không có thỏa thuận thì theo BLDS · Thời hạn tính theo dương lịch, trừ khi có thỏa thuận khác"},{"t":"Quy định về thời hạn, thời điểm tính thời hạn","d":"Một năm 365 ngày · Nửa năm 06 tháng · Một tháng 30 ngày · Nửa tháng 15 ngày · Một tuần 07 ngày · Một ngày 24 giờ · Một giờ 60 phút · Một phút 60 giây","c":[{"t":"Đầu tháng","d":"Ngày đầu tiên · Giữa tháng: ngày 15 · Cuối tháng: ngày cuối cùng của tháng"},{"t":"Đầu năm","d":"Ngày đầu tiên của tháng ","d":"Hoa lợi (sản vật tự nhiên mà tài sản mang lại) và lợi tức · Vật chia được (khi phân chia vẫn giữ nguyên tính chất, tính năng sử dụng ban đầu) và vật không chia được · Vật tiêu hao (qua một lần sử dụng thì mất đi hoặc không giữ được tính chất ban đầu · Không thể là đối tượng của hợp đồng cho thuê, cho mượn) và vật không tiêu hao · Vật cùng loại, vật đặc định, vật đồng bộ","c":[{"t":"Vật chính và vật phụ","d":"Khi thực hiện nghĩa vụ chuyển giao vật chính thì phải chuyển giao cả vật phụ, trừ thỏa thuận khác"}],"l":"stack"}],"l":"row"}],"h3":"Tài sản"},{"k":"2. Quyền sở hữu tài sản (1/2)","h1":"Chương 4","h2":"Tài sản, quyền đối với tài sản và thừa kế","c":[{"t":"Quyền sở hữu tài sản","l":"row","c":[{"t":"Quyền chiếm hữu","c":[{"t":"Chiếm hữu có căn cứ pháp luật","d":"Chủ sở hữu chiếm hữu tài sản · Người được chủ sở hữu ủy quyền quản lý tài sản · Người được chuyển giao quyền chiếm hữu thông qua giao dịch dân sự phù hợp quy định pháp luật · Người phát hiện và giữ tài sản vô chủ, không xác định được chủ sở hữu, bị đánh rơi, bỏ quên, bị chôn, giấu, bị vùi lấp, chìm đắm phù hợp với điều kiện luật định · Người phát hiện và giữ gia súc, gia cầm, vật nuôi dưới nước bị thất lạc phù hợp với điều kiện luật định · Trường hợp khác do pháp luật quy định"},{"t":"Chiếm hữu ngay tình, không ngay tình","d":"Người chiếm hữu có căn cứ để tin rằng mình có quyền đối với tài sản đang chiếm hữu · Người chiếm hữu biết hoặc phải biết mình không có quyền đối với tài sản đang chiếm hữu"},{"t":"Chiếm hữu liên tục, công khai","d":"Diễn ra trong một khoảng thời gian mà không có tranh chấp về quyền đối với tài sản hoặc có tranh chấp nhưng chưa được giải quyết bằng bản án, quyết định có hiệu lực · Thực hiện một cách minh bạch, không giấu giếm, tài sản được sử dụng theo tính năng, công dụng và được bảo quản như tài sản của chính mình"}],"l":"stack"},{"t":"Quyền sử dụng","d":"Quyền khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản · Có thể được chuyển giao cho người khác theo thỏa thuận hoặc theo quy định pháp luật · Không được gây thiệt hại, ảnh hưởng đến lợi ích của chủ thể khác"},{"t":"Quyền định đoạt","d":"Quyền chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản · Định đoạt về pháp lý (chuyển giao, từ bỏ quyền sở hữu qua giao dịch) và định đoạt về thực tế (tiêu dùng, tiêu hủy) · Người không phải chủ sở hữu chỉ được định đoạt theo ủy quyền của chủ sở hữu hoặc theo quy định của luật"},{"t":"Hình thức sở hữu","c":[{"t":"Sở hữu toàn dân","d":"Đất đai, tài nguyên nước, tài nguyên khoáng sản, nguồn lợi ở vùng biển, vùng trời, tài nguyên thiên nhiên khác và tài sản do Nhà nước đầu tư, quản lý là tài sản công thuộc sở hữu toàn dân · Nhà nước đại diện, thực hiện quyền của chủ sở hữu và thống nhất quản lý"},{"t":"Sở hữu riêng","d":"Sở hữu của một cá nhân hoặc một pháp nhân · Tài sản hợp pháp thuộc sở hữu riêng không bị hạn chế về số lượng, giá trị"},{"t":"Sở hữu chung","d":"Sở hữu của nhiều chủ thể đối với tài sản · Gồm sở hữu chung theo phần và sở hữu chung hợp nhất · Sở hữu chung của cộng đồng · Sở hữu chung của các thành viên gia đình · Sở hữu chung trong nhà chung cư","c":[{"t":"Theo phần","d":"Phần quyền sở hữu của mỗi chủ sở hữu được xác định"},{"t":"Hợp nhất","d":"Phần quyền không được xác định; gồm loại có thể phân chia và không thể phân chia. Sở hữu chung của vợ chồng là sở hữu chung hợp nhất có thể phân chia"},{"t":"Bán phần quyền sở hữu chung","d":"Chủ sở hữu chung khác có quyền ưu tiên mua"}],"l":"stack"}],"l":"row"}]}],"h3":"Quyền sở hữu tài sản (phần 1/2)"},{"k":"3. Quyền sở hữu tài sản (2/2)","h1":"Chương 4","h2":"Tài sản, quyền đối với tài sản và thừa kế","c":[{"t":"Quyền sở hữu tài sản","l":"row","c":[{"t":"Căn cứ xác lập, chấm dứt quyền sở hữu","d":"Lao động, sản xuất kinh doanh hợp pháp, chuyển quyền theo hợp đồng, thu hoa lợi, lợi tức, tạo thành vật mới do sáp nhập, trộn lẫn, chế biến, được thừa kế, chiếm hữu tài sản vô chủ, bị đánh rơi, bỏ quên, chôn giấu, gia súc thất lạc theo điều kiện luật định, theo bản án, quyết định, chiếm hữu theo thời hiệu · Chuyển quyền sở hữu cho người khác · Từ bỏ · Tài sản đã được tiêu dùng, bị tiêu hủy · Bị xử lý để thực hiện nghĩa vụ · Bị trưng mua, tịch thu · Người khác được xác lập quyền sở hữu theo thời hiệu…"},{"t":"Giới hạn quyền sở hữu","d":"Tình thế cấp thiết · Bảo vệ môi trường · Trật tự, an toàn xã hội · Tôn trọng quy tắc xây dựng · Ranh giới, mốc giới · Bảo đảm an toàn công trình, cây cối · Trổ cửa nhìn sang bất động sản liền kề"},{"t":"Bảo vệ quyền sở hữu","d":"Tự bảo vệ, ngăn chặn hành vi xâm phạm bằng biện pháp không trái pháp luật · Đòi động sản không phải đăng ký từ người chiếm hữu ngay tình: chỉ khi người đó có được qua hợp đồng không có đền bù · Hoặc qua hợp đồng có đền bù nhưng tài sản bị lấy cắp, bị mất, chiếm hữu ngoài ý chí · Đòi động sản phải đăng ký, bất động sản từ người chiếm hữu ngay tình: được đòi lại, trừ trường hợp khoản 2 Điều 133 · Yêu cầu chấm dứt hành vi cản trở trái pháp luật · Kiện trái quyền – yêu cầu bồi thường thiệt hại","c":[{"t":"Kiện vật quyền – đòi lại tài sản","d":"Chủ sở hữu có quyền đòi lại tài sản từ người chiếm hữu, sử dụng, được lợi không có căn cứ pháp luật"}],"l":"stack"}]}],"h3":"Quyền sở hữu tài sản (phần 2/2)"},{"k":"4. Các quyền khác đối với tài sản","h1":"Chương 4","h2":"Tài sản, quyền đối với tài sản và thừa kế","c":[{"t":"Các quyền khác đối với tài sản","c":[{"t":"Quyền đối với bất động sản liền kề","d":"Quyền được thực hiện trên một bất động sản (bất động sản chịu hưởng quyền) nhằm phục vụ việc khai thác một bất động sản khác thuộc quyền sở hữu của người khác (bất động sản được hưởng quyền)","c":[{"t":"Nội dung","d":"Cấp, thoát nước · Tưới nước, tiêu nước trong canh tác · Lối đi qua · Mắc đường dây tải điện, thông tin liên lạc"}],"l":"stack"},{"t":"Quyền hưởng dụng","d":"Quyền của chủ thể được khai thác công dụng và hưởng hoa lợi, lợi tức đối với tài sản thuộc quyền sở hữu của chủ thể khác trong một thời hạn nhất định · Hết thời hạn phải hoàn trả tài sản cho chủ sở hữu, trừ thỏa thuận khác","c":[{"t":"Thời hạn","d":"Cá nhân tối đa đến hết cuộc đời người hưởng dụng đầu tiên · Pháp nhân tối đa 30 năm"}],"l":"stack"},{"t":"Quyền bề mặt","d":"Quyền của một chủ thể đối với mặt đất, mặt nước, khoảng không gian trên mặt đất, mặt nước và lòng đất mà quyền sử dụng đất đó thuộc về chủ thể khác","c":[{"t":"Nội dung","d":"Được khai thác, sử dụng, xây dựng công trình, trồng cây, canh tác · Là chủ sở hữu tài sản tạo lập trong thời hạn quyền bề mặt"},{"t":"Chấm dứt","d":"Hết thời hạn · Chủ thể có quyền bề mặt và chủ thể có quyền sử dụng đất là một · Người có quyền bề mặt từ bỏ quyền · Quyền sử dụng đất bị thu hồi theo Luật Đất đai · Theo thỏa thuận hoặc luật quy định"}],"l":"stack"}],"l":"row"}],"h3":"Các quyền khác đối với tài sản"},{"k":"5. Thừa kế (1/2)","h1":"Chương 4","h2":"Tài sản, quyền đối với tài sản và thừa kế","c":[{"t":"Thừa kế","l":"row","c":[{"t":"Quy định chung về thừa kế","c":[{"t":"Thời điểm, địa điểm mở thừa kế","d":"Thời điểm người có tài sản chết · Bị Tòa án tuyên bố chết thì là ngày được xác định trong quyết định · Nơi cư trú cuối cùng của người để lại di sản · Không xác định được thì là nơi có toàn bộ hoặc phần lớn di sản"},{"t":"Di sản","d":"Gồm tài sản riêng của người chết và phần tài sản của người chết trong tài sản chung với người khác"},{"t":"Người thừa kế","d":"Cá nhân còn sống vào thời điểm mở thừa kế hoặc sinh ra và còn sống sau thời điểm mở thừa kế nhưng đã thành thai trước khi người để lại di sản chết · Cơ quan, tổ chức phải còn tồn tại vào thời điểm mở thừa kế (người thừa kế theo di chúc)"},{"t":"Thực hiện nghĩa vụ tài sản do người chết để lại","d":"Người thừa kế thực hiện nghĩa vụ trong phạm vi di sản do người chết để lại, trừ thỏa thuận khác","c":[{"t":"Di sản chưa chia","d":"Người quản lý di sản thực hiện theo thỏa thuận của những người thừa kế; đã chia: mỗi người thực hiện tương ứng nhưng không vượt quá phần tài sản đã nhận"}],"l":"stack"},{"t":"Người quản lý di sản","d":"Người được chỉ định trong di chúc hoặc do những người thừa kế thỏa thuận cử ra · Chưa xác định được thì người đang chiếm hữu, sử dụng, quản lý di sản · Không có thì cơ quan nhà nước có thẩm quyền","c":[{"t":"Nghĩa vụ","d":"Lập danh mục di sản, bảo quản, thông báo tình trạng di sản, giao lại di sản theo yêu cầu; không được định đoạt di sản nếu không được những người thừa kế đồng ý"},{"t":"Quyền","d":"Đại diện cho người thừa kế với người thứ ba · Được thanh toán chi phí bảo quản · Hưởng thù lao theo thỏa thuận"}],"l":"stack"},{"t":"Từ chối nhận di sản","d":"Có quyền từ chối, trừ trường hợp nhằm trốn tránh thực hiện nghĩa vụ tài sản của mình với người khác · Phải lập thành văn bản, gửi đến người quản lý di sản, những người thừa kế khác, người được giao nhiệm vụ phân chia di sản · Phải được thể hiện trước thời điểm phân chia di sản"},{"t":"Người không được quyền hưởng di sản","d":"Bị kết án về hành vi cố ý xâm phạm tính mạng, sức khỏe hoặc ngược đãi nghiêm trọng, hành hạ người để lại di sản, xâm phạm nghiêm trọng danh dự, nhân phẩm của người đó · Vi phạm nghiêm trọng nghĩa vụ nuôi dưỡng người để lại di sản · Bị kết án về hành vi cố ý xâm phạm tính mạng người thừa kế khác nhằm hưởng một phần hoặc toàn bộ di sản · Lừa dối, cưỡng ép, ngăn cản người để lại di sản lập di chúc · Giả mạo, sửa chữa, hủy, che giấu di chúc · Vẫn được hưởng nếu người để lại di sản đã biết hành vi đó nhưng vẫn cho hưởng theo di chúc"},{"t":"Thời hiệu thừa kế","d":"Yêu cầu xác nhận quyền thừa kế của mình hoặc bác bỏ quyền thừa kế của người khác: 10 năm kể từ thời điểm mở thừa kế · Yêu cầu người thừa kế thực hiện nghĩa vụ về tài sản của người chết để lại: 03 năm kể từ thời điểm mở thừa kế","c":[{"t":"Yêu cầu chia di sản","d":"30 năm đối với bất động sản, 10 năm đối với động sản, kể từ thời điểm mở thừa kế; hết thời hạn thì di sản thuộc về người thừa kế đang quản lý di sản"}],"l":"stack"}],"l":"row"},{"t":"Thừa kế theo di chúc","c":[{"t":"Người lập di chúc","d":"Người thành niên minh mẫn, sáng suốt, không bị lừa dối, đe dọa, cưỡng ép · Người từ đủ 15 tuổi đến chưa đủ 18 tuổi được lập di chúc nếu được cha, mẹ hoặc người giám hộ đồng ý"},{"t":"Di chúc hợp pháp","d":"Người lập di chúc minh mẫn, sáng suốt, không bị lừa dối, đe dọa, cưỡng ép · Nội dung không vi phạm điều cấm của luật, không trái đạo đức xã hội · Hình thức không trái quy định của luật · Người bị hạn chế về thể chất hoặc không biết chữ: di chúc phải được người làm chứng lập thành văn bản và có công chứng, chứng thực"},{"t":"Di chúc bằng văn bản","d":"Không viết tắt, không viết bằng ký hiệu · Nhiều trang thì đánh số và có chữ ký hoặc điểm chỉ ở mỗi trang","c":[{"t":"Gồm","d":"Không có người làm chứng (người lập tự viết và ký) · Có người làm chứng (ít nhất 02 người) · Có công chứng · Có chứng thực"}],"l":"stack"},{"t":"Di chúc miệng","d":"Chỉ khi tính mạng bị cái chết đe dọa và không thể lập di chúc bằng văn bản · Thể hiện ý chí cuối cùng trước mặt ít nhất 02 người làm chứng · Người làm chứng ghi chép lại, cùng ký hoặc điểm chỉ · Trong 05 ngày làm việc phải được công chứng hoặc chứng thực · Sau 03 tháng kể từ thời điểm di chúc miệng mà người lập còn sống, minh mẫn, sáng suốt thì di chúc mặc nhiên bị hủy bỏ"},{"t":"Người làm chứng cho việc lập di chúc","c":[{"t":"Không được là","d":"Người thừa kế theo di chúc hoặc theo pháp luật của người lập di chúc; người có quyền, nghĩa vụ tài sản liên quan tới nội dung di chúc; người chưa thành niên, người mất năng lực hành vi, người có khó khăn trong nhận thức, làm chủ hành vi"}],"l":"stack"},{"t":"Hiệu lực của di chúc","d":"Có hiệu lực từ thời điểm mở thừa kế · Cơ quan, tổ chức được thừa kế không còn tồn tại · Di sản không còn vào thời điểm mở thừa kế","c":[{"t":"Không có hiệu lực toàn bộ hoặc một phần khi","d":"Người thừa kế chết trước hoặc cùng thời điểm với người lập di chúc"}],"l":"stack"},{"t":"Người thừa kế không phụ thuộc vào nội dung di chúc","d":"Con chưa thành niên, cha, mẹ, vợ, chồng · Con thành niên mà không có khả năng lao động · Được hưởng phần di sản bằng 2/3 suất của một người thừa kế theo pháp luật nếu di sản được chia theo pháp luật · Không áp dụng với người từ chối nhận di sản hoặc người không có quyền hưởng di sản"}],"l":"row"}]}],"h3":"Thừa kế (phần 1/2)"},{"k":"6. Thừa kế (2/2)","h1":"Chương 4","h2":"Tài sản, quyền đối với tài sản và thừa kế","c":[{"t":"Thừa kế","l":"row","c":[{"t":"Thừa kế theo pháp luật","c":[{"t":"Trường hợp thừa kế theo pháp luật","d":"Không có di chúc, di chúc không hợp pháp · Người thừa kế theo di chúc chết trước hoặc cùng thời điểm với người lập di chúc · Cơ quan, tổ chức được thừa kế không còn tồn tại · Người được chỉ định làm người thừa kế theo di chúc không có quyền hưởng di sản hoặc từ chối nhận di sản"},{"t":"Hàng thừa kế","d":"Những người cùng hàng được hưởng phần di sản bằng nhau · Hàng sau chỉ được hưởng khi không còn ai ở hàng trước","c":[{"t":"Hàng thứ nhất","d":"Vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết"},{"t":"Hàng thứ hai","d":"Ông nội, bà nội, ông ngoại, bà ngoại, anh ruột, chị ruột, em ruột của người chết; cháu ruột của người chết mà người chết là ông, bà"},{"t":"Hàng thứ ba","d":"Cụ nội, cụ ngoại · Bác, chú, cậu, cô, dì ruột của người chết · Cháu ruột mà người chết là bác, chú, cậu, cô, dì ruột · Chắt ruột mà người chết là cụ"}],"l":"stack"},{"t":"Thừa kế thế vị","d":"Con của người để lại di sản chết trước hoặc cùng thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống · Nếu cháu cũng chết trước hoặc cùng thời điểm thì chắt được hưởng phần mà cha hoặc mẹ của chắt được hưởng nếu còn sống"},{"t":"Con nuôi, con riêng","d":"Con nuôi và cha nuôi, mẹ nuôi được thừa kế di sản của nhau · Con riêng và bố dượng, mẹ kế nếu có quan hệ chăm sóc, nuôi dưỡng nhau như cha con, mẹ con thì được thừa kế di sản của nhau"}],"l":"row"},{"t":"Thanh toán và phân chia di sản","d":"Phân chia theo di chúc theo ý chí người lập · Di chúc không xác định rõ phần của từng người thì chia đều cho những người được chỉ định","c":[{"t":"Thứ tự ưu tiên a nhận được thông báo · Bên vi phạm phải bồi thường"},{"t":"Thời hiệu khởi kiện tranh chấp hợp đồng","d":"03 năm kể từ ngày biết hoặc phải biết quyền, lợi ích bị xâm phạm"}],"l":"stack"},{"t":"Hợp đồng thông dụng","c":[{"t":"Hợp đồng mua bán tài sản","d":"Bên bán chuyển quyền sở hữu tài sản cho bên mua, bên mua trả tiền · Giao tài sản đúng số lượng, chất lượng, cung cấp thông tin cần thiết","c":[{"t":"Rủi ro","d":"Bên bán chịu trước khi giao, bên mua chịu từ khi nhận tài sản; tài sản phải đăng ký thì bên mua chịu từ khi hoàn thành thủ tục đăng ký"},{"t":"Một số hình thức đặc thù","d":"Mua trả chậm, trả dần · Chuộc lại tài sản đã bán · Bảo hành"}],"l":"stack"},{"t":"Hợp đồng tặng cho tài sản","d":"Bên tặng cho giao tài sản và chuyển quyền sở hữu cho bên được tặng cho mà không yêu cầu đền bù","c":[{"t":"Động sản","d":"Hiệu lực khi bên được tặng cho nhận tài sản · Động sản phải đăng ký thì từ thời điểm đăng ký"},{"t":"Bất động sản","d":"Lập văn bản có công chứng, chứng thực hoặc đăng ký nếu luật yêu cầu · Hiệu lực từ thời điểm đăng ký"},{"t":"Tặng cho có điều kiện","d":"Điều kiện không vi phạm điều cấm, không trái đạo đức xã hội"}],"l":"stack"},{"t":"Hợp đồng thuê tài sản","d":"Bên cho thuê giao tài sản cho bên thuê để sử dụng trong thời hạn · Bên thuê trả tiền thuê · Cho thuê lại phải được bên cho thuê đồng ý · Bên thuê chậm trả tiền thuê 03 kỳ liên tiếp thì bên cho thuê có quyền đơn phương chấm dứt","c":[{"t":"Thuê khoán","d":"Đối tượng là đất đai, rừng, mặt nước, gia súc, cơ sở sản xuất, kinh doanh, tư liệu sản xuất khác"}],"l":"stack"},{"t":"Hợp đồng mượn tài sản","d":"Bên cho mượn giao tài sản cho bên mượn sử dụng trong thời hạn mà không phải trả tiền · Bên mượn trả lại khi hết thời hạn hoặc đạt mục đích · Đối tượng chỉ là tài sản không tiêu hao · Bên mượn giữ gìn, bảo quản · Không tự ý thay đổi tình trạng tài sản · Không cho mượn lại nếu không được đồng ý"},{"t":"Hợp đồng vay tài sản","d":"Bên cho vay giao tài sản cho bên vay · Khi đến hạn bên vay hoàn trả tài sả ồng của người đang có vợ, có chồng mà kết hôn · Cha, mẹ, con, người giám hộ, người đại diện · Cơ quan quản lý nhà nước về gia đình, về trẻ em · Hội Liên hiệp phụ nữ có quyền yêu cầu hủy · Hai bên đã đủ điều kiện kết hôn và cùng yêu cầu công nhận thì Tòa án công nhận quan hệ hôn nhân"},{"t":"Hậu quả pháp lý","d":"Quyền, nghĩa vụ với con giải quyết như cha mẹ và con · Tài sản giải quyết theo thỏa thuận, không có thỏa thuận thì theo BLDS","c":[{"t":"Hủy kết hôn trái pháp luật","d":"Hai bên phải chấm dứt quan hệ như vợ chồng · Quyền, nghĩa vụ đối với con, tài sản giải quyết"},{"t":"Đăng ký kết hôn không đúng thẩm quyền","d":"Thu hồi, hủy giấy chứng nhận và yêu cầu đăng ký lại"},{"t":"Chung sống như vợ chồng không đăng ký kết hôn","d":"Không làm phát sinh quyền, nghĩa vụ giữa vợ và chồng"}],"l":"stack"}],"l":"row"}],"h3":"Quan hệ pháp luật hôn nhân và gia đình · Kết hôn"},{"k":"2. Quan hệ giữa các thành viên gia đình (1/2)","h1":"Chương 6","h2":"Hôn nhân và gia đình","c":[{"t":"Quan hệ giữa các thành viên gia đình","l":"row","c":[{"t":"Vợ và chồng","c":[{"t":"Quyền và nghĩa vụ nhân thân","d":"Bình đẳng về quyền, nghĩa vụ trong mọi mặt của gia đình · Yêu thương, chung thủy, tôn trọng, quan tâm, chăm sóc, giúp đỡ nhau, cùng chung sống · Lựa chọn nơi cư trú do vợ chồng thỏa thuận · Tôn trọng danh dự, nhân phẩm, uy tín · Tôn trọng tự do tín ngưỡng, tôn giáo · Giúp đỡ nhau học tập, làm việc"},{"t":"Đại diện giữa vợ và chồng","d":"Vợ, chồng liên đới chịu trách nhiệm đối với giao dịch do một bên thực hiện để đáp ứng nhu cầu thiết yếu của gia đình","c":[{"t":"Kinh doanh chung","d":"Vợ chồng cùng kinh doanh là đại diện theo pháp luật của nhau, trừ thỏa thuận khác"},{"t":"Tài sản chung đứng tên một bên","d":"Bên đứng tên tự mình giao dịch trái quy định về đại diện thì giao dịch vô hiệu, trừ trường hợp bảo vệ người thứ ba ngay tình"}],"l":"stack"},{"t":"Chế độ tài sản của vợ chồng","c":[{"t":"Tài sản chung","d":"Tài sản do vợ, chồng tạo ra · Thu nhập do lao động, sản xuất, kinh doanh · Hoa lợi, lợi tức phát sinh từ tài sản riêng · Thu nhập hợp pháp khác trong thời kỳ hôn nhân · Tài sản được thừa kế chung, tặng cho chung · Tài sản vợ chồng thỏa thuận là tài sản chung · Quyền sử dụng đất có được sau khi kết hôn (trừ trường hợp được thừa kế riêng, tặng cho riêng) · Là sở hữu chung hợp nhất · Không chứng minh được là tài sản riêng thì là tài sản chung"},{"t":"Tài sản riêng","d":"Tài sản có trước khi kết hôn · Được thừa kế riêng, tặng cho riêng trong thời kỳ hôn nhân · Được chia riêng · Tài sản phục vụ nhu cầu thiết yếu của vợ, chồng · Tài sản hình thành từ tài sản riêng · Tài sản khác mà theo pháp luật thuộc sở hữu riêng"},{"t":"Định đoạt tài sản chung, nghĩa vụ tài sản","d":"Chiếm hữu, sử dụng, định đoạt tài sản chung do vợ chồng thỏa thuận · Bất động sản, động sản phải đăng ký, tài sản đang là nguồn tạo ra thu nhập chủ yếu của gia đình: phải có thỏa thuận bằng văn bản · Nghĩa vụ chung về tài sản, trong đó có giao dịch đáp ứng nhu cầu thiết yếu của gia đình · Nghĩa vụ riêng","c":[{"t":"Nhà là nơi ở duy nhất của vợ chồng","d":"Định đoạt phải có sự thỏa thuận, kể cả khi là tài sản riêng"}],"l":"stack"},{"t":"Chia tài sản chung trong thời kỳ hôn nhân","d":"Vợ chồng thỏa thuận chia một phần hoặc toàn bộ · Không thỏa thuận được thì yêu cầu Tòa án giải quyết · Lập thành văn bản · Phần tài sản được chia, hoa lợi, lợi tức phát sinh từ đó là tài sản riêng · Việc chia vô hiệu khi ảnh hưởng nghiêm trọng đến lợi ích gia đình, quyền lợi của con hoặc nhằm trốn tránh nghĩa vụ"},{"t":"Chế độ tài sản theo thỏa thuận","d":"Lập trước khi kết hôn bằng văn bản có công chứng hoặc chứng thực · Có hiệu lực từ ngày đăng ký kết hôn · Nội dung, sửa đổi, bổ sung, bị vô hiệu trong các trường hợp luật định"}],"l":"row"}],"l":"row"},{"t":"Cha, mẹ và con","c":[{"t":"Quyền và nghĩa vụ nhân thân","d":"Con bình đẳng, không phụ thuộc tình trạng hôn nhân của cha mẹ · Cha mẹ thương yêu, nuôi dưỡng, chăm sóc, giáo dục con · Con kính trọng, chăm sóc, phụng dưỡng cha mẹ · Cha mẹ đại diện cho con chưa thành niên, con thành niên mất năng lực hành vi · Bồi thường thiệt hại do con gây ra theo BLDS"},{"t":"Tài sản riêng của con","d":"Con có quyền có tài sản riêng · Con từ đủ 15 tuổi sống chung với cha mẹ mà có thu nhập thì đóng góp vào nhu cầu thiết yếu của gia đình · Con từ đủ 15 tuổi có thể tự quản lý tài sản riêng · Dưới 15 tuổi do cha mẹ quản lý","c":[{"t":"Con dưới 15 tuổi","d":"Cha mẹ định đoạt vì lợi ích của con, con từ đủ 09 tuổi thì xem xét nguyện vọng; con từ đủ 15 đến dưới 18 tuổi tự định đoạt, trừ bất động sản, động sản phải đăng ký, tài sản dùng để kinh doanh phải được cha mẹ đồng ý bằng văn bản"}],"l":"stack"},{"t":"Hạn chế quyền của cha, mẹ đối với con chưa thành niên","d":"Thời hạn hạn chế từ 01 năm đến 05 năm · Người bị hạn chế quyền vẫn phải thực hiện nghĩa vụ cấp dưỡng cho con"},{"t":"Xác định cha, mẹ, con","d":"Con sinh ra trong thời kỳ hôn nhân hoặc do người vợ có thai trong thời kỳ hôn nhân là con chung · Con sinh ra trong 300 ngày kể từ khi hôn nhân chấm dứt được coi là con do người vợ có thai trong thời kỳ hôn nhân · Con sinh ra trước ngày đăng ký kết hôn và được cha mẹ thừa nhận là con chung · Nhận cha, mẹ, con · Sinh con bằng kỹ thuật hỗ trợ sinh sản, mang thai hộ vì mục đích nhân đạo"}],"l":"row"}]}],"h3":"Quan hệ giữa các thành viên gia đình (phần 1/2)"},{"k":"3. Quan hệ giữa các thành viên gia đình (2/2)","h1":"Chương 6","h2":"Hôn nhân và gia đình","c":[{"t":"Quan hệ giữa các thành viên gia đình","l":"row","c":[{"t":"Các thành viên khác trong gia đình","d":"Các thành viên quan tâm, chăm sóc, giúp đỡ, tôn trọng nhau · Ông bà nội, ngoại – cháu · Anh, chị, em · Cô, dì, chú, cậu, bác ruột – cháu ruột · Nghĩa vụ trông nom, chăm sóc, nuôi dưỡng phát sinh khi không còn người gần hơn có điều kiện nuôi dưỡng"}]}],"h3":"Quan hệ giữa các thành viên gia đình (phần 2/2)"},{"k":"4. Cấp dưỡng","h1":"Chương 6","h2":"Hôn nhân và gia đình","c":[{"t":"Cấp dưỡng","c":[{"t":"Các trường hợp cấp dưỡng","d":"Cha, mẹ đối với con · Con đối với cha, mẹ · Anh, chị, em · Ông bà – cháu · Cô, dì, chú, cậu, bác ruột – cháu ruột · Vợ, chồng khi ly hôn nếu bên khó khăn, túng thiếu có yêu cầu và có lý do chính đáng","c":[{"t":"Người được cấp dưỡng","d":"Người chưa thành niên; người thành niên không có khả năng lao động và không có tài sản để tự nuôi mình; người gặp khó khăn, túng thiếu"}],"l":"stack"},{"t":"Mức, phương thức cấp dưỡng","d":"Mức do các bên thỏa thuận căn cứ thu nhập, khả năng thực tế của người cấp dưỡng và nhu cầu thiết yếu của người được cấp dưỡng · Không thỏa thuận được thì yêu cầu Tòa án giải quyết · Phương thức định kỳ hằng tháng, hằng quý, nửa năm, hằng năm hoặc một lần · Người có quyền yêu cầu thực hiện nghĩa vụ cấp dưỡng"},{"t":"Chấm dứt nghĩa vụ cấp dưỡng","d":"Người được cấp dưỡng đã thành niên và có khả năng lao động hoặc có tài sản để tự nuôi mình · Người được cấp dưỡng được nhận làm con nuôi · Người cấp dưỡng đã trực tiếp nuôi dưỡng người được cấp dưỡng · Người cấp dưỡng hoặc người được cấp dưỡng chết · Bên được cấp dưỡng sau khi ly hôn đã kết hôn, trường hợp khác theo luật"}],"l":"row"}],"h3":"Cấp dưỡng"},{"k":"5. Chấm dứt hôn nhân","h1":"Chương 6","h2":"Hôn nhân và gia đình","c":[{"t":"Chấm dứt hôn nhân","c":[{"t":"Vợ, chồng chết hoặc bị tuyên bố đã chết","d":"Bên còn sống quản lý tài sản chung · Tài sản chung được chia đôi, phần của người chết được chia theo pháp luật về thừa kế · Đã kết hôn thì hôn nhân sau có hiệu lực · Bị tuyên bố mất tích không làm chấm dứt hôn nhân · Là căn cứ để bên kia yêu cầu ly hôn","c":[{"t":"Thời điểm chấm dứt hôn nhân","d":"Thời điểm vợ hoặc chồng chết; bị tuyên bố đã chết thì là ngày chết được xác định trong bản án, quyết định"},{"t":"Người bị tuyên bố đã chết trở về","d":"Quan hệ hôn nhân được khôi phục nếu vợ/chồng chưa kết hôn với người khác"}],"l":"stack"},{"t":"Ly hôn","c":[{"t":"Quyền yêu cầu ly hôn","d":"Vợ, chồng hoặc cả hai người có quyền yêu cầu Tòa án giải quyết ly hôn · Cha, mẹ, người thân thích khác yêu cầu ly hôn khi một bên vợ, chồng bị bệnh tâ
