ới cơ quan khác và giữa các Tòa án với nhau"},{"t":"Thuận lợi cho đương sự","d":"Tạo thuận lợi cho đương sự tham gia tố tụng, giảm chi phí, thời gian"},{"t":"Bố trí Thẩm phán phù hợp","d":"Là cơ sở bố trí Thẩm phán, Tòa chuyên trách phù hợp chuyên môn"},{"t":"Sai thẩm quyền: bản án có thể bị hủy","c":[{"t":"Giải quyết sai thẩm quyền là","d":"Vi phạm thủ tục tố tụng, có thể dẫn đến bản án, quyết định bị hủy (xem Chương 8, Chương 10)"}],"l":"stack"}],"l":"row"},{"t":"Cơ sở xác định thẩm quyền theo loại việc","c":[{"t":"Khi chưa có điều luật để áp dụng","d":"Thụ lý theo thủ tục chung · Áp dụng tập quán, tương tự pháp luật, nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng (Điều 45 BLTTDS · Điều 5, 6 BLDS 2015)"}],"l":"stack"}],"h3":"Khái niệm thẩm quyền dân sự · Ý nghĩa xác định thẩm quyền dân sự · Cơ sở xác định thẩm quyền theo loại việc"},{"k":"2. Tranh chấp và yêu cầu về dân sự …","h1":"Chương 2","h2":"Thẩm quyền của Tòa án nhân dân","c":[{"t":"Tranh chấp và yêu cầu về dân sự","c":[{"t":"Tranh chấp","d":"Quốc tịch Việt Nam giữa cá nhân với cá nhân · Quyền sở hữu và quyền khác đối với tài sản · Giao dịch dân sự, hợp đồng dân sự · Sở hữu trí tuệ, chuyển giao công nghệ (trừ trường hợp các bên đều có mục đích lợi nhuận) · Thừa kế tài sản · Bồi thường thiệt hại ngoài hợp đồng · Đất đai, quyền sở hữu, quyền sử dụng rừng · Liên quan đến yêu cầu tuyên bố văn bản công chứng vô hiệu · Tài sản bị cưỡng chế thi hành án, kết quả bán đấu giá tài sản · Các tranh chấp dân sự khác"},{"t":"Yêu cầu","d":"Tuyên bố, hủy tuyên bố mất năng lực hành vi dân sự, có khó khăn trong nhận thức, làm chủ hành vi, hạn chế năng lực hành vi dân sự · Thông báo tìm kiếm người vắng mặt, tuyên bố, hủy tuyên bố mất tích, đã chết · Công nhận và cho thi hành bản án, quyết định dân sự của Tòa án nước ngoài · Tuyên bố văn bản công chứng vô hiệu · Công nhận kết quả hòa giải thành ngoài Tòa án · Công nhận tài sản vô chủ · Các yêu cầu theo Luật Thi hành án dân sự và yêu cầu dân sự khác"}],"l":"stack"},  Khởi kiện vụ án dân sự · Thụ lý vụ án dân …","h1":"Chương 7","h2":"Thủ tục giải quyết vụ án dân sự tại Tòa án cấp sơ thẩm","c":[{"t":"Khởi kiện vụ án dân sự","c":[{"t":"Khái niệm, ý nghĩa","d":"Khởi kiện là việc chủ thể có quyền yêu cầu Tòa án có thẩm quyền giải quyết tranh chấp, bảo vệ quyền, lợi ích hợp pháp của mình hoặc của người khác, lợi ích công cộng, lợi ích của Nhà nước · Tòa án chỉ giải quyết trong phạm vi đơn khởi kiện","c":[{"t":"Là hành vi làm phát sinh vụ án","d":"Không có đơn khởi kiện thì Tòa án không tự giải quyết (nguyên tắc quyền quyết định và tự định đoạt)"}],"l":"stack"},{"t":"Điều kiện, phạm vi và hình thức khởi kiện","c":[{"t":"Chủ thể có quyền khởi kiện","d":"Cơ quan, tổ chức, cá nhân tự mình hoặc thông qua người đại diện hợp pháp khởi kiện để bảo vệ quyền, lợi ích của mình · Khởi kiện vì người khác, lợi ích công cộng, lợi ích Nhà nước: cơ quan quản lý nhà nước về gia đình, trẻ em, Hội Liên hiệp phụ nữ · Công đoàn cấp trên của công đoàn cơ sở · Tổ chức xã hội tham gia bảo vệ quyền lợi người tiêu dùng · Cơ quan, tổ chức trong lĩnh vực mình phụ trách · Cá nhân trong vụ án hôn nhân và gia đình theo Luật Hôn nhân và gia đình"},{"t":"(thêm) Viện kiểm sát khởi kiện vụ án dân sự công ích","d":"Thí điểm 3 năm từ 01/01/2026 tại Hà Nội, TP. Hồ Chí Minh, Đà Nẵng, Cần Thơ, Quảng Ninh, Đắk Lắk","c":[{"t":"Đối tượng","d":"6 nhóm dễ bị tổn thương (trẻ em; người cao tuổi; người khuyết tật; phụ nữ mang thai hoặc nuôi con dưới 36 tháng tuổi; người khó khăn trong nhận thức, làm chủ hành vi hoặc mất, hạn chế năng lực hành vi dân sự; đồng bào dân tộc thiểu số ở vùng đặc biệt khó khăn) và 6 lĩnh vực lợi ích công (đầu tư công; đất đai, tài nguyên, tài sản công; môi trường; di sản văn hóa; an toàn thực phẩm, dược phẩm; bảo vệ người tiêu dùng)"},{"t":"Điều kiện","d":"Không có chủ thể khởi kiện hoặc chủ thể có quyền không khởi kiện sau khi Viện kiểm sát đã thông báo, kiến nghị"},{"t":"Thẩm quyền sơ thẩm","d":"Tòa án nhân dân khu vực; vụ án bảo vệ lợi ích công không được hòa giải, bị đơn không được phản tố"}],"l":"stack"}],"l":"row"}],"l":"row"},{"t":"Thụ lý vụ án dân sự và trả lại đơn khởi kiện","c":[{"t":"Thụ lý vụ án dân sự","d":"C) Quyền của bị đơn, người có quyền lợi, nghĩa vụ liên quan: nộp văn bản ghi ý kiến trong 15 ngày kể từ ngày nhận thông báo, được gia hạn không quá 15 ngày · Phản tố khi để bù trừ nghĩa vụ, khi được chấp nhận sẽ loại trừ một phần hoặc toàn bộ yêu cầu của nguyên đơn, hoặc có liên quan mà giải quyết cùng thì chính xác và nhanh hơn · Yêu cầu độc lập khi việc giải quyết vụ án liên quan đến quyền, nghĩa vụ của họ · Thủ tục như thủ tục khởi kiện của nguyên đơn","c":[{"t":"A) Nhận, xử lý đơn","d":"Chánh án phân công Thẩm phán trong 03 ngày làm việc; Thẩm phán xem xét trong 05 ngày làm việc và ra một trong bốn quyết định: yêu cầu sửa đổi, bổ sung đơn; thụ lý theo thủ tục thông thường hoặc rút gọn; chuyển đơn cho Tòa án có thẩm quyền; trả lại đơn. Thời hạn sửa đổi, bổ sung đơn do Thẩm phán ấn định, không quá 01 tháng (trường hợp đặc biệt gia hạn không quá 15 ngày)"},{"t":"B) Thụ lý","d":"Thông báo nộp tạm ứng án phí; người khởi kiện nộp trong 07 ngày; Tòa án thụ lý khi người khởi kiện nộp biên lai; được miễn hoặc không phải nộp thì thụ lý khi nhận đủ đơn và tài liệu; thông báo thụ lý trong 03 ngày làm việc cho nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan và Viện kiểm sát cùng cấp; Chánh án phân công Thẩm phán giải quyết trong 03 ngày làm việc"},{"t":"Thời điểm","d":"Trước khi mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải"}],"l":"stack"},{"t":"Trả lại đơn khởi kiện","c":[{"t":"A) Căn cứ","d":"Người khởi kiện không có quyền khởi kiện hoặc không có đủ năng lực hành vi tố tụng dân sự; chưa có đủ điều kiện khởi kiện; sự việc đã được giải quyết bằng bản án, quyết định đã có hiệu lực (trừ trường hợp luật cho khởi kiện lại); hết thời hạn mà không nộp tạm ứng án phí (trừ trường hợp được miễn, không phải nộp hoặc có lý do chính đáng); vụ án không thuộc thẩm quyền giải quyết của Tòa án; không sửa đổi, bổ sung đơn theo yêu cầu; người khởi kiện rút đơn"},{"t":"B) Khiếu nại, kiến nghị","d":"Trong 10 ngày kể từ ngày nhận văn bản trả lại đơn, người khởi kiện khiếu nại, Viện kiểm sát kiến nghị với Tòa án đã trả lại đơn; Chánh án phân công Thẩm phán khác; phiên họp trong 05 ngày làm việc có Viện kiểm sát và người khiếu nại; không đồng ý thì trong 10 ngày khiếu nại, kiến nghị lên Chánh án Tòa án trên một cấp trực tiếp, người này giải quyết trong 10 ngày và quyết định là quyết định cuối cùng"},{"t":"C) Quyền nộp đơn khởi kiện lại","d":"Người khởi kiện đã có đủ năng lực hành vi tố tụng dân sự; yêu cầu ly hôn, thay đổi nuôi con, mức cấp dưỡng… mà trước đó Tòa án chưa chấp nhận và pháp luật cho khởi kiện lại; đã có đủ điều kiện khởi kiện; các trường hợp khác luật định"}],"l":"stack"}],"l":"row"}],"h3":"Khởi kiện vụ án dân sự · Thụ lý vụ án dân sự và trả lại đơn khởi kiện"},{"k":"2. Chuẩn bị xét xử, hòa giải, tạm đình chỉ và …","h1":"Chương 7","h2":"Thủ tục giải quyết vụ án dân sự tại Tòa án cấp sơ thẩm","c":[{"t":"Chuẩn bị xét xử, hòa giải, tạm đình chỉ và đình chỉ giải quyết vụ án dân sự","c":[{"t":"Chuẩn bị xét xử","d":"B) Kết thúc giai đoạn bằng một trong bốn quyết định: công nhận sự thỏa thuận của các đương sự · Tạm đình chỉ · Đình chỉ · Đưa vụ án ra xét xử. Mở phiên tòa trong 01 tháng kể từ ngày có quyết định đưa vụ án ra xét xử (có lý do chính đáng thì 02 tháng) · Gửi hồ sơ cho Viện kiểm sát nghiên cứu","c":[{"t":"A) Thời hạn","d":"Tranh chấp dân sự, hôn nhân và gia đình 04 tháng kể từ ngày thụ lý, gia hạn không quá 02 tháng; kinh doanh, thương mại, lao động 02 tháng, gia hạn không quá 01 tháng; tạm đình chỉ thì thời hạn tính lại từ ngày quyết định tiếp tục giải quyết có hiệu lực"},{"t":"Nhiệm vụ của Thẩm phán","d":"Lập hồ sơ vụ án; xác định tư cách đương sự, quan hệ tranh chấp, pháp luật áp dụng; xác minh, thu thập chứng cứ; áp dụng biện pháp khẩn cấp tạm thời; tổ chức phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải"}],"l":"stack"},{"t":"Hòa giải","d":"B) Phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải: thông báo cho đương sự · Thành phần · Trình tự · Lập biên bản · D) (thêm) Phân biệt với hòa giải, đối thoại tại Tòa án theo Luật 58/2020/QH14: tiến hành trước khi Tòa án thụ lý, do Hòa giải viên thực hiện, các bên tự nguyện tham gia · Hòa giải thành thì Tòa án xem xét ra quyết định công nhận · Không thành thì Tòa án thụ lý theo BLTTDS. Từ 01/7/2025 việc hòa giải, đối thoại này gắn với Tòa án nhân dân khu vực","c":[{"t":"A) Nguyên tắc","d":"Tôn trọng sự tự nguyện thỏa thuận; không dùng vũ lực, đe dọa, ép buộc; nội dung thỏa thuận không vi phạm điều cấm của luật, không trái đạo đức xã hội. Vụ án không được hòa giải: yêu cầu bồi thường vì gây thiệt hại đến tài sản của Nhà nước; vụ án phát sinh từ giao dịch vi phạm điều cấm của luật, trái đạo đức xã hội. Vụ án không tiến hành hòa giải được: bị đơn, người có quyền lợi, nghĩa vụ liên quan được triệu tập hợp lệ lần thứ hai mà cố tình vắng mặt; đương sự không thể tham gia vì lý do chính đáng; vợ hoặc chồng trong vụ án ly hôn mất năng lực hành vi dân sự; một trong các đương sự đề nghị không tiến hành hòa giải"},{"t":"C) Công nhận sự thỏa thuận","d":"Hết 07 ngày kể từ ngày lập biên bản hòa giải thành mà không đương sự nào thay đổi ý kiến thì Thẩm phán ra quyết định công nhận; chỉ công nhận khi thỏa thuận được toàn bộ vụ án; quyết định có hiệu lực ngay, không bị kháng cáo, kháng nghị phúc thẩm; chỉ bị kháng nghị giám đốc thẩm nếu có căn cứ cho rằng thỏa thuận do nhầm lẫn, lừa dối, đe dọa, cưỡng ép hoặc vi phạm điều cấm, trái đạo đức xã hội"}],"l":"stack"},{"t":"Tạm đình chỉ và đình chỉ giải quyết vụ án dân sự","c":[{"t":"Bảng so sánh tạm đình chỉ – đình chỉ","c":[{"t":"Bản chất","d":"Tạm đình chỉ là tạm dừng · Đình chỉ là chấm dứt việc giải quyết vụ án"},{"t":"Sổ thụ lý","d":"Tạm đình chỉ giữ tên vụ án · Đình chỉ xóa tên vụ án"},{"t":"Tiền tạm ứng án phí","d":"Tạm đình chỉ thì gửi giữ, xử lý khi tiếp tục · Đình chỉ thì sung công quỹ hoặc trả lại tùy căn cứ"},{"t":"Hậu quả tiếp theo","d":"Tạm đình chỉ thì Tòa án tiếp tục giải quyết khi lý do không còn · Đình chỉ thì về nguyên tắc không được khởi kiện lại"}],"l":"stack"}],"l":"row"}],"l":"row"},{"t":"Phiên tòa sơ thẩm vụ án dân sự","c":[{"t":"Khái niệm, ý nghĩa","d":"Xét xử trực tiếp, bằng lời nói · Công khai, trừ trường hợp xét xử kín theo luật · Hội đồng xét xử sơ thẩm gồm 01 Thẩm phán và 02 Hội thẩm nhân dân · Trường hợp đặc biệt gồm 02 Thẩm phán và 03 Hội thẩm nhân dân","c":[{"t":"Phiên tòa sơ thẩm là","d":"Hình thức hoạt động xét xử tập trung nhất, nơi Hội đồng xét xử xem xét toàn bộ vụ án và ra bản án"}],"l":"stack"},{"t":"Quy định chung về phiên tòa","c":[{"t":"A) Sự có mặt","d":"Đương sự vắng mặt lần thứ nhất thì hoãn phiên tòa, trừ khi có đơn đề nghị xét xử vắng mặt; lần thứ hai: nguyên đơn vắng mặt bị coi là từ bỏ yêu cầu khởi kiện và bị đình chỉ, bị đơn không có yêu cầu phản tố thì xét xử vắng mặt, bị đơn có phản tố vắng mặt bị coi là từ bỏ phản tố, người có yêu cầu độc lập vắng mặt bị coi là từ bỏ yêu cầu; Kiểm sát viên vắng mặt thì vẫn xét xử, không hoãn phiên tòa"},{"t":"B) Xét xử vắng mặt","d":"Khi đương sự có đơn đề nghị xét xử vắng mặt hoặc thuộc trường hợp luật quy định; tất cả người tham gia tố tụng đều có đơn đề nghị xét xử vắng mặt thì xét xử theo thủ tục riêng"},{"t":"C) Hoãn phiên tòa","d":"Thời hạn hoãn không quá 01 tháng kể từ ngày ra quyết định hoãn · Theo thủ tục rút gọn không quá 15 ngày"}],"l":"stack"},{"t":"Trình tự, thủ tục tiến hành phiên tòa","c":[{"t":"A) Thủ tục bắt đầu","d":"Chuẩn bị khai mạc; khai mạc; giải quyết yêu cầu thay đổi người tiến hành tố tụng, người giám định, người phiên dịch; xem xét hoãn khi có người vắng mặt; hỏi đương sự về việc thay đổi, bổ sung, rút yêu cầu – chấp nhận thay đổi, bổ sung nếu không vượt quá phạm vi yêu cầu khởi kiện, phản tố, yêu cầu độc lập ban đầu, rút yêu cầu tự nguyện thì đình chỉ phần đã rút; thay đổi địa vị tố tụng khi nguyên đơn rút toàn bộ yêu cầu mà bị đơn giữ phản tố; công nhận sự thỏa thuận tại phiên tòa"},{"t":"B) Tranh tụng","d":"Gồm trình bày chứng cứ, hỏi, đối đáp, phát biểu quan điểm; chủ tọa không được hạn chế thời gian tranh tụng; thứ tự hỏi: nguyên đơn và người bảo vệ, bị đơn và người bảo vệ, người có quyền lợi, nghĩa vụ liên quan và người bảo vệ, người tham gia tố tụng khác, sau đó Chủ tọa, Hội thẩm nhân dân, cuối cùng là Kiểm sát viên; tranh luận, đối đáp; Kiểm sát viên phát biểu về việc tuân theo pháp luật tố tụng và việc giải quyết vụ án"},{"t":"C) Nghị án, tuyên án, bản án","d":"Chỉ thành viên Hội đồng xét xử được nghị án; biểu quyết theo đa số, Hội thẩm nhân dân biểu quyết trước, Thẩm phán biểu quyết sau cùng; vụ án phức tạp thời gian nghị án không quá 05 ngày làm việc; bản án gồm phần mở đầu, phần nội dung vụ án và nhận định, phần quyết định; chỉ sửa chữa, bổ sung lỗi chính tả, số liệu, tính toán; cấp trích lục bản án trong 03 ngày làm việc, giao, gửi bản án trong 10 ngày kể từ ngày tuyên án"},{"t":"D) Kỹ năng","d":"Sơ đồ diễn trình phiên tòa · Soạn đơn khởi kiện, quyết định, bản án theo biểu mẫu Nghị quyết 01/2017/NQ-HĐTP"}],"l":"stack"}],"l":"row"}],"h3":"Chuẩn bị xét xử, hòa giải, tạm đình chỉ và đình chỉ giải quyết vụ án dân sự · Phiên tòa sơ thẩm vụ án dân sự"}]},{"n":8,"t":"Thủ tục giải quyết vụ án dân sự tại Tòa án cấp phúc thẩm","maps":[{"k":"1. Khái niệm và ý nghĩa phúc thẩm dân sự …","h1":"Chương 8","h2":"Thủ tục giải quyết vụ án dân sự tại Tòa án cấp phúc thẩm","c":[{"t":"Khái niệm và ý nghĩa phúc thẩm dân sự","c":[{"t":"Khái niệm phúc thẩm dân sự","c":[{"t":"Xét xử phúc thẩm là","d":"Việc Tòa án cấp trên trực tiếp xét xử lại vụ án mà bản án, quyết định sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị"},{"t":"Thể hiện chế độ hai cấp xét xử","d":"Bản án sơ thẩm không bị kháng cáo, kháng nghị thì có hiệu lực pháp luật"},{"t":"Đặc điểm","d":"Chỉ phát sinh khi có kháng cáo, kháng nghị hợp lệ · Chỉ xem xét phần bị kháng cáo, kháng nghị hoặc có liên quan · Hội đồng xét xử gồm 03 Thẩm phán · Bản án phúc thẩm có hiệu lực từ ngày tuyên án"}],"l":"stack"},{"t":"Ý nghĩa phúc thẩm dân sự","d":"Sửa chữa sai lầm của Tòa án cấp sơ thẩm, bảo vệ quyền, lợi ích hợp pháp của đương sự · Bảo đảm áp dụng pháp luật thống nhất · Tòa án cấp trên kiểm tra, hướng dẫn hoạt động xét xử của Tòa án cấp dưới · Nâng cao trách nhiệm của Tòa án cấp sơ thẩm và niềm tin của người dân vào công lý"}],"l":"row"},{"t":"Kháng cáo, kháng nghị theo thủ tục phúc thẩm","c":[{"t":"Kháng cáo theo thủ tục phúc thẩm","d":"Không nộp thì coi như từ bỏ kháng cáo, trừ trường hợp có lý do chính đáng","c":[{"t":"A) Người có quyền kháng cáo","d":"Đương sự, người đại diện hợp pháp của đương sự, cơ quan, tổ chức, cá nhân khởi kiện; đối tượng: bản án sơ thẩm, quyết định tạm đình chỉ, đình chỉ giải quyết vụ án của Tòa án cấp sơ thẩm; quyết định công nhận sự thỏa thuận không bị kháng cáo; đơn kháng cáo gửi Tòa án cấp sơ thẩm đã ra bản án, quyết định"},{"t":"B) Thời hạn","d":"Bản án 15 ngày kể từ ngày tuyên án; vắng mặt có lý do chính đáng thì tính từ ngày nhận bản án hoặc ngày niêm yết; quyết định tạm đình chỉ, đình chỉ 07 ngày kể từ ngày nhận quyết định hoặc ngày niêm yết; gửi qua bưu chính thì ngày kháng cáo là ngày có dấu bưu chính nơi gửi. Kháng cáo quá hạn: Tòa án cấp phúc thẩm thành lập Hội đồng gồm 03 Thẩm phán xem xét tại phiên họp có Kiểm sát viên và người kháng cáo quá hạn"},{"t":"C) Kiểm tra đơn, tạm ứng án phí phúc thẩm","d":"Người kháng cáo nộp tạm ứng trong 10 ngày kể từ ngày nhận thông báo"}],"l":"stack"},{"t":"Kháng nghị theo thủ tục phúc thẩm","c":[{"t":"Bảng so sánh kháng cáo – kháng nghị","c":[{"t":"Chủ thể","d":"Kháng cáo là đương sự, người đại diện, người khởi kiện · Kháng nghị là Viện trưởng Viện kiểm sát cùng cấp, cấp trên trực tiếp"},{"t":"Hình thức","d":"Đơn kháng cáo – quyết định kháng nghị"},{"t":"Thời hạn với bản án","d":"15 ngày – 15 ngày (cùng cấp) hoặc 01 tháng (cấp trên trực tiếp)"},{"t":"Án phí","d":"Người kháng cáo nộp tạm ứng án phí phúc thẩm – Viện kiểm hĩa và điều kiện áp dụng thủ …","h1":"Chương 9","h2":"Thủ tục rút gọn giải quyết vụ án dân sự","c":[{"t":"Khái niệm, ý nghĩa và điều kiện áp dụng thủ tục rút gọn","c":[{"t":"Khái niệm","d":"Chỉ áp dụng cho vụ án dân sự (có tranh chấp), ở cả cấp sơ thẩm và cấp phúc thẩm · Quy định riêng về thủ tục rút gọn được áp dụng trước, chỗ nào không quy định thì áp dụng quy định chung của BLTTDS · Luật khác quy định tranh chấp được giải quyết theo thủ tục rút gọn thì thực hiện theo các quy định về thủ tục rút gọn của BLTTDS","c":[{"t":"Thủ tục rút gọn là","d":"Thủ tục tố tụng áp dụng để giải quyết vụ án dân sự có đủ điều kiện luật định, với trình tự đơn giản hơn thủ tục giải quyết vụ án thông thường, nhằm giải quyết nhanh chóng nhưng vẫn bảo đảm đúng pháp luật"},{"t":"Đặc điểm","d":"Một Thẩm phán xét xử cả sơ thẩm và phúc thẩm, không có Hội thẩm nhân dân; thời hạn ngắn; hòa giải tiến hành ngay tại phiên tòa sau khi khai mạc"}],"l":"stack"},{"t":"Ý nghĩa áp dụng thủ tục rút gọn","d":"Giải quyết nhanh những vụ án đơn giản, chứng cứ rõ ràng · Tiết kiệm thời gian, chi phí cho đương sự và Tòa án · Giảm tải công việc cho Tòa án, để tập trung nguồn lực vào các vụ án phức tạp · Vẫn bảo đảm quyền kháng cáo, kháng nghị phúc thẩm và cơ chế giám đốc thẩm, tái thẩm"},{"t":"Điều kiện áp dụng thủ tục rút gọn","d":"A) Vụ án có tình tiết đơn giản, quan hệ pháp luật rõ ràng, đương sự đã thừa nhận nghĩa vụ · Tài liệu, chứng cứ đầy đủ, bảo đảm đủ căn cứ để giải quyết và Tòa án không phải thu thập tài liệu, chứng cứ · B) Các đương sự đều có địa chỉ nơi cư trú, trụ sở rõ ràng · C) Không có đương sự cư trú ở nước ngoài, tài sản tranh chấp ở nước ngoài · Phải có đủ cả ba điều kiện trên · Vụ án lao động đã thụ lý theo thủ tục rút gọn mà người sử dụng lao động có quốc tịch nước ngoài hoặc người đại diện theo pháp luật của họ rời khỏi địa chỉ không thông báo: bị coi là cố tình giấu địa chỉ, Tòa án vẫn giải quyết theo thủ tục rút gọn · Vụ án bảo vệ quyền lợi người tiêu dùng có giá trị giao dịch dưới 100 t t · Kiểm sát viên vắng mặt thì vẫn xét xử · Đương sự có quyền đề nghị xét xử vắng mặt · Bị đơn, người có quyền lợi, nghĩa vụ liên quan đã được triệu tập hợp lệ mà vắng mặt không có lý do chính đáng thì Thẩm phán vẫn tiến hành phiên tòa · Khai mạc · Tiến hành hòa giải (trừ trường hợp không được hòa giải, không tiến hành hòa giải được) · Thỏa thuận được thì ra quyết định công nhận sự thỏa thuận · Không thỏa thuận được thì xét xử · Trình bày, tranh luận, đối đáp, đề xuất quan điểm theo Mục 3 Chương XIV"},{"t":"(thêm) Hiệu lực của bản án, quyết định theo thủ tục rút gọn","d":"Bản án, quyết định sơ thẩm có thể bị kháng cáo, kháng nghị để Tòa án cấp phúc thẩm giải quyết theo thủ tục phúc thẩm rút gọn · Bản án, quyết định theo thủ tục rút gọn có thể bị kháng nghị giám đốc thẩm, tái thẩm"}],"l":"row"}],"h3":"Giải quyết vụ án dân sự theo thủ tục rút gọn tại Tòa án cấp sơ thẩm"},{"k":"3. Giải quyết vụ án dân sự theo thủ tục rút …","h1":"Chương 9","h2":"Thủ tục rút gọn giải quyết vụ án dân sự","c":[{"t":"Giải quyết vụ án dân sự theo thủ tục rút gọn tại Tòa án cấp phúc thẩm","c":[{"t":"(thêm) Thời hạn kháng cáo, kháng nghị","d":"07 ngày kể từ ngày tuyên án, đương sự không có mặt tại phiên tòa thì tính từ ngày bản án, quyết định được giao cho họ hoặc được niêm yết · Viện kiểm sát cùng cấp 07 ngày, Viện kiểm sát cấp trên trực tiếp 10 ngày, kể từ ngày nhận được bản án, quyết định"},{"t":"(thêm) Chuẩn bị xét xử phúc thẩm","d":"Trong 01 tháng kể từ ngày thụ lý, Thẩm phán ra một trong các quyết định: tạm đình chỉ xét xử phúc thẩm · Đình chỉ xét xử phúc thẩm · Đưa vụ án ra xét xử phúc thẩm · Quyết định đưa vụ án ra xét xử gửi ngay kèm hồ sơ cho Viện kiểm sát cùng cấp, nghiên cứu trong 05 ngày làm việc · Xuất hiện tình tiết mới thì chuyển sang thủ tục thông thường"},{"t":"(thêm) Phiên tòa phúc thẩm theo thủ tục rút gọn","d":"Mở phiên tòa trong 15 ngày kể từ ngày có quyết định đưa vụ án ra xét xử phúc thẩm · Một Thẩm phán Tòa án nhân dân cấp tỉnh xét xử · Kiểm sát viên vắng mặt vẫn xét hông có quyền kháng cáo mà chỉ có quyền đề nghị xem xét kháng nghị"}],"l":"stack"},{"t":"Kháng nghị theo thủ tục giám đốc thẩm","d":"Tòa án, Viện kiểm sát, cơ quan, tổ chức, cá nhân phát hiện vi phạm thì thông báo · Chánh án Tòa án nhân dân khu vực kiến nghị Chánh án Tòa án nhân dân cấp tỉnh hoặc Chánh án Tòa án nhân dân tối cao, Chánh án Tòa án nhân dân cấp tỉnh kiến nghị Chánh án Tòa án nhân dân tối cao · Đ) Người có thẩm quyền kháng nghị được yêu cầu hoãn thi hành án · Người đã kháng nghị có quyền tạm đình chỉ thi hành bản án đến khi có quyết định giám đốc thẩm · Thay đổi, bổ sung kháng nghị khi chưa hết thời hạn, rút kháng nghị trước hoặc tại phiên tòa · Chánh án kháng nghị thì gửi hồ sơ cho Viện kiểm sát cùng cấp nghiên cứu trong 15 ngày","c":[{"t":"A) Căn cứ","d":"Kết luận trong bản án không phù hợp tình tiết khách quan, gây thiệt hại cho đương sự; vi phạm nghiêm trọng thủ tục tố tụng làm đương sự không thực hiện được quyền, nghĩa vụ tố tụng; sai lầm trong áp dụng pháp luật dẫn đến bản án, quyết định không đúng. Điều kiện: có căn cứ và có đơn đề nghị hoặc thông báo, kiến nghị; xâm phạm lợi ích công cộng, lợi ích Nhà nước, quyền, lợi ích của người thứ ba thì không cần đơn"},{"t":"B) Phát hiện bản án cần xem xét lại","d":"Đương sự đề nghị bằng văn bản trong 01 năm kể từ ngày bản án, quyết định có hiệu lực"},{"t":"C) Người có thẩm quyền kháng nghị","d":"Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao đối với bản án, quyết định của Tòa án nhân dân cấp tỉnh, của Tòa án khác khi xét thấy cần thiết, trừ quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao; Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh đối với bản án, quyết định của Tòa án nhân dân khu vực trong phạm vi thẩm quyền theo lãnh thổ"},{"t":"D) Thời hạn kháng nghị","d":"03 năm kể từ ngày bản án, quyết định có hiệu lực; kéo dài thêm 02 năm khi đương sự đã có đơn trong thời hạn và tiếp tục có đơn sau đó, đồng thời bản án có vi phạm xâm phạm nghiêm trọng quyền, lợi ích của đương sự, người thứ ba, lợi ích cộng đồng, Nhà nước"}],"l":"stack"},{"t":"Xét xử giám đốc thẩm","d":"E) Quyết định giám đốc thẩm có hiệu lực kể từ ngày Hội đồng ra quyết định, gửi cho đương sự, Tòa án đã ra bản án, Viện kiểm sát, cơ quan thi hành án trong 05 ngày làm việc","c":[{"t":"A) Thẩm quyền","d":"Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh giám đốc thẩm bản án, quyết định của Tòa án nhân dân khu vực; Hội đồng Thẩm phán Tòa án nhân dân tối cao giám đốc thẩm bản án, quyết định của Tòa án nhân dân cấp tỉnh bằng Hội đồng năm Thẩm phán, hoặc toàn thể Hội đồng Thẩm phán khi vụ án phức tạp hoặc Hội đồng năm Thẩm phán không thống nhất; bản án về cùng một vụ án thuộc thẩm quyền của cả hai cấp thì Tòa án nhân dân tối cao giám đốc thẩm toàn bộ"},{"t":"B) Thành phần, biểu quyết","d":"Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh và toàn thể Hội đồng Thẩm phán – có mặt ít nhất hai phần ba, quá nửa tổng số thành viên tán thành; Hội đồng năm Thẩm phán – tất cả thành viên tán thành"},{"t":"C) Phiên tòa","d":"Bắt buộc có Viện kiểm sát cùng cấp · Đương sự chỉ được triệu tập khi cần thiết, vắng mặt vẫn tiến hành · Mở phiên tòa trong 04 tháng kể từ ngày nhận kháng nghị kèm hồ sơ · Bản thuyết trình gửi thành viên Hội đồng chậm nhất 07 ngày trước phiên tòa"},{"t":"D) Phạm vi","d":"Phần bị kháng nghị hoặc có liên quan; được xem xét phần không bị kháng nghị nếu xâm phạm lợi ích công cộng, lợi ích Nhà nước, lợi ích của người thứ ba không phải là đương sự"},{"t":"Đ) Thẩm quyền của Hội đồng","d":"Không chấp nhận kháng nghị, giữ nguyên bản án; hủy và giữ nguyên bản án đúng pháp luật của Tòa án cấp dưới đã bị hủy, sửa; hủy một phần hoặc toàn bộ để xét xử lại sơ thẩm hoặc phúc thẩm; hủy và đình chỉ giải quyết vụ án; sửa một phần hoặc toàn bộ khi chứng cứ đầy đủ, rõ ràng và không ảnh hưởng quyền, nghĩa vụ của người khác"}],"l":"cols2"}],"l":"row"}],"h3":"Thủ tục giám đốc thẩm"},{"k":"2. Thủ tục tái thẩm · Thủ tục đặc biệt xem xét …","h1":"Chương 10","h2":"Thủ tục xem xét lại bản án, quyết định đã có hiệu lực pháp luật","c":[{"t":"Thủ tục tái thẩm","c":[{"t":"Khái niệm, ý nghĩa của tái thẩm","d":"Tái thẩm là xét lại bản án, quyết định đã có hiệu lực pháp luật nhưng bị kháng nghị vì có tình tiết mới được phát hiện có thể làm thay đổi cơ bản nội dung của bản án, quyết định mà Tòa án, các đương sự không biết được khi Tòa án ra bản án, quyết định đó · Khác giám đốc thẩm ở chỗ căn cứ nằm ở tình tiết mới phát hiện sau khi bản án có hiệu lực, không phải ở việc đánh giá chứng cứ, áp dụng pháp luật trên hồ sơ đã có · Bảo đảm bản án phản ánh đúng sự thật khách quan của vụ án, bảo vệ quyền, lợi ích hợp pháp của đương sự"},{"t":"Kháng nghị theo thủ tục tái thẩm","c":[{"t":"A) Căn cứ","d":"Mới phát hiện tình tiết quan trọng mà đương sự không thể biết trong quá trình giải quyết vụ án; có cơ sở chứng minh kết luận giám định, lời dịch không đúng sự thật hoặc có giả mạo chứng cứ; Thẩm phán, Hội thẩm nhân dân, Kiểm sát viên cố ý làm sai lệch hồ sơ hoặc cố ý kết luận trái pháp luật; bản án, quyết định của Tòa án hoặc quyết định của cơ quan nhà nước làm căn cứ giải quyết vụ án đã bị hủy bỏ"},{"t":"B) Phát hiện tình tiết mới","d":"Đương sự, cơ quan, tổ chức, cá nhân có quyền thông báo bằng văn bản; Tòa án, Viện kiểm sát phát hiện thì phải thông báo cho người có thẩm quyền kháng nghị"},{"t":"C) Người có thẩm quyền kháng nghị","d":"Như giám đốc thẩm – Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao; Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh; người đã kháng nghị có quyền tạm đình chỉ thi hành bản án"},{"t":"D) Thời hạn","d":"01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ kháng nghị"}],"l":"stack"},{"t":"Xét xử tái thẩm","d":"Thẩm quyền, thành phần, trình tự phiên tòa, biểu quyết thực hiện như giám đốc thẩm · Hội đồng tái thẩm không có quyền sửa bản án, quyết định và không hủy để xét xử phúc thẩm lại","c":[{"t":"Hội đồng tái thẩm có quyền","d":"Không chấp nhận kháng nghị, giữ nguyên bản án, quyết định · Hủy bản án, quyết định để xét xử sơ thẩm lại · Hủy bản án, quyết định và đình chỉ giải quyết vụ án"}],"l":"stack"},{"t":"(thêm) So sánh giám đốc thẩm với tái thẩm","c":[{"t":"Thời hạn kháng nghị","d":"03 năm (có thể thêm 02 năm) kể từ ngày bản án có hiệu lực – 01 năm kể từ ngày người có thẩm quyền biết căn cứ"},{"t":"Thẩm quyền của Hội đồng","d":"Có quyền sửa, có quyền hủy để xét xử lại sơ thẩm hoặc phúc thẩm – không có quyền sửa, chỉ hủy để xét xử sơ thẩm lại"},{"t":"Giống nhau","d":"Đối tượng là bản án, quyết định đã có hiệu lực · Chỉ phát sinh khi có kháng nghị · Cùng người có thẩm quyền kháng nghị, cùng Tòa án xét xử"}],"l":"stack"}],"l":"row"},{"t":"Thủ tục đặc biệt xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao","c":[{"t":"Khái niệm, ý nghĩa","d":"Thủ tục xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao khi có căn cứ xác định quyết định có vi phạm pháp luật nghiêm trọng hoặc phát hiện tình tiết quan trọng mới có thể làm thay đổi cơ bản nội dung quyết định mà Hội đồng Thẩm phán, đương sự không thể biết được khi ra quyết định đó · Là cơ chế cuối cùng khắc phục sai lầm của cấp xét xử cao nhất, bảo đảm công lý và quyền, lợi ích hợp pháp của đương sự"},{"t":"Thủ tục xem xét lại","d":"Trong 04 tháng kể từ ngày nhận yêu cầu của Ủy ban Thường vụ Quốc hội hoặc từ ngày Hội đồng Thẩm phán quyết định mở phiên họp, Hội đồng Thẩm phán họp với sự tham gia của toàn thể Thẩm phán Tòa án nhân dân tối cao để xem xét lại · Viện trưởng Viện kiểm sát nhân dân tối cao phải tham dự và phát biểu quan điểm","c":[{"t":"Chủ thể","d":"Ủy ban Thường vụ Quốc hội yêu cầu · Ủy ban Pháp luật và Tư pháp của Quốc hội kiến nghị · Viện trưởng Viện kiểm sát nhân dân tối cao kiến nghị · Chánh án Tòa án nhân dân tối cao đề nghị"},{"t":"Có yêu cầu của Ủy ban Thường vụ Quốc hội","d":"Chánh án Tòa án nhân dân tối cao báo cáo Hội đồng Thẩm phán để xem xét lại quyết định"},{"t":"Có kiến nghị, đề nghị","d":"Trong 01 tháng, Hội đồng Thẩm phán mở phiên họp xem xét kiến nghị, đề nghị (có Viện trưởng Viện kiểm sát nhân dân tối cao tham dự), thảo luận và biểu quyết theo đa số; không nhất trí thì thông báo bằng văn bản, nêu rõ lý do"}],"l":"stack"},{"t":"Thẩm quyền xem xét lại","d":"Hủy quyết định của Hội đồng Thẩm phán, hủy bản án, quyết định đã có hiệu lực pháp luật và quyết định về nội dung vụ án · Hủy quyết định của Hội đồng Thẩm phán, hủy bản án, quyết định và xác định trách nhiệm bồi thường thiệt hại hoặc trách nhiệm bồi hoàn · Hủy quyết định của Hội đồng Thẩm phán, hủy bản án, quyết định để giao hồ sơ cho Tòa án cấp dưới giải quyết theo quy định của pháp luật · Quyết định phải được ít nhất ba phần tư tổng số thành viên Hội đồng Thẩm phán Tòa án nhân dân tối cao biểu quyết tán thành"}],"l":"row"}],"h3":"Thủ tục tái thẩm · Thủ tục đặc biệt xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao"}]},{"n":11,"t":"Thủ tục giải quyết việc dân sự","maps":[{"k":"1. Những quy định chung về thủ tục giải quyết …","h1":"Chương 11","h2":"Thủ tục giải quyết việc dân sự","c":[{"t":"Những quy định chung về thủ tục giải quyết việc dân sự","c":[{"t":"Nguyên tắc giải quyết việc dân sự","d":"Việc dân sự là việc không có tranh chấp, có yêu cầu Tòa án công nhận hoặc không công nhận một sự kiện pháp lý làm phát sinh quyền, nghĩa vụ, hoặc công nhận cho mình quyền về dân sự, hôn nhân và gia đình, kinh doanh, thương mại, lao động · Áp dụng các quy định riêng về thủ tục giải quyết việc dân sự · Chỗ không quy định thì áp dụng các quy định khác của BLTTDS · Giải quyết bằng phiên họp, không mở phiên tòa · Không có nguyên đơn, bị đơn mà có người yêu cầu và người có quyền lợi, nghĩa vụ liên quan · Viện kiểm sát tham gia tất cả các phiên họp sơ thẩm đối với việc dân sự và phiên họp phúc thẩm"},{"t":"Thành phần giải quyết việc dân sự","d":"Một Thẩm phán giải quyết, trừ các trường hợp do tập thể ba Thẩm phán giải quyết · Yêu cầu liên quan đến Trọng tài thương mại Việt Nam: thành phần theo pháp luật về trọng tài thương mại · Thay đổi Thẩm phán, Thư ký phiên họp: trước phiên họp do Chánh án quyết định · Tại phiên họp, việc do một Thẩm phán giải quyết thì Chánh án quyết định, do tập thể ba Thẩm phán giải quyết thì Hội đồng quyết định","c":[{"t":"Tập thể ba Thẩm phán","d":"Yêu cầu công nhận, cho thi hành hoặc không công nhận bản án, quyết định của Tòa án nước ngoài, phán quyết của Trọng tài nước ngoài; yêu cầu xét tính hợp pháp của cuộc đình công; việc xét kháng cáo, kháng nghị quyết định giải quyết việc dân sự"}],"l":"stack"},{"t":"Người tham gia phiên họp giải quyết việc dân sự","d":"Kiểm sát viên Viện kiểm sát cùng cấp phải tham gia · Vắng mặt thì Tòa án vẫn tiến hành phiên họp · Người yêu cầu phải tham gia theo giấy triệu tập · Vắng mặt lần thứ nhất thì hoãn phiên họp, trừ khi đề nghị giải quyết vắng mặt · Được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt thì coi như từ bỏ yêu cầu, Tòa án đình chỉ giải quyết việc dân sự nhưng quyền yêu cầu lại vẫn được bảo đảm · Người có quyền lợi, nghĩa vụ liên quan, người làm chứng, người giám định, người phiên dịch vắng mặt thì Tòa án quyết định hoãn hoặc vẫn tiến hành phiên họp"},{"t":"Thủ tục giải quyết việc dân sự","d":"Đơn yêu cầu gửi Tòa án có thẩm quyền, kèm tài liệu, chứng cứ · Chánh án phân công Thẩm phán trong 03 ngày làm việc · Sửa đổi, bổ sung đơn trong 07 ngày · Nộp lệ phí trong 05 ngày làm việc kể từ ngày nhận thông báo · Thông báo thụ lý trong 03 ngày làm việc · Chuẩn bị xét đơn 01 tháng, kéo dài không quá 01 tháng khi chờ kết quả giám định, định giá · Viện kiểm sát nghiên cứu hồ sơ 07 ngày · Mở phiên họp trong 15 ngày kể từ ngày ra quyết định mở phiên họp","c":[{"t":"Trả lại đơn yêu cầu","d":"Người yêu cầu không có quyền yêu cầu hoặc không đủ năng lực hành vi tố tụng; sự việc đã được giải quyết; không thuộc thẩm quyền Tòa án; không sửa đổi, bổ sung đơn; không nộp lệ phí; rút đơn"},{"t":"Trình tự phiên họp","d":"Người yêu cầu trình bày · Người có quyền lợi, nghĩa vụ liên quan trình bày · Người làm chứng, người giám định trình bày · Xem xét tài liệu, chứng cứ · Kiểm sát viên phát biểu · Thẩm phán quyết định chấp nhận hoặc không chấp nhận yêu cầu"}],"l":"stack"},{"t":"Quyết định giải quyết việc dân sự","d":"Nội dung gồm nhận định, căn cứ chấp nhận hoặc không chấp nhận đơn yêu cầu, căn cứ pháp luật, quyết định và lệ phí phải nộp · Gửi cho Viện kiểm sát cùng cấp, người yêu cầu, người có quyền lợi, nghĩa vụ liên quan trong 05 ngày làm việc kể từ ngày ra quyết định · Quyết định có hiệu lực liên quan đến thay đổi hộ tịch phải gửi cho Ủy ban nhân dân nơi đã đăng ký hộ tịch · Quyết định có hiệu lực được công bố trên Cổng thông tin điện tử của Tòa án (trừ thông tin phải giữ bí mật)"},{"t":"Thủ tục phúc thẩm quyết định giải quyết việc dân sự","d":"Chuẩn bị xét kháng cáo, kháng nghị 15 ngày kể từ ngày nhận (kéo dài không quá 15 ngày) · Viện kiểm sát nghiên cứu hồ sơ 07 ngày · Mở phiên họp phúc thẩm trong 15 ngày · Kiểm sát viên vắng mặt vẫn tiến hành, trừ trường hợp Viện kiểm sát kháng nghị · Quyết định phúc thẩm có hiệu lực pháp luật kể từ ngày ra quyết định","c":[{"t":"Kháng cáo","d":"Người yêu cầu, người có quyền lợi, nghĩa vụ liên quan; kháng nghị: Viện kiểm sát cùng cấp, cấp trên trực tiếp; không được kháng cáo, kháng nghị quyết định công nhận kết quả hòa giải thành ngoài Tòa án, công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn, công nhận thỏa thuận thay đổi người trực tiếp nuôi con sau khi ly hôn"},{"t":"Thời hạn","d":"Kháng cáo 10 ngày kể từ ngày Tòa án ra quyết định (vắng mặt thì tính từ ngày nhận, được thông báo, niêm yết); kháng nghị: Viện kiểm sát cùng cấp 10 ngày, cấp trên trực tiếp 15 ngày kể từ ngày Tòa án ra quyết định"},{"t":"Hội đồng phúc thẩm","d":"Giữ nguyên; sửa; hủy và chuyển hồ sơ cho Tòa án cấp sơ thẩm giải quyết lại; hủy và đình chỉ giải quyết việc dân sự; đình chỉ việc xét đơn yêu cầu theo thủ tục phúc thẩm khi tất cả người kháng cáo rút đơn, Viện kiểm sát rút kháng nghị"}],"l":"stack"}],"l":"row"}],"h3":"Những quy định chung về thủ tục giải êu cầu","d":"Công chứng viên đã thực hiện việc công chứng, người yêu cầu công chứng, người làm chứng, người phiên dịch, người có quyền lợi, nghĩa vụ liên quan, cơ quan nhà nước có thẩm quyền, khi có căn cứ cho rằng việc công chứng vi phạm pháp luật về công chứng"}],"l":"stack"}],"l":"row"}],"h3":"Thủ tục giải quyết một số việc dân sự"}]}],"laws":[],"refs":[],"cases":[]};

TL["luat-thuong-mai"]={"name":"Luật Thương mại","review":"luat-thuong-mai","chapters":[{"n":1,"t":"Địa vị pháp lý của các chủ thể kinh doanh","maps":[{"k":"1. Khái quát về thương nhân và hoạt động …","h1":"Chương 1","h2":"Địa vị pháp lý của các chủ thể kinh doanh","c":[{"t":"Khái quát về thương nhân và hoạt động thương mại","c":[{"t":"Hoạt động thương mại","c":[{"t":"Hoạt động thương mại là","d":"Hoạt động nhằm mục đích sinh lợi, bao gồm mua bán hàng hóa, cung ứng dịch vụ, đầu tư, xúc tiến thương mại và các hoạt động nhằm mục đích sinh lợi khác theo quy định pháp luật. Thương nhân gồm tổ chức kinh tế được thành lập hợp pháp và cá nhân hoạt động thương mại độc lập, thường xuyên, có đăng ký kinh doanh theo điều kiện luật định"}],"l":"stack"},{"t":"Hoạt động – thương nhân – doanh nghiệp","d":"Cần phân biệt hoạt động thương mại (xác định theo tính chất, mục đích của hoạt động), thương nhân (xác định theo tư cách chủ thể) và doanh nghiệp (một loại tổ chức kinh tế được thành lập, đăng ký theo pháp luật doanh nghiệp). Không phải mọi chủ thể tham gia một giao dịch có tính chất thương mại đều mặc nhiên là doanh nghiệp"}],"l":"row"},{"t":"Doanh nghiệp và các loại hình doanh nghiệp","c":[{"t":"Khái niệm doanh nghiệp","c":[{"t":"Doanh nghiệp là","d":"Tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định pháp luật nhằm mục đích kinh doanh. Việc xác định loại hình doanh nghiệp quyết định cơ cấu tổ chức, chế độ tài sản, quyền quản lý và phạm vi trách nhiệm của chủ sở hữu hoặc thành viên"}],"l":"stack"},{"t":"Doanh nghiệp tư nhân","d":"Do một cá nhân làm chủ, chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản của mình đối với hoạt động của doanh nghiệp"},{"t":"Công ty hợp danh","d":"Có thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản theo luật, có thể có thành viên góp vốn chịu trách nhiệm trong phạm vi vốn cam kết góp"},{"t":"Công ty TNHH","d":"Gồm công ty TNHH một thành viên và từ hai thành viên trở lên, trách nhiệm tài sản của chủ sở hữu/thành viên về nguyên tắc gắn với phần vốn theo luật"},{"t":"Công ty cổ phần","d":"Vốn điều lệ chia thành cổ phần · Có ít nhất ba cổ đông và không hạn chế số lượng tối đa theo luật · Cổ đông chịu trách nhiệm trong phạm vi vốn góp"}],"l":"row"}],"h3":"Khái quát về thương nhân và hoạt động thương mại · Doanh nghiệp và các loại hình doanh nghiệp"},{"k":"2. Hộ kinh doanh và hợp tác xã · Doanh nghiệp …","h1":"Chương 1","h2":"Địa vị pháp lý của các chủ thể kinh doanh","c":[{"t":"Hộ kinh doanh và hợp tác xã","c":[{"t":"Hộ kinh doanh và hợp tác xã là","d":"Các mô hình tổ chức hoạt động kinh doanh có cơ sở pháp lý và chế độ tổ chức riêng, không đồng nhất với các loại hình doanh nghiệp theo Luật Doanh nghiệp. Khi xác định quyền, nghĩa vụ và trách nhiệm tài sản phải áp dụng đúng luật điều chỉnh từng mô hình, không suy rộng quy tắc của công ty sang hộ kinh doanh hoặc hợp tác xã"}],"l":"stack"},{"t":"Doanh nghiệp nhà nước và doanh nghiệp có vốn đầu tư nước ngoài","d":"Việc nhận diện doanh nghiệp nhà nước cần căn cứ tiêu chí sở hữu vốn hoặc quyền chi phối theo Luật Doanh nghiệp. Đối với tổ chức kinh tế có vốn đầu tư nước ngoài, cần đồng thời xem xét pháp luật doanh nghiệp và pháp luật đầu tư, nhất là điều kiện tiếp cận thị trường, thủ tục đầu tư và quy định chuyển tiếp"},{"t":"Quyền tự do kinh doanh và nguyên tắc pháp luật thương mại","d":"Quyền tự do kinh doanh được thực hiện trong khuôn khổ Hiến pháp và pháp luật · Ngành, nghề bị cấm và ngành, nghề đầu tư kinh doanh có điều kiện phải được xác định theo văn bản hiện hành. Khi phân tích nguyên tắc pháp luật thương mại, cần xem xét bình đẳng, tự do thỏa thuận trong giới hạn luật, thiện chí và trung thực, bảo vệ lợi ích hợp pháp và các nguyên tắc điều chỉnh hoạt động thương mại quốc tế theo điều ước/hiệp định có liên quan"},{"t":"Phân loại thương nhân và chế độ trách nhiệm tài sản","d":"Phân loại thương nhân cần dựa vào hình thức pháp lý và tư cách hoạt động. Khi so sánh trách nhiệm vô hạn và trách nhiệm hữu hạn, cần xác định tài sản của chủ thể, tư cách thành viên, ngoại lệ do luật quy định và hậu quả khi chấm dứt hoạt động · Không đồng nhất trách nhiệm của doanh nghiệp với trách nhiệm của người đại diện"},{"t":"Thành lập và tổ chức quản lý doanh nghiệp","d":"Phân tích quyền thành lập, chủ thể không được quyền thành lập/quản lý theo luật, điều kiện gia nhập thị trường, hồ sơ đăng ký, tên doanh nghiệp, ngành nghề, người đại diện theo pháp luật, cơ cấu quản lý và quyền, nghĩa vụ của chủ sở hữu/thành viên/cổ đông. Đối với doanh nghiệp có điều kiện đầu tư kinh doanh, phải kiểm tra điều kiện chuyên ngành ngoài thủ tục đăng ký doanh nghiệp"},{"t":"Tổ chức lại, giải thể và phá sản doanh nghiệp","d":"Tổ chức lại gồm các hình thức theo luật doanh nghiệp như chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình. Giải thể chỉ được tiến hành khi đáp ứng điều kiện luật định, trong đó có việc thanh toán các khoản nợ và nghĩa vụ tài sản · Phá sản được xử lý theo pháp luật về phục hồi, phá sản. Phải xác định luật có hiệu lực tại thời điểm phát sinh sự kiện và quy định chuyển tiếp trước khi tư vấn"}],"h3":"Hộ kinh doanh và hợp tác xã · Doanh nghiệp nhà nước và doanh nghiệp có vốn đầu tư nước ngoài · Quyền tự do kinh doanh và nguyên tắc pháp luật thương mại · Phân loại thương nhân và chế độ trách nhiệm tài sản · Thành lập và tổ chức quản lý doanh nghiệp · Tổ chức lại, giải thể và phá sản doanh nghiệp"},{"k":"3. Hợp tác xã · Phá sản doanh nghiệp …","h1":"Chương 1","h2":"Địa vị pháp lý của các chủ thể kinh doanh","c":[{"t":"Hợp tác xã","d":"Hợp tác xã là mô hình kinh tế tập thể có quy chế thành viên, vốn góp, tài sản, cơ cấu quản lý và cơ chế phân phối riêng. Phân tích địa vị pháp lý phải dựa trực tiếp vào Luật Hợp tác xã 2023 và văn bản hiện hành · Không áp dụng máy móc quy tắc về cổ đông công ty cổ phần. Cần xem xét điều kiện gia nhập, quyền và nghĩa vụ thành viên, tổ chức quản lý, tổ chức lại, giải thể và phá sản"},{"t":"Phá sản doanh nghiệp","d":"Phá sản là tình trạng pháp lý được xác định và xử lý theo trình tự luật định khi doanh nghiệp, hợp tác xã mất khả năng thanh toán và bị Tòa án nhân dân ra quyết định tuyên bố phá sản. Cần phân biệt mất khả năng thanh toán với việc chỉ có một khoản nợ đến hạn chưa trả · Đồng thời phân biệt phá sản với giải thể về căn cứ, thủ tục và hậu quả pháp lý"},{"t":"Trọng tâm ôn tập","d":"Xác định đúng tư cách chủ thể · So sánh chế độ trách nhiệm tài sản · Phân biệt doanh nghiệp với hộ kinh doanh, hợp tác xã · Phân biệt phá sản với giải thể. Các điều kiện, ngưỡng và thủ tục cụ thể phải đối chiếu văn bản hiện hành"}],"h3":"Hợp tác xã · Phá sản doanh nghiệp · Trọng tâm ôn tập"}]},{"n":2,"t":"Pháp luật về hợp đồng thương mại và các hoạt động thương mại","maps":[{"k":"1. Hợp đồng trong hoạt động thương mại …","h1":"Chương 2","h2":"Pháp luật về hợp đồng thương mại và các hoạt động thương mại","c":[{"t":"Hợp đồng trong hoạt động thương mại","c":[{"t":"Khái niệm, luật áp dụng","c":[{"t":"Hợp đồng thương mại là","d":"Thỏa thuận làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ trong hoạt động thương mại. Khi xác định pháp luật áp dụng cần xem xét chủ thể, mục đích giao dịch, loại hoạt động, quy định chuyên ngành và mối quan hệ giữa Luật Thương mại với Bộ luật Dân sự. Không nên chỉ căn cứ tên gọi của hợp đồng để kết luận bản chất pháp lý"}],"l":"stack"},{"t":"Giao kết, hiệu lực, thực hiện","c":[{"t":"Các vấn đề cần phân tích gồm","d":"Chủ thể và thẩm quyền đại diện; đề nghị và chấp nhận giao kết; hình thức; nội dung và điều kiện có hiệu lực; thực hiện nghĩa vụ; sửa đổi, chấm dứt; vi phạm và trách nhiệm pháp lý. Hình thức hợp đồng phải tuân theo quy định chung và yêu cầu riêng của từng loại giao dịch"}],"l":"stack"}],"l":"row"},{"t":"Hợp đồng thương mại quốc tế và nguồn luật","c":[{"t":"Chọn luật, CISG 1980","d":"Với hợp đồng có yếu tố nước ngoài, cần xác định phạm vi lựa chọn luật, điều ước quốc tế có thể áp dụng, quy phạm xung đột và tập quán được viện dẫn. CISG 1980 có thể điều chỉnh hợp đồng mua bán hàng hóa quốc tế khi thỏa điều kiện áp dụng · Không mặc nhiên áp dụng cho mọi hợp đồng thương mại. PICC 2016 là bộ nguyên tắc hợp đồng thương mại quốc tế, cần xác định cơ sở vận dụng trong từng giao dịch"},{"t":"Incoterms 2020","d":"Incoterms 2020 của ICC phân bổ một số nghĩa vụ giao hàng, chi phí và rủi ro theo điều kiện được các bên viện dẫn · Không thay thế toàn bộ hợp đồng và không tự quyết định mọi vấn đề về chuyển quyền sở hữu hoặc hiệu lực hợp đồng. UCP 600, URC 522 và ISP98 là các quy tắc thực hành ngân hàng quốc tế có thể liên quan đến tín dụng chứng từ, nhờ thu và cam kết dự phòng khi được dẫn chiếu/áp dụng phù hợp"}],"l":"stack"},{"t":"Mua bán hàng hóa","d":"Hợp đồng mua bán hàng hóa làm phát sinh nghĩa vụ giao hàng, chuyển quyền sở hữu theo thỏa thuận và quy định pháp luật, đồng thời phát sinh nghĩa vụ thanh toán và tiếp nhận hàng. Khi giải quyết tranh chấp cần kiểm tra mô tả hàng hóa, số lượng, chất lượng, giá, thời hạn và địa điểm giao nhận, chứng từ, kiểm tra hàng hóa, chuyển rủi ro, bảo hành và khiếu nại"},{"t":"Cung ứng dịch vụ","d":"Trong hợp đồng cung ứng dịch vụ, bên cung ứng thực hiện dịch vụ và nhận thanh toán · Bên sử dụng dịch vụ có nghĩa vụ phối hợp, cung cấp thông tin cần thiết và thanh toán theo thỏa thuận, pháp luật. Nội dung hợp đồng cần xác định rõ phạm vi công việc, tiêu chuẩn chất lượng, sản phẩm bàn giao, thời hạn, nghiệm thu, bảo mật và trách nhiệm khi không đạt yêu cầu"},{"t":"Trung gian thương mại","d":"Các hoạt động trung gian thương mại theo Luật Thương mại gồm đại diện cho thương nhân, môi giới thương mại, ủy thác mua bán hàng hóa và đại lý thương mại. Phải phân biệt căn cứ đại diện, việc nhân danh ai khi giao dịch, quyền hưởng thù lao và trách nhiệm với bên thứ ba · Tên gọi gần nhau không làm các chế định này trở thành một"},{"t":"Xúc tiến thương mại","d":"Ngoài Luật Thương mại cần đối chiếu pháp luật quảng cáo, bảo vệ quyền lợi người tiêu dùng và các quy định chuyên ngành có liên quan","c":[{"t":"Nhóm hoạt động xúc tiến thương mại gồm","d":"Khuyến mại, quảng cáo thương mại, trưng bày, giới thiệu hàng hóa, dịch vụ và hội chợ, triển lãm thương mại. Mỗi hình thức có mục đích và điều kiện riêng"}],"l":"stack"}],"h3":"Hợp đồng trong hoạt động thương mại · Hợp đồng thương mại quốc tế và nguồn luật · Mua bán hàng hóa · Cung ứng dịch vụ · Trung gian thương mại · Xúc tiến thương mại"},{"k":"2. Logistics và các hoạt động thương mại khác …","h1":"Chương 2","h2":"Pháp luật về hợp đồng thương mại và các hoạt động thương mại","c":[{"t":"Logistics và các hoạt động thương mại khác","c":[{"t":"Dịch vụ logistics","d":"Dịch vụ logistics gắn với một hoặc nhiều công việc như nhận hàng, vận chuyển, lưu kho, lưu bãi, làm thủ tục và các dịch vụ hỗ trợ hàng hóa theo thỏa thuận và pháp luật. Khi phân tích trách nhiệm cần làm rõ phạm vi dịch vụ, tư cách các bên, giới hạn trách nhiệm nếu được pháp luật cho phép, sự kiện miễn trách nhiệm và nghĩa vụ thông báo"},{"t":"Gia công, quá cảnh, tạm nhập tái xuất…","d":"Đối với đấu giá hàng hóa, gia công trong thương mại, quá cảnh, tạm nhập tái xuất, chuyển khẩu và các hoạt động khác thuộc đề cương, cần xác định luật chung và luật chuyên ngành áp dụng cho từng loại hình. Không dùng một quy tắc duy nhất cho mọi hoạt động thương mại"}],"l":"stack"},{"t":"Đấu giá và đấu thầu hàng hóa, dịch vụ","d":"Không áp dụng một trình tự chung cho cả hai","c":[{"t":"Đấu giá và đấu thầu là","d":"Các cơ chế khác nhau về mục tiêu, vai trò các bên, trình tự và tiêu chí lựa chọn. Khi xử lý tình huống phải xác định hoạt động thuộc phạm vi Luật Thương mại hay pháp luật đấu thầu chuyên ngành"}],"l":"stack"},{"t":"Nhượng quyền thương mại","d":"Phân tích quyền sử dụng mô hình kinh doanh, nhãn hiệu/hệ thống nhận diện, phí nhượng quyền, hỗ trợ kỹ thuật, kiểm soát chất lượng và nghĩa vụ công bố thông tin theo luật. Điều khoản bảo mật, không cạnh tranh và hạn chế cạnh tranh cần được xem xét cùng pháp luật sở hữu trí tuệ, cạnh tranh và quy định bắt buộc có liên quan"},{"t":"Trọng tâm ôn tập","c":[{"t":"Phương pháp xử lý bài tập","d":"(1) định danh giao dịch · (2) xác định chủ thể và thẩm quyền · (3) tìm luật điều chỉnh · (4) xác định nghĩa vụ chính · (5) đối chiếu hành vi thực tế với nghĩa vụ · (6) xác định hậu quả và cơ chế giải quyết tranh chấp"}],"l":"stack"}],"h3":"Logistics và các hoạt động thương mại khác · Đấu giá và đấu thầu hàng hóa, dịch vụ · Nhượng quyền thương mại · Trọng tâm ôn tập"}]},{"n":3,"t":"Chế tài thương mại","img":"assets/luat-thuong-mai/ch3.svg","maps":[{"k":"Sơ đồ Chương 3","h1":"Chương 3","h2":"Chế tài thương mại","c":[{"t":"Khái niệm, đặc điểm chế tài thương mại","d":"Phân biệt chế tài theo Luật Thương mại với trách nhiệm dân sự nói chung","c":[{"t":"Chế tài thương mại là","d":"Hậu quả pháp lý áp dụng với bên vi phạm trong quan hệ thương mại khi có đủ căn cứ luật định hoặc thỏa thuận hợp pháp. Cần xác định quan hệ hợp đồng, luật điều chỉnh, nghĩa vụ cụ thể, hành vi vi phạm, chứng cứ và quyền yêu cầu"}],"l":"stack"},{"t":"Căn cứ áp dụng chế tài","c":[{"t":"Xác định hành vi vi phạm","d":"Đối chiếu điều khoản hợp đồng với nghĩa vụ thực tế, thời hạn, chất lượng, thông báo/khiếu nại và tài liệu chứng minh. Không kết luận chỉ từ việc một bên không hài lòng · Phải xác định vi phạm và căn cứ pháp lý tương ứng"},{"t":"Điều kiện áp dụng từng chế tài","d":"Điều kiện áp dụng phụ thuộc từng chế tài. Xem xét quy định miễn trách nhiệm, điều khoản phạt, giới hạn hoặc loại trừ trách nhiệm trong phạm vi luật cho phép · Thỏa thuận không đương nhiên có hiệu lực nếu trái quy định bắt buộc"}],"l":"stack"},{"t":"Các hình thức chế tài thương mại","c":[{"t":"Buộc thực hiện đúng hợp đồng","d":"Yêu cầu bên vi phạm tiếp tục thực hiện đúng nghĩa vụ hoặc áp dụng biện pháp khắc phục theo luật · Xác định nghĩa vụ còn có thể thực hiện, cách sửa chữa/thay thế và chi phí phát sinh"},{"t":"Phạt vi phạm","d":"Cần có thỏa thuận phạt hợp pháp. Theo Điều 301 Luật Thương mại 2005, mức phạt thông thường không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm, trừ trường hợp luật quy định khác"},{"t":"Bồi thường thiệt hại","d":"Xem xét hành vi vi phạm, thiệt hại thực tế, quan hệ nhân quả trực tiếp và chứng cứ, bên yêu cầu phải chứng minh tổn thất, đồng thời thực hiện nghĩa vụ hạn chế tổn thất. Phạt và bồi thường có thể cùng được yêu cầu nếu đáp ứng điều kiện luật định và thỏa thuận"},{"t":"Tạm ngừng, đình chỉ, hủy bỏ","d":"Tạm ngừng là tạm thời không thực hiện nghĩa vụ · Đình chỉ chấm dứt thực hiện hợp đồng theo điều kiện luật định · Hủy bỏ làm phát sinh hậu quả pháp lý riêng đối với hiệu lực và nghĩa vụ hoàn trả. Phải phân biệt căn cứ, thời điểm có hiệu lực, nghĩa vụ thông báo và hậu quả"}],"l":"stack"},{"t":"Miễn trách nhiệm trong thương mại","d":"Kiểm tra các trường hợp miễn trách nhiệm theo Luật Thương mại, gồm trường hợp đã thỏa thuận hợp lệ, bất khả kháng, vi phạm hoàn toàn do lỗi của bên kia và trường hợp thực hiện quyết định của cơ quan nhà nước có thẩm quyền trong điều kiện luật định. Bên viện dẫn phải chứng minh căn cứ và tuân thủ nghĩa vụ thông báo. Khó khăn kinh tế hoặc chi phí tăng không tự động là bất khả kháng"},{"t":"Đối chiếu pháp luật hợp đồng quốc tế","d":"CISG áp dụng cho hợp đồng mua bán hàng hóa quốc tế thuộc phạm vi Công ước · PICC 2016 được vận dụng theo cơ chế pháp lý thích hợp, không tự động thay luật quốc gia. Trọng tâm so sánh: vi phạm cơ bản, dự liệu thiệt hại, hạn chế tổn thất và nguyên tắc ưu tiên bảo tồn hợp đồng. Force majeure và hardship là hai vấn đề khác nhau, cần xét theo văn bản được áp dụng"},{"t":"Trọng tâm ôn tập","c":[{"t":"Trình tự phân tích","d":"Luật áp dụng → nghĩa vụ → vi phạm → căn cứ chế tài → miễn trách nhiệm → thiệt hại/chứng cứ → thông báo và thời hạn"}],"l":"stack"}]}]},{"n":4,"t":"Giải quyết tranh chấp thương mại","img":"assets/luat-thuong-mai/ch4.svg","maps":[{"k":"Sơ đồ Chương 4","h1":"Chương 4","h2":"Giải quyết tranh chấp thương mại","c":[{"t":"Tranh chấp thương mại","c":[{"t":"Khái niệm, định danh tranh chấp","c":[{"t":"Tranh chấp thương mại là","d":"Bất đồng về quyền, nghĩa vụ hoặc lợi ích liên quan đến hoạt động thương mại. Định danh dựa trên quan hệ thực tế, chủ thể, yêu cầu và quy phạm xác định thẩm quyền, không chỉ dựa vào tên gọi của vụ việc"}],"l":"stack"},{"t":"Nguyên nhân, hồ sơ","d":"Nguyên nhân có thể đến từ quản trị, thông tin, thực hiện nghĩa vụ hoặc yếu tố thị trường, chuỗi cung ứng, chính sách. Hồ sơ cần xác định chủ thể, quan hệ pháp luật, nghĩa vụ tranh chấp, yêu cầu, chứng cứ, luật áp dụng, phương thức giải quyết và khả năng thi hành"}],"l":"row"},{"t":"Giải quyết tranh chấp trong nước","c":[{"t":"Thương lượng, hòa giải","d":"Các bên tự trao đổi, linh hoạt nhưng phụ thuộc thiện chí. Hòa giải: người thứ ba trung lập hỗ trợ các bên tự nguyện tìm giải pháp, phân biệt hòa giải thương mại theo Nghị định 22/2017/NĐ-CP với hòa giải trong tố tụng. Trọng tài: cần thỏa thuận trọng tài hợp lệ và tranh chấp thuộc thẩm quyền, phán quyết có tính chung thẩm theo luật. Tòa án: giải quyết theo thẩm quyền và thủ tục tố tụng, kết quả có thể được cưỡng chế thi hành"},{"t":"Nguyên tắc, trình tự hòa giải","d":"Nguyên tắc gồm tự nguyện, bình đẳng, bảo mật theo quy định, độc lập và vô tư của hòa giải viên, thỏa thuận không trái luật và đạo đức xã hội. Trình tự gồm yêu cầu, lựa chọn hòa giải viên, chuẩn bị, phiên hòa giải và ghi nhận kết quả. Phân biệt thỏa thuận hòa giải thành với quyết định được công nhận hoặc thi hành theo cơ chế pháp luật tương ứng. Công ước Singapore 2019 chỉ áp dụng trong phạm vi điều kiện của Công ước · Không suy đoán tình trạng thành viên của Việt Nam"},{"t":"Trọng tài thương mại","d":"Phân biệt trọng tài quy chế và trọng tài vụ việc · Kiểm tra hình thức, hiệu lực và phạm vi thỏa thuận trọng tài, thẩm quyền, việc thành lập hội đồng, thủ tục, phán quyết và chi phí. Nguyên tắc kompetenz-kompetenz liên quan quyền hội đồng trọng tài xem xét thẩm quyền của mình, không loại trừ vai trò Tòa án trong trường hợp luật quy định. Thủ tục hủy phán quyết không phải xét xử lại nội dung như phúc thẩm"},{"t":"Tòa án","d":"Tòa án giải quyết tranh chấp thuộc thẩm function tlParse(id){ if(!id||id.indexOf("tl-")!==0)return null;
  for(const k in TL){ if(id==="tl-"+k)return {k}; if(id.indexOf("tl-"+k+"-")===0){const p=id.slice(k.length+4).split("-").map(Number);return {k,ch:p[0],mi:(p[1]||1)-1}} }
  return null}

function tlHomeHTML(k){const T=TL[k];
  const cards=T.chapters.map(c=>{const ph=c.img?`<span class="ph"><img src="${c.img}" alt="" loading="lazy"></span>`:`<span class="ph blank" aria-hidden="true">${c.n}</span>`;
    return c.maps.length?`<button type="button" class="ch-card" data-go="tl-${k}-${c.n}">${ph}<span class="no">Chương ${c.n}</span><span class="nm">${esc(c.t)}</span><span class="cnt">${c.maps.length} sơ đồ</span></button>`
      :`<div class="ch-card soon">${ph}<span class="no">Chương ${c.n}</span><span class="nm">${esc(c.t)}</span><span class="cnt">Đang biên soạn</span></div>`}).join("");
  const laws=(T.laws||[]).map(g=>`<details class="law-g"${g.open?" open":""}><summary>${esc(g.name)}<span class="n">${g.rows.length}</span></summary><ol>${g.rows.map(r=>`<li><b>${esc(r[0])}</b><span class="meta">${esc(r[2])} · ${esc(r[1])}</span></li>`).join("")}</ol></details>`).join("");
  const refs=T.refs.map(g=>`<div class="ref-g"><h4>${esc(g.g)}</h4><ul>${g.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
  const cases=(T.cases||[]).length?`<details class="law-g"><summary>Án lệ liên quan<span class="n">${T.cases.length}</span></summary><ol>${T.cases.map(r=>`<li><b>Án lệ ${esc(r[0])}</b> ${esc(r[1])}<span class="meta">${esc(r[2])}</span></li>`).join("")}</ol></details>`:"";
  const rv=course(T.review);
  return tlNav(k,false)+`<main class="wrap tl-main">
  <div class="tl-head"><div class="kicker">Mind-map học phần</div><h2>${esc(T.name)}</h2>${rv&&rv.src?`<button type="button" class="btn primary" data-go="${rv.id}">Vào ôn tập học phần</button>`:""}</div>
  <section class="frame"><div class="ftitle">Tóm tắt nội dung chính của học phần</div><div class="ch-grid">${cards}</div></section>
  <section class="frame"><div class="ftitle">Danh mục văn bản quy phạm pháp luật</div><p class="msg">Bấm vào từng nhóm để xem danh sách. Khi tra cứu, dùng bản hợp nhất đã cập nhật các lần sửa đổi, bổ sung.</p>${laws}</section>
  <section class="frame"><div class="ftitle">Tài liệu tham khảo khác</div><div class="refs">${refs}</div>${cases}</section>
  </main>`}

y; đang bị tạm giữ, tạm giam, thi hành án phạt tù, bị áp dụng biện pháp xử lý hành chính; có lý do chính đáng khác theo quy định của Chính phủ"}],"l":"stack"}],"l":"row"},{"t":"Hình thức văn bản công chứng","c":[{"t":"Chữ viết, thời điểm, lời chứng","d":"Chữ viết rõ ràng, dễ đọc, không viết tắt hoặc ký hiệu · Tiếng nói, chữ viết là tiếng Việt · Thời điểm công chứng ghi ngày, tháng, năm · Có thể ghi giờ, phút nếu người yêu cầu đề nghị hoặc công chứng viên thấy cần · Lời chứng của công chứng viên theo mẫu, xác nhận các yếu tố luật định"},{"t":"Người làm chứng, người phiên dịch","d":"Bắt buộc có người làm chứng khi người yêu cầu không đọc được, không nghe được, không ký, không điểm chỉ được, hoặc trường hợp luật định · Người làm chứng phải từ đủ 18 tuổi, có năng lực hành vi dân sự đầy đủ, không có quyền, lợi ích hoặc nghĩa vụ liên quan đến giao dịch · Người yêu cầu không thông thạo tiếng Việt thì phải có người phiên dịch"},{"t":"Ký, điểm chỉ, chụp ảnh","d":"Người yêu cầu, người làm chứng, người phiên dịch ký trước mặt công chứng viên · Điểm chỉ khi không ký được hoặc theo yêu cầu · Việc ký văn bản công chứng được chụp ảnh lưu hồ sơ theo hướng dẫn của Nghị định"},{"t":"Đánh số trang, đóng dấu giáp lai","d":"Văn bản công chứng có từ 02 trang trở lên thì từng trang phải được đánh số thứ tự · Văn bản có từ 02 tờ trở lên phải đóng dấu giáp lai giữa các tờ. Lưu ý: “trang” và “tờ” là hai khái niệm khác nhau"}],"l":"stack"}],"h3":"Hai thủ tục công chứng · Thẩm quyền công chứng giao dịch về bất động sản · Thời hạn công chứng · Địa điểm công chứng · Hình thức văn bản công chứng"},{"k":"2. Sửa lỗi kỹ thuật; sửa đổi, bổ sung, hủy bỏ …","h1":"Chương 4","h2":"Quy định chung về thực hiện công chứng","c":[{"t":"Sửa lỗi kỹ thuật; sửa đổi, bổ sung, hủy bỏ giao dịch","c":[{"t":"Sửa lỗi kỹ thuật","d":"Sửa lỗi kỹ thuật (lỗi chính tả, đánh máy, ghi số liệu… không làm thay đổi quyền, nghĩa vụ): công chứng viên đối chiếu hồ sơ lưu trữ, có sự đồng ý của các bên"},{"t":"Sửa đổi, bổ sung, hủy bỏ function mmBox(n,depth){const it=n.d?String(n.d).split(/\s*·\s*|\s*;\s*/).filter(Boolean):[];return `<div class="mm-box d${Math.min(depth,4)}${it.length?" has-d":""}">${esc(n.t)}${it.length>1?`<ol class="mm-d">${it.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:it.length?`<span class="mm-d">${esc(it[0])}</span>`:""}</div>`}
function mmDetails(){return ""}
function mmDetailsOld(n,depth){if(!n.d)return "";let items=n.d.split(/\s*·\s*|\s*;\s*/).map(x=>x.trim()).filter(Boolean);const kids=n.c||[];if(kids.length){const repeated=new Set(kids.flatMap(k=>[String(k.t||"").trim(),String(k.d||"").trim()]).filter(Boolean).map(x=>x.toLocaleLowerCase("vi")));items=items.filter(x=>!repeated.has(x.toLocaleLowerCase("vi")));}if(!items.length)return "";if(items.length===1)return `<div class="mm-detail-single">${esc(items[0])}</div>`;return `<ul class="mm-detail-list">${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
function mmNode(n,depth){const kids=n.c||[];const l=n.l||(depth<=1&&kids.some(k=>k.c&&k.c.length)?"row":"stack");
  return `<div class="mm-node">${mmBox(n,depth)}${mmDetails(n,depth)}${kids.length?mmKids(kids,l,depth):""}</div>`}
function mmKids(kids,l,depth){
  if(l.indexOf("cols")===0){const N=+l.slice(4)||2,cols=[...Array(N)].map(()=>[]);kids.forEach((k,i)=>cols[i%N].push(k));
    return `<div class="mm-kids row">${cols.filter(c=>c.length).map(col=>`<div class="mm-kid"><div class="mm-col">${col.map((k,i)=>i?`<div class="mm-sk">${mmNode(k,depth+1)}</div>`:mmNode(k,depth+1)).join("")}</div></div>`).join("")}</div>`}
  if(l==="row")return `<div class="mm-kids row">${kids.map(k=>`<div class="mm-kid">${mmNode(k,depth+1)}</div>`).join("")}</div>`;
  return `<div class="mm-kids stack">${kids.map(k=>`<div class="mm-sk">${mmNode(k,depth+1)}</div>`).join("")}</div>`}
function mmHTML(m){const top=m.r?`<div class="mm-node">${mmBox({t:m.r},0)}${mmKids(m.c,"row",0)}</div>`:`<div class="mm-node mm-noroot">${mmKids(m.c,"row",0)}</div>`;
  return `<div class="mm-title"><div class="h1">${esc(m.h1)}</div>${m.h2?`<div class="h2">${esc(m.h2)}</div>`:""}${m.h3?`<div class="h3">${esc(m.h3)}</div>`:""}</div><div class="mm-tree">${top}</div>`}

function tlChapterHTML(k,n,mi){const T=TL[k],c=T.chapters.find(x=>x.n===n);if(!c||!c.maps.length)return null;
  mi=Math.max(0,Math.min(mi||0,c.maps.length-1));const m=c.maps[mi];
  const tabs=c.maps.length>1?`<div class="mm-tabs" role="tablist">${c.maps.map((x,i)=>`<button type="button" role="tab" aria-selected="${i===mi}" data-go="tl-${k}-${n}-${i+1}">${esc(x.k)}</button>`).join("")}</div>`:"";
  const prev=T.chapters.filter(x=>x.n<n&&x.maps.length).pop(),next=T.chapters.find(x=>x.n>n&&x.maps.length);
  return tlNav(k,true)+`<main class="wrap tl-main">
  <div class="ch-head"><div class="kicker">Tóm tắt nội dung · ${esc(T.name)}</div><h2>Chương ${n}. ${esc(c.t)}</h2></div>
  ${tabs}
  <section class="sheet">
    <div class="sheet-deco" aria-hidden="true"></div><img class="sheet-logo" src="assets/logo.png" alt="">
    
    <div class="mm-tools"><button type="button" data-z="-1" aria-label="Thu nhỏ">−</button><button type="button" data-z="0">Vừa khung</button><button type="button" data-z="1" aria-label="Phóng to">+</button></div>
    <div class="mm-vp"><div class="mm-sizer"><div class="mm-canvas">${mmHTML(m)}</div></div></div>
    <p class="mm-note">Sơ đồ bám đúng mục, tiểu mục và thứ tự của <b>Tóm tắt lý thuyết</b>. Cơ sở pháp lý của từng ý xem tại Tóm tắt lý thuyết của học phần.</p>
  </section>
  <div class="ch-pager">${prev?`<button type="button" class="btn" data-go="tl-${k}-${prev.n}">← Chương ${prev.n}</button>`:"<span></span>"}${next?`<button type="button" class="btn" data-go="tl-${k}-${next.n}">Chương ${next.n} →</button>`:"<span></span>"}</div>
  </main>`}

let mmZoom=null;
function mmFit(){const vp=document.querySelector(".mm-vp");if(!vp)return;const sz=vp.querySelector(".mm-sizer"),cv=vp.querySelector(".mm-canvas");
  cv.style.transform="none";const w=cv.scrollWidth,h=cv.scrollHeight;
  let s=mmZoom!=null?mmZoom:Math.min(1,(vp.clientWidth-4)/w);
  if(mmZoom==null)s=Math.max(s,vp.clientWidth<700?.4:.45);
  cv.style.transform=`scale(${s})`;sz.style.width=Math.ceil(w*s)+"px";sz.style.height=Math.ceil(h*s)+"px";vp.dataset.s=s;vp.scrollLeft=Math.max(0,(w*s-vp.clientWidth)/2)}
function bindMM(){mmZoom=null;
  const refresh=()=>requestAnimationFrame(mmFit);
  document.querySelectorAll(".mm-tools [data-z]").forEach(b=>b.onclick=()=>{const z=+b.dataset.z,vp=document.querySelector(".mm-vp"),s=+vp.dataset.s||1;
    mmZoom=z===0?null:Math.max(.3,Math.min(2,s*(z>0?1.25:.8)));mmFit()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(mmFit);mmFit()}
window.addEventListener("resize",()=>{if(document.querySelector(".mm-vp"))mmFit()});

function tlRoute(id,m){const p=tlParse(id);if(!p)return false;
  if(p.ch){const h=tlChapterHTML(p.k,p.ch,p.mi);if(!h)return false;m.innerHTML=h;setTimeout(bindMM,0)}
  else m.innerHTML=tlHomeHTML(p.k);
  return true}

window.addEventListener("message",e=>{if(e.data&&e.data.pn==="home"){const target=String(e.data.course||"");route("home");if(target){pending=target;showGate("Nhập mã có quyền truy cập học phần này để tiếp tục.")}}});
(async function boot(){
  session=loadSession();
  if(session&&todayISO()>session.han){expiredMsg="Mã của lớp đã hết hạn ngày "+fmtDate(session.han)+". Hỏi giảng viên mã mới.";session=null;store.del(KEY)}
  else if(!session&&store.get(KEY))store.del(KEY);
  $("#app").hidden=false;renderWho();
  const h0=(location.hash||"").slice(1);route(course(h0)||tlParse(h0)||h0==="gop-y"?h0:"home");
  try{const u=onClaude&&await window.claude.use("user");isOwner=u?!!(await u.isOwner()):false;if(u){try{UID=await u.id()}catch(e){}}}catch(e){isOwner=false}
  try{DB=onClaude?await window.claude.use("db"):null}catch(e){DB=null}
  dbReadyRes();
  if(session){(DB?dbCall({action:"check",code:session.code}):staticCheck(session.code,"")).then(r=>{if(r&&!r.ok&&(r.why==="notfound"||r.why==="expired"||r.why==="full")){
      store.del(KEY);session=null;expiredMsg=r.why==="expired"?"Mã của lớp đã hết hạn. Hỏi giảng viên mã mới.":"Mã của bạn không còn dùng được. Hỏi giảng viên mã mới.";renderWho();
      if(needsCode(cur)){pending=cur;route("home");showGate(expiredMsg)}}}).catch(()=>{})}
  await Promise.all([loadFeedback(),loadVisits(),loadStats()]);
  try{cmt=onClaude?await window.claude.use("comments"):null}catch(e){cmt=null}
  if(isOwner)renderWho();
  if(cur==="home"||cur==="gop-y")route(cur);
  if(isOwner&&(location.hash||"").slice(1)==="quan-ly-ma")route("quan-ly-ma");
})();

<script id="pn-history-nav-script">
(()=>{const back=document.getElementById('pn-history-back'),forward=document.getElementById('pn-history-forward');if(!back||!forward)return;let canForward=false;const refresh=()=>{back.disabled=history.length<=1;forward.disabled=!canForward};back.addEventListener('click',()=>{if(history.length>1)history.back()});forward.addEventListener('click',()=>{if(canForward)history.forward()});addEventListener('popstate',()=>{canForward=true;refresh()});addEventListener('hashchange',refresh);const push=history.pushState.bind(history),replace=history.replaceState.bind(history);history.pushState=function(){const r=push(...arguments);canForward=false;refresh();return r};history.replaceState=function(){const r=replace(...arguments);refresh();return r};document.addEventListener('click',e=>{if(e.target.closest('a[href]')){canForward=false;refresh()}});refresh()})();
</script>
