<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Phúc Nguyên Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap">
<style>
/* Bố cục theo bản phác của giảng viên: băng tiêu đề xanh thép có logo; hàng trên gồm khung Học phần (trái) và Tài liệu học tập (phải); hàng dưới gồm Hướng dẫn sử dụng và Dữ liệu truy cập */
:root{
  --bg:#f2f4f9; --paper:#ffffff; --ink:#18263a; --muted:#5a6678; --line:#dfe3ec;
  --band:#1d5677; --band-2:#16455f; --on-band:#ffffff; --on-band-2:#cfe0ea;
  --head:#1f4f7a; --frame:#b9b3da; --tint:#eef2f9;
  --red:#d33a3a; --red-soft:#fdecec; --ok:#1f7a4d; --bad:#b3261e;
  --f-display:"Merriweather",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --paper:#141d2c; --ink:#e6ebf3; --muted:#9ca8bb; --line:#27334a;
  --band:#143e57; --band-2:#0f3146; --on-band:#ffffff; --on-band-2:#b8d0de;
  --head:#9cc4e6; --frame:#4a4673; --tint:#1a2638;
  --red:#ef6b6b; --red-soft:#3a1d1f; --ok:#6fd3a0; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --paper:#141d2c; --ink:#e6ebf3; --muted:#9ca8bb; --line:#27334a;
  --band:#143e57; --band-2:#0f3146; --on-band:#ffffff; --on-band-2:#b8d0de;
  --head:#9cc4e6; --frame:#4a4673; --tint:#1a2638;
  --red:#ef6b6b; --red-soft:#3a1d1f; --ok:#6fd3a0; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--head);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.logo img{width:90%;height:90%;object-fit:contain;display:block}

/* Băng tiêu đề */
.band{background:var(--band);color:var(--on-band)}
.band .wrap{display:flex;align-items:center;gap:clamp(14px,3vw,28px);padding-block:18px 16px;position:relative}
.band .logo{width:clamp(70px,11vw,112px);aspect-ratio:1}
.band .titles{flex:1;min-width:0;text-align:center}
.band .kicker{font:900 clamp(12px,1.8vw,16px) var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--on-band-2)}
.band h1{font-size:clamp(28px,6vw,58px);font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.band .copy{font-size:12px;color:var(--on-band-2);margin-top:4px}
.band .who{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;font-size:12.5px;color:var(--on-band-2);text-align:right;line-height:1.35}
.band .who button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;margin-top:4px}
.subbar{background:var(--band-2);color:var(--on-band)}
.subbar .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.subbar button{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
.subbar h2{font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.subbar .sp{flex:1}
.subbar a{font-size:13.5px;font-weight:600;color:#fff}

/* Khung */
main.wrap{padding-block:22px 40px;display:grid;gap:20px}
.grid-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:20px;align-items:start}
.grid-bot{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,5fr);gap:20px;align-items:stretch}
.frame{background:var(--paper);border:2px dashed var(--frame);border-radius:24px;padding:20px clamp(16px,2.6vw,28px) 24px;min-width:0}
.ftitle{font:900 clamp(20px,2.6vw,28px) var(--f-display);text-transform:uppercase;color:var(--head);letter-spacing:.01em;margin-bottom:14px;display:inline-block;border-bottom:3px solid currentColor;line-height:1.25;padding-bottom:2px}
.center{text-align:center}

/* Học phần */
.courses{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.courses button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;text-align:left}
.courses button:hover{background:var(--tint)}
.courses .nm{flex:1;min-width:0;font:700 15.5px/1.3 var(--f-display);text-transform:uppercase;color:var(--head)}
.courses .soon .nm{color:var(--muted)}
.courses .st{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.courses .open .st{background:var(--head);color:var(--paper)}
.courses .soon .st{color:var(--muted);border:1px solid var(--line)}
.book{flex:none;width:30px;height:24px}

/* Tài liệu học tập */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 20px}
.doc{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0}
.doc .ph{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;background:var(--tint);position:relative}
.doc img{width:100%;height:100%;object-fit:cover;display:block}
.doc.soon img{filter:grayscale(.85) opacity(.6)}
.doc .ph .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;background:rgba(10,20,35,.72);color:#fff;border-radius:999px;padding:2px 9px}
.doc .ttl{font:900 15.5px/1.3 var(--f-display);text-transform:uppercase;color:var(--head);background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.doc .ttl:hover{text-decoration:underline}
.doc.soon .ttl{color:var(--muted);cursor:default;text-decoration:none}
.doc .sub{font-size:12.5px;color:var(--muted);margin-top:-4px}

/* Hướng dẫn */
.guide{margin:0;padding-left:26px;display:grid;gap:6px;font:700 clamp(15px,1.8vw,17.5px)/1.45 var(--f-display);color:var(--head)}
.guide li::marker{font-weight:900}
.thanks{margin:10px 0 0 26px;font:700 16px var(--f-display);color:var(--head)}

/* Dữ liệu truy cập */
.stats{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.stats li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--head)}
.stats .lbl{font:700 16px var(--f-display);color:var(--head);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.stats button.lbl:hover{text-decoration:underline}
.stats .val{font:900 17px var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.stats .val.na{font:500 12.5px var(--f-body);color:var(--muted)}
.fb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.bubble{width:58px;height:50px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font:900 34px/1 Georgia,serif;position:relative;padding-top:12px}
.bubble::after{content:"";position:absolute;left:12px;bottom:-10px;border:10px solid transparent;border-top-color:var(--red);border-bottom:0}
.sendfb{font-style:italic;color:var(--muted);font-size:14.5px;text-decoration:none;border-bottom:1px solid currentColor;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;padding:0}
.sendfb:hover{color:var(--head)}

/* Danh sách góp ý */
.fb-list{display:grid;gap:10px;margin-top:12px}
.fb-item{background:var(--tint);border-radius:12px;padding:12px 14px}
.fb-item .m{font-size:12.5px;color:var(--muted)}
.fb-item p{margin:4px 0 0;max-width:70ch}
.info{background:var(--tint);border-radius:12px;padding:12px 16px;font-size:14.5px;color:var(--muted)}

/* Trang học phần */
.viewer{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px))}
.in-course .band{display:none}
.viewer iframe{flex:1;width:100%;border:0;background:var(--bg)}
.soon-page{padding-block:30px 50px}
.soon-page .frame{max-width:720px;margin:0 auto;display:grid;gap:12px}
.soon-page p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--band);border-color:var(--band);color:var(--on-band)}

/* Cổng nhập mã */
.gate{position:fixed;inset:0;z-index:50;overflow-y:auto;background:rgba(8,18,32,.62);display:grid;place-items:center;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{position:relative;width:min(480px,100%);background:var(--paper);border:2px dashed var(--frame);border-radius:24px;overflow:hidden}
.gate-top{background:var(--band);color:var(--on-band);padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gate-top .logo{width:96px;height:96px}
.gate-top .kicker{font:900 13px var(--f-display);letter-spacing:.08em;color:var(--on-band-2)}
.gate-top h1{font-size:28px;text-transform:uppercase;font-weight:900}
.gate-form{padding:22px 26px 24px;display:grid;gap:10px}
.gate-form p{margin:0;color:var(--muted);font-size:14.5px}
label.lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
input[type=text],input[type=month],input[type=date],input[type=number],input[type=password]{width:100%;font:600 17px var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
#code-in,#k-in{letter-spacing:.06em;text-transform:uppercase}
.gate-x{position:absolute;right:10px;top:8px;z-index:2;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font:400 24px/1 var(--f-body);cursor:pointer}
.gate-x:hover{background:rgba(255,255,255,.3)}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.demo{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:13.5px}
.demo code{font:700 14px var(--f-body);letter-spacing:.06em;color:var(--head)}

/* Quản lý mã */
.admin{display:grid;gap:16px}
.admin .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.admin .row>div{display:grid;gap:6px;flex:1;min-width:150px}
.big{font:900 22px var(--f-display);letter-spacing:.04em;color:var(--head);word-break:break-all}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--tint);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.msg{font-size:13.5px;color:var(--muted)}
.admin-link{font-size:13px;color:var(--muted);text-align:center}
.admin-link button{background:none;border:0;color:var(--head);font-weight:700;cursor:pointer;text-decoration:underline}

@media (max-width:900px){.grid-top,.grid-bot{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.band .who{position:static;text-align:left}.band .wrap{flex-wrap:wrap;justify-content:center}.band .titles{flex-basis:100%}.docs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.doc .ttl{font-size:13.5px}}

/* Tài liệu học phần */
.tl-nav{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-block:18px 0}
.tl-pill{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font:900 15px var(--f-display);text-transform:uppercase;color:var(--head);padding:2px 0}
.tl-pill .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--head);border:1.5px solid var(--frame)}
.tl-pill:hover .ic{background:var(--head);color:var(--paper)}
.tl-main{padding-block:14px 44px;display:grid;gap:20px}
.tl-head,.ch-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tl-head .kicker,.ch-head .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;flex-basis:100%}
.tl-head h2,.ch-head h2{font:900 clamp(22px,3.4vw,32px)/1.2 var(--f-display);text-transform:uppercase;color:var(--head)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 20px}
.ch-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:0;background:none;cursor:pointer;padding:0;min-width:0}
.ch-card .ph{width:100%;aspect-ratio:3/2;border-radius:8px;overflow:hidden;background:var(--tint);display:block}
.ch-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.ch-card:hover img{transform:scale(1.04)}
.ch-card .no{font:900 15px var(--f-display);text-transform:uppercase;color:var(--head)}
.ch-card .nm{font:700 14px/1.35 var(--f-display);color:var(--ink)}
.ch-card .cnt{font-size:12px;color:var(--muted)}
.ch-card .ph.blank{display:grid;place-items:center;background:linear-gradient(135deg,var(--tint),var(--paper));font:900 44px var(--f-display);color:var(--head);opacity:.85}
.ch-card.soon{cursor:default;opacity:.62}
.ch-card.soon:hover img{transform:none}
.law-g{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--paper)}
.law-g summary{cursor:pointer;padding:11px 16px;font:700 15px var(--f-display);color:var(--head);display:flex;justify-content:space-between;gap:10px;list-style:none}
.law-g summary::-webkit-details-marker{display:none}
.law-g summary .n{font:600 12px var(--f-body);color:var(--muted);background:var(--tint);border-radius:999px;padding:1px 9px;align-self:center}
.law-g ol{margin:0;padding:0 18px 14px 36px;display:grid;gap:8px}
.law-g li{max-width:80ch}
.law-g li b{font-weight:600}
.law-g .meta{display:block;font-size:12.5px;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ref-g h4{margin:0 0 6px;font:900 14px var(--f-display);text-transform:uppercase;color:var(--head)}
.ref-g ul{margin:0;padding-left:20px;display:grid;gap:6px;font-style:italic;color:var(--ink)}
.mm-tabs{display:flex;gap:8px;flex-wrap:wrap}
.mm-tabs button{border:1.5px solid var(--frame);background:var(--paper);color:var(--head);border-radius:999px;padding:7px 16px;font:700 14px var(--f-display);cursor:pointer}
.mm-tabs button[aria-selected="true"]{background:var(--head);border-color:var(--head);color:var(--paper)}
.ch-pager{display:flex;justify-content:space-between;gap:10px}

/* Tờ sơ đồ: giữ nền giấy trắng ở cả hai chế độ sáng, tối như slide in */
.sheet{position:relative;overflow:hidden;background:#fff;color:#14304f;border:2px dashed var(--frame);border-radius:24px;padding:18px 16px 60px;--ln:#8592a3}
.sheet-deco{position:absolute;right:-90px;top:-90px;width:230px;height:230px;border-radius:50%;background:#1d4f74;pointer-events:none}
.sheet-logo{position:absolute;left:18px;top:16px;width:58px;height:58px;object-fit:contain}
.draft{position:relative;z-index:1;margin:0 auto 6px;width:max-content;max-width:100%;font-size:12px;font-weight:700;color:#8a4b0f;background:#fdf0dc;border-radius:999px;padding:3px 12px}
.mm-tools{position:absolute;z-index:3;right:16px;bottom:12px;display:flex;gap:6px}
.mm-tools button{border:1px solid #c9d0da;background:#fff;color:#14304f;border-radius:8px;min-width:34px;height:32px;font:700 14px var(--f-body);cursor:pointer;padding:0 10px}
.mm-vp{position:relative;z-index:1;overflow:auto;max-width:100%}
.mm-sizer{position:relative;margin:0 auto}
.mm-canvas{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;padding:4px 8px 10px}
.mm-title{text-align:center;padding:4px 70px 18px}
.mm-title .h1{font:900 46px/1.1 var(--f-display);text-transform:uppercase;color:#12395c;letter-spacing:.01em}
.mm-title .h2{font:900 24px/1.2 var(--f-display);text-transform:uppercase;color:#12395c;margin-top:4px}
.mm-tree{display:flex;justify-content:center}
.mm-node{display:flex;flex-direction:column;align-items:center}
.mm-box{position:relative;background:#fff;border:1.5px solid #8592a3;border-radius:14px;padding:7px 11px;font:700 13.5px/1.32 var(--f-display);color:#14304f;text-align:center;max-width:140px}
.mm-box.d0{font-size:21px;padding:10px 46px;border-radius:16px;max-width:none;border-color:#6b7787}
.mm-box.d1{font-size:18px;padding:10px 16px;border-radius:20px;max-width:230px;border-color:#6b7787;border-width:1.8px}
.mm-box.d2{font-size:15px;max-width:175px;padding:7px 12px;border-radius:16px}
.mm-box.has-d{max-width:200px}
.mm-box.d1.has-d{max-width:260px}
.mm-d{display:block;margin-top:4px;font:400 12.5px/1.42 var(--f-body);color:#2f3f55}
ul.mm-d{text-align:left;padding-left:14px;margin:4px 0 0}
ul.mm-d li{margin:1px 0}
.mm-kids.row{display:flex;align-items:flex-start;gap:14px;padding-top:30px;position:relative}
.mm-kids.row::before{content:"";position:absolute;top:0;left:50%;height:15px;border-left:1.5px solid var(--ln)}
.mm-kids.row>.mm-kid{position:relative;display:flex;justify-content:center}
.mm-kids.row>.mm-kid::before{content:"";position:absolute;top:-15px;left:-7px;right:-7px;border-top:1.5px solid var(--ln)}
.mm-kids.row>.mm-kid:first-child::before{left:50%}
.mm-kids.row>.mm-kid:last-child::before{right:50%}
.mm-kids.row>.mm-kid:only-child::before{display:none}
.mm-kids.row>.mm-kid::after{content:"";position:absolute;top:-15px;left:50%;height:15px;border-left:1.5px solid var(--ln)}
.mm-kids.stack{display:flex;flex-direction:column;align-items:center}
.mm-sk{position:relative;padding-top:16px;display:flex;justify-content:center}
.mm-sk::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid var(--ln)}
.mm-col{display:flex;flex-direction:column;align-items:center}
.mm-kid>.mm-node>.mm-box::before,.mm-sk>.mm-node>.mm-box::before,.mm-col>.mm-node:first-child>.mm-box::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:7px solid var(--ln)}
@media (max-width:560px){.sheet-logo{width:40px;height:40px}.sheet-deco{width:150px;height:150px;right:-70px;top:-70px}}
</style>
</head>
<body>


<div id="gate" class="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gate-h">
  <div class="gate-card">
    <button type="button" class="gate-x" id="gate-x" aria-label="Đóng">×</button>
    <div class="gate-top"><div class="logo"><img src="assets/logo.png" alt="Logo Phúc Nguyên Library"></div><div class="kicker">THƯ VIỆN PHÚC NGUYÊN</div><h1 id="gate-h">Tài liệu luật học</h1></div>
    <form class="gate-form" id="gate-form" novalidate>

/* ===== Chuẩn hóa mã lớp ===== */
function norm(s){return String(s||"").toUpperCase().replace(/\s+/g,"").replace(/[–—]/g,"-")}

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const KEY="pnlib-ma-lop";

/* ===== Tiện ích ngày tháng ===== */
const pad2=n=>String(n).padStart(2,"0");
function fmtDate(iso){const p=String(iso||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
/* ===== Kho dữ liệu trên Claude: mã lớp, lượt dùng, góp ý (thay cho máy chủ Google khi mở trên Claude) ===== */
let DB=null,UID=null,dbReadyRes;const dbReady=new Promise(r=>dbReadyRes=r);
const BE=()=>!!DB;
function call(params){return DB?dbCall(params):Promise.reject(new Error("nobackend"))}
const okCode=c=>/^[A-Z0-9][A-Z0-9_-]{2,23}$/.test(c);
async function luotDocs(){try{return (await DB.collection("luot").get()).docs.map(d=>({id:d.id,x:d.data()||{}}))}catch(e){return null}}
async function dbCall(p){const a=p.action;
  if(a==="check"){const code=norm(p.code);if(!okCode(code))return {ok:false,why:"notfound"};
    const m=await DB.doc("ma/"+code).get();if(!m.exists)return {ok:false,why:"notfound"};
    const x=m.data()||{}, courses=Array.isArray(x.courses)&&x.courses.length?x.courses:["*"];if(todayISO()>x.han)return {ok:false,why:"expired",han:x.han};
    if(p.course&& !courses.includes("*")&&!courses.includes(p.course))return {ok:false,why:"course",courses};
    if(!UID)return {ok:true,han:x.han,note:x.note,max:x.max,courses};
    const mine=DB.doc("luot/"+UID);let codes=[];try{const s=await mine.get();if(s.exists)codes=((s.data()||{}).codes||[]).slice()}catch(e){}
    if(codes.includes(code))return {ok:true,han:x.han,note:x.note,max:x.max,courses};
    const all=await luotDocs();const used=all?all.filter(d=>(d.x.codes||[]).includes(code)).length:0;
    if(all&&x.max&&used>=x.max)return {ok:false,why:"full",max:x.max};
    try{await mine.set({codes:codes.concat(code),t:Date.now()})}catch(e){}
    return {ok:true,han:x.han,note:x.note,used:used+1,max:x.max,courses}}
  if(a==="stats"){const all=await luotDocs();let fb=0;try{(await DB.collection("gopy").get()).docs.forEach(d=>{fb+=((d.data()||{}).items||[]).length})}catch(e){}
    return {ok:true,users:all?all.length:null,feedback:fb}}
  if(a==="fb_list"){const items=[];(await DB.collection("gopy").get()).docs.forEach(d=>((d.data()||{}).items||[]).forEach(x=>items.push(x)));
    items.sort((u,v)=>String(u.ts||u.time).localeCompare(String(v.ts||v.time)));return {ok:true,items}}
  if(a==="fb_add"){if(!UID)return {ok:false,why:"nouser"};const ref=DB.doc("gopy/"+UID);let items=[];try{const s=await ref.get();if(s.exists)items=((s.data()||{}).items||[]).slice()}catch(e){}
    items.push({time:todayISO(),ts:new Date().toISOString(),course:String(p.course||"").slice(0,80),text:String(p.text||"").slice(0,1500)});if(items.length>40)items=items.slice(-40);
    await ref.set({items});return {ok:true}}
  if(a.indexOf("admin_")===0){if(!isOwner)return {ok:false,why:"key"};
    if(a==="admin_list"){const ms=await DB.collection("ma").get(),all=await luotDocs()||[];
      return {ok:true,items:ms.docs.map(d=>{const x=d.data()||{};return {code:d.id,note:x.note||"",han:x.han,max:x.max||0,courses:Array.isArray(x.courses)&&x.courses.length?x.courses:["*"],used:all.filter(l=>(l.x.codes||[]).includes(d.id)).length,created:x.created||""}}).sort((u,v)=>String(u.created).localeCompare(String(v.created)))}}
    if(a==="admin_create"){const code=norm(p.code),max=parseInt(p.max,10);
      if(!okCode(code))return {ok:false,why:"badcode"};if(!/^\d{4}-\d{2}-\d{2}$/.test(p.han||""))return {ok:false,why:"badhan"};if(!(max>=1&&max<=1000))return {ok:false,why:"badmax"};
      if((await DB.doc("ma/"+code).get()).exists)return {ok:false,why:"exists"};
      const courses=String(p.courses||"*")==="*"?["*"]:String(p.courses||"").split(",").filter(x=>COURSES.some(c=>c.id===x));if(!courses.length)return {ok:false,why:"badcourses"};await DB.doc("ma/"+code).set({note:String(p.note||"").slice(0,80),han:p.han,max,courses,created:new Date().toISOString()});return {ok:true,code,courses}}
    if(a==="admin_delete"){const code=norm(p.code);await DB.doc("ma/"+code).delete();
      const all=await luotDocs()||[];for(const d of all){const cs=d.x.codes||[];if(cs.includes(code)){const rest=cs.filter(c=>c!==code);
        if(rest.length)await DB.doc("luot/"+d.id).set(Object.assign({},d.x,{codes:rest}));else await DB.doc("luot/"+d.id).delete()}}
      return {ok:true}}}
  return {ok:false,why:"action"}}

/* ===== Mã lớp trên bản web: đọc data/ma-lop.json (chỉ chứa dấu băm của mã) ===== */
let MA=null;
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const codeHash=(salt,code)=>sha("PNLIB2|"+salt+"|"+norm(code));
async function loadMa(force){if(MA&&!force)return MA;const r=await fetch(GH.path+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("ma");MA=await r.json();return MA}
/* Đếm số người đã dùng mỗi mã: dịch vụ đếm miễn phí Abacus (không cần tài khoản). Mỗi trình duyệt chỉ được đếm một lần cho mỗi mã. */
const CNT="https://abacus.jasoncameron.dev",CNS="phucnguyen-library",SEATS="pnlib-da-dung";
function seatsMine(){try{return JSON.parse(store.get(SEATS)||"{}")||{}}catch(e){return {}}}
async function cntGet(k){try{const r=await fetch(CNT+"/get/"+CNS+"/"+k,{cache:"no-store"});if(r.status===404)return 0;if(!r.ok)return null;return (await r.json()).value|0}catch(e){return null}}
async function claimSeat(k,max){if(!k||!max)return {ok:true};const mine=seatsMine();if(mine[k])return {ok:true};
  let v=null;for(let i=0;i<3&&v==null;i++){try{const r=await fetch(CNT+"/hit/"+CNS+"/"+k,{cache:"no-store"});if(r.ok)v=(await r.json()).value|0;else if(r.status===429)await new Promise(z=>setTimeout(z,2500))}catch(e){}}
  if(v==null)return {ok:true}; /* dịch vụ đếm không phản hồi: vẫn cho vào, lần sau sẽ đếm */
  if(v>max)return {ok:false,why:"full",max};
  mine[k]=1;store.set(SEATS,JSON.stringify(mine));return {ok:true}}
async function staticCheck(code,courseId){const d=await loadMa();const h=await codeHash(d.salt,code);const k=(d.codes||[]).find(x=>x.h===h);
  if(!k)return {ok:false,why:"notfound"};if(todayISO()>k.han)return {ok:false,why:"expired",han:k.han};
  const cs=Array.isArray(k.courses)&&k.courses.length?k.courses:["*"];
  if(courseId&&!cs.includes("*")&&!cs.includes(courseId))return {ok:false,why:"course",courses:cs};
  return {ok:true,han:k.han,note:k.note,courses:cs,k:k.k,max:k.max|0}}
async function checkCode(raw,courseId){const code=norm(raw);
  if(!okCode(code))return {ok:false,why:"Mã gồm 3–24 ký tự: chữ cái không dấu, chữ số, gạch ngang hoặc gạch dưới."};
  if(onClaude)await dbReady;
  let r;try{r=DB?await dbCall({action:"check",code,course:courseId||""}):await staticCheck(code,courseId||"")}catch(e){r={ok:false,why:"net"}}
  if(r&&r.ok&&!DB){const c=await claimSeat(r.k,r.max);if(!c.ok)r=c}
  if(r&&r.ok)return {ok:true,s:{code,label:r.note?String(r.note):"Mã "+code,han:r.han,courses:Array.isArray(r.courses)&&r.courses.length?r.courses:["*"]}};
  const W={notfound:"Mã không đúng hoặc đã bị xóa. Kiểm tra lại hoặc hỏi giảng viên.",expired:"Mã đã hết hạn"+(r&&r.han?" ngày "+fmtDate(r.han):"")+". Hỏi giảng viên mã mới.",full:"Mã này đã đủ "+(r&&r.max||"")+" người sử dụng. Hỏi giảng viên.",course:"Mã này không có quyền truy cập học phần đang chọn. Hãy nhập mã phù hợp.",net:"Chưa tải được danh sách mã lớp. Kiểm tra mạng rồi thử lại."};
  return {ok:false,expired:r&&r.why==="expired",why:W[r&&r.why]||"Chưa kiểm tra được mã, thử lại sau."}}
function loadSession(){const raw=store.get(KEY);if(!raw)return null;try{const s=JSON.parse(raw);if(s&&s.code&&s.han)return s}catch(e){}return null}

/* Thống kê và góp ý qua máy chủ */
let stats=null,fbItems=null,fbLoadErr="";
async function loadStats(){if(!BE())return;try{const r=await call({action:"stats"});if(r&&r.ok)stats=r}catch(e){}}
async function loadFb(){if(!BE())return;try{const r=await call({action:"fb_list"});if(r&&r.ok){fbItems=r.items;fbLoadErr=""}}catch(e){fbLoadErr="Không tải được danh sách góp ý lúc này. Thử lại sau."}}

/* ===== Quản lý mã lớp =====
   Một mã dùng chung cho cả lớp. Bản web GitHub: mã lưu trong data/ma-lop.json (sinh viên chỉ thấy dấu băm).
   Danh sách mã gốc và token GitHub được mã hóa bằng mật khẩu quản trị, nên chỉ cần kết nối GitHub một lần;
   từ đó mỗi lần cấp hoặc xóa mã, trang tự lưu ngược lên GitHub.
   Bản Claude: chủ trang quản lý mã trong kho dữ liệu của artifact. */
let ST=null; /* phiên quản trị trên bản web: {pw,list,salt,sha,tok} */
const AKEY="pnlib-quan-tri"; /* ghi nhớ đăng nhập quản trị trên trình duyệt này */
function adminScopeLabel(xs){
  if(!Array.isArray(xs)||!xs.length||xs.includes("*"))return "Tất cả học phần";
  return xs.map(id=>{const c=course(id);return c?c.name:id}).join(", ");
}
const b64e=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pwKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function openVault(admin,pw){const k=await pwKey(pw,admin.salt,admin.iter);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(admin.iv)},k,b64d(admin.data));return JSON.parse(new TextDecoder().decode(pt))}
async function sealVault(obj,pw){const salt=b64e(rnd(16)),iv=b64e(rnd(12)),iter=250000,k=await pwKey(pw,salt,iter);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:b64d(iv)},k,new TextEncoder().encode(JSON.stringify(obj)));return {salt,iter,iv,data:b64e(new Uint8Array(ct))}}
async function buildFile(){const codes=[];
  for(const x of ST.list)codes.push({h:await codeHash(ST.salt,x.code),han:x.han,courses:x.courses,note:x.note||"",k:x.k,max:x.max|0});
  return {v:2,ghi_chu:"Tự sinh bởi trang Quản lý mã lớp. Không sửa tay.",salt:ST.salt,updated:new Date().toISOString(),codes,admin:await sealVault({codes:ST.list,tok:ST.tok||""},ST.pw)}}
const ghURL=()=>`https://api.github.com/repos/${GH.repo}/contents/${GH.path}`;
const ghHead=t=>({Authorization:"Bearer "+t,Accept:"application/vnd.github+json"});
async function ghGet(t){const r=await fetch(ghURL()+"?ref="+GH.branch+"&t="+Date.now(),{headers:ghHead(t),cache:"no-store"});
  if(r.status===404)return null;if(!r.ok)throw new Error("gh"+r.status);const j=await r.json();
  return {sha:j.sha,data:JSON.parse(new TextDecoder().decode(b64d(String(j.content||"").replace(/\s/g,""))))}}
async function ghPut(t,obj,sha){const body={message:"Cập nhật mã lớp",branch:GH.branch,content:b64e(new TextEncoder().encode(JSON.stringify(obj,null,1)+"\n"))};if(sha)body.sha=sha;
  const r=await fetch(ghURL(),{method:"PUT",headers:Object.assign(ghHead(t),{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error("gh"+r.status);return (await r.json()).content.sha}
const ghErr=e=>{const m=String(e&&e.message||"");return m==="gh401"?"Token GitHub sai hoặc đã hết hạn. Kết nối lại GitHub ở khung bên dưới.":(m==="gh403"||m==="gh404")?"Token GitHub chưa có quyền ghi (Contents: Read and write) cho kho phuc-nguyen-library.":m==="gh409"||m==="gh422"?"Dữ liệu trên GitHub vừa thay đổi ở nơi khác. Đăng xuất rồi đăng nhập lại.":"Không kết nối được GitHub. Kiểm tra mạng rồi thử lại."};
/* Lưu ngược lên GitHub; lỗi thì hoàn tác thay đổi trên trang để không có trạng thái "chưa lưu" */
async function persist(undo){try{const file=await buildFile();ST.sha=await ghPut(ST.tok,file,ST.sha);MA=file;return {ok:true}}
  catch(e){if(undo)undo();return {ok:false,why:ghErr(e)}}}
const TOKEN_URL="https://github.com/settings/personal-access-tokens/new?name=Phuc+Nguyen+Library+-+ma+lop&description=Luu+ma+lop+tu+trang+quan+tri&target_name=luuhuongnnpl-apag&expires_in=none&contents=write";

const ADM={
  web:()=>!DB,
  async list(){if(!DB){const items=await Promise.all(ST.list.map(async x=>Object.assign({},x,{used:await cntGet(x.k)})));return {ok:true,items}}return dbCall({action:"admin_list"})},
  async create(o){if(DB)return dbCall(Object.assign({action:"admin_create"},o,{courses:o.courses.join(",")||"*"}));
    if(ST.list.some(x=>x.code===o.code))return {ok:false,why:"exists"};
    const item={code:o.code,note:o.note,han:o.han,max:o.max,courses:o.courses.length?o.courses:["*"],k:"pnl-"+Array.from(rnd(8)).map(x=>x.toString(16).padStart(2,"0")).join(""),created:new Date().toISOString()};
    ST.list.push(item);return persist(()=>{ST.list=ST.list.filter(x=>x!==item)})},
  async del(code){if(DB)return dbCall({action:"admin_delete",code});const before=ST.list;ST.list=ST.list.filter(x=>x.code!==code);return persist(()=>{ST.list=before})}
};

function adminHead(){return `<div class="subbar"><div class="wrap"><button type="button" data-home>← Thư viện</button><h2>Quản lý mã lớp</h2></div></div>`}
function connectBox(first){return `<section class="frame"><div class="ftitle">${first?"Kết nối GitHub (làm một lần duy nhất)":"Đổi token GitHub"}</div>
    <form id="t-form" novalidate class="admin">
      ${first?`<p class="msg">Để mỗi lần cấp mã trang tự lưu lên GitHub, cần kết nối một lần. Sau bước này, đăng nhập ở máy nào cũng tự lưu, không phải làm lại.</p>
      <ol class="msg" style="margin:0;padding-left:20px;display:grid;gap:4px">
        <li>Bấm <a href="${TOKEN_URL}" target="_blank" rel="noopener"><b>Mở trang tạo token GitHub</b></a> (đăng nhập GitHub nếu được hỏi).</li>
        <li>Mục <b>Repository access</b>: chọn <b>Only select repositories</b> → <b>phuc-nguyen-library</b>.</li>
        <li>Mục <b>Permissions</b> → <b>Contents</b>: chọn <b>Read and write</b> (nếu trang chưa tự chọn).</li>
        <li>Bấm <b>Generate token</b>, sao chép dãy ký tự bắt đầu bằng <b>github_pat_</b> và dán vào ô dưới.</li></ol>`
      :`<p class="msg">Chỉ dùng khi token cũ hết hạn hoặc bị thu hồi. <a href="${TOKEN_URL}" target="_blank" rel="noopener">Mở trang tạo token GitHub</a>.</p>`}
      <div class="row"><div><label class="lab" for="t-in">Token GitHub</label><input type="password" id="t-in" autocomplete="off" placeholder="github_pat_…"></div></div>
      <div class="err" id="t-err" role="alert"></div>
      <div class="row" style="align-items:center"><button class="btn primary" type="submit">${first?"Kết nối":"Lưu token mới"}</button><span class="msg" id="t-msg" aria-live="polite"></span></div>
    </form></section>`}

    <div class="row"><div><label class="lab" for="ak-in">Mật khẩu quản trị</label><input type="password" id="ak-in" autocomplete="current-password" required></div></div>

    <form id="c-form" novalidate class="admin">
      <p class="msg">Một mã dùng chung cho nhiều sinh viên. Ghi số người được dùng mã (ví dụ 20): người thứ 21 nhập mã sẽ bị từ chối. Mã có thể mở một hoặc nhiều học phần. Bấm <b>Cấp mã</b> là mã được lưu lên GitHub, sinh viên dùng được sau khoảng 1–2 phút.</p>
      <div class="row">
        <div><label class="lab" for="c-code">Mã</label><input type="text" id="c-code" placeholder="Ví dụ: PNL2026" maxlength="24" autocomplete="off" spellcheck="false" style="text-transform:uppercase;letter-spacing:.04em" required></div>
        ${maxField}
      </div>
      <div class="row"><div><label class="lab" for="c-han">Có hiệu lực đến hết ngày</label><input type="date" id="c-han" value="${def}" required></div>

      <div class="field"><span class="lab">Học phần được mở</span>

      <div class="row" style="align-items:center"><button class="btn primary" type="submit">Đổi mật khẩu</button><button class="btn" type="button" id="l-out">Đăng xuất quản trị</button><span class="msg" id="p-msg" aria-live="polite"></span></div>
    </form></section>
  <details class="frame"><summary class="msg" style="cursor:pointer">Đổi token GitHub (chỉ khi token cũ hết hạn)</summary>${connectBox(false)}</details>`:""}

function bindToken(){const f=$("#t-form");if(!f)return;
  f.addEventListener("submit",async e=>{e.preventDefault();const t=$("#t-in").value.trim();
    if(!t){$("#t-err").textContent="Dán token GitHub vào ô trên.";return}
    $("#t-err").textContent="";$("#t-msg").textContent="Đang kết nối…";
    try{const g=await ghGet(t);const old=ST.tok,oldSha=ST.sha;ST.tok=t;ST.sha=g?g.sha:null;
      const r=await persist(()=>{ST.tok=old;ST.sha=oldSha});
      if(r.ok){route("quan-ly-ma");setTimeout(()=>{if($("#c-msg"))$("#c-msg").textContent="Đã kết nối GitHub. Từ nay mỗi lần cấp mã sẽ tự lưu."},0)}
      else{$("#t-msg").textContent="";$("#t-err").textContent=r.why}}
    catch(err){$("#t-msg").textContent="";$("#t-err").textContent=ghErr(err)}})}
async function admin2Bind(){
  const af=$("#ak-form");
  if(af){
    async function login(pw,auto){
      $("#ak-err").textContent=auto?"Đang tự đăng nhập…":"Đang xác thực…";
      let d,v;try{d=await loadMa(true)}catch(err){$("#ak-err").textContent="Chưa tải được dữ liệu mã lớp. Kiểm tra mạng rồi thử lại.";return}
      try{v=await openVault(d.admin,pw)}catch(err){store.del(AKEY);$("#ak-err").textContent=auto?"Mật khẩu đã lưu không còn đúng. Nhập lại mật khẩu quản trị.":"Mật khẩu không đúng.";return}
      let sha=null;
      if(v.tok){try{const g=await ghGet(v.tok);if(g){sha=g.sha;d=g.data;v=await openVault(d.admin,pw)}}catch(err){$("#ak-err").textContent=ghErr(err);v.tok="";}}
      if(!auto&&$("#ak-keep").checked)store.set(AKEY,pw);
      ST={pw,list:Array.isArray(v.codes)?v.codes:[],salt:d.salt,sha,tok:v.tok||""};MA=d;route("quan-ly-ma")}
    af.addEventListener("submit",e=>{e.preventDefault();const pw=$("#ak-in").value;if(!pw){$("#ak-err").textContent="Nhập mật khẩu quản trị.";return}login(pw,false)});
    const saved=store.get(AKEY);if(saved)login(saved,true);
    $("#ak-in").addEventListener("input",()=>$("#ak-err").textContent="");
    return;
  }
  bindToken();
  if($("#l-out"))$("#l-out").onclick=()=>{ST=null;store.del(AKEY);route("quan-ly-ma")};
  if(!$("#c-form"))return;
  const web=ADM.web();
  async function list(){
    try{const r=await ADM.list();if(!r||!r.ok){$("#l-msg").textContent="Chưa tải được danh sách mã.";return}
      $("#l-msg").textContent=r.items.length?r.items.length+" mã":"";const t=todayISO();
      $("#l-body").innerHTML=r.items.length?r.items.slice().reverse().map(x=>{const exp=t>x.han,full=x.max&&x.used!=null&&x.used>=x.max;
        return `<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.note||"")}</td><td>${esc(adminScopeLabel(x.courses))}</td><td>${fmtDate(x.han)}</td><td>${x.used==null?"?":Math.min(x.used,x.max)} / ${x.max||"—"}</td><td>${exp?'<span class="bad">Hết hạn</span>':full?'<span class="bad">Đủ số người</span>':'<span class="ok">Đang hiệu lực</span>'}</td><td><button type="button" class="btn" data-del="${esc(x.code)}" style="padding:5px 10px">Xóa</button></td></tr>`}).join("")
        :`<tr><td colspan="7" class="msg">Chưa có mã nào. Cấp mã đầu tiên ở khung bên trên.</td></tr>`;
      $("#l-body").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
        if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Bấm lần nữa để xóa";b.classList.add("primary");setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="Xóa";b.classList.remove("primary")}},4000);return}
        b.disabled=true;b.textContent="Đang xóa…";
        try{const rr=await ADM.del(b.dataset.del);await list();$("#l-msg").textContent=rr&&rr.ok?"Đã xóa mã "+b.dataset.del+(web?" và lưu lên GitHub.":"."):(rr&&rr.why)||"Chưa xóa được."}
        catch(err){b.textContent="Thử lại";b.disabled=false}});
    }catch(err){$("#l-msg").textContent="Chưa tải được danh sách mã."}
  }
  $("#c-all-courses").addEventListener("change",()=>document.querySelectorAll(".c-course").forEach(x=>{x.disabled=$("#c-all-courses").checked;if(x.disabled)x.checked=false}));
  const WHY={exists:"Mã này đã có trong danh sách; hãy đặt mã khác.",badcode:"Mã chưa đúng định dạng.",badhan:"Ngày hết hạn không hợp lệ.",badmax:"Số người tối đa không hợp lệ.",badcourses:"Phạm vi học phần không hợp lệ.",key:"Chỉ chủ trang mới được cấp mã."};
  $("#c-form").addEventListener("submit",async e=>{e.preventDefault();
    const code=norm($("#c-code").value),note=$("#c-note").value.trim(),han=$("#c-han").value,max=parseInt($("#c-max").value,10);
    const all=$("#c-all-courses").checked,courses=all?[]:[...document.querySelectorAll(".c-course:checked")].map(x=>x.value);
    if(!code){$("#c-err").textContent="Nhập mã, ví dụ PNL2026.";return}
    if(!okCode(code)){$("#c-err").textContent="Mã gồm 3–24 ký tự: chữ cái không dấu, chữ số, gạch ngang hoặc gạch dưới.";return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(han)||han<todayISO()){$("#c-err").textContent="Chọn ngày hết hạn từ hôm nay trở đi.";return}
    if(!(max>=1&&max<=1000)){$("#c-err").textContent="Số người được dùng mã phải từ 1 đến 1000.";return}
    if(!all&&!courses.length){$("#c-err").textContent="Chọn ít nhất một học phần hoặc bật Tất cả học phần.";return}
    $("#c-err").textContent="";$("#c-msg").textContent=web?"Đang cấp mã và lưu lên GitHub…":"Đang cấp mã…";const btn=$("#c-form button[type=submit]");btn.disabled=true;
    try{const r=await ADM.create({code,note,han,max,courses});
      if(r&&r.ok){$("#c-msg").textContent="Đã cấp mã "+code+(web?" và lưu lên GitHub. Sinh viên dùng được sau khoảng 1–2 phút.":".");$("#c-code").value="";$("#c-note").value="";list()}
      else{$("#c-msg").textContent="";$("#c-err").textContent=WHY[r&&r.why]||(r&&r.why)||"Chưa cấp được mã."}}
    catch(err){$("#c-msg").textContent="";$("#c-err").textContent="Chưa cấp được mã. Thử lại."}finally{btn.disabled=false}});
  ["c-code","c-note","c-han"].forEach(id=>$("#"+id).addEventListener("input",()=>$("#c-err").textContent=""));
  if(web)$("#p-form").addEventListener("submit",async e=>{e.preventDefault();const a=$("#p-new").value,b=$("#p-new2").value;
    if(a.length<10){$("#p-err").textContent="Mật khẩu mới cần ít nhất 10 ký tự.";return}
    if(a!==b){$("#p-err").textContent="Hai lần nhập mật khẩu chưa khớp.";return}
    $("#p-err").textContent="";$("#p-msg").textContent="Đang đổi mật khẩu…";const old=ST.pw;ST.pw=a;
    const r=await persist(()=>{ST.pw=old});
    if(r.ok){if(store.get(AKEY))store.set(AKEY,a);$("#p-new").value="";$("#p-new2").value="";$("#p-msg").textContent="Đã đổi mật khẩu. Từ nay đăng nhập bằng mật khẩu mới."}
    else{$("#p-msg").textContent="";$("#p-err").textContent=r.why}});
  list();
}

/* Trang góp ý khi dùng máy chủ */

  const list=fbItems==null?`<div class="info">${fbLoadErr||"Đang tải góp ý…"}</div>`:(fbItems.length?`<div class="fb-list">${fbItems.slice().reverse().map(r=>`<div class="fb-item"><div class="m">${esc(fmtDate(r.time))}${r.course?" · "+esc(r.course):""}</div><p>${esc(r.text)}</p></div>`).join("")}</div>`:`<div class="info">Chưa có góp ý nào. Hãy là người đầu tiên gửi góp ý.</div>`);

      <div class="row" style="align-items:center"><button class="btn primary" type="submit">Gửi góp ý</button><span class="msg" id="fb-msg"></span></div></form></section>

function fbApiBind(){
  const draw=()=>{const w=$("#fb-wrap");if(!w)return;const tmp=document.createElement("div");tmp.innerHTML=fbApiHTML();const n=tmp.querySelector("#fb-wrap");if(n)w.innerHTML=n.innerHTML};
  loadFb().then(draw);
  $("#fb-form").addEventListener("submit",async e=>{e.preventDefault();const text=$("#fb-text").value.trim();
    if(text.length<3){$("#fb-err").textContent="Viết nội dung góp ý trước khi gửi.";return}
    $("#fb-err").textContent="";$("#fb-msg").textContent="Đang gửi…";
    try{const r=await call({action:"fb_add",course:$("#fb-course").value,text,code:session?session.code:""});
      if(r&&r.ok){$("#fb-msg").textContent="Đã gửi. Cảm ơn bạn!";$("#fb-text").value="";await loadFb();draw();loadStats()}
      else{$("#fb-msg").textContent="";$("#fb-err").textContent=r&&r.why==="nouser"?"Bạn cần đăng nhập Claude để gửi góp ý.":"Chưa gửi được, thử lại sau."}}
    catch(err){$("#fb-msg").textContent="";$("#fb-err").textContent=DB?"Tài khoản của bạn chưa được phép gửi góp ý trên trang này. Có thể dùng nút Bình luận của Claude.":"Không kết nối được máy chủ."}});
  $("#fb-text").addEventListener("input",()=>$("#fb-err").textContent="")}


/* Trang chủ mở tự do; lần đầu bấm vào nội dung (học phần, tài liệu, chương) mới hỏi mã */
const FREE=["home","gop-y","quan-ly-ma"];
let pending=null,gateReturn=null,expiredMsg="";
function scopeForRoute(id){const p=tlParse(id);if(p)return p.k;return course(id)?id:""}
function needsCode(id){if(FREE.includes(id))return false;if(!session)return true;const xs=session.courses;if(!Array.isArray(xs)||!xs.length||xs.includes("*"))return false;const target=scopeForRoute(id);return !!target&&!xs.includes(target)}
function showGate(msg){gateReturn=document.activeElement;$("#gate").hidden=false;$("#code-err").textContent=msg||"";document.body.style.overflow="hidden";setTimeout(()=>$("#code-in").focus(),30)}
function hideGate(){$("#gate").hidden=true;document.body.style.overflow="";if(gateReturn&&gateReturn.focus)try{gateReturn.focus()}catch(e){}}
function renderWho(){const w=$("#who");
  if(session){w.innerHTML=esc(session.label)+" · đến "+fmtDate(session.han)+'<br><button type="button" id="logout">Đổi mã</button>';}
  else w.innerHTML='<button type="button" id="login">Nhập mã lớp</button>';
  w.insertAdjacentHTML("beforeend",'<br><button type="button" id="manage-codes">Quản lý mã</button>');
  if($("#logout"))$("#logout").onclick=()=>{store.del(KEY);session=null;$("#code-in").value="";renderWho();route("home")};
  if($("#login"))$("#login").onclick=()=>{pending=null;showGate()};
  $("#manage-codes").onclick=()=>route("quan-ly-ma");
}
function enter(sv){session=sv;store.set(KEY,JSON.stringify(sv));hideGate();renderWho();
  if(pending){const t=pending;pending=null;route(t)}}

let cur="home";
function route(id){if(needsCode(id)){pending=id;showGate(session?"Mã hiện tại chưa được cấp quyền cho học phần này. Nhập mã khác để tiếp tục.":expiredMsg);return}
  if(!$("#gate").hidden)hideGate();
  document.body.classList.remove("in-course");
  cur=id;const m=$("#main");
  if(id==="home") m.innerHTML=homeHTML();
  else if(id==="gop-y"){if(BE()){m.innerHTML=fbApiHTML();fbApiBind()}else if(!onClaude){m.innerHTML=fbMailHTML();fbMailBind()}else m.innerHTML=fbHTML()}
  else if(id==="quan-ly-ma"){m.innerHTML=admin2HTML();admin2Bind()}
  else if(tlRoute(id,m)){}
  else{const c=course(id);if(!c){route("home");return}
    if(c.src&&c.skin){document.body.classList.add("in-course");m.innerHTML=`<section class="viewer"><iframe src="${c.src}" title="Ôn tập ${c.name}"></iframe></section>`}
    else m.innerHTML=c.src
      ?`<div class="subbar"><div class="wrap"><button type="button" data-home>← Thư viện</button><h2>${c.name}</h2><div class="sp"></div><a href="${c.src}" target="_blank" rel="noopener">Mở trong thẻ mới</a></div></div><section class="viewer"><iframe src="${c.src}" title="Tài liệu ${c.name}"></iframe></section>`
      :`<div class="subbar"><div class="wrap"><button type="button" data-home>← Thư viện</button><h2>${c.name}</h2></div></div><section class="soon-page wrap"><div class="frame"><div class="ftitle">${c.name}</div><p>Tài liệu học phần đang được biên soạn và sẽ cập nhật tại đây khi có dữ liệu: thi thử, văn bản pháp luật, kiến thức, câu hỏi lý thuyết và tình huống.</p><div><button class="btn" data-home>Về thư viện</button></div></div></section>`}

/* Đọc CSV câu trả lời Google Form (cột: Dấu thời gian, Học phần, Nội dung góp ý) */
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch=='"')q=true;else if(ch==","){r.push(f);f=""}else if(ch=="\n"){r.push(f);rows.push(r);r=[];f=""}else if(ch!="\r")f+=ch}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
async function loadFeedback(){ if(!CONFIG.responsesCsvUrl)return;
  try{const res=await fetch(CONFIG.responsesCsvUrl,{cache:"no-store"});const rows=parseCSV(await res.text()).slice(1).filter(r=>r.some(x=>x.trim()));
    feedback=rows.map(r=>({time:r[0]||"",course:r.length>2?r[1]:"",text:r.length>2?r.slice(2).join(" "):(r[1]||"")})).filter(x=>x.text.trim())}
  catch(e){fbErr="Không tải được danh sách góp ý lúc này. Thử lại sau."}}
async function loadVisits(){ if(!CONFIG.goatcounter)return;
  try{const s=document.createElement("script");s.async=true;s.dataset.goatcounter=`https://${CONFIG.goatcounter}.goatcounter.com/count`;s.src="https://gc.zgo.at/count.js";document.head.appendChild(s);
    const r=await fetch(`https://${CONFIG.goatcounter}.goatcounter.com/counter/TOTAL.json`);const j=await r.json();visits=parseInt(String(j.count).replace(/\D/g,""),10)}catch(e){}}

function tlHomeHTML(k){const T=TL[k];
  const cards=T.chapters.map(c=>{const ph=c.img?`<span class="ph"><img src="${c.img}" alt="" loading="lazy"></span>`:`<span class="ph blank" aria-hidden="true">${c.n}</span>`;
    return c.maps.length?`<button type="button" class="ch-card" data-go="tl-${k}-${c.n}">${ph}<span class="no">Chương ${c.n}</span><span class="nm">${esc(c.t)}</span><span class="cnt">${c.maps.length} sơ đồ</span></button>`
      :`<div class="ch-card soon">${ph}<span class="no">Chương ${c.n}</span><span class="nm">${esc(c.t)}</span><span class="cnt">Đang biên soạn</span></div>`}).join("");
  const laws=(T.laws||[]).map(g=>`<details class="law-g"${g.open?" open":""}><summary>${esc(g.name)}<span class="n">${g.rows.length}</span></summary><ol>${g.rows.map(r=>`<li><b>${esc(r[0])}</b><span class="meta">${esc(r[2])} · ${esc(r[1])}</span></li>`).join("")}</ol></details>`).join("");
  const refs=T.refs.map(g=>`<div class="ref-g"><h4>${esc(g.g)}</h4><ul>${g.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
  const cases=(T.cases||[]).length?`<details class="law-g"><summary>Án lệ liên quan<span class="n">${T.cases.length}</span></summary><ol>${T.cases.map(r=>`<li><b>Án lệ ${esc(r[0])}</b> ${esc(r[1])}<span class="meta">${esc(r[2])}</span></li>`).join("")}</ol></details>`:"";
  const rv=course(T.review);
  return tlNav(k,false)+`<main class="wrap tl-main">
  <div class="tl-head"><div class="kicker">Mind-map học phần</div><h2>${esc(T.name)}</h2>${rv&&rv.src?`<button type="button" class="btn primary" data-go="${rv.id}">Vào ôn tập học phần</button>`:""}</div>
  <section class="frame"><div class="ftitle">Tóm tắt nội dung chính của học phần</div><div class="ch-grid">${cards}</div></section>
  <section class="frame"><div class="ftitle">Danh mục văn bản quy phạm pháp luật</div><p class="msg">Bấm vào từng nhóm để xem danh sách. Khi tra cứu, dùng bản hợp nhất đã cập nhật các lần sửa đổi, bổ sung.</p>${laws}</section>
  <section class="frame"><div class="ftitle">Tài liệu tham khảo khác</div><div class="refs">${refs}</div>${cases}</section>
  </main>`}

function mmBox(n,depth){const items=n.d?n.d.split(" · "):null;
  const d=!items?"":(items.length>1?`<ul class="mm-d">${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<span class="mm-d">${esc(n.d)}</span>`);
  return `<div class="mm-box d${Math.min(depth,4)}${n.d?" has-d":""}">${esc(n.t)}${d}</div>`}
function mmNode(n,depth){const kids=n.c||[];const box=mmBox(n,depth);
  if(!kids.length)return `<div class="mm-node">${box}</div>`;
  const l=n.l||(depth<=1&&kids.some(k=>k.c&&k.c.length)?"row":"stack");
  return `<div class="mm-node">${box}${mmKids(kids,l,depth)}</div>`}
function mmKids(kids,l,depth){
  if(l.indexOf("cols")===0){const N=+l.slice(4)||2,cols=[...Array(N)].map(()=>[]);kids.forEach((k,i)=>cols[i%N].push(k));
    return `<div class="mm-kids row">${cols.filter(c=>c.length).map(col=>`<div class="mm-kid"><div class="mm-col">${col.map((k,i)=>i?`<div class="mm-sk">${mmNode(k,depth+1)}</div>`:mmNode(k,depth+1)).join("")}</div></div>`).join("")}</div>`}
  if(l==="row")return `<div class="mm-kids row">${kids.map(k=>`<div class="mm-kid">${mmNode(k,depth+1)}</div>`).join("")}</div>`;
  return `<div class="mm-kids stack">${kids.map(k=>`<div class="mm-sk">${mmNode(k,depth+1)}</div>`).join("")}</div>`}
function mmHTML(m){const top=m.r?`<div class="mm-node">${mmBox({t:m.r},0)}${mmKids(m.c,"row",0)}</div>`:`<div class="mm-node mm-noroot">${mmKids(m.c,"row",0)}</div>`;
  return `<div class="mm-title"><div class="h1">${esc(m.h1)}</div>${m.h2?`<div class="h2">${esc(m.h2)}</div>`:""}</div><div class="mm-tree">${top}</div>`}

function tlChapterHTML(k,n,mi){const T=TL[k],c=T.chapters.find(x=>x.n===n);if(!c||!c.maps.length)return null;
  mi=Math.max(0,Math.min(mi||0,c.maps.length-1));const m=c.maps[mi];
  const tabs=c.maps.length>1?`<div class="mm-tabs" role="tablist">${c.maps.map((x,i)=>`<button type="button" role="tab" aria-selected="${i===mi}" data-go="tl-${k}-${n}-${i+1}">${esc(x.k)}</button>`).join("")}</div>`:"";
  const prev=T.chapters.filter(x=>x.n<n&&x.maps.length).pop(),next=T.chapters.find(x=>x.n>n&&x.maps.length);
  return tlNav(k,true)+`<main class="wrap tl-main">
  <div class="ch-head"><div class="kicker">Tóm tắt nội dung · ${esc(T.name)}</div><h2>Chương ${n}. ${esc(c.t)}</h2></div>
  ${tabs}
  <section class="sheet">
    <div class="sheet-deco" aria-hidden="true"></div><img class="sheet-logo" src="assets/logo.png" alt="">
    
    <div class="mm-tools"><button type="button" data-z="-1" aria-label="Thu nhỏ">−</button><button type="button" data-z="0">Vừa khung</button><button type="button" data-z="1" aria-label="Phóng to">+</button></div>
    <div class="mm-vp"><div class="mm-sizer"><div class="mm-canvas">${mmHTML(m)}</div></div></div>
  </section>
  <div class="ch-pager">${prev?`<button type="button" class="btn" data-go="tl-${k}-${prev.n}">← Chương ${prev.n}</button>`:"<span></span>"}${next?`<button type="button" class="btn" data-go="tl-${k}-${next.n}">Chương ${next.n} →</button>`:"<span></span>"}</div>
  </main>`}

let mmZoom=null;
function mmFit(){const vp=document.querySelector(".mm-vp");if(!vp)return;const sz=vp.querySelector(".mm-sizer"),cv=vp.querySelector(".mm-canvas");
  cv.style.transform="none";const w=cv.scrollWidth,h=cv.scrollHeight;
  let s=mmZoom!=null?mmZoom:Math.min(1,(vp.clientWidth-4)/w);
  if(mmZoom==null)s=Math.max(s,vp.clientWidth<700?.5:.74);
  cv.style.transform=`scale(${s})`;sz.style.width=Math.ceil(w*s)+"px";sz.style.height=Math.ceil(h*s)+"px";vp.dataset.s=s;vp.scrollLeft=Math.max(0,(w*s-vp.clientWidth)/2)}
function bindMM(){mmZoom=null;
  document.querySelectorAll(".mm-tools [data-z]").forEach(b=>b.onclick=()=>{const z=+b.dataset.z,vp=document.querySelector(".mm-vp"),s=+vp.dataset.s||1;
    mmZoom=z===0?null:Math.max(.3,Math.min(2,s*(z>0?1.25:.8)));mmFit()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(mmFit);mmFit()}
window.addEventListener("resize",()=>{if(document.querySelector(".mm-vp"))mmFit()});

function tlRoute(id,m){const p=tlParse(id);if(!p)return false;
  if(p.ch){const h=tlChapterHTML(p.k,p.ch,p.mi);if(!h)return false;m.innerHTML=h;setTimeout(bindMM,0)}
  else m.innerHTML=tlHomeHTML(p.k);
  return true}

window.addEventListener("message",e=>{if(e.data&&e.data.pn==="home"){const target=String(e.data.course||"");route("home");if(target){pending=target;showGate("Nhập mã có quyền truy cập học phần này để tiếp tục.")}}});
(async function boot(){
  session=loadSession();
  if(session&&todayISO()>session.han){expiredMsg="Mã của lớp đã hết hạn ngày "+fmtDate(session.han)+". Hỏi giảng viên mã mới.";session=null;store.del(KEY)}
  else if(!session&&store.get(KEY))store.del(KEY);
  $("#app").hidden=false;renderWho();
  const h0=(location.hash||"").slice(1);route(course(h0)||tlParse(h0)||h0==="gop-y"?h0:"home");
  try{const u=onClaude&&await window.claude.use("user");isOwner=u?!!(await u.isOwner()):false;if(u){try{UID=await u.id()}catch(e){}}}catch(e){isOwner=false}
  try{DB=onClaude?await window.claude.use("db"):null}catch(e){DB=null}
  dbReadyRes();
  if(session){(DB?dbCall({action:"check",code:session.code}):staticCheck(session.code,"")).then(r=>{if(r&&!r.ok&&(r.why==="notfound"||r.why==="expired"||r.why==="full")){
      store.del(KEY);session=null;expiredMsg=r.why==="expired"?"Mã của lớp đã hết hạn. Hỏi giảng viên mã mới.":"Mã của bạn không còn dùng được. Hỏi giảng viên mã mới.";renderWho();
      if(needsCode(cur)){pending=cur;route("home");showGate(expiredMsg)}}}).catch(()=>{})}
  await Promise.all([loadFeedback(),loadVisits(),loadStats()]);
  try{cmt=onClaude?await window.claude.use("comments"):null}catch(e){cmt=null}
  if(isOwner)renderWho();
  if(cur==="home"||cur==="gop-y")route(cur);
  if(isOwner&&(location.hash||"").slice(1)==="quan-ly-ma")route("quan-ly-ma");
})();
