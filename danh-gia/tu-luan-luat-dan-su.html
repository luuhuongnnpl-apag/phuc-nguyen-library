firebase.initializeApp(cfg);

const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

let BANK=null,SESSION=null,TIMER=null,RUBRIC=null,CURRENT=null,DETACH=null,SAVE_Q=Promise.resolve();

const caseBy=id=>BANK.cases.find(c=>c.id===id);
async function bankLoad(){if(BANK)return BANK;const r=await fetch("./de/luat-dan-su-tu-luan.b64",{cache:"no-cache"});if(!r.ok)throw Error("Không tải được ngân hàng đề.");
const data=atob((await r.text()).trim()),bytes=Uint8Array.from(data,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
BANK=JSON.parse(await new Response(stream).text());if(BANK.cases.length!==30||BANK.exam_sets.length!==15)throw Error("Ngân hàng đề không hợp lệ.");return BANK}

/* Ngân hàng chính thức từ học phần: 180 câu lý thuyết + 108 câu trắc nghiệm tình huống.
   Lưu mã câu và thứ tự phương án; không lưu đáp án đúng trong bài sinh viên. */
let MCQ=null;
async function loadMCQ(){
 if(MCQ)return MCQ;
 const r=await fetch("../hp/luat-dan-su.html",{cache:"no-cache"});
 if(!r.ok)throw Error("Không tải được trắc nghiệm học phần.");
 const txt=await r.text(),m=txt.match(/<script id="pn-data" type="application\/json">([\s\S]*?)<\/script>/);
 if(!m)throw Error("Không tìm thấy ngân hàng câu hỏi học phần.");
 const d=JSON.parse(m[1]),questions={},situations={};
 for(const q of d.q||[])if(q.id&&Array.isArray(q.o)&&q.o.length===4)questions[q.id]=q;
 for(const group of d.th||[])for(const c of group.items||[])situations[c.cid]=c;
 const theory=Object.values(questions).filter(q=>!q.cid);
 const contexts=Object.values(situations).filter(c=>Array.isArray(c.mcq)&&c.mcq.length>=4&&c.mcq.every(id=>questions[id]));
 if(theory.length<8||!contexts.length)throw Error("Ngân hàng trắc nghiệm chưa đủ câu.");
 MCQ={questions,theory,contexts};return MCQ;
}
function shuffleExam(xs){xs=xs.slice();for(let i=xs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]]}return xs}
function newMixedExam(){
 const ch=shuffleExam(MCQ.contexts)[0];
 const theory=shuffleExam(MCQ.theory);
 const picks=[],chapters={};
 for(const q of theory){const chapter=String(q.id).split(".")[0];if((chapters[chapter]||0)>=2)continue;picks.push(q.id);chapters[chapter]=(chapters[chapter]||0)+1;if(picks.length===8)break}
 if(picks.length<8)for(const q of theory){if(!picks.includes(q.id))picks.push(q.id);if(picks.length===8)break}
 const ids=picks.concat(shuffleExam(ch.mcq).slice(0,4));
 const order={};ids.forEach(id=>order[id]=shuffleExam([0,1,2,3]));
 /* Chỉ rút tình huống ở sáu nhóm kiến thức cốt lõi, không dùng chủ đề chuyên sâu/ngoài phạm vi. */
  const coreIds=new Set(["DS01","DS02","DS03","DS05","DS06","DS08","DS09","DS13","DS14","DS15","DS17","DS18","DS19","DS20","DS21","DS22","DS23"]);
  const coreCases=BANK.cases.filter(c=>coreIds.has(c.id)&&Array.isArray(c.questions)&&c.questions.length===4);
  if(!coreCases.length)throw Error("Chưa có tình huống tự luận thuộc sáu chủ đề cốt lõi.");
  const essayCase=shuffleExam(coreCases)[0];
 return {essayMode:"mixed12x1",set:"DS-MIX-"+String(Math.floor(Math.random()*90000)+10000),mcq:ids,perm:order,mcqCase:ch.cid,caseIds:[essayCase.id],lt:[],th:[],tl:essayCase.id};
}
function markMCQ(de,ans){
 if(de.essayMode!=="mixed12x1")return {score:0,correct:0,items:[]};
 const ids=de.mcq||[],items=[];let correct=0;
 for(const id of ids){
  const q=MCQ?.questions[id];if(!q)throw Error("Không có câu trắc nghiệm "+id);
  const chosen=ans["mcq_"+id],per=de.perm?.[id]||[0,1,2,3],validChoice=Number.isInteger(chosen)&&chosen>=0&&chosen<4;
  const ok=validChoice&&per[chosen]===q.a;if(ok)correct++;
  items.push({id,selected:validChoice?chosen:null,correct:per.indexOf(q.a),ok,basis:q.b||"",explanation:q.e||""});
 }
 return {score:Math.round(correct*50)/100,correct,items};
}

function note(text){const p=$("#msg");if(p)p.textContent=text}
function err(x){console.error(x);note((x.message||String(x))+(x.code?" (mã lỗi: "+x.code+")":""))}
/* Hộp xác nhận trong trang: trình duyệt trong Zalo/Facebook/Messenger thường chặn confirm() → bấm không có phản ứng. */
function hoi(title,text,ok){return new Promise(res=>{const w=document.createElement("div");
 w.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px";
 w.innerHTML='<div role="dialog" aria-modal="true" style="background:#fff;border-radius:10px;max-width:460px;width:100%;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25)"><h3 style="margin:0 0 8px">'+E(title)+'</h3><p style="margin:0 0 14px">'+E(text)+'</p><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="secondary" data-n>Quay lại</button><button type="button" data-y>'+E(ok||"Đồng ý")+'</button></div></div>';
 document.body.appendChild(w);const done=v=>{w.remove();res(v)};w.querySelector("[data-n]").onclick=()=>done(false);w.querySelector("[data-y]").onclick=()=>done(true)})}
const valid=s=>/^[A-Z0-9_-]{2,24}$/.test(s);
const until=d=>d&&d.toDate?d.toDate():new Date(d);
function access(l){const t=Date.now();return l.open&&(!l.openAt||until(l.openAt).getTime()<=t)&&(!l.closeAt||until(l.closeAt).getTime()>=t)}
async function ensureAnon(){if(auth.currentUser)return auth.currentUser;return(await auth.signInAnonymously()).user}
function navigate(){if(DETACH){DETACH();DETACH=null}clearInterval(TIMER);if(location.hash.startsWith("#quan-tri"))return adminEntry();if(window.QTA){QTA.unmount();QTA.close()}studentEntry()}
window.addEventListener("hashchange",navigate);
function confirmStudentIdentity(ma,sv,hoTen,l){
 return new Promise(resolve=>{
  const old=app.innerHTML;
  app.innerHTML='<article><h2>Xác nhận thông tin sinh viên</h2><p>Kiểm tra thông tin trước khi vào bài kiểm tra. Nếu họ tên không đúng, chọn Quay lại và thông báo giảng viên.</p><div class="case"><p><b>Họ và tên:</b> '+E(hoTen||"(Chưa có họ tên)")+'</p><p><b>Mã sinh viên:</b> '+E(sv)+'</p><p><b>Mã lớp:</b> '+E(ma)+'</p><p><b>Tên lớp:</b> '+E(l.ten||"")+'</p><p><b>Học phần:</b> '+E(l.hocPhanTen||"Luật Dân sự")+'</p><p><b>Thời gian:</b> 40 phút</p></div><button id="identityYes">Xác nhận đúng thông tin và tiếp tục</button><button id="identityNo" class="secondary">Quay lại</button></article>';
  $("#identityYes").onclick=()=>resolve(true);
  $("#identityNo").onclick=()=>{app.innerHTML=old;studentEntry();resolve(false)};
 });
}
function studentEntry(){app.innerHTML=`<article>
<h2>ĐÁNH GIÁ ĐỊNH KỲ</h2>
<p class="mini muted">Học phần: Luật Dân sự</p>
<p class="muted">Hình thức kiểm tra chính thức: <b>Trắc nghiệm kết hợp tự luận</b>. Ngân hàng câu hỏi và đáp án đã được phê duyệt.</p>
<div class="grid"><div class="panel"><strong>12 câu trắc nghiệm</strong><p class="mini muted">08 câu lý thuyết + 04 câu hỏi tình huống</p></div>
<div class="panel"><strong>01 tình huống tự luận</strong><p class="mini muted">04 yêu cầu, trả lời có căn cứ pháp luật</p></div>
<div class="panel"><strong>40 phút</strong><p class="mini muted">Áp dụng chung cho tất cả bài kiểm tra</p></div></div>
<h3>Hướng dẫn trước khi làm bài</h3>
<ol><li>Phần trắc nghiệm có 12 câu, mỗi câu chọn một phương án đúng nhất; mỗi lần hiện một câu, đã chuyển thì không quay lại.</li>
<li>Phần tự luận gồm 01 tình huống và 04 yêu cầu; phân tích, lập luận và nêu căn cứ pháp luật.</li>
<li>Hệ thống phân phối một mã đề ngẫu nhiên; mỗi sinh viên chỉ làm một lần trong đợt kiểm tra.</li>
<li>Bài tự lưu và tự động nộp khi hết thời gian quy định.</li><li>Phần tự luận phải tự gõ, không sao chép, dán được. Mỗi lần rời khỏi trang làm bài đều bị ghi lại; <b>rời trang quá 10 lần, bài bị khóa và tự động nộp</b>.</li></ol>
<form id="entry"><label>Mã lớp kiểm tra</label><input name="ma" required maxlength="24" autocomplete="off" placeholder="Mã lớp giảng viên cung cấp">
<label>Mã sinh viên</label><input name="sv" required maxlength="20" autocomplete="off" placeholder="Mã sinh viên">
<label style="display:flex;gap:9px;align-items:center;font-weight:400"><input id="agree" type="checkbox" style="width:auto" required> Tôi đã đọc quy định kiểm tra định kỳ.</label>
<button type="submit">Xác nhận và vào bài kiểm tra</button></form><p id="msg" class="error"></p></article>`;
const qp=new URLSearchParams(location.search);if(qp.get("ma"))$("#entry").elements.ma.value=qp.get("ma");if(qp.get("sv"))$("#entry").elements.sv.value=qp.get("sv");
$("#entry").onsubmit=async e=>{e.preventDefault();const ma=e.target.ma.value.trim().toUpperCase(),sv=e.target.sv.value.trim().toUpperCase();if(!valid(ma)||!valid(sv)){note("Mã lớp hoặc mã sinh viên không hợp lệ.");return}
try{await ensureAnon();await bankLoad();await loadMCQ();const ls=await db.doc("pnl_dg_lop/"+ma).get(),ss=await db.doc("pnl_dg_sv/"+ma+"__"+sv).get();if(!ls.exists||!ss.exists)throw Error("Không tìm thấy mã lớp hoặc mã sinh viên.");
const l=ls.data();if(l.hocPhan!==COURSE)throw Error("Mã lớp này không thuộc học phần đánh giá định kỳ Luật Dân sự.");
if(!await confirmStudentIdentity(ma,sv,ss.data().hoTen,l))return;
const id=ma+"__"+sv,readPaper=async()=>{try{return await db.doc("pnl_dg_bai/"+id).get()}catch(x){if(x.code==="permission-denied")throw Error("Mã sinh viên này đã bắt đầu hoặc đã nộp bài trên một thiết bị hoặc trình duyệt khác. Mỗi sinh viên chỉ làm một lần, trên một máy. Hãy quay lại đúng máy, trình duyệt đã làm bài, hoặc báo giảng viên mở lại lượt.");throw x}};let old=await readPaper();
if(!old.exists){if(!access(l))throw Error("Bài kiểm tra chưa mở hoặc đã hết hạn.");if(!await hoi("Bắt đầu làm bài","Xác nhận bắt đầu bài đánh giá định kỳ Luật Dân sự (trắc nghiệm kết hợp tự luận). Thời gian 40 phút được tính từ lúc nhận đề; mỗi sinh viên chỉ làm một lần.","Bắt đầu làm bài")){studentEntry();return}await loadMCQ();const de=newMixedExam();
try{await db.doc("pnl_dg_bai/"+id).set({maLop:ma,mssv:sv,hoTen:ss.data().hoTen,uid:auth.currentUser.uid,hocPhan:COURSE,de,essay:JSON.stringify({}),status:"dang-lam",roiTrang:0,startedAt:FV.serverTimestamp()})}catch(x){if(x.code!=="permission-denied")throw x}
old=await readPaper()}
if(!old.exists)throw Error("Không đọc được bài làm. Vui lòng liên hệ giảng viên.");
const b=old.data();if(b.hocPhan!==COURSE)throw Error("Mã sinh viên đã có bài của học phần khác.");SESSION={id,ma,sv,l,b};await loadMCQ();renderExam()}catch(x){err(x)}}}
function answerMap(b){try{return JSON.parse(b.essay||"{}")}catch(x){return{}}}
function renderExam(){
 const S=SESSION,b=S.b;
 if(TIMER){clearInterval(TIMER);TIMER=null}
 if(b.status==="da-nop"){app.innerHTML='<article><h2>Đã nộp bài</h2><p>Hệ thống đã ghi nhận bài của <b>'+E(b.hoTen)+'</b> ('+E(S.sv)+'). Kết quả sẽ được giảng viên công bố.</p><a class="btn secondary" href="../index.html">Về thư viện</a></article>';return}
 const de=b.de||{},mixed=de.essayMode==="mixed12x1",ids=de.caseIds||[];
 if(mixed&&(!Array.isArray(de.mcq)||de.mcq.length!==12||ids.length!==1))throw Error("Đề hỗn hợp không hợp lệ.");
 if(!mixed&&ids.length!==2)throw Error("Đề cũ không hợp lệ.");
 const a=answerMap(b),steps=[];
 if(mixed)de.mcq.forEach((id,i)=>steps.push({kind:"mcq",id,i}));
 ids.forEach((id,i)=>{const c=caseBy(id);if(!c)throw Error("Thiếu tình huống "+id);
  steps.push({kind:"essay",id,i,questions:c.questions,caseText:c.text})});
 /* Tương thích bài đang làm theo giao diện cũ (mỗi yêu cầu là một bước). */
 const step=Math.max(0,Math.min(steps.length-1,Number.isInteger(b.step)?b.step:0));
 const current=steps[step],last=step===steps.length-1,started=until(b.startedAt).getTime(),total=40*60000;
 /* Hạn nộp = 40 phút kể từ khi nhận đề, nhưng không vượt giờ đóng lớp. */
 let deadline=started+total;if(S.l&&S.l.closeAt){const c=until(S.l.closeAt).getTime();if(c&&c<deadline)deadline=c}
 let h='<article><div class="top"><div><h2>Luật Dân sự – Mã đề '+E(de.set)+'</h2><span class="muted">'+E(b.hoTen)+' · '+E(S.sv)+'</span></div><div><strong id="clock" class="score"></strong><div id="saveStatus" class="mini muted">Tự động lưu bài</div></div></div><p class="warn">'+(current.kind==="mcq"?'Câu trắc nghiệm '+(step+1)+'/'+(mixed?de.mcq.length:0)+'. Mỗi lần hiển thị một câu; không thể quay lại.':'Phần tự luận: hiển thị toàn bộ tình huống và các yêu cầu để trả lời cùng lúc.')+' Hết 40 phút bài tự nộp.</p></article>';
 h+='<article><h3>'+(current.kind==="mcq"?'PHẦN I. TRẮC NGHIỆM — Câu '+(step+1):'PHẦN II. TỰ LUẬN — Tình huống '+(current.i+1))+'</h3>';
 if(current.kind==="mcq"){
   const q=MCQ?.questions[current.id];if(!q)throw Error("Thiếu câu trắc nghiệm "+current.id);
   if(current.i>=8){const c=MCQ.contexts.find(x=>x.cid===de.mcqCase);if(c)h+='<div class="case">'+E(c.text)+'</div>'}
   const perm=de.perm?.[current.id]||[0,1,2,3],selected=a["mcq_"+current.id];
   h+='<div class="q"><strong>'+E(q.q)+'</strong>';
   for(let j=0;j<4;j++){h+='<label style="display:flex;align-items:flex-start;gap:9px;font-weight:400"><input type="radio" name="currentMcq" value="'+j+'" style="width:auto;margin-top:4px"'+(selected===j?' checked':'')+'> <span>'+"ABCD"[j]+'. '+E(q.o[perm[j]])+'</span></label>'}
   h+='</div>';
 }else{
   h+='<div class="case" style="white-space:pre-wrap"><strong>Đề bài — Tình huống đầy đủ</strong><p>'+E(current.caseText)+'</p></div>';
   current.questions.forEach((question,j)=>{
     h+='<div class="q"><strong>Yêu cầu '+(j+1)+'. '+E(question)+'</strong><textarea data-essay-key="'+E(current.id+"_"+j)+'" maxlength="2300" placeholder="Trình bày câu trả lời, lập luận và căn cứ pháp luật">'+E(a[current.id+"_"+j]||"")+'</textarea></div>';
   });
 }
 h+='</article><article><button id="saveNow" class="secondary">Lưu nháp</button><button id="nextStep">'+(last?'Nộp bài':'Lưu và sang câu tiếp theo')+'</button><p id="msg" class="error"></p></article>';
 app.innerHTML=h;
 let dirty=false,lastSave=Date.now();
 const gather=()=>{const values=Object.assign({},answerMap(SESSION.b));
   if(current.kind==="mcq"){const el=$('input[name="currentMcq"]:checked');if(el)values["mcq_"+current.id]=Number(el.value)}

/* Đáp án tự luận được mã hóa trên web (sinh viên không tải được bản rõ).
   Khóa giải mã nhập một lần ở trang quản trị, lưu vào kho chỉ quản trị đọc được (Firestore) nên các máy sau tự dùng. */
const KHOA_DOC="pnl_dg_cham/_khoa-dap-an-ds",KHOA_LS="pnl-khoa-dap-an-ds";
async function decryptAutoKey(code){
 const r=await fetch("./de/luat-dan-su-tu-luan-rubric.enc.json",{cache:"no-cache"});if(!r.ok)throw Error("Không tải được tệp đáp án mã hóa.");
 const c=await r.json(),secret=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(c.salt),iterations:c.rounds,hash:"SHA-256"},secret,{name:"AES-GCM",length:256},false,["decrypt"]);
 let zipped;try{zipped=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(c.iv)},key,b64ToBytes(c.payload))}catch(x){throw Error("Khóa đáp án không đúng.")}
 const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream("deflate"));
 return JSON.parse(await new Response(stream).text());
}
let AUTOKEY_P=null;
function loadAutoKey(){if(RUBRIC)return Promise.resolve(RUBRIC);if(!AUTOKEY_P)AUTOKEY_P=loadAutoKeyOnce().finally(()=>{AUTOKEY_P=null});return AUTOKEY_P}
async function loadAutoKeyOnce(){
 if(RUBRIC)return RUBRIC;
 let code="";
 try{const k=await db.doc(KHOA_DOC).get();if(k.exists)code=k.data().k||""}catch(x){console.warn(x)}
 if(!code){try{code=localStorage.getItem(KHOA_LS)||""}catch(x){}}
 let d=null,fresh=false;
 while(!d){
  if(!code){code=(prompt("Nhập khóa đáp án tự luận Luật Dân sự (chỉ cần nhập một lần):")||"").trim().toUpperCase();fresh=true;if(!code)throw Error("Chưa có khóa đáp án nên chưa chấm tự động được. Mở lại lớp để nhập khóa.")}
  try{d=await decryptAutoKey(code)}catch(x){if(!fresh)console.warn(x);alert(x.message);code=""}
 }
 if(!Array.isArray(d.cases)||d.cases.length!==30||!d.cases.every(x=>x.answers?.length===4))throw Error("Dữ liệu đáp án không hợp lệ.");
 if(fresh){try{localStorage.setItem(KHOA_LS,code)}catch(x){}try{await db.doc(KHOA_DOC).set({k:code,luc:FV.serverTimestamp()})}catch(x){console.warn("Không lưu khóa lên kho quản trị",x)}}
 RUBRIC={case_bank:d.cases.map(x=>({id:x.id,answer:x.answers}))};
 return RUBRIC;
}
function gradeAutomatic(b){
 const de=b.de||{},mixed=de.essayMode==="mixed12x1",ids=de.caseIds||[];
 if(mixed?(ids.length!==1||de.mcq?.length!==12):ids.length!==2)throw Error("Mã đề không hợp lệ");
 const ans=answerMap(b),scores=[],report=[];
 for(const id of ids)for(let j=0;j<4;j++){
  const key=id+"_"+j,g=guideFor(id,j);if(!g)throw Error("Thiếu đáp án "+id+"/"+j);
  const ev=legalGrade(ans[key]||"",g);
  const pts=mixed?Math.round(ev.score*.8*100)/100:ev.score;
  scores.push(pts);report.push({id,question:j+1,score:pts,matched:ev.hits.map(x=>x.clause),missing:ev.missing});
 }
 const essay=Math.round(scores.reduce((a,b)=>a+b,0)*100)/100;
 const tn=mixed?markMCQ(de,ans):{score:0,correct:0,items:[]};
 return {diem:Math.round((essay+tn.score)*100)/100,tuLuan:essay,tracNghiem:tn.score,soCauDung:tn.correct,chiTietTN:tn.items,muc:scores,chiTiet:report};
}
/* 09/11/2026: chấm tự luận rộng tay (mỗi yêu cầu: 0,5 trả lời đúng hướng + 0,5 nội dung). Bài máy chấm theo bản cũ được chấm lại; bài giảng viên đã chấm giữ nguyên. */
const GRADE_POLICY="2026-11-09-v4";
/* Bài làm theo đề cũ 30+10+1 (học phần luat-dan-su) nằm trong lớp đã chuyển: chấm ở quản trị chung (index.html#quan-tri/<lớp>/de-cu). */
const laDeCu=b=>!!b&&!!b.de&&!b.de.essayMode&&!b.de.caseIds&&(b.hocPhan==="luat-dan-su"||(Array.isArray(b.de.lt)&&b.de.lt.length>0));
async function markPending(ma,papers,grades){
 const entries=Object.entries(papers).filter(([sv,b])=>b.status==="da-nop"&&!laDeCu(b)&&(!grades[sv]?.xacNhan||(grades[sv].nguon==="tu-dong"&&grades[sv].gradePolicyVersion!==GRADE_POLICY)));
 if(!entries.length)return {done:0,errors:[]};
 try{await Promise.all([loadAutoKey(),loadMCQ()])}catch(x){return {done:0,errors:[x.message||String(x)]}}
 let done=0,errors=[];
 for(const [sv,b] of entries){
  try{
   const r=gradeAutomatic(b);
   const saved={maLop:ma,mssv:sv,diem:r.diem,tuLuan:r.tuLuan,tracNghiem:r.tracNghiem,soCauDung:r.soCauDung,chiTietTN:r.chiTietTN,muc:r.muc,chiTiet:r.chiTiet,nguon:"tu-dong",gradePolicyVersion:GRADE_POLICY,cu:grades[sv]&&grades[sv].nguon==="tu-dong"?{diem:grades[sv].diem,tuLuan:grades[sv].tuLuan,v:grades[sv].gradePolicyVersion||""}:null,xacNhan:true,note:"Chấm tự động theo dấu hiệu nội dung đáp án; giảng viên có quyền điều chỉnh.",hocPhan:COURSE,luc:FV.serverTimestamp()};
   await db.doc("pnl_dg_cham/"+ma+"__"+sv).set(saved);
   grades[sv]=saved;done++;
  }catch(e){errors.push(sv+": "+e.message)}
 }
 return {done,errors};
}

async function migrateLegacyClasses(){
 const btn=$("#migrateOld");if(btn)btn.disabled=true;
 try{
  const q=await db.collection("pnl_dg_lop").where("hocPhan","==","luat-dan-su").get();

  const typed=prompt("Để xác nhận xóa dữ liệu cũ và chuyển lớp, nhập đúng: CHUYEN TU LUAN");
  if(typed!=="CHUYEN TU LUAN"){note("Đã hủy chuyển đổi.");return}
  let done=0,deletedB=0,deletedG=0;
  for(const r of rows){
   /* Khóa ngay trước khi xóa để ngăn phát đề trắc nghiệm từ phiên đang mở */
   await r.cls.ref.update({open:false});
   const docs=[...r.b.docs,...r.g.docs];
   for(let i=0;i<docs.length;i+=350){
    const batch=db.batch();

    await batch.commit();
   }
   /* Quét lại để loại bài/điểm phát sinh trong khi chuyển đổi */
   for(const col of ["pnl_dg_bai","pnl_dg_cham"]){

     const more=await db.collection(col).where("maLop","==",r.ma).limit(350).get();

   }
   const now=Date.now(),newClose=now+7*86400000;
   await r.cls.ref.update({
     hocPhan:COURSE,hocPhanTen:"Luật Dân sự – Đánh giá định kỳ (trắc nghiệm + tự luận)",
     thoiGian:40,open:false,
     openAt:TS.fromDate(new Date(now-60000)),
     closeAt:TS.fromDate(new Date(newClose)),
     migratedFrom:"luat-dan-su",migratedAt:FV.serverTimestamp(),
     migratedOldPaperCount:r.b.size,migratedOldGradeCount:r.g.size
   });
   deletedB+=r.b.size;deletedG+=r.g.size;done++;
   note("Đã chuyển "+done+"/"+rows.length+" lớp. Lớp đang khóa; cần kiểm tra trước khi mở.");
  }

 }catch(x){console.error(x);note("Chuyển đổi gián đoạn: "+(x.message||x)+". Các lớp đã hoàn tất giữ nguyên; lớp chưa hoàn tất vẫn khóa. Kiểm tra trước khi chạy lại.");}
 finally{const b=$("#migrateOld");if(b)b.disabled=false}
}

/* Thống nhất danh sách sinh viên: MSSV; Họ tên hoặc Họ tên; MSSV */
function parseStudentRows(text){
 const rows=[],seen=new Set();
 for(const ln of String(text||"").split(/\r?\n/)){
  const line=ln.trim();if(!line)continue;
  let pair=line.split(/[;\t]/).map(x=>x.trim());
  if(pair.length<2)pair=line.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
  if(pair.length<2)continue;
  let a=pair[0],b=pair.slice(1).join(" ").trim();
  const isCode=x=>/^[A-Z0-9_-]{2,24}$/i.test(x)&&(/\d/.test(x)||x===x.toUpperCase());
  if(!isCode(a)&&isCode(b)){const tmp=a;a=b;b=tmp}
  a=a.toUpperCase();
  if(!isCode(a)||!b||/^(mssv|mã sinh viên|ma sinh vien|student id)$/i.test(a))continue;
  if(seen.has(a))throw Error("Mã sinh viên trùng: "+a);
  seen.add(a);rows.push({mssv:a,hoTen:b});
 }
 return rows;
}
async function readRosterFile(file){
 if(!file)return "";
 const ext=(file.name.split(".").pop()||"").toLowerCase();
 if(ext==="xlsx"||ext==="xls"){
  if(!window.XLSX)await new Promise((resolve,reject)=>{const el=document.createElement("script");el.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";el.onload=resolve;el.onerror=()=>reject(Error("Không tải được công cụ đọc Excel."));document.head.appendChild(el)});
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),sheet=wb.Sheets[wb.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
  return matrix.map(r=>r.slice(0,2).map(x=>String(x).trim()).join("; ")).join("\n");
 }
 return file.text();
}
async function saveStudents(ma,rows,previous=[]){
 const previousIds=new Set(previous.map(x=>x.mssv)),ids=new Set(rows.map(x=>x.mssv));
 const deletions=previous.filter(x=>!ids.has(x.mssv));
 if(deletions.length){
  const ongoing=await db.collection("pnl_dg_bai").where("maLop","==",ma).get();
  const active=ongoing.docs.filter(x=>deletions.some(d=>d.mssv===x.data().mssv));
  if(active.length)throw Error("Không được xóa sinh viên đã có bài kiểm tra. Hãy giữ sinh viên trong danh sách.");
 }
 const tasks=[];
 for(const x of deletions)tasks.push(b=>b.delete(db.doc("pnl_dg_sv/"+ma+"__"+x.mssv)));
 for(const x of rows)tasks.push(b=>b.set(db.doc("pnl_dg_sv/"+ma+"__"+x.mssv),{maLop:ma,mssv:x.mssv,hoTen:x.hoTen},{merge:true}));
 tasks.push(b=>b.set(db.doc("pnl_dg_ds/"+ma),{rows,updated:FV.serverTimestamp()}));
 tasks.push(b=>b.set(db.doc("pnl_dg_lop/"+ma),{siSo:rows.length},{merge:true}));
 for(let i=0;i<tasks.length;i+=350){const batch=db.batch();tasks.slice(i,i+350).forEach(fn=>fn(batch));await batch.commit()}
}

   <div class="qta-card"><h3>Xóa lớp</h3><p class="qta-msg" style="margin-top:0">Xóa lớp, danh sách sinh viên, bài làm và điểm. Không khôi phục được — nên Export excel bảng điểm trước.</p><button class="qb lock" type="button" id="s-del">Xóa lớp ${E(l.id)}</button></div>`});
 body.querySelector("#s-save").onclick=async()=>{const A=new Date($("#s-a").value),B=new Date($("#s-b").value);if(isNaN(A)||isNaN(B)||B<=A){note("Giờ đóng phải sau giờ mở.");return}
  try{await db.doc("pnl_dg_lop/"+l.id).set({ten:$("#s-ten").value.trim(),namHoc:$("#s-nh").value.trim(),openAt:TS.fromDate(A),closeAt:TS.fromDate(B),apag:{tenMon:$("#ap-mon").value.trim(),tenLopTc:$("#ap-lop").value.trim(),hocKy:$("#ap-hk").value.trim(),soTc:$("#ap-tc").value.trim()}},{merge:true});manageClass(l.id,"cai")}catch(x){err(x)}};
 body.querySelector("#s-del").onclick=async()=>{if(!await QTA.ask("Xóa lớp "+l.id,"Toàn bộ danh sách, bài làm và điểm của lớp <b>"+E(l.id)+"</b> sẽ bị xóa vĩnh viễn.","Xóa vĩnh viễn",true))return;
  try{const refs=[];for(const c of ["pnl_dg_sv","pnl_dg_bai","pnl_dg_cham"]){(await db.collection(c).where("maLop","==",l.id).get()).docs.forEach(d=>refs.push(d.ref))}
   refs.push(db.doc("pnl_dg_ds/"+l.id),db.doc("pnl_dg_lop/"+l.id));for(let i=0;i<refs.length;i+=350){const b=db.batch();refs.slice(i,i+350).forEach(r=>b.delete(r));await b.commit()}
   location.hash="#quan-tri"}catch(x){QTA.info("Không xóa được: "+E(x.code||x.message))}};
}
function normalize(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(x=>x.length>3)}
function similarity(a,b){const A=new Set(normalize(a)),B=new Set(normalize(b));if(!A.size||!B.size)return 0;let n=0;A.forEach(w=>{if(B.has(w))n++});return Math.round(100*n/B.size)}

/* Đề xuất điểm theo ý pháp lý: chỉ là trợ giúp, không phải quyết định tự động.
   Đáp án chỉ giải mã trong phiên quản trị hoặc được chọn từ tệp nội bộ. */
/* Chấm tự luận rộng tay (09/11/2026): mỗi yêu cầu 1 điểm = 0,5 trả lời đúng hướng (có viết, có nội dung liên quan đến yêu cầu)
   + 0,5 nội dung (điều luật, số liệu, cụm ý của đáp án; "hiểu ý là được" — khoảng 1/3 ý đặc trưng là đủ điểm).
   Cụm từ được tính trọng số theo độ đặc trưng trong toàn ngân hàng đáp án (từ chung chung như "thỏa thuận", "quy định" nặng ít). */
const STOP_TL=new Set("va hoac la cua cac nhung mot hai ba nay do thi neu khi de voi cho trong theo tai ve tu den duoc bi phai can co khong chua da se dang rang nhu vay ma nen con cung deu moi anh chi ong ba em toi ho no kia day sau truoc ra vao len xuong nao gi".split(" "));
const BO_TIEN_TO=/^\s*(định hướng đáp án( và phân hóa trường hợp)?|gợi ý|đáp án)\s*:\s*/i;
const kd=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/đ/g,"d");
function amTiet(s){return kd(s).replace(/(\d+(?:[.,]\d+)?)\s*%/g," $1phantram ").replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean)}
function capTu(s){const t=amTiet(s),out=new Set();for(let i=0;i<t.length-1;i++){const a=t[i],b=t[i+1];if(STOP_TL.has(a)||STOP_TL.has(b)||/^\d+$/.test(a)||/^\d+$/.test(b))continue;out.add(a+" "+b)}return out}
function tuDon(s){return new Set(amTiet(s).filter(w=>w.length>2&&!STOP_TL.has(w)&&!/^\d+$/.test(w)))}
/* "Điều 463, 466", "Điều 463 và Điều 466", "khoản 4 Điều 466" → {463,466} */
function dieuLuat(s){const v=new Set(),t=kd(s),re=/dieu\s*(\d{1,3})((?:\s*(?:,|va|;|\/)\s*(?:dieu\s*)?\d{1,3}(?![\d%]))*)/g;let m;while((m=re.exec(t))){v.add(m[1]);(m[2].match(/\d{1,3}/g)||[]).forEach(x=>v.add(x))}return v}
/* số liệu: tỷ lệ % và số tiền/diện tích/thời hạn (không tính số điều luật, năm ban hành) */
function soLieu(s){const v=new Set(),d=dieuLuat(s),t=amTiet(s);t.forEach((w,i)=>{if(/^\d+(?:[.,]\d+)?phantram$/.test(w))v.add(w);else if(/^\d+$/.test(w)&&!d.has(w)&&!/^(19|20)\d\d$/.test(w)&&/^(trieu|ty|nghin|dong|m2|thang|ngay|nam|lan)$/.test(t[i+1]||""))v.add(w+" "+t[i+1])});return v}
let DF=null,NDOC=1;
function hocNganHang(answers){DF=new Map();NDOC=answers.length||1;answers.forEach(a=>{const s=String(a||"").replace(BO_TIEN_TO,"");new Set([...capTu(s),...tuDon(s)]).forEach(k=>DF.set(k,(DF.get(k)||0)+1))})}
const W=k=>DF?Math.log((NDOC+1)/((DF.get(k)||0)+1))+0.15:1;
function legalGrade(essay,answer){
 if(!DF&&RUBRIC&&RUBRIC.case_bank)hocNganHang(RUBRIC.case_bank.flatMap(c=>c.answer||[]));
 const ans=String(answer||"").replace(BO_TIEN_TO,""),e=String(essay||"").trim();
 if(!e)return {score:0,diem:0,t1:0,t2:0,parts:[0,0,0,0],hits:[],missing:["(bỏ trống)"],warning:"Bỏ trống"};
 const A2=capTu(ans),E2=capTu(e),A1=tuDon(ans),E1=tuDon(e),Ad=dieuLuat(ans),Ed=dieuLuat(e),As=soLieu(ans),Es=soLieu(e);
 const hit2=[...A2].filter(x=>E2.has(x)),hit1=[...A1].filter(x=>E1.has(x)),hitD=[...Ad].filter(x=>Ed.has(x)),hitS=[...As].filter(x=>Es.has(x));
 const sum=xs=>xs.reduce((a,k)=>a+W(k),0);
 const cum=Math.min(1,sum(hit2)/(0.3*sum([...A2])||1)),tu=Math.min(1,sum(hit1)/(0.35*sum([...A1])||1));
 const yNghia=Math.max(cum,0.5*tu);
 const soTu=amTiet(e).length;
 /* Tiêu chí 1 (0,5): có trả lời, nội dung liên quan đến yêu cầu */
 const lienQuan=hitD.length>0||hitS.length>0||cum>=0.25;
 const t1=soTu>=5&&lienQuan?0.5:soTu>=3&&cum>=0.1?0.25:0;
 /* Tiêu chí 2 (0,5): nội dung */
 let nd=Ad.size?0.6*yNghia+0.4*(hitD.length/Ad.size):yNghia;
 if(As.size)nd+=0.2*(hitS.length/As.size);
 const t2=t1>0?Math.round(Math.min(1,nd)*0.5*20)/20:0;
 const pts=Math.round((t1+t2)*100)/100;
 return {score:Math.round(pts*1.25*100)/100,diem:pts,t1,t2,parts:[t1,t2,0,0],
  hits:[...hitD.map(x=>({clause:"Điều "+x})),...hitS.map(x=>({clause:x.replace("phantram","%")})),...hit2.sort((a,b)=>W(b)-W(a)).slice(0,10).map(x=>({clause:x}))],
  missing:[...Ad].filter(x=>!Ed.has(x)).map(x=>"Chưa nêu Điều "+x),
  warning:t1===0?"Không nhận diện được nội dung liên quan; giảng viên xem lại.":"Trả lời: "+String(t1).replace(".",",")+" · Nội dung: "+String(t2).replace(".",",")};
}
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptRubric(password){
 const r=await fetch("./de/luat-dan-su-tu-luan-key.enc.json",{cache:"no-store"});if(!r.ok)throw Error("Chưa tìm thấy đáp án mã hóa trên web.");
 const c=await r.json(),enc=new TextEncoder(),secret=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(c.salt),iterations:c.rounds,hash:"SHA-256"},secret,{name:"AES-GCM",length:256},false,["decrypt"]);
 const zipped=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(c.iv)},key,b64ToBytes(c.payload));
 const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream("deflate"));
 const d=JSON.parse(await new Response(stream).text());
 if(!Array.isArray(d.case_bank)||d.case_bank.length!==30)throw Error("Đáp án không hợp lệ.");
 RUBRIC=d;return d;
}

function guideFor(id,j){const c=RUBRIC&&RUBRIC.case_bank.find(x=>x.id===id);if(!c)return"";const a=c.answer||[];return a.length===4?a[j]:(a[j*2+1]||"")}
async function grade(ma,sv,b,g){
 try{await Promise.all([loadAutoKey(),loadMCQ()])}catch(x){console.error(x)}
 if(!RUBRIC||!MCQ){QTA.info('Chưa có khóa đáp án hoặc lỗi kết nối nên chưa mở được bài chấm.','Không tải được đáp án');return}
 const de=b.de||{},mixed=de.essayMode==="mixed12x1",ids=de.caseIds||[],ans=answerMap(b),max=mixed?1:1.25;
 const auto=gradeAutomatic(b),tn=mixed?markMCQ(de,ans):{score:0,correct:0,items:[]};
 let h='<article><div class="top"><h2>Chấm bài · '+E(sv)+'</h2><button id="back" class="secondary">Trở lại lớp</button></div><p class="warn">Máy tự chấm theo ngân hàng đáp án. Phần trắc nghiệm được so với đáp án đúng; điểm tự luận dựa trên dấu hiệu lập luận và căn cứ. Giảng viên có thể hiệu chỉnh kết quả tự luận.</p></article>';
 if(mixed){
  h+='<article><h3>Phần I. Trắc nghiệm: '+tn.correct+'/12 câu đúng – '+tn.score.toFixed(1)+' / 6 điểm</h3>';
  tn.items.forEach((x,i)=>{const q=MCQ.questions[x.id],selected=x.selected===null?"Chưa trả lời":"ABCD"[x.selected],right="ABCD"[x.correct];
   if(i===8){const c=MCQ.contexts.find(c=>c.cid===de.mcqCase);if(c)h+='<div class="case">'+E(c.text)+'</div>'}
   h+='<details><summary>Câu '+(i+1)+' · '+(x.ok?'Đúng':'Sai')+' · '+E(q.q)+'</summary><p>Chọn: '+selected+'; đáp án: '+right+'</p><p>'+E(q.e||"")+'</p><p class="muted">'+E(q.b||"")+'</p></details>';
  });h+='</article>';
 }
 h+='<article><h3>Phần '+(mixed?'II':'tự luận')+'. Tự luận ('+(mixed?'4':'10')+' điểm)</h3>';
 ids.forEach((id,i)=>{const c=caseBy(id);if(!c)throw Error("Thiếu tình huống "+id);
  h+='<h3>Tình huống '+(i+1)+' · '+E(id)+'</h3><div class="case">'+E(c.text)+'</div>';
  c.questions.forEach((q,j)=>{
   const key=id+"_"+j,guide=guideFor(id,j),input=ans[key]||"",pos=i*4+j;
   const ev=legalGrade(input,guide),suggested=mixed?Math.round(ev.score*.8*100)/100:ev.score;
   const selected=g?.muc?.[pos]!=null?g.muc[pos]:suggested;
   h+='<div class="q"><strong>'+E(q)+'</strong><div class="ans">'+E(input||"(Không trả lời)")+'</div><details><summary>Đáp án và các ý còn thiếu</summary><div class="ans">'+E(guide)+'</div>'+(ev.missing.length?'<p>Các ý cần rà soát:</p><ul>'+ev.missing.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'')+'</details>'+(ev.hits&&ev.hits.length?'<p class="mini">Ý trùng với đáp án: '+ev.hits.map(x=>E(x.clause)).join(' · ')+'</p>':'')+'<p class="mini muted">'+E(ev.warning||'')+'. Điểm máy gợi ý: '+suggested.toFixed(2)+' / '+max.toFixed(2)+' điểm</p><label>Điểm tự luận (0 – '+max.toFixed(2)+')</label><input data-point="'+pos+'" type="number" min="0" max="'+max+'" step="0.05" value="'+E(selected)+'"></div>';
  });
 });h+='</article><article><div class="top"><span>Tổng điểm</span><strong class="score" id="total"></strong></div><label>Nhận xét</label><textarea id="review" maxlength="1000">'+E(g?.note||"")+'</textarea><button id="saveGrade">Lưu điểm đã điều chỉnh</button><p id="msg" class="error"></p></article>';
 const svName=(TLC&&TLC.ma===ma&&(TLC.students.find(x=>x.mssv===sv)||{}).hoTen)||"";
 tlShell({side:tlSide(ma,"ds"),crumbs:[{t:"Quản trị",href:"./index.html#quan-tri"},{t:"Luật Dân sự",href:"#quan-tri"},{t:"Lớp "+ma,href:"#quan-tri/"+encodeURIComponent(ma)},{t:"Chấm bài · "+sv+(svName?" · "+svName:"")}],
  actions:[{id:"bk",label:"Trở lại danh sách",kind:"ghost",onClick:()=>manageClass(ma,"ds")}],body:h});
 $("#back").onclick=()=>manageClass(ma,"ds");
 const points=()=>[...document.querySelectorAll("[data-point]")].map(x=>Math.max(0,Math.min(max,Number(x.value)||0)));
 const calc=()=>{const v=points(),essay=Math.round(v.reduce((a,b)=>a+b,0)*100)/100,total=Math.round((essay+tn.score)*100)/100;
  $("#total").textContent=(mixed?tn.score.toFixed(2)+' + '+essay.toFixed(2)+' = ':'')+total.toFixed(2)+'/10';
  return {v,essay,total};
 };
 document.querySelectorAll("[data-point]").forEach(x=>x.oninput=calc);calc();
 $("#saveGrade").onclick=async()=>{
  const {v,essay,total}=calc();
  if(!confirm("Lưu điểm "+total.toFixed(2)+"/10 cho "+sv+"?"))return;
  try{
   await db.doc("pnl_dg_cham/"+ma+"__"+sv).set({maLop:ma,mssv:sv,muc:v,tuLuan:essay,tracNghiem:tn.score,soCauDung:tn.correct,diem:total,nguon:"giang-vien",xacNhan:true,note:$("#review").value.trim(),hocPhan:COURSE,maDe:de.set||"",phienBanDapAn:"mixed-2026-11-07",chamBoi:auth.currentUser?.uid||"",luc:FV.serverTimestamp()});
   manageClass(ma,"ds");
  }catch(e){err(e)}
 };
}
