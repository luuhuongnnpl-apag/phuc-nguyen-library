<script>
"use strict";
const COURSE="luat-dan-su-tu-luan",ADMIN_UID="smoIpuX7qseqTeu9nToc9RYigku1";
const ADMINS=["luuhuong.nnpl@gmail.com","luuhuong.dhnv@gmail.com"];
const cfg={apiKey:"AIzaSyCIYY-dzhJ4rUYsXvBQivIxcziUC3hR1-U",authDomain:"phuc-nguyen-library.firebaseapp.com",projectId:"phuc-nguyen-library",storageBucket:"phuc-nguyen-library.firebasestorage.app",messagingSenderId:"842652271567",appId:"1:842652271567:web:23b95b5c4d6061497988ba"};
firebase.initializeApp(cfg);
const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp,app=document.getElementById("app");
const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const isAdmin=u=>u&&!u.isAnonymous&&(u.uid===ADMIN_UID||(u.emailVerified&&ADMINS.includes(u.email)));
let BANK=null,SESSION=null,TIMER=null,RUBRIC=null,CURRENT=null;
const caseBy=id=>BANK.cases.find(c=>c.id===id);
async function bankLoad(){if(BANK)return BANK;const r=await fetch("./de/luat-dan-su-tu-luan.b64",{cache:"no-cache"});if(!r.ok)throw Error("Không tải được ngân hàng đề.");
const data=atob((await r.text()).trim()),bytes=Uint8Array.from(data,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
BANK=JSON.parse(await new Response(stream).text());if(BANK.cases.length!==30||BANK.exam_sets.length!==15)throw Error("Ngân hàng đề không hợp lệ.");return BANK}
function note(text){const p=$("#msg");if(p)p.textContent=text}
function err(x){console.error(x);note(x.message||String(x))}
const valid=s=>/^[A-Z0-9_-]{2,24}$/.test(s);
const until=d=>d&&d.toDate?d.toDate():new Date(d);
function access(l){const t=Date.now();return l.open&&(!l.openAt||until(l.openAt).getTime()<=t)&&(!l.closeAt||until(l.closeAt).getTime()>=t)}
async function ensureAnon(){if(auth.currentUser)return auth.currentUser;return(await auth.signInAnonymously()).user}
function navigate(){clearInterval(TIMER);if(location.hash.startsWith("#quan-tri"))return adminEntry();studentEntry()}
window.addEventListener("hashchange",navigate);
function studentEntry(){app.innerHTML='<article><h2>Đánh giá định kỳ – Tự luận Luật Dân sự</h2><p>Mỗi bài gồm 02 tình huống, mỗi tình huống 04 yêu cầu và tối đa 05 điểm. Sinh viên chỉ được làm một bài cho mỗi đợt.</p><div class="warn">Ngân hàng tình huống đã được phê duyệt để sử dụng cho đánh giá định kỳ Luật Dân sự. Chỉ những lớp được giảng viên mở mới được làm bài.</div><form id="entry"><label>Mã lớp</label><input name="ma" required maxlength="24" autocomplete="off"><label>Mã sinh viên</label><input name="sv" required maxlength="20" autocomplete="off"><button type="submit">Vào bài kiểm tra</button></form><p id="msg" class="error"></p></article>';
const qp=new URLSearchParams(location.search);if(qp.get("ma"))$("#entry").elements.ma.value=qp.get("ma");if(qp.get("sv"))$("#entry").elements.sv.value=qp.get("sv");
$("#entry").onsubmit=async e=>{e.preventDefault();const ma=e.target.ma.value.trim().toUpperCase(),sv=e.target.sv.value.trim().toUpperCase();if(!valid(ma)||!valid(sv)){note("Mã lớp hoặc mã sinh viên không hợp lệ.");return}
try{await ensureAnon();await bankLoad();const ls=await db.doc("pnl_dg_lop/"+ma).get(),ss=await db.doc("pnl_dg_sv/"+ma+"__"+sv).get();if(!ls.exists||!ss.exists)throw Error("Không tìm thấy mã lớp hoặc mã sinh viên.");
const l=ls.data();if(l.hocPhan!==COURSE)throw Error("Mã lớp này không thuộc hình thức tự luận Luật Dân sự.");
const id=ma+"__"+sv;let old=await db.doc("pnl_dg_bai/"+id).get();
if(!old.exists){if(!access(l))throw Error("Bài kiểm tra chưa mở hoặc đã hết hạn.");const n=Math.floor(Math.random()*BANK.exam_sets.length),pair=BANK.exam_sets[n];const de={essayMode:"ds2",set:pair.code,caseIds:pair.cases,lt:[],th:[],tl:null,perm:{}};
try{await db.doc("pnl_dg_bai/"+id).set({maLop:ma,mssv:sv,hoTen:ss.data().hoTen,uid:auth.currentUser.uid,hocPhan:COURSE,de,essay:JSON.stringify({}),status:"dang-lam",roiTrang:0,startedAt:FV.serverTimestamp()})}catch(x){if(x.code!=="permission-denied")throw x}
old=await db.doc("pnl_dg_bai/"+id).get()}
if(!old.exists)throw Error("Không đọc được bài làm. Vui lòng liên hệ giảng viên.");
const b=old.data();if(b.hocPhan!==COURSE)throw Error("Mã sinh viên đã có bài của học phần khác.");SESSION={id,ma,sv,l,b};renderExam()}catch(x){err(x)}}}
function answerMap(b){try{return JSON.parse(b.essay||"{}")}catch(x){return{}}}
function renderExam(){const S=SESSION,b=S.b;if(b.status==="da-nop"){app.innerHTML='<article><h2>Đã nộp bài</h2><p>Hệ thống đã ghi nhận bài làm của <b>'+E(b.hoTen)+'</b> ('+E(S.sv)+'). Điểm được công bố sau khi giảng viên xác nhận.</p><a class="btn secondary" href="../index.html">Về thư viện</a></article>';return}
const ids=b.de.caseIds||[];if(ids.length!==2)throw Error("Dữ liệu mã đề không hợp lệ.");
const a=answerMap(b),total=(Number(S.l.thoiGian)||60)*60000;const started=until(b.startedAt).getTime();let h='<article><div class="top"><div><h2>Luật Dân sự – Mã đề '+E(b.de.set)+'</h2><span class="muted">'+E(b.hoTen)+' · '+E(S.sv)+'</span></div><div><strong id="clock" class="score"></strong><div id="saveStatus" class="mini muted">Tự động lưu bài</div></div></div><p class="warn">Thang điểm 10: hai tình huống, mỗi tình huống 5 điểm. Hết giờ bài tự nộp. Không làm mới hoặc chuyển sang thiết bị khác.</p></article>';
ids.forEach((id,i)=>{const c=caseBy(id);if(!c)throw Error("Thiếu tình huống "+id);h+='<article><h3>Câu '+(i+1)+' (5 điểm)</h3><div class="case">'+E(c.text)+'</div>';
c.questions.forEach((q,j)=>{const key=id+"_"+j;h+='<div class="q"><strong>'+E(q)+'</strong><textarea maxlength="2300" data-key="'+E(key)+'" placeholder="Trình bày câu trả lời">'+E(a[key]||"")+'</textarea><div class="mini muted">Tối đa 1,25 điểm</div></div>'});h+='</article>'});
h+='<article><button id="saveNow" class="secondary">Lưu nháp</button><button id="submitNow">Nộp bài</button><p id="msg" class="error"></p></article>';app.innerHTML=h;
let dirty=false;const gather=()=>{const m={};document.querySelectorAll("[data-key]").forEach(t=>m[t.dataset.key]=t.value);return m};
async function save(final=false){if(!SESSION||SESSION.b.status==="da-nop")return;const ans=JSON.stringify(gather());try{const update={essay:ans,luu:FV.serverTimestamp()};if(final){update.status="da-nop";update.submittedAt=FV.serverTimestamp()}await db.doc("pnl_dg_bai/"+SESSION.id).update(update);SESSION.b.essay=ans;dirty=false;$("#saveStatus").textContent=final?"Đã nộp":"Đã lưu lúc "+new Date().toLocaleTimeString("vi-VN");
if(final)renderExam()}catch(x){err(x)}}
document.querySelectorAll("[data-key]").forEach(t=>t.addEventListener("input",()=>{dirty=true;$("#saveStatus").textContent="Chưa lưu"}));
$("#saveNow").onclick=()=>save();$("#submitNow").onclick=async()=>{if(confirm("Xác nhận nộp bài? Sau khi nộp không thể sửa."))await save(true)};
TIMER=setInterval(()=>{if(!SESSION||SESSION.b.status==="da-nop"){clearInterval(TIMER);return}const ms=Math.max(0,total-(Date.now()-started));const el=$("#clock");if(el)el.textContent=Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");if(dirty&&ms>0)save();if(ms<=0){clearInterval(TIMER);save(true)}},10000);
const ms=Math.max(0,total-(Date.now()-started));$("#clock").textContent=Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");if(ms<=0)save(true)}
function adminEntry(){if(!isAdmin(auth.currentUser)){app.innerHTML='<article><h2>Quản trị đánh giá tự luận</h2><p>Đăng nhập bằng tài khoản quản trị Phúc Nguyên Library.</p><form id="login"><label>Email</label><input type="email" name="email" autocomplete="username" required><label>Mật khẩu</label><input type="password" name="password" autocomplete="current-password" required><button type="submit">Đăng nhập</button><button type="button" id="google">Google</button></form><p id="msg" class="error"></p></article>';
$("#login").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(e.target.email.value,e.target.password.value);if(!isAdmin(auth.currentUser))throw Error("Tài khoản không có quyền quản trị.");adminHome()}catch(x){err(x)}};
$("#google").onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());if(!isAdmin(auth.currentUser))throw Error("Tài khoản không có quyền quản trị.");adminHome()}catch(x){err(x)}};return}adminHome()}
async function adminHome(){app.innerHTML='<article><h2>Quản trị · Tự luận Luật Dân sự</h2><p class="muted">15 mã đề · 30 tình huống · mỗi đề 10 điểm. Đáp án được mã hóa; giải mã trong phiên giảng viên để đề xuất điểm theo từng yêu cầu.</p><label>Mở đáp án đã mã hóa trên web</label><input id="unlockPass" type="password" autocomplete="off" placeholder="Mật khẩu giải mã đáp án"><button id="unlockBtn" type="button" class="secondary">Mở đáp án và bật chấm gợi ý</button><p class="mini muted">Đáp án được mã hóa AES-256-GCM; chỉ giải mã trên máy giảng viên. Mật khẩu không lưu vào website.</p><details><summary>Dùng tệp đáp án nội bộ thay thế</summary><input type="file" id="keyFile" accept=".json,application/json"><p class="mini muted">Tệp chỉ được đọc trong phiên hiện tại, không tải lên máy chủ.</p></details><button id="newClass">Tạo lớp kiểm tra</button><p id="msg" class="error"></p></article><div id="classes"></div>';
$("#unlockBtn").onclick=async()=>{const password=$("#unlockPass").value;try{if(!password)throw Error("Nhập mật khẩu giải mã.");await decryptRubric(password);$("#unlockPass").value="";note("Đã mở 30 đáp án; chức năng gợi ý điểm đang sẵn sàng.");}catch(x){err(x)}};
 $("#keyFile").onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.case_bank)||x.case_bank.length!==30)throw Error("Đáp án không đúng cấu trúc.");RUBRIC=x;note("Đã đọc 30 đáp án vào phiên làm việc của giảng viên.")}catch(x){err(x)}};
$("#newClass").onclick=createClass;try{const q=await db.collection("pnl_dg_lop").get();const rows=q.docs.filter(d=>d.data().hocPhan===COURSE);$("#classes").innerHTML=rows.length?rows.map(d=>'<article><div class="top"><div><h3>'+E(d.id)+' · '+E(d.data().ten||"")+'</h3><span class="mini muted">'+(d.data().open?"Mở":"Khóa")+' · '+E(d.data().siSo||0)+' sinh viên</span></div><button data-class="'+E(d.id)+'">Quản lý lớp</button></div></article>').join(""):'<article>Chưa có lớp tự luận.</article>';document.querySelectorAll("[data-class]").forEach(b=>b.onclick=()=>manageClass(b.dataset.class))}catch(x){err(x)}}
function createClass(){app.innerHTML='<article><h2>Tạo lớp đánh giá tự luận</h2><p class="warn">Lớp mới mặc định khóa. Nhập danh sách và kiểm tra trước khi mở cho sinh viên.</p><form id="cf"><label>Mã lớp</label><input name="ma" required placeholder="DS-TL-K25"><label>Tên lớp</label><input name="ten" required><label>Thời gian (phút)</label><input name="time" type="number" min="10" max="180" value="60"><label>Danh sách sinh viên (mỗi dòng: MSSV; Họ tên)</label><textarea name="roster" required placeholder="SV001; Nguyễn Văn A"></textarea><button type="submit">Tạo lớp (đang khóa)</button><button class="secondary" type="button" id="back">Hủy</button></form><p id="msg" class="error"></p></article>';$("#back").onclick=adminHome;
$("#cf").onsubmit=async e=>{e.preventDefault();const f=e.target,ma=f.ma.value.toUpperCase().trim(),rows=f.roster.value.split(/\r?\n/).map(x=>x.split(/[;\t]/)).filter(x=>x.length>=2&&x[0].trim()&&x[1].trim()).map(x=>({mssv:x[0].trim().toUpperCase(),hoTen:x.slice(1).join(" ").trim()}));if(!valid(ma)||!rows.length||new Set(rows.map(x=>x.mssv)).size!==rows.length){note("Mã lớp hoặc danh sách sinh viên không hợp lệ.");return}
try{const ref=db.doc("pnl_dg_lop/"+ma);if((await ref.get()).exists)throw Error("Mã lớp đã tồn tại.");const now=Date.now();await ref.set({ten:f.ten.value.trim(),hocPhan:COURSE,hocPhanTen:"Luật Dân sự – Tự luận",namHoc:"2026–2027",thoiGian:+f.time.value||60,open:false,openAt:TS.fromDate(new Date(now-60000)),closeAt:TS.fromDate(new Date(now+7*86400000)),siSo:rows.length,created:FV.serverTimestamp()});await db.doc("pnl_dg_ds/"+ma).set({rows,updated:FV.serverTimestamp()});for(let i=0;i<rows.length;i+=300){const b=db.batch();rows.slice(i,i+300).forEach(x=>b.set(db.doc("pnl_dg_sv/"+ma+"__"+x.mssv),{...x,maLop:ma}));await b.commit()}manageClass(ma)}catch(x){err(x)}}}
async function manageClass(ma){CURRENT=ma;app.innerHTML='<article><h2>Quản lý lớp '+E(ma)+'</h2><p id="msg" class="error">Đang tải…</p></article>';try{const [ls,ro,bs,gr]=await Promise.all([db.doc("pnl_dg_lop/"+ma).get(),db.doc("pnl_dg_ds/"+ma).get(),db.collection("pnl_dg_bai").where("maLop","==",ma).get(),db.collection("pnl_dg_cham").where("maLop","==",ma).get()]);if(!ls.exists)throw Error("Không tìm thấy lớp.");
const l=ls.data(),students=ro.exists?ro.data().rows:[],papers=Object.fromEntries(bs.docs.map(d=>[d.data().mssv,d.data()])),grades=Object.fromEntries(gr.docs.map(d=>[d.data().mssv,d.data()]));
let h='<article><div class="top"><h2>'+E(ma)+' · '+E(l.ten)+'</h2><button class="secondary" id="back">Các lớp</button></div><p>Trạng thái: <b>'+(l.open?"Đang mở":"Đang khóa")+'</b>. Mỗi đề gồm 02 tình huống × 05 điểm.</p><button id="toggle">'+(l.open?"Khóa bài kiểm tra":"Mở cho sinh viên")+'</button><button id="csv" class="secondary">Xuất điểm CSV</button><p class="mini muted">Bài được chấm theo từng yêu cầu, tối đa 1,25 điểm. Chỉ điểm đã được giảng viên duyệt mới là điểm chính thức.</p><p id="msg" class="error"></p></article>';
h+='<article><h3>Danh sách và bài làm</h3>';
students.forEach(s=>{const b=papers[s.mssv],g=grades[s.mssv];h+='<div class="student"><div class="top"><span><b>'+E(s.mssv)+'</b> · '+E(s.hoTen)+'</span><span>'+(!b?"Chưa làm":b.status==="da-nop"?"Đã nộp":"Đang làm")+' · '+(g&&g.xacNhan?E(g.diem)+"/10":"Chưa chấm")+'</span></div>'+(b&&b.status==="da-nop"?'<button data-grade="'+E(s.mssv)+'">Chấm bài</button>':'')+'</div>'});h+='</article>';app.innerHTML=h;
$("#back").onclick=adminHome;$("#toggle").onclick=async()=>{if(!confirm(l.open?"Khóa lớp?":"Mở lớp cho sinh viên làm bài? Đảm bảo đã rà soát đề và đáp án."))return;try{await db.doc("pnl_dg_lop/"+ma).update({open:!l.open});manageClass(ma)}catch(x){err(x)}};
$("#csv").onclick=()=>{const rows=[["MSSV","Họ và tên","Điểm /10","Đã xác nhận"]].concat(students.map(s=>[s.mssv,s.hoTen,grades[s.mssv]?grades[s.mssv].diem:"",grades[s.mssv]&&grades[s.mssv].xacNhan?"Có":"Không"]));const text="\uFEFF"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download="diem-tu-luan-"+ma+".csv";a.click();URL.revokeObjectURL(a.href)};
document.querySelectorAll("[data-grade]").forEach(x=>x.onclick=()=>grade(ma,x.dataset.grade,papers[x.dataset.grade],grades[x.dataset.grade]))}catch(x){err(x)}}
function normalize(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(x=>x.length>3)}
function similarity(a,b){const A=new Set(normalize(a)),B=new Set(normalize(b));if(!A.size||!B.size)return 0;let n=0;A.forEach(w=>{if(B.has(w))n++});return Math.round(100*n/B.size)}

/* Đề xuất điểm theo ý pháp lý: chỉ là trợ giúp, không phải quyết định tự động.
   Đáp án chỉ giải mã trong phiên quản trị hoặc được chọn từ tệp nội bộ. */
const STOP_LEGAL=new Set("cua nhung trong theo nguoi truong hop phap luat quy dinh neu thi va hoac cua cac duoc khong cho voi mot hai ba nay do can phai xac dinh xem xet dieu kien dieu khoan bo luat toan bo phan tuong ung ngay thoi diem".split(" "));
function legalWords(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/đ/g,"d").replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(w=>w.length>2&&!STOP_LEGAL.has(w))}
function uniqueWords(s){return [...new Set(legalWords(s))]}
function legalSentences(s){return String(s||"").split(/[.;\n]+/).map(x=>x.trim()).filter(x=>x.length>25&&uniqueWords(x).length>=4).slice(0,14)}
function legalCites(s){const v=new Set(),re=/(?:điều|dieu|đ\.|d\.)\s*(\d{1,3})/gi;let m;while((m=re.exec(s||"")))v.add(m[1]);return v}
function legalGrade(essay,answer){
 const A=legalSentences(answer),R=legalSentences(essay);
 if(!String(essay||"").trim())return {score:0,parts:[0,0,0,0],hits:[],missing:A,warning:"Bỏ trống"};
 const seen=uniqueWords(essay),seenSet=new Set(seen),hit=[],miss=[];
 let total=0;
 for(const clause of A){
   const terms=uniqueWords(clause),same=terms.filter(w=>seenSet.has(w)).length,ratio=terms.length?same/terms.length:0;
   if(ratio>=.52&&same>=3){hit.push({clause,ratio});total+=ratio}else miss.push(clause)
 }
 const coverage=A.length?hit.length/A.length:0;
 const evidence=Math.min(1,seen.length/18);
 const conclusion=Math.min(.4,.4*coverage*1.25*evidence);
 const reasoning=Math.min(.4,.4*(total/Math.max(1,A.length))*evidence);
 const branchText=(essay||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 const branches=(branchText.match(/neu |truong hop|mat khac|nguoc lai|tuy thuoc|khi |co quyet dinh|khong co/g)||[]).length;
 const refBranches=(String(answer).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().match(/neu |truong hop|mat khac|nguoc lai|tuy thuoc|khi /g)||[]).length;
 const branch= refBranches ? .3*Math.min(1,branches/Math.max(1,Math.min(2,refBranches)))*coverage : .3*coverage;
 const cited=legalCites(essay),model=legalCites(answer);
 const citation=model.size?(.15*Math.min(1,[...model].filter(x=>cited.has(x)).length/Math.min(2,model.size))):(.15*(cited.size>0?1:0));
 const parts=[conclusion,reasoning,branch,citation].map(x=>Math.round(x*100)/100);
 return {score:Math.min(1.25,Math.round(parts.reduce((a,b)=>a+b,0)*100)/100),parts,hits:hit,missing:miss,warning:hit.length===0?"Không nhận diện được ý pháp lý đủ rõ; cần chấm thủ công.":"Máy chỉ so khớp dấu hiệu nội dung; kiểm tra kết luận và lập luận trước khi duyệt."};
}
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptRubric(password){
 const r=await fetch("./de/luat-dan-su-tu-luan-key.enc.json",{cache:"no-store"});if(!r.ok)throw Error("Chưa tìm thấy đáp án mã hóa trên web.");
 const c=await r.json(),enc=new TextEncoder(),secret=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(c.salt),iterations:c.rounds,hash:"SHA-256"},secret,{name:"AES-GCM",length:256},false,["decrypt"]);
 const zipped=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(c.iv)},key,b64ToBytes(c.payload));
 const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream("deflate"));
 const d=JSON.parse(await new Response(stream).text());
 if(!Array.isArray(d.case_bank)||d.case_bank.length!==30)throw Error("Đáp án không hợp lệ.");
 RUBRIC=d;return d;
}

function guideFor(id,j){const c=RUBRIC&&RUBRIC.case_bank.find(x=>x.id===id);if(!c)return"";const a=c.answer||[];return a.length===4?a[j]:(a[j*2+1]||"")}
function grade(ma,sv,b,g){if(!RUBRIC){app.innerHTML='<article><h2>Chưa mở đáp án</h2><p>Giảng viên cần giải mã bộ đáp án trước khi chấm, để bảo đảm điểm được đối chiếu với đáp án đã phê duyệt.</p><button id="back">Về quản trị</button></article>';$("#back").onclick=adminHome;return}const ids=b.de.caseIds||[],ans=answerMap(b);let h='<article><div class="top"><h2>Chấm bài · '+E(sv)+'</h2><button id="back" class="secondary">Trở lại lớp</button></div><p class="warn">Gợi ý điểm chỉ dựa trên dấu hiệu nội dung và căn cứ pháp luật. Máy có thể không nhận ra lập luận đúng hoặc đánh giá nhầm lập luận sai. Giảng viên bắt buộc đối chiếu và quyết định điểm chính thức.</p></article>';
ids.forEach((id,i)=>{const c=caseBy(id);h+='<article><h3>Câu '+(i+1)+' – '+E(id)+' (5 điểm)</h3><div class="case">'+E(c.text)+'</div>';
c.questions.forEach((q,j)=>{const key=id+"_"+j,guide=guideFor(id,j),input=ans[key]||"";const pos=i*4+j,ev=guide?legalGrade(input,guide):null;const selected=(g&&g.muc&&g.muc[pos]!=null)?g.muc[pos]:(ev?ev.score:0);
 h+='<div class="q"><strong>'+E(q)+'</strong><div class="ans">'+E(input||"(Không trả lời)")+'</div>'+(guide?'<details><summary>Đáp án và minh chứng đối chiếu</summary><div class="ans">'+E(guide)+'</div></details><p class="mini muted">Gợi ý '+ev.score.toFixed(2)+'/1,25 · Kết luận '+ev.parts[0].toFixed(2)+' · Lập luận '+ev.parts[1].toFixed(2)+' · Trường hợp '+ev.parts[2].toFixed(2)+' · Căn cứ '+ev.parts[3].toFixed(2)+'</p>'+(ev.hits.length?'<details><summary>Ý có dấu hiệu phù hợp ('+ev.hits.length+')</summary><ul>'+ev.hits.map(x=>'<li>'+E(x.clause)+'</li>').join('')+'</ul></details>':'')+(ev.missing.length?'<details><summary>Ý cần xem xét ('+ev.missing.length+')</summary><ul>'+ev.missing.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></details>':'')+'<p class="mini muted">'+E(ev.warning)+'</p>':'<p class="mini muted">Mở đáp án mã hóa tại trang Quản trị để có gợi ý chấm.</p>')+'<label>Điểm giảng viên xác nhận (0 – 1,25)</label><input data-point="'+pos+'" type="number" min="0" max="1.25" step="0.05" value="'+E(selected)+'"></div>'});
const cb=RUBRIC.case_bank.find(x=>x.id===id);if(cb&&cb.legal_basis)h+='<details><summary>Căn cứ pháp luật tổng hợp</summary><div class="ans">'+E(cb.legal_basis)+'</div></details>';h+='</article>'});h+='<article><div class="top"><span>Điểm tổng</span><strong class="score" id="total">0/10</strong></div><label>Nhận xét</label><textarea id="review" maxlength="1000">'+E(g&&g.note||"")+'</textarea><button id="saveGrade">Duyệt và lưu điểm</button><p id="msg" class="error"></p></article>';app.innerHTML=h;
$("#back").onclick=()=>manageClass(ma);const points=()=>Array.from(document.querySelectorAll("[data-point]")).map(x=>Math.max(0,Math.min(1.25,Number(x.value)||0)));
const recalc=()=>{$("#total").textContent=points().reduce((a,b)=>a+b,0).toFixed(2).replace(".",",")+"/10"};document.querySelectorAll("[data-point]").forEach(x=>x.oninput=recalc);recalc();
$("#saveGrade").onclick=async()=>{const v=points(),sum=Math.round(v.reduce((a,b)=>a+b,0)*100)/100;if(!confirm("Xác nhận đã đối chiếu đáp án, kiểm tra lập luận và phê duyệt điểm "+sum+"/10 cho "+sv+"?"))return;try{await db.doc("pnl_dg_cham/"+ma+"__"+sv).set({maLop:ma,mssv:sv,muc:v,diem:sum,xacNhan:true,note:$("#review").value.trim(),hocPhan:COURSE,maDe:b.de.set||"",phienBanDapAn:"2026-11-07-v2",chamBoi:auth.currentUser&&auth.currentUser.uid||"",luc:FV.serverTimestamp()});manageClass(ma)}catch(x){err(x)}}}
(async()=>{try{await bankLoad();if(auth.currentUser){navigate()}else{auth.onAuthStateChanged(()=>{if(location.hash.startsWith("#quan-tri")&&isAdmin(auth.currentUser))adminHome();else if(!location.hash.startsWith("#quan-tri"))studentEntry();else adminEntry()})}}catch(x){app.innerHTML='<article class="error">'+E(x.message)+'</article>'}})();
</script></body></html>
