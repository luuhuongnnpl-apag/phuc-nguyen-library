<script>
"use strict";
const COURSE="luat-dan-su-tu-luan",ADMIN_UID="smoIpuX7qseqTeu9nToc9RYigku1";
const ADMINS=["luuhuong.nnpl@gmail.com","luuhuong.dhnv@gmail.com"];
const cfg={apiKey:"AIzaSyCIYY-dzhJ4rUYsXvBQivIxcziUC3hR1-U",authDomain:"phuc-nguyen-library.firebaseapp.com",projectId:"phuc-nguyen-library",storageBucket:"phuc-nguyen-library.firebasestorage.app",messagingSenderId:"842652271567",appId:"1:842652271567:web:23b95b5c4d6061497988ba"};
firebase.initializeApp(cfg);
const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp,app=document.getElementById("app");
const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const isAdmin=u=>u&&!u.isAnonymous&&(u.uid===ADMIN_UID||(u.emailVerified&&ADMINS.includes(u.email)));
let BANK=null,SESSION=null,TIMER=null,RUBRIC=null,CURRENT=null;
const caseBy=id=>BANK.cases.find(c=>c.id===id);
async function bankLoad(){if(BANK)return BANK;const r=await fetch("./de/luat-dan-su-tu-luan.b64",{cache:"no-cache"});if(!r.ok)throw Error("Không tải được ngân hàng đề.");
const data=atob((await r.text()).trim()),bytes=Uint8Array.from(data,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
BANK=JSON.parse(await new Response(stream).text());if(BANK.cases.length!==30||BANK.exam_sets.length!==15)throw Error("Ngân hàng đề không hợp lệ.");return BANK}

/* Ngân hàng chính thức từ học phần: 180 câu lý thuyết + 108 câu trắc nghiệm tình huống.
   Lưu mã câu và thứ tự phương án; không lưu đáp án đúng trong bài sinh viên. */
let MCQ=null;
async function loadMCQ(){
 if(MCQ)return MCQ;
 const r=await fetch("../hp/luat-dan-su.html",{cache:"no-cache"});
 if(!r.ok)throw Error("Không tải được trắc nghiệm học phần.");
 const txt=await r.text(),m=txt.match(/<script id="pn-data" type="application\/json">([\s\S]*?)<\/script>/);
 if(!m)throw Error("Không tìm thấy ngân hàng câu hỏi học phần.");
 const d=JSON.parse(m[1]),questions={},situations={};
 for(const q of d.q||[])if(q.id&&Array.isArray(q.o)&&q.o.length===4)questions[q.id]=q;
 for(const group of d.th||[])for(const c of group.items||[])situations[c.cid]=c;
 const theory=Object.values(questions).filter(q=>!q.cid);
 const contexts=Object.values(situations).filter(c=>Array.isArray(c.mcq)&&c.mcq.length>=4&&c.mcq.every(id=>questions[id]));
 if(theory.length<8||!contexts.length)throw Error("Ngân hàng trắc nghiệm chưa đủ câu.");
 MCQ={questions,theory,contexts};return MCQ;
}
function shuffleExam(xs){xs=xs.slice();for(let i=xs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]]}return xs}
function newMixedExam(){
 const ch=shuffleExam(MCQ.contexts)[0];
 const theory=shuffleExam(MCQ.theory);
 const picks=[],chapters={};
 for(const q of theory){const chapter=String(q.id).split(".")[0];if((chapters[chapter]||0)>=2)continue;picks.push(q.id);chapters[chapter]=(chapters[chapter]||0)+1;if(picks.length===8)break}
 if(picks.length<8)for(const q of theory){if(!picks.includes(q.id))picks.push(q.id);if(picks.length===8)break}
 const ids=picks.concat(shuffleExam(ch.mcq).slice(0,4));
 const order={};ids.forEach(id=>order[id]=shuffleExam([0,1,2,3]));
 const essayCase=shuffleExam(BANK.cases)[0];
 return {essayMode:"mixed12x1",set:"DS-MIX-"+String(Math.floor(Math.random()*90000)+10000),mcq:ids,perm:order,mcqCase:ch.cid,caseIds:[essayCase.id],lt:[],th:[],tl:essayCase.id};
}
function markMCQ(de,ans){
 if(de.essayMode!=="mixed12x1")return {score:0,correct:0,items:[]};
 const ids=de.mcq||[],items=[];let correct=0;
 for(const id of ids){
  const q=MCQ?.questions[id];if(!q)throw Error("Không có câu trắc nghiệm "+id);
  const chosen=ans["mcq_"+id],per=de.perm?.[id]||[0,1,2,3],validChoice=Number.isInteger(chosen)&&chosen>=0&&chosen<4;
  const ok=validChoice&&per[chosen]===q.a;if(ok)correct++;
  items.push({id,selected:validChoice?chosen:null,correct:per.indexOf(q.a),ok,basis:q.b||"",explanation:q.e||""});
 }
 return {score:Math.round(correct*50)/100,correct,items};
}

function note(text){const p=$("#msg");if(p)p.textContent=text}
function err(x){console.error(x);note(x.message||String(x))}
const valid=s=>/^[A-Z0-9_-]{2,24}$/.test(s);
const until=d=>d&&d.toDate?d.toDate():new Date(d);
function access(l){const t=Date.now();return l.open&&(!l.openAt||until(l.openAt).getTime()<=t)&&(!l.closeAt||until(l.closeAt).getTime()>=t)}
async function ensureAnon(){if(auth.currentUser)return auth.currentUser;return(await auth.signInAnonymously()).user}
function navigate(){clearInterval(TIMER);if(location.hash.startsWith("#quan-tri"))return adminEntry();studentEntry()}
window.addEventListener("hashchange",navigate);
function confirmStudentIdentity(ma,sv,hoTen,l){
 return new Promise(resolve=>{
  const old=app.innerHTML;
  app.innerHTML='<article><h2>Xác nhận thông tin sinh viên</h2><p>Kiểm tra thông tin trước khi vào bài kiểm tra. Nếu họ tên không đúng, chọn Quay lại và thông báo giảng viên.</p><div class="case"><p><b>Họ và tên:</b> '+E(hoTen||"(Chưa có họ tên)")+'</p><p><b>Mã sinh viên:</b> '+E(sv)+'</p><p><b>Mã lớp:</b> '+E(ma)+'</p><p><b>Tên lớp:</b> '+E(l.ten||"")+'</p><p><b>Học phần:</b> '+E(l.hocPhanTen||"Luật Dân sự")+'</p><p><b>Thời gian:</b> 40 phút</p></div><button id="identityYes">Xác nhận đúng thông tin và tiếp tục</button><button id="identityNo" class="secondary">Quay lại</button></article>';
  $("#identityYes").onclick=()=>resolve(true);
  $("#identityNo").onclick=()=>{app.innerHTML=old;studentEntry();resolve(false)};
 });
}
function studentEntry(){app.innerHTML=`<article>
<h2>ĐÁNH GIÁ ĐỊNH KỲ</h2>
<p class="mini muted">Học phần: Luật Dân sự</p>
<p class="muted">Hình thức kiểm tra chính thức: <b>Trắc nghiệm kết hợp tự luận</b>. Ngân hàng câu hỏi và đáp án đã được phê duyệt.</p>
<div class="grid"><div class="panel"><strong>12 câu trắc nghiệm</strong><p class="mini muted">08 lý thuyết + 04 câu hỏi tình huống · 06 điểm</p></div>
<div class="panel"><strong>01 tình huống tự luận</strong><p class="mini muted">04 yêu cầu × 01 điểm = 04 điểm</p></div>
<div class="panel"><strong>40 phút</strong><p class="mini muted">Áp dụng chung cho tất cả bài kiểm tra</p></div></div>
<h3>Hướng dẫn trước khi làm bài</h3>
<ol><li>Phần trắc nghiệm có 12 câu, mỗi câu chọn một phương án đúng; 0,5 điểm/câu.</li>
<li>Phần tự luận gồm 01 tình huống và 04 yêu cầu; phân tích, lập luận và nêu căn cứ pháp luật.</li>
<li>Hệ thống phân phối một mã đề ngẫu nhiên; mỗi sinh viên chỉ làm một lần trong đợt kiểm tra.</li>
<li>Bài tự lưu và tự động nộp khi hết thời gian quy định.</li></ol>
<form id="entry"><label>Mã lớp kiểm tra</label><input name="ma" required maxlength="24" autocomplete="off" placeholder="Mã lớp giảng viên cung cấp">
<label>Mã sinh viên</label><input name="sv" required maxlength="20" autocomplete="off" placeholder="Mã sinh viên">
<label style="display:flex;gap:9px;align-items:center;font-weight:400"><input id="agree" type="checkbox" style="width:auto" required> Tôi đã đọc quy định kiểm tra định kỳ.</label>
<button type="submit">Xác nhận và vào bài kiểm tra</button></form><p id="msg" class="error"></p></article>`;
const qp=new URLSearchParams(location.search);if(qp.get("ma"))$("#entry").elements.ma.value=qp.get("ma");if(qp.get("sv"))$("#entry").elements.sv.value=qp.get("sv");
$("#entry").onsubmit=async e=>{e.preventDefault();const ma=e.target.ma.value.trim().toUpperCase(),sv=e.target.sv.value.trim().toUpperCase();if(!valid(ma)||!valid(sv)){note("Mã lớp hoặc mã sinh viên không hợp lệ.");return}
try{await ensureAnon();await bankLoad();await loadMCQ();const ls=await db.doc("pnl_dg_lop/"+ma).get(),ss=await db.doc("pnl_dg_sv/"+ma+"__"+sv).get();if(!ls.exists||!ss.exists)throw Error("Không tìm thấy mã lớp hoặc mã sinh viên.");
const l=ls.data();if(l.hocPhan!==COURSE)throw Error("Mã lớp này không thuộc học phần đánh giá định kỳ Luật Dân sự.");
if(!await confirmStudentIdentity(ma,sv,ss.data().hoTen,l))return;
const id=ma+"__"+sv;let old=await db.doc("pnl_dg_bai/"+id).get();
if(!old.exists){if(!access(l))throw Error("Bài kiểm tra chưa mở hoặc đã hết hạn.");if(!confirm("Xác nhận bắt đầu bài đánh giá định kỳ Luật Dân sự theo hình thức trắc nghiệm kết hợp tự luận? Thời gian sẽ được tính khi nhận đề; mỗi sinh viên chỉ được làm một lần."))return;await loadMCQ();const de=newMixedExam();
try{await db.doc("pnl_dg_bai/"+id).set({maLop:ma,mssv:sv,hoTen:ss.data().hoTen,uid:auth.currentUser.uid,hocPhan:COURSE,de,essay:JSON.stringify({}),status:"dang-lam",roiTrang:0,startedAt:FV.serverTimestamp()})}catch(x){if(x.code!=="permission-denied")throw x}
old=await db.doc("pnl_dg_bai/"+id).get()}
if(!old.exists)throw Error("Không đọc được bài làm. Vui lòng liên hệ giảng viên.");
const b=old.data();if(b.hocPhan!==COURSE)throw Error("Mã sinh viên đã có bài của học phần khác.");SESSION={id,ma,sv,l,b};await loadMCQ();renderExam()}catch(x){err(x)}}}
function answerMap(b){try{return JSON.parse(b.essay||"{}")}catch(x){return{}}}
function renderExam(){
 const S=SESSION,b=S.b;
 if(b.status==="da-nop"){app.innerHTML='<article><h2>Đã nộp bài</h2><p>Hệ thống đã ghi nhận bài của <b>'+E(b.hoTen)+'</b> ('+E(S.sv)+'). Kết quả sẽ được giảng viên công bố.</p><a class="btn secondary" href="../index.html">Về thư viện</a></article>';return}
 const de=b.de||{},mixed=de.essayMode==="mixed12x1",ids=de.caseIds||[];
 if(mixed&&(!Array.isArray(de.mcq)||de.mcq.length!==12||ids.length!==1))throw Error("Đề hỗn hợp không hợp lệ.");
 if(!mixed&&ids.length!==2)throw Error("Đề cũ không hợp lệ.");
 const a=answerMap(b),total=40*60000;
 const started=until(b.startedAt).getTime();
 let h='<article><div class="top"><div><h2>Luật Dân sự – Mã đề '+E(de.set)+'</h2><span class="muted">'+E(b.hoTen)+' · '+E(S.sv)+'</span></div><div><strong id="clock" class="score"></strong><div id="saveStatus" class="mini muted">Tự động lưu bài</div></div></div><p class="warn">'+(mixed?'Phần I: 12 câu trắc nghiệm × 0,5 = 6 điểm. Phần II: 1 tình huống tự luận (4 yêu cầu × 1 điểm) = 4 điểm.':'Đề tự luận cũ: 2 tình huống × 5 điểm.')+' Hết giờ bài tự nộp.</p></article>';
 if(mixed){
  h+='<article><h3>PHẦN I. TRẮC NGHIỆM (6 điểm)</h3>';
  de.mcq.forEach((id,i)=>{
   const q=MCQ?.questions[id];if(!q)throw Error("Thiếu câu trắc nghiệm "+id);
   const perm=de.perm?.[id]||[0,1,2,3],selected=a["mcq_"+id];
   if(i===8){const c=MCQ.contexts.find(c=>c.cid===de.mcqCase);if(c)h+='<h3>Tình huống trắc nghiệm</h3><div class="case">'+E(c.text)+'</div>';}
   h+='<div class="q"><strong>Câu '+(i+1)+'. '+E(q.q)+' (0,5 điểm)</strong>';
   for(let j=0;j<4;j++){const letter="ABCD"[j];h+='<label style="display:flex;align-items:flex-start;gap:9px;font-weight:400"><input type="radio" name="mcq_'+E(id)+'" data-mcq="'+E(id)+'" value="'+j+'" style="width:auto;margin-top:4px"'+(selected===j?' checked':'')+'> <span>'+letter+'. '+E(q.o[perm[j]])+'</span></label>'}
   h+='</div>';
  });h+='</article>';
 }
 h+='<article><h3>'+(mixed?'PHẦN II. TỰ LUẬN (4 điểm)':'PHẦN TỰ LUẬN')+'</h3>';
 ids.forEach((id,i)=>{const c=caseBy(id);if(!c)throw Error("Thiếu tình huống "+id);
 h+='<h3>Tình huống '+(i+1)+' ('+(mixed?'4':'5')+' điểm)</h3><div class="case">'+E(c.text)+'</div>';
 c.questions.forEach((q,j)=>{const key=id+"_"+j;h+='<div class="q"><strong>'+E(q)+'</strong><textarea maxlength="2300" data-key="'+E(key)+'" placeholder="Trình bày câu trả lời, lập luận và căn cứ pháp luật">'+E(a[key]||"")+'</textarea><div class="mini muted">Tối đa '+(mixed?'1':'1,25')+' điểm</div></div>'});
 });h+='</article><article><button id="saveNow" class="secondary">Lưu nháp</button><button id="submitNow">Nộp bài</button><p id="msg" class="error"></p></article>';
 app.innerHTML=h;
 let dirty=false,saving=false;
 const gather=()=>{const values={};document.querySelectorAll("[data-key]").forEach(t=>values[t.dataset.key]=t.value);
  if(mixed)de.mcq.forEach(id=>{const el=document.querySelector('input[name="mcq_'+id+'"]:checked');if(el)values["mcq_"+id]=Number(el.value)});
  return values;};
 async function save(final=false){
  if(!SESSION||SESSION.b.status==="da-nop"||saving)return;
  saving=true;const ans=JSON.stringify(gather());
  try{const update={essay:ans,luu:FV.serverTimestamp()};
   if(final){update.status="da-nop";update.submittedAt=FV.serverTimestamp()}
   await db.doc("pnl_dg_bai/"+SESSION.id).update(update);
   SESSION.b.essay=ans;dirty=false;
   if(final){SESSION.b.status="da-nop";renderExam()}else{const status=$("#saveStatus");if(status)status.textContent="Đã lưu lúc "+new Date().toLocaleTimeString("vi-VN");}
  }catch(e){err(e)}finally{saving=false}
 }
 document.querySelectorAll("[data-key],[data-mcq]").forEach(t=>t.addEventListener("input",()=>{dirty=true;const st=$("#saveStatus");if(st)st.textContent="Chưa lưu"}));
 $("#saveNow").onclick=()=>save();$("#submitNow").onclick=()=>{if(confirm("Xác nhận nộp bài? Sau khi nộp không thể sửa."))save(true)};
 TIMER=setInterval(()=>{if(!SESSION||SESSION.b.status==="da-nop"){clearInterval(TIMER);return}
  const ms=Math.max(0,total-(Date.now()-started)),el=$("#clock");
  if(el)el.textContent=Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");
  if(ms===0){clearInterval(TIMER);save(true)}else if(dirty)save();
 },10000);
 const ms=Math.max(0,total-(Date.now()-started)),clock=$("#clock");
 if(clock)clock.textContent=Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");
 if(ms===0)save(true);
}

$("#login").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(e.target.email.value,e.target.password.value);if(!isAdmin(auth.currentUser))throw Error("Tài khoản không có quyền quản trị.");adminEntry()}catch(x){err(x)}};

async function loadAutoKey(){
 if(RUBRIC)return RUBRIC;
 const r=await fetch("./de/luat-dan-su-tu-luan-rubric.json",{cache:"no-cache"});
 if(!r.ok)throw Error("Không tải được đáp án.");
 const d=await r.json();
 if(!Array.isArray(d.cases)||d.cases.length!==30||!d.cases.every(x=>x.answers?.length===4))throw Error("Dữ liệu đáp án không hợp lệ.");
 RUBRIC={case_bank:d.cases.map(x=>({id:x.id,answer:x.answers}))};
 return RUBRIC;
}
function gradeAutomatic(b){
 const de=b.de||{},mixed=de.essayMode==="mixed12x1",ids=de.caseIds||[];
 if(mixed?(ids.length!==1||de.mcq?.length!==12):ids.length!==2)throw Error("Mã đề không hợp lệ");
 const ans=answerMap(b),scores=[],report=[];
 for(const id of ids)for(let j=0;j<4;j++){
  const key=id+"_"+j,g=guideFor(id,j);if(!g)throw Error("Thiếu đáp án "+id+"/"+j);
  const ev=legalGrade(ans[key]||"",g);
  const pts=mixed?Math.round(ev.score*.8*100)/100:ev.score;
  scores.push(pts);report.push({id,question:j+1,score:pts,matched:ev.hits.map(x=>x.clause),missing:ev.missing});
 }
 const essay=Math.round(scores.reduce((a,b)=>a+b,0)*100)/100;
 const tn=mixed?markMCQ(de,ans):{score:0,correct:0,items:[]};
 return {diem:Math.round((essay+tn.score)*100)/100,tuLuan:essay,tracNghiem:tn.score,soCauDung:tn.correct,chiTietTN:tn.items,muc:scores,chiTiet:report};
}
async function markPending(ma,papers,grades){

/* Thống nhất danh sách sinh viên: MSSV; Họ tên hoặc Họ tên; MSSV */
function parseStudentRows(text){
 const rows=[],seen=new Set();
 for(const ln of String(text||"").split(/\r?\n/)){
  const line=ln.trim();if(!line)continue;
  let pair=line.split(/[;\t]/).map(x=>x.trim());
  if(pair.length<2)pair=line.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
  if(pair.length<2)continue;
  let a=pair[0],b=pair.slice(1).join(" ").trim();
  const isCode=x=>/^[A-Z0-9_-]{2,24}$/i.test(x)&&(/\d/.test(x)||x===x.toUpperCase());
  if(!isCode(a)&&isCode(b)){const tmp=a;a=b;b=tmp}
  a=a.toUpperCase();
  if(!isCode(a)||!b||/^(mssv|mã sinh viên|ma sinh vien|student id)$/i.test(a))continue;
  if(seen.has(a))throw Error("Mã sinh viên trùng: "+a);
  seen.add(a);rows.push({mssv:a,hoTen:b});
 }
 return rows;
}
async function readRosterFile(file){
 if(!file)return "";
 const ext=(file.name.split(".").pop()||"").toLowerCase();
 if(ext==="xlsx"||ext==="xls"){
  if(!window.XLSX)await new Promise((resolve,reject)=>{const el=document.createElement("script");el.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";el.onload=resolve;el.onerror=()=>reject(Error("Không tải được công cụ đọc Excel."));document.head.appendChild(el)});
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),sheet=wb.Sheets[wb.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
  return matrix.map(r=>r.slice(0,2).map(x=>String(x).trim()).join("; ")).join("\n");
 }
 return file.text();
}
async function saveStudents(ma,rows,previous=[]){
 const previousIds=new Set(previous.map(x=>x.mssv)),ids=new Set(rows.map(x=>x.mssv));
 const deletions=previous.filter(x=>!ids.has(x.mssv));
 if(deletions.length){
  const ongoing=await db.collection("pnl_dg_bai").where("maLop","==",ma).get();
  const active=ongoing.docs.filter(x=>deletions.some(d=>d.mssv===x.data().mssv));
  if(active.length)throw Error("Không được xóa sinh viên đã có bài kiểm tra. Hãy giữ sinh viên trong danh sách.");
 }
 const tasks=[];
 for(const x of deletions)tasks.push(b=>b.delete(db.doc("pnl_dg_sv/"+ma+"__"+x.mssv)));
 for(const x of rows)tasks.push(b=>b.set(db.doc("pnl_dg_sv/"+ma+"__"+x.mssv),{maLop:ma,mssv:x.mssv,hoTen:x.hoTen},{merge:true}));
 tasks.push(b=>b.set(db.doc("pnl_dg_ds/"+ma),{rows,updated:FV.serverTimestamp()}));
 tasks.push(b=>b.set(db.doc("pnl_dg_lop/"+ma),{siSo:rows.length},{merge:true}));
 for(let i=0;i<tasks.length;i+=350){const batch=db.batch();tasks.slice(i,i+350).forEach(fn=>fn(batch));await batch.commit()}
}

function normalize(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(x=>x.length>3)}
function similarity(a,b){const A=new Set(normalize(a)),B=new Set(normalize(b));if(!A.size||!B.size)return 0;let n=0;A.forEach(w=>{if(B.has(w))n++});return Math.round(100*n/B.size)}

/* Đề xuất điểm theo ý pháp lý: chỉ là trợ giúp, không phải quyết định tự động.
   Đáp án chỉ giải mã trong phiên quản trị hoặc được chọn từ tệp nội bộ. */
const STOP_LEGAL=new Set("cua nhung trong theo nguoi truong hop phap luat quy dinh neu thi va hoac cua cac duoc khong cho voi mot hai ba nay do can phai xac dinh xem xet dieu kien dieu khoan bo luat toan bo phan tuong ung ngay thoi diem".split(" "));
function legalWords(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/đ/g,"d").replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(w=>w.length>2&&!STOP_LEGAL.has(w))}
function uniqueWords(s){return [...new Set(legalWords(s))]}
function legalSentences(s){return String(s||"").split(/[.;\n]+/).map(x=>x.trim()).filter(x=>x.length>25&&uniqueWords(x).length>=4).slice(0,14)}
function legalCites(s){const v=new Set(),re=/(?:điều|dieu|đ\.|d\.)\s*(\d{1,3})/gi;let m;while((m=re.exec(s||"")))v.add(m[1]);return v}
function legalGrade(essay,answer){
 const A=legalSentences(answer),R=legalSentences(essay);
 if(!String(essay||"").trim())return {score:0,parts:[0,0,0,0],hits:[],missing:A,warning:"Bỏ trống"};
 const seen=uniqueWords(essay),seenSet=new Set(seen),hit=[],miss=[];
 let total=0;
 for(const clause of A){
   const terms=uniqueWords(clause),same=terms.filter(w=>seenSet.has(w)).length,ratio=terms.length?same/terms.length:0;
   if(ratio>=.52&&same>=3){hit.push({clause,ratio});total+=ratio}else miss.push(clause)
 }
 const coverage=A.length?hit.length/A.length:0;
 /* Chấm rộng tay: đúng một nửa nội dung => 70% điểm câu.
    Chỉ tính các ý có mức khớp đủ rõ; bỏ trống và không liên quan không được điểm. */
 const gradeCurve=p=>p<=0?0:p<.5?1.4*p:.7+.6*(Math.min(1,p)-.5);
 const substantive=hit.length>0&&seen.length>=4;
 const cited=legalCites(essay),model=legalCites(answer);
 const citationRatio=model.size?[...model].filter(x=>cited.has(x)).length/model.size:0;
 const detail=hit.length?hit.reduce((a,x)=>a+x.ratio,0)/hit.length:0;
 const weighted=Math.min(1,coverage*(.9+.1*Math.min(1,detail)));
 const score=substantive?Math.min(1.25,Math.max(coverage>=.5?.7:0,gradeCurve(weighted)+Math.min(.05,.05*citationRatio))*1.25):0;
 return {score:Math.round(score*100)/100,parts:[Math.round(score*100)/100,0,0,0],hits:hit,missing:miss,warning:!substantive?"Không nhận diện được ý pháp lý đủ rõ; cần giảng viên chấm thủ công.":"Gợi ý theo độ bao phủ ý đúng; giảng viên kiểm tra lập luận và tính chính xác trước khi duyệt."};
}
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptRubric(password){
 const r=await fetch("./de/luat-dan-su-tu-luan-key.enc.json",{cache:"no-store"});if(!r.ok)throw Error("Chưa tìm thấy đáp án mã hóa trên web.");
 const c=await r.json(),enc=new TextEncoder(),secret=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(c.salt),iterations:c.rounds,hash:"SHA-256"},secret,{name:"AES-GCM",length:256},false,["decrypt"]);
 const zipped=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(c.iv)},key,b64ToBytes(c.payload));
 const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream("deflate"));
 const d=JSON.parse(await new Response(stream).text());
 if(!Array.isArray(d.case_bank)||d.case_bank.length!==30)throw Error("Đáp án không hợp lệ.");
 RUBRIC=d;return d;
}

function guideFor(id,j){const c=RUBRIC&&RUBRIC.case_bank.find(x=>x.id===id);if(!c)return"";const a=c.answer||[];return a.length===4?a[j]:(a[j*2+1]||"")}
function grade(ma,sv,b,g){
 if(!RUBRIC){app.innerHTML='<article><h2>Không tải được đáp án</h2><button id="back">Về quản trị</button></article>';$("#back").onclick=adminHome;return}
 const de=b.de||{},mixed=de.essayMode==="mixed12x1",ids=de.caseIds||[],ans=answerMap(b),max=mixed?1:1.25;

 if(mixed){

  tn.items.forEach((x,i)=>{const q=MCQ.questions[x.id],selected=x.selected===null?"Chưa trả lời":"ABCD"[x.selected],right="ABCD"[x.correct];
   if(i===8){const c=MCQ.contexts.find(c=>c.cid===de.mcqCase);if(c)h+='<div class="case">'+E(c.text)+'</div>'}
   h+='<details><summary>Câu '+(i+1)+' · '+(x.ok?'Đúng':'Sai')+' · '+E(q.q)+'</summary><p>Chọn: '+selected+'; đáp án: '+right+'</p><p>'+E(q.e||"")+'</p><p class="muted">'+E(q.b||"")+'</p></details>';
  });h+='</article>';
 }
 h+='<article><h3>Phần '+(mixed?'II':'tự luận')+'. Tự luận ('+(mixed?'4':'10')+' điểm)</h3>';
 ids.forEach((id,i)=>{const c=caseBy(id);if(!c)throw Error("Thiếu tình huống "+id);

  c.questions.forEach((q,j)=>{
   const key=id+"_"+j,guide=guideFor(id,j),input=ans[key]||"",pos=i*4+j;
   const ev=legalGrade(input,guide),suggested=mixed?Math.round(ev.score*.8*100)/100:ev.score;
   const selected=g?.muc?.[pos]!=null?g.muc[pos]:suggested;
   h+='<div class="q"><strong>'+E(q)+'</strong><div class="ans">'+E(input||"(Không trả lời)")+'</div><details><summary>Đáp án và nhận xét</summary><div class="ans">'+E(guide)+'</div>'+(ev.missing.length?'<p>Các ý cần rà soát:</p><ul>'+ev.missing.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'')+'</details><p class="mini muted">Điểm máy gợi ý: '+suggested.toFixed(2)+' / '+max.toFixed(2)+' điểm</p><label>Điểm tự luận (0 – '+max.toFixed(2)+')</label><input data-point="'+pos+'" type="number" min="0" max="'+max+'" step="0.05" value="'+E(selected)+'"></div>';
  });
 });h+='</article><article><div class="top"><span>Tổng điểm</span><strong class="score" id="total"></strong></div><label>Nhận xét</label><textarea id="review" maxlength="1000">'+E(g?.note||"")+'</textarea><button id="saveGrade">Lưu điểm đã điều chỉnh</button><p id="msg" class="error"></p></article>';
 app.innerHTML=h;
 $("#back").onclick=()=>manageClass(ma);
 const points=()=>[...document.querySelectorAll("[data-point]")].map(x=>Math.max(0,Math.min(max,Number(x.value)||0)));
 const calc=()=>{const v=points(),essay=Math.round(v.reduce((a,b)=>a+b,0)*100)/100,total=Math.round((essay+tn.score)*100)/100;
  $("#total").textContent=(mixed?tn.score.toFixed(2)+' + '+essay.toFixed(2)+' = ':'')+total.toFixed(2)+'/10';
  return {v,essay,total};
 };
 document.querySelectorAll("[data-point]").forEach(x=>x.oninput=calc);calc();
 $("#saveGrade").onclick=async()=>{
  const {v,essay,total}=calc();

  try{
   await db.doc("pnl_dg_cham/"+ma+"__"+sv).set({maLop:ma,mssv:sv,muc:v,tuLuan:essay,tracNghiem:tn.score,soCauDung:tn.correct,diem:total,nguon:"giang-vien",xacNhan:true,note:$("#review").value.trim(),hocPhan:COURSE,maDe:de.set||"",phienBanDapAn:"mixed-2026-11-07",chamBoi:auth.currentUser?.uid||"",luc:FV.serverTimestamp()});
   manageClass(ma);
  }catch(e){err(e)}
 };
}
