<style>
:root{--bg:#f2f4f9;--paper:#fff;--ink:#18263a;--muted:#5a6678;--line:#dfe3ec;--band:#1d5677;--on-band:#fff;--head:#1f4f7a;--tint:#eef2f9;--accent:#b8691f;--ok:#1f7a4d;--ok-soft:#e5f4ec;--bad:#b3261e;--bad-soft:#fdecec;--warn:#8a5a00;--warn-soft:#fff4dc;
--f-display:"Merriweather",Georgia,"Times New Roman",serif;--f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--paper:#141d2c;--ink:#e6ebf3;--muted:#9ca8bb;--line:#27334a;--band:#143e57;--head:#9cc4e6;--tint:#1a2638;--accent:#e3a25e;--ok:#5fc492;--ok-soft:#173326;--bad:#f08a80;--bad-soft:#3a1d1d;--warn:#e8c06a;--warn-soft:#352a12}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.band{background:var(--band);color:var(--on-band);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}
.brand span{font:900 17px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;font:600 12px/1.3 var(--f-body);letter-spacing:.08em;opacity:.85}
#nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
#nav a,#nav button{color:var(--on-band);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;text-decoration:none;font:600 13px var(--f-body);cursor:pointer}
main{padding:24px 16px 48px}
h1,h2,h3{font-family:var(--f-display);color:var(--head);line-height:1.3}
h1{font-size:26px;margin:0 0 6px;text-transform:uppercase}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:17px;margin:18px 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 16px}
.narrow{max-width:560px;margin:0 auto}
.lead{color:var(--muted);margin:0 0 16px}
label.lab{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--head);outline-offset:1px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.row>div{flex:1 1 200px}
.btn{font:600 15px var(--f-body);border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--head);border-color:var(--head);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:6px 0}
.msg{color:var(--muted);font-size:14px}
.ok{color:var(--ok);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.open{background:var(--ok-soft);color:var(--ok)}.pill.closed{background:var(--bad-soft);color:var(--bad)}.pill.wait{background:var(--warn-soft);color:var(--warn)}
.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 16px}
.info dt{color:var(--muted)}.info dd{margin:0;font-weight:600}
.rules{background:var(--tint);border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:15px}
.rules ul{margin:6px 0 0;padding-left:20px}
/* bài làm */
.timer{position:sticky;top:60px;z-index:15;background:var(--paper);border-bottom:1px solid var(--line);margin:-24px -16px 16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock{font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--head)}
.clock.low{color:var(--bad)}
.navq{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 16px}
.navq button{width:34px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 12px var(--f-body);cursor:pointer}
.navq button.done{background:var(--head);border-color:var(--head);color:#fff}

.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}

.opt.sel{background:var(--tint);border-color:var(--head)}
.case{background:var(--tint);border-left:4px solid var(--head);border-radius:8px;padding:12px 16px;margin:0 0 10px;scroll-margin-top:130px}
.case h4{margin:0 0 6px;font:700 15px var(--f-body);color:var(--head)}
.case p{margin:0;text-align:justify}
.essay textarea{min-height:280px;line-height:1.6}
.count{font-size:13px;color:var(--muted);text-align:right}
/* quản trị */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
table.sheet{border:1px solid var(--line)}table.sheet th,table.sheet td{border:1px solid var(--line);padding:9px 10px;vertical-align:middle}table.sheet thead th{background:var(--tint);color:var(--head);text-align:left}table.sheet tbody tr:nth-child(even){background:color-mix(in srgb,var(--tint) 45%,transparent)}table.sheet .c{text-align:center}table.sheet td.score{font:700 18px var(--f-display);color:var(--head);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font:600 14px var(--f-body);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--head);border-color:var(--head);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.stat{background:var(--tint);border-radius:10px;padding:12px}
.stat b{display:block;font:700 22px var(--f-display);color:var(--head)}
.stat span{font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:6px 0 4px}
.bars div{flex:1;background:var(--head);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:var(--ink)}
.barlab{display:flex;gap:8px;font-size:12px;color:var(--muted)}.barlab span{flex:1;text-align:center}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ccard:hover{border-color:var(--head)}
.ccard b{font-family:var(--f-display);color:var(--head);font-size:17px}
.y{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.y.d1{border-color:var(--ok);background:var(--ok-soft)}.y.d05{border-color:var(--warn);background:var(--warn-soft)}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:1px 6px;margin:2px 3px 0 0;background:var(--tint);color:var(--muted)}
.chip.hit{background:var(--ok);color:#fff}
.ans{white-space:pre-wrap;background:var(--tint);border-radius:10px;padding:12px;max-height:340px;overflow:auto}
.right{color:var(--ok);font-weight:700}.wrong{color:var(--bad);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#modal[hidden]{display:none}
.dlg{background:var(--paper);border-radius:14px;max-width:880px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg.sm{max-width:460px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
@media (max-width:640px){h1{font-size:21px}.brand span{font-size:14px}.card{padding:16px}.timer{top:60px}}
@media print{.band,.timer,.navq,footer{display:none}body.modal-open #app{display:none}body.modal-open #modal{position:static;background:none;padding:0;overflow:visible}body.modal-open .dlg{box-shadow:none;max-width:none}body.modal-open .dlg .btn{display:none}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
"use strict";
/* ====== CẤU HÌNH ====== */
const FB_CFG={apiKey:"AIzaSyCIYY-dzhJ4rUYsXvBQivIxcziUC3hR1-U",authDomain:"phuc-nguyen-library.firebaseapp.com",projectId:"phuc-nguyen-library",storageBucket:"phuc-nguyen-library.firebasestorage.app",messagingSenderId:"842652271567",appId:"1:842652271567:web:23b95b5c4d6061497988ba"};
const ADMIN_UID="smoIpuX7qseqTeu9nToc9RYigku1";
const ADMIN_EMAILS=["luuhuong.nnpl@gmail.com","luuhuong.dhnv@gmail.com"];
/* Học phần đã có đủ ngân hàng (Lý thuyết ABCD + Tình huống có câu ABCD và gợi ý giải quyết). Thêm học phần mới vào đây. */
/* tuLuan: chương lấy tình huống tự luận (so khớp tên nhóm tình huống) */
const HOCPHAN=[{id:"luat-dan-su",name:"Luật Dân sự",tuLuan:["Thừa kế","Hợp đồng","Bồi thường thiệt hại ngoài hợp đồng"]}];
const MAX_ROI=10; /* rời trang quá số lần này thì tự nộp bài */
/* Cấu trúc đề: 30 lý thuyết + 10 tình huống ABCD (2 điểm/câu = 80) + 1 tự luận (20 điểm) = 100 điểm, quy về thang 10 */
const CT={lv:{NB:10,TH:12,VD:8},lt:30,thCases:[4,3,3],dLT:2,dTH:2,dTL:20};
/* Chấm tự luận theo từ khóa: ngưỡng gợi ý mức đạt của từng ý */
const NGUONG={dat:0.45,motPhan:0.2};

/* ====== TIỆN ÍCH ====== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const K=id=>String(id).replace(/[.\/]/g,"_");       /* khóa an toàn cho Firestore */
const LET="ABCDEFGH";
const pad=n=>String(n).padStart(2,"0");
const fmtDT=d=>d?pad(d.getHours())+":"+pad(d.getMinutes())+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear():"";
const toDate=t=>t&&t.toDate?t.toDate():(t instanceof Date?t:null);
const dtLocal=d=>d?d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()):"";
const r2=x=>Math.round(x*100)/100;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function strip(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase()}

firebase.initializeApp(FB_CFG);
const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;
let USER=null,ADMIN=false;
const isAdminUser=u=>!!u&&!u.isAnonymous&&(u.uid===ADMIN_UID||(u.emailVerified&&ADMIN_EMAILS.includes(u.email)));

/* ====== NGÂN HÀNG CÂU HỎI: đọc thẳng từ trang học phần, luôn khớp bản ôn tập mới nhất ====== */
const BANKS={};
async function loadBank(id){
  if(BANKS[id])return BANKS[id];
  const r=await fetch("../hp/"+id+".html",{cache:"no-cache"});
  if(!r.ok)throw new Error("Không tải được ngân hàng câu hỏi của học phần.");
  const t=await r.text();
  const m=t.match(/<script id="pn-data" type="application\/json">([\s\S]*?)<\/script>/);
  if(!m)throw new Error("Trang học phần không có khối dữ liệu.");
  const d=JSON.parse(m[1]);const byId={},cases={},caseCh={};
  d.q.forEach(q=>{if(q.id)byId[q.id]=q});
  (d.th||[]).forEach((g,gi)=>(g.items||[]).forEach(it=>{cases[it.cid]=it;caseCh[it.cid]=gi}));
  return BANKS[id]={d,byId,cases,caseCh,lt:d.q.filter(q=>q.id&&!q.cid&&Array.isArray(q.o)),name:d.meta&&d.meta.name||id};
}
function pickSpread(pool,n){
  const by={};pool.forEach(q=>(by[q.g]=by[q.g]||[]).push(q));
  const groups=shuffle(Object.keys(by)).map(k=>shuffle(by[k]));const out=[];
  while(out.length<n&&groups.some(g=>g.length)){for(const g of groups){if(out.length>=n)break;if(g.length)out.push(g.pop())}}
  return out;
}
function buildDe(B,hpId){
  const used=new Set();let lt=[];
  for(const [lv,n] of Object.entries(CT.lv)){const p=pickSpread(B.lt.filter(q=>q.lv===lv),n);p.forEach(q=>used.add(q.id));lt.push(...p)}
  if(lt.length<CT.lt)lt.push(...pickSpread(B.lt.filter(q=>!used.has(q.id)),CT.lt-lt.length));
  lt=shuffle(lt).map(q=>q.id);
  const valid=Object.values(B.cases).filter(c=>Array.isArray(c.mcq)&&c.mcq.length>=4&&c.mcq.every(id=>B.byId[id])&&Array.isArray(c.guide)&&c.guide.length);
  /* tự luận: chỉ lấy từ các chương quy định (Luật Dân sự: Thừa kế, Hợp đồng, Bồi thường ngoài hợp đồng) */
  const hp=HOCPHAN.find(h=>h.id===hpId)||{};const names=B.d.th.map(g=>strip(g.name));
  const tlChs=(hp.tuLuan||[]).map(t=>names.findIndex(n=>n.includes(strip(t)))).filter(i=>i>=0);
  const tlPool=valid.filter(c=>!tlChs.length||tlChs.includes(B.caseCh[c.cid]));
  if(!tlPool.length)throw new Error("Chưa có tình huống tự luận cho các chương đã chọn.");
  const tlCase=shuffle(tlPool)[0];
  /* 3 tình huống trắc nghiệm: khác chương với nhau và khác chương câu tự luận */
  const by={};valid.filter(c=>c!==tlCase&&B.caseCh[c.cid]!==B.caseCh[tlCase.cid]).forEach(c=>(by[B.caseCh[c.cid]]=by[B.caseCh[c.cid]]||[]).push(c));
  const picked=[];
  for(const ch of shuffle(Object.keys(by))){if(picked.length>=3)break;picked.push(shuffle(by[ch])[0])}
  if(picked.length<3){const rest=shuffle(valid.filter(c=>c!==tlCase&&!picked.includes(c)));while(picked.length<3&&rest.length)picked.push(rest.pop())}
  if(picked.length<3)throw new Error("Ngân hàng tình huống chưa đủ để trộn đề.");
  const th=CT.thCases.map((k,i)=>({cid:picked[i].cid,q:shuffle(picked[i].mcq).slice(0,k).sort()}));
  const perm={};[...lt,...th.flatMap(x=>x.q)].forEach(id=>{perm[K(id)]=shuffle([...Array(B.byId[id].o.length).keys()]).join("")});
  return {lt,th,tl:tlCase.cid,perm};
}
function questionsOf(de){return [...de.lt,...de.th.flatMap(x=>x.q)]}

/* ====== CHẤM ====== */
function chamTN(B,de,answers){
  answers=answers||{};let lt=0,th=0;const sai=[];
  de.lt.forEach(id=>{const q=B.byId[id];if(!q)return;const a=answers[K(id)];if(a!=null&&+a===q.a)lt+=CT.dLT;else sai.push(id)});
  de.th.forEach(c=>c.q.forEach(id=>{const q=B.byId[id];if(!q)return;const a=answers[K(id)];if(a!=null&&+a===q.a)th+=CT.dTH;else sai.push(id)}));
  return {lt,th,sai};
}
const STOP=new Set("và của là thì mà các những được bị cho với có không trong theo này đó khi nếu để do vì nên từ đến tại về như một hai ba bốn hoặc hay cũng đã sẽ đang phải việc trường hợp quy định điều khoản điểm bộ luật blds hngđ năm nhưng vẫn lại ra vào trên dưới nào gì ai còn rằng thể sau trước chỉ đều cả mọi bên ông bà anh chị em".split(" "));
const CHUNG=new Set(["toa an","dan su","ap dung","quan he","phap luat"]);
function toks(s){return String(s||"").normalize("NFC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim().split(/\s+/).filter(Boolean)}
function bigrams(s){const out=new Set();String(s||"").split(/[,.;:()\[\]"“”?!\n–—-]+/).forEach(seg=>{const t=toks(seg);for(let i=0;i<t.length-1;i++){const a=t[i],b=t[i+1];if(STOP.has(a)||STOP.has(b)||/^\d+$/.test(a)||/^\d+$/.test(b))continue;const k=strip(a+" "+b);if(!CHUNG.has(k))out.add(k)}});return out}
function cites(s){const out=new Set();const re=/dieu\s+(\d+)/g;let m;const t=strip(s);while((m=re.exec(t)))out.add("điều "+m[1]);return out}
function tuKhoa(c){
  const given=bigrams(c.text+" "+(c.ask||[]).join(" "));
  return c.guide.map(y=>{let kw=[...bigrams(y)].filter(b=>!given.has(b));if(kw.length<3)kw=[...bigrams(y)];return {y,kw,ct:[...cites(y)]}});
}
function chamTL(c,essay){
  const y=tuKhoa(c),A=bigrams(essay||""),C=cites(essay||""),n=y.length,per=CT.dTL/n;
  return y.map(x=>{
    const hit=x.kw.filter(b=>A.has(b)),hitC=x.ct.filter(b=>C.has(b));
    const cov=Math.min(1,hit.length/Math.max(4,Math.ceil(x.kw.length*0.6)));const cc=x.ct.length?hitC.length/x.ct.length:null;
    const sc=cc==null?cov:0.7*cov+0.3*cc;
    const muc=(essay||"").trim().length<15?0:sc>=NGUONG.dat?1:sc>=NGUONG.motPhan?0.5:0;
    return {...x,hit,hitC,sc:r2(sc),muc,per};
  });
}

/* ====== HỘP THOẠI ====== */
function modal(html,cls){const m=$("#modal");m.innerHTML='<div class="dlg '+(cls||"")+'" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;document.body.style.overflow="hidden";document.body.classList.add("modal-open");const f=m.querySelector("button,input,textarea,select");if(f)setTimeout(()=>f.focus(),20);return m}
function closeModal(){const m=$("#modal");m.hidden=true;m.innerHTML="";document.body.style.overflow="";document.body.classList.remove("modal-open")}
function ask(title,text,okLabel,danger){return new Promise(res=>{const m=modal('<h2>'+esc(title)+'</h2><p>'+text+'</p><div class="row" style="justify-content:flex-end"><button class="btn" id="m-no">Quay lại</button><button class="btn '+(danger?"danger":"primary")+'" id="m-ok">'+esc(okLabel||"Đồng ý")+'</button></div>',"sm");
  m.querySelector("#m-no").onclick=()=>{closeModal();res(false)};m.querySelector("#m-ok").onclick=()=>{closeModal();res(true)}})}

let EXAM=null;
function lopTrangThai(l){const now=new Date(),a=toDate(l.openAt),b=toDate(l.closeAt);if(!l.open)return {k:"closed",t:"Đang khóa"};if(a&&now<a)return {k:"wait",t:"Chưa đến giờ (mở lúc "+fmtDT(a)+")"};if(b&&now>b)return {k:"closed",t:"Đã hết giờ (đóng lúc "+fmtDT(b)+")"};return {k:"open",t:"Đang mở"}}

function studentEntry(msg){
  const last=JSON.parse(store.get("pndg-last")||"{}");
  $("#app").innerHTML=`<section class="card narrow">
    <h1>Đánh giá định kỳ</h1>
    <p class="lead">Nhập mã lớp do giảng viên cung cấp và mã sinh viên của bạn. Không cần đăng nhập tài khoản.</p>
    <form id="f-in" novalidate>
      <div class="row"><div><label class="lab" for="in-ma">Mã lớp</label><input type="text" id="in-ma" maxlength="24" autocomplete="off" spellcheck="false" style="text-transform:uppercase" value="${esc(last.ma||"")}" placeholder="Ví dụ: DS-K25A"></div></div>
      <div class="row"><div><label class="lab" for="in-sv">Mã sinh viên</label><input type="text" id="in-sv" maxlength="20" autocomplete="off" spellcheck="false" style="text-transform:uppercase" value="${esc(last.sv||"")}"></div></div>
      <div class="err" id="in-err" role="alert">${esc(msg||"")}</div>
      <button class="btn primary" type="submit" id="in-go">Tiếp tục</button>
    </form></section>`;
  $("#f-in").onsubmit=async e=>{e.preventDefault();
    const ma=$("#in-ma").value.trim().toUpperCase(),sv=$("#in-sv").value.trim().toUpperCase().replace(/\s+/g,"");
    const err=$("#in-err");err.textContent="";
    if(!/^[A-Z0-9_-]{2,24}$/.test(ma)){err.textContent="Mã lớp chỉ gồm chữ, số, dấu gạch.";return}
    if(!/^[A-Z0-9_-]{2,20}$/.test(sv)){err.textContent="Mã sinh viên chưa hợp lệ.";return}
    $("#in-go").disabled=true;$("#in-go").textContent="Đang kiểm tra…";
    try{await checkIn(ma,sv)}catch(x){console.error(x);err.textContent=x.userMsg||"Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.";$("#in-go").disabled=false;$("#in-go").textContent="Tiếp tục"}
  };
  /* đến từ ô Đánh giá định kỳ ở trang chủ: tự kiểm tra luôn */
  if(!msg&&store.get("pndg-go")==="1"&&last.ma&&last.sv){store.del("pndg-go");const f=$("#f-in");if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event("submit",{cancelable:true}))}
}
function uerr(m){const e=new Error(m);e.userMsg=m;return e}
async function ensureUser(){if(auth.currentUser){USER=auth.currentUser;return USER}USER=(await auth.signInAnonymously()).user;return USER}
async function checkIn(ma,sv){
  await ensureUser();
  const ls=await db.doc("pnl_dg_lop/"+ma).get();
  if(!ls.exists)throw uerr("Không tìm thấy mã lớp. Kiểm tra lại với giảng viên.");
  const lop=ls.data();
  const ss=await db.doc("pnl_dg_sv/"+ma+"__"+sv).get();
  if(!ss.exists)throw uerr("Mã sinh viên không có trong danh sách lớp "+ma+".");
  const svd=ss.data();store.set("pndg-last",JSON.stringify({ma,sv}));
  const id=ma+"__"+sv;let bai=null;
  try{const bs=await db.doc("pnl_dg_bai/"+id).get();bai=bs.exists?bs.data():null}
  catch(x){if(x.code==="permission-denied")throw uerr("Mã sinh viên này đã bắt đầu hoặc đã nộp bài trên một thiết bị khác. Mỗi sinh viên chỉ làm một lần — liên hệ giảng viên nếu có sự cố.");throw x}
  if(bai&&bai.status==="da-nop")return doneView(lop,svd,bai);
  const st=lopTrangThai(lop);
  if(bai&&bai.status==="dang-lam")return startExam({ma,sv,id,lop,svd,bai});
  if(st.k!=="open")throw uerr("Bài kiểm tra của lớp "+ma+": "+st.t+".");
  confirmView({ma,sv,id,lop,svd});
}
function confirmView(c){
  const hp=HOCPHAN.find(h=>h.id===c.lop.hocPhan);
  $("#app").innerHTML=`<section class="card narrow"><h1>Xác nhận thông tin</h1>
    <dl class="info"><dt>Họ và tên</dt><dd>${esc(c.svd.hoTen)}</dd><dt>Mã sinh viên</dt><dd>${esc(c.sv)}</dd><dt>Lớp</dt><dd>${esc(c.lop.ten||c.ma)} (${esc(c.ma)})</dd><dt>Học phần</dt><dd>${esc(hp?hp.name:c.lop.hocPhanTen||c.lop.hocPhan)}</dd><dt>Thời gian</dt><dd>${c.lop.thoiGian|0} phút</dd></dl>
    <div class="rules"><b>Quy định làm bài</b><ul>
      <li>Đề gồm 30 câu lý thuyết, 10 câu tình huống trắc nghiệm và 1 câu tự luận giải quyết tình huống.</li>
      <li>Mỗi sinh viên chỉ được làm <b>một lần</b>. Bấm "Bắt đầu" là bắt đầu tính giờ.</li>
      <li>Bài được lưu liên tục; hết giờ bài tự nộp. Không tải lại trang trên máy khác.</li>
      <li>Câu tự luận phải tự gõ, không dán được nội dung sao chép.</li><li>Mỗi lần rời khỏi trang làm bài (chuyển thẻ, chuyển ứng dụng) đều bị ghi lại. <b>Rời trang quá 10 lần, bài bị khóa và tự động nộp.</b></li>
    </ul></div>
    <label style="display:flex;gap:8px;align-items:flex-start;margin:0 0 14px"><input type="checkbox" id="cf-ok" style="margin-top:5px"><span>Tôi xác nhận đúng là <b>${esc(c.svd.hoTen)}</b>, mã sinh viên ${esc(c.sv)}.</span></label>
    <div class="err" id="cf-err" role="alert"></div>
    <div class="row"><button class="btn" id="cf-back">Không phải tôi</button><button class="btn primary" id="cf-go" disabled>Bắt đầu làm bài</button></div></section>`;
  $("#cf-ok").onchange=e=>$("#cf-go").disabled=!e.target.checked;
  $("#cf-back").onclick=()=>studentEntry();
  $("#cf-go").onclick=async()=>{$("#cf-go").disabled=true;$("#cf-go").textContent="Đang tạo đề…";
    try{await ensureUser();const B=await loadBank(c.lop.hocPhan);const de=buildDe(B,c.lop.hocPhan);
      await db.doc("pnl_dg_bai/"+c.id).set({maLop:c.ma,mssv:c.sv,hoTen:c.svd.hoTen,uid:USER.uid,status:"dang-lam",startedAt:FV.serverTimestamp(),de,hocPhan:c.lop.hocPhan,roiTrang:0});
      const bai=(await db.doc("pnl_dg_bai/"+c.id).get()).data();startExam({...c,bai});
    }catch(x){console.error(x);$("#cf-err").textContent=x.code==="permission-denied"?"Không bắt đầu được: bài kiểm tra đã đóng, hoặc mã sinh viên này đã có bài làm.":(x.message||"Lỗi kết nối, thử lại.");$("#cf-go").disabled=false;$("#cf-go").textContent="Bắt đầu làm bài"}};
}
async function startExam(c){
  const B=await loadBank(c.lop.hocPhan);const de=c.bai.de;
  const stamp=(toDate(c.bai.startedAt)||new Date(0)).getTime()+"|"+de.tl;
  let local=JSON.parse(store.get("pndg-"+c.id)||"{}");if(local.stamp!==stamp)local={};
  const answers=Object.assign({},c.bai.answers||{},local.answers||{});
  const essay=(local.essay&&local.essay.length>=(c.bai.essay||"").length)?local.essay:(c.bai.essay||"");
  const start=toDate(c.bai.startedAt)||new Date();const close=toDate(c.lop.closeAt);
  let end=new Date(start.getTime()+(c.lop.thoiGian|0)*60000);if(close&&close<end)end=close;
  EXAM={...c,B,de,answers,essay,end,stamp,roi:c.bai.roiTrang|0,active:true,dirty:false,lastSave:0};
  renderExam();if(EXAM.roi>MAX_ROI)submit(true,"roi");else roiWarn();
}
function optHtml(q,id,perm,sel){
  const order=(perm||"").split("").map(Number);const ord=order.length===q.o.length?order:[...q.o.keys()];
  return ord.map((oi,pos)=>`<label class="opt${sel===oi?" sel":""}"><input type="radio" name="q-${esc(K(id))}" value="${oi}"${sel===oi?" checked":""}><span><b>${LET[pos]}.</b> ${esc(q.o[oi])}</span></label>`).join("");
}
function renderExam(){
  const E=EXAM,B=E.B,de=E.de;let n=0,h="",navh="";
  const qBlock=id=>{n++;const q=B.byId[id];const sel=E.answers[K(id)]!=null?+E.answers[K(id)]:null;navh+=`<button type="button" data-go="qq-${n}" class="${sel!=null?"done":""}" id="nb-${esc(K(id))}">${n}</button>`;
    return `<div class="q" id="qq-${n}"><p class="stem"><b>Câu ${n}.</b> ${esc(q.q)}</p>${optHtml(q,id,de.perm[K(id)],sel)}</div>`};
  h+=`<div class="sec-title">Phần I. Lý thuyết (30 câu × 2 điểm)</div>`+de.lt.map(qBlock).join("");
  h+=`<div class="sec-title">Phần II. Tình huống trắc nghiệm (10 câu × 2 điểm)</div>`;
  de.th.forEach((c,i)=>{const cs=B.cases[c.cid];h+=`<div class="case"><h4>Tình huống ${i+1}</h4><p>${esc(cs.text)}</p></div>`+c.q.map(qBlock).join("")});
  const tl=B.cases[de.tl];navh+=`<button type="button" data-go="qq-tl" id="nb-tl" class="${E.essay.trim()?"done":""}">TL</button>`;
  h+=`<div class="sec-title">Phần III. Tự luận (20 điểm)</div><div class="case" id="qq-tl"><h4>Tình huống ${de.th.length+1}</h4><p>${esc(tl.text)}</p></div>
    <div class="q essay"><p class="stem">Anh/chị hãy giải quyết tình huống trên theo các yêu cầu sau, nêu rõ căn cứ pháp lý:</p><ol>${(tl.ask||[]).map(a=>"<li>"+esc(a)+"</li>").join("")}</ol>
    <label class="lab" for="essay">Bài làm</label><textarea id="essay" spellcheck="false" placeholder="Trình bày lập luận và căn cứ pháp lý (điều, khoản, văn bản)…">${esc(E.essay)}</textarea><div class="count" id="e-count"></div><p class="msg" id="e-paste"></p></div>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn primary" id="x-submit">Nộp bài</button></div>`;
  $("#app").innerHTML=`<div class="timer"><div><b>${esc(E.svd.hoTen)}</b> · ${esc(E.sv)} · ${esc(E.ma)}</div><div><span class="msg" id="x-save"></span> <span class="clock" id="x-clock">--:--</span></div></div>
    <div class="navq" aria-label="Chuyển nhanh tới câu">${navh}</div>${h}`;
  $$(".navq button").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.go);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  $("#app").addEventListener("change",e=>{const t=e.target;if(t.type!=="radio")return;const id=t.name.slice(2);E.answers[id]=+t.value;
    t.closest(".q").querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));
    const nb=document.getElementById("nb-"+id);if(nb)nb.classList.add("done");touch()});
  const ta=$("#essay");const cnt=()=>{$("#e-count").textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+" từ"};cnt();
  ta.addEventListener("input",()=>{E.essay=ta.value;cnt();$("#nb-tl").classList.toggle("done",!!ta.value.trim());touch()});
  ta.addEventListener("paste",e=>{e.preventDefault();$("#e-paste").textContent="Không được dán nội dung vào bài tự luận. Hãy tự trình bày."});
  ta.addEventListener("drop",e=>e.preventDefault());
  $("#x-submit").onclick=async()=>{const sum=questionsOf(E.de).length,done=questionsOf(E.de).filter(id=>E.answers[K(id)]!=null).length;
    const ok=await ask("Nộp bài?","Bạn đã trả lời "+done+"/"+sum+" câu trắc nghiệm"+(E.essay.trim()?"":" và <b>chưa làm câu tự luận</b>")+". Sau khi nộp sẽ không sửa được.","Nộp bài");if(ok)submit(false)};
  tick();E.timer=setInterval(tick,1000);E.saver=setInterval(()=>save(false),20000);
}
function touch(){const E=EXAM;E.dirty=true;store.set("pndg-"+E.id,JSON.stringify({stamp:E.stamp,answers:E.answers,essay:E.essay}));if(Date.now()-E.lastSave>15000)save(false)}
async function save(force){const E=EXAM;if(!E||!E.active||(!E.dirty&&!force))return;E.lastSave=Date.now();
  try{await db.doc("pnl_dg_bai/"+E.id).update({answers:E.answers,essay:E.essay.slice(0,20000),roiTrang:E.roi,luu:FV.serverTimestamp()});E.dirty=false;$("#x-save").textContent="Đã lưu "+fmtDT(new Date()).slice(0,5)}
  catch(x){console.warn(x);$("#x-save").textContent="Chưa lưu được lên máy chủ (đã giữ trên máy)"}}
function tick(){const E=EXAM;if(!E||!E.active)return;const s=Math.max(0,Math.round((E.end-new Date())/1000));const el=$("#x-clock");if(el){el.textContent=pad(Math.floor(s/60))+":"+pad(s%60);el.classList.toggle("low",s<=300)}
  if(s<=0)submit(true)}
async function submit(auto,why){const E=EXAM;if(!E||!E.active)return;E.active=false;E.why=why||"";clearInterval(E.timer);clearInterval(E.saver);
  $("#app").insertAdjacentHTML("afterbegin",'<div class="card narrow" id="x-wait"><p>'+(why==="roi"?"Bạn đã rời trang quá "+MAX_ROI+" lần — bài bị khóa và tự động nộp. ":auto?"Hết giờ. ":"")+'Đang nộp bài…</p></div>');window.scrollTo(0,0);
  for(let i=0;i<3;i++){try{await db.doc("pnl_dg_bai/"+E.id).update({answers:E.answers,essay:E.essay.slice(0,20000),roiTrang:E.roi,status:"da-nop",submittedAt:FV.serverTimestamp()});
      store.del("pndg-"+E.id);const bai=(await db.doc("pnl_dg_bai/"+E.id).get()).data();return doneView(E.lop,E.svd,bai,E.why)}catch(x){console.warn(x);await new Promise(r=>setTimeout(r,1500))}}
  E.active=true;$("#x-wait").innerHTML='<p class="err">Chưa nộp được bài (mất mạng hoặc đã quá giờ đóng). Bài vẫn được giữ trên máy này. Kiểm tra mạng rồi bấm nộp lại, hoặc báo ngay cho giảng viên.</p><button class="btn primary" id="x-retry">Nộp lại</button>';
  $("#x-retry").onclick=()=>submit(false);
}
function doneView(lop,svd,bai,why){EXAM=null;if(!why&&(bai.roiTrang|0)>MAX_ROI)why="roi";
  $("#app").innerHTML=`<section class="card narrow"><h1>Đã nộp bài</h1><p class="ok">Bài làm của ${esc(svd.hoTen)} (${esc(bai.mssv)}) đã được ghi nhận${bai.submittedAt?" lúc "+esc(fmtDT(toDate(bai.submittedAt))):""}.</p>
  ${why==="roi"?`<p class="err">Bài bị khóa và tự động nộp vì rời khỏi trang làm bài quá ${MAX_ROI} lần.</p>`:""}<p class="msg">Kết quả sẽ do giảng viên thông báo. Bạn có thể đóng trang này.</p><a class="btn" href="../index.html" style="display:inline-block;text-decoration:none">Về trang chủ</a></section>`}
document.addEventListener("visibilitychange",()=>{if(!EXAM||!EXAM.active)return;
  if(document.hidden){EXAM.roi++;EXAM.dirty=true;store.set("pndg-"+EXAM.id,JSON.stringify({stamp:EXAM.stamp,answers:EXAM.answers,essay:EXAM.essay}));
    if(EXAM.roi>MAX_ROI)submit(true,"roi");else save(true)}
  else roiWarn()});
function roiWarn(){const E=EXAM;if(!E||!E.active||!E.roi)return;let w=$("#x-roi");if(!w){$("#app").insertAdjacentHTML("afterbegin",'<div id="x-roi" role="alert" style="background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-weight:600"></div>');w=$("#x-roi")}
  w.textContent="Bạn đã rời khỏi trang làm bài "+E.roi+"/"+MAX_ROI+" lần. Rời trang quá "+MAX_ROI+" lần, bài sẽ bị khóa và tự động nộp.";w.scrollIntoView({block:"nearest"})}
window.addEventListener("beforeunload",e=>{if(EXAM&&EXAM.active){e.preventDefault();e.returnValue=""}});

  <form id="al" novalidate><div class="row"><div><label class="lab" for="al-em">Email</label><input type="email" id="al-em" autocomplete="username" value="luuhuong.nnpl@gmail.com"></div></div>
  <div class="row"><div><label class="lab" for="al-pw">Mật khẩu</label><input type="password" id="al-pw" autocomplete="current-password"></div></div>
  <div class="err" id="al-err" role="alert"></div><div class="row"><button class="btn primary" type="submit">Đăng nhập</button><button class="btn" type="button" id="al-g">Đăng nhập bằng Google</button><a class="btn" href="#" style="text-decoration:none">Giao diện sinh viên</a></div></form></section>`;

async function adminView(){
  if(!ADMIN)return adminLogin();
  const parts=location.hash.split("/");if(parts[1])return classView(decodeURIComponent(parts[1]));
  $("#app").innerHTML=`<h1>Đánh giá định kỳ — Quản trị</h1><p class="lead">Mỗi lớp có mã lớp và danh sách sinh viên riêng. Sinh viên vào làm bài bằng mã lớp + mã sinh viên.</p>
    <div class="row"><button class="btn primary" id="a-new">+ Tạo lớp</button><button class="btn" id="a-demo">Tạo lớp thử (dữ liệu giả)</button></div><div id="a-list"><p class="msg">Đang tải…</p></div>`;

async function saveRoster(ma,rows){
  const old=await db.collection("pnl_dg_sv").where("maLop","==",ma).get();const keep=new Set(rows.map(r=>r.mssv));
  let ops=[];old.docs.forEach(d=>{if(!keep.has(d.data().mssv))ops.push(b=>b.delete(d.ref))});
  rows.forEach(r=>ops.push(b=>b.set(db.doc("pnl_dg_sv/"+ma+"__"+r.mssv),{maLop:ma,mssv:r.mssv,hoTen:r.hoTen})));
  ops.push(b=>b.set(db.doc("pnl_dg_ds/"+ma),{rows,updated:FV.serverTimestamp()}));
  ops.push(b=>b.set(db.doc("pnl_dg_lop/"+ma),{siSo:rows.length},{merge:true}));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}

      <p class="msg" style="margin:6px 0 0">Căn cứ: ${esc(q.b||"")}</p></div>`};
  let h=`<div class="sec-title">Phần I. Lý thuyết</div>`+de.lt.map(qHtml).join("");

  const tl=B.cases[de.tl]||{};const c=AD.cham[mssv];
  h+=`<div class="sec-title">Phần III. Tự luận</div><div class="case"><h4>Tình huống ${de.th.length+1} <span class="msg">[${esc(de.tl)}]</span></h4><p>${esc(tl.text||"")}</p><ol>${(tl.ask||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ol></div>
    <p class="lab">Bài làm của sinh viên (${(b.essay||"").trim()?(b.essay.trim().split(/\s+/).length+" từ"):"bỏ trống"})</p><div class="ans" style="max-height:none">${esc(b.essay||"(bỏ trống)")}</div>
    ${c&&c.xacNhan?`<p class="ok">Điểm tự luận đã xác nhận: ${String(c.diem).replace(".",",")}/20${c.note?" · Nhận xét: "+esc(c.note):""}</p>`:'<p class="msg">Tự luận chưa được xác nhận điểm (đang dùng điểm gợi ý theo từ khóa).</p>'}`;
  const m=modal(`<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Bài làm · ${esc(sv.hoTen)} · ${esc(mssv)}</h2><div><button class="btn small" id="p-print">In / lưu PDF</button> <button class="btn small" id="p-x">Đóng</button></div></div>
    <dl class="info" style="margin-top:12px"><dt>Lớp</dt><dd>${esc(AD.ma)} · ${esc(AD.l.ten||"")} · ${esc(AD.l.hocPhanTen||"")}</dd><dt>Ngày sinh</dt><dd>${esc(sv.ngaySinh||"–")}</dd>
      <dt>Bắt đầu</dt><dd>${esc(fmtDT(toDate(b.startedAt)))}</dd><dt>Nộp bài</dt><dd>${b.submittedAt?esc(fmtDT(toDate(b.submittedAt))):"Chưa nộp"+(b.luu?" (lưu lần cuối "+esc(fmtDT(toDate(b.luu)))+")":"")}</dd>
      <dt>Rời trang làm bài</dt><dd>${b.roiTrang|0} lần</dd><dt>Kết quả</dt><dd>Lý thuyết ${r.lt}/60 · Tình huống ${r.th}/20 · Tự luận ${String(r.tl).replace(".",",")}/20${r.xn?"":" (gợi ý)"} · Tổng ${String(r.tong).replace(".",",")}/100 · <b>Thang 10: ${String(r.t10).replace(".",",")}</b></dd></dl>
    <p class="msg">Phương án hiển thị đúng thứ tự A, B, C, D như sinh viên đã thấy khi làm bài. Ô viền xanh là đáp án đúng.</p>${h}`);
  m.querySelector("#p-x").onclick=closeModal;m.querySelector("#p-print").onclick=()=>window.print();
}
function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("Không tải được thư viện Excel"));document.head.appendChild(s)})}
async function exportXls(rows){
  const X=await loadXLSX();

  rows.forEach((r,i)=>data.push([i+1,r.sv.mssv,r.sv.hoTen,r.sv.ngaySinh||"",r.b?r.t10:""]));
  const ws=X.utils.aoa_to_sheet(data);ws["!cols"]=[{wch:5},{wch:14},{wch:28},{wch:12},{wch:8}];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,"Bang diem");X.writeFile(wb,"Bang-diem-"+AD.ma+".xlsx");
  const cho=rows.filter(r=>r.b&&!r.xn).length;if(cho)alertMsg("Đã xuất bảng điểm. Lưu ý: còn "+cho+" bài chưa xác nhận điểm tự luận, điểm của các bài này đang là điểm tạm.");
}

function fmtNS(v,X){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return pad(d.getUTCDate())+"/"+pad(d.getUTCMonth()+1)+"/"+d.getUTCFullYear()}
  if(typeof v==="number"&&X&&v>10000&&v<80000){const p=X.SSF.parse_date_code(v);return pad(p.d)+"/"+pad(p.m)+"/"+p.y}return String(v||"").trim()}
function parseRows(aoa,X){
  const norm=s=>strip(s).replace(/[^a-z0-9]/g,"");let hi=-1,cM=-1,cT=-1,cH=-1,cN=-1,cD=-1;
  for(let i=0;i<Math.min(aoa.length,15);i++){const r=aoa[i].map(norm);const m=r.findIndex(x=>/^(mssv|masv|masinhvien|ma|msv|masosinhvien)$/.test(x));
    if(m>=0){hi=i;cM=m;r.forEach((x,j)=>{if(/^(hovaten|hoten|hotensinhvien)$/.test(x))cT=j;else if(/^(ho|hodem|holot)$/.test(x))cH=j;else if(x==="ten")cN=j;else if(/ngaysinh|namsinh/.test(x))cD=j});break}}
  const out=[],seen=new Set();
  aoa.slice(hi+1).forEach(r=>{let mssv,ten,ns;
    if(hi>=0){mssv=r[cM];ten=cT>=0?r[cT]:[cH>=0?r[cH]:"",cN>=0?r[cN]:""].join(" ");ns=cD>=0?r[cD]:""}else{mssv=r[0];ten=r[1];ns=r[2]}
    mssv=String(mssv==null?"":mssv).trim().toUpperCase().replace(/\s+/g,"");ten=String(ten||"").replace(/\s+/g," ").trim();
    if(!/^[A-Z0-9_-]{2,20}$/.test(mssv)||!ten||seen.has(mssv))return;seen.add(mssv);out.push({mssv,hoTen:ten,ngaySinh:fmtNS(ns,X)})});
  return out;
}
function preview(rows){
  const p=$("#ds-prev");if(!rows.length){p.innerHTML='<p class="err">Không tìm thấy dòng hợp lệ (cần có MSSV và họ tên).</p>';return}
  p.innerHTML=`<p class="ok">Đọc được ${rows.length} sinh viên. Kiểm tra vài dòng đầu:</p><table><tbody>${rows.slice(0,5).map(s=>`<tr><td>${esc(s.mssv)}</td><td>${esc(s.hoTen)}</td><td>${esc(s.ngaySinh)}</td></tr>`).join("")}</tbody></table>
    <p class="msg">Lưu sẽ <b>thay thế</b> danh sách hiện tại. Bài làm đã có của sinh viên vẫn được giữ.</p><button class="btn primary" id="ds-save">Lưu danh sách</button> <span class="err" id="ds-err"></span>`;
  $("#ds-save").onclick=async()=>{$("#ds-save").disabled=true;try{await saveRoster(AD.ma,rows);AD.tab="ds";classView(AD.ma)}catch(x){$("#ds-err").textContent="Không lưu được ("+(x.code||x.message)+")";$("#ds-save").disabled=false}};
}
