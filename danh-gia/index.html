<style>

<script>
"use strict";
/* ====== CẤU HÌNH ====== */
const FB_CFG={apiKey:"AIzaSyCIYY-dzhJ4rUYsXvBQivIxcziUC3hR1-U",authDomain:"phuc-nguyen-library.firebaseapp.com",projectId:"phuc-nguyen-library",storageBucket:"phuc-nguyen-library.firebasestorage.app",messagingSenderId:"842652271567",appId:"1:842652271567:web:23b95b5c4d6061497988ba"};
const ADMIN_UID="smoIpuX7qseqTeu9nToc9RYigku1";
const ADMIN_EMAILS=["luuhuong.nnpl@gmail.com","luuhuong.dhnv@gmail.com"];
/* Học phần đã có đủ ngân hàng (Lý thuyết ABCD + Tình huống có câu ABCD và gợi ý giải quyết). Thêm học phần mới vào đây. */
/* tuLuan: chương lấy tình huống tự luận (so khớp tên nhóm tình huống) */
/* mode:"tl" = bài chỉ có 01 câu tự luận (đề trong de/<id>.json, ý chính + từ khóa trong de/<id>.dat, chỉ quản trị tải) */
const HOCPHAN=[{id:"luat-dan-su",name:"Luật Dân sự",tuLuan:["Thừa kế","Hợp đồng","Bồi thường thiệt hại ngoài hợp đồng"],ma:"DS"},
  {id:"ky-nang-tu-van-phap-luat-dan-su",name:"Kỹ năng tư vấn pháp luật dân sự",mode:"tn",src:"../ky-nang-tu-van-phap-luat-dan-su/index.html",tnCases:3,thoiGian:60,ma:"TV"}];
/* mode:"tn" (06/11/2026) = đề chỉ gồm tình huống trắc nghiệm: rút tnCases tình huống khác chương, lấy đủ các câu của mỗi tình huống, chấm thang 10.
   Bài đã nộp theo đề tự luận cũ (de.tl) vẫn chấm theo ngân hàng tự luận de/<id>.json + .dat. */
const hpOf=id=>HOCPHAN.find(h=>h.id===id)||{};
const isTL=id=>hpOf(id).mode==="tl";
const isTN=id=>hpOf(id).mode==="tn";
const laTLCu=(id,de)=>isTN(id)&&!!(de&&de.tl); /* bài tự luận cũ của học phần đã chuyển sang trắc nghiệm */
const bankFor=(id,de,withKey)=>laTLCu(id,de)?loadTL(id,withKey):loadBank(id,withKey);
const DAT_KEY="KNTV-APAG-2026";
const MAX_ROI=10; /* rời trang quá số lần này thì tự nộp bài */
/* Cấu trúc đề (sửa 06/11/2026): 30 lý thuyết + 10 tình huống ABCD (2,25 điểm/câu = 90) + 1 tự luận (10 điểm) = 100 điểm, quy về thang 10 */
const CT={lv:{NB:10,TH:12,VD:8},lt:30,thCases:[4,3,3],dLT:2.25,dTH:2.25,dTL:10};
/* Tự luận (06/11/2026): tiêu chí 1 — làm đủ các bước, trả lời đủ câu hỏi = 50% điểm tự luận; tiêu chí 2 — nội dung chấm theo từ khóa = 50% */
const PHAN_BUOC=0.5;
const fz=x=>String(r2(x)).replace(".",",");
/* Chấm tự luận theo từ khóa: ngưỡng gợi ý mức đạt của từng ý */
const NGUONG={dat:0.45,motPhan:0.2};

/* ====== TIỆN ÍCH ====== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const K=id=>String(id).replace(/[.\/]/g,"_");       /* khóa an toàn cho Firestore */
const LET="ABCDEFGH";
const pad=n=>String(n).padStart(2,"0");
const fmtDT=d=>d?pad(d.getHours())+":"+pad(d.getMinutes())+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear():"";
const toDate=t=>t&&t.toDate?t.toDate():(t instanceof Date?t:null);
const dtLocal=d=>d?d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()):"";
const r2=x=>Math.round(x*100)/100;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function strip(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase()}

firebase.initializeApp(FB_CFG);
const db=firebase.firestore(),auth=firebase.auth(),FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;
let USER=null,ADMIN=false;
const isAdminUser=u=>!!u&&!u.isAnonymous&&(u.uid===ADMIN_UID||(u.emailVerified&&ADMIN_EMAILS.includes(u.email)));

/* ====== NGÂN HÀNG CÂU HỎI: đọc thẳng từ trang học phần, luôn khớp bản ôn tập mới nhất ====== */
const BANKS={};
async function loadBank(id,withKey){
  if(isTL(id))return loadTL(id,withKey);
  if(BANKS[id])return BANKS[id];
  const r=await fetch(hpOf(id).src||("../hp/"+id+".html"),{cache:"no-cache"});
  if(!r.ok)throw new Error("Không tải được ngân hàng câu hỏi của học phần.");
  const t=await r.text();
  const m=t.match(/<script id="pn-data" type="application\/json">([\s\S]*?)<\/script>/);
  if(!m)throw new Error("Trang học phần không có khối dữ liệu.");
  const d=JSON.parse(m[1]);const byId={},cases={},caseCh={};
  d.q.forEach(q=>{if(q.id)byId[q.id]=q});
  (d.th||[]).forEach((g,gi)=>(g.items||[]).forEach(it=>{cases[it.cid]=it;caseCh[it.cid]=gi}));
  return BANKS[id]={d,byId,cases,caseCh,lt:d.q.filter(q=>q.id&&!q.cid&&Array.isArray(q.o)),name:d.meta&&d.meta.name||id,tn:isTN(id)};
}
/* Học phần chỉ có tự luận: đề công khai + khóa chấm mã hóa (chỉ tải khi quản trị chấm) */
async function loadTL(id,withKey){
  let B=BANKS["TL:"+id];
  if(!B){const r=await fetch("de/"+id+".json",{cache:"no-cache"});if(!r.ok)throw new Error("Không tải được đề của học phần.");
    const d=await r.json();const cases={},caseCh={},chs=[];
    d.cases.forEach(c=>{let gi=chs.indexOf(c.ch);if(gi<0){chs.push(c.ch);gi=chs.length-1}cases[c.cid]={...c,ask:d.meta.ask};caseCh[c.cid]=gi});
    B=BANKS["TL:"+id]={tl:true,d:{th:chs.map(n=>({name:n}))},byId:{},cases,caseCh,lt:[],name:hpOf(id).name||id,ask:d.meta.ask,keyed:false}}
  if(withKey&&!B.keyed){const r=await fetch("de/"+id+".dat",{cache:"no-cache"});if(!r.ok)throw new Error("Không tải được đáp án gợi ý.");
    const raw=atob((await r.text()).trim()),k=new TextEncoder().encode(DAT_KEY),u=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i)^k[i%k.length];
    const key=JSON.parse(new TextDecoder().decode(u));
    Object.entries(key.cases).forEach(([cid,v])=>{const c=B.cases[cid];if(!c)return;c.anle=v.anle;c.guide=v.guide.map(g=>g.y);c.kwPre=v.guide.map(g=>g.kw);c.diem=v.guide.map(g=>g.d)});
    B.keyed=true}
  return B;
}
function pickSpread(pool,n){
  const by={};pool.forEach(q=>(by[q.g]=by[q.g]||[]).push(q));
  const groups=shuffle(Object.keys(by)).map(k=>shuffle(by[k]));const out=[];
  while(out.length<n&&groups.some(g=>g.length)){for(const g of groups){if(out.length>=n)break;if(g.length)out.push(g.pop())}}
  return out;
}
function buildDe(B,hpId){
  if(B.tl){const ids=Object.keys(B.cases);if(!ids.length)throw new Error("Chưa có tình huống.");return {lt:[],th:[],tl:shuffle(ids)[0],perm:{}}}
  if(B.tn){const k=hpOf(hpId).tnCases||3,ok=Object.values(B.cases).filter(c=>Array.isArray(c.mcq)&&c.mcq.length&&c.mcq.every(id=>B.byId[id]));
    const by={};ok.forEach(c=>(by[B.caseCh[c.cid]]=by[B.caseCh[c.cid]]||[]).push(c));const picked=[];
    for(const ch of shuffle(Object.keys(by))){if(picked.length>=k)break;picked.push(shuffle(by[ch])[0])}
    if(picked.length<k){const rest=shuffle(ok.filter(c=>!picked.includes(c)));while(picked.length<k&&rest.length)picked.push(rest.pop())}
    if(picked.length<k)throw new Error("Ngân hàng tình huống chưa đủ để trộn đề.");
    const th=picked.map(c=>({cid:c.cid,q:c.mcq.slice()}));const perm={};
    th.flatMap(x=>x.q).forEach(id=>{perm[K(id)]=shuffle([...Array(B.byId[id].o.length).keys()]).join("")});
    return {lt:[],th,tl:null,perm,tn:1}}

function boNhan(e){return (e||"").replace(/^■ .*$/gm,"").replace(/▸ [^:\n]{1,90}: ?/g,"").replace(/ ⇒ /g," ; ")}
function docPhieu(P,essay){const v={};if(!essay||essay.indexOf("■ ")<0)return v;
  essay.split(/\n*■ /).filter(Boolean).forEach(sec=>{const nl=sec.indexOf("\n");const head=sec.slice(0,nl<0?sec.length:nl),m=head.match(/(\d+)\./);if(!m)return;const p=P[+m[1]-1];if(!p)return;
    const body=nl<0?"":sec.slice(nl+1);const re=/▸ ([^:\n]{1,90}): ([\s\S]*?)(?=\n▸ |$)/g;let x;
    while((x=re.exec(body))){const f=p.f.find(f=>f.l===x[1]);if(!f)continue;const val=x[2].replace(/\s+$/,"");
      if(f.ty==="bang")v[f.k]=val.split("\n").map(r=>{const a=r.replace(/^– /,"").split(" ⇒ ");return [a[0]||"",a.slice(1).join(" ⇒ ")]});
      else if(f.ty==="chon")v[f.k]=val.split("; ");else v[f.k]=val}});
  return v}
function ghiPhieu(P,root){return P.map((p,i)=>{const L=[];p.f.forEach(f=>{let val="";
    if(f.ty==="bang")val=[...root.querySelectorAll('[data-bang="'+f.k+'"] .br')].map(r=>{const a=r.querySelectorAll("input");return [a[0].value.trim(),a[1].value.trim()]}).filter(a=>a[0]||a[1]).map(a=>"– "+a[0]+" ⇒ "+a[1]).join("\n");
    else if(f.ty==="chon")val=[...root.querySelectorAll('input[name="pf-'+f.k+'"]:checked')].map(x=>x.value).join("; ");
    else if(f.ty==="mot"){const x=root.querySelector('input[name="pf-'+f.k+'"]:checked');val=x?x.value:""}
    else{const x=root.querySelector('[data-k="'+f.k+'"]');val=x?x.value.trim():""}
    if(val)L.push("▸ "+f.l+": "+val)});
  return L.length?"■ "+(i+1)+". "+p.t.replace(/^Câu \d+$/,"Trả lời câu "+(i+1))+"\n"+L.join("\n"):""}).filter(Boolean).join("\n\n")}
function phieuHtml(P,essay){const v=docPhieu(P,essay);
  return P.map((p,i)=>`<div class="pb"><h4>${p.t.startsWith("Câu")?esc(p.t):"Bước "+(i+1)+". "+esc(p.t)}</h4>${p.yc?`<p class="yc">${esc(p.yc)}</p>`:""}${p.f.map(f=>{
    if(f.ty==="bang"){const rows=(v[f.k]||[]).slice();while(rows.length<f.n)rows.push(["",""]);
      return `<div class="fl"><span>${esc(f.l)}</span><div class="bang" data-bang="${f.k}"><div class="hd">${esc(f.h[0])}</div><div class="hd">${esc(f.h[1])}</div>${rows.map(r=>`<div class="br" style="display:contents"><input type="text" value="${esc(r[0])}" placeholder="Vấn đề…"><input type="text" value="${esc(r[1])}" placeholder="Điều … , khoản … ; án lệ số …"></div>`).join("")}</div><button type="button" class="btn small" data-them="${f.k}" style="margin-top:6px">+ Thêm dòng</button></div>`}
    if(f.ty==="chon"||f.ty==="mot"){const sel=f.ty==="chon"?(v[f.k]||[]):[v[f.k]];return `<div class="fl"><span>${esc(f.l)}</span><div class="chon">${f.o.map(o=>`<label><input type="${f.ty==="chon"?"checkbox":"radio"}" name="pf-${f.k}" value="${esc(o)}"${sel.includes(o)?" checked":""}>${esc(o)}</label>`).join("")}</div></div>`}
    return `<label class="fl"><span>${esc(f.l)}</span>${f.r?`<input type="text" data-k="${f.k}" value="${esc(v[f.k]||"")}" placeholder="${f.ph}" spellcheck="false">`:`<textarea data-k="${f.k}" class="${f.big?"big":""}" placeholder="${f.ph}" spellcheck="false">${esc(v[f.k]||"")}</textarea>`}</label>`}).join("")}</div>`).join("")}

    <div class="card"><h3 style="margin-top:0">Nhập danh sách sinh viên</h3>
    <p class="msg">Chọn file Excel (.xlsx, .xls, .csv) có các cột Mã sinh viên, Họ và tên và cột Ngày sinh nếu có (cột "Họ đệm" + "Tên" tách riêng cũng được). Hoặc sao chép các dòng trong Excel rồi dán vào ô dưới (mỗi dòng: MSSV ⇥ Họ tên ⇥ Ngày sinh — ngày sinh có thể bỏ trống).</p>
    <div class="row"><div><input type="file" id="ds-file" accept=".xlsx,.xls,.csv"></div></div>
    <div class="row"><div><textarea id="ds-paste" rows="5" placeholder="2251010001	Nguyễn Văn A	01/02/2005"></textarea></div></div>
    <div class="row"><button class="btn" id="ds-read">Đọc danh sách dán vào</button></div><div id="ds-prev"></div></div>
    <div class="card tblwrap"><h3 style="margin-top:0">Danh sách hiện tại (${AD.ds.length})</h3>${AD.ds.length?`<table><thead><tr><th>STT</th><th>MSSV</th><th>Họ và tên</th><th>Ngày sinh</th><th>Lịch sử làm bài</th><th></th></tr></thead><tbody>${AD.ds.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.mssv)}</td><td>${esc(s.hoTen)}</td><td>${esc(s.ngaySinh||"")}</td><td>${lichSu(s.mssv)}</td><td><button class="btn small" data-edit="${esc(s.mssv)}">Sửa</button> <button class="btn small danger" data-del="${esc(s.mssv)}">Xóa</button></td></tr>`).join("")}</tbody></table>`:'<p class="msg">Chưa có sinh viên.</p>'}</div>`;
  $$("[data-paper]").forEach(b=>b.onclick=()=>paperView(b.dataset.paper));
  const f1=$("#ds-one");let editing=null;
  f1.onsubmit=async e=>{e.preventDefault();const err=$("#one-err"),ok=$("#one-ok");err.textContent="";ok.textContent="";
    const hoTen=$("#one-ten").value.replace(/\s+/g," ").trim(),mssv=$("#one-sv").value.trim().toUpperCase().replace(/\s+/g,""),ns=$("#one-ns").value.trim();
    if(!hoTen){err.textContent="Nhập họ và tên.";$("#one-ten").focus();return}
    if(!/^[A-Z0-9_-]{2,20}$/.test(mssv)){err.textContent="Mã sinh viên chỉ gồm chữ, số, dấu gạch (2–20 ký tự).";$("#one-sv").focus();return}
    if(ns&&!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(ns)){err.textContent="Ngày sinh ghi theo dạng dd/mm/yyyy, hoặc để trống.";$("#one-ns").focus();return}
    const ngaySinh=ns?ns.split("/").map((x,i)=>i<2?pad(+x):x).join("/"):"";
    let rows=AD.ds.slice();
    if(editing&&editing!==mssv&&rows.some(r=>r.mssv===mssv)){err.textContent="Mã sinh viên "+mssv+" đã có trong lớp.";return}
    if(!editing&&rows.some(r=>r.mssv===mssv)){err.textContent="Mã sinh viên "+mssv+" đã có trong lớp. Bấm Sửa ở dòng đó nếu muốn đổi thông tin.";return}
    if(editing){if(editing!==mssv&&AD.bai[editing]){err.textContent="Sinh viên này đã có bài làm, không đổi mã sinh viên được.";return}rows=rows.map(r=>r.mssv===editing?{mssv,hoTen,ngaySinh}:r)}else rows.push({mssv,hoTen,ngaySinh});
    $("#one-go").disabled=true;
    try{await saveRoster(AD.ma,rows);AD.ds=rows;AD.l.siSo=rows.length;const was=editing;editing=null;AD.tab="ds";tabDS();
      $("#one-ok").textContent=(was?"Đã sửa ":"Đã thêm ")+hoTen+" ("+mssv+").";const tb=$$(".tabs button")[1];if(tb)tb.textContent="Danh sách sinh viên ("+rows.length+")";$("#one-ten").focus()}
    catch(x){err.textContent="Không lưu được ("+(x.code||x.message)+").";$("#one-go").disabled=false}};
  $$("[data-edit]").forEach(b=>b.onclick=()=>{const r=AD.ds.find(x=>x.mssv===b.dataset.edit);if(!r)return;editing=r.mssv;$("#one-ten").value=r.hoTen;$("#one-sv").value=r.mssv;$("#one-ns").value=r.ngaySinh||"";$("#one-go").textContent="Lưu thay đổi";$("#one-ok").textContent="";f1.scrollIntoView({behavior:"smooth"});$("#one-ten").focus()});
  $$("[data-del]").forEach(b=>b.onclick=async()=>{const r=AD.ds.find(x=>x.mssv===b.dataset.del);if(!r)return;
    const has=!!AD.bai[r.mssv];if(!await ask("Xóa sinh viên khỏi lớp","Xóa <b>"+esc(r.hoTen)+"</b> ("+esc(r.mssv)+") khỏi danh sách lớp."+(has?" Bài làm đã có của sinh viên này vẫn được giữ nhưng không hiện trong bảng điểm.":""),"Xóa",true))return;
    const rows=AD.ds.filter(x=>x.mssv!==r.mssv);try{await saveRoster(AD.ma,rows);AD.ds=rows;AD.l.siSo=rows.length;tabDS();const tb=$$(".tabs button")[1];if(tb)tb.textContent="Danh sách sinh viên ("+rows.length+")"}catch(x){alertMsg("Không xóa được: "+(x.code||x.message))}});
  $("#ds-file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{type:"array",cellDates:true});const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});preview(parseRows(aoa,X))}catch(x){$("#ds-prev").innerHTML='<p class="err">Không đọc được file: '+esc(x.message)+'</p>'}};
  $("#ds-read").onclick=()=>preview(parseRows($("#ds-paste").value.split(/\r?\n/).filter(s=>s.trim()).map(s=>s.split(/\t|;|,(?=\s*\S)/)),null));
}
function fmtNS(v,X){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return pad(d.getUTCDate())+"/"+pad(d.getUTCMonth()+1)+"/"+d.getUTCFullYear()}
  if(typeof v==="number"&&X&&v>10000&&v<80000){const p=X.SSF.parse_date_code(v);return pad(p.d)+"/"+pad(p.m)+"/"+p.y}return String(v||"").trim()}
function parseRows(aoa,X){
  const norm=s=>strip(s).replace(/[^a-z0-9]/g,"");let hi=-1,cM=-1,cT=-1,cH=-1,cN=-1,cD=-1;
  for(let i=0;i<Math.min(aoa.length,15);i++){const r=aoa[i].map(norm);const m=r.findIndex(x=>/^(mssv|masv|masinhvien|ma|msv|masosinhvien)$/.test(x));
    if(m>=0){hi=i;cM=m;r.forEach((x,j)=>{if(/^(hovaten|hoten|hotensinhvien)$/.test(x))cT=j;else if(/^(ho|hodem|holot)$/.test(x))cH=j;else if(x==="ten")cN=j;else if(/ngaysinh|namsinh/.test(x))cD=j});break}}
  const out=[],seen=new Set();
  aoa.slice(hi+1).forEach(r=>{let mssv,ten,ns;
    if(hi>=0){mssv=r[cM];ten=cT>=0?r[cT]:[cH>=0?r[cH]:"",cN>=0?r[cN]:""].join(" ");ns=cD>=0?r[cD]:""}else{mssv=r[0];ten=r[1];ns=r[2]}
    mssv=String(mssv==null?"":mssv).trim().toUpperCase().replace(/\s+/g,"");ten=String(ten||"").replace(/\s+/g," ").trim();
    if(!/^[A-Z0-9_-]{2,20}$/.test(mssv)||!ten||seen.has(mssv))return;seen.add(mssv);out.push({mssv,hoTen:ten,ngaySinh:fmtNS(ns,X)})});
  return out;
}
function preview(rows){
  const p=$("#ds-prev");if(!rows.length){p.innerHTML='<p class="err">Không tìm thấy dòng hợp lệ (cần có MSSV và họ tên).</p>';return}
  p.innerHTML=`<p class="ok">Đọc được ${rows.length} sinh viên. Kiểm tra vài dòng đầu:</p><table><tbody>${rows.slice(0,5).map(s=>`<tr><td>${esc(s.mssv)}</td><td>${esc(s.hoTen)}</td><td>${esc(s.ngaySinh)}</td></tr>`).join("")}</tbody></table>
    <p class="msg">Lưu sẽ <b>thay thế</b> danh sách hiện tại. Bài làm đã có của sinh viên vẫn được giữ.</p><button class="btn primary" id="ds-save">Lưu danh sách</button> <span class="err" id="ds-err"></span>`;
  $("#ds-save").onclick=async()=>{$("#ds-save").disabled=true;try{await saveRoster(AD.ma,rows);AD.tab="ds";classView(AD.ma)}catch(x){$("#ds-err").textContent="Không lưu được ("+(x.code||x.message)+")";$("#ds-save").disabled=false}};
}
function tabCai(){
  const l=AD.l;$("#tab").innerHTML=`<div class="card"><div class="row"><button class="btn primary" id="c-edit">Sửa thông tin, giờ mở/đóng</button><button class="btn" id="c-tog">${l.open?"Khóa ngay (không cho làm bài)":"Mở lại cho làm bài"}</button></div>
    <p class="msg">${isTN(l.hocPhan)?`Đề mỗi sinh viên: ${hpOf(l.hocPhan).tnCases||3} tình huống tư vấn khác chương, rút ngẫu nhiên trong ${Object.keys(AD.B.cases).length} tình huống của ngân hàng ôn tập (Chương 2–6); lấy đủ các câu ABCD của mỗi tình huống theo 5 bước tư vấn (khoảng ${(hpOf(l.hocPhan).tnCases||3)*8} câu), đảo thứ tự phương án. Điểm thang 10 = số câu đúng / tổng số câu × 10, máy chấm ngay. Bài tự luận đã nộp theo đề cũ vẫn giữ cách chấm cũ.`:isTL(l.hocPhan)?`Đề mỗi sinh viên: 01 tình huống tư vấn rút ngẫu nhiên trong ${Object.keys(AD.B.cases).length} tình huống (xây dựng từ án lệ, Chương 2–6); sinh viên điền phiếu tư vấn 5 bước (Tiếp xúc khách hàng → Vấn đề pháp lý → Luật áp dụng → Phương án giải quyết → Trả lời tư vấn). Chấm: làm đủ 5 bước = 5 điểm (mỗi bước 1 điểm); nội dung theo 5 ý chính của từng bước = 5 điểm (0,5 / 1,0 / 1,0 / 1,75 / 0,75); máy gợi ý, giảng viên xác nhận.`:`Đề mỗi sinh viên: 30 câu lý thuyết (Nhận biết ${CT.lv.NB}, Thông hiểu ${CT.lv.TH}, Vận dụng ${CT.lv.VD}, rải đều các chương), 10 câu tình huống từ 3 tình huống (4 + 3 + 3) — mỗi câu ${fz(CT.dLT)} điểm, tổng 90 — và 1 tình huống tự luận khác chương (10 điểm: trả lời đủ các yêu cầu = 5; nội dung theo từ khóa điều luật, kết quả tính toán, ý diễn đạt = 5), rút ngẫu nhiên từ ngân hàng ôn tập ${esc(l.hocPhanTen||"")}. Thứ tự phương án được đảo.`}</p></div>
    <div class="card"><h3 style="margin-top:0">Xóa lớp</h3><p class="msg">Xóa lớp, danh sách sinh viên, bài làm và điểm của lớp. Không khôi phục được — nên xuất bảng điểm Excel trước.</p><button class="btn danger" id="c-del">Xóa lớp ${esc(l.id)}</button></div>`;
  $("#c-edit").onclick=()=>classForm(l);
  $("#c-tog").onclick=async()=>{await db.doc("pnl_dg_lop/"+l.id).set({open:!l.open},{merge:true});classView(l.id)};
  $("#c-del").onclick=async()=>{if(!await ask("Xóa lớp "+l.id,"Toàn bộ danh sách, bài làm và điểm của lớp <b>"+esc(l.id)+"</b> sẽ bị xóa vĩnh viễn.","Xóa vĩnh viễn",true))return;
    try{const refs=[];for(const c of ["pnl_dg_sv","pnl_dg_bai","pnl_dg_cham"]){(await db.collection(c).where("maLop","==",l.id).get()).docs.forEach(d=>refs.push(d.ref))}
      refs.push(db.doc("pnl_dg_ds/"+l.id),db.doc("pnl_dg_lop/"+l.id));for(let i=0;i<refs.length;i+=400){const b=db.batch();refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}
      location.hash="#quan-tri"}catch(x){alertMsg("Không xóa được: "+(x.code||x.message))}};
}

/* ====== KHỞI ĐỘNG ====== */
(async function boot(){
  try{let u=await new Promise(res=>{const off=auth.onAuthStateChanged(x=>{off();res(x)})});if(!u)u=(await auth.signInAnonymously()).user;USER=u;ADMIN=isAdminUser(u);auth.onAuthStateChanged(x=>{if(x){USER=x;ADMIN=isAdminUser(x)}})}
  catch(e){console.error(e);$("#app").innerHTML='<div class="card narrow"><p class="err">Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang.</p></div>';return}
  route();
})();
/* Dùng cho kiểm thử tự động */
window.PNDG={buildDe,chamTNTH,bankFor,chamTN,chamTL,tuKhoa,loadBank,parseRows,CT,normTL,dieuSet};
</script>
