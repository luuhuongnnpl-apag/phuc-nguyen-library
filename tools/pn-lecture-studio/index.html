<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PN Lecture Studio</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eff3f7;color:#17324a}header{background:#102c43;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}main{margin:24px auto;max-width:1200px;padding:0 18px;display:grid;grid-template-columns:280px 1fr;gap:20px}section,aside{background:white;padding:20px;border-radius:12px;border:1px solid #dbe3eb}button,input,textarea{font:inherit;padding:10px;border:1px solid #c7d2df;border-radius:7px}button{cursor:pointer;background:#173e58;color:white}button.secondary{background:white;color:#173e58}input,textarea{width:100%;margin:6px 0 12px}textarea{min-height:220px}nav button{display:block;width:100%;text-align:left;margin:8px 0}nav button.active{background:#b68b43;color:#102c43}.toolbar{display:flex;gap:8px;flex-wrap:wrap}small{color:#476477}label{font-weight:600}h2{margin-top:0}@media(max-width:700px){main{grid-template-columns:1fr}}
</style><header><strong>PN · LECTURE STUDIO</strong><span>Phúc Nguyên Library | Bản thử nghiệm</span></header><main><aside><h2>Cảnh bài giảng</h2><nav id="scenes"></nav><button id="add">+ Thêm cảnh</button><p><small>Dữ liệu bản nháp chỉ nằm trên trình duyệt này. Không tải mẫu giọng lên web.</small></p></aside><section><label>Tên bài giảng</label><input id="project"><label>Tiêu đề cảnh</label><input id="title"><label>Lời giảng</label><textarea id="script"></textarea><label>Ghi chú slide / căn cứ pháp lý</label><textarea id="notes" style="min-height:100px"></textarea><div class="toolbar"><button id="up" class="secondary">↑ Lên</button><button id="down" class="secondary">↓ Xuống</button><button id="remove" class="secondary">Xóa cảnh</button><button id="save">Lưu bản nháp</button><button id="export">Xuất JSON</button><button id="copy" class="secondary">Sao chép lời giảng</button></div><p><label>Nhập lại dự án JSON</label><input type="file" id="import" accept=".json,application/json"></p><p id="status" role="status"></p><p><a href="http://127.0.0.1:7861" target="_blank" rel="noopener">Mở PN Voice Engine trên máy Windows</a> (cần khởi chạy START.bat trước).</p></section></main><script>
const $=id=>document.getElementById(id);const fresh=()=>({name:"Luật dân sự – Thừa kế",scenes:[{title:"Mở đầu",script:"",notes:""}]});let p=fresh(),i=0;function valid(x){return x&&typeof x.name==="string"&&Array.isArray(x.scenes)&&x.scenes.length>0&&x.scenes.length<=150&&x.scenes.every(s=>s&&["title","script","notes"].every(k=>typeof s[k]==="string"))}try{let x=JSON.parse(localStorage.getItem("pn-lecture-v1"));if(valid(x))p=x}catch{}function sync(){p.name=$("project").value;Object.assign(p.scenes[i],{title:$("title").value,script:$("script").value,notes:$("notes").value})}function draw(){ $("project").value=p.name;for(let k of ["title","script","notes"])$(k).value=p.scenes[i][k];$("scenes").replaceChildren();p.scenes.forEach((s,j)=>{let b=document.createElement("button");b.textContent=(j+1)+". "+s.title;b.className=j===i?"active":"";b.onclick=()=>{sync();i=j;draw()};$("scenes").append(b)})}function status(s){$("status").textContent=s}function move(d){sync();let j=i+d;if(j<0||j>=p.scenes.length)return;[p.scenes[i],p.scenes[j]]=[p.scenes[j],p.scenes[i]];i=j;draw()}$("up").onclick=()=>move(-1);$("down").onclick=()=>move(1);$("add").onclick=()=>{sync();if(p.scenes.length>=150)return;p.scenes.push({title:"Cảnh mới",script:"",notes:""});i=p.scenes.length-1;draw()};$("remove").onclick=()=>{if(p.scenes.length===1||!confirm("Xóa cảnh hiện tại?"))return;sync();p.scenes.splice(i,1);i=Math.max(0,i-1);draw()};$("save").onclick=()=>{sync();try{localStorage.setItem("pn-lecture-v1",JSON.stringify(p));status("Đã lưu bản nháp trên trình duyệt.")}catch{status("Không lưu được; hãy xuất JSON.")}};$("export").onclick=()=>{sync();let u=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="pn-lecture.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("script").value);status("Đã sao chép.")}catch{status("Hãy chọn và sao chép lời giảng thủ công.")}};$("import").onchange=async e=>{try{let f=e.target.files[0];if(!f||f.size>5000000)throw Error();let x=JSON.parse(await f.text());if(!valid(x))throw Error();if(!confirm("Thay bản nháp hiện tại?"))return;p=x;i=0;draw();status("Đã nhập dự án.")}catch{status("File dự án không hợp lệ.")}finally{e.target.value=""}};draw();
</script></html>
