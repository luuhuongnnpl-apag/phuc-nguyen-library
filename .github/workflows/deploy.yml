name: Dựng, chạy thử và đăng Phúc Nguyên Library

# Mỗi lần có thay đổi trên main:
#   1. Dựng Tóm tắt lý thuyết + mind map từ noi-dung/ (tools/xay_dung.py)
#   2. Chạy thử toàn bộ web trên trình duyệt ảo (tools/kiem_tra.py)
#   3. Chỉ khi cả hai ĐẠT mới đăng lên GitHub Pages. Không đạt: web giữ nguyên bản cũ.
# Kết quả luôn ghi vào noi-dung/KET-QUA.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  dung-kiem-dang:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cài Python và trình duyệt kiểm thử
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet playwright
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi

      - name: Soát file bị sửa ngoài thư mục nội dung
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          mkdir -p noi-dung
          git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -v '^noi-dung/' > /tmp/ngoai.txt || true
          if [ -s /tmp/ngoai.txt ]; then
            { echo "Lần đẩy này sửa cả file ngoài noi-dung/ (chỉ Claude hoặc giảng viên được sửa các file này):"; sed 's/^/  - /' /tmp/ngoai.txt; } > /tmp/canh-bao-file.txt
            cat /tmp/canh-bao-file.txt
          fi

      - name: Bước 1 — Dựng nội dung
        id: dung
        run: python3 tools/xay_dung.py

      - name: Bước 2 — Chạy thử hiển thị
        id: kiem
        run: python3 tools/kiem_tra.py

      - name: Ghi kết quả (và nội dung đã dựng nếu đạt)
        if: always()
        run: |
          if [ -f /tmp/canh-bao-file.txt ]; then { echo; echo "## Cảnh báo về file bị sửa"; echo; sed 's/^/    /' /tmp/canh-bao-file.txt; } >> noi-dung/KET-QUA.md; fi
          echo "" >> noi-dung/KET-QUA.md
          echo "Lần chạy: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · commit ${GITHUB_SHA::7}" >> noi-dung/KET-QUA.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noi-dung/KET-QUA.md
          if [ "${{ steps.dung.outcome }}" = "success" ] && [ "${{ steps.kiem.outcome }}" = "success" ]; then
            git add hp index.html
            MSG="Dựng nội dung và chạy thử: ĐẠT"
          else
            MSG="Dựng nội dung và chạy thử: KHÔNG ĐẠT (web giữ bản cũ)"
          fi
          git diff --cached --quiet && exit 0
          git commit -q -m "$MSG [skip ci]"
          # Cất bản đã dựng ra ngoài để không bao giờ bị trộn lẫn khi kho vừa có thay đổi mới
          # (03/11/2026: đẩy nhiều chương liền nhau làm lần ghi bị xung đột, bản hỏng bị đăng lên web).
          rm -rf /tmp/ban-dung && mkdir -p /tmp/ban-dung
          git ls-files -z hp index.html noi-dung/KET-QUA.md | xargs -0 -I{} cp --parents {} /tmp/ban-dung/
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/ban-dung/. .
            git add hp index.html noi-dung/KET-QUA.md
            git diff --cached --quiet && break
            git commit -q -m "$MSG [skip ci]"
            git push -q origin HEAD:main && break
            sleep 5
          done

      - name: Soát bản sắp đăng không lẫn ký hiệu xung đột
        run: |
          if grep -lE '^(<<<<<<<|>>>>>>>) ' index.html hp/*.html; then
            echo "Bản sắp đăng có ký hiệu xung đột — dừng, web giữ bản cũ."; exit 1
          fi

      - name: Chuẩn bị đăng
        uses: actions/configure-pages@v5
      - name: Đóng gói trang web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Đăng lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
