<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Phúc Nguyên Library · Quản lý lớp</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
/* PHÚC NGUYÊN LIBRARY — Không gian quản trị theo khung Azota (bản vẽ 16/11/2026)
   Một màn đăng nhập chung: sinh viên ID + mật khẩu; giảng viên/quản trị đăng nhập Google. */
:root{--navy:#1d5677;--navy2:#143d54;--bg:#eef2f6;--paper:#fff;--ink:#1e293b;--muted:#5f6672;--line:#dfe6ec;--soft:#eaf1f6;--gold:#e9b949;
  --ok:#1b7a3d;--ok-soft:#e6f4ea;--warn:#9a6200;--warn-soft:#fdf1dc;--bad:#991b1b;--bad-soft:#fde2e0;--red:#d93025}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.5 'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--navy);text-decoration:none}a:hover{color:var(--navy2)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Merriweather',Georgia,serif}
.hidden{display:none!important}
.sr{position:absolute;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* ---- khung ---- */
#app{display:flex;min-height:100vh}
.rail{width:88px;flex:none;background:var(--navy);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;position:sticky;top:0;height:100vh}
.rail .logo{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden}
.rail .logo img{width:40px;height:40px;object-fit:contain}
.rail a,.rail button{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;color:#cfe0ea;border:0;background:transparent;position:relative}
.rail a:hover,.rail button:hover{background:rgba(255,255,255,.12);color:#fff}
.rail a.on{background:#fff;color:var(--navy)}
.rail svg{width:22px;height:22px}
.rail .sp{flex:1}
.rail .tip{position:absolute;left:62px;background:#0f2a3b;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.rail a:hover .tip,.rail button:hover .tip{opacity:1}
.rail.wide{width:232px;align-items:stretch;padding:18px 12px}
.rail.wide a,.rail.wide button{width:auto;height:auto;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:12px;font-weight:500;font-size:14px}
.rail.wide svg{width:20px;height:20px}
.rail.wide .brand{display:flex;align-items:center;gap:10px;color:#fff;padding:4px 8px 18px}
.rail.wide .brand b{display:block;font-family:'Merriweather',Georgia,serif;font-size:13px;letter-spacing:.04em}
.rail.wide .brand span{font-size:11px;opacity:.8}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 32px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:68px}
.crumb{display:flex;align-items:center;gap:10px;min-width:0}
.crumb .pn{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:17px;color:var(--navy);letter-spacing:.04em;white-space:nowrap}
.crumb .sep{color:#9aa5b1}.crumb .sub{font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a.back{display:flex;align-items:center;gap:8px;font-weight:600}
.crumb a.back svg{width:18px;height:18px}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.who b{display:block;font-size:14px;line-height:1.2}.who span{font-size:12px;color:var(--muted)}
.who .out{margin-left:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--navy);display:inline-flex;align-items:center;gap:5px}
.who .out svg{width:14px;height:14px}
.page{padding:26px 32px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px;width:100%}
h1.t{margin:0;font-family:'Merriweather',Georgia,serif;font-size:24px;color:var(--navy)}
.t-sub{font-size:13px;color:var(--muted)}
h2.sec{font-family:'Merriweather',Georgia,serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:0 0 14px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.search{flex:1 1 320px;position:relative}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;background:#fff}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* ô chức năng */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:150px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(16,35,64,.06);position:relative;text-align:center;padding:0 10px}
.tile:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14);color:var(--navy)}
.tile .ic{width:60px;height:60px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.tile .ic svg{width:28px;height:28px}
.tile.soon{opacity:.72}.tile.soon:hover{border-color:var(--line);box-shadow:none;color:var(--ink)}
.badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--gold);color:#3b2a00}
.badge.new{background:var(--red);color:#fff}.badge.gray{background:#e2e8f0;color:#334155}
.quick{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);text-align:left}
.quick:hover{border-color:var(--navy)}
.quick .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.quick .ic svg{width:20px;height:20px}
.quick b{display:block;font-size:14.5px}.quick span{font-size:12.5px;color:var(--muted)}
.quick.hl{border-color:var(--navy);background:#f3f8fb}

/* thẻ lớp */
.grp{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--navy);margin:0 0 12px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left}
.grp svg{width:16px;height:16px;transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.grp .n{font-weight:500;color:var(--muted);font-size:13.5px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;color:var(--ink);box-shadow:0 1px 3px rgba(16,35,64,.06);position:relative;text-align:left}
.card:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14)}
.card b.nm{display:block;font-size:15.5px;margin-bottom:14px;padding-right:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px;flex-wrap:wrap}
.card .meta strong{color:var(--ink)}
.card .dots{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#9aa5b1;font-weight:700;letter-spacing:1px;font-size:16px}
.card .dots:hover{background:var(--soft);color:var(--navy)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-left:8px;vertical-align:middle}
.chip.lock{background:#e2e8f0;color:#334155}
.menu{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(16,35,64,.18);padding:6px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-weight:500}
.menu button:hover{background:var(--soft);color:var(--navy)}
.menu button.danger{color:var(--red)}

/* thẻ học phần */
.hp{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,35,64,.06);display:flex;flex-direction:column;position:relative}
.hp:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14)}
.hp .cover{height:118px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff;font-family:'Merriweather',Georgia,serif;font-weight:700;font-size:15px;line-height:1.25;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.hp .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.hp .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.hp .meta strong{color:var(--ink)}
.hp .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--navy)}
.tag.off{background:#f1f5f9;color:#64748b}
.rib{position:absolute;top:12px;right:-30px;transform:rotate(40deg);background:var(--gold);color:#3b2a00;font-size:10.5px;font-weight:700;padding:3px 36px;letter-spacing:.06em}
.rib.draft{background:#cbd5e1;color:#334155}
.hp .act{display:flex;gap:8px;margin-top:auto}
.hp .act a,.hp .act button{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line);color:var(--navy);background:#fff}
.hp .act .pri{background:var(--navy);border-color:var(--navy);color:#fff}

/* chi tiết lớp */
.split{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.subnav{flex:0 1 250px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.subnav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--ink);font-weight:500;font-size:14px}
.subnav a:hover{background:var(--bg)}
.subnav a.on{background:var(--soft);color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--navy)}
.subnav a svg{width:18px;height:18px;flex:none}
.subnav .soon{margin-left:auto;font-size:10.5px;font-weight:700;color:#64748b;background:#f1f5f9;padding:1px 7px;border-radius:999px}
.panel{flex:999 1 560px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.panel h1.t{font-size:22px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:#f1f5f9;color:#475569}.pill.live{background:var(--red);color:#fff}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #eef1f5;vertical-align:middle}
tr:hover td{background:#f8fafc}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.sv{display:flex;align-items:center;gap:12px}
.sv b{display:block;font-size:14px}.sv span{display:block;font-size:12px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--navy);vertical-align:middle}
.ico:hover{border-color:var(--navy)}
.ico.del{color:var(--red)}.ico.key{color:var(--warn);background:var(--warn-soft);border-color:#f3dfae}
.ico svg{width:16px;height:16px}
.acts{text-align:right;white-space:nowrap}

/* sinh viên */
.scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,35,64,.06)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border:0}
.stile{display:flex;flex-direction:column;gap:10px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);box-shadow:0 1px 3px rgba(16,35,64,.06)}
.stile:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14)}
.stile .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.stile .ic svg{width:24px;height:24px}
.stile b{font-size:16px}.stile span{font-size:13px;color:var(--muted)}
.stile.soon{opacity:.75}

/* đăng nhập */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#1d5677 0 46%,var(--bg) 46%)}
.login .box{width:100%;max-width:960px;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(16,35,64,.25);display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden}
.login .side{background:var(--navy);color:#fff;padding:40px 36px;display:flex;flex-direction:column;gap:18px}
.login .side .logo{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.login .side .logo img{width:56px;height:56px;object-fit:contain}
.login .side h1{margin:0;font-family:'Merriweather',Georgia,serif;font-size:26px;letter-spacing:.03em}
.login .side p{margin:0;opacity:.9;line-height:1.6}
.login .side ul{margin:0;padding-left:18px;opacity:.95;line-height:1.7}
.login .form{padding:40px 36px;display:flex;flex-direction:column;gap:16px}
.login h2{margin:0;font-family:'Merriweather',Georgia,serif;font-size:20px;color:var(--navy)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #9cc1d8;outline-offset:1px;border-color:var(--navy)}
.fld .hint{font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.gbtn:hover{border-color:var(--navy)}

/* hộp thoại */
dialog{border:0;border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 24px 60px rgba(16,35,64,.3);color:var(--ink)}
dialog::backdrop{background:rgba(10,25,40,.45)}
dialog .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
dialog h3{margin:0;font-family:'Merriweather',Georgia,serif;font-size:18px;color:var(--navy)}
dialog .x{border:0;background:none;width:34px;height:34px;border-radius:8px;font-size:20px;color:var(--muted)}
dialog .x:hover{background:var(--soft)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:16px 22px 22px}
dialog .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .df{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
dialog.wide{max-width:min(860px,94vw)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f2a3b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;max-width:90vw}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#f8fafc}
.drop.on{border-color:var(--navy);background:var(--soft)}
.prev{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table td,.prev table th{padding:7px 10px;font-size:12.5px}
.dgf{display:block;width:100%;border:0;border-radius:12px;background:#fff;min-height:70vh}
.panel.flat{padding:0;background:transparent;border:0}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:24px;font-family:'Merriweather',Georgia,serif;color:var(--navy)}
.kpi span{font-size:12.5px;color:var(--muted)}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  #app{flex-direction:column}
  .rail,.rail.wide{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;padding:8px 10px;gap:4px;overflow-x:auto;align-items:center}
  .rail .logo{width:36px;height:36px;margin:0 6px 0 0}.rail .logo img{width:30px;height:30px}
  .rail a,.rail button{width:44px;height:44px;border-radius:10px}
  .rail.wide a,.rail.wide button{padding:8px 10px;font-size:13px}
  .rail .tip,.rail.wide .brand{display:none}
  .rail .sp{display:none}
  header.top,.page{padding-left:16px;padding-right:16px}
  .grid4,.grid2,.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login .box{grid-template-columns:1fr}.login .side{display:none}
  .subnav{flex:1 1 100%;flex-direction:row;flex-wrap:wrap}
  .subnav a{padding:8px 10px;font-size:13px}
  .crumb .pn{font-size:14px}
}
@media (max-width:480px){.grid4,.grid2{grid-template-columns:1fr}.tile{height:120px}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast hidden" role="status"></div>
<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js?v=20261117"></script>
</body>
</html>
