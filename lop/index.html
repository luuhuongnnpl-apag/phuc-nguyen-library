<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Phúc Nguyên Library · Quản lý lớp</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
/* PHÚC NGUYÊN LIBRARY — Không gian quản trị theo khung Azota (bản vẽ 16/11/2026)
   Một màn đăng nhập chung: sinh viên ID + mật khẩu; giảng viên/quản trị đăng nhập Google. */
:root{--navy:#1d5677;--navy2:#143d54;--bg:#eef2f6;--paper:#fff;--ink:#1e293b;--muted:#5f6672;--line:#dfe6ec;--soft:#eaf1f6;--gold:#e9b949;
  --ok:#1b7a3d;--ok-soft:#e6f4ea;--warn:#9a6200;--warn-soft:#fdf1dc;--bad:#991b1b;--bad-soft:#fde2e0;--red:#d93025}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.5 'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--navy);text-decoration:none}a:hover{color:var(--navy2)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Merriweather',Georgia,serif}
.hidden{display:none!important}
.sr{position:absolute;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* ---- khung ---- */
#app{display:flex;min-height:100vh}
.rail{width:88px;flex:none;background:var(--navy);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;position:sticky;top:0;height:100vh}
.rail .logo{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden}
.rail .logo img{width:40px;height:40px;object-fit:contain}
.rail a,.rail button{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;color:#cfe0ea;border:0;background:transparent;position:relative}
.rail a:hover,.rail button:hover{background:rgba(255,255,255,.12);color:#fff}
.rail a.on{background:#fff;color:var(--navy)}
.rail svg{width:22px;height:22px}
.rail .sp{flex:1}
.rail .tip{position:absolute;left:62px;background:#0f2a3b;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.rail a:hover .tip,.rail button:hover .tip{opacity:1}
.rail.wide{width:232px;align-items:stretch;padding:18px 12px}
.rail.wide a,.rail.wide button{width:auto;height:auto;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:12px;font-weight:500;font-size:14px}
.rail.wide svg{width:20px;height:20px}
.rail.wide .brand{display:flex;align-items:center;gap:10px;color:#fff;padding:4px 8px 18px}
.rail.wide .brand b{display:block;font-family:'Merriweather',Georgia,serif;font-size:13px;letter-spacing:.04em}
.rail.wide .brand span{font-size:11px;opacity:.8}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 32px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:68px}
.crumb{display:flex;align-items:center;gap:10px;min-width:0}
.crumb .pn{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:17px;color:var(--navy);letter-spacing:.04em;white-space:nowrap}
.crumb .sep{color:#9aa5b1}.crumb .sub{font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a.back{display:flex;align-items:center;gap:8px;font-weight:600}
.crumb a.back svg{width:18px;height:18px}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.who b{display:block;font-size:14px;line-height:1.2}.who span{font-size:12px;color:var(--muted)}
.who .out{margin-left:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--navy);display:inline-flex;align-items:center;gap:5px}
.who .out svg{width:14px;height:14px}
.page{padding:26px 32px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px;width:100%}
h1.t{margin:0;font-family:'Merriweather',Georgia,serif;font-size:24px;color:var(--navy)}
.t-sub{font-size:13px;color:var(--muted)}
h2.sec{font-family:'Merriweather',Georgia,serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:0 0 14px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.search{flex:1 1 320px;position:relative}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;background:#fff}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* ô chức năng */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:150px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(16,35,64,.06);position:relative;text-align:center;padding:0 10px}
.tile:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14);color:var(--navy)}
.tile .ic{width:60px;height:60px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.tile .ic svg{width:28px;height:28px}
.tile.soon{opacity:.72}.tile.soon:hover{border-color:var(--line);box-shadow:none;color:var(--ink)}
.badge{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--gold);color:#3b2a00}
.badge.new{background:var(--red);color:#fff}.badge.gray{background:#e2e8f0;color:#334155}
.quick{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);text-align:left}
.quick:hover{border-color:var(--navy)}
.quick .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.quick .ic svg{width:20px;height:20px}
.quick b{display:block;font-size:14.5px}.quick span{font-size:12.5px;color:var(--muted)}
.quick.hl{border-color:var(--navy);background:#f3f8fb}

/* thẻ lớp */
.grp{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--navy);margin:0 0 12px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:left}
.grp svg{width:16px;height:16px;transition:transform .15s}
.grp.closed svg{transform:rotate(-90deg)}
.grp .n{font-weight:500;color:var(--muted);font-size:13.5px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;color:var(--ink);box-shadow:0 1px 3px rgba(16,35,64,.06);position:relative;text-align:left}
.card:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14)}
.card b.nm{display:block;font-size:15.5px;margin-bottom:14px;padding-right:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px;flex-wrap:wrap}
.card .meta strong{color:var(--ink)}
.card .dots{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#9aa5b1;font-weight:700;letter-spacing:1px;font-size:16px}
.card .dots:hover{background:var(--soft);color:var(--navy)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-left:8px;vertical-align:middle}
.chip.lock{background:#e2e8f0;color:#334155}
.menu{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(16,35,64,.18);padding:6px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-weight:500}
.menu button:hover{background:var(--soft);color:var(--navy)}
.menu button.danger{color:var(--red)}

/* thẻ học phần */
.hp{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,35,64,.06);display:flex;flex-direction:column;position:relative}
.hp:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14)}
.hp .cover{height:118px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff;font-family:'Merriweather',Georgia,serif;font-weight:700;font-size:15px;line-height:1.25;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.hp .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.hp .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.hp .meta strong{color:var(--ink)}
.hp .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--navy)}
.tag.off{background:#f1f5f9;color:#64748b}
.rib{position:absolute;top:12px;right:-30px;transform:rotate(40deg);background:var(--gold);color:#3b2a00;font-size:10.5px;font-weight:700;padding:3px 36px;letter-spacing:.06em}
.rib.draft{background:#cbd5e1;color:#334155}
.hp .act{display:flex;gap:8px;margin-top:auto}
.hp .act a,.hp .act button{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line);color:var(--navy);background:#fff}
.hp .act .pri{background:var(--navy);border-color:var(--navy);color:#fff}

/* chi tiết lớp */
.split{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.subnav{flex:0 1 250px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.subnav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--ink);font-weight:500;font-size:14px}
.subnav a:hover{background:var(--bg)}
.subnav a.on{background:var(--soft);color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--navy)}
.subnav a svg{width:18px;height:18px;flex:none}
.subnav .soon{margin-left:auto;font-size:10.5px;font-weight:700;color:#64748b;background:#f1f5f9;padding:1px 7px;border-radius:999px}
.panel{flex:999 1 560px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.panel h1.t{font-size:22px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:#f1f5f9;color:#475569}.pill.live{background:var(--red);color:#fff}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #eef1f5;vertical-align:middle}
tr:hover td{background:#f8fafc}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.sv{display:flex;align-items:center;gap:12px}
.sv b{display:block;font-size:14px}.sv span{display:block;font-size:12px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--navy);vertical-align:middle}
.ico:hover{border-color:var(--navy)}
.ico.del{color:var(--red)}.ico.key{color:var(--warn);background:var(--warn-soft);border-color:#f3dfae}
.ico svg{width:16px;height:16px}
.acts{text-align:right;white-space:nowrap}

/* sinh viên */
.scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,35,64,.06)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border:0}
.stile{display:flex;flex-direction:column;gap:10px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);box-shadow:0 1px 3px rgba(16,35,64,.06)}
.stile:hover{border-color:var(--navy);box-shadow:0 8px 22px rgba(27,54,93,.14)}
.stile .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.stile .ic svg{width:24px;height:24px}
.stile b{font-size:16px}.stile span{font-size:13px;color:var(--muted)}
.stile.soon{opacity:.75}

/* đăng nhập */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#1d5677 0 46%,var(--bg) 46%)}
.login .box{width:100%;max-width:960px;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(16,35,64,.25);display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden}
.login .side{background:var(--navy);color:#fff;padding:40px 36px;display:flex;flex-direction:column;gap:18px}
.login .side .logo{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.login .side .logo img{width:56px;height:56px;object-fit:contain}
.login .side h1{margin:0;font-family:'Merriweather',Georgia,serif;font-size:26px;letter-spacing:.03em}
.login .side p{margin:0;opacity:.9;line-height:1.6}
.login .side ul{margin:0;padding-left:18px;opacity:.95;line-height:1.7}
.login .form{padding:40px 36px;display:flex;flex-direction:column;gap:16px}
.login h2{margin:0;font-family:'Merriweather',Georgia,serif;font-size:20px;color:var(--navy)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #9cc1d8;outline-offset:1px;border-color:var(--navy)}
.fld .hint{font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.gbtn:hover{border-color:var(--navy)}

/* hộp thoại */
dialog{border:0;border-radius:16px;padding:0;max-width:min(560px,94vw);width:100%;box-shadow:0 24px 60px rgba(16,35,64,.3);color:var(--ink)}
dialog::backdrop{background:rgba(10,25,40,.45)}
dialog .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
dialog h3{margin:0;font-family:'Merriweather',Georgia,serif;font-size:18px;color:var(--navy)}
dialog .x{border:0;background:none;width:34px;height:34px;border-radius:8px;font-size:20px;color:var(--muted)}
dialog .x:hover{background:var(--soft)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:16px 22px 22px}
dialog .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .df{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
dialog.wide{max-width:min(860px,94vw)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f2a3b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;max-width:90vw}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#f8fafc}
.drop.on{border-color:var(--navy);background:var(--soft)}
.prev{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table td,.prev table th{padding:7px 10px;font-size:12.5px}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:24px;font-family:'Merriweather',Georgia,serif;color:var(--navy)}
.kpi span{font-size:12.5px;color:var(--muted)}

@media (max-width:1100px){.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  #app{flex-direction:column}
  .rail,.rail.wide{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;padding:8px 10px;gap:4px;overflow-x:auto;align-items:center}
  .rail .logo{width:36px;height:36px;margin:0 6px 0 0}.rail .logo img{width:30px;height:30px}
  .rail a,.rail button{width:44px;height:44px;border-radius:10px}
  .rail.wide a,.rail.wide button{padding:8px 10px;font-size:13px}
  .rail .tip,.rail.wide .brand{display:none}
  .rail .sp{display:none}
  header.top,.page{padding-left:16px;padding-right:16px}
  .grid4,.grid2,.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login .box{grid-template-columns:1fr}.login .side{display:none}
  .subnav{flex:1 1 100%;flex-direction:row;flex-wrap:wrap}
  .subnav a{padding:8px 10px;font-size:13px}
  .crumb .pn{font-size:14px}
}
@media (max-width:480px){.grid4,.grid2{grid-template-columns:1fr}.tile{height:120px}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast hidden" role="status"></div>
<dialog id="dlg"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* ============ cấu hình (giống index.html) ============ */
const FB_CFG={apiKey:"AIzaSyCIYY-dzhJ4rUYsXvBQivIxcziUC3hR1-U",authDomain:"phuc-nguyen-library.firebaseapp.com",projectId:"phuc-nguyen-library",storageBucket:"phuc-nguyen-library.firebasestorage.app",messagingSenderId:"842652271567",appId:"1:842652271567:web:23b95b5c4d6061497988ba"};
const FB_ADMIN_UID="smoIpuX7qseqTeu9nToc9RYigku1";
const FB_ADMIN_EMAILS=["luuhuong.nnpl@gmail.com"];
const ADMIN_NAME="Lưu Hương NNPL";
const fbIsAdmin=u=>!!u&&!u.isAnonymous&&(u.uid===FB_ADMIN_UID||(!!u.email&&u.emailVerified!==false&&FB_ADMIN_EMAILS.includes(u.email.toLowerCase())));
const SV_KEY="pnl-lop-sv";          /* phiên sinh viên trên máy này */
const HOME_KEY="pnlib-ma-lop";      /* phiên mã lớp của trang chủ: cấp cho sinh viên đã đăng nhập để mở học phần */
const DEF_PW="123456";
const COURSES_URL="../assets/pnl-courses.json";

/* ============ tiện ích ============ */
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const strip=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
const normId=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");
const normMa=s=>String(s||"").trim().toUpperCase().replace(/[^A-Z0-9._-]/g,"");
const initials=n=>{const p=String(n||"").trim().split(/\s+/);return p.length>1?(p[p.length-2][0]+p[p.length-1][0]).toUpperCase():(p[0]||"?").slice(0,2).toUpperCase()};
const AVC=["#1d5677","#6fa8d6","#6a3fa0","#c0392b","#2e7d6b","#e08a3c","#4a5d8a","#8e2c3f"];
const avc=s=>AVC[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%AVC.length];
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const pwHash=(mssv,pw)=>sha("PNL-SV|"+normId(mssv)+"|"+String(pw));
function toast(t,ms){const el=$("#toast");el.textContent=t;el.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.add("hidden"),ms||3400)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const errMsg=x=>x&&x.code==="permission-denied"?"tài khoản chưa có quyền ghi (cần đăng nhập Google quản trị).":(x&&x.message)||String(x);

const S={fs:null,auth:null,user:null,admin:false,sv:null,courses:[],hp:{},lop:[],ds:{},acc:{},loaded:false,open:{},q:"",busy:false};
const LIB={xlsx:["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"]};
function lib(name){if(window.XLSX)return Promise.resolve(window.XLSX);return new Promise((ok,no)=>{let i=0;const next=()=>{if(i>=LIB[name].length)return no(new Error("Không tải được thư viện đọc Excel"));const s=document.createElement("script");s.src=LIB[name][i++];s.onload=()=>ok(window.XLSX);s.onerror=next;document.head.appendChild(s)};next()})}

/* ============ dữ liệu ============ */
async function loadCourses(){try{S.courses=await (await fetch(COURSES_URL,{cache:"no-store"})).json()}catch(e){S.courses=[]}}
async function loadHp(){try{(await S.fs.collection("pnl_hp").get()).docs.forEach(d=>{S.hp[d.id]=Object.assign({id:d.id},d.data()||{})})}catch(e){}
  /* học phần thêm trên trang chủ (Firestore) nối vào danh sách tĩnh */
  Object.values(S.hp).forEach(h=>{if(!S.courses.some(c=>c.id===h.id))S.courses.push({id:h.id,name:h.name||h.id,c:h.c||"#1d5677",src:h.src||"",st:h.status||h.st||"",fb:true})})}
async function loadLop(){try{S.lop=(await S.fs.collection("pnl_dg_lop").get()).docs.map(d=>Object.assign({id:d.id},d.data()||{}))}catch(e){S.lop=[];console.warn("pnl_dg_lop",e&&e.code)}
  S.lop.sort((a,b)=>String(a.id).localeCompare(String(b.id),"vi"))}
async function loadDs(ma){if(S.ds[ma])return S.ds[ma];try{const d=await S.fs.doc("pnl_dg_ds/"+ma).get();S.ds[ma]=(d.data()||{}).rows||[]}catch(e){S.ds[ma]=[]}return S.ds[ma]}
async function loadAcc(mssvs){const need=[...new Set(mssvs.map(normId))].filter(x=>x&&!(x in S.acc));
  for(let i=0;i<need.length;i+=10){await Promise.all(need.slice(i,i+10).map(async m=>{try{const d=await S.fs.doc("pnl_dg_sv/sv__"+m).get();S.acc[m]=d.exists?d.data():null}catch(e){S.acc[m]=null}}))}}
async function loadAll(){await Promise.all([loadCourses().then(loadHp),loadLop()]);S.loaded=true}
const courseOf=id=>S.courses.find(c=>c.id===id)||(id?{id,name:S.lop.find(l=>l.hocPhan===id)?.hocPhanTen||id,c:"#1d5677"}:null);
const courseHref=c=>c&&c.src?(c.src.startsWith("hp/")?HOME+"#"+c.id:"../"+c.src):(c?HOME+"#"+c.id:HOME);
const grpOf=l=>l.nhom||l.namHoc||"Khác";
const lopName=l=>l.id+(l.ten?" — "+l.ten:"");

function rail(items,wide,brand){return `<nav class="rail${wide?" wide":""}" aria-label="Điều hướng">
  ${wide?`<div class="brand"><div class="logo"><img src="../assets/logo.png" alt=""></div><div><b>PHÚC NGUYÊN</b><span>LIBRARY</span></div></div>`:`<a class="logo" href="${HOME}" aria-label="Về trang chủ Phúc Nguyên Library"><img src="../assets/logo.png" alt=""></a>`}
  ${items.map(([h,ic,t,on,soon])=>`<a href="${h}" class="${on?"on":""}" aria-label="${esc(t)}"${soon?' title="Sắp có"':""}>${I[ic]}${wide?`<span>${esc(t)}</span>`:`<span class="tip">${esc(t)}</span>`}</a>`).join("")}

</nav>`}
function who(name,role,ab){return `<div class="who"><div class="av" style="background:${avc(name)}">${esc(ab||initials(name))}</div><div><b>${esc(name)}</b><span>${esc(role)}</span></div><button type="button" class="out" data-out>${I.out}Đăng xuất</button></div>`}
function shell(cur,body,crumb){const items=[["#home","home","Trang chủ quản trị",cur==="home"],["#lop","lop","Lớp",cur==="lop"],["#hocphan","hp","Học phần",cur==="hocphan"],[DG+"#quan-tri","de","Đề thi, đánh giá định kỳ"],["#sinhvien","users","Sinh viên và tài khoản",cur==="sinhvien"]];
  return `${rail(items,false)}<main><header class="top"><div class="crumb">${crumb||`<span class="pn">PHÚC NGUYÊN LIBRARY</span><span class="sep">/</span><span class="sub">Không gian quản trị</span>`}</div>${who(ADMIN_NAME,"Quản trị viên · Google","LH")}</header>${body}</main>`}

      const a=d.data();const h=await pwHash(id,pw);if(a.pw!==h)throw new Error("Mật khẩu chưa đúng."+(a.pwDefault?" Mật khẩu lần đầu là "+DEF_PW+".":""));
      S.sv={mssv:id,hoTen:a.hoTen||id,lop:a.lop||[],lopNienChe:a.lopNienChe||"",at:Date.now()};store.set(SV_KEY,S.sv);await grantHomeSession();location.hash="#sv";render()}
    catch(x){err.textContent=x.message||String(x)}finally{btn.disabled=false;btn.textContent="Vào lớp học"}};

    try{const r=await S.auth.signInWithPopup(p);if(!fbIsAdmin(r.user)){const em=r.user.email;await S.auth.signOut();$("#g-err").textContent="Tài khoản "+em+" chưa được cấp quyền giảng viên/quản trị.";}}
    catch(x){$("#g-err").textContent="Không đăng nhập được: "+(x.message||x)}}}
/* Sinh viên đã đăng nhập được mở mọi học phần của các lớp mình (phiên mã lớp trang chủ) */
async function grantHomeSession(){if(!S.sv)return;const hps=[];for(const ma of S.sv.lop){let l=S.lop.find(x=>x.id===ma);if(!l){try{const d=await S.fs.doc("pnl_dg_lop/"+ma).get();if(d.exists){l=Object.assign({id:ma},d.data());S.lop.push(l)}}catch(e){}}if(l&&l.hocPhan&&!hps.includes(l.hocPhan))hps.push(l.hocPhan)}
  store.set(HOME_KEY,{code:"SV-"+S.sv.mssv,label:S.sv.hoTen,han:"2099-12-31",courses:hps.length?hps:["*"],sv:true})}
async function logout(){if(S.admin){await S.auth.signOut()}S.sv=null;store.del(SV_KEY);const h=store.get(HOME_KEY);if(h&&h.sv)store.del(HOME_KEY);location.hash="";render()}

    <div class="tools"><label class="search"><span class="sr">Tìm lớp</span><input type="search" id="q" value="${esc(S.q)}" placeholder="Tìm theo tên lớp, mã lớp, học phần…"></label></div>
    ${!S.lop.length?`<div class="empty">Chưa có lớp nào. Bấm <b>Thêm lớp</b> hoặc <b>Nhập danh sách từ Excel</b> để bắt đầu.</div>`:!list.length?`<div class="empty">Không có lớp nào khớp.</div>`:
      gkeys.map(g=>`<section><button type="button" class="grp${S.open[g]===false?" closed":""}" data-grp="${esc(g)}">${I.chev}${esc(g)} <span class="n">(${groups[g].length} lớp)</span></button><div class="grid4"${S.open[g]===false?" hidden":""}>${groups[g].map(card).join("")}</div></section>`).join("")}

  $("#app").innerHTML=shell("lop",body);bindOut();
  $("#q").oninput=e=>{S.q=e.target.value;viewLop();const i=$("#q");i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  $("[data-add]").onclick=()=>dlgLop(null);$("[data-import]").onclick=()=>dlgLop(null,true);
  $$("[data-grp]").forEach(b=>b.onclick=()=>{const g=b.dataset.grp;S.open[g]=S.open[g]===false;viewLop()});
  $$("[data-lop]").forEach(c=>{const go=()=>location.hash="#lop/"+encodeURIComponent(c.dataset.lop);c.onclick=e=>{if(e.target.closest("[data-menu]"))return;go()};c.onkeydown=e=>{if(e.key==="Enter")go()}});

    [l.diemKhoa?"Mở lại điểm":"Khóa điểm",()=>saveLop(l.id,{diemKhoa:!l.diemKhoa})],[l.luuTru?"Đưa về lớp đang mở":"Chuyển vào lưu trữ",()=>saveLop(l.id,{luuTru:!l.luuTru})],["Xóa lớp…",()=>delLop(l),"danger"]])})}
function openMenu(anchor,items){closeMenu();const m=document.createElement("div");m.className="menu";m.innerHTML=items.map(([t,,cls],i)=>`<button type="button" data-i="${i}" class="${cls||""}">${esc(t)}</button>`).join("");document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();m.style.top=(r.bottom+window.scrollY+4)+"px";m.style.left=Math.min(r.left+window.scrollX,window.innerWidth-210)+"px";
  m.querySelectorAll("button").forEach(b=>b.onclick=()=>{closeMenu();items[+b.dataset.i][1]()});setTimeout(()=>document.addEventListener("click",closeMenu,{once:true}),0)}

async function saveLop(ma,part){try{await S.fs.doc("pnl_dg_lop/"+ma).set(part,{merge:true});Object.assign(S.lop.find(l=>l.id===ma)||{},part);toast("Đã lưu.");render()}catch(x){toast("Chưa lưu được: "+errMsg(x))}}
async function delLop(l){const ok=await confirmDlg("Xóa lớp "+lopName(l)+"?","Xóa toàn bộ danh sách sinh viên, bài làm đánh giá định kỳ và điểm của lớp này. Không khôi phục được.","Xóa lớp");if(!ok)return;
  try{const db=S.fs;const refs=[];for(const c of ["pnl_dg_sv","pnl_dg_bai","pnl_dg_cham"]){(await db.collection(c).where("maLop","==",l.id).get()).docs.forEach(d=>refs.push(d.ref))}
    /* gỡ lớp khỏi tài khoản sinh viên */
    const rows=await loadDs(l.id);await loadAcc(rows.map(r=>r.mssv));
    for(const r of rows){const a=S.acc[normId(r.mssv)];if(a&&Array.isArray(a.lop)&&a.lop.includes(l.id)){const lop=a.lop.filter(x=>x!==l.id);a.lop=lop;refs.push({_set:db.doc("pnl_dg_sv/sv__"+normId(r.mssv)),data:{lop}})}}
    refs.push(db.doc("pnl_dg_ds/"+l.id),db.doc("pnl_dg_lop/"+l.id));
    for(let i=0;i<refs.length;i+=400){const b=db.batch();refs.slice(i,i+400).forEach(r=>r._set?b.set(r._set,r.data,{merge:true}):b.delete(r));await b.commit()}
    S.lop=S.lop.filter(x=>x.id!==l.id);delete S.ds[l.id];toast("Đã xóa lớp "+l.id);location.hash="#lop";render()}catch(x){toast("Chưa xóa được: "+errMsg(x))}}

/* hộp thoại thêm / sửa lớp (kèm nhập Excel) */
function dlgLop(l,withImport){const dlg=$("#dlg");const isNew=!l;const years=[...new Set(S.lop.map(grpOf))];const y=new Date();const yh=(y.getMonth()>=7?y.getFullYear():y.getFullYear()-1);const defYear="HK"+(y.getMonth()>=7||y.getMonth()<1?"1":"2")+" "+yh+"–"+(yh+1);
  dlg.className=withImport?"wide":"";dlg.innerHTML=`<div class="dh"><h3>${isNew?(withImport?"Thêm lớp và nhập danh sách sinh viên":"Thêm lớp"):"Sửa thông tin lớp"}</h3><button type="button" class="x" data-x aria-label="Đóng">×</button></div>
  <form id="f-lop"><div class="row2">
    <div class="fld"><label for="l-ma">Mã lớp *</label><input id="l-ma" value="${esc(l?l.id:"")}" ${l?"readonly":""} placeholder="VD: CCCT.01" required><span class="hint">Chữ không dấu, số, dấu . _ -; dùng làm mã cho sinh viên nhập đánh giá định kỳ.</span></div>
    <div class="fld"><label for="l-ten">Tên lớp</label><input id="l-ten" value="${esc(l?l.ten||"":"")}" placeholder="VD: Công chứng Liên thông"></div></div>
    <div class="row2"><div class="fld"><label for="l-hp">Học phần *</label><select id="l-hp" required><option value="">— chọn học phần —</option>${S.courses.map(c=>`<option value="${esc(c.id)}"${l&&l.hocPhan===c.id?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="fld"><label for="l-nam">Năm học / nhóm *</label><input id="l-nam" list="l-years" value="${esc(l?grpOf(l):defYear)}" required><datalist id="l-years">${years.map(v=>`<option value="${esc(v)}">`).join("")}</datalist><span class="hint">Lớp được xếp nhóm theo ô này ở Danh sách lớp.</span></div></div>
    <div class="row2"><div class="fld"><label for="l-tg">Thời gian làm bài ĐGĐK (phút)</label><input id="l-tg" type="number" min="5" max="180" value="${esc(l&&l.thoiGian||40)}"></div>
    <div class="fld"><label for="l-nc">Ghi chú</label><input id="l-nc" value="${esc(l?l.ghiChu||"":"")}" placeholder="VD: lớp liên thông, học tối"></div></div>
    ${withImport?`<div class="fld"><label>Danh sách sinh viên (Excel/CSV: cột Mã SV, Họ tên, Ngày sinh, Lớp)</label><div class="drop" id="drop">Kéo thả file vào đây hoặc <label style="color:var(--navy);font-weight:600;cursor:pointer">chọn file<input type="file" id="l-file" accept=".xlsx,.xls,.csv,.txt" class="sr"></label><br><span class="hint">Nhận file bảng điểm / danh sách lớp tải từ APAG. Mỗi sinh viên được tạo tài khoản ID = mã SV, mật khẩu ${DEF_PW}.</span></div><div id="prev"></div></div>`:""}
    <p class="err" id="l-err"></p><div class="df"><button type="button" class="btn" data-x>Hủy</button><button type="submit" class="btn pri">${isNew?"Tạo lớp":"Lưu"}</button></div></form>`;
  dlg.showModal();$$("[data-x]",dlg).forEach(b=>b.onclick=()=>dlg.close());
  let rows=[];
  if(withImport){const onFile=async f=>{if(!f)return;try{rows=await readRoster(f);$("#prev").innerHTML=previewRows(rows);$("#l-err").textContent="";const inf=rows.info||{};
      if(inf.tenLopTc&&!$("#l-ten").value)$("#l-ten").value=inf.tenLopTc;if(inf.hocKy)$("#l-nam").value=inf.hocKy;
      if(inf.tenMon&&!$("#l-hp").value){const c=S.courses.find(c=>strip(c.name)===strip(inf.tenMon))||S.courses.find(c=>strip(inf.tenMon).includes(strip(c.name))||strip(c.name).includes(strip(inf.tenMon)));if(c)$("#l-hp").value=c.id}
      if(!$("#l-ma").value&&inf.tenLopTc){$("#l-ma").value=normMa(inf.tenLopTc.replace(/[^A-Za-z0-9]+/g,".").slice(0,20))}}
    catch(x){$("#l-err").textContent=x.message||String(x)}};
    $("#l-file").onchange=e=>onFile(e.target.files[0]);const dz=$("#drop");dz.ondragover=e=>{e.preventDefault();dz.classList.add("on")};dz.ondragleave=()=>dz.classList.remove("on");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("on");onFile(e.dataTransfer.files[0])}}
  $("#f-lop").onsubmit=async e=>{e.preventDefault();const err=$("#l-err");err.textContent="";const ma=normMa($("#l-ma").value);if(ma.length<2){err.textContent="Mã lớp cần ít nhất 2 ký tự.";return}
    const hp=courseOf($("#l-hp").value);if(!hp){err.textContent="Chọn học phần.";return}
    const data={ten:$("#l-ten").value.trim(),hocPhan:hp.id,hocPhanTen:hp.name,namHoc:$("#l-nam").value.trim(),nhom:$("#l-nam").value.trim(),thoiGian:+$("#l-tg").value||40,ghiChu:$("#l-nc").value.trim()};
    const btn=$("button[type=submit]",dlg);btn.disabled=true;
    try{const ref=S.fs.doc("pnl_dg_lop/"+ma);if(isNew){if((await ref.get()).exists)throw new Error("Mã lớp này đã có.");data.created=firebase.firestore.FieldValue.serverTimestamp();data.siSo=0;data.open=false}
      await ref.set(data,{merge:true});const cur=S.lop.find(x=>x.id===ma);if(cur)Object.assign(cur,data);else S.lop.push(Object.assign({id:ma},data));
      if(withImport&&rows.length)await saveRoster(ma,rows,true);
      dlg.close();toast(isNew?"Đã tạo lớp "+ma+(rows.length?" với "+rows.length+" sinh viên.":"."):"Đã lưu.");location.hash="#lop/"+encodeURIComponent(ma);render()}
    catch(x){err.textContent="Chưa lưu được: "+errMsg(x)}finally{btn.disabled=false}}}

/* đọc danh sách từ Excel/CSV (nhận file bảng điểm APAG) */
async function readRoster(file){let grid=[];if(/\.(csv|txt)$/i.test(file.name)){const t=await file.text();grid=t.split(/\r?\n/).map(r=>r.split(/[;,\t]/).map(c=>c.replace(/^"|"$/g,"").trim()))}
  else{const X=await lib("xlsx");const wb=X.read(await file.arrayBuffer(),{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];grid=X.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}).map(r=>r.map(c=>String(c==null?"":c).trim()))}
  /* nhận cột như trang Đánh giá định kỳ (file Export excel của APAG hoặc Excel/CSV thường) */
  const nz=s=>strip(s).replace(/[^a-z0-9]/g,"");let hi=-1,cM=-1,cT=-1,cH=-1,cN=-1,cD=-1,cL=-1;const info={};
  for(let i=0;i<Math.min(grid.length,25);i++){grid[i].forEach(c=>{const s=String(c||"").replace(/\s+/g," ").trim();let m;
      if((m=s.match(/^Tên môn\s*:\s*(.+)$/i)))info.tenMon=m[1].trim();else if((m=s.match(/^Tên lớp tc\s*:\s*(.+)$/i)))info.tenLopTc=m[1].trim();else if((m=s.match(/^Học kỳ\s*\/\s*Năm học\s*:\s*(.+)$/i)))info.hocKy=m[1].trim()});
    if(hi<0){const r=grid[i].map(nz);const m=r.findIndex(x=>/^(mssv|masv|masinhvien|msv|masosinhvien|id|ma)$/.test(x));
      if(m>=0){hi=i;cM=m;r.forEach((x,j)=>{if(/^(hovaten|hoten|hotensinhvien|hovatensinhvien)$/.test(x))cT=j;else if(/^(ho|hodem|holot|hovatendem)$/.test(x))cH=j;else if(x==="ten")cN=j;else if(/ngaysinh|namsinh/.test(x))cD=j;else if(/^(lop|lopnienche|lophc|lophanhchinh|lopsinhhoat|lopsh)$/.test(x))cL=j})}}}
  const OKMS=s=>/^[0-9A-Z]{4,16}$/.test(s)&&/\d/.test(s);const rows=[],seen=new Set();
  grid.slice(hi+1).forEach(r=>{let mssv,ten,ns="",lop="";
    if(hi>=0){mssv=r[cM];ten=cT>=0?r[cT]:[cH>=0?r[cH]:"",cN>=0?r[cN]:""].join(" ");ns=cD>=0?r[cD]:"";lop=cL>=0?r[cL]:""}
    else{const c=r.map(x=>String(x||"").trim());const k=c.findIndex(x=>OKMS(normId(x)));if(k<0)return;mssv=c[k];ten=c.find((x,j)=>j!==k&&x&&!/\d/.test(x))||"";ns=c.find((x,j)=>j!==k&&/^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(x))||""}
    mssv=normId(mssv);ten=String(ten||"").replace(/\s+/g," ").trim();if(!OKMS(mssv)||!ten||seen.has(mssv))return;seen.add(mssv);
    const row={mssv,hoTen:ten};if(ns)row.ngaySinh=String(ns).trim();if(lop)row.lopNienChe=String(lop).trim();rows.push(row)});
  if(!rows.length)throw new Error("Không đọc được sinh viên nào. Hãy để dòng tiêu đề có cột 'Mã SV' (hoặc MSSV) và 'Họ và tên'.");rows.info=info;return rows}
function previewRows(rows){return `<p class="note" style="margin:8px 0">Đọc được <b>${rows.length}</b> sinh viên:</p><div class="prev"><table><thead><tr><th>STT</th><th>Mã SV</th><th>Họ tên</th><th>Ngày sinh</th><th>Lớp</th></tr></thead><tbody>${rows.slice(0,200).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.mssv)}</td><td>${esc(r.hoTen)}</td><td>${esc(r.ngaySinh||"")}</td><td>${esc(r.lopNienChe||"")}</td></tr>`).join("")}</tbody></table></div>`}
/* ghi danh sách lớp: pnl_dg_ds (bản đầy đủ), pnl_dg_sv/{ma__mssv} (cho ĐGĐK), pnl_dg_sv/sv__{mssv} (tài khoản), siSo */
async function saveRoster(ma,rows,merge){const db=S.fs,FV=firebase.firestore.FieldValue;const old=merge?await loadDs(ma):[];const map=new Map(old.map(r=>[normId(r.mssv),r]));
  rows.forEach(r=>{const k=normId(r.mssv);map.set(k,Object.assign({},map.get(k)||{},r,{mssv:k}))});const all=[...map.values()];
  await loadAcc(all.map(r=>r.mssv));const defHash={};const ops=[];
  for(const r of all){const k=normId(r.mssv);ops.push(b=>b.set(db.doc("pnl_dg_sv/"+ma+"__"+k),{maLop:ma,mssv:k,hoTen:r.hoTen},{merge:true}));
    const a=S.acc[k];if(!a){defHash[k]=defHash[k]||await pwHash(k,DEF_PW);const acc={mssv:k,hoTen:r.hoTen,lop:[ma],pw:defHash[k],pwDefault:true,created:FV.serverTimestamp()};if(r.lopNienChe)acc.lopNienChe=r.lopNienChe;S.acc[k]=acc;ops.push(b=>b.set(db.doc("pnl_dg_sv/sv__"+k),acc))}
    else{const lop=Array.isArray(a.lop)?a.lop.slice():[];const part={hoTen:r.hoTen};if(!lop.includes(ma)){lop.push(ma);part.lop=lop}if(r.lopNienChe&&!a.lopNienChe)part.lopNienChe=r.lopNienChe;Object.assign(a,part);ops.push(b=>b.set(db.doc("pnl_dg_sv/sv__"+k),part,{merge:true}))}}
  /* sinh viên bị bỏ khỏi danh sách (khi không merge) */
  if(!merge){const keep=new Set(all.map(r=>normId(r.mssv)));old.forEach(r=>{const k=normId(r.mssv);if(!keep.has(k))ops.push(b=>b.delete(db.doc("pnl_dg_sv/"+ma+"__"+k)))})}
  ops.push(b=>b.set(db.doc("pnl_dg_ds/"+ma),{rows:all,updated:FV.serverTimestamp()}));ops.push(b=>b.set(db.doc("pnl_dg_lop/"+ma),{siSo:all.length},{merge:true}));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
  S.ds[ma]=all;const l=S.lop.find(x=>x.id===ma);if(l)l.siSo=all.length}

  let content="";
  if(tab==="sv"){content=`${head}
    <div class="tools" style="align-items:center"><span class="t-sub">Học phần: <b style="color:var(--ink)">${esc(hp?hp.name:l.hocPhanTen||"")}</b> · Mã lớp ĐGĐK: <b style="color:var(--ink)">${esc(l.id)}</b> · Chia sẻ với: <b style="color:var(--ink)">chưa ai</b></span><button type="button" class="btn sm" disabled title="Sắp có (cần tài khoản giảng viên)">Chia sẻ cho giảng viên</button>

  <div class="page" style="max-width:1180px">
    ${mo.length?mo.map(l=>`<div class="scard" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-color:var(--navy);background:#f3f8fb"><div style="display:flex;align-items:center;gap:14px"><span class="pill live">ĐANG MỞ</span><div><b style="display:block;font-size:15px">Đánh giá định kỳ — ${esc(l.hocPhanTen||l.ten||l.id)}</b><span style="font-size:13px;color:var(--muted)">Lớp ${esc(l.id)}${l.closeAt?" · đóng "+fmtD(l.closeAt):""} · ${l.thoiGian||40} phút</span></div></div><a class="btn pri" href="${DG}">Vào làm bài</a></div>`).join(""):
      `<div class="scard" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:14px"><span class="pill gray">ĐIỂM DANH</span><div><b style="display:block;font-size:15px">Chưa có buổi học đang điểm danh</b><span style="font-size:13px;color:var(--muted)">Khi giảng viên mở điểm danh, nhập mã buổi hoặc quét QR tại đây.</span></div></div><form style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" onsubmit="return false"><input placeholder="Mã buổi (6 số)" inputmode="numeric" disabled style="width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;letter-spacing:.2em;font-weight:700"><button type="button" class="btn pri" disabled>Điểm danh</button></form></div>`}
    <section><h2 class="sec">Bốn mục của bạn</h2><div class="grid4">
      <a href="#sv/hoctap" class="stile"><span class="ic">${I.hp}</span><b>Học tập</b><span>${lops.length} lớp học phần · ôn tập, tóm tắt, mind map, tài liệu</span></a>
      <a href="${DG}" class="stile"><span class="ic">${I.task}</span><b>Kiểm tra</b><span>${mo.length?mo.length+" bài đang mở":"Chưa có bài kiểm tra mở"} · nhập mã lớp + mã SV</span></a>
      <a href="#sv" class="stile soon"><span class="ic">${I.exam}</span><b>Thi</b><span>Chưa có kỳ thi mở · làm đề thi thử trong mỗi học phần</span></a>
      <a href="#sv" class="stile soon"><span class="ic">${I.qr}</span><b>Điểm danh</b><span>Sắp có · tự điểm danh bằng mã buổi / QR</span></a>
    </div></section>
    <div class="grid2"><section class="scard"><h2 class="sec">Lớp học phần của bạn</h2>${lops.length?lops.map(l=>{const c=courseOf(l.hocPhan);return `<div class="row"><div><b>${esc(l.hocPhanTen||c?.name||l.id)}</b><br><span style="font-size:12px;color:var(--muted)">${esc(l.id)}${l.ten?" · "+esc(l.ten):""} · ${esc(grpOf(l))}</span></div><div style="text-align:right">${c?`<a class="btn sm" href="${courseHref(c)}">Vào học</a>`:""}<br><span style="font-size:12px;color:var(--muted)">${l.open?"ĐGĐK đang mở":"chưa thi"}</span></div></div>`}).join(""):'<p class="note">Bạn chưa được xếp vào lớp nào. Hãy báo giảng viên.</p>'}</section>
    <section class="scard"><h2 class="sec">Việc sắp tới</h2>${mo.length?mo.map(l=>`<div class="row"><span>Đánh giá định kỳ ${esc(l.hocPhanTen||l.id)} (${l.thoiGian||40} phút)</span><span class="pill">${l.closeAt?"đến "+fmtD(l.closeAt):"đang mở"}</span></div>`).join(""):'<div class="row"><span>Chưa có việc nào được giao.</span><span class="pill gray">—</span></div>'}<div class="row"><span>Ôn tập: làm đề thi thử trong học phần của lớp</span><span class="pill gray">tự học</span></div></section></div>
    <p class="note">Mật khẩu lần đầu là ${DEF_PW}. Chức năng tự đổi mật khẩu, điểm danh và xem điểm sẽ mở ở đợt sau.</p></div></main>`;
  $("#app").innerHTML=rail(items,true)+body;bindOut()}
async function viewSvHocTap(){const me=S.sv||{lop:S.lop.filter(l=>!l.luuTru).slice(0,2).map(l=>l.id),hoTen:ADMIN_NAME,mssv:"XEM-THU"};const lops=[];for(const ma of me.lop||[]){let l=S.lop.find(x=>x.id===ma);if(!l){try{const d=await S.fs.doc("pnl_dg_lop/"+ma).get();if(d.exists)l=Object.assign({id:ma},d.data())}catch(e){}}if(l)lops.push(l)}
  const items=[["#sv","home","Trang chủ"],["#sv/hoctap","hp","Học tập",true],[DG,"task","Kiểm tra"],["#sv","exam","Thi",false,1],["#sv","qr","Điểm danh",false,1],["#sv","grade","Kết quả học tập",false,1]];
  const TASKS=[["Tóm tắt lý thuyết","map"],["Mind map","map"],["Câu hỏi lý thuyết","de"],["Câu hỏi tình huống","task"],["Thi thử","exam"],["Văn bản, án lệ","bank"]];
  const body=`<main><header class="top"><div class="crumb"><a class="back" href="#sv">${I.back}Trang chủ</a><span class="sep">/</span><span class="sub">Học tập</span></div>${S.sv?who(me.hoTen,me.mssv+" · Sinh viên"):`<div class="who"><span class="pill warn">Đang xem như sinh viên</span><a class="out" href="#home">Về quản trị</a></div>`}</header>
  <div class="page"><h1 class="t">Học tập</h1>${lops.length?`<div class="grid4">${lops.map(l=>{const c=courseOf(l.hocPhan)||{name:l.hocPhanTen||l.id,c:"#1d5677"};return `<article class="hp"><div class="cover" style="background:${esc(c.c||"#1d5677")}">${esc(c.name)}</div><div class="body"><div class="meta"><span>Lớp ${esc(l.id)}</span><span>${esc(grpOf(l))}</span></div><div class="tags">${TASKS.map(t=>`<span class="tag">${t[0]}</span>`).join("")}</div><div class="act"><a href="${courseHref(c)}" class="pri">Vào học</a></div></div></article>`}).join("")}</div>`:'<div class="empty">Bạn chưa được xếp vào lớp nào.</div>'}
  <p class="note">Vào học mở web ôn tập của học phần trên trang thư viện; tài khoản lớp đã được cấp quyền, không cần nhập mã lớp.</p></div></main>`;
  $("#app").innerHTML=rail(items,true)+body;bindOut()}

/* ============ điều hướng ============ */
function render(){closeMenu();const h=decodeURIComponent((location.hash||"").slice(1));const parts=h.split("/");
  if(S.admin){if(!S.loaded)return;if(parts[0]==="sv")return parts[1]==="hoctap"?viewSvHocTap():viewSvHome();
    if(parts[0]==="lop"&&parts[1]&&parts[1]!=="luu-tru")return viewLopDetail(parts[1],parts[2]);
    if(parts[0]==="lop")return viewLop();if(parts[0]==="hocphan")return viewHocPhan();if(parts[0]==="sinhvien")return viewSinhVien();return viewHome()}
  if(S.sv){return parts[1]==="hoctap"&&parts[0]==="sv"?viewSvHocTap():viewSvHome()}
  viewLogin()}
window.addEventListener("hashchange",()=>{if(!location.hash.includes("#lop/")||!S.q)S.q="";render()});

/* ============ khởi động ============ */
(async function init(){$("#app").innerHTML=`<div class="login"><div class="box" style="grid-template-columns:1fr;max-width:420px"><div class="form" style="text-align:center"><p class="note">Đang kết nối…</p></div></div></div>`;
  try{firebase.initializeApp(FB_CFG);S.fs=firebase.firestore();S.auth=firebase.auth()}catch(e){$("#app").innerHTML=`<div class="login"><div class="box" style="grid-template-columns:1fr;max-width:480px"><div class="form"><h2>Không kết nối được máy chủ dữ liệu</h2><p class="note">${esc(e.message||e)}</p><a class="btn" href="${HOME}">Về trang chủ</a></div></div></div>`;return}
  S.sv=store.get(SV_KEY,null);await loadCourses();
  let first=true;
  S.auth.onAuthStateChanged(async u=>{S.user=u;const adm=fbIsAdmin(u);
    if(adm&&!S.admin){S.admin=true;S.loaded=false;render();await Promise.all([loadHp(),loadLop()]);S.loaded=true;if(!location.hash||location.hash==="#")location.hash="#home";render();return}
    if(!adm&&S.admin){S.admin=false;S.loaded=false}
    S.admin=adm;if(first){first=false;if(!adm&&!u){try{await S.auth.signInAnonymously()}catch(e){}}}
    render()})})();
</script>
</body>
</html>
