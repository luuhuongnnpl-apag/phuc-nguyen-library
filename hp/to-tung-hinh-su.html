mID=182870"},{"re":"29/2025/TTLT-BTP-BCA-BQP-BTC-TANDTC-VKSNDTC","doc":"https://vbpl.moj.gov.vn/botuphap/Pages/vbpq-toanvan.aspx?ItemID=187417"},{"re":"15/2026/TT-VKSTC","doc":"https://vanban.chinhphu.vn/?classid=0&docid=220106&pageid=27160"},{"re":"160/2026/TT-BTC","doc":"https://vanban.chinhphu.vn/?docid=220133&pageid=27160&typegroupid=6"},{"re":"100/2025/QH15|Luật Dẫn độ","doc":"https://vanban.chinhphu.vn/?classid=1&docid=216574&pageid=27160&typegroupid=3"},{"re":"101/2025/QH15|Luật Chuyển giao người đang chấp hành án phạt tù","doc":"https://vanban.chinhphu.vn/?classid=1&docid=216573&orggroupid=1&pageid=27160"}],"note":"Mốc dữ liệu pháp lý: 01/11/2026. Cấu trúc học phần lấy từ Đề cương chi tiết Luật Tố tụng hình sự, mã SLF25-2005. Văn bản hợp nhất 172/2026/VBHN-LQ-VPQH ngày 01/10/2026 là bản tra cứu chính của BLTTHS. Danh mục án lệ được phân loại rõ: án lệ hình sự hiện tìm được chủ yếu giải quyết vấn đề nội dung hình sự hoặc xử lý vật chứng, không được mô tả nhầm thành án lệ giải thích trực tiếp thủ tục tố tụng. Ngân hàng câu hỏi được xây dựng mới theo 08 chương, gồm 20 câu lý thuyết và 03 tình huống tích hợp (04 câu/tình huống) cho mỗi chương. Cấu hình thi thử mặc định 40 câu/60 phút để tham chiếu ma trận thi chính thức; thi thử vẫn là công cụ luyện tập, không thay thế hình thức đánh giá thực hành của học phần. Đã bổ sung văn bản ban hành cuối tháng 10/2026 có hiệu lực tương lai, tách biệt với văn bản đang có hiệu lực; đặc biệt Luật Tư pháp người chưa thành niên có hai nhóm quy định chuyển tiếp đến 01/01/2028. Đã bổ sung Luật Dẫn độ 100/2025/QH15 và Luật Chuyển giao người đang chấp hành án phạt tù 101/2025/QH15, cùng có hiệu lực từ 01/07/2026.","exam":{"n":40,"min":60,"nc":0,"sizes":[20,30,40,50,60],"times":[15,30,45,60]}},"chapters":[{"n":1,"name":"Khái quát chung về luật tố tụng hình sự Việt Nam"},{"n":2,"name":"Cơ quan tiến hành tố tụng, người tiến hành tố tụng và người tham gia tố tụng"},{"n":3,"name":"Chứng minh, chứng cứ và các biện pháp ngăn chặn, biện pháp cưỡng chế trong tố tụng hình sự"},{"n":4,"name":"Khởi tố, điều tra, truy tố"},{"n":5,"name":"Xét xử sơ thẩm vụ án hình sự"},{"n":6,"name":"Xét xử phúc thẩm vụ án hình sự"},{"n":7,"name":"Thi hành bản án, quyết định của Tòa án"},{"n":8,"name":"Thủ tục xét lại bản án, quyết định đã có hiệu lực pháp luật"}],"q":[{"id":"C1-01a","g":1,"lv":"NB","q":"Luật tố tụng hình sự điều chỉnh nhóm quan hệ nào?","o":["Trình tự, thủ tục giải quyết vụ án hình sự và quan hệ tố tụng liên quan","Việc xác định tội phạm và hình phạt","Tổ chức, hoạt động quản lý hành chính nhà nước","Quan hệ tài sản giữa các chủ thể bình đẳng"],"a":0,"e":"BLTTHS là luật hình thức, quy định trình tự giải quyết vụ án và quyền, nghĩa vụ của chủ thể. Việc xác định tội phạm, hình phạt thuộc luật hình sự nội dung.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-01b","g":1,"lv":"TH","q":"Một quy định về thủ tục tiếp nhận tin báo, khởi tố, điều tra và xét xử thuộc lĩnh vực nào?","o":["Trình tự, thủ tục giải quyết vụ án hình sự và quan hệ tố tụng liên quan","Việc xác định tội phạm và hình phạt","Tổ chức, hoạt động quản lý hành chính nhà nước","Quan hệ tài sản giữa các chủ thể bình đẳng"],"a":0,"e":"BLTTHS là luật hình thức, quy định trình tự giải quyết vụ án và quyền, nghĩa vụ của chủ thể. Việc xác định tội phạm, hình phạt thuộc luật hình sự nội dung.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-02a","g":1,"lv":"NB","q":"Nhiệm vụ trọng tâm của BLTTHS là gì?","o":["Phát hiện, xử lý đúng tội phạm, không bỏ lọt tội phạm và không làm oan người vô tội","Ưu tiên kết tội nhanh để bảo đảm trật tự","Bảo vệ lợi ích của cơ quan buộc tội trong mọi trường hợp","Chỉ bảo vệ quyền của người bị hại"],"a":0,"e":"Điều 2 BLTTHS đặt ra đồng thời yêu cầu đấu tranh phòng, chống tội phạm và bảo vệ công lý, quyền con người.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-02b","g":1,"lv":"TH","q":"Khi giải quyết vụ án, cơ quan tố tụng phải cân bằng yêu cầu nào?","o":["Phát hiện, xử lý đúng tội phạm, không bỏ lọt tội phạm và không làm oan người vô tội","Ưu tiên kết tội nhanh để bảo đảm trật tự","Bảo vệ lợi ích của cơ quan buộc tội trong mọi trường hợp","Chỉ bảo vệ quyền của người bị hại"],"a":0,"e":"Điều 2 BLTTHS đặt ra đồng thời yêu cầu đấu tranh phòng, chống tội phạm và bảo vệ công lý, quyền con người.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-03a","g":1,"lv":"NB","q":"Nguyên tắc suy đoán vô tội được thể hiện như thế nào?","o":["Người bị buộc tội được coi là không có tội cho đến khi được chứng minh theo trình tự luật định và có bản án kết tội đã có hiệu lực","Người bị buộc tội phải tự chứng minh mình vô tội","Lời nhận tội đương nhiên làm phát sinh trách nhiệm hình sự","Cơ quan điều tra được suy đoán bất lợi khi thiếu chứng cứ"],"a":0,"e":"Điều 13 BLTTHS quy định suy đoán vô tội; nghi ngờ không thể làm sáng tỏ theo trình tự luật định phải được giải quyết theo hướng có lợi cho người bị buộc tội.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-03b","g":1,"lv":"TH","q":"Khi chứng cứ buộc tội và gỡ tội chưa được làm rõ, cách xử lý phù hợp là gì?","o":["Người bị buộc tội được coi là không có tội cho đến khi được chứng minh theo trình tự luật định và có bản án kết tội đã có hiệu lực","Người bị buộc tội phải tự chứng minh mình vô tội","Lời nhận tội đương nhiên làm phát sinh trách nhiệm hình sự","Cơ quan điều tra được suy đoán bất lợi khi thiếu chứng cứ"],"a":0,"e":"Điều 13 BLTTHS quy định suy đoán vô tội; nghi ngờ không thể làm sáng tỏ theo trình tự luật định phải được giải quyết theo hướng có lợi cho người bị buộc tội.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-04a","g":1,"lv":"NB","q":"Trách nhiệm chứng minh tội phạm thuộc về ai?","o":["Cơ quan có thẩm quyền tiến hành tố tụng vẫn phải chứng minh; bị can không có nghĩa vụ chứng minh mình vô tội","Chuyển toàn bộ nghĩa vụ chứng minh sang bị can","Coi việc im lặng là chứng cứ duy nhất buộc tội","Đình chỉ vụ án ngay vì bị can không khai"],"a":0,"e":"Điều 15 BLTTHS xác định trách nhiệm chứng minh thuộc cơ quan có thẩm quyền; người bị buộc tội có quyền nhưng không buộc phải chứng minh mình vô tội.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-04b","g":1,"lv":"TH","q":"Bị can từ chối khai báo và không đưa ra chứng cứ gỡ tội. Cơ quan tố tụng phải xử lý thế nào?","o":["Cơ quan có thẩm quyền tiến hành tố tụng vẫn phải chứng minh; bị can không có nghĩa vụ chứng minh mình vô tội","Chuyển toàn bộ nghĩa vụ chứng minh sang bị can","Coi việc im lặng là chứng cứ duy nhất buộc tội","Đình chỉ vụ án ngay vì bị can không khai"],"a":0,"e":"Điều 15 BLTTHS xác định trách nhiệm chứng minh thuộc cơ quan có thẩm quyền; người bị buộc tội có quyền nhưng không buộc phải chứng minh mình vô tội.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-05a","g":1,"lv":"NB","q":"Nguyên tắc xác định sự thật vụ án yêu cầu hoạt động tố tụng phải bảo đảm điều gì?","o":["Khách quan, toàn diện, đầy đủ; làm rõ cả chứng cứ buộc tội và gỡ tội","Chỉ thu thập chứng cứ có lợi cho buộc tội","Chỉ dựa vào lời khai của người bị hại","Có thể bỏ qua tình tiết giảm nhẹ"],"a":0,"e":"Điều 15 và Điều 108 BLTTHS yêu cầu xác định sự thật khách quan, toàn diện, đầy đủ; chứng cứ phải được đánh giá cả về tính hợp pháp, xác thực và liên quan.","b":"Điều 1–33 BLTTHS; Điều 31, 103, 104 Hiến pháp năm 2013 (đã sửa đổi)"},{"id":"C1-05b","g":1,"lv":"VD","q":"Điều tra viên chỉ thu thập chứng cứ buộc tội, bỏ qua tài liệu gỡ tội. Cách làm này có phù hợp không?","o":["Khách quan, toàn diện, đầy đủ; làm rõ cả chứng cứ buộc tội và gỡ tội","Chỉ thu thập chứng cứ có lợi cho buộc tội","Chỉ dựa vào lời khai của người bị hại","Có thể bỏ qua tình tiết giảm nhẹ"],"a":0,"e":"Điều 15 và Điều 108 BLTTHS yêu cầu xác định sự thật khách quan, toàn diện, đầy đủ; chứng cứ phải được đánh giá cả về tí ều là cấp xét xử thông thường"],"a":0,"e":"Điều 370 và Điều 397 BLTTHS phân biệt căn cứ giám đốc thẩm và tái thẩm.","b":"Điều 370–402 BLTTHS"},{"id":"C8-03b","g":8,"lv":"TH","q":"Một hồ sơ có vi phạm nghiêm trọng trong đánh giá chứng cứ đã có tại thời điểm xét xử, không phải tình tiết mới. Thủ tục phù hợp là gì?","o":["Giám đốc thẩm xem xét sai lầm pháp lý, vi phạm nghiêm trọng; tái thẩm dựa trên tình tiết mới","Giám đốc thẩm dựa trên tình tiết mới; tái thẩm dựa trên sai lầm pháp lý","Hai thủ tục giống hệt nhau","Cả hai đều là cấp xét xử thông thường"],"a":0,"e":"Điều 370 và Điều 397 BLTTHS phân biệt căn cứ giám đốc thẩm và tái thẩm.","b":"Điều 370–402 BLTTHS"},{"id":"C8-04a","g":8,"lv":"NB","q":"Ai có quyền kháng nghị theo thủ tục tái thẩm?","o":["Không; người có thẩm quyền kháng nghị theo BLTTHS mới có quyền kháng nghị, đơn chỉ là nguồn thông tin đề nghị xem xét","Có; đơn đề nghị tự động là kháng nghị","Có; bị cáo có quyền tự ra quyết định tái thẩm","Không; Tòa án cấp sơ thẩm tự khởi động"],"a":0,"e":"Điều 400 và các điều liên quan BLTTHS quy định người có thẩm quyền kháng nghị tái thẩm; đơn của cá nhân không đồng nhất với kháng nghị.","b":"Điều 370–402 BLTTHS"},{"id":"C8-04b","g":8,"lv":"TH","q":"Một bị cáo gửi đơn đề nghị tái thẩm. Đơn này có tự nó làm phát sinh thủ tục tái thẩm không?","o":["Không; người có thẩm quyền kháng nghị theo BLTTHS mới có quyền kháng nghị, đơn chỉ là nguồn thông tin đề nghị xem xét","Có; đơn đề nghị tự động là kháng nghị","Có; bị cáo có quyền tự ra quyết định tái thẩm","Không; Tòa án cấp sơ thẩm tự khởi động"],"a":0,"e":"Điều 400 và các điều liên quan BLTTHS quy định người có thẩm quyền kháng nghị tái thẩm; đơn của cá nhân không đồng nhất với kháng nghị.","b":"Điều 370–402 BLTTHS"},{"id":"C8-05a","g":8,"lv":"NB","q":"Căn cứ kháng nghị giám đốc thẩm bao gồm trường hợp nào?","o":["Căn cứ kháng nghị giám đốc thẩm","Căn cứ khởi tố vụ án","Căn cứ tạm giữ","Căn cứ xét xử sơ thẩm"],"a":0,"e":"Điều 371 BLTTHS quy định căn cứ kháng nghị giám đố :"NB","q":"Vấn đề áp dụng sai điều luật trong hồ sơ đã có thường gắn với thủ tục nào?","o":["Giám đốc thẩm","Tái thẩm","Phúc thẩm","Thi hành án"],"a":0,"e":"Điều 371 BLTTHS","b":"Điều 370–402 BLTTHS","cid":"C8T3"},{"id":"C8T3-2","g":8,"lv":"NB","q":"Tình tiết mới mà Tòa án không biết khi ra bản án thường gắn với thủ tục nào?","o":["Tái thẩm","Giám đốc thẩm","Phúc thẩm","Kháng cáo quá hạn"],"a":0,"e":"Điều 398 BLTTHS","b":"Điều 370–402 BLTTHS","cid":"C8T3"},{"id":"C8T3-3","g":8,"lv":"TH","q":"Hai thủ tục này có cùng bản chất với phúc thẩm không?","o":["Không; đều là thủ tục xét lại đặc biệt đối với bản án đã có hiệu lực","Có; là cấp xét xử thông thường tiếp theo","Có; được khởi động bằng kháng cáo","Không; là hoạt động thi hành án"],"a":0,"e":"Điều 370–402 BLTTHS","b":"Điều 370–402 BLTTHS","cid":"C8T3"},{"id":"C8T3-4","g":8,"lv":"VD","q":"Cách phân loại đúng khi tư vấn cho người bị kết án là gì?","o":["Phân biệt sai lầm, vi phạm có trong hồ sơ với tình tiết mới phát hiện sau đó; đối chiếu căn cứ từng thủ tục","Gộp mọi yêu cầu thành tái thẩm","Luôn chọn giám đốc thẩm","Luôn yêu cầu phúc thẩm lần hai"],"a":0,"e":"Điều 371, 398 BLTTHS","b":"Điều 370–402 BLTTHS","cid":"C8T3"}],"ly":{"root":"Luật Tố tụng hình sự Việt Nam","ch":[{"t":"Chương 1. Khái quát chung về luật tố tụng hình sự Việt Nam","cs":"Điều 1–34 BLTTHS; Hiến pháp 2013 (đã sửa đổi, bổ sung)","b":["Nhận diện luật tố tụng hình sự là ngành luật quy định trình tự, thủ tục tiếp nhận, giải quyết nguồn tin về tội phạm, khởi tố, điều tra, truy tố, xét xử và một số thủ tục thi hành án; đồng thời xác định chủ thể, quyền và nghĩa vụ tố tụng, hợp tác quốc tế.","Phân biệt luật tố tụng hình sự (luật hình thức) với luật hình sự (luật nội dung): một bên quy định cách thức giải quyết vụ án, bên kia quy định tội phạm và hình phạt."],"c":[{"t":"Phạm vi điều chỉnh và nhiệm vụ","cs":"Điều 1, Điều 2 BLTTHS","b":[],"c":[{"t":"Phạm vi điều chỉnh","cs":"Điều 1, Điều 2 BLTTHS","b":["Điều chỉnh toàn bộ các giai đoạn tố tụng và một số hoạt động thi hành án hình sự; xác định nhiệm vụ, quyền hạn, trách nhiệm và quan hệ giữa các chủ thể tố tụng."]},{"t":"Mục tiêu kép","cs":"Điều 1, Điều 2 BLTTHS","b":["Mục tiêu kép: phát hiện, xử lý đúng và kịp thời tội phạm; đồng thời không để lọt tội phạm, không làm oan người vô tội, bảo vệ công lý và quyền con người."]}]},{"t":"Hiệu lực và giải thích từ ngữ","cs":"Điều 3, Điều 4 BLTTHS","b":[],"c":[{"t":"Hiệu lực trên lãnh thổ","cs":"Điều 3, Điều 4 BLTTHS","b":["BLTTHS áp dụng đối với hoạt động tố tụng hình sự trên lãnh thổ Việt Nam; trường hợp có yếu tố nước ngoài phải xem xét điều ước quốc tế, nguyên tắc có đi có lại và miễn trừ."]},{"t":"Nhận diện các chủ thể tố tụng","cs":"Điều 3, Điều 4 BLTTHS","b":["Phân biệt cơ quan tiến hành tố tụng, cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra; người tiến hành tố tụng; người tham gia tố tụng; người bị buộc tội; nguồn tin về tội phạm."]}]},{"t":"Các nguyên tắc cơ bản","cs":"Điều 5–33 BLTTHS; Điều 31 Hiến pháp","b":[],"c":[{"t":"Pháp chế, bảo vệ quyền con người","cs":"Điều 5–33 BLTTHS; Điều 31 Hiến pháp","b":["Bảo đảm pháp chế; tôn trọng và bảo vệ quyền con người, quyền công dân; bảo đảm bình đẳng trước pháp luật; bảo hộ tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản."]},{"t":"Suy đoán vô tội, tranh tụng","cs":"Điều 5–33 BLTTHS; Điều 31 Hiến pháp","b":["Suy đoán vô tội; xác định sự thật vụ án; trách nhiệm chứng minh thuộc cơ quan có thẩm quyền tiến hành tố tụng; bảo đảm quyền bào chữa; tranh tụng trong xét xử; xét xử kịp thời, công bằng, công khai theo luật."]},{"t":"Không bị kết án hai lần","cs":"Điều 5–33 BLTTHS; Điều 31 Hiến pháp","b":["Không ai bị kết án hai lần vì một tội phạm; bảo đảm hiệu lực bản án, quyết định; kiểm tra, giám sát trong tố tụng."]}]}]},{"t":"Chương 2. Cơ quan tiến hành tố tụng, người tiến hành tố tụng và người tham gia tố tụng","cs":"Điều 34–84 BLTTHS; Luật Tổ chức TAND; Luật Tổ chức VKSND; Luật Tư pháp người chưa thành niên","b":["Phân biệt cơ quan tiến hành tố tụng với cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra; phân biệt người tiến hành tố tụng với người tham gia tố tụng.","Xác định đúng tư cách tố tụng là điều kiện để bảo đảm quyền, nghĩa vụ, thẩm quyền và tính hợp pháp của hoạt động tố tụng."],"c":[{"t":"Cơ quan tiến hành tố tụng","cs":"Điều 34–35 BLTTHS","b":[],"c":[{"t":"CQĐT, Viện kiểm sát, Tòa án","cs":"Điều 34–35 BLTTHS","b":["Cơ quan điều tra; Viện kiểm sát; Tòa án theo mô hình tổ chức và thẩm quyền luật định."]},{"t":"Cơ quan được giao một số hoạt động điều tra","cs":"Điều 34–35 BLTTHS","b":["Cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra chỉ thực hiện phạm vi thẩm quyền được BLTTHS và luật chuyên ngành giao; không đồng nhất với Cơ quan điều tra."]}]},{"t":"Người tiến hành tố tụng","cs":"Điều 36–49 BLTTHS","b":[],"c":[{"t":"Chức danh tiến hành tố tụng","cs":"Điều 36–49 BLTTHS","b":["Thủ trưởng, Phó Thủ trưởng, Điều tra viên, Cán bộ điều tra; Viện trưởng, Phó Viện trưởng, Kiểm sát viên, Kiểm tra viên; Chánh án, Phó Chánh án, Thẩm phán, Hội thẩm, Thư ký Tòa án và chức danh liên quan theo luật."]},{"t":"Từ chối, thay đổi để bảo đảm khách quan","cs":"Điều 36–49 BLTTHS","b":["Nhiệm vụ, quyền hạn gắn với từng giai đoạn; phải từ chối hoặc bị thay đổi khi có căn cứ luật định nhằm bảo đảm khách quan, vô tư."]}]},{"t":"Người tham gia tố tụng","cs":"Điều 55–84 BLTTHS","b":[],"c":[{"t":"Người bị buộc tội, bị hại, đương sự","cs":"Điều 55–84 BLTTHS","b":["Người bị tố giác, người bị kiến nghị khởi tố; người bị giữ trong trường hợp khẩn cấp, người bị bắt, người bị tạm giữ; bị can, bị cáo; bị hại, nguyên đơn dân sự, bị đơn dân sự, người có quyền lợi nghĩa vụ liên quan."]},{"t":"Người bào chữa, làm chứng, giám định…","cs":"Điều 55–84 BLTTHS","b":["Người bào chữa, người bảo vệ quyền và lợi ích hợp pháp; người làm chứng, người chứng kiến, người giám định, người định giá tài sản, người phiên dịch, người dịch thuật và chủ thể khác."]},{"t":"Mỗi tư cách có quyền, nghĩa vụ riêng","cs":"Điều 55–84 BLTTHS","b":["Mỗi tư cách có điều kiện xác lập, quyền, nghĩa vụ và cơ chế bảo đảm riêng; không dùng lẫn thuật ngữ bị hại – nguyên đơn dân sự hoặc bị can – bị cáo."]}]},{"t":"Bảo đảm quyền và thay đổi người có thẩm quyền","cs":"Điều 49–54, Điều 84 BLTTHS","b":[],"c":[{"t":"Căn cứ từ chối, thay đổi","cs":"Điều 49–54, Điều 84 BLTTHS","b":["Kiểm tra căn cứ từ chối, thay đổi người tiến hành tố tụng; bảo đảm không có xung đột lợi ích hoặc quan hệ làm ảnh hưởng tính khách quan."]},{"t":"Bảo đảm quyền bào chữa","cs":"Điều 49–54, Điều 84 BLTTHS","b":["Bảo đảm quyền tự bào chữa, nhờ người bào chữa, tiếp cận và khiếu nại theo đúng giai đoạn và điều kiện luật định."]}]}]},{"t":"Chương 3. Chứng minh, chứng cứ và các biện pháp ngăn chặn, biện pháp cưỡng chế trong tố tụng hình sự","cs":"Điều 85–130 BLTTHS; Luật Giám định tư pháp; Luật Thi hành tạm giữ, tạm giam và cấm đi khỏi nơi cư trú","b":["Làm rõ sự thật vụ án thông qua chứng cứ hợp pháp, xác định đúng đối tượng chứng minh, nguồn chứng cứ và trình tự thu thập, kiểm tra, đánh giá.","Phân biệt biện pháp ngăn chặn với biện pháp cưỡng chế khác; mọi hạn chế quyền con người phải có căn cứ, thẩm quyền, trình tự và thời hạn luật định."],"c":[{"t":"Đối tượng và nghĩa vụ chứng minh","cs":"Điều 15, Điều 85–87 BLTTHS","b":[],"c":[{"t":"Trách nhiệm chứng minh","cs":"Điều 15, Điều 85–87 BLTTHS","b":["Cơ quan có thẩm quyền tiến hành tố tụng có trách nhiệm chứng minh; người bị buộc tội có quyền nhưng không buộc phải chứng minh mình vô tội."]},{"t":"Những vấn đề phải chứng minh","cs":"Điều 15, Điều 85–87 BLTTHS","b":["Đối tượng chứng minh gồm hành vi phạm tội, người thực hiện, lỗi, động cơ, mục đích, tình tiết tăng nặng/giảm nhẹ, thiệt hại và các tình tiết có ý nghĩa giải quyết vụ án."]}]},{"t":"Chứng cứ và nguồn chứng cứ","cs":"Điều 86–89 BLTTHS","b":[],"c":[{"t":"Khái niệm chứng cứ","cs":"Điều 86–89 BLTTHS","b":["Chứng cứ là những gì có thật, được thu thập theo trình tự, thủ tục BLTTHS quy định và được dùng làm căn cứ xác định sự thật vụ án."]},{"t":"Nguồn chứng cứ","cs":"Điều 86–89 BLTTHS","b":["Nguồn chứng cứ gồm vật chứng; lời khai, lời trình bày; dữ liệu điện tử; kết luận giám định, định giá; biên bản tố tụng; kết quả ủy thác tư pháp và tài liệu, đồ vật khác."]},{"t":"Thu thập trái thủ tục: không có giá trị","cs":"Điều 86–89 BLTTHS","b":["Tài liệu dù có thông tin liên quan nhưng thu thập trái trình tự, thủ tục có thể không có giá trị pháp lý để giải quyết vụ án."]}]},{"t":"Thu thập, kiểm tra và đánh giá chứng cứ","cs":"Điều 88–108 BLTTHS","b":[],"c":[{"t":"Thu thập đúng thẩm quyền, thủ tục","cs":"Điều 88–108 BLTTHS","b":["Thu thập theo đúng thẩm quyền, hình thức và thủ tục; lập biên bản, bảo quản, niêm phong, sao lưu và bảo đảm tính toàn vẹn."]},{"t":"Đánh giá khách quan, toàn diện","cs":"Điều 88–108 BLTTHS","b":["Đánh giá khách quan, toàn diện, đầy đủ; không suy đoán thay chứng cứ; đối chiếu sự phù hợp giữa các nguồn và kiểm tra tính hợp pháp."]}]},{"t":"Biện pháp ngăn chặn","cs":"Điều 109–125 BLTTHS","b":[],"c":[{"t":"Các biện pháp ngăn chặn","cs":"Điều 109–125 BLTTHS","b":["Giữ người trong trường hợp khẩn cấp; bắt; tạm giữ; tạm giam; bảo lĩnh; đặt tiền để bảo đảm; cấm đi khỏi nơi cư trú; tạm hoãn xuất cảnh."]},{"t":"Mục đích, tính cần thiết","cs":"Điều 109–125 BLTTHS","b":["Mục đích bảo đảm hoạt động tố tụng, ngăn trốn tránh, cản trở hoặc tiếp tục phạm tội; lựa chọn biện pháp phải cân nhắc tính cần thiết và tương xứng."]}]},{"t":"Biện pháp cưỡng chế và bảo đảm","cs":"Điều 126–130 BLTTHS","b":[],"c":[{"t":"Kê biên, phong tỏa tài khoản","cs":"Điều 126–130 BLTTHS","b":["Kê biên tài sản, phong tỏa tài khoản và biện pháp cưỡng chế khác theo luật; xác định đúng điều kiện, thẩm quyền, phạm vi và thủ tục."]},{"t":"Phân biệt với biện pháp ngăn chặn","cs":"Điều 126–130 BLTTHS","b":["Phân biệt mục đích bảo đảm thi hành nghĩa vụ với mục đích ngăn chặn; không áp dụng tùy tiện hoặc vượt quá phạm vi cần thiết."]}]}]},{"t":"Chương 4. Khởi tố, điều tra, truy tố","cs":"Điều 143–245 BLTTHS; Luật 99/2025/QH15; TTLT 01/2026; Thông tư 03/2026/TT-VKSTC","b":["Giai đoạn từ tiếp nhận, kiểm tra, xác minh nguồn tin về tội phạm đến quyết định khởi tố, điều tra và truy tố; phân biệt các quyết định tố tụng và thẩm quyền ban hành.","Cần cập nhật thay đổi về tổ chức, thẩm quyền theo Luật 99/2025/QH15, nhất là mô hình chính quyền địa phương hai cấp và phân định thẩm quyền cơ quan tiến hành tố tụng."],"c":[{"t":"Tiếp nhận và giải quyết nguồn tin về tội phạm","cs":"Điều 143–148 BLTTHS","b":[],"c":[{"t":"Các loại nguồn tin","cs":"Điều 143–148 BLTTHS","b":["Nguồn tin gồm tố giác, tin báo về tội phạm, kiến nghị khởi tố, người phạm tội tự thú và thông tin do cơ quan có thẩm quyền trực tiếp phát hiện."]},{"t":"Kiểm tra, xác minh, quyết định","cs":"Điều 143–148 BLTTHS","b":["Kiểm tra, xác minh và ra quyết định khởi tố, không khởi tố hoặc tạm đình chỉ giải quyết nguồn tin theo căn cứ, thời hạn luật định."]}]},{"t":"Khởi tố vụ án hình sự","cs":"Điều 143–161 BLTTHS","b":[],"c":[{"t":"Căn cứ: dấu hiệu tội phạm","cs":"Điều 143–161 BLTTHS","b":["Căn cứ khởi tố là dấu hiệu tội phạm; xác định thẩm quyền, căn cứ, quyết định khởi tố, thay đổi hoặc bổ sung quyết định khởi tố."]},{"t":"Khởi tố vụ án – khởi tố bị can","cs":"Điều 143–161 BLTTHS","b":["Phân biệt khởi tố vụ án với khởi tố bị can: một quyết định xác lập việc giải quyết vụ án, quyết định kia xác định tư cách tố tụng của người bị buộc tội."]}]},{"t":"Điều tra vụ án hình sự","cs":"Điều 163–232 BLTTHS","b":[],"c":[{"t":"Thẩm quyền điều tra","cs":"Điều 163–232 BLTTHS","b":["Thẩm quyền điều tra; nhiệm vụ, quyền hạn của Điều tra viên; các hoạt động điều tra và biện pháp điều tra theo luật."]},{"t":"Các hoạt động điều tra","cs":"Điều 163–232 BLTTHS","b":["Các hoạt động: hỏi cung bị can, lấy lời khai, đối chất, nhận dạng, khám xét, khám nghiệm, thực nghiệm điều tra, giám định, định giá và hoạt động khác."]},{"t":"Kết thúc điều tra","cs":"Điều 163–232 BLTTHS","b":["Kết thúc điều tra: kết luận điều tra đề nghị truy tố hoặc quyết định đình chỉ/tạm đình chỉ theo căn cứ."]}]},{"t":"Truy tố","cs":"Điều 236–245 BLTTHS","b":[],"c":[{"t":"Quyết định của Viện kiểm sát","cs":"Điều 236–245 BLTTHS","b":["Viện kiểm sát nghiên cứu hồ sơ, đánh giá chứng cứ và căn cứ buộc tội; có thể truy tố, trả hồ sơ điều tra bổ sung, đình chỉ hoặc tạm đình chỉ theo luật."]},{"t":"Cáo trạng","cs":"Điều 236–245 BLTTHS","b":["Cáo trạng xác định hành vi, người bị truy tố, tội danh, điều khoản áp dụng và nội dung cần thiết; bảo đảm giới hạn truy tố và quyền bào chữa."]}]},{"t":"Phối hợp Cơ quan điều tra – Viện kiểm sát","cs":"TTLT 01/2026/TTLT-VKSNDTC-BCA-BQP","b":[],"c":[{"t":"Cơ chế phối hợp","cs":"TTLT 01/2026/TTLT-VKSNDTC-BCA-BQP","b":["Quy định cơ chế phối hợp thực hiện một số quy định BLTTHS; cần đọc cùng BLTTHS và quy định phân công thẩm quyền của từng ngành."]},{"t":"Không mở rộng thẩm quyền ngoài luật","cs":"TTLT 01/2026/TTLT-VKSNDTC-BCA-BQP","b":["Không dùng văn bản phối hợp để mở rộng thẩm quyền ngoài luật hoặc thay thế điều kiện, thời hạn trong BLTTHS."]}]}]},{"t":"Chương 5. Xét xử sơ thẩm vụ án hình sự","cs":"Điều 276–326 BLTTHS; Luật Tư pháp người chưa thành niên","b":["Xét xử sơ thẩm là lần xét xử đầu tiên tại Tòa án có thẩm quyền; bao gồm chuẩn bị xét xử và xét xử tại phiên tòa.","Bảo đảm giới hạn xét xử, tranh tụng, quyền bào chữa, quyền của bị hại và các đương sự; bản án phải dựa trên kết quả kiểm tra, đánh giá chứng cứ tại phiên tòa."],"c":[{"t":"Chuẩn bị xét xử","cs":"Điều 276–280 BLTTHS","b":[],"c":[{"t":"Thụ lý, nghiên cứu hồ sơ","cs":"Điều 276–280 BLTTHS","b":["Thụ lý hồ sơ, phân công Thẩm phán, nghiên cứu hồ sơ và ra quyết định theo thẩm quyền."]},{"t":"Các quyết định khi chuẩn bị xét xử","cs":"Điều 276–280 BLTTHS","b":["Các quyết định: đưa vụ án ra xét xử; trả hồ sơ điều tra bổ sung; tạm đình chỉ; đình chỉ vụ án."]}]},{"t":"Thẩm quyền và giới hạn xét xử","cs":"Điều 268–273, Điều 298 BLTTHS","b":[],"c":[{"t":"Thẩm quyền xét xử","cs":"Điều 268–273, Điều 298 BLTTHS","b":["Xác định thẩm quyền theo loại việc, lãnh thổ, cấp xét xử và quy định tổ chức Tòa án hiện hành."]},{"t":"Giới hạn xét xử","cs":"Điều 268–273, Điều 298 BLTTHS","b":["Tòa án xét xử bị cáo và hành vi theo giới hạn luật định; xử lý trường hợp phát hiện tội danh hoặc hành vi khác theo thủ tục luật định."]}]},{"t":"Trình tự phiên tòa sơ thẩm","cs":"Điều 301–326 BLTTHS","b":[],"c":[{"t":"Các bước phiên tòa","cs":"Điều 301–326 BLTTHS","b":["Khai mạc; thủ tục bắt đầu phiên tòa; xét hỏi; tranh luận; nghị án; tuyên án."]},{"t":"Vai trò các chủ thể tại phiên tòa","cs":"Điều 301–326 BLTTHS","b":["Hội đồng xét xử điều hành phiên tòa; Kiểm sát viên thực hành quyền công tố; người bào chữa và người tham gia tố tụng thực hiện quyền, nghĩa vụ."]},{"t":"Tranh tụng thực chất","cs":"Điều 301–326 BLTTHS","b":["Tranh tụng phải thực chất; bản án phải đánh giá chứng cứ buộc tội, gỡ tội và lập luận của các bên."]}]},{"t":"Xét xử người chưa thành niên","cs":"Luật Tư pháp người chưa thành niên 59/2024/QH15; BLTTHS","b":[],"c":[{"t":"Thủ tục thân thiện","cs":"Luật Tư pháp người chưa thành niên 59/2024/QH15; BLTTHS","b":["Thủ tục thân thiện, phù hợp độ tuổi, tâm lý, mức độ trưởng thành; bảo vệ bí mật đời tư và lợi ích tốt nhất của người chưa thành niên."]},{"t":"Áp dụng luật chuyên ngành mới","cs":"Luật Tư pháp người chưa thành niên 59/2024/QH15; BLTTHS","b":["Phải áp dụng luật chuyên ngành mới, không tiếp tục máy móc dùng quy định cũ đã được thay thế hoặc điều chỉnh."]}]}]},{"t":"Chương 6. Xét xử phúc thẩm vụ án hình sự","cs":"Điều 330–359 BLTTHS","b":["Phúc thẩm là việc Tòa án cấp trên trực tiếp xét xử lại vụ án hoặc xét lại quyết định sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị.","Phúc thẩm vừa bảo đảm quyền yêu cầu xem xét lại, vừa kiểm soát tính hợp pháp và có căn cứ của bản án, quyết định sơ thẩm."],"c":[{"t":"Kháng cáo, kháng nghị","cs":"Điều 331–343 BLTTHS","b":[],"c":[{"t":"Chủ thể, đối tượng, thời hạn","cs":"Điều 331–343 BLTTHS","b":["Xác định chủ thể có quyền kháng cáo, chủ thể có quyền kháng nghị; đối tượng, hình thức, nội dung và thời hạn."]},{"t":"Kháng cáo – kháng nghị","cs":"Điều 331–343 BLTTHS","b":["Phân biệt kháng cáo của người có quyền lợi liên quan với kháng nghị của Viện kiểm sát; kiểm tra phạm vi và hậu quả pháp lý."]}]},{"t":"Thụ lý và chuẩn bị xét xử phúc thẩm","cs":"Điều 344–350 BLTTHS","b":[],"c":[{"t":"Thụ lý, chuẩn bị xét xử","cs":"Điều 344–350 BLTTHS","b":["Tòa án cấp phúc thẩm kiểm tra điều kiện kháng cáo, kháng nghị; thụ lý, chuyển hồ sơ và chuẩn bị xét xử."]},{"t":"Bổ sung chứng cứ, triệu tập","cs":"Điều 344–350 BLTTHS","b":["Xem xét việc bổ sung chứng cứ, triệu tập người tham gia tố tụng và các quyết định tố tụng trước phiên tòa."]}]},{"t":"Phiên tòa và thẩm quyền phúc thẩm","cs":"Điều 351–359 BLTTHS","b":[],"c":[{"t":"Trình tự phiên tòa phúc thẩm","cs":"Điều 351–359 BLTTHS","b":["Trình tự phiên tòa phúc thẩm; xem xét nội dung kháng cáo, kháng nghị và phần bản án có liên quan."]},{"t":"Quyền hạn của Hội đồng phúc thẩm","cs":"Điều 351–359 BLTTHS","b":["Các quyền hạn: giữ nguyên; sửa; hủy bản án để điều tra hoặc xét xử lại; hủy và đình chỉ vụ án; đình chỉ xét xử phúc thẩm theo căn cứ luật định."]},{"t":"Sửa án có lợi, bất lợi","cs":"Điều 351–359 BLTTHS","b":["Kiểm tra điều kiện sửa án theo hướng có lợi hoặc bất lợi; không vượt quá giới hạn xét xử phúc thẩm."]}]}]},{"t":"Chương 7. Thi hành bản án, quyết định của Tòa án","cs":"Phần thứ năm BLTTHS; Luật Thi hành án hình sự; luật chuyên ngành liên quan","b":["Thi hành án là giai đoạn hiện thực hóa hiệu lực của bản án, quyết định đã có hiệu lực hoặc được thi hành ngay theo luật.","Phân biệt thẩm quyền ra quyết định thi hành án, tổ chức thi hành và kiểm sát việc tuân theo pháp luật trong thi hành án."],"c":[{"t":"Hiệu lực và quyết định thi hành án","cs":"Điều 363–365 BLTTHS","b":[],"c":[{"t":"Bản án có hiệu lực, thi hành ngay","cs":"Điều 363–365 BLTTHS","b":["Xác định bản án, quyết định có hiệu lực; trường hợp thi hành ngay; chủ thể và thủ tục ra quyết định thi hành án."]},{"t":"Chuyển giao bản án","cs":"Điều 363–365 BLTTHS","b":["Chuyển giao bản án, quyết định và tài liệu cần thiết cho cơ quan có trách nhiệm thi hành."]}]},{"t":"Thi hành hình phạt và biện pháp tư pháp","cs":"BLTTHS; Luật Thi hành án hình sự","b":[],"c":[{"t":"Thi hành từng loại hình phạt","cs":"BLTTHS; Luật Thi hành án hình sự","b":["Thi hành hình phạt tù, cải tạo không giam giữ, phạt tiền, trục xuất, cấm đảm nhiệm chức vụ/cấm hành nghề và biện pháp tư pháp theo luật."]},{"t":"Hoãn, tạm đình chỉ, giảm, miễn","cs":"BLTTHS; Luật Thi hành án hình sự","b":["Theo dõi thời hạn, hoãn, tạm đình chỉ, giảm thời hạn, miễn hoặc chấm dứt nghĩa vụ trong trường hợp luật định."]}]},{"t":"Kiểm sát và khiếu nại trong thi hành án","cs":"BLTTHS; Luật Thi hành án hình sự","b":[],"c":[{"t":"Kiểm sát, khiếu nại, tố cáo","cs":"BLTTHS; Luật Thi hành án hình sự","b":["Viện kiểm sát kiểm sát việc tuân theo pháp luật; người chấp hành án và chủ thể liên quan có quyền khiếu nại, tố cáo theo luật."]},{"t":"Bảo đảm quyền con người","cs":"BLTTHS; Luật Thi hành án hình sự","b":["Bảo đảm quyền con người, điều kiện giam giữ, chế độ và thủ tục thi hành án."]}]}]},{"t":"Chương 8. Thủ tục xét lại bản án, quyết định đã có hiệu lực pháp luật","cs":"Phần thứ sáu BLTTHS; Điều 371–402 BLTTHS","b":["Là thủ tục đặc biệt nhằm khắc phục sai lầm nghiêm trọng hoặc xem xét tình tiết mới đối với bản án, quyết định đã có hiệu lực pháp luật.","Phân biệt giám đốc thẩm và tái thẩm theo căn cứ, bản chất, chủ thể có quyền kháng nghị và hệ quả tố tụng."],"c":[{"t":"Thủ tục giám đốc thẩm","cs":"Điều 370–393 BLTTHS","b":[],"c":[{"t":"Đối tượng","cs":"Điều 370–393 BLTTHS","b":["Đối tượng: bản án, quyết định đã có hiệu lực pháp luật bị kháng nghị do có vi phạm pháp luật nghiêm trọng trong giải quyết vụ án."]},{"t":"Căn cứ kháng nghị","cs":"Điều 370–393 BLTTHS","b":["Căn cứ kháng nghị: kết luận không phù hợp tình tiết khách quan; vi phạm nghiêm trọng thủ tục; sai lầm nghiêm trọng trong áp dụng pháp luật."]},{"t":"Thẩm quyền, thời hạn, quyết định","cs":"Điều 370–393 BLTTHS","b":["Thẩm quyền kháng nghị, thời hạn, phiên tòa giám đốc thẩm và các quyết định của Hội đồng giám đốc thẩm."]}]},{"t":"Thủ tục tái thẩm","cs":"Điều 397–402 BLTTHS","b":[],"c":[{"t":"Đối tượng: tình tiết mới","cs":"Điều 397–402 BLTTHS","b":["Đối tượng: bản án, quyết định đã có hiệu lực pháp luật nhưng phát hiện tình tiết mới có thể làm thay đổi cơ bản nội dung bản án, quyết định mà Tòa án không biết khi ra bản án, quyết định."]},{"t":"Tình tiết mới – chứng cứ đã có","cs":"Điều 397–402 BLTTHS","b":["Phân biệt tình tiết mới với chứng cứ đã có nhưng chưa được đánh giá; xác định chủ thể phát hiện, thông báo và kháng nghị."]},{"t":"Thẩm quyền, thời hạn, quyết định","cs":"Điều 397–402 BLTTHS","b":["Thẩm quyền, thời hạn và các quyết định của Hội đồng tái thẩm."]}]},{"t":"So sánh giám đốc thẩm và tái thẩm","cs":"Điều 370–402 BLTTHS","b":[],"c":[{"t":"Sai lầm pháp lý – tình tiết mới","cs":"Điều 370–402 BLTTHS","b":["Giám đốc thẩm tập trung vào sai lầm pháp lý hoặc vi phạm tố tụng trong bản án đã có hiệu lực; tái thẩm dựa trên tình tiết mới quan trọng."]},{"t":"Không phải cấp xét xử thứ ba","cs":"Điều 370–402 BLTTHS","b":["Cả hai đều là thủ tục xét lại đặc biệt, không phải cấp xét xử thứ ba và chỉ được tiến hành khi có kháng nghị hợp lệ."]}]}]}],"upd":{"t":"Điểm cập nhật pháp luật cần lưu ý tại 01/11/2026","cs":"VBHN 172/2026/VBHN-LQ-VPQH và các luật sửa đổi, bổ sung","b":["Dùng VBHN 172/2026/VBHN-LQ-VPQH ngày 01/10/2026 làm bản tra cứu hợp nhất chính của BLTTHS tại mốc 01/11/2026; không tiếp tục dùng riêng VBHN 17/2026 như bản mới nhất.","Luật 99/2025/QH15 có hiệu lực từ 01/07/2025, sửa đổi nhiều nội dung BLTTHS, bao gồm thuật ngữ, thẩm quyền và cơ cấu cơ quan/người được giao nhiệm vụ tiến hành một số hoạt động điều tra; cần đối chiếu kỹ khi giảng dạy Chương 2 và Chương 4.","Luật Tư pháp người chưa thành niên 59/2024/QH15 có hiệu lực từ 01/01/2026; nội dung tố tụng đối với người chưa thành niên phải được cập nhật theo luật này và các quy định hướng dẫn, không bê nguyên các quy định cũ.","Luật Tương trợ tư pháp về hình sự 103/2025/QH15 và văn bản hướng dẫn có hiệu lực từ 01/07/2026 cần được xem xét ở nội dung hợp tác quốc tế và ủy thác tư pháp.","Luật số 11/2026/QH16 có hiệu lực 01/03/2027: tại mốc 01/11/2026 chưa áp dụng; chỉ ghi chú là văn bản ban hành có hiệu lực tương lai nếu có liên quan đến nội dung học phần.","Danh mục pháp luật hiện là danh mục căn cứ trọng tâm đã xác định, không khẳng định là danh mục mọi văn bản hướng dẫn. Cần rà soát hiệu lực, sửa đổi, thay thế và thẩm quyền theo từng bài trước khi phát hành ngân hàng câu hỏi.","Luật Tư pháp người chưa thành niên 59/2024/QH15 có hiệu lực từ 01/01/2026, nhưng Điều 139 và khoản 1, khoản 2 Điều 162 có hiệu lực từ 01/01/2028; phải phân biệt quy định đã có hiệu lực với quy định có hiệu lực tương lai.","Thông tư 15/2026/TT-VKSTC và Thông tư 160/2026/TT-BTC được ban hành trước ngày 01/11/2026 nhưng chỉ có hiệu lực từ 15/12/2026; tại mốc biên soạn không áp dụng như văn bản đang có hiệu lực.","Luật Dẫn độ 100/2025/QH15, Luật Chuyển giao người đang chấp hành án phạt tù 101/2025/QH15 và Luật Tương trợ tư pháp về hình sự 103/2025/QH15 đều có hiệu lực từ 01/07/2026; khi giảng dạy hợp tác quốc tế phải đọc cùng các nghị định hướng dẫn và BLTTHS."]}},"upd":{"t":"Điểm cập nhật pháp luật cần lưu ý tại 01/11/2026","cs":"VBHN 172/2026/VBHN-LQ-VPQH và các luật sửa đổi, bổ sung","b":["Dùng VBHN 172/2026/VBHN-LQ-VPQH ngày 01/10/2026 làm bản tra cứu hợp nhất chính của BLTTHS tại mốc 01/11/2026; không tiếp tục dùng riêng VBHN 17/2026 như bản mới nhất.","Luật 99/2025/QH15 có hiệu lực từ 01/07/2025, sửa đổi nhiều nội dung BLTTHS, bao gồm thuật ngữ, thẩm quyền và cơ cấu cơ quan/người được giao nhiệm vụ tiến hành một số hoạt động điều tra; cần đối chiếu kỹ khi giảng dạy Chương 2 và Chương 4.","Luật Tư pháp người chưa thành niên 59/2024/QH15 có hiệu lực từ 01/01/2026; nội dung tố tụng đối với người chưa thành niên phải được cập nhật theo luật này và các quy định hướng dẫn, không bê nguyên các quy định cũ.","Luật Tương trợ tư pháp về 26; hiệu lực 15/03/2026","org":"VKSNDTC – BCA – BQP","note":"Hướng dẫn phối hợp trong khởi tố, điều tra, truy tố; thay thế TTLT 04/2018.","url":"https://chinhphu.vn/?classid=1&docid=216989&pageid=27160"},{"t":"Thông tư liên tịch số 02/2026/TTLT-BCA-BQP-BTP-VKSNDTC-TANDTC về trưng cầu, yêu cầu giám định và đánh giá, sử dụng kết luận giám định tư pháp","d":"01/05/2026; hiệu lực 01/05/2026","org":"BCA – BQP – BTP – VKSNDTC – TANDTC","note":"Liên quan trực tiếp chứng cứ và kết luận giám định.","url":"https://congbao.chinhphu.vn/van-ban/thong-tu-lien-tich-so-02-2026-ttlt-bca-bqp-btp-vksndtc-tandtc-469733.htm"},{"t":"Thông tư liên tịch số 04/2026/TTLT-BCA-BQP-VKSNDTC-TANDTC quy định chi tiết khoản 5 Điều 131, khoản 3 Điều 132, Điều 141 BLTTHS","d":"15/05/2026; hiệu lực 15/05/2026","org":"BCA – BQP – VKSNDTC – TANDTC","note":"Quy định về ký số văn bản tố tụng, hồ sơ vụ án điện tử, số hóa hồ sơ và thông báo văn bản tố tụng.","url":"https://congbao.chinhphu.vn/van-ban/thong-tu-lien-tich-so-04-2026-ttlt-bca-bqp-vksndtc-tandtc-469641.htm"},{"t":"Thông tư liên tịch số 03/2026/TTLT-BCA-BQP-TANDTC-VKSNDTC về phối hợp trích xuất phạm nhân phục vụ điều tra, truy tố, xét xử","d":"14/05/2026; hiệu lực 01/07/2026","org":"BCA – BQP – TANDTC – VKSNDTC","note":"Liên quan trích xuất phạm nhân để tham gia hoạt động tố tụng.","url":"https://vanban.bocongan.gov.vn/co-so-du-lieu-van-ban/thong-tu-lien-tich-quy-dinh-ve-phoi-hop-thuc-hien-trich-xuat-pham-nhan-phuc-vu-dieu-tra-truy-to-xet-xu-1780647939"},{"t":"Nghị quyết số 04/2019/NQ-HĐTP về quy trình lựa chọn, công bố và áp dụng án lệ","d":"18/06/2019; đã được sửa đổi, bổ sung","org":"Hội đồng Thẩm phán TANDTC","note":"Đọc cùng Nghị quyết 02/2025/NQ-HĐTP.","url":"https://anle.toaan.gov.vn/"},{"t":"Thông tư số 15/2026/TT-VKSTC hướng dẫn một số điều của Luật Giám định tư pháp trong ngành Kiểm sát nhân dân","d":"26/10/2026; hiệu lực 15/12/2026","org":"Viện kiểm sát nhân dân tối cao","note":"Đã ban hành nhưng chưa có hiệu lực tại mốc 01/11/2026; không dùng làm căn cứ đang áp dụng.","url":"https://vanban.chinhphu.vn/?classid=0&docid=220106&pageid=27160"},{"t":"Thông tư số 160/2026/TT-BTC hướng dẫn kinh phí dẫn độ, chuyển giao người đang chấp hành án phạt tù và tương trợ tư pháp hình sự","d":"29/10/2026; hiệu lực 15/12/2026","org":"Bộ Tài chính","note":"Đã ban hành nhưng chưa có hiệu lực tại mốc 01/11/2026; ghi nhận để cập nhật sau ngày hiệu lực.","url":"https://vanban.chinhphu.vn/?docid=220133&pageid=27160&typegroupid=6"}]}],"al":[{"so":"73/2025/AL","nd":"Áp dụng tình tiết tăng nặng “Cố tình thực hiện tội phạm đến cùng”. Minh họa việc xác định tình tiết tăng nặng từ diễn biến hành vi và chứng cứ; không phải án lệ về thủ tục tố tụng.","lv":"Hình sự – nội dung; liên hệ đánh giá chứng cứ","url":"https://www.vplsdms.vn/an-le-so-732025al-ngay-25122025-ve-viec-ap-dung-tinh-tiet-tang-nang-trach-nhiem-hinh-su-co-tinh-thuc-hien-toi-pham-den-cung"},{"so":"74/2025/AL","nd":"Định tội danh trộm cắp tài sản khi người phạm tội lén lút chiếm đoạt chính tài sản của mình đang bị cơ quan có thẩm quyền tạm giữ. Liên hệ hồ sơ tạm giữ và xử lý tài sản.","lv":"Hình sự – nội dung; liên hệ tài sản tạm giữ","url":"https://www.vplsdms.vn/an-le-so-742025al-ngay-25122025-ve-viec-dinh-toi-danh-trom-cap-tai-san-doi-voi-hanh-vi-chiem-doat-tai-san-cua-minh-dang-bi-co-quan-co-tham-quyen-tam-giu"},{"so":"75/2025/AL","nd":"Thủ đoạn gian dối để trộm cắp tài sản. Minh họa cách đánh giá hành vi và chứng cứ để xác định tội danh; không giải thích trực tiếp thủ tục tố tụng.","lv":"Hình sự – nội dung; liên hệ đánh giá chứng cứ","url":"https://lsvn.vn/an-le-so-75-2025-al-ve-thu-doan-gian-doi-de-trom-cap-tai-san-a169443.html"},{"so":"76/2025/AL","nd":"Tịch thu công cụ, phương tiện dùng vào việc phạm tội chưa sang tên. Liên hệ trực tiếp việc xử lý vật chứng theo điểm a khoản 2 Điều 106 BLTTHS.","lv":"Hình sự – nội dung; liên hệ xử lý vật chứng","url":"https://www.vplsdms.vn/an-le-so-762025al-ngay-25122025-ve-viec-tich-thu-sung-vao-ngan-sach-nha-nuoc-cong-cu-phuong-tien-dung-vao-viec-pham-toi-chua-sang-ten"}],"th":[{"name":"Khái quát chung về luật tố tụng hình sự Việt Nam","items":[{"cid":"C1T1","title":"Tin báo và yêu cầu bảo đảm quyền của người bị buộc tội","text":"Cơ quan công an tiếp nhận tin báo về việc K có hành vi cố ý gây thương tích. Sau khi xác minh ban đầu, K bị giữ trong trường hợp khẩn cấp. Khi làm việc, K đề nghị được thông báo lý do bị giữ và có luật sư tham gia. Điều tra viên cho rằng K phải tự chứng minh mình không phạm tội và chỉ được mời luật sư sau khi có cáo trạng.","mcq":["C1T1-1","C1T1-2","C1T1-3","C1T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["K được hưởng nguyên tắc suy đoán vô tội; trách nhiệm chứng minh thuộc cơ quan có thẩm quyền.","K có quyền tự bào chữa hoặc nhờ người bào chữa theo BLTTHS; không phải chờ đến giai đoạn xét xử.","Không được buộc K chứng minh mình vô tội; nghi ngờ không thể làm sáng tỏ phải xử lý theo hướng có lợi.","Cần kiểm tra căn cứ, thẩm quyền và trình tự giữ người khẩn cấp, không suy đoán có tội từ việc bị giữ."],"basis":"Điều 13, 15, 16, 72 BLTTHS"},{"cid":"C1T2","title":"Đánh giá lời nhận tội và chứng cứ gỡ tội","text":"Trong quá trình điều tra vụ trộm tài sản, M nhận đã lấy chiếc máy tính. Tuy nhiên, camera tại nơi xảy ra vụ việc ghi nhận một người khác; dữ liệu định vị cho thấy M ở địa điểm khác vào thời điểm xảy ra vụ án. Điều tra viên đề nghị dùng lời nhận tội làm căn cứ duy nhất để kết luận.","mcq":["C1T2-1","C1T2-2","C1T2-3","C1T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Lời nhận tội không thể là chứng cứ duy nhất để buộc tội, kết tội.","Dữ liệu điện tử/camera phải được thu thập đúng trình tự và kiểm tra tính xác thực, toàn vẹn.","Cơ quan tố tụng phải xác định sự thật khách quan, toàn diện, xem xét cả chứng cứ buộc tội và gỡ tội.","Mâu thuẫn chứng cứ phải được làm rõ; không được lựa chọn tùy tiện nguồn chứng cứ có lợi cho buộc tội."],"basis":"Điều 15, 86–99, 108 BLTTHS"},{"cid":"C1T3","title":"Tranh tụng và quyền trình bày tại phiên tòa","text":"Tại phiên tòa sơ thẩm, Kiểm sát viên công bố cáo trạng. Người bào chữa đề nghị công bố một tài liệu gỡ tội đã được thu thập hợp pháp. Chủ tọa từ chối vì cho rằng chỉ chứng cứ trong cáo trạng mới được xem xét. Bị cáo đề nghị tự trình bày nhưng không được tạo điều kiện.","mcq":["C1T3-1","C1T3-2","C1T3-3","C1T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Tài liệu gỡ tội hợp pháp phải được kiểm tra, đánh giá cùng chứng cứ khác.","Tranh tụng đòi hỏi các bên được đưa ra chứng cứ, đánh giá chứng cứ và tranh luận.","Bị cáo có quyền tự bào chữa hoặc nhờ người bào chữa.","Chủ tọa phải điều hành phiên tòa bảo đảm quyền tố tụng và tranh tụng thực chất."],"basis":"Điều 16, 26, 61, 108 BLTTHS"}]},{"name":"Cơ quan tiến hành tố tụng, người tiến hành tố tụng và người tham gia tố tụng","items":[{"cid":"C2T1","title":"Xác định tư cách người tham gia tố tụng","text":"Trong vụ án gây tai nạn giao thông, chị A bị thương và hư hỏng xe; doanh nghiệp B bị thiệt hại hàng hóa. Anh C trực tiếp nhìn thấy tai nạn. Chị D có mặt khi cơ quan điều tra khám nghiệm hiện trường theo yêu cầu. Luật sư E được bị can mời bào chữa.","mcq":["C2T1-1","C2T1-2","C2T1-3","C2T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Chị A là bị hại nếu trực tiếp bị thiệt hại do hành vi phạm tội.","Doanh nghiệp B có thể là nguyên đơn dân sự khi có yêu cầu bồi thường thiệt hại do tội phạm gây ra và đáp ứng điều kiện luật định.","Anh C là người làm chứng vì biết tình tiết liên quan vụ án; người chứng kiến tham gia chứng kiến hoạt động tố tụng.","Luật sư do bị can mời để bào chữa có tư cách người bào chữa."],"basis":"Điều 62, 63, 66, 72–78 BLTTHS"},{"cid":"C2T2","title":"Thay đổi người tiến hành tố tụng","text":"Thẩm phán X được phân công xét xử vụ án mà bị cáo là anh ruột của vợ Thẩm phán. Kiểm sát viên Y từng tham gia vụ án với tư cách người làm chứng trong giai đoạn trước. Các bên phát hiện những tình tiết này trước phiên tòa.","mcq":["C2T2-1","C2T2-2","C2T2-3","C2T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Cần xác định quan hệ thân thích và các căn cứ thay đổi cụ thể theo BLTTHS; không suy luận máy móc từ quan hệ thông gia.","Việc từng tham gia vụ án với tư cách khác có thể là căn cứ cần kiểm tra theo điều luật về thay đổi người tiến hành tố tụng.","Mục tiêu là bảo đảm khách quan, vô tư và niềm tin vào hoạt động tố tụng.","Quyền đề nghị thay đổi được thực hiện bởi các chủ thể, tại thời điểm và theo thủ tục BLTTHS quy định."],"basis":"Điều 49–54 BLTTHS"},{"cid":"C2T3","title":"Phân biệt cơ quan tiến hành tố tụng và cơ quan được giao nhiệm vụ điều tra","text":"Một vụ án phát hiện trên tàu biển và một vụ việc phát hiện tại đơn vị biên phòng. Cơ quan chuyên trách được giao tiến hành một số hoạt động điều tra thực hiện các hoạt động ban đầu theo luật, sau đó chuyển hồ sơ cho Cơ quan điều tra có thẩm quyền.","mcq":["C2T3-1","C2T3-2","C2T3-3","C2T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Phân biệt cơ quan tiến hành tố tụng với cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra.","Thẩm quyền của cơ quan được giao nhiệm vụ là thẩm quyền giới hạn, không tương đương toàn bộ thẩm quyền Cơ quan điều tra.","Khi vượt thẩm quyền, phải chuyển giao theo quy định, bảo đảm tính liên tục và hợp pháp của hồ sơ.","Cần đối chiếu quy định mới sau sắp xếp tổ chức bộ máy, tránh dùng mô hình tổ chức cũ."],"basis":"Điều 35, 163–165 BLTTHS; Luật 99/2025/QH15"}]},{"name":"Chứng minh, chứng cứ và các biện pháp ngăn chặn, biện pháp cưỡng chế trong tố tụng hình sự","items":[{"cid":"C3T1","title":"Chứng cứ điện tử và việc bảo đảm tính toàn vẹn","text":"Trong vụ án lừa đảo, người tố giác nộp ảnh chụp màn hình tin nhắn và một USB chứa dữ liệu giao dịch. Cơ quan điều tra sao chép dữ liệu nhưng không lập biên bản về thiết bị nguồn, không ghi nhận cách trích xuất. Bị can phủ nhận tin nhắn.","mcq":["C3T1-1","C3T1-2","C3T1-3","C3T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Dữ liệu điện tử là nguồn chứng cứ nhưng phải đáp ứng yêu cầu về thu thập, bảo quản và kiểm tra.","Thiếu biên bản về thiết bị nguồn, phương thức trích xuất ảnh hưởng khả năng kiểm chứng tính xác thực và toàn vẹn.","Không được mặc nhiên coi ảnh chụp màn hình là chứng cứ hợp pháp chỉ vì có liên quan.","Cần thu thập dữ liệu gốc, xác minh, lập biên bản và đối chiếu với chứng cứ khác."],"basis":"Điều 87–99, 107–108 BLTTHS; TTLT 04/2026"},{"cid":"C3T2","title":"Áp dụng biện pháp ngăn chặn","text":"P bị khởi tố về tội ít nghiêm trọng, có nơi cư trú rõ ràng, đã có mặt theo giấy triệu tập và không có dấu hiệu bỏ trốn hay cản trở điều tra. Cơ quan điều tra đề nghị tạm giam chỉ vì cho rằng tạm giam thuận tiện cho việc hỏi cung.","mcq":["C3T2-1","C3T2-2","C3T2-3","C3T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Tạm giam không phải biện pháp tự động; phải có căn cứ luật định.","Bảo lĩnh, đặt tiền để bảo đảm và cấm đi khỏi nơi cư trú là các biện pháp có thể thay thế tạm giam khi đủ điều kiện.","Tính cần thiết, tương xứng và mục đích tố tụng phải được cân nhắc.","Luật 128/2025/QH15 điều chỉnh việc thi hành tạm giữ, tạm giam và cấm đi khỏi nơi cư trú kể từ 01/07/2026."],"basis":"Điều 109, 119, 121–123 BLTTHS; Luật 128/2025/QH15"},{"cid":"C3T3","title":"Trưng cầu giám định và đánh giá kết luận","text":"Trong vụ án gây thương tích, cơ quan điều tra trưng cầu giám định tỷ lệ tổn thương cơ thể. Kết luận giám định có điểm chưa rõ, không giải thích được sự khác biệt giữa hồ sơ bệnh án và kết quả khám. Kiểm sát viên đề nghị làm rõ.","mcq":["C3T3-1","C3T3-2","C3T3-3","C3T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Kết luận giám định là một nguồn chứng cứ, không phải kết luận không thể xem xét lại.","Khi có điểm chưa rõ, mâu thuẫn hoặc nghi ngờ, cơ quan có thẩm quyền xem xét yêu cầu giải thích, giám định bổ sung hoặc giám định lại.","Phải đánh giá kết luận trong mối liên hệ với hồ sơ bệnh án, lời khai và chứng cứ khác.","TTLT 02/2026 hướng dẫn việc trưng cầu, yêu cầu, đánh giá và sử dụng kết luận giám định tư pháp."],"basis":"Điều 87, 100–101, 108 BLTTHS; Luật Giám định tư pháp 105/2025/QH15; TTLT 02/2026"}]},{"name":"Khởi tố, điều tra, truy tố","items":[{"cid":"C4T1","title":"Giải quyết nguồn tin và quyết định khởi tố","text":"Công ty A gửi văn bản tố giác hành vi chiếm đoạt tài sản của nhân viên B, kèm hợp đồng, sao kê và thư điện tử. Cơ quan tiếp nhận ghi nhận nguồn tin nhưng chưa kiểm tra dữ liệu, đã dự thảo quyết định khởi tố bị can. B chưa được triệu tập làm việc.","mcq":["C4T1-1","C4T1-2","C4T1-3","C4T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Văn bản tố giác của tổ chức là nguồn tin về tội phạm khi đáp ứng nội dung luật định.","Cơ quan có thẩm quyền phải kiểm tra, xác minh trong thời hạn luật định trước khi quyết định.","Khởi tố vụ án và khởi tố bị can là hai quyết định khác nhau, không được gộp cơ học.","Dữ liệu điện tử phải được thu thập, kiểm tra và bảo đảm tính toàn vẹn."],"basis":"Điều 143–147, 154, 179 BLTTHS"},{"cid":"C4T2","title":"Thẩm quyền điều tra và phối hợp với Viện kiểm sát","text":"Một vụ án được khởi tố tại địa bàn cấp xã. Điều tra viên được phân công theo quy định mới sau sắp xếp tổ chức bộ máy. Viện kiểm sát nhận quyết định khởi tố và hồ sơ liên quan, yêu cầu bổ sung tài liệu về căn cứ khởi tố.","mcq":["C4T2-1","C4T2-2","C4T2-3","C4T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Thẩm quyền điều tra phải xác định theo pháp luật hiện hành sau sắp xếp tổ chức bộ máy.","Viện kiểm sát kiểm sát việc khởi tố và có quyền yêu cầu bổ sung chứng cứ, tài liệu hoặc xử lý quyết định không có căn cứ theo luật.","TTLT 01/2026 quy định phối hợp giữa Cơ quan điều tra và Viện kiểm sát trong khởi tố, điều tra, truy tố.","Cơ chế phối hợp không làm phát sinh thẩm quyền vượt quá luật."],"basis":"Điều 159, 161, 163–165 BLTTHS; Luật 99/2025/QH15; TTLT 01/2026"},{"cid":"C4T3","title":"Truy tố và trả hồ sơ điều tra bổ sung","text":"Sau khi nhận hồ sơ kết thúc điều tra, Viện kiểm sát nhận thấy chưa làm rõ vai trò của một người liên quan và có mâu thuẫn giữa lời khai với dữ liệu điện tử. Thời hạn truy tố vẫn còn. Kiểm sát viên đề xuất trả hồ sơ điều tra bổ sung.","mcq":["C4T3-1","C4T3-2","C4T3-3","C4T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Viện kiểm sát kiểm tra hồ sơ, đánh giá chứng cứ và quyết định truy tố hoặc xử lý theo các căn cứ khác.","Trả hồ sơ điều tra bổ sung chỉ được thực hiện khi có căn cứ luật định.","Mâu thuẫn dữ liệu điện tử phải được làm rõ trước khi quyết định truy tố.","Đình chỉ, tạm đình chỉ phải được ban hành bằng quyết định theo căn cứ và thủ tục BLTTHS."],"basis":"Điều 240–248 BLTTHS"}]},{"name":"Xét xử sơ thẩm vụ án hình sự","items":[{"cid":"C5T1","title":"Chuẩn bị xét xử và giới hạn xét xử","text":"Tòa án nhận hồ sơ và cáo trạng truy tố N về tội X. Trong quá trình chuẩn bị xét xử, Thẩm phán phát hiện tài liệu thể hiện có thể có hành vi khác chưa được điều tra. Luật sư đề nghị được tiếp cận hồ sơ theo quyền luật định.","mcq":["C5T1-1","C5T1-2","C5T1-3","C5T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Thẩm phán có các quyết định chuẩn bị xét xử theo Điều 277–280 BLTTHS.","Điều 298 quy định giới hạn xét xử; Tòa án không được tự ý mở rộng phạm vi xét xử trái luật.","Khi phát hiện hành vi khác, phải bảo đảm cơ chế tố tụng và quyền bào chữa.","Người bào chữa được thực hiện quyền nghiên cứu hồ sơ theo Điều 73 và các điều liên quan."],"basis":"Điều 73, 277–280, 298 BLTTHS"},{"cid":"C5T2","title":"Trình tự phiên tòa và tranh tụng","text":"Tại phiên tòa sơ thẩm, Kiểm sát viên trình bày luận tội. Luật sư đưa ra tài liệu gỡ tội và đề nghị hỏi người giám định. Chủ tọa tuyên bố không cần xem xét vì hồ sơ điều tra đã đầy đủ.","mcq":["C5T2-1","C5T2-2","C5T2-3","C5T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Tòa án phải kiểm tra, đánh giá chứng cứ tại phiên tòa, không chỉ dựa vào hồ sơ điều tra.","Người bào chữa được thực hiện quyền hỏi, đưa ra tài liệu và tranh luận theo luật.","Tranh tụng đòi hỏi xem xét chứng cứ buộc tội và gỡ tội.","Sau xét hỏi là tranh luận, nghị án và tuyên án theo trình tự BLTTHS."],"basis":"Điều 15, 26, 108, các điều 306–326 BLTTHS"},{"cid":"C5T3","title":"Phiên tòa có bị cáo chưa thành niên","text":"Bị cáo P phạm tội khi 17 tuổi. Khi xét xử, P đã 18 tuổi. Vụ án có bị hại là người chưa thành niên. Tòa án dự kiến tổ chức phiên tòa theo thủ tục thông thường, công khai toàn bộ thông tin cá nhân của P và bị hại.","mcq":["C5T3-1","C5T3-2","C5T3-3","C5T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Cần xác định tuổi tại thời điểm thực hiện hành vi và quy định áp dụng đối với người chưa thành niên; không chỉ căn cứ tuổi tại phiên tòa.","Luật Tư pháp người chưa thành niên có hiệu lực từ 01/01/2026 và đặt ra thủ tục thân thiện, bảo vệ lợi ích tốt nhất.","Phải bảo đảm sự tham gia của người đại diện, người hỗ trợ và các chủ thể theo luật.","Bí mật đời tư của người chưa thành niên phải được bảo vệ theo luật chuyên ngành."],"basis":"Luật Tư pháp người chưa thành niên 59/2024/QH15; BLTTHS"}]},{"name":"Xét xử phúc thẩm vụ án hình sự","items":[{"cid":"C6T1","title":"Kháng cáo của bị cáo và bị hại","text":"Bản án sơ thẩm tuyên Q phạm tội, phạt tù và buộc bồi thường cho bị hại. Q kháng cáo toàn bộ bản án; bị hại chỉ kháng cáo phần bồi thường. Viện kiểm sát kháng nghị phần hình phạt vì cho rằng quá nhẹ.","mcq":["C6T1-1","C6T1-2","C6T1-3","C6T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Q thực hiện quyền kháng cáo; Viện kiểm sát thực hiện quyền kháng nghị.","Bị hại có quyền kháng cáo phần liên quan trực tiếp đến quyền, lợi ích hợp pháp.","Kháng nghị của Viện kiểm sát là yêu cầu xem xét theo thủ tục phúc thẩm.","Phạm vi xét xử theo Điều 345, gồm phần bị kháng cáo, kháng nghị và phần liên quan theo luật."],"basis":"Điều 331, 336–338, 345 BLTTHS"},{"cid":"C6T2","title":"Rút kháng cáo tại phiên tòa phúc thẩm","text":"Tại phiên tòa phúc thẩm, bị cáo R tự nguyện rút toàn bộ kháng cáo. Viện kiểm sát vẫn giữ nguyên kháng nghị đối với phần hình phạt. Bị hại không rút kháng cáo về bồi thường.","mcq":["C6T2-1","C6T2-2","C6T2-3","C6T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Rút kháng cáo chỉ tác động đến phần kháng cáo đã rút; không làm mất hiệu lực kháng nghị hoặc kháng cáo khác.","Tòa án đình chỉ xét xử phúc thẩm đối với phần đã rút theo điều kiện luật định.","Kháng nghị của Viện kiểm sát vẫn được xem xét nếu còn hợp lệ.","Kháng cáo độc lập của bị hại về bồi thường tiếp tục được xem xét."],"basis":"Điều 331, 336–338, 342, 345, 348 BLTTHS"},{"cid":"C6T3","title":"Sửa hoặc hủy bản án sơ thẩm","text":"Tòa án cấp phúc thẩm phát hiện bản án sơ thẩm đánh giá sai một chứng cứ quan trọng. Hồ sơ đã đủ căn cứ để sửa một phần hình phạt; tuy nhiên, một vi phạm nghiêm trọng khác trong điều tra không thể khắc phục tại phiên tòa phúc thẩm.","mcq":["C6T3-1","C6T3-2","C6T3-3","C6T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Điều 357 quy định sửa bản án sơ thẩm khi đáp ứng điều kiện.","Vi phạm nghiêm trọng không thể khắc phục có thể là căn cứ hủy án để điều tra lại hoặc xét xử lại.","Tòa án phải tuân thủ phạm vi xét xử phúc thẩm và điều kiện sửa án.","Bản án phúc thẩm có hiệu lực từ ngày tuyên án."],"basis":"Điều 345, 355, 357–359, 363 BLTTHS"}]},{"name":"Thi hành bản án, quyết định của Tòa án","items":[{"cid":"C7T1","title":"Ra quyết định thi hành án","text":"Bản án phúc thẩm tuyên S chấp hành 3 năm tù và phạt tiền bổ sung. Sau khi bản án có hiệu lực, cơ quan thi hành án nhận được bản án và quyết định thi hành án. S đề nghị cơ quan thi hành án tự giảm mức phạt tiền vì hoàn cảnh khó khăn.","mcq":["C7T1-1","C7T1-2","C7T1-3","C7T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Cơ quan thi hành án không được tự sửa nội dung bản án.","Bản án phúc thẩm có hiệu lực và là căn cứ tổ chức thi hành theo thủ tục luật định.","Việc miễn, giảm, hoãn phải do cơ quan có thẩm quyền quyết định theo điều kiện của luật.","Tại mốc 01/11/2026, Luật 127/2025/QH15 có hiệu lực từ 01/07/2026 là căn cứ hiện hành."],"basis":"Điều 363–365 BLTTHS; Luật Thi hành án hình sự 127/2025/QH15"},{"cid":"C7T2","title":"Thi hành biện pháp ngăn chặn và quyền người bị áp dụng","text":"T bị áp dụng biện pháp cấm đi khỏi nơi cư trú. T cần đi khám bệnh tại tỉnh khác do cấp cứu. Gia đình thông báo cho Trưởng Công an cấp xã nhưng không xin phép cơ quan có thẩm quyền. Đồng thời, T khiếu nại việc quản lý, theo dõi.","mcq":["C7T2-1","C7T2-2","C7T2-3","C7T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Người bị cấm đi khỏi nơi cư trú có quyền và nghĩa vụ theo Luật 128/2025/QH15.","Việc đi khỏi nơi cư trú vì lý do cấp cứu cần đối chiếu trường hợp bất khả kháng, trở ngại khách quan hoặc trường hợp được cho phép; không được hiểu là quyền đi lại tự do.","UBND cấp xã có trách nhiệm chung, Trưởng Công an cấp xã trực tiếp giúp quản lý, theo dõi theo luật mới.","Người bị áp dụng biện pháp có quyền khiếu nại theo quy định."],"basis":"Điều 123 BLTTHS; Luật 128/2025/QH15"},{"cid":"C7T3","title":"Trích xuất phạm nhân tham gia tố tụng","text":"Một phạm nhân đang chấp hành án được xác định là người biết tình tiết quan trọng trong vụ án khác. Cơ quan điều tra cần lấy lời khai và đề nghị trích xuất phạm nhân khỏi cơ sở giam giữ.","mcq":["C7T3-1","C7T3-2","C7T3-3","C7T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Phạm nhân có thể tham gia tố tụng trong tư cách phù hợp nếu có căn cứ.","Việc trích xuất phải tuân thủ TTLT 03/2026 và đúng thẩm quyền, trình tự.","Việc tham gia tố tụng không làm mất tư cách người đang chấp hành án.","Phải bảo đảm thủ tục tố tụng và chế độ quản lý giam giữ."],"basis":"BLTTHS; Luật 127/2025/QH15; TTLT 03/2026"}]},{"name":"Thủ tục xét lại bản án, quyết định đã có hiệu lực pháp luật","items":[{"cid":"C8T1","title":"Đề nghị kháng nghị giám đốc thẩm","text":"Bản án hình sự đã có hiệu lực. Sau đó phát hiện Tòa án đã sử dụng một tài liệu không hợp pháp và bỏ qua chứng cứ ngoại phạm có trong hồ sơ. Người bị kết án gửi đơn đề nghị xem xét lại bản án.","mcq":["C8T1-1","C8T1-2","C8T1-3","C8T1-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Vi phạm nghiêm trọng thủ tục hoặc sai lầm nghiêm trọng có thể là căn cứ kháng nghị giám đốc thẩm.","Đơn đề nghị không tự thay thế quyết định kháng nghị của người có thẩm quyền.","Chứng cứ đã có trong hồ sơ nhưng bị đánh giá sai không đương nhiên là tình tiết mới của tái thẩm.","Giám đốc thẩm là thủ tục xét lại đặc biệt, không phải cấp xét xử thứ ba."],"basis":"Điều 370–393 BLTTHS"},{"cid":"C8T2","title":"Phát hiện tình tiết mới sau khi bản án có hiệu lực","text":"Sau khi bản án có hiệu lực, một nhân chứng mới xuất hiện, cung cấp tài liệu xác thực cho thấy người khác mới là người thực hiện hành vi. Tòa án trước đây không biết tình tiết này. Người bị kết án đề nghị xem xét lại.","mcq":["C8T2-1","C8T2-2","C8T2-3","C8T2-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Tình tiết mới là căn cứ đặc trưng của tái thẩm.","Tình tiết phải có khả năng làm thay đổi cơ bản nội dung bản án và Tòa án không biết khi ra quyết định.","Người có quyền kháng nghị được xác định theo Điều 400 BLTTHS.","Hội đồng tái thẩm chỉ được quyết định trong phạm vi Điều 402 BLTTHS."],"basis":"Điều 397–402 BLTTHS"},{"cid":"C8T3","title":"Phân biệt giám đốc thẩm và tái thẩm","text":"Bản án đã có hiệu lực trong vụ A có hai vấn đề: (i) Tòa án áp dụng sai điều luật dù hồ sơ đã có đầy đủ tài liệu; (ii) sau đó phát hiện một tình tiết mới mà Tòa án không thể biết trước đây. Người bị kết án yêu cầu xem xét lại.","mcq":["C8T3-1","C8T3-2","C8T3-3","C8T3-4"],"ask":["Xác định vấn đề pháp lý trọng tâm và tư cách của các chủ thể liên quan.","Đối chiếu căn cứ, thẩm quyền, trình tự và thời hạn theo pháp luật hiện hành.","Đánh giá tính hợp pháp của tài liệu, quyết định hoặc hoạt động tố tụng.","Đề xuất hướng xử lý và giải thích căn cứ pháp lý."],"guide":["Sai lầm pháp lý hoặc vi phạm nghiêm trọng trong giải quyết vụ án là căn cứ xem xét giám đốc thẩm.","Tình tiết mới có thể làm thay đổi cơ bản nội dung bản án là căn cứ tái thẩm.","Cả hai đều là thủ tục xét lại đặc biệt, không phải cấp xét xử thông thường.","Phải phân loại đúng bản chất vấn đề trước khi tư vấn thủ tục."],"basis":"Điều 370–402 BLTTHS"}]}]}</script>
