ác biện pháp ngăn chặn, biện pháp cưỡng chế trong tố tụng hình sự"},{"n":4,"name":"Khởi tố, điều tra, truy tố"},{"n":5,"name":"Xét xử sơ thẩm vụ án hình sự"},{"n":6,"name":"Xét xử phúc thẩm vụ án hình sự"},{"n":7,"name":"Thi hành bản án, quyết định của Tòa án"},{"n":8,"name":"Thủ tục xét lại bản án, quyết định đã có hiệu lực pháp luật"}],"q":[],"ly":{"root":"Luật Tố tụng hình sự Việt Nam","ch":[{"t":"Chương 1. Khái quát chung về luật tố tụng hình sự Việt Nam","cs":"Điều 1–34 BLTTHS; Hiến pháp 2013 (đã sửa đổi, bổ sung)","b":["Nhận diện luật tố tụng hình sự là ngành luật quy định trình tự, thủ tục tiếp nhận, giải quyết nguồn tin về tội phạm, khởi tố, điều tra, truy tố, xét xử và một số thủ tục thi hành án; đồng thời xác định chủ thể, quyền và nghĩa vụ tố tụng, hợp tác quốc tế.","Phân biệt luật tố tụng hình sự (luật hình thức) với luật hình sự (luật nội dung): một bên quy định cách thức giải quyết vụ án, bên kia quy định tội phạm và hình phạt."],"c":[{"t":"Phạm vi điều chỉnh và nhiệm vụ","cs":"Điều 1, Điều 2 BLTTHS","b":["Điều chỉnh toàn bộ các giai đoạn tố tụng và một số hoạt động thi hành án hình sự; xác định nhiệm vụ, quyền hạn, trách nhiệm và quan hệ giữa các chủ thể tố tụng.","Mục tiêu kép: phát hiện, xử lý đúng và kịp thời tội phạm; đồng thời không để lọt tội phạm, không làm oan người vô tội, bảo vệ công lý và quyền con người."]},{"t":"Hiệu lực và giải thích từ ngữ","cs":"Điều 3, Điều 4 BLTTHS","b":["BLTTHS áp dụng đối với hoạt động tố tụng hình sự trên lãnh thổ Việt Nam; trường hợp có yếu tố nước ngoài phải xem xét điều ước quốc tế, nguyên tắc có đi có lại và miễn trừ.","Phân biệt cơ quan tiến hành tố tụng, cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra; người tiến hành tố tụng; người tham gia tố tụng; người bị buộc tội; nguồn tin về tội phạm."]},{"t":"Các nguyên tắc cơ bản","cs":"Điều 5–33 BLTTHS; Điều 31 Hiến pháp","b":["Bảo đảm pháp chế; tôn trọng và bảo vệ quyền con người, quyền công dân; bảo đảm bình đẳng trước pháp luật; bảo hộ tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản.","Suy đoán vô tội; xác định sự thật vụ án; trách nhiệm chứng minh thuộc cơ quan có thẩm quyền tiến hành tố tụng; bảo đảm quyền bào chữa; tranh tụng trong xét xử; xét xử kịp thời, công bằng, công khai theo luật.","Không ai bị kết án hai lần vì một tội phạm; bảo đảm hiệu lực bản án, quyết định; kiểm tra, giám sát trong tố tụng."]}]},{"t":"Chương 2. Cơ quan tiến hành tố tụng, người tiến hành tố tụng và người tham gia tố tụng","cs":"Điều 34–84 BLTTHS; Luật Tổ chức TAND; Luật Tổ chức VKSND; Luật Tư pháp người chưa thành niên","b":["Phân biệt cơ quan tiến hành tố tụng với cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra; phân biệt người tiến hành tố tụng với người tham gia tố tụng.","Xác định đúng tư cách tố tụng là điều kiện để bảo đảm quyền, nghĩa vụ, thẩm quyền và tính hợp pháp của hoạt động tố tụng."],"c":[{"t":"Cơ quan tiến hành tố tụng","cs":"Điều 34–35 BLTTHS","b":["Cơ quan điều tra; Viện kiểm sát; Tòa án theo mô hình tổ chức và thẩm quyền luật định.","Cơ quan được giao nhiệm vụ tiến hành một số hoạt động điều tra chỉ thực hiện phạm vi thẩm quyền được BLTTHS và luật chuyên ngành giao; không đồng nhất với Cơ quan điều tra."]},{"t":"Người tiến hành tố tụng","cs":"Điều 36–49 BLTTHS","b":["Thủ trưởng, Phó Thủ trưởng, Điều tra viên, Cán bộ điều tra; Viện trưởng, Phó Viện trưởng, Kiểm sát viên, Kiểm tra viên; Chánh án, Phó Chánh án, Thẩm phán, Hội thẩm, Thư ký Tòa án và chức danh liên quan theo luật.","Nhiệm vụ, quyền hạn gắn với từng giai đoạn; phải từ chối hoặc bị thay đổi khi có căn cứ luật định nhằm bảo đảm khách quan, vô tư."]},{"t":"Người tham gia tố tụng","cs":"Điều 55–84 BLTTHS","b":["Người bị tố giác, người bị kiến nghị khởi tố; người bị giữ trong trường hợp khẩn cấp, người bị bắt, người bị tạm giữ; bị can, bị cáo; bị hại, nguyên đơn dân sự, bị đơn dân sự, người có quyền lợi nghĩa vụ liên quan.","Người bào chữa, người bảo vệ quyền và lợi ích hợp pháp; người làm chứng, người chứng kiến, người giám định, người định giá tài sản, người phiên dịch, người dịch thuật và chủ thể khác.","Mỗi tư cách có điều kiện xác lập, quyền, nghĩa vụ và cơ chế bảo đảm riêng; không dùng lẫn thuật ngữ bị hại – nguyên đơn dân sự hoặc bị can – bị cáo."]},{"t":"Bảo đảm quyền và thay đổi người có thẩm quyền","cs":"Điều 49–54, Điều 84 BLTTHS","b":["Kiểm tra căn cứ từ chối, thay đổi người tiến hành tố tụng; bảo đảm không có xung đột lợi ích hoặc quan hệ làm ảnh hưởng tính khách quan.","Bảo đảm quyền tự bào chữa, nhờ người bào chữa, tiếp cận và khiếu nại theo đúng giai đoạn và điều kiện luật định."]}]},{"t":"Chương 3. Chứng minh, chứng cứ và các biện pháp ngăn chặn, biện pháp cưỡng chế trong tố tụng hình sự","cs":"Điều 85–130 BLTTHS; Luật Giám định tư pháp; Luật Thi hành tạm giữ, tạm giam và cấm đi khỏi nơi cư trú","b":["Làm rõ sự thật vụ án thông qua chứng cứ hợp pháp, xác định đúng đối tượng chứng minh, nguồn chứng cứ và trình tự thu thập, kiểm tra, đánh giá.","Phân biệt biện pháp ngăn chặn với biện pháp cưỡng chế khác; mọi hạn chế quyền con người phải có căn cứ, thẩm quyền, trình tự và thời hạn luật định."],"c":[{"t":"Đối tượng và nghĩa vụ chứng minh","cs":"Điều 15, Điều 85–87 BLTTHS","b":["Cơ quan có thẩm quyền tiến hành tố tụng có trách nhiệm chứng minh; người bị buộc tội có quyền nhưng không buộc phải chứng minh mình vô tội.","Đối tượng chứng minh gồm hành vi phạm tội, người thực hiện, lỗi, động cơ, mục đích, tình tiết tăng nặng/giảm nhẹ, thiệt hại và các tình tiết có ý nghĩa giải quyết vụ án."]},{"t":"Chứng cứ và nguồn chứng cứ","cs":"Điều 86–89 BLTTHS","b":["Chứng cứ là những gì có thật, được thu thập theo trình tự, thủ tục BLTTHS quy định và được dùng làm căn cứ xác định sự thật vụ án.","Nguồn chứng cứ gồm vật chứng; lời khai, lời trình bày; dữ liệu điện tử; kết luận giám định, định giá; biên bản tố tụng; kết quả ủy thác tư pháp và tài liệu, đồ vật khác.","Tài liệu dù có thông tin liên quan nhưng thu thập trái trình tự, thủ tục có thể không có giá trị pháp lý để giải quyết vụ án."]},{"t":"Thu thập, kiểm tra và đánh giá chứng cứ","cs":"Điều 88–108 BLTTHS","b":["Thu thập theo đúng thẩm quyền, hình thức và thủ tục; lập biên bản, bảo quản, niêm phong, sao lưu và bảo đảm tính toàn vẹn.","Đánh giá khách quan, toàn diện, đầy đủ; không suy đoán thay chứng cứ; đối chiếu sự phù hợp giữa các nguồn và kiểm tra tính hợp pháp."]},{"t":"Biện pháp ngăn chặn","cs":"Điều 109–125 BLTTHS","b":["Giữ người trong trường hợp khẩn cấp; bắt; tạm giữ; tạm giam; bảo lĩnh; đặt tiền để bảo đảm; cấm đi khỏi nơi cư trú; tạm hoãn xuất cảnh.","Mục đích bảo đảm hoạt động tố tụng, ngăn trốn tránh, cản trở hoặc tiếp tục phạm tội; lựa chọn biện pháp phải cân nhắc tính cần thiết và tương xứng."]},{"t":"Biện pháp cưỡng chế và bảo đảm","cs":"Điều 126–130 BLTTHS","b":["Kê biên tài sản, phong tỏa tài khoản và biện pháp cưỡng chế khác theo luật; xác định đúng điều kiện, thẩm quyền, phạm vi và thủ tục.","Phân biệt mục đích bảo đảm thi hành nghĩa vụ với mục đích ngăn chặn; không áp dụng tùy tiện hoặc vượt quá phạm vi cần thiết."]}]},{"t":"Chương 4. Khởi tố, điều tra, truy tố","cs":"Điều 143–245 BLTTHS; Luật 99/2025/QH15; TTLT 01/2026; Thông tư 03/2026/TT-VKSTC","b":["Giai đoạn từ tiếp nhận, kiểm tra, xác minh nguồn tin về tội phạm đến quyết định khởi tố, điều tra và truy tố; phân biệt các quyết định tố tụng và thẩm quyền ban hành.","Cần cập nhật thay đổi về tổ chức, thẩm quyền theo Luật 99/2025/QH15, nhất là mô hình chính quyền địa phương hai cấp và phân định thẩm quyền cơ quan tiến hành tố tụng."],"c":[{"t":"Tiếp nhận và giải quyết nguồn tin về tội phạm","cs":"Điều 143–148 BLTTHS","b":["Nguồn tin gồm tố giác, tin báo về tội phạm, kiến nghị khởi tố, người phạm tội tự thú và thông tin do cơ quan có thẩm quyền trực tiếp phát hiện.","Kiểm tra, xác minh và ra quyết định khởi tố, không khởi tố hoặc tạm đình chỉ giải quyết nguồn tin theo căn cứ, thời hạn luật định."]},{"t":"Khởi tố vụ án hình sự","cs":"Điều 143–161 BLTTHS","b":["Căn cứ khởi tố là dấu hiệu tội phạm; xác định thẩm quyền, căn cứ, quyết định khởi tố, thay đổi hoặc bổ sung quyết định khởi tố.","Phân biệt khởi tố vụ án với khởi tố bị can: một quyết định xác lập việc giải quyết vụ án, quyết định kia xác định tư cách tố tụng của người bị buộc tội."]},{"t":"Điều tra vụ án hình sự","cs":"Điều 163–232 BLTTHS","b":["Thẩm quyền điều tra; nhiệm vụ, quyền hạn của Điều tra viên; các hoạt động điều tra và biện pháp điều tra theo luật.","Các hoạt động: hỏi cung bị can, lấy lời khai, đối chất, nhận dạng, khám xét, khám nghiệm, thực nghiệm điều tra, giám định, định giá và hoạt động khác.","Kết thúc điều tra: kết luận điều tra đề nghị truy tố hoặc quyết định đình chỉ/tạm đình chỉ theo căn cứ."]},{"t":"Truy tố","cs":"Điều 236–245 BLTTHS","b":["Viện kiểm sát nghiên cứu hồ sơ, đánh giá chứng cứ và căn cứ buộc tội; có thể truy tố, trả hồ sơ điều tra bổ sung, đình chỉ hoặc tạm đình chỉ theo luật.","Cáo trạng xác định hành vi, người bị truy tố, tội danh, điều khoản áp dụng và nội dung cần thiết; bảo đảm giới hạn truy tố và quyền bào chữa."]},{"t":"Phối hợp Cơ quan điều tra – Viện kiểm sát","cs":"TTLT 01/2026/TTLT-VKSNDTC-BCA-BQP","b":["Quy định cơ chế phối hợp thực hiện một số quy định BLTTHS; cần đọc cùng BLTTHS và quy định phân công thẩm quyền của từng ngành.","Không dùng văn bản phối hợp để mở rộng thẩm quyền ngoài luật hoặc thay thế điều kiện, thời hạn trong BLTTHS."]}]},{"t":"Chương 5. Xét xử sơ thẩm vụ án hình sự","cs":"Điều 276–326 BLTTHS; Luật Tư pháp người chưa thành niên","b":["Xét xử sơ thẩm là lần xét xử đầu tiên tại Tòa án có thẩm quyền; bao gồm chuẩn bị xét xử và xét xử tại phiên tòa.","Bảo đảm giới hạn xét xử, tranh tụng, quyền bào chữa, quyền của bị hại và các đương sự; bản án phải dựa trên kết quả kiểm tra, đánh giá chứng cứ tại phiên tòa."],"c":[{"t":"Chuẩn bị xét xử","cs":"Điều 276–280 BLTTHS","b":["Thụ lý hồ sơ, phân công Thẩm phán, nghiên cứu hồ sơ và ra quyết định theo thẩm quyền.","Các quyết định: đưa vụ án ra xét xử; trả hồ sơ điều tra bổ sung; tạm đình chỉ; đình chỉ vụ án."]},{"t":"Thẩm quyền và giới hạn xét xử","cs":"Điều 268–273, Điều 298 BLTTHS","b":["Xác định thẩm quyền theo loại việc, lãnh thổ, cấp xét xử và quy định tổ chức Tòa án hiện hành.","Tòa án xét xử bị cáo và hành vi theo giới hạn luật định; xử lý trường hợp phát hiện tội danh hoặc hành vi khác theo thủ tục luật định."]},{"t":"Trình tự phiên tòa sơ thẩm","cs":"Điều 301–326 BLTTHS","b":["Khai mạc; thủ tục bắt đầu phiên tòa; xét hỏi; tranh luận; nghị án; tuyên án.","Hội đồng xét xử điều hành phiên tòa; Kiểm sát viên thực hành quyền công tố; người bào chữa và người tham gia tố tụng thực hiện quyền, nghĩa vụ.","Tranh tụng phải thực chất; bản án phải đánh giá chứng cứ buộc tội, gỡ tội và lập luận của các bên."]},{"t":"Xét xử người chưa thành niên","cs":"Luật Tư pháp người chưa thành niên 59/2024/QH15; BLTTHS","b":["Thủ tục thân thiện, phù hợp độ tuổi, tâm lý, mức độ trưởng thành; bảo vệ bí mật đời tư và lợi ích tốt nhất của người chưa thành niên.","Phải áp dụng luật chuyên ngành mới, không tiếp tục máy móc dùng quy định cũ đã được thay thế hoặc điều chỉnh."]}]},{"t":"Chương 6. Xét xử phúc thẩm vụ án hình sự","cs":"Điều 330–359 BLTTHS","b":["Phúc thẩm là việc Tòa án cấp trên trực tiếp xét xử lại vụ án hoặc xét lại quyết định sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị.","Phúc thẩm vừa bảo đảm quyền yêu cầu xem xét lại, vừa kiểm soát tính hợp pháp và có căn cứ của bản án, quyết định sơ thẩm."],"c":[{"t":"Kháng cáo, kháng nghị","cs":"Điều 331–343 BLTTHS","b":["Xác định chủ thể có quyền kháng cáo, chủ thể có quyền kháng nghị; đối tượng, hình thức, nội dung và thời hạn.","Phân biệt kháng cáo của người có quyền lợi liên quan với kháng nghị của Viện kiểm sát; kiểm tra phạm vi và hậu quả pháp lý."]},{"t":"Thụ lý và chuẩn bị xét xử phúc thẩm","cs":"Điều 344–350 BLTTHS","b":["Tòa án cấp phúc thẩm kiểm tra điều kiện kháng cáo, kháng nghị; thụ lý, chuyển hồ sơ và chuẩn bị xét xử.","Xem xét việc bổ sung chứng cứ, triệu tập người tham gia tố tụng và các quyết định tố tụng trước phiên tòa."]},{"t":"Phiên tòa và thẩm quyền phúc thẩm","cs":"Điều 351–359 BLTTHS","b":["Trình tự phiên tòa phúc thẩm; xem xét nội dung kháng cáo, kháng nghị và phần bản án có liên quan.","Các quyền hạn: giữ nguyên; sửa; hủy bản án để điều tra hoặc xét xử lại; hủy và đình chỉ vụ án; đình chỉ xét xử phúc thẩm theo căn cứ luật định.","Kiểm tra điều kiện sửa án theo hướng có lợi hoặc bất lợi; không vượt quá giới hạn xét xử phúc thẩm."]}]},{"t":"Chương 7. Thi hành bản án, quyết định của Tòa án","cs":"Phần thứ năm BLTTHS; Luật Thi hành án hình sự; luật chuyên ngành liên quan","b":["Thi hành án là giai đoạn hiện thực hóa hiệu lực của bản án, quyết định đã có hiệu lực hoặc được thi hành ngay theo luật.","Phân biệt thẩm quyền ra quyết định thi hành án, tổ chức thi hành và kiểm sát việc tuân theo pháp luật trong thi hành án."],"c":[{"t":"Hiệu lực và quyết định thi hành án","cs":"Điều 363–365 BLTTHS","b":["Xác định bản án, quyết định có hiệu lực; trường hợp thi hành ngay; chủ thể và thủ tục ra quyết định thi hành án.","Chuyển giao bản án, quyết định và tài liệu cần thiết cho cơ quan có trách nhiệm thi hành."]},{"t":"Thi hành hình phạt và biện pháp tư pháp","cs":"BLTTHS; Luật Thi hành án hình sự","b":["Thi hành hình phạt tù, cải tạo không giam giữ, phạt tiền, trục xuất, cấm đảm nhiệm chức vụ/cấm hành nghề và biện pháp tư pháp theo luật.","Theo dõi thời hạn, hoãn, tạm đình chỉ, giảm thời hạn, miễn hoặc chấm dứt nghĩa vụ trong trường hợp luật định."]},{"t":"Kiểm sát và khiếu nại trong thi hành án","cs":"BLTTHS; Luật Thi hành án hình sự","b":["Viện kiểm sát kiểm sát việc tuân theo pháp luật; người chấp hành án và chủ thể liên quan có quyền khiếu nại, tố cáo theo luật.","Bảo đảm quyền con người, điều kiện giam giữ, chế độ và thủ tục thi hành án."]}]},{"t":"Chương 8. Thủ tục xét lại bản án, quyết định đã có hiệu lực pháp luật","cs":"Phần thứ sáu BLTTHS; Điều 371–402 BLTTHS","b":["Là thủ tục đặc biệt nhằm khắc phục sai lầm nghiêm trọng hoặc xem xét tình tiết mới đối với bản án, quyết định đã có hiệu lực pháp luật.","Phân biệt giám đốc thẩm và tái thẩm theo căn cứ, bản chất, chủ thể có quyền kháng nghị và hệ quả tố tụng."],"c":[{"t":"Thủ tục giám đốc thẩm","cs":"Điều 370–393 BLTTHS","b":["Đối tượng: bản án, quyết định đã có hiệu lực pháp luật bị kháng nghị do có vi phạm pháp luật nghiêm trọng trong giải quyết vụ án.","Căn cứ kháng nghị: kết luận không phù hợp tình tiết khách quan; vi phạm nghiêm trọng thủ tục; sai lầm nghiêm trọng trong áp dụng pháp luật.","Thẩm quyền kháng nghị, thời hạn, phiên tòa giám đốc thẩm và các quyết định của Hội đồng giám đốc thẩm."]},{"t":"Thủ tục tái thẩm","cs":"Điều 397–402 BLTTHS","b":["Đối tượng: bản án, quyết định đã có hiệu lực pháp luật nhưng phát hiện tình tiết mới có thể làm thay đổi cơ bản nội dung bản án, quyết định mà Tòa án không biết khi ra bản án, quyết định.","Phân biệt tình tiết mới với chứng cứ đã có nhưng chưa được đánh giá; xác định chủ thể phát hiện, thông báo và kháng nghị.","Thẩm quyền, thời hạn và các quyết định của Hội đồng tái thẩm."]},{"t":"So sánh giám đốc thẩm và tái thẩm","cs":"Điều 370–402 BLTTHS","b":["Giám đốc thẩm tập trung vào sai lầm pháp lý hoặc vi phạm tố tụng trong bản án đã có hiệu lực; tái thẩm dựa trên tình tiết mới quan trọng.","Cả hai đều là thủ tục xét lại đặc biệt, không phải cấp xét xử thứ ba và chỉ được tiến hành khi có kháng nghị hợp lệ."]}]}]},"upd":{"t":"Điểm cập nhật pháp luật cần lưu ý tại 01/11/2026","cs":"VBHN 172/2026/VBHN-LQ-VPQH và các luật sửa đổi, bổ sung","b":["Dùng VBHN 172/2026/VBHN-LQ-VPQH ngày 01/10/2026 làm bản tra cứu hợp nhất chính của BLTTHS tại mốc 01/11/2026; không tiếp tục dùng riêng VBHN 17/2026 như bản mới nhất.","Luật 99/2025/QH15 có hiệu lực từ 01/07/2025, sửa đổi nhiều nội dung BLTTHS, bao gồm thuật ngữ, thẩm quyền và cơ cấu cơ quan/người được giao nhiệm vụ tiến hành một số hoạt động điều tra; cần đối chiếu kỹ khi giảng dạy Chương 2 và Chương 4.","Luật Tư pháp người chưa thành niên 59/2024/QH15 có hiệu lực từ 01/01/2026; nội dung tố tụng đối với người chưa thành niên phải được cập nhật theo luật này và các quy định hướng dẫn, không bê nguyên các quy định cũ.","Luật Tương trợ tư pháp về hình sự 103/2025/QH15 và văn bản hướng dẫn có hiệu lực từ 01/07/2026 cần được xem xét ở nội dung hợp tác quốc tế và ủy thác tư pháp.","Luật số 11/2026/QH16 có hiệu lực 01/03/2027: tại mốc 01/11/2026 chưa áp dụng; chỉ ghi chú là văn bản ban hành có hiệu lực tương lai nếu có liên quan đến nội dung học phần.","Danh mục pháp luật hiện là danh mục căn cứ trọng tâm đã xác định, không khẳng định là danh mục mọi văn bản hướng dẫn. Cần rà soát hiệu lực, sửa đổi, thay thế và thẩm quyền theo từng bài trước khi phát hành ngân hàng câu hỏi."]}}</script>
