<script id="pn-data" type="application/json">{"meta":{"id":"luat-hanh-chinh-va-to-tung-hanh-chinh","name":"Luật Hành chính và Luật Tố tụng hành chính","title":"Tài liệu Luật Hành chính và Luật Tố tụng hành chính","menuTitle":"Luật Hành chính và Luật Tố tụng hành chính","asof":"23/11/2026","note":"Tài liệu theo Đề cương chi tiết học phần SLF25-2001 (Phần Luật Hành chính: Chương 1–6; Phần Tố tụng hành chính: Chương 7–10). Căn cứ pháp lý cập nhật đến 23/11/2026, theo mô hình chính quyền địa phương hai cấp và hệ thống Tòa án ba cấp từ 01/7/2025. Lưu ý: dự án Luật Xử lý vi phạm hành chính (sửa đổi) đang được Quốc hội khóa XVI xem xét tại Kỳ họp thứ 2; Chương 5 sẽ cập nhật khi luật mới được thông qua."},"chapters":[{"n":1,"name":"Khái quát chung về Luật Hành chính","ch":"Phần Luật Hành chính"},{"n":2,"name":"Chủ thể quản lý hành chính nhà nước","ch":"Phần Luật Hành chính"},{"n":3,"name":"Điều chỉnh pháp luật hành chính về cung ứng dịch vụ công","ch":"Phần Luật Hành chính"},{"n":4,"name":"Quyết định hành chính và thủ tục hành chính","ch":"Phần Luật Hành chính"},{"n":5,"name":"Vi phạm pháp luật hành chính, trách nhiệm hành chính và các biện pháp cưỡng chế hành chính","ch":"Phần Luật Hành chính"},{"n":6,"name":"Kiểm soát quyền lực hành chính","ch":"Phần Luật Hành chính"},{"n":7,"name":"Khái quát chung về Luật Tố tụng hành chính","ch":"Phần Tố tụng hành chính"},{"n":8,"name":"Thẩm quyền xét xử hành chính của Tòa án nhân dân","ch":"Phần Tố tụng hành chính"},{"n":9,"name":"Chủ thể tiến hành tố tụng và chủ thể tham gia tố tụng hành chính","ch":"Phần Tố tụng hành chính"},{"n":10,"name":"Thủ tục xét xử vụ án hành chính","ch":"Phần Tố tụng hành chính"}],"q":[{"q":"Hoạt động quản lý hành chính nhà nước mang tính chất đặc trưng nào?","o":["Xét xử và giải quyết tranh chấp","Chấp hành và điều hành","Lập hiến và lập pháp","Kiểm sát hoạt động tư pháp"],"a":1,"e":"Quản lý hành chính nhà nước gắn với quyền hành pháp, thể hiện qua hoạt động chấp hành luật và điều hành đời sống xã hội. Xét xử thuộc Tòa án, lập pháp thuộc Quốc hội, kiểm sát thuộc Viện kiểm sát.","b":"Điều 94 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"NB","g":1,"id":"1.1"},{"q":"Cơ quan nào là cơ quan hành chính nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam?","o":["Chính phủ","Chủ tịch nước","Quốc hội","Ủy ban Thường vụ Quốc hội"],"a":0,"e":"Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp và là cơ quan chấp hành của Quốc hội. Quốc hội là cơ quan quyền lực nhà nước cao nhất; Chủ tịch nước là nguyên thủ quốc gia.","b":"Điều 94 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"NB","g":1,"id":"1.2"},{"q":"Phương pháp điều chỉnh chủ yếu của Luật Hành chính là phương pháp nào?","o":["Bình đẳng, thỏa thuận","Tự định đoạt của các bên","Hòa giải, thương lượng","Mệnh lệnh – phục tùng"],"a":3,"e":"Quan hệ quản lý hành chính có sự bất bình đẳng về ý chí: một bên nhân danh Nhà nước ra mệnh lệnh, bên kia phục tùng. Phương pháp thỏa thuận chỉ mang tính bổ sung; bình đẳng, tự định đoạt là đặc trưng của luật dân sự.","b":"Giáo trình Luật Hành chính (Học viện Hành chính Quốc gia, 2020)","lv":"NB","g":1,"id":"1.3"},{"q":"Từ ngày 01/7/2025, chính quyền địa phương ở nước ta được tổ chức theo mô hình nào?","o":["Ba cấp: tỉnh, huyện, xã","Một cấp: tỉnh","Hai cấp: tỉnh và huyện","Hai cấp: tỉnh và xã"],"a":3,"e":"Hiến pháp sửa đổi năm 2025 và Luật Tổ chức chính quyền địa phương 2025 tổ chức chính quyền địa phương ở cấp tỉnh và cấp xã (xã, phường, đặc khu), không còn cấp huyện.","b":"Luật TCCQĐP 2025; Điều 110 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"NB","g":1,"id":"1.4"},{"q":"Quan hệ nào sau đây thuộc đối tượng điều chỉnh của Luật Hành chính?","o":["Quan hệ giữa UBND tỉnh với Sở Tài chính khi giao chỉ tiêu ngân sách","Hợp đồng mua bán nhà giữa hai cá nhân","Quan hệ thừa kế giữa các con với cha mẹ","Quan hệ giữa người lao động với doanh nghiệp tư nhân về tiền lương"],"a":0,"e":"Quan hệ giữa cơ quan thẩm quyền chung (UBND tỉnh) và cơ quan chuyên môn (Sở) phát sinh trong hoạt động chấp hành – điều hành nên thuộc Luật Hành chính. Các quan hệ còn lại là quan hệ dân sự hoặc lao động, dựa trên bình đẳng.","b":"Giáo trình Luật Hành chính Việt Nam (Trường ĐH Luật Hà Nội, 2021)","lv":"TH","g":1,"id":"1.5"},{"q":"Điểm khác biệt cơ bản giữa “quản trị quốc gia” và “quản lý hành chính nhà nước” theo cách tiếp cận hiện đại là gì?","o":["Quản trị quốc gia không cần pháp luật","Quản trị quốc gia nhấn mạnh sự tham gia của nhiều chủ thể, minh bạch và trách nhiệm giải trình","Quản trị quốc gia chỉ do Chính phủ thực hiện","Quản lý hành chính nhà nước không mang tính quyền lực"],"a":1,"e":"Quản trị quốc gia đặt Nhà nước trong mối quan hệ với thị trường và xã hội, đề cao sự tham gia, minh bạch, trách nhiệm giải trình và pháp quyền. Quản trị vẫn dựa trên pháp luật; quản lý hành chính nhà nước luôn mang tính quyền lực.","b":"Nguyễn Bá Chiến, Lê Hải Bình (2025), Quản trị quốc gia hiện đại, hiệu quả","lv":"TH","g":1,"id":"1.6"},{"q":"Hoạt động nào sau đây thể hiện phương pháp thỏa thuận trong Luật Hành chính?","o":["Chủ tịch UBND xã ra quyết định xử phạt vi phạm hành chính","Cảnh sát giao thông ra hiệu lệnh dừng xe","Bộ trưởng ra quyết định kỷ luật công chức","Sở Y tế ký hợp đồng đặt hàng cung ứng dịch vụ khám bệnh với một bệnh viện"],"a":3,"e":"Đặt hàng dịch vụ công dựa trên sự thỏa thuận về số lượng, chất lượng, giá giữa cơ quan nhà nước và đơn vị cung ứng. Ba phương án còn lại là mệnh lệnh đơn phương của chủ thể quản lý.","b":"Giáo trình Luật Hành chính (2020); pháp luật về đặt hàng dịch vụ công","lv":"TH","g":1,"id":"1.7"},{"q":"Việc Tòa án nhân dân tỉnh ra quyết định điều động công chức của Văn phòng Tòa án sang đơn vị khác là quan hệ gì?","o":["Quan hệ tố tụng hành chính","Quan hệ dân sự","Quan hệ quản lý hành chính trong nội bộ cơ quan nhà nước khác","Không phải quan hệ pháp luật"],"a":2,"e":"Ngoài cơ quan hành chính, các cơ quan nhà nước khác (Tòa án, Viện kiểm sát, Quốc hội) cũng phát sinh quan hệ quản lý hành chính nội bộ để ổn định tổ chức bộ máy; quan hệ này thuộc đối tượng điều chỉnh của Luật Hành chính, không phải quan hệ tố tụng.","b":"Giáo trình Luật Hành chính Việt Nam (2021)","lv":"TH","g":1,"id":"1.8"},{"q":"UBND xã T chuyển toàn bộ thủ tục đăng ký khai sinh sang dịch vụ công trực tuyến, người dân không phải nộp bản giấy đã có trong cơ sở dữ liệu. Việc này thể hiện tiêu chí nào của quản lý hành chính hiện đại?","o":["Tinh gọn bộ máy","Đổi mới tổ chức chính quyền địa phương","Xây dựng Chính phủ số và chuyển sang tư duy phục vụ","Tăng cường cưỡng chế hành chính"],"a":2,"e":"Cung ứng dịch vụ công trực tuyến, tái sử dụng dữ liệu đã có là biểu hiện của Chính phủ số và nền hành chính phục vụ, lấy người dân làm trung tâm. Việc này không làm thay đổi cơ cấu bộ máy hay tăng cưỡng chế.","b":"Luật Giao dịch điện tử 2023; NĐ 118/2025/NĐ-CP","lv":"VD","g":1,"id":"1.9"},{"q":"Công ty X và Sở Xây dựng tỉnh Y tranh chấp về khoản tiền trong hợp đồng thuê văn phòng làm trụ sở Sở. Quan hệ này do ngành luật nào điều chỉnh chủ yếu?","o":["Luật Hành chính, vì có một bên là cơ quan nhà nước","Luật Dân sự, vì Sở tham gia với tư cách bên thuê bình đẳng","Luật Tố tụng hành chính","Luật Hiến pháp"],"a":1,"e":"Không phải mọi quan hệ có cơ quan nhà nước tham gia đều là quan hệ hành chính. Khi Sở thuê văn phòng, Sở không dùng quyền lực nhà nước mà tham gia như một chủ thể dân sự bình đẳng.","b":"Điều 1 BLDS 2015","lv":"VD","g":1,"id":"1.10"},{"q":"Chủ tịch UBND phường ra văn bản buộc hộ kinh doanh tháo dỡ biển quảng cáo trong 05 ngày, nếu không sẽ cưỡng chế. Đặc điểm nào của phương pháp điều chỉnh được thể hiện rõ nhất?","o":["Tính bình đẳng giữa các bên","Tính tự nguyện thỏa thuận","Tính đơn phương và được bảo đảm bằng cưỡng chế nhà nước","Tính tùy nghi lựa chọn của hộ kinh doanh"],"a":2,"e":"Chủ thể quản lý đơn phương đặt nghĩa vụ và có quyền áp dụng cưỡng chế nếu không chấp hành – đặc trưng của phương pháp mệnh lệnh – phục tùng.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":1,"id":"1.11"},{"q":"Một tỉnh ban hành quy định “một việc chỉ giao một cơ quan chủ trì”, chấm dứt tình trạng nhiều sở cùng thẩm định một hồ sơ. Đây là biểu hiện của tiêu chí nào?","o":["Mở rộng biên chế","Tinh gọn bộ máy, phân định rõ chức năng","Tăng thủ tục kiểm soát","Tập trung quyền lực về trung ương"],"a":1,"e":"Phân định rõ một đầu mối chịu trách nhiệm, giảm chồng chéo là nội dung cốt lõi của tinh gọn bộ máy, vận hành hiệu lực, hiệu quả.","b":"Luật TCCQĐP 2025","lv":"VD","g":1,"id":"1.12"},{"q":"Theo Luật Cán bộ, công chức 2025, công chức là công dân Việt Nam được:","o":["Bầu cử giữ chức vụ theo nhiệm kỳ","Ký hợp đồng làm việc tại đơn vị sự nghiệp công lập","Tuyển dụng vào vị trí việc làm, trong biên chế, hưởng lương từ ngân sách nhà nước","Ký hợp đồng lao động với cơ quan nhà nước"],"a":2,"e":"Công chức được tuyển dụng vào vị trí việc làm, trong biên chế, hưởng lương từ ngân sách. Bầu cử theo nhiệm kỳ là dấu hiệu của cán bộ; hợp đồng làm việc tại đơn vị sự nghiệp là viên chức.","b":"Khoản 2 Điều 1 Luật CBCC 2025","lv":"NB","g":2,"id":"2.1"},{"q":"Hình thức kỷ luật nào KHÔNG áp dụng đối với công chức theo Luật Cán bộ, công chức 2025?","o":["Khiển trách","Hạ bậc lương","Cảnh cáo","Buộc thôi việc"],"a":1,"e":"Luật CBCC 2025 quy định 4 hình thức kỷ luật công chức: khiển trách, cảnh cáo, cách chức (với công chức lãnh đạo, quản lý), buộc thôi việc; đã bỏ hạ bậc lương và giáng chức.","b":"Khoản 1 Điều 36 Luật CBCC 2025","lv":"NB","g":2,"id":"2.2"},{"q":"Công chức được xếp loại chất lượng hằng năm theo bao nhiêu mức?","o":["04 mức","03 mức","05 mức","06 mức"],"a":0,"e":"Có 4 mức: hoàn thành xuất sắc, hoàn thành tốt, hoàn thành, không hoàn thành nhiệm vụ.","b":"Khoản 1 Điều 26 Luật CBCC 2025","lv":"NB","g":2,"id":"2.3"},{"q":"Viên chức làm việc tại đâu và theo chế độ nào?","o":["Cơ quan hành chính, theo chế độ biên chế","Doanh nghiệp nhà nước, theo hợp đồng lao động","Đơn vị sự nghiệp công lập, theo chế độ hợp đồng làm việc","Cơ quan của Đảng, theo chế độ bổ nhiệm"],"a":2,"e":"Viên chức được tuyển dụng theo vị trí việc làm, làm việc tại đơn vị sự nghiệp công lập theo chế độ hợp đồng làm việc, hưởng lương từ quỹ lương của đơn vị.","b":"Luật Viên chức 2025 (số 129/2025/QH15)","lv":"NB","g":2,"id":"2.4"},{"q":"Điểm khác nhau cơ bản giữa cán bộ và công chức là gì?","o":["Cán bộ hình thành qua bầu cử, phê chuẩn, bổ nhiệm, chỉ định giữ chức vụ theo nhiệm kỳ; công chức hình thành qua tuyển dụng vào vị trí việc làm","Cán bộ không hưởng lương từ ngân sách","Công chức chỉ làm việc ở cấp xã","Cán bộ làm việc theo hợp đồng"],"a":0,"e":"Cơ chế hình thành là tiêu chí phân biệt chủ yếu: cán bộ gắn với nhiệm kỳ, công chức gắn với tuyển dụng và vị trí việc làm. Cả hai đều trong biên chế, hưởng lương ngân sách.","b":"Khoản 1, khoản 2 Điều 1 Luật CBCC 2025","lv":"TH","g":2,"id":"2.5"},{"q":"Cơ quan nào sau đây là cơ quan hành chính nhà nước có thẩm quyền chuyên môn?","o":["Ủy ban nhân dân tỉnh","Sở Tư pháp","Chính phủ","Hội đồng nhân dân xã"],"a":1,"e":"Sở là cơ quan chuyên môn thuộc UBND cấp tỉnh, quản lý một ngành, lĩnh vực. Chính phủ, UBND có thẩm quyền chung; HĐND là cơ quan quyền lực nhà nước ở địa phương, không phải cơ quan hành chính.","b":"Luật TCCQĐP 2025","lv":"TH","g":2,"id":"2.6"},{"q":"Theo Luật Cán bộ, công chức 2025, thời hiệu xử lý kỷ luật đối với hành vi vi phạm đến mức phải kỷ luật bằng hình thức khiển trách là:","o":["02 năm","Không áp dụng thời hiệu","10 năm","05 năm"],"a":3,"e":"Thời hiệu 05 năm với vi phạm đến mức khiển trách, 10 năm với các vi phạm còn lại; một số vi phạm không áp dụng thời hiệu.","b":"Khoản 1 Điều 37 Luật CBCC 2025","lv":"TH","g":2,"id":"2.7"},{"q":"Nhận định nào đúng về người đứng đầu đơn vị sự nghiệp công lập theo Luật Cán bộ, công chức 2025?","o":["Là công chức","Là cán bộ","Không còn được xác định là công chức","Là người lao động theo hợp đồng lao động"],"a":2,"e":"Luật CBCC 2025 đã bỏ nhóm công chức trong bộ máy lãnh đạo, quản lý đơn vị sự nghiệp công lập; người làm việc tại đơn vị sự nghiệp công lập thuộc phạm vi Luật Viên chức.","b":"Điều 1 Luật CBCC 2025","lv":"TH","g":2,"id":"2.8"},{"q":"Anh A là công chức Sở Nội vụ, bị Tòa án kết án 02 năm tù nhưng cho hưởng án treo về tội không phải tội phạm tham nhũng. Anh A có đương nhiên bị buộc thôi việc không?","o":["Không, vì được hưởng án treo và không phạm tội tham nhũng","Có, vì đã bị kết án","Có, nếu thủ trưởng quyết định","Không bao giờ bị buộc thôi việc"],"a":0,"e":"Công chức đương nhiên bị buộc thôi việc khi bị kết án phạt tù không được hưởng án treo hoặc bị kết án về tội phạm tham nhũng. Anh A không thuộc hai trường hợp này; việc xử lý kỷ luật (nếu có) phải theo thủ tục chung.","b":"Khoản 2 Điều 36 Luật CBCC 2025","lv":"VD","g":2,"id":"2.9"},{"q":"Chị B là giáo viên trường trung học phổ thông công lập. Khi có tranh chấp về chấm dứt quan hệ làm việc, chị B được áp dụng chủ yếu văn bản nào?","o":["Luật Cán bộ, công chức 2025","Bộ luật Lao động 2019 cho toàn bộ vấn đề","Luật Viên chức 2025","Luật Tổ chức chính quyền địa phương 2025"],"a":2,"e":"Giáo viên trường công lập là viên chức làm việc theo hợp đồng làm việc tại đơn vị sự nghiệp công lập, nên áp dụng Luật Viên chức.","b":"Luật Viên chức 2025","lv":"VD","g":2,"id":"2.10"},{"q":"Ông C, Phó Giám đốc Sở, có hành vi vi phạm nghiêm trọng. Hình thức kỷ luật nào có thể áp dụng riêng cho ông C mà không áp dụng cho công chức không giữ chức vụ?","o":["Cách chức","Cảnh cáo","Khiển trách","Buộc thôi việc"],"a":0,"e":"Cách chức chỉ áp dụng với công chức giữ chức vụ lãnh đạo, quản lý. Khiển trách, cảnh cáo, buộc thôi việc áp dụng chung cho mọi công chức.","b":"Khoản 1 Điều 36 Luật CBCC 2025","lv":"VD","g":2,"id":"2.11"},{"q":"Một hội nghề nghiệp được Nhà nước giao tổ chức kỳ kiểm tra cấp chứng chỉ hành nghề. Khi thực hiện việc này, hội đó có tư cách gì?","o":["Chỉ là đối tượng quản lý","Cơ quan tư pháp","Cơ quan hành chính nhà nước","Chủ thể được trao quyền quản lý hành chính"],"a":3,"e":"Tổ chức xã hội vốn là đối tượng quản lý, nhưng khi được Nhà nước trao quyền thực hiện một số hoạt động quản lý thì trở thành chủ thể quản lý trong phạm vi được trao; hội không trở thành cơ quan nhà nước.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":2,"id":"2.12"},{"q":"Hoạt động cấp giấy phép xây dựng, đăng ký hộ tịch thuộc loại dịch vụ công nào?","o":["Dịch vụ hành chính công","Dịch vụ sự nghiệp công","Dịch vụ công ích","Dịch vụ thương mại"],"a":0,"e":"Dịch vụ hành chính công gắn với thẩm quyền của cơ quan nhà nước, chỉ cơ quan có thẩm quyền mới cung ứng được.","b":"Giáo trình Luật Hành chính (2020)","lv":"NB","g":3,"id":"3.1"},{"q":"Chủ thể chủ yếu cung ứng dịch vụ sự nghiệp công như giáo dục, y tế là:","o":["Ủy ban nhân dân cấp xã","Đơn vị sự nghiệp công lập","Hội đồng nhân dân","Tòa án nhân dân"],"a":1,"e":"Đơn vị sự nghiệp công lập do Nhà nước thành lập để cung cấp dịch vụ sự nghiệp công, đội ngũ chủ yếu là viên chức.","b":"Luật Viên chức 2025","lv":"NB","g":3,"id":"3.2"},{"q":"Hình thức nào Nhà nước lựa chọn đơn vị cung ứng dịch vụ công thông qua cạnh tranh?","o":["Giao nhiệm vụ","Đấu thầu","Đặt hàng","Ủy quyền"],"a":1,"e":"Đấu thầu là hình thức lựa chọn nhà cung ứng có tính cạnh tranh; giao nhiệm vụ áp dụng cho đơn vị trực thuộc, đặt hàng thông qua hợp đồng với đơn vị đủ điều kiện.","b":"Pháp luật về giao nhiệm vụ, đặt hàng, đấu thầu cung cấp sản phẩm, dịch vụ công","lv":"NB","g":3,"id":"3.3"},{"q":"Dịch vụ thu gom rác thải sinh hoạt, chiếu sáng đô thị thuộc nhóm nào?","o":["Dịch vụ hành chính công","Dịch vụ tư pháp","Dịch vụ công ích","Dịch vụ sự nghiệp công về giáo dục"],"a":2,"e":"Đây là dịch vụ công ích phục vụ nhu cầu thiết yếu chung về hạ tầng, môi trường, có thể do doanh nghiệp thực hiện theo đặt hàng.","b":"Giáo trình Luật Hành chính (2020)","lv":"NB","g":3,"id":"3.4"},{"q":"Vì sao cung ứng dịch vụ công phải được điều chỉnh bằng pháp luật hành chính?","o":["Vì dịch vụ công luôn miễn phí","Vì dịch vụ công không có tranh chấp","Vì chỉ cơ quan nhà nước được cung ứng dịch vụ công","Vì Nhà nước chịu trách nhiệm bảo đảm cung ứng, phải thiết lập tiêu chuẩn, giá, điều kiện và giám sát để bảo đảm công bằng, chất lượng"],"a":3,"e":"Kể cả khi tư nhân tham gia, Nhà nước vẫn chịu trách nhiệm cuối cùng nên phải dùng quy phạm hành chính để đặt tiêu chuẩn, giá và kiểm soát. Dịch vụ công không phải luôn miễn phí và có thể do tư nhân cung ứng.","b":"Giáo trình Luật Hành chính (2020)","lv":"TH","g":3,"id":"3.5"},{"q":"Bệnh viện tư nhân tham gia khám chữa bệnh bảo hiểm y tế. Nhận định nào đúng?","o":["Bệnh viện trở thành cơ quan hành chính nhà nước","Bệnh viện là chủ thể ngoài công lập tham gia cung ứng dịch vụ công, chịu sự quản lý của Nhà nước","Nhà nước không được kiểm tra bệnh viện","Quan hệ chỉ do pháp luật dân sự điều chỉnh"],"a":1,"e":"Xã hội hóa cho phép chủ thể ngoài công lập cung ứng dịch vụ công; Nhà nước quản lý qua cấp phép, tiêu chuẩn, thanh tra. Bệnh viện không vì thế mà thành cơ quan nhà nước.","b":"Giáo trình Luật Hành chính (2020)","lv":"TH","g":3,"id":"3.6"},{"q":"Yêu cầu nào KHÔNG phải là yêu cầu của pháp luật hành chính trong cung ứng dịch vụ công?","o":["Tối đa hóa lợi nhuận cho đơn vị cung ứng","Bình đẳng trong tiếp cận","Công khai, minh bạch quy trình, giá, phí","Trách nhiệm giải trình và cơ chế khiếu nại"],"a":0,"e":"Dịch vụ công phục vụ lợi ích chung, không lấy lợi nhuận làm mục tiêu chính. Các yêu cầu còn lại đều nhằm bảo đảm chất lượng, công bằng.","b":"Giáo trình Luật Hành chính (2020)","lv":"TH","g":3,"id":"3.7"},{"q":"Điểm khác nhau giữa giao nhiệm vụ và đặt hàng cung ứng dịch vụ công là gì?","o":["Giao nhiệm vụ dựa trên quyết định của cơ quan quản lý cấp trên đối với đơn vị trực thuộc; đặt hàng dựa trên hợp đồng về số lượng, chất lượng, giá","Giao nhiệm vụ áp dụng cho doanh nghiệp tư nhân","Đặt hàng không cần ngân sách","Hai hình thức không có khác biệt"],"a":0,"e":"Giao nhiệm vụ mang tính mệnh lệnh hành chính đối với đơn vị trực thuộc; đặt hàng mang tính thỏa thuận, thể hiện phương pháp thỏa thuận trong Luật Hành chính.","b":"Giáo trình Luật Hành chính (2020)","lv":"TH","g":3,"id":"3.8"},{"q":"Phường H tổ chức tiếp nhận hồ sơ chứng thực tại Bộ phận Một cửa nhưng niêm yết thiếu mức phí. Phường vi phạm yêu cầu nào?","o":["Bình đẳng trong tiếp cận","Xã hội hóa dịch vụ","Công khai, minh bạch","Phân cấp quản lý"],"a":2,"e":"Phí, lệ phí là nội dung bắt buộc phải công khai trong cung ứng dịch vụ hành chính công tại Bộ phận Một cửa.","b":"NĐ 118/2025/NĐ-CP","lv":"VD","g":3,"id":"3.9"},{"q":"UBND tỉnh muốn chọn đơn vị vận hành tuyến xe buýt trợ giá trong số nhiều doanh nghiệp đủ năng lực. Hình thức phù hợp nhất là:","o":["Giao nhiệm vụ","Đấu thầu","Ra quyết định hành chính chỉ định ngay","Ủy quyền cho UBND xã"],"a":1,"e":"Khi có nhiều chủ thể đủ điều kiện, đấu thầu bảo đảm cạnh tranh, minh bạch và hiệu quả sử dụng ngân sách.","b":"Pháp luật về đặt hàng, đấu thầu cung cấp dịch vụ công","lv":"VD","g":3,"id":"3.10"},{"q":"Một trường mầm non công lập thu thêm khoản tiền ngoài danh mục được phép. Phụ huynh có thể làm gì để bảo vệ quyền lợi theo pháp luật hành chính?","o":["Khiếu nại với người có thẩm quyền hoặc phản ánh tới cơ quan quản lý giáo dục","Không có cách nào vì đây là quan hệ dân sự","Chỉ có thể khởi kiện vụ án dân sự","Tự ý không đóng mọi khoản phí"],"a":0,"e":"Thu phí trái quy định là hành vi của đơn vị cung ứng dịch vụ công chịu sự quản lý nhà nước; người dân có quyền khiếu nại, phản ánh để cơ quan có thẩm quyền xử lý.","b":"Luật Khiếu nại 2011 (sửa đổi, bổ sung năm 2025)","lv":"VD","g":3,"id":"3.11"},{"q":"Đơn vị sự nghiệp công lập tự bảo đảm toàn bộ chi thường xuyên muốn tăng giá dịch vụ không thuộc danh mục sử dụng ngân sách. Nhà nước vẫn có vai trò gì?","o":["Không còn vai trò","Chỉ thu thuế","Trực tiếp điều hành mọi hoạt động thu chi","Quy định khung giá, tiêu chuẩn và kiểm tra, giám sát"],"a":3,"e":"Tự chủ không loại trừ quản lý nhà nước: Nhà nước vẫn ban hành tiêu chuẩn, khung giá và thanh tra, kiểm tra để bảo vệ người sử dụng dịch vụ.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":3,"id":"3.12"},{"q":"Theo Luật Tố tụng hành chính, quyết định hành chính là văn bản được áp dụng như thế nào?","o":["Một lần đối với một hoặc một số đối tượng cụ thể","Nhiều lần đối với mọi đối tượng","Chỉ áp dụng trong nội bộ cơ quan","Chỉ áp dụng khi được Quốc hội phê chuẩn"],"a":0,"e":"Quyết định hành chính theo Luật TTHC là quyết định cá biệt, về vấn đề cụ thể, áp dụng một lần với đối tượng cụ thể; văn bản áp dụng nhiều lần là văn bản quy phạm.","b":"Khoản 1 Điều 3 Luật TTHC 2015","lv":"NB","g":4,"id":"4.1"},{"q":"Thời hiệu khiếu nại quyết định hành chính lần đầu là bao lâu?","o":["30 ngày","90 ngày","60 ngày","01 năm"],"a":1,"e":"Thời hiệu khiếu nại là 90 ngày kể từ ngày nhận được hoặc biết được quyết định hành chính, hành vi hành chính.","b":"Điều 9 Luật Khiếu nại 2011","lv":"NB","g":4,"id":"4.2"},{"q":"Yêu cầu “ban hành đúng thẩm quyền, đúng thủ tục, nội dung phù hợp luật” thuộc yêu cầu nào đối với quyết định hành chính?","o":["Tính hợp lý","Tính hợp pháp","Tính kinh tế","Tính chính trị"],"a":1,"e":"Thẩm quyền, thủ tục, nội dung phù hợp pháp luật là các yếu tố của tính hợp pháp; tính hợp lý xem xét lợi ích, tính khả thi, phù hợp thực tiễn.","b":"Giáo trình Luật Hành chính (2020)","lv":"NB","g":4,"id":"4.3"},{"q":"Thủ tục hành chính là:","o":["Trình tự, cách thức thực hiện, hồ sơ và yêu cầu, điều kiện do cơ quan nhà nước quy định để giải quyết công việc cụ thể của cá nhân, tổ chức","Bản án của Tòa án hành chính","Quyết định kỷ luật công chức","Quy chế làm việc nội bộ của cơ quan"],"a":0,"e":"Đây là khái niệm thủ tục hành chính theo pháp luật về kiểm soát thủ tục hành chính.","b":"Khoản 1 Điều 3 NĐ 63/2010/NĐ-CP","lv":"NB","g":4,"id":"4.4"},{"q":"Văn bản mang tên “Thông báo” của Chủ tịch UBND phường yêu cầu ông A phải dỡ bỏ mái che trong 05 ngày. Văn bản này:","o":["Không thể là quyết định hành chính vì không mang tên “Quyết định”","Có thể là quyết định hành chính vì quyết định vấn đề cụ thể, áp dụng với đối tượng cụ thể và tạo nghĩa vụ","Là văn bản quy phạm pháp luật","Là bản án hành chính"],"a":1,"e":"Quyết định hành chính được nhận diện theo nội dung chứ không theo tên gọi; thông báo, kết luận, công văn có nội dung quyết định vấn đề cụ thể vẫn là quyết định hành chính.","b":"Khoản 1 Điều 3 Luật TTHC 2015; Nghị quyết số 05/2025/NQ-HĐTP","lv":"TH","g":4,"id":"4.5"},{"q":"Quyết định nào sau đây là quyết định hành chính quy phạm?","o":["Quyết định xử phạt ông B 2 triệu đồng","Quyết định bổ nhiệm bà C làm Trưởng phòng","Quyết định của UBND tỉnh ban hành quy định về quản lý trật tự xây dựng áp dụng trên toàn tỉnh","Quyết định cấp giấy chứng nhận cho hộ D"],"a":2,"e":"Quyết định quy phạm chứa quy tắc xử sự chung, áp dụng nhiều lần với đối tượng không xác định. Các phương án còn lại là quyết định cá biệt.","b":"Luật Ban hành VBQPPL 2025","lv":"TH","g":4,"id":"4.6"},{"q":"Nguyên tắc nào đòi hỏi thủ tục hành chính được công bố, niêm yết và đăng tải trên Cổng Dịch vụ công quốc gia?","o":["Nguyên tắc pháp chế","Nguyên tắc công khai, minh bạch","Nguyên tắc tập trung dân chủ","Nguyên tắc khách quan"],"a":1,"e":"Công bố, niêm yết là biểu hiện của nguyên tắc công khai, minh bạch, giúp người dân biết trước hồ sơ, thời hạn, phí.","b":"NĐ 63/2010/NĐ-CP; NĐ 118/2025/NĐ-CP","lv":"TH","g":4,"id":"4.7"},{"q":"Trường hợp cá nhân vừa khiếu nại vừa khởi kiện cùng một quyết định hành chính thì:","o":["Cả hai cơ quan cùng giải quyết song song","Người khởi kiện phải lựa chọn cơ quan giải quyết","Tòa án luôn được ưu tiên giải quyết","Người giải quyết khiếu nại luôn được ưu tiên"],"a":1,"e":"Tòa án yêu cầu người khởi kiện lựa chọn cơ quan giải quyết và thông báo bằng văn bản; không lựa chọn thì Tòa án trả lại đơn.","b":"Điều 33 Luật TTHC 2015","lv":"TH","g":4,"id":"4.8"},{"q":"Ngày 05/3/2026, bà H nhận quyết định thu hồi giấy phép kinh doanh. Ngày 15/7/2026 bà H gửi đơn khiếu nại lần đầu. Đơn khiếu nại:","o":["Còn thời hiệu vì chưa quá 01 năm","Còn thời hiệu vì chưa quá 06 tháng","Đã quá thời hiệu 90 ngày, trừ khi có lý do bất khả kháng","Không cần xét thời hiệu"],"a":2,"e":"Từ 05/3 đến 15/7/2026 là hơn 90 ngày, nên đơn đã quá thời hiệu khiếu nại, trừ trường hợp ốm đau, thiên tai… không thực hiện được quyền khiếu nại.","b":"Điều 9 Luật Khiếu nại 2011","lv":"VD","g":4,"id":"4.9"},{"q":"Chủ tịch UBND xã ra quyết định xử lý một vụ việc thuộc thẩm quyền của Giám đốc Sở. Quyết định vi phạm yêu cầu nào?","o":["Tính hợp pháp về thẩm quyền","Tính hợp lý về ngôn ngữ","Tính kịp thời","Tính khả thi"],"a":0,"e":"Ban hành vượt thẩm quyền là vi phạm tính hợp pháp – căn cứ quan trọng để hủy quyết định hành chính.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":4,"id":"4.10"},{"q":"Bộ phận Một cửa yêu cầu người dân nộp thêm bản sao giấy tờ đã có trong Cơ sở dữ liệu quốc gia về dân cư dù quy định không đòi hỏi. Việc này vi phạm nguyên tắc nào?","o":["Nguyên tắc tự định đoạt","Nguyên tắc tập thể lãnh đạo","Nguyên tắc hai cấp xét xử","Nguyên tắc đơn giản, tiết kiệm và pháp chế"],"a":3,"e":"Cơ quan không được tự đặt thêm thành phần hồ sơ ngoài quy định và phải tái sử dụng dữ liệu đã có, theo nguyên tắc pháp chế và đơn giản, tiết kiệm.","b":"NĐ 118/2025/NĐ-CP","lv":"VD","g":4,"id":"4.11"},{"q":"Một quyết định đúng thẩm quyền, đúng thủ tục nhưng buộc hộ dân di dời trong 01 ngày giữa mùa mưa bão, không khả thi. Quyết định này:","o":["Hoàn toàn đúng vì đã hợp pháp","Hợp pháp nhưng thiếu tính hợp lý, cần được xem xét lại","Là quyết định vô hiệu tuyệt đối","Không thể bị khiếu nại"],"a":1,"e":"Quyết định hành chính phải bảo đảm cả tính hợp pháp và hợp lý; thời hạn bất khả thi làm giảm tính hợp lý, có thể bị khiếu nại, đề nghị xem xét lại.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":4,"id":"4.12"},{"q":"Hình thức xử phạt nào chỉ được áp dụng là hình thức xử phạt chính?","o":["Cảnh cáo và phạt tiền","Tịch thu tang vật","Trục xuất","Tước quyền sử dụng giấy phép có thời hạn"],"a":0,"e":"Cảnh cáo và phạt tiền chỉ là hình thức xử phạt chính; các hình thức còn lại có thể là chính hoặc bổ sung.","b":"Điều 21 Luật XLVPHC 2012","lv":"NB","g":5,"id":"5.1"},{"q":"Thời hiệu xử phạt vi phạm hành chính chung là bao lâu?","o":["06 tháng","03 năm","02 năm","01 năm"],"a":3,"e":"Thời hiệu chung là 01 năm; một số lĩnh vực là 02 năm; thuế theo pháp luật quản lý thuế.","b":"Điều 6 Luật XLVPHC 2012","lv":"NB","g":5,"id":"5.2"},{"q":"Biện pháp nào là biện pháp xử lý hành chính?","o":["Phạt tiền","Buộc khôi phục lại tình trạng ban đầu","Tạm giữ người","Đưa vào trường giáo dưỡng"],"a":3,"e":"Biện pháp xử lý hành chính gồm giáo dục tại xã, phường, đặc khu; đưa vào trường giáo dưỡng; đưa vào cơ sở giáo dục bắt buộc; đưa vào cơ sở cai nghiện bắt buộc. Phạt tiền là hình thức xử phạt; tạm giữ người là biện pháp ngăn chặn; khôi phục tình trạng ban đầu là biện pháp khắc phục hậu quả.","b":"Điều 89 Luật XLVPHC 2012","lv":"NB","g":5,"id":"5.3"},{"q":"Cá nhân bị xử phạt phải chấp hành quyết định xử phạt trong thời hạn bao lâu kể từ ngày nhận quyết định (nếu quyết định không ghi thời hạn dài hơn)?","o":["05 ngày","07 ngày","10 ngày","30 ngày"],"a":2,"e":"Cá nhân, tổ chức bị xử phạt phải chấp hành trong 10 ngày kể từ ngày nhận quyết định; khiếu nại, khởi kiện không làm tạm đình chỉ việc thi hành.","b":"Điều 73 Luật XLVPHC 2012","lv":"NB","g":5,"id":"5.4"},{"q":"Người từ đủ 14 tuổi đến dưới 16 tuổi bị xử phạt vi phạm hành chính trong trường hợp nào?","o":["Vi phạm hành chính do cố ý","Mọi vi phạm hành chính","Vi phạm hành chính do vô ý","Không bao giờ bị xử phạt"],"a":0,"e":"Người từ đủ 14 đến dưới 16 tuổi chỉ bị xử phạt về vi phạm hành chính do cố ý; từ đủ 16 tuổi bị xử phạt về mọi vi phạm.","b":"Điều 5 Luật XLVPHC 2012","lv":"TH","g":5,"id":"5.5"},{"q":"Cùng một hành vi vi phạm, mức phạt tiền đối với tổ chức so với cá nhân là:","o":["Bằng nhau","Bằng 02 lần","Bằng 03 lần","Bằng một nửa"],"a":1,"e":"Mức phạt tiền đối với tổ chức bằng 02 lần mức phạt tiền đối với cá nhân có cùng hành vi vi phạm.","b":"Điều 3 Luật XLVPHC 2012","lv":"TH","g":5,"id":"5.6"},{"q":"Điểm khác biệt giữa vi phạm hành chính và tội phạm là:","o":["Vi phạm hành chính có mức độ nguy hiểm thấp hơn, không phải tội phạm và bị xử lý bằng chế tài hành chính","Vi phạm hành chính không có lỗi","Tội phạm do cơ quan hành chính xử lý","Vi phạm hành chính để lại án tích"],"a":0,"e":"Vi phạm hành chính cũng có lỗi nhưng ít nguy hiểm hơn, bị xử phạt hành chính, không để lại án tích; tội phạm do Tòa án xét xử theo Bộ luật Hình sự.","b":"Khoản 1 Điều 2 Luật XLVPHC 2012","lv":"TH","g":5,"id":"5.7"},{"q":"Biện pháp khắc phục hậu quả có đặc điểm nào?","o":["Chỉ áp dụng khi đã ra quyết định xử phạt","Là hình thức xử phạt chính","Có thể áp dụng độc lập, kể cả khi hết thời hiệu xử phạt","Chỉ áp dụng với tổ chức"],"a":2,"e":"Biện pháp khắc phục hậu quả nhằm khôi phục trật tự bị xâm phạm, có thể áp dụng độc lập trong các trường hợp luật định như hết thời hiệu, không xác định được người vi phạm.","b":"Điều 28, Điều 65 Luật XLVPHC 2012","lv":"TH","g":5,"id":"5.8"},{"q":"Ông K xây tường rào lấn sang đất công. Ngoài phạt tiền, người có thẩm quyền có thể áp dụng biện pháp nào để buộc ông K trả lại hiện trạng?","o":["Trục xuất","Đưa vào cơ sở giáo dục bắt buộc","Buộc khôi phục lại tình trạng ban đầu","Tạm giữ người"],"a":2,"e":"Buộc khôi phục lại tình trạng ban đầu là biện pháp khắc phục hậu quả phù hợp với hành vi lấn chiếm.","b":"Điều 28 Luật XLVPHC 2012","lv":"VD","g":5,"id":"5.9"},{"q":"Bà M bị phạt 5 triệu đồng nhưng quá thời hạn không nộp, có tài khoản ngân hàng đủ số dư. Biện pháp cưỡng chế phù hợp là:","o":["Khấu trừ tiền từ tài khoản của bà M","Giáo dục tại phường","Khám người","Trục xuất"],"a":0,"e":"Khấu trừ một phần lương, thu nhập hoặc tiền từ tài khoản là biện pháp cưỡng chế thi hành quyết định xử phạt khi người vi phạm không tự nguyện chấp hành.","b":"Điều 86 Luật XLVPHC 2012","lv":"VD","g":5,"id":"5.10"},{"q":"Cơ quan nào có thẩm quyền quyết định đưa một người từ đủ 18 tuổi vào cơ sở giáo dục bắt buộc?","o":["Chủ tịch UBND cấp xã","Trưởng Công an xã","Tòa án nhân dân khu vực","Chủ tịch UBND cấp tỉnh"],"a":2,"e":"Từ 01/7/2025, Tòa án nhân dân khu vực quyết định đưa vào trường giáo dưỡng, cơ sở giáo dục bắt buộc; Chủ tịch UBND cấp xã quyết định biện pháp giáo dục tại xã, phường, đặc khu.","b":"Điều 105 Luật XLVPHC 2012","lv":"VD","g":5,"id":"5.11"},{"q":"Công an phường tạm giữ xe máy của người vi phạm để bảo đảm thi hành quyết định xử phạt. Đây là loại biện pháp gì?","o":["Hình thức xử phạt bổ sung","Biện pháp khắc phục hậu quả","Biện pháp xử lý hành chính","Biện pháp ngăn chặn và bảo đảm xử lý vi phạm hành chính"],"a":3,"e":"Tạm giữ tang vật, phương tiện là biện pháp ngăn chặn và bảo đảm xử lý vi phạm hành chính, không phải chế tài xử phạt.","b":"Điều 119 Luật XLVPHC 2012","lv":"VD","g":5,"id":"5.12"},{"q":"Kiểm toán nhà nước là cơ quan do ai thành lập?","o":["Chính phủ","Thủ tướng Chính phủ","Quốc hội","Bộ Tài chính"],"a":2,"e":"Kiểm toán nhà nước do Quốc hội thành lập, hoạt động độc lập và chỉ tuân theo pháp luật.","b":"Điều 118 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"NB","g":6,"id":"6.1"},{"q":"Theo Luật Thanh tra 2025, hệ thống cơ quan thanh tra nhà nước được tổ chức chủ yếu theo:","o":["Hai cấp: Thanh tra Chính phủ và Thanh tra tỉnh","Bốn cấp: trung ương, tỉnh, huyện, xã","Ba cấp: Chính phủ, bộ, sở","Một cấp tập trung tại trung ương"],"a":0,"e":"Luật Thanh tra 2025 tổ chức lại hệ thống cơ quan thanh tra theo hai cấp trung ương và địa phương, phù hợp chính quyền địa phương hai cấp.","b":"Điều 7 Luật Thanh tra 2025","lv":"NB","g":6,"id":"6.2"},{"q":"Phương thức kiểm soát quyền lực hành chính nào do Tòa án thực hiện?","o":["Xét xử hành chính","Thanh tra hành chính","Giám sát tối cao","Kiểm toán"],"a":0,"e":"Tòa án kiểm soát quyền lực hành chính thông qua xét xử các vụ án hành chính, xem xét tính hợp pháp của quyết định, hành vi hành chính.","b":"Điều 30 Luật TTHC 2015","lv":"NB","g":6,"id":"6.3"},{"q":"Nguyên tắc tổ chức quyền lực nhà nước làm cơ sở hiến định cho kiểm soát quyền lực hành chính là:","o":["Mỗi cơ quan tự kiểm soát mình","Tam quyền phân lập tuyệt đối","Tập trung quyền lực vào cơ quan hành chính","Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan"],"a":3,"e":"Hiến pháp ghi nhận quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong thực hiện quyền lập pháp, hành pháp, tư pháp.","b":"Khoản 3 Điều 2 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"NB","g":6,"id":"6.4"},{"q":"Điểm khác nhau giữa giám sát và kiểm tra trong kiểm soát quyền lực hành chính là:","o":["Giám sát luôn do cấp trên trực tiếp thực hiện","Chủ thể giám sát thường không trực tiếp xử lý mà kiến nghị; chủ thể kiểm tra là cấp trên có quyền xử lý ngay","Kiểm tra chỉ do Quốc hội thực hiện","Không có khác biệt"],"a":1,"e":"Giám sát (Quốc hội, HĐND, Mặt trận…) chủ yếu yêu cầu, kiến nghị; kiểm tra là hoạt động nội bộ hệ thống hành chính, cấp trên có quyền đình chỉ, hủy bỏ, xử lý.","b":"Giáo trình Luật Hành chính (2020)","lv":"TH","g":6,"id":"6.5"},{"q":"Hoạt động chất vấn Bộ trưởng tại phiên họp Quốc hội thuộc phương thức kiểm soát nào?","o":["Giám sát","Kiểm tra nội bộ","Thanh tra chuyên ngành","Xét xử hành chính"],"a":0,"e":"Chất vấn là hình thức giám sát của Quốc hội đối với các thành viên Chính phủ.","b":"Điều 69 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"TH","g":6,"id":"6.6"},{"q":"Kết luận, kiến nghị của Kiểm toán nhà nước có giá trị như thế nào đối với đơn vị được kiểm toán?","o":["Chỉ có giá trị tham khảo","Chỉ có hiệu lực khi Tòa án công nhận","Có tính bắt buộc thực hiện theo quy định pháp luật","Đơn vị có quyền không thực hiện"],"a":2,"e":"Kết luận, kiến nghị kiểm toán bắt buộc đơn vị được kiểm toán thực hiện; nếu không đồng ý thì khiếu nại theo luật, kể cả khởi kiện quyết định giải quyết khiếu nại trong hoạt động kiểm toán.","b":"Luật Kiểm toán nhà nước 2015 (đã sửa đổi, bổ sung)","lv":"TH","g":6,"id":"6.7"},{"q":"Phương thức kiểm soát nào là kiểm soát từ bên trong hệ thống hành chính?","o":["Kiểm tra của Chủ tịch UBND tỉnh đối với sở","Xét xử của Tòa án","Giám sát của Hội đồng nhân dân","Giám sát của Mặt trận Tổ quốc"],"a":0,"e":"Kiểm tra của cấp trên trong hệ thống hành chính là kiểm soát bên trong; HĐND, Tòa án, Mặt trận là chủ thể bên ngoài.","b":"Giáo trình Luật Hành chính (2020)","lv":"TH","g":6,"id":"6.8"},{"q":"Báo chí phản ánh một sở cấp phép sai quy định. Chủ tịch UBND tỉnh đình chỉ thi hành giấy phép và yêu cầu làm rõ trách nhiệm. Đây là phương thức nào?","o":["Giám sát của Quốc hội","Kiểm tra của cơ quan hành chính cấp trên","Xét xử hành chính","Kiểm toán"],"a":1,"e":"Chủ tịch UBND tỉnh là người đứng đầu cơ quan hành chính cấp trên, có quyền kiểm tra, đình chỉ, xử lý văn bản trái pháp luật của cơ quan chuyên môn.","b":"Luật TCCQĐP 2025","lv":"VD","g":6,"id":"6.9"},{"q":"Ông P khởi kiện và được Tòa án tuyên hủy quyết định thu hồi đất trái pháp luật của UBND tỉnh. Phán quyết thể hiện đặc điểm nào của kiểm soát bằng xét xử?","o":["Chỉ mang tính kiến nghị","Thuộc kiểm soát nội bộ","Độc lập, có hiệu lực bắt buộc thi hành","Không làm thay đổi quyết định"],"a":2,"e":"Bản án hành chính có hiệu lực bắt buộc cơ quan hành chính thi hành; Tòa án là cơ quan độc lập ngoài hệ thống hành chính.","b":"Điều 23, Điều 193 Luật TTHC 2015","lv":"VD","g":6,"id":"6.10"},{"q":"HĐND xã tổ chức đoàn giám sát việc chi ngân sách xây dựng nhà văn hóa và phát hiện sai phạm. Bước tiếp theo đúng thẩm quyền của HĐND là:","o":["Trực tiếp ra quyết định xử phạt","Tuyên bản án","Kiến nghị cơ quan có thẩm quyền xử lý, có thể chất vấn, lấy phiếu tín nhiệm","Ra kết luận kiểm toán"],"a":2,"e":"HĐND giám sát và kiến nghị, chất vấn, lấy phiếu tín nhiệm; không trực tiếp xử phạt hay xét xử.","b":"Điều 113 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"VD","g":6,"id":"6.11"},{"q":"Đoàn thanh tra của Thanh tra tỉnh kết luận Sở X vi phạm trong mua sắm. Ai chịu trách nhiệm tổ chức thực hiện kết luận thanh tra?","o":["Chỉ đoàn thanh tra","Quốc hội","Tòa án","Thủ trưởng cơ quan quản lý và đối tượng thanh tra theo quy định"],"a":3,"e":"Luật Thanh tra 2025 quy định rõ trách nhiệm của thủ trưởng cơ quan quản lý nhà nước và đối tượng thanh tra trong thực hiện kết luận thanh tra.","b":"Luật Thanh tra 2025","lv":"VD","g":6,"id":"6.12"},{"q":"Đương sự trong vụ án hành chính gồm:","o":["Người khởi kiện, người bị kiện, người có quyền lợi, nghĩa vụ liên quan","Thẩm phán và Kiểm sát viên","Người làm chứng và người giám định","Chỉ người khởi kiện"],"a":0,"e":"Đương sự gồm người khởi kiện, người bị kiện, người có quyền lợi, nghĩa vụ liên quan; người làm chứng, giám định là người tham gia tố tụng khác.","b":"Điều 3 Luật TTHC 2015","lv":"NB","g":7,"id":"7.1"},{"q":"Nguyên tắc “Tòa án tạo điều kiện để các đương sự đối thoại về việc giải quyết vụ án” được quy định tại:","o":["Điều 8 Luật TTHC 2015","Điều 20 Luật TTHC 2015","Điều 18 Luật TTHC 2015","Điều 25 Luật TTHC 2015"],"a":1,"e":"Điều 20 quy định đối thoại trong tố tụng hành chính; Điều 8 là quyền quyết định, tự định đoạt; Điều 18 là tranh tụng; Điều 25 là kiểm sát.","b":"Điều 20 Luật TTHC 2015","lv":"NB","g":7,"id":"7.2"},{"q":"Luật số 85/2025/QH15 sửa đổi Luật Tố tụng hành chính có hiệu lực từ ngày nào?","o":["01/01/2025","01/01/2026","01/7/2025","01/7/2026"],"a":2,"e":"Luật số 85/2025/QH15 được thông qua ngày 25/6/2025, có hiệu lực từ 01/7/2025, cùng thời điểm tổ chức lại hệ thống Tòa án.","b":"Luật số 85/2025/QH15","lv":"NB","g":7,"id":"7.3"},{"q":"Cơ quan nào kiểm sát việc tuân theo pháp luật trong tố tụng hành chính?","o":["Thanh tra Chính phủ","Kiểm toán nhà nước","Viện kiểm sát nhân dân","Bộ Tư pháp"],"a":2,"e":"Viện kiểm sát nhân dân kiểm sát việc tuân theo pháp luật trong tố tụng hành chính.","b":"Điều 25 Luật TTHC 2015","lv":"NB","g":7,"id":"7.4"},{"q":"Phương pháp điều chỉnh của Luật Tố tụng hành chính thể hiện như thế nào trong quan hệ giữa người khởi kiện và người bị kiện?","o":["Người bị kiện có quyền ra mệnh lệnh cho người khởi kiện","Viện kiểm sát quyết định thay các bên","Người khởi kiện phải phục tùng người bị kiện","Các bên bình đẳng về quyền và nghĩa vụ trước Tòa án"],"a":3,"e":"Dù ngoài đời là quan hệ quản lý – bị quản lý, trong tố tụng các đương sự bình đẳng về quyền và nghĩa vụ.","b":"Điều 17 Luật TTHC 2015","lv":"TH","g":7,"id":"7.5"},{"q":"Nguyên tắc quyền quyết định và tự định đoạt của người khởi kiện thể hiện ở quyền nào?","o":["Quyền chọn Thẩm phán","Quyền rút, thay đổi, bổ sung yêu cầu khởi kiện","Quyền ra bản án","Quyền không phải cung cấp chứng cứ"],"a":1,"e":"Người khởi kiện quyết định việc khởi kiện và có quyền rút, thay đổi, bổ sung yêu cầu trong phạm vi luật định.","b":"Điều 8 Luật TTHC 2015","lv":"TH","g":7,"id":"7.6"},{"q":"Nhận định nào đúng về mối quan hệ giữa Luật Hành chính và Luật Tố tụng hành chính?","o":["Hai ngành luật không liên quan","Luật Tố tụng hành chính thay thế Luật Hành chính","Luật Hành chính là luật nội dung, Luật Tố tụng hành chính là luật hình thức để Tòa án xem xét tính hợp pháp của quyết định, hành vi hành chính","Luật Hành chính quy định thủ tục xét xử"],"a":2,"e":"Luật Hành chính quy định thẩm quyền, nội dung quyết định, hành vi; Luật TTHC quy định trình tự để Tòa án kiểm tra tính hợp pháp của chúng.","b":"Giáo trình Luật Tố tụng hành chính Việt Nam (ĐHQGHN, 2019)","lv":"TH","g":7,"id":"7.7"},{"q":"Nghị quyết số 05/2025/NQ-HĐTP có vị trí gì trong nguồn của Luật Tố tụng hành chính?","o":["Là luật do Quốc hội ban hành","Là văn bản hướng dẫn áp dụng thống nhất Điều 30, Điều 31 Luật TTHC","Là án lệ","Không phải nguồn"],"a":1,"e":"Nghị quyết của Hội đồng Thẩm phán TANDTC hướng dẫn áp dụng thống nhất pháp luật, là nguồn quan trọng của Luật TTHC.","b":"Nghị quyết số 05/2025/NQ-HĐTP","lv":"TH","g":7,"id":"7.8"},{"q":"Trong vụ án, UBND tỉnh (người bị kiện) không cung cấp hồ sơ ban hành quyết định dù Tòa án yêu cầu. UBND tỉnh vi phạm nguyên tắc nào?","o":["Nguyên tắc xét xử tập thể","Nguyên tắc hai cấp xét xử","Nguyên tắc dùng tiếng Việt","Nguyên tắc nghĩa vụ cung cấp tài liệu, chứng cứ của cơ quan có thẩm quyền"],"a":3,"e":"Cơ quan, tổ chức, cá nhân có thẩm quyền có nghĩa vụ cung cấp tài liệu, chứng cứ cho Tòa án; người bị kiện còn có nghĩa vụ cung cấp hồ sơ giải quyết.","b":"Điều 9, Điều 10 Luật TTHC 2015","lv":"VD","g":7,"id":"7.9"},{"q":"Sau khi xét xử sơ thẩm, người khởi kiện không đồng ý bản án. Nguyên tắc nào bảo đảm họ được xem xét lại vụ án?","o":["Nguyên tắc tiếng nói, chữ viết","Nguyên tắc đối thoại","Nguyên tắc bảo đảm chế độ xét xử sơ thẩm, phúc thẩm","Nguyên tắc giữ bí mật"],"a":2,"e":"Bản án sơ thẩm có thể bị kháng cáo, kháng nghị để xét xử phúc thẩm theo nguyên tắc hai cấp xét xử.","b":"Điều 11 Luật TTHC 2015","lv":"VD","g":7,"id":"7.10"},{"q":"Người khởi kiện là người dân tộc thiểu số không thông thạo tiếng Việt. Tòa án phải bảo đảm điều gì?","o":["Buộc người đó tự thuê luật sư","Người đó được dùng tiếng nói, chữ viết của dân tộc mình, có người phiên dịch","Đình chỉ giải quyết vụ án","Chuyển vụ án sang Tòa án khác"],"a":1,"e":"Tiếng nói, chữ viết dùng trong tố tụng là tiếng Việt, người tham gia tố tụng có quyền dùng tiếng dân tộc mình và có người phiên dịch.","b":"Điều 21 Luật TTHC 2015","lv":"VD","g":7,"id":"7.11"},{"q":"Vụ án yêu cầu hủy quyết định thu hồi đất kèm yêu cầu bồi thường thiệt hại. Phần bồi thường được giải quyết thế nào?","o":["Phải tách thành vụ án dân sự riêng trong mọi trường hợp","Không được yêu cầu","Có thể giải quyết trong vụ án hành chính, áp dụng quy định pháp luật về bồi thường","Do Viện kiểm sát quyết định"],"a":2,"e":"Người khởi kiện có thể yêu cầu bồi thường thiệt hại cùng với yêu cầu hủy quyết định hành chính; Tòa án giải quyết theo pháp luật về trách nhiệm bồi thường.","b":"Điều 7 Luật TTHC 2015","lv":"VD","g":7,"id":"7.12"},{"q":"Từ ngày 01/7/2025, Tòa án nào có thẩm quyền xét xử sơ thẩm vụ án hành chính?","o":["Tòa án nhân dân cấp huyện","Tòa án nhân dân tối cao","Tòa án nhân dân cấp cao","Tòa án nhân dân khu vực"],"a":3,"e":"Luật số 85/2025/QH15 giao TAND khu vực giải quyết sơ thẩm toàn bộ khiếu kiện hành chính; không còn TAND cấp huyện và cấp cao.","b":"Điều 31 Luật TTHC 2015 (sửa đổi năm 2025)","lv":"NB","g":8,"id":"8.1"},{"q":"Khiếu kiện nào KHÔNG thuộc thẩm quyền giải quyết của Tòa án trong tố tụng hành chính?","o":["Quyết định hành chính mang tính nội bộ của cơ quan, tổ chức","Quyết định xử phạt vi phạm hành chính","Quyết định thu hồi đất","Danh sách cử tri"],"a":0,"e":"Quyết định, hành vi hành chính mang tính nội bộ của cơ quan, tổ chức bị loại trừ khỏi đối tượng khởi kiện.","b":"Khoản 1 Điều 30 Luật TTHC 2015","lv":"NB","g":8,"id":"8.2"},{"q":"Quyết định kỷ luật buộc thôi việc đối với công chức nào thuộc đối tượng khởi kiện vụ án hành chính?","o":["Mọi cán bộ, công chức","Chỉ công chức cấp xã","Công chức giữ chức vụ dưới Thứ trưởng và tương đương","Thứ trưởng"],"a":2,"e":"Chỉ quyết định kỷ luật buộc thôi việc công chức giữ chức vụ dưới Thứ trưởng và tương đương mới là đối tượng khởi kiện.","b":"Khoản 2 Điều 30 Luật TTHC 2015","lv":"NB","g":8,"id":"8.3"},{"q":"Tòa án nào xét xử phúc thẩm bản án hành chính sơ thẩm của TAND khu vực?","o":["TAND khu vực khác","TANDTC","TAND cấp tỉnh","Ủy ban Thẩm phán TANDTC"],"a":2,"e":"TAND cấp tỉnh (Tòa Hành chính) xét xử phúc thẩm bản án, quyết định sơ thẩm của TAND khu vực bị kháng cáo, kháng nghị.","b":"Điều 32, Điều 32a Luật TTHC 2015","lv":"NB","g":8,"id":"8.4"},{"q":"Ông A cư trú tại tỉnh B, khởi kiện quyết định của Sở Tài nguyên và Môi trường tỉnh B. Tòa án có thẩm quyền sơ thẩm là:","o":["TAND tỉnh B","TANDTC","TAND khu vực nơi ông A cư trú","TAND khu vực nơi Sở có trụ sở trong mọi trường hợp"],"a":2,"e":"Người khởi kiện cùng tỉnh với người bị kiện là cơ quan cấp tỉnh thì TAND khu vực nơi người khởi kiện cư trú, làm việc hoặc có trụ sở có thẩm quyền.","b":"Điểm a khoản 2 Điều 31 Luật TTHC 2015","lv":"TH","g":8,"id":"8.5"},{"q":"Khiếu kiện quyết định hành chính của một Bộ thuộc thẩm quyền của:","o":["TANDTC","TAND khu vực nơi người khởi kiện cư trú, làm việc hoặc có trụ sở","TAND cấp tỉnh nơi Bộ đặt trụ sở","Bộ Tư pháp"],"a":1,"e":"Khiếu kiện quyết định, hành vi của bộ, cơ quan ngang bộ… thuộc TAND khu vực nơi người khởi kiện cư trú, làm việc hoặc có trụ sở.","b":"Khoản 3 Điều 31 Luật TTHC 2015","lv":"TH","g":8,"id":"8.6"},{"q":"Ai giải quyết tranh chấp thẩm quyền giữa hai TAND khu vực thuộc hai tỉnh khác nhau?","o":["Chánh án TANDTC","Chánh án TAND cấp tỉnh nơi thụ lý trước","Hội đồng Thẩm phán TANDTC","Viện trưởng VKSNDTC"],"a":0,"e":"Chánh án TAND cấp tỉnh giải quyết tranh chấp giữa các TAND khu vực trong tỉnh; giữa các TAND khu vực khác tỉnh do Chánh án TANDTC giải quyết.","b":"Khoản 7 Điều 34 Luật TTHC 2015","lv":"TH","g":8,"id":"8.7"},{"q":"Quyết định áp dụng biện pháp xử lý hành chính của Tòa án có phải là đối tượng khởi kiện vụ án hành chính không?","o":["Có","Không, vì thuộc trường hợp loại trừ","Chỉ khi có đơn khiếu nại trước","Chỉ khi Viện kiểm sát đồng ý"],"a":1,"e":"Quyết định, hành vi của Tòa án trong việc áp dụng biện pháp xử lý hành chính, xử lý hành vi cản trở tố tụng không thuộc đối tượng khởi kiện; được xem xét theo thủ tục riêng.","b":"Điểm b khoản 1 Điều 30 Luật TTHC 2015","lv":"TH","g":8,"id":"8.8"},{"q":"Bà H cư trú tại tỉnh M khởi kiện quyết định của UBND tỉnh N về việc thu hồi đất bà có tại tỉnh N. Tòa án có thẩm quyền sơ thẩm là:","o":["TAND khu vực nơi quyết định làm phát sinh, thay đổi, hạn chế, chấm dứt quyền của bà H (nơi có đất tại tỉnh N)","TAND khu vực nơi bà H cư trú tại tỉnh M","TAND tỉnh M","TANDTC"],"a":0,"e":"Khi người khởi kiện không cùng tỉnh với người bị kiện cấp tỉnh, thẩm quyền thuộc TAND khu vực nơi quyết định làm phát sinh, thay đổi, hạn chế, chấm dứt quyền, lợi ích của người khởi kiện.","b":"Điểm b khoản 2 Điều 31 Luật TTHC 2015","lv":"VD","g":8,"id":"8.9"},{"q":"Ông Q vừa gửi đơn khiếu nại lần đầu đến Chủ tịch UBND xã, vừa nộp đơn khởi kiện cùng quyết định, rồi lựa chọn cho người giải quyết khiếu nại giải quyết. Tòa án sẽ:","o":["Thụ lý ngay","Chuyển hồ sơ cho Viện kiểm sát","Tạm đình chỉ vụ án","Trả lại đơn khởi kiện"],"a":3,"e":"Người khởi kiện chọn người giải quyết khiếu nại thì Tòa án trả lại đơn khởi kiện; sau đó vẫn có quyền khởi kiện nếu hết thời hạn không được giải quyết hoặc không đồng ý kết quả.","b":"Điểm b khoản 1 Điều 33, điểm e khoản 1 Điều 123 Luật TTHC 2015","lv":"VD","g":8,"id":"8.10"},{"q":"Hai hộ dân cùng khởi kiện một quyết định thu hồi đất chung của UBND tỉnh, đã được thụ lý thành hai vụ. Tòa án có thể:","o":["Đình chỉ một vụ","Trả lại đơn của hộ thứ hai","Nhập hai vụ án nếu bảo đảm xét xử nhanh chóng, không vi phạm thời hạn chuẩn bị","Chuyển cho Chủ tịch UBND tỉnh giải quyết"],"a":2,"e":"Nhiều người khởi kiện cùng một quyết định hành chính là điều kiện nhập vụ án, kèm yêu cầu bảo đảm hiệu quả và thời hạn.","b":"Khoản 1 Điều 35 Luật TTHC 2015","lv":"VD","g":8,"id":"8.11"},{"q":"Sau khi đã có quyết định đưa vụ án ra xét xử, Tòa án phát hiện vụ án thuộc thẩm quyền của TAND khu vực khác. Ai quyết định chuyển?","o":["Thẩm phán được phân công tự quyết định","Hội đồng xét xử mở phiên tòa ra quyết định đình chỉ xét xử và chuyển hồ sơ","Viện kiểm sát","Chánh án TANDTC"],"a":1,"e":"Trước khi có quyết định đưa ra xét xử thì Thẩm phán chuyển; sau đó thì Hội đồng xét xử mở phiên tòa, ra quyết định đình chỉ xét xử và chuyển hồ sơ.","b":"Khoản 2, khoản 3 Điều 34 Luật TTHC 2015","lv":"VD","g":8,"id":"8.12"},{"q":"Cơ quan tiến hành tố tụng hành chính gồm:","o":["Viện kiểm sát và Công an","Tòa án, Thanh tra","UBND và Tòa án","Tòa án nhân dân, Viện kiểm sát nhân dân"],"a":3,"e":"Cơ quan tiến hành tố tụng hành chính gồm Tòa án nhân dân và Viện kiểm sát nhân dân.","b":"Khoản 1 Điều 36 Luật TTHC 2015","lv":"NB","g":9,"id":"9.1"},{"q":"Người có năng lực hành vi tố tụng hành chính đầy đủ là:","o":["Người từ đủ 15 tuổi","Người từ đủ 16 tuổi","Người từ đủ 18 tuổi trở lên, không mất năng lực hành vi dân sự","Mọi cá nhân"],"a":2,"e":"Đương sự từ đủ 18 tuổi trở lên có đầy đủ năng lực hành vi tố tụng hành chính, trừ người mất năng lực hành vi dân sự hoặc luật có quy định khác.","b":"Điều 54 Luật TTHC 2015","lv":"NB","g":9,"id":"9.2"},{"q":"Ai thuộc nhóm người tham gia tố tụng khác (không phải đương sự)?","o":["Người bị kiện","Người có quyền lợi, nghĩa vụ liên quan","Người làm chứng","Người khởi kiện"],"a":2,"e":"Người làm chứng, giám định, phiên dịch, người đại diện, người bảo vệ quyền lợi là người tham gia tố tụng khác.","b":"Điều 53 Luật TTHC 2015","lv":"NB","g":9,"id":"9.3"},{"q":"Trước khi mở phiên tòa, việc thay đổi Thẩm phán do ai quyết định?","o":["Chánh án Tòa án","Viện trưởng Viện kiểm sát","Hội đồng xét xử","Đương sự tự thỏa thuận"],"a":0,"e":"Trước phiên tòa, Chánh án quyết định thay đổi Thẩm phán; tại phiên tòa, Hội đồng xét xử quyết định.","b":"Điều 49 Luật TTHC 2015","lv":"NB","g":9,"id":"9.4"},{"q":"Người bị kiện trong vụ án hành chính có quyền nào sau đây?","o":["Rút đơn khởi kiện","Kháng nghị giám đốc thẩm","Chủ tọa phiên tòa","Sửa đổi hoặc hủy bỏ quyết định hành chính bị kiện"],"a":3,"e":"Người bị kiện có quyền sửa đổi, hủy bỏ quyết định hành chính, dừng, khắc phục hành vi hành chính bị kiện. Rút đơn là quyền của người khởi kiện; kháng nghị là quyền của người có thẩm quyền.","b":"Điều 57 Luật TTHC 2015","lv":"TH","g":9,"id":"9.5"},{"q":"Thẩm phán phải từ chối tiến hành tố tụng khi:","o":["Đã từng học cùng lớp với luật sư","Cùng quê với người khởi kiện","Đã tham gia giải quyết khiếu nại đối với quyết định hành chính bị kiện","Vụ án phức tạp"],"a":2,"e":"Thẩm phán đã tham gia giải quyết khiếu nại đối với quyết định bị kiện phải từ chối hoặc bị thay đổi để bảo đảm vô tư, khách quan.","b":"Điều 46 Luật TTHC 2015","lv":"TH","g":9,"id":"9.6"},{"q":"Người có quyền lợi, nghĩa vụ liên quan tham gia vụ án theo cách nào?","o":["Chỉ khi Viện kiểm sát yêu cầu","Không được tham gia ở cấp sơ thẩm","Chỉ khi người bị kiện đồng ý","Tự mình đề nghị, đương sự khác đề nghị hoặc Tòa án đưa vào"],"a":3,"e":"Người có quyền lợi, nghĩa vụ liên quan có thể tự đề nghị, được đương sự khác đề nghị và Tòa án chấp nhận, hoặc được Tòa án đưa vào tham gia tố tụng.","b":"Khoản 10 Điều 3 Luật TTHC 2015","lv":"TH","g":9,"id":"9.7"},{"q":"Khi cơ quan bị kiện sáp nhập vào cơ quan khác trong quá trình giải quyết vụ án thì:","o":["Vụ án đương nhiên bị đình chỉ","Người khởi kiện phải khởi kiện lại từ đầu","Cơ quan tiếp nhận chức năng, nhiệm vụ kế thừa quyền, nghĩa vụ tố tụng","Tòa án tự quyết định thay người bị kiện"],"a":2,"e":"Kế thừa quyền, nghĩa vụ tố tụng được đặt ra khi cơ quan, tổ chức hợp nhất, sáp nhập, chia, tách, giải thể; điều này đặc biệt phổ biến khi sắp xếp bộ máy năm 2025.","b":"Điều 59 Luật TTHC 2015","lv":"TH","g":9,"id":"9.8"},{"q":"Chủ tịch UBND tỉnh là người bị kiện. Ông có thể ủy quyền cho ai tham gia tố tụng?","o":["Bất kỳ công dân nào","Chánh án Tòa án","Cấp phó của mình","Kiểm sát viên"],"a":2,"e":"Người bị kiện là cơ quan, người có thẩm quyền chỉ được ủy quyền cho cấp phó đại diện tham gia tố tụng.","b":"Điều 60 Luật TTHC 2015","lv":"VD","g":9,"id":"9.9"},{"q":"Hội thẩm nhân dân N là em ruột của người khởi kiện được phân công tham gia xét xử. Cách xử lý đúng là:","o":["Vẫn tham gia vì Hội thẩm không phải Thẩm phán","Phải từ chối hoặc bị thay đổi","Chỉ tham gia khi đương sự đồng ý","Thay bằng Kiểm sát viên"],"a":1,"e":"Người tiến hành tố tụng là người thân thích của đương sự phải từ chối hoặc bị thay đổi.","b":"Điều 45, Điều 46 Luật TTHC 2015","lv":"VD","g":9,"id":"9.10"},{"q":"Anh T 17 tuổi bị quyết định xử phạt, muốn khởi kiện. Ai thực hiện quyền khởi kiện thay anh T?","o":["Anh T tự khởi kiện","Người đại diện theo pháp luật của anh T","Viện kiểm sát","Chủ tịch UBND xã"],"a":1,"e":"Người chưa đủ 18 tuổi chưa có năng lực hành vi tố tụng hành chính đầy đủ; việc thực hiện quyền, nghĩa vụ tố tụng do người đại diện theo pháp luật thực hiện.","b":"Điều 54, Điều 117 Luật TTHC 2015","lv":"VD","g":9,"id":"9.11"},{"q":"Luật sư của người khởi kiện đồng thời là người làm chứng trong cùng vụ án. Nhận định nào đúng?","o":["Không thể vừa là người bảo vệ quyền lợi vừa làm chứng trong cùng vụ án","Được phép kiêm nhiệm","Chỉ cần Thẩm phán đồng ý","Chỉ cần đương sự đồng ý"],"a":0,"e":"Tư cách người bảo vệ quyền lợi và người làm chứng loại trừ nhau trong cùng vụ án để bảo đảm khách quan của lời khai.","b":"Điều 61, Điều 62 Luật TTHC 2015","lv":"VD","g":9,"id":"9.12"},{"q":"Thời hiệu khởi kiện đối với quyết định hành chính, hành vi hành chính là:","o":["30 ngày","90 ngày","01 năm","02 năm"],"a":2,"e":"Thời hiệu 01 năm kể từ ngày nhận được hoặc biết được quyết định hành chính, hành vi hành chính, quyết định kỷ luật buộc thôi việc.","b":"Điểm a khoản 2 Điều 116 Luật TTHC 2015","lv":"NB","g":10,"id":"10.1"},{"q":"Thời hạn kháng cáo bản án sơ thẩm hành chính là:","o":["07 ngày","10 ngày","15 ngày","30 ngày"],"a":2,"e":"Thời hạn kháng cáo bản án sơ thẩm là 15 ngày kể từ ngày tuyên án; với quyết định tạm đình chỉ, đình chỉ là 07 ngày.","b":"Khoản 1 Điều 206 Luật TTHC 2015","lv":"NB","g":10,"id":"10.2"},{"q":"Hội đồng xét xử phúc thẩm vụ án hành chính gồm:","o":["01 Thẩm phán, 02 Hội thẩm","02 Thẩm phán, 03 Hội thẩm","03 Thẩm phán","05 Thẩm phán"],"a":2,"e":"Hội đồng xét xử phúc thẩm gồm 03 Thẩm phán, trừ trường hợp thủ tục rút gọn.","b":"Điều 222 Luật TTHC 2015","lv":"NB","g":10,"id":"10.3"},{"q":"Thời hạn kháng nghị theo thủ tục giám đốc thẩm là:","o":["01 năm","03 năm","02 năm","05 năm"],"a":1,"e":"Thời hạn kháng nghị giám đốc thẩm là 03 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật.","b":"Điều 263 Luật TTHC 2015","lv":"NB","g":10,"id":"10.4"},{"q":"Thời hạn chuẩn bị xét xử đối với vụ án khiếu kiện quyết định hành chính thông thường là:","o":["04 tháng, gia hạn 02 tháng","02 tháng, gia hạn 01 tháng","06 tháng, gia hạn 03 tháng","01 tháng, không gia hạn"],"a":0,"e":"Thời hạn 04 tháng kể từ ngày thụ lý, vụ án phức tạp được gia hạn một lần không quá 02 tháng.","b":"Điều 130 Luật TTHC 2015","lv":"TH","g":10,"id":"10.5"},{"q":"Trường hợp nào Tòa án KHÔNG tiến hành đối thoại được?","o":["Đương sự đã được triệu tập hợp lệ lần thứ hai mà vẫn cố ý vắng mặt","Người bị kiện đề nghị hoãn một lần","Vụ án có luật sư tham gia","Vụ án liên quan đất đai"],"a":0,"e":"Không tiến hành đối thoại được khi đương sự triệu tập hợp lệ lần thứ hai vẫn cố ý vắng mặt, có lý do chính đáng không tham gia được, hoặc các bên đề nghị không đối thoại.","b":"Điều 135 Luật TTHC 2015","lv":"TH","g":10,"id":"10.6"},{"q":"Căn cứ nào là căn cứ kháng nghị theo thủ tục tái thẩm (không phải giám đốc thẩm)?","o":["Mới phát hiện tình tiết quan trọng mà đương sự đã không thể biết khi giải quyết vụ án","Vi phạm nghiêm trọng thủ tục tố tụng","Sai lầm nghiêm trọng trong áp dụng pháp luật","Kết luận không phù hợp tình tiết khách quan"],"a":0,"e":"Tái thẩm dựa trên tình tiết mới phát hiện; ba phương án còn lại là căn cứ giám đốc thẩm.","b":"Điều 255, Điều 281 Luật TTHC 2015","lv":"TH","g":10,"id":"10.7"},{"q":"Người bị kiện hủy quyết định hành chính bị kiện và người khởi kiện đồng ý rút đơn. Tòa án sẽ:","o":["Tiếp tục xét xử","Ra quyết định đình chỉ giải quyết vụ án","Tạm đình chỉ vụ án","Chuyển hồ sơ cho Viện kiểm sát"],"a":1,"e":"Đây là một căn cứ đình chỉ giải quyết vụ án hành chính.","b":"Điều 143 Luật TTHC 2015","lv":"TH","g":10,"id":"10.8"},{"q":"Ngày 10/9/2026, TAND khu vực tuyên án sơ thẩm có mặt các đương sự. Hạn cuối để người khởi kiện kháng cáo là ngày nào?","o":["25/9/2026","17/9/2026","10/10/2026","10/9/2027"],"a":0,"e":"15 ngày kể từ ngày tuyên án: tính từ ngày tiếp theo 11/9, ngày cuối là 25/9/2026 (nếu không trùng ngày nghỉ).","b":"Khoản 1 Điều 206 Luật TTHC 2015; Điều 147, Điều 148 BLDS 2015","lv":"VD","g":10,"id":"10.9"},{"q":"Viện kiểm sát cấp tỉnh (cấp trên trực tiếp của VKS khu vực) muốn kháng nghị phúc thẩm bản án sơ thẩm của TAND khu vực. Thời hạn là:","o":["30 ngày kể từ ngày tuyên án","15 ngày","07 ngày","03 tháng"],"a":0,"e":"VKS cùng cấp có 15 ngày, VKS cấp trên trực tiếp có 30 ngày kể từ ngày tuyên án để kháng nghị bản án.","b":"Khoản 1 Điều 213 Luật TTHC 2015","lv":"VD","g":10,"id":"10.10"},{"q":"Bản án hành chính buộc UBND xã cấp giấy phép cho ông D đã có hiệu lực, nhưng sau 30 ngày UBND xã không thi hành. Ông D có thể làm gì?","o":["Yêu cầu Tòa án đã xét xử sơ thẩm ra quyết định buộc thi hành án hành chính","Khởi kiện lại vụ án mới","Yêu cầu Thanh tra tỉnh xét xử lại","Không có biện pháp nào"],"a":0,"e":"Hết thời hạn tự nguyện thi hành, người được thi hành có quyền yêu cầu Tòa án đã xét xử sơ thẩm ra quyết định buộc thi hành; cơ quan thi hành án dân sự theo dõi.","b":"Điều 311, Điều 312 Luật TTHC 2015","lv":"VD","g":10,"id":"10.11"},{"q":"Sau khi bản án có hiệu lực, phát hiện kết luận giám định làm căn cứ xét xử là giả mạo. Thủ tục phù hợp là:","o":["Phúc thẩm","Giám đốc thẩm","Tái thẩm","Xét xử lại sơ thẩm theo đơn mới"],"a":2,"e":"Kết luận giám định không đúng sự thật, chứng cứ bị giả mạo là căn cứ tái thẩm; thời hạn kháng nghị 01 năm kể từ ngày biết căn cứ.","b":"Điều 281, Điều 284 Luật TTHC 2015","lv":"VD","g":10,"id":"10.12"},{"q":"Việc UBND phường K ký hợp đồng đặt hàng với Công ty X thể hiện phương pháp điều chỉnh nào?","o":["Thỏa thuận","Mệnh lệnh – phục tùng","Tự định đoạt tuyệt đối","Hòa giải"],"a":0,"e":"Đặt hàng dựa trên sự thống nhất ý chí về số lượng, chất lượng, giá – biểu hiện của phương pháp thỏa thuận, phương pháp bổ sung của Luật Hành chính.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":1,"id":"TH1.01.1","cid":"TH1.01"},{"q":"Văn bản đình chỉ thực hiện hợp đồng của Chủ tịch UBND phường thể hiện đặc điểm nào?","o":["Tính đơn phương, quyền lực nhà nước","Tính bình đẳng","Tính tự nguyện","Tính dân sự"],"a":0,"e":"Văn bản do chủ thể quản lý đơn phương ban hành, tạo hậu quả pháp lý bắt buộc với Công ty X.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":1,"id":"TH1.01.2","cid":"TH1.01"},{"q":"Dịch vụ thu gom rác sinh hoạt mà Công ty X cung ứng thuộc loại nào?","o":["Dịch vụ hành chính công","Dịch vụ sự nghiệp công về y tế","Dịch vụ tư pháp","Dịch vụ công ích"],"a":3,"e":"Thu gom rác sinh hoạt là dịch vụ công ích phục vụ nhu cầu chung về môi trường.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":1,"id":"TH1.01.3","cid":"TH1.01"},{"q":"Nhận định nào đúng về quan hệ giữa UBND phường K và Công ty X?","o":["Là quan hệ dân sự thuần túy","Là quan hệ phát sinh trong quản lý, cung ứng dịch vụ công, có yếu tố quyền lực nhà nước","Là quan hệ tố tụng","Là quan hệ lao động"],"a":1,"e":"Mục đích công, nguồn ngân sách và quyền đơn phương đình chỉ của cơ quan nhà nước cho thấy quan hệ mang tính hành chính.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":1,"id":"TH1.01.4","cid":"TH1.01"},{"q":"Chị L có tư cách pháp lý nào?","o":["Cán bộ","Công chức","Viên chức","Người lao động hợp đồng"],"a":1,"e":"Chị L được tuyển dụng qua thi tuyển vào vị trí việc làm trong cơ quan hành chính nhà nước nên là công chức.","b":"Khoản 2 Điều 1 Luật CBCC 2025","lv":"VD","g":2,"id":"TH2.01.1","cid":"TH2.01"},{"q":"Hình thức “hạ bậc lương” mà Trưởng phòng đề nghị đối với chị L:","o":["Đúng vì là hình thức nhẹ","Đúng nếu chị L đồng ý","Không đúng vì Luật CBCC 2025 không quy định hình thức này","Chỉ đúng với cán bộ"],"a":2,"e":"Luật CBCC 2025 chỉ quy định khiển trách, cảnh cáo, cách chức, buộc thôi việc đối với công chức.","b":"Khoản 1 Điều 36 Luật CBCC 2025","lv":"VD","g":2,"id":"TH2.01.2","cid":"TH2.01"},{"q":"Văn bản chủ yếu điều chỉnh việc kỷ luật anh N là:","o":["Luật Cán bộ, công chức 2025","Luật Tổ chức chính quyền địa phương","Luật Viên chức 2025 và văn bản hướng dẫn","Bộ luật Hình sự"],"a":2,"e":"Anh N là viên chức nên áp dụng Luật Viên chức 2025 và NĐ 234/2026/NĐ-CP về xử lý kỷ luật viên chức.","b":"Luật Viên chức 2025; NĐ 234/2026/NĐ-CP","lv":"VD","g":2,"id":"TH2.01.3","cid":"TH2.01"},{"q":"Dự kiến cách chức anh N có hợp pháp không?","o":["Không, vì cách chức chỉ áp dụng với viên chức quản lý","Có","Có, nếu Hội đồng kỷ luật đồng ý","Có, vì vi phạm chuyên môn"],"a":0,"e":"Cách chức chỉ áp dụng với viên chức quản lý; anh N không giữ chức vụ quản lý.","b":"NĐ 234/2026/NĐ-CP","lv":"VD","g":2,"id":"TH2.01.4","cid":"TH2.01"},{"q":"Bệnh viện đa khoa tỉnh P là chủ thể nào?","o":["Cơ quan hành chính nhà nước","Tổ chức xã hội","Doanh nghiệp tư nhân","Đơn vị sự nghiệp công lập"],"a":3,"e":"Bệnh viện công do Nhà nước thành lập để cung ứng dịch vụ sự nghiệp công về y tế.","b":"Luật Viên chức 2025","lv":"VD","g":3,"id":"TH3.01.1","cid":"TH3.01"},{"q":"Dịch vụ khám chữa bệnh của bệnh viện thuộc loại:","o":["Dịch vụ hành chính công","Dịch vụ tư pháp","Dịch vụ công ích về hạ tầng","Dịch vụ sự nghiệp công"],"a":3,"e":"Y tế, giáo dục, văn hóa thuộc dịch vụ sự nghiệp công.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":3,"id":"TH3.01.2","cid":"TH3.01"},{"q":"Việc không niêm yết công khai giá vi phạm yêu cầu nào?","o":["Bình đẳng","Công khai, minh bạch","Xã hội hóa","Phân cấp"],"a":1,"e":"Giá dịch vụ công phải được công khai để người sử dụng biết và giám sát.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":3,"id":"TH3.01.3","cid":"TH3.01"},{"q":"Quan điểm “đã tự chủ nên Nhà nước không can thiệp vào giá” là:","o":["Đúng","Đúng với mọi dịch vụ","Không đúng, Nhà nước vẫn quản lý khung giá, tiêu chuẩn và thanh tra, kiểm tra","Chỉ sai khi có Tòa án tuyên"],"a":2,"e":"Tự chủ tài chính không làm mất vai trò quản lý nhà nước đối với dịch vụ công.","b":"Giáo trình Luật Hành chính (2020)","lv":"VD","g":3,"id":"TH3.01.4","cid":"TH3.01"},{"q":"Hoạt động chất vấn Giám đốc Sở của HĐND tỉnh thuộc phương thức:","o":["Thanh tra","Kiểm toán","Giám sát","Xét xử"],"a":2,"e":"Chất vấn là hình thức giám sát của cơ quan dân cử.","b":"Điều 113 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","lv":"VD","g":6,"id":"TH6.01.1","cid":"TH6.01"},{"q":"Cơ quan tiến hành thanh tra trong tình huống thuộc cấp nào của hệ thống thanh tra hiện hành?","o":["Thanh tra huyện","Thanh tra Chính phủ","Thanh tra tỉnh – cấp địa phương","Thanh tra Bộ Xây dựng"],"a":2,"e":"Từ 01/7/2025 cơ quan thanh tra ở địa phương là Thanh tra tỉnh.","b":"Luật Thanh tra 2025","lv":"VD","g":6,"id":"TH6.01.2","cid":"TH6.01"},{"q":"Ông S khởi kiện quyết định thu hồi giấy phép của Sở Xây dựng (ông cư trú cùng tỉnh). Tòa án có thẩm quyền sơ thẩm:","o":["TAND tỉnh R","Thanh tra tỉnh","TANDTC","TAND khu vực nơi ông S cư trú"],"a":3,"e":"Người khởi kiện cùng tỉnh với cơ quan cấp tỉnh bị kiện: TAND khu vực nơi người khởi kiện cư trú.","b":"Điểm a khoản 2 Điều 31 Luật TTHC 2015","lv":"VD","g":6,"id":"TH6.01.3","cid":"TH6.01"},{"q":"Thời hiệu khởi kiện của ông S là:","o":["90 ngày","02 năm","01 năm kể từ ngày nhận được hoặc biết được quyết định","Không giới hạn"],"a":2,"e":"Thời hiệu khởi kiện quyết định hành chính là 01 năm.","b":"Điểm a khoản 2 Điều 116 Luật TTHC 2015","lv":"VD","g":6,"id":"TH6.01.4","cid":"TH6.01"},{"q":"Lời đề nghị rút đơn kèm đe dọa tại phiên đối thoại vi phạm nguyên tắc nào?","o":["Đối thoại phải tự nguyện, không ép buộc","Xét xử tập thể","Hai cấp xét xử","Tiếng nói, chữ viết"],"a":0,"e":"Đối thoại phải công khai, dân chủ, không được ép buộc các bên.","b":"Điều 134 Luật TTHC 2015","lv":"VD","g":7,"id":"TH7.01.1","cid":"TH7.01"},{"q":"Việc UBND tỉnh không cung cấp hồ sơ theo yêu cầu của Tòa án vi phạm:","o":["Quyền kháng cáo","Nghĩa vụ cung cấp tài liệu, chứng cứ","Nguyên tắc xét xử công khai","Quyền tự định đoạt"],"a":1,"e":"Người bị kiện và cơ quan có thẩm quyền có nghĩa vụ cung cấp tài liệu, chứng cứ.","b":"Điều 9, Điều 10 Luật TTHC 2015","lv":"VD","g":7,"id":"TH7.01.2","cid":"TH7.01"},{"q":"Quyền giữ nguyên hoặc rút yêu cầu khởi kiện của bà V thể hiện nguyên tắc:","o":["Kiểm sát","Giám đốc việc xét xử","Quyền quyết định và tự định đoạt của người khởi kiện","Tranh tụng"],"a":2,"e":"Người khởi kiện tự quyết định việc duy trì, rút, thay đổi, bổ sung yêu cầu.","b":"Điều 8 Luật TTHC 2015","lv":"VD","g":7,"id":"TH7.01.3","cid":"TH7.01"},{"q":"Yêu cầu bồi thường thiệt hại của bà V được giải quyết như thế nào?","o":["Không được giải quyết trong vụ án hành chính","Chỉ do UBND tỉnh tự giải quyết","Có thể giải quyết trong vụ án hành chính","Chỉ Viện kiểm sát giải quyết"],"a":2,"e":"Vấn đề bồi thường có thể được giải quyết cùng vụ án hành chính.","b":"Điều 7 Luật TTHC 2015","lv":"VD","g":7,"id":"TH7.01.4","cid":"TH7.01"},{"q":"Khiếu kiện quyết định xử phạt của Chủ tịch UBND phường A thuộc thẩm quyền của:","o":["TAND tỉnh B","Chủ tịch UBND tỉnh B","TANDTC","TAND khu vực có phạm vi bao gồm phường A"],"a":3,"e":"Khiếu kiện quyết định của cơ quan, người có thẩm quyền cấp xã thuộc TAND khu vực có phạm vi bao gồm xã, phường đó.","b":"Khoản 1 Điều 31 Luật TTHC 2015","lv":"VD","g":8,"id":"TH8.01.1","cid":"TH8.01"},{"q":"Công văn từ chối cấp lại giấy chứng nhận của Sở Tài chính tỉnh C:","o":["Không khởi kiện được vì là công văn","Có thể là quyết định hành chính bị kiện vì quyết định vấn đề cụ thể với ông Y","Là văn bản quy phạm","Là văn bản nội bộ"],"a":1,"e":"Quyết định hành chính có thể thể hiện dưới hình thức công văn, thông báo.","b":"Khoản 1 Điều 3 Luật TTHC 2015; Nghị quyết số 05/2025/NQ-HĐTP","lv":"VD","g":8,"id":"TH8.01.2","cid":"TH8.01"},{"q":"Tòa án có thẩm quyền giải quyết khiếu kiện văn bản (2):","o":["TAND khu vực nơi ông Y cư trú tại tỉnh B","TANDTC","TAND tỉnh C","TAND khu vực nơi quyết định làm phát sinh, hạn chế quyền của ông Y tại tỉnh C"],"a":3,"e":"Ông Y không cùng tỉnh với người bị kiện nên áp dụng điểm b khoản 2 Điều 31.","b":"Điểm b khoản 2 Điều 31 Luật TTHC 2015","lv":"VD","g":8,"id":"TH8.01.3","cid":"TH8.01"},{"q":"Quyết định điều động công chức của Giám đốc Sở Nội vụ tỉnh B:","o":["Là đối tượng khởi kiện của ông Y","Là quyết định mang tính nội bộ, không thuộc đối tượng khởi kiện của ông Y","Thuộc thẩm quyền TANDTC","Phải khiếu nại lên Quốc hội"],"a":1,"e":"Quyết định mang tính nội bộ của cơ quan bị loại trừ; ông Y cũng không bị ảnh hưởng quyền, lợi ích.","b":"Điểm c khoản 1 Điều 30 Luật TTHC 2015","lv":"VD","g":8,"id":"TH8.01.4","cid":"TH8.01"},{"q":"Thời hiệu khởi kiện của bà X được tính từ thời điểm nào?","o":["20/02/2026 – ngày nhận quyết định cưỡng chế, nên đã hết","15/4/2026 – ngày nhận quyết định giải quyết khiếu nại","01/3/2026 – ngày khiếu nại","05/10/2027 – ngày xét xử"],"a":1,"e":"Trường hợp đã khiếu nại theo đúng quy định, thời hiệu 01 năm tính từ ngày nhận quyết định giải quyết khiếu nại.","b":"Khoản 3 Điều 116 Luật TTHC 2015","lv":"VD","g":10,"id":"TH10.01.1","cid":"TH10.01"},{"q":"Ngày 10/3/2027 bà X nộp đơn thì:","o":["Đã hết thời hiệu","Phải khiếu nại lần hai trước","Còn thời hiệu","Tòa án phải trả lại đơn"],"a":2,"e":"Chưa quá 01 năm kể từ 15/4/2026.","b":"Khoản 3 Điều 116 Luật TTHC 2015","lv":"VD","g":10,"id":"TH10.01.2","cid":"TH10.01"},{"q":"Thời hạn chuẩn bị xét xử áp dụng cho vụ án là:","o":["02 tháng","12 tháng","06 tháng","04 tháng, gia hạn tối đa 02 tháng"],"a":3,"e":"Vụ án khiếu kiện quyết định hành chính thông thường có thời hạn 04 tháng, gia hạn một lần không quá 02 tháng.","b":"Điều 130 Luật TTHC 2015","lv":"VD","g":10,"id":"TH10.01.3","cid":"TH10.01"},{"q":"Tòa án có thẩm quyền xét xử phúc thẩm nếu bà X kháng cáo:","o":["TAND khu vực khác","TAND cấp tỉnh","TANDTC","Ủy ban Thẩm phán TANDTC"],"a":1,"e":"TAND cấp tỉnh xét xử phúc thẩm bản án sơ thẩm của TAND khu vực.","b":"Điều 32, Điều 32a Luật TTHC 2015","lv":"VD","g":10,"id":"TH10.01.4","cid":"TH10.01"},{"id":"TH4.01.1","cid":"TH4.01","g":4,"q":"Dấu hiệu nào có ý nghĩa quyết định khi nhận diện văn bản của Chủ tịch UBND phường M là quyết định hành chính?","o":["Văn bản có đóng dấu đỏ của UBND phường","Văn bản do người có thẩm quyền ban hành, quyết định vấn đề cụ thể trong quản lý hành chính và áp dụng một lần đối với đối tượng cụ thể","Văn bản có tên gọi bắt đầu bằng cụm từ “Quyết định”","Văn bản được gửi qua đường bưu điện"],"a":1,"e":"Cần căn cứ bản chất pháp lý theo khoản 1 Điều 3 Luật Tố tụng hành chính, không chỉ căn cứ tên gọi, con dấu hoặc phương thức gửi.","b":"Khoản 1 Điều 3 Luật Tố tụng hành chính","lv":"TH"},{"id":"TH4.01.2","cid":"TH4.01","g":4,"q":"Điều kiện cơ bản để bà H khởi kiện quyết định hành chính trong tình huống là gì?","o":["Bà H phải khiếu nại lần đầu và lần hai trước khi khởi kiện trong mọi trường hợp","Quyết định bị kiện phải trực tiếp ảnh hưởng đến quyền, lợi ích hợp pháp của bà H và không thuộc trường hợp bị loại trừ khỏi thẩm quyền của Tòa án","Bà H phải được Chủ tịch UBND phường đồng ý","Chỉ cần bà H không đồng ý với cách diễn đạt của văn bản"],"a":1,"e":"Điều 30 quy định các khiếu kiện thuộc thẩm quyền Tòa án và các trường hợp loại trừ. Không có yêu cầu bắt buộc phải khiếu nại hết hai cấp trong mọi trường hợp.","b":"Điều 30, Điều 115 Luật Tố tụng hành chính","lv":"VD"},{"id":"TH4.01.3","cid":"TH4.01","g":4,"q":"Khi bà H đồng thời có đơn khiếu nại và đơn khởi kiện đối với cùng quyết định, Tòa án xử lý thế nào?","o":["Tự động giải quyết cả hai thủ tục song song","Yêu cầu bà H lựa chọn cơ quan giải quyết theo Điều 33","Chỉ giải quyết khiếu nại, không được khởi kiện","Đình chỉ ngay vụ án mà không cần hỏi ý chí người khởi kiện"],"a":1,"e":"Điều 33 quy định cơ chế lựa chọn khi vừa có đơn khiếu nại vừa có đơn khởi kiện.","b":"Điều 33 Luật Tố tụng hành chính","lv":"VD"},{"id":"TH5.01.1","cid":"TH5.01","g":5,"q":"Để xác định hành vi của ông P là vi phạm hành chính, cần kiểm tra yếu tố nào?","o":["Chỉ cần có thiệt hại vật chất xảy ra","Hành vi trái pháp luật về quản lý nhà nước, có lỗi, do chủ thể có năng lực trách nhiệm hành chính thực hiện và chưa đến mức truy cứu trách nhiệm hình sự","Chỉ cần người dân xung quanh phản ánh","Chỉ cần người có thẩm quyền lập biên bản"],"a":1,"e":"Khái niệm vi phạm hành chính đòi hỏi các dấu hiệu pháp lý theo Điều 2 Luật Xử lý vi phạm hành chính; việc lập biên bản là hoạt động tố tụng hành chính không thay thế việc chứng minh dấu hiệu vi phạm.","b":"Khoản 1 Điều 2 Luật Xử lý vi phạm hành chính","lv":"TH"},{"id":"TH5.01.2","cid":"TH5.01","g":5,"q":"Phạt tiền trong quyết định xử phạt được xác định là:","o":["Biện pháp khắc phục hậu quả","Hình thức xử phạt chính","Biện pháp ngăn chặn và bảo đảm xử lý vi phạm","Biện pháp cưỡng chế thi hành quyết định xử phạt"],"a":1,"e":"Phạt tiền là một trong các hình thức xử phạt được quy định tại điểm b khoản 1 Điều 21.","b":"Điểm b khoản 1 Điều 21 Luật Xử lý vi phạm hành chính","lv":"NB"},{"id":"TH5.01.3","cid":"TH5.01","g":5,"q":"Buộc khôi phục lại tình trạng ban đầu thuộc nhóm biện pháp nào?","o":["Hình thức xử phạt chính","Hình thức xử phạt bổ sung","Biện pháp khắc phục hậu quả","Biện pháp xử lý hành chính"],"a":2,"e":"Buộc khôi phục lại tình trạng ban đầu được liệt kê tại điểm a khoản 1 Điều 28, thuộc nhóm biện pháp khắc phục hậu quả.","b":"Điểm a khoản 1 Điều 28 Luật Xử lý vi phạm hành chính","lv":"NB"},{"id":"TH5.01.4","cid":"TH5.01","g":5,"q":"Nhận định nào đúng về việc áp dụng hình thức xử phạt và biện pháp khắc phục hậu quả?","o":["Không bao giờ được áp dụng đồng thời","Có thể áp dụng đồng thời nếu có căn cứ pháp luật; biện pháp khắc phục hậu quả có mục đích khắc phục hậu quả của vi phạm","Biện pháp khắc phục hậu quả chỉ được áp dụng khi không có hình thức xử phạt","Biện pháp khắc phục hậu quả luôn là hình thức xử phạt bổ sung"],"a":1,"e":"Khoản 1 Điều 28 cho phép ngoài hình thức xử phạt, cá nhân, tổ chức có thể bị áp dụng một hoặc nhiều biện pháp khắc phục hậu quả.","b":"Khoản 1 Điều 28 Luật Xử lý vi phạm hành chính","lv":"VD"},{"id":"TH9.01.1","cid":"TH9.01","g":9,"q":"Trong tình huống, tư cách tố tụng phù hợp của ông Q là:","o":["Người bị kiện","Người khởi kiện","Người làm chứng","Người có quyền lợi, nghĩa vụ liên quan"],"a":1,"e":"Ông Q là người khởi kiện vì yêu cầu Tòa án bảo vệ quyền, lợi ích hợp pháp bị quyết định hành chính xâm phạm.","b":"Điều 3 và các quy định về đương sự của Luật Tố tụng hành chính","lv":"NB"},{"id":"TH9.01.2","cid":"TH9.01","g":9,"q":"Nếu quyền, nghĩa vụ của người hàng xóm bị ảnh hưởng bởi kết quả giải quyết vụ án, người này có thể tham gia với tư cách:","o":["Người bị kiện trong mọi trường hợp","Người có quyền lợi, nghĩa vụ liên quan","Người tiến hành tố tụng","Người giám định"],"a":1,"e":"Người có quyền lợi, nghĩa vụ liên quan là chủ thể có quyền, nghĩa vụ liên quan đến việc giải quyết vụ án; việc xác định cụ thể phải căn cứ hồ sơ và yêu cầu tham gia tố tụng.","b":"Các quy định về người tham gia tố tụng, đương sự trong Luật Tố tụng hành chính","lv":"TH"},{"id":"TH9.01.3","cid":"TH9.01","g":8,"q":"Tòa án nào có thẩm quyền sơ thẩm đối với khiếu kiện quyết định của Chủ tịch UBND cấp xã?","o":["Tòa án nhân dân cấp tỉnh trong mọi trường hợp","Tòa án nhân dân khu vực có thẩm quyền theo lãnh thổ","Tòa án nhân dân tối cao","Tòa án quân sự khu vực"],"a":1,"e":"Khoản 1 Điều 31 quy định Tòa án nhân dân khu vực giải quyết sơ thẩm khiếu kiện quyết định hành chính, hành vi hành chính của cơ quan nhà nước cấp xã hoặc người có thẩm quyền trong cơ quan nhà nước cấp xã theo lãnh thổ.","b":"Khoản 1 Điều 31 Luật Tố tụng hành chính","lv":"VD"},{"id":"TH4.01.4","cid":"TH4.01","g":4,"q":"Dấu hiệu nào giúp phân biệt quyết định hành chính cá biệt với văn bản quy phạm pháp luật?","o":["Quyết định hành chính cá biệt được áp dụng một lần đối với một hoặc một số đối tượng cụ thể","Quyết định hành chính cá biệt luôn do Quốc hội ban hành","Văn bản quy phạm pháp luật chỉ áp dụng một lần cho một cá nhân","Quyết định hành chính cá biệt không làm phát sinh nghĩa vụ pháp lý"],"a":0,"e":"Khoản 1 Điều 3 Luật Tố tụng hành chính xác định quyết định hành chính là quyết định về vấn đề cụ thể trong quản lý hành chính, được áp dụng một lần đối với một hoặc một số đối tượng cụ thể.","b":"Khoản 1 Điều 3 Luật Tố tụng hành chính; Văn bản hợp nhất 13/VBHN-VPQH ngày 06/02/2026","lv":"TH"},{"id":"TH9.01.4","cid":"TH9.01","g":9,"q":"Bản án sơ thẩm của Tòa án nhân dân khu vực bị kháng cáo thì cấp xét xử phúc thẩm thuộc thẩm quyền của:","o":["Tòa án nhân dân khu vực khác","Tòa án nhân dân cấp tỉnh","Tòa án nhân dân tối cao trong mọi trường hợp","Ủy ban nhân dân cấp tỉnh"],"a":1,"e":"Điều 32 Luật Tố tụng hành chính quy định Tòa án cấp tỉnh có thẩm quyền phúc thẩm đối với bản án, quyết định chưa có hiệu lực pháp luật của Tòa án nhân dân khu vực bị kháng cáo, kháng nghị.","b":"Điều 32 Luật Tố tụng hành chính; Văn bản hợp nhất 13/VBHN-VPQH ngày 06/02/2026","lv":"NB"}],"th":[{"name":"Chương 1. Khái quát chung về Luật Hành chính","items":[{"cid":"TH1.01","title":"Đặt hàng dịch vụ vệ sinh môi trường và quyết định đình chỉ hợp đồng","text":"Năm 2026, UBND phường K ký hợp đồng đặt hàng với Công ty Môi trường X thu gom rác sinh hoạt trên địa bàn, giá theo đơn giá do UBND thành phố ban hành. Do Công ty X nhiều lần để rác tồn đọng, Chủ tịch UBND phường ban hành văn bản đình chỉ thực hiện hợp đồng, đồng thời yêu cầu Công ty X nộp lại khoản tạm ứng. Công ty X cho rằng đây chỉ là tranh chấp hợp đồng như giữa hai doanh nghiệp.","ask":["Xác định quan hệ giữa UBND phường K và Công ty X thuộc đối tượng điều chỉnh của ngành luật nào.","Phân tích phương pháp điều chỉnh được thể hiện trong việc ký hợp đồng và trong văn bản đình chỉ.","Nhận xét quan điểm của Công ty X."],"guide":["Quan hệ phát sinh trong cung ứng dịch vụ công ích sử dụng ngân sách, một bên là cơ quan hành chính thực hiện chức năng quản lý, nên chịu sự điều chỉnh của Luật Hành chính (kết hợp quy định về hợp đồng).","Việc ký hợp đồng đặt hàng thể hiện phương pháp thỏa thuận; văn bản đình chỉ do Chủ tịch UBND phường đơn phương ban hành thể hiện phương pháp mệnh lệnh – phục tùng.","Quan điểm của Công ty X chưa đầy đủ: hợp đồng đặt hàng dịch vụ công không hoàn toàn bình đẳng như hợp đồng dân sự thuần túy vì có mục đích công và sự hiện diện của quyền lực nhà nước."],"basis":"Giáo trình Luật Hành chính (2020); pháp luật về đặt hàng dịch vụ công","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]}]},{"name":"Chương 2. Chủ thể quản lý hành chính nhà nước","items":[{"cid":"TH2.01","title":"Tuyển dụng, kỷ luật công chức và viên chức sau sắp xếp bộ máy","text":"Tháng 8/2026, chị L được tuyển dụng qua thi tuyển vào vị trí chuyên viên Phòng Kinh tế của UBND xã M. Anh N là bác sĩ tại Trung tâm Y tế khu vực (đơn vị sự nghiệp công lập). Tháng 10/2026, chị L tự ý bỏ việc 7 ngày làm việc liên tục không có lý do; anh N vi phạm quy chế chuyên môn lần đầu, gây hậu quả ít nghiêm trọng. Trưởng phòng đề nghị kỷ luật chị L bằng hình thức hạ bậc lương; Giám đốc Trung tâm dự kiến cách chức anh N dù anh không giữ chức vụ quản lý.","ask":["Xác định tư cách pháp lý của chị L và anh N.","Đề nghị kỷ luật đối với chị L có đúng pháp luật không?","Dự kiến cách chức anh N có đúng không?"],"guide":["Chị L là công chức (tuyển dụng vào vị trí việc làm trong cơ quan nhà nước, trong biên chế) theo khoản 2 Điều 1 Luật CBCC 2025; anh N là viên chức làm việc theo hợp đồng làm việc tại đơn vị sự nghiệp công lập theo Luật Viên chức 2025.","Luật CBCC 2025 chỉ còn 4 hình thức: khiển trách, cảnh cáo, cách chức, buộc thôi việc (khoản 1 Điều 36); không còn hạ bậc lương, nên đề nghị không đúng.","Cách chức chỉ áp dụng với viên chức quản lý; anh N không giữ chức vụ quản lý nên không thể cách chức; với vi phạm lần đầu, hậu quả ít nghiêm trọng có thể xem xét khiển trách."],"basis":"Điều 1, Điều 36 Luật CBCC 2025; Luật Viên chức 2025; NĐ 234/2026/NĐ-CP","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]}]},{"name":"Chương 3. Điều chỉnh pháp luật hành chính về cung ứng dịch vụ công","items":[{"cid":"TH3.01","title":"Bệnh viện công tự chủ tăng giá dịch vụ và quyền của người bệnh","text":"Bệnh viện đa khoa tỉnh P là đơn vị sự nghiệp công lập tự bảo đảm chi thường xuyên. Năm 2026, bệnh viện tự điều chỉnh giá dịch vụ khám chữa bệnh theo yêu cầu cao hơn mức giá đã được phê duyệt và không niêm yết công khai. Bà Q phát hiện bị thu cao hơn giá niêm yết cũ, muốn được bảo vệ quyền lợi. Giám đốc bệnh viện cho rằng đơn vị đã tự chủ nên Nhà nước không can thiệp vào giá.","ask":["Xác định chủ thể và loại dịch vụ công trong tình huống.","Đánh giá quan điểm của Giám đốc bệnh viện.","Nêu cách thức bà Q có thể bảo vệ quyền lợi."],"guide":["Bệnh viện là đơn vị sự nghiệp công lập cung ứng dịch vụ sự nghiệp công về y tế.","Tự chủ không loại trừ quản lý nhà nước: Nhà nước vẫn quy định khung giá, yêu cầu công khai, minh bạch và thanh tra, kiểm tra; quan điểm của Giám đốc không đúng.","Bà Q có quyền khiếu nại với Giám đốc bệnh viện, phản ánh tới Sở Y tế; cơ quan có thẩm quyền có thể thanh tra, xử lý vi phạm về giá và buộc hoàn trả số tiền thu sai."],"basis":"Luật Viên chức 2025; Luật Khiếu nại 2011 (sửa đổi, bổ sung năm 2025)","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]}]},{"name":"Chương 4. Quyết định hành chính và thủ tục hành chính","items":[{"cid":"TH4.01","title":"Quyết định yêu cầu tháo dỡ công trình trên đất của hộ gia đình","text":"Tháng 8/2026, Chủ tịch Ủy ban nhân dân phường M ban hành một văn bản mang tên “Quyết định yêu cầu khắc phục vi phạm”, gửi trực tiếp cho bà H. Văn bản xác định bà H đã dựng mái che lấn ra phần vỉa hè thuộc phạm vi quản lý đô thị, yêu cầu bà H tháo dỡ trong thời hạn 05 ngày và nêu rõ hậu quả nếu không chấp hành. Bà H cho rằng mái che nằm trong ranh giới đất của gia đình, việc ban hành văn bản không có căn cứ và không tổ chức làm việc để bà trình bày ý kiến. Bà H muốn bảo vệ quyền lợi của mình.","ask":["Xác định văn bản của Chủ tịch UBND phường M có phải là quyết định hành chính theo Luật Tố tụng hành chính không?","Bà H có thể lựa chọn cơ chế pháp lý nào để yêu cầu xem xét văn bản này?","Nếu bà H đồng thời gửi đơn khiếu nại đến người có thẩm quyền và đơn khởi kiện đến Tòa án thì cần xử lý thế nào?"],"guide":["Cần xem xét bản chất, không chỉ tên gọi của văn bản. Văn bản do người có thẩm quyền trong cơ quan nhà nước ban hành, quyết định một vấn đề cụ thể trong hoạt động quản lý hành chính và áp dụng một lần đối với một hoặc một số đối tượng cụ thể. Với dữ kiện đã nêu, văn bản có dấu hiệu là quyết định hành chính theo khoản 1 Điều 3 Luật Tố tụng hành chính.","Nếu quyết định không thuộc trường hợp loại trừ tại Điều 30 và trực tiếp ảnh hưởng đến quyền, lợi ích hợp pháp của bà H, bà H có quyền khởi kiện vụ án hành chính theo quy định của Luật Tố tụng hành chính; đồng thời có thể thực hiện quyền khiếu nại theo pháp luật về khiếu nại. Việc lựa chọn con đường cụ thể phải căn cứ tình trạng vụ việc và thời hiệu luật định.","Trường hợp vừa có đơn khiếu nại vừa có đơn khởi kiện, Tòa án yêu cầu người khởi kiện lựa chọn cơ quan giải quyết theo Điều 33 Luật Tố tụng hành chính. Không được mặc nhiên tiến hành song song hai quy trình giải quyết cùng yêu cầu khi chưa xử l
