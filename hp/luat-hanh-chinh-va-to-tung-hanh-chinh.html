ý việc lựa chọn theo luật."],"basis":"Khoản 1 Điều 3, Điều 30, Điều 33 Luật Tố tụng hành chính; Văn bản hợp nhất 13/VBHN-VPQH ngày 06/02/2026","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]}]},{"name":"Chương 5. Vi phạm pháp luật hành chính, trách nhiệm hành chính và các biện pháp cưỡng chế hành chính","items":[{"cid":"TH5.01","title":"Xử lý hành vi lấn chiếm vỉa hè và yêu cầu khôi phục hiện trạng","text":"Tháng 9/2026, ông P đặt quầy bán hàng lưu động trên phần vỉa hè dành cho người đi bộ tại phường N. Sau khi kiểm tra, người có thẩm quyền lập biên bản ghi nhận hành vi, chụp ảnh hiện trạng và giao biên bản cho ông P. Quyết định xử phạt sau đó áp dụng hình thức phạt tiền và yêu cầu ông P di chuyển quầy hàng, khôi phục lại tình trạng ban đầu. Ông P cho rằng yêu cầu khôi phục hiện trạng cũng là một hình thức phạt tiền khác nên cơ quan nhà nước không được áp dụng đồng thời.","ask":["Phân tích dấu hiệu pháp lý để xác định hành vi của ông P có thể là vi phạm hành chính.","Phân biệt hình thức xử phạt vi phạm hành chính với biện pháp khắc phục hậu quả trong tình huống.","Việc áp dụng đồng thời phạt tiền và buộc khôi phục tình trạng ban đầu có đương nhiên trái pháp luật không?"],"guide":["Cần xác định hành vi cụ thể, tính trái pháp luật, lỗi, chủ thể có năng lực trách nhiệm hành chính và quy định pháp luật chuyên ngành xác định hành vi đó là vi phạm hành chính. Chỉ từ dữ kiện “đặt quầy trên vỉa hè” chưa đủ để kết luận mức phạt hoặc thẩm quyền; phải đối chiếu quy định xử phạt trong lĩnh vực giao thông đường bộ/trật tự đô thị đang có hiệu lực tại thời điểm vi phạm.","Phạt tiền là một hình thức xử phạt chính theo Điều 21 Luật Xử lý vi phạm hành chính. Buộc khôi phục lại tình trạng ban đầu là biện pháp khắc phục hậu quả theo Điều 28, có mục đích khắc phục hậu quả do vi phạm gây ra, không phải một hình thức xử phạt.","Theo khoản 1 Điều 28, đối với một vi phạm hành chính, ngoài hình thức xử phạt, cá nhân hoặc tổ chức vi phạm có thể bị áp dụng một hoặc nhiều biện pháp khắc phục hậu quả. Vì vậy, việc áp dụng đồng thời phạt tiền và biện pháp khắc phục hậu quả không đương nhiên trái pháp luật; phải có căn cứ pháp luật, đúng thẩm quyền, trình tự và tương xứng với hậu quả cần khắc phục."],"basis":"Điều 2, Điều 3, Điều 21 và Điều 28 Luật Xử lý vi phạm hành chính (Văn bản hợp nhất 171/2026/VBHN-LQ-VPQH ngày 30/09/2026)","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]}]},{"name":"Chương 6. Kiểm soát quyền lực hành chính","items":[{"cid":"TH6.01","title":"Từ giám sát của HĐND đến thanh tra và khởi kiện quyết định cấp phép","text":"Năm 2026, qua giám sát chuyên đề, HĐND tỉnh R phát hiện Sở Xây dựng cấp nhiều giấy phép xây dựng sai quy hoạch. HĐND tỉnh chất vấn Giám đốc Sở và kiến nghị UBND tỉnh xử lý. Chủ tịch UBND tỉnh giao Thanh tra tỉnh thanh tra; kết luận thanh tra xác định 12 giấy phép trái quy định. Sau khi giấy phép của mình bị thu hồi, ông S cho rằng việc thu hồi là sai và muốn khởi kiện.","ask":["Xác định các phương thức kiểm soát quyền lực hành chính trong tình huống.","Phân biệt giám sát của HĐND với thanh tra của Thanh tra tỉnh.","Ông S có thể khởi kiện quyết định thu hồi giấy phép không, tại Tòa án nào?"],"guide":["Có giám sát (HĐND tỉnh), kiểm tra – thanh tra (Chủ tịch UBND tỉnh, Thanh tra tỉnh) và có thể có xét xử hành chính (nếu ông S khởi kiện).","HĐND giám sát, chất vấn, kiến nghị (Điều 113 Hiến pháp); Thanh tra tỉnh xem xét, kết luận, kiến nghị xử lý theo Luật Thanh tra 2025; thủ trưởng cơ quan quản lý tổ chức thực hiện kết luận.","Quyết định thu hồi giấy phép là quyết định hành chính cá biệt bị kiện; ông S có quyền khởi kiện trong 01 năm tại TAND khu vực có thẩm quyền theo Điều 31 Luật TTHC."],"basis":"Điều 113 Hiến pháp 2013; Luật Thanh tra 2025; Điều 31, Điều 116 Luật TTHC 2015","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]}]},{"name":"Chương 7. Khái quát chung về Luật Tố tụng hành chính","items":[{"cid":"TH7.01","title":"Đối thoại, tự định đoạt và nghĩa vụ cung cấp chứng cứ trong vụ án thu hồi đất","text":"Bà V khởi kiện quyết định thu hồi đất của Chủ tịch UBND tỉnh G. Trong giai đoạn chuẩn bị xét xử, Tòa án nhiều lần yêu cầu UBND tỉnh cung cấp hồ sơ thu hồi đất nhưng không nhận được. Tại phiên đối thoại, đại diện UBND tỉnh đề nghị bà V rút đơn để “giải quyết nội bộ”, kèm lời đe dọa không xem xét hỗ trợ tái định cư. Bà V vẫn giữ yêu cầu và muốn bổ sung yêu cầu bồi thường thiệt hại.","ask":["Nêu các nguyên tắc của tố tụng hành chính có liên quan.","Đánh giá hành vi của UBND tỉnh tại phiên đối thoại và việc không cung cấp hồ sơ.","Bà V có được bổ sung yêu cầu bồi thường không?"],"guide":["Liên quan: nguyên tắc đối thoại (Điều 20, Điều 134), quyền tự định đoạt (Điều 8), nghĩa vụ cung cấp chứng cứ (Điều 9, Điều 10), bình đẳng (Điều 17), giải quyết bồi thường (Điều 7).","Đối thoại phải tự nguyện, không ép buộc; lời đe dọa vi phạm Điều 134; việc không cung cấp hồ sơ vi phạm nghĩa vụ cung cấp tài liệu, có thể bị xử lý.","Người khởi kiện có quyền bổ sung yêu cầu trong phạm vi luật định và yêu cầu bồi thường được giải quyết trong vụ án hành chính."],"basis":"Điều 7 – Điều 10, Điều 17, Điều 20, Điều 134 Luật TTHC 2015","mcq":["TH7.01.1","TH7.01.2","TH7.01.3","TH7.01.4"]}]},{"name":"Chương 8. Thẩm quyền xét xử hành chính của Tòa án nhân dân","items":[{"cid":"TH8.01","title":"Xác định đối tượng khởi kiện và Tòa án có thẩm quyền sau ngày 01/7/2025","text":"Ông Y cư trú tại phường A, tỉnh B. Tháng 9/2026, ông nhận được ba văn bản: (1) Quyết định của Chủ tịch UBND phường A xử phạt ông 3 triệu đồng; (2) Công văn của Sở Tài chính tỉnh C từ chối cấp lại giấy chứng nhận đăng ký hộ kinh doanh của ông tại tỉnh C; (3) Quyết định của Giám đốc Sở Nội vụ tỉnh B điều động một công chức trong Sở. Ông Y muốn khởi kiện cả ba văn bản.","ask":["Văn bản nào là đối tượng khởi kiện vụ án hành chính?","Xác định Tòa án có thẩm quyền đối với từng văn bản có thể khởi kiện.","Văn bản (3) có thể khởi kiện không?"],"guide":["Văn bản (1) và (2) là quyết định hành chính cá biệt, tác động trực tiếp quyền, lợi ích của ông Y; công văn từ chối vẫn là quyết định hành chính theo nội dung.","(1): TAND khu vực có phạm vi bao gồm phường A (khoản 1 Điều 31). (2): ông Y không cùng tỉnh với Sở Tài chính tỉnh C nên TAND khu vực nơi quyết định làm phát sinh, hạn chế quyền (tỉnh C) có thẩm quyền (điểm b khoản 2 Điều 31).","Văn bản (3) là quyết định mang tính nội bộ của cơ quan và không tác động đến quyền của ông Y nên không phải đối tượng khởi kiện (điểm c khoản 1 Điều 30); ông Y cũng không có quyền khởi kiện."],"basis":"Điều 3, Điều 30, Điều 31 Luật TTHC 2015; Nghị quyết số 05/2025/NQ-HĐTP","mcq":["TH8.01.1","TH8.01.2","TH8.01.3","TH8.01.4"]}]},{"name":"Chương 9. Chủ thể tiến hành tố tụng và chủ thể tham gia tố tụng hành chính","items":[{"cid":"TH9.01","title":"Khởi kiện quyết định hành chính của Chủ tịch UBND cấp xã","text":"Tháng 10/2026, Chủ tịch UBND xã A ban hành quyết định hành chính áp dụng đối với ông Q, yêu cầu ông Q chấm dứt việc sử dụng một phần lối đi chung. Ông Q cho rằng quyết định xâm phạm trực tiếp quyền, lợi ích hợp pháp của mình và chuẩn bị khởi kiện. Ông Q cư trú trong cùng tỉnh với xã A. Trong quá trình giải quyết, người hàng xóm có quyền sử dụng lối đi liên quan trực tiếp đến kết quả vụ án và đề nghị được tham gia tố tụng.","ask":["Trong vụ án dự kiến, ai là người khởi kiện và ai là người bị kiện?","Người hàng xóm có thể tham gia tố tụng với tư cách nào nếu quyền, nghĩa vụ của họ bị ảnh hưởng bởi kết quả giải quyết vụ án?","Tòa án nào có thẩm quyền sơ thẩm đối với khiếu kiện quyết định hành chính của Chủ tịch UBND cấp xã?","Nếu bản án sơ thẩm của Tòa án nhân dân khu vực bị kháng cáo hoặc kháng nghị thì Tòa án nào giải quyết theo thủ tục phúc thẩm?"],"guide":["Ông Q là người khởi kiện vì cho rằng quyền, lợi ích hợp pháp của mình bị quyết định hành chính xâm phạm và yêu cầu Tòa án bảo vệ. Người bị kiện là Chủ tịch UBND xã A – người ban hành quyết định bị khởi kiện; khi xác định chính xác tư cách tố tụng cần ghi đúng chủ thể ban hành quyết định theo hồ sơ vụ việc.","Người hàng xóm có quyền, nghĩa vụ liên quan đến vụ án có thể tham gia với tư cách người có quyền lợi, nghĩa vụ liên quan nếu việc giải quyết vụ án có liên quan đến quyền, nghĩa vụ của họ theo Luật Tố tụng hành chính.","Theo khoản 1 Điều 31 Luật Tố tụng hành chính đã được sửa đổi, bổ sung, Tòa án nhân dân khu vực có thẩm quyền sơ thẩm đối với khiếu kiện quyết định hành chính, hành vi hành chính của cơ quan nhà nước cấp xã hoặc người có thẩm quyền trong cơ quan nhà nước cấp xã thuộc phạm vi lãnh thổ của Tòa án đó. Cần xác định đúng Tòa án nhân dân khu vực có phạm vi thẩm quyền theo lãnh thổ bao gồm xã A.","Theo Điều 32, Tòa án cấp tỉnh có thẩm quyền giải quyết theo thủ tục phúc thẩm đối với bản án, quyết định chưa có hiệu lực pháp luật của Tòa án nhân dân khu vực bị kháng cáo, kháng nghị."],"basis":"Điều 3, Điều 31, Điều 32, các quy định về đương sự và người có quyền lợi, nghĩa vụ liên quan của Luật Tố tụng hành chính; Văn bản hợp nhất 13/VBHN-VPQH ngày 06/02/2026","mcq":["TH9.01.1","TH9.01.2","TH9.01.3","TH9.01.4"]}]},{"name":"Chương 10. Thủ tục xét xử vụ án hành chính","items":[{"cid":"TH10.01","title":"Thời hiệu khởi kiện, đối thoại và phúc thẩm vụ án cưỡng chế phá dỡ","text":"Ngày 20/02/2026, bà X nhận quyết định cưỡng chế phá dỡ công trình của Chủ tịch UBND xã Đ. Bà X khiếu nại lần đầu ngày 01/3/2026; ngày 15/4/2026 bà nhận quyết định giải quyết khiếu nại giữ nguyên quyết định. Ngày 10/3/2027 bà X nộp đơn khởi kiện. Tòa án thụ lý, tổ chức đối thoại không thành và xét xử sơ thẩm ngày 05/10/2027, bác yêu cầu khởi kiện. Bà X muốn kháng cáo.","ask":["Đơn khởi kiện của bà X còn thời hiệu không?","Nêu thời hạn chuẩn bị xét xử áp dụng cho vụ án.","Xác định thời hạn kháng cáo và Tòa án xét xử phúc thẩm."],"guide":["Bà X đã khiếu nại, thời hiệu khởi kiện là 01 năm kể từ ngày nhận quyết định giải quyết khiếu nại (15/4/2026), nên ngày 10/3/2027 còn thời hiệu (khoản 3 Điều 116).","Thời hạn chuẩn bị xét xử 04 tháng kể từ ngày thụ lý, có thể gia hạn không quá 02 tháng (Điều 130).","Bà X có 15 ngày kể từ ngày tuyên án (05/10/2027) để kháng cáo; TAND cấp tỉnh (Tòa Hành chính) xét xử phúc thẩm (Điều 206, Điều 32a)."],"basis":"Điều 116, Điều 130, Điều 206, Điều 32a Luật TTHC 2015","mcq":["TH10.01.1","TH10.01.2","TH10.01.3","TH10.01.4"]}]}],"vb":[{"name":"I. Văn bản về tổ chức bộ máy, công vụ và quản lý hành chính","rows":[{"t":"Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam năm 2013 (được sửa đổi, bổ sung theo Nghị quyết 203/2025/QH15)","d":"2013; sửa đổi năm 2025","org":"Quốc hội","note":"Nền tảng hiến định về quyền lực nhà nước, Chính phủ, chính quyền địa phương và quyền con người, quyền công dân.","url":"https://vanban.chinhphu.vn/?docid=213545&pageid=27160"},{"t":"Luật Tổ chức Chính phủ số 63/2025/QH15","d":"18/02/2025; hiệu lực 01/03/2025","org":"Quốc hội","note":"Tổ chức, nhiệm vụ, quyền hạn và nguyên tắc hoạt động của Chính phủ.","url":"https://vanban.chinhphu.vn/?classid=1&docid=212985&orggroupid=1&pageid=27160"},{"t":"Luật Tổ chức chính quyền địa phương số 72/2025/QH15","d":"16/06/2025; hiệu lực 16/06/2025","org":"Quốc hội","note":"Tổ chức đơn vị hành chính và chính quyền địa phương; cần đặt trong bối cảnh mô hình chính quyền địa phương 2 cấp.","url":"https://vanban.chinhphu.vn/?docid=214553&pageid=27160"},{"t":"Luật Ban hành văn bản quy phạm pháp luật số 64/2025/QH15 và Luật số 87/2025/QH15 sửa đổi, bổ sung","d":"19/02/2025; sửa đổi 25/06/2025","org":"Quốc hội","note":"Cơ sở về hệ thống, thẩm quyền, trình tự ban hành văn bản quy phạm pháp luật; xem bản hợp nhất 54/VBHN-VPQH.","url":"https://vbpl.vn/botuphap/Pages/vbpq-thuoctinh-hopnhat.aspx?ItemID=180419&View=0"},{"t":"Văn bản hợp nhất số 27/VBHN-VPQH về Luật Tổ chức Chính phủ","d":"13/03/2026","org":"Văn phòng Quốc hội","note":"Bản hợp nhất để tra cứu luật tổ chức Chính phủ.","url":"https://vanban.chinhphu.vn/?classid=2629&docid=217245&pageid=27160"},{"t":"Luật Cán bộ, công chức số 80/2025/QH15","d":"24/6/2025; hiệu lực 01/7/2025","org":"Quốc hội","note":"Thay thế Luật CBCC 2008; định  chính Việt Nam","d":"2021","org":"Trường Đại học Luật Hà Nội","note":"Tài liệu tham khảo theo đề cương nguồn."},{"t":"Giáo trình Luật Tố tụng hành chính Việt Nam","d":"2019","org":"Đại học Quốc gia Hà Nội","note":"Tài liệu tham khảo theo đề cương nguồn."}]},{"name":"III. Văn bản về xử lý vi phạm hành chính và tố tụng hành chính","rows":[{"t":"Luật Tố tụng hành chính số 93/2015/QH13 (Văn bản hợp nhất số 109/VBHN-VPQH ngày 27/8/2025)","d":"25/11/2015; hợp nhất 27/8/2025","org":"Quốc hội / Văn phòng Quốc hội","note":"Bản hợp nhất có các sửa đổi của Luật số 85/2025/QH15: TAND khu vực sơ thẩm, TAND cấp tỉnh phúc thẩm (Chương 7–10).","url":"https://datafiles.chinhphu.vn/cpp/files/vbpq/2025/9/109-vbhn-vpqh.pdf"},{"t":"Luật số 85/2025/QH15 sửa đổi, bổ sung một số luật về tố tụng","d":"25/06/2025; hiệu lực 01/07/2025","org":"Quốc hội","note":"Có sửa đổi, bổ sung Luật Tố tụng hành chính.","url":"https://vanban.chinhphu.vn/?docid=214582&pageid=27160"},{"t":"Luật Xử lý vi phạm hành chính (Văn bản hợp nhất số 171/2026/VBHN-LQ-VPQH)","d":"30/09/2026","org":"Văn phòng Quốc hội","note":"Dùng bản hợp nhất mới hơn để nghiên cứu xử lý vi phạm hành chính; cần tiếp tục rà soát văn bản hướng dẫn.","url":"https://vanban.chinhphu.vn/?docid=219887&pageid=27160"},{"t":"Văn bản hợp nhất số 02/2026/VBHN-NĐ-BTP về thẩm quyền xử phạt vi phạm hành chính","d":"21/08/2026","org":"Bộ Tư pháp","note":"Văn bản hợp nhất quy định chi tiết Luật Xử lý vi phạm hành chính về thẩm quyền xử phạt; phải đối chiếu đúng lĩnh vực, chức danh và phạm vi địa bàn.","url":"https://vanban.chinhphu.vn/?docid=219251&pageid=27160"},{"t":"Văn bản hợp nhất số 13/VBHN-VPQH hợp nhất Luật Tố tụng hành chính","d":"06/02/2026","org":"Văn phòng Quốc hội","note":"Văn bản hợp nhất cập nhật dùng cho toàn bộ phần Tố tụng hành chính; thay thế việc viện dẫn bản hợp nhất 109/VBHN-VPQH năm 2025 trong tài liệu cũ.","url":"https://congbao.chinhphu.vn/van-ban/van-ban-hop-nhat-so-13-vbhn-vpqh-468957.htm"},{"t":"Văn bản hợp nhất số 82/VBHN-VPQH hợp nhất Luật Tổ chức Tòa án nhân dân","d":"26/03/2026","org":"Văn phòng Quốc hội","note":"Cơ sở cập nhật về tổ chức Tòa án nhân dân và Tòa án nhân dân khu vực.","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Van-ban-hop-nhat-82-VBHN-VPQH-2026-Luat-To-chuc-Toa-an-nhan-dan-699438.aspx"},{"t":"Nghị quyết số 05/2025/NQ-HĐTP hướng dẫn áp dụng một số quy định về thẩm quyền của Tòa án tại Điều 30 và Điều 31 Luật Tố tụng hành chính","d":"30/09/2025; hiệu lực 15/11/2025","org":"Hội đồng Thẩm phán TAND tối cao","note":"Hướng dẫn xác định thẩm quyền xét xử hành chính trong bối cảnh tổ chức Tòa án nhân dân khu vực.","url":"https://vbpl.moj.gov.vn/Toaannhandantoicao/Pages/vbpq-toanvan.aspx?ItemID=184008&dvid=331"},{"t":"Luật số 88/2025/QH15 sửa đổi, bổ sung một số điều của Luật Xử lý vi phạm hành chính","d":"25/06/2025; hiệu lực 01/07/2025","org":"Quốc hội","note":"Luật sửa đổi trực tiếp Luật Xử lý vi phạm hành chính; đọc cùng Văn bản hợp nhất 171/2026/VBHN-LQ-VPQH.","url":"https://chinhphu.vn/?classid=1&docid=214591&orggroupid=1&pageid=27160"},{"t":"Thông tư liên tịch số 08/2026/TTLT-VKSNDTC-TANDTC về phối hợp giữa Viện kiểm sát nhân dân và Tòa án nhân dân trong thi hành một số quy định của Luật Tố tụng hành chính","d":"10/03/2026; hiệu lực 01/05/2026","org":"VKSND tối cao, TAND tối cao","note":"Văn bản hướng dẫn phối hợp tố tụng; cần đọc cùng Luật Tố tụng hành chính hợp nhất.","url":"https://vanban.chinhphu.vn/?classid=1&docid=217243&pageid=27160"}]}],"al":[],"ly":{"root":"Luật Hành chính và Luật Tố tụng hành chính","ch":[{"t":"Chương 1. Khái quát chung về Luật Hành chính","cs":"Hiến pháp 2013 (sửa đổi, bổ sung năm 2025); Luật TCCP 2025; Luật TCCQĐP 2025","b":["Luật Hành chính là ngành luật điều chỉnh các quan hệ xã hội phát sinh trong quá trình tổ chức và thực hiện hoạt động quản lý hành chính nhà nước.","Chương này làm rõ quản lý hành chính nhà nước trong bối cảnh quản trị quốc gia hiện đại, đối tượng và phương pháp điều chỉnh của Luật Hành chính."],"c":[{"t":"Một số vấn đề cơ bản về quản lý hành chính nhà nước đáp ứng yêu cầu quản trị quốc gia hiện đại, hiệu quả","cs":"Điều 94, Điều 95, Điều 114 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","b":["Quản lý hành chính nhà nước là hoạt động chấp hành và điều hành, do hệ thống hành chính nhà nước đứng đầu là Chính phủ thực hiện."],"c":[{"t":"Một số khái niệm","c":[{"t":"Quản lý, quản lý nhà nước, quản lý hành chính nhà nước","cs":"Khoản 1 Điều 2 Hiến pháp 2013; Điều 94 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","b":["Quản lý: sự tác động có tổ chức, có định hướng của chủ thể quản lý lên đối tượng quản lý nhằm đạt mục tiêu đã đặt ra.","Quản lý nhà nước: hoạt động mang tính quyền lực nhà nước của các cơ quan lập pháp, hành pháp, tư pháp nhằm tổ chức và điều chỉnh các quá trình xã hội.","Quản lý hành chính nhà nước: quản lý nhà nước theo nghĩa hẹp, gắn với quyền hành pháp, mang tính chấp hành và điều hành.","Đặc điểm: tính quyền lực nhà nước, tính chấp hành – điều hành, tính thường xuyên, liên tục, tính chủ động sáng tạo."]},{"t":"Quản trị, quản trị quốc gia","b":["Quản trị: cách thức tổ chức, phối hợp nguồn lực để đạt mục tiêu với hiệu quả cao, nhấn mạnh sự tham gia và trách nhiệm giải trình.","Quản trị quốc gia: tổng thể thể chế, quy trình mà Nhà nước cùng thị trường và xã hội cùng tham gia điều hành sự phát triển đất nước.","Khác biệt: quản lý nhấn mạnh mệnh lệnh của Nhà nước; quản trị nhấn mạnh đa chủ thể, minh bạch, trách nhiệm giải trình, pháp quyền và lấy người dân làm trung tâm."]}]},{"t":"Quản lý hành chính nhà nước theo tiêu chí hiện đại, hiệu quả đáp ứng yêu cầu quản trị quốc gia","b":["Hướng tới nền hành chính phục vụ, chuyên nghiệp, minh bạch, hiệu lực, hiệu quả, vận hành trên nền tảng số."],"c":[{"t":"Xây dựng Chính phủ điện tử/số","cs":"Luật Giao dịch điện tử 2023; Luật Chuyển đổi số 2025; NĐ 118/2025/NĐ-CP","b":["Cung cấp dịch vụ công trực tuyến, kết nối dữ liệu dùng chung, Cổng Dịch vụ công quốc gia.","Ra quyết định dựa trên dữ liệu; giảm giấy tờ, giảm tiếp xúc trực tiếp, hạn chế nhũng nhiễu."]},{"t":"Đổi mới thể chế và pháp luật minh bạch","cs":"Luật Ban hành VBQPPL 2025","b":["Hệ thống pháp luật thống nhất, công khai, dễ tiếp cận, dự báo được.","Luật chỉ quy định khung những vấn đề thuộc thẩm quyền Quốc hội; tăng phân cấp, phân quyền gắn với kiểm soát quyền lực."]},{"t":"Tinh gọn bộ máy","cs":"Luật TCCP 2025; Luật TCCQĐP 2025","b":["Sắp xếp bộ, cơ quan ngang bộ; tổ chức chính quyền địa phương hai cấp (tỉnh, xã) từ ngày 01/7/2025.","Một cơ quan thực hiện nhiều việc, một việc chỉ giao một cơ quan chủ trì; giảm tầng nấc trung gian."]},{"t":"Nâng cao chất lượng đội ngũ cán bộ, công chức","cs":"Luật CBCC 2025","b":["Quản lý theo vị trí việc làm; đánh giá theo kết quả, sản phẩm cụ thể; thu hút, trọng dụng người có tài năng.","Đào thải người không hoàn thành nhiệm vụ."]},{"t":"Chuyển đổi từ tư duy “quản lý” sang “phục vụ, kiến tạo phát triển”","b":["Lấy người dân, doanh nghiệp làm trung tâm; sự hài lòng của người dân là thước đo chất lượng phục vụ.","Nhà nước tạo môi trường thuận lợi, khơi thông nguồn lực thay vì chỉ cấp phép, kiểm soát."]}]}]},{"t":"Đối tượng điều chỉnh của Luật Hành chính","c":[{"t":"Khái niệm","b":["Là những quan hệ xã hội phát sinh trong quá trình tổ chức và thực hiện hoạt động chấp hành – điều hành của Nhà nước (quan hệ quản lý hành chính).","Một bên chủ thể luôn được sử dụng quyền lực nhà nước; quan hệ phát sinh do yêu cầu của chủ thể quản lý hoặc đề nghị của đối tượng quản lý."]},{"t":"Nội dung","b":["Nhóm 1: quan hệ do cơ quan hành chính nhà nước thực hiện hoạt động chấp hành – điều hành (cấp trên – cấp dưới; thẩm quyền chung – chuyên môn; với tổ chức, cá nhân).","Nhóm 2: quan hệ quản lý hành chính trong nội bộ các cơ quan nhà nước khác (Quốc hội, Tòa án, Viện kiểm sát) nhằm ổn định tổ chức bộ máy.","Nhóm 3: quan hệ do tổ chức, cá nhân được nhà nước trao quyền quản lý hành chính thực hiện."]}]},{"t":"Phương pháp điều chỉnh của Luật Hành chính","c":[{"t":"Khái niệm","b":["Là cách thức Nhà nước tác động lên các quan hệ quản lý hành chính thông qua quy phạm pháp luật hành chính.","Xuất phát từ sự bất bình đẳng về ý chí giữa các bên: một bên có quyền nhân danh Nhà nước ra mệnh lệnh."]},{"t":"Nội dung","b":["Phương pháp mệnh lệnh – phục tùng (quyền uy): phương pháp chủ yếu, chủ thể quản lý đơn phương ra quyết định, có quyền kiểm tra, cưỡng chế thực hiện.","Phương pháp thỏa thuận: bổ sung, áp dụng trong ban hành văn bản liên tịch, hợp đồng hành chính, đặt hàng dịch vụ công.","Biểu hiện: đặt nghĩa vụ, cấm đoán, cho phép, trao quyền; bảo đảm bằng cưỡng chế nhà nước."]}]}]},{"t":"Chương 2. Chủ thể quản lý hành chính nhà nước","cs":"Hiến pháp 2013 (sửa đổi, bổ sung năm 2025); Luật TCCP 2025; Luật TCCQĐP 2025; Luật CBCC 2025; Luật Viên chức 2025","b":["Chủ thể quản lý hành chính nhà nước gồm cơ quan hành chính nhà nước, cán bộ, công chức, viên chức và tổ chức, cá nhân được trao quyền."],"c":[{"t":"Cơ quan hành chính nhà nước","cs":"Điều 94, Điều 95, Điều 114 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","b":["Là bộ phận cấu thành bộ máy nhà nước, thực hiện quyền hành pháp và hoạt động chấp hành – điều hành."],"c":[{"t":"Khái niệm, đặc điểm và vai trò của cơ quan hành chính nhà nước","b":["Khái niệm: cơ quan nhà nước được thành lập theo Hiến pháp và luật, có thẩm quyền quản lý hành chính trên các lĩnh vực đời sống xã hội.","Đặc điểm: hoạt động thường xuyên, liên tục; hệ thống thống nhất từ trung ương đến cơ sở; trực thuộc, chịu trách nhiệm trước cơ quan quyền lực cùng cấp; đội ngũ chủ yếu là công chức.","Vai trò: tổ chức thi hành Hiến pháp, luật; ban hành văn bản và quyết định hành chính; cung ứng dịch vụ công; bảo vệ quyền, lợi ích của cá nhân, tổ chức."]},{"t":"Các cơ quan hành chính theo quy định hiện hành","cs":"Điều 94 Hiến pháp 2013; Luật TCCP 2025; Luật TCCQĐP 2025","b":["Ở trung ương: Chính phủ là cơ quan hành chính nhà nước cao nhất; bộ, cơ quan ngang bộ quản lý ngành, lĩnh vực.","Ở địa phương: Ủy ban nhân dân cấp tỉnh và Ủy ban nhân dân cấp xã (xã, phường, đặc khu) theo mô hình chính quyền địa phương hai cấp.","Cơ quan chuyên môn thuộc UBND: sở và tương đương ở cấp tỉnh; phòng chuyên môn ở cấp xã.","Phân loại theo thẩm quyền: thẩm quyền chung (Chính phủ, UBND) và thẩm quyền chuyên môn (bộ, sở, phòng).","Phân loại theo phương thức lãnh đạo: chế độ tập thể kết hợp chế độ thủ trưởng (Chính phủ, UBND) và chế độ thủ trưởng (bộ, sở)."]}]},{"t":"Cán bộ, công chức","cs":"Luật CBCC 2025 (số 80/2025/QH15, hiệu lực 01/7/2025)","c":[{"t":"Khái niệm, đặc điểm và vai trò của cán bộ, công chức","cs":"Điều 1 Luật CBCC 2025","b":["Cán bộ: công dân Việt Nam được bầu cử, phê chuẩn, bổ nhiệm, chỉ định giữ chức vụ, chức danh theo nhiệm kỳ ở trung ương, cấp tỉnh, cấp xã, trong biên chế, hưởng lương từ ngân sách nhà nước.","Công chức: công dân Việt Nam được tuyển dụng vào vị trí việc làm trong cơ quan của Đảng, Nhà nước, Mặt trận Tổ quốc, tổ chức chính trị – xã hội, trong biên chế, hưởng lương từ ngân sách nhà nước.","Điểm mới: không còn nhóm cán bộ, công chức cấp xã riêng; không còn công chức trong bộ máy lãnh đạo đơn vị sự nghiệp công lập.","Vai trò: trực tiếp thực thi công vụ, là chủ thể chủ yếu của hoạt động quản lý hành chính."]},{"t":"Nội dung quản lý, sử dụng cán bộ, công chức","cs":"Điều 18 – Điều 32, Điều 40 Luật CBCC 2025","b":["Tuyển dụng: thi tuyển hoặc xét tuyển vào vị trí việc làm; tiếp nhận chuyên gia, người có kinh nghiệm (Điều 20).","Vị trí việc làm: lãnh đạo, quản lý; chuyên môn, nghiệp vụ; hỗ trợ, phục vụ (khoản 3 Điều 23).","Ngạch: chuyên gia cao cấp, chuyên viên cao cấp, chuyên viên chính, chuyên viên, cán sự, nhân viên (Điều 24).","Đánh giá, xếp loại hằng năm 4 mức: hoàn thành xuất sắc, hoàn thành tốt, hoàn thành, không hoàn thành nhiệm vụ (Điều 26).","Điều động, luân chuyển, biệt phái; bổ nhiệm, từ chức, miễn nhiệm; thôi việc, nghỉ hưu."]},{"t":"Trách nhiệm pháp lý của cán bộ, công chức","cs":"Điều 35 – Điều 39 Luật CBCC 2025; Luật Trách nhiệm bồi thường của Nhà nước 2017","b":["Trách nhiệm kỷ luật đối với cán bộ: khiển trách, cảnh cáo, cách chức, bãi nhiệm (Điều 35).","Trách nhiệm kỷ luật đối với công chức: khiển trách, cảnh cáo, cách chức (lãnh đạo, quản lý), buộc thôi việc (Điều 36).","Thời hiệu kỷ luật: 05 năm với vi phạm đến mức khiển trách, 10 năm với vi phạm khác; có trường hợp không áp dụng thời hiệu (Điều 37).","Trách nhiệm vật chất (hoàn trả cho ngân sách khi Nhà nước đã bồi thường), trách nhiệm hình sự khi hành vi cấu thành tội phạm."]}]},{"t":"Viên chức","cs":"Luật Viên chức 2025 (số 129/2025/QH15, hiệu lực 01/7/2026)","c":[{"t":"Khái niệm, đặc điểm và vai trò của viên chức","b":["Viên chức: công dân Việt Nam được tuyển dụng theo vị trí việc làm, làm việc tại đơn vị sự nghiệp công lập theo chế độ hợp đồng làm việc, hưởng lương từ quỹ lương của đơn vị.","Đặc điểm: hoạt động nghề nghiệp (giáo dục, y tế, khoa học…), không trực tiếp thực thi quyền lực công; quan hệ dựa trên hợp đồng làm việc.","Vai trò: cung ứng dịch vụ sự nghiệp công thiết yếu cho xã hội."]},{"t":"Nội dung quản lý, sử dụng viên chức","b":["Tuyển dụng theo vị trí việc làm; ký hợp đồng làm việc; bố trí, phân công, thay đổi chức danh nghề nghiệp.","Đánh giá theo kết quả thực hiện công việc; đào tạo, bồi dưỡng; khen thưởng.","Đơn vị sự nghiệp công lập thực hiện quản lý theo phân cấp; cơ quan có thẩm quyền quản lý nhà nước về viên chức."]},{"t":"Trách nhiệm pháp lý của viên chức","cs":"Điều 36 Luật Viên chức 2025; NĐ 234/2026/NĐ-CP","b":["Kỷ luật: khiển trách, cảnh cáo, cách chức (viên chức quản lý), buộc thôi việc.","Thời hiệu kỷ luật: 05 năm với vi phạm đến mức khiển trách, 10 năm với vi phạm khác.","Trách nhiệm bồi thường, hoàn trả khi gây thiệt hại; trách nhiệm hình sự khi phạm tội."]}]},{"t":"Tổ chức xã hội và cá nhân","cs":"Điều 9, Điều 28, Điều 30 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","c":[{"t":"Tổ chức xã hội","b":["Gồm Mặt trận Tổ quốc Việt Nam, tổ chức chính trị – xã hội, tổ chức xã hội – nghề nghiệp, hội.","Tham gia quản lý khi được Nhà nước trao quyền; giám sát, phản biện xã hội."]},{"t":"Cá nhân","b":["Công dân, người nước ngoài, người không quốc tịch với năng lực pháp luật hành chính và năng lực hành vi hành chính.","Quyền tham gia quản lý nhà nước, quyền khiếu nại, tố cáo, quyền tiếp cận thông tin."]},{"t":"Vai trò của tổ chức xã hội và cá nhân trong quản lý hành chính nhà nước","b":["Vừa là đối tượng quản lý vừa có thể là chủ thể được trao quyền.","Kênh giám sát, phản biện, góp phần kiểm soát quyền lực hành chính và nâng cao chất lượng phục vụ."]}]}]},{"t":"Chương 3. Điều chỉnh pháp luật hành chính về cung ứng dịch vụ công","cs":"Luật Viên chức 2025; NĐ 118/2025/NĐ-CP; pháp luật về đơn vị sự nghiệp công lập và giao nhiệm vụ, đặt hàng, đấu thầu dịch vụ công","b":["Dịch vụ công là phương diện “phục vụ” của hành chính nhà nước, cần pháp luật hành chính bảo đảm chất lượng, công bằng, khả năng tiếp cận."],"c":[{"t":"Một số vấn đề cơ bản điều chỉnh pháp luật hành chính về cung ứng dịch vụ công","c":[{"t":"Khái niệm, đặc điểm dịch vụ công","b":["Khái niệm: những hoạt động phục vụ nhu cầu thiết yếu, lợi ích chung của xã hội, do Nhà nước trực tiếp cung ứng hoặc chịu trách nhiệm bảo đảm cung ứng.","Đặc điểm: phục vụ lợi ích công; Nhà nước chịu trách nhiệm cuối cùng; không nhằm mục tiêu lợi nhuận là chính; người dân được tiếp cận bình đẳng.","Dịch vụ hành chính công: gắn với thẩm quyền của cơ quan nhà nước như cấp phép, đăng ký, chứng thực, hộ tịch.","Dịch vụ sự nghiệp công: giáo dục, y tế, văn hóa, khoa học do đơn vị sự nghiệp công lập chủ yếu cung ứng.","Dịch vụ công ích: vệ sinh môi trường, cấp thoát nước, chiếu sáng, giao thông công cộng."]},{"t":"Khái niệm, đặc điểm điều chỉnh pháp luật hành chính về cung ứng dịch vụ công","b":["Là việc Nhà nước dùng quy phạm pháp luật hành chính xác định chủ thể, tiêu chuẩn, trình tự, giá, phí và cơ chế giám sát dịch vụ công.","Đặc điểm: kết hợp phương pháp mệnh lệnh (tiêu chuẩn, điều kiện, thanh tra) và thỏa thuận (đặt hàng, hợp đồng).","Lý do: thị trường không tự bảo đảm công bằng, phổ cập; Nhà nước phải bảo đảm quyền con người về giáo dục, y tế, an sinh."]}]},{"t":"Chủ thể và yêu cầu của pháp luật hành chính trong cung ứng dịch vụ công","c":[{"t":"Chủ thể cung ứng dịch vụ công","cs":"Luật Viên chức 2025; NĐ 118/2025/NĐ-CP","b":["Cơ quan hành chính nhà nước: trực tiếp cung ứng dịch vụ hành chính công qua Bộ phận Một cửa, Cổng Dịch vụ công quốc gia.","Đơn vị sự nghiệp công lập: cung ứng dịch vụ sự nghiệp công, có mức tự chủ khác nhau về tài chính, tổ chức.","Doanh nghiệp, tổ chức ngoài công lập: tham gia theo xã hội hóa, nhận đặt hàng, đấu thầu; Nhà nước giữ vai trò quản lý, giám sát."]},{"t":"Yêu cầu của pháp luật hành chính trong cung ứng dịch vụ công","b":["Công khai, minh bạch về điều kiện, quy trình, giá, phí, thời hạn.","Bình đẳng trong tiếp cận; ưu tiên đối tượng chính sách, vùng khó khăn.","Chất lượng theo tiêu chuẩn, định mức kinh tế – kỹ thuật; đánh giá sự hài lòng của người dân.","Trách nhiệm giải trình và cơ chế khiếu nại, bồi thường khi dịch vụ gây thiệt hại."]}]},{"t":"Hình thức và nội dung quản lý nhà nước về cung ứng dịch vụ công","c":[{"t":"Hình thức cung ứng dịch vụ công","b":["Nhà nước trực tiếp cung ứng: cơ quan hành chính, đơn vị sự nghiệp công lập.","Giao nhiệm vụ: cho đơn vị sự nghiệp công lập trực thuộc theo dự toán ngân sách.","Đặt hàng: hợp đồng giữa cơ quan nhà nước với đơn vị cung ứng theo số lượng, chất lượng, giá.","Đấu thầu: lựa chọn nhà cung ứng cạnh tranh, áp dụng cho dịch vụ có nhiều chủ thể đủ điều kiện.","Xã hội hóa, hợp tác công – tư: khu vực tư nhân đầu tư, cung ứng dưới sự quản lý của Nhà nước."]},{"t":"Nội dung quản lý nhà nước về cung ứng dịch vụ công","b":["Ban hành chính sách, danh mục dịch vụ sử dụng ngân sách, tiêu chuẩn, định mức, giá.","Cấp phép, quy định điều kiện hoạt động của chủ thể cung ứng.","Phân bổ ngân sách, cơ chế tự chủ của đơn vị sự nghiệp công lập.","Thanh tra, kiểm tra, đánh giá chất lượng; xử lý vi phạm, giải quyết khiếu nại."]}]}]},{"t":"Chương 4. Quyết định hành chính và thủ tục hành chính","cs":"Luật TTHC 2015; Luật Khiếu nại 2011 (sửa đổi, bổ sung năm 2025); NĐ 63/2010/NĐ-CP; NĐ 118/2025/NĐ-CP","b":["Quyết định hành chính là hình thức pháp lý chủ yếu của quản lý hành chính; thủ tục hành chính là cách thức để quyết định đó được ban hành và thực hiện."],"c":[{"t":"Quyết định hành chính","c":[{"t":"Khái niệm và đặc điểm của quyết định hành chính","cs":"Khoản 1, khoản 2 Điều 3 Luật TTHC 2015","b":["Theo nghĩa rộng: kết quả thể hiện ý chí quyền lực đơn phương của chủ thể quản lý, gồm quyết định chủ đạo, quy phạm và cá biệt.","Theo Luật TTHC: văn bản do cơ quan hành chính nhà nước, cơ quan, tổ chức được giao quản lý hành chính hoặc người có thẩm quyền ban hành, quyết định về vấn đề cụ thể, áp dụng một lần đối với một hoặc một số đối tượng cụ thể.","Đặc điểm: tính quyền lực nhà nước, tính đơn phương, tính pháp lý (làm phát sinh, thay đổi, chấm dứt quan hệ pháp luật), tính dưới luật.","Nhận diện theo nội dung, không theo tên gọi: thông báo, kết luận, công văn vẫn có thể là quyết định hành chính."]},{"t":"Phân loại quyết định hành chính","c":[{"t":"Căn cứ theo tính chất pháp lý","b":["Quyết định chủ đạo: đề ra chủ trương, phương hướng, chương trình.","Quyết định quy phạm: đặt ra quy tắc xử sự chung, áp dụng nhiều lần (văn bản quy phạm pháp luật).","Quyết định cá biệt: áp dụng pháp luật cho trường hợp cụ thể, đối tượng cụ thể."]},{"t":"Căn cứ theo cơ quan ban hành","b":["Của Chính phủ, Thủ tướng Chính phủ; bộ trưởng, thủ trưởng cơ quan ngang bộ.","Của UBND, Chủ tịch UBND cấp tỉnh, cấp xã; thủ trưởng cơ quan chuyên môn."]},{"t":"Căn cứ theo trình tự ban hành","b":["Quyết định ban hành theo thủ tục thông thường, theo thủ tục rút gọn và trong tình huống khẩn cấp."]},{"t":"Căn cứ theo hình thức thể hiện","b":["Bằng văn bản (hình thức chủ yếu), bằng lời nói, bằng ký hiệu, tín hiệu (biển báo, còi, đèn tín hiệu)."]}]},{"t":"Các yêu cầu đối với quyết định hành chính","c":[{"t":"Tính hợp pháp","b":["Ban hành đúng thẩm quyền về nội dung, hình thức, thời gian, không gian.","Nội dung phù hợp Hiến pháp, luật và văn bản của cấp trên; đúng mục đích.","Đúng thủ tục, trình tự và thể thức, kỹ thuật trình bày."]},{"t":"Tính hợp lý","b":["Bảo đảm lợi ích chung kết hợp lợi ích của cá nhân, tổ chức; phù hợp thực tiễn, khả thi.","Cụ thể, dễ hiểu, kịp thời; ngôn ngữ chính xác, một nghĩa."]}]},{"t":"Khiếu nại, khởi kiện đối với quyết định hành chính","c":[{"t":"Khiếu nại","cs":"Điều 2, Điều 7, Điều 9 Luật Khiếu nại 2011 (sửa đổi, bổ sung năm 2025)","b":["Cá nhân, cơ quan, tổ chức đề nghị người có thẩm quyền xem xét lại quyết định hành chính, hành vi hành chính khi cho rằng trái pháp luật, xâm phạm quyền, lợi ích hợp pháp.","Trình tự: khiếu nại lần đầu đến người đã ra quyết định; không đồng ý hoặc quá hạn thì khiếu nại lần hai hoặc khởi kiện tại Tòa án.","Thời hiệu khiếu nại: 90 ngày kể từ ngày nhận được hoặc biết được quyết định, hành vi.","Từ 01/7/2026 dùng chủ thể “cá nhân” thay cho “công dân”, phù hợp Điều 30 Hiến pháp (Luật số 136/2025/QH15)."]},{"t":"Khởi kiện","cs":"Điều 115, Điều 116, Điều 33 Luật TTHC 2015","b":["Có quyền khởi kiện khi không đồng ý với quyết định, hoặc đã khiếu nại nhưng hết thời hạn không được giải quyết hay không đồng ý với kết quả giải quyết.","Thời hiệu khởi kiện: 01 năm kể từ ngày nhận được hoặc biết được quyết định hành chính, hành vi hành chính.","Vừa khiếu nại vừa khởi kiện: người khởi kiện phải lựa chọn một cơ quan giải quyết."]}]}]},{"t":"Thủ tục hành chính","cs":"NĐ 63/2010/NĐ-CP (đã sửa đổi, bổ sung); NĐ 118/2025/NĐ-CP","c":[{"t":"Khái niệm và đặc điểm của thủ tục hành chính","c":[{"t":"Khái niệm","cs":"Khoản 1 Điều 3 NĐ 63/2010/NĐ-CP","b":["Là trình tự, cách thức thực hiện, hồ sơ và yêu cầu, điều kiện do cơ quan nhà nước, người có thẩm quyền quy định để giải quyết một công việc cụ thể liên quan đến cá nhân, tổ chức.","Bộ phận tạo thành: tên thủ tục, trình tự, cách thức, hồ sơ, thời hạn, đối tượng, cơ quan giải quyết, kết quả, phí, lệ phí, yêu cầu, điều kiện."]},{"t":"Đặc điểm","b":["Được điều chỉnh bởi quy phạm pháp luật hành chính, mang tính bắt buộc.","Là trình tự thực hiện thẩm quyền trong quản lý hành chính; rất đa dạng, phức tạp.","Năng động, thay đổi theo yêu cầu quản lý và cải cách hành chính."]}]},{"t":"Các nguyên tắc của thủ tục hành chính","c":[{"t":"Nguyên tắc pháp chế","b":["Thủ tục chỉ được quy định khi thật cần thiết, đúng thẩm quyền; cơ quan, người dân thực hiện đúng quy định, không tự đặt thêm giấy tờ."]},{"t":"Nguyên tắc khách quan","b":["Giải quyết dựa trên hồ sơ, chứng cứ, không vì động cơ cá nhân; người có liên quan được trình bày ý kiến."]},{"t":"Nguyên tắc công khai, minh bạch","b":["Thủ tục được công bố, niêm yết, đăng tải trên Cơ sở dữ liệu quốc gia và Cổng Dịch vụ công quốc gia."]},{"t":"Nguyên tắc bình đẳng trước pháp luật giữa các bên tham gia thủ tục hành chính","b":["Mọi cá nhân, tổ chức được đối xử như nhau; cơ quan nhà nước cũng chịu trách nhiệm về thời hạn, kết quả giải quyết."]},{"t":"Nguyên tắc đơn giản, tiết kiệm, nhanh chóng, kịp thời","b":["Cắt giảm thành phần hồ sơ, thời gian, chi phí tuân thủ; ưu tiên thực hiện trực tuyến, tái sử dụng dữ liệu đã có."]}]},{"t":"Các giai đoạn của thủ tục hành chính","c":[{"t":"Xây dựng thủ tục hành chính","b":["Đánh giá tác động thủ tục khi soạn thảo văn bản; lấy ý kiến, thẩm định; ban hành và công bố thủ tục."]},{"t":"Thực hiện thủ tục hành chính","cs":"NĐ 118/2025/NĐ-CP","b":["Khởi xướng (nộp hồ sơ trực tiếp, bưu chính, trực tuyến) → tiếp nhận, kiểm tra hồ sơ → xem xét, giải quyết → trả kết quả và đánh giá sự hài lòng.","Cơ chế một cửa, một cửa liên thông tại Bộ phận Một cửa các cấp và Cổng Dịch vụ công quốc gia."]}]},{"t":"Cải cách thủ tục hành chính","c":[{"t":"Yêu cầu","b":["Lấy người dân, doanh nghiệp làm trung tâm; giảm chi phí tuân thủ, chống nhũng nhiễu.","Gắn với chuyển đổi số, dữ liệu dân cư và chính quyền địa phương hai cấp."]},{"t":"Nội dung","b":["Rà soát, cắt giảm, đơn giản hóa thủ tục và điều kiện kinh doanh.","Thực hiện dịch vụ công trực tuyến toàn trình, không phụ thuộc địa giới hành chính.","Kiểm soát thủ tục hành chính, công khai kết quả giải quyết, đánh giá chất lượng phục vụ."]}]}]}]},{"t":"Chương 5. Vi phạm pháp luật hành chính, trách nhiệm hành chính và các biện pháp cưỡng chế hành chính","cs":"Luật XLVPHC 2012 (sửa đổi, bổ sung năm 2020, 2025; VBHN số 171/2026/VBHN-LQ-VPQH)","b":["Lưu ý: Quốc hội khóa XVI đang xem xét dự án Luật Xử lý vi phạm hành chính (sửa đổi) tại Kỳ họp thứ 2; nội dung chương sẽ cập nhật khi luật mới được thông qua."],"c":[{"t":"Vi phạm pháp luật hành chính","c":[{"t":"Khái niệm","cs":"Khoản 1 Điều 2 Luật XLVPHC 2012","b":["Là hành vi có lỗi do cá nhân, tổ chức thực hiện, vi phạm quy định của pháp luật về quản lý nhà nước mà không phải là tội phạm và theo quy định của pháp luật phải bị xử phạt vi phạm hành chính."]},{"t":"Đặc điểm","b":["Tính trái pháp luật hành chính: xâm phạm trật tự quản lý nhà nước.","Tính có lỗi: cố ý hoặc vô ý; với tổ chức, lỗi xác định qua hành vi của người đại diện, người được giao nhiệm vụ.","Mức độ nguy hiểm cho xã hội thấp hơn tội phạm.","Phải được pháp luật quy định là bị xử phạt."]},{"t":"Các yếu tố cấu thành","b":["Mặt khách quan: hành vi trái pháp luật (hành động hoặc không hành động), hậu quả, thời gian, địa điểm.","Mặt chủ quan: lỗi cố ý hoặc vô ý; động cơ, mục đích (nếu luật quy định).","Chủ thể: cá nhân từ đủ 14 tuổi trở lên (từ 14 đến dưới 16 tuổi chỉ bị xử phạt khi cố ý), có năng lực trách nhiệm hành chính; tổ chức.","Khách thể: trật tự quản lý hành chính nhà nước được pháp luật bảo vệ."]},{"t":"Phân biệt vi phạm pháp luật hành chính với vi phạm pháp luật hình sự","b":["Mức độ nguy hiểm: vi phạm hành chính thấp hơn; tội phạm nguy hiểm đáng kể cho xã hội.","Văn bản quy định: Luật XLVPHC và nghị định xử phạt; tội phạm chỉ được quy định trong Bộ luật Hình sự.","Chủ thể xử lý: người có thẩm quyền hành chính; tội phạm do Tòa án xét xử.","Hậu quả pháp lý: xử phạt hành chính; tội phạm chịu hình phạt và có án tích."]}]},{"t":"Trách nhiệm pháp lý hành chính","c":[{"t":"Khái niệm và đặc điểm","b":["Là hậu quả pháp lý bất lợi mà chủ thể vi phạm phải gánh chịu do người có thẩm quyền áp dụng.","Đặc điểm: cơ sở là vi phạm hành chính; do cơ quan hành chính, người có thẩm quyền áp dụng theo thủ tục hành chính; không để lại án tích."]},{"t":"Xử phạt vi phạm hành chính","cs":"Điều 3, Điều 6, Điều 21, Điều 73 Luật XLVPHC 2012","b":["Nguyên tắc: chỉ xử phạt khi có hành vi vi phạm do pháp luật quy định; một hành vi chỉ bị xử phạt một lần; người có thẩm quyền phải chứng minh vi phạm; mức phạt tiền đối với tổ chức bằng 02 lần cá nhân.","Hình thức chính: cảnh cáo, phạt tiền.","Hình thức chính hoặc bổ sung: tước quyền sử dụng giấy phép, chứng chỉ hành nghề hoặc đình chỉ hoạt động có thời hạn; tịch thu tang vật, phương tiện; trục xuất.","Thời hiệu xử phạt: 01 năm; 02 năm với một số lĩnh vực như kế toán, xây dựng, đất đai, môi trường, sở hữu trí tuệ; thuế theo luật quản lý thuế.","Thủ tục: xử phạt không lập biên bản (phạt tiền nhỏ, cảnh cáo) và có lập biên bản; cá nhân, tổ chức phải chấp hành trong 10 ngày kể từ ngày nhận quyết định."]},{"t":"Áp dụng các biện pháp xử lý hành chính","cs":"Điều 89 – Điều 95, Điều 105 Luật XLVPHC 2012","b":["Giáo dục tại xã, phường, đặc khu: 03 đến 06 tháng; Chủ tịch UBND cấp xã quyết định.","Đưa vào trường giáo dưỡng: 06 đến 24 tháng, áp dụng với người chưa thành niên.","Đưa vào cơ sở giáo dục bắt buộc: 06 đến 24 tháng, áp dụng với người từ đủ 18 tuổi.","Đưa vào cơ sở cai nghiện bắt buộc: thực hiện theo Luật Phòng, chống ma túy 2025.","Tòa án nhân dân khu vực quyết định đưa vào trường giáo dưỡng, cơ sở giáo dục bắt buộc."]}]},{"t":"Các biện pháp cưỡng chế hành chính","c":[{"t":"Các biện pháp khắc phục hậu quả","cs":"Điều 28 Luật XLVPHC 2012","b":["Buộc khôi phục lại tình trạng ban đầu; buộc phá dỡ công trình xây dựng không phép hoặc sai phép.","Buộc khắc phục ô nhiễm môi trường, lây lan dịch bệnh; buộc tiêu hủy hàng hóa gây hại.","Buộc đưa ra khỏi lãnh thổ hoặc tái xuất; buộc cải chính thông tin sai sự thật; buộc nộp lại số lợi bất hợp pháp.","Có thể áp dụng độc lập kể cả khi hết thời hiệu hoặc không ra quyết định xử phạt."]},{"t":"Các biện pháp cưỡng chế thi hành quyết định xử phạt","cs":"Điều 86 Luật XLVPHC 2012","b":["Khấu trừ một phần lương, thu nhập; khấu trừ tiền từ tài khoản.","Kê biên tài sản có giá trị tương ứng để bán đấu giá.","Thu tiền, tài sản do cá nhân, tổ chức khác đang giữ khi người vi phạm cố tình tẩu tán.","Buộc thực hiện biện pháp khắc phục hậu quả."]},{"t":"Các biện pháp ngăn chặn và bảo đảm xử lý vi phạm hành chính","cs":"Điều 119 Luật XLVPHC 2012","b":["Tạm giữ người; áp giải người vi phạm.","Tạm giữ tang vật, phương tiện, giấy phép, chứng chỉ hành nghề.","Khám người; khám phương tiện vận tải, đồ vật; khám nơi cất giấu tang vật, phương tiện.","Quản lý người nước ngoài vi phạm trong thời gian làm thủ tục trục xuất; giao cho gia đình, tổ chức quản lý; truy tìm đối tượng bỏ trốn."]}]}]},{"t":"Chương 6. Kiểm soát quyền lực hành chính","cs":"Khoản 3 Điều 2 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025); Luật Thanh tra 2025; Luật TTHC 2015","b":["Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong thực hiện quyền lập pháp, hành pháp, tư pháp."],"c":[{"t":"Khái niệm, đặc điểm","b":["Khái niệm: tổng thể các hoạt động theo dõi, xem xét, đánh giá, phát hiện và xử lý sai phạm trong tổ chức và thực hiện quyền hành pháp.","Đặc điểm: đối tượng là quyền hành pháp của cơ quan hành chính và người có thẩm quyền; do nhiều chủ thể bên trong và bên ngoài thực hiện; phải dựa trên pháp luật.","Mục đích: phòng ngừa lạm quyền, tham nhũng; bảo vệ quyền, lợi ích hợp pháp của cá nhân, tổ chức; nâng cao hiệu lực, hiệu quả quản lý."]},{"t":"Chủ thể, nội dung kiểm soát quyền lực hành chính","b":["Chủ thể bên ngoài: Quốc hội, HĐND, Tòa án, Viện kiểm sát, Kiểm toán nhà nước, Mặt trận Tổ quốc, tổ chức xã hội, báo chí, Nhân dân.","Chủ thể bên trong: Chính phủ, UBND, thủ trưởng cơ quan hành chính cấp trên, cơ quan thanh tra.","Nội dung: tính hợp pháp và hợp lý của quyết định, hành vi hành chính; việc thực hiện chính sách, pháp luật; quản lý tài chính, tài sản công; đạo đức, kỷ luật công vụ."]},{"t":"Phương thức kiểm soát quyền lực hành chính.","c":[{"t":"Giám sát","cs":"Điều 69, Điều 113 Hiến pháp 2013; Luật Hoạt động giám sát của Quốc hội và HĐND 2015","b":["Giám sát của Quốc hội, HĐND: chất vấn, xem xét báo cáo, lấy phiếu tín nhiệm, giám sát chuyên đề.","Giám sát xã hội của Mặt trận Tổ quốc, tổ chức chính trị – xã hội và Nhân dân.","Đặc điểm: không trực tiếp xử lý mà kiến nghị, yêu cầu chủ thể có thẩm quyền xử lý."]},{"t":"Kiểm tra của các cơ quan hành chính nhà nước","b":["Kiểm tra theo chiều dọc (cấp trên với cấp dưới) và kiểm tra nội bộ.","Hệ quả: đình chỉ, sửa đổi, bãi bỏ quyết định trái pháp luật; xử lý kỷ luật người vi phạm."]},{"t":"Thanh tra","cs":"Luật Thanh tra 2025 (số 84/2025/QH15)","b":["Hoạt động xem xét, đánh giá, kết luận, kiến nghị xử lý việc thực hiện chính sách, pháp luật của cơ quan, tổ chức, cá nhân.","Từ 01/7/2025 hệ thống cơ quan thanh tra được tổ chức gọn lại theo hai cấp: Thanh tra Chính phủ và Thanh tra tỉnh, cùng cơ quan thanh tra trong một số bộ, ngành đặc thù.","Thanh tra hành chính và thanh tra chuyên ngành được hợp nhất về đầu mối; thủ trưởng cơ quan quản lý chịu trách nhiệm thực hiện kết luận thanh tra."]},{"t":"Kiểm toán","cs":"Điều 118 Hiến pháp 2013; Luật Kiểm toán nhà nước 2015 (đã sửa đổi, bổ sung)","b":["Kiểm toán nhà nước là cơ quan do Quốc hội thành lập, hoạt động độc lập và chỉ tuân theo pháp luật.","Kiểm toán việc quản lý, sử dụng tài chính công, tài sản công; kết luận, kiến nghị kiểm toán có tính bắt buộc thực hiện."]},{"t":"Xét xử hành chính","cs":"Điều 30, Điều 193 Luật TTHC 2015","b":["Tòa án xem xét tính hợp pháp của quyết định hành chính, hành vi hành chính bị khởi kiện.","Có quyền hủy quyết định trái pháp luật, buộc chấm dứt hành vi trái pháp luật, buộc bồi thường thiệt hại.","Là phương thức kiểm soát từ bên ngoài, độc lập và có hiệu lực bắt buộc thi hành."]}]}]},{"t":"Chương 7. Khái quát chung về Luật Tố tụng hành chính","cs":"Luật TTHC 2015 (sửa đổi, bổ sung bởi Luật số 85/2025/QH15; VBHN số 109/VBHN-VPQH)","b":["Luật Tố tụng hành chính quy định trình tự, thủ tục khởi kiện, giải quyết vụ án hành chính, thi hành án hành chính và quyền, nghĩa vụ của các chủ thể tố tụng."],"c":[{"t":"Đối tượng điều chỉnh và phương pháp điều chỉnh","cs":"Điều 1 Luật TTHC 2015","b":["Đối tượng: quan hệ xã hội phát sinh giữa Tòa án, Viện kiểm sát với đương sự và người tham gia tố tụng khác trong quá trình giải quyết vụ án hành chính.","Phương pháp mệnh lệnh: áp dụng trong quan hệ giữa cơ quan tiến hành tố tụng với người tham gia tố tụng.","Phương pháp bình đẳng, tự định đoạt: người khởi kiện và người bị kiện bình đẳng về quyền, nghĩa vụ trước Tòa án dù ngoài đời là quan hệ quản lý – bị quản lý."]},{"t":"Mối quan hệ giữa Luật Tố tụng hành chính với một số ngành luật khác","b":["Với Luật Hành chính: Luật Hành chính là luật nội dung về quyết định, hành vi hành chính; Luật TTHC là luật hình thức để Tòa án xem xét tính hợp pháp của chúng.","Với Luật Tố tụng dân sự: cùng giải quyết tranh chấp tại Tòa án; vấn đề bồi thường trong vụ án hành chính áp dụng pháp luật dân sự, tố tụng dân sự.","Với pháp luật khiếu nại: khiếu nại là con đường hành chính, khởi kiện là con đường tư pháp; người dân lựa chọn và có sự phân định thẩm quyền.","Với Luật Tổ chức Tòa án nhân dân: quy định mô hình 3 cấp Tòa án làm cơ sở phân định thẩm quyền xét xử."]},{"t":"Nguồn của Luật Tố tụng hành chính","b":["Hiến pháp 2013 (sửa đổi, bổ sung năm 2025): quyền tư pháp, nguyên tắc xét xử.","Luật TTHC 2015, sửa đổi, bổ sung năm 2019 và năm 2025 (Luật số 85/2025/QH15, hiệu lực 01/7/2025).","Luật Tổ chức TAND 2024 (sửa đổi năm 2025); Luật Tổ chức VKSND 2014 (sửa đổi năm 2025).","Nghị quyết của Hội đồng Thẩm phán TANDTC (như Nghị quyết số 05/2025/NQ-HĐTP về Điều 30, Điều 31); thông tư liên tịch; án lệ."]},{"t":"Nguyên tắc cơ bản trong tố tụng hành chính Việt Nam","cs":"Chương I Luật TTHC 2015 (Điều 4 – Điều 28)","c":[{"t":"Khái niệm","cs":"Điều 103 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","b":["Là những tư tưởng chỉ đạo, định hướng có tính bắt buộc, được ghi nhận trong Hiến pháp và Luật TTHC, chi phối toàn bộ hoạt động tố tụng hành chính."]},{"t":"Những nguyên tắc cơ bản trong tố tụng hành chính Việt Nam","cs":"Điều 4 – Điều 28 Luật TTHC 2015","b":["Tuân thủ pháp luật: mọi hoạt động tố tụng phải theo Luật TTHC (Điều 4).","Quyền yêu cầu Tòa án bảo vệ: cá nhân, cơ quan, tổ chức được khởi kiện vụ án hành chính (Điều 5).","Quyền quyết định và tự định đoạt: người khởi kiện có quyền khởi kiện, rút, thay đổi, bổ sung yêu cầu (Điều 8).","Cung cấp chứng cứ, chứng minh: đương sự có quyền và nghĩa vụ cung cấp chứng cứ; cơ quan có thẩm quyền phải cung cấp tài liệu (Điều 9, Điều 10).","Hai cấp xét xử: bảo đảm chế độ xét xử sơ thẩm, phúc thẩm (Điều 11).","Xét xử độc lập, tập thể, kịp thời, công bằng, công khai (Điều 13, Điều 15, Điều 16).","Bình đẳng về quyền, nghĩa vụ và bảo đảm tranh tụng (Điều 17, Điều 18).","Đối thoại: Tòa án tạo điều kiện để đương sự đối thoại về việc giải quyết vụ án (Điều 20).","Kiểm sát: Viện kiểm sát kiểm sát việc tuân theo pháp luật trong tố tụng hành chính (Điều 25)."]}]}]},{"t":"Chương 8. Thẩm quyền xét xử hành chính của Tòa án nhân dân","cs":"Điều 30 – Điều 35 Luật TTHC 2015 (sửa đổi, bổ sung năm 2025); Nghị quyết số 05/2025/NQ-HĐTP","b":["Từ 01/7/2025 hệ thống Tòa án gồm TANDTC, TAND cấp tỉnh và TAND khu vực; TAND khu vực xét xử sơ thẩm toàn bộ khiếu kiện hành chính."],"c":[{"t":"Khái niệm và đặc điểm.","cs":"Điều 30 Luật TTHC 2015","b":["Khái niệm: quyền và nghĩa vụ của Tòa án xem xét, giải quyết khiếu kiện hành chính theo thủ tục tố tụng hành chính.","Đặc điểm: là thẩm quyền của cơ quan tư pháp đối với hoạt động hành pháp; chỉ xem xét tính hợp pháp; chỉ phát sinh khi có khởi kiện."]},{"t":"Cơ sở xác định thẩm quyền xét xử hành chính của Tòa án nhân dân.","cs":"Điều 30, Điều 31 Luật TTHC 2015; Luật Tổ chức TAND 2024 (sửa đổi năm 2025)","b":["Tính chất của đối tượng khởi kiện (quyết định, hành vi hành chính, quyết định kỷ luật buộc thôi việc, danh sách cử tri…).","Mô hình tổ chức Tòa án và địa giới hành chính; nơi cư trú, trụ sở của người khởi kiện.","Mối quan hệ với cơ chế giải quyết khiếu nại hành chính."]},{"t":"Phân định thẩm quyền trong việc giải quyết khiếu kiện hành chính.","cs":"Điều 31 – Điều 33 Luật TTHC 2015","c":[{"t":"Phân định thẩm quyền của Tòa án với thẩm quyền của người giải quyết khiếu nại.","cs":"Điều 33 Luật TTHC 2015","b":["Vừa có đơn khiếu nại vừa có đơn khởi kiện: người khởi kiện phải chọn cơ quan giải quyết và thông báo bằng văn bản.","Chọn Tòa án: Tòa án thụ lý và yêu cầu chuyển hồ sơ khiếu nại.","Chọn người giải quyết khiếu nại: Tòa án trả lại đơn khởi kiện; hết thời hạn giải quyết hoặc không đồng ý kết quả thì được khởi kiện lại.","Không lựa chọn: Tòa án trả lại đơn khởi kiện."]},{"t":"Phân định thẩm quyền xét xử hành chính giữa các Tòa án.","cs":"Điều 31, Điều 31a, Điều 32, Điều 32a Luật TTHC 2015","b":["TAND khu vực: sơ thẩm mọi khiếu kiện hành chính; Tòa Hành chính khu vực giải quyết, Tòa Sở hữu trí tuệ khu vực giải quyết khiếu kiện về sở hữu trí tuệ, chuyển giao công nghệ.","TAND cấp tỉnh: phúc thẩm bản án, quyết định sơ thẩm của TAND khu vực; giám đốc thẩm, tái thẩm bản án đã có hiệu lực của TAND khu vực.","TANDTC: giám đốc thẩm, tái thẩm bản án, quyết định đã có hiệu lực của TAND cấp tỉnh."]}]},{"t":"Phạm vi thẩm quyền xét xử hành chính của Tòa án nhân dân.","cs":"Điều 30, Điều 31 Luật TTHC 2015; Nghị quyết số 05/2025/NQ-HĐTP","c":[{"t":"Thẩm quyền theo đối tượng xét xử vụ án hành chính.","cs":"Điều 3, Điều 30 Luật TTHC 2015","b":["Quyết định hành chính, hành vi hành chính bị kiện.","Quyết định kỷ luật buộc thôi việc công chức giữ chức vụ dưới Thứ trưởng và tương đương.","Quyết định giải quyết khiếu nại về quyết định xử lý vụ việc cạnh tranh; quyết định giải quyết khiếu nại trong hoạt động kiểm toán nhà nước.","Danh sách cử tri.","Loại trừ: quyết định, hành vi thuộc bí mật nhà nước về quốc phòng, an ninh, ngoại giao; quyết định, hành vi của Tòa án áp dụng biện pháp xử lý hành chính, xử lý hành vi cản trở tố tụng; quyết định, hành vi mang tính nội bộ của cơ quan, tổ chức."]},{"t":"Thẩm quyền theo lãnh thổ.","cs":"Điều 31 Luật TTHC 2015","b":["Quyết định, hành vi của cơ quan cấp xã: TAND khu vực có phạm vi bao gồm xã đó.","Cơ quan cấp tỉnh trở xuống, người khởi kiện cùng tỉnh với người bị kiện: TAND khu vực nơi người khởi kiện cư trú, làm việc, có trụ sở.","Không cùng tỉnh: TAND khu vực nơi quyết định, hành vi làm phát sinh, thay đổi, hạn chế, chấm dứt quyền, lợi ích của người khởi kiện.","Quyết định, hành vi của bộ, cơ quan trung ương: TAND khu vực nơi người khởi kiện cư trú, làm việc, có trụ sở.","Quyết định kỷ luật buộc thôi việc: TAND khu vực nơi người khởi kiện làm việc khi bị kỷ luật."]}]},{"t":"Chuyển vụ án hành chính cho Tòa án khác, giải quyết tranh chấp về thẩm quyền, nhập hoặc tách vụ án hành chính.","cs":"Điều 34, Điều 35 Luật TTHC 2015","b":["Chuyển vụ án: trước khi có quyết định đưa ra xét xử thì Thẩm phán chuyển hồ sơ và xóa sổ thụ lý; sau đó thì Hội đồng xét xử đình chỉ xét xử và chuyển hồ sơ.","Khiếu nại về việc chuyển: 03 ngày làm việc; quyết định của Chánh án là quyết định cuối cùng.","Tranh chấp thẩm quyền: Chánh án TAND cấp tỉnh giải quyết giữa các TAND khu vực trong tỉnh; Chánh án TANDTC giải quyết giữa các TAND khu vực khác tỉnh.","Nhập vụ án: một người kiện nhiều quyết định có liên quan mật thiết của cùng chủ thể, hoặc nhiều người kiện cùng một quyết định; bảo đảm không vi phạm thời hạn.","Tách vụ án: nhiều người khởi kiện mà quyền, nghĩa vụ không liên quan với nhau."]}]},{"t":"Chương 9. Chủ thể tiến hành tố tụng và chủ thể tham gia tố tụng hành chính","cs":"Điều 36 – Điều 65 Luật TTHC 2015 (sửa đổi, bổ sung năm 2025)","b":["Chủ thể tố tụng gồm bên tiến hành tố tụng (nhân danh quyền lực nhà nước) và bên tham gia tố tụng (bảo vệ quyền, lợi ích hoặc hỗ trợ giải quyết vụ án)."],"c":[{"t":"Chủ thể tiến hành tố tụng hành chính.","cs":"Điều 36 – Điều 52 Luật TTHC 2015","c":[{"t":"Khái niệm và phân loại.","cs":"Điều 36 Luật TTHC 2015","b":["Cơ quan tiến hành tố tụng: Tòa án nhân dân, Viện kiểm sát nhân dân.","Người tiến hành tố tụng: Chánh án, Thẩm phán, Hội thẩm nhân dân, Thẩm tra viên, Thư ký Tòa án; Viện trưởng Viện kiểm sát, Kiểm sát viên, Kiểm tra viên."]},{"t":"Địa vị pháp lý của cơ quan tiến hành tố tụng.","cs":"Điều 102, Điều 107 Hiến pháp 2013; Điều 24, Điều 25 Luật TTHC 2015","b":["Tòa án: thực hiện quyền tư pháp, xét xử vụ án hành chính, bảo vệ quyền, lợi ích hợp pháp.","Viện kiểm sát: kiểm sát việc tuân theo pháp luật, tham gia phiên tòa, kháng nghị bản án, quyết định."]},{"t":"Địa vị pháp lý của người tiến hành tố tụng.","cs":"Điều 37 – Điều 44 Luật TTHC 2015","b":["Chánh án: tổ chức công tác giải quyết vụ án, phân công Thẩm phán, quyết định thay đổi người tiến hành tố tụng, kháng nghị theo luật định.","Thẩm phán: thụ lý, lập hồ sơ, tổ chức đối thoại, quyết định đưa vụ án ra xét xử, chủ tọa phiên tòa.","Hội thẩm nhân dân: tham gia xét xử sơ thẩm, ngang quyền Thẩm phán khi biểu quyết.","Thư ký, Thẩm tra viên: ghi biên bản, kiểm tra thủ tục, thẩm tra hồ sơ giám đốc thẩm, tái thẩm.","Viện trưởng, Kiểm sát viên, Kiểm tra viên: kiểm sát hoạt động tố tụng, tham gia phiên tòa, kháng nghị."]},{"t":"Từ chối hoặc thay đổi người tiến hành tố tụng.","cs":"Điều 45 – Điều 52 Luật TTHC 2015","b":["Phải từ chối hoặc bị thay đổi khi đồng thời là đương sự, người đại diện, người thân thích của đương sự.","Khi đã tham gia với tư cách người bảo vệ, người làm chứng, giám định, phiên dịch trong cùng vụ án.","Khi có căn cứ rõ ràng cho rằng họ có thể không vô tư trong khi làm nhiệm vụ.","Thẩm phán, Hội thẩm còn phải từ chối khi đã tham gia giải quyết khiếu nại đối với quyết định bị kiện, cùng hội đồng có người thân thích, hoặc đã xét xử ở cấp khác.","Trước phiên tòa, Chánh án quyết định thay đổi; tại phiên tòa, Hội đồng xét xử quyết định."]}]},{"t":"Chủ thể tham gia tố tụng hành chính.","cs":"Điều 53 – Điều 65 Luật TTHC 2015","c":[{"t":"Khái niệm và phân loại.","cs":"Điều 3, Điều 53 Luật TTHC 2015","b":["Đương sự: người khởi kiện, người bị kiện, người có quyền lợi, nghĩa vụ liên quan.","Người tham gia tố tụng khác: người đại diện, người bảo vệ quyền và lợi ích hợp pháp của đương sự, người làm chứng, người giám định, người phiên dịch."]},{"t":"Địa vị pháp lý của đương sự.","cs":"Điều 54 – Điều 59 Luật TTHC 2015","b":["Năng lực pháp luật tố tụng hành chính: như nhau với mọi cá nhân, cơ quan, tổ chức.","Năng lực hành vi tố tụng hành chính đầy đủ: người từ đủ 18 tuổi, không mất năng lực hành vi dân sự.","Người khởi kiện: có quyền rút, thay đổi, bổ sung yêu cầu khởi kiện; yêu cầu áp dụng biện pháp khẩn cấp tạm thời.","Người bị kiện: có quyền sửa đổi, hủy bỏ quyết định hành chính bị kiện, dừng hành vi bị kiện; phải cung cấp hồ sơ, tài liệu.","Người có quyền lợi, nghĩa vụ liên quan: tham gia tố tụng theo yêu cầu của mình hoặc của đương sự, Tòa án đưa vào.","Kế thừa quyền, nghĩa vụ tố tụng khi cá nhân chết, cơ quan tổ chức hợp nhất, sáp nhập, chia, tách, giải thể."]},{"t":"Địa vị pháp lý của những người tham gia tố tụng khác.","cs":"Điều 60 – Điều 65 Luật TTHC 2015","b":["Người đại diện: theo pháp luật hoặc theo ủy quyền; người bị kiện có thể ủy quyền cho cấp phó đại diện.","Người bảo vệ quyền và lợi ích hợp pháp: luật sư, trợ giúp viên pháp lý, người đủ điều kiện được Tòa án chấp nhận.","Người làm chứng: người biết tình tiết liên quan vụ án; có nghĩa vụ khai báo trung thực.","Người giám định, người phiên dịch: phải từ chối hoặc bị thay đổi khi không bảo đảm vô tư, khách quan."]}]}]},{"t":"Chương 10. Thủ tục xét xử vụ án hành chính","cs":"Điều 115 – Điều 315 Luật TTHC 2015 (sửa đổi, bổ sung năm 2025)","b":["Vụ án hành chính đi qua các giai đoạn: khởi kiện, thụ lý → đối thoại, chuẩn bị xét xử → sơ thẩm → phúc thẩm → (giám đốc thẩm, tái thẩm) → thi hành án."],"c":[{"t":"Khởi kiện và thụ lý vụ án hành chính.","cs":"Chương IX Luật TTHC 2015 (Điều 115 – Điều 129)","c":[{"t":"Khởi kiện vụ án hành chính","cs":"Điều 115 – Điều 118 Luật TTHC 2015","b":["Quyền khởi kiện: không đồng ý với quyết định, hành vi hành chính, quyết định kỷ luật buộc thôi việc; hoặc đã khiếu nại mà hết thời hạn không được giải quyết, không đồng ý kết quả giải quyết.","Thời hiệu: 01 năm với quyết định, hành vi hành chính, quyết định kỷ luật buộc thôi việc; 30 ngày với quyết định giải quyết khiếu nại về vụ việc cạnh tranh, kiểm toán nhà nước; danh sách cử tri chậm nhất trước ngày bầu cử 05 ngày.","Hình thức: đơn khởi kiện theo Điều 118, kèm tài liệu, chứng cứ; nộp trực tiếp, qua bưu chính hoặc trực tuyến."]},{"t":"Thụ lý vụ án hành chính.","cs":"Điều 121, Điều 123, Điều 125 Luật TTHC 2015","b":["Tòa án xem xét đơn; yêu cầu sửa đổi, bổ sung đơn hoặc trả lại đơn khi không có quyền khởi kiện, hết thời hiệu không có lý do chính đáng, không thuộc thẩm quyền, sự việc đã được giải quyết bằng bản án có hiệu lực…","Người khởi kiện nộp tạm ứng án phí trong 10 ngày; Tòa án thụ lý khi nhận biên lai (trừ trường hợp được miễn)."]}]},{"t":"Thủ tục xét xử sơ thẩm vụ án hành chính.","cs":"Chương X, Chương XI Luật TTHC 2015","c":[{"t":"Chuẩn bị xét xử sơ thẩm vụ án hành chính.","cs":"Điều 130, Điều 134, Điều 135, Điều 141, Điều 143 Luật TTHC 2015","b":["Thời hạn chuẩn bị xét xử: 04 tháng (gia hạn 02 tháng) với khiếu kiện quyết định, hành vi hành chính; 02 tháng (gia hạn 01 tháng) với vụ án cạnh tranh, kiểm toán.","Đối thoại: công khai, dân chủ, không ép buộc; không tiến hành được khi đương sự cố ý vắng mặt lần thứ hai, có lý do chính đáng hoặc các bên đề nghị không đối thoại.","Tạm đình chỉ: đương sự chết chưa có người kế thừa, cần đợi kết quả giải quyết của cơ quan khác…","Đình chỉ: người khởi kiện rút đơn, người bị kiện hủy quyết định và người khởi kiện đồng ý rút đơn, thời hiệu đã hết…","Kết thúc: ra quyết định đưa vụ án ra xét xử."]},{"t":"Xét xử sơ thẩm vụ án hành chính.","cs":"Điều 154, Điều 193 Luật TTHC 2015","b":["Hội đồng xét xử: 01 Thẩm phán, 02 Hội thẩm nhân dân; vụ án phức tạp có thể 02 Thẩm phán, 03 Hội thẩm.","Trình tự: thủ tục bắt đầu → tranh tụng → nghị án → tuyên án.","Thẩm quyền: bác yêu cầu khởi kiện; chấp nhận và hủy một phần, toàn bộ quyết định trái pháp luật; buộc thực hiện nhiệm vụ, công vụ; buộc chấm dứt hành vi trái pháp luật; buộc bồi thường thiệt hại; kiến nghị xử lý văn bản trái luật."]}]},{"t":"Thủ tục xét xử phúc thẩm vụ án hành chính.","cs":"Điều 204, Điều 206, Điều 211, Điều 213, Điều 220, Điều 222, Điều 241 Luật TTHC 2015","b":["Kháng cáo: đương sự, người đại diện; 15 ngày kể từ ngày tuyên án, 07 ngày với quyết định tạm đình chỉ, đình chỉ.","Kháng nghị: Viện trưởng VKS cùng cấp 15 ngày, cấp trên trực tiếp 30 ngày kể từ ngày tuyên án.","Phạm vi: chỉ xem xét phần bản án bị kháng cáo, kháng nghị hoặc có liên quan.","Hội đồng phúc thẩm: 03 Thẩm phán; TAND cấp tỉnh xét xử phúc thẩm.","Thẩm quyền: giữ nguyên, sửa, hủy bản án để xét xử lại, hủy và đình chỉ giải quyết vụ án, đình chỉ xét xử phúc thẩm."]},{"t":"Thủ tục giám đốc thẩm, tái thẩm","cs":"Điều 254, Điều 255, Điều 260, Điều 263, Điều 266, Điều 281, Điều 283, Điều 284 Luật TTHC 2015","b":["Bản chất: xét lại bản án, quyết định đã có hiệu lực pháp luật bị kháng nghị, không phải một cấp xét xử.","Căn cứ giám đốc thẩm: kết luận không phù hợp với tình tiết khách quan; vi phạm nghiêm trọng thủ tục tố tụng; sai lầm nghiêm trọng trong áp dụng pháp luật.","Căn cứ tái thẩm: phát hiện tình tiết mới quan trọng; kết luận giám định, lời dịch không đúng sự thật, chứng cứ bị giả mạo; người tiến hành tố tụng cố ý làm sai lệch hồ sơ; bản án, quyết định làm căn cứ đã bị hủy.","Người kháng nghị: Chánh án TANDTC, Viện trưởng VKSNDTC đối với bản án của TAND cấp tỉnh; Chánh án TAND cấp tỉnh, Viện trưởng VKSND cấp tỉnh đối với bản án của TAND khu vực.","Thời hạn: giám đốc thẩm 03 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật; tái thẩm 01 năm kể từ ngày biết căn cứ."]},{"t":"Thi hành bản án, quyết định của Tòa án","cs":"Điều 309, Điều 311, Điều 312, Điều 314 Luật TTHC 2015","b":["Bản án, quyết định được thi hành: đã có hiệu lực pháp luật; quyết định áp dụng biện pháp khẩn cấp tạm thời thi hành ngay.","Tự nguyện thi hành: người phải thi hành thực hiện trong 30 ngày kể từ ngày nhận bản án, quyết định.","Quyết định buộc thi hành: người được thi hành có quyền yêu cầu trong 01 năm; Tòa án xét xử sơ thẩm ra quyết định trong 05 ngày làm việc; cơ quan thi hành án dân sự theo dõi.","Xử lý: người cố ý không chấp hành bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự."]}]}],"upd":{"t":"Phạm vi và nguyên tắc sử dụng sơ đồ","b":["Cấu trúc và tên chương, mục, tiểu mục được giữ theo Mục 9 – Nội dung học phần, kế hoạch giảng dạy trong đề cương chi tiết: trang 6–11 đối với phần Luật Hành chính và trang 11–14 đối với phần Luật Tố tụng hành chính.","Hai phần có cách đánh số chương độc lập. Mind map ghi rõ tên phần ở từng chương để tránh nhầm lẫn giữa Chương 1–6 của Luật Hành chính và Chương 1–4 của Luật Tố tụng hành chính.","Sơ đồ không tự mở rộng nội dung ngoài đề cương; các mục không có tiểu mục trong đề cương được giữ ở đúng cấp độ tương ứng.","Mind map là công cụ hệ thống hóa và ôn tập, không thay thế đề cương, giáo trình hoặc văn bản quy phạm pháp luật."]}}}</script>
