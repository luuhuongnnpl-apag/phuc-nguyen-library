":"Điều 24, Điều 25 NĐ 23/2015","cid":"TH8.02"},{"id":"TH8.02.2","g":8,"lv":"VD","q":"\"Giấy bán đất viết tay\" có được chứng thực chữ ký của hai bên không?","o":["Có, nếu diện tích chuyển nhượng dưới 100 m²","Có, nếu ông Phú đã tỉnh táo trở lại","Không, vì đây là giấy tờ có nội dung giao dịch","Có, nếu hai bên ký trước mặt người chứng thực"],"a":2,"e":"Điều 25 NĐ 23/2015: không được chứng thực chữ ký trong trường hợp giấy tờ, văn bản có nội dung là hợp đồng, giao dịch (trừ một số trường hợp luật định như giấy ủy quyền không thù lao). Mua bán đất phải chứng thực hợp đồng hoặc công chứng.","b":"Điều 25 NĐ 23/2015","cid":"TH8.02"},{"id":"TH8.02.3","g":8,"lv":"VD","q":"Để việc mua bán đất hợp pháp, ông Phú và hàng xóm phải làm gì?","o":["Chỉ cần đăng ký biến động đất đai","Lập hợp đồng chuyển nhượng, công chứng hoặc chứng thực","Lập vi bằng tại Văn phòng thừa phát lại","Chỉ cần chứng thực chữ ký trên giấy viết tay"],"a":1,"e":"Hợp đồng chuyển nhượng quyền sử dụng đất phải được công chứng hoặc chứng thực (điểm a khoản 3 Điều 27 Luật Đất đai); chứng thực hợp đồng liên quan đến đất thực hiện tại Ủy ban nhân dân cấp xã nơi có đất (Điều 5 NĐ 23/2015).","b":"Điểm a khoản 3 Điều 27 Luật Đất đai; Điều 5 NĐ 23/2015","cid":"TH8.02"},{"id":"TH8.02.4","g":8,"lv":"VD","q":"Chứng thực chữ ký có giá trị chứng minh điều gì?","o":["Chữ ký là của người yêu cầu chứng thực","Cơ quan chứng thực bảo đảm nội dung giấy tờ","Nội dung giấy tờ là đúng sự thật","Giấy tờ có hiệu lực thi hành như bản án"],"a":0,"e":"Khoản 3 Điều 3 NĐ 23/2015: chữ ký được chứng thực có giá trị chứng minh người yêu cầu chứng thực đã ký chữ ký đó, là căn cứ để xác định trách nhiệm của người ký về nội dung của giấy tờ, văn bản.","b":"Khoản 3 Điều 3 NĐ 23/2015","cid":"TH8.02"},{"id":"TH8.03.1","g":8,"lv":"VD","q":"Thủ tục chứng thực hợp đồng tặng cho của ông Thạch có điểm đặc thù nào?","o":["Chỉ cần con cháu xác nhận thay ông Thạch","Phải có người làm chứng; ông Thạch có thể điểm chỉ thay chữ ký","Bắt buộc phải chuyển sang công chứng","Không được chứng thực vì ông Thạch khiếm thị"],"a":1,"e":"Khoản 3 Điều 36 NĐ 23/2015: trường hợp người yêu cầu chứng thực không đọc được, không nghe được, không ký, không điểm chỉ được thì phải có người làm chứng. Ông Thạch có thể điểm chỉ; nội dung hợp đồng phải được đọc để ông xác nhận ý chí.","b":"Khoản 3 Điều 36 NĐ 23/2015","cid":"TH8.03"},{"id":"TH8.03.2","g":8,"lv":"VD","q":"Cháu ông Thạch (bên nhận tặng cho) có được làm người làm chứng không?","o":["Được, vì là người thân thích của ông Thạch","Được, nếu cháu đã đủ 18 tuổi","Không, vì có quyền lợi liên quan","Được, nếu ông Thạch đồng ý"],"a":2,"e":"Khoản 3 Điều 36 NĐ 23/2015: người làm chứng phải là người từ đủ 18 tuổi trở lên, có năng lực hành vi dân sự đầy đủ và không có quyền, lợi ích hoặc nghĩa vụ liên quan đến hợp đồng, giao dịch. Cháu là bên nhận tặng cho.","b":"Khoản 3 Điều 36 NĐ 23/2015","cid":"TH8.03"},{"id":"TH8.03.3","g":8,"lv":"VD","q":"Gia đình không mời được người làm chứng phù hợp. Ai bố trí người làm chứng?","o":["Trưởng thôn nơi ông Thạch cư trú","Bên nhận tặng cho tự lựa chọn","Không cần người làm chứng nữa","Người thực hiện chứng thực"],"a":3,"e":"Khoản 3 Điều 36 NĐ 23/2015: người làm chứng do người yêu cầu chứng thực bố trí; trường hợp người yêu cầu chứng thực không bố trí được thì đề nghị cơ quan thực hiện chứng thực chỉ định người làm chứng.","b":"Khoản 3 Điều 36 NĐ 23/2015","cid":"TH8.03"},{"id":"TH8.03.4","g":8,"lv":"VD","q":"Hợp đồng tặng cho xe máy được chứng thực có giá trị chứng minh điều gì?","o":["Thời gian, địa điểm, năng lực, ý chí, chữ ký các bên","Giá trị xe đúng như ghi trong hợp đồng","Chiếc xe máy không có tranh chấp","Toàn bộ nội dung hợp đồng là hợp pháp"],"a":0,"e":"Khoản 4 Điều 3 NĐ 23/2015: hợp đồng, giao dịch được chứng thực có giá trị chứng cứ chứng minh về thời gian, địa điểm các bên đã ký kết; năng lực hành vi dân sự, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ của các bên.","b":"Khoản 4 Điều 3 NĐ 23/2015","cid":"TH8.03"},{"id":"TH9.01.1","g":9,"lv":"VD","q":"Hồ sơ đầy đủ, giao dịch không phức tạp. Thời hạn công chứng là bao lâu?","o":["Ngay trong ngày nhận hồ sơ","15 ngày kể từ ngày nhận hồ sơ","05 ngày làm việc kể từ ngày nhận hồ sơ","Không quá 02 ngày làm việc"],"a":3,"e":"Điều 45 LCC: thời hạn công chứng không quá 02 ngày làm việc kể từ ngày nhận đủ hồ sơ yêu cầu công chứng hợp lệ; với giao dịch có nội dung phức tạp thì có thể kéo dài nhưng không quá 10 ngày làm việc. Thời gian xác minh, giám định không tính vào thời hạn.","b":"Điều 45 LCC","cid":"TH9.01"},{"id":"TH9.01.2","g":9,"lv":"VD","q":"Phí công chứng hợp đồng ghi giá 2 tỷ đồng (cao hơn giá đất nhà nước) là bao nhiêu?","o":["1.200.000 đồng","1.600.000 đồng","2.000.000 đồng","600.000 đồng"],"a":1,"e":"Khoản 2 Điều 4 TT 257/2016: từ trên 01 tỷ đến 03 tỷ đồng thu 01 triệu đồng cộng 0,06% phần giá trị vượt quá 01 tỷ. Phí = 1.000.000 + 0,06% × 1.000.000.000 = 1.600.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC","cid":"TH9.01"},{"id":"TH9.01.3","g":9,"lv":"VD","q":"Giả sử giá ghi trong hợp đồng là 300 triệu đồng, còn giá theo bảng giá đất nhà nước là 600 triệu đồng. Phí được tính trên giá trị nào?","o":["600 triệu đồng; phí là 600.000 đồng","300 triệu đồng theo giá ghi trong hợp đồng","Trung bình hai mức, tức 450 triệu đồng","Không thu phí vì giá hợp đồng thấp"],"a":0,"e":"Điểm d khoản 2 Điều 4 TT 257/2016: trường hợp giá đất, giá tài sản do các bên thỏa thuận thấp hơn mức giá do cơ quan nhà nước có thẩm quyền quy định thì giá trị tính phí theo giá nhà nước. Phí = 0,1% × 600.000.000 = 600.000 đồng.","b":"Điểm d khoản 2 Điều 4 Thông tư 257/2016/TT-BTC","cid":"TH9.01"},{"id":"TH9.01.4","g":9,"lv":"VD","q":"Văn phòng công chứng (không phải Phòng công chứng) thu phí theo Thông tư 257 thì mức thu đó đã bao gồm thuế giá trị gia tăng chưa?","o":["Chưa, phải cộng thêm 10% thuế","Chỉ Phòng công chứng mới thu phí","Đã bao gồm thuế giá trị gia tăng","Văn phòng được tự định mức phí"],"a":2,"e":"Khoản 1 Điều 4 TT 257/2016: mức thu phí áp dụng thống nhất cho Phòng công chứng và Văn phòng công chứng; trường hợp đơn vị thu phí là Văn phòng công chứng thì mức thu phí đã bao gồm thuế giá trị gia tăng.","b":"Khoản 1 Điều 4 Thông tư 257/2016/TT-BTC","cid":"TH9.01"},{"id":"TH9.02.1","g":9,"lv":"VD","q":"Phí chứng thực 10 bản sao một giấy tờ dài 05 trang là bao nhiêu?","o":["50.000 đồng","70.000 đồng","20.000 đồng","100.000 đồng"],"a":1,"e":"Điều 4 TT 226/2016: 2.000 đồng/trang cho hai trang đầu, từ trang thứ ba 1.000 đồng/trang. Mỗi bản 05 trang = 2 × 2.000 + 3 × 1.000 = 7.000 đồng; 10 bản = 70.000 đồng.","b":"Điều 4 Thông tư 226/2016/TT-BTC","cid":"TH9.02"},{"id":"TH9.02.2","g":9,"lv":"VD","q":"Phí chứng thực chữ ký trên 01 tờ khai là bao nhiêu?","o":["10.000 đồng","2.000 đồng","25.000 đồng","50.000 đồng"],"a":0,"e":"Điều 4 TT 226/2016: phí chứng thực chữ ký là 10.000 đồng/trường hợp (một hoặc nhiều chữ ký trong cùng một giấy tờ, văn bản).","b":"Điều 4 Thông tư 226/2016/TT-BTC","cid":"TH9.02"},{"id":"TH9.02.3","g":9,"lv":"VD","q":"Phí chứng thực hợp đồng mua bán xe máy và phí sửa lỗi kỹ thuật trong hợp đồng đó lần lượt là bao nhiêu?","o":["25.000 đồng và 50.000 đồng","50.000 đồng và 50.000 đồng","50.000 đồng và 25.000 đồng","10.000 đồng và 5.000 đồng"],"a":2,"e":"Điều 4 TT 226/2016: chứng thực hợp đồng, giao dịch 50.000 đồng/hợp đồng; sửa đổi, bổ sung, hủy bỏ hợp đồng 30.000 đồng/hợp đồng; sửa lỗi sai sót trong hợp đồng đã được chứng thực 25.000 đồng/hợp đồng.","b":"Điều 4 Thông tư 226/2016/TT-BTC","cid":"TH9.02"},{"id":"TH9.02.4","g":9,"lv":"VD","q":"Tổng phí công dân phải nộp cho cả bốn việc là bao nhiêu?","o":["145.000 đồng","135.000 đồng","175.000 đồng","155.000 đồng"],"a":3,"e":"Tổng = 70.000 (bản sao) + 10.000 (chữ ký) + 50.000 (hợp đồng) + 25.000 (sửa lỗi kỹ thuật) = 155.000 đồng, theo mức thu tại Điều 4 TT 226/2016 (chưa xét chính sách giảm phí nếu có).","b":"Điều 4 Thông tư 226/2016/TT-BTC","cid":"TH9.02"},{"id":"TH9.03.1","g":9,"lv":"VD","q":"Phí công chứng hợp đồng tặng cho căn nhà trị giá 12 tỷ đồng là bao nhiêu?","o":["12.000.000 đồng","5.200.000 đồng","5.800.000 đồng","70.000.000 đồng"],"a":2,"e":"Khoản 2 Điều 4 TT 257/2016: giá trị từ trên 10 tỷ đến 100 tỷ đồng thu 5,2 triệu đồng cộng 0,03% phần vượt quá 10 tỷ. Phí = 5.200.000 + 0,03% × 2.000.000.000 = 5.800.000 đồng; mức trần 70 triệu đồng chỉ áp dụng khi kết quả tính vượt trần.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC","cid":"TH9.03"},{"id":"TH9.03.2","g":9,"lv":"VD","q":"Chi phí để công chứng viên đến nhà bà Hạnh được xác định thế nào?","o":["Bằng 50% mức phí công chứng hợp đồng","Do bà Hạnh và Văn phòng thỏa thuận theo nguyên tắc đã niêm yết","Theo mức cố định do Bộ Tư pháp ban hành","Miễn phí vì bà Hạnh là người cao tuổi"],"a":1,"e":"Điều 72 LCC: chi phí công chứng ngoài trụ sở thuộc \"chi phí khác\", mức chi phí do người yêu cầu công chứng và tổ chức hành nghề công chứng thỏa thuận; tổ chức hành nghề công chứng phải niêm yết công khai nguyên tắc tính chi phí.","b":"Điều 72 LCC","cid":"TH9.03"},{"id":"TH9.03.3","g":9,"lv":"VD","q":"Đề nghị thu 700.000 đồng tiền soạn thảo hợp đồng của Văn phòng có hợp pháp không?","o":["Hợp pháp, nếu bà Hạnh đồng ý","Hợp pháp, nếu Văn phòng xuất hóa đơn","Hợp pháp, vì Văn phòng được tự định giá dịch vụ","Không, vì vượt mức tối đa 500.000 đồng"],"a":3,"e":"Khoản 2 Điều 71 LCC: tổ chức hành nghề công chứng xác định mức giá dịch vụ theo yêu cầu không vượt quá mức giá tối đa do Ủy ban nhân dân cấp tỉnh ban hành và niêm yết công khai. Sự đồng ý của khách hàng không làm việc thu vượt trở thành hợp pháp.","b":"Khoản 2 Điều 71 LCC","cid":"TH9.03"},{"id":"TH9.03.4","g":9,"lv":"VD","q":"Phí cấp 02 bản sao văn bản công chứng, mỗi bản 04 trang, là bao nhiêu?","o":["32.000 đồng","16.000 đồng","40.000 đồng","20.000 đồng"],"a":0,"e":"Điều 4 TT 257/2016: phí cấp bản sao văn bản công chứng là 5.000 đồng/trang, từ trang thứ ba trở lên 3.000 đồng/trang (tối đa 100.000 đồng/bản). Mỗi bản = 5.000 + 5.000 + 3.000 + 3.000 = 16.000 đồng; 02 bản = 32.000 đồng.","b":"Điều 4 Thông tư 257/2016/TT-BTC","cid":"TH9.03"}],"th":[{"name":"Chương 1. Khái quát chung về công chứng, chứng thực","items":[{"cid":"TH1.01","title":"Chọn công chứng hay chứng thực hợp đồng mua bán nhà","text":"Anh Vũ và chị Xím chuẩn bị mua bán một căn nhà gắn liền với đất. Anh Vũ muốn chứng thực tại Ủy ban nhân dân xã cho “rẻ và nhanh”; chị Xím muốn công chứng tại Văn phòng công chứng.","ask":["Pháp luật cho phép những lựa chọn nào về hình thức hợp đồng?","So sánh giá trị pháp lý của hợp đồng được công chứng và hợp đồng được chứng thực để tư vấn cho hai bên."],"guide":["Lựa chọn hình thức: hợp đồng chuyển nhượng quyền sử dụng đất, tài sản gắn liền với đất giữa cá nhân phải được công chứng hoặc chứng thực (Điều 27 LĐĐ; Điều 164 LNO). Các bên được chọn một trong hai: công chứng tại tổ chức hành nghề công chứng trên địa bàn tỉnh nơi có bất động sản, hoặc chứng thực tại Ủy ban nhân dân cấp xã nơi có đất.","So sánh: văn bản công chứng có hiệu lực thi hành với các bên, có giá trị chứng cứ (những tình tiết, sự kiện trong đó không phải chứng minh, trừ khi bị Tòa án tuyên vô hiệu) (Điều 6 LCC); công chứng viên chịu trách nhiệm cả về tính hợp pháp của nội dung giao dịch. Hợp đồng được chứng thực có giá trị chứng cứ về thời gian, địa điểm giao kết, năng lực hành vi, ý chí tự nguyện, chữ ký của các bên (Điều 3 NĐ 23), không bảo đảm về nội dung. Với giao dịch giá trị lớn, công chứng được bảo đảm an toàn pháp lý cao hơn."],"basis":"Điểm a khoản 3 Điều 27 Luật Đất đai; Điều 164 Luật Nhà ở; Điều 44 LCC; Điều 5 NĐ 23/2015; Điều 6 LCC; Điều 3, Điều 35 NĐ 23/2015","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]},{"cid":"TH1.02","title":"Cơ quan tiếp nhận đòi bản sao chứng thực","text":"Chị Mỹ nộp hồ sơ tại một cơ quan hành chính, mang theo bản chính và bản chụp (photo) căn cước, giấy khai sinh. Cán bộ tiếp nhận yêu cầu chị về chứng thực bản sao rồi mới nhận hồ sơ, đồng thời nói rằng “bản sao chứng thực chỉ có giá trị 06 tháng”.","ask":["Yêu cầu của cán bộ tiếp nhận có đúng không?","Nhận định về thời hạn 06 tháng có căn cứ trong NĐ 23 không?"],"guide":["Không đúng. Cơ quan tiếp nhận không được yêu cầu bản sao có chứng thực khi người nộp xuất trình bản chính để đối chiếu; cán bộ tiếp nhận tự kiểm tra, đối chiếu bản chụp với bản chính (Điều 6 NĐ 23).","Không có căn cứ. NĐ 23 không quy định thời hạn sử dụng của bản sao được chứng thực. Thời hạn chỉ áp dụng khi pháp luật chuyên ngành hoặc cơ quan tiếp nhận có quy định riêng về thời hạn của loại giấy tờ đó."],"basis":"Điều 6 NĐ 23/2015; Điều 3 NĐ 23/2015","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]},{"cid":"TH1.03","title":"Giá trị pháp lý của hợp đồng vay có công chứng","text":"Ngày 10/3/2026, ông Tài cho bà Mến vay 800.000.000 đồng, thời hạn 06 tháng. Hợp đồng vay được công chứng tại Văn phòng công chứng X: công chứng viên ký lời chứng và Văn phòng đóng dấu ngay trong ngày 10/3/2026. Hợp đồng ghi rõ \"bên vay đã nhận đủ 800.000.000 đồng\". Đến hạn, bà Mến không trả nợ. Khi ông Tài khởi kiện, bà Mến cho rằng mình \"chỉ nhận 500 triệu đồng\" nhưng không có chứng cứ nào khác.","ask":["Văn bản công chứng có hiệu lực từ khi nào và có giá trị pháp lý gì?","Lời khai \"chỉ nhận 500 triệu đồng\" của bà Mến được xem xét thế nào? Bà Mến muốn phủ nhận nội dung văn bản công chứng thì phải làm gì?"],"guide":["Văn bản công chứng có hiệu lực kể từ thời điểm được công chứng viên ký và tổ chức hành nghề công chứng đóng dấu (khoản 1 Điều 6 LCC), tức ngày 10/3/2026.","Hợp đồng được công chứng có hiệu lực thi hành đối với các bên; bên có nghĩa vụ không thực hiện thì bên kia có quyền yêu cầu Tòa án giải quyết (khoản 2 Điều 6 LCC).","Văn bản công chứng có giá trị chứng cứ; những tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ trường hợp bị Tòa án tuyên bố vô hiệu (khoản 3 Điều 6 LCC). Tình tiết \"đã nhận đủ 800 triệu đồng\" không phải chứng minh.","Muốn phủ nhận, bà Mến phải yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu và chứng minh có căn cứ (Điều 54 LCC); lời khai đơn thuần không đủ."],"basis":"Khoản 1, khoản 2, khoản 3 Điều 6 LCC; Điều 54 LCC","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]},{"name":"Chương 2. Công chứng viên","items":[{"cid":"TH2.01","title":"Chuyên viên pháp chế muốn được bổ nhiệm công chứng viên","text":"Anh Nguyễn Văn An, sinh năm 1990, có bằng cử nhân luật năm 2014. Từ tháng 9/2014 đến nay, anh An là chuyên viên pháp chế tại Sở Tư pháp tỉnh B. Tháng 6/2024, anh tốt nghiệp khóa đào tạo nghề công chứng; sau đó tập sự tại một Văn phòng công chứng và tháng 9/2026 được cấp giấy chứng nhận đạt yêu cầu kiểm tra kết quả tập sự. Anh An muốn nộp hồ sơ đề nghị bổ nhiệm công chứng viên ngay trong tháng 10/2026 nhưng vẫn muốn giữ vị trí công chức cho đến khi có quyết định bổ nhiệm.","ask":["Anh An đã đáp ứng đủ các tiêu chuẩn bổ nhiệm công chứng viên chưa?","Anh An có được bổ nhiệm trong khi vẫn là công chức không? Nếu không, anh cần làm gì?","Nếu đến tháng 10/2031 anh An vẫn chưa đề nghị bổ nhiệm thì giấy chứng nhận kết quả kiểm tra tập sự của anh còn giá trị không?"],"guide":["Đã đủ tiêu chuẩn tại Điều 10 LCC. Anh An là công dân Việt Nam 36 tuổi (k1); có bằng cử nhân luật (k3); có hơn 03 năm công tác pháp luật sau khi có bằng (k4); đã tốt nghiệp khóa đào tạo (k5) và đạt kiểm tra kết quả tập sự (k6). Tiêu chuẩn tại k2 (thường trú, phẩm chất, sức khỏe) giả định đáp ứng.","Không được bổ nhiệm khi đang là công chức. Khoản 5 Điều 14 LCC: người đang là cán bộ, công chức, viên chức (trừ viên chức Phòng công chứng) không được bổ nhiệm. Anh An phải thôi việc trước khi đề nghị bổ nhiệm; thẩm quyền bổ nhiệm hiện nay thuộc Chủ tịch Ủy ban nhân dân cấp tỉnh (Điều 14 NĐ 121).","Không còn giá trị. Khoản 5 Điều 12 LCC: giấy chứng nhận hết hiệu lực nếu trong 05 năm kể từ ngày được cấp (09/2026 – 09/2031) người được cấp không đề nghị bổ nhiệm. Anh An phải đăng ký và đạt lại kỳ kiểm tra kết quả tập sự."],"basis":"Điều 10 LCC; Khoản 5 Điều 14 LCC; Khoản 5 Điều 12 LCC","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]},{"cid":"TH2.02","title":"Người hướng dẫn tập sự bị tạm đình chỉ hành nghề","text":"Chị Lan có giấy chứng nhận tốt nghiệp khóa đào tạo nghề công chứng và được Văn phòng công chứng Mỹ Đình (Hà Nội) đồng ý nhận tập sự. Công chứng viên được phân công hướng dẫn là bà Hoa, đã hành nghề 05 năm và đang hướng dẫn 02 người tập sự khác. Quyết định đăng ký tập sự của chị Lan có hiệu lực ngày 01/3/2026. Tháng 8/2026, bà Hoa bị khởi tố bị can và bị tạm đình chỉ hành nghề; Văn phòng chỉ còn một công chứng viên mới hành nghề được 01 năm.","ask":["Việc phân công bà Hoa hướng dẫn chị Lan ngay từ đầu có đúng quy định không? Chị Lan phải đăng ký tập sự ở đâu?","Khi bà Hoa bị tạm đình chỉ, việc tập sự của chị Lan được giải quyết thế nào?","Sớm nhất chị Lan hoàn thành thời gian tập sự vào ngày nào (giả sử không tạm ngừng tập sự)?"],"guide":["Phân công chưa đúng. Bà Hoa đủ 02 năm kinh nghiệm nhưng đang hướng dẫn 02 người; theo khoản 3 Điều 12 LCC, tại cùng thời điểm một công chứng viên chỉ được hướng dẫn tối đa 02 người. Chị Lan đăng ký tập sự tại Sở Tư pháp Hà Nội, nơi có tổ chức nhận tập sự (khoản 1 Điều 12).","Khi bà Hoa bị tạm đình chỉ, tổ chức phải phân công công chứng viên khác đủ điều kiện. Công chứng viên còn lại mới có 01 năm kinh nghiệm nên không đủ điều kiện; Văn phòng phải báo cáo Sở Tư pháp để chỉ định tổ chức hành nghề công chứng khác nhận chị Lan (khoản 3 Điều 12).","Thời gian tập sự là 12 tháng tính từ ngày quyết định đăng ký tập sự có hiệu lực (01/3/2026), nên sớm nhất hoàn thành vào đầu tháng 3/2027. Sau đó chị Lan mới được đăng ký kiểm tra kết quả tập sự (khoản 5 Điều 12)."],"basis":"Khoản 1, khoản 3 Điều 12 LCC; Khoản 5 Điều 12 LCC","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]},{"cid":"TH2.03","title":"Công chứng viên bị khởi tố bị can","text":"Ngày 02/3/2026, công chứng viên R (hành nghề tại Văn phòng công chứng S, tỉnh T) bị khởi tố bị can về tội lừa đảo chiếm đoạt tài sản. Sở Tư pháp tỉnh T nhận được quyết định khởi tố ngày 05/3/2026 nhưng đến ngày 25/3/2026 mới ra quyết định tạm đình chỉ hành nghề. Trong thời gian chờ, R vẫn công chứng 15 hợp đồng. Ngày 10/8/2026, cơ quan điều tra ra quyết định đình chỉ điều tra đối với R.","ask":["Việc Sở Tư pháp ra quyết định tạm đình chỉ có đúng thẩm quyền và thời hạn không?","Sau khi có quyết định đình chỉ điều tra, R phải làm gì để được hành nghề trở lại? Sở Tư pháp phải giải quyết trong thời hạn nào?","Giả sử sau ngày 25/3/2026 R vẫn tiếp tục ký công chứng thì hậu quả pháp lý đối với R là gì?"],"guide":["Đúng thẩm quyền nhưng sai thời hạn. Đoạn 2 khoản 1 Điều 15 LCC: Sở Tư pháp nơi cấp thẻ ra quyết định trong 05 ngày làm việc kể từ ngày nhận được quyết định truy cứu trách nhiệm hình sự. Sở nhận ngày 05/3/2026 nhưng đến 25/3/2026 mới ra quyết định là chậm. 15 hợp đồng công chứng trước ngày 25/3 được thực hiện khi R chưa bị tạm đình chỉ, nên không đương nhiên vô hiệu chỉ vì lý do này.","Chấm dứt tạm đình chỉ trước thời hạn (điểm a khoản 3 Điều 15): R gửi văn bản đề nghị kèm quyết định đình chỉ điều tra; Sở Tư pháp ra quyết định trong 05 ngày làm việc kể từ ngày nhận đề nghị.","Hành nghề trong thời gian bị tạm đình chỉ là căn cứ bị miễn nhiệm (điểm g khoản 2 Điều 16) và R sẽ không bao giờ được bổ nhiệm lại (điểm b khoản 3 Điều 17). Văn phòng S cũng vi phạm điểm c khoản 2 Điều 9 và bị xử phạt theo NĐ 109/2026."],"basis":"Khoản 1 Điều 15 LCC; Điểm a khoản 3 Điều 15 LCC; Điểm g khoản 2 Điều 16, điểm b khoản 3 Điều 17 LCC","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]}]},{"name":"Chương 3. Tổ chức hành nghề công chứng","items":[{"cid":"TH3.01","title":"Văn phòng hợp danh có thành viên góp vốn không phải công chứng viên","text":"Công chứng viên Minh (đã hành nghề 06 năm) muốn thành lập Văn phòng công chứng theo loại hình công ty hợp danh. Do chưa tìm được công chứng viên khác, Minh đề nghị chồng mình là doanh nhân tham gia với tư cách thành viên góp vốn 60% vốn điều lệ; Minh là thành viên hợp danh duy nhất và là Trưởng Văn phòng.","ask":["Phương án của Minh có phù hợp với quy định về Văn phòng công chứng loại hình công ty hợp danh không?","Nếu Văn phòng vẫn được thành lập theo phương án này (do hiểu sai của cơ quan tiếp nhận) thì hậu quả pháp lý là gì?"],"guide":["Không phù hợp. Khoản 2 Điều 23 LCC: Văn phòng hợp danh phải có từ 02 thành viên hợp danh trở lên và không có thành viên góp vốn; các thành viên hợp danh phải là công chứng viên. Chồng Minh không phải công chứng viên nên không thể tham gia dưới bất kỳ tư cách nào.","Văn phòng bị thu hồi quyết định cho phép thành lập vì do cá nhân không phải công chứng viên tham gia thành lập (điểm i khoản 1 Điều 33), đồng thời chỉ có 01 thành viên hợp danh (điểm đ khoản 1 Điều 33)."],"basis":"Khoản 2 Điều 23 LCC; Khoản 1 Điều 33 LCC","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]},{"cid":"TH3.02","title":"Văn phòng công chứng chậm đăng ký hoạt động","text":"Văn phòng công chứng An Phú có quyết định cho phép thành lập có hiệu lực ngày 01/3/2026. Do chưa hoàn thiện việc thuê trụ sở, đến ngày 15/6/2026 Văn phòng mới nộp hồ sơ đăng ký hoạt động tại Sở Tư pháp.","ask":["Văn phòng có đăng ký hoạt động đúng thời hạn không?","Hậu quả pháp lý đối với Văn phòng là gì? Cơ quan nào xử lý?"],"guide":["Không đúng thời hạn. Khoản 1 Điều 25 LCC: trong 90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực, Văn phòng phải đăng ký hoạt động. Tính từ 01/3/2026, thời hạn kết thúc khoảng cuối tháng 5/2026; ngày 15/6/2026 đã quá hạn. Việc chưa thuê được trụ sở không phải lý do loại trừ.","Hậu quả: Văn phòng bị thu hồi quyết định cho phép thành lập (điểm a khoản 1 Điều 33). Sở Tư pháp kiểm tra, lập hồ sơ đề nghị; Ủy ban nhân dân cấp tỉnh ra quyết định thu hồi (khoản 3 Điều 33)."],"basis":"Khoản 1 Điều 25 LCC; Điểm a khoản 1, khoản 3 Điều 33 LCC","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4"]},{"cid":"TH3.03","title":"Bán Văn phòng công chứng khi chưa đủ thời gian hoạt động","text":"Bà Zét là Trưởng Văn phòng công chứng Thiên Ân (doanh nghiệp tư nhân), Văn phòng được cấp giấy đăng ký hoạt động ngày 01/6/2025. Tháng 10/2026, bà muốn bán Văn phòng cho công chứng viên Ánh (đã hành nghề 04 năm; chỉ mới thôi làm Trưởng một Văn phòng doanh nghiệp tư nhân khác từ tháng 01/2026). Văn phòng Thiên Ân còn nợ tiền thuê trụ sở 6 tháng. Bà Zét dự định sau khi bán sẽ lập ngay một Văn phòng hợp danh mới.","ask":["Bà Zét đã được bán Văn phòng chưa? Ánh có đủ điều kiện mua không?","Ai chịu trách nhiệm về khoản nợ tiền thuê trụ sở sau khi bán?","Dự định của bà Zét sau khi bán có thực hiện được không? Cơ quan nào cho phép việc bán Văn phòng?"],"guide":["Chưa được bán và Ánh cũng chưa đủ điều kiện mua. Văn phòng hoạt động từ 01/6/2025, đến tháng 10/2026 mới khoảng 16 tháng, chưa đủ 02 năm theo khoản 1 Điều 31 LCC; bà Zét sớm nhất chỉ được bán sau ngày 01/6/2027. Ánh đủ 02 năm hành nghề nhưng mới thôi làm Trưởng Văn phòng doanh nghiệp tư nhân khác từ 01/2026, chưa hết 02 năm (điểm b khoản 2 Điều 31); ngoài ra Ánh phải cam kết hành nghề với tư cách Trưởng Văn phòng (điểm c).","Khoản nợ phát sinh trước ngày chuyển giao do bà Zét tiếp tục chịu trách nhiệm, trừ khi bà Zét, người mua và chủ nợ có thỏa thuận khác (khoản 4 Điều 31).","Không thực hiện được ngay. Phải hết 02 năm kể từ ngày bán Văn phòng, bà Zét mới được thành lập, tham gia thành lập Văn phòng mới (khoản 5 Điều 31). Việc bán do Ủy ban nhân dân cấp tỉnh cho phép (khoản 3 Điều 31): Sở Tư pháp trình trong 05 ngày làm việc, Ủy ban nhân dân cấp tỉnh quyết định trong 10 ngày làm việc (Điều 26 NĐ 104)."],"basis":"Khoản 1, khoản 2 Điều 31 LCC; Khoản 4 Điều 31 LCC; Khoản 3, khoản 5 Điều 31 LCC; Điều 26 NĐ 104/2025/NĐ-CP","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]}]},{"name":"Chương 4. Quy định chung về thực hiện công chứng","items":[{"cid":"TH4.01","title":"Công chứng tại nhà cho người già không biết chữ","text":"Cụ Quyền, 85 tuổi, bị liệt hai chân, không biết chữ, muốn bán nhà cho cháu ngoại. Gia đình đề nghị công chứng viên đến nhà công chứng; người làm chứng dự kiến là chính cháu ngoại (bên mua).","ask":["Công chứng viên có được công chứng tại nhà cụ Quyền không?","Cụ Quyền xác lập ý chí bằng cách nào? Việc chọn cháu ngoại làm người làm chứng có hợp lệ không?"],"guide":["Được công chứng ngoài trụ sở. Điều 46 LCC cho phép công chứng ngoài trụ sở khi người yêu cầu là người già yếu, không thể đi lại được hoặc có lý do chính đáng khác.","Cụ Quyền điểm chỉ thay cho việc ký (Điều 50 LCC). Vì cụ không biết chữ, phải có người làm chứng (Điều 49). Người làm chứng phải không có quyền, lợi ích hoặc nghĩa vụ liên quan đến giao dịch; cháu ngoại là bên mua nên không được làm chứng."],"basis":"Điều 46 LCC; Khoản 2 Điều 49, Điều 50 LCC","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]},{"cid":"TH4.02","title":"Người bán nhà có dấu hiệu không minh mẫn","text":"Ông Roãn, 78 tuổi, đến Văn phòng công chứng cùng con trai để ký hợp đồng bán nhà. Trong lúc trao đổi, ông nhiều lần nhầm lẫn năm sinh, không nhớ địa chỉ ngôi nhà và hỏi lại “bán nhà cho ai”. Con trai khẳng định bố vẫn minh mẫn và thúc giục công chứng ngay.","ask":["Công chứng viên nên xử lý thế nào?","Nếu công chứng viên vẫn công chứng và sau đó có kết luận ông Roãn mất năng lực hành vi dân sự tại thời điểm ký thì hậu quả ra sao?"],"guide":["Công chứng viên dừng lại để làm rõ. Điều 42 LCC: khi có căn cứ cho rằng người yêu cầu công chứng không nhận thức, làm chủ được hành vi, công chứng viên đề nghị làm rõ hoặc theo đề nghị của người yêu cầu tiến hành xác minh, yêu cầu giám định; trường hợp không làm rõ được thì từ chối công chứng. Sự thúc giục của con trai không thay thế được việc đánh giá này.","Hậu quả: giao dịch do người mất năng lực hành vi dân sự xác lập có thể bị tuyên vô hiệu (Điều 125 BLDS); người có quyền, lợi ích liên quan có thể yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu (Điều 54 LCC). Nếu có lỗi của công chứng viên gây thiệt hại, tổ chức hành nghề công chứng phải bồi thường (Điều 40)."],"basis":"Điều 42 LCC; Khoản 4 Điều 42 LCC; Điều 125 BLDS; Điều 54 LCC","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4"]},{"cid":"TH4.03","title":"Hai bên muốn ghi giá thấp trong hợp đồng để giảm thuế","text":"Bà Vân bán căn hộ cho ông Xâu với giá thực tế 3 tỷ đồng. Hai bên đề nghị ghi trong hợp đồng giá 1 tỷ đồng để giảm thuế và phí, đồng thời ký riêng một giấy viết tay ghi giá 3 tỷ đồng.","ask":["Công chứng viên phải xử sự thế nào khi biết ý định này?","Hậu quả pháp lý của việc ghi giá không đúng thực tế là gì?"],"guide":["Công chứng viên giải thích hậu quả và từ chối nếu các bên vẫn giữ ý định. Công chứng viên phải tuân thủ nguyên tắc trung thực, khách quan, tuân thủ pháp luật (Điều 5 LCC); không được công chứng giao dịch có nội dung vi phạm pháp luật, giả tạo (Điều 9, Điều 42 LCC).","Hậu quả: hợp đồng ghi giá 1 tỷ nhằm che giấu giá thực là giao dịch giả tạo — giao dịch bị che giấu vẫn có hiệu lực nếu hợp pháp, phần giả tạo vô hiệu (Điều 124 BLDS). Các bên có thể bị truy thu thuế, xử phạt, và gặp rủi ro lớn khi tranh chấp về thanh toán."],"basis":"Điều 5, Điều 9, Điều 42 LCC; Điều 124 BLDS","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]}]},{"name":"Chương 5. Công chứng giao dịch cụ thể","items":[{"cid":"TH5.01","title":"Công chứng chuyển nhượng đất ở tỉnh khác","text":"Vợ chồng ông An, bà Bình (cư trú tại Hà Nội) có một thửa đất ở tại tỉnh Bắc Ninh, Giấy chứng nhận ghi tên cả hai người. Họ thỏa thuận chuyển nhượng thửa đất cho anh Cường và đề nghị một Văn phòng công chứng tại Hà Nội công chứng hợp đồng cho thuận tiện.","ask":["Văn phòng công chứng tại Hà Nội có thẩm quyền công chứng hợp đồng này không?","Liệt kê các giấy tờ cơ bản trong hồ sơ yêu cầu công chứng.","Sau khi công chứng, các bên còn phải thực hiện thủ tục gì để việc chuyển nhượng có hiệu lực?"],"guide":["Không có thẩm quyền. Điều 44 LCC: công chứng viên chỉ được công chứng giao dịch về bất động sản trong phạm vi tỉnh nơi tổ chức hành nghề công chứng đặt trụ sở (trừ một số trường hợp luật định như di chúc, văn bản từ chối nhận di sản, ủy quyền liên quan đến bất động sản). Thửa đất ở Bắc Ninh phải công chứng tại tổ chức hành nghề công chứng trên địa bàn Bắc Ninh.","Hồ sơ cơ bản (Điều 42, 43 LCC): phiếu yêu cầu công chứng; dự thảo hợp đồng (nếu tự soạn); giấy tờ tùy thân của các bên; Giấy chứng nhận quyền sử dụng đất; giấy tờ về tình trạng hôn nhân, tài sản chung (nếu cần). Thửa đất phải đáp ứng điều kiện chuyển nhượng tại Điều 45 LĐĐ.","Đăng ký biến động tại cơ quan đăng ký đất đai; việc chuyển nhượng có hiệu lực kể từ thời điểm đăng ký vào sổ địa chính (LĐĐ). Các bên cũng phải thực hiện nghĩa vụ tài chính theo quy định."],"basis":"Điều 44 LCC; Điều 42, Điều 43 LCC; Điều 45 Luật Đất đai; Điều 503 BLDS","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]},{"cid":"TH5.02","title":"Chồng tự bán nhà chung đứng tên mình","text":"Ngôi nhà do ông Dũng mua năm 2019 (trong thời kỳ hôn nhân với bà Em), Giấy chứng nhận chỉ ghi tên ông Dũng. Ông Dũng yêu cầu công chứng hợp đồng bán nhà, tự mình ký với lý do “sổ đứng tên tôi”. Bà Em đang lao động tại Hàn Quốc và không thể về nước.","ask":["Công chứng viên có nên công chứng khi chỉ có chữ ký của ông Dũng không?","Bà Em có thể tham gia giao dịch bằng cách nào khi đang ở nước ngoài?"],"guide":["Không nên công chứng. Nhà mua trong thời kỳ hôn nhân là tài sản chung, trừ khi có căn cứ chứng minh là tài sản riêng (Điều 33 LHNĐ), dù Giấy chứng nhận chỉ ghi tên một người. Định đoạt bất động sản chung phải có thỏa thuận bằng văn bản của vợ chồng (khoản 2 Điều 35 LHNĐ). Công chứng viên phải yêu cầu làm rõ; nếu không làm rõ được thì từ chối (Điều 42 LCC).","Cách để bà Em tham gia: bà Em có thể ủy quyền cho ông Dũng hoặc người khác bằng văn bản được công chứng, chứng thực tại Cơ quan đại diện Việt Nam ở Hàn Quốc (Điều 73 LCC) hoặc lập văn bản đồng ý theo hình thức hợp pháp (nếu do cơ quan nước ngoài lập thì phải hợp pháp hóa lãnh sự, trừ trường hợp được miễn)."],"basis":"Điều 33, khoản 2 Điều 35 Luật Hôn nhân và gia đình; Điều 42 LCC; Điều 73 LCC","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4"]},{"cid":"TH5.03","title":"Người được ủy quyền bán nhà sau khi người ủy quyền chết","text":"Tháng 3/2026, ông Hùng lập hợp đồng ủy quyền (có công chứng) cho cháu là anh Kiên được toàn quyền bán căn hộ của ông. Ngày 01/9/2026 ông Hùng qua đời. Ngày 15/9/2026, anh Kiên mang hợp đồng ủy quyền đến Văn phòng công chứng yêu cầu công chứng hợp đồng bán căn hộ cho người khác.","ask":["Anh Kiên còn quyền ký hợp đồng bán căn hộ không?","Công chứng viên xử lý thế nào? Ai có quyền định đoạt căn hộ?"],"guide":["Không còn quyền. Đại diện theo ủy quyền chấm dứt khi người được đại diện (ông Hùng) chết (Điều 140 BLDS); hợp đồng ủy quyền cũng chấm dứt (Điều 422 BLDS).","Công chứng viên từ chối công chứng. Căn hộ trở thành di sản của ông Hùng; chỉ những người thừa kế (sau khi khai nhận hoặc phân chia di sản theo Điều 59 LCC và đăng ký quyền) mới có quyền định đoạt. Công chứng viên cần tra cứu cơ sở dữ liệu và xác minh thông tin trước khi công chứng giao dịch theo ủy quyền."],"basis":"Điều 140, Điều 422 BLDS; Điều 42 LCC; Điều 59 LCC","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4"]}]},{"name":"Chương 6. Quy định chung về thực hiện chứng thực","items":[{"cid":"TH6.01","title":"Công chức tư pháp tự ký chứng thực hợp đồng","text":"Tại Ủy ban nhân dân xã D, công chức tư pháp – hộ tịch tiếp nhận yêu cầu chứng thực hợp đồng thế chấp quyền sử dụng đất. Do Chủ tịch và các Phó Chủ tịch đi công tác, công chức này tự ký chứng thực và đóng dấu Ủy ban để kịp thời gian cho người dân.","ask":["Ai có thẩm quyền ký chứng thực hợp đồng tại Ủy ban nhân dân cấp xã?","Hậu quả pháp lý của việc chứng thực sai thẩm quyền là gì?"],"guide":["Thẩm quyền ký: Chủ tịch hoặc Phó Chủ tịch Ủy ban nhân dân cấp xã ký chứng thực và đóng dấu của Ủy ban (Điều 5 NĐ 23). Công chức tư pháp – hộ tịch chỉ tiếp nhận, kiểm tra hồ sơ và giúp việc; không có thẩm quyền ký chứng thực hợp đồng.","Hậu quả: hợp đồng được “chứng thực” sai thẩm quyền không đáp ứng yêu cầu về hình thức, có thể bị tuyên vô hiệu về hình thức (Điều 129 BLDS) nếu các bên không khắc phục; việc đăng ký thế chấp cũng có thể bị từ chối. Công chức vi phạm bị xử lý kỷ luật; nếu gây thiệt hại thì phát sinh trách nhiệm bồi thường của Nhà nước và hoàn trả của người thi hành công vụ."],"basis":"Điều 5 NĐ 23/2015; Điều 129 BLDS","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]},{"cid":"TH6.02","title":"Chứng thực hợp đồng đất ở xã nơi cư trú thay vì nơi có đất","text":"Ông Quốc và bà Rây lập hợp đồng chuyển nhượng thửa đất nông nghiệp tại xã A. Hai bên đều cư trú tại xã B (liền kề) nên đến Ủy ban nhân dân xã B đề nghị chứng thực hợp đồng. Sau này phát sinh tranh chấp về diện tích thực tế, bà Rây cho rằng Ủy ban nhân dân xã phải chịu trách nhiệm vì “đã chứng thực”.","ask":["Ủy ban nhân dân xã B có thẩm quyền chứng thực hợp đồng này không?","Người thực hiện chứng thực hợp đồng chịu trách nhiệm về những nội dung nào? Quan điểm của bà Rây có đúng không?"],"guide":["Không có thẩm quyền. Việc chứng thực hợp đồng, giao dịch liên quan đến thực hiện quyền của người sử dụng đất phải thực hiện tại Ủy ban nhân dân cấp xã nơi có đất (Điều 5 NĐ 23), tức xã A.","Người thực hiện chứng thực hợp đồng chịu trách nhiệm về thời gian, địa điểm giao kết hợp đồng; năng lực hành vi dân sự, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ của các bên; không chịu trách nhiệm về nội dung hợp đồng (Điều 35 NĐ 23). Quan điểm của bà Rây sai về phạm vi trách nhiệm. Riêng việc chứng thực sai thẩm quyền là vi phạm của người thực hiện chứng thực."],"basis":"Điều 5 NĐ 23/2015; Điều 35 NĐ 23/2015","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4"]},{"cid":"TH6.03","title":"Chứng thực bản sao từ bằng tốt nghiệp giả","text":"Bà Uyên dùng bằng tốt nghiệp giả để yêu cầu chứng thực bản sao. Cán bộ tiếp nhận không phát hiện được vì bằng làm rất tinh vi, người có thẩm quyền đã ký chứng thực. Sau này, cơ quan tuyển dụng phát hiện sự việc.","ask":["Ai chịu trách nhiệm về tính hợp pháp của bản chính?","Người thực hiện chứng thực chịu trách nhiệm về nội dung gì? Bà Uyên có thể bị xử lý như thế nào?"],"guide":["Người yêu cầu chứng thực (bà Uyên) chịu trách nhiệm về nội dung, tính hợp lệ, hợp pháp của giấy tờ làm cơ sở để chứng thực (Điều 4, Điều 9 NĐ 23).","Người thực hiện chứng thực chịu trách nhiệm về tính chính xác và hợp pháp của việc chứng thực, tức bản sao đúng với bản chính xuất trình (Điều 4 NĐ 23); nếu đã làm đúng quy trình mà không thể phát hiện thì không phải chịu trách nhiệm về tính xác thực của bản chính. Bà Uyên có thể bị xử phạt vi phạm hành chính theo NĐ 109/2026, hoặc bị truy cứu trách nhiệm hình sự về hành vi sử dụng giấy tờ giả nếu đủ yếu tố cấu thành tội phạm; bản sao đã chứng thực không có giá trị sử dụng."],"basis":"Điều 4, Điều 9 NĐ 23/2015","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4"]}]},{"name":"Chương 7. Cấp bản sao từ sổ gốc, chứng thực bản sao từ bản chính","items":[{"cid":"TH7.01","title":"Sinh viên chứng thực bản sao ở nơi tạm trú","text":"Sinh viên Hoàng có hộ khẩu thường trú tại Thanh Hóa, đang tạm trú ở một phường tại Hà Nội. Hoàng cần 05 bản sao chứng thực bằng tốt nghiệp đại học để nộp hồ sơ xin việc. Cán bộ tại Ủy ban nhân dân phường nơi tạm trú từ chối vì cho rằng Hoàng phải về nơi thường trú.","ask":["Việc từ chối có đúng không?","Ngoài Ủy ban nhân dân cấp xã, Hoàng có thể yêu cầu chứng thực bản sao ở đâu?","Hoàng phải xuất trình giấy tờ gì?"],"guide":["Từ chối sai. Việc chứng thực bản sao từ bản chính, chữ ký không phụ thuộc vào nơi cư trú của người yêu cầu (Điều 5 NĐ 23). Hoàng có thể yêu cầu tại bất kỳ Ủy ban nhân dân cấp xã nào.","Nơi khác: tổ chức hành nghề công chứng (Phòng công chứng, Văn phòng công chứng) cũng có thẩm quyền chứng thực bản sao từ bản chính (Điều 5 NĐ 23).","Giấy tờ: bản chính bằng tốt nghiệp (hoặc bản chính kèm bản chụp cần chứng thực); người thực hiện kiểm tra bản chính, đối chiếu bản chụp rồi ghi lời chứng (Điều 20 NĐ 23)."],"basis":"Điều 5 NĐ 23/2015; Điều 20 NĐ 23/2015; Điều 7 NĐ 23/2015","mcq":["TH7.01.1","TH7.01.2","TH7.01.3","TH7.01.4"]},{"cid":"TH7.02","title":"Mất bằng tốt nghiệp, bố đi xin bản sao cho con","text":"Anh Lực làm mất bằng tốt nghiệp đại học. Bố anh Lực đến Ủy ban nhân dân xã đề nghị “chứng thực bản sao bằng” cho con, chỉ mang theo một bản photo cũ.","ask":["Yêu cầu của bố anh Lực có được Ủy ban nhân dân xã giải quyết không?","Thủ tục phù hợp là gì, thực hiện ở đâu? Bố anh Lực có được yêu cầu thay con không?","Phân biệt “bản sao từ sổ gốc” và “bản sao được chứng thực từ bản chính”."],"guide":["Không. Chứng thực bản sao phải có bản chính để đối chiếu; bản photo không phải bản chính.","Thủ tục phù hợp là cấp bản sao từ sổ gốc tại cơ quan, tổ chức đang quản lý sổ gốc (trường đại học đã cấp bằng). Người có quyền yêu cầu gồm người được cấp bản chính, người đại diện, và các thân nhân như cha, mẹ, con, vợ, chồng… (Điều 17 NĐ 23); bố anh Lực có quyền yêu cầu.","Phân biệt: bản sao từ sổ gốc do cơ quan lưu sổ gốc cấp, có nội dung đúng với sổ gốc; bản sao được chứng thực từ bản chính do cơ quan có thẩm quyền chứng thực thực hiện trên cơ sở đối chiếu với bản chính. Hai loại đều có giá trị sử dụng thay cho bản chính trong các giao dịch (Điều 2, Điều 3 NĐ 23)."],"basis":"Điều 2, Điều 3 NĐ 23/2015; Điều 16, Điều 17 NĐ 23/2015","mcq":["TH7.02.1","TH7.02.2","TH7.02.3","TH7.02.4"]},{"cid":"TH7.03","title":"Doanh nghiệp cần 200 bản sao chứng thực trong ngày","text":"Công ty TNHH Yến Sào cần 200 bản sao chứng thực các giấy tờ để tham gia đấu thầu, nộp yêu cầu tại một Văn phòng công chứng lúc 9 giờ sáng và đòi nhận kết quả ngay trong ngày.","ask":["Văn phòng công chứng có thẩm quyền chứng thực bản sao từ bản chính không?","Thời hạn giải quyết yêu cầu với số lượng lớn được xác định thế nào?"],"guide":["Có thẩm quyền. Tổ chức hành nghề công chứng được chứng thực bản sao từ bản chính (Điều 5 NĐ 23); công chứng viên ký chứng thực và đóng dấu của tổ chức hành nghề công chứng.","Thời hạn: thông thường giải quyết trong ngày; với yêu cầu số lượng lớn, thời hạn có thể kéo dài theo thỏa thuận bằng văn bản với người yêu cầu (Điều 7 NĐ 23). Công ty không được đòi bắt buộc trả kết quả trong ngày."],"basis":"Điều 5 NĐ 23/2015; Điều 7 NĐ 23/2015","mcq":["TH7.03.1","TH7.03.2","TH7.03.3","TH7.03.4"]}]},{"name":"Chương 8. Chứng thực chữ ký, chứng thực hợp đồng, giao dịch","items":[{"cid":"TH8.01","title":"Giấy ủy quyền chung cho việc nhận hộ hồ sơ và bán nhà","text":"Bà Nga muốn nhờ con gái: (i) nộp hồ sơ và nhận hộ kết quả cấp đổi giấy phép lái xe; (ii) thay bà ký hợp đồng bán căn nhà. Bà viết một “giấy ủy quyền” chung cho cả hai việc, không có thù lao, và đề nghị Ủy ban nhân dân xã chứng thực chữ ký.","ask":["Ủy ban nhân dân xã có chứng thực chữ ký trên giấy ủy quyền này không?","Bà Nga cần lập văn bản gì cho từng việc?"],"guide":["Không chứng thực chữ ký trên giấy ủy quyền chung này. Chứng thực chữ ký trên giấy ủy quyền chỉ áp dụng khi ủy quyền không có thù lao, không có nghĩa vụ bồi thường của bên được ủy quyền và không liên quan đến việc chuyển quyền sở hữu tài sản, quyền sử dụng bất động sản (Điều 24 NĐ 23). Việc bán nhà không thuộc phạm vi này.","Văn bản cần lập: (i) nộp hồ sơ, nhận kết quả có thể dùng giấy ủy quyền được chứng thực chữ ký; (ii) việc bán nhà phải lập hợp đồng ủy quyền và công chứng hoặc chứng thực hợp đồng theo quy định."],"basis":"Điều 24 NĐ 23/2015; Điều 562 BLDS","mcq":["TH8.01.1","TH8.01.2","TH8.01.3","TH8.01.4"]},{"cid":"TH8.02","title":"Người say rượu yêu cầu chứng thực chữ ký","text":"Ông Phú đến Ủy ban nhân dân xã đề nghị chứng thực chữ ký trên một đơn xác nhận. Ông đã ký sẵn ở nhà; khi đến nơi, ông có mùi rượu nồng nặc, nói lắp bắp và không trả lời được nội dung đơn. Một giờ sau, ông Phú quay lại với “giấy bán đất viết tay” giữa ông và hàng xóm, đề nghị chứng thực chữ ký của hai bên.","ask":["Người thực hiện chứng thực xử lý yêu cầu đầu tiên thế nào?","“Giấy bán đất viết tay” có được chứng thực chữ ký không? Nếu không, các bên phải làm gì?"],"guide":["Từ chối chứng thực. Người yêu cầu phải ký trước mặt người thực hiện chứng thực (Điều 24 NĐ 23), chữ ký ký sẵn không được chứng thực. Mặt khác, không chứng thực chữ ký khi người yêu cầu không nhận thức được, làm chủ được hành vi của mình (Điều 25 NĐ 23).","Không được chứng thực chữ ký trên giấy tờ có nội dung là hợp đồng, giao dịch (Điều 25 NĐ 23). Các bên phải lập hợp đồng chuyển nhượng quyền sử dụng đất và yêu cầu chứng thực hợp đồng (tại Ủy ban nhân dân cấp xã nơi có đất) hoặc công chứng."],"basis":"Điều 24, Điều 25 NĐ 23/2015; Điều 5 NĐ 23/2015","mcq":["TH8.02.1","TH8.02.2","TH8.02.3","TH8.02.4"]},{"cid":"TH8.03","title":"Người khiếm thị chứng thực hợp đồng tặng cho","text":"Ông Thạch bị khiếm thị, không biết chữ nổi, đến Ủy ban nhân dân xã để chứng thực hợp đồng tặng cho xe máy cho cháu. Cháu (bên nhận tặng cho) đề nghị tự mình đọc hợp đồng và làm chứng cho ông.","ask":["Thủ tục chứng thực hợp đồng trong trường hợp này có gì đặc thù?","Cháu của ông Thạch có được làm người làm chứng không?"],"guide":["Đặc thù: người yêu cầu chứng thực không đọc được, không nghệ được hoặc không ký được thì phải có người làm chứng; ông Thạch có thể điểm chỉ (Điều 36 NĐ 23). Người thực hiện chứng thực cần đọc hoặc bảo đảm nội dung hợp đồng được đọc cho ông nghe trước khi ông xác nhận.","Không được. Người làm chứng phải là người đủ 18 tuổi, có năng lực hành vi dân sự đầy đủ và không có quyền, lợi ích hoặc nghĩa vụ liên quan đến hợp đồng (NĐ 23); cháu là bên nhận tặng cho."],"basis":"Điều 36 NĐ 23/2015","mcq":["TH8.03.1","TH8.03.2","TH8.03.3","TH8.03.4"]}]},{"name":"Chương 9. Phí công chứng, giá dịch vụ và chi phí khác","items":[{"cid":"TH9.01","title":"Thời hạn và phí công chứng hợp đồng chuyển nhượng 2 tỷ đồng","text":"Hợp đồng chuyển nhượng quyền sử dụng đất giữa bà Yến và ông Khôi có giá trị ghi trong hợp đồng là 2 tỷ đồng, cao hơn giá đất do Ủy ban nhân dân cấp tỉnh quy định. Hồ sơ đầy đủ, giao dịch không phức tạp. Ông Khôi hỏi: mất bao lâu để được công chứng và phải nộp phí bao nhiêu.","ask":["Xác định thời hạn công chứng.","Tính phí công chứng theo biểu phí tại TT 257 (chưa xét chính sách giảm phí nếu có).","Nếu giá ghi trong hợp đồng thấp hơn giá đất do Nhà nước quy định thì căn cứ tính phí là gì?"],"guide":["Thời hạn công chứng không quá 02 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ; giao dịch phức tạp có thể kéo dài nhưng không quá 10 ngày làm việc (Điều 45 LCC). Thời gian xác minh, giám định không tính vào thời hạn.","Phí công chứng (TT 257, mức từ trên 1 tỷ đến 3 tỷ): 1.000.000 đồng + 0,06% × phần vượt 1 tỷ = 1.000.000 + 0,06% × 1.000.000.000 = 1.000.000 + 600.000 = 1.600.000 đồng. Sinh viên lưu ý kiểm tra chính sách giảm phí đang áp dụng tại thời điểm công chứng.","Giá ghi trong hợp đồng thấp hơn giá Nhà nước quy định thì phí tính theo giá đất, giá tài sản do cơ quan nhà nước có thẩm quyền quy định (TT 257)."],"basis":"Điều 45 LCC; Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC","mcq":["TH9.01.1","TH9.01.2","TH9.01.3","TH9.01.4"]},{"cid":"TH9.02","title":"Tính phí chứng thực nhiều việc tại Ủy ban nhân dân xã","text":"Một công dân có các yêu cầu tại Ủy ban nhân dân xã: chứng thực 10 bản sao một giấy tờ dài 05 trang; chứng thực chữ ký trên 01 tờ khai; chứng thực 01 hợp đồng mua bán xe máy; sau đó sửa lỗi kỹ thuật trong hợp đồng này.","ask":["Tính phí chứng thực cho từng việc theo TT 226 (chưa xét chính sách giảm phí nếu có).","Nếu công dân nộp yêu cầu chứng thực bản sao lúc 16 giờ thì được trả kết quả khi nào?"],"guide":["Phí theo TT 226: bản sao: 2.000 đồng/trang cho hai trang đầu, từ trang thứ ba 1.000 đồng/trang (tối đa 200.000 đồng/bản). Mỗi bản 05 trang = 2 × 2.000 + 3 × 1.000 = 7.000 đồng; 10 bản = 70.000 đồng. Chữ ký: 10.000 đồng/trường hợp. Hợp đồng: 50.000 đồng/hợp đồng. Sửa lỗi kỹ thuật: 25.000 đồng/hợp đồng. Sinh viên lưu ý kiểm tra chính sách giảm phí đang áp dụng tại thời điểm chứng thực.","Thời hạn: yêu cầu chứng thực bản sao được giải quyết trong ngày; nếu tiếp nhận sau 15 giờ thì hoàn thành chậm nhất trong ngày làm việc tiếp theo (Điều 7 NĐ 23)."],"basis":"Điều 4 Thông tư 226/2016/TT-BTC; Điều 7 NĐ 23/2015","mcq":["TH9.02.1","TH9.02.2","TH9.02.3","TH9.02.4"]},{"cid":"TH9.03","title":"Các khoản phải trả khi công chứng tặng cho nhà tại nhà riêng","text":"Bà Hạnh, 82 tuổi, bị bệnh không đi lại được, muốn tặng cho con trai căn nhà trị giá 12 tỷ đồng. Bà đề nghị Văn phòng công chứng Y cử công chứng viên đến nhà công chứng và nhờ Văn phòng soạn thảo hợp đồng. Giá tối đa đối với dịch vụ soạn thảo hợp đồng do Ủy ban nhân dân tỉnh ban hành là 500.000 đồng, nhưng Văn phòng đề nghị thu 700.000 đồng. Sau khi công chứng, bà Hạnh yêu cầu cấp 02 bản sao văn bản công chứng, mỗi bản dài 04 trang.","ask":["Xác định các khoản bà Hạnh phải trả: phí công chứng, chi phí công chứng ngoài trụ sở, thù lao soạn thảo, phí cấp bản sao.","Việc Văn phòng đề nghị thu 700.000 đồng tiền soạn thảo có hợp pháp không?"],"guide":["Phí công chứng hợp đồng tặng cho tính theo giá trị tài sản (khoản 2 Điều 4 TT 257/2016): từ trên 10 tỷ đến 100 tỷ đồng thu 5,2 triệu đồng + 0,03% phần vượt 10 tỷ = 5.200.000 + 600.000 = 5.800.000 đồng.","Chi phí công chứng ngoài trụ sở là chi phí khác do người yêu cầu và tổ chức hành nghề công chứng thỏa thuận; tổ chức phải niêm yết nguyên tắc tính chi phí (Điều 72 LCC).","Thù lao (giá dịch vụ) soạn thảo hợp đồng không được vượt mức giá tối đa do Ủy ban nhân dân cấp tỉnh ban hành (khoản 2 Điều 71 LCC); đề nghị thu 700.000 đồng là trái quy định, kể cả khi khách hàng đồng ý.","Phí cấp bản sao văn bản công chứng: 5.000 đồng/trang cho hai trang đầu, từ trang thứ ba 3.000 đồng/trang: mỗi bản 04 trang = 16.000 đồng; 02 bản = 32.000 đồng (Điều 4 TT 257/2016)."],"basis":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC; Điều 72 LCC; Khoản 2 Điều 71 LCC; Điều 4 Thông tư 257/2016/TT-BTC","mcq":["TH9.03.1","TH9.03.2","TH9.03.3","TH9.03.4"]}]}],"vb":[{"name":"Văn bản về công chứng","rows":[{"t":"Luật Công chứng số 46/2024/QH15","d":"26/11/2024","org":"Quốc hội","note":"","url":"https://thuvienphapluat.vn/van-ban/Dich-vu-phap-ly/Luat-cong-chung-2024-so-46-2024-QH15-524982.aspx"},{"t":"Luật Thi hành án dân sự số 106/2025/QH15 (sửa đổi, bổ sung một số điều của Luật Công chứng)","d":"05/12/2025","org":"Quốc hội","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.asp
