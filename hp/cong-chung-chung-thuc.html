</head><body><script id="PNLIB_COURSE_GATE">
(function(){
  const courseId="cong-chung-chung-thuc";
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let access=false;
  try{
    const raw=localStorage.getItem("pnlib-ma-lop");
    const session=raw?JSON.parse(raw):null;
    const scopes=session&&Array.isArray(session.courses)?session.courses:null;
    access=!!(session&&session.code&&session.han&&today()<=session.han&&(!scopes||!scopes.length||scopes.includes("*")||scopes.includes(courseId)));
  }catch(e){access=false}
  if(!access){
    document.documentElement.style.visibility="hidden";
    if(window.top!==window.self){
      window.parent.postMessage({pn:"home",course:courseId},"*");
    }else{
      window.location.replace("../index.html#"+courseId);
    }
  }
})();
</script>

<script id="pn-data" type="application/json">{"meta":{"id":"cong-chung-chung-thuc","name":"Công chứng, chứng thực","title":"Tài liệu Công chứng, chứng thực","menuTitle":"Công chứng, chứng thực","laws":[{"re":"LCC|Luật Công chứng","base":"https://hethongphapluat.com/luat-cong-chung-2024"},{"re":"BLDS|Bộ luật Dân sự","base":"https://hethongphapluat.com/bo-luat-dan-su-2015"},{"re":"HNGĐ|LHNĐ|Hôn nhân và gia đình","base":"https://hethongphapluat.com/luat-hon-nhan-va-gia-dinh-2014"},{"re":"NĐ 23|23/2015","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=23/2015/N%C4%90-CP&match=True"},{"re":"Luật Đất đai|LĐĐ","doc":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-523642.aspx"},{"re":"Luật Nhà ở|LNO","doc":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Nha-o-27-2023-QH15-528669.aspx"},{"re":"257/2016","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=257/2016/TT-BTC&match=True"},{"re":"226/2016","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=226/2016/TT-BTC&match=True"},{"re":"104/2025","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=104/2025/N%C4%90-CP&match=True"},{"re":"01/2020/TT-BTP","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=01/2020/TT-BTP&match=True"}],"note":"Lưu ý: Luật số 04/2026/QH16 sửa đổi Luật Công chứng có hiệu lực từ 01/01/2027; nội dung hiện soạn theo pháp luật có hiệu lực trước ngày đó."},"chapters":[{"n":1,"name":"Khái quát chung về công chứng, chứng thực"},{"n":2,"name":"Công chứng viên"},{"n":3,"name":"Tổ chức hành nghề công chứng"},{"n":4,"name":"Quy định chung về thực hiện công chứng"},{"n":5,"name":"Công chứng giao dịch cụ thể"},{"n":6,"name":"Quy định chung về thực hiện chứng thực"},{"n":7,"name":"Cấp bản sao từ sổ gốc, chứng thực bản sao từ bản chính"},{"n":8,"name":"Chứng thực chữ ký, chứng thực hợp đồng, giao dịch"},{"n":9,"name":"Phí công chứng, giá dịch vụ và chi phí khác"}],"q":[{"id":"1.01","g":1,"lv":"NB","q":"Văn bản công chứng (bản giấy) có hiệu lực kể từ thời điểm nào?","o":["Người yêu cầu công chứng nộp phí công chứng","Được công chứng viên ký và tổ chức hành nghề công chứng đóng dấu","Các bên tham gia giao dịch ký vào văn bản trước mặt công chứng viên","Văn bản được đăng ký tại cơ quan nhà nước có thẩm quyền"],"a":1,"e":"Khoản 1 Điều 6 LCC quy định văn bản công chứng có hiệu lực “kể từ thời điểm được công chứng viên ký và tổ chức hành nghề công chứng đóng dấu”. Việc các bên ký chưa làm phát sinh hiệu lực của văn bản công chứng. Văn bản công chứng điện tử có hiệu lực khi có chữ ký số của công chứng viên và của tổ chức hành nghề công chứng (khoản 2 Điều 64 LCC).","b":"Khoản 1 Điều 6, khoản 2 Điều 64 LCC"},{"id":"1.02","g":1,"lv":"NB","q":"Giá trị chứng cứ của văn bản công chứng được xác định như thế nào?","o":["Chỉ chữ ký của các bên là không phải chứng minh","Chỉ có giá trị chứng cứ khi được Viện kiểm sát xác nhận","Mọi tình tiết trong văn bản công chứng vẫn phải được chứng minh lại tại Tòa án","Tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ trường hợp văn bản bị Tòa án tuyên bố vô hiệu"],"a":3,"e":"Khoản 3 Điều 6 LCC: văn bản công chứng có giá trị chứng cứ; những tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ trường hợp bị Tòa án tuyên bố là vô hiệu.","b":"Khoản 3 Điều 6 LCC"},{"id":"1.03","g":1,"lv":"TH","q":"Theo Luật Công chứng 2024, đối với bản dịch giấy tờ từ tiếng nước ngoài sang tiếng Việt, công chứng viên thực hiện việc gì?","o":["Chứng thực chữ ký người dịch theo pháp luật về chứng thực","Hợp pháp hóa lãnh sự bản dịch","Không có thẩm quyền gì đối với bản dịch","Công chứng bản dịch như trước đây"],"a":0,"e":"Theo khoản 1, khoản 4 Điều 2 LCC, đối tượng của công chứng chỉ là giao dịch; Luật Công chứng 2024 không còn quy định “công chứng bản dịch”. Đối với bản dịch, công chứng viên thực hiện chứng thực chữ ký người dịch theo pháp luật về chứng thực (điểm c khoản 1 Điều 18 LCC).","b":"Khoản 1 Điều 2, điểm c khoản 1 Điều 18 LCC"},{"id":"1.04","g":1,"lv":"NB","q":"Bản sao được chứng thực từ bản chính có giá trị sử dụng như thế nào?","o":["Chỉ có giá trị tham khảo, không thay thế bản chính","Chỉ dùng được tại cơ quan đã chứng thực","Chỉ dùng được trong thời hạn 06 tháng","Thay cho bản chính đã dùng để đối chiếu chứng thực trong các giao dịch, trừ trường hợp pháp luật có quy định khác"],"a":3,"e":"Khoản 2 Điều 3 NĐ 23: bản sao được chứng thực từ bản chính có giá trị sử dụng thay cho bản chính đã dùng để đối chiếu chứng thực trong các giao dịch, trừ trường hợp pháp luật có quy định khác.","b":"Khoản 2 Điều 3 NĐ 23/2015"},{"id":"1.05","g":1,"lv":"TH","q":"Chữ ký được chứng thực có giá trị chứng minh điều gì?","o":["Nội dung giấy tờ mà người đó ký là hợp pháp","Người yêu cầu chứng thực đã ký chữ ký đó; là căn cứ xác định trách nhiệm của người ký về nội dung giấy tờ","Giấy tờ đã được cơ quan nhà nước phê duyệt","Người chứng thực chịu trách nhiệm về nội dung giấy tờ"],"a":1,"e":"Khoản 3 Điều 3 NĐ 23: chữ ký được chứng thực chỉ có giá trị chứng minh người yêu cầu chứng thực đã ký chữ ký đó, là căn cứ để xác định trách nhiệm của người ký về nội dung giấy tờ. Chứng thực chữ ký không xác nhận tính hợp pháp của nội dung.","b":"Khoản 3 Điều 3 NĐ 23/2015"},{"id":"1.06","g":1,"lv":"NB","q":"Hợp đồng, giao dịch được chứng thực có giá trị chứng cứ chứng minh về những nội dung nào?","o":["Việc các bên đã thực hiện xong hợp đồng","Thời gian, địa điểm ký kết; năng lực hành vi dân sự, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ của các bên","Giá trị tài sản là đối tượng hợp đồng","Tính hợp pháp của toàn bộ nội dung hợp đồng"],"a":1,"e":"Khoản 4 Điều 3 NĐ 23 quy định đúng các nội dung này về giá trị chứng cứ của hợp đồng, giao dịch được chứng thực.","b":"Khoản 4 Điều 3 NĐ 23/2015"},{"id":"1.07","g":1,"lv":"NB","q":"Tiếng nói và chữ viết dùng trong công chứng là:","o":["Tiếng Việt; trường hợp sử dụng tiếng nói, chữ viết khác thì phải dịch sang tiếng Việt","Tiếng Việt hoặc tiếng Anh tùy chọn","Ngôn ngữ mà công chứng viên thông thạo","Ngôn ngữ do người yêu cầu công chứng lựa chọn"],"a":0,"e":"Điều 7 LCC: tiếng nói và chữ viết dùng trong công chứng là tiếng Việt; trường hợp sử dụng tiếng nói, chữ viết khác hoặc ngôn ngữ của người khuyết tật thì phải dịch sang tiếng Việt.","b":"Điều 7 LCC"},{"id":"1.08","g":1,"lv":"NB","q":"Cơ quan nào thống nhất quản lý nhà nước về công chứng?","o":["Sở Tư pháp","Hiệp hội công chứng viên Việt Nam","Ủy ban nhân dân cấp tỉnh","Chính phủ; Bộ Tư pháp chịu trách nhiệm trước Chính phủ thực hiện quản lý nhà nước trên phạm vi cả nước"],"a":3,"e":"Điều 8 LCC: Chính phủ thống nhất quản lý nhà nước về công chứng; Bộ Tư pháp chịu trách nhiệm trước Chính phủ trên phạm vi cả nước. Ủy ban nhân dân cấp tỉnh chỉ quản lý nhà nước về công chứng tại địa phương.","b":"Điều 8 LCC"},{"id":"1.09","g":1,"lv":"TH","q":"Điểm khác nhau cơ bản giữa công chứng và chứng thực hợp đồng, giao dịch là:","o":["Hai hoạt động có giá trị pháp lý như nhau trong mọi trường hợp","Công chứng chứng nhận tính xác thực, hợp pháp của giao dịch; chứng thực hợp đồng chỉ chứng thực thời gian, địa điểm, năng lực hành vi, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ","Chứng thực chứng nhận cả tính hợp pháp của nội dung, công chứng thì không","Công chứng chỉ thực hiện với bất động sản, chứng thực chỉ với động sản"],"a":1,"e":"Khoản 1 Điều 2 LCC xác định công chứng là việc chứng nhận “tính xác thực, hợp pháp của giao dịch”. Khoản 4 Điều 2 NĐ 23 xác định chứng thực hợp đồng chỉ chứng thực về thời gian, địa điểm, năng lực hành vi, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ; người chứng thực không chịu trách nhiệm về nội dung hợp đồng (Điều 35 NĐ 23).","b":"Khoản 1 Điều 2 LCC; khoản 4 Điều 2, Điều 35 NĐ 23/2015"},{"id":"1.10","g":1,"lv":"TH","q":"Cơ quan đại diện ngoại giao của Việt Nam ở nước ngoài KHÔNG được công chứng loại giao dịch nào sau đây?","o":["Văn bản từ chối nhận di sản","Văn bản ủy quyền","Di chúc","Hợp đồng mua bán nhà ở tại Việt Nam"],"a":3,"e":"Khoản 1 Điều 73 LCC cho phép cơ quan đại diện công chứng di chúc, văn bản từ chối nhận di sản, văn bản ủy quyền và giao dịch khác, “trừ hợp đồng mua bán, chuyển đổi, chuyển nhượng, tặng cho, cho thuê, thế chấp, góp vốn bằng bất động sản tại Việt Nam”.","b":"Khoản 1 Điều 73 LCC"},{"id":"1.11","g":1,"lv":"VD","q":"Anh A đề nghị Văn phòng công chứng X “công chứng” bản sao thẻ căn cước. Về mặt pháp lý, việc công chứng viên xác nhận bản sao đúng với bản chính là:","o":["Cấp bản sao từ sổ gốc","Hợp pháp hóa giấy tờ","Chứng thực bản sao từ bản chính","Công chứng giao dịch"],"a":2,"e":"Công chứng chỉ áp dụng với giao dịch (khoản 1 Điều 2 LCC). Xác nhận bản sao đúng với bản chính là chứng thực bản sao từ bản chính (khoản 2 Điều 2 NĐ 23), việc mà công chứng viên được thực hiện theo điểm c khoản 1 Điều 18 LCC. Cách gọi “công chứng bản sao” trong đời sống là không chính xác về mặt pháp lý.","b":"Khoản 1 Điều 2 LCC; khoản 2 Điều 2 NĐ 23/2015; điểm c khoản 1 Điều 18 LCC"},{"id":"1.12","g":1,"lv":"VD","q":"A và B ký hợp đồng mua bán căn hộ trước mặt công chứng viên lúc 9 giờ ngày 10/3; công chứng viên ký lời chứng lúc 10 giờ; Văn phòng công chứng đóng dấu lúc 14 giờ cùng ngày. Văn bản công chứng có hiệu lực từ:","o":["14 giờ ngày 10/3","Ngày đăng ký sang tên căn hộ","10 giờ ngày 10/3","9 giờ ngày 10/3"],"a":0,"e":"Theo khoản 1 Điều 6 LCC, hiệu lực phát sinh khi có đủ hai yếu tố: công chứng viên ký và tổ chức hành nghề công chứng đóng dấu. Yếu tố sau cùng xuất hiện lúc 14 giờ, nên văn bản công chứng có hiệu lực từ 14 giờ ngày 10/3.","b":"Khoản 1 Điều 6 LCC"},{"id":"1.13","g":1,"lv":"VD","q":"Hai cá nhân ký hợp đồng đặt cọc để bảo đảm việc mua bán nhà. Về công chứng hợp đồng đặt cọc này:","o":["Chỉ được chứng thực tại Ủy ban nhân dân cấp xã","Bắt buộc phải công chứng mới có hiệu lực","Không được công chứng vì không phải giao dịch về bất động sản","Pháp luật không bắt buộc công chứng, nhưng các bên có quyền tự nguyện yêu cầu công chứng"],"a":3,"e":"Điều 328 BLDS không đòi hỏi hình thức công chứng đối với đặt cọc. Theo khoản 1 Điều 2 LCC, công chứng áp dụng cả với giao dịch mà cá nhân, tổ chức tự nguyện yêu cầu công chứng.","b":"Điều 328 BLDS 2015; khoản 1 Điều 2 LCC"},{"id":"1.14","g":1,"lv":"VD","q":"Hợp đồng chuyển nhượng quyền sử dụng đất đã công chứng ghi “Bên A đã nhận đủ tiền”. Khi có tranh chấp, bên A cho rằng chưa nhận đủ. Tại Tòa án:","o":["Tình tiết “đã nhận đủ tiền” không phải chứng minh, trừ khi văn bản công chứng bị Tòa án tuyên bố vô hiệu","Công chứng viên phải chứng minh việc giao nhận tiền","Tòa án phải tuyên hợp đồng vô hiệu","Bên mua phải chứng minh lại việc đã trả đủ tiền"],"a":0,"e":"Khoản 3 Điều 6 LCC quy định tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ khi bị Tòa án tuyên bố vô hiệu. Việc “đã nhận đủ tiền” ghi trong hợp đồng công chứng được coi là sự thật, bên mua không có nghĩa vụ chứng minh lại.","b":"Khoản 3 Điều 6 LCC"},{"id":"1.15","g":1,"lv":"VD","q":"Quy định về thủ tục chỉ yêu cầu nộp bản sao bằng tốt nghiệp. Cơ quan tiếp nhận hồ sơ:","o":["Không được yêu cầu bản sao có chứng thực; chỉ được yêu cầu xuất trình bản chính để đối chiếu hoặc xác minh khi có căn cứ bản sao giả mạo","Phải từ chối nhận bản sao không chứng thực","Chỉ nhận bản sao có hợp pháp hóa lãnh sự","Có quyền buộc người nộp phải nộp bản sao có chứng thực"],"a":0,"e":"Khoản 1 Điều 6 NĐ 23 (đã sửa đổi bởi NĐ 280/2025): trường hợp pháp luật quy định nộp bản sao thì cơ quan tiếp nhận không được yêu cầu xuất trình bản sao có chứng thực. Cơ quan chỉ có quyền yêu cầu xuất trình bản chính hoặc bản sao từ sổ gốc để đối chiếu, hoặc xác minh, khi có căn cứ về việc bản sao giả mạo, bất hợp pháp.","b":"Khoản 1 Điều 6 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"1.16","g":1,"lv":"VD","q":"Ông B và bà C (đều là cá nhân) chuyển nhượng thửa đất đã có Giấy chứng nhận. Yêu cầu về hình thức hợp đồng là:","o":["Phải được công chứng hoặc chứng thực","Chỉ công chứng theo yêu cầu của các bên","Chỉ cần đăng ký tại cơ quan đất đai","Chỉ cần lập văn bản có người làm chứng"],"a":0,"e":"Điểm a khoản 3 Điều 27 LĐĐ quy định hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất phải được công chứng hoặc chứng thực (trừ trường hợp kinh doanh bất động sản). Giao dịch giữa hai cá nhân không thuộc ngoại lệ.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024"},{"id":"1.17","g":1,"lv":"VD","q":"Ông K yêu cầu chứng thực chữ ký trên một đơn đề nghị; sau đó nội dung đơn bị phát hiện sai sự thật. Ai chịu trách nhiệm về nội dung đơn?","o":["Ủy ban nhân dân nơi chứng thực","Ông K (người yêu cầu chứng thực); người chứng thực chỉ chịu trách nhiệm về tính xác thực của chữ ký","Ông K và người chứng thực liên đới","Người thực hiện chứng thực chữ ký"],"a":1,"e":"Theo khoản 1, khoản 2 Điều 23 NĐ 23, người yêu cầu chịu trách nhiệm về nội dung giấy tờ mình ký; người thực hiện chứng thực chỉ chịu trách nhiệm về tính xác thực của chữ ký.","b":"Khoản 1, khoản 2 Điều 23 NĐ 23/2015"},{"id":"1.18","g":1,"lv":"VD","q":"Chị D là công dân Việt Nam đang ở Đức muốn ủy quyền cho em gái ở Hà Nội bán căn nhà của chị tại Hà Nội. Chị D có thể:","o":["Yêu cầu Đại sứ quán Việt Nam tại Đức công chứng văn bản ủy quyền","Yêu cầu Đại sứ quán công chứng luôn hợp đồng mua bán nhà","Không thể công chứng ở nước ngoài, phải về Việt Nam","Chỉ cần ủy quyền qua thư điện tử"],"a":0,"e":"Khoản 1 Điều 73 LCC cho phép cơ quan đại diện công chứng “các loại văn bản ủy quyền”. Loại trừ chỉ áp dụng với hợp đồng mua bán, chuyển nhượng… bất động sản tại Việt Nam, không phải văn bản ủy quyền.","b":"Khoản 1 Điều 73 LCC"},{"id":"1.19","g":1,"lv":"VD","q":"Bà M là người Pháp, không thông thạo tiếng Việt, yêu cầu công chứng hợp đồng tặng cho căn hộ tại Việt Nam; công chứng viên thông thạo tiếng Pháp. Cách làm đúng là:","o":["Công chứng viên kiêm luôn vai trò phiên dịch","Từ chối công chứng vì người yêu cầu là người nước ngoài","Văn bản lập bằng tiếng Việt và phải có người phiên dịch do người yêu cầu công chứng mời","Lập hoàn toàn bằng tiếng Pháp, công chứng viên tự dịch"],"a":2,"e":"Điều 7 LCC bắt buộc dùng tiếng Việt. Khoản 3 Điều 49 LCC: người yêu cầu không thông thạo tiếng Việt thì phải có người phiên dịch do người yêu cầu mời. Công chứng viên không thể kiêm vai trò phiên dịch.","b":"Điều 7, khoản 3 Điều 49 LCC"},{"id":"1.20","g":1,"lv":"VD","q":"Các bên có hợp đồng chuyển nhượng quyền sử dụng đất được công chứng hợp lệ. Cơ quan đăng ký đất đai:","o":["Chỉ thực hiện khi có xác nhận của Ủy ban nhân dân cấp xã","Có quyền yêu cầu công chứng lại tại cơ quan mình chỉ định","Có quyền tự đánh giá lại tính hợp pháp và từ chối tùy ý","Không được từ chối thực hiện thủ tục pháp lý liên quan đến giao dịch được công chứng mà không có căn cứ pháp lý"],"a":3,"e":"Khoản 2 Điều 6 LCC: văn bản công chứng là cơ sở để các bên đề nghị cơ quan nhà nước thực hiện thủ tục liên quan. Điểm d khoản 3 Điều 9 LCC nghiêm cấm hành vi “từ chối thực hiện thủ tục pháp lý liên quan đến giao dịch được công chứng mà không có căn cứ pháp lý”.","b":"Khoản 2 Điều 6, điểm d khoản 3 Điều 9 LCC"},{"id":"2.01","g":2,"lv":"NB","q":"Tiêu chuẩn về độ tuổi để được xem xét bổ nhiệm công chứng viên là:","o":["Không giới hạn tuổi","Không quá 65 tuổi","Từ đủ 25 tuổi đến 60 tuổi","Công dân Việt Nam không quá 70 tuổi"],"a":3,"e":"Khoản 1 Điều 10 LCC: tiêu chuẩn đầu tiên là “công dân Việt Nam không quá 70 tuổi”.","b":"Khoản 1 Điều 10 LCC"},{"id":"2.02","g":2,"lv":"TH","q":"Thời gian công tác pháp luật từ đủ 03 năm trở lên để được bổ nhiệm công chứng viên được tính:","o":["Chỉ thời gian làm việc tại tổ chức hành nghề công chứng","Sau khi có bằng cử nhân luật hoặc thạc sĩ luật hoặc tiến sĩ luật","Từ khi bắt đầu học đại học luật","Cả thời gian làm việc trước khi có bằng cử nhân luật"],"a":1,"e":"Khoản 4 Điều 10 LCC yêu cầu thời gian công tác pháp luật từ đủ 03 năm “sau khi có bằng cử nhân luật hoặc thạc sĩ luật hoặc tiến sĩ luật”. Thời gian làm việc trước khi có bằng không được tính.","b":"Khoản 4 Điều 10 LCC"},{"id":"2.03","g":2,"lv":"NB","q":"Người có học vị tiến sĩ luật tham gia đào tạo nghề công chứng với thời gian:","o":["03 tháng","Được miễn đào tạo","12 tháng","06 tháng"],"a":3,"e":"Điểm c khoản 3 Điều 11 LCC: tiến sĩ luật thuộc diện có thời gian đào tạo nghề công chứng là 06 tháng, không phải 12 tháng.","b":"Khoản 3 Điều 11 LCC"},{"id":"2.04","g":2,"lv":"NB","q":"Thời gian tập sự hành nghề công chứng là 12 tháng, được tính từ:","o":["Ngày tốt nghiệp khóa đào tạo nghề công chứng","Ngày người tập sự bắt đầu làm việc tại tổ chức nhận tập sự","Ngày nộp hồ sơ đăng ký tập sự","Ngày quyết định đăng ký tập sự có hiệu lực"],"a":3,"e":"Khoản 1 Điều 12 LCC: thời gian tập sự là 12 tháng, “được tính từ ngày quyết định đăng ký tập sự có hiệu lực”.","b":"Khoản 1 Điều 12 LCC"},{"id":"2.05","g":2,"lv":"NB","q":"Tại cùng một thời điểm, 01 công chứng viên được hướng dẫn tối đa bao nhiêu người tập sự?","o":["05 người","01 người","02 người","03 người"],"a":2,"e":"Khoản 3 Điều 12 LCC: tại cùng một thời điểm, 01 công chứng viên chỉ được hướng dẫn tối đa 02 người tập sự.","b":"Khoản 3 Điều 12 LCC"},{"id":"2.06","g":2,"lv":"TH","q":"Người đã bị kết án về tội phạm do cố ý:","o":["Được bổ nhiệm nếu có xác nhận của Sở Tư pháp","Được bổ nhiệm sau 05 năm kể từ khi chấp hành xong bản án","Được bổ nhiệm sau khi xóa án tích","Không được bổ nhiệm công chứng viên, kể cả trường hợp đã được xóa án tích"],"a":3,"e":"Khoản 2 Điều 14 LCC: không bổ nhiệm người “đã bị kết án về tội phạm do cố ý, kể cả trường hợp đã được xóa án tích”. Người phạm tội do vô ý chỉ bị cấm khi chưa được xóa án tích.","b":"Khoản 2 Điều 14 LCC"},{"id":"2.07","g":2,"lv":"TH","q":"Trường hợp nào sau đây KHÔNG bị cấm bổ nhiệm công chứng viên vì lý do đang là viên chức?","o":["Viên chức của trường đại học công lập","Viên chức của Phòng công chứng","Viên chức của bệnh viện công lập","Công chức Sở Tư pháp"],"a":1,"e":"Khoản 5 Điều 14 LCC cấm bổ nhiệm người đang là cán bộ, công chức, viên chức, nhưng loại trừ rõ “viên chức của Phòng công chứng”. Viên chức của Phòng công chứng vẫn có thể được bổ nhiệm nếu đủ tiêu chuẩn.","b":"Khoản 5 Điều 14 LCC"},{"id":"2.08","g":2,"lv":"TH","q":"Căn cứ nào sau đây dẫn đến tạm đình chỉ hành nghề công chứng?","o":["Công chứng viên bị truy cứu trách nhiệm hình sự","Công chứng viên bị xử phạt vi phạm hành chính một lần trong hoạt động công chứng","Công chứng viên nghỉ phép dài ngày","Tổ chức hành nghề công chứng chuyển trụ sở"],"a":0,"e":"Khoản 1 Điều 15 LCC chỉ quy định hai trường hợp tạm đình chỉ: bị truy cứu trách nhiệm hình sự; bị áp dụng biện pháp xử lý hành chính theo khoản 3 Điều 14. Xử phạt vi phạm hành chính không phải căn cứ tạm đình chỉ; bị xử phạt từ 02 lần trong 12 tháng là căn cứ miễn nhiệm (điểm g khoản 2 Điều 16).","b":"Khoản 1 Điều 15, điểm g khoản 2 Điều 16 LCC"},{"id":"2.09","g":2,"lv":"NB","q":"Thời gian tạm đình chỉ hành nghề công chứng tối đa là:","o":["03 tháng","12 tháng","06 tháng","24 tháng"],"a":1,"e":"Khoản 2 Điều 15 LCC: thời gian tạm đình chỉ hành nghề công chứng tối đa là 12 tháng.","b":"Khoản 2 Điều 15 LCC"},{"id":"2.10","g":2,"lv":"NB","q":"Công chứng viên đương nhiên miễn nhiệm khi:","o":["Bị xử phạt vi phạm hành chính","Quá 70 tuổi","Chuyển sang tổ chức hành nghề công chứng khác","Quá 65 tuổi"],"a":1,"e":"Khoản 1 Điều 16 LCC: “Công chứng viên đương nhiên miễn nhiệm khi quá 70 tuổi”.","b":"Khoản 1 Điều 16 LCC"},{"id":"2.11","g":2,"lv":"VD","q":"Ông A đáp ứng đủ các tiêu chuẩn tại Điều 10 LCC (bằng cử nhân luật, đủ thời gian công tác, đã đào tạo và tập sự đạt yêu cầu) nhưng hiện đang hành nghề luật sư. Ông A:","o":["Được bổ nhiệm nếu Đoàn luật sư đồng ý","Được bổ nhiệm ngay và tiếp tục hành nghề luật sư","Chưa được bổ nhiệm; phải chấm dứt hành nghề luật sư trước khi đề nghị bổ nhiệm","Không bao giờ được bổ nhiệm vì đã từng là luật sư"],"a":2,"e":"Ông A đáp ứng các tiêu chuẩn tại Điều 10 LCC. Tuy nhiên, khoản 6 Điều 14 LCC không bổ nhiệm người “đang là … luật sư”. Ông A phải chấm dứt hành nghề luật sư trước khi đề nghị bổ nhiệm.","b":"Điều 10, khoản 6 Điều 14 LCC"},{"id":"2.12","g":2,"lv":"VD","q":"Bà B là luật sư đã hành nghề được 6 năm. Thời gian đào tạo nghề công chứng của bà B là:","o":["03 tháng","Được miễn đào tạo","12 tháng","06 tháng"],"a":3,"e":"Điểm b khoản 3 Điều 11 LCC: luật sư đã hành nghề từ đủ 05 năm trở lên có thời gian đào tạo nghề công chứng là 06 tháng. Bà B đã hành nghề 6 năm nên thuộc diện này.","b":"Điểm b khoản 3 Điều 11 LCC"},{"id":"2.13","g":2,"lv":"VD","q":"Công chứng viên D bị xử phạt vi phạm hành chính trong hoạt động công chứng, chấp hành xong quyết định xử phạt ngày 01/02/2026. D được hướng dẫn tập sự từ khi nào?","o":["Không bao giờ được hướng dẫn tập sự","Sau ngày 01/02/2027 (hết 12 tháng kể từ ngày chấp hành xong)","Ngay từ ngày 01/02/2026","Từ ngày 01/9/2026"],"a":1,"e":"Khoản 3 Điều 12 LCC: công chứng viên bị xử phạt trong hoạt động hành nghề thì “sau 12 tháng kể từ ngày chấp hành xong quyết định” mới được hướng dẫn tập sự. D chỉ được hướng dẫn từ sau ngày 01/02/2027.","b":"Khoản 3 Điều 12 LCC"},{"id":"2.14","g":2,"lv":"VD","q":"Chị C được cấp giấy chứng nhận kết quả kiểm tra tập sự theo Luật Công chứng 2014 vào tháng 3/2020 và chưa đề nghị bổ nhiệm. Vào tháng 10/2026, giấy chứng nhận này:","o":["Đã hết giá trị kể từ ngày LCC 2024 có hiệu lực","Chỉ còn giá trị nếu được Sở Tư pháp gia hạn","Vẫn còn giá trị; chỉ hết hiệu lực nếu đến hết 05 năm kể từ ngày LCC 2024 có hiệu lực (01/7/2025) mà không đề nghị bổ nhiệm","Đã hết giá trị vì quá 05 năm kể từ ngày cấp"],"a":2,"e":"Đoạn 3 khoản 2 Điều 76 LCC: giấy chứng nhận cấp theo Luật Công chứng 2014 chỉ hết hiệu lực nếu đến hết thời hạn 05 năm kể từ ngày LCC có hiệu lực (01/7/2025) mà không đề nghị bổ nhiệm. Tháng 10/2026, giấy chứng nhận của chị C vẫn còn giá trị (đến 01/7/2030).","b":"Khoản 2 Điều 76 LCC"},{"id":"2.15","g":2,"lv":"VD","q":"Công chứng viên E bị khởi tố bị can. Thẩm quyền và thời hạn ra quyết định tạm đình chỉ hành nghề là:","o":["Tổ chức hành nghề công chứng nơi E làm việc, ngay trong ngày","Sở Tư pháp nơi cấp thẻ công chứng viên, trong thời hạn 05 ngày làm việc kể từ ngày nhận được quyết định về việc truy cứu trách nhiệm hình sự","Bộ Tư pháp, trong thời hạn 30 ngày","Ủy ban nhân dân cấp tỉnh, trong thời hạn 15 ngày"],"a":1,"e":"Đoạn 2 khoản 1 Điều 15 LCC: trong thời hạn 05 ngày làm việc kể từ ngày nhận được quyết định về việc truy cứu trách nhiệm hình sự, “Sở Tư pháp nơi cấp thẻ công chứng viên ra quyết định tạm đình chỉ hành nghề công chứng”.","b":"Khoản 1 Điều 15 LCC"},{"id":"2.16","g":2,"lv":"VD","q":"Anh H được bổ nhiệm công chứng viên tháng 01/2025 nhưng đến tháng 3/2026 vẫn chưa hành nghề vì lý do cá nhân. Anh H:","o":["Bị tạm đình chỉ hành nghề 12 tháng","Chỉ bị nhắc nhở bằng văn bản","Không bị ảnh hưởng gì","Thuộc trường hợp bị miễn nhiệm vì không hành nghề công chứng trong thời hạn 12 tháng kể từ ngày được bổ nhiệm"],"a":3,"e":"Điểm đ khoản 2 Điều 16 LCC: công chứng viên bị miễn nhiệm nếu “không hành nghề công chứng trong thời hạn 12 tháng kể từ ngày được bổ nhiệm”. Anh H đã quá 12 tháng mà không thuộc trường hợp loại trừ.","b":"Điểm đ khoản 2 Điều 16 LCC"},{"id":"2.17","g":2,"lv":"VD","q":"Công chứng viên G bị tạm đình chỉ hành nghề do bị truy cứu trách nhiệm hình sự. Hết 12 tháng tạm đình chỉ, vụ án vẫn đang điều tra. G:","o":["Bị thu hồi quyết định thành lập tổ chức hành nghề","Được gia hạn tạm đình chỉ thêm 12 tháng","Bị miễn nhiệm vì hết thời hạn tạm đình chỉ mà lý do tạm đình chỉ vẫn còn","Đương nhiên được hành nghề trở lại"],"a":2,"e":"Điểm e khoản 2 Điều 16 LCC: công chứng viên bị miễn nhiệm khi “hết thời hạn tạm đình chỉ hành nghề công chứng … mà lý do tạm đình chỉ vẫn còn”.","b":"Điểm e khoản 2 Điều 16 LCC"},{"id":"2.18","g":2,"lv":"VD","q":"Bà K bị miễn nhiệm công chứng viên vì đã hành nghề trong thời gian bị tạm đình chỉ. Khả năng được bổ nhiệm lại của bà K:","o":["Được xem xét bổ nhiệm lại sau 02 năm","Được bổ nhiệm lại sau 05 năm","Không được bổ nhiệm lại","Được bổ nhiệm lại ngay khi đủ tiêu chuẩn"],"a":2,"e":"Điểm b khoản 3 Điều 17 LCC: người bị miễn nhiệm do hành nghề công chứng trong thời gian bị tạm đình chỉ thuộc trường hợp không được bổ nhiệm lại, bất kể đã qua bao lâu.","b":"Điểm b khoản 3 Điều 17 LCC"},{"id":"2.19","g":2,"lv":"VD","q":"Ông I được miễn nhiệm công chứng viên năm 2024 theo nguyện vọng cá nhân. Năm 2026, ông đáp ứng đủ tiêu chuẩn tại Điều 10 LCC. Ông I:","o":["Được xem xét bổ nhiệm lại mà không phải chờ đủ 02 năm","Phải đào tạo và tập sự lại từ đầu","Không được bổ nhiệm lại","Phải chờ đủ 02 năm kể từ ngày miễn nhiệm"],"a":0,"e":"Khoản 1 Điều 17 LCC: người được miễn nhiệm theo nguyện vọng cá nhân được xem xét bổ nhiệm lại khi đáp ứng đủ tiêu chuẩn tại Điều 10. Thời hạn 02 năm tại khoản 2 Điều 17 chỉ áp dụng với người “bị miễn nhiệm” theo khoản 2 Điều 16 (đồng thời xem khoản 4 Điều 76 LCC).","b":"Khoản 1, khoản 2 Điều 17 LCC"},{"id":"2.20","g":2,"lv":"VD","q":"Công chứng viên L vừa hành nghề tại Văn phòng công chứng X, vừa làm tư vấn viên pháp luật tại một trung tâm tư vấn pháp luật. Hậu quả pháp lý:","o":["Chỉ bị nhắc nhở","L vi phạm điều cấm và thuộc trường hợp bị miễn nhiệm công chứng viên","Hợp pháp vì tư vấn pháp luật không thu phí","Hợp pháp nếu Văn phòng công chứng đồng ý"],"a":1,"e":"Điểm h khoản 1 Điều 9 LCC cấm công chứng viên đồng thời là tư vấn viên pháp luật. Điểm d khoản 2 Điều 16 LCC quy định trường hợp này thuộc căn cứ bị miễn nhiệm.","b":"Điểm h khoản 1 Điều 9, điểm d khoản 2 Điều 16 LCC"},{"id":"3.01","g":3,"lv":"NB","q":"Tổ chức hành nghề công chứng bao gồm:","o":["Phòng công chứng và Văn phòng công chứng","Phòng công chứng, Văn phòng công chứng và Ủy ban nhân dân cấp xã","Chỉ Văn phòng công chứng","Văn phòng công chứng và Văn phòng luật sư"],"a":0,"e":"Khoản 1 Điều 19 LCC: tổ chức hành nghề công chứng bao gồm Phòng công chứng và Văn phòng công chứng.","b":"Khoản 1 Điều 19 LCC"},{"id":"3.02","g":3,"lv":"NB","q":"Phòng công chứng do cơ quan nào quyết định thành lập?","o":["Hội đồng nhân dân cấp tỉnh","Giám đốc Sở Tư pháp","Bộ trưởng Bộ Tư pháp","Ủy ban nhân dân cấp tỉnh"],"a":3,"e":"Khoản 1 Điều 20 LCC: “Phòng công chứng do Ủy ban nhân dân cấp tỉnh quyết định thành lập”. Sở Tư pháp chỉ chủ trì xây dựng đề án thành lập trình Ủy ban nhân dân cấp tỉnh (khoản 1 Điều 21).","b":"Khoản 1 Điều 20, khoản 1 Điều 21 LCC"},{"id":"3.03","g":3,"lv":"NB","q":"Địa vị pháp lý của Phòng công chứng là:","o":["Đơn vị sự nghiệp công lập thuộc Sở Tư pháp, có trụ sở, con dấu và tài khoản riêng","Cơ quan hành chính nhà nước thuộc Ủy ban nhân dân cấp tỉnh","Tổ chức xã hội – nghề nghiệp","Doanh nghiệp nhà nước"],"a":0,"e":"Khoản 2 Điều 20 LCC: Phòng công chứng là đơn vị sự nghiệp công lập thuộc Sở Tư pháp, có trụ sở, con dấu và tài khoản riêng.","b":"Khoản 2 Điều 20 LCC"},{"id":"3.04","g":3,"lv":"NB","q":"Điều kiện đối với Trưởng Phòng công chứng là:","o":["Đã hành nghề công chứng từ đủ 05 năm","Có bằng thạc sĩ luật trở lên","Là công chức Sở Tư pháp","Là công chứng viên và đã hành nghề công chứng từ đủ 02 năm trở lên"],"a":3,"e":"Khoản 3 Điều 20 LCC: Trưởng Phòng công chứng phải là công chứng viên và đã hành nghề công chứng từ đủ 02 năm trở lên; do Giám đốc Sở Tư pháp bổ nhiệm, miễn nhiệm, cách chức.","b":"Khoản 3 Điều 20 LCC"},{"id":"3.05","g":3,"lv":"TH","q":"Về con dấu của tổ chức hành nghề công chứng, phát biểu đúng là:","o":["Con dấu của Phòng công chứng và Văn phòng công chứng đều không có hình quốc huy","Con dấu của Phòng công chứng có hình quốc huy","Chỉ con dấu của Văn phòng công chứng có hình quốc huy","Tổ chức hành nghề công chứng không có con dấu riêng"],"a":0,"e":"Khoản 5 Điều 20 LCC: “Con dấu của Phòng công chứng không có hình quốc huy”. Quy định tương tự áp dụng với Văn phòng công chứng (khoản 6 Điều 23).","b":"Khoản 5 Điều 20, khoản 6 Điều 23 LCC"},{"id":"3.06","g":3,"lv":"TH","q":"Văn phòng công chứng được tổ chức theo loại hình công ty hợp danh có đặc điểm nào?","o":["Thành viên hợp danh có thể là luật sư","Có từ 02 thành viên hợp danh trở lên là công chứng viên và không có thành viên góp vốn","Có thể có thành viên góp vốn không phải công chứng viên","Chỉ cần 01 thành viên hợp danh"],"a":1,"e":"Khoản 2 Điều 23 LCC: Văn phòng công chứng loại hình công ty hợp danh phải có từ 02 thành viên hợp danh trở lên “và không có thành viên góp vốn”; các thành viên hợp danh phải là công chứng viên. Điểm đ khoản 3 Điều 9 cũng nghiêm cấm người không phải công chứng viên góp vốn vào hoạt động công chứng.","b":"Khoản 2 Điều 23, điểm đ khoản 3 Điều 9 LCC"},{"id":"3.07","g":3,"lv":"TH","q":"Trưởng Văn phòng công chứng có được thuê người khác điều hành Văn phòng công chứng không?","o":["Được, nếu người được thuê là công chứng viên","Được, nếu Sở Tư pháp chấp thuận","Không được, kể cả khi các thành viên hợp danh đồng ý","Được, nếu các thành viên hợp danh đồng ý"],"a":2,"e":"Khoản 3 Điều 23 LCC: Trưởng Văn phòng công chứng “không được thuê người khác điều hành Văn phòng công chứng, không được cho thuê Văn phòng công chứng”. Sự đồng ý của các thành viên hợp danh không làm thay đổi quy định này.","b":"Khoản 3 Điều 23 LCC"},{"id":"3.08","g":3,"lv":"NB","q":"Văn phòng công chứng phải đăng ký hoạt động tại Sở Tư pháp trong thời hạn:","o":["60 ngày kể từ ngày được bổ nhiệm công chứng viên","90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực thi hành","30 ngày kể từ ngày nộp hồ sơ thành lập","06 tháng kể từ ngày có quyết định thành lập"],"a":1,"e":"Khoản 1 Điều 25 LCC: trong thời hạn 90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực thi hành, Văn phòng công chứng phải đăng ký hoạt động tại Sở Tư pháp nơi đã ra quyết định.","b":"Khoản 1 Điều 25 LCC"},{"id":"3.09","g":3,"lv":"NB","q":"Tổ chức hành nghề công chứng có được mở chi nhánh, văn phòng đại diện, địa điểm giao dịch khác ngoài trụ sở không?","o":["Được, nếu Sở Tư pháp cho phép","Được, trong cùng tỉnh","Được, nếu có từ 05 công chứng viên trở lên","Bị nghiêm cấm"],"a":3,"e":"Điểm b khoản 2 Điều 9 LCC nghiêm cấm tổ chức hành nghề công chứng mở chi nhánh, văn phòng đại diện, cơ sở, địa điểm giao dịch khác ngoài trụ sở.","b":"Điểm b khoản 2 Điều 9 LCC"},{"id":"3.10","g":3,"lv":"TH","q":"Bảo hiểm trách nhiệm nghề nghiệp của công chứng viên là:","o":["Không có quy định về bảo hiểm","Bảo hiểm bắt buộc do từng công chứng viên tự mua","Bảo hiểm tự nguyện do từng công chứng viên quyết định","Bảo hiểm bắt buộc; tổ chức hành nghề công chứng có nghĩa vụ mua và duy trì"],"a":3,"e":"Khoản 1 Điều 39 LCC: bảo hiểm trách nhiệm nghề nghiệp của công chứng viên là loại hình bảo hiểm bắt buộc. Theo khoản 2 Điều 39, tổ chức hành nghề công chứng (không phải từng công chứng viên) có nghĩa vụ mua và duy trì bảo hiểm này.","b":"Khoản 1, khoản 2 Điều 39 LCC"},{"id":"3.11","g":3,"lv":"VD","q":"Công chứng viên A đang là viên chức của Phòng công chứng số 2, muốn cùng B, C thành lập Văn phòng công chứng hợp danh. A:","o":["Không bao giờ được tham gia thành lập Văn phòng công chứng","Được tham gia nếu Trưởng Phòng công chứng đồng ý","Được tham gia thành lập và vẫn là viên chức","Chưa được tham gia thành lập; chỉ được tham gia sau khi chấm dứt tư cách viên chức Phòng công chứng"],"a":3,"e":"Điểm a khoản 2 Điều 24 LCC: công chứng viên “đang là viên chức của Phòng công chứng” không được thành lập, tham gia thành lập Văn phòng công chứng mới. A chỉ được tham gia sau khi chấm dứt tư cách viên chức.","b":"Điểm a khoản 2 Điều 24 LCC"},{"id":"3.12","g":3,"lv":"VD","q":"Công chứng viên M thường trú tại Hà Nội muốn thành lập Văn phòng công chứng tại tỉnh Bắc Ninh. M nộp hồ sơ tại:","o":["Sở Tư pháp Hà Nội (nơi thường trú)","Ủy ban nhân dân xã nơi đặt trụ sở","Bộ Tư pháp","Sở Tư pháp tỉnh Bắc Ninh (nơi dự kiến thành lập)"],"a":3,"e":"Khoản 1 Điều 24 LCC: công chứng viên gửi hồ sơ đến “Sở Tư pháp nơi dự kiến thành lập Văn phòng công chứng”, tức Sở Tư pháp tỉnh Bắc Ninh, không phụ thuộc nơi thường trú của M.","b":"Khoản 1 Điều 24 LCC"},{"id":"3.13","g":3,"lv":"VD","q":"Văn phòng công chứng X được cấp giấy đăng ký hoạt động ngày 01/3/2026. Các công chứng viên của Văn phòng được hành nghề từ:","o":["Ngày có quyết định cho phép thành lập","Ngày đăng báo về việc thành lập","30 ngày sau ngày cấp giấy đăng ký hoạt động","Ngày 01/3/2026"],"a":3,"e":"Khoản 3 Điều 25 LCC: Văn phòng công chứng được hoạt động, công chứng viên của Văn phòng được hành nghề “kể từ ngày Văn phòng công chứng được cấp giấy đăng ký hoạt động”.","b":"Khoản 3 Điều 25 LCC"},{"id":"3.14","g":3,"lv":"VD","q":"Văn phòng công chứng Y có quyết định cho phép thành lập có hiệu lực ngày 10/01/2026, đến ngày 20/5/2026 vẫn chưa đăng ký hoạt động. Hậu quả:","o":["Không có hậu quả gì","Bị thu hồi quyết định cho phép thành lập vì quá 90 ngày chưa đăng ký hoạt động","Bị xử phạt nhưng vẫn giữ quyết định thành lập","Được gia hạn thêm 90 ngày"],"a":1,"e":"Thời hạn 90 ngày tính từ 10/01/2026 kết thúc vào đầu tháng 4/2026 (khoản 1 Điều 25 LCC). Đến 20/5/2026 vẫn chưa đăng ký nên thuộc trường hợp bị thu hồi quyết định cho phép thành lập theo điểm a khoản 1 Điều 33 LCC.","b":"Khoản 1 Điều 25, điểm a khoản 1 Điều 33 LCC"},{"id":"3.15","g":3,"lv":"VD","q":"Văn phòng công chứng Z có 02 thành viên hợp danh; một người chết ngày 01/02/2026. Nếu đến 01/9/2026 vẫn chưa bổ sung thành viên hợp danh mới thì:","o":["Tự động chuyển thành Phòng công chứng","Bị thu hồi quyết định cho phép thành lập (đã quá 06 tháng)","Được gia hạn thêm 12 tháng","Được tiếp tục hoạt động với 01 thành viên"],"a":1,"e":"Khoản 2 Điều 33 LCC: khi chỉ còn 01 thành viên hợp danh do thành viên còn lại chết, phải bổ sung ít nhất 01 thành viên mới trong thời hạn 06 tháng. Hạn chót là 01/8/2026; đến 01/9/2026 chưa bổ sung thì bị thu hồi quyết định cho phép thành lập.","b":"Khoản 2 Điều 33 LCC"},{"id":"3.16","g":3,"lv":"VD","q":"Văn phòng công chứng Q có 04 thành viên hợp danh. Thành viên N muốn rút vốn. Điều kiện là:","o":["Được tự do rút vốn bất cứ lúc nào","Được ít nhất ba phần tư tổng số thành viên hợp danh chấp thuận bằng văn bản và Văn phòng còn ít nhất 02 thành viên hợp danh","Chỉ cần thông báo cho Sở Tư pháp","Chỉ cần 01 thành viên hợp danh khác chấp thuận"],"a":1,"e":"Khoản 2 Điều 27 LCC: thành viên hợp danh chỉ được rút vốn khi được “ít nhất ba phần tư tổng số thành viên hợp danh” chấp thuận bằng văn bản và Văn phòng phải còn ít nhất 02 thành viên hợp danh. Với 04 thành viên, sự đồng ý của 01 thành viên khác là không đủ.","b":"Khoản 2 Điều 27 LCC"},{"id":"3.17","g":3,"lv":"VD","q":"Công chứng viên P chấm dứt tư cách thành viên hợp danh do tự nguyện rút vốn từ ngày 01/6/2025. P được tham gia thành lập Văn phòng công chứng mới từ khi nào?","o":["Ngay sau khi rút vốn","Sau ngày 01/6/2027 (hết 02 năm)","Sau 05 năm","Từ ngày 01/10/2026"],"a":1,"e":"Khoản 6 Điều 27 LCC: trong thời hạn 02 năm kể từ ngày chấm dứt tư cách thành viên hợp danh (do rút vốn), công chứng viên vẫn phải liên đới chịu trách nhiệm; hết thời hạn này mới được thành lập Văn phòng mới. P chỉ được thành lập từ sau 01/6/2027.","b":"Khoản 6 Điều 27 LCC"},{"id":"3.18","g":3,"lv":"VD","q":"Văn phòng công chứng R mới hoạt động được 18 tháng. Toàn bộ thành viên hợp danh muốn chuyển nhượng toàn bộ phần vốn góp cho hai công chứng viên khác. Việc này:","o":["Chưa được thực hiện vì Văn phòng phải hoạt động được ít nhất 02 năm","Được thực hiện nếu Sở Tư pháp đồng ý","Được thực hiện ngay","Chỉ được chuyển nhượng cho viên chức Phòng công chứng"],"a":0,"e":"Khoản 1 Điều 30 LCC: việc chuyển nhượng toàn bộ phần vốn góp của toàn bộ thành viên hợp danh chỉ được thực hiện “sau khi Văn phòng công chứng đã hoạt động được ít nhất 02 năm”. Văn phòng R mới hoạt động 18 tháng.","b":"Khoản 1 Điều 30 LCC"},{"id":"3.19","g":3,"lv":"VD","q":"Một Văn phòng công chứng có trụ sở tại Hà Nội và một Văn phòng công chứng có trụ sở tại tỉnh Hưng Yên muốn hợp nhất. Việc hợp nhất:","o":["Được thực hiện nếu hai Sở Tư pháp đồng ý","Chỉ được nếu chuyển thành Phòng công chứng","Không được thực hiện vì chỉ các Văn phòng có trụ sở trong cùng 01 tỉnh, thành phố trực thuộc trung ương mới được hợp nhất","Được thực hiện tự do"],"a":2,"e":"Khoản 1 Điều 29 LCC: chỉ các Văn phòng công chứng “có trụ sở trong cùng 01 tỉnh, thành phố trực thuộc trung ương” mới được hợp nhất, sáp nhập.","b":"Khoản 1 Điều 29 LCC"},{"id":"3.20","g":3,"lv":"VD","q":"Văn phòng công chứng S đã bồi thường cho khách hàng thiệt hại do lỗi của công chứng viên T; T đã nghỉ việc. Quyền của S là:","o":["Yêu cầu T hoàn trả khoản tiền đã bồi thường, kể cả khi T không còn là công chứng viên của S","Không được yêu cầu vì T đã nghỉ việc","Chỉ được yêu cầu Sở Tư pháp bồi thường","Chỉ được trừ vào tiền lương còn nợ T"],"a":0,"e":"Khoản 2 Điều 40 LCC: công chứng viên trực tiếp gây thiệt hại phải hoàn trả cho tổ chức hành nghề công chứng khoản tiền đã bồi thường, “kể cả trường hợp người đó không còn là công chứng viên” của tổ chức đó; nếu không hoàn trả, tổ chức có quyền yêu cầu Tòa án giải quyết.","b":"Khoản 2 Điều 40 LCC"},{"id":"4.01","g":4,"lv":"NB","q":"Thời hạn công chứng theo Luật Công chứng 2024 là:","o":["Ngay trong ngày tiếp nhận yêu cầu","Không quá 02 ngày làm việc; giao dịch phức tạp có thể kéo dài nhưng không quá 10 ngày làm việc","Không quá 05 ngày làm việc trong mọi trường hợp","Không quá 15 ngày"],"a":1,"e":"Khoản 2 Điều 45 LCC: thời hạn công chứng không quá 02 ngày làm việc; giao dịch có nội dung phức tạp thì có thể kéo dài nhưng không quá 10 ngày làm việc. Trường hợp bất khả kháng hoặc do phía người yêu cầu, các bên có thể thỏa thuận bằng văn bản về thời hạn.","b":"Khoản 2 Điều 45 LCC"},{"id":"4.02","g":4,"lv":"TH","q":"Khoảng thời gian nào sau đây KHÔNG tính vào thời hạn công chứng?","o":["Thời gian niêm yết việc tiếp nhận công chứng văn bản phân chia di sản","Thời gian công chứng viên soạn thảo văn bản","Thời gian kiểm tra giấy tờ trong hồ sơ","Thời gian các bên đọc lại dự thảo"],"a":0,"e":"Khoản 1 Điều 45 LCC: thời gian xác minh, giám định và thời gian niêm yết việc tiếp nhận công chứng văn bản phân chia di sản không tính vào thời hạn công chứng.","b":"Khoản 1 Điều 45 LCC"},{"id":"4.03","g":4,"lv":"TH","q":"Về đánh số trang và đóng dấu giáp lai văn bản công chứng, quy định đúng là:","o":["Không bắt buộc đóng dấu giáp lai","Chỉ văn bản về bất động sản mới phải đóng dấu giáp lai","Từ 02 trang trở lên phải đóng dấu giáp lai giữa các trang","Từ 02 trang trở lên phải đánh số thứ tự từng trang; từ 02 tờ trở lên phải đóng dấu giáp lai giữa các tờ"],"a":3,"e":"Điều 51 LCC phân biệt “trang” và “tờ”: văn bản có từ 02 trang trở lên thì phải đánh số thứ tự từng trang (khoản 1); văn bản có từ 02 tờ trở lên mới phải đóng dấu giáp lai giữa các tờ (khoản 2).","b":"Điều 51 LCC"},{"id":"4.04","g":4,"lv":"NB","q":"Các con số thể hiện thời điểm công chứng phải được ghi như thế nào?","o":["Chỉ bằng số","Theo lựa chọn của người yêu cầu công chứng","Cả bằng số và chữ, trừ trường hợp pháp luật có quy định khác","Chỉ bằng chữ"],"a":2,"e":"Khoản 2 Điều 47 LCC: các con số thể hiện thời điểm công chứng phải được ghi cả bằng số và chữ, trừ trường hợp pháp luật có quy định khác.","b":"Khoản 2 Điều 47 LCC"},{"id":"4.05","g":4,"lv":"NB","q":"Người làm chứng trong việc công chứng phải đáp ứng điều kiện nào?","o":["Là nhân viên của tổ chức hành nghề công chứng","Có bằng cử nhân luật","Có năng lực hành vi dân sự đầy đủ và không có quyền, lợi ích hoặc nghĩa vụ liên quan đến việc công chứng","Là người thân thích của người yêu cầu công chứng"],"a":2,"e":"Khoản 2 Điều 49 LCC: người làm chứng phải có năng lực hành vi dân sự đầy đủ, không thuộc trường hợp phải có người làm chứng và không có quyền, lợi ích hoặc nghĩa vụ liên quan đến việc công chứng.","b":"Khoản 2 Điều 49 LCC"},{"id":"4.06","g":4,"lv":"TH","q":"Người phiên dịch trong việc công chứng:","o":["Do công chứng viên chỉ định và công chứng viên chịu trách nhiệm về nội dung phiên dịch","Không bắt buộc khi người yêu cầu không thông thạo tiếng Việt","Do Sở Tư pháp cử","Do người yêu cầu công chứng mời và tự chịu trách nhiệm trước pháp luật về việc phiên dịch"],"a":3,"e":"Khoản 3 Điều 49 LCC: “Người phiên dịch do người yêu cầu công chứng mời và phải chịu trách nhiệm trước pháp luật về việc phiên dịch của mình”. Cần phân biệt với người làm chứng, có thể do công chứng viên chỉ định.","b":"Khoản 3 Điều 49 LCC"},{"id":"4.07","g":4,"lv":"NB","q":"Việc ký văn bản công chứng trước sự chứng kiến của công chứng viên phải:","o":["Được chụp ảnh và lưu trữ trong hồ sơ công chứng","Được ghi âm và gửi Sở Tư pháp","Có xác nhận của công an khu vực","Không có yêu cầu đặc biệt"],"a":0,"e":"Đoạn 2 khoản 1 Điều 50 LCC: việc ký văn bản công chứng trước sự chứng kiến của công chứng viên phải được chụp ảnh và lưu trữ trong hồ sơ công chứng. Yêu cầu về ảnh chụp được quy định chi tiết tại Điều 46 NĐ 104.","b":"Khoản 1 Điều 50 LCC; Điều 46 NĐ 104/2025/NĐ-CP"},{"id":"4.08","g":4,"lv":"TH","q":"Lỗi kỹ thuật trong văn bản công chứng được hiểu là:","o":["Sai sót làm thay đổi đối tượng giao dịch","Sai sót do các bên cung cấp thông tin không đúng","Mọi sai sót trong văn bản, kể cả sai về giá chuyển nhượng","Sai sót khi ghi chép, đánh máy, in ấn mà việc sửa lỗi không ảnh hưởng đến quyền, nghĩa vụ của người tham gia giao dịch"],"a":3,"e":"Khoản 1 Điều 52 LCC định nghĩa đúng như nội dung câu hỏi. Điểm mấu chốt là việc sửa lỗi không làm ảnh hưởng đến quyền, nghĩa vụ của người tham gia giao dịch; nếu ảnh hưởng thì phải làm thủ tục sửa đổi giao dịch theo Điều 53.","b":"Khoản 1 Điều 52, Điều 53 LCC"},{"id":"4.09","g":4,"lv":"NB","q":"Thời hạn lưu trữ hồ sơ công chứng đối với giao dịch có đối tượng là bất động sản là:","o":["Ít nhất 20 năm","Ít nhất 10 năm","Vĩnh viễn","Ít nhất 30 năm"],"a":3,"e":"Khoản 2 Điều 68 LCC: hồ sơ công chứng phải được lưu trữ ít nhất 30 năm đối với giao dịch có đối tượng là bất động sản và ít nhất 10 năm đối với các loại giao dịch khác, kể từ ngày văn bản công chứng có hiệu lực.","b":"Khoản 2 Điều 68 LCC"},{"id":"4.10","g":4,"lv":"TH","q":"Công chứng viên có được đưa vào lời chứng nội dung loại trừ trách nhiệm của mình không?","o":["Được, nếu giao dịch phức tạp","Được, nếu người yêu cầu công chứng đồng ý","Được, nếu Trưởng Văn phòng công chứng cho phép","Không được, kể cả khi người yêu cầu công chứng đồng ý"],"a":3,"e":"Khoản 3 Điều 48 LCC: công chứng viên “không được đưa vào lời chứng những nội dung nhằm trốn tránh, loại trừ trách nhiệm của mình”. Đây là quy định cấm, không phụ thuộc vào sự đồng ý của người yêu cầu công chứng.","b":"Khoản 3 Điều 48 LCC"},{"id":"4.11","g":4,"lv":"VD","q":"Ông A 85 tuổi, liệt nửa người, không thể đi lại, đề nghị công chứng viên đến nhà công chứng hợp đồng tặng cho nhà. Công chứng viên:","o":["Chỉ được nếu có văn bản đồng ý của Sở Tư pháp","Không được công chứng ngoài trụ sở trong mọi trường hợp","Được công chứng ngoài trụ sở và phải ghi rõ lý do trong lời chứng","Phải yêu cầu ông A ủy quyền cho người khác đến trụ sở"],"a":2,"e":"Điểm b khoản 2 Điều 46 LCC: việc công chứng có thể thực hiện ngoài trụ sở nếu người yêu cầu công chứng “không thể đi lại được vì lý do sức khỏe”. Lời chứng phải ghi rõ lý do công chứng ngoài trụ sở (điểm e khoản 1 Điều 48).","b":"Điểm b khoản 2 Điều 46, điểm e khoản 1 Điều 48 LCC"},{"id":"4.12","g":4,"lv":"VD","q":"Chị B đang nuôi con 8 tháng tuổi, đề nghị công chứng tại nhà riêng có địa chỉ cụ thể. Đề nghị này:","o":["Là lý do chính đáng để công chứng ngoài trụ sở","Chỉ được chấp nhận nếu con dưới 06 tháng tuổi","Chỉ được chấp nhận tại Phòng công chứng","Không phải lý do để công chứng ngoài trụ sở"],"a":0,"e":"Điểm d khoản 2 Điều 46 LCC cho phép công chứng ngoài trụ sở khi có “lý do chính đáng khác theo quy định của Chính phủ”. Điều 43 NĐ 104 xác định phụ nữ đang mang thai hoặc nuôi con nhỏ dưới 12 tháng tuổi là lý do chính đáng; việc công chứng phải thực hiện tại địa điểm có địa chỉ cụ thể.","b":"Điểm d khoản 2 Điều 46 LCC; Điều 43 NĐ 104/2025/NĐ-CP"},{"id":"4.13","g":4,"lv":"VD","q":"Ông C không biết đọc chữ nhưng ký được tên, yêu cầu công chứng hợp đồng mua bán xe. Việc công chứng:","o":["Không cần người làm chứng vì ông C ký được","Bắt buộc phải có người làm chứng","Phải từ chối công chứng","Chỉ cần điểm chỉ thay chữ ký"],"a":1,"e":"Khoản 2 Điều 49 LCC: việc công chứng phải có người làm chứng khi người yêu cầu “không đọc được hoặc không nghe được hoặc không ký được và không điểm chỉ được”. Các căn cứ này độc lập với nhau: ông C ký được nhưng không đọc được nên vẫn phải có người làm chứng.","b":"Khoản 2 Điều 49 LCC"},{"id":"4.14","g":4,"lv":"VD","q":"Bà D thuộc trường hợp phải có người làm chứng nhưng không mời được; công chứng viên cũng không chỉ định được người làm chứng. Công chứng viên phải:","o":["Cho nhân viên Văn phòng ký làm chứng","Công chứng và ghi rõ lý do vào lời chứng","Tự mình làm người làm chứng","Từ chối công chứng"],"a":3,"e":"Khoản 2 Điều 49 LCC: người làm chứng do người yêu cầu mời hoặc do công chứng viên chỉ định; “trường hợp công chứng viên không chỉ định được người làm chứng thì từ chối công chứng”.","b":"Khoản 2 Điều 49 LCC"},{"id":"4.15","g":4,"lv":"VD","q":"Bà E bán căn nhà cho con trai và cần người làm chứng. Con trai bà E (bên mua):","o":["Được làm chứng nếu công chứng viên chỉ định","Được làm chứng nếu bà E đồng ý","Được làm chứng vì có năng lực hành vi dân sự đầy đủ","Không được làm người làm chứng vì có quyền, lợi ích liên quan đến việc công chứng"],"a":3,"e":"Khoản 2 Điều 49 LCC: người làm chứng không được có quyền, lợi ích hoặc nghĩa vụ liên quan đến việc công chứng. Con trai bà E là bên mua nên không thể làm chứng, dù có năng lực hành vi dân sự đầy đủ.","b":"Khoản 2 Điều 49 LCC"},{"id":"4.16","g":4,"lv":"VD","q":"Sau khi công chứng, công chứng viên F phát hiện hợp đồng đánh máy sai một chữ số trong số Giấy chứng nhận (rõ ràng là lỗi đánh máy). Cách xử lý đúng là:","o":["Sửa lỗi kỹ thuật tại tổ chức đã công chứng và thông báo bằng văn bản cho các bên trong 03 ngày làm việc kể từ ngày hoàn thành việc sửa lỗi","Lập hợp đồng mới thay thế, các bên ký lại toàn bộ","Không cần sửa vì không ảnh hưởng hiệu lực","Yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu"],"a":0,"e":"Khoản 2 Điều 52 LCC: việc sửa lỗi kỹ thuật thực hiện tại tổ chức hành nghề công chứng đã công chứng. Đoạn 2 khoản 3 Điều 52: việc sửa lỗi phải được thông báo bằng văn bản cho người tham gia giao dịch trong thời hạn 03 ngày làm việc kể từ ngày hoàn thành việc sửa lỗi.","b":"Khoản 2, khoản 3 Điều 52 LCC"},{"id":"4.17","g":4,"lv":"VD","q":"Hợp đồng mua bán căn hộ giữa A và B đã được công chứng. A muốn hủy hợp đồng nhưng B chưa đồng ý. Công chứng viên:","o":["Được công chứng nếu A có lý do chính đáng","Được công chứng văn bản hủy bỏ theo yêu cầu của A","Được công chứng nếu A bồi thường cho B","Không được công chứng văn bản hủy bỏ vì cần thỏa thuận hoặc cam kết bằng văn bản của tất cả những người đã ký kết"],"a":3,"e":"Đoạn 1 khoản 1 Điều 53 LCC: việc công chứng văn bản sửa đổi, bổ sung, thỏa thuận chấm dứt hợp đồng đã công chứng chỉ được thực hiện khi có sự thỏa thuận hoặc cam kết bằng văn bản của tất cả những người đã ký kết hợp đồng. B chưa đồng ý thì không thể công chứng.","b":"Khoản 1 Điều 53 LCC"},{"id":"4.18","g":4,"lv":"VD","q":"Văn phòng công chứng X đã chấm dứt hoạt động, hồ sơ được bàn giao cho Văn phòng công chứng Y lưu trữ. Việc công chứng văn bản sửa đổi hợp đồng do X công chứng trước đây do ai thực hiện?","o":["Sở Tư pháp","Công chứng viên của Văn phòng công chứng Y (đang lưu trữ hồ sơ)","Không thể sửa đổi, phải lập hợp đồng mới","Bất kỳ tổ chức hành nghề công chứng nào"],"a":1,"e":"Khoản 2 Điều 53 LCC: trường hợp tổ chức đã công chứng chấm dứt hoạt động, chuyển đổi hoặc giải thể thì “công chứng viên của tổ chức hành nghề công chứng đang lưu trữ hồ sơ công chứng thực hiện”.","b":"Khoản 2 Điều 53 LCC"},{"id":"4.19","g":4,"lv":"VD","q":"Công chứng viên nghi ngờ người bán không còn năng lực hành vi dân sự; người bán từ chối giám định. Công chứng viên:","o":["Chuyển hồ sơ cho Tòa án quyết định","Từ chối công chứng","Vẫn phải công chứng vì đã đủ giấy tờ","Công chứng và ghi chú nghi ngờ vào lời chứng"],"a":1,"e":"Khoản 4 Điều 42 LCC: khi có nghi ngờ về năng lực hành vi dân sự, công chứng viên đề nghị làm rõ hoặc xác minh, giám định. Nếu người yêu cầu không làm rõ được và từ chối xác minh, giám định thì công chứng viên từ chối công chứng; việc xuất trình đủ giấy tờ không thay thế điều kiện về năng lực hành vi.","b":"Khoản 4 Điều 42 LCC"},{"id":"4.20","g":4,"lv":"TH","q":"Chủ thể nào sau đây có quyền đề nghị Tòa án tuyên bố văn bản công chứng vô hiệu?","o":["Chỉ người yêu cầu công chứng","Chỉ công chứng viên đã công chứng","Chỉ Viện kiểm sát","Người làm chứng, người có quyền lợi, nghĩa vụ liên quan và cơ quan nhà nước có thẩm quyền (cùng với công chứng viên, người yêu cầu, người phiên dịch)"],"a":3,"e":"Điều 54 LCC liệt kê những người có quyền đề nghị Tòa án tuyên bố văn bản công chứng vô hiệu, gồm: công chứng viên đã thực hiện việc công chứng, người yêu cầu công chứng, người làm chứng, người phiên dịch, người có quyền lợi, nghĩa vụ liên quan và cơ quan nhà nước có thẩm quyền.","b":"Điều 54 LCC"},{"id":"5.01","g":5,"lv":"NB","q":"Thủ tục công chứng hợp đồng thế chấp bất động sản, hợp đồng ủy quyền, di chúc, văn bản phân chia di sản, văn bản từ chối nhận di sản được thực hiện theo:","o":["Chỉ quy định riêng, không áp dụng thủ tục chung","Bộ luật Dân sự","Quy chế nội bộ của tổ chức hành nghề công chứng","Thủ tục chung về công chứng và các quy định riêng đối với từng loại giao dịch"],"a":3,"e":"Điều 55 LCC: thủ tục công chứng các giao dịch này được thực hiện theo quy định tại Mục 1 (thủ tục chung) và Mục 2 Chương V (quy định riêng đối với từng loại giao dịch).","b":"Điều 55 LCC"},{"id":"5.02","g":5,"lv":"TH","q":"Người lập di chúc đang ốm có thể ủy quyền cho người khác ký vào bản di chúc được công chứng không?","o":["Không; phải tự mình ký hoặc ký và điểm chỉ; nếu không ký, không điểm chỉ được thì phải có người làm chứng","Được, nếu công chứng viên đồng ý","Được, nếu có giấy xác nhận của bệnh viện","Được, nếu người được ủy quyền là con của người lập di chúc"],"a":0,"e":"Khoản 1 Điều 58 LCC: người lập di chúc “không được ủy quyền cho người khác mà phải tự mình ký hoặc ký và điểm chỉ”. Nếu không ký và không điểm chỉ được thì phải có người làm chứng; nếu không đi lại được thì có thể công chứng ngoài trụ sở.","b":"Khoản 1 Điều 58 LCC"},{"id":"5.03","g":5,"lv":"TH","q":"Di chúc đã được công chứng được sửa đổi, bổ sung, thay thế, hủy bỏ tại:","o":["Chỉ tại tổ chức đã công chứng di chúc","Chỉ tại Tòa án","Bất kỳ tổ chức hành nghề công chứng nào (nếu di chúc trước đang lưu giữ tại một tổ chức thì phải thông báo cho tổ chức đó)","Chỉ tại Ủy ban nhân dân cấp xã"],"a":2,"e":"Khoản 4 Điều 58 LCC: người lập di chúc có thể yêu cầu công chứng viên “của bất kỳ tổ chức hành nghề công chứng nào” công chứng việc sửa đổi, bổ sung, thay thế, hủy bỏ di chúc. Nếu di chúc trước đang được lưu giữ tại một tổ chức thì phải thông báo cho tổ chức đó.","b":"Khoản 4 Điều 58 LCC"},{"id":"5.04","g":5,"lv":"NB","q":"Văn bản phân chia di sản đã được công chứng có giá trị:","o":["Là căn cứ để cơ quan nhà nước có thẩm quyền đăng ký việc chuyển quyền sử dụng đất, quyền sở hữu tài sản cho người được hưởng di sản","Chỉ có giá trị giữa những người thừa kế","Thay thế bản án của Tòa án về thừa kế","Chỉ có giá trị tham khảo"],"a":0,"e":"Khoản 6 Điều 59 LCC: văn bản phân chia di sản đã được công chứng là căn cứ để cơ quan nhà nước có thẩm quyền đăng ký việc chuyển quyền sử dụng đất, quyền sở hữu tài sản cho người được hưởng di sản.","b":"Khoản 6 Điều 59 LCC"},{"id":"5.05","g":5,"lv":"TH","q":"Trường hợp chỉ có 01 người thừa kế yêu cầu công chứng văn bản nhận di sản:","o":["Vẫn phải thực hiện thủ tục niêm yết việc tiếp nhận công chứng","Không phải niêm yết","Phải có xác nhận của Tòa án","Chỉ niêm yết nếu di sản là bất động sản"],"a":0,"e":"Khoản 5 Điều 59 LCC: thủ tục tại các khoản 2, 3 và 4 (gồm cả niêm yết) “cũng áp dụng đối với trường hợp … chỉ có 01 người thừa kế”. Niêm yết giúp phát hiện người thừa kế khác bị bỏ sót.","b":"Khoản 5 Điều 59 LCC"},{"id":"5.06","g":5,"lv":"NB","q":"Văn bản về việc tiếp nhận công chứng văn bản phân chia di sản phải được niêm yết trong thời hạn:","o":["60 ngày","15 ngày kể từ ngày niêm yết","07 ngày","30 ngày"],"a":1,"e":"Khoản 1 Điều 44 NĐ 104: văn bản về việc tiếp nhận công chứng văn bản phân chia di sản phải được niêm yết trong thời hạn 15 ngày kể từ ngày niêm yết. Công chứng viên chỉ được công chứng sau khi có xác nhận đã hoàn thành niêm yết và không có khiếu nại, tố cáo (khoản 4 Điều 59 LCC).","b":"Khoản 1 Điều 44 NĐ 104/2025/NĐ-CP; khoản 4 Điều 59 LCC"},{"id":"5.07","g":5,"lv":"NB","q":"Khi nhận lưu giữ di chúc, công chứng viên phải:","o":["Chỉ cần ghi vào sổ, không cần niêm phong","Công khai nội dung di chúc cho người thừa kế","Gửi bản sao di chúc cho Ủy ban nhân dân cấp xã","Niêm phong bản di chúc trước mặt người lập di chúc, ghi giấy nhận lưu giữ và giao cho người lập di chúc"],"a":3,"e":"Khoản 1 Điều 61 LCC: khi nhận lưu giữ di chúc, công chứng viên phải niêm phong bản di chúc trước mặt người lập di chúc, ghi giấy nhận lưu giữ và giao cho người lập di chúc.","b":"Khoản 1 Điều 61 LCC"},{"id":"5.08","g":5,"lv":"TH","q":"Bất động sản đã thế chấp, hợp đồng thế chấp đã công chứng; nay tiếp tục thế chấp cho nghĩa vụ khác. Hợp đồng thế chấp tiếp theo được công chứng tại:","o":["Bất kỳ tổ chức nào trên cả nước","Tổ chức hành nghề công chứng đã công chứng hợp đồng thế chấp lần đầu (trừ khi tổ chức đó chấm dứt hoạt động, chuyển đổi, giải thể)","Ngân hàng nhận thế chấp","Bất kỳ tổ chức nào trong tỉnh nơi có bất động sản"],"a":1,"e":"Khoản 2 Điều 56 LCC: các hợp đồng thế chấp tiếp theo “phải được công chứng tại tổ chức hành nghề công chứng đã công chứng hợp đồng thế chấp lần đầu”. Chỉ khi tổ chức đó chấm dứt hoạt động, chuyển đổi, giải thể thì mới do tổ chức đang lưu trữ hồ sơ thực hiện.","b":"Khoản 2 Điều 56 LCC"},{"id":"5.09","g":5,"lv":"TH","q":"Công chứng viên là người thừa kế theo pháp luật của người lập di chúc:","o":["Được công chứng nếu có người làm chứng","Được công chứng nếu không phải người thừa kế theo di chúc","Không được công chứng di chúc đó","Được công chứng nếu người lập di chúc đồng ý"],"a":2,"e":"Khoản 1 Điều 637 BLDS: người thừa kế theo di chúc hoặc theo pháp luật của người lập di chúc không được công chứng, chứng thực di chúc. Điểm c khoản 1 Điều 9 LCC cũng cấm công chứng viên công chứng giao dịch liên quan đến tài sản, lợi ích của bản thân mình.","b":"Khoản 1 Điều 637 BLDS 2015; điểm c khoản 1 Điều 9 LCC"},{"id":"5.10","g":5,"lv":"NB","q":"Yêu cầu về hình thức và thời điểm từ chối nhận di sản là:","o":["Thể hiện bất cứ lúc nào kể cả sau khi chia di sản","Lập thành văn bản và thể hiện trước thời điểm phân chia di sản","Có thể tuyên bố miệng trước các đồng thừa kế","Phải được Tòa án chấp thuận"],"a":1,"e":"Khoản 2 Điều 620 BLDS: việc từ chối nhận di sản phải được lập thành văn bản và phải được thể hiện trước thời điểm phân chia di sản. Thủ tục công chứng văn bản từ chối nhận di sản thực hiện theo Điều 60 LCC.","b":"Khoản 2 Điều 620 BLDS 2015; Điều 60 LCC"},{"id":"5.11","g":5,"lv":"VD","q":"Ông A cư trú tại Hà Nội, có thửa đất tại Đà Nẵng, chuyển nhượng cho bà B. Hợp đồng chuyển nhượng phải công chứng tại:","o":["Bất kỳ tổ chức nào trên cả nước","Bất kỳ Văn phòng công chứng nào tại Hà Nội","Tổ chức hành nghề công chứng có trụ sở tại Đà Nẵng (nơi có bất động sản)","Nơi cư trú của bên mua"],"a":2,"e":"Điều 44 LCC: công chứng viên chỉ được công chứng giao dịch về bất động sản trong phạm vi tỉnh, thành phố nơi tổ chức hành nghề công chứng đặt trụ sở. Thửa đất ở Đà Nẵng nên phải công chứng tại tổ chức có trụ sở tại Đà Nẵng; nơi cư trú của các bên không có ý nghĩa.","b":"Điều 44 LCC"},{"id":"5.12","g":5,"lv":"VD","q":"Bà C cư trú tại Hà Nội lập di chúc định đoạt căn nhà tại TP. Hồ Chí Minh, yêu cầu công chứng tại Văn phòng công chứng ở Hà Nội. Việc công chứng:","o":["Phải chứng thực tại Ủy ban nhân dân cấp xã nơi có nhà","Chỉ hợp lệ nếu có ủy quyền của Sở Tư pháp TP. Hồ Chí Minh","Đúng thẩm quyền vì công chứng di chúc được loại trừ khỏi giới hạn phạm vi tỉnh","Sai thẩm quyền, phải công chứng tại TP. Hồ Chí Minh"],"a":2,"e":"Điều 44 LCC loại trừ trường hợp “công chứng di chúc” khỏi giới hạn phạm vi tỉnh. Bà C được công chứng di chúc tại Hà Nội dù căn nhà ở TP. Hồ Chí Minh.","b":"Điều 44 LCC"},{"id":"5.13","g":5,"lv":"VD","q":"Ông D ở Cần Thơ lập văn bản ủy quyền cho con ở Hà Nội bán căn nhà tại Hà Nội. Văn bản ủy quyền có thể công chứng tại:","o":["Chỉ tại Phòng công chứng","Không cần công chứng","Văn phòng công chứng ở Cần Thơ, vì văn bản ủy quyền liên quan đến quyền đối với bất động sản được loại trừ khỏi giới hạn phạm vi tỉnh","Chỉ tại Hà Nội nơi có căn nhà"],"a":2,"e":"Điều 44 LCC loại trừ “văn bản ủy quyền liên quan đến việc thực hiện các quyền đối với bất động sản” khỏi giới hạn phạm vi tỉnh. Văn bản ủy quyền có thể công chứng tại Cần Thơ; còn hợp đồng mua bán nhà sau này phải công chứng tại Hà Nội.","b":"Điều 44 LCC"},{"id":"5.14","g":5,"lv":"VD","q":"Khi yêu cầu công chứng văn bản phân chia di sản là quyền sử dụng đất (thừa kế theo pháp luật), ngoài giấy tờ chung, người thừa kế phải nộp:","o":["Bản án của Tòa án về chia thừa kế","Chỉ giấy chứng tử","Xác nhận của Ủy ban nhân dân cấp xã về người thừa kế","Giấy chứng tử (hoặc giấy tờ chứng minh người để lại di sản đã chết), giấy tờ chứng minh quan hệ với người để lại di sản và giấy tờ chứng minh quyền sử dụng đất của người đó"],"a":3,"e":"Khoản 2 Điều 59 LCC: ngoài giấy tờ chung, hồ sơ phải có giấy chứng tử hoặc giấy tờ khác chứng minh người để lại di sản đã chết; giấy tờ chứng minh quan hệ (thừa kế theo pháp luật); giấy tờ chứng minh quyền sử dụng đất của người để lại di sản.","b":"Khoản 2 Điều 59 LCC"},{"id":"5.15","g":5,"lv":"VD","q":"Ông E đang nguy kịch tại bệnh viện, yêu cầu công chứng di chúc nhưng không xuất trình được Giấy chứng nhận quyền sử dụng đất. Công chứng viên:","o":["Chỉ được chứng thực chữ ký","Được công chứng mà không phải xuất trình đủ giấy tờ, nhưng phải ghi rõ trong văn bản công chứng","Phải từ chối vì hồ sơ không đủ giấy tờ","Phải chờ người thân mang giấy tờ đến"],"a":1,"e":"Đoạn 1 khoản 3 Điều 58 LCC: trường hợp tính mạng người lập di chúc bị cái chết đe dọa thì “không phải xuất trình đủ giấy tờ” nhưng phải ghi rõ trong văn bản công chứng. Việc công chứng tại bệnh viện có căn cứ tại điểm b khoản 2 Điều 46 LCC.","b":"Khoản 3 Điều 58, điểm b khoản 2 Điều 46 LCC"},{"id":"5.16","g":5,"lv":"VD","q":"Tiếp tình huống: di chúc của ông E đã được công chứng; 04 tháng sau ông hồi phục nhưng không nộp bổ sung đủ giấy tờ. Văn bản công chứng di chúc:","o":["Vẫn có hiệu lực","Có hiệu lực nếu Tòa án công nhận","Chỉ hiệu lực đối với phần di sản có giấy tờ","Không có hiệu lực vì sau 03 tháng không còn nguy hiểm đến tính mạng mà không nộp đủ giấy tờ"],"a":3,"e":"Đoạn 2 khoản 3 Điều 58 LCC: sau 03 tháng kể từ thời điểm lập di chúc mà người lập di chúc không còn nguy hiểm đến tính mạng thì phải nộp đủ giấy tờ; nếu không nộp đủ “thì văn bản công chứng di chúc không có hiệu lực”.","b":"Khoản 3 Điều 58 LCC"},{"id":"5.17","g":5,"lv":"VD","q":"Hợp đồng mua bán căn hộ chung cư thương mại giữa hai cá nhân:","o":["Chỉ cần lập văn bản có người làm chứng","Chỉ cần đăng ký với chủ đầu tư","Không bắt buộc công chứng, chứng thực","Phải được công chứng hoặc chứng thực"],"a":3,"e":"Khoản 1 Điều 164 LNO: trường hợp mua bán, tặng cho, đổi, góp vốn, thế chấp nhà ở thì phải thực hiện công chứng hoặc chứng thực hợp đồng, trừ các trường hợp loại trừ tại khoản 2. Mua bán căn hộ thương mại giữa hai cá nhân không thuộc ngoại lệ.","b":"Khoản 1 Điều 164 Luật Nhà ở 2023"},{"id":"5.18","g":5,"lv":"VD","q":"Hợp đồng thuê nhà ở giữa hai cá nhân:","o":["Không bắt buộc công chứng, chứng thực, trừ trường hợp các bên có nhu cầu","Bắt buộc phải công chứng hoặc chứng thực","Bắt buộc chứng thực tại Ủy ban nhân dân cấp xã","Bắt buộc đăng ký tại cơ quan thuế mới có hiệu lực"],"a":0,"e":"Khoản 2 Điều 164 LNO: đối với trường hợp thuê, mượn, cho ở nhờ, ủy quyền quản lý nhà ở thì không bắt buộc phải công chứng, chứng thực hợp đồng, trừ trường hợp các bên có nhu cầu.","b":"Khoản 2 Điều 164 Luật Nhà ở 2023"},{"id":"5.19","g":5,"lv":"VD","q":"Anh F và chị G sắp kết hôn, lựa chọn chế độ tài sản theo thỏa thuận. Văn bản thỏa thuận phải:","o":["Lập sau khi đăng ký kết hôn","Lập trước khi kết hôn, bằng văn bản có công chứng hoặc chứng thực","Lập bằng lời nói trước người làm chứng","Đăng ký tại Tòa án"],"a":1,"e":"Điều 47 LHNĐ: trường hợp hai bên kết hôn lựa chọn chế độ tài sản theo thỏa thuận thì thỏa thuận này phải được lập trước khi kết hôn, bằng hình thức văn bản có công chứng hoặc chứng thực.","b":"Điều 47 Luật HNGĐ 2014"},{"id":"5.20","g":5,"lv":"VD","q":"Hợp đồng chuyển nhượng quyền sử dụng đất đã công chứng tại Văn phòng công chứng X (đang hoạt động); hai bên thống nhất sửa giá chuyển nhượng. Văn bản sửa đổi được công chứng bởi:","o":["Bất kỳ tổ chức hành nghề công chứng nào","Công chứng viên của Văn phòng công chứng X","Cơ quan đăng ký đất đai","Ủy ban nhân dân cấp xã nơi có đất"],"a":1,"e":"Khoản 2 Điều 53 LCC: việc công chứng văn bản sửa đổi, bổ sung giao dịch đã được công chứng do công chứng viên của tổ chức hành nghề công chứng nơi đã thực hiện việc công chứng đó tiến hành. Khoản 3 Điều 53 quy định thủ tục thực hiện như thủ tục công chứng giao dịch.","b":"Khoản 2, khoản 3 Điều 53 LCC"},{"id":"6.01","g":6,"lv":"NB","q":"Thời hạn thực hiện yêu cầu chứng thực (trường hợp thông thường) là:","o":["Ngay trong ngày tiếp nhận; hoặc trong ngày làm việc tiếp theo nếu tiếp nhận sau 15 giờ","Không quá 05 ngày làm việc","Không quá 03 ngày làm việc","Trong vòng 24 giờ"],"a":0,"e":"Điều 7 NĐ 23: thời hạn thực hiện yêu cầu chứng thực phải được bảo đảm ngay trong ngày tiếp nhận hoặc trong ngày làm việc tiếp theo nếu tiếp nhận sau 15 giờ; trừ trường hợp quy định tại các Điều 21, 33 và 37 (gia hạn chứng thực bản sao, chữ ký người dịch, hợp đồng).","b":"Điều 7 NĐ 23/2015"},{"id":"6.02","g":6,"lv":"TH","q":"Người yêu cầu chứng thực bản sao từ bản chính được chứng thực tại:","o":["Chỉ tại Ủy ban nhân dân cấp xã nơi cư trú","Chỉ tại Phòng Tư pháp","Bất kỳ cơ quan, tổ chức có thẩm quyền nào thuận tiện, không phụ thuộc nơi cư trú","Chỉ tại nơi cấp bản chính"],"a":2,"e":"Khoản 5 Điều 5 NĐ 23 (đã sửa đổi): việc chứng thực bản sao từ bản chính không phụ thuộc vào nơi cư trú của người yêu cầu. Khoản 1 Điều 8 NĐ 23 cũng cho phép người yêu cầu chứng thực tại bất kỳ cơ quan, tổ chức có thẩm quyền nào thuận tiện nhất.","b":"Khoản 5 Điều 5, khoản 1 Điều 8 NĐ 23/2015 (đã sửa đổi)"},{"id":"6.03","g":6,"lv":"TH","q":"Người thực hiện chứng thực KHÔNG được chứng thực hợp đồng liên quan đến tài sản, lợi ích của người nào sau đây?","o":["Hàng xóm","Anh ruột của vợ mình","Bạn học cũ","Đồng nghiệp cùng cơ quan"],"a":1,"e":"Khoản 3 Điều 9 NĐ 23: người thực hiện chứng thực không được chứng thực hợp đồng, giao dịch, chữ ký liên quan đến tài sản, lợi ích của bản thân hoặc người thân thích, trong đó có “anh chị em ruột của vợ hoặc chồng”.","b":"Khoản 3 Điều 9 NĐ 23/2015"},{"id":"6.04","g":6,"lv":"NB","q":"Nội dung bắt buộc của văn bản chứng thực là:","o":["Lời chứng","Ảnh chụp người yêu cầu","Xác nhận của công an","Chữ ký của người làm chứng"],"a":0,"e":"Khoản 1 Điều 12 NĐ 23: “Lời chứng là nội dung bắt buộc của văn bản chứng thực”. Mẫu lời chứng hiện hành được ban hành kèm theo NĐ 280/2025.","b":"Khoản 1 Điều 12 NĐ 23/2015"},{"id":"6.05","g":6,"lv":"NB","q":"Sổ chứng thực được bảo quản, lưu trữ tại trụ sở cơ quan, tổ chức thực hiện chứng thực trong thời hạn:","o":["Vĩnh viễn","30 năm","10 năm","20 năm"],"a":0,"e":"Khoản 1 Điều 14 NĐ 23: sổ chứng thực là tài liệu lưu trữ của Nhà nước, được bảo quản, lưu trữ vĩnh viễn tại trụ sở cơ quan, tổ chức thực hiện chứng thực.","b":"Khoản 1 Điều 14 NĐ 23/2015"},{"id":"6.06","g":6,"lv":"TH","q":"Thời hạn lưu trữ bản chính hợp đồng, giao dịch đã chứng thực kèm theo hồ sơ là:","o":["05 năm","02 năm","Vĩnh viễn","20 năm"],"a":3,"e":"Khoản 3 Điều 14 NĐ 23: đối với việc chứng thực hợp đồng, giao dịch, cơ quan thực hiện chứng thực phải lưu một bản chính kèm theo hồ sơ, thời hạn lưu trữ là 20 năm. Cần phân biệt với chứng thực chữ ký (lưu 02 năm, khoản 2 Điều 14).","b":"Khoản 2, khoản 3 Điều 14 NĐ 23/2015"},{"id":"6.07","g":6,"lv":"TH","q":"Việc chứng thực được thực hiện ngoài trụ sở trong trường hợp nào?","o":["Chứng thực di chúc, hợp đồng, giao dịch, chữ ký mà người yêu cầu già yếu, không thể đi lại, đang bị tạm giữ, tạm giam, thi hành án phạt tù hoặc có lý do chính đáng khác","Không có trường hợp nào","Bất kỳ khi nào người yêu cầu trả thêm phí","Chứng thực bản sao từ bản chính theo yêu cầu"],"a":0,"e":"Khoản 1 Điều 10 NĐ 23: việc chứng thực được thực hiện tại trụ sở, trừ trường hợp chứng thực di chúc, hợp đồng, giao dịch, chữ ký mà người yêu cầu già yếu, không thể đi lại được, đang bị tạm giữ, tạm giam, thi hành án phạt tù hoặc có lý do chính đáng khác.","b":"Khoản 1 Điều 10 NĐ 23/2015"},{"id":"6.08","g":6,"lv":"NB","q":"Khi từ chối chứng thực, người thực hiện chứng thực phải:","o":["Không phải giải thích","Chỉ cần thông báo miệng","Báo cáo Sở Tư pháp","Giải thích rõ lý do bằng văn bản cho người yêu cầu chứng thực"],"a":3,"e":"Điều 9 NĐ 23 quy định trong trường hợp từ chối chứng thực, người thực hiện chứng thực phải giải thích rõ lý do bằng văn bản cho người yêu cầu chứng thực.","b":"Điều 9 NĐ 23/2015"},{"id":"6.09","g":6,"lv":"NB","q":"Ngôn ngữ dùng trong chứng thực hợp đồng, giao dịch là:","o":["Tiếng Việt; người không thông thạo tiếng Việt phải có người phiên dịch","Tiếng Việt, không cho phép phiên dịch","Ngôn ngữ do người yêu cầu chọn","Tiếng Việt hoặc tiếng Anh"],"a":0,"e":"Điều 11 NĐ 23: tiếng nói và chữ viết dùng trong chứng thực hợp đồng, giao dịch là tiếng Việt; trường hợp người yêu cầu không thông thạo tiếng Việt thì phải có người phiên dịch.","b":"Điều 11 NĐ 23/2015"},{"id":"6.10","g":6,"lv":"TH","q":"Công chứng viên được thực hiện những việc chứng thực nào?","o":["Chứng thực bản sao từ bản chính, chứng thực chữ ký trong giấy tờ, văn bản, chứng thực chữ ký người dịch","Không được thực hiện bất kỳ việc chứng thực nào","Chỉ chứng thực hợp đồng liên quan đến đất đai","Chỉ cấp bản sao từ sổ gốc"],"a":0,"e":"Điểm c khoản 1 Điều 18 LCC: công chứng viên “được chứng thực bản sao từ bản chính, chứng thực chữ ký trong giấy tờ, văn bản, chứng thực chữ ký người dịch”. Điều 5 NĐ 23 cũng xác định công chứng viên là một trong những chủ thể có thẩm quyền chứng thực.","b":"Điểm c khoản 1 Điều 18 LCC; Điều 5 NĐ 23/2015"},{"id":"6.11","g":6,"lv":"VD","q":"Anh A cư trú ở Hà Nội đến Ủy ban nhân dân một xã ở Bắc Ninh để chứng thực bản sao bằng tốt nghiệp; xã từ chối vì anh không cư trú tại địa bàn. Việc từ chối:","o":["Đúng nếu anh A không có giấy tạm trú","Đúng quy định","Đúng vì bằng tốt nghiệp do trường ở Hà Nội cấp","Trái quy định vì chứng thực bản sao từ bản chính không phụ thuộc nơi cư trú"],"a":3,"e":"Theo khoản 5 Điều 5 NĐ 23 (đã sửa đổi), chứng thực bản sao từ bản chính không phụ thuộc nơi cư trú. Ủy ban nhân dân xã từ chối với lý do anh A không cư trú tại địa bàn là trái quy định.","b":"Khoản 5 Điều 5 NĐ 23/2015 (đã sửa đổi)"},{"id":"6.12","g":6,"lv":"VD","q":"Ông B và bà C chuyển nhượng thửa đất tại xã Y và muốn chứng thực hợp đồng. Thẩm quyền chứng thực thuộc:","o":["Ủy ban nhân dân bất kỳ xã, phường nào thuận tiện","Ủy ban nhân dân cấp tỉnh","Ủy ban nhân dân cấp xã nơi có đất (xã Y)","Nơi cư trú của bên mua"],"a":2,"e":"Theo Điều 5 NĐ 23 (đã sửa đổi), chứng thực hợp đồng, giao dịch liên quan đến quyền của người sử dụng đất được thực hiện tại Ủy ban nhân dân cấp xã nơi có đất. Đây không phải trường hợp “không phụ thuộc nơi cư trú” như chứng thực bản sao hay chữ ký.","b":"Điều 5 NĐ 23/2015 (đã sửa đổi)"},{"id":"6.13","g":6,"lv":"VD","q":"Chủ tịch Ủy ban nhân dân xã M chứng thực chữ ký của em ruột mình trên giấy ủy quyền nhận hộ lương hưu (không có thù lao). Việc chứng thực:","o":["Trái quy định vì liên quan đến lợi ích của em ruột","Đúng nếu có người làm chứng","Đúng vì chỉ chứng thực chữ ký","Đúng quy định vì ủy quyền không có thù lao"],"a":0,"e":"Khoản 3 Điều 9 NĐ 23 cấm người thực hiện chứng thực chứng thực chữ ký có liên quan đến tài sản, lợi ích của anh chị em ruột. Lương hưu là lợi ích của người em; việc giấy ủy quyền không có thù lao không làm thay đổi điều cấm này.","b":"Khoản 3 Điều 9 NĐ 23/2015"},{"id":"6.14","g":6,"lv":"VD","q":"Chị D cùng lúc yêu cầu chứng thực bản sao từ 05 loại bản chính, mỗi loại 10 bản. Cơ quan chứng thực không đáp ứng ngay được. Thời hạn có thể:","o":["Không được kéo dài","Kéo dài thêm không quá 02 ngày làm việc hoặc dài hơn theo thỏa thuận bằng văn bản","Kéo dài thêm 10 ngày làm việc","Kéo dài tùy ý cơ quan chứng thực"],"a":1,"e":"Điều 21 NĐ 23: trường hợp cùng một lúc yêu cầu chứng thực bản sao từ nhiều loại bản chính, số lượng nhiều bản sao mà không đáp ứng được thời hạn tại Điều 7 thì được kéo dài thêm không quá 02 ngày làm việc hoặc dài hơn theo thỏa thuận bằng văn bản.","b":"Điều 21 NĐ 23/2015"},{"id":"6.15","g":6,"lv":"VD","q":"14 giờ ngày thứ Hai, ông E yêu cầu chứng thực 01 bản sao thẻ căn cước. Thời hạn trả kết quả đúng quy định là:","o":["Ngày thứ Ba","Ngay trong ngày thứ Hai","Ngày thứ Tư","Trong tuần làm việc"],"a":1,"e":"Theo Điều 7 NĐ 23, yêu cầu tiếp nhận lúc 14 giờ (trước 15 giờ) phải được giải quyết ngay trong ngày thứ Hai. Chỉ 01 bản sao nên không thuộc trường hợp gia hạn tại Điều 21; hẹn trả vào thứ Tư là trái quy định.","b":"Điều 7, Điều 21 NĐ 23/2015"},{"id":"6.16","g":6,"lv":"VD","q":"Bà F 90 tuổi, ốm nằm liệt giường, yêu cầu chứng thực di chúc tại nhà. Người thực hiện chứng thực:","o":["Được chứng thực nhưng không cần ghi thời gian","Không được chứng thực ngoài trụ sở","Phải chuyển cho tổ chức hành nghề công chứng","Được chứng thực ngoài trụ sở và phải ghi rõ địa điểm, thời gian (giờ, phút) chứng thực"],"a":3,"e":"Khoản 1 Điều 10 NĐ 23 cho phép chứng thực di chúc ngoài trụ sở khi người yêu cầu già yếu, không thể đi lại được. Khoản 2 Điều 10: khi chứng thực phải ghi rõ địa điểm; trường hợp chứng thực ngoài trụ sở phải ghi rõ thời gian (giờ, phút).","b":"Khoản 1, khoản 2 Điều 10 NĐ 23/2015"},{"id":"6.17","g":6,"lv":"VD","q":"Người dân nộp bản sao có chứng thực giấy khai sinh tại cơ quan X; không có căn cứ bản sao giả mạo. Cơ quan X:","o":["Có quyền từ chối nhận bản sao","Không được yêu cầu xuất trình bản chính","Có quyền yêu cầu xuất trình bản chính để đối chiếu","Phải yêu cầu chứng thực lại"],"a":1,"e":"Khoản 2 Điều 6 NĐ 23: cơ quan tiếp nhận bản sao có chứng thực “không được yêu cầu xuất trình bản chính”, trừ trường hợp có căn cứ về việc bản sao giả mạo, bất hợp pháp.","b":"Khoản 2 Điều 6 NĐ 23/2015"},{"id":"6.18","g":6,"lv":"VD","q":"Bà G bị từ chối chứng thực và không đồng ý. Quyền của bà G là:","o":["Không có quyền gì","Yêu cầu Sở Tư pháp chứng thực thay","Chỉ được khởi kiện ra Tòa án","Yêu cầu giải thích rõ lý do bằng văn bản hoặc khiếu nại theo quy định của pháp luật"],"a":3,"e":"Khoản 1 Điều 8 NĐ 23: trường hợp bị từ chối chứng thực thì người yêu cầu có quyền yêu cầu cơ quan, tổ chức từ chối giải thích rõ lý do bằng văn bản hoặc khiếu nại theo quy định của pháp luật.","b":"Khoản 1 Điều 8 NĐ 23/2015"},{"id":"6.19","g":6,"lv":"VD","q":"Công chứng viên của Văn phòng công chứng X có được chứng thực chữ ký người dịch trên bản dịch do cộng tác viên dịch thuật của Văn phòng thực hiện không?","o":["Không được vì xung đột lợi ích","Chỉ được nếu bản dịch đã hợp pháp hóa lãnh sự","Được, sau khi đối chiếu chữ ký trên bản dịch với chữ ký mẫu đã đăng ký","Chỉ Phòng Tư pháp mới được chứng thực"],"a":2,"e":"Điểm c khoản 1 Điều 18 LCC cho phép công chứng viên chứng thực chữ ký người dịch. Theo Điều 28, 29 và khoản 1 Điều 31 NĐ 23 (đã sửa đổi bởi NĐ 280/2025), tổ chức hành nghề công chứng được có cộng tác viên dịch thuật đăng ký chữ ký mẫu tại tổ chức mình; người thực hiện chứng thực đối chiếu chữ ký trên bản dịch với chữ ký mẫu trước khi chứng thực.","b":"Điểm c khoản 1 Điều 18 LCC; Điều 28, 29, khoản 1 Điều 31 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"6.20","g":6,"lv":"VD","q":"Người thực hiện chứng thực phát hiện giấy tờ yêu cầu chứng thực là giả mạo. Họ có quyền:","o":["Tiêu hủy giấy tờ ngay","Lập biên bản tạm giữ giấy tờ và chuyển cơ quan nhà nước có thẩm quyền xử lý","Trả lại giấy tờ cho người yêu cầu và không xử lý gì","Vẫn chứng thực nhưng ghi chú nghi ngờ"],"a":1,"e":"Khoản 6 Điều 9 NĐ 23: người thực hiện chứng thực lập biên bản tạm giữ, chuyển cơ quan nhà nước có thẩm quyền xử lý đối với giấy tờ được cấp sai thẩm quyền, giả mạo hoặc có nội dung vi phạm. Khoản 2 Điều 8 xác định người yêu cầu phải chịu trách nhiệm về tính hợp pháp của giấy tờ.","b":"Khoản 6 Điều 9, khoản 2 Điều 8 NĐ 23/2015"},{"id":"7.01","g":7,"lv":"NB","q":"Thẩm quyền cấp bản sao từ sổ gốc thuộc về:","o":["Sở Tư pháp","Ủy ban nhân dân cấp xã nơi người yêu cầu cư trú","Tổ chức hành nghề công chứng","Cơ quan, tổ chức đang quản lý sổ gốc, trừ trường hợp pháp luật có quy định khác"],"a":3,"e":"Khoản 1 Điều 4 NĐ 23: cơ quan, tổ chức đang quản lý sổ gốc có thẩm quyền và trách nhiệm cấp bản sao từ sổ gốc, trừ trường hợp pháp luật có quy định khác.","b":"Khoản 1 Điều 4 NĐ 23/2015"},{"id":"7.02","g":7,"lv":"NB","q":"Bản sao được cấp từ sổ gốc có giá trị:","o":["Chỉ có giá trị tham khảo","Chỉ dùng được khi kèm bản chính","Chỉ dùng trong thủ tục tại Tòa án","Sử dụng thay cho bản chính trong các giao dịch, trừ trường hợp pháp luật có quy định khác"],"a":3,"e":"Khoản 1 Điều 3 NĐ 23: bản sao được cấp từ sổ gốc “có giá trị sử dụng thay cho bản chính trong các giao dịch”, trừ trường hợp pháp luật có quy định khác.","b":"Khoản 1 Điều 3 NĐ 23/2015"},{"id":"7.03","g":7,"lv":"NB","q":"Việc cấp bản sao từ sổ gốc được thực hiện vào thời điểm nào?","o":["Chỉ khi bản chính bị mất","Chỉ trong 05 năm kể từ ngày cấp bản chính","Đồng thời với việc cấp bản chính hoặc sau thời điểm cấp bản chính","Chỉ sau thời điểm cấp bản chính"],"a":2,"e":"Khoản 2 Điều 4 NĐ 23: việc cấp bản sao từ sổ gốc được thực hiện “đồng thời với việc cấp bản chính hoặc sau thời điểm cấp bản chính”.","b":"Khoản 2 Điều 4 NĐ 23/2015"},{"id":"7.04","g":7,"lv":"TH","q":"Với tư cách là anh ruột (không phải người đại diện), một người được yêu cầu cấp bản sao từ sổ gốc giấy tờ của em mình khi:","o":["Người em được cấp bản chính đã chết","Người em đi vắng","Bất cứ lúc nào","Người em đồng ý bằng lời nói"],"a":0,"e":"Khoản 3 Điều 16 NĐ 23: cha, mẹ, con; vợ, chồng; anh, chị, em ruột; người thừa kế khác của người được cấp bản chính có quyền yêu cầu cấp bản sao từ sổ gốc trong trường hợp người đó đã chết. Khi người em còn sống, người anh chỉ có thể yêu cầu với tư cách người đại diện (khoản 2).","b":"Khoản 2, khoản 3 Điều 16 NĐ 23/2015"},{"id":"7.05","g":7,"lv":"TH","q":"Giấy tờ, văn bản do cá nhân tự lập được dùng làm cơ sở chứng thực bản sao khi:","o":["Có chữ ký của người lập","Có hai người làm chứng ký","Có xác nhận và đóng dấu của cơ quan, tổ chức có thẩm quyền","Trong mọi trường hợp"],"a":2,"e":"Khoản 2 Điều 18 và khoản 6 Điều 22 NĐ 23: giấy tờ do cá nhân tự lập chỉ được dùng làm cơ sở chứng thực bản sao khi có xác nhận và đóng dấu của cơ quan, tổ chức có thẩm quyền.","b":"Khoản 2 Điều 18, khoản 6 Điều 22 NĐ 23/2015"},{"id":"7.06","g":7,"lv":"NB","q":"Bản chính nào sau đây KHÔNG được dùng làm cơ sở chứng thực bản sao?","o":["Bản chính bằng tốt nghiệp đại học","Bản chính đóng dấu mật của cơ quan, tổ chức có thẩm quyền","Bản chính Giấy chứng nhận quyền sử dụng đất","Bản chính giấy khai sinh"],"a":1,"e":"Khoản 3 Điều 22 NĐ 23: bản chính đóng dấu mật của cơ quan, tổ chức có thẩm quyền hoặc không đóng dấu mật nhưng ghi rõ không được sao chụp thì không được dùng làm cơ sở chứng thực bản sao.","b":"Khoản 3 Điều 22 NĐ 23/2015"},{"id":"7.07","g":7,"lv":"NB","q":"Nhiều bản sao được chứng thực từ một bản chính trong cùng một thời điểm được ghi:","o":["Không cần ghi số chứng thực","Số chứng thực theo số trang","Mỗi bản sao một số chứng thực riêng","Một số chứng thực"],"a":3,"e":"Đoạn cuối khoản 3 Điều 20 NĐ 23: mỗi bản sao hoặc nhiều bản sao được chứng thực từ một bản chính trong cùng một thời điểm được ghi một số chứng thực.","b":"Khoản 3 Điều 20 NĐ 23/2015"},{"id":"7.08","g":7,"lv":"TH","q":"Khi chứng thực bản sao từ bản chính, trách nhiệm của các bên được phân định:","o":["Người chứng thực và người yêu cầu liên đới chịu trách nhiệm về mọi nội dung","Cơ quan cấp bản chính chịu trách nhiệm về bản sao","Người chứng thực chịu trách nhiệm về tính hợp pháp của nội dung bản chính","Người yêu cầu chịu trách nhiệm về nội dung, tính hợp lệ, hợp pháp của bản chính; người chứng thực chịu trách nhiệm về tính chính xác của bản sao đúng với bản chính"],"a":3,"e":"Điều 19 NĐ 23: người yêu cầu chịu trách nhiệm về nội dung, tính hợp lệ, hợp pháp của bản chính; người thực hiện chứng thực chỉ chịu trách nhiệm về tính chính xác của bản sao đúng với bản chính.","b":"Điều 19 NĐ 23/2015"},{"id":"7.09","g":7,"lv":"TH","q":"Đối với bản sao có từ 02 trang trở lên và từ 02 tờ trở lên, quy định đúng là:","o":["Ghi lời chứng vào từng trang","Ghi lời chứng vào trang cuối; nếu có từ 02 tờ trở lên thì đóng dấu giáp lai","Ghi lời chứng vào trang đầu","Không cần đóng dấu giáp lai"],"a":1,"e":"Đoạn 2 khoản 3 Điều 20 NĐ 23: đối với bản sao có từ 02 trang trở lên thì ghi lời chứng vào trang cuối; nếu bản sao có từ 02 tờ trở lên thì phải đóng dấu giáp lai.","b":"Khoản 3 Điều 20 NĐ 23/2015"},{"id":"7.10","g":7,"lv":"NB","q":"Trường hợp không còn lưu trữ được sổ gốc hoặc sổ gốc không có thông tin về nội dung yêu cầu, cơ quan quản lý sổ gốc phải:","o":["Chuyển yêu cầu cho Tòa án","Cấp bản sao theo lời khai của người yêu cầu","Trả lời bằng văn bản cho người yêu cầu","Không phải trả lời"],"a":2,"e":"Khoản 3 Điều 17 NĐ 23 (đã sửa đổi bởi NĐ 280/2025): trường hợp không còn lưu trữ được sổ gốc hoặc trong sổ gốc không có thông tin về nội dung yêu cầu cấp bản sao thì cơ quan, tổ chức có trách nhiệm trả lời bằng văn bản cho người yêu cầu.","b":"Khoản 3 Điều 17 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"7.11","g":7,"lv":"VD","q":"Anh A làm mất bằng tốt nghiệp đại học. Cơ quan có thẩm quyền cấp bản sao từ sổ gốc văn bằng này là:","o":["Trường đại học đã cấp bằng (đang quản lý sổ gốc)","Ủy ban nhân dân xã nơi anh A cư trú","Bộ Giáo dục và Đào tạo","Văn phòng công chứng bất kỳ"],"a":0,"e":"Theo khoản 1 Điều 4 và khoản 1 Điều 16 NĐ 23, trường đại học là nơi đang quản lý sổ gốc cấp văn bằng, còn anh A là người được cấp bản chính. Trường có thẩm quyền cấp bản sao từ sổ gốc; bản sao này có giá trị thay cho bản chính đã mất.","b":"Khoản 1 Điều 4, khoản 1 Điều 16 NĐ 23/2015"},{"id":"7.12","g":7
