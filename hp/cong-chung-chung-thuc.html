rue"},{"t":"Luật Lưu trữ số 33/2024/QH15","d":"21/6/2024","org":"Quốc hội","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=33/2024/QH15&match=True"},{"t":"Luật Tổ chức chính quyền địa phương số 72/2025/QH15","d":"16/6/2025","org":"Quốc hội","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=72/2025/QH15&match=True"},{"t":"Nghị định số 21/2021/NĐ-CP quy định thi hành Bộ luật Dân sự về bảo đảm thực hiện nghĩa vụ","d":"19/3/2021","org":"Chính phủ","note":"","url":"https://hethongphapluat.com/nghi-dinh-21-2021-nd-cp-huong-dan-bo-luat-dan-su-ve-bao-dam-thuc-hien-nghia-vu/dieu-1"},{"t":"Nghị định số 99/2022/NĐ-CP về đăng ký biện pháp bảo đảm","d":"30/11/2022","org":"Chính phủ","note":"","url":"https://thuvienphapluat.vn/van-ban/quyen-dan-su/nghi-dinh-99-2022-nd-cp-dang-ky-bien-phap-bao-dam-542323.aspx"},{"t":"Nghị định số 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở","d":"24/7/2024","org":"Chính phủ","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=95/2024/N%C4%90-CP&match=True"},{"t":"Nghị định số 101/2024/NĐ-CP quy định về điều tra cơ bản đất đai; đăng ký, cấp Giấy chứng nhận… (được sửa đổi, bổ sung)","d":"29/7/2024","org":"Chính phủ","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=101/2024/N%C4%90-CP&match=True"},{"t":"Nghị định số 151/2025/NĐ-CP quy định về phân định thẩm quyền của chính quyền địa phương 02 cấp, phân quyền, phân cấp trong lĩnh vực đất đai","d":"12/6/2025","org":"Chính phủ","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=151/2025/N%C4%90-CP&match=True"},{"t":"Nghị định số 23/2025/NĐ-CP quy định về chữ ký điện tử và dịch vụ tin cậy","d":"21/02/2025","org":"Chính phủ","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=23/2025/N%C4%90-CP&match=True"},{"t":"Thông tư số 79/2024/TT-BCA quy định về cấp, thu hồi chứng nhận đăng ký xe, biển số xe… (được sửa đổi, bổ sung)","d":"15/11/2024","org":"Bộ Công an","note":"","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=79/2024/TT-BCA&match=True"}]}],"al":[],"ly":{"root":"Công chứng, chứng thực","ch":[{"t":"Chương 1. Khái quát chung về công chứng, chứng thực","cs":"Luật Công chứng 2024 (Điều 1 – Điều 9); Nghị định 23/2015 (Điều 1 – Điều 4)","b":["Bốn nội dung: khái niệm công chứng; giá trị pháp lý của văn bản công chứng; khái niệm và giá trị của chứng thực; phân biệt công chứng với chứng thực."],"c":[{"t":"Khái niệm công chứng","cs":"Khoản 1 Điều 2 LCC","b":["Dịch vụ công do công chứng viên của tổ chức hành nghề công chứng thực hiện để chứng nhận tính xác thực, hợp pháp của giao dịch.","Đối tượng chỉ là giao dịch: giao dịch luật quy định phải công chứng, luật giao Chính phủ quy định phải công chứng, hoặc cá nhân, tổ chức tự nguyện yêu cầu công chứng.","Cơ quan đại diện ngoại giao, lãnh sự Việt Nam ở nước ngoài cũng được công chứng giao dịch (Điều 73 LCC).","Luật 2024 không còn “công chứng bản dịch”; với bản dịch, công chứng viên chứng thực chữ ký người dịch theo pháp luật về chứng thực."],"c":[{"t":"Các thuật ngữ cơ bản","cs":"Điều 2 LCC","b":["Công chứng viên: người đủ tiêu chuẩn, được bổ nhiệm để hành nghề công chứng và thực hiện một số việc chứng thực.","Người yêu cầu công chứng: cá nhân, tổ chức trong nước hoặc nước ngoài tham gia giao dịch, có yêu cầu công chứng.","Văn bản công chứng: giao dịch bằng văn bản đã được công chứng.","Hành nghề công chứng: việc công chứng viên của 01 tổ chức hành nghề công chứng thực hiện công chứng."]},{"t":"Giao dịch phải công chứng","cs":"Điều 3 LCC","b":["Chỉ luật mới quy định giao dịch phải công chứng, hoặc giao cho Chính phủ quy định.","Ví dụ: hợp đồng chuyển nhượng, tặng cho, thế chấp quyền sử dụng đất (Điều 27 Luật Đất đai 2024, trừ trường hợp luật định); hợp đồng mua bán, tặng cho, đổi, góp vốn, thế chấp nhà ở (Điều 164 Luật Nhà ở 2023) phải công chứng hoặc chứng thực."]},{"t":"Nguyên tắc hành nghề","cs":"Điều 5 LCC","b":["Tuân thủ Hiến pháp và pháp luật; khách quan, trung thực.","Tuân theo quy tắc đạo đức hành nghề công chứng.","Chịu trách nhiệm trước pháp luật và người yêu cầu công chứng về văn bản công chứng."]},{"t":"Các hành vi bị nghiêm cấm","cs":"Điều 9 LCC","b":["Đối với công chứng viên: tiết lộ thông tin (trừ trường hợp luật định); công chứng giao dịch liên quan đến tài sản, lợi ích của bản thân hoặc người thân thích (vợ, chồng, cha mẹ đẻ, cha mẹ nuôi, con, anh chị em ruột của mình và của vợ/chồng…); hành nghề đồng thời tại 02 tổ chức; làm môi giới, đại lý, hưởng lợi từ giao dịch do mình công chứng…","Đối với tổ chức hành nghề công chứng: cho người không đủ điều kiện hành nghề tại tổ chức mình thực hiện công chứng; quảng cáo, cạnh tranh không lành mạnh…"]}]},{"t":"Giá trị pháp lý của văn bản công chứng","cs":"Điều 6 LCC","b":[],"c":[{"t":"Thời điểm có hiệu lực","cs":"Khoản 1, 2 Điều 6; khoản 2 Điều 64 LCC","b":["Văn bản công chứng có hiệu lực kể từ thời điểm được công chứng viên ký và tổ chức hành nghề công chứng đóng dấu.","Văn bản công chứng điện tử có hiệu lực khi có chữ ký số của công chứng viên và của tổ chức hành nghề công chứng.","Lưu ý: hiệu lực của văn bản công chứng khác thời điểm chuyển quyền (ví dụ quyền sử dụng đất chuyển khi đăng ký vào sổ địa chính)."]},{"t":"Hiệu lực thi hành","cs":"Điều 6 LCC","b":["Văn bản công chứng có hiệu lực thi hành đối với các bên liên quan.","Bên có nghĩa vụ không thực hiện thì bên kia có quyền yêu cầu Tòa án giải quyết, trừ trường hợp các bên có thỏa thuận khác."]},{"t":"Giá trị chứng cứ","cs":"Khoản 3 Điều 6 LCC","b":["Những tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ trường hợp bị Tòa án tuyên bố là vô hiệu."]},{"t":"Tuyên bố văn bản công chứng vô hiệu","cs":"Điều 54 LCC","b":["Chỉ Tòa án có thẩm quyền tuyên bố văn bản công chứng vô hiệu.","Người có quyền đề nghị: công chứng viên, người yêu cầu công chứng, người làm chứng, người phiên dịch, người có quyền, lợi ích liên quan, cơ quan nhà nước có thẩm quyền."]}]},{"t":"Khái niệm và giá trị của chứng thực","cs":"Điều 2, Điều 3 Nghị định 23/2015 (đã sửa đổi)","b":["Chứng thực là việc cơ quan, tổ chức có thẩm quyền xác nhận tính chính xác, hợp pháp về hình thức: bản sao đúng với bản chính; chữ ký là của người yêu cầu; thời gian, địa điểm, năng lực, ý chí của các bên khi giao kết hợp đồng."],"c":[{"t":"Bốn loại việc","cs":"Điều 2 NĐ 23","b":["Cấp bản sao từ sổ gốc.","Chứng thực bản sao từ bản chính.","Chứng thực chữ ký (kể cả chữ ký người dịch).","Chứng thực hợp đồng, giao dịch."]},{"t":"Giá trị pháp lý","cs":"Điều 3 NĐ 23","b":["Bản sao cấp từ sổ gốc có giá trị sử dụng thay cho bản chính, trừ trường hợp pháp luật có quy định khác.","Bản sao được chứng thực từ bản chính có giá trị sử dụng thay cho bản chính đã dùng để đối chiếu, trừ trường hợp pháp luật có quy định khác.","Chữ ký được chứng thực có giá trị chứng minh người yêu cầu đã ký chữ ký đó; là căn cứ xác định trách nhiệm của người ký về nội dung giấy tờ, không xác nhận nội dung hợp pháp.","Hợp đồng được chứng thực có giá trị chứng cứ về thời gian, địa điểm giao kết, năng lực hành vi dân sự, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ của các bên."]}]},{"t":"Phân biệt công chứng và chứng thực","cs":"Điều 2, Điều 6 LCC; Điều 2, Điều 3 NĐ 23","b":["Bản chất: công chứng là dịch vụ công; chứng thực chủ yếu là hoạt động hành chính tư pháp của cơ quan nhà nước (công chứng viên cũng thực hiện một số việc chứng thực).","Phạm vi xác nhận: công chứng chứng nhận cả tính xác thực và tính hợp pháp của nội dung giao dịch; chứng thực hợp đồng chỉ xác nhận thời gian, địa điểm, năng lực, ý chí, chữ ký – người chứng thực không chịu trách nhiệm về nội dung.","Người thực hiện: công chứng viên; chứng thực do Chủ tịch hoặc Phó Chủ tịch UBND cấp xã, công chứng viên, viên chức ngoại giao, lãnh sự thực hiện theo thẩm quyền.","Giá trị: văn bản công chứng có hiệu lực thi hành và giá trị chứng cứ “không phải chứng minh”; hợp đồng chứng thực chỉ là chứng cứ về các yếu tố đã chứng thực."]}]},{"t":"Chương 2. Công chứng viên","cs":"Chương II LCC (Điều 10 – Điều 18); Nghị định 104/2025; Nghị định 121/2025","b":["Năm nội dung: tiêu chuẩn bổ nhiệm; đào tạo, tập sự; bổ nhiệm và các trường hợp không được bổ nhiệm; tạm đình chỉ, miễn nhiệm, bổ nhiệm lại; quyền và nghĩa vụ."],"c":[{"t":"Tiêu chuẩn bổ nhiệm","cs":"Điều 10 LCC","b":["Công dân Việt Nam không quá 70 tuổi.","Thường trú tại Việt Nam, trung thành với Tổ quốc, tuân thủ Hiến pháp và pháp luật, có phẩm chất đạo đức tốt và đủ sức khỏe hành nghề.","Có bằng cử nhân, thạc sĩ hoặc tiến sĩ luật.","Có thời gian công tác pháp luật từ đủ 03 năm trở lên tại cơ quan, tổ chức sau khi có bằng.","Tốt nghiệp khóa đào tạo nghề công chứng.","Đạt yêu cầu kiểm tra kết quả tập sự hành nghề công chứng."]},{"t":"Đào tạo nghề công chứng","cs":"Điều 11 LCC","b":["Thời gian đào tạo 12 tháng.","Rút ngắn còn 06 tháng đối với người đã là thẩm phán, kiểm sát viên, điều tra viên, luật sư… hoặc giảng viên chính trong lĩnh vực pháp luật từ đủ 05 năm; tiến sĩ luật; một số trường hợp khác do luật định.","Người hoàn thành được cấp giấy chứng nhận tốt nghiệp khóa đào tạo."]},{"t":"Tập sự hành nghề công chứng","cs":"Điều 12 LCC; Thông tư 06/2025/TT-BTP","b":["Đăng ký tập sự tại Sở Tư pháp nơi có tổ chức hành nghề công chứng nhận tập sự; thời gian tập sự 12 tháng.","Công chứng viên hướng dẫn phải có ít nhất 02 năm kinh nghiệm hành nghề; tại cùng thời điểm hướng dẫn tối đa 02 người tập sự.","Hết thời gian tập sự thì đăng ký kiểm tra kết quả tập sự.","Giấy chứng nhận đạt yêu cầu kiểm tra hết hiệu lực nếu trong 05 năm kể từ ngày cấp mà người được cấp không đề nghị bổ nhiệm."]},{"t":"Bổ nhiệm công chứng viên","cs":"Điều 13, Điều 14 LCC; Điều 4 NĐ 104; Nghị định 121/2025","b":["Luật giao Bộ trưởng Bộ Tư pháp bổ nhiệm; Nghị định 121/2025 phân cấp thẩm quyền này cho Chủ tịch UBND cấp tỉnh. Sinh viên đối chiếu văn bản hiện hành khi trả lời."],"c":[{"t":"Hồ sơ, trình tự","cs":"Điều 4 NĐ 104","b":["Nộp hồ sơ tại Sở Tư pháp.","Sở Tư pháp xem xét, có văn bản đề nghị trong 10 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ.","Người có thẩm quyền quyết định trong 10 ngày làm việc; từ chối phải trả lời bằng văn bản nêu rõ lý do."]},{"t":"Không được bổ nhiệm","cs":"Điều 14 LCC","b":["Người bị kết án về tội phạm do vô ý mà chưa được xóa án tích, hoặc tội phạm do cố ý (kể cả đã được xóa án tích).","Người đang bị truy cứu trách nhiệm hình sự; đang bị áp dụng biện pháp xử lý hành chính.","Người mất, hạn chế năng lực hành vi dân sự, có khó khăn trong nhận thức, làm chủ hành vi.","Cán bộ, công chức, viên chức (trừ viên chức Phòng công chứng), sĩ quan, quân nhân chuyên nghiệp… đang tại ngũ, đang công tác.","Người bị buộc thôi việc là cán bộ, công chức, viên chức; người bị thu hồi chứng chỉ hành nghề luật sư chưa hết 03 năm…"]}]},{"t":"Tạm đình chỉ hành nghề","cs":"Điều 15 LCC; Điều 5 NĐ 104","b":["Hai căn cứ: công chứng viên bị truy cứu trách nhiệm hình sự; hoặc bị áp dụng biện pháp xử lý hành chính quy định tại khoản 3 Điều 14 LCC.","Sở Tư pháp nơi cấp thẻ công chứng viên ra quyết định trong 05 ngày làm việc kể từ ngày nhận được quyết định truy cứu trách nhiệm hình sự hoặc quyết định áp dụng biện pháp xử lý hành chính.","Thời gian tạm đình chỉ tối đa 12 tháng; hết thời hạn mà lý do vẫn còn thì công chứng viên bị miễn nhiệm.","Chấm dứt trước thời hạn khi có quyết định đình chỉ điều tra, đình chỉ vụ án, bản án tuyên không có tội hoặc không còn bị áp dụng biện pháp xử lý hành chính; Sở Tư pháp quyết định trong 05 ngày làm việc kể từ ngày nhận đề nghị.","Hành nghề trong thời gian bị tạm đình chỉ là căn cứ bị miễn nhiệm và không được bổ nhiệm lại."]},{"t":"Miễn nhiệm công chứng viên","cs":"Điều 16 LCC; Điều 6 NĐ 104","b":[],"c":[{"t":"Được miễn nhiệm","cs":"Khoản 1 Điều 16 LCC","b":["Theo nguyện vọng của công chứng viên.","Chuyển làm công việc khác theo quyết định của cơ quan có thẩm quyền.","Đương nhiên miễn nhiệm khi quá 70 tuổi (có quy định chuyển tiếp tại Điều 76 LCC cho người đang hành nghề ngày 01/7/2025)."]},{"t":"Bị miễn nhiệm","cs":"Khoản 2 Điều 16 LCC","b":["Không còn đủ tiêu chuẩn tại Điều 10; thuộc trường hợp không được bổ nhiệm.","Không hành nghề trong 12 tháng kể từ ngày được bổ nhiệm, hoặc không hành nghề liên tục từ 12 tháng trở lên (trừ trường hợp tổ chức tạm ngừng do bất khả kháng).","Hết thời hạn tạm đình chỉ mà lý do vẫn còn.","Bị xử phạt hành chính từ 02 lần trở lên trong 12 tháng về hoạt động hành nghề; hành nghề khi bị tạm đình chỉ hoặc chưa đủ điều kiện.","Bị kết tội bằng bản án có hiệu lực pháp luật (kể cả án treo)."]}]},{"t":"Bổ nhiệm lại","cs":"Điều 17 LCC; Điều 7 NĐ 104","b":["Người được miễn nhiệm theo nguyện vọng hoặc do chuyển công tác: chỉ cần đáp ứng khoản 1, 2 Điều 10; không phải đào tạo, tập sự lại, không phải chờ thời hạn.","Người bị miễn nhiệm: phải hết 02 năm kể từ ngày quyết định miễn nhiệm có hiệu lực, lý do miễn nhiệm không còn, đủ tiêu chuẩn tại Điều 10.","Không được bổ nhiệm lại: người bị kết án về tội cố ý; người bị miễn nhiệm vì hành nghề khi đang bị tạm đình chỉ hoặc chưa đủ điều kiện hành nghề…"]},{"t":"Quyền và nghĩa vụ","cs":"Điều 18 LCC","b":["Quyền: được pháp luật bảo đảm quyền hành nghề; tham gia thành lập Văn phòng công chứng; công chứng, chứng thực theo luật định; đề nghị cơ quan cung cấp thông tin; từ chối công chứng giao dịch vi phạm pháp luật, trái đạo đức xã hội.","Nghĩa vụ: tuân thủ nguyên tắc hành nghề; hành nghề tại 01 tổ chức; tham gia bồi dưỡng nghiệp vụ hằng năm; mua bảo hiểm trách nhiệm nghề nghiệp; gia nhập Hội công chứng viên tại địa phương nơi hành nghề và duy trì tư cách hội viên…"]}]},{"t":"Chương 3. Tổ chức hành nghề công chứng","cs":"Chương III, Chương IV LCC (Điều 19 – Điều 41); Nghị định 104/2025","b":["Năm nội dung: Phòng công chứng; Văn phòng công chứng; thành lập và đăng ký hoạt động; biến động của Văn phòng; hành nghề, thẻ, bảo hiểm, bồi thường."],"c":[{"t":"Phòng công chứng","cs":"Điều 20 – Điều 22 LCC; Điều 9 – Điều 16 NĐ 104","b":["Đơn vị sự nghiệp công lập thuộc Sở Tư pháp, do UBND cấp tỉnh thành lập; Trưởng phòng là công chứng viên.","Luật 2024 hướng tới chuyển đổi Phòng công chứng thành Văn phòng công chứng; nếu không chuyển đổi được thì giải thể.","Sở Tư pháp lập đề án; UBND cấp tỉnh quyết định. Phòng chỉ được giải thể sau khi thanh toán xong nợ, chấm dứt hợp đồng lao động và thực hiện xong các yêu cầu công chứng đã tiếp nhận.","Sở Tư pháp đăng báo 03 số liên tiếp trong 05 ngày làm việc kể từ ngày có quyết định (Điều 16 NĐ 104)."]},{"t":"Văn phòng công chứng","cs":"Điều 23 LCC","b":[],"c":[{"t":"Loại hình","cs":"Khoản 1, 2 Điều 23 LCC","b":["Công ty hợp danh: từ 02 thành viên hợp danh trở lên, không có thành viên góp vốn; mọi thành viên là công chứng viên, có quyền ngang nhau.","Doanh nghiệp tư nhân: chỉ được thành lập ở địa bàn khó khăn theo danh mục của Chính phủ; chủ doanh nghiệp đồng thời là Trưởng Văn phòng."]},{"t":"Trưởng Văn phòng","cs":"Khoản 2, 3 Điều 23 LCC","b":["Là thành viên hợp danh (hoặc chủ doanh nghiệp tư nhân) đã hành nghề từ đủ 02 năm trở lên.","Là người đại diện theo pháp luật; không được thuê người khác điều hành, không được cho thuê Văn phòng."]},{"t":"Tên, trụ sở, con dấu, tài chính","cs":"Khoản 4, 5, 6 Điều 23 LCC; Điều 18 NĐ 104","b":["Tên gồm cụm từ “Văn phòng công chứng” và tên riêng bằng tiếng Việt; không dùng tên cơ quan nhà nước, tổ chức chính trị – xã hội…; không trùng, gây nhầm lẫn với tổ chức khác trên toàn quốc.","Trụ sở đáp ứng điều kiện của Chính phủ; nếu thuê thì thời hạn thuê tối thiểu 02 năm.","Con dấu không có hình quốc huy; chỉ được khắc, sử dụng sau khi được cấp giấy đăng ký hoạt động.","Tự chủ tài chính bằng nguồn thu phí công chứng, giá dịch vụ và nguồn thu hợp pháp khác."]}]},{"t":"Thành lập và đăng ký hoạt động","cs":"Điều 24, Điều 25 LCC; Điều 19, Điều 20 NĐ 104","b":[],"c":[{"t":"Ai được thành lập","cs":"Điều 24 LCC","b":["Công chứng viên không được thành lập, tham gia thành lập Văn phòng mới khi: đang là viên chức Phòng công chứng; đang là thành viên hợp danh của 01 Văn phòng; đang là Trưởng Văn phòng doanh nghiệp tư nhân; chưa hết thời hạn hạn chế 02 năm (sau khi chấm dứt tư cách hợp danh, bán Văn phòng, chấm dứt hoạt động)."]},{"t":"Hồ sơ, thẩm quyền cho phép thành lập","cs":"Điều 19 NĐ 104","b":["Hồ sơ: đề án thành lập (tổ chức, tên, nhân sự, trụ sở, điều kiện vật chất, kế hoạch; giá trị, tỷ lệ, thời hạn góp vốn); quyết định bổ nhiệm các công chứng viên; dự thảo Điều lệ (với công ty hợp danh); giấy tờ chứng minh Trưởng Văn phòng đã hành nghề từ đủ 02 năm.","Nộp tại Sở Tư pháp nơi dự kiến đặt trụ sở.","Sở Tư pháp trình trong 05 ngày làm việc; UBND cấp tỉnh quyết định cho phép thành lập trong 10 ngày làm việc."]},{"t":"Đăng ký hoạt động","cs":"Điều 25 LCC; Điều 20 NĐ 104","b":["Trong 90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực, phải đăng ký hoạt động tại Sở Tư pháp nơi đã ra quyết định.","Hồ sơ: đơn; giấy tờ về trụ sở phù hợp đề án; giấy tờ chứng minh đã góp vốn (hoặc vốn đầu tư); hợp đồng lao động của công chứng viên làm theo hợp đồng (nếu có); 02 ảnh 2x3 của mỗi công chứng viên.","Sở Tư pháp cấp giấy đăng ký hoạt động và thẻ công chứng viên trong 05 ngày làm việc.","Văn phòng được hoạt động, công chứng viên được hành nghề kể từ ngày được cấp giấy đăng ký hoạt động."]}]},{"t":"Biến động của Văn phòng công chứng","cs":"Điều 26 – Điều 34 LCC; Điều 21 – Điều 27 NĐ 104","b":[],"c":[{"t":"Thay đổi đăng ký, thành viên","cs":"Điều 26 – Điều 28 LCC","b":["Thay đổi nội dung đăng ký hoạt động phải đăng ký với Sở Tư pháp.","Chấm dứt tư cách thành viên hợp danh, tiếp nhận thành viên hợp danh mới theo luật định."]},{"t":"Hợp nhất, sáp nhập, chuyển nhượng, bán","cs":"Điều 29 – Điều 31 LCC; Điều 26 NĐ 104","b":["Hợp nhất, sáp nhập: chỉ áp dụng với Văn phòng loại hình công ty hợp danh.","Chuyển nhượng toàn bộ phần vốn góp của toàn bộ thành viên hợp danh: bên nhận phải là công chứng viên đủ điều kiện.","Bán Văn phòng doanh nghiệp tư nhân: Văn phòng đã hoạt động ít nhất 02 năm; người mua là công chứng viên đã hành nghề từ đủ 02 năm, cam kết làm Trưởng Văn phòng; UBND cấp tỉnh cho phép; người bán vẫn chịu nợ phát sinh trước ngày chuyển giao (trừ thỏa thuận khác) và phải chờ 02 năm mới được lập, tham gia Văn phòng mới."]},{"t":"Tạm ngừng hoạt động","cs":"Điều 32 LCC","b":["Trường hợp: toàn bộ công chứng viên bị tạm đình chỉ; sự kiện bất khả kháng, trở ngại khách quan; theo đề nghị của Văn phòng.","Thời gian tạm ngừng tối đa 12 tháng (trừ trường hợp luật định).","Sở Tư pháp chỉ định tổ chức khác tiếp nhận hồ sơ để giải quyết yêu cầu sửa lỗi kỹ thuật, cấp bản sao."]},{"t":"Thu hồi quyết định cho phép thành lập","cs":"Điều 33 LCC","b":["Không đăng ký hoạt động trong 90 ngày, hoặc đăng ký không đúng hồ sơ đã được phê duyệt.","Kê khai giả mạo; hết 06 tháng kể từ ngày được cấp giấy mà chưa hoạt động; không hoạt động liên tục từ 03 tháng trở lên (trừ tạm ngừng hợp pháp).","Công ty hợp danh chỉ còn 01 thành viên hợp danh (nếu do thành viên kia chết, bị khai trừ, bị miễn nhiệm, bị cấm hành nghề thì có 06 tháng để bổ sung).","Không duy trì điều kiện về công chứng viên, trụ sở trong ít nhất 01 năm kể từ ngày được cấp giấy; do người không phải công chứng viên thành lập, tham gia, nhận chuyển nhượng, mua…","Sở Tư pháp lập hồ sơ đề nghị; UBND cấp tỉnh quyết định thu hồi."]},{"t":"Chấm dứt hoạt động","cs":"Điều 34 LCC; Điều 27 NĐ 104","b":["Tự chấm dứt hoặc bị thu hồi quyết định cho phép thành lập.","Tự chấm dứt phải đăng báo 03 số liên tiếp và không được tiếp nhận yêu cầu công chứng mới kể từ khi báo cáo Sở Tư pháp.","Hồ sơ công chứng chuyển giao cho tổ chức khác theo thỏa thuận hoặc chỉ định của Sở Tư pháp (Điều 68 LCC)."]}]},{"t":"Hành nghề công chứng","cs":"Chương IV LCC (Điều 37 – Điều 41); Điều 28 – Điều 42 NĐ 104","b":[],"c":[{"t":"Hình thức hành nghề","cs":"Điều 37 LCC","b":["Thành viên hợp danh của Văn phòng công chứng hoặc Trưởng Văn phòng doanh nghiệp tư nhân.","Viên chức của Phòng công chứng.","Công chứng viên làm việc theo chế độ hợp đồng lao động tại Phòng hoặc Văn phòng công chứng."]},{"t":"Thẻ công chứng viên","cs":"Điều 38 LCC","b":["Sở Tư pháp cấp thẻ cho công chứng viên gắn với tổ chức nơi hành nghề; khi chuyển tổ chức thì thẻ cũ bị thu hồi và được cấp thẻ mới.","Chỉ được hành nghề khi có thẻ."]},{"t":"Bảo hiểm và bồi thường","cs":"Điều 39, Điều 40 LCC; Điều 28 – Điều 35 NĐ 104","b":["Bảo hiểm trách nhiệm nghề nghiệp là bắt buộc; tổ chức hành nghề công chứng mua cho công chứng viên của mình.","Tổ chức hành nghề công chứng bồi thường thiệt hại do lỗi của công chứng viên gây ra cho người yêu cầu công chứng và cá nhân, tổ chức khác.","Công chứng viên có lỗi phải hoàn trả cho tổ chức khoản tiền đã bồi thường theo luật định."]},{"t":"Tổ chức xã hội – nghề nghiệp","cs":"Điều 41 LCC; Điều 36 – Điều 42 NĐ 104","b":["Hội công chứng viên ở tỉnh, thành phố; Hiệp hội công chứng viên Việt Nam ở trung ương.","Công chứng viên phải gia nhập Hội công chứng viên tại địa phương nơi mình hành nghề."]}]}]},{"t":"Chương 4. Thủ tục chung về công chứng","cs":"Mục 1 Chương V LCC (Điều 42 – Điều 54)","b":["Sáu nội dung: hai thủ tục công chứng; thẩm quyền theo địa hạt; thời hạn; địa điểm; hình thức văn bản công chứng; sửa đổi, sửa lỗi và vô hiệu."],"c":[{"t":"Hai thủ tục công chứng","cs":"Điều 42, Điều 43 LCC","b":[],"c":[{"t":"Giao dịch đã được soạn thảo sẵn","cs":"Điều 42 LCC","b":["Người yêu cầu nộp hồ sơ: phiếu yêu cầu, dự thảo giao dịch, giấy tờ tùy thân, giấy tờ về tài sản (nếu có), giấy tờ khác có liên quan.","Công chứng viên kiểm tra hồ sơ; nếu có căn cứ nghi ngờ (bị đe dọa, cưỡng ép, không nhận thức được hành vi, tài sản không rõ ràng…) thì đề nghị làm rõ hoặc xác minh, giám định; không làm rõ được thì từ chối.","Kiểm tra dự thảo; nội dung vi phạm pháp luật, trái đạo đức xã hội thì chỉ rõ để sửa; không sửa thì từ chối.","Người yêu cầu đọc lại, đồng ý toàn bộ nội dung, ký vào từng trang trước mặt công chứng viên; công chứng viên đối chiếu bản chính, ghi lời chứng, ký từng trang."]},{"t":"Giao dịch do công chứng viên soạn thảo","cs":"Điều 43 LCC","b":["Người yêu cầu nêu nội dung, ý định giao kết; công chứng viên kiểm tra hồ sơ như Điều 42.","Nội dung ý định phù hợp pháp luật, không trái đạo đức xã hội thì công chứng viên soạn thảo giao dịch."]}]},{"t":"Thẩm quyền công chứng giao dịch về bất động sản","cs":"Điều 44 LCC","b":["Công chứng viên chỉ được công chứng giao dịch về bất động sản trong phạm vi tỉnh, thành phố nơi tổ chức hành nghề công chứng đặt trụ sở.","Ngoại lệ: di chúc; văn bản từ chối nhận di sản; văn bản ủy quyền liên quan đến quyền đối với bất động sản; thỏa thuận xác lập chế độ tài sản của vợ chồng có bất động sản; việc sửa đổi, bổ sung, chấm dứt, hủy bỏ các giao dịch này."]},{"t":"Thời hạn công chứng","cs":"Điều 45 LCC","b":["Không quá 02 ngày làm việc; giao dịch phức tạp có thể kéo dài nhưng không quá 10 ngày làm việc.","Tính từ ngày tiếp nhận hồ sơ hợp lệ, ghi vào sổ, đến ngày trả kết quả; thời gian xác minh, giám định, niêm yết không tính vào thời hạn.","Khi có bất khả kháng, trở ngại khách quan hoặc lỗi của người yêu cầu, các bên có thể thỏa thuận bằng văn bản thời hạn khác."]},{"t":"Địa điểm công chứng","cs":"Điều 46 LCC; Điều 43 NĐ 104","b":["Nguyên tắc: tại trụ sở tổ chức hành nghề công chứng.","Ngoài trụ sở khi người yêu cầu: lập di chúc tại chỗ ở theo BLDS; không thể đi lại vì lý do sức khỏe, đang điều trị nội trú, bị cách ly; đang bị tạm giữ, tạm giam, thi hành án phạt tù, bị áp dụng biện pháp xử lý hành chính; có lý do chính đáng khác theo quy định của Chính phủ (Điều 43 NĐ 104)."]},{"t":"Hình thức văn bản công chứng","cs":"Điều 47 – Điều 51 LCC; Điều 46 NĐ 104","b":[],"c":[{"t":"Chữ viết, thời điểm, lời chứng","cs":"Điều 7, Điều 47, Điều 48 LCC","b":["Chữ viết rõ ràng, dễ đọc, không viết tắt hoặc ký hiệu; tiếng nói, chữ viết là tiếng Việt.","Thời điểm công chứng ghi ngày, tháng, năm; có thể ghi giờ, phút nếu người yêu cầu đề nghị hoặc công chứng viên thấy cần.","Lời chứng của công chứng viên theo mẫu, xác nhận các yếu tố luật định."]},{"t":"Người làm chứng, người phiên dịch","cs":"Điều 49 LCC","b":["Bắt buộc có người làm chứng khi người yêu cầu không đọc được, không nghe được, không ký, không điểm chỉ được, hoặc trường hợp luật định.","Người làm chứng phải từ đủ 18 tuổi, có năng lực hành vi dân sự đầy đủ, không có quyền, lợi ích hoặc nghĩa vụ liên quan đến giao dịch.","Người yêu cầu không thông thạo tiếng Việt thì phải có người phiên dịch."]},{"t":"Ký, điểm chỉ, chụp ảnh","cs":"Điều 50 LCC; Điều 46 NĐ 104","b":["Người yêu cầu, người làm chứng, người phiên dịch ký trước mặt công chứng viên; điểm chỉ khi không ký được hoặc theo yêu cầu.","Việc ký văn bản công chứng được chụp ảnh lưu hồ sơ theo hướng dẫn của Nghị định."]},{"t":"Đánh số trang, đóng dấu giáp lai","cs":"Điều 51 LCC","b":["Văn bản công chứng có từ 02 trang trở lên thì từng trang phải được đánh số thứ tự.","Văn bản có từ 02 tờ trở lên phải đóng dấu giáp lai giữa các tờ. Lưu ý: “trang” và “tờ” là hai khái niệm khác nhau."]}]},{"t":"Sửa lỗi kỹ thuật; sửa đổi, bổ sung, hủy bỏ giao dịch","cs":"Điều 52, Điều 53 LCC","b":["Sửa lỗi kỹ thuật (lỗi chính tả, đánh máy, ghi số liệu… không làm thay đổi quyền, nghĩa vụ): công chứng viên đối chiếu hồ sơ lưu trữ, có sự đồng ý của các bên.","Sửa đổi, bổ sung, chấm dứt, hủy bỏ giao dịch đã công chứng: phải có thỏa thuận bằng văn bản của tất cả những người đã tham gia giao dịch và được công chứng tại tổ chức đã công chứng giao dịch đó (ngoại lệ khi tổ chức đó đã giải thể, chấm dứt hoạt động…)."]},{"t":"Hồ sơ, lưu trữ và cấp bản sao","cs":"Điều 66 – Điều 69 LCC","b":["Cơ sở dữ liệu công chứng do Bộ Tư pháp xây dựng, quản lý; tổ chức hành nghề công chứng cập nhật thông tin giao dịch, thông tin ngăn chặn.","Hồ sơ công chứng lưu tại trụ sở ít nhất 30 năm với giao dịch về bất động sản, ít nhất 10 năm với giao dịch khác; lưu ngoài trụ sở cần văn bản đồng ý của Sở Tư pháp.","Kê biên, khám xét trụ sở phải có đại diện Sở Tư pháp và Hội công chứng viên chứng kiến.","Bản sao văn bản công chứng được cấp theo yêu cầu của người có quyền theo Điều 69 LCC."]}]},{"t":"Chương 5. Công chứng một số giao dịch cụ thể và công chứng điện tử","cs":"Mục 2, Mục 3 Chương V LCC (Điều 55 – Điều 65); Điều 43 – Điều 54 NĐ 104","b":["Bốn nhóm: giao dịch về tài sản (thế chấp, ủy quyền); di chúc và di sản; gửi giữ di chúc; công chứng điện tử."],"c":[{"t":"Nguyên tắc chung","cs":"Điều 55 LCC","b":["Thủ tục công chứng giao dịch cụ thể thực hiện theo thủ tục chung tại Điều 42, Điều 43, cùng các quy định riêng tại Mục 2."]},{"t":"Thế chấp bất động sản","cs":"Điều 56 LCC; Bộ luật Dân sự 2015","b":["Một bất động sản được thế chấp để bảo đảm nhiều nghĩa vụ: các hợp đồng thế chấp tiếp theo phải được công chứng tại tổ chức đã công chứng hợp đồng thế chấp trước đó (trừ trường hợp luật định).","Công chứng viên kiểm tra tình trạng tài sản, thông tin ngăn chặn và các giao dịch bảo đảm đã có."]},{"t":"Hợp đồng ủy quyền khi hai bên không cùng có mặt","cs":"Điều 57 LCC","b":["Bên ủy quyền yêu cầu công chứng hợp đồng ủy quyền tại tổ chức hành nghề công chứng nơi mình cư trú.","Bên được ủy quyền yêu cầu tổ chức hành nghề công chứng nơi mình cư trú công chứng tiếp vào bản gốc hợp đồng đó, hoàn tất thủ tục."]},{"t":"Công chứng di chúc","cs":"Điều 58 LCC; Bộ luật Dân sự 2015","b":["Người lập di chúc phải tự mình yêu cầu công chứng, không ủy quyền cho người khác.","Công chứng viên kiểm tra năng lực, sự minh mẫn, tự nguyện; có căn cứ cho rằng người lập di chúc không minh mẫn hoặc bị lừa dối, đe dọa, cưỡng ép thì từ chối.","Tính mạng bị đe dọa: công chứng ngay, người lập di chúc bổ sung giấy tờ sau; nếu hết nguy hiểm mà không bổ sung đủ trong thời hạn luật định thì văn bản công chứng di chúc không có hiệu lực.","Di chúc liên quan bất động sản không bị giới hạn địa hạt (Điều 44)."]},{"t":"Văn bản phân chia di sản; từ chối nhận di sản","cs":"Điều 59, Điều 60 LCC; Điều 44 NĐ 104","b":["Người thừa kế theo pháp luật hoặc theo di chúc (di chúc không xác định rõ phần) có quyền yêu cầu công chứng văn bản phân chia di sản; có thể tặng cho phần di sản của mình cho người khác.","Phải niêm yết việc tiếp nhận công chứng văn bản phân chia di sản, kể cả trường hợp chỉ có 01 người thừa kế; thời gian niêm yết không tính vào thời hạn công chứng.","Người thừa kế có thể yêu cầu công chứng văn bản từ chối nhận di sản; không được nhằm trốn tránh nghĩa vụ tài sản."]},{"t":"Gửi giữ và công bố di chúc","cs":"Điều 61 LCC; Điều 45 NĐ 104","b":["Người lập di chúc có thể gửi giữ di chúc tại tổ chức hành nghề công chứng.","Công chứng viên bảo quản, công bố di chúc khi người lập di chúc chết theo quy định của BLDS và Nghị định."]},{"t":"Công chứng điện tử","cs":"Điều 62 – Điều 65 LCC; Điều 47 – Điều 54 NĐ 104","b":["Hai hình thức: công chứng điện tử trực tiếp (các bên có mặt tại tổ chức hành nghề công chứng) và công chứng điện tử trực tuyến (các bên ở các địa điểm khác nhau).","Chỉ áp dụng với giao dịch thuộc phạm vi Chính phủ quy định và tổ chức đáp ứng điều kiện cung cấp dịch vụ.","Văn bản công chứng điện tử có hiệu lực khi có chữ ký số của công chứng viên và tổ chức hành nghề công chứng; được lưu trữ, xác minh qua nền tảng công chứng điện tử."]}]},{"t":"Chương 6. Chứng thực","cs":"Nghị định 23/2015/NĐ-CP (sửa đổi bởi Nghị định 280/2025, Nghị định 18/2026); Thông tư 01/2020/TT-BTP","b":["Năm nội dung: thẩm quyền và quy định chung; cấp bản sao từ sổ gốc; chứng thực bản sao từ bản chính; chứng thực chữ ký; chứng thực hợp đồng, giao dịch."],"c":[{"t":"Thẩm quyền chứng thực","cs":"Điều 5 NĐ 23 (sửa đổi bởi NĐ 280/2025)","b":["Chủ tịch UBND cấp xã: bản sao từ bản chính (kể cả giấy tờ do cơ quan nước ngoài cấp, chứng nhận); chữ ký, chữ ký người dịch; hợp đồng, giao dịch về động sản, quyền sử dụng đất, nhà ở; di chúc, văn bản từ chối nhận di sản, văn bản phân chia di sản. Việc phân công, ủy quyền ký theo pháp luật về tổ chức chính quyền địa phương.","Công chứng viên: bản sao từ bản chính, chữ ký, chữ ký người dịch; tổ chức hành nghề công chứng đóng dấu.","Cơ quan đại diện của Việt Nam ở nước ngoài: bản sao, chữ ký, chữ ký người dịch; viên chức ngoại giao, lãnh sự ký.","Chính quyền địa phương 02 cấp: không còn cấp huyện, các việc chứng thực trước đây của Phòng Tư pháp cấp huyện chuyển về cấp xã hoặc tổ chức hành nghề công chứng."],"c":[{"t":"Không phụ thuộc nơi cư trú","cs":"Điều 5 NĐ 23 (sửa đổi)","b":["Chứng thực bản sao, chữ ký, giao dịch về động sản, di chúc, văn bản từ chối nhận di sản, văn bản ủy quyền liên quan đến quyền sử dụng đất, nhà ở được thực hiện không phụ thuộc nơi cư trú của người yêu cầu.","Giao dịch thực hiện quyền của người sử dụng đất, nhà ở thì chứng thực tại UBND cấp xã nơi có đất, nhà ở."]}]},{"t":"Quy định chung","cs":"Điều 6 – Điều 13 NĐ 23 (đã sửa đổi)","b":[],"c":[{"t":"Không được yêu cầu bản sao chứng thực","cs":"Điều 6 NĐ 23; NĐ 280/2025","b":["Cơ quan tiếp nhận bản sao không có chứng thực thì có quyền yêu cầu xuất trình bản chính để đối chiếu; không được yêu cầu nộp bản sao có chứng thực.","Giấy tờ đã tích hợp trên VNeID hoặc khai thác được từ cơ sở dữ liệu thì không yêu cầu bản chính, bản sao (NĐ 280/2025).","Cơ quan vẫn được yêu cầu xuất trình bản chính, bản sao từ sổ gốc khi có căn cứ nghi ngờ."]},{"t":"Thời hạn","cs":"Điều 7 NĐ 23","b":["Bản sao, chữ ký: trong ngày; tiếp nhận sau 15 giờ thì trả chậm nhất trong ngày làm việc tiếp theo; yêu cầu số lượng lớn thì thỏa thuận bằng văn bản về thời gian.","Hợp đồng, giao dịch: không quá 02 ngày làm việc (hoặc dài hơn theo thỏa thuận)."]},{"t":"Trách nhiệm","cs":"Điều 4, Điều 9 NĐ 23","b":["Người yêu cầu chịu trách nhiệm về nội dung, tính hợp lệ, hợp pháp của giấy tờ làm cơ sở chứng thực.","Người thực hiện chịu trách nhiệm về tính chính xác, hợp pháp của việc chứng thực (bản sao đúng bản chính; chữ ký đúng người; các yếu tố của hợp đồng đã chứng thực)."]}]},{"t":"Cấp bản sao từ sổ gốc","cs":"Điều 16 – Điều 19 NĐ 23","b":["Do cơ quan, tổ chức đang quản lý sổ gốc thực hiện (ví dụ trường đã cấp bằng, cơ quan hộ tịch).","Người có quyền yêu cầu: người được cấp bản chính; người đại diện; cha, mẹ, con, vợ, chồng, anh chị em ruột, người thừa kế khác khi người được cấp đã chết.","Dùng khi bản chính bị mất, hư hỏng; không cần xuất trình bản chính."]},{"t":"Chứng thực bản sao từ bản chính","cs":"Điều 18 – Điều 22 NĐ 23","b":["Người yêu cầu xuất trình bản chính và bản chụp (hoặc đề nghị chụp); người thực hiện đối chiếu, ghi lời chứng, ký, đóng dấu.","Không được chứng thực khi bản chính: bị tẩy xóa, sửa chữa, thêm, bớt nội dung không hợp lệ; hư hỏng, cũ nát không xác định được nội dung; đóng dấu mật hoặc ghi không được sao chụp; có nội dung trái pháp luật, đạo đức xã hội; do cá nhân tự lập không có xác nhận của cơ quan có thẩm quyền; giấy tờ nước ngoài chưa hợp pháp hóa lãnh sự (trừ trường hợp được miễn)."]},{"t":"Chứng thực chữ ký","cs":"Điều 23 – Điều 33 NĐ 23 (Điều 31 sửa đổi bởi NĐ 280/2025)","b":["Người yêu cầu phải ký trước mặt người thực hiện chứng thực; chữ ký ký sẵn không được chứng thực.","Không chứng thực khi người yêu cầu không nhận thức, làm chủ được hành vi; giấy tờ có nội dung trái pháp luật, đạo đức; giấy tờ có nội dung là hợp đồng, giao dịch (trừ một số trường hợp luật định như giấy ủy quyền đủ điều kiện).","Giấy ủy quyền được chứng thực chữ ký khi: không có thù lao, không có nghĩa vụ bồi thường của bên được ủy quyền, không liên quan đến chuyển quyền sở hữu tài sản, quyền sử dụng bất động sản.","Chữ ký người dịch: người dịch là cộng tác viên hoặc người có trình độ ngoại ngữ; NĐ 280/2025 nới điều kiện với ngôn ngữ không phổ biến (chứng minh môi trường sử dụng ngôn ngữ và cam kết)."]},{"t":"Chứng thực hợp đồng, giao dịch","cs":"Điều 34 – Điều 41 NĐ 23","b":["Các bên ký trước mặt người thực hiện chứng thực; không ký được thì điểm chỉ; không đọc, không nghe, không ký, không điểm chỉ được thì phải có người làm chứng không có quyền, lợi ích liên quan.","Người thực hiện chịu trách nhiệm về thời gian, địa điểm giao kết, năng lực hành vi, ý chí tự nguyện, chữ ký hoặc điểm chỉ; không chịu trách nhiệm về nội dung hợp đồng.","Có thể chứng thực ngoài trụ sở với người già yếu, không đi lại được, đang điều trị nội trú, bị tạm giữ, tạm giam… hoặc lý do chính đáng khác.","Sửa đổi, bổ sung, hủy bỏ hợp đồng đã chứng thực: có thỏa thuận bằng văn bản của các bên và chứng thực tại cơ quan đã chứng thực hợp đồng; sửa lỗi sai sót kỹ thuật do người thực hiện chứng thực sửa, ký, đóng dấu vào chỗ sửa.","Di chúc: người lập di chúc tự mình yêu cầu, không ủy quyền."]}]},{"t":"Chương 7. Phí, giá dịch vụ và quản lý nhà nước","cs":"Chương VII LCC (Điều 70 – Điều 72); Thông tư 257/2016 (sửa đổi bởi Thông tư 111/2017); Thông tư 226/2016; Nghị định 109/2026","b":["Ba nội dung: phí công chứng và chi phí khác; phí chứng thực; quản lý nhà nước và xử lý vi phạm."],"c":[{"t":"Phí công chứng","cs":"Điều 70 LCC; Thông tư 257/2016 (sửa đổi)","b":["Gồm phí công chứng giao dịch, phí lưu giữ di chúc, phí cấp bản sao văn bản công chứng; người yêu cầu nộp khi yêu cầu công chứng.","Hợp đồng tính theo giá trị tài sản hoặc giá trị hợp đồng: đến 50 triệu: 50.000 đ; trên 50 – 100 triệu: 100.000 đ; trên 100 triệu – 1 tỷ: 0,1% giá trị; trên 1 – 3 tỷ: 1.000.000 đ + 0,06% phần vượt 1 tỷ; trên 3 – 5 tỷ: 2.200.000 đ + 0,05% phần vượt 3 tỷ; trên 5 – 10 tỷ: 3.200.000 đ + 0,04% phần vượt 5 tỷ; trên 10 – 100 tỷ: 5.200.000 đ + 0,03% phần vượt 10 tỷ; trên 100 tỷ: 32.200.000 đ + 0,02% phần vượt 100 tỷ, tối đa 70.000.000 đ/trường hợp.","Giao dịch về quyền sử dụng đất, tài sản có giá do Nhà nước quy định: nếu giá thỏa thuận thấp hơn giá Nhà nước thì tính theo giá Nhà nước.","Thông tư 64/2025/TT-BTC giảm một số khoản phí, lệ phí đến hết 31/12/2026: kiểm tra phạm vi áp dụng tại thời điểm thực hiện."]},{"t":"Giá dịch vụ và chi phí khác","cs":"Điều 71, Điều 72 LCC","b":["Giá dịch vụ theo yêu cầu (soạn thảo giao dịch, đánh máy, sao chụp, dịch thuật…) do tổ chức hành nghề công chứng xác định, niêm yết công khai.","Chi phí khác (xác minh, giám định, công chứng ngoài trụ sở…) do người yêu cầu và tổ chức hành nghề công chứng thỏa thuận."]},{"t":"Phí chứng thực","cs":"Thông tư 226/2016/TT-BTC","b":["Bản sao từ bản chính: 2.000 đ/trang cho trang thứ nhất và thứ hai; từ trang thứ ba 1.000 đ/trang; tối đa 200.000 đ/bản.","Chứng thực chữ ký: 10.000 đ/trường hợp.","Chứng thực hợp đồng, giao dịch: 50.000 đ/hợp đồng; sửa đổi, bổ sung, hủy bỏ: 30.000 đ; sửa lỗi sai sót: 25.000 đ.","Cấp bản sao từ sổ gốc thu theo quy định riêng của từng lĩnh vực."]},{"t":"Quản lý nhà nước và xử lý vi phạm","cs":"Điều 8 LCC; Điều 62, Điều 63 NĐ 104; Nghị định 109/2026","b":["Chính phủ thống nhất quản lý; Bộ Tư pháp chịu trách nhiệm trước Chính phủ; UBND cấp tỉnh quản lý tại địa phương, Sở Tư pháp là cơ quan giúp việc.","Vi phạm trong hoạt động công chứng, chứng thực bị xử phạt hành chính theo Nghị định 109/2026; tùy tính chất có thể bị tạm đình chỉ, miễn nhiệm, thu hồi quyết định cho phép thành lập hoặc truy cứu trách nhiệm hình sự."]}]}],"upd":{"t":"Điểm cần lưu ý cập nhật","cs":"Đối chiếu văn bản tại ngày 21/10/2026","b":["Luật số 04/2026/QH16 sửa đổi, bổ sung một số điều của Luật Công chứng có hiệu lực từ 01/01/2027; nội dung trong sơ đồ này là pháp luật đang có hiệu lực trước ngày đó.","Thẩm quyền bổ nhiệm, miễn nhiệm công chứng viên: Luật ghi Bộ trưởng Bộ Tư pháp, Nghị định 121/2025 phân cấp cho Chủ tịch UBND cấp tỉnh.","Nghị định 280/2025 (hiệu lực 01/11/2025) sửa Nghị định 23/2015 theo mô hình chính quyền 02 cấp: thẩm quyền chứng thực của cấp huyện không còn; tăng thủ tục trực tuyến và khai thác VNeID.","Thông tư 64/2025/TT-BTC: mức giảm phí, lệ phí chỉ áp dụng đến 31/12/2026.","Số điều của Nghị định 23/2015 dẫn ở đây theo bản gốc; khi trích dẫn, kiểm tra lại bản hợp nhất sau các lần sửa đổi."]}}}</script>
