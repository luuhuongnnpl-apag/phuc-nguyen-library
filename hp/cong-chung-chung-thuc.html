,"lv":"VD","q":"Bà B mang bằng thạc sĩ do trường đại học của Úc cấp, chưa hợp pháp hóa lãnh sự và không thuộc diện được miễn, yêu cầu chứng thực bản sao. Người thực hiện chứng thực:","o":["Chứng thực và ghi chú chưa hợp pháp hóa","Phải từ chối chứng thực","Chỉ chứng thực bản dịch","Chứng thực bình thường"],"a":1,"e":"Đoạn 2 khoản 1 Điều 20 và khoản 5 Điều 22 NĐ 23: bản chính do cơ quan có thẩm quyền của nước ngoài cấp phải được hợp pháp hóa lãnh sự trước khi yêu cầu chứng thực bản sao, trừ trường hợp được miễn. Người thực hiện chứng thực phải từ chối (khoản 4 Điều 9).","b":"Khoản 1 Điều 20, khoản 5 Điều 22, khoản 4 Điều 9 NĐ 23/2015"},{"id":"7.13","g":7,"lv":"VD","q":"Ông C mang Giấy chứng nhận quyền sử dụng đất bị rách một góc nhưng vẫn xác định được toàn bộ nội dung để chứng thực bản sao. Người thực hiện chứng thực:","o":["Chỉ chứng thực phần không bị rách","Phải từ chối vì bản chính bị hư hỏng","Được chứng thực vì vẫn xác định được nội dung","Phải yêu cầu cấp lại Giấy chứng nhận trước"],"a":2,"e":"Khoản 2 Điều 22 NĐ 23 chỉ loại trừ bản chính bị hư hỏng, cũ nát “không xác định được nội dung”. Giấy chứng nhận rách góc nhưng vẫn xác định được toàn bộ nội dung thì vẫn được dùng làm cơ sở chứng thực.","b":"Khoản 2 Điều 22 NĐ 23/2015"},{"id":"7.14","g":7,"lv":"VD","q":"Chị D chỉ mang theo bản chính giấy khai sinh, không mang bản chụp. Cơ quan chứng thực:","o":["Chụp từ bản chính để chứng thực, trừ trường hợp không có phương tiện để chụp","Chứng thực trực tiếp trên bản chính","Từ chối, yêu cầu chị D tự đi photo","Yêu cầu nộp thêm phí phạt"],"a":0,"e":"Khoản 2 Điều 20 NĐ 23: trường hợp người yêu cầu chỉ xuất trình bản chính thì cơ quan, tổ chức tiến hành chụp từ bản chính để thực hiện chứng thực, trừ trường hợp không có phương tiện để chụp.","b":"Khoản 2 Điều 20 NĐ 23/2015"},{"id":"7.15","g":7,"lv":"VD","q":"Ông E yêu cầu chứng thực bản sao một văn bằng có dấu hiệu bị sửa chữa năm tốt nghiệp. Người thực hiện chứng thực:","o":["Vẫn chứng thực vì chỉ chịu trách nhiệm bản sao đúng với bản chính","Chuyển cho trường cấp bằng chứng thực","Từ chối vì bản chính bị sửa chữa nội dung không hợp lệ","Chứng thực và ghi chú nghi vấn"],"a":2,"e":"Khoản 1 Điều 22 NĐ 23: bản chính bị tẩy xóa, sửa chữa, thêm, bớt nội dung không hợp lệ thì không được dùng làm cơ sở chứng thực. Theo khoản 3 Điều 20, người thực hiện chứng thực phải kiểm tra bản chính trước khi chứng thực, nên phải từ chối.","b":"Khoản 1 Điều 22, khoản 3 Điều 20 NĐ 23/2015"},{"id":"7.16","g":7,"lv":"VD","q":"Ông F đã chết. Con ông yêu cầu cấp bản sao từ sổ gốc một giấy tờ đã cấp cho ông F. Người con phải:","o":["Không cần giấy tờ gì thêm","Xuất trình giấy tờ chứng minh quan hệ với ông F","Có bản án công nhận quyền thừa kế","Có văn bản đồng ý của tất cả người thừa kế"],"a":1,"e":"Khoản 3 Điều 16 NĐ 23 cho phép con của người được cấp bản chính đã chết yêu cầu cấp bản sao từ sổ gốc. Điểm b khoản 1 Điều 17 NĐ 23 (đã sửa đổi bởi NĐ 280/2025): hồ sơ phải có bản chính hoặc bản sao có chứng thực giấy tờ chứng minh quan hệ với người được cấp bản chính.","b":"Khoản 3 Điều 16, điểm b khoản 1 Điều 17 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"7.17","g":7,"lv":"VD","q":"Bạn thân của chị G (không có văn bản ủy quyền) yêu cầu cấp bản sao từ sổ gốc giấy tờ của chị G khi chị G đang sống. Cơ quan quản lý sổ gốc:","o":["Phải cấp bản sao","Không cấp vì người này không thuộc đối tượng có quyền yêu cầu","Cấp nếu người này cam kết bằng văn bản","Cấp nếu có người làm chứng"],"a":1,"e":"Điều 16 NĐ 23 chỉ cho phép người được cấp bản chính, người đại diện theo pháp luật hoặc theo ủy quyền, và thân nhân, người thừa kế khi người đó đã chết yêu cầu cấp bản sao từ sổ gốc. Bạn thân không có ủy quyền không thuộc các đối tượng này.","b":"Điều 16 NĐ 23/2015"},{"id":"7.18","g":7,"lv":"VD","q":"Chị H yêu cầu chứng thực bản sao thẻ căn cước nhưng bản chụp chỉ có mặt trước. Người thực hiện chứng thực:","o":["Chứng thực và ghi chú thiếu mặt sau","Không chứng thực vì bản sao phải gồm đầy đủ số trang có thông tin của bản chính","Chỉ cần chị H ký cam kết","Được chứng thực bản sao mặt trước"],"a":1,"e":"Điều 10 TT 01: bản sao từ bản chính để chứng thực phải gồm đầy đủ số trang có thông tin của bản chính. Thẻ căn cước có thông tin ở cả hai mặt nên bản sao chỉ có mặt trước không được chứng thực.","b":"Điều 10 Thông tư 01/2020/TT-BTP"},{"id":"7.19","g":7,"lv":"VD","q":"Giấy tờ do cơ quan nước ngoài cấp, thuộc diện được miễn hợp pháp hóa lãnh sự theo điều ước quốc tế mà Việt Nam là thành viên:","o":["Được chứng thực bản sao mà không cần hợp pháp hóa lãnh sự","Không được chứng thực bản sao","Chỉ được chứng thực tại Bộ Ngoại giao","Vẫn phải hợp pháp hóa lãnh sự"],"a":0,"e":"Đoạn 2 khoản 1 Điều 20 NĐ 23: giấy tờ do cơ quan nước ngoài cấp phải hợp pháp hóa lãnh sự “trừ trường hợp được miễn hợp pháp hóa lãnh sự theo điều ước quốc tế mà Việt Nam là thành viên hoặc theo nguyên tắc có đi, có lại”.","b":"Khoản 1 Điều 20 NĐ 23/2015"},{"id":"7.20","g":7,"lv":"VD","q":"Ông K yêu cầu chứng thực bản sao bản tường trình do chính ông tự lập, đã có xác nhận và đóng dấu của Ủy ban nhân dân phường có thẩm quyền. Bản tường trình này:","o":["Chỉ được chứng thực chữ ký","Phải công chứng trước","Không được chứng thực vì do cá nhân tự lập","Đủ điều kiện làm cơ sở để chứng thực bản sao"],"a":3,"e":"Khoản 2 Điều 18 NĐ 23: bản chính giấy tờ do cá nhân tự lập có xác nhận và đóng dấu của cơ quan, tổ chức có thẩm quyền là giấy tờ làm cơ sở để chứng thực bản sao. So sánh với Câu 125 để thấy vai trò của việc xác nhận, đóng dấu.","b":"Khoản 2 Điều 18 NĐ 23/2015"},{"id":"8.01","g":8,"lv":"NB","q":"Người yêu cầu chứng thực chữ ký phải ký như thế nào?","o":["Ký trước mặt người thực hiện chứng thực; tại bộ phận một cửa thì ký trước mặt công chức tiếp nhận hồ sơ","Không cần ký trước mặt ai","Ký trước ở nhà rồi mang đến","Ký trước mặt hai người làm chứng"],"a":0,"e":"Khoản 2 Điều 24 NĐ 23: người thực hiện chứng thực yêu cầu người yêu cầu chứng thực ký trước mặt. Khoản 3 Điều 24: tại bộ phận một cửa, công chức tiếp nhận đề nghị người yêu cầu ký vào giấy tờ rồi chuyển cho người có thẩm quyền ký chứng thực.","b":"Khoản 2, khoản 3 Điều 24 NĐ 23/2015"},{"id":"8.02","g":8,"lv":"TH","q":"Trường hợp nào sau đây KHÔNG được chứng thực chữ ký?","o":["Chữ ký trên đơn đề nghị","Chữ ký trên bản tường trình","Chữ ký trên giấy tờ có nội dung là hợp đồng mua bán tài sản giữa hai cá nhân","Chữ ký trên giấy ủy quyền nhận hộ lương hưu không có thù lao"],"a":2,"e":"Khoản 4 Điều 25 NĐ 23: không được chứng thực chữ ký trong giấy tờ, văn bản có nội dung là hợp đồng, giao dịch (trừ giấy ủy quyền theo điểm d khoản 4 Điều 24 hoặc pháp luật quy định khác). Hợp đồng mua bán phải làm thủ tục chứng thực hợp đồng hoặc công chứng.","b":"Khoản 4 Điều 25 NĐ 23/2015"},{"id":"8.03","g":8,"lv":"NB","q":"Khi người yêu cầu chứng thực không ký được, thủ tục áp dụng là:","o":["Chứng thực điểm chỉ, áp dụng thủ tục như chứng thực chữ ký","Người thân ký thay","Từ chối chứng thực","Chứng thực qua người làm chứng"],"a":0,"e":"Điều 26 NĐ 23: thủ tục chứng thực chữ ký và trường hợp không được chứng thực chữ ký cũng được áp dụng đối với chứng thực điểm chỉ khi người yêu cầu không ký được, và trường hợp không thể ký, điểm chỉ được.","b":"Điều 26 NĐ 23/2015"},{"id":"8.04","g":8,"lv":"NB","q":"Tiêu chuẩn của người dịch theo Nghị định 23/2015/NĐ-CP là:","o":["Có năng lực hành vi dân sự đầy đủ và có bằng cử nhân ngoại ngữ trở lên hoặc tốt nghiệp đại học trở lên đối với thứ tiếng cần dịch (ngôn ngữ không phổ biến thì phải thông thạo)","Chỉ cần có chứng chỉ ngoại ngữ bậc B","Phải có 05 năm kinh nghiệm dịch thuật","Phải là công chức"],"a":0,"e":"Điều 27 NĐ 23 quy định tiêu chuẩn, điều kiện của người dịch đúng như nội dung câu hỏi, kể cả ngoại lệ đối với ngôn ngữ không phổ biến.","b":"Điều 27 NĐ 23/2015"},{"id":"8.05","g":8,"lv":"NB","q":"Giấy tờ nào sau đây KHÔNG được dịch để yêu cầu chứng thực chữ ký người dịch?","o":["Bằng tốt nghiệp","Giấy tờ đóng dấu mật hoặc ghi rõ không được dịch","Hộ chiếu","Giấy khai sinh"],"a":1,"e":"Khoản 3 Điều 32 NĐ 23: giấy tờ, văn bản đóng dấu mật hoặc không đóng dấu mật nhưng ghi rõ không được dịch thuộc trường hợp không được dịch để chứng thực chữ ký người dịch.","b":"Khoản 3 Điều 32 NĐ 23/2015"},{"id":"8.06","g":8,"lv":"NB","q":"Thời hạn chứng thực hợp đồng, giao dịch là:","o":["Không quá 30 ngày","Không quá 02 ngày làm việc kể từ ngày nhận đủ hồ sơ, hoặc dài hơn theo thỏa thuận bằng văn bản","Ngay trong ngày","Không quá 10 ngày làm việc"],"a":1,"e":"Điều 37 NĐ 23: thời hạn chứng thực hợp đồng, giao dịch không quá 02 ngày làm việc kể từ ngày nhận đủ hồ sơ, hoặc có thể kéo dài hơn theo thỏa thuận bằng văn bản.","b":"Điều 37 NĐ 23/2015"},{"id":"8.07","g":8,"lv":"TH","q":"Ai chịu trách nhiệm về nội dung, tính hợp pháp của hợp đồng, giao dịch được chứng thực?","o":["Người thực hiện chứng thực","Người làm chứng","Ủy ban nhân dân cấp xã","Người yêu cầu chứng thực"],"a":3,"e":"Khoản 1 Điều 35 NĐ 23: người yêu cầu chứng thực phải hoàn toàn chịu trách nhiệm về nội dung, tính hợp pháp của hợp đồng. Theo khoản 2 Điều 35, người thực hiện chứng thực chỉ chịu trách nhiệm về thời gian, địa điểm, năng lực hành vi, ý chí tự nguyện, chữ ký hoặc điểm chỉ (nhưng có quyền từ chối hợp đồng có nội dung trái pháp luật).","b":"Khoản 1, khoản 2 Điều 35 NĐ 23/2015"},{"id":"8.08","g":8,"lv":"TH","q":"Người yêu cầu chứng thực hợp đồng không đọc được, không nghe được, không ký, không điểm chỉ được thì phải có:","o":["01 người làm chứng","Không cần người làm chứng","02 người làm chứng","03 người làm chứng"],"a":2,"e":"Đoạn 3 khoản 3 Điều 36 NĐ 23: nếu người yêu cầu chứng thực không đọc được, không nghe được, không ký, không điểm chỉ được thì phải có 02 (hai) người làm chứng. Cần phân biệt với thủ tục công chứng tại khoản 2 Điều 49 LCC (không quy định số lượng hai người).","b":"Khoản 3 Điều 36 NĐ 23/2015; khoản 2 Điều 49 LCC"},{"id":"8.09","g":8,"lv":"TH","q":"Về nơi chứng thực việc sửa đổi, bổ sung, hủy bỏ hợp đồng, giao dịch đã chứng thực, quy định đúng là:","o":["Chỉ thực hiện tại Phòng Tư pháp","Không được sửa đổi, phải lập giao dịch mới","Thực hiện tại bất kỳ cơ quan nào kể cả với hợp đồng","Thực hiện tại cơ quan đã chứng thực; riêng di chúc có thể chứng thực tại bất kỳ cơ quan có thẩm quyền nào"],"a":3,"e":"Khoản 2 Điều 38 NĐ 23: việc sửa đổi, bổ sung, hủy bỏ hợp đồng được thực hiện tại cơ quan đã chứng thực; riêng di chúc có thể chứng thực tại bất kỳ cơ quan có thẩm quyền nào và cơ quan thực hiện phải thông báo cho cơ quan đã chứng thực trước đó.","b":"Khoản 2 Điều 38 NĐ 23/2015"},{"id":"8.10","g":8,"lv":"TH","q":"Phạm vi chứng thực hợp đồng, giao dịch gồm:","o":["Chỉ hợp đồng có giá trị dưới 50 triệu đồng","Hợp đồng, giao dịch pháp luật quy định phải chứng thực và hợp đồng, giao dịch cá nhân, tổ chức tự nguyện yêu cầu chứng thực","Chỉ hợp đồng, giao dịch pháp luật quy định phải chứng thực","Chỉ hợp đồng về bất động sản"],"a":1,"e":"Điều 34 NĐ 23: phạm vi chứng thực gồm cả hợp đồng, giao dịch mà pháp luật không quy định phải chứng thực nhưng cá nhân, tổ chức tự nguyện yêu cầu chứng thực.","b":"Điều 34 NĐ 23/2015"},{"id":"8.11","g":8,"lv":"VD","q":"Ông A muốn ủy quyền cho con gái nhận hộ lương hưu (không thù lao, không nghĩa vụ bồi thường). Hình thức phù hợp là:","o":["Lập giấy ủy quyền và chứng thực chữ ký của ông A","Phải có bản án của Tòa án","Chỉ cần ủy quyền miệng","Bắt buộc lập hợp đồng ủy quyền có công chứng"],"a":0,"e":"Điểm d khoản 4 Điều 24 NĐ 23: thủ tục chứng thực chữ ký áp dụng với giấy ủy quyền không có thù lao, không có nghĩa vụ bồi thường của bên được ủy quyền và không liên quan đến việc chuyển quyền sở hữu tài sản, quyền sử dụng bất động sản. Ủy quyền nhận hộ lương hưu thỏa mãn các điều kiện này.","b":"Điểm d khoản 4 Điều 24 NĐ 23/2015"},{"id":"8.12","g":8,"lv":"VD","q":"Bà B muốn ủy quyền cho cháu bán chiếc ô tô của mình và nhận tiền bán xe. Hình thức đúng là:","o":["Lập hợp đồng ủy quyền và yêu cầu công chứng hoặc chứng thực hợp đồng","Ủy quyền miệng có người làm chứng","Lập giấy ủy quyền và chứng thực chữ ký","Chỉ cần đưa giấy đăng ký xe cho cháu"],"a":0,"e":"Ủy quyền bán ô tô và nhận tiền liên quan đến việc chuyển quyền sở hữu tài sản nên không thuộc điểm d khoản 4 Điều 24 NĐ 23. Theo khoản 4 Điều 25, không được chứng thực chữ ký trên văn bản này; bà B phải lập hợp đồng ủy quyền và yêu cầu công chứng hoặc chứng thực hợp đồng.","b":"Điểm d khoản 4 Điều 24, khoản 4 Điều 25 NĐ 23/2015"},{"id":"8.13","g":8,"lv":"VD","q":"Anh C có bằng cử nhân tiếng Anh, tự dịch giấy tờ tiếng Anh của mình sang tiếng Việt để dùng cho mục đích cá nhân (không phải cộng tác viên dịch thuật). Anh C:","o":["Không được chứng thực vì không phải cộng tác viên","Phải thuê công ty dịch thuật","Chỉ được công chứng bản dịch","Có thể yêu cầu chứng thực chữ ký người dịch trên bản dịch"],"a":3,"e":"Khoản 2 Điều 31 NĐ 23: người không phải cộng tác viên dịch thuật tự dịch giấy tờ phục vụ mục đích cá nhân có thể yêu cầu chứng thực chữ ký trên bản dịch, khi xuất trình giấy tờ tùy thân, văn bằng ngoại ngữ (theo khoản 2 Điều 27) và bản dịch kèm giấy tờ cần dịch.","b":"Khoản 2 Điều 31, khoản 2 Điều 27 NĐ 23/2015"},{"id":"8.14","g":8,"lv":"VD","q":"Ông D 80 tuổi, tại thời điểm chứng thực có biểu hiện lú lẫn, không nhận thức được việc mình làm, yêu cầu chứng thực chữ ký. Người thực hiện chứng thực:","o":["Chứng thực điểm chỉ thay chữ ký","Không được chứng thực chữ ký","Chứng thực nếu có người thân đi cùng","Vẫn chứng thực vì có giấy tờ tùy thân hợp lệ"],"a":1,"e":"Khoản 1 Điều 25 NĐ 23: không được chứng thực chữ ký nếu tại thời điểm chứng thực người yêu cầu không nhận thức và làm chủ được hành vi của mình. Giấy tờ tùy thân hợp lệ không thay thế được điều kiện này.","b":"Khoản 1 Điều 25 NĐ 23/2015"},{"id":"8.15","g":8,"lv":"VD","q":"Ông E và bà F yêu cầu chứng thực hợp đồng chuyển nhượng thửa đất đã có Giấy chứng nhận. Hồ sơ cần có:","o":["Bản án của Tòa án","Chỉ giấy tờ tùy thân","Xác nhận của hàng xóm về ranh giới","Dự thảo hợp đồng, giấy tờ tùy thân và Giấy chứng nhận quyền sử dụng đất (hoặc giấy tờ thay thế theo quy định)"],"a":3,"e":"Khoản 1 Điều 36 NĐ 23 (đã sửa đổi bởi NĐ 280/2025): người yêu cầu xuất trình một trong các giấy tờ tùy thân (căn cước điện tử, thẻ căn cước, hộ chiếu…) và nộp dự thảo giao dịch cùng giấy chứng nhận quyền sử dụng hoặc giấy tờ thay thế. Giấy chứng nhận là bản chính, bản sao có chứng thực hoặc bản sao điện tử được chứng thực; nộp trực tiếp thì có thể nộp bản sao kèm bản chính để đối chiếu.","b":"Khoản 1 Điều 36 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"8.16","g":8,"lv":"VD","q":"Công ty X đã đăng ký chữ ký mẫu của giám đốc tại cơ quan chứng thực; giám đốc ký trước vào hợp đồng thuê xe rồi chuyển đến chứng thực. Người thực hiện chứng thực:","o":["Yêu cầu công ty đóng dấu lại","Chỉ chứng thực chữ ký bên còn lại","Đối chiếu với chữ ký mẫu để chứng thực; chỉ khi nghi ngờ mới yêu cầu ký trước mặt","Phải từ chối vì giám đốc không ký trước mặt"],"a":2,"e":"Đoạn 2 khoản 3 Điều 36 NĐ 23: người có thẩm quyền giao kết hợp đồng của doanh nghiệp đã đăng ký chữ ký mẫu có thể ký trước vào hợp đồng. Người thực hiện chứng thực đối chiếu với chữ ký mẫu; chỉ khi nghi ngờ mới yêu cầu ký trước mặt.","b":"Khoản 3 Điều 36 NĐ 23/2015"},{"id":"8.17","g":8,"lv":"VD","q":"Hợp đồng mua bán xe máy được chứng thực tại Ủy ban nhân dân xã A. Các bên muốn chứng thực việc hủy bỏ hợp đồng tại Ủy ban nhân dân xã B. Việc này:","o":["Đúng nếu hai bên cư trú tại xã B","Đúng quy định","Đúng nếu được xã A đồng ý bằng điện thoại","Không đúng; việc hủy bỏ phải thực hiện tại Ủy ban nhân dân xã A"],"a":3,"e":"Khoản 2 Điều 38 NĐ 23: việc sửa đổi, bổ sung, hủy bỏ hợp đồng, giao dịch được thực hiện tại cơ quan đã chứng thực hợp đồng, giao dịch, tức Ủy ban nhân dân xã A. Chỉ di chúc mới được thực hiện tại bất kỳ cơ quan nào.","b":"Khoản 2 Điều 38 NĐ 23/2015"},{"id":"8.18","g":8,"lv":"VD","q":"Hợp đồng tặng cho xe đã chứng thực ghi sai một ký tự số khung do lỗi đánh máy. Cách sửa đúng là:","o":["Các bên thỏa thuận bằng văn bản về việc sửa lỗi; thực hiện tại cơ quan đã chứng thực hợp đồng","Tự sửa bằng tay trên hợp đồng","Yêu cầu Tòa án sửa","Lập hợp đồng mới thay thế"],"a":0,"e":"Khoản 1 Điều 39 NĐ 23: việc sửa lỗi sai sót do ghi chép, đánh máy, in hợp đồng đã chứng thực được thực hiện theo thỏa thuận bằng văn bản của các bên, nếu không ảnh hưởng đến quyền, nghĩa vụ và được thực hiện tại cơ quan đã chứng thực.","b":"Khoản 1 Điều 39 NĐ 23/2015"},{"id":"8.19","g":8,"lv":"VD","q":"Ông H không thông thạo tiếng Việt yêu cầu chứng thực hợp đồng tặng cho xe. Trách nhiệm của người phiên dịch là:","o":["Chỉ dịch tóm tắt nội dung chính","Không phải ký vào hợp đồng","Dịch đầy đủ, chính xác nội dung hợp đồng, lời chứng và ký vào từng trang hợp đồng với tư cách người phiên dịch","Chỉ ký vào trang cuối"],"a":2,"e":"Khoản 5 Điều 36 NĐ 23: người phiên dịch có trách nhiệm dịch đầy đủ, chính xác nội dung của hợp đồng, nội dung lời chứng cho người yêu cầu chứng thực và ký vào từng trang hợp đồng với tư cách là người phiên dịch.","b":"Khoản 5 Điều 36 NĐ 23/2015"},{"id":"8.20","g":8,"lv":"VD","q":"Chủ tịch Ủy ban nhân dân xã có được chứng thực hợp đồng chuyển nhượng quyền sử dụng đất mà bên nhận chuyển nhượng là con rể của mình không?","o":["Không, vì con rể thuộc người thân thích theo Nghị định 23/2015","Được, vì không có quan hệ huyết thống","Được, nếu hợp đồng có giá trị nhỏ","Được, nếu có người làm chứng"],"a":0,"e":"Khoản 3 Điều 9 NĐ 23 xác định người thân thích bao gồm cả “con dâu, con rể”, không chỉ người có quan hệ huyết thống. Chủ tịch Ủy ban nhân dân xã không được chứng thực hợp đồng mà con rể của mình là một bên.","b":"Khoản 3 Điều 9 NĐ 23/2015"},{"id":"9.01","g":9,"lv":"NB","q":"Phí công chứng bao gồm:","o":["Chỉ phí công chứng giao dịch","Phí công chứng và chi phí đi lại","Phí công chứng và thù lao soạn thảo","Phí công chứng giao dịch, phí nhận lưu giữ di chúc, phí cấp bản sao văn bản công chứng"],"a":3,"e":"Khoản 1 Điều 70 LCC: phí công chứng bao gồm phí công chứng giao dịch, phí nhận lưu giữ di chúc, phí cấp bản sao văn bản công chứng. Người yêu cầu các việc này phải nộp phí.","b":"Khoản 1 Điều 70 LCC"},{"id":"9.02","g":9,"lv":"TH","q":"Mức thu phí công chứng được xác định như thế nào?","o":["Do Ủy ban nhân dân cấp tỉnh quyết định","Do từng tổ chức hành nghề công chứng tự quyết định","Theo pháp luật về phí, lệ phí (Thông tư 257/2016/TT-BTC)","Do các bên thỏa thuận"],"a":2,"e":"Khoản 2 Điều 70 LCC: mức thu, chế độ thu, nộp, sử dụng và quản lý phí công chứng thực hiện theo pháp luật về phí, lệ phí (hiện nay là TT 257). Tổ chức hành nghề công chứng chỉ được tự xác định giá dịch vụ theo yêu cầu trong phạm vi giá tối đa (khoản 2 Điều 71).","b":"Khoản 2 Điều 70, khoản 2 Điều 71 LCC; Thông tư 257/2016/TT-BTC"},{"id":"9.03","g":9,"lv":"NB","q":"Mức thu phí công chứng theo Thông tư 257/2016/TT-BTC áp dụng:","o":["Thống nhất đối với Phòng công chứng và Văn phòng công chứng","Khác nhau giữa các tỉnh","Chỉ với Phòng công chứng","Chỉ với Văn phòng công chứng"],"a":0,"e":"Khoản 1 Điều 4 TT 257: mức thu phí công chứng quy định tại Thông tư được áp dụng thống nhất đối với Phòng công chứng và Văn phòng công chứng.","b":"Khoản 1 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.04","g":9,"lv":"NB","q":"Giá tối đa đối với dịch vụ theo yêu cầu liên quan đến việc công chứng do cơ quan nào ban hành?","o":["Hiệp hội công chứng viên Việt Nam","Bộ Tài chính","Ủy ban nhân dân cấp tỉnh","Từng tổ chức hành nghề công chứng"],"a":2,"e":"Khoản 2 Điều 71 LCC: Ủy ban nhân dân cấp tỉnh ban hành giá tối đa đối với dịch vụ theo yêu cầu liên quan đến việc công chứng; tổ chức hành nghề công chứng xác định mức giá không vượt quá mức tối đa và niêm yết công khai.","b":"Khoản 2 Điều 71 LCC"},{"id":"9.05","g":9,"lv":"TH","q":"Chi phí công chứng ngoài trụ sở được xác định như thế nào?","o":["Bằng 200% phí công chứng","Miễn phí","Theo mức trần thống nhất toàn quốc","Do người yêu cầu công chứng và tổ chức hành nghề công chứng thỏa thuận; tổ chức phải niêm yết nguyên tắc tính chi phí"],"a":3,"e":"Điểm b khoản 1 và khoản 2 Điều 72 LCC: chi phí công chứng ngoài trụ sở là “chi phí khác”, mức chi phí do người yêu cầu công chứng và tổ chức hành nghề công chứng thỏa thuận. Tổ chức phải niêm yết nguyên tắc tính chi phí (khoản 3 Điều 72).","b":"Khoản 1, 2, 3 Điều 72 LCC"},{"id":"9.06","g":9,"lv":"TH","q":"Phí công chứng hợp đồng ủy quyền được tính:","o":["Do các bên thỏa thuận","Theo giá trị tài sản là đối tượng ủy quyền","Theo số trang hợp đồng","Theo mức cố định 50.000 đồng/trường hợp"],"a":3,"e":"Theo Điều 4 TT 257, công chứng hợp đồng ủy quyền thuộc nhóm việc có mức phí cố định, không tính theo giá trị tài sản: 50.000 đồng/trường hợp (giấy ủy quyền: 20.000 đồng/trường hợp).","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.07","g":9,"lv":"NB","q":"Trường hợp đơn vị thu phí là Văn phòng công chứng, mức thu phí theo Thông tư 257/2016/TT-BTC:","o":["Không chịu thuế","Được cộng thêm 10% thuế","Đã bao gồm thuế giá trị gia tăng","Chưa bao gồm thuế giá trị gia tăng"],"a":2,"e":"Khoản 1 Điều 4 TT 257: trường hợp đơn vị thu phí là Văn phòng công chứng thì mức thu phí đã bao gồm thuế giá trị gia tăng theo quy định của pháp luật về thuế.","b":"Khoản 1 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.08","g":9,"lv":"NB","q":"Phí chứng thực chữ ký là:","o":["5.000 đồng/trang","10.000 đồng/trường hợp (một hoặc nhiều chữ ký trong cùng một giấy tờ, văn bản)","20.000 đồng/trường hợp","10.000 đồng/chữ ký"],"a":1,"e":"Điều 4 TT 226 (biểu mức thu phí chứng thực): phí chứng thực chữ ký 10.000 đồng/trường hợp; “trường hợp” được hiểu là một hoặc nhiều chữ ký trong cùng một giấy tờ, văn bản. Mức này cũng áp dụng khi chứng thực tại tổ chức hành nghề công chứng theo TT 257.","b":"Điều 4 Thông tư 226/2016/TT-BTC"},{"id":"9.09","g":9,"lv":"TH","q":"Chi phí xác minh, giám định phục vụ việc công chứng do người yêu cầu đề nghị:","o":["Do người yêu cầu công chứng trả theo thỏa thuận","Được miễn","Do công chứng viên tự chịu","Do ngân sách nhà nước chi trả"],"a":0,"e":"Điểm a khoản 1 Điều 72 LCC: người yêu cầu công chứng phải trả chi phí trong trường hợp đề nghị xác minh, yêu cầu giám định phục vụ việc công chứng; mức chi phí do các bên thỏa thuận.","b":"Điểm a khoản 1 Điều 72 LCC"},{"id":"9.10","g":9,"lv":"NB","q":"Lệ phí cấp mới, cấp lại thẻ công chứng viên là:","o":["200.000 đồng/trường hợp","100.000 đồng/trường hợp","Miễn lệ phí","50.000 đồng/trường hợp"],"a":1,"e":"Điều 4 TT 257 quy định lệ phí cấp mới, cấp lại thẻ công chứng viên là 100.000 đồng/trường hợp.","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.11","g":9,"lv":"VD","q":"Hợp đồng mua bán xe ô tô có giá trị 800 triệu đồng. Phí công chứng là:","o":["400.000 đồng","300.000 đồng","800.000 đồng","1.600.000 đồng"],"a":2,"e":"Theo biểu mức thu theo giá trị tại khoản 2 Điều 4 TT 257, hợp đồng có giá trị từ trên 100 triệu đến 01 tỷ đồng chịu mức 0,1% giá trị. Phí = 0,1% × 800.000.000 = 800.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.12","g":9,"lv":"VD","q":"Hợp đồng chuyển nhượng quyền sử dụng đất ghi giá 2 tỷ đồng (cao hơn giá đất nhà nước quy định). Phí công chứng là:","o":["2.000.000 đồng","1.000.000 đồng","1.200.000 đồng","1.600.000 đồng"],"a":3,"e":"Biểu mức thu tại khoản 2 Điều 4 TT 257: từ trên 01 tỷ đến 03 tỷ đồng thu 01 triệu đồng cộng 0,06% phần giá trị vượt quá 01 tỷ. Phí = 1.000.000 + 0,06% × 1.000.000.000 = 1.600.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.13","g":9,"lv":"VD","q":"Hợp đồng chuyển nhượng quyền sử dụng đất ghi giá 300 triệu đồng; giá trị theo giá đất nhà nước quy định là 600 triệu đồng. Phí công chứng là:","o":["450.000 đồng","600.000 đồng (tính theo giá nhà nước)","900.000 đồng","300.000 đồng"],"a":1,"e":"Điểm d khoản 2 Điều 4 TT 257: nếu giá đất do các bên thỏa thuận thấp hơn giá do cơ quan nhà nước có thẩm quyền quy định thì giá trị tính phí được xác định theo giá nhà nước. Phí = 0,1% × 600.000.000 = 600.000 đồng.","b":"Điểm d khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.14","g":9,"lv":"VD","q":"Hợp đồng thuê nhà có tổng số tiền thuê 120 triệu đồng. Phí công chứng là:","o":["50.000 đồng","120.000 đồng","96.000 đồng (0,08% tổng tiền thuê)","240.000 đồng"],"a":2,"e":"Điều 4 TT 257 có biểu mức thu riêng cho hợp đồng thuê quyền sử dụng đất, thuê nhà ở, thuê tài sản (tính trên tổng số tiền thuê). Mức từ trên 100 triệu đến 01 tỷ đồng là 0,08%, nên phí = 0,08% × 120.000.000 = 96.000 đồng, không phải 120.000 đồng.","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.15","g":9,"lv":"VD","q":"Hợp đồng mua bán tài sản đấu giá có giá trị 6 tỷ đồng. Phí công chứng là:","o":["3.400.000 đồng","450.000 đồng","270.000 đồng","90.000 đồng"],"a":2,"e":"Điểm c khoản 2 Điều 4 TT 257 (sửa đổi bởi TT 111/2017): hợp đồng mua bán tài sản đấu giá có giá trị từ 5 tỷ đến dưới 20 tỷ đồng thu 270.000 đồng/trường hợp (dưới 5 tỷ: 90.000 đồng; trên 20 tỷ: 450.000 đồng).","b":"Điểm c khoản 2 Điều 4 Thông tư 257/2016/TT-BTC (sửa đổi bởi Thông tư 111/2017/TT-BTC)"},{"id":"9.16","g":9,"lv":"VD","q":"Hợp đồng tặng cho căn nhà có giá trị 12 tỷ đồng. Phí công chứng là:","o":["5.200.000 đồng","12.000.000 đồng","7.200.000 đồng","5.800.000 đồng"],"a":3,"e":"Khoản 2 Điều 4 TT 257: từ trên 10 tỷ đến 100 tỷ đồng thu 5,2 triệu đồng cộng 0,03% phần vượt quá 10 tỷ. Phí = 5.200.000 + 0,03% × 2.000.000.000 = 5.800.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.17","g":9,"lv":"VD","q":"Hợp đồng mua bán một tòa nhà có giá trị 300 tỷ đồng. Phí công chứng là:","o":["60.000.000 đồng","70.000.000 đồng (mức tối đa)","72.200.000 đồng","90.000.000 đồng"],"a":1,"e":"Khoản 2 Điều 4 TT 257: trên 100 tỷ đồng thu 32,2 triệu đồng cộng 0,02% phần vượt quá 100 tỷ, nhưng mức thu tối đa là 70 triệu đồng/trường hợp. Kết quả tính toán 72,2 triệu vượt trần, nên phí phải nộp là 70.000.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.18","g":9,"lv":"VD","q":"Ông A yêu cầu cấp 01 bản sao văn bản công chứng dài 04 trang. Phí cấp bản sao là:","o":["12.000 đồng","20.000 đồng","10.000 đồng","16.000 đồng"],"a":3,"e":"Điều 4 TT 257: phí cấp bản sao văn bản công chứng là 05 nghìn đồng/trang; từ trang thứ ba trở lên mỗi trang 03 nghìn đồng, tối đa 100 nghìn đồng/bản. Phí = 5.000 + 5.000 + 3.000 + 3.000 = 16.000 đồng.","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.19","g":9,"lv":"VD","q":"Chị B yêu cầu Ủy ban nhân dân xã chứng thực 01 bản sao từ bản chính hộ chiếu có 10 trang chứa thông tin. Phí chứng thực là:","o":["20.000 đồng","2.000 đồng","12.000 đồng","10.000 đồng"],"a":2,"e":"Điều 4 TT 226: phí chứng thực bản sao từ bản chính là 2.000 đồng/trang; từ trang thứ ba trở lên 1.000 đồng/trang, tối đa 200.000 đồng/bản; trang làm căn cứ thu phí tính theo trang của bản chính. Phí = 2 × 2.000 + 8 × 1.000 = 12.000 đồng.","b":"Điều 4 Thông tư 226/2016/TT-BTC"},{"id":"9.20","g":9,"lv":"VD","q":"Giá tối đa dịch vụ soạn thảo hợp đồng do Ủy ban nhân dân tỉnh ban hành là 500.000 đồng. Văn phòng công chứng X muốn thu 600.000 đồng và khách hàng đồng ý. Việc thu:","o":["Được, vì khách hàng đồng ý","Được, nếu xuất hóa đơn","Được, nếu niêm yết công khai","Không được, vì không được vượt mức giá tối đa; sự đồng ý của khách hàng không làm việc thu vượt trở thành hợp pháp"],"a":3,"e":"Khoản 2 Điều 71 LCC: tổ chức hành nghề công chứng xác định mức giá dịch vụ “không vượt quá mức giá tối đa do Ủy ban nhân dân cấp tỉnh ban hành”; sự đồng ý của khách hàng không làm việc thu vượt trở thành hợp pháp. Hành vi thu giá dịch vụ cao hơn mức tối đa bị xử phạt theo NĐ 109/2026.","b":"Khoản 2 Điều 71 LCC; Nghị định 109/2026/NĐ-CP"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Hợp đồng mua bán nhà gắn liền với đất giữa anh Vũ và chị Xím phải đáp ứng yêu cầu hình thức nào?","o":["Chỉ cần đăng ký tại cơ quan đăng ký đất đai","Chỉ cần lập văn bản có chữ ký của hai bên","Công chứng hoặc chứng thực, do các bên lựa chọn","Bắt buộc phải công chứng, không được chứng thực"],"a":2,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024 và Điều 164 Luật Nhà ở 2023: hợp đồng chuyển nhượng quyền sử dụng đất, mua bán nhà ở giữa cá nhân phải được công chứng hoặc chứng thực. Các bên được chọn công chứng hoặc chứng thực.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai; Điều 164 Luật Nhà ở","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Nếu chọn chứng thực như anh Vũ muốn, hai bên phải đến đâu?","o":["Phòng Tư pháp cấp tỉnh","Ủy ban nhân dân cấp xã nơi có nhà, đất","Bất kỳ Ủy ban nhân dân cấp xã nào","Ủy ban nhân dân cấp xã nơi anh Vũ cư trú"],"a":1,"e":"Điều 5 NĐ 23/2015: việc chứng thực hợp đồng, giao dịch liên quan đến thực hiện quyền của người sử dụng đất, nhà ở được thực hiện tại Ủy ban nhân dân cấp xã nơi có đất, nhà ở. Nếu công chứng thì tại tổ chức hành nghề công chứng trên địa bàn tỉnh nơi có bất động sản (Điều 44 LCC).","b":"Điều 5 NĐ 23/2015; Điều 44 LCC","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Điểm khác biệt cơ bản về phạm vi bảo đảm giữa hợp đồng được công chứng và hợp đồng được chứng thực là gì?","o":["Hợp đồng được chứng thực không có giá trị chứng cứ trước Tòa án","Chứng thực bảo đảm cả nội dung, công chứng chỉ bảo đảm chữ ký","Hai hình thức có giá trị pháp lý và phạm vi bảo đảm như nhau","Công chứng bảo đảm cả tính hợp pháp của nội dung giao dịch"],"a":3,"e":"Điều 6 LCC: văn bản công chứng có hiệu lực thi hành và có giá trị chứng cứ, những tình tiết trong đó không phải chứng minh (trừ khi bị Tòa án tuyên bố vô hiệu). Điều 3 và Điều 35 NĐ 23/2015: hợp đồng được chứng thực có giá trị chứng cứ về thời gian, địa điểm giao kết, năng lực hành vi, ý chí tự nguyện, chữ ký của các bên; người chứng thực không chịu trách nhiệm về nội dung hợp đồng.","b":"Điều 6 LCC; Điều 3, Điều 35 NĐ 23/2015","cid":"TH1.01"},{"id":"TH1.01.4","g":1,"lv":"VD","q":"Căn nhà có giá trị lớn, chị Xím muốn được bảo đảm an toàn pháp lý cao nhất. Lời tư vấn phù hợp là gì?","o":["Công chứng tại tổ chức hành nghề công chứng trong tỉnh","Chứng thực tại Ủy ban nhân dân xã vì nhanh và chi phí thấp hơn","Không cần công chứng hay chứng thực nếu đã giao đủ tiền","Chỉ cần lập vi bằng tại Văn phòng thừa phát lại"],"a":0,"e":"Với giao dịch giá trị lớn, công chứng bảo đảm an toàn pháp lý cao hơn vì công chứng viên chứng nhận tính xác thực, hợp pháp của giao dịch và văn bản công chứng có giá trị chứng cứ (Điều 6 LCC). Vi bằng không thay thế được công chứng, chứng thực hợp đồng.","b":"Điều 6, Điều 44 LCC","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Chị Mỹ xuất trình bản chính kèm bản chụp. Cán bộ tiếp nhận phải xử lý thế nào?","o":["Giữ lại bản chính để lưu vào hồ sơ của cơ quan","Tự đối chiếu bản chụp với bản chính và nhận hồ sơ","Yêu cầu chị Mỹ chứng thực bản sao rồi mới nhận hồ sơ","Từ chối nhận hồ sơ vì không có bản sao chứng thực"],"a":1,"e":"Điều 6 NĐ 23/2015: trường hợp pháp luật quy định nộp bản sao thì cơ quan, tổ chức tiếp nhận không được yêu cầu bản sao có chứng thực nếu người nộp hồ sơ xuất trình bản chính để đối chiếu; người tiếp nhận có trách nhiệm kiểm tra, đối chiếu bản sao với bản chính và chịu trách nhiệm về tính chính xác của bản sao so với bản chính.","b":"Điều 6 NĐ 23/2015","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Nhận định \"bản sao chứng thực chỉ có giá trị 06 tháng\" có căn cứ không?","o":["Có, nếu bản sao được chứng thực tại Ủy ban nhân dân cấp xã","Có, theo quy định của Nghị định 23/2015/NĐ-CP","Không, pháp luật không quy định thời hạn này","Có, theo quy định của Luật Công chứng"],"a":2,"e":"NĐ 23/2015 không quy định thời hạn sử dụng của bản sao được chứng thực từ bản chính. Thời hạn chỉ đặt ra khi pháp luật chuyên ngành có quy định riêng đối với loại giấy tờ đó (ví dụ phiếu lý lịch tư pháp, giấy xác nhận tình trạng hôn nhân).","b":"Điều 3 NĐ 23/2015","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Bản sao được chứng thực từ bản chính có giá trị pháp lý thế nào?","o":["Có giá trị sử dụng thay cho bản chính","Có giá trị pháp lý cao hơn bản chính","Chỉ có giá trị khi được xuất trình kèm bản chính","Chỉ có giá trị tham khảo trong giao dịch"],"a":0,"e":"Khoản 2 Điều 3 NĐ 23/2015: bản sao được chứng thực từ bản chính có giá trị sử dụng thay cho bản chính đã dùng để đối chiếu chứng thực trong các giao dịch, trừ trường hợp pháp luật có quy định khác.","b":"Khoản 2 Điều 3 NĐ 23/2015","cid":"TH1.02"},{"id":"TH1.02.4","g":1,"lv":"VD","q":"Nếu cán bộ tiếp nhận vẫn cố tình đòi bản sao chứng thực khi chị Mỹ đã xuất trình bản chính, chị Mỹ có thể làm gì?","o":["Nộp tiền phạt để được tiếp nhận hồ sơ","Không làm gì được, vì đó là quyền của cơ quan tiếp nhận","Khởi kiện ngay vụ án dân sự yêu cầu bồi thường","Khiếu nại hoặc phản ánh đến thủ trưởng cơ quan"],"a":3,"e":"Yêu cầu bản sao có chứng thực khi người nộp đã xuất trình bản chính là trái Điều 6 NĐ 23/2015, gây phiền hà cho người dân. Chị Mỹ có quyền phản ánh, khiếu nại hành vi hành chính theo pháp luật về khiếu nại.","b":"Điều 6 NĐ 23/2015","cid":"TH1.02"},{"id":"TH1.03.1","g":1,"lv":"VD","q":"Hợp đồng vay được công chứng có hiệu lực từ thời điểm nào?","o":["Từ khi công chứng viên ký, đóng dấu (10/3/2026)","Từ khi hai bên ký vào dự thảo hợp đồng","Từ khi hợp đồng được đăng ký tại cơ quan nhà nước","Từ khi ông Tài giao tiền cho bà Mến"],"a":0,"e":"Khoản 1 Điều 6 LCC: văn bản công chứng có hiệu lực kể từ thời điểm được công chứng viên ký và tổ chức hành nghề công chứng đóng dấu. Chữ ký của các bên chưa làm phát sinh hiệu lực của văn bản công chứng.","b":"Khoản 1 Điều 6 LCC","cid":"TH1.03"},{"id":"TH1.03.2","g":1,"lv":"VD","q":"Bà Mến không trả nợ khi đến hạn. Ông Tài có thể làm gì dựa trên hợp đồng công chứng?","o":["Yêu cầu cơ quan thi hành án thi hành ngay mà không cần bản án","Tự thu giữ tài sản của bà Mến để trừ nợ","Yêu cầu Tòa án giải quyết, dùng hợp đồng công chứng làm chứng cứ","Yêu cầu Văn phòng công chứng X trả nợ thay"],"a":2,"e":"Khoản 2 Điều 6 LCC: hợp đồng, giao dịch được công chứng có hiệu lực thi hành đối với các bên liên quan; trường hợp bên có nghĩa vụ không thực hiện thì bên kia có quyền yêu cầu Tòa án giải quyết theo quy định của pháp luật, trừ trường hợp các bên có thỏa thuận khác.","b":"Khoản 2 Điều 6 LCC","cid":"TH1.03"},{"id":"TH1.03.3","g":1,"lv":"VD","q":"Lời khai \"chỉ nhận 500 triệu đồng\" của bà Mến, không có chứng cứ khác, được Tòa án xem xét thế nào?","o":["Chấp nhận, vì bà Mến là bên yếu thế trong quan hệ vay","Không đủ bác bỏ tình tiết đã ghi trong văn bản công chứng","Ông Tài phải chứng minh đã giao đủ 800 triệu đồng","Tòa án tạm đình chỉ vụ án để giám định chữ ký"],"a":1,"e":"Khoản 3 Điều 6 LCC: văn bản công chứng có giá trị chứng cứ; những tình tiết, sự kiện trong văn bản công chứng không phải chứng minh, trừ trường hợp bị Tòa án tuyên bố là vô hiệu. Ông Tài không phải chứng minh lại việc giao tiền.","b":"Khoản 3 Điều 6 LCC","cid":"TH1.03"},{"id":"TH1.03.4","g":1,"lv":"VD","q":"Nếu bà Mến muốn phủ nhận nội dung văn bản công chứng, bà phải làm gì?","o":["Gửi thông báo đơn phương chấm dứt hợp đồng cho ông Tài","Đề nghị Văn phòng công chứng X tự hủy hợp đồng","Đề nghị Sở Tư pháp thu hồi văn bản công chứng","Yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu"],"a":3,"e":"Điều 54 LCC: người yêu cầu công chứng, người làm chứng, người có quyền, lợi ích liên quan, cơ quan nhà nước có thẩm quyền có quyền đề nghị Tòa án tuyên bố văn bản công chứng vô hiệu khi có căn cứ cho rằng việc công chứng vi phạm pháp luật. Chỉ Tòa án có thẩm quyền tuyên bố vô hiệu.","b":"Điều 54 LCC","cid":"TH1.03"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Anh An đã đáp ứng các tiêu chuẩn bổ nhiệm công chứng viên tại Điều 10 LCC chưa?","o":["Chưa, vì anh An đang là công chức nên không đủ tiêu chuẩn","Đã đáp ứng đủ các tiêu chuẩn về bằng cấp, thời gian công tác, đào tạo, tập sự","Chưa, vì chưa có bằng thạc sĩ luật","Chưa, vì chưa đủ 05 năm công tác pháp luật"],"a":1,"e":"Điều 10 LCC: tiêu chuẩn bổ nhiệm gồm là công dân Việt Nam, thường trú tại Việt Nam, có phẩm chất đạo đức, sức khỏe; có bằng cử nhân luật; có thời gian công tác pháp luật từ đủ 03 năm trở lên sau khi có bằng; tốt nghiệp khóa đào tạo nghề công chứng; đạt yêu cầu kiểm tra kết quả tập sự. Việc đang là công chức là trường hợp không được bổ nhiệm (Điều 14), không phải tiêu chuẩn tại Điều 10.","b":"Điều 10 LCC","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Anh An có được bổ nhiệm công chứng viên trong khi vẫn là công chức Sở Tư pháp không?","o":["Không; công chức không được bổ nhiệm nên anh An phải thôi việc trước","Được, nhưng chỉ được hành nghề tại Phòng công chứng","Được, vì anh An đang công tác trong ngành tư pháp","Được, nếu Giám đốc Sở Tư pháp đồng ý bằng văn bản"],"a":0,"e":"Khoản 5 Điều 14 LCC: người đang là cán bộ, công chức, viên chức (trừ viên chức của Phòng công chứng), sĩ quan, quân nhân chuyên nghiệp… thì không được bổ nhiệm công chứng viên. Anh An phải thôi việc trước khi đề nghị bổ nhiệm.","b":"Khoản 5 Điều 14 LCC","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Giấy chứng nhận kết quả kiểm tra tập sự cấp tháng 9/2026 có giá trị đến khi nào nếu anh An chưa đề nghị bổ nhiệm?","o":["01 năm kể từ ngày cấp","03 năm kể từ ngày cấp","05 năm kể từ ngày cấp","Có giá trị vĩnh viễn"],"a":2,"e":"Khoản 5 Điều 12 LCC: giấy chứng nhận đạt yêu cầu kiểm tra kết quả tập sự hết hiệu lực nếu trong thời hạn 05 năm kể từ ngày được cấp mà người được cấp không đề nghị bổ nhiệm công chứng viên.","b":"Khoản 5 Điều 12 LCC","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Đến tháng 10/2031 anh An mới đề nghị bổ nhiệm. Anh phải làm gì?","o":["Nộp hồ sơ bình thường vì đã có giấy chứng nhận","Học lại toàn bộ khóa đào tạo nghề công chứng","Xin gia hạn giấy chứng nhận tại Sở Tư pháp","Đăng ký và đạt lại kỳ kiểm tra kết quả tập sự"],"a":3,"e":"Giấy chứng nhận cấp tháng 9/2026 hết hiệu lực vào tháng 9/2031 (khoản 5 Điều 12 LCC). Anh An phải đáp ứng lại tiêu chuẩn đạt yêu cầu kiểm tra kết quả tập sự trước khi đề nghị bổ nhiệm; luật không quy định gia hạn giấy chứng nhận.","b":"Khoản 5 Điều 12 LCC","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Vì sao bà Hoa không được phân công hướng dẫn thêm chị Lan?","o":["Vì bà Hoa đang hướng dẫn đủ 02 người tập sự","Vì người hướng dẫn phải hành nghề từ 10 năm trở lên","Vì người hướng dẫn tập sự phải là Trưởng Văn phòng","Vì bà Hoa chưa đủ 02 năm kinh nghiệm hành nghề công chứng"],"a":0,"e":"Khoản 3 Điều 12 LCC: công chứng viên hướng dẫn tập sự phải có ít nhất 02 năm kinh nghiệm hành nghề; tại cùng một thời điểm một công chứng viên không được hướng dẫn quá 02 người tập sự. Bà Hoa đủ kinh nghiệm nhưng đã hướng dẫn 02 người.","b":"Khoản 3 Điều 12 LCC","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Chị Lan đăng ký tập sự tại cơ quan nào?","o":["Bộ Tư pháp","Hội công chứng viên tỉnh nơi chị cư trú","Ủy ban nhân dân cấp xã nơi có Văn phòng công chứng","Sở Tư pháp Hà Nội"],"a":3,"e":"Khoản 1 Điều 12 LCC: người tập sự đăng ký tập sự tại Sở Tư pháp ở địa phương nơi có tổ chức hành nghề công chứng nhận tập sự.","b":"Khoản 1 Điều 12 LCC","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Khi bà Hoa bị tạm đình chỉ hành nghề, việc tập sự của chị Lan được giải quyết thế nào?","o":["Chị Lan tự tiếp tục tập sự mà không cần người hướng dẫn","Văn phòng phân công người khác; không có thì báo Sở Tư pháp","Việc tập sự đương nhiên chấm dứt, chị Lan phải đăng ký lại từ đầu","Công chứng viên mới hành nghề 01 năm của Văn phòng hướng dẫn thay"],"a":1,"e":"Khoản 3 Điều 12 LCC: người hướng dẫn phải có ít nhất 02 năm kinh nghiệm. Công chứng viên còn lại mới hành nghề 01 năm nên không đủ điều kiện; Văn phòng phải thông báo Sở Tư pháp để chỉ định tổ chức hành nghề công chứng khác nhận tập sự, bảo đảm quyền lợi của người tập sự.","b":"Khoản 3 Điều 12 LCC","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Nếu không tạm ngừng tập sự, sớm nhất khi nào chị Lan hoàn thành thời gian tập sự?","o":["Ngay khi bà Hoa bị tạm đình chỉ hành nghề","Tháng 9/2026, sau 06 tháng tập sự","Tháng 3/2027, sau 12 tháng tập sự","Tháng 3/2028, sau 24 tháng tập sự"],"a":2,"e":"Khoản 1 Điều 12 LCC: thời gian tập sự hành nghề công chứng là 12 tháng, tính từ ngày quyết định đăng ký tập sự có hiệu lực. Sau đó chị Lan mới đăng ký kiểm tra kết quả tập sự (khoản 5 Điều 12).","b":"Khoản 1, khoản 5 Điều 12 LCC","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Sở Tư pháp tỉnh T nhận quyết định khởi tố ngày 05/3/2026. Thời hạn ra quyết định tạm đình chỉ hành nghề là bao lâu?","o":["Không có thời hạn, tùy Sở Tư pháp xem xét","15 ngày kể từ ngày công chứng viên bị khởi tố","30 ngày kể từ ngày nhận quyết định khởi tố","05 ngày làm việc kể từ ngày nhận quyết định"],"a":3,"e":"Khoản 1 Điều 15 LCC: Sở Tư pháp nơi cấp thẻ công chứng viên ra quyết định tạm đình chỉ hành nghề trong thời hạn 05 ngày làm việc kể từ ngày nhận được quyết định của cơ quan có thẩm quyền về việc truy cứu trách nhiệm hình sự. Ra quyết định ngày 25/3/2026 là chậm.","b":"Khoản 1 Điều 15 LCC","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"15 hợp đồng R công chứng trước ngày 25/3/2026 có đương nhiên vô hiệu không?","o":["Không, vì khi đó R chưa bị tạm đình chỉ","Có, nếu các bên trong hợp đồng yêu cầu","Có, vì R đã bị khởi tố từ trước đó","Có, vì Sở Tư pháp ra quyết định tạm đình chỉ chậm"],"a":0,"e":"Tại thời điểm công chứng, R chưa có quyết định tạm đình chỉ nên vẫn có tư cách hành nghề. Văn bản công chứng chỉ bị tuyên vô hiệu khi có căn cứ vi phạm pháp luật (Điều 54 LCC). Việc Sở Tư pháp chậm ra quyết định là vi phạm của cơ quan quản lý.","b":"Khoản 1 Điều 15, Điều 54 LCC","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Sau khi có quyết định đình chỉ điều tra ngày 10/8/2026, R phải làm gì để được hành nghề trở lại?","o":["Tự hành nghề lại ngay mà không cần thủ tục gì","Chờ hết thời hạn tạm đình chỉ tối đa theo quy định","Đề nghị Sở Tư pháp chấm dứt việc tạm đình chỉ","Đề nghị bổ nhiệm lại công chứng viên"],"a":2,"e":"Điểm a khoản 3 Điều 15 LCC: công chứng viên bị tạm đình chỉ được chấm dứt tạm đình chỉ trước thời hạn khi lý do tạm đình chỉ không còn (như có quyết định đình chỉ điều tra); công chứng viên gửi đề nghị kèm giấy tờ chứng minh, Sở Tư pháp ra quyết định trong 05 ngày làm việc.","b":"Điểm a khoản 3 Điều 15 LCC","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Giả sử sau ngày 25/3/2026 R vẫn tiếp tục ký công chứng. Hậu quả đối với R là gì?","o":["Chỉ bị nhắc nhở, rút kinh nghiệm","Bị miễn nhiệm, không được bổ nhiệm lại","Bị phạt tiền nhưng vẫn được tiếp tục hành nghề","Không có hậu quả nếu sau đó được đình chỉ điều tra"],"a":1,"e":"Điểm g khoản 2 Điều 16 LCC: công chứng viên hành nghề trong thời gian bị tạm đình chỉ hành nghề là căn cứ bị miễn nhiệm; điểm b khoản 3 Điều 17: người bị miễn nhiệm vì lý do này không được bổ nhiệm lại.","b":"Điểm g khoản 2 Điều 16, điểm b khoản 3 Điều 17 LCC","cid":"TH2.03"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Văn phòng công chứng theo loại hình công ty hợp danh phải có cơ cấu thành viên thế nào?","o":["Từ 02 thành viên hợp danh là công chứng viên, không có thành viên góp vốn","Chỉ cần 01 thành viên hợp danh là công chứng viên","Có ít nhất 03 thành viên, trong đó 01 thành viên góp vốn","Có thể có thành viên góp vốn là người thân của công chứng viên"],"a":0,"e":"Khoản 2 Điều 23 LCC: Văn phòng công chứng tổ chức theo loại hình công ty hợp danh phải có từ 02 thành viên hợp danh trở lên và không có thành viên góp vốn; thành viên hợp danh phải là công chứng viên.","b":"Khoản 2 Điều 23 LCC","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Phương án cho chồng Minh góp 60% vốn điều lệ được đánh giá thế nào?","o":["Hợp pháp, nếu được Sở Tư pháp chấp thuận","Không hợp pháp, vì không có thành viên góp vốn","Hợp pháp, nếu tỷ lệ góp vốn dưới 50%","Hợp pháp, vì chồng Minh chỉ góp vốn, không hành nghề"],"a":1,"e":"Theo khoản 2 Điều 23 LCC, Văn phòng công chứng hợp danh không có thành viên góp vốn; mọi thành viên phải là công chứng viên. Tỷ lệ vốn hay sự chấp thuận của cơ quan quản lý không khắc phục được.","b":"Khoản 2 Điều 23 LCC","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Minh chưa tìm được công chứng viên khác. Phương án hợp pháp để Minh tự thành lập Văn phòng là gì?","o":["Thuê công chứng viên làm thành viên hợp danh danh nghĩa","Thành lập chi nhánh của một Văn phòng công chứng khác","Thành lập Văn phòng loại hình doanh nghiệp tư nhân","Thành lập Văn phòng hợp danh với 01 thành viên, bổ sung sau"],"a":2,"e":"Điều 23 LCC cho phép Văn phòng công chứng tổ chức theo loại hình doanh nghiệp tư nhân hoặc công ty hợp danh. Minh đã hành nghề 06 năm, có thể thành lập Văn phòng doanh nghiệp tư nhân và làm Trưởng Văn phòng.","b":"Điều 23 LCC","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Nếu Văn phòng vẫn được thành lập theo phương án sai (do cơ quan tiếp nhận hiểu sai), hậu quả là gì?","o":["Chỉ bị phạt tiền","Vẫn hoạt động bình thường vì đã có quyết định","Tự động chuyển thành Văn phòng doanh nghiệp tư nhân","Bị thu hồi quyết định cho phép thành lập"],"a":3,"e":"Khoản 1 Điều 33 LCC: Văn phòng công chứng bị thu hồi quyết định cho phép thành lập trong các trường hợp như có cá nhân không phải công chứng viên tham gia thành lập, hoặc Văn phòng hợp danh chỉ có 01 thành viên hợp danh.","b":"Khoản 1 Điều 33 LCC","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Thời hạn đăng ký hoạt động của Văn phòng công chứng An Phú là bao lâu?","o":["90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực","Không giới hạn nếu chưa thuê được trụ sở","30 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực","06 tháng kể từ ngày quyết định cho phép thành lập có hiệu lực"],"a":0,"e":"Khoản 1 Điều 25 LCC: trong thời hạn 90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực, Văn phòng công chứng phải đăng ký hoạt động tại Sở Tư pháp.","b":"Khoản 1 Điều 25 LCC","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Văn phòng nộp hồ sơ đăng ký hoạt động ngày 15/6/2026. Nhận xét nào chính xác?","o":["Còn trong hạn vì chưa thuê được trụ sở là lý do chính đáng","Còn trong hạn vì thời hạn tính từ ngày có giấy chứng nhận đăng ký kinh doanh","Quá hạn, vì 90 ngày kể từ 01/3/2026 kết thúc vào cuối tháng 5/2026","Còn trong hạn vì chưa quá 06 tháng"],"a":2,"e":"Tính 90 ngày từ ngày quyết định có hiệu lực 01/3/2026 thì thời hạn kết thúc cuối tháng 5/2026; nộp ngày 15/6/2026 là quá hạn. Việc chưa thuê được trụ sở không phải lý do loại trừ theo khoản 1 Điều 25 LCC.","b":"Khoản 1 Điều 25 LCC","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Hậu quả pháp lý đối với Văn phòng An Phú là gì?","o":["Chỉ bị nhắc nhở và yêu cầu đăng ký bổ sung","Bị thu hồi quyết định cho phép thành lập","Bị phạt tiền nhưng vẫn được đăng ký hoạt động","Được gia hạn thêm 90 ngày để đăng ký hoạt động"],"a":1,"e":"Điểm a khoản 1 Điều 33 LCC: Văn phòng công chứng bị thu hồi quyết định cho phép thành lập khi không đăng ký hoạt động trong thời hạn quy định tại khoản 1 Điều 25.","b":"Điểm a khoản 1 Điều 33 LCC","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Cơ quan nào ra quyết định thu hồi quyết định cho phép thành lập Văn phòng An Phú?","o":["Bộ Tư pháp","Sở Tư pháp","Hội công chứng viên tỉnh","Ủy ban nhân dân cấp tỉnh"],"a":3,"e":"Khoản 3 Điều 33 LCC: Sở Tư pháp kiểm tra, lập hồ sơ đề nghị; Ủy ban nhân dân cấp tỉnh ra quyết định thu hồi quyết định cho phép thành lập Văn phòng công chứng.","b":"Khoản 3 Điều 33 LCC","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Tháng 10/2026, bà Zét đã được bán Văn phòng Thiên Ân chưa?","o":["Chưa, vì chưa hoạt động đủ 02 năm","Chưa, vì phải hoạt động từ đủ 05 năm","Được, vì Văn phòng đã hoạt động trên 01 năm","Được, nếu người mua là công chứng viên"],"a":0,"e":"Khoản 1 Điều 31 LCC: Văn phòng công chứng được chuyển nhượng khi đã hoạt động từ đủ 02 năm kể từ ngày được cấp giấy đăng ký hoạt động. Văn phòng Thiên Ân hoạt động từ 01/6/2025, đến tháng 10/2026 mới khoảng 16 tháng; sớm nhất được bán sau ngày 01/6/2027.","b":"Khoản 1 Điều 31 LCC","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Công chứng viên Ánh có đủ điều kiện nhận chuyển nhượng không?","o":["Đủ, vì đã hành nghề công chứng 04 năm","Chưa, vì thôi làm Trưởng Văn phòng khác chưa đủ 02 năm","Đủ, nếu trả đủ tiền nhận chuyển nhượng","Chưa đủ, vì phải hành nghề từ đủ 10 năm"],"a":1,"e":"Khoản 2 Điều 31 LCC: công chứng viên nhận chuyển nhượng phải đã hành nghề từ đủ 02 năm, không phải là Trưởng Văn phòng công chứng doanh nghiệp tư nhân hoặc đã thôi làm Trưởng Văn phòng đó từ đủ 02 năm, và cam kết hành nghề với tư cách Trưởng Văn phòng.","b":"Khoản 2 Điều 31 LCC","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Khoản nợ 6 tháng tiền thuê trụ sở phát sinh trước khi bán do ai chịu trách nhiệm?","o":["Văn phòng được miễn nợ khi chuyển nhượng","Sở Tư pháp chịu vì đã cho phép chuyển nhượng","Người mua Văn phòng đương nhiên chịu trách nhiệm","Bà Zét, trừ khi có thỏa thuận khác với chủ nợ"],"a":3,"e":"Khoản 4 Điều 31 LCC: công chứng viên chuyển nhượng Văn phòng có trách nhiệm thanh toán các khoản nợ phát sinh trước ngày chuyển nhượng, trừ trường hợp có thỏa thuận khác giữa bên chuyển nhượng, bên nhận chuyển nhượng và chủ nợ.","b":"Khoản 4 Điều 31 LCC","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Dự định lập ngay một Văn phòng hợp danh mới sau khi bán của bà Zét có thực hiện được không?","o":["Được, nếu Văn phòng mới đặt tại tỉnh khác","Được, vì bà Zét vẫn là công chứng viên","Không, phải sau 02 năm kể từ ngày chuyển nhượng","Không bao giờ được thành lập Văn phòng mới"],"a":2,"e":"Khoản 5 Điều 31 LCC: công chứng viên đã chuyển nhượng Văn phòng công chứng chỉ được thành lập, tham gia thành lập Văn phòng công chứng mới sau thời hạn 02 năm kể từ ngày chuyển nhượng. Việc chuyển nhượng do Ủy ban nhân dân cấp tỉnh cho phép (khoản 3 Điều 31; Điều 26 NĐ 104/2025).","b":"Khoản 3, khoản 5 Điều 31 LCC; Điều 26 NĐ 104/2025/NĐ-CP","cid":"TH3.03"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Công chứng viên có được đến nhà cụ Quyền để công chứng không?","o":["Không, mọi việc công chứng đều phải thực hiện tại trụ sở","Được, nhưng chỉ đối với việc công chứng di chúc","Chỉ được nếu Sở Tư pháp cho phép bằng văn bản","Được, vì cụ Quyền già yếu, không đi lại được"],"a":3,"e":"Điều 46 LCC: việc công chứng có thể được thực hiện ngoài trụ sở của tổ chức hành nghề công chứng trong trường hợp người yêu cầu công chứng là người già yếu, không thể đi lại được, đang bị tạm giữ, tạm giam, đang thi hành án phạt tù hoặc có lý do chính đáng khác.","b":"Điều 46 LCC","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Cụ Quyền không biết chữ. Cụ thể hiện ý chí trên văn bản công chứng bằng cách nào?","o":["Nhờ cháu ngoại ký thay vào văn bản","Chỉ cần đồng ý bằng lời nói trước công chứng viên","Điểm chỉ thay cho việc ký, có người làm chứng","Công chứng viên ký thay cho cụ Quyền"],"a":2,"e":"Điều 50 LCC: trường hợp người yêu cầu công chứng không ký được thì điểm chỉ; khoản 2 Điều 49: người yêu cầu công chứng không đọc được, không nghe được, không ký, không điểm chỉ được hoặc trường hợp luật định thì phải có người làm chứng. Cụ Quyền không biết chữ nên phải có người làm chứng.","b":"Khoản 2 Điều 49, Điều 50 LCC","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Cháu ngoại (bên mua) có được làm người làm chứng cho cụ Quyền không?","o":["Được, nếu cụ Quyền đồng ý","Không, vì có quyền, lợi ích liên quan","Được, nếu cháu ngoại đã thành niên","Được, vì là người thân thích đáng tin cậy"],"a":1,"e":"Khoản 2 Điều 49 LCC: người làm chứng phải từ đủ 18 tuổi trở lên, có năng lực hành vi dân sự đầy đủ và không có quyền, lợi ích hoặc nghĩa vụ về tài sản liên quan đến việc công chứng. Cháu ngoại là bên mua nên không được làm chứng.","b":"Khoản 2 Điều 49 LCC","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Gia đình không mời được người làm chứng phù hợp. Ai chỉ định người làm chứng?","o":["Công chứng viên chỉ định người làm chứng","Cháu ngoại của cụ Quyền là bên mua","Không cần người làm chứng nữa","Ủy ban nhân dân cấp xã nơi cụ Quyền cư trú"],"a":0,"e":"Khoản 2 Điều 49 LCC: người làm chứng do người yêu cầu công chứng mời; trường hợp người yêu cầu công chứng không mời được thì công chứng viên chỉ định.","b":"Khoản 2 Điều 49 LCC","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Trước các dấu hiệu nhầm lẫn của ông Roãn, công chứng viên nên xử lý thế nào?","o":["Làm rõ, xác minh hoặc yêu cầu giám định","Yêu cầu con trai ký thay cho ông Roãn","Công chứng nhưng ghi chú \"nghi ngờ năng lực\" vào văn bản","Công chứng ngay vì con trai khẳng định bố minh mẫn"],"a":0,"e":"Khoản 4 Điều 42 LCC: trường hợp có căn cứ cho rằng người yêu cầu công chứng không nhận thức, làm chủ được hành vi của mình thì công chứng viên đề nghị làm rõ hoặc theo đề nghị của người yêu cầu công chứng, tiến hành xác minh hoặc yêu cầu giám định; trường hợp không làm rõ được thì có quyền từ chối công chứng.","b":"Khoản 4 Điều 42 LCC","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Ông Roãn từ chối giám định. Công chứng viên xử lý thế nào?","o":["Chuyển hồ sơ cho Tòa án tuyên bố mất năng lực hành vi","Vẫn công chứng, vì người yêu cầu có quyền từ chối giám định","Yêu cầu Ủy ban nhân dân xã xác nhận năng lực hành vi","Từ chối công chứng, vì không làm rõ được năng lực hành vi"],"a":3,"e":"Khoản 4 Điều 42 LCC: khi có căn cứ nghi ngờ năng lực hành vi mà không làm rõ được (kể cả do người yêu cầu từ chối giám định) thì công chứng viên từ chối công chứng.","b":"Khoản 4 Điều 42 LCC","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Nếu công chứng viên vẫn công chứng và sau đó có kết luận ông Roãn mất năng lực hành vi dân sự tại thời điểm ký, hợp đồng có thể bị xử lý thế nào?","o":["Chỉ bị hủy nếu bên mua đồng ý","Vẫn có hiệu lực vì đã được công chứng","Có thể bị Tòa án tuyên bố vô hiệu","Đương nhiên vô hiệu mà không cần Tòa án tuyên bố"],"a":2,"e":"Điều 125 BLDS: giao dịch do người mất năng lực hành vi dân sự xác lập có thể bị Tòa án tuyên bố vô hiệu theo yêu cầu của người đại diện. Điều 54 LCC: người có quyền, lợi ích liên quan có quyền đề nghị Tòa án tuyên bố văn bản công chứng vô hiệu.","b":"Điều 125 BLDS; Điều 54 LCC","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"lv":"VD","q":"Nếu công chứng viên có lỗi khi công chứng gây thiệt hại cho người yêu cầu công chứng, ai bồi thường trước?","o":["Ngân sách nhà nước","Tổ chức hành nghề công chứng","Sở Tư pháp nơi quản lý công chứng viên","Hội công chứng viên tỉnh"],"a":1,"e":"Tổ chức hành nghề công chứng phải bồi thường thiệt hại cho người yêu cầu công chứng và cá nhân, tổ chức khác do lỗi của công chứng viên gây ra; công chứng viên có lỗi phải hoàn trả theo quy định (Điều 40 LCC về bồi thường, hoàn trả, bảo hiểm trách nhiệm nghề nghiệp).","b":"Điều 40 LCC","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Khi biết hai bên muốn ghi giá 1 tỷ đồng trong khi giá thực là 3 tỷ đồng, công chứng viên phải xử sự thế nào?","o":["Công chứng cả hợp đồng và giấy viết tay ghi giá thực","Công chứng theo yêu cầu, vì giá do các bên tự thỏa thuận","Giải thích hậu quả; các bên vẫn giữ ý định thì từ chối","Chỉ ghi chú việc chênh lệch giá vào sổ công chứng"],"a":2,"e":"Công chứng viên phải tuân thủ nguyên tắc trung thực, khách quan, tuân thủ pháp luật (Điều 5 LCC); không được công chứng giao dịch có mục đích, nội dung vi phạm pháp luật, giả tạo (Điều 9, Điều 42 LCC).","b":"Điều 5, Điều 9, Điều 42 LCC","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"Hợp đồng ghi giá 1 tỷ đồng và giấy viết tay ghi 3 tỷ đồng có bản chất pháp lý gì?","o":["Hợp đồng được xác lập do nhầm lẫn về giá","Giao dịch giả tạo nhằm che giấu giao dịch khác","Hợp đồng được xác lập do bị lừa dối","Hai hợp đồng độc lập, đều có hiệu lực pháp luật"],"a":1,"e":"Khoản 1 Điều 124 BLDS: khi các bên xác lập giao dịch dân sự một cách giả tạo nhằm che giấu một giao dịch dân sự khác thì giao dịch giả tạo vô hiệu, còn giao dịch bị che giấu vẫn có hiệu lực, trừ trường hợp giao dịch đó cũng vô hiệu theo quy định.","b":"Khoản 1 Điều 124 BLDS","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Việc ghi giá thấp ngoài vô hiệu phần giả tạo còn dẫn đến hậu quả gì?","o":["Hợp đồng được miễn đăng ký biến động","Chỉ ảnh hưởng đến mức phí công chứng","Không có hậu quả, vì hai bên đều đồng ý","Có thể bị truy thu thuế, xử phạt"],"a":3,"e":"Ghi giá không trung thực nhằm trốn, giảm nghĩa vụ thuế, phí là hành vi vi phạm pháp luật về thuế; khi tranh chấp, giá ghi trong hợp đồng công chứng có giá trị chứng cứ (Điều 6 LCC) nên bên bán dễ gặp rủi ro khi đòi phần chênh lệch.","b":"Điều 6 LCC; Điều 124 BLDS","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Nếu công chứng viên biết mà vẫn công chứng hợp đồng ghi giá giả tạo, công chứng viên vi phạm điều gì?","o":["Vi phạm điều cấm đối với công chứng viên","Chỉ vi phạm nếu giá chênh lệch trên 50%","Không vi phạm, vì giá do các bên tự quyết định","Chỉ vi phạm nếu cơ quan thuế phát hiện"],"a":0,"e":"Điều 9 LCC cấm công chứng viên công chứng giao dịch có mục đích, nội dung vi phạm pháp luật; vi phạm có thể bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm theo quy định.","b":"Điều 9 LCC","cid":"TH4.03"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Văn phòng công chứng tại Hà Nội có thẩm quyền công chứng hợp đồng chuyển nhượng thửa đất ở Bắc Ninh không?","o":["Có, vì công chứng viên có thể công chứng ở bất kỳ đâu","Không, phải công chứng tại tỉnh nơi có bất động sản","Có, nếu các bên đồng ý lựa chọn","Có, vì các bên đều cư trú tại Hà Nội"],"a":1,"e":"Điều 44 LCC: công chứng viên của tổ chức hành nghề công chứng chỉ được công chứng hợp đồng, giao dịch về bất động sản trong phạm vi tỉnh nơi tổ chức hành nghề công chứng đặt trụ sở, trừ trường hợp công chứng di chúc, văn bản từ chối nhận di sản là bất động sản và văn bản ủy quyền liên quan đến việc thực hiện các quyền đối với bất động sản.","b":"Điều 44 LCC","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Vì Giấy chứng nhận ghi tên cả ông An và bà Bình, ai phải ký hợp đồng chuyển nhượng?","o":["Một trong hai người đứng tên","Chỉ người đứng tên đầu tiên trên Giấy chứng nhận","Chỉ ông An với tư cách chủ hộ","Cả hai người, hoặc người được ủy quyền"],"a":3,"e":"Quyền sử dụng đất là tài sản chung của vợ chồng, Giấy chứng nhận ghi tên cả hai người; việc định đoạt bất động sản chung phải có thỏa thuận bằng văn bản của vợ chồng (Điều 35 Luật HNGĐ). Công chứng viên kiểm tra giấy tờ theo Điều 42, 43 LCC.","b":"Điều 42, Điều 43 LCC; Điều 35 Luật Hôn nhân và gia đình","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Hồ sơ yêu cầu công chứng hợp đồng chuyển nhượng gồm những giấy tờ cơ bản nào?","o":["Phiếu yêu cầu, dự thảo, giấy tờ tùy thân, Giấy chứng nhận","Xác nhận của Ủy ban nhân dân xã nơi có đất về giá đất","Chỉ cần dự thảo hợp đồng chuyển nhượng","Chỉ cần giấy tờ tùy thân của các bên"],"a":0,"e":"Điều 42, Điều 43 LCC: người yêu cầu công chứng nộp hồ sơ gồm phiếu yêu cầu công chứng, dự thảo hợp đồng (nếu tự soạn), bản sao giấy tờ tùy thân, bản sao giấy chứng nhận quyền sử dụng đất và giấy tờ khác liên quan mà pháp luật quy định phải có.","b":"Điều 42, Điều 43 LCC","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"lv":"VD","q":"Sau khi công chứng, việc chuyển quyền sử dụng đất cho anh Cường có hiệu lực từ khi nào?","o":["Khi anh Cường nhận bàn giao đất trên thực địa","Khi anh Cường trả đủ tiền chuyển nhượng","Từ khi đăng ký vào sổ địa chính","Ngay khi hợp đồng được công chứng"],"a":2,"e":"Điều 503 BLDS: việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký theo quy định của Luật Đất đai. Hợp đồng công chứng có hiệu lực giữa các bên, còn việc chuyển quyền phát sinh khi đăng ký biến động.","b":"Điều 503 BLDS","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Ngôi nhà ông Dũng mua năm 2019 trong thời kỳ hôn nhân được xác định là tài sản gì?","o":["Tài sản chung, trừ khi chứng minh được là tài sản riêng","Tài sản riêng của bà Em, vì bà đang lao động ở nước ngoài","Tài sản riêng của ông Dũng, vì Giấy chứng nhận ghi tên ông","Tài sản chung của gia đình hai bên nội, ngoại"],"a":0,"e":"Điều 33 Luật HNGĐ: tài sản vợ chồng tạo lập trong thời kỳ hôn nhân là tài sản chung; trường hợp không có căn cứ chứng minh tài sản là tài sản riêng thì là tài sản chung. Việc Giấy chứng nhận chỉ ghi tên ông Dũng không làm thay đổi bản chất.","b":"Điều 33 Luật Hôn nhân và gia đình","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Công chứng viên có nên công chứng hợp đồng bán nhà khi chỉ có chữ ký của ông Dũng không?","o":["Có, nếu ông Dũng cam kết tự chịu trách nhiệm","Không, phải có thỏa thuận bằng văn bản của vợ chồng","Có, nếu giá bán thấp hơn 1 tỷ đồng","Có, vì Giấy chứng nhận chỉ đứng tên ông Dũng"],"a":1,"e":"Khoản 2 Điều 35 Luật HNGĐ: định đoạt tài sản chung là bất động sản phải có thỏa thuận bằng văn bản của vợ chồng. Công chứng viên phải kiểm tra giấy tờ, yêu cầu làm rõ; nếu không làm rõ được thì từ chối công chứng (Điều 42 LCC).","b":"Khoản 2 Điều 35 Luật Hôn nhân và gia đình; Điều 42 LCC","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Bà Em đang ở Hàn Quốc có thể tham gia giao dịch bằng cách nào?","o":["Gọi điện xác nhận trực tiếp với công chứng viên","Gửi tin nhắn đồng ý cho ông Dũng","Lập văn bản ủy quyền tại Cơ quan đại diện Việt Nam","Không thể tham gia, bà Em phải về nước"],"a":2,"e":"Điều 73 LCC: Cơ quan đại diện ngoại giao, cơ quan đại diện lãnh sự của Việt Nam ở nước ngoài được công chứng, chứng thực cho công dân Việt Nam ở nước ngoài. Văn bản do cơ quan nước ngoài lập phải được hợp pháp hóa lãnh sự, trừ trường hợp được miễn.","b":"Điều 73 LCC","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"lv":"VD","q":"Nếu hợp đồng vẫn được công chứng chỉ với chữ ký của ông Dũng, bà Em có quyền gì?","o":["Không có quyền gì, vì văn bản công chứng có giá trị chứng cứ","Chỉ được nhận một nửa số tiền bán nhà","Yêu cầu Văn phòng công chứng tự hủy hợp đồng","Yêu cầu Tòa án tuyên bố hợp đồng và văn bản công chứng vô hiệu"],"a":3,"e":"Khoản 2 Điều 26 Luật HNGĐ: giao dịch về tài sản chung do một bên tự xác lập trái quy định về đại diện giữa vợ chồng thì vô hiệu, trừ trường hợp người thứ ba ngay tình được bảo vệ theo BLDS. Bà Em có quyền yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu (Điều 54 LCC).","b":"Khoản 2 Điều 26 Luật Hôn nhân và gia đình; Điều 54 LCC","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"VD","q":"Ngày 15/9/2026, anh Kiên còn quyền ký hợp đồng bán căn hộ không?","o":["Còn, nếu các con ông Hùng không phản đối","Còn, vì hợp đồng ủy quyền đã được công chứng","Không, vì đại diện theo ủy quyền chấm dứt khi ông Hùng chết","Còn, nếu hợp đồng ủy quyền chưa hết thời hạn"],"a":2,"e":"Điều 140 BLDS: đại diện theo ủy quyền chấm dứt khi người được đại diện là cá nhân chết; Điều 422 BLDS: hợp đồng chấm dứt khi cá nhân giao kết chết mà hợp đồng phải do chính người đó thực hiện. Việc công chứng hợp đồng ủy quyền không kéo dài hiệu lực đại diện.","b":"Điều 140, Điều 422 BLDS","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"VD","q":"Công chứng viên xử lý yêu cầu của anh Kiên thế nào?","o":["Chuyển hồ sơ cho Tòa án","Từ chối công chứng, vì anh Kiên không còn quyền đại diện","Công chứng vì hợp đồng ủy quyền hợp lệ về hình thức","Công chứng nhưng ghi chú rủi ro"],"a":1,"e":"Người yêu cầu công chứng không còn thẩm quyền đại diện nên công chứng viên phải từ chối (Điều 42 LCC). Công chứng viên cần tra cứu cơ sở dữ liệu, xác minh thông tin trước khi công chứng giao dịch theo ủy quyền.","b":"Điều 42 LCC","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Sau khi ông Hùng chết, căn hộ được xác định là gì?","o":["Di sản thừa kế của ông Hùng, chờ khai nhận hoặc phân chia","Tài sản của anh Kiên theo hợp đồng ủy quyền","Tài sản chung của anh Kiên và người mua","Tài sản vô chủ thuộc Nhà nước"],"a":0,"e":"Tài sản của người chết để lại là di sản thừa kế (Điều 612 BLDS). Việc định đoạt căn hộ thuộc về những người thừa kế của ông Hùng.","b":"Điều 612 BLDS","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"lv":"VD","q":"Muốn bán căn hộ, những người thừa kế phải thực hiện thủ tục gì trước?","o":["Xin phép Ủy ban nhân dân cấp xã nơi có căn hộ","Chỉ cần xuất trình giấy chứng tử của ông Hùng","Ký hợp đồng ủy quyền mới cho anh Kiên ngay","Khai nhận, phân chia di sản và đăng ký quyền sở hữu"],"a":3,"e":"Điều 59 LCC quy định công chứng văn bản thỏa thuận phân chia di sản, văn bản khai nhận di sản. Sau khi khai nhận, phân chia và đăng ký quyền theo quy định, người thừa kế mới có quyền định đoạt căn hộ.","b":"Điều 59 LCC","cid":"TH5.03"},{"id":"TH6.01.1","g":6,"lv":"VD","q":"Ai có thẩm quyền ký chứng thực hợp đồng thế chấp quyền sử dụng đất tại Ủy ban nhân dân cấp xã?","o":["Văn phòng đăng ký đất đai","Trưởng thôn nơi có đất","Chủ tịch hoặc Phó Chủ tịch UBND cấp xã","Công chức tư pháp – hộ tịch"],"a":2,"e":"Điều 5 NĐ 23/2015: Chủ tịch, Phó Chủ tịch Ủy ban nhân dân cấp xã thực hiện ký chứng thực hợp đồng, giao dịch liên quan đến tài sản là động sản, quyền sử dụng đất, nhà ở và đóng dấu của Ủy ban nhân dân cấp xã. Công chức tư pháp – hộ tịch chỉ tiếp nhận, kiểm tra hồ sơ.","b":"Điều 5 NĐ 23/2015","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"VD","q":"Khi Chủ tịch và các Phó Chủ tịch đi công tác, công chức tư pháp – hộ tịch xử lý đúng là gì?","o":["Từ chối vĩnh viễn yêu cầu chứng thực của người dân","Hẹn trả kết quả hoặc hướng dẫn đi công chứng","Nhờ trưởng thôn ký thay rồi đóng dấu xã","Tự ký và đóng dấu để kịp giải quyết cho người dân"],"a":1,"e":"Thẩm quyền ký chứng thực là của Chủ tịch, Phó Chủ tịch Ủy ban nhân dân cấp xã (Điều 5 NĐ 23/2015); công chức không được ký thay. Có thể hẹn trả kết quả hoặc người dân lựa chọn công chứng.","b":"Điều 5 NĐ 23/2015","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Hợp đồng được chứng thực sai thẩm quyền có thể gặp hậu quả gì?","o":["Vẫn có giá trị như chứng thực hợp lệ","Tự động chuyển thành hợp đồng công chứng","Chỉ ảnh hưởng đến trách nhiệm của công chức","Không bảo đảm hình thức, có thể bị tuyên vô hiệu"],"a":3,"e":"Hợp đồng thế chấp quyền sử dụng đất phải được công chứng, chứng thực hợp lệ. Chứng thực sai thẩm quyền không đáp ứng yêu cầu hình thức, có thể bị tuyên bố vô hiệu theo Điều 129 BLDS nếu không được khắc phục.","b":"Điều 129 BLDS","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"lv":"VD","q":"Công chức tư pháp – hộ tịch tự ký chứng thực phải chịu trách nhiệm gì?","o":["Bị kỷ luật; có thể phải hoàn trả nếu gây thiệt hại","Không chịu trách nhiệm, vì làm để giúp người dân","Chỉ bị nhắc nhở, rút kinh nghiệm","Phải bồi thường gấp đôi thiệt hại cho người dân"],"a":0,"e":"Hành vi vượt thẩm quyền của người thi hành công vụ bị xử lý kỷ luật; thiệt hại gây ra được giải quyết theo pháp luật về trách nhiệm bồi thường của Nhà nước, người thi hành công vụ có lỗi phải hoàn trả.","b":"Điều 5 NĐ 23/2015","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"VD","q":"Ủy ban nhân dân xã B có thẩm quyền chứng thực hợp đồng chuyển nhượng thửa đất ở xã A không?","o":["Có, vì hai bên đều cư trú tại xã B","Có, vì mọi Ủy ban nhân dân cấp xã đều có thẩm quyền như nhau","Có, nếu Ủy ban nhân dân xã A đồng ý","Không, phải chứng thực tại xã A nơi có đất"],"a":3,"e":"Điều 5 NĐ 23/2015: việc chứng thực hợp đồng, giao dịch liên quan đến thực hiện quyền của người sử dụng đất được thực hiện tại Ủy ban nhân dân cấp xã nơi có đất.","b":"Điều 5 NĐ 23/2015","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"VD","q":"Người thực hiện chứng thực hợp đồng chịu trách nhiệm về những nội dung nào?","o":["Không chịu trách nhiệm về bất kỳ nội dung nào","Thời gian, địa điểm, năng lực, ý chí và chữ ký các bên","Toàn bộ nội dung hợp đồng, kể cả diện tích thực tế","Chỉ chịu trách nhiệm về giá chuyển nhượng"],"a":1,"e":"Điều 35 NĐ 23/2015: người thực hiện chứng thực hợp đồng chịu trách nhiệm về thời gian, địa điểm giao kết hợp đồng; năng lực hành vi dân sự, ý chí tự nguyện, chữ ký hoặc dấu điểm chỉ của các bên tham gia hợp đồng; không chịu trách nhiệm về nội dung hợp đồng.","b":"Điều 35 NĐ 23/2015","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Bà Rây cho rằng Ủy ban nhân dân xã phải chịu trách nhiệm về diện tích thực tế \"vì đã chứng thực\". Nhận xét nào chính xác?","o":["Xã không chịu trách nhiệm về diện tích, vì đó là nội dung hợp đồng","Xã phải chịu toàn bộ vì đã chứng thực sai thẩm quyền","Xã chỉ chịu trách nhiệm nếu diện tích sai lệch trên 10%","Xã phải chịu trách nhiệm vì chứng thực bảo đảm toàn bộ hợp đồng"],"a":0,"e":"Theo Điều 35 NĐ 23/2015, người thực hiện chứng thực không chịu trách nhiệm về nội dung hợp đồng. Tranh chấp diện tích thực tế là tranh chấp giữa các bên; riêng việc chứng thực sai thẩm quyền là vi phạm riêng của người chứng thực.","b":"Điều 35 NĐ 23/2015","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"lv":"VD","q":"Để bảo đảm hình thức hợp đồng, ông Quốc và bà Rây nên làm gì?","o":["Chỉ cần đăng ký biến động là đủ","Nhờ trưởng thôn nơi có đất xác nhận hợp đồng","Chứng thực lại tại xã A hoặc công chứng trong tỉnh","Giữ nguyên hợp đồng đã chứng thực tại xã B"],"a":2,"e":"Hợp đồng chuyển nhượng quyền sử dụng đất phải được công chứng hoặc chứng thực hợp lệ (Điều 27 Luật Đất đai). Chứng thực tại xã B sai thẩm quyền nên cần thực hiện lại tại nơi có thẩm quyền.","b":"Điều 5 NĐ 23/2015; điểm a khoản 3 Điều 27 Luật Đất đai","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"lv":"VD","q":"Ai chịu trách nhiệm về tính hợp pháp của bản chính bằng tốt nghiệp?","o":["Cơ quan tuyển dụng tiếp nhận hồ sơ","Bà Uyên, người yêu cầu chứng thực bản sao","Người thực hiện chứng thực bản sao","Ủy ban nhân dân cấp xã nơi chứng thực"],"a":1,"e":"Điều 4 và Điều 9 NĐ 23/2015: người yêu cầu chứng thực chịu trách nhiệm về nội dung, tính hợp lệ, hợp pháp của giấy tờ làm cơ sở để chứng thực hoặc giấy tờ mang tới để chứng thực.","b":"Điều 4, Điều 9 NĐ 23/2015","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"lv":"VD","q":"Người thực hiện chứng thực chịu trách nhiệm về nội dung gì?","o":["Toàn bộ thiệt hại mà cơ quan tuyển dụng gánh chịu","Tính xác thực và hợp pháp của bản chính","Không chịu trách nhiệm gì","Tính chính xác của bản sao so với bản chính"],"a":3,"e":"Điều 4 NĐ 23/2015: người thực hiện chứng thực chịu trách nhiệm về tính chính xác, hợp pháp của giấy tờ đã chứng thực; đối với bản sao là bản sao đúng với bản chính được xuất trình. Nếu đã làm đúng quy trình mà không thể phát hiện giấy tờ giả thì không chịu trách nhiệm về tính xác thực của bản chính.","b":"Điều 4 NĐ 23/2015","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"lv":"VD","q":"Bản sao đã chứng thực từ bằng giả có giá trị sử dụng không?","o":["Không có giá trị sử dụng","Có giá trị trong 06 tháng","Có, vì đã được chứng thực hợp lệ","Có giá trị nếu bà Uyên nộp phạt"],"a":0,"e":"Bản sao chỉ có giá trị thay cho bản chính hợp pháp (Điều 3 NĐ 23/2015). Bản chính là giả thì bản sao được chứng thực từ đó không có giá trị sử dụng.","b":"Điều 3 NĐ 23/2015","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"lv":"VD","q":"Bà Uyên có thể bị xử lý thế nào?","o":["Chỉ bị thu hồi bản sao đã chứng thực","Chỉ bị cơ quan tuyển dụng từ chối hồ sơ","Bị xử phạt hành chính hoặc truy cứu hình sự","Không bị xử lý, vì cán bộ đã chứng thực bản sao"],"a":2,"e":"Sử dụng giấy tờ giả để yêu cầu chứng thực bị xử phạt vi phạm hành chính trong lĩnh vực chứng thực; nếu đủ yếu tố cấu thành thì bị truy cứu trách nhiệm hình sự (tội sử dụng tài liệu giả của cơ quan, tổ chức – Điều 341 BLHS).","b":"Điều 9 NĐ 23/2015; Điều 341 BLHS","cid":"TH6.03"},{"id":"TH7.01.1","g":7,"lv":"VD","q":"Hoàng có thể yêu cầu Ủy ban nhân dân cấp xã nào chứng thực bản sao bằng tốt nghiệp?","o":["Chỉ Ủy ban nhân dân cấp xã nơi thường trú tại Thanh Hóa","Chỉ Ủy ban nhân dân phường nơi tạm trú nếu có giấy xác nhận tạm trú","Ủy ban nhân dân cấp xã nơi trường đại học đặt trụ sở","Bất kỳ Ủy ban nhân dân cấp xã nào, không phụ thuộc nơi cư trú"],"a":3,"e":"Điều 5 NĐ 23/2015: việc chứng thực bản sao từ bản chính, chứng thực chữ ký được thực hiện tại bất kỳ cơ quan, tổ chức có thẩm quyền chứng thực nào, không phụ thuộc vào nơi cư trú của người yêu cầu chứng thực.","b":"Điều 5 NĐ 23/2015","cid":"TH7.01"},{"id":"TH7.01.2","g":7,"lv":"VD","q":"Ngoài Ủy ban nhân dân cấp xã, Hoàng có thể yêu cầu chứng thực bản sao bằng tốt nghiệp ở đâu?","o":["Tại tổ chức hành nghề công chứng","Tại Tòa án nhân dân khu vực","Tại công an phường nơi tạm trú","Chỉ tại trường đại học đã cấp bằng"],"a":0,"e":"Điều 5 NĐ 23/2015: tổ chức hành nghề công chứng có thẩm quyền chứng thực bản sao từ bản chính; công chứng viên ký chứng thực và đóng dấu của tổ chức hành nghề công chứng.","b":"Điều 5 NĐ 23/2015","cid":"TH7.01"},{"id":"TH7.01.3","g":7,"lv":"VD","q":"Hoàng phải xuất trình giấy tờ gì?","o":["Sổ hộ khẩu hoặc giấy xác nhận cư trú","Giấy xác nhận tốt nghiệp của trường","Bản chính bằng tốt nghiệp (kèm bản chụp nếu có)","Chỉ cần bản photo bằng tốt nghiệp"],"a":2,"e":"Điều 20 NĐ 23/2015: người yêu cầu chứng thực bản sao xuất trình bản chính giấy tờ làm cơ sở để chứng thực bản sao và bản sao cần chứng thực; trường hợp chỉ xuất trình bản chính thì cơ quan chụp từ bản chính.","b":"Điều 20 NĐ 23/2015","cid":"TH7.01"},{"id":"TH7.01.4","g":7,"lv":"VD","q":"Hoàng nộp yêu cầu lúc 16 giờ. Thời hạn trả kết quả là khi nào?","o":["Ngay trong ngày tiếp nhận","Chậm nhất trong ngày làm việc tiếp theo","03 ngày làm việc kể từ ngày tiếp nhận","05 ngày làm việc kể từ ngày tiếp nhận"],"a":1,"e":"Điều 7 NĐ 23/2015: thời hạn chứng thực bản sao được bảo đảm ngay trong ngày cơ quan tiếp nhận yêu cầu hoặc trong ngày làm việc tiếp theo nếu tiếp nhận yêu cầu sau 15 giờ.","b":"Điều 7 NĐ 23/2015","cid":"TH7.01"},{"id":"TH7.02.1","g":7,"lv":"VD","q":"Ủy ban nhân dân xã có chứng thực bản sao từ bản photo cũ của bằng tốt nghiệp không?","o":["Không, vì phải có bản chính để đối chiếu","Có, nếu bố anh Lực cam đoan về tính xác thực","Có, nếu bản photo còn rõ nét","Có, nếu trường đại học xác nhận qua điện thoại"],"a":0,"e":"Chứng thực bản sao từ bản chính là việc căn cứ vào bản chính để chứng thực bản sao là đúng với bản chính (khoản 2 Điều 2 NĐ 23/2015). Bản photo không phải bản chính.","b":"Khoản 2 Điều 2 NĐ 23/2015","cid":"TH7.02"},{"id":"TH7.02.2","g":7,"lv":"VD","q":"Thủ tục phù hợp để anh Lực có giấy tờ thay bằng đã mất là gì?","o":["Chứng thực chữ ký trên đơn cam kết mất bằng","Công chứng bản photo cũ của bằng tốt nghiệp","Yêu cầu trường cấp bản sao từ sổ gốc","Xin xác nhận của công an phường nơi cư trú"],"a":2,"e":"Khoản 1 Điều 2 NĐ 23/2015: cấp bản sao từ sổ gốc là việc cơ quan, tổ chức đang quản lý sổ gốc căn cứ vào sổ gốc để cấp bản sao; thẩm quyền thuộc cơ quan, tổ chức đang quản lý sổ gốc (Điều 16).","b":"Khoản 1 Điều 2, Điều 16 NĐ 23/2015","cid":"TH7.02"},{"id":"TH7.02.3","g":7,"lv":"VD","q":"Bố anh Lực có được yêu cầu cấp bản sao từ sổ gốc thay cho con không?","o":["Không, chỉ người được cấp bản chính mới được yêu cầu","Có, cha, mẹ có quyền yêu cầu","Chỉ khi có giấy ủy quyền được công chứng","Chỉ khi anh Lực đã chết"],"a":1,"e":"Điều 17 NĐ 23/2015: người có quyền yêu cầu cấp bản sao từ sổ gốc gồm người được cấp bản chính, người đại diện theo pháp luật, người đại diện theo ủy quyền và cha, mẹ, con; vợ, chồng; anh, chị, em ruột; người thừa kế khác của người được cấp bản chính trong trường hợp người đó đã chết.","b":"Điều 17 NĐ 23/2015","cid":"TH7.02"},{"id":"TH7.02.4","g":7,"lv":"VD","q":"Bản sao từ sổ gốc có giá trị pháp lý thế nào so với bản sao chứng thực từ bản chính?","o":["Chỉ được sử dụng trong nội bộ trường đại học","Thấp hơn, vì không được đối chiếu với bản chính","Chỉ có giá trị khi được chứng thực thêm","Có giá trị sử dụng thay cho bản chính"],"a":3,"e":"Điều 3 NĐ 23/2015: bản sao được cấp từ sổ gốc có giá trị sử dụng thay cho bản chính trong các giao dịch, trừ trường hợp pháp luật có quy định khác; bản sao được chứng thực từ bản chính cũng có giá trị thay cho bản chính đã dùng để đối chiếu.","b":"Điều 3 NĐ 23/2015","cid":"TH7.02"},{"id":"TH7.03.1","g":7,"lv":"VD","q":"Văn phòng công chứng có thẩm quyền chứng thực bản sao từ bản chính cho Công ty Yến Sào không?","o":["Chỉ Phòng công chứng nhà nước mới có thẩm quyền","Có, tổ chức hành nghề công chứng được chứng thực bản sao","Không, chỉ Ủy ban nhân dân cấp xã có thẩm quyền","Chỉ khi có văn bản ủy quyền của Sở Tư pháp"],"a":1,"e":"Điều 5 NĐ 23/2015: tổ chức hành nghề công chứng có thẩm quyền và trách nhiệm chứng thực bản sao từ bản chính; công chứng viên ký chứng thực và đóng dấu của tổ chức hành nghề công chứng.","b":"Điều 5 NĐ 23/2015","cid":"TH7.03"},{"id":"TH7.03.2","g":7,"lv":"VD","q":"Công ty đòi nhận đủ 200 bản trong ngày. Thời hạn giải quyết được xác định thế nào?","o":["Kéo dài theo thỏa thuận bằng văn bản","Tối đa 05 ngày làm việc trong mọi trường hợp","Bắt buộc trả trong ngày vì nộp hồ sơ lúc 9 giờ","Không có thời hạn, tùy khả năng của Văn phòng"],"a":0,"e":"Điều 7 NĐ 23/2015: thời hạn chứng thực bản sao là trong ngày (hoặc ngày làm việc tiếp theo nếu tiếp nhận sau 15 giờ); trường hợp yêu cầu chứng thực bản sao với số lượng lớn, giấy tờ đa dạng, phức tạp thì thời hạn có thể kéo dài theo thỏa thuận bằng văn bản với người yêu cầu.","b":"Điều 7 NĐ 23/2015","cid":"TH7.03"},{"id":"TH7.03.3","g":7,"lv":"VD","q":"Ai ký chứng thực bản sao tại Văn phòng công chứng?","o":["Trưởng Văn phòng trong mọi trường hợp","Nhân viên nghiệp vụ được Văn phòng giao","Thư ký nghiệp vụ của Văn phòng","Công chứng viên, đóng dấu của Văn phòng công chứng"],"a":3,"e":"Khoản 3 Điều 5 NĐ 23/2015: công chứng viên ký chứng thực và đóng dấu của tổ chức hành nghề công chứng khi chứng thực bản sao từ bản chính, chữ ký.","b":"Điều 5 NĐ 23/2015","cid":"TH7.03"},{"id":"TH7.03.4","g":7,"lv":"VD","q":"Một bản chính giấy chứng nhận đăng ký doanh nghiệp dài 05 trang, phí chứng thực mỗi bản sao là bao nhiêu?","o":["5.000 đồng","10.000 đồng","7.000 đồng","2.000 đồng"],"a":2,"e":"Điều 4 TT 226/2016: phí chứng thực bản sao từ bản chính là 2.000 đồng/trang cho hai trang đầu, từ trang thứ ba trở lên 1.000 đồng/trang (tối đa 200.000 đồng/bản): 2 × 2.000 + 3 × 1.000 = 7.000 đồng. Mức này cũng áp dụng khi chứng thực tại tổ chức hành nghề công chứng.","b":"Điều 4 Thông tư 226/2016/TT-BTC","cid":"TH7.03"},{"id":"TH8.01.1","g":8,"lv":"VD","q":"Ủy ban nhân dân xã có chứng thực chữ ký trên giấy ủy quyền chung này không?","o":["Không, vì có nội dung bán nhà","Có, nếu con gái bà Nga cùng ký","Có, vì ủy quyền không có thù lao","Có, nếu bà Nga ký trước mặt người chứng thực"],"a":0,"e":"Điều 24 NĐ 23/2015: chứng thực chữ ký trên giấy ủy quyền chỉ áp dụng khi ủy quyền không có thù lao, không có nghĩa vụ bồi thường của bên được ủy quyền và không liên quan đến việc chuyển quyền sở hữu tài sản, quyền sử dụng bất động sản. Việc bán nhà không thuộc phạm vi này.","b":"Điều 24 NĐ 23/2015","cid":"TH8.01"},{"id":"TH8.01.2","g":8,"lv":"VD","q":"Đối với việc nộp hồ sơ, nhận hộ kết quả cấp đổi giấy phép lái xe, bà Nga cần lập văn bản gì?","o":["Không cần lập bất kỳ văn bản nào","Giấy ủy quyền, có thể chứng thực chữ ký","Văn bản cam kết có xác nhận của công an","Hợp đồng ủy quyền bắt buộc phải công chứng"],"a":1,"e":"Việc nộp hồ sơ, nhận kết quả không có thù lao, không liên quan đến chuyển quyền tài sản nên thuộc trường hợp được chứng thực chữ ký trên giấy ủy quyền (Điều 24 NĐ 23/2015).","b":"Điều 24 NĐ 23/2015","cid":"TH8.01"},{"id":"TH8.01.3","g":8,"lv":"VD","q":"Đối với việc nhờ con gái thay mặt ký hợp đồng bán căn nhà, bà Nga cần lập văn bản gì?","o":["Giấy ủy quyền có chứng thực chữ ký","Đơn đề nghị gửi Ủy ban nhân dân xã","Không cần ủy quyền vì là con gái","Hợp đồng ủy quyền được công chứng, chứng thực"],"a":3,"e":"Ủy quyền liên quan đến chuyển quyền sở hữu bất động sản phải lập thành hợp đồng ủy quyền (Điều 562 BLDS) và được công chứng hoặc chứng thực theo quy định, không chứng thực chữ ký trên giấy ủy quyền.","b":"Điều 562 BLDS; Điều 24 NĐ 23/2015","cid":"TH8.01"},{"id":"TH8.01.4","g":8,"lv":"VD","q":"Khi chứng thực chữ ký trên giấy ủy quyền cho việc nhận hộ hồ sơ, bà Nga phải làm gì?","o":["Gửi giấy ủy quyền đã ký qua bưu điện","Ký sẵn ở nhà rồi mang đến cơ quan chứng thực","Ký trước mặt người thực hiện chứng thực","Nhờ con gái ký thay"],"a":2,"e":"Điều 24 NĐ 23/2015: người yêu cầu chứng thực chữ ký phải ký trước mặt người thực hiện chứng thực; người thực hiện chứng thực kiểm tra giấy tờ, ghi lời chứng.","b":"Điều 24 NĐ 23/2015","cid":"TH8.01"},{"id":"TH8.02.1","g":8,"lv":"VD","q":"Yêu cầu chứng thực chữ ký đầu tiên của ông Phú được xử lý thế nào?","o":["Chứng thực, vì chữ ký đúng là của ông Phú","Yêu cầu người nhà ký thay ông Phú","Chứng thực, nếu ông Phú cam đoan về chữ ký","Từ chối, vì ông Phú không ký trước mặt và không làm chủ được hành vi"],"a":3,"e":"Điều 24 NĐ 23/2015: người yêu cầu chứng thực phải ký trước mặt người thực hiện chứng thực; chữ ký ký sẵn không được chứng thực. Điều 25: không chứng thực chữ ký khi tại thời điểm chứng thực người yêu cầu chứng thực không nhận thức, làm chủ được hành vi của mình.","b
