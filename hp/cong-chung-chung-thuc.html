,"lv":"VD","q":"Bà B mang bằng thạc sĩ do trường đại học của Úc cấp, chưa hợp pháp hóa lãnh sự và không thuộc diện được miễn, yêu cầu chứng thực bản sao. Người thực hiện chứng thực:","o":["Chứng thực và ghi chú chưa hợp pháp hóa","Phải từ chối chứng thực","Chỉ chứng thực bản dịch","Chứng thực bình thường"],"a":1,"e":"Đoạn 2 khoản 1 Điều 20 và khoản 5 Điều 22 NĐ 23: bản chính do cơ quan có thẩm quyền của nước ngoài cấp phải được hợp pháp hóa lãnh sự trước khi yêu cầu chứng thực bản sao, trừ trường hợp được miễn. Người thực hiện chứng thực phải từ chối (khoản 4 Điều 9).","b":"Khoản 1 Điều 20, khoản 5 Điều 22, khoản 4 Điều 9 NĐ 23/2015"},{"id":"7.13","g":7,"lv":"VD","q":"Ông C mang Giấy chứng nhận quyền sử dụng đất bị rách một góc nhưng vẫn xác định được toàn bộ nội dung để chứng thực bản sao. Người thực hiện chứng thực:","o":["Chỉ chứng thực phần không bị rách","Phải từ chối vì bản chính bị hư hỏng","Được chứng thực vì vẫn xác định được nội dung","Phải yêu cầu cấp lại Giấy chứng nhận trước"],"a":2,"e":"Khoản 2 Điều 22 NĐ 23 chỉ loại trừ bản chính bị hư hỏng, cũ nát “không xác định được nội dung”. Giấy chứng nhận rách góc nhưng vẫn xác định được toàn bộ nội dung thì vẫn được dùng làm cơ sở chứng thực.","b":"Khoản 2 Điều 22 NĐ 23/2015"},{"id":"7.14","g":7,"lv":"VD","q":"Chị D chỉ mang theo bản chính giấy khai sinh, không mang bản chụp. Cơ quan chứng thực:","o":["Chụp từ bản chính để chứng thực, trừ trường hợp không có phương tiện để chụp","Chứng thực trực tiếp trên bản chính","Từ chối, yêu cầu chị D tự đi photo","Yêu cầu nộp thêm phí phạt"],"a":0,"e":"Khoản 2 Điều 20 NĐ 23: trường hợp người yêu cầu chỉ xuất trình bản chính thì cơ quan, tổ chức tiến hành chụp từ bản chính để thực hiện chứng thực, trừ trường hợp không có phương tiện để chụp.","b":"Khoản 2 Điều 20 NĐ 23/2015"},{"id":"7.15","g":7,"lv":"VD","q":"Ông E yêu cầu chứng thực bản sao một văn bằng có dấu hiệu bị sửa chữa năm tốt nghiệp. Người thực hiện chứng thực:","o":["Vẫn chứng thực vì chỉ chịu trách nhiệm bản sao đúng với bản chính","Chuyển cho trường cấp bằng chứng thực","Từ chối vì bản chính bị sửa chữa nội dung không hợp lệ","Chứng thực và ghi chú nghi vấn"],"a":2,"e":"Khoản 1 Điều 22 NĐ 23: bản chính bị tẩy xóa, sửa chữa, thêm, bớt nội dung không hợp lệ thì không được dùng làm cơ sở chứng thực. Theo khoản 3 Điều 20, người thực hiện chứng thực phải kiểm tra bản chính trước khi chứng thực, nên phải từ chối.","b":"Khoản 1 Điều 22, khoản 3 Điều 20 NĐ 23/2015"},{"id":"7.16","g":7,"lv":"VD","q":"Ông F đã chết. Con ông yêu cầu cấp bản sao từ sổ gốc một giấy tờ đã cấp cho ông F. Người con phải:","o":["Không cần giấy tờ gì thêm","Xuất trình giấy tờ chứng minh quan hệ với ông F","Có bản án công nhận quyền thừa kế","Có văn bản đồng ý của tất cả người thừa kế"],"a":1,"e":"Khoản 3 Điều 16 NĐ 23 cho phép con của người được cấp bản chính đã chết yêu cầu cấp bản sao từ sổ gốc. Điểm b khoản 1 Điều 17 NĐ 23 (đã sửa đổi bởi NĐ 280/2025): hồ sơ phải có bản chính hoặc bản sao có chứng thực giấy tờ chứng minh quan hệ với người được cấp bản chính.","b":"Khoản 3 Điều 16, điểm b khoản 1 Điều 17 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"7.17","g":7,"lv":"VD","q":"Bạn thân của chị G (không có văn bản ủy quyền) yêu cầu cấp bản sao từ sổ gốc giấy tờ của chị G khi chị G đang sống. Cơ quan quản lý sổ gốc:","o":["Phải cấp bản sao","Không cấp vì người này không thuộc đối tượng có quyền yêu cầu","Cấp nếu người này cam kết bằng văn bản","Cấp nếu có người làm chứng"],"a":1,"e":"Điều 16 NĐ 23 chỉ cho phép người được cấp bản chính, người đại diện theo pháp luật hoặc theo ủy quyền, và thân nhân, người thừa kế khi người đó đã chết yêu cầu cấp bản sao từ sổ gốc. Bạn thân không có ủy quyền không thuộc các đối tượng này.","b":"Điều 16 NĐ 23/2015"},{"id":"7.18","g":7,"lv":"VD","q":"Chị H yêu cầu chứng thực bản sao thẻ căn cước nhưng bản chụp chỉ có mặt trước. Người thực hiện chứng thực:","o":["Chứng thực và ghi chú thiếu mặt sau","Không chứng thực vì bản sao phải gồm đầy đủ số trang có thông tin của bản chính","Chỉ cần chị H ký cam kết","Được chứng thực bản sao mặt trước"],"a":1,"e":"Điều 10 TT 01: bản sao từ bản chính để chứng thực phải gồm đầy đủ số trang có thông tin của bản chính. Thẻ căn cước có thông tin ở cả hai mặt nên bản sao chỉ có mặt trước không được chứng thực.","b":"Điều 10 Thông tư 01/2020/TT-BTP"},{"id":"7.19","g":7,"lv":"VD","q":"Giấy tờ do cơ quan nước ngoài cấp, thuộc diện được miễn hợp pháp hóa lãnh sự theo điều ước quốc tế mà Việt Nam là thành viên:","o":["Được chứng thực bản sao mà không cần hợp pháp hóa lãnh sự","Không được chứng thực bản sao","Chỉ được chứng thực tại Bộ Ngoại giao","Vẫn phải hợp pháp hóa lãnh sự"],"a":0,"e":"Đoạn 2 khoản 1 Điều 20 NĐ 23: giấy tờ do cơ quan nước ngoài cấp phải hợp pháp hóa lãnh sự “trừ trường hợp được miễn hợp pháp hóa lãnh sự theo điều ước quốc tế mà Việt Nam là thành viên hoặc theo nguyên tắc có đi, có lại”.","b":"Khoản 1 Điều 20 NĐ 23/2015"},{"id":"7.20","g":7,"lv":"VD","q":"Ông K yêu cầu chứng thực bản sao bản tường trình do chính ông tự lập, đã có xác nhận và đóng dấu của Ủy ban nhân dân phường có thẩm quyền. Bản tường trình này:","o":["Chỉ được chứng thực chữ ký","Phải công chứng trước","Không được chứng thực vì do cá nhân tự lập","Đủ điều kiện làm cơ sở để chứng thực bản sao"],"a":3,"e":"Khoản 2 Điều 18 NĐ 23: bản chính giấy tờ do cá nhân tự lập có xác nhận và đóng dấu của cơ quan, tổ chức có thẩm quyền là giấy tờ làm cơ sở để chứng thực bản sao. So sánh với Câu 125 để thấy vai trò của việc xác nhận, đóng dấu.","b":"Khoản 2 Điều 18 NĐ 23/2015"},{"id":"8.01","g":8,"lv":"NB","q":"Người yêu cầu chứng thực chữ ký phải ký như thế nào?","o":["Ký trước mặt người thực hiện chứng thực; tại bộ phận một cửa thì ký trước mặt công chức tiếp nhận hồ sơ","Không cần ký trước mặt ai","Ký trước ở nhà rồi mang đến","Ký trước mặt hai người làm chứng"],"a":0,"e":"Khoản 2 Điều 24 NĐ 23: người thực hiện chứng thực yêu cầu người yêu cầu chứng thực ký trước mặt. Khoản 3 Điều 24: tại bộ phận một cửa, công chức tiếp nhận đề nghị người yêu cầu ký vào giấy tờ rồi chuyển cho người có thẩm quyền ký chứng thực.","b":"Khoản 2, khoản 3 Điều 24 NĐ 23/2015"},{"id":"8.02","g":8,"lv":"TH","q":"Trường hợp nào sau đây KHÔNG được chứng thực chữ ký?","o":["Chữ ký trên đơn đề nghị","Chữ ký trên bản tường trình","Chữ ký trên giấy tờ có nội dung là hợp đồng mua bán tài sản giữa hai cá nhân","Chữ ký trên giấy ủy quyền nhận hộ lương hưu không có thù lao"],"a":2,"e":"Khoản 4 Điều 25 NĐ 23: không được chứng thực chữ ký trong giấy tờ, văn bản có nội dung là hợp đồng, giao dịch (trừ giấy ủy quyền theo điểm d khoản 4 Điều 24 hoặc pháp luật quy định khác). Hợp đồng mua bán phải làm thủ tục chứng thực hợp đồng hoặc công chứng.","b":"Khoản 4 Điều 25 NĐ 23/2015"},{"id":"8.03","g":8,"lv":"NB","q":"Khi người yêu cầu chứng thực không ký được, thủ tục áp dụng là:","o":["Chứng thực điểm chỉ, áp dụng thủ tục như chứng thực chữ ký","Người thân ký thay","Từ chối chứng thực","Chứng thực qua người làm chứng"],"a":0,"e":"Điều 26 NĐ 23: thủ tục chứng thực chữ ký và trường hợp không được chứng thực chữ ký cũng được áp dụng đối với chứng thực điểm chỉ khi người yêu cầu không ký được, và trường hợp không thể ký, điểm chỉ được.","b":"Điều 26 NĐ 23/2015"},{"id":"8.04","g":8,"lv":"NB","q":"Tiêu chuẩn của người dịch theo Nghị định 23/2015/NĐ-CP là:","o":["Có năng lực hành vi dân sự đầy đủ và có bằng cử nhân ngoại ngữ trở lên hoặc tốt nghiệp đại học trở lên đối với thứ tiếng cần dịch (ngôn ngữ không phổ biến thì phải thông thạo)","Chỉ cần có chứng chỉ ngoại ngữ bậc B","Phải có 05 năm kinh nghiệm dịch thuật","Phải là công chức"],"a":0,"e":"Điều 27 NĐ 23 quy định tiêu chuẩn, điều kiện của người dịch đúng như nội dung câu hỏi, kể cả ngoại lệ đối với ngôn ngữ không phổ biến.","b":"Điều 27 NĐ 23/2015"},{"id":"8.05","g":8,"lv":"NB","q":"Giấy tờ nào sau đây KHÔNG được dịch để yêu cầu chứng thực chữ ký người dịch?","o":["Bằng tốt nghiệp","Giấy tờ đóng dấu mật hoặc ghi rõ không được dịch","Hộ chiếu","Giấy khai sinh"],"a":1,"e":"Khoản 3 Điều 32 NĐ 23: giấy tờ, văn bản đóng dấu mật hoặc không đóng dấu mật nhưng ghi rõ không được dịch thuộc trường hợp không được dịch để chứng thực chữ ký người dịch.","b":"Khoản 3 Điều 32 NĐ 23/2015"},{"id":"8.06","g":8,"lv":"NB","q":"Thời hạn chứng thực hợp đồng, giao dịch là:","o":["Không quá 30 ngày","Không quá 02 ngày làm việc kể từ ngày nhận đủ hồ sơ, hoặc dài hơn theo thỏa thuận bằng văn bản","Ngay trong ngày","Không quá 10 ngày làm việc"],"a":1,"e":"Điều 37 NĐ 23: thời hạn chứng thực hợp đồng, giao dịch không quá 02 ngày làm việc kể từ ngày nhận đủ hồ sơ, hoặc có thể kéo dài hơn theo thỏa thuận bằng văn bản.","b":"Điều 37 NĐ 23/2015"},{"id":"8.07","g":8,"lv":"TH","q":"Ai chịu trách nhiệm về nội dung, tính hợp pháp của hợp đồng, giao dịch được chứng thực?","o":["Người thực hiện chứng thực","Người làm chứng","Ủy ban nhân dân cấp xã","Người yêu cầu chứng thực"],"a":3,"e":"Khoản 1 Điều 35 NĐ 23: người yêu cầu chứng thực phải hoàn toàn chịu trách nhiệm về nội dung, tính hợp pháp của hợp đồng. Theo khoản 2 Điều 35, người thực hiện chứng thực chỉ chịu trách nhiệm về thời gian, địa điểm, năng lực hành vi, ý chí tự nguyện, chữ ký hoặc điểm chỉ (nhưng có quyền từ chối hợp đồng có nội dung trái pháp luật).","b":"Khoản 1, khoản 2 Điều 35 NĐ 23/2015"},{"id":"8.08","g":8,"lv":"TH","q":"Người yêu cầu chứng thực hợp đồng không đọc được, không nghe được, không ký, không điểm chỉ được thì phải có:","o":["01 người làm chứng","Không cần người làm chứng","02 người làm chứng","03 người làm chứng"],"a":2,"e":"Đoạn 3 khoản 3 Điều 36 NĐ 23: nếu người yêu cầu chứng thực không đọc được, không nghe được, không ký, không điểm chỉ được thì phải có 02 (hai) người làm chứng. Cần phân biệt với thủ tục công chứng tại khoản 2 Điều 49 LCC (không quy định số lượng hai người).","b":"Khoản 3 Điều 36 NĐ 23/2015; khoản 2 Điều 49 LCC"},{"id":"8.09","g":8,"lv":"TH","q":"Về nơi chứng thực việc sửa đổi, bổ sung, hủy bỏ hợp đồng, giao dịch đã chứng thực, quy định đúng là:","o":["Chỉ thực hiện tại Phòng Tư pháp","Không được sửa đổi, phải lập giao dịch mới","Thực hiện tại bất kỳ cơ quan nào kể cả với hợp đồng","Thực hiện tại cơ quan đã chứng thực; riêng di chúc có thể chứng thực tại bất kỳ cơ quan có thẩm quyền nào"],"a":3,"e":"Khoản 2 Điều 38 NĐ 23: việc sửa đổi, bổ sung, hủy bỏ hợp đồng được thực hiện tại cơ quan đã chứng thực; riêng di chúc có thể chứng thực tại bất kỳ cơ quan có thẩm quyền nào và cơ quan thực hiện phải thông báo cho cơ quan đã chứng thực trước đó.","b":"Khoản 2 Điều 38 NĐ 23/2015"},{"id":"8.10","g":8,"lv":"TH","q":"Phạm vi chứng thực hợp đồng, giao dịch gồm:","o":["Chỉ hợp đồng có giá trị dưới 50 triệu đồng","Hợp đồng, giao dịch pháp luật quy định phải chứng thực và hợp đồng, giao dịch cá nhân, tổ chức tự nguyện yêu cầu chứng thực","Chỉ hợp đồng, giao dịch pháp luật quy định phải chứng thực","Chỉ hợp đồng về bất động sản"],"a":1,"e":"Điều 34 NĐ 23: phạm vi chứng thực gồm cả hợp đồng, giao dịch mà pháp luật không quy định phải chứng thực nhưng cá nhân, tổ chức tự nguyện yêu cầu chứng thực.","b":"Điều 34 NĐ 23/2015"},{"id":"8.11","g":8,"lv":"VD","q":"Ông A muốn ủy quyền cho con gái nhận hộ lương hưu (không thù lao, không nghĩa vụ bồi thường). Hình thức phù hợp là:","o":["Lập giấy ủy quyền và chứng thực chữ ký của ông A","Phải có bản án của Tòa án","Chỉ cần ủy quyền miệng","Bắt buộc lập hợp đồng ủy quyền có công chứng"],"a":0,"e":"Điểm d khoản 4 Điều 24 NĐ 23: thủ tục chứng thực chữ ký áp dụng với giấy ủy quyền không có thù lao, không có nghĩa vụ bồi thường của bên được ủy quyền và không liên quan đến việc chuyển quyền sở hữu tài sản, quyền sử dụng bất động sản. Ủy quyền nhận hộ lương hưu thỏa mãn các điều kiện này.","b":"Điểm d khoản 4 Điều 24 NĐ 23/2015"},{"id":"8.12","g":8,"lv":"VD","q":"Bà B muốn ủy quyền cho cháu bán chiếc ô tô của mình và nhận tiền bán xe. Hình thức đúng là:","o":["Lập hợp đồng ủy quyền và yêu cầu công chứng hoặc chứng thực hợp đồng","Ủy quyền miệng có người làm chứng","Lập giấy ủy quyền và chứng thực chữ ký","Chỉ cần đưa giấy đăng ký xe cho cháu"],"a":0,"e":"Ủy quyền bán ô tô và nhận tiền liên quan đến việc chuyển quyền sở hữu tài sản nên không thuộc điểm d khoản 4 Điều 24 NĐ 23. Theo khoản 4 Điều 25, không được chứng thực chữ ký trên văn bản này; bà B phải lập hợp đồng ủy quyền và yêu cầu công chứng hoặc chứng thực hợp đồng.","b":"Điểm d khoản 4 Điều 24, khoản 4 Điều 25 NĐ 23/2015"},{"id":"8.13","g":8,"lv":"VD","q":"Anh C có bằng cử nhân tiếng Anh, tự dịch giấy tờ tiếng Anh của mình sang tiếng Việt để dùng cho mục đích cá nhân (không phải cộng tác viên dịch thuật). Anh C:","o":["Không được chứng thực vì không phải cộng tác viên","Phải thuê công ty dịch thuật","Chỉ được công chứng bản dịch","Có thể yêu cầu chứng thực chữ ký người dịch trên bản dịch"],"a":3,"e":"Khoản 2 Điều 31 NĐ 23: người không phải cộng tác viên dịch thuật tự dịch giấy tờ phục vụ mục đích cá nhân có thể yêu cầu chứng thực chữ ký trên bản dịch, khi xuất trình giấy tờ tùy thân, văn bằng ngoại ngữ (theo khoản 2 Điều 27) và bản dịch kèm giấy tờ cần dịch.","b":"Khoản 2 Điều 31, khoản 2 Điều 27 NĐ 23/2015"},{"id":"8.14","g":8,"lv":"VD","q":"Ông D 80 tuổi, tại thời điểm chứng thực có biểu hiện lú lẫn, không nhận thức được việc mình làm, yêu cầu chứng thực chữ ký. Người thực hiện chứng thực:","o":["Chứng thực điểm chỉ thay chữ ký","Không được chứng thực chữ ký","Chứng thực nếu có người thân đi cùng","Vẫn chứng thực vì có giấy tờ tùy thân hợp lệ"],"a":1,"e":"Khoản 1 Điều 25 NĐ 23: không được chứng thực chữ ký nếu tại thời điểm chứng thực người yêu cầu không nhận thức và làm chủ được hành vi của mình. Giấy tờ tùy thân hợp lệ không thay thế được điều kiện này.","b":"Khoản 1 Điều 25 NĐ 23/2015"},{"id":"8.15","g":8,"lv":"VD","q":"Ông E và bà F yêu cầu chứng thực hợp đồng chuyển nhượng thửa đất đã có Giấy chứng nhận. Hồ sơ cần có:","o":["Bản án của Tòa án","Chỉ giấy tờ tùy thân","Xác nhận của hàng xóm về ranh giới","Dự thảo hợp đồng, giấy tờ tùy thân và Giấy chứng nhận quyền sử dụng đất (hoặc giấy tờ thay thế theo quy định)"],"a":3,"e":"Khoản 1 Điều 36 NĐ 23 (đã sửa đổi bởi NĐ 280/2025): người yêu cầu xuất trình một trong các giấy tờ tùy thân (căn cước điện tử, thẻ căn cước, hộ chiếu…) và nộp dự thảo giao dịch cùng giấy chứng nhận quyền sử dụng hoặc giấy tờ thay thế. Giấy chứng nhận là bản chính, bản sao có chứng thực hoặc bản sao điện tử được chứng thực; nộp trực tiếp thì có thể nộp bản sao kèm bản chính để đối chiếu.","b":"Khoản 1 Điều 36 NĐ 23/2015 (sửa đổi bởi NĐ 280/2025/NĐ-CP)"},{"id":"8.16","g":8,"lv":"VD","q":"Công ty X đã đăng ký chữ ký mẫu của giám đốc tại cơ quan chứng thực; giám đốc ký trước vào hợp đồng thuê xe rồi chuyển đến chứng thực. Người thực hiện chứng thực:","o":["Yêu cầu công ty đóng dấu lại","Chỉ chứng thực chữ ký bên còn lại","Đối chiếu với chữ ký mẫu để chứng thực; chỉ khi nghi ngờ mới yêu cầu ký trước mặt","Phải từ chối vì giám đốc không ký trước mặt"],"a":2,"e":"Đoạn 2 khoản 3 Điều 36 NĐ 23: người có thẩm quyền giao kết hợp đồng của doanh nghiệp đã đăng ký chữ ký mẫu có thể ký trước vào hợp đồng. Người thực hiện chứng thực đối chiếu với chữ ký mẫu; chỉ khi nghi ngờ mới yêu cầu ký trước mặt.","b":"Khoản 3 Điều 36 NĐ 23/2015"},{"id":"8.17","g":8,"lv":"VD","q":"Hợp đồng mua bán xe máy được chứng thực tại Ủy ban nhân dân xã A. Các bên muốn chứng thực việc hủy bỏ hợp đồng tại Ủy ban nhân dân xã B. Việc này:","o":["Đúng nếu hai bên cư trú tại xã B","Đúng quy định","Đúng nếu được xã A đồng ý bằng điện thoại","Không đúng; việc hủy bỏ phải thực hiện tại Ủy ban nhân dân xã A"],"a":3,"e":"Khoản 2 Điều 38 NĐ 23: việc sửa đổi, bổ sung, hủy bỏ hợp đồng, giao dịch được thực hiện tại cơ quan đã chứng thực hợp đồng, giao dịch, tức Ủy ban nhân dân xã A. Chỉ di chúc mới được thực hiện tại bất kỳ cơ quan nào.","b":"Khoản 2 Điều 38 NĐ 23/2015"},{"id":"8.18","g":8,"lv":"VD","q":"Hợp đồng tặng cho xe đã chứng thực ghi sai một ký tự số khung do lỗi đánh máy. Cách sửa đúng là:","o":["Các bên thỏa thuận bằng văn bản về việc sửa lỗi; thực hiện tại cơ quan đã chứng thực hợp đồng","Tự sửa bằng tay trên hợp đồng","Yêu cầu Tòa án sửa","Lập hợp đồng mới thay thế"],"a":0,"e":"Khoản 1 Điều 39 NĐ 23: việc sửa lỗi sai sót do ghi chép, đánh máy, in hợp đồng đã chứng thực được thực hiện theo thỏa thuận bằng văn bản của các bên, nếu không ảnh hưởng đến quyền, nghĩa vụ và được thực hiện tại cơ quan đã chứng thực.","b":"Khoản 1 Điều 39 NĐ 23/2015"},{"id":"8.19","g":8,"lv":"VD","q":"Ông H không thông thạo tiếng Việt yêu cầu chứng thực hợp đồng tặng cho xe. Trách nhiệm của người phiên dịch là:","o":["Chỉ dịch tóm tắt nội dung chính","Không phải ký vào hợp đồng","Dịch đầy đủ, chính xác nội dung hợp đồng, lời chứng và ký vào từng trang hợp đồng với tư cách người phiên dịch","Chỉ ký vào trang cuối"],"a":2,"e":"Khoản 5 Điều 36 NĐ 23: người phiên dịch có trách nhiệm dịch đầy đủ, chính xác nội dung của hợp đồng, nội dung lời chứng cho người yêu cầu chứng thực và ký vào từng trang hợp đồng với tư cách là người phiên dịch.","b":"Khoản 5 Điều 36 NĐ 23/2015"},{"id":"8.20","g":8,"lv":"VD","q":"Chủ tịch Ủy ban nhân dân xã có được chứng thực hợp đồng chuyển nhượng quyền sử dụng đất mà bên nhận chuyển nhượng là con rể của mình không?","o":["Không, vì con rể thuộc người thân thích theo Nghị định 23/2015","Được, vì không có quan hệ huyết thống","Được, nếu hợp đồng có giá trị nhỏ","Được, nếu có người làm chứng"],"a":0,"e":"Khoản 3 Điều 9 NĐ 23 xác định người thân thích bao gồm cả “con dâu, con rể”, không chỉ người có quan hệ huyết thống. Chủ tịch Ủy ban nhân dân xã không được chứng thực hợp đồng mà con rể của mình là một bên.","b":"Khoản 3 Điều 9 NĐ 23/2015"},{"id":"9.01","g":9,"lv":"NB","q":"Phí công chứng bao gồm:","o":["Chỉ phí công chứng giao dịch","Phí công chứng và chi phí đi lại","Phí công chứng và thù lao soạn thảo","Phí công chứng giao dịch, phí nhận lưu giữ di chúc, phí cấp bản sao văn bản công chứng"],"a":3,"e":"Khoản 1 Điều 70 LCC: phí công chứng bao gồm phí công chứng giao dịch, phí nhận lưu giữ di chúc, phí cấp bản sao văn bản công chứng. Người yêu cầu các việc này phải nộp phí.","b":"Khoản 1 Điều 70 LCC"},{"id":"9.02","g":9,"lv":"TH","q":"Mức thu phí công chứng được xác định như thế nào?","o":["Do Ủy ban nhân dân cấp tỉnh quyết định","Do từng tổ chức hành nghề công chứng tự quyết định","Theo pháp luật về phí, lệ phí (Thông tư 257/2016/TT-BTC)","Do các bên thỏa thuận"],"a":2,"e":"Khoản 2 Điều 70 LCC: mức thu, chế độ thu, nộp, sử dụng và quản lý phí công chứng thực hiện theo pháp luật về phí, lệ phí (hiện nay là TT 257). Tổ chức hành nghề công chứng chỉ được tự xác định giá dịch vụ theo yêu cầu trong phạm vi giá tối đa (khoản 2 Điều 71).","b":"Khoản 2 Điều 70, khoản 2 Điều 71 LCC; Thông tư 257/2016/TT-BTC"},{"id":"9.03","g":9,"lv":"NB","q":"Mức thu phí công chứng theo Thông tư 257/2016/TT-BTC áp dụng:","o":["Thống nhất đối với Phòng công chứng và Văn phòng công chứng","Khác nhau giữa các tỉnh","Chỉ với Phòng công chứng","Chỉ với Văn phòng công chứng"],"a":0,"e":"Khoản 1 Điều 4 TT 257: mức thu phí công chứng quy định tại Thông tư được áp dụng thống nhất đối với Phòng công chứng và Văn phòng công chứng.","b":"Khoản 1 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.04","g":9,"lv":"NB","q":"Giá tối đa đối với dịch vụ theo yêu cầu liên quan đến việc công chứng do cơ quan nào ban hành?","o":["Hiệp hội công chứng viên Việt Nam","Bộ Tài chính","Ủy ban nhân dân cấp tỉnh","Từng tổ chức hành nghề công chứng"],"a":2,"e":"Khoản 2 Điều 71 LCC: Ủy ban nhân dân cấp tỉnh ban hành giá tối đa đối với dịch vụ theo yêu cầu liên quan đến việc công chứng; tổ chức hành nghề công chứng xác định mức giá không vượt quá mức tối đa và niêm yết công khai.","b":"Khoản 2 Điều 71 LCC"},{"id":"9.05","g":9,"lv":"TH","q":"Chi phí công chứng ngoài trụ sở được xác định như thế nào?","o":["Bằng 200% phí công chứng","Miễn phí","Theo mức trần thống nhất toàn quốc","Do người yêu cầu công chứng và tổ chức hành nghề công chứng thỏa thuận; tổ chức phải niêm yết nguyên tắc tính chi phí"],"a":3,"e":"Điểm b khoản 1 và khoản 2 Điều 72 LCC: chi phí công chứng ngoài trụ sở là “chi phí khác”, mức chi phí do người yêu cầu công chứng và tổ chức hành nghề công chứng thỏa thuận. Tổ chức phải niêm yết nguyên tắc tính chi phí (khoản 3 Điều 72).","b":"Khoản 1, 2, 3 Điều 72 LCC"},{"id":"9.06","g":9,"lv":"TH","q":"Phí công chứng hợp đồng ủy quyền được tính:","o":["Do các bên thỏa thuận","Theo giá trị tài sản là đối tượng ủy quyền","Theo số trang hợp đồng","Theo mức cố định 50.000 đồng/trường hợp"],"a":3,"e":"Theo Điều 4 TT 257, công chứng hợp đồng ủy quyền thuộc nhóm việc có mức phí cố định, không tính theo giá trị tài sản: 50.000 đồng/trường hợp (giấy ủy quyền: 20.000 đồng/trường hợp).","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.07","g":9,"lv":"NB","q":"Trường hợp đơn vị thu phí là Văn phòng công chứng, mức thu phí theo Thông tư 257/2016/TT-BTC:","o":["Không chịu thuế","Được cộng thêm 10% thuế","Đã bao gồm thuế giá trị gia tăng","Chưa bao gồm thuế giá trị gia tăng"],"a":2,"e":"Khoản 1 Điều 4 TT 257: trường hợp đơn vị thu phí là Văn phòng công chứng thì mức thu phí đã bao gồm thuế giá trị gia tăng theo quy định của pháp luật về thuế.","b":"Khoản 1 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.08","g":9,"lv":"NB","q":"Phí chứng thực chữ ký là:","o":["5.000 đồng/trang","10.000 đồng/trường hợp (một hoặc nhiều chữ ký trong cùng một giấy tờ, văn bản)","20.000 đồng/trường hợp","10.000 đồng/chữ ký"],"a":1,"e":"Điều 4 TT 226 (biểu mức thu phí chứng thực): phí chứng thực chữ ký 10.000 đồng/trường hợp; “trường hợp” được hiểu là một hoặc nhiều chữ ký trong cùng một giấy tờ, văn bản. Mức này cũng áp dụng khi chứng thực tại tổ chức hành nghề công chứng theo TT 257.","b":"Điều 4 Thông tư 226/2016/TT-BTC"},{"id":"9.09","g":9,"lv":"TH","q":"Chi phí xác minh, giám định phục vụ việc công chứng do người yêu cầu đề nghị:","o":["Do người yêu cầu công chứng trả theo thỏa thuận","Được miễn","Do công chứng viên tự chịu","Do ngân sách nhà nước chi trả"],"a":0,"e":"Điểm a khoản 1 Điều 72 LCC: người yêu cầu công chứng phải trả chi phí trong trường hợp đề nghị xác minh, yêu cầu giám định phục vụ việc công chứng; mức chi phí do các bên thỏa thuận.","b":"Điểm a khoản 1 Điều 72 LCC"},{"id":"9.10","g":9,"lv":"NB","q":"Lệ phí cấp mới, cấp lại thẻ công chứng viên là:","o":["200.000 đồng/trường hợp","100.000 đồng/trường hợp","Miễn lệ phí","50.000 đồng/trường hợp"],"a":1,"e":"Điều 4 TT 257 quy định lệ phí cấp mới, cấp lại thẻ công chứng viên là 100.000 đồng/trường hợp.","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.11","g":9,"lv":"VD","q":"Hợp đồng mua bán xe ô tô có giá trị 800 triệu đồng. Phí công chứng là:","o":["400.000 đồng","300.000 đồng","800.000 đồng","1.600.000 đồng"],"a":2,"e":"Theo biểu mức thu theo giá trị tại khoản 2 Điều 4 TT 257, hợp đồng có giá trị từ trên 100 triệu đến 01 tỷ đồng chịu mức 0,1% giá trị. Phí = 0,1% × 800.000.000 = 800.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.12","g":9,"lv":"VD","q":"Hợp đồng chuyển nhượng quyền sử dụng đất ghi giá 2 tỷ đồng (cao hơn giá đất nhà nước quy định). Phí công chứng là:","o":["2.000.000 đồng","1.000.000 đồng","1.200.000 đồng","1.600.000 đồng"],"a":3,"e":"Biểu mức thu tại khoản 2 Điều 4 TT 257: từ trên 01 tỷ đến 03 tỷ đồng thu 01 triệu đồng cộng 0,06% phần giá trị vượt quá 01 tỷ. Phí = 1.000.000 + 0,06% × 1.000.000.000 = 1.600.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.13","g":9,"lv":"VD","q":"Hợp đồng chuyển nhượng quyền sử dụng đất ghi giá 300 triệu đồng; giá trị theo giá đất nhà nước quy định là 600 triệu đồng. Phí công chứng là:","o":["450.000 đồng","600.000 đồng (tính theo giá nhà nước)","900.000 đồng","300.000 đồng"],"a":1,"e":"Điểm d khoản 2 Điều 4 TT 257: nếu giá đất do các bên thỏa thuận thấp hơn giá do cơ quan nhà nước có thẩm quyền quy định thì giá trị tính phí được xác định theo giá nhà nước. Phí = 0,1% × 600.000.000 = 600.000 đồng.","b":"Điểm d khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.14","g":9,"lv":"VD","q":"Hợp đồng thuê nhà có tổng số tiền thuê 120 triệu đồng. Phí công chứng là:","o":["50.000 đồng","120.000 đồng","96.000 đồng (0,08% tổng tiền thuê)","240.000 đồng"],"a":2,"e":"Điều 4 TT 257 có biểu mức thu riêng cho hợp đồng thuê quyền sử dụng đất, thuê nhà ở, thuê tài sản (tính trên tổng số tiền thuê). Mức từ trên 100 triệu đến 01 tỷ đồng là 0,08%, nên phí = 0,08% × 120.000.000 = 96.000 đồng, không phải 120.000 đồng.","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.15","g":9,"lv":"VD","q":"Hợp đồng mua bán tài sản đấu giá có giá trị 6 tỷ đồng. Phí công chứng là:","o":["3.400.000 đồng","450.000 đồng","270.000 đồng","90.000 đồng"],"a":2,"e":"Điểm c khoản 2 Điều 4 TT 257 (sửa đổi bởi TT 111/2017): hợp đồng mua bán tài sản đấu giá có giá trị từ 5 tỷ đến dưới 20 tỷ đồng thu 270.000 đồng/trường hợp (dưới 5 tỷ: 90.000 đồng; trên 20 tỷ: 450.000 đồng).","b":"Điểm c khoản 2 Điều 4 Thông tư 257/2016/TT-BTC (sửa đổi bởi Thông tư 111/2017/TT-BTC)"},{"id":"9.16","g":9,"lv":"VD","q":"Hợp đồng tặng cho căn nhà có giá trị 12 tỷ đồng. Phí công chứng là:","o":["5.200.000 đồng","12.000.000 đồng","7.200.000 đồng","5.800.000 đồng"],"a":3,"e":"Khoản 2 Điều 4 TT 257: từ trên 10 tỷ đến 100 tỷ đồng thu 5,2 triệu đồng cộng 0,03% phần vượt quá 10 tỷ. Phí = 5.200.000 + 0,03% × 2.000.000.000 = 5.800.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.17","g":9,"lv":"VD","q":"Hợp đồng mua bán một tòa nhà có giá trị 300 tỷ đồng. Phí công chứng là:","o":["60.000.000 đồng","70.000.000 đồng (mức tối đa)","72.200.000 đồng","90.000.000 đồng"],"a":1,"e":"Khoản 2 Điều 4 TT 257: trên 100 tỷ đồng thu 32,2 triệu đồng cộng 0,02% phần vượt quá 100 tỷ, nhưng mức thu tối đa là 70 triệu đồng/trường hợp. Kết quả tính toán 72,2 triệu vượt trần, nên phí phải nộp là 70.000.000 đồng.","b":"Khoản 2 Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.18","g":9,"lv":"VD","q":"Ông A yêu cầu cấp 01 bản sao văn bản công chứng dài 04 trang. Phí cấp bản sao là:","o":["12.000 đồng","20.000 đồng","10.000 đồng","16.000 đồng"],"a":3,"e":"Điều 4 TT 257: phí cấp bản sao văn bản công chứng là 05 nghìn đồng/trang; từ trang thứ ba trở lên mỗi trang 03 nghìn đồng, tối đa 100 nghìn đồng/bản. Phí = 5.000 + 5.000 + 3.000 + 3.000 = 16.000 đồng.","b":"Điều 4 Thông tư 257/2016/TT-BTC"},{"id":"9.19","g":9,"lv":"VD","q":"Chị B yêu cầu Ủy ban nhân dân xã chứng thực 01 bản sao từ bản chính hộ chiếu có 10 trang chứa thông tin. Phí chứng thực là:","o":["20.000 đồng","2.000 đồng","12.000 đồng","10.000 đồng"],"a":2,"e":"Điều 4 TT 226: phí chứng thực bản sao từ bản chính là 2.000 đồng/trang; từ trang thứ ba trở lên 1.000 đồng/trang, tối đa 200.000 đồng/bản; trang làm căn cứ thu phí tính theo trang của bản chính. Phí = 2 × 2.000 + 8 × 1.000 = 12.000 đồng.","b":"Điều 4 Thông tư 226/2016/TT-BTC"},{"id":"9.20","g":9,"lv":"VD","q":"Giá tối đa dịch vụ soạn thảo hợp đồng do Ủy ban nhân dân tỉnh ban hành là 500.000 đồng. Văn phòng công chứng X muốn thu 600.000 đồng và khách hàng đồng ý. Việc thu:","o":["Được, vì khách hàng đồng ý","Được, nếu xuất hóa đơn","Được, nếu niêm yết công khai","Không được, vì không được vượt mức giá tối đa; sự đồng ý của khách hàng không làm việc thu vượt trở thành hợp pháp"],"a":3,"e":"Khoản 2 Điều 71 LCC: tổ chức hành nghề công chứng xác định mức giá dịch vụ “không vượt quá mức giá tối đa do Ủy ban nhân dân cấp tỉnh ban hành”; sự đồng ý của khách hàng không làm việc thu vượt trở thành hợp pháp. Hành vi thu giá dịch vụ cao hơn mức tối đa bị xử phạt theo NĐ 109/2026.","b":"Khoản 2 Điều 71 LCC; Nghị định 109/2026/NĐ-CP"}],"th":[{"name":"Công chứng viên","items":[{"title":"Anh Nguyễn Văn An, sinh năm 1990, có bằng cử nhân luật năm 2014.","text":"Anh Nguyễn Văn An, sinh năm 1990, có bằng cử nhân luật năm 2014. Từ tháng 9/2014 đến nay, anh An là chuyên viên pháp chế tại Sở Tư pháp tỉnh B. Tháng 6/2024, anh tốt nghiệp khóa đào tạo nghề công chứng; sau đó tập sự tại một Văn phòng công chứng và tháng 9/2026 được cấp giấy chứng nhận đạt yêu cầu kiểm tra kết quả tập sự. Anh An muốn nộp hồ sơ đề nghị bổ nhiệm công chứng viên ngay trong tháng 10/2026 nhưng vẫn muốn giữ vị trí công chức cho đến khi có quyết định bổ nhiệm.","ask":["Anh An đã đáp ứng đủ các tiêu chuẩn bổ nhiệm công chứng viên chưa?","Anh An có được bổ nhiệm trong khi vẫn là công chức không? Nếu không, anh cần làm gì?","Nếu đến tháng 10/2031 anh An vẫn chưa đề nghị bổ nhiệm thì giấy chứng nhận kết quả kiểm tra tập sự của anh còn giá trị không?"],"guide":["Đã đủ tiêu chuẩn tại Điều 10 LCC. Anh An là công dân Việt Nam 36 tuổi (k1); có bằng cử nhân luật (k3); có hơn 03 năm công tác pháp luật sau khi có bằng (k4); đã tốt nghiệp khóa đào tạo (k5) và đạt kiểm tra kết quả tập sự (k6). Tiêu chuẩn tại k2 (thường trú, phẩm chất, sức khỏe) giả định đáp ứng.","Không được bổ nhiệm khi đang là công chức. Khoản 5 Điều 14 LCC: người đang là cán bộ, công chức, viên chức (trừ viên chức Phòng công chứng) không được bổ nhiệm. Anh An phải thôi việc trước khi đề nghị bổ nhiệm; thẩm quyền bổ nhiệm hiện nay thuộc Chủ tịch Ủy ban nhân dân cấp tỉnh (Điều 14 NĐ 121).","Không còn giá trị. Khoản 5 Điều 12 LCC: giấy chứng nhận hết hiệu lực nếu trong 05 năm kể từ ngày được cấp (09/2026 – 09/2031) người được cấp không đề nghị bổ nhiệm. Anh An phải đăng ký và đạt lại kỳ kiểm tra kết quả tập sự."],"basis":""},{"title":"Ba người cùng đăng ký khóa đào tạo nghề công chứng năm 2026: (i) ông Bình, 58 tuổi, đã…","text":"Ba người cùng đăng ký khóa đào tạo nghề công chứng năm 2026: (i) ông Bình, 58 tuổi, đã làm thẩm phán 07 năm, hiện nghỉ hưu; (ii) chị Chi, thạc sĩ luật, giảng viên (chưa phải giảng viên chính) ngành luật tại một trường đại học được 08 năm; (iii) anh Dũng, tiến sĩ luật, làm nghiên cứu tại một viện được 02 năm. Chị Chi cho rằng vì chị có thâm niên giảng dạy dài hơn anh Dũng nên thời gian đào tạo của chị không thể dài hơn của anh Dũng.","ask":["Xác định thời gian đào tạo nghề công chứng của từng người.","Nhận định của chị Chi có đúng không?","Tuổi của ông Bình có ảnh hưởng đến khả năng được bổ nhiệm và thời gian hành nghề sau này không?"],"guide":["Thời gian đào tạo: ông Bình 06 tháng (đã làm thẩm phán từ đủ 05 năm, điểm a khoản 3 Điều 11 LCC); chị Chi 12 tháng (khoản 2 Điều 11); anh Dũng 06 tháng (tiến sĩ luật, điểm c khoản 3 Điều 11).","Nhận định của chị Chi sai. Điểm a khoản 3 Điều 11 chỉ rút ngắn đào tạo cho “giảng viên chính trong lĩnh vực pháp luật” có từ đủ 05 năm; thạc sĩ không thuộc điểm c. Tiêu chí luật dùng là chức danh, học vị và thời gian theo từng chức danh, không phải thâm niên chung.","Tuổi 58 không cản trở việc bổ nhiệm vì khoản 1 Điều 10 chỉ yêu cầu không quá 70 tuổi. Tuy nhiên, ông Bình sẽ đương nhiên miễn nhiệm khi quá 70 tuổi (khoản 1 Điều 16), nên thời gian hành nghề thực tế bị giới hạn (trừ thời gian đào tạo 06 tháng và tập sự 12 tháng)."],"basis":""},{"title":"Chị Lan có giấy chứng nhận tốt nghiệp khóa đào tạo nghề công chứng và được Văn phòng…","text":"Chị Lan có giấy chứng nhận tốt nghiệp khóa đào tạo nghề công chứng và được Văn phòng công chứng Mỹ Đình (Hà Nội) đồng ý nhận tập sự. Công chứng viên được phân công hướng dẫn là bà Hoa, đã hành nghề 05 năm và đang hướng dẫn 02 người tập sự khác. Quyết định đăng ký tập sự của chị Lan có hiệu lực ngày 01/3/2026. Tháng 8/2026, bà Hoa bị khởi tố bị can và bị tạm đình chỉ hành nghề; Văn phòng chỉ còn một công chứng viên mới hành nghề được 01 năm.","ask":["Việc phân công bà Hoa hướng dẫn chị Lan ngay từ đầu có đúng quy định không? Chị Lan phải đăng ký tập sự ở đâu?","Khi bà Hoa bị tạm đình chỉ, việc tập sự của chị Lan được giải quyết thế nào?","Sớm nhất chị Lan hoàn thành thời gian tập sự vào ngày nào (giả sử không tạm ngừng tập sự)?"],"guide":["Phân công chưa đúng. Bà Hoa đủ 02 năm kinh nghiệm nhưng đang hướng dẫn 02 người; theo khoản 3 Điều 12 LCC, tại cùng thời điểm một công chứng viên chỉ được hướng dẫn tối đa 02 người. Chị Lan đăng ký tập sự tại Sở Tư pháp Hà Nội, nơi có tổ chức nhận tập sự (khoản 1 Điều 12).","Khi bà Hoa bị tạm đình chỉ, tổ chức phải phân công công chứng viên khác đủ điều kiện. Công chứng viên còn lại mới có 01 năm kinh nghiệm nên không đủ điều kiện; Văn phòng phải báo cáo Sở Tư pháp để chỉ định tổ chức hành nghề công chứng khác nhận chị Lan (khoản 3 Điều 12).","Thời gian tập sự là 12 tháng tính từ ngày quyết định đăng ký tập sự có hiệu lực (01/3/2026), nên sớm nhất hoàn thành vào đầu tháng 3/2027. Sau đó chị Lan mới được đăng ký kiểm tra kết quả tập sự (khoản 5 Điều 12)."],"basis":""},{"title":"Bốn người đáp ứng tiêu chuẩn tại Điều 10 LCC và cùng nộp hồ sơ đề nghị bổ nhiệm tháng…","text":"Bốn người đáp ứng tiêu chuẩn tại Điều 10 LCC và cùng nộp hồ sơ đề nghị bổ nhiệm tháng 10/2026: (i) ông Đức từng bị kết án về tội vi phạm quy định về tham gia giao thông (lỗi vô ý), đã được xóa án tích năm 2020; (ii) bà Giáng từng bị kết án về tội lạm dụng tín nhiệm chiếm đoạt tài sản, đã được xóa án tích năm 2018; (iii) ông Hải nguyên là công chức, bị kỷ luật buộc thôi việc năm 2019; (iv) bà Kim là luật sư bị thu hồi chứng chỉ hành nghề luật sư do vi phạm pháp luật, quyết định thu hồi có hiệu lực ngày 01/12/2024.","ask":["Ai trong bốn người có thể được bổ nhiệm công chứng viên? Vì sao?","Với người chưa được bổ nhiệm, khi nào (nếu có) họ có thể được xem xét bổ nhiệm?"],"guide":["Chỉ ông Đức có thể được bổ nhiệm. Khoản 2 Điều 14 LCC chỉ cấm người phạm tội vô ý khi chưa được xóa án tích; ông Đức đã được xóa. Bà Giáng bị kết án về tội cố ý nên bị cấm “kể cả trường hợp đã được xóa án tích”. Ông Hải là công chức bị kỷ luật buộc thôi việc (khoản 7 Điều 14). Bà Kim thuộc khoản 8 Điều 14 vì chưa hết 03 năm kể từ ngày quyết định thu hồi chứng chỉ có hiệu lực.","Khả năng được xem xét sau này: bà Giáng và ông Hải không có mốc thời gian nào để hết cấm (khoản 2, khoản 7 Điều 14 không quy định thời hạn). Bà Kim có thể được xem xét từ sau ngày 01/12/2027 nếu vẫn đáp ứng Điều 10 và không thuộc trường hợp khác tại Điều 14."],"basis":""},{"title":"Công chứng viên Phúc làm việc theo chế độ hợp đồng lao động tại Văn phòng công chứng A…","text":"Công chứng viên Phúc làm việc theo chế độ hợp đồng lao động tại Văn phòng công chứng A (Hà Nội). Do nhu cầu thu nhập, Phúc thỏa thuận với Văn phòng công chứng B (cũng tại Hà Nội) để công chứng vào sáng thứ Bảy hằng tuần, sử dụng thẻ công chứng viên do Sở Tư pháp cấp khi Phúc vào Văn phòng A. Ngoài ra, Phúc nhận làm môi giới bán một căn hộ và chính mình công chứng hợp đồng mua bán căn hộ đó để nhận hoa hồng.","ask":["Xác định hình thức hành nghề của Phúc và các hình thức hành nghề khác mà pháp luật cho phép.","Các hành vi của Phúc vi phạm những quy định nào?","Văn phòng công chứng B có vi phạm không? Phúc có thể bị áp dụng hậu quả pháp lý nào về tư cách công chứng viên?"],"guide":["Hình thức hành nghề: Phúc là công chứng viên làm việc theo chế độ hợp đồng lao động (điểm c khoản 1 Điều 37 LCC). Các hình thức khác: viên chức Phòng công chứng; thành viên hợp danh Văn phòng công chứng hoặc Trưởng Văn phòng loại hình doanh nghiệp tư nhân (điểm a, b).","Vi phạm của Phúc: hành nghề đồng thời tại 02 tổ chức (điểm h khoản 1 Điều 9; điểm c khoản 2 Điều 18); làm môi giới và hưởng lợi từ giao dịch do mình công chứng (điểm i khoản 1 Điều 9); dùng thẻ công chứng viên được cấp gắn với Văn phòng A để hành nghề tại Văn phòng B (Điều 38).","Văn phòng B vi phạm điểm c khoản 2 Điều 9 (cho người không đủ điều kiện hành nghề tại tổ chức mình thực hiện công chứng). Phúc thuộc trường hợp bị miễn nhiệm theo điểm d (vi phạm điểm h khoản 1 Điều 9) và điểm g khoản 2 Điều 16 LCC; đồng thời bị xử phạt vi phạm hành chính theo NĐ 109/2026."],"basis":""},{"title":"Công chứng viên Quân hành nghề tại Phòng công chứng số 1 tỉnh N (viên chức) và là hội…","text":"Công chứng viên Quân hành nghề tại Phòng công chứng số 1 tỉnh N (viên chức) và là hội viên Hội công chứng viên tỉnh N. Tháng 5/2026, Quân nghỉ việc ở Phòng công chứng, cùng một công chứng viên khác thành lập Văn phòng công chứng tại tỉnh P và được cấp giấy đăng ký hoạt động ngày 15/9/2026. Quân vẫn dùng thẻ công chứng viên cũ và cho rằng không cần gia nhập Hội công chứng viên tỉnh P vì đã là hội viên Hội tỉnh N.","ask":["Hình thức hành nghề của Quân thay đổi như thế nào? Quân được hành nghề tại Văn phòng mới từ thời điểm nào?","Việc Quân tiếp tục dùng thẻ công chứng viên cũ có đúng không?","Quan điểm của Quân về tư cách hội viên có đúng không?"],"guide":["Hình thức hành nghề chuyển từ viên chức Phòng công chứng sang thành viên hợp danh (điểm a sang điểm b khoản 1 Điều 37). Việc Quân nghỉ việc trước là bắt buộc vì viên chức Phòng công chứng không được thành lập Văn phòng mới (điểm a khoản 2 Điều 24). Quân được hành nghề từ ngày 15/9/2026, ngày Văn phòng được cấp giấy đăng ký hoạt động (khoản 3 Điều 25).","Không được dùng thẻ cũ. Thẻ bị thu hồi khi công chứng viên không còn hành nghề tại tổ chức mà mình được cấp thẻ (khoản 4 Điều 38). Sở Tư pháp tỉnh P cấp thẻ mới khi cấp giấy đăng ký hoạt động cho Văn phòng (khoản 2 Điều 38).","Quan điểm sai. Điểm h khoản 2 Điều 18 LCC: công chứng viên phải gia nhập Hội công chứng viên tại địa phương nơi muốn hành nghề và duy trì tư cách hội viên trong suốt quá trình hành nghề tại địa phương đó. Quân phải gia nhập Hội tỉnh P."],"basis":""},{"title":"Ngày 02/3/2026, công chứng viên R (hành nghề tại Văn phòng công chứng S, tỉnh T) bị…","text":"Ngày 02/3/2026, công chứng viên R (hành nghề tại Văn phòng công chứng S, tỉnh T) bị khởi tố bị can về tội lừa đảo chiếm đoạt tài sản. Sở Tư pháp tỉnh T nhận được quyết định khởi tố ngày 05/3/2026 nhưng đến ngày 25/3/2026 mới ra quyết định tạm đình chỉ hành nghề. Trong thời gian chờ, R vẫn công chứng 15 hợp đồng. Ngày 10/8/2026, cơ quan điều tra ra quyết định đình chỉ điều tra đối với R.","ask":["Việc Sở Tư pháp ra quyết định tạm đình chỉ có đúng thẩm quyền và thời hạn không?","Sau khi có quyết định đình chỉ điều tra, R phải làm gì để được hành nghề trở lại? Sở Tư pháp phải giải quyết trong thời hạn nào?","Giả sử sau ngày 25/3/2026 R vẫn tiếp tục ký công chứng thì hậu quả pháp lý đối với R là gì?"],"guide":["Đúng thẩm quyền nhưng sai thời hạn. Đoạn 2 khoản 1 Điều 15 LCC: Sở Tư pháp nơi cấp thẻ ra quyết định trong 05 ngày làm việc kể từ ngày nhận được quyết định truy cứu trách nhiệm hình sự. Sở nhận ngày 05/3/2026 nhưng đến 25/3/2026 mới ra quyết định là chậm. 15 hợp đồng công chứng trước ngày 25/3 được thực hiện khi R chưa bị tạm đình chỉ, nên không đương nhiên vô hiệu chỉ vì lý do này.","Chấm dứt tạm đình chỉ trước thời hạn (điểm a khoản 3 Điều 15): R gửi văn bản đề nghị kèm quyết định đình chỉ điều tra; Sở Tư pháp ra quyết định trong 05 ngày làm việc kể từ ngày nhận đề nghị.","Hành nghề trong thời gian bị tạm đình chỉ là căn cứ bị miễn nhiệm (điểm g khoản 2 Điều 16) và R sẽ không bao giờ được bổ nhiệm lại (điểm b khoản 3 Điều 17). Văn phòng S cũng vi phạm điểm c khoản 2 Điều 9 và bị xử phạt theo NĐ 109/2026."],"basis":""},{"title":"Văn phòng công chứng U được tổ chức theo loại hình doanh nghiệp tư nhân, chỉ có một…","text":"Văn phòng công chứng U được tổ chức theo loại hình doanh nghiệp tư nhân, chỉ có một công chứng viên là ông V (Trưởng Văn phòng). Ngày 01/6/2026, ông V bị Tòa án quyết định áp dụng biện pháp đưa vào cơ sở cai nghiện bắt buộc và bị tạm đình chỉ hành nghề. Nhiều khách hàng cần sửa lỗi kỹ thuật và cấp bản sao các văn bản đã công chứng tại Văn phòng U.","ask":["Việc ông V bị tạm đình chỉ ảnh hưởng thế nào đến hoạt động của Văn phòng U?","Yêu cầu của khách hàng được giải quyết ở đâu?","Nếu đến hết ngày 01/6/2027 ông V vẫn đang trong cơ sở cai nghiện bắt buộc thì hậu quả đối với ông V và Văn phòng U là gì?"],"guide":["Văn phòng U phải tạm ngừng hoạt động. Ông V bị tạm đình chỉ theo điểm b khoản 1 Điều 15 (biện pháp xử lý hành chính tại khoản 3 Điều 14). Do toàn bộ công chứng viên của Văn phòng bị tạm đình chỉ, Văn phòng tạm ngừng hoạt động tối đa 12 tháng (điểm a khoản 1, điểm a khoản 2 Điều 32); Sở Tư pháp ra quyết định trong 15 ngày (khoản 3).","Yêu cầu sửa lỗi kỹ thuật, cấp bản sao được giải quyết tại tổ chức hành nghề công chứng được Sở Tư pháp chỉ định tiếp nhận hồ sơ; hết thời gian tạm ngừng, hồ sơ được bàn giao lại (khoản 4 Điều 32; điều 52, 69).","Hết 12 tháng mà lý do vẫn còn: ông V bị miễn nhiệm (điểm e khoản 2 Điều 16). Văn phòng U bị thu hồi quyết định cho phép thành lập do hết thời gian tạm ngừng mà lý do vẫn còn và do Trưởng Văn phòng doanh nghiệp tư nhân bị miễn nhiệm (điểm e, điểm k khoản 1 Điều 33), rồi chấm dứt hoạt động theo Điều 34."],"basis":""},{"title":"Công chứng viên Xâm là viên chức của Phòng công chứng số 2.","text":"Công chứng viên Xâm là viên chức của Phòng công chứng số 2. Tháng 4/2025, Xâm được cơ quan có thẩm quyền điều động sang làm Phó Giám đốc Sở Tư pháp và được miễn nhiệm công chứng viên vì lý do này. Tháng 8/2026, Xâm nghỉ hưu trước tuổi (64 tuổi) và muốn được bổ nhiệm lại để cùng con gái (cũng là công chứng viên) thành lập Văn phòng công chứng. Một đồng nghiệp cho rằng Xâm phải chờ đủ 02 năm kể từ ngày quyết định miễn nhiệm có hiệu lực và phải tham gia lại khóa đào tạo nghề công chứng.","ask":["Xâm được miễn nhiệm hay bị miễn nhiệm? Sự phân biệt này có ý nghĩa gì?","Ý kiến của đồng nghiệp có đúng không? Xâm cần đáp ứng những tiêu chuẩn nào để được bổ nhiệm lại?"],"guide":["Xâm “được miễn nhiệm” vì chuyển làm công việc khác theo quyết định của cơ quan có thẩm quyền (khoản 1 Điều 16 LCC), không phải “bị miễn nhiệm” theo khoản 2. Sự phân biệt quyết định điều kiện bổ nhiệm lại tại Điều 17.","Ý kiến của đồng nghiệp sai. Khoản 1 Điều 17: người được miễn nhiệm do chuyển công tác chỉ cần đáp ứng khoản 1 và khoản 2 Điều 10 (công dân không quá 70 tuổi; thường trú, phẩm chất, sức khỏe); không phải đào tạo, tập sự lại, không phải chờ 02 năm (thời hạn này chỉ áp dụng cho khoản 2 Điều 17). Xâm đã nghỉ hưu nên không còn thuộc khoản 5 Điều 14 (điểm c khoản 3 Điều 17)."],"basis":""},{"title":"Công chứng viên Yến bị xử phạt vi phạm hành chính trong hoạt động công chứng hai lần:…","text":"Công chứng viên Yến bị xử phạt vi phạm hành chính trong hoạt động công chứng hai lần: ngày 10/02/2025 (không chụp ảnh người yêu cầu ký văn bản) và ngày 05/12/2025 (thu phí sai quy định). Ngày 20/01/2026, Yến bị miễn nhiệm công chứng viên; quyết định có hiệu lực cùng ngày. Tháng 10/2026, Yến nộp hồ sơ đề nghị bổ nhiệm lại.","ask":["Việc miễn nhiệm Yến có căn cứ không?","Hồ sơ đề nghị bổ nhiệm lại tháng 10/2026 có được chấp nhận không? Sớm nhất khi nào Yến được xem xét bổ nhiệm lại và cần điều kiện gì?"],"guide":["Có căn cứ. Hai lần xử phạt (10/02/2025 và 05/12/2025) nằm trong vòng 12 tháng, thuộc điểm g khoản 2 Điều 16 LCC (bị xử phạt vi phạm hành chính từ 02 lần trở lên về hoạt động hành nghề công chứng trong thời hạn 12 tháng).","Hồ sơ tháng 10/2026 chưa được chấp nhận. Khoản 2 Điều 17: người bị miễn nhiệm chỉ được xem xét bổ nhiệm lại khi đã hết 02 năm kể từ ngày quyết định miễn nhiệm có hiệu lực (sớm nhất sau ngày 20/01/2028), đáp ứng đủ tiêu chuẩn tại Điều 10, lý do miễn nhiệm không còn và không thuộc khoản 3 Điều 17."],"basis":""},{"title":"Công chứng viên Z và công chứng viên Âu cùng được bổ nhiệm tháng 3/2025.","text":"Công chứng viên Z và công chứng viên Âu cùng được bổ nhiệm tháng 3/2025. Z hành nghề tại một Văn phòng công chứng ở vùng bị bão lũ tàn phá; Văn phòng bị Sở Tư pháp quyết định tạm ngừng hoạt động từ tháng 9/2025 đến tháng 11/2026 do sự kiện bất khả kháng. Âu sau khi được bổ nhiệm đã đi du học và chưa hành nghề tại tổ chức hành nghề công chứng nào đến tháng 10/2026.","ask":["Z có thuộc trường hợp bị miễn nhiệm do không hành nghề liên tục từ 12 tháng trở lên không?","Âu có thuộc trường hợp bị miễn nhiệm không? Nếu muốn tránh hậu quả bất lợi, Âu lẽ ra nên làm gì?"],"guide":["Z không bị miễn nhiệm. Điểm đ khoản 2 Điều 16 loại trừ trường hợp không hành nghề do Văn phòng bị tạm ngừng hoạt động theo điểm b khoản 1 Điều 32 (sự kiện bất khả kháng).","Âu thuộc trường hợp bị miễn nhiệm vì không hành nghề trong thời hạn 12 tháng kể từ ngày được bổ nhiệm (điểm đ khoản 2 Điều 16). Âu lẽ ra có thể đề nghị miễn nhiệm theo nguyện vọng (khoản 1 Điều 16) trước khi đi du học; khi đó việc bổ nhiệm lại theo khoản 1 Điều 17 không phải chờ 02 năm như người bị miễn nhiệm."],"basis":""},{"title":"Tại ngày 01/7/2025 (ngày LCC có hiệu lực), Văn phòng công chứng Đại Việt có ba công…","text":"Tại ngày 01/7/2025 (ngày LCC có hiệu lực), Văn phòng công chứng Đại Việt có ba công chứng viên đang hành nghề: ông Thành sinh ngày 15/3/1956; bà Thủy sinh ngày 01/01/1954; ông Tiến sinh ngày 20/10/1960. Trưởng Văn phòng muốn lập kế hoạch nhân sự vì cho rằng cả ba đều phải nghỉ khi tròn 70 tuổi.","ask":["Xác định thời điểm mỗi công chứng viên đương nhiên miễn nhiệm.","Nhận định của Trưởng Văn phòng có đúng không?"],"guide":["Thời điểm đương nhiên miễn nhiệm (khoản 5 Điều 76 và khoản 1 Điều 16 LCC):\n   - Ông Thành: đủ 69 tuổi tại ngày 01/7/2025, thuộc nhóm từ đủ 68 đến đủ 70 tuổi, được hành nghề đến khi đủ 72 tuổi (15/3/2028).\n   - Bà Thủy: đã quá 70 tuổi tại ngày 01/7/2025, được tiếp tục hành nghề 02 năm kể từ ngày LCC có hiệu lực (đến 01/7/2027).\n   - Ông Tiến: 64 tuổi tại ngày 01/7/2025, áp dụng quy tắc chung, đương nhiên miễn nhiệm khi quá 70 tuổi (sau ngày 20/10/2030).","Nhận định của Trưởng Văn phòng chỉ đúng với ông Tiến; ông Thành và bà Thủy được áp dụng quy định chuyển tiếp."],"basis":""},{"title":"Năm 2024, công chứng viên Bảo gây tai nạn giao thông và bị Tòa án kết án về tội vi phạm…","text":"Năm 2024, công chứng viên Bảo gây tai nạn giao thông và bị Tòa án kết án về tội vi phạm quy định về tham gia giao thông đường bộ (lỗi vô ý), án treo; bản án có hiệu lực tháng 3/2025. Bảo vẫn tiếp tục hành nghề vì cho rằng án treo không ảnh hưởng đến tư cách công chứng viên. Cùng thời gian, công chứng viên Châu bị kết án về tội giả mạo trong công tác (lỗi cố ý).","ask":["Bảo và Châu có bị miễn nhiệm không? Quan điểm của Bảo có đúng không?","Sau khi bị miễn nhiệm, ai trong hai người có thể được xem xét bổ nhiệm lại, với những điều kiện gì?"],"guide":["Cả hai đều bị miễn nhiệm. Điểm i khoản 2 Điều 16 LCC: công chứng viên bị miễn nhiệm khi “bị kết tội bằng bản án đã có hiệu lực pháp luật”, không phân biệt loại hình phạt. Án treo vẫn là bị kết tội, nên quan điểm của Bảo sai.","Châu không được bổ nhiệm lại trong mọi trường hợp (tội cố ý, điểm a khoản 3 Điều 17). Bảo không được bổ nhiệm lại khi chưa được xóa án tích; sau khi được xóa án tích có thể được xem xét theo khoản 2 Điều 17 (hết 02 năm kể từ ngày quyết định miễn nhiệm có hiệu lực, đủ tiêu chuẩn Điều 10, không thuộc Điều 14)."],"basis":""},{"title":"Ba công chứng viên Đạt, Hùng và Khánh cùng thành lập Văn phòng công chứng theo loại…","text":"Ba công chứng viên Đạt, Hùng và Khánh cùng thành lập Văn phòng công chứng theo loại hình công ty hợp danh. Văn phòng có quyết định cho phép thành lập ngày 01/8/2026 và được Sở Tư pháp cấp giấy đăng ký hoạt động ngày 20/9/2026. Tuy nhiên, từ ngày 01/9/2026, Đạt đã ký công chứng 05 hợp đồng mua bán xe tại trụ sở dự kiến của Văn phòng và đóng dấu tự khắc.","ask":["Việc Đạt công chứng từ ngày 01/9/2026 có hợp pháp không?","Hậu quả pháp lý đối với tư cách công chứng viên của Đạt là gì? Đạt có thể được bổ nhiệm lại không?","05 hợp đồng nói trên có thể bị xử lý như thế nào?"],"guide":["Không hợp pháp. Công chứng viên của Văn phòng chỉ được hành nghề kể từ ngày Văn phòng được cấp giấy đăng ký hoạt động, tức 20/9/2026 (khoản 3 Điều 25 LCC). Con dấu chỉ được khắc và sử dụng sau khi được cấp giấy đăng ký hoạt động (khoản 6 Điều 23).","Đạt đã hành nghề khi chưa đủ điều kiện, là căn cứ bị miễn nhiệm (điểm g khoản 2 Điều 16). Đạt thuộc trường hợp không được bổ nhiệm lại (điểm b khoản 3 Điều 17) và còn bị xử phạt theo NĐ 109/2026.","05 hợp đồng được “công chứng” khi chưa có tổ chức hành nghề công chứng hoạt động hợp pháp; người có quyền, lợi ích liên quan và cơ quan nhà nước có thẩm quyền có thể đề nghị Tòa án tuyên bố văn bản công chứng vô hiệu (Điều 54). Các bên nên công chứng lại (nếu muốn) tại tổ chức hành nghề công chứng hợp pháp; thiệt hại (nếu có) được yêu cầu bồi thường theo pháp luật dân sự."],"basis":""},{"title":"Công chứng viên Gia hành nghề tại Văn phòng công chứng L.","text":"Công chứng viên Gia hành nghề tại Văn phòng công chứng L. Gia công chứng hợp đồng mua bán nhà mà bên bán là anh ruột của vợ Gia. Khi công chứng, Gia không kiểm tra kỹ nên không phát hiện căn nhà là tài sản chung của vợ chồng bên bán nhưng chỉ một mình người chồng ký. Vợ của bên bán khởi kiện; bên mua bị thiệt hại 300 triệu đồng.","ask":["Gia vi phạm những quy định nào?","Ai có quyền đề nghị Tòa án tuyên bố văn bản công chứng vô hiệu?","Trách nhiệm bồi thường thiệt hại cho bên mua được xác định như thế nào?"],"guide":["Vi phạm: công chứng giao dịch liên quan đến tài sản của anh ruột của vợ (điểm c khoản 1 Điều 9 LCC). Không kiểm tra quyền định đoạt tài sản chung của vợ chồng bên bán (khoản 2 Điều 35 LHNĐ yêu cầu thỏa thuận bằng văn bản của vợ chồng khi định đoạt bất động sản chung); vi phạm nghĩa vụ kiểm tra hồ sơ, dự thảo tại khoản 2, 4, 5 Điều 42 và nguyên tắc tại Điều 5 LCC.","Người có quyền đề nghị tuyên vô hiệu (Điều 54 LCC): công chứng viên Gia, các bên yêu cầu công chứng, người làm chứng, người phiên dịch (nếu có), người có quyền lợi, nghĩa vụ liên quan (vợ của bên bán) và cơ quan nhà nước có thẩm quyền.","Bồi thường: Văn phòng công chứng L bồi thường cho bên mua thiệt hại do lỗi của công chứng viên (khoản 1 Điều 40), có thể được chi trả qua bảo hiểm trách nhiệm nghề nghiệp (Điều 39). Gia phải hoàn trả cho Văn phòng khoản đã bồi thường (khoản 2 Điều 40). Mức trách nhiệm cụ thể do Tòa án xác định theo lỗi của từng bên (kể cả lỗi của bên bán). Gia còn có thể bị xử phạt theo NĐ 109/2026."],"basis":""}]},{"name":"Thành lập và hoạt động của tổ chức hành nghề công chứng","items":[{"title":"Công chứng viên Minh (đã hành nghề 06 năm) muốn thành lập Văn phòng công chứng theo…","text":"Công chứng viên Minh (đã hành nghề 06 năm) muốn thành lập Văn phòng công chứng theo loại hình công ty hợp danh. Do chưa tìm được công chứng viên khác, Minh đề nghị chồng mình là doanh nhân tham gia với tư cách thành viên góp vốn 60% vốn điều lệ; Minh là thành viên hợp danh duy nhất và là Trưởng Văn phòng.","ask":["Phương án của Minh có phù hợp với quy định về Văn phòng công chứng loại hình công ty hợp danh không?","Nếu Văn phòng vẫn được thành lập theo phương án này (do hiểu sai của cơ quan tiếp nhận) thì hậu quả pháp lý là gì?"],"guide":["Không phù hợp. Khoản 2 Điều 23 LCC: Văn phòng hợp danh phải có từ 02 thành viên hợp danh trở lên và không có thành viên góp vốn; các thành viên hợp danh phải là công chứng viên. Chồng Minh không phải công chứng viên nên không thể tham gia dưới bất kỳ tư cách nào.","Văn phòng bị thu hồi quyết định cho phép thành lập vì do cá nhân không phải công chứng viên tham gia thành lập (điểm i khoản 1 Điều 33), đồng thời chỉ có 01 thành viên hợp danh (điểm đ khoản 1 Điều 33)."],"basis":""},{"title":"Ba công chứng viên dự định cùng thành lập Văn phòng công chứng hợp danh: Ngọc (đã hành…","text":"Ba công chứng viên dự định cùng thành lập Văn phòng công chứng hợp danh: Ngọc (đã hành nghề 05 năm), Phương (đã hành nghề 18 tháng) và Quang (đã hành nghề 03 năm, hiện là thành viên hợp danh của Văn phòng công chứng Sao Mai). Các bên thống nhất cử Phương làm Trưởng Văn phòng vì Phương góp vốn nhiều nhất.","ask":["Ai trong ba người được tham gia thành lập Văn phòng mới?","Việc cử Phương làm Trưởng Văn phòng có hợp pháp không? Ai có thể làm Trưởng Văn phòng?","Trưởng Văn phòng có vai trò pháp lý gì và có được thuê giám đốc điều hành không?"],"guide":["Ngọc và Phương được tham gia; Quang không được vì đang là thành viên hợp danh của 01 Văn phòng công chứng khác (điểm b khoản 2 Điều 24 LCC), trừ khi chấm dứt tư cách thành viên ở Văn phòng Sao Mai và đáp ứng thời hạn luật định.","Không hợp pháp. Trưởng Văn phòng phải là thành viên hợp danh và đã hành nghề công chứng từ đủ 02 năm (khoản 2 Điều 23); Phương mới hành nghề 18 tháng. Mức vốn góp không phải tiêu chí; Ngọc là người đủ điều kiện. Hồ sơ phải có giấy tờ chứng minh đã hành nghề từ đủ 02 năm của người dự kiến làm Trưởng Văn phòng (điểm c khoản 1 Điều 19 NĐ 104).","Trưởng Văn phòng là người đại diện theo pháp luật, quản lý và điều hành Văn phòng; không được thuê người khác điều hành (khoản 3 Điều 23)."],"basis":""},{"title":"Bà Rương là công chứng viên, viên chức của Phòng công chứng số 1 tỉnh X.","text":"Bà Rương là công chứng viên, viên chức của Phòng công chứng số 1 tỉnh X. Ông Sơn là Trưởng Văn phòng công chứng Sơn Hà (loại hình doanh nghiệp tư nhân) đang hoạt động. Hai người cùng nộp hồ sơ đề nghị thành lập Văn phòng công chứng hợp danh mới; bà Rương dự định chỉ nghỉ việc ở Phòng công chứng sau khi Văn phòng mới được cấp giấy đăng ký hoạt động.","ask":["Bà Rương và ông Sơn có được tham gia thành lập Văn phòng mới không?","Họ cần thực hiện những gì trước để việc thành lập đúng quy định?"],"guide":["Cả hai đều chưa được tham gia. Bà Rương đang là viên chức Phòng công chứng (điểm a khoản 2 Điều 24); ông Sơn đang là Trưởng Văn phòng doanh nghiệp tư nhân (điểm c khoản 2 Điều 24). Dự định “nghỉ việc sau khi cấp giấy” là sai vì điều kiện xét tại thời điểm thành lập.","Việc cần làm trước: bà Rương phải chấm dứt quan hệ viên chức với Phòng công chứng. Ông Sơn phải chấm dứt tư cách Trưởng Văn phòng Sơn Hà theo thủ tục luật định (ví dụ bán Văn phòng theo Điều 31 hoặc chấm dứt hoạt động theo Điều 34) và tuân thủ thời hạn hạn chế 02 năm tương ứng (ví dụ khoản 5 Điều 31)."],"basis":""},{"title":"Ba nhóm công chứng viên dự kiến đặt tên cho Văn phòng công chứng của mình lần lượt là:…","text":"Ba nhóm công chứng viên dự kiến đặt tên cho Văn phòng công chứng của mình lần lượt là: (i) “Văn phòng công chứng Sở Tư pháp Bắc Ninh”; (ii) “Văn phòng công chứng Hà Thành”, trùng với tên một Văn phòng đang hoạt động tại tỉnh khác; (iii) “Notary Office Golden Star”.","ask":["Các tên gọi trên có hợp lệ không?","Đề xuất cách đặt tên đúng quy định cho từng nhóm."],"guide":["Cả ba tên đều không hợp lệ (khoản 4 Điều 23 LCC): (i) dùng tên cơ quan nhà nước làm tên riêng (điểm a); (ii) trùng tên tổ chức hành nghề công chứng khác đang hoạt động trên phạm vi toàn quốc, dù ở tỉnh khác (điểm b); (iii) tên phải gồm cụm từ “Văn phòng công chứng” và tên riêng bằng tiếng Việt.","Gợi ý: “Văn phòng công chứng Kinh Bắc”, “Văn phòng công chứng Hà Thành Việt” (nếu không gây nhầm lẫn), “Văn phòng công chứng Sao Vàng”. Tên riêng do các thành viên hợp danh thỏa thuận hoặc Trưởng Văn phòng doanh nghiệp tư nhân lựa chọn, không vi phạm thuần phong mỹ tục (điểm c)."],"basis":""},{"title":"Hai công chứng viên Tâm và Uyên (đều đã hành nghề trên 03 năm) nộp hồ sơ đề nghị thành…","text":"Hai công chứng viên Tâm và Uyên (đều đã hành nghề trên 03 năm) nộp hồ sơ đề nghị thành lập Văn phòng công chứng hợp danh tại Sở Tư pháp nơi các bên cư trú (tỉnh Y), trong khi trụ sở dự kiến ở tỉnh Z. Hồ sơ gồm: đơn đề nghị; đề án thành lập (chưa nêu giá trị, tỷ lệ và thời hạn góp vốn); quyết định bổ nhiệm của hai công chứng viên.","ask":["Hai công chứng viên nộp hồ sơ đúng nơi chưa?","Hồ sơ còn thiếu những gì?","Cơ quan nào quyết định cho phép thành lập và trong thời hạn bao lâu?"],"guide":["Nộp sai nơi. Hồ sơ nộp tại Sở Tư pháp nơi Văn phòng dự kiến đặt trụ sở, tức tỉnh Z (khoản 1 Điều 24 LCC; khoản 2 Điều 19 NĐ 104), không phải nơi cư trú.","Hồ sơ còn thiếu (khoản 1 Điều 19 NĐ 104): đề án phải nêu giá trị, tỷ lệ góp vốn và thời hạn góp vốn trước ngày nộp hồ sơ đăng ký hoạt động; dự thảo Điều lệ Văn phòng; giấy tờ chứng minh người dự kiến làm Trưởng Văn phòng đã hành nghề từ đủ 02 năm.","Thẩm quyền và thời hạn: trong 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ, Sở Tư pháp có văn bản trình Ủy ban nhân dân cấp tỉnh; trong 10 ngày làm việc tiếp theo, Ủy ban nhân dân cấp tỉnh quyết định cho phép thành lập hoặc từ chối bằng văn bản nêu rõ lý do. Nếu phải bổ sung, làm rõ thông tin thì thời hạn tính từ ngày nhận kết quả bổ sung (khoản 3 Điều 19 NĐ 104)."],"basis":""},{"title":"Văn phòng công chứng An Phú có quyết định cho phép thành lập có hiệu lực ngày 01/3/2026.","text":"Văn phòng công chứng An Phú có quyết định cho phép thành lập có hiệu lực ngày 01/3/2026. Do chưa hoàn thiện việc thuê trụ sở, đến ngày 15/6/2026 Văn phòng mới nộp hồ sơ đăng ký hoạt động tại Sở Tư pháp.","ask":["Văn phòng có đăng ký hoạt động đúng thời hạn không?","Hậu quả pháp lý đối với Văn phòng là gì? Cơ quan nào xử lý?"],"guide":["Không đúng thời hạn. Khoản 1 Điều 25 LCC: trong 90 ngày kể từ ngày quyết định cho phép thành lập có hiệu lực, Văn phòng phải đăng ký hoạt động. Tính từ 01/3/2026, thời hạn kết thúc khoảng cuối tháng 5/2026; ngày 15/6/2026 đã quá hạn. Việc chưa thuê được trụ sở không phải lý do loại trừ.","Hậu quả: Văn phòng bị thu hồi quyết định cho phép thành lập (điểm a khoản 1 Điều 33). Sở Tư pháp kiểm tra, lập hồ sơ đề nghị; Ủy ban nhân dân cấp tỉnh ra quyết định thu hồi (khoản 3 Điều 33)."],"basis":""},{"title":"Văn phòng công chứng Bình Minh (hợp danh) được phép thành lập với trụ sở dự kiến tại số…","text":"Văn phòng công chứng Bình Minh (hợp danh) được phép thành lập với trụ sở dự kiến tại số 10 phố A. Khi nộp hồ sơ đăng ký hoạt động, Văn phòng kèm hợp đồng thuê trụ sở tại số 25 phố B (địa điểm khác với đề án). Một thành viên hợp danh chưa góp đủ vốn như cam kết; hồ sơ chưa có ảnh của các công chứng viên.","ask":["Hồ sơ đăng ký hoạt động của Văn phòng có những vấn đề gì?","Việc đăng ký trụ sở khác với đề án dẫn đến hậu quả gì?","Nếu hồ sơ hợp lệ, Sở Tư pháp giải quyết trong thời hạn bao lâu và cấp những giấy tờ gì?"],"guide":["Vấn đề của hồ sơ (khoản 1 Điều 20 NĐ 104): giấy tờ về trụ sở phải phù hợp với nội dung đã nêu trong đề án; phải có giấy tờ chứng minh các công chứng viên hợp danh đã góp vốn theo Luật Doanh nghiệp; phải có 02 ảnh 2cm x 3cm của mỗi công chứng viên.","Đăng ký trụ sở khác đề án là nội dung đăng ký hoạt động không đúng hồ sơ đề nghị thành lập đã được Ủy ban nhân dân cấp tỉnh phê duyệt, căn cứ thu hồi quyết định cho phép thành lập (điểm a khoản 1 Điều 33 LCC).","Nếu hồ sơ hợp lệ, trong 05 ngày làm việc Sở Tư pháp cấp giấy đăng ký hoạt động cho Văn phòng và cấp thẻ cho các công chứng viên (khoản 3 Điều 20 NĐ 104; khoản 2 Điều 38 LCC). Văn phòng được hoạt động từ ngày được cấp giấy (khoản 3 Điều 25 LCC)."],"basis":""},{"title":"Văn phòng công chứng Cổng Xanh được cấp giấy đăng ký hoạt động ngày 01/02/2026 nhưng…","text":"Văn phòng công chứng Cổng Xanh được cấp giấy đăng ký hoạt động ngày 01/02/2026 nhưng đến tháng 9/2026 vẫn chưa bắt đầu hoạt động vì các thành viên bận việc riêng. Văn phòng công chứng Đồng Tiến (đang hoạt động) thì tự ý đóng cửa từ tháng 4 đến tháng 8/2026 mà không thuộc trường hợp tạm ngừng hoạt động theo luật định.","ask":["Hai Văn phòng trên có thuộc trường hợp bị thu hồi quyết định cho phép thành lập không?","Thủ tục thu hồi được thực hiện thế nào?"],"guide":["Cả hai đều thuộc trường hợp bị thu hồi. Văn phòng Cổng Xanh: hết 06 tháng kể từ ngày được cấp giấy đăng ký hoạt động (sau ngày 01/8/2026) mà chưa bắt đầu hoạt động (điểm c khoản 1 Điều 33). Văn phòng Đồng Tiến: không hoạt động liên tục từ 03 tháng trở lên, không thuộc trường hợp tạm ngừng theo Điều 32 (điểm d khoản 1 Điều 33).","Thủ tục: Sở Tư pháp kiểm tra, rà soát, lập hồ sơ đề nghị; Ủy ban nhân dân cấp tỉnh ra quyết định thu hồi (khoản 3 Điều 33). Sau khi bị thu hồi, Văn phòng chấm dứt hoạt động theo Điều 34."],"basis":""},{"title":"Văn phòng công chứng Hồng Phúc (hợp danh) có hai thành viên hợp danh là Vinh và Xuân.","text":"Văn phòng công chứng Hồng Phúc (hợp danh) có hai thành viên hợp danh là Vinh và Xuân. Trường hợp A: ngày 10/5/2026 Vinh qua đời. Trường hợp B: Vinh tự nguyện rút khỏi Văn phòng để chuyển sang làm công chứng viên theo hợp đồng lao động ở nơi khác, Văn phòng chỉ còn Xuân.","ask":["Trong trường hợp A, Văn phòng phải làm gì và trong thời hạn nào để tiếp tục hoạt động?","Trường hợp B có được áp dụng cách giải quyết như trường hợp A không? Vì sao?"],"guide":["Trường hợp A: Văn phòng phải bổ sung ít nhất 01 thành viên hợp danh mới trong 06 tháng kể từ ngày chỉ còn 01 thành viên (từ 10/5/2026, tức đến khoảng 10/11/2026). Hết thời hạn mà chưa bổ sung thì bị thu hồi quyết định cho phép thành lập (khoản 2 Điều 33). Thủ tục tiếp nhận thành viên mới theo Điều 28.","Không được áp dụng. Khoản 2 Điều 33 chỉ cho thời hạn 06 tháng khi thành viên còn lại chết, bị tuyên bố đã chết, bị khai trừ, bị miễn nhiệm hoặc bị cấm hành nghề. Tự nguyện rút lui không thuộc các trường hợp này, nên Văn phòng thuộc điểm đ khoản 1 Điều 33. Các thành viên lẽ ra phải tiếp nhận thành viên mới trước khi Vinh chấm dứt tư cách thành viên."],"basis":""},{"title":"Ông Yên là Trưởng Văn phòng công chứng Yên Phú (doanh nghiệp tư nhân).","text":"Ông Yên là Trưởng Văn phòng công chứng Yên Phú (doanh nghiệp tư nhân). Do bận điều hành công ty bất động sản của gia đình, ông ký hợp đồng cho một công chứng viên khác thuê lại toàn bộ Văn phòng với giá 50 triệu đồng/tháng; người thuê tự điều hành và hưởng toàn bộ thu nhập.","ask":["Thỏa thuận trên có hợp pháp không?","Nếu ông Yên muốn rút khỏi hoạt động công chứng nhưng vẫn thu hồi vốn đầu tư, pháp luật cho phép giải pháp nào?"],"guide":["Không hợp pháp. Khoản 3 Điều 23 LCC cấm Trưởng Văn phòng thuê người khác điều hành và cho thuê Văn phòng công chứng. Hành vi này bị xử phạt theo NĐ 109/2026 và có thể dẫn đến thu hồi quyết định cho phép thành lập nếu không bảo đảm điều kiện hoạt động (điểm g khoản 1 Điều 33).","Giải pháp hợp pháp: bán Văn phòng cho 01 công chứng viên khác đủ điều kiện, khi Văn phòng đã hoạt động ít nhất 02 năm, và phải được Ủy ban nhân dân cấp tỉnh cho phép (Điều 31 LCC; Điều 26 NĐ 104); hoặc chấm dứt hoạt động Văn phòng theo Điều 34."],"basis":""},{"title":"Ngày 05/8/2026, Văn phòng công chứng Hoàng Long có quyết định cho phép thành lập.","text":"Ngày 05/8/2026, Văn phòng công chứng Hoàng Long có quyết định cho phép thành lập. Để chuẩn bị khai trương, ngày 10/8/2026 Trưởng Văn phòng đặt khắc con dấu có hình quốc huy “cho trang trọng” và mở tài khoản ngân hàng mang tên Văn phòng. Ngày 25/8/2026 Văn phòng mới được cấp giấy đăng ký hoạt động.","ask":["Việc khắc con dấu có đúng quy định về thời điểm và hình thức không?","Văn phòng công chứng hoạt động theo cơ chế tài chính nào?"],"guide":["Sai cả thời điểm và hình thức. Khoản 6 Điều 23 LCC: con dấu của Văn phòng không có hình quốc huy, và Văn phòng chỉ được khắc, sử dụng con dấu sau khi được cấp giấy đăng ký hoạt động (sau ngày 25/8/2026).","Cơ chế tài chính: Văn phòng có con dấu, tài khoản riêng, hoạt động theo nguyên tắc tự chủ tài chính bằng nguồn thu từ phí công chứng, giá dịch vụ theo yêu cầu liên quan đến công chứng và nguồn thu hợp pháp khác (khoản 5 Điều 23)."],"basis":""},{"title":"Bà Zét là Trưởng Văn phòng công chứng Thiên Ân (doanh nghiệp tư nhân), Văn phòng được…","text":"Bà Zét là Trưởng Văn phòng công chứng Thiên Ân (doanh nghiệp tư nhân), Văn phòng được cấp giấy đăng ký hoạt động ngày 01/6/2025. Tháng 10/2026, bà muốn bán Văn phòng cho công chứng viên Ánh (đã hành nghề 04 năm; chỉ mới thôi làm Trưởng một Văn phòng doanh nghiệp tư nhân khác từ tháng 01/2026). Văn phòng Thiên Ân còn nợ tiền thuê trụ sở 6 tháng. Bà Zét dự định sau khi bán sẽ lập ngay một Văn phòng hợp danh mới.","ask":["Bà Zét đã được bán Văn phòng chưa? Ánh có đủ điều kiện mua không?","Ai chịu trách nhiệm về khoản nợ tiền thuê trụ sở sau khi bán?","Dự định của bà Zét sau khi bán có thực hiện được không? Cơ quan nào cho phép việc bán Văn phòng?"],"guide":["Chưa được bán và Ánh cũng chưa đủ điều kiện mua. Văn phòng hoạt động từ 01/6/2025, đến tháng 10/2026 mới khoảng 16 tháng, chưa đủ 02 năm theo khoản 1 Điều 31 LCC; bà Zét sớm nhất chỉ được bán sau ngày 01/6/2027. Ánh đủ 02 năm hành nghề nhưng mới thôi làm Trưởng Văn phòng doanh nghiệp tư nhân khác từ 01/2026, chưa hết 02 năm (điểm b khoản 2 Điều 31); ngoài ra Ánh phải cam kết hành nghề với tư cách Trưởng Văn phòng (điểm c).","Khoản nợ phát sinh trước ngày chuyển giao do bà Zét tiếp tục chịu trách nhiệm, trừ khi bà Zét, người mua và chủ nợ có thỏa thuận khác (khoản 4 Điều 31).","Không thực hiện được ngay. Phải hết 02 năm kể từ ngày bán Văn phòng, bà Zét mới được thành lập, tham gia thành lập Văn phòng mới (khoản 5 Điều 31). Việc bán do Ủy ban nhân dân cấp tỉnh cho phép (khoản 3 Điều 31): Sở Tư pháp trình trong 05 ngày làm việc, Ủy ban nhân dân cấp tỉnh quyết định trong 10 ngày làm việc (Điều 26 NĐ 104)."],"basis":""},{"title":"Ông Bốn, giám đốc một công ty đầu tư (không phải công chứng viên), thỏa thuận mua lại…","text":"Ông Bốn, giám đốc một công ty đầu tư (không phải công chứng viên), thỏa thuận mua lại toàn bộ phần vốn góp của hai thành viên hợp danh Văn phòng công chứng Phương Nam, rồi thuê hai công chứng viên theo hợp đồng lao động để tiếp tục hoạt động; hồ sơ đăng ký thay đổi vẫn để tên một công chứng viên làm “người đứng tên”.","ask":["Giao dịch trên vi phạm quy định nào của pháp luật công chứng?","Hậu quả pháp lý đối với Văn phòng Phương Nam là gì?"],"guide":["Vi phạm: cá nhân không phải công chứng viên không được nhận chuyển nhượng toàn bộ phần vốn góp của toàn bộ thành viên hợp danh (Điều 30; khoản 2 Điều 23 LCC). Việc “đứng tên hộ” là kê khai gian dối trong hồ sơ.","Hậu quả: Văn phòng bị thu hồi quyết định cho phép thành lập (điểm i khoản 1 Điều 33; nếu kê khai giả mạo thì còn thuộc điểm b). Các bên liên quan còn bị xử phạt theo NĐ 109/2026."],"basis":""},{"title":"Tỉnh M còn một Phòng công chứng (đơn vị sự nghiệp công lập thuộc Sở Tư pháp).","text":"Tỉnh M còn một Phòng công chứng (đơn vị sự nghiệp công lập thuộc Sở Tư pháp). Trên địa bàn đã có nhiều Văn phòng công chứng đáp ứng tốt nhu cầu công chứng. Giám đốc Sở Tư pháp dự định tự ra quyết định giải thể Phòng công chứng ngay trong tháng, dù Phòng còn một số yêu cầu công chứng đã tiếp nhận chưa giải quyết và còn nợ nhà cung cấp.","ask":["Trong điều kiện trên, hướng xử lý ưu tiên đối với Phòng công chứng là gì?","Dự định của Giám đốc Sở Tư pháp đúng hay sai về thẩm quyền và điều kiện giải thể?","Sau khi có quyết định chuyển đổi hoặc giải thể, Sở Tư pháp có trách nhiệm công khai thông tin như thế nào?"],"guide":["Hướng xử lý ưu tiên là chuyển đổi. Khi địa phương đã phát triển được Văn phòng công chứng đáp ứng yêu cầu, Sở Tư pháp lập đề án chuyển đổi Phòng công chứng thành Văn phòng công chứng (khoản 1 Điều 22 LCC; Điều 9 NĐ 104). Chỉ khi không có khả năng chuyển đổi mới lập đề án giải thể (khoản 2 Điều 22).","Dự định sai. Giám đốc Sở chỉ lập đề án; thẩm quyền quyết định thuộc Ủy ban nhân dân cấp tỉnh. Phòng công chứng chỉ được giải thể sau khi thanh toán xong nợ, chấm dứt xong hợp đồng lao động và thực hiện xong các yêu cầu công chứng đã tiếp nhận (khoản 2 Điều 22).","Công khai thông tin: trong 05 ngày làm việc kể từ ngày có quyết định, Sở Tư pháp đăng báo trung ương hoặc địa phương trong 03 số liên tiếp (Điều 16 NĐ 104)."],"basis":""},{"title":"Văn phòng công chứng Thành Đô (hợp danh, 03 thành viên) được cấp giấy đăng ký hoạt động…","text":"Văn phòng công chứng Thành Đô (hợp danh, 03 thành viên) được cấp giấy đăng ký hoạt động tháng 3/2026 với trụ sở 200 m² tại trung tâm thành phố như đề án. Tháng 9/2026, để tiết kiệm chi phí, Văn phòng chuyển sang thuê một căn hộ nhỏ không đáp ứng điều kiện trụ sở; đồng thời hai thành viên hợp danh chuyển sang làm việc theo hợp đồng lao động tại nơi khác.","ask":["Văn phòng Thành Đô vi phạm nghĩa vụ nào?","Văn phòng có thể bị thu hồi quyết định cho phép thành lập theo những căn cứ nào?"],"guide":["Vi phạm nghĩa vụ duy trì điều kiện: Văn phòng phải có trụ sở đáp ứng điều kiện do Chính phủ quy định (khoản 5 Điều 23 LCC; Điều 18 NĐ 104). Khi hai thành viên chuyển đi, Văn phòng chỉ còn 01 thành viên hợp danh, vi phạm khoản 2 Điều 23.","Căn cứ thu hồi: không duy trì được điều kiện về công chứng viên và trụ sở theo hồ sơ đã được phê duyệt trong ít nhất 01 năm kể từ ngày được cấp giấy (điểm h khoản 1 Điều 33); chỉ còn 01 thành viên hợp danh do tự nguyện rút lui (điểm đ); không bảo đảm duy trì điều kiện hoạt động (điểm g)."],"basis":""}]},{"name":"Công chứng hợp đồng mua bán, chuyển nhượng tài sản","items":[{"title":"Vợ chồng ông An, bà Bình (cư trú tại Hà Nội) có một thửa đất ở tại tỉnh Bắc Ninh, Giấy…","text":"Vợ chồng ông An, bà Bình (cư trú tại Hà Nội) có một thửa đất ở tại tỉnh Bắc Ninh, Giấy chứng nhận ghi tên cả hai người. Họ thỏa thuận chuyển nhượng thửa đất cho anh Cường và đề nghị một Văn phòng công chứng tại Hà Nội công chứng hợp đồng cho thuận tiện.","ask":["Văn phòng công chứng tại Hà Nội có thẩm quyền công chứng hợp đồng này không?","Liệt kê các giấy tờ cơ bản trong hồ sơ yêu cầu công chứng.","Sau khi công chứng, các bên còn phải thực hiện thủ tục gì để việc chuyển nhượng có hiệu lực?"],"guide":["Không có thẩm quyền. Điều 44 LCC: công chứng viên chỉ được công chứng giao dịch về bất động sản trong phạm vi tỉnh nơi tổ chức hành nghề công chứng đặt trụ sở (trừ một số trường hợp luật định như di chúc, văn bản từ chối nhận di sản, ủy quyền liên quan đến bất động sản). Thửa đất ở Bắc Ninh phải công chứng tại tổ chức hành nghề công chứng trên địa bàn Bắc Ninh.","Hồ sơ cơ bản (Điều 42, 43 LCC): phiếu yêu cầu công chứng; dự thảo hợp đồng (nếu tự soạn); giấy tờ tùy thân của các bên; Giấy chứng nhận quyền sử dụng đất; giấy tờ về tình trạng hôn nhân, tài sản chung (nếu cần). Thửa đất phải đáp ứng điều kiện chuyển nhượng tại Điều 45 LĐĐ.","Đăng ký biến động tại cơ quan đăng ký đất đai; việc chuyển nhượng có hiệu lực kể từ thời điểm đăng ký vào sổ địa chính (LĐĐ). Các bên cũng phải thực hiện nghĩa vụ tài chính theo quy định."],"basis":""},{"title":"Ngôi nhà do ông Dũng mua năm 2019 (trong thời kỳ hôn nhân với bà Em), Giấy chứng nhận…","text":"Ngôi nhà do ông Dũng mua năm 2019 (trong thời kỳ hôn nhân với bà Em), Giấy chứng nhận chỉ ghi tên ông Dũng. Ông Dũng yêu cầu công chứng hợp đồng bán nhà, tự mình ký với lý do “sổ đứng tên tôi”. Bà Em đang lao động tại Hàn Quốc và không thể về nước.","ask":["Công chứng viên có nên công chứng khi chỉ có chữ ký của ông Dũng không?","Bà Em có thể tham gia giao dịch bằng cách nào khi đang ở nước ngoài?"],"guide":["Không nên công chứng. Nhà mua trong thời kỳ hôn nhân là tài sản chung, trừ khi có căn cứ chứng minh là tài sản riêng (Điều 33 LHNĐ), dù Giấy chứng nhận chỉ ghi tên một người. Định đoạt bất động sản chung phải có thỏa thuận bằng văn bản của vợ chồng (khoản 2 Điều 35 LHNĐ). Công chứng viên phải yêu cầu làm rõ; nếu không làm rõ được thì từ chối (Điều 42 LCC).","Cách để bà Em tham gia: bà Em có thể ủy quyền cho ông Dũng hoặc người khác bằng văn bản được công chứng, chứng thực tại Cơ quan đại diện Việt Nam ở Hàn Quốc (Điều 73 LCC) hoặc lập văn bản đồng ý theo hình thức hợp pháp (nếu do cơ quan nước ngoài lập thì phải hợp pháp hóa lãnh sự, trừ trường hợp được miễn)."],"basis":""},{"title":"Bà Giàng được bố mẹ tặng riêng một căn nhà trước khi kết hôn.","text":"Bà Giàng được bố mẹ tặng riêng một căn nhà trước khi kết hôn. Sau khi kết hôn, vợ chồng và hai con nhỏ sinh sống tại căn nhà này; đây là nơi ở duy nhất của gia đình. Bà Giàng muốn bán nhà mà không cho chồng biết.","ask":["Việc bán căn nhà có cần sự đồng ý của chồng bà Giàng không?","Công chứng viên cần kiểm tra những thông tin gì trước khi công chứng?"],"guide":["Cần sự đồng ý của chồng. Căn nhà là tài sản riêng của bà Giàng nhưng là nơi ở duy nhất của vợ chồng. Điều 31 LHNĐ: việc xác lập, thực hiện, chấm dứt giao dịch liên quan đến nhà là nơi ở duy nhất của vợ chồng phải có sự thỏa thuận của vợ chồng; trường hợp nhà thuộc sở hữu riêng, chủ sở hữu vẫn có quyền định đoạt nhưng phải bảo đảm chỗ ở cho vợ/chồng.","Công chứng viên cần kiểm tra: nguồn gốc tài sản (hợp đồng tặng cho trước hôn nhân); tình trạng hôn nhân; nơi cư trú của gia đình; phương án bảo đảm chỗ ở. Nếu có dấu hiệu xâm phạm quyền của người khác thì yêu cầu làm rõ hoặc từ chối (Điều 42 LCC)."],"basis":""},{"title":"Tháng 3/2026, ông Hùng lập hợp đồng ủy quyền (có công chứng) cho cháu là anh Kiên được…","text":"Tháng 3/2026, ông Hùng lập hợp đồng ủy quyền (có công chứng) cho cháu là anh Kiên được toàn quyền bán căn hộ của ông. Ngày 01/9/2026 ông Hùng qua đời. Ngày 15/9/2026, anh Kiên mang hợp đồng ủy quyền đến Văn phòng công chứng yêu cầu công chứng hợp đồng bán căn hộ cho người khác.","ask":["Anh Kiên còn quyền ký hợp đồng bán căn hộ không?","Công chứng viên xử lý thế nào? Ai có quyền định đoạt căn hộ?"],"guide":["Không còn quyền. Đại diện theo ủy quyền chấm dứt khi người được đại diện (ông Hùng) chết (Điều 140 BLDS); hợp đồng ủy quyền cũng chấm dứt (Điều 422 BLDS).","Công chứng viên từ chối công chứng. Căn hộ trở thành di sản của ông Hùng; chỉ những người thừa kế (sau khi khai nhận hoặc phân chia di sản theo Điều 59 LCC và đăng ký quyền) mới có quyền định đoạt. Công chứng viên cần tra cứu cơ sở dữ liệu và xác minh thông tin trước khi công chứng giao dịch theo ủy quyền."],"basis":""},{"title":"Bà Lan muốn chuyển nhượng thửa đất đang thế chấp tại Ngân hàng M để bảo đảm khoản vay 2…","text":"Bà Lan muốn chuyển nhượng thửa đất đang thế chấp tại Ngân hàng M để bảo đảm khoản vay 2 tỷ đồng. Bên mua đồng ý trả tiền để bà Lan tất toán khoản vay sau khi ký hợp đồng chuyển nhượng. Ngân hàng chưa có ý kiến.","ask":["Hợp đồng chuyển nhượng có thể được công chứng ngay không?","Đề xuất phương án hợp pháp để các bên thực hiện giao dịch."],"guide":["Chưa thể công chứng. Bên thế chấp chỉ được bán, thay thế, trao đổi, tặng cho tài sản thế chấp nếu được bên nhận thế chấp đồng ý (khoản 5 Điều 321 BLDS). Thửa đất còn đăng ký thế chấp, Ngân hàng chưa đồng ý.","Phương án hợp pháp: (i) bà Lan tất toán khoản vay và xóa đăng ký thế chấp trước, rồi công chứng hợp đồng chuyển nhượng; hoặc (ii) có văn bản đồng ý của Ngân hàng, ba bên thỏa thuận phương thức thanh toán trực tiếp vào tài khoản tất toán khoản vay. Các bên có thể ký hợp đồng đặt cọc để bảo đảm giao kết."],"basis":""},{"title":"Thửa đất của ông Mạnh (có Giấy chứng nhận) đang bị cơ quan thi hành án dân sự kê biên…","text":"Thửa đất của ông Mạnh (có Giấy chứng nhận) đang bị cơ quan thi hành án dân sự kê biên để bảo đảm thi hành một bản án trả nợ. Thửa đất liền kề của bà Ngân thì đang có tranh chấp ranh giới và đã được Tòa án thụ lý. Cả hai đều yêu cầu công chứng hợp đồng chuyển nhượng.","ask":["Hai thửa đất có đủ điều kiện chuyển nhượng không?","Công chứng viên có thể biết các thông tin này bằng cách nào và phải xử lý ra sao?"],"guide":["Cả hai đều chưa đủ điều kiện. Điều 45 LĐĐ: quyền sử dụng đất chỉ được chuyển nhượng khi không có tranh chấp (hoặc tranh chấp đã được giải quyết), không bị kê biên hoặc áp dụng biện pháp khác để bảo đảm thi hành án, còn trong thời hạn sử dụng đất và không bị áp dụng biện pháp khẩn cấp tạm thời.","Cách biết và xử lý: công chứng viên tra cứu cơ sở dữ liệu công chứng (thông tin ngăn chặn), thông tin từ cơ quan đăng ký đất đai, cơ quan thi hành án, Tòa án; yêu cầu các bên cam đoan về tình trạng tài sản. Khi phát hiện tài sản không đủ điều kiện giao dịch, công chứng viên từ chối công chứng (Điều 42 LCC)."],"basis":""},{"title":"Em Phương, 16 tuổi, được thừa kế một thửa đất và đã được cấp Giấy chứng nhận đứng tên…","text":"Em Phương, 16 tuổi, được thừa kế một thửa đất và đã được cấp Giấy chứng nhận đứng tên mình. Mẹ em Phương muốn bán thửa đất để lo chi phí du học cho em, nên một mình đến Văn phòng công chứng đề nghị ký hợp đồng chuyển nhượng với tư cách người đại diện theo pháp luật.","ask":["Ai là người ký hợp đồng bên chuyển nhượng trong trường hợp này?","Nếu em Phương mới 12 tuổi thì câu trả lời có khác không?"],"guide":["Em Phương tự ký, có sự đồng ý của người đại diện. Người từ đủ 15 đến dưới 18 tuổi tự xác lập giao dịch, trừ giao dịch liên quan đến bất động sản và động sản phải đăng ký phải được người đại diện theo pháp luật đồng ý (khoản 4 Điều 21 BLDS). Mẹ không thể một mình ký thay; em Phương phải cùng ký và mẹ ký đồng ý.","Nếu em Phương 12 tuổi, giao dịch do người đại diện theo pháp luật xác lập, thực hiện (khoản 2 Điều 21 BLDS). Người đại diện chỉ được định đoạt tài sản vì lợi ích của con (LHNĐ), và công chứng viên cần kiểm tra tư cách đại diện (giấy khai sinh, tình trạng của cha)."],"basis":""},{"title":"Cụ Quyền, 85 tuổi, bị liệt hai chân, không biết chữ, muốn bán nhà cho cháu ngoại.","text":"Cụ Quyền, 85 tuổi, bị liệt hai chân, không biết chữ, muốn bán nhà cho cháu ngoại. Gia đình đề nghị công chứng viên đến nhà công chứng; người làm chứng dự kiến là chính cháu ngoại (bên mua).","ask":["Công chứng viên có được công chứng tại nhà cụ Quyền không?","Cụ Quyền xác lập ý chí bằng cách nào? Việc chọn cháu ngoại làm người làm chứng có hợp lệ không?"],"guide":["Được công chứng ngoài trụ sở. Điều 46 LCC cho phép công chứng ngoài trụ sở khi người yêu cầu là người già yếu, không thể đi lại được hoặc có lý do chính đáng khác.","Cụ Quyền điểm chỉ thay cho việc ký (Điều 50 LCC). Vì cụ không biết chữ, phải có người làm chứng (Điều 49). Người làm chứng phải không có quyền, lợi ích hoặc nghĩa vụ liên quan đến giao dịch; cháu ngoại là bên mua nên không được làm chứng."],"basis":""},{"title":"Ông Roãn, 78 tuổi, đến Văn phòng công chứng cùng con trai để ký hợp đồng bán nhà.","text":"Ông Roãn, 78 tuổi, đến Văn phòng công chứng cùng con trai để ký hợp đồng bán nhà. Trong lúc trao đổi, ông nhiều lần nhầm lẫn năm sinh, không nhớ địa chỉ ngôi nhà và hỏi lại “bán nhà cho ai”. Con trai khẳng định bố vẫn minh mẫn và thúc giục công chứng ngay.","ask":["Công chứng viên nên xử lý thế nào?","Nếu công chứng viên vẫn công chứng và sau đó có kết luận ông Roãn mất năng lực hành vi dân sự tại thời điểm ký thì hậu quả ra sao?"],"guide":["Công chứng viên dừng lại để làm rõ. Điều 42 LCC: khi có căn cứ cho rằng người yêu cầu công chứng không nhận thức, làm chủ được hành vi, công chứng viên đề nghị làm rõ hoặc theo đề nghị của người yêu cầu tiến hành xác minh, yêu cầu giám định; trường hợp không làm rõ được thì từ chối công chứng. Sự thúc giục của con trai không thay thế được việc đánh giá này.","Hậu quả: giao dịch do người mất năng lực hành vi dân sự xác lập có thể bị tuyên vô hiệu (Điều 125 BLDS); người có quyền, lợi ích liên quan có thể yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu (Điều 54 LCC). Nếu có lỗi của công chứng viên gây thiệt hại, tổ chức hành nghề công chứng phải bồi thường (Điều 40)."],"basis":""},{"title":"Anh Sơn ký hợp đồng mua căn nhà của chị Thảo, hợp đồng được công chứng ngày 10/10/2026.","text":"Anh Sơn ký hợp đồng mua căn nhà của chị Thảo, hợp đồng được công chứng ngày 10/10/2026. Hai bên thỏa thuận anh Sơn thanh toán 70% khi ký và 30% còn lại khi nhận bàn giao nhà vào ngày 10/12/2026. Ngày 01/11/2026, chị Thảo muốn đơn phương “rút lại” hợp đồng vì có người trả giá cao hơn, cho rằng nhà vẫn còn là của mình.","ask":["Hợp đồng mua bán nhà có hiệu lực từ thời điểm nào?","Phân biệt thời điểm hợp đồng có hiệu lực với thời điểm chuyển quyền sở hữu. Chị Thảo có được đơn phương rút lại hợp đồng không?"],"guide":["Hiệu lực từ ngày 10/10/2026, thời điểm công chứng (Điều 164 LNO). Văn bản công chứng có hiệu lực từ thời điểm được công chứng viên ký và đóng dấu (Điều 6 LCC).","Hai thời điểm khác nhau. Thời điểm chuyển quyền sở hữu nhà ở do LNO quy định (theo thỏa thuận hoặc khi bên mua thanh toán đủ và nhận bàn giao nhà), có thể muộn hơn thời điểm hợp đồng có hiệu lực. Tuy nhiên, hợp đồng đã có hiệu lực ràng buộc các bên; chị Thảo không được đơn phương rút lại nếu không có căn cứ theo hợp đồng hoặc pháp luật. Muốn chấm dứt, hủy bỏ phải có sự thỏa thuận của các bên và được công chứng (Điều 53 LCC)."],"basis":""},{"title":"Anh Tú bán chiếc xe máy đứng tên mình cho anh Uẩn.","text":"Anh Tú bán chiếc xe máy đứng tên mình cho anh Uẩn. Anh Tú ký sẵn giấy mua bán xe tại nhà, sau đó nhờ anh Uẩn mang đến Văn phòng công chứng để “đóng dấu công chứng” vì anh Tú bận đi công tác.","ask":["Yêu cầu của anh Tú có được chấp nhận không?","Giấy tờ mua bán xe giữa cá nhân có bắt buộc phải công chứng không? Anh Uẩn cần làm gì sau khi nhận xe?"],"guide":["Không được chấp nhận. Người yêu cầu công chứng phải ký trước mặt công chứng viên (Điều 50 LCC); công chứng viên phải kiểm tra giấy tờ, năng lực hành vi và sự tự nguyện của anh Tú. Không có thủ tục “đóng dấu công chứng” vắng mặt người ký. Anh Tú có thể ủy quyền hợp pháp cho người khác (không phải bên mua) thực hiện.","Không bắt buộc công chứng: giấy tờ mua bán xe của cá nhân có thể công chứng hoặc chứng thực (TT 79/2024/TT-BCA). Sau khi nhận xe, anh Uẩn làm thủ tục đăng ký sang tên trong thời hạn luật định; anh Tú có trách nhiệm làm thủ tục thu hồi ch
