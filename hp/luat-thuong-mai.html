","Doanh nghiệp chỉ gồm cá nhân kinh doanh","Doanh nghiệp là một loại tổ chức kinh tế; thương nhân là tư cách chủ thể theo luật thương mại","Thương nhân không bao giờ là pháp nhân"],"a":2,"e":"Doanh nghiệp và thương nhân thuộc hai tiêu chí pháp lý khác nhau; một doanh nghiệp có thể là thương nhân nhưng hai khái niệm không đồng nhất.","b":"Luật Thương mại 2005; Luật Doanh nghiệp"},{"id":"TM004","g":1,"lv":"NB","q":"Chủ doanh nghiệp tư nhân chịu trách nhiệm về nghĩa vụ của doanh nghiệp như thế nào?","o":["Trong phạm vi vốn điều lệ đã đăng ký","Bằng toàn bộ tài sản của mình theo luật","Chỉ bằng tài sản doanh nghiệp","Không chịu trách nhiệm cá nhân"],"a":1,"e":"Doanh nghiệp tư nhân không có sự tách biệt trách nhiệm hữu hạn như công ty TNHH hoặc công ty cổ phần.","b":"Luật Doanh nghiệp"},{"id":"TM005","g":1,"lv":"NB","q":"Trong công ty hợp danh, chủ thể nào chịu trách nhiệm vô hạn theo chế độ thành viên hợp danh?","o":["Thành viên hợp danh","Mọi người lao động","Chủ nợ","Mọi thành viên góp vốn"],"a":0,"e":"Thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản theo quy định; thành viên góp vốn có chế độ trách nhiệm khác.","b":"Luật Doanh nghiệp"},{"id":"TM006","g":1,"lv":"NB","q":"Đặc điểm nào gắn với công ty cổ phần?","o":["Vốn điều lệ không chia thành phần","Chỉ có một cổ đông","Vốn điều lệ chia thành cổ phần","Cổ đông luôn chịu trách nhiệm vô hạn"],"a":2,"e":"Vốn điều lệ công ty cổ phần được chia thành cổ phần; trách nhiệm của cổ đông về nguyên tắc trong phạm vi vốn góp.","b":"Luật Doanh nghiệp"},{"id":"TM007","g":1,"lv":"TH","q":"Điểm phân biệt chính giữa giải thể và phá sản là gì?","o":["Hai thủ tục có cùng căn cứ và hậu quả","Phá sản luôn do chủ sở hữu tự quyết định","Giải thể chỉ do Tòa án tuyên bố","Phá sản gắn với mất khả năng thanh toán và thủ tục tư pháp; giải thể có căn cứ, trình tự riêng"],"a":3,"e":"Cần phân biệt căn cứ, cơ quan/thủ tục và hậu quả pháp lý của hai cơ chế chấm dứt hoạt động.","b":"Luật Doanh nghiệp; pháp luật về phục hồi, phá sản"},{"id":"TM008","g":1,"lv":"TH","q":"Khi xác định địa vị pháp lý của hộ kinh doanh, cách tiếp cận nào phù hợp?","o":["Áp dụng nguyên xi mọi quy định về công ty cổ phần","Xác định đúng quy định riêng điều chỉnh hộ kinh doanh và thời điểm áp dụng","Mặc nhiên coi hộ kinh doanh là công ty TNHH","Bỏ qua chủ thể đứng tên đăng ký"],"a":1,"e":"Không nên suy rộng chế độ tổ chức và trách nhiệm của doanh nghiệp sang hộ kinh doanh.","b":"Pháp luật về đăng ký kinh doanh; Luật Doanh nghiệp"},{"id":"TM009","g":1,"lv":"NB","q":"Đối với hợp tác xã, nguồn luật nào cần được xem xét trực tiếp?","o":["Chỉ Luật Doanh nghiệp","Chỉ Bộ luật Hình sự","Luật Hợp tác xã và văn bản hướng dẫn còn hiệu lực","Chỉ điều lệ do thành viên tự soạn"],"a":2,"e":"Hợp tác xã có khuôn khổ pháp lý riêng; điều lệ không thể thay thế quy phạm bắt buộc.","b":"Luật Hợp tác xã 2023"},{"id":"TM010","g":1,"lv":"TH","q":"Khi đánh giá quyền tự do kinh doanh, nhận định nào đúng?","o":["Là quyền tuyệt đối, không có giới hạn","Chỉ doanh nghiệp nhà nước có quyền này","Chỉ được kinh doanh ngành nghề được liệt kê là cấm","Được kinh doanh ngành nghề luật không cấm nhưng phải đáp ứng điều kiện và giới hạn hợp pháp"],"a":3,"e":"Tự do kinh doanh được thực hiện trong khuôn khổ Hiến pháp và pháp luật; ngành nghề đầu tư kinh doanh có điều kiện phải đáp ứng điều kiện tương ứng.","b":"Hiến pháp; Luật Đầu tư"},{"id":"TM011","g":1,"lv":"TH","q":"Khi xem xét doanh nghiệp có vốn đầu tư nước ngoài, cần phối hợp áp dụng nhóm pháp luật nào?","o":["Chỉ quy định nội bộ doanh nghiệp","Pháp luật doanh nghiệp và đầu tư, cùng điều kiện tiếp cận thị trường và quy định chuyên ngành khi có liên quan","Chỉ Bộ luật Dân sự","Chỉ pháp luật về thuế"],"a":1,"e":"Tư cách doanh nghiệp và điều kiện đầu tư là các vấn đề liên quan nhưng không trùng nhau.","b":"Luật Doanh nghiệp; Luật Đầu tư"},{"id":"TM012","g":1,"lv":"NB","q":"Việc đăng ký doanh nghiệp có ý nghĩa pháp lý trọng yếu nào?","o":["Tạo cơ sở xác lập tư cách pháp lý của doanh nghiệp theo quy định","Tự động mi "Tên gọi không quyết định hoàn toàn bản chất; cần phân loại quan hệ và xác định luật chuyên ngành, quy định chung cùng quan hệ giữa chúng.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM017","g":2,"lv":"NB","q":"Điều khoản nào giúp giảm tranh chấp về đối tượng hợp đồng mua bán?","o":["Mô tả hàng hóa, số lượng, chất lượng và tiêu chuẩn nghiệm thu rõ ràng","Chỉ ghi tên người bán","Không lưu chứng từ giao nhận","Ghi giá nhưng không xác định hàng hóa"],"a":0,"e":"Mô tả cụ thể đối tượng và tiêu chí nghiệm thu giúp xác định nghĩa vụ và đánh giá việc thực hiện.","b":"Luật Thương mại 2005"},{"id":"TM018","g":2,"lv":"NB","q":"Trong hợp đồng cung ứng dịch vụ, nội dung nào cần được xác định rõ?","o":["Chỉ tên người đại diện","Chỉ địa chỉ trụ sở","Chỉ màu sắc thương hiệu","Phạm vi công việc, tiêu chuẩn, thời hạn, nghiệm thu và phí dịch vụ"],"a":3,"e":"Các điều khoản về phạm vi, tiêu chuẩn và nghiệm thu giúp xác định chất lượng thực hiện và nghĩa vụ thanh toán.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM019","g":2,"lv":"NB","q":"Đặc điểm cốt lõi của đại diện cho thương nhân là gì?","o":["Người trung gian chỉ cung cấp địa chỉ liên hệ","Một thương nhân nhận ủy nhiệm để thực hiện hoạt động thương mại nhân danh thương nhân giao đại diện trong phạm vi đại diện","Bên trung gian luôn mua hàng để bán lại nhân danh mình","Đại diện không cần xác định phạm vi"],"a":1,"e":"Cần nhận diện việc nhân danh thương nhân giao đại diện và phạm vi đại diện theo hợp đồng, luật.","b":"Luật Thương mại 2005"},{"id":"TM020","g":2,"lv":"TH","q":"Môi giới thương mại khác đại diện cho thương nhân ở điểm nào?","o":["Môi giới luôn trở thành chủ sở hữu hàng hóa","Môi giới luôn ký hợp đồng nhân danh bên được môi giới","Môi giới làm trung gian cho các bên đàm phán, giao kết; không mặc nhiên nhân danh bên nào để giao kết","Môi giới không được nhận thù lao"],"a":2,"e":"Môi giới chủ yếu làm trung gian kết nối, hỗ trợ đàm phán/giao kết; không đồng nhất với đại diện.","b":"Luật Thương mại 2005"},{"id":"TM021","g":2,"lv":"NB","q":"Trong ủy thác mua bán hàng hóa, bên nhận ủy thác thường thực hiện giao dịch theo cách nào?","o":["Nhân danh chính mình theo điều kiện ủy thác và nhận thù lao","Luôn nhân danh bên ủy thác như đại diện","Không được ký hợp đồng","Chỉ làm nhiệm vụ vận chuyển"],"a":0,"e":"Ủy thác mua bán hàng hóa có cơ chế nhân danh bên nhận ủy thác, khác với đại diện cho thương nhân.","b":"Luật Thương mại 2005"},{"id":"TM022","g":2,"lv":"NB","q":"Trong đại lý thương mại, quan hệ pháp lý cơ bản là gì?","o":["Đại lý luôn là người lao động của bên giao đại lý","Bên đại lý chỉ được làm môi giới","Bên giao đại lý chuyển toàn bộ tư cách pháp nhân cho đại lý","Bên đại lý nhân danh mình mua/bán hoặc cung ứng dịch vụ cho bên giao đại lý theo thỏa thuận"],"a":3,"e":"Cần xác định hình thức đại lý và quyền, nghĩa vụ cụ thể theo hợp đồng và Luật Thương mại.","b":"Luật Thương mại 2005"},{"id":"TM023","g":2,"lv":"NB","q":"Hoạt động nào thuộc nhóm xúc tiến thương mại được Luật Thương mại điều chỉnh?","o":["Phát hành bản án của Tòa án","Khuyến mại, quảng cáo thương mại, trưng bày giới thiệu và hội chợ triển lãm","Đăng ký khai sinh","Cấp giấy chứng nhận quyền sử dụng đất"],"a":1,"e":"Các hình thức xúc tiến thương mại được quy định trong Luật Thương mại và chịu thêm quy định chuyên ngành khi liên quan.","b":"Luật Thương mại 2005"},{"id":"TM024","g":2,"lv":"TH","q":"Khi xác định trách nhiệm trong dịch vụ logistics, yếu tố nào đặc biệt quan trọng?","o":["Chỉ màu sắc bao bì","Chỉ quốc tịch người nhận hàng","Phạm vi dịch vụ, chứng từ, thời điểm nhận/giao và giới hạn trách nhiệm theo luật","Không cần xem hợp đồng"],"a":2,"e":"Trách nhiệm phụ thuộc phạm vi dịch vụ, chứng cứ, thỏa thuận hợp pháp và giới hạn luật định.","b":"Luật Thương mại 2005"},{"id":"TM025","g":2,"lv":"NB","q":"Trong mua bán hàng hóa, chuyển giao rủi ro và chuyển quyền sở hữu có quan hệ thế nào?","o":["Luôn diễn ra cùng thời điểm trong mọi trường hợp","Không có ý nghĩa pháp lý","Luôn xảy ra khi người mua đặt hàng","Là hai vấn đề pháp lý riêng, thời điểm xác định theo luật và thỏa thuận"],"a":3,"e":"Không đồng nhất thời điểm chuyển rủi ro với thời điểm chuyển quyền sở hữu; cần kiểm tra điều khoản và quy định áp dụng.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM026","g":2,"lv":"NB","q":"Incoterms 2020 chủ yếu điều chỉnh vấn đề gì?","o":["Một bộ quy tắc về điều kiện giao hàng, phân bổ chi phí và rủi ro trong mua bán hàng hóa khi được đưa vào hợp đồng","Tư cách pháp nhân của doanh nghiệp","Tội phạm thương mại","Thẩm quyền của Tòa án trong mọi tranh chấp"],"a":0,"e":"Incoterms không thay thế toàn bộ hợp đồng hoặc luật áp dụng; hiệu lực phụ thuộc việc các bên viện dẫn và phạm vi điều khoản.","b":"Incoterms 2020, ICC"},{"id":"TM027","g":2,"lv":"NB","q":"CISG 1980 có phạm vi trọng tâm nào?","o":["Mọi loại dịch vụ trong nước","Mọi hợp đồng lao động","Hợp đồng mua bán hàng hóa quốc tế thuộc phạm vi Công ước","Mọi quan hệ về thành lập doanh nghiệp"],"a":2,"e":"CISG tập trung vào hợp đồng mua bán hàng hóa quốc tế theo các điều kiện áp dụng của Công ước.","b":"CISG 1980"},{"id":"TM028","g":2,"lv":"TH","q":"Khi giao kết hợp đồng bằng phương tiện điện tử, cần kiểm tra điều gì?","o":["Mặc nhiên vô hiệu vì không ký giấy","Điều kiện pháp lý về thông điệp dữ liệu, xác thực, thời điểm gửi/nhận và yêu cầu hình thức chuyên biệt","Chỉ kiểm tra màu nền email","Chỉ căn cứ việc có bản in"],"a":1,"e":"Giao dịch điện tử có thể đáp ứng yêu cầu văn bản nếu thỏa điều kiện luật định; vẫn cần kiểm tra hình thức bắt buộc riêng của loại giao dịch.","b":"Luật Giao dịch điện tử 2023; Luật Thương mại điện tử 2025"},{"id":"TM029","g":2,"lv":"NB","q":"Trong hợp đồng nhượng quyền thương mại, nội dung nào cần quan tâm?","o":["Chỉ tên cửa hàng","Chỉ số lượng nhân viên","Chỉ tài khoản mạng xã hội","Quyền sử dụng mô hình/đối tượng nhượng quyền, phí, hỗ trợ, kiểm soát chất lượng và nghĩa vụ các bên"],"a":3,"e":"Quan hệ nhượng quyền thường liên quan hệ thống kinh doanh, quyền sở hữu trí tuệ, phí và nghĩa vụ hỗ trợ/kiểm soát.","b":"Luật Thương mại 2005"},{"id":"TM030","g":2,"lv":"TH","q":"Khi xem xét điều khoản lựa chọn luật trong hợp đồng quốc tế, nhận định nào phù hợp?","o":["Cần kiểm tra hiệu lực của điều khoản, phạm vi lựa chọn và các quy phạm bắt buộc có liên quan","Luật nơi ký hợp đồng luôn áp dụng","Các bên có thể loại trừ mọi quy phạm bắt buộc","Không cần xác định yếu tố nước ngoài"],"a":0,"e":"Lựa chọn luật phải được đánh giá theo quy phạm xung đột và giới hạn của pháp luật áp dụng.","b":"Bộ luật Dân sự 2015; điều ước liên quan"},{"id":"TM031","g":3,"lv":"NB","q":"Theo Luật Thương mại, phạt vi phạm hợp đồng được áp dụng khi nào?","o":["Trong mọi trường hợp dù không có thỏa thuận","Chỉ khi có thỏa thuận phạt hợp pháp và đủ điều kiện áp dụng","Chỉ khi Tòa án tự đặt mức phạt","Chỉ với hợp đồng mua bán quốc tế"],"a":1,"e":"Thỏa thuận phạt là điều kiện quan trọng; cần xem nội dung hợp đồng và quy định bắt buộc.","b":"Luật Thương mại 2005, Điều 300"},{"id":"TM032","g":3,"lv":"NB","q":"Mức phạt vi phạm thông thường theo Điều 301 Luật Thương mại 2005 được giới hạn thế nào?","o":["Không quá 50% toàn bộ giá trị hợp đồng","Không có giới hạn nào","Không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm, trừ trường hợp luật quy định khác","Luôn bằng thiệt hại thực tế"],"a":2,"e":"Điều 301 đặt mức trần thông thường là 8% giá trị phần nghĩa vụ bị vi phạm; cần kiểm tra trường hợp luật quy định khác.","b":"Luật Thương mại 2005, Điều 301"},{"id":"TM033","g":3,"lv":"VD","q":"Một bên yêu cầu bồi thường thiệt hại do vi phạm hợp đồng thương mại cần tập trung chứng minh điều gì?","o":["Chỉ việc hợp đồng đã ký","Chỉ sự không hài lòng","Chỉ lỗi đạo đức của bên kia","Hành vi vi phạm, thiệt hại thực tế và quan hệ nhân quả trực tiếp theo luật"],"a":3,"e":"Cần chứng minh các yếu tố luật định; thiệt hại không tự động được suy ra từ hành vi vi phạm.","b":"Luật Thương mại 2005, Điều 303"},{"id":"TM034","g":3,"lv":"NB","q":"Nghĩa vụ hạn chế tổn thất có ý nghĩa gì?","o":["Bên bị vi phạm phải áp dụng biện pháp hợp lý để hạn chế tổn thất; phần tổn thất có thể hạn chế được xử lý theo luật","Bên bị vi phạm được để thiệt hại tăng không giới hạn","Chỉ bên vi phạm có nghĩa vụ","Nghĩa vụ này chỉ áp dụng cho hợp đồng lao động"],"a":0,"e":"Bên yêu cầu bồi thường phải thực hiện nghĩa vụ hạn chế tổn thất theo quy định; đây là yếu tố ảnh hưởng phạm vi bồi thường.","b":"Luật Thương mại 2005, Điều 305; CISG Điều 77"},{"id":"TM035","g":3,"lv":"NB","q":"Biện pháp nào là chế tài tạm ngừng thực hiện hợp đồng?","o":["Hợp đồng tự động vô hiệu từ ngày ký","Bên vi phạm luôn bị giải thể","Tạm thời không thực hiện nghĩa vụ khi đủ căn cứ luật định hoặc thỏa thuận","Chuyển tranh chấp cho trọng tài"],"a":2,"e":"Tạm ngừng là chế tài có tính tạm thời, khác với đình chỉ và hủy bỏ hợp đồng.","b":"Luật Thương mại 2005"},{"id":"TM036","g":3,"lv":"TH","q":"Hủy bỏ hợp đồng khác đình chỉ thực hiện hợp đồng chủ yếu ở điểm nào?","o":["Hai chế tài luôn có hậu quả giống hệt nhau","Hủy bỏ kéo theo hậu quả pháp lý riêng đối với hiệu lực hợp đồng và hoàn trả theo luật; đình chỉ chấm dứt thực hiện từ thời điểm luật định","Đình chỉ luôn làm hợp đồng vô hiệu từ đầu","Hủy bỏ chỉ là lời nhắc thực hiện"],"a":1,"e":"Phải phân biệt căn cứ, thời điểm phát sinh hậu quả và nghĩa vụ hoàn trả theo từng chế tài.","b":"Luật Thương mại 2005"},{"id":"TM037","g":3,"lv":"NB","q":"Trường hợp nào có thể là căn cứ miễn trách nhiệm theo Luật Thương mại nếu đáp ứng điều kiện luật định?","o":["Doanh nghiệp không còn muốn thực hiện hợp đồng","Giá thị trường giảm nhẹ","Nhân sự nghỉ phép","Sự kiện bất khả kháng được chứng minh và tuân thủ nghĩa vụ liên quan"],"a":3,"e":"Không phải mọi khó khăn đều là bất khả kháng; bên viện dẫn phải đáp ứng điều kiện và nghĩa vụ chứng minh/thông báo.","b":"Luật Thương mại 2005, Điều 294–295"},{"id":"TM038","g":3,"lv":"NB","q":"Trong Luật Thương mại, khi bên bị vi phạm yêu cầu cả phạt vi phạm và bồi thường thiệt hại, cách xử lý nào đúng?","o":["Kiểm tra thỏa thuận phạt, căn cứ bồi thường và quy định về áp dụng đồng thời","Luôn chỉ được chọn một chế tài","Luôn được nhận cả hai không cần điều kiện","Tòa án không được xem xét thỏa thuận"],"a":0,"e":"Việc áp dụng đồng thời phụ thuộc điều kiện luật định và thỏa thuận, không thể khẳng định tuyệt đối cho mọi trường hợp.","b":"Luật Thương mại 2005, Điều 307"},{"id":"TM039","g":3,"lv":"NB","q":"Vi phạm cơ bản trong CISG có vai trò gì?","o":["Là căn cứ tự động giải thể doanh nghiệp","Chỉ dùng trong tranh chấp lao động","Có ý nghĩa đối với quyền áp dụng một số biện pháp như tuyên bố hủy hợp đồng theo điều kiện Công ước","Là thuật ngữ đồng nghĩa với mọi sai sót nhỏ"],"a":2,"e":"CISG có tiêu chí vi phạm cơ bản riêng; cần phân tích hậu quả nghiêm trọng theo Công ước và các điều kiện tương ứng.","b":"CISG 1980, Điều 25"},{"id":"TM040","g":3,"lv":"TH","q":"Bất khả kháng và hardship có phải là một khái niệm đồng nhất?","o":["Có, luôn tạo cùng một hậu quả","Không; hardship liên quan thay đổi căn bản làm mất cân bằng hợp đồng theo quy tắc áp dụng, còn bất khả kháng tập trung vào trở ngại miễn trách nhiệm","Có, chỉ khác cách viết","Không khái niệm nào được sử dụng trong thương mại quốc tế"],"a":1,"e":"Hai khái niệm có điều kiện và hậu quả khác nhau; phải xác định văn bản/điều khoản điều chỉnh.","b":"PICC 2016; hợp đồng và luật áp dụng"},{"id":"TM041","g":3,"lv":"NB","q":"Điều khoản giới hạn trách nhiệm cần được đánh giá như thế nào?","o":["Mặc nhiên có hiệu lực tuyệt đối","Chỉ cần in đậm","Không cần xác định phạm vi thiệt hại","Kiểm tra cách hình thành, phạm vi, quy định bắt buộc và giới hạn pháp lý áp dụng"],"a":3,"e":"Hiệu lực phụ thuộc nội dung, hoàn cảnh giao kết và các giới hạn của luật áp dụng.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM042","g":3,"lv":"TH","q":"Khi viện dẫn miễn trách nhiệm, bên viện dẫn nên làm gì?","o":["Thu thập chứng cứ về sự kiện, quan hệ nhân quả, tác động và thực hiện nghĩa vụ thông báo theo luật","Chỉ gửi tin nhắn không nêu lý do","Xóa hồ sơ giao dịch","Chờ đến khi tranh chấp kết thúc mới thông báo trong mọi trường hợp"],"a":0,"e":"Nghĩa vụ chứng minh và thông báo có vai trò quan trọng khi viện dẫn miễn trách nhiệm.","b":"Luật Thương mại 2005, Điều 295"},{"id":"TM043","g":3,"lv":"TH","q":"Theo cách tiếp cận hợp lý, thiệt hại được yêu cầu bồi thường phải được xử lý ra sao?","o":["Chấp nhận toàn bộ con số bên yêu cầu nêu","Không cần chứng từ","Đánh giá tính thực tế, trực tiếp, quan hệ nhân quả, khả năng dự liệu nếu luật áp dụng yêu cầu và nghĩa vụ hạn chế tổn thất","Chỉ dựa vào lời khai của bên vi phạm"],"a":2,"e":"Phải đánh giá chứng cứ và các yếu tố pháp lý áp dụng, không mặc nhiên chấp nhận số tiền yêu cầu.","b":"Luật Thương mại 2005; CISG nếu áp dụng"},{"id":"TM044","g":3,"lv":"NB","q":"Nguyên tắc favor contractus trong thảo luận về hợp đồng quốc tế thường nhấn mạnh điều gì?","o":["Ưu tiên tuyên bố mọi hợp đồng vô hiệu","Ưu tiên bảo tồn hợp đồng khi có thể theo điều kiện của nguồn luật áp dụng","Bỏ qua quyền của bên bị vi phạm","Chỉ bảo vệ bên bán"],"a":1,"e":"Đây là định hướng ưu tiên duy trì hợp đồng khi đáp ứng điều kiện pháp lý, không phải nguyên tắc tuyệt đối.","b":"PICC 2016; CISG"},{"id":"TM045","g":3,"lv":"VD","q":"Một bên bị giao hàng không phù hợp muốn yêu cầu bồi thường; chứng cứ nào hữu ích nhất?","o":["Chỉ ảnh quảng cáo của doanh nghiệp","Chỉ hợp đồng lao động của nhân viên","Chỉ thông tin mạng xã hội","Hợp đồng, tiêu chuẩn kỹ thuật, biên bản kiểm tra, thông báo khiếm khuyết và tài liệu chứng minh tổn thất"],"a":3,"e":"Hồ sơ cần chứng minh nghĩa vụ, việc không phù hợp, thông báo và thiệt hại.","b":"Luật Thương mại 2005"},{"id":"TM046","g":3,"lv":"TH","q":"Khi xác định chế tài phù hợp, cần tránh sai lầm nào?","o":["Áp dụng cùng một chế tài cho mọi loại vi phạm","Xác định mức độ vi phạm và căn cứ từng chế tài","Đọc điều khoản thông báo","Kiểm tra luật chuyên ngành"],"a":0,"e":"Mỗi chế tài có điều kiện và hậu quả riêng; cần áp dụng theo dữ kiện và quy định.","b":"Luật Thương mại 2005"},{"id":"TM047","g":4,"lv":"NB","q":"Bốn phương thức giải quyết tranh chấp thương mại trong nước thường được xem xét là gì?","o":["Hình sự, hành chính, kỷ luật, khiếu nại","Chỉ thương lượng và khởi kiện","Thương lượng, hòa giải, trọng tài thương mại và Tòa án","Chỉ trọng tài và hòa giải"],"a":2,"e":"Đề cương học phần xác định bốn phương thức này; lựa chọn tùy thỏa thuận và điều kiện pháp lý.","b":"Đề cương học phần; pháp luật về giải quyết tranh chấp"},{"id":"TM048","g":4,"lv":"NB","q":"Điều kiện nền tảng để giải quyết tranh chấp bằng trọng tài là gì?","o":["Chỉ cần một bên gửi email","Có thỏa thuận trọng tài hợp lệ và tranh chấp thuộc thẩm quyền","Phải có bản án của Tòa án trước","Trọng tài có thẩm quyền với mọi tranh chấp không cần thỏa thuận"],"a":1,"e":"Thỏa thuận trọng tài và phạm vi thẩm quyền là các điều kiện cốt lõi; cần kiểm tra hiệu lực thỏa thuận.","b":"Luật Trọng tài thương mại 2010"},{"id":"TM049","g":4,"lv":"NB","q":"Thỏa thuận trọng tài có thể được xác lập dưới hình thức nào?","o":["Chỉ bằng lời nói trong mọi trường hợp","Chỉ bằng văn bản công chứng","Chỉ sau khi phát sinh tranh chấp","Điều khoản trong hợp đồng hoặc thỏa thuận riêng dưới hình thức luật công nhận"],"a":3,"e":"Luật quy định hình thức văn bản và một số phương thức trao đổi thông tin được coi là văn bản.","b":"Luật Trọng tài thương mại 2010, Điều 16"},{"id":"TM050","g":4,"lv":"NB","q":"Nguyên tắc độc lập của thỏa thuận trọng tài có nghĩa là gì?","o":["Hiệu lực thỏa thuận trọng tài được xem xét độc lập với hợp đồng chính theo quy định","Hợp đồng chính vô hiệu thì thỏa thuận trọng tài luôn vô hiệu","Trọng tài không cần thỏa thuận","Tòa án không bao giờ có vai trò"],"a":0,"e":"Luật Trọng tài thương mại quy định tính độc lập của thỏa thuận trọng tài với hợp đồng.","b":"Luật Trọng tài thương mại 2010, Điều 19"},{"id":"TM051","g":4,"lv":"NB","q":"Phán quyết trọng tài thương mại trong nước về nguyên tắc có đặc điểm nào?","o":["Luôn được phúc thẩm bởi Tòa án","Chỉ có hiệu lực khi các bên cùng đồng ý sau đó","Có tính chung thẩm, nhưng có thể bị yêu cầu hủy theo căn cứ và thủ tục luật định","Không có giá trị pháp lý"],"a":2,"e":"Tính chung thẩm không loại trừ thủ tục yêu cầu hủy theo các căn cứ giới hạn của luật.","b":"Luật Trọng tài thương mại 2010"},{"id":"TM052","g":4,"lv":"NB","q":"Tòa án có vai trò gì đối với hoạt động trọng tài?","o":["Thay hội đồng trọng tài xét xử lại mọi vụ việc","Hỗ trợ và giám sát trong phạm vi luật quy định, gồm một số yêu cầu về biện pháp khẩn cấp, chứng cứ, hủy phán quyết","Không có bất kỳ vai trò nào","Luôn được sửa nội dung phán quyết"],"a":1,"e":"Vai trò Tòa án được giới hạn theo luật; thủ tục hủy không phải xét xử phúc thẩm nội dung.","b":"Luật Trọng tài thương mại; Bộ luật Tố tụng dân sự"},{"id":"TM053","g":4,"lv":"TH","q":"Hòa giải thương mại khác xét xử ở điểm nào?","o":["Hòa giải viên luôn ra phán quyết bắt buộc","Hòa giải không cần sự tham gia của các bên","Hòa giải viên đại diện một bên","Hòa giải viên hỗ trợ các bên tự nguyện tìm giải pháp, không tự mình áp đặt kết quả"],"a":3,"e":"Bản chất hòa giải là hỗ trợ các bên đạt thỏa thuận tự nguyện.","b":"Nghị định 22/2017/NĐ-CP"},{"id":"TM054","g":4,"lv":"VD","q":"Khi lựa chọn giữa trọng tài và Tòa án, yếu tố nào cần xem xét trước?","o":["Thỏa thuận giải quyết tranh chấp, thẩm quyền và hiệu lực điều khoản","Chỉ mức phí luật sư","Chỉ nơi đặt trụ sở bên bán","Chỉ ngôn ngữ quảng cáo"],"a":0,"e":"Thỏa thuận giải quyết tranh chấp có thể quyết định phương thức và ảnh hưởng thẩm quyền.","b":"Luật Trọng tài thương mại; Bộ luật Tố tụng dân sự"},{"id":"TM055","g":4,"lv":"NB","q":"Công ước New York 1958 tập trung vào vấn đề gì?","o":["Thành lập doanh nghiệp quốc tế","Điều kiện quảng cáo thương mại","Công nhận và thi hành phán quyết trọng tài nước ngoài","Thủ tục phá sản trong nước"],"a":2,"e":"Công ước đặt nền tảng quốc tế về công nhận và thi hành phán quyết trọng tài nước ngoài trong phạm vi áp dụng.","b":"Công ước New York 1958"},{"id":"TM056","g":4,"lv":"NB","q":"DSU của WTO điều chỉnh cơ chế tranh chấp nào?","o":["Tranh chấp giữa người lao động và doanh nghiệp","Tranh chấp giữa các thành viên WTO về nghĩa vụ thuộc các hiệp định liên quan","Mọi tranh chấp hợp đồng dân sự","Tranh chấp hôn nhân"],"a":1,"e":"Cơ chế DSU là cơ chế giải quyết tranh chấp giữa các thành viên WTO, không phải cơ chế hợp đồng tư nhân.","b":"WTO Dispute Settlement Understanding"},{"id":"TM057","g":4,"lv":"VD","q":"Khi tranh chấp hợp đồng có yếu tố nước ngoài và không có điều khoản chọn luật, cách tiếp cận nào đúng?","o":["Luôn áp dụng luật quốc tịch bên mua","Luôn áp dụng luật nơi giao hàng","Bỏ qua quy phạm xung đột","Xác định quy phạm xung đột và yếu tố kết nối theo pháp luật áp dụng"],"a":3,"e":"Luật áp dụng phải được xác định theo quy phạm xung đột thích hợp và dữ kiện; không có quy tắc một yếu tố luôn quyết định.","b":"Bộ luật Dân sự 2015; điều ước liên quan"},{"id":"TM058","g":4,"lv":"NB","q":"Căn cứ nào không nên được coi là lý do tự động để Tòa án hủy phán quyết trọng tài?","o":["Không đồng ý với cách đánh giá chứng cứ/nội dung phán quyết mà không thuộc căn cứ hủy luật định","Có căn cứ luật định về thỏa thuận trọng tài vô hiệu","Vi phạm nghiêm trọng thủ tục theo điều kiện luật định","Phán quyết thuộc trường hợp luật cho phép yêu cầu hủy"],"a":0,"e":"Tòa án không xét xử lại nội dung như phúc thẩm; yêu cầu hủy phải dựa trên căn cứ luật định.","b":"Luật Trọng tài thương mại 2010"},{"id":"TM059","g":4,"lv":"VD","q":"Khi một điều khoản chọn Tòa án mâu thuẫn với điều khoản trọng tài, cần làm gì?","o":["Mặc nhiên bỏ cả hai điều khoản","Chỉ chọn điều khoản được in đậm","Phân tích toàn văn hợp đồng, ý chí các bên, hiệu lực và quy tắc giải thích áp dụng","Chỉ hỏi bên soạn hợp đồng"],"a":2,"e":"Cần giải thích điều khoản trên tổng thể và xác định thỏa thuận có hiệu lực, không suy đoán chỉ từ hình thức trình bày.","b":"Luật Trọng tài thương mại; Bộ luật Dân sự"},{"id":"TM060","g":4,"lv":"NB","q":"Trong hòa giải thương mại, yếu tố nào là cốt lõi?","o":["Hòa giải viên có quyền cưỡng chế tài sản","Tự nguyện và trung lập, không áp đặt kết quả","Một bên phải thắng tuyệt đối","Không cần bảo mật"],"a":1,"e":"Hòa giải dựa trên sự tự nguyện và vai trò hỗ trợ của người thứ ba trung lập theo pháp luật.","b":"Nghị định 22/2017/NĐ-CP"},{"id":"TM061","g":4,"lv":"TH","q":"Công nhận bản án của Tòa án nước ngoài và công nhận phán quyết trọng tài nước ngoài có giống hoàn toàn nhau không?","o":["Có, đều theo cùng một điều khoản","Có, không cần xác định nguồn gốc","Có, luôn tự động thi hành","Không; chúng chịu cơ chế pháp lý và căn cứ xem xét khác nhau"],"a":3,"e":"Phải phân biệt nguồn gốc quyết định và hệ thống quy tắc công nhận, thi hành tương ứng.","b":"Bộ luật Tố tụng dân sự; Công ước New York 1958"},{"id":"TM062","g":4,"lv":"NB","q":"Một điều khoản giải quyết tranh chấp tốt nên xác định gì?","o":["Phương thức, cơ quan/tổ chức, quy tắc, địa điểm và các yếu tố cần thiết khác phù hợp giao dịch","Chỉ ghi “nếu có tranh chấp sẽ giải quyết theo pháp luật” trong mọi trường hợp","Chỉ ghi tên người bán","Không cần cân nhắc khả năng thi hành"],"a":0,"e":"Điều khoản rõ giúp giảm tranh chấp về thẩm quyền và thủ tục; nội dung cần phù hợp giao dịch và luật áp dụng.","b":"Luật Trọng tài thương mại; pháp luật tố tụng"},{"id":"TM063","g":4,"lv":"TH","q":"Khi đánh giá hiệu lực thỏa thuận hòa giải thành, nên phân biệt điều gì?","o":["Thỏa thuận thành luôn là bản án","Hòa giải viên có thể tự cưỡng chế thi hành","Thỏa thuận giữa các bên và cơ chế công nhận/thi hành theo pháp luật là hai vấn đề liên quan nhưng không đồng nhất","Không cần văn bản ghi nhận"],"a":2,"e":"Hiệu lực ràng buộc của thỏa thuận và cơ chế cưỡng chế thi hành cần được phân tích riêng.","b":"Nghị định 22/2017/NĐ-CP; Bộ luật Tố tụng dân sự"},{"id":"TM064","g":4,"lv":"VD","q":"Khi có yếu tố nước ngoài, lựa chọn phương thức giải quyết tranh chấp cần tính đến điều gì ngoài chi phí?","o":["Chỉ màu sắc hợp đồng","Luật áp dụng, thẩm quyền, tống đạt, bảo toàn chứng cứ và khả năng công nhận/thi hành ở nơi có tài sản","Chỉ số lượng trang hợp đồng","Chỉ nơi ký hợp đồng"],"a":1,"e":"Khả năng thi hành và các yếu tố xuyên biên giới có thể quyết định hiệu quả thực tế của phương thức.","b":"Bộ luật Dân sự; Bộ luật Tố tụng dân sự; Công ước New York 1958"},{"id":"TM065","g":4,"lv":"NB","q":"Mục đích của việc phân tích cấu trúc pháp lý tranh chấp là gì?","o":["Tìm cách trì hoãn giải quyết","Thay thế toàn bộ chứng cứ bằng nhận xét","Chỉ xác định bên có lỗi đạo đức","Xác định đúng yêu cầu, nghĩa vụ, chứng cứ, luật áp dụng và cơ chế giải quyết"],"a":3,"e":"Cấu trúc hóa tranh chấp giúp xác định vấn đề cần chứng minh và phương thức xử lý phù hợp.","b":"Kỹ năng phân tích pháp lý; pháp luật tố tụng liên quan"},{"id":"TM066","g":4,"lv":"TH","q":"Khi sử dụng tài liệu về pháp luật trọng tài trong học phần, nên làm gì?","o":["Đối chiếu văn bản gốc, văn bản hợp nhất/sửa đổi và tình trạng hiệu lực trước khi trích dẫn","Mặc nhiên cho rằng mọi tài liệu năm 2010 là bản cập nhật mới nhất","Chỉ đọc bài quảng cáo của trung tâm trọng tài","Bỏ qua điều khoản chuyển tiếp"],"a":0,"e":"Phải xác minh tình trạng hiệu lực và văn bản liên quan; văn bản hợp nhất không tự thân là luật sửa đổi.","b":"Cơ sở dữ liệu văn bản pháp luật chính thức"}],"th":[{"name":"Tình huống tự kiểm tra","items":[{"title":"Xác định tư cách chủ thể","text":"Một cá nhân thường xuyên mua hàng hóa từ nhà cung cấp để bán lại nhằm thu lợi, nhưng chưa thực hiện thủ tục đăng ký kinh doanh. Đối tác cho rằng cá nhân đó đương nhiên là thương nhân trong mọi quan hệ.","ask":["Cần xác định những dữ kiện và điều kiện pháp lý nào trước khi kết luận về tư cách thương nhân? Việc thiếu đăng ký có thể ảnh hưởng thế nào đến đánh giá pháp lý?"],"guide":["Phân biệt mục đích sinh lợi với điều kiện xác định thương nhân; làm rõ hoạt động độc lập, thường xuyên và yêu cầu đăng ký theo luật, đồng thời kiểm tra quy định áp dụng cho mô hình kinh doanh cụ thể. Không kết luận chỉ từ một dữ kiện."],"basis":"Luật Thương mại 2005"},{"title":"Hợp đồng mua bán hàng hóa","text":"Doanh nghiệp A và B thỏa thuận giao một lô hàng trong tháng 5. Hàng được giao chậm và một phần không đáp ứng thông số kỹ thuật. Hợp đồng có điều khoản về thời hạn giao hàng và chất lượng nhưng chưa quy định rõ thủ tục kiểm tra.","ask":["Cần thu thập tài liệu gì để xác định nghĩa vụ bị vi phạm, thời điểm thông báo và các biện pháp pháp lý có thể áp dụng?"],"guide":["Đối chiếu hợp đồng, phụ lục kỹ thuật, chứng từ giao nhận, biên bản kiểm tra, trao đổi giữa các bên và quy định Luật Thương mại về giao hàng, chất lượng, khiếu nại, chế tài. Chưa đủ dữ kiện để kết luận một chế tài cụ thể."],"basis":"Luật Thương mại 2005"},{"title":"Phạt vi phạm và bồi thường","text":"Công ty A giao thiếu 20% lô hàng cho B. Hợp đồng có điều khoản phạt vi phạm nhưng ghi mức phạt 15% toàn bộ giá trị hợp đồng; B còn yêu cầu bồi thường lợi nhuận bị mất nhưng mới cung cấp bảng tính nội bộ.","ask":["Phân tích căn cứ và giới hạn phạt; xác định các yếu tố B cần chứng minh để yêu cầu bồi thường."],"guide":["Đối chiếu Điều 300–307 Luật Thương mại 2005, đặc biệt cơ sở tính mức phạt theo phần nghĩa vụ bị vi phạm và điều kiện chứng minh thiệt hại, quan hệ nhân quả trực tiếp, nghĩa vụ hạn chế tổn thất. Bảng tính đơn phương chưa mặc nhiên đủ chứng minh thiệt hại."],"basis":"Điều 300–307 Luật Thương mại 2005"},{"title":"Miễn trách nhiệm","text":"Nhà cung cấp viện dẫn sự kiện mưa lớn kéo dài để giải thích việc giao hàng chậm, nhưng không thông báo cho bên mua trong thời gian xảy ra sự kiện và không cung cấp hồ sơ chứng minh tác động trực tiếp đến nghĩa vụ.","ask":["Những vấn đề pháp lý nào cần xác minh trước khi kết luận có được miễn trách nhiệm?"],"guide":["Kiểm tra tính chất sự kiện, khả năng dự liệu/khắc phục theo quy định áp dụng, quan hệ nhân quả, nghĩa vụ chứng minh và thông báo theo Điều 294–295 Luật Thương mại; không kết luận chỉ từ tên gọi “mưa lớn”."],"basis":"Luật Thương mại 2005"},{"title":"Điều khoản trọng tài","text":"Hợp đồng mua bán giữa A và B ghi “tranh chấp giải quyết tại trọng tài”, không xác định tổ chức hoặc quy tắc. Khi tranh chấp phát sinh, A yêu cầu Tòa án giải quyết; B cho rằng điều khoản đã đủ hiệu lực.","ask":["Cần kiểm tra các yếu tố nào để đánh giá hiệu lực và khả năng thực hiện thỏa thuận trọng tài?"],"guide":["Kiểm tra hình thức văn bản, ý chí thỏa thuận, khả năng xác định cơ chế trọng tài, phạm vi tranh chấp, luật áp dụng và quy định về thỏa thuận trọng tài không thể thực hiện được; không kết luận chỉ từ câu chữ trích riêng."],"basis":"Luật Thương mại 2005"},{"title":"Chọn phương thức giải quyết tranh chấp quốc tế","text":"Doanh nghiệp Việt Nam ký hợp đồng với doanh nghiệp nước ngoài, trong đó có điều khoản chọn luật của một nước, điều khoản chọn Tòa án và điều khoản trọng tài ở phụ lục. Hai điều khoản giải quyết tranh chấp có nội dung không thống nhất.","ask":["Xây dựng các bước xác định cơ quan có thẩm quyền, luật áp dụng và rủi ro thi hành."],"guide":["Đọc toàn bộ hợp đồng và phụ lục, xác định thứ tự ưu tiên điều khoản, hiệu lực thỏa thuận, quy phạm xung đột, địa điểm có tài sản và cơ chế công nhận/thi hành. Cần kiểm tra bản gốc, ngôn ngữ và hoàn cảnh giao kết."],"basis":"Luật Thương mại 2005"}]}],"vb":[{"name":"Văn bản pháp luật cần tra cứu","rows":[{"t":"Luật Thương mại số 36/2005/QH11","d":"","org":"","note":"Thương nhân, hoạt động thương mại, hợp đồng và hoạt động thương mại; phải đối chiếu sửa đổi, bổ sung và văn bản hợp nhất.","url":"https://thuvienphapluat.vn/van-ban/Thuong-mai/Luat-Thuong-mai-2005-36-2005-QH11-2633.aspx"},{"t":"Luật Doanh nghiệp số 59/2020/QH14, được sửa đổi, bổ sung bởi Luật số 76/2025/QH15","d":"","org":"","note":"Thành lập, tổ chức quản lý, loại hình doanh nghiệp, quyền và nghĩa vụ của doanh nghiệp, tổ chức lại và giải thể.","url":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Luat-Doanh-nghiep-2020-427301.aspx"},{"t":"Luật Đầu tư số 143/2025/QH15","d":"","org":"","note":"Điều kiện đầu tư kinh doanh và tổ chức kinh tế có vốn đầu tư nước ngoài; kiểm tra hiệu lực, văn bản hướng dẫn và chuyển tiếp.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=143/2025/QH15&match=True"},{"t":"Luật Hợp tác xã số 17/2023/QH15","d":"","org":"","note":"Địa vị pháp lý, tổ chức và hoạt động của hợp tác xã, liên hiệp hợp tác xã.","url":"https://thuvienphapluat.vn/van-ban/doanh-nghiep/Luat-Hop-tac-xa-2023-17-2023-QH15-499239.aspx"},{"t":"Bộ luật Dân sự số 91/2015/QH13","d":"","org":"","note":"Quy định chung về giao dịch, hợp đồng, đại diện, nghĩa vụ và trách nhiệm dân sự khi được áp dụng bổ sung.","url":"https://thuvienphapluat.vn/van-ban/Quyen-dan-su/Bo-luat-Dan-su-2015-296215.aspx"},{"t":"Luật Phục hồi, phá sản số 142/2025/QH15 (hiệu lực 01/03/2026)","d":"","org":"","note":"Phục hồi, phá sản doanh nghiệp và hợp tác xã; Luật Phá sản 2014 hết hiệu lực theo Điều 87, trừ trường hợp chuyển tiếp tại Điều 88.","url":"https://vbpl.moj.gov.vn/bocongthuong/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"t":"Luật Bảo vệ quyền lợi người tiêu dùng số 19/2023/QH15","d":"","org":"","note":"Giao dịch thương mại có người tiêu dùng; nghĩa vụ cung cấp thông tin và bảo vệ người tiêu dùng.","url":"https://thuviennhadat.vn/vbpl/luat-bao-ve-quyen-loi-nguoi-tieu-dung-2023-19-2023-qh15-500102.html"},{"t":"Luật Cạnh tranh số 23/2018/QH14","d":"","org":"","note":"Thỏa thuận hạn chế cạnh tranh, lạm dụng vị trí thống lĩnh/vị trí độc quyền và tập trung kinh tế.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=23/2018/QH14&match=True"},{"t":"Luật Giao dịch điện tử số 20/2023/QH15","d":"","org":"","note":"Thông điệp dữ liệu, giao dịch điện tử và giá trị pháp lý của thông tin điện tử.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=20/2023/QH15&match=True"},{"t":"Luật Quản lý ngoại thương số 05/2017/QH14","d":"","org":"","note":"Xuất khẩu, nhập khẩu, tạm nhập tái xuất, chuyển khẩu và hoạt động ngoại thương liên quan.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=05/2017/QH14&match=True"},{"t":"Luật Quảng cáo số 16/2012/QH13 và văn bản sửa đổi/hướng dẫn còn hiệu lực","d":"","org":"","note":"Quảng cáo thương mại; cần đối chiếu các sửa đổi và quy định chuyên ngành tại thời điểm áp dụng.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=16/2012/QH13&match=True"},{"t":"Luật Đấu thầu số 22/2023/QH15 và văn bản sửa đổi, bổ sung","d":"","org":"","note":"Đấu thầu hàng hóa, dịch vụ trong phạm vi điều chỉnh của pháp luật đấu thầu.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=22/2023/QH15&match=True"},{"t":"Luật Thương mại điện tử số 122/2025/QH15 (hiệu lực 01/07/2026)","d":"","org":"","note":"Giao dịch thương mại điện tử; đọc cùng nghị định hướng dẫn và quy định chuyển tiếp.","url":"https://vanban.chinhphu.vn/?classid=1&amp;docid=216503&amp;pageid=27160&amp;typegroupid=3"},{"t":"Nghị định 248/2026/NĐ-CP (hiệu lực 01/07/2026)","d":"","org":"","note":"Quy định chi tiết một số điều của Luật Thương mại điện tử.","url":"https://vanban.chinhphu.vn/?docid=218747&amp;pageid=27160"},{"t":"Văn bản hợp nhất 60/VBHN-VPQH ngày 15/08/2025 về Luật Trọng tài thương mại","d":"","org":"","note":"Bản hợp nhất để tra cứu; không đồng nhất văn bản hợp nhất với một luật sửa đổi độc lập.","url":"https://vanban.chinhphu.vn/?classid=2629&amp;docid=214982&amp;pageid=27160"},{"t":"Luật Đầu tư số 143/2025/QH15 (hiệu lực 01/03/2026)","d":"","org":"","note":"Điều kiện đầu tư kinh doanh và tổ chức kinh tế có vốn đầu tư nước ngoài.","url":"https://vanban.chinhphu.vn/?docid=216524&amp;pageid=27160"}]}],"al":[],"ly":{"root":"Luật Thương mại","ch":[{"t":"Chương 1. Địa vị pháp lý của các chủ thể kinh doanh","cs":"","b":[],"c":[{"t":"Khái quát về thương nhân và hoạt động thương mại","cs":"","b":["Hoạt động thương mại là hoạt động nhằm mục đích sinh lợi, bao gồm mua bán hàng hóa, cung ứng dịch vụ, đầu tư, xúc tiến thương mại và các hoạt động nhằm mục đích sinh lợi khác theo quy định pháp luật. Thương nhân gồm tổ chức kinh tế được thành lập hợp pháp và cá nhân hoạt động thương mại độc lập, thường xuyên, có đăng ký kinh doanh theo điều kiện luật định.","Cần phân biệt hoạt động thương mại (xác định theo tính chất, mục đích của hoạt động), thương nhân (xác định theo tư cách chủ thể) và doanh nghiệp (một loại tổ chức kinh tế được thành lập, đăng ký theo pháp luật doanh nghiệp). Không phải mọi chủ thể tham gia một giao dịch có tính chất thương mại đều mặc nhiên là doanh nghiệp."]},{"t":"Doanh nghiệp và các loại hình doanh nghiệp","cs":"","b":["Doanh nghiệp là tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định pháp luật nhằm mục đích kinh doanh. Việc xác định loại hình doanh nghiệp quyết định cơ cấu tổ chức, chế độ tài sản, quyền quản lý và phạm vi trách nhiệm của chủ sở hữu hoặc thành viên.","Doanh nghiệp tư nhân: Do một cá nhân làm chủ; chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản của mình đối với hoạt động của doanh nghiệp.","Công ty hợp danh: Có thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản theo luật; có thể có thành viên góp vốn chịu trách nhiệm trong phạm vi vốn cam kết góp.","Công ty TNHH: Gồm công ty TNHH một thành viên và từ hai thành viên trở lên; trách nhiệm tài sản của chủ sở hữu/thành viên về nguyên tắc gắn với phần vốn theo luật.","Công ty cổ phần: Vốn điều lệ chia thành cổ phần; có ít nhất ba cổ đông và không hạn chế số lượng tối đa theo luật; cổ đông chịu trách nhiệm trong phạm vi vốn góp."]},{"t":"Hộ kinh doanh và hợp tác xã","cs":"","b":["Hộ kinh doanh và hợp tác xã là các mô hình tổ chức hoạt động kinh doanh có cơ sở pháp lý và chế độ tổ chức riêng, không đồng nhất với các loại hình doanh nghiệp theo Luật Doanh nghiệp. Khi xác định quyền, nghĩa vụ và trách nhiệm tài sản phải áp dụng đúng luật điều chỉnh từng mô hình, không suy rộng quy tắc của công ty sang hộ kinh doanh hoặc hợp tác xã."]},{"t":"Doanh nghiệp nhà nước và doanh nghiệp có vốn đầu tư nước ngoài","cs":"","b":["Việc nhận diện doanh nghiệp nhà nước cần căn cứ tiêu chí sở hữu vốn hoặc quyền chi phối theo Luật Doanh nghiệp. Đối với tổ chức kinh tế có vốn đầu tư nước ngoài, cần đồng thời xem xét pháp luật doanh nghiệp và pháp luật đầu tư, nhất là điều kiện tiếp cận thị trường, thủ tục đầu tư và quy định chuyển tiếp."]},{"t":"Quyền tự do kinh doanh và nguyên tắc pháp luật thương mại","cs":"","b":["Quyền tự do kinh doanh được thực hiện trong khuôn khổ Hiến pháp và pháp luật; ngành, nghề bị cấm và ngành, nghề đầu tư kinh doanh có điều kiện phải được xác định theo văn bản hiện hành. Khi phân tích nguyên tắc pháp luật thương mại, cần xem xét bình đẳng, tự do thỏa thuận trong giới hạn luật, thiện chí và trung thực, bảo vệ lợi ích hợp pháp và các nguyên tắc điều chỉnh hoạt động thương mại quốc tế theo điều ước/hiệp định có liên quan."]},{"t":"Phân loại thương nhân và chế độ trách nhiệm tài sản","cs":"","b":["Phân loại thương nhân cần dựa vào hình thức pháp lý và tư cách hoạt động. Khi so sánh trách nhiệm vô hạn và trách nhiệm hữu hạn, cần xác định tài sản của chủ thể, tư cách thành viên, ngoại lệ do luật quy định và hậu quả khi chấm dứt hoạt động; không đồng nhất trách nhiệm của doanh nghiệp với trách nhiệm của người đại diện."]},{"t":"Thành lập và tổ chức quản lý doanh nghiệp","cs":"","b":["Phân tích quyền thành lập, chủ thể không được quyền thành lập/quản lý theo luật, điều kiện gia nhập thị trường, hồ sơ đăng ký, tên doanh nghiệp, ngành nghề, người đại diện theo pháp luật, cơ cấu quản lý và quyền, nghĩa vụ của chủ sở hữu/thành viên/cổ đông. Đối với doanh nghiệp có điều kiện đầu tư kinh doanh, phải kiểm tra điều kiện chuyên ngành ngoài thủ tục đăng ký doanh nghiệp."]},{"t":"Tổ chức lại, giải thể và phá sản doanh nghiệp","cs":"","b":["Tổ chức lại gồm các hình thức theo luật doanh nghiệp như chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình. Giải thể chỉ được tiến hành khi đáp ứng điều kiện luật định, trong đó có việc thanh toán các khoản nợ và nghĩa vụ tài sản; phá sản được xử lý theo pháp luật về phục hồi, phá sản. Phải xác định luật có hiệu lực tại thời điểm phát sinh sự kiện và quy định chuyển tiếp trước khi tư vấn."]},{"t":"Hợp tác xã","cs":"","b":["Hợp tác xã là mô hình kinh tế tập thể có quy chế thành viên, vốn góp, tài sản, cơ cấu quản lý và cơ chế phân phối riêng. Phân tích địa vị pháp lý phải dựa trực tiếp vào Luật Hợp tác xã 2023 và văn bản hiện hành; không áp dụng máy móc quy tắc về cổ đông công ty cổ phần. Cần xem xét điều kiện gia nhập, quyền và nghĩa vụ thành viên, tổ chức quản lý, tổ chức lại, giải thể và phá sản."]},{"t":"Phá sản doanh nghiệp","cs":"","b":["Phá sản là tình trạng pháp lý được xác định và xử lý theo trình tự luật định khi doanh nghiệp, hợp tác xã mất khả năng thanh toán và bị Tòa án nhân dân ra quyết định tuyên bố phá sản. Cần phân biệt mất khả năng thanh toán với việc chỉ có một khoản nợ đến hạn chưa trả; đồng thời phân biệt phá sản với giải thể về căn cứ, thủ tục và hậu quả pháp lý."]},{"t":"Trọng tâm ôn tập","cs":"","b":["xác định đúng tư cách chủ thể; so sánh chế độ trách nhiệm tài sản; phân biệt doanh nghiệp với hộ kinh doanh, hợp tác xã; phân biệt phá sản với giải thể. Các điều kiện, ngưỡng và thủ tục cụ thể phải đối chiếu văn bản hiện hành."]}]},{"t":"Chương 2. Pháp luật về hợp đồng thương mại và các hoạt động thương mại","cs":"","b":[],"c":[{"t":"Hợp đồng trong hoạt động thương mại","cs":"","b":["Hợp đồng thương mại là thỏa thuận làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ trong hoạt động thương mại. Khi xác định pháp luật áp dụng cần xem xét chủ thể, mục đích giao dịch, loại hoạt động, quy định chuyên ngành và mối quan hệ giữa Luật Thương mại với Bộ luật Dân sự. Không nên chỉ căn cứ tên gọi của hợp đồng để kết luận bản chất pháp lý.","Các vấn đề cần phân tích gồm: chủ thể và thẩm quyền đại diện; đề nghị và chấp nhận giao kết; hình thức; nội dung và điều kiện có hiệu lực; thực hiện nghĩa vụ; sửa đổi, chấm dứt; vi phạm và trách nhiệm pháp lý. Hình thức hợp đồng phải tuân theo quy định chung và yêu cầu riêng của từng loại giao dịch."]},{"t":"Hợp đồng thương mại quốc tế và nguồn luật","cs":"","b":["Với hợp đồng có yếu tố nước ngoài, cần xác định phạm vi lựa chọn luật, điều ước quốc tế có thể áp dụng, quy phạm xung đột và tập quán được viện dẫn. CISG 1980 có thể điều chỉnh hợp đồng mua bán hàng hóa quốc tế khi thỏa điều kiện áp dụng; không mặc nhiên áp dụng cho mọi hợp đồng thương mại. PICC 2016 là bộ nguyên tắc hợp đồng thương mại quốc tế, cần xác định cơ sở vận dụng trong từng giao dịch.","Incoterms 2020 của ICC phân bổ một số nghĩa vụ giao hàng, chi phí và rủi ro theo điều kiện được các bên viện dẫn; không thay thế toàn bộ hợp đồng và không tự quyết định mọi vấn đề về chuyển quyền sở hữu hoặc hiệu lực hợp đồng. UCP 600, URC 522 và ISP98 là các quy tắc thực hành ngân hàng quốc tế có thể liên quan đến tín dụng chứng từ, nhờ thu và cam kết dự phòng khi được dẫn chiếu/áp dụng phù hợp."]},{"t":"Mua bán hàng hóa","cs":"","b":["Hợp đồng mua bán hàng hóa làm phát sinh nghĩa vụ giao hàng, chuyển quyền sở hữu theo thỏa thuận và quy định pháp luật, đồng thời phát sinh nghĩa vụ thanh toán và tiếp nhận hàng. Khi giải quyết tranh chấp cần kiểm tra mô tả hàng hóa, số lượng, chất lượng, giá, thời hạn và địa điểm giao nhận, chứng từ, kiểm tra hàng hóa, chuyển rủi ro, bảo hành và khiếu nại."]},{"t":"Cung ứng dịch vụ","cs":"","b":["Trong hợp đồng cung ứng dịch vụ, bên cung ứng thực hiện dịch vụ và nhận thanh toán; bên sử dụng dịch vụ có nghĩa vụ phối hợp, cung cấp thông tin cần thiết và thanh toán theo thỏa thuận, pháp luật. Nội dung hợp đồng cần xác định rõ phạm vi công việc, tiêu chuẩn chất lượng, sản phẩm bàn giao, thời hạn, nghiệm thu, bảo mật và trách nhiệm khi không đạt yêu cầu."]},{"t":"Trung gian thương mại","cs":"","b":["Các hoạt động trung gian thương mại theo Luật Thương mại gồm đại diện cho thương nhân, môi giới thương mại, ủy thác mua bán hàng hóa và đại lý thương mại. Phải phân biệt căn cứ đại diện, việc nhân danh ai khi giao dịch, quyền hưởng thù lao và trách nhiệm với bên thứ ba; tên gọi gần nhau không làm các chế định này trở thành một."]},{"t":"Xúc tiến thương mại","cs":"","b":["Nhóm hoạt động xúc tiến thương mại gồm khuyến mại, quảng cáo thương mại, trưng bày, giới thiệu hàng hóa, dịch vụ và hội chợ, triển lãm thương mại. Mỗi hình thức có mục đích và điều kiện riêng; ngoài Luật Thương mại cần đối chiếu pháp luật quảng cáo, bảo vệ quyền lợi người tiêu dùng và các quy định chuyên ngành có liên quan."]},{"t":"Logistics và các hoạt động thương mại khác","cs":"","b":["Dịch vụ logistics gắn với một hoặc nhiều công việc như nhận hàng, vận chuyển, lưu kho, lưu bãi, làm thủ tục và các dịch vụ hỗ trợ hàng hóa theo thỏa thuận và pháp luật. Khi phân tích trách nhiệm cần làm rõ phạm vi dịch vụ, tư cách các bên, giới hạn trách nhiệm nếu được pháp luật cho phép, sự kiện miễn trách nhiệm và nghĩa vụ thông báo.","Đối với đấu giá hàng hóa, gia công trong thương mại, quá cảnh, tạm nhập tái xuất, chuyển khẩu và các hoạt động khác thuộc đề cương, cần xác định luật chung và luật chuyên ngành áp dụng cho từng loại hình. Không dùng một quy tắc duy nhất cho mọi hoạt động thương mại."]},{"t":"Đấu giá và đấu thầu hàng hóa, dịch vụ","cs":"","b":["Đấu giá và đấu thầu là các cơ chế khác nhau về mục tiêu, vai trò các bên, trình tự và tiêu chí lựa chọn. Khi xử lý tình huống phải xác định hoạt động thuộc phạm vi Luật Thương mại hay pháp luật đấu thầu chuyên ngành; không áp dụng một trình tự chung cho cả hai."]},{"t":"Nhượng quyền thương mại","cs":"","b":["Phân tích quyền sử dụng mô hình kinh doanh, nhãn hiệu/hệ thống nhận diện, phí nhượng quyền, hỗ trợ kỹ thuật, kiểm soát chất lượng và nghĩa vụ công bố thông tin theo luật. Điều khoản bảo mật, không cạnh tranh và hạn chế cạnh tranh cần được xem xét cùng pháp luật sở hữu trí tuệ, cạnh tranh và quy định bắt buộc có liên quan."]},{"t":"Trọng tâm ôn tập","cs":"","b":["Phương pháp xử lý bài tập: (1) định danh giao dịch; (2) xác định chủ thể và thẩm quyền; (3) tìm luật điều chỉnh; (4) xác định nghĩa vụ chính; (5) đối chiếu hành vi thực tế với nghĩa vụ; (6) xác định hậu quả và cơ chế giải quyết tranh chấp."]}]},{"t":"Chương 3. Chế tài thương mại","cs":"","b":[],"c":[{"t":"Khái niệm, đặc điểm chế tài thương mại","cs":"","b":["Chế tài thương mại là hậu quả pháp lý áp dụng với bên vi phạm trong quan hệ thương mại khi có đủ căn cứ luật định hoặc thỏa thuận hợp pháp. Cần xác định quan hệ hợp đồng, luật điều chỉnh, nghĩa vụ cụ thể, hành vi vi phạm, chứng cứ và quyền yêu cầu; phân biệt chế tài theo Luật Thương mại với trách nhiệm dân sự nói chung."]},{"t":"Căn cứ áp dụng chế tài","cs":"","b":["Đối chiếu điều khoản hợp đồng với nghĩa vụ thực tế, thời hạn, chất lượng, thông báo/khiếu nại và tài liệu chứng minh. Không kết luận chỉ từ việc một bên không hài lòng; phải xác định vi phạm và căn cứ pháp lý tương ứng.","Điều kiện áp dụng phụ thuộc từng chế tài. Xem xét quy định miễn trách nhiệm, điều khoản phạt, giới hạn hoặc loại trừ trách nhiệm trong phạm vi luật cho phép; thỏa thuận không đương nhiên có hiệu lực nếu trái quy định bắt buộc."]},{"t":"Các hình thức chế tài thương mại","cs":"","b":["Yêu cầu bên vi phạm tiếp tục thực hiện đúng nghĩa vụ hoặc áp dụng biện pháp khắc phục theo luật; xác định nghĩa vụ còn có thể thực hiện, cách sửa chữa/thay thế và chi phí phát sinh.","Phạt vi phạm: cần có thỏa thuận phạt hợp pháp. Theo Điều 301 Luật Thương mại 2005, mức phạt thông thường không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm, trừ trường hợp luật quy định khác.","Bồi thường: xem xét hành vi vi phạm, thiệt hại thực tế, quan hệ nhân quả trực tiếp và chứng cứ; bên yêu cầu phải chứng minh tổn thất, đồng thời thực hiện nghĩa vụ hạn chế tổn thất. Phạt và bồi thường có thể cùng được yêu cầu nếu đáp ứng điều kiện luật định và thỏa thuận.","Tạm ngừng là tạm thời không thực hiện nghĩa vụ; đình chỉ chấm dứt thực hiện hợp đồng theo điều kiện luật định; hủy bỏ làm phát sinh hậu quả pháp lý riêng đối với hiệu lực và nghĩa vụ hoàn trả. Phải phân biệt căn cứ, thời điểm có hiệu lực, nghĩa vụ thông báo và hậu quả."]},{"t":"Miễn trách nhiệm trong thương mại","cs":"","b":["Kiểm tra các trường hợp miễn trách nhiệm theo Luật Thương mại, gồm trường hợp đã thỏa thuận hợp lệ, bất khả kháng, vi phạm hoàn toàn do lỗi của bên kia và trường hợp thực hiện quyết định của cơ quan nhà nước có thẩm quyền trong điều kiện luật định. Bên viện dẫn phải chứng minh căn cứ và tuân thủ nghĩa vụ thông báo. Khó khăn kinh tế hoặc chi phí tăng không tự động là bất khả kháng."]},{"t":"Đối chiếu pháp luật hợp đồng quốc tế","cs":"","b":["CISG áp dụng cho hợp đồng mua bán hàng hóa quốc tế thuộc phạm vi Công ước; PICC 2016 được vận dụng theo cơ chế pháp lý thích hợp, không tự động thay luật quốc gia. Trọng tâm so sánh: vi phạm cơ bản, dự liệu thiệt hại, hạn chế tổn thất và nguyên tắc ưu tiên bảo tồn hợp đồng. Force majeure và hardship là hai vấn đề khác nhau, cần xét theo văn bản được áp dụng."]},{"t":"Trọng tâm ôn tập","cs":"","b":["Trình tự phân tích: luật áp dụng → nghĩa vụ → vi phạm → căn cứ chế tài → miễn trách nhiệm → thiệt hại/chứng cứ → thông báo và thời hạn."]}]},{"t":"Chương 4. Giải quyết tranh chấp thương mại","cs":"","b":[],"c":[{"t":"Tranh chấp thương mại","cs":"","b":["Tranh chấp thương mại là bất đồng về quyền, nghĩa vụ hoặc lợi ích liên quan đến hoạt động thương mại. Định danh dựa trên quan hệ thực tế, chủ thể, yêu cầu và quy phạm xác định thẩm quyền, không chỉ dựa vào tên gọi của vụ việc.","Nguyên nhân có thể đến từ quản trị, thông tin, thực hiện nghĩa vụ hoặc yếu tố thị trường, chuỗi cung ứng, chính sách. Hồ sơ cần xác định chủ thể, quan hệ pháp luật, nghĩa vụ tranh chấp, yêu cầu, chứng cứ, luật áp dụng, phương thức giải quyết và khả năng thi hành."]},{"t":"Giải quyết tranh chấp trong nước","cs":"","b":["Thương lượng: các bên tự trao đổi, linh hoạt nhưng phụ thuộc thiện chí. Hòa giải: người thứ ba trung lập hỗ trợ các bên tự nguyện tìm giải pháp; phân biệt hòa giải thương mại theo Nghị định 22/2017/NĐ-CP với hòa giải trong tố tụng. Trọng tài: cần thỏa thuận trọng tài hợp lệ và tranh chấp thuộc thẩm quyền; phán quyết có tính chung thẩm theo luật. Tòa án: giải quyết theo thẩm quyền và thủ tục tố tụng, kết quả có thể được cưỡng chế thi hành.","Nguyên tắc gồm tự nguyện, bình đẳng, bảo mật theo quy định, độc lập và vô tư của hòa giải viên, thỏa thuận không trái luật và đạo đức xã hội. Trình tự gồm yêu cầu, lựa chọn hòa giải viên, chuẩn bị, phiên hòa giải và ghi nhận kết quả. Phân biệt thỏa thuận hòa giải thành với quyết định được công nhận hoặc thi hành theo cơ chế pháp luật tương ứng. Công ước Singapore 2019 chỉ áp dụng trong phạm vi điều kiện của Công ước; không suy đoán tình trạng thành viên của Việt Nam.","Phân biệt trọng tài quy chế và trọng tài vụ việc; kiểm tra hình thức, hiệu lực và phạm vi thỏa thuận trọng tài, thẩm quyền, việc thành lập hội đồng, thủ tục, phán quyết và chi phí. Nguyên tắc kompetenz-kompetenz liên quan quyền hội đồng trọng tài xem xét thẩm quyền của mình, không loại trừ vai trò Tòa án trong trường hợp luật quy định. Thủ tục hủy phán quyết không phải xét xử lại nội dung như phúc thẩm.","Tòa án giải quyết tranh chấp thuộc thẩm quyền và hỗ trợ/giám sát trọng tài trong phạm vi luật quy định, như biện pháp khẩn cấp, một số vấn đề chứng cứ, hủy phán quyết hoặc công nhận và thi hành phán quyết nước ngoài. Phải xác định đúng căn cứ, thủ tục và văn bản có hiệu lực tại thời điểm xử lý."]},{"t":"Giải quyết tranh chấp thương mại quốc tế","cs":"","b":["DSU là cơ chế giải quyết tranh chấp giữa các thành viên WTO, không phải cơ chế xử lý tranh chấp hợp đồng tư nhân. Phân tích tham vấn, hội thẩm, thông qua báo cáo, thực hiện khuyến nghị và vấn đề thực tiễn của cơ chế phúc thẩm.","Kiểm tra điều khoản chọn luật, chọn Tòa án/trọng tài, địa điểm, ngôn ngữ, tống đạt, bảo toàn chứng cứ và khả năng thi hành. Khi không có thỏa thuận chọn luật, áp dụng quy phạm xung đột thích hợp và yếu tố kết nối; luật nơi ký hợp đồng không đương nhiên luôn được áp dụng.","Công ước New York 1958 điều chỉnh công nhận và thi hành phán quyết trọng tài nước ngoài trong phạm vi áp dụng. Công nhận bản án Tòa án nước ngoài theo cơ chế khác. Xác định nguồn gốc quyết định, điều ước liên quan, thẩm quyền, thủ tục và căn cứ từ chối theo pháp luật áp dụng."]},{"t":"Trọng tâm ôn tập","cs":"","b":["Chọn phương thức: kiểm tra thỏa thuận giải quyết tranh chấp, thời hiệu, chi phí, tốc độ, bảo mật, biện pháp khẩn cấp, yếu tố nước ngoài và khả năng thi hành."]}]}]}}</script>
