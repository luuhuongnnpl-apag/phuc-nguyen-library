","Doanh nghiệp chỉ gồm cá nhân kinh doanh","Doanh nghiệp là một loại tổ chức kinh tế; thương nhân là tư cách chủ thể theo luật thương mại","Thương nhân không bao giờ là pháp nhân"],"a":2,"e":"Doanh nghiệp và thương nhân thuộc hai tiêu chí pháp lý khác nhau; một doanh nghiệp có thể là thương nhân nhưng hai khái niệm không đồng nhất.","b":"Luật Thương mại 2005; Luật Doanh nghiệp"},{"id":"TM004","g":1,"lv":"NB","q":"Chủ doanh nghiệp tư nhân chịu trách nhiệm về nghĩa vụ của doanh nghiệp như thế nào?","o":["Trong phạm vi vốn điều lệ đã đăng ký","Bằng toàn bộ tài sản của mình theo luật","Chỉ bằng tài sản doanh nghiệp","Không chịu trách nhiệm cá nhân"],"a":1,"e":"Doanh nghiệp tư nhân không có sự tách biệt trách nhiệm hữu hạn như công ty TNHH hoặc công ty cổ phần.","b":"Luật Doanh nghiệp"},{"id":"TM005","g":1,"lv":"NB","q":"Trong công ty hợp danh, chủ thể nào chịu trách nhiệm vô hạn theo chế độ thành viên hợp danh?","o":["Thành viên hợp danh","Mọi người lao động","Chủ nợ","Mọi thành viên góp vốn"],"a":0,"e":"Thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản theo quy định; thành viên góp vốn có chế độ trách nhiệm khác.","b":"Luật Doanh nghiệp"},{"id":"TM006","g":1,"lv":"NB","q":"Đặc điểm nào gắn với công ty cổ phần?","o":["Vốn điều lệ không chia thành phần","Chỉ có một cổ đông","Vốn điều lệ chia thành cổ phần","Cổ đông luôn chịu trách nhiệm vô hạn"],"a":2,"e":"Vốn điều lệ công ty cổ phần được chia thành cổ phần; trách nhiệm của cổ đông về nguyên tắc trong phạm vi vốn góp.","b":"Luật Doanh nghiệp"},{"id":"TM007","g":1,"lv":"TH","q":"Điểm phân biệt chính giữa giải thể và phá sản là gì?","o":["Hai thủ tục có cùng căn cứ và hậu quả","Phá sản luôn do chủ sở hữu tự quyết định","Giải thể chỉ do Tòa án tuyên bố","Phá sản gắn với mất khả năng thanh toán và thủ tục tư pháp; giải thể có căn cứ, trình tự riêng"],"a":3,"e":"Cần phân biệt căn cứ, cơ quan/thủ tục và hậu quả pháp lý của hai cơ chế chấm dứt hoạt động.","b":"Luật Doanh nghiệp; pháp luật về phục hồi, phá sản"},{"id":"TM008","g":1,"lv":"TH","q":"Khi xác định địa vị pháp lý của hộ kinh doanh, cách tiếp cận nào phù hợp?","o":["Áp dụng nguyên xi mọi quy định về công ty cổ phần","Xác định đúng quy định riêng điều chỉnh hộ kinh doanh và thời điểm áp dụng","Mặc nhiên coi hộ kinh doanh là công ty TNHH","Bỏ qua chủ thể đứng tên đăng ký"],"a":1,"e":"Không nên suy rộng chế độ tổ chức và trách nhiệm của doanh nghiệp sang hộ kinh doanh.","b":"Pháp luật về đăng ký kinh doanh; Luật Doanh nghiệp"},{"id":"TM009","g":1,"lv":"NB","q":"Đối với hợp tác xã, nguồn luật nào cần được xem xét trực tiếp?","o":["Chỉ Luật Doanh nghiệp","Chỉ Bộ luật Hình sự","Luật Hợp tác xã và văn bản hướng dẫn còn hiệu lực","Chỉ điều lệ do thành viên tự soạn"],"a":2,"e":"Hợp tác xã có khuôn khổ pháp lý riêng; điều lệ không thể thay thế quy phạm bắt buộc.","b":"Luật Hợp tác xã 2023"},{"id":"TM010","g":1,"lv":"TH","q":"Khi đánh giá quyền tự do kinh doanh, nhận định nào đúng?","o":["Là quyền tuyệt đối, không có giới hạn","Chỉ doanh nghiệp nhà nước có quyền này","Chỉ được kinh doanh ngành nghề được liệt kê là cấm","Được kinh doanh ngành nghề luật không cấm nhưng phải đáp ứng điều kiện và giới hạn hợp pháp"],"a":3,"e":"Tự do kinh doanh được thực hiện trong khuôn khổ Hiến pháp và pháp luật; ngành nghề đầu tư kinh doanh có điều kiện phải đáp ứng điều kiện tương ứng.","b":"Hiến pháp; Luật Đầu tư"},{"id":"TM011","g":1,"lv":"TH","q":"Khi xem xét doanh nghiệp có vốn đầu tư nước ngoài, cần phối hợp áp dụng nhóm pháp luật nào?","o":["Chỉ quy định nội bộ doanh nghiệp","Pháp luật doanh nghiệp và đầu tư, cùng điều kiện tiếp cận thị trường và quy định chuyên ngành khi có liên quan","Chỉ Bộ luật Dân sự","Chỉ pháp luật về thuế"],"a":1,"e":"Tư cách doanh nghiệp và điều kiện đầu tư là các vấn đề liên quan nhưng không trùng nhau.","b":"Luật Doanh nghiệp; Luật Đầu tư"},{"id":"TM012","g":1,"lv":"NB","q":"Việc đăng ký doanh nghiệp có ý nghĩa pháp lý trọng yếu nào?","o":["Tạo cơ sở xác lập tư cách pháp lý của doanh nghiệp theo quy định","Tự động mi "Tên gọi không quyết định hoàn toàn bản chất; cần phân loại quan hệ và xác định luật chuyên ngành, quy định chung cùng quan hệ giữa chúng.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM017","g":2,"lv":"NB","q":"Điều khoản nào giúp giảm tranh chấp về đối tượng hợp đồng mua bán?","o":["Mô tả hàng hóa, số lượng, chất lượng và tiêu chuẩn nghiệm thu rõ ràng","Chỉ ghi tên người bán","Không lưu chứng từ giao nhận","Ghi giá nhưng không xác định hàng hóa"],"a":0,"e":"Mô tả cụ thể đối tượng và tiêu chí nghiệm thu giúp xác định nghĩa vụ và đánh giá việc thực hiện.","b":"Luật Thương mại 2005"},{"id":"TM018","g":2,"lv":"NB","q":"Trong hợp đồng cung ứng dịch vụ, nội dung nào cần được xác định rõ?","o":["Chỉ tên người đại diện","Chỉ địa chỉ trụ sở","Chỉ màu sắc thương hiệu","Phạm vi công việc, tiêu chuẩn, thời hạn, nghiệm thu và phí dịch vụ"],"a":3,"e":"Các điều khoản về phạm vi, tiêu chuẩn và nghiệm thu giúp xác định chất lượng thực hiện và nghĩa vụ thanh toán.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM019","g":2,"lv":"NB","q":"Đặc điểm cốt lõi của đại diện cho thương nhân là gì?","o":["Người trung gian chỉ cung cấp địa chỉ liên hệ","Một thương nhân nhận ủy nhiệm để thực hiện hoạt động thương mại nhân danh thương nhân giao đại diện trong phạm vi đại diện","Bên trung gian luôn mua hàng để bán lại nhân danh mình","Đại diện không cần xác định phạm vi"],"a":1,"e":"Cần nhận diện việc nhân danh thương nhân giao đại diện và phạm vi đại diện theo hợp đồng, luật.","b":"Luật Thương mại 2005"},{"id":"TM020","g":2,"lv":"TH","q":"Môi giới thương mại khác đại diện cho thương nhân ở điểm nào?","o":["Môi giới luôn trở thành chủ sở hữu hàng hóa","Môi giới luôn ký hợp đồng nhân danh bên được môi giới","Môi giới làm trung gian cho các bên đàm phán, giao kết; không mặc nhiên nhân danh bên nào để giao kết","Môi giới không được nhận thù lao"],"a":2,"e":"Môi giới chủ yếu làm trung gian kết nối, hỗ trợ đàm phán/giao kết; không đồng nhất với đại diện.","b":"Luật Thương mại 2005"},{"id":"TM021","g":2,"lv":"NB","q":"Trong ủy thác mua bán hàng hóa, bên nhận ủy thác thường thực hiện giao dịch theo cách nào?","o":["Nhân danh chính mình theo điều kiện ủy thác và nhận thù lao","Luôn nhân danh bên ủy thác như đại diện","Không được ký hợp đồng","Chỉ làm nhiệm vụ vận chuyển"],"a":0,"e":"Ủy thác mua bán hàng hóa có cơ chế nhân danh bên nhận ủy thác, khác với đại diện cho thương nhân.","b":"Luật Thương mại 2005"},{"id":"TM022","g":2,"lv":"NB","q":"Trong đại lý thương mại, quan hệ pháp lý cơ bản là gì?","o":["Đại lý luôn là người lao động của bên giao đại lý","Bên đại lý chỉ được làm môi giới","Bên giao đại lý chuyển toàn bộ tư cách pháp nhân cho đại lý","Bên đại lý nhân danh mình mua/bán hoặc cung ứng dịch vụ cho bên giao đại lý theo thỏa thuận"],"a":3,"e":"Cần xác định hình thức đại lý và quyền, nghĩa vụ cụ thể theo hợp đồng và Luật Thương mại.","b":"Luật Thương mại 2005"},{"id":"TM023","g":2,"lv":"NB","q":"Hoạt động nào thuộc nhóm xúc tiến thương mại được Luật Thương mại điều chỉnh?","o":["Phát hành bản án của Tòa án","Khuyến mại, quảng cáo thương mại, trưng bày giới thiệu và hội chợ triển lãm","Đăng ký khai sinh","Cấp giấy chứng nhận quyền sử dụng đất"],"a":1,"e":"Các hình thức xúc tiến thương mại được quy định trong Luật Thương mại và chịu thêm quy định chuyên ngành khi liên quan.","b":"Luật Thương mại 2005"},{"id":"TM024","g":2,"lv":"TH","q":"Khi xác định trách nhiệm trong dịch vụ logistics, yếu tố nào đặc biệt quan trọng?","o":["Chỉ màu sắc bao bì","Chỉ quốc tịch người nhận hàng","Phạm vi dịch vụ, chứng từ, thời điểm nhận/giao và giới hạn trách nhiệm theo luật","Không cần xem hợp đồng"],"a":2,"e":"Trách nhiệm phụ thuộc phạm vi dịch vụ, chứng cứ, thỏa thuận hợp pháp và giới hạn luật định.","b":"Luật Thương mại 2005"},{"id":"TM025","g":2,"lv":"NB","q":"Trong mua bán hàng hóa, chuyển giao rủi ro và chuyển quyền sở hữu có quan hệ thế nào?","o":["Luôn diễn ra cùng thời điểm trong mọi trường hợp","Không có ý nghĩa pháp lý","Luôn xảy ra khi người mua đặt hàng","Là hai vấn đề pháp lý riêng, thời điểm xác định theo luật và thỏa thuận"],"a":3,"e":"Không đồng nhất thời điểm chuyển rủi ro với thời điểm chuyển quyền sở hữu; cần kiểm tra điều khoản và quy định áp dụng.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM026","g":2,"lv":"NB","q":"Incoterms 2020 chủ yếu điều chỉnh vấn đề gì?","o":["Một bộ quy tắc về điều kiện giao hàng, phân bổ chi phí và rủi ro trong mua bán hàng hóa khi được đưa vào hợp đồng","Tư cách pháp nhân của doanh nghiệp","Tội phạm thương mại","Thẩm quyền của Tòa án trong mọi tranh chấp"],"a":0,"e":"Incoterms không thay thế toàn bộ hợp đồng hoặc luật áp dụng; hiệu lực phụ thuộc việc các bên viện dẫn và phạm vi điều khoản.","b":"Incoterms 2020, ICC"},{"id":"TM027","g":2,"lv":"NB","q":"CISG 1980 có phạm vi trọng tâm nào?","o":["Mọi loại dịch vụ trong nước","Mọi hợp đồng lao động","Hợp đồng mua bán hàng hóa quốc tế thuộc phạm vi Công ước","Mọi quan hệ về thành lập doanh nghiệp"],"a":2,"e":"CISG tập trung vào hợp đồng mua bán hàng hóa quốc tế theo các điều kiện áp dụng của Công ước.","b":"CISG 1980"},{"id":"TM028","g":2,"lv":"TH","q":"Khi giao kết hợp đồng bằng phương tiện điện tử, cần kiểm tra điều gì?","o":["Mặc nhiên vô hiệu vì không ký giấy","Điều kiện pháp lý về thông điệp dữ liệu, xác thực, thời điểm gửi/nhận và yêu cầu hình thức chuyên biệt","Chỉ kiểm tra màu nền email","Chỉ căn cứ việc có bản in"],"a":1,"e":"Giao dịch điện tử có thể đáp ứng yêu cầu văn bản nếu thỏa điều kiện luật định; vẫn cần kiểm tra hình thức bắt buộc riêng của loại giao dịch.","b":"Luật Giao dịch điện tử 2023; Luật Thương mại điện tử 2025"},{"id":"TM029","g":2,"lv":"NB","q":"Trong hợp đồng nhượng quyền thương mại, nội dung nào cần quan tâm?","o":["Chỉ tên cửa hàng","Chỉ số lượng nhân viên","Chỉ tài khoản mạng xã hội","Quyền sử dụng mô hình/đối tượng nhượng quyền, phí, hỗ trợ, kiểm soát chất lượng và nghĩa vụ các bên"],"a":3,"e":"Quan hệ nhượng quyền thường liên quan hệ thống kinh doanh, quyền sở hữu trí tuệ, phí và nghĩa vụ hỗ trợ/kiểm soát.","b":"Luật Thương mại 2005"},{"id":"TM030","g":2,"lv":"TH","q":"Khi xem xét điều khoản lựa chọn luật trong hợp đồng quốc tế, nhận định nào phù hợp?","o":["Cần kiểm tra hiệu lực của điều khoản, phạm vi lựa chọn và các quy phạm bắt buộc có liên quan","Luật nơi ký hợp đồng luôn áp dụng","Các bên có thể loại trừ mọi quy phạm bắt buộc","Không cần xác định yếu tố nước ngoài"],"a":0,"e":"Lựa chọn luật phải được đánh giá theo quy phạm xung đột và giới hạn của pháp luật áp dụng.","b":"Bộ luật Dân sự 2015; điều ước liên quan"},{"id":"TM031","g":3,"lv":"NB","q":"Theo Luật Thương mại, phạt vi phạm hợp đồng được áp dụng khi nào?","o":["Trong mọi trường hợp dù không có thỏa thuận","Chỉ khi có thỏa thuận phạt hợp pháp và đủ điều kiện áp dụng","Chỉ khi Tòa án tự đặt mức phạt","Chỉ với hợp đồng mua bán quốc tế"],"a":1,"e":"Thỏa thuận phạt là điều kiện quan trọng; cần xem nội dung hợp đồng và quy định bắt buộc.","b":"Luật Thương mại 2005, Điều 300"},{"id":"TM032","g":3,"lv":"NB","q":"Mức phạt vi phạm thông thường theo Điều 301 Luật Thương mại 2005 được giới hạn thế nào?","o":["Không quá 50% toàn bộ giá trị hợp đồng","Không có giới hạn nào","Không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm, trừ trường hợp luật quy định khác","Luôn bằng thiệt hại thực tế"],"a":2,"e":"Điều 301 đặt mức trần thông thường là 8% giá trị phần nghĩa vụ bị vi phạm; cần kiểm tra trường hợp luật quy định khác.","b":"Luật Thương mại 2005, Điều 301"},{"id":"TM033","g":3,"lv":"VD","q":"Một bên yêu cầu bồi thường thiệt hại do vi phạm hợp đồng thương mại cần tập trung chứng minh điều gì?","o":["Chỉ việc hợp đồng đã ký","Chỉ sự không hài lòng","Chỉ lỗi đạo đức của bên kia","Hành vi vi phạm, thiệt hại thực tế và quan hệ nhân quả trực tiếp theo luật"],"a":3,"e":"Cần chứng minh các yếu tố luật định; thiệt hại không tự động được suy ra từ hành vi vi phạm.","b":"Luật Thương mại 2005, Điều 303"},{"id":"TM034","g":3,"lv":"NB","q":"Nghĩa vụ hạn chế tổn thất có ý nghĩa gì?","o":["Bên bị vi phạm phải áp dụng biện pháp hợp lý để hạn chế tổn thất; phần tổn thất có thể hạn chế được xử lý theo luật","Bên bị vi phạm được để thiệt hại tăng không giới hạn","Chỉ bên vi phạm có nghĩa vụ","Nghĩa vụ này chỉ áp dụng cho hợp đồng lao động"],"a":0,"e":"Bên yêu cầu bồi thường phải thực hiện nghĩa vụ hạn chế tổn thất theo quy định; đây là yếu tố ảnh hưởng phạm vi bồi thường.","b":"Luật Thương mại 2005, Điều 305; CISG Điều 77"},{"id":"TM035","g":3,"lv":"NB","q":"Biện pháp nào là chế tài tạm ngừng thực hiện hợp đồng?","o":["Hợp đồng tự động vô hiệu từ ngày ký","Bên vi phạm luôn bị giải thể","Tạm thời không thực hiện nghĩa vụ khi đủ căn cứ luật định hoặc thỏa thuận","Chuyển tranh chấp cho trọng tài"],"a":2,"e":"Tạm ngừng là chế tài có tính tạm thời, khác với đình chỉ và hủy bỏ hợp đồng.","b":"Luật Thương mại 2005"},{"id":"TM036","g":3,"lv":"TH","q":"Hủy bỏ hợp đồng khác đình chỉ thực hiện hợp đồng chủ yếu ở điểm nào?","o":["Hai chế tài luôn có hậu quả giống hệt nhau","Hủy bỏ kéo theo hậu quả pháp lý riêng đối với hiệu lực hợp đồng và hoàn trả theo luật; đình chỉ chấm dứt thực hiện từ thời điểm luật định","Đình chỉ luôn làm hợp đồng vô hiệu từ đầu","Hủy bỏ chỉ là lời nhắc thực hiện"],"a":1,"e":"Phải phân biệt căn cứ, thời điểm phát sinh hậu quả và nghĩa vụ hoàn trả theo từng chế tài.","b":"Luật Thương mại 2005"},{"id":"TM037","g":3,"lv":"NB","q":"Trường hợp nào có thể là căn cứ miễn trách nhiệm theo Luật Thương mại nếu đáp ứng điều kiện luật định?","o":["Doanh nghiệp không còn muốn thực hiện hợp đồng","Giá thị trường giảm nhẹ","Nhân sự nghỉ phép","Sự kiện bất khả kháng được chứng minh và tuân thủ nghĩa vụ liên quan"],"a":3,"e":"Không phải mọi khó khăn đều là bất khả kháng; bên viện dẫn phải đáp ứng điều kiện và nghĩa vụ chứng minh/thông báo.","b":"Luật Thương mại 2005, Điều 294–295"},{"id":"TM038","g":3,"lv":"NB","q":"Trong Luật Thương mại, khi bên bị vi phạm yêu cầu cả phạt vi phạm và bồi thường thiệt hại, cách xử lý nào đúng?","o":["Kiểm tra thỏa thuận phạt, căn cứ bồi thường và quy định về áp dụng đồng thời","Luôn chỉ được chọn một chế tài","Luôn được nhận cả hai không cần điều kiện","Tòa án không được xem xét thỏa thuận"],"a":0,"e":"Việc áp dụng đồng thời phụ thuộc điều kiện luật định và thỏa thuận, không thể khẳng định tuyệt đối cho mọi trường hợp.","b":"Luật Thương mại 2005, Điều 307"},{"id":"TM039","g":3,"lv":"NB","q":"Vi phạm cơ bản trong CISG có vai trò gì?","o":["Là căn cứ tự động giải thể doanh nghiệp","Chỉ dùng trong tranh chấp lao động","Có ý nghĩa đối với quyền áp dụng một số biện pháp như tuyên bố hủy hợp đồng theo điều kiện Công ước","Là thuật ngữ đồng nghĩa với mọi sai sót nhỏ"],"a":2,"e":"CISG có tiêu chí vi phạm cơ bản riêng; cần phân tích hậu quả nghiêm trọng theo Công ước và các điều kiện tương ứng.","b":"CISG 1980, Điều 25"},{"id":"TM040","g":3,"lv":"TH","q":"Bất khả kháng và hardship có phải là một khái niệm đồng nhất?","o":["Có, luôn tạo cùng một hậu quả","Không; hardship liên quan thay đổi căn bản làm mất cân bằng hợp đồng theo quy tắc áp dụng, còn bất khả kháng tập trung vào trở ngại miễn trách nhiệm","Có, chỉ khác cách viết","Không khái niệm nào được sử dụng trong thương mại quốc tế"],"a":1,"e":"Hai khái niệm có điều kiện và hậu quả khác nhau; phải xác định văn bản/điều khoản điều chỉnh.","b":"PICC 2016; hợp đồng và luật áp dụng"},{"id":"TM041","g":3,"lv":"NB","q":"Điều khoản giới hạn trách nhiệm cần được đánh giá như thế nào?","o":["Mặc nhiên có hiệu lực tuyệt đối","Chỉ cần in đậm","Không cần xác định phạm vi thiệt hại","Kiểm tra cách hình thành, phạm vi, quy định bắt buộc và giới hạn pháp lý áp dụng"],"a":3,"e":"Hiệu lực phụ thuộc nội dung, hoàn cảnh giao kết và các giới hạn của luật áp dụng.","b":"Luật Thương mại 2005; Bộ luật Dân sự 2015"},{"id":"TM042","g":3,"lv":"TH","q":"Khi viện dẫn miễn trách nhiệm, bên viện dẫn nên làm gì?","o":["Thu thập chứng cứ về sự kiện, quan hệ nhân quả, tác động và thực hiện nghĩa vụ thông báo theo luật","Chỉ gửi tin nhắn không nêu lý do","Xóa hồ sơ giao dịch","Chờ đến khi tranh chấp kết thúc mới thông báo trong mọi trường hợp"],"a":0,"e":"Nghĩa vụ chứng minh và thông báo có vai trò quan trọng khi viện dẫn miễn trách nhiệm.","b":"Luật Thương mại 2005, Điều 295"},{"id":"TM043","g":3,"lv":"TH","q":"Theo cách tiếp cận hợp lý, thiệt hại được yêu cầu bồi thường phải được xử lý ra sao?","o":["Chấp nhận toàn bộ con số bên yêu cầu nêu","Không cần chứng từ","Đánh giá tính thực tế, trực tiếp, quan hệ nhân quả, khả năng dự liệu nếu luật áp dụng yêu cầu và nghĩa vụ hạn chế tổn thất","Chỉ dựa vào lời khai của bên vi phạm"],"a":2,"e":"Phải đánh giá chứng cứ và các yếu tố pháp lý áp dụng, không mặc nhiên chấp nhận số tiền yêu cầu.","b":"Luật Thương mại 2005; CISG nếu áp dụng"},{"id":"TM044","g":3,"lv":"NB","q":"Nguyên tắc favor contractus trong thảo luận về hợp đồng quốc tế thường nhấn mạnh điều gì?","o":["Ưu tiên tuyên bố mọi hợp đồng vô hiệu","Ưu tiên bảo tồn hợp đồng khi có thể theo điều kiện của nguồn luật áp dụng","Bỏ qua quyền của bên bị vi phạm","Chỉ bảo vệ bên bán"],"a":1,"e":"Đây là định hướng ưu tiên duy trì hợp đồng khi đáp ứng điều kiện pháp lý, không phải nguyên tắc tuyệt đối.","b":"PICC 2016; CISG"},{"id":"TM045","g":3,"lv":"VD","q":"Một bên bị giao hàng không phù hợp muốn yêu cầu bồi thường; chứng cứ nào hữu ích nhất?","o":["Chỉ ảnh quảng cáo của doanh nghiệp","Chỉ hợp đồng lao động của nhân viên","Chỉ thông tin mạng xã hội","Hợp đồng, tiêu chuẩn kỹ thuật, biên bản kiểm tra, thông báo khiếm khuyết và tài liệu chứng minh tổn thất"],"a":3,"e":"Hồ sơ cần chứng minh nghĩa vụ, việc không phù hợp, thông báo và thiệt hại.","b":"Luật Thương mại 2005"},{"id":"TM046","g":3,"lv":"TH","q":"Khi xác định chế tài phù hợp, cần tránh sai lầm nào?","o":["Áp dụng cùng một chế tài cho mọi loại vi phạm","Xác định mức độ vi phạm và căn cứ từng chế tài","Đọc điều khoản thông báo","Kiểm tra luật chuyên ngành"],"a":0,"e":"Mỗi chế tài có điều kiện và hậu quả riêng; cần áp dụng theo dữ kiện và quy định.","b":"Luật Thương mại 2005"},{"id":"TM047","g":4,"lv":"NB","q":"Bốn phương thức giải quyết tranh chấp thương mại trong nước thường được xem xét là gì?","o":["Hình sự, hành chính, kỷ luật, khiếu nại","Chỉ thương lượng và khởi kiện","Thương lượng, hòa giải, trọng tài thương mại và Tòa án","Chỉ trọng tài và hòa giải"],"a":2,"e":"Đề cương học phần xác định bốn phương thức này; lựa chọn tùy thỏa thuận và điều kiện pháp lý.","b":"Đề cương học phần; pháp luật về giải quyết tranh chấp"},{"id":"TM048","g":4,"lv":"NB","q":"Điều kiện nền tảng để giải quyết tranh chấp bằng trọng tài là gì?","o":["Chỉ cần một bên gửi email","Có thỏa thuận trọng tài hợp lệ và tranh chấp thuộc thẩm quyền","Phải có bản án của Tòa án trước","Trọng tài có thẩm quyền với mọi tranh chấp không cần thỏa thuận"],"a":1,"e":"Thỏa thuận trọng tài và phạm vi thẩm quyền là các điều kiện cốt lõi; cần kiểm tra hiệu lực thỏa thuận.","b":"Luật Trọng tài thương mại 2010"},{"id":"TM049","g":4,"lv":"NB","q":"Thỏa thuận trọng tài có thể được xác lập dưới hình thức nào?","o":["Chỉ bằng lời nói trong mọi trường hợp","Chỉ bằng văn bản công chứng","Chỉ sau khi phát sinh tranh chấp","Điều khoản trong hợp đồng hoặc thỏa thuận riêng dưới hình thức luật công nhận"],"a":3,"e":"Luật quy định hình thức văn bản và một số phương thức trao đổi thông tin được coi là văn bản.","b":"Luật Trọng tài thương mại 2010, Điều 16"},{"id":"TM050","g":4,"lv":"NB","q":"Nguyên tắc độc lập của thỏa thuận trọng tài có nghĩa là gì?","o":["Hiệu lực thỏa thuận trọng tài được xem xét độc lập với hợp đồng chính theo quy định","Hợp đồng chính vô hiệu thì thỏa thuận trọng tài luôn vô hiệu","Trọng tài không cần thỏa thuận","Tòa án không bao giờ có vai trò"],"a":0,"e":"Luật Trọng tài thương mại quy định tính độc lập của thỏa thuận trọng tài với hợp đồng.","b":"Luật Trọng tài thương mại 2010, Điều 19"},{"id":"TM051","g":4,"lv":"NB","q":"Phán quyết trọng tài thương mại trong nước về nguyên tắc có đặc điểm nào?","o":["Luôn được phúc thẩm bởi Tòa án","Chỉ có hiệu lực khi các bên cùng đồng ý sau đó","Có tính chung thẩm, nhưng có thể bị yêu cầu hủy theo căn cứ và thủ tục luật định","Không có giá trị pháp lý"],"a":2,"e":"Tính chung thẩm không loại trừ thủ tục yêu cầu hủy theo các căn cứ giới hạn của luật.","b":"Luật Trọng tài thương mại 2010"},{"id":"TM052","g":4,"lv":"NB","q":"Tòa án có vai trò gì đối với hoạt động trọng tài?","o":["Thay hội đồng trọng tài xét xử lại mọi vụ việc","Hỗ trợ và giám sát trong phạm vi luật quy định, gồm một số yêu cầu về biện pháp khẩn cấp, chứng cứ, hủy phán quyết","Không có bất kỳ vai trò nào","Luôn được sửa nội dung phán quyết"],"a":1,"e":"Vai trò Tòa án được giới hạn theo luật; thủ tục hủy không phải xét xử phúc thẩm nội dung.","b":"Luật Trọng tài thương mại; Bộ luật Tố tụng dân sự"},{"id":"TM053","g":4,"lv":"TH","q":"Hòa giải thương mại khác xét xử ở điểm nào?","o":["Hòa giải viên luôn ra phán quyết bắt buộc","Hòa giải không cần sự tham gia của các bên","Hòa giải viên đại diện một bên","Hòa giải viên hỗ trợ các bên tự nguyện tìm giải pháp, không tự mình áp đặt kết quả"],"a":3,"e":"Bản chất hòa giải là hỗ trợ các bên đạt thỏa thuận tự nguyện.","b":"Nghị định 22/2017/NĐ-CP"},{"id":"TM054","g":4,"lv":"VD","q":"Khi lựa chọn giữa trọng tài và Tòa án, yếu tố nào cần xem xét trước?","o":["Thỏa thuận giải quyết tranh chấp, thẩm quyền và hiệu lực điều khoản","Chỉ mức phí luật sư","Chỉ nơi đặt trụ sở bên bán","Chỉ ngôn ngữ quảng cáo"],"a":0,"e":"Thỏa thuận giải quyết tranh chấp có thể quyết định phương thức và ảnh hưởng thẩm quyền.","b":"Luật Trọng tài thương mại; Bộ luật Tố tụng dân sự"},{"id":"TM055","g":4,"lv":"NB","q":"Công ước New York 1958 tập trung vào vấn đề gì?","o":["Thành lập doanh nghiệp quốc tế","Điều kiện quảng cáo thương mại","Công nhận và thi hành phán quyết trọng tài nước ngoài","Thủ tục phá sản trong nước"],"a":2,"e":"Công ước đặt nền tảng quốc tế về công nhận và thi hành phán quyết trọng tài nước ngoài trong phạm vi áp dụng.","b":"Công ước New York 1958"},{"id":"TM056","g":4,"lv":"NB","q":"DSU của WTO điều chỉnh cơ chế tranh chấp nào?","o":["Tranh chấp giữa người lao động và doanh nghiệp","Tranh chấp giữa các thành viên WTO về nghĩa vụ thuộc các hiệp định liên quan","Mọi tranh chấp hợp đồng dân sự","Tranh chấp hôn nhân"],"a":1,"e":"Cơ chế DSU là cơ chế giải quyết tranh chấp giữa các thành viên WTO, không phải cơ chế hợp đồng tư nhân.","b":"WTO Dispute Settlement Understanding"},{"id":"TM057","g":4,"lv":"VD","q":"Khi tranh chấp hợp đồng có yếu tố nước ngoài và không có điều khoản chọn luật, cách tiếp cận nào đúng?","o":["Luôn áp dụng luật quốc tịch bên mua","Luôn áp dụng luật nơi giao hàng","Bỏ qua quy phạm xung đột","Xác định quy phạm xung đột và yếu tố kết nối theo pháp luật áp dụng"],"a":3,"e":"Luật áp dụng phải được xác định theo quy phạm xung đột thích hợp và dữ kiện; không có quy tắc một yếu tố luôn quyết định.","b":"Bộ luật Dân sự 2015; điều ước liên quan"},{"id":"TM058","g":4,"lv":"NB","q":"Căn cứ nào không nên được coi là lý do tự động để Tòa án hủy phán quyết trọng tài?","o":["Không đồng ý với cách đánh giá chứng cứ/nội dung phán quyết mà không thuộc căn cứ hủy luật định","Có căn cứ luật định về thỏa thuận trọng tài vô hiệu","Vi phạm nghiêm trọng thủ tục theo điều kiện luật định","Phán quyết thuộc trường hợp luật cho phép yêu cầu hủy"],"a":0,"e":"Tòa án không xét xử lại nội dung như phúc thẩm; yêu cầu hủy phải dựa trên căn cứ luật định.","b":"Luật Trọng tài thương mại 2010"},{"id":"TM059","g":4,"lv":"VD","q":"Khi một điều khoản chọn Tòa án mâu thuẫn với điều khoản trọng tài, cần làm gì?","o":["Mặc nhiên bỏ cả hai điều khoản","Chỉ chọn điều khoản được in đậm","Phân tích toàn văn hợp đồng, ý chí các bên, hiệu lực và quy tắc giải thích áp dụng","Chỉ hỏi bên soạn hợp đồng"],"a":2,"e":"Cần giải thích điều khoản trên tổng thể và xác định thỏa thuận có hiệu lực, không suy đoán chỉ từ hình thức trình bày.","b":"Luật Trọng tài thương mại; Bộ luật Dân sự"},{"id":"TM060","g":4,"lv":"NB","q":"Trong hòa giải thương mại, yếu tố nào là cốt lõi?","o":["Hòa giải viên có quyền cưỡng chế tài sản","Tự nguyện và trung lập, không áp đặt kết quả","Một bên phải thắng tuyệt đối","Không cần bảo mật"],"a":1,"e":"Hòa giải dựa trên sự tự nguyện và vai trò hỗ trợ của người thứ ba trung lập theo pháp luật.","b":"Nghị định 22/2017/NĐ-CP"},{"id":"TM061","g":4,"lv":"TH","q":"Công nhận bản án của Tòa án nước ngoài và công nhận phán quyết trọng tài nước ngoài có giống hoàn toàn nhau không?","o":["Có, đều theo cùng một điều khoản","Có, không cần xác định nguồn gốc","Có, luôn tự động thi hành","Không; chúng chịu cơ chế pháp lý và căn cứ xem xét khác nhau"],"a":3,"e":"Phải phân biệt nguồn gốc quyết định và hệ thống quy tắc công nhận, thi hành tương ứng.","b":"Bộ luật Tố tụng dân sự; Công ước New York 1958"},{"id":"TM062","g":4,"lv":"NB","q":"Một điều khoản giải quyết tranh chấp tốt nên xác định gì?","o":["Phương thức, cơ quan/tổ chức, quy tắc, địa điểm và các yếu tố cần thiết khác phù hợp giao dịch","Chỉ ghi “nếu có tranh chấp sẽ giải quyết theo pháp luật” trong mọi trường hợp","Chỉ ghi tên người bán","Không cần cân nhắc khả năng thi hành"],"a":0,"e":"Điều khoản rõ giúp giảm tranh chấp về thẩm quyền và thủ tục; nội dung cần phù hợp giao dịch và luật áp dụng.","b":"Luật Trọng tài thương mại; pháp luật tố tụng"},{"id":"TM063","g":4,"lv":"TH","q":"Khi đánh giá hiệu lực thỏa thuận hòa giải thành, nên phân biệt điều gì?","o":["Thỏa thuận thành luôn là bản án","Hòa giải viên có thể tự cưỡng chế thi hành","Thỏa thuận giữa các bên và cơ chế công nhận/thi hành theo pháp luật là hai vấn đề liên quan nhưng không đồng nhất","Không cần văn bản ghi nhận"],"a":2,"e":"Hiệu lực ràng buộc của thỏa thuận và cơ chế cưỡng chế thi hành cần được phân tích riêng.","b":"Nghị định 22/2017/NĐ-CP; Bộ luật Tố tụng dân sự"},{"id":"TM064","g":4,"lv":"VD","q":"Khi có yếu tố nước ngoài, lựa chọn phương thức giải quyết tranh chấp cần tính đến điều gì ngoài chi phí?","o":["Chỉ màu sắc hợp đồng","Luật áp dụng, thẩm quyền, tống đạt, bảo toàn chứng cứ và khả năng công nhận/thi hành ở nơi có tài sản","Chỉ số lượng trang hợp đồng","Chỉ nơi ký hợp đồng"],"a":1,"e":"Khả năng thi hành và các yếu tố xuyên biên giới có thể quyết định hiệu quả thực tế của phương thức.","b":"Bộ luật Dân sự; Bộ luật Tố tụng dân sự; Công ước New York 1958"},{"id":"TM065","g":4,"lv":"NB","q":"Mục đích của việc phân tích cấu trúc pháp lý tranh chấp là gì?","o":["Tìm cách trì hoãn giải quyết","Thay thế toàn bộ chứng cứ bằng nhận xét","Chỉ xác định bên có lỗi đạo đức","Xác định đúng yêu cầu, nghĩa vụ, chứng cứ, luật áp dụng và cơ chế giải quyết"],"a":3,"e":"Cấu trúc hóa tranh chấp giúp xác định vấn đề cần chứng minh và phương thức xử lý phù hợp.","b":"Kỹ năng phân tích pháp lý; pháp luật tố tụng liên quan"},{"id":"TM066","g":4,"lv":"TH","q":"Khi sử dụng tài liệu về pháp luật trọng tài trong học phần, nên làm gì?","o":["Đối chiếu văn bản gốc, văn bản hợp nhất/sửa đổi và tình trạng hiệu lực trước khi trích dẫn","Mặc nhiên cho rằng mọi tài liệu năm 2010 là bản cập nhật mới nhất","Chỉ đọc bài quảng cáo của trung tâm trọng tài","Bỏ qua điều khoản chuyển tiếp"],"a":0,"e":"Phải xác minh tình trạng hiệu lực và văn bản liên quan; văn bản hợp nhất không tự thân là luật sửa đổi.","b":"Cơ sở dữ liệu văn bản pháp luật chính thức"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Anh Tùng có đáp ứng các dấu hiệu của thương nhân là cá nhân không?","o":["Chỉ là thương nhân nếu doanh thu đạt trên 1 tỷ đồng mỗi tháng","Không, vì anh không có cửa hàng hay địa điểm kinh doanh cố định","Có, vì hoạt động thương mại độc lập, thường xuyên","Không, vì anh chỉ bán hàng qua mạng xã hội, không có giao dịch trực tiếp"],"a":2,"e":"Khoản 1 Điều 6 Luật Thương mại 2005: thương nhân bao gồm tổ chức kinh tế được thành lập hợp pháp, cá nhân hoạt động thương mại một cách độc lập, thường xuyên và có đăng ký kinh doanh. Anh Tùng mua để bán lại nhằm sinh lợi, độc lập, thường xuyên, có thuê nhân viên, nên phải đăng ký kinh doanh; kênh bán hàng hay ngưỡng doanh thu không phải tiêu chí.","b":"Khoản 1 Điều 6 Luật Thương mại","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Lập luận \"chưa đăng ký kinh doanh nên không chịu trách nhiệm theo Luật Thương mại\" của anh Tùng được đánh giá thế nào?","o":["Không có cơ sở; chưa đăng ký vẫn phải chịu trách nhiệm","Chỉ đúng với các hợp đồng có giá trị dưới 100 triệu đồng","Có cơ sở, nếu Công ty May Hà Thành biết anh chưa đăng ký kinh doanh","Có cơ sở, vì chỉ thương nhân đã đăng ký mới chịu sự điều chỉnh của Luật Thương mại"],"a":0,"e":"Điều 7 Luật Thương mại 2005: thương nhân có nghĩa vụ đăng ký kinh doanh theo quy định của pháp luật; trường hợp chưa đăng ký kinh doanh, thương nhân vẫn phải chịu trách nhiệm về mọi hoạt động của mình theo quy định của Luật này và quy định khác của pháp luật.","b":"Điều 7 Luật Thương mại","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Anh Tùng muốn chỉ chịu trách nhiệm trong phạm vi số vốn bỏ ra. Hình thức nào phù hợp?","o":["Hộ kinh doanh do anh Tùng đăng ký","Doanh nghiệp tư nhân do anh Tùng làm chủ","Tiếp tục kinh doanh cá nhân, không cần đăng ký","Công ty TNHH một thành viên do anh Tùng làm chủ sở hữu"],"a":3,"e":"Khoản 1 Điều 74 Luật Doanh nghiệp 2020: chủ sở hữu công ty trách nhiệm hữu hạn một thành viên chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản khác của công ty trong phạm vi số vốn điều lệ của công ty. Doanh nghiệp tư nhân và hộ kinh doanh đều chịu trách nhiệm vô hạn.","b":"Khoản 1 Điều 74 Luật Doanh nghiệp","cid":"TH1.01"},{"id":"TH1.01.4","g":1,"lv":"VD","q":"Nếu anh Tùng chọn doanh nghiệp tư nhân, anh chịu trách nhiệm về nghĩa vụ của doanh nghiệp như thế nào?","o":["Chỉ đối với nghĩa vụ phát sinh sau khi đăng ký","Bằng toàn bộ tài sản của mình (trách nhiệm vô hạn)","Trong phạm vi vốn đầu tư đã đăng ký","Trong phạm vi tài sản đứng tên doanh nghiệp"],"a":1,"e":"Khoản 1 Điều 188 Luật Doanh nghiệp 2020: doanh nghiệp tư nhân là doanh nghiệp do một cá nhân làm chủ và tự chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp. Doanh nghiệp tư nhân không có tư cách pháp nhân.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Thời hạn góp vốn của các thành viên Công ty Minh Phát là bao lâu?","o":["30 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp","01 năm kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp","Không giới hạn nếu Điều lệ không quy định","90 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp"],"a":3,"e":"Khoản 2 Điều 47 Luật Doanh nghiệp 2020: thành viên phải góp vốn cho công ty đủ và đúng loại tài sản đã cam kết trong thời hạn 90 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp, không kể thời gian vận chuyển, nhập khẩu tài sản góp vốn, thực hiện thủ tục chuyển quyền sở hữu tài sản.","b":"Khoản 2 Điều 47 Luật Doanh nghiệp","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Sau thời hạn góp vốn, tư cách thành viên của anh Sơn và bà Lan được xác định thế nào?","o":["Anh Sơn không còn là thành viên; bà Lan là thành viên theo vốn đã góp","Cả hai vẫn là thành viên với tỷ lệ phần vốn góp như đã cam kết","Anh Sơn vẫn là thành viên nhưng không có quyền biểu quyết","Cả hai đương nhiên không còn là thành viên vì không góp đủ vốn"],"a":0,"e":"Khoản 3 Điều 47 Luật Doanh nghiệp 2020: thành viên chưa góp vốn theo cam kết đương nhiên không còn là thành viên; thành viên chưa góp đủ phần vốn góp đã cam kết có các quyền tương ứng với phần vốn góp đã góp; phần vốn chưa góp được chào bán theo nghị quyết, quyết định của Hội đồng thành viên.","b":"Khoản 3 Điều 47 Luật Doanh nghiệp","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Công ty phải đăng ký thay đổi vốn điều lệ thế nào và trong thời hạn nào?","o":["Đăng ký giảm vốn vào bất kỳ thời điểm nào trong năm tài chính","Đăng ký vốn điều lệ 2,1 tỷ đồng trong 30 ngày","Giữ nguyên vốn điều lệ 3 tỷ đồng, không phải đăng ký thay đổi","Chỉ đăng ký thay đổi khi có yêu cầu của cơ quan thuế"],"a":1,"e":"Khoản 4 Điều 47 Luật Doanh nghiệp 2020: trường hợp có thành viên chưa góp hoặc chưa góp đủ, công ty phải đăng ký thay đổi vốn điều lệ, tỷ lệ phần vốn góp của các thành viên bằng số vốn đã góp trong thời hạn 30 ngày kể từ ngày cuối cùng phải góp đủ phần vốn góp. Vốn đã góp: 1,5 tỷ + 0,6 tỷ = 2,1 tỷ đồng (trừ khi phần chưa góp được chào bán).","b":"Khoản 4 Điều 47 Luật Doanh nghiệp","cid":"TH1.02"},{"id":"TH1.02.4","g":1,"lv":"VD","q":"Đối với khoản nợ 800 triệu đồng phát sinh trước khi đăng ký thay đổi vốn điều lệ, bà Lan và anh Sơn chịu trách nhiệm thế nào?","o":["Chịu trách nhiệm vô hạn bằng toàn bộ tài sản của mình","Không chịu trách nhiệm, vì công ty có tư cách pháp nhân","Chịu trách nhiệm tương ứng với phần vốn đã cam kết góp","Chỉ ông Hải chịu trách nhiệm, vì đã góp đủ vốn"],"a":2,"e":"Khoản 4 Điều 47 Luật Doanh nghiệp 2020: các thành viên chưa góp vốn hoặc chưa góp đủ số vốn đã cam kết phải chịu trách nhiệm tương ứng với phần vốn góp đã cam kết đối với các nghĩa vụ tài chính của công ty phát sinh trong thời gian trước ngày công ty đăng ký thay đổi vốn điều lệ và tỷ lệ phần vốn góp.","b":"Khoản 4 Điều 47 Luật Doanh nghiệp","cid":"TH1.02"},{"id":"TH1.03.1","g":1,"lv":"VD","q":"Tháng 8/2026, ông A có được tự do chuyển nhượng cổ phần phổ thông cho ông D không?","o":["Được, vì cổ phần là tài sản thuộc sở hữu của ông A","Không, vì cần Đại hội đồng cổ đông chấp thuận","Được, nếu ông D trả giá cao hơn giá thị trường","Không, vì cổ đông sáng lập không bao giờ được chuyển nhượng cho người ngoài"],"a":1,"e":"Khoản 3 Điều 120 Luật Doanh nghiệp 2020: trong thời hạn 03 năm kể từ ngày công ty được cấp Giấy chứng nhận đăng ký doanh nghiệp, cổ phần phổ thông của cổ đông sáng lập được tự do chuyển nhượng cho cổ đông sáng lập khác và chỉ được chuyển nhượng cho người không phải là cổ đông sáng lập nếu được sự chấp thuận của Đại hội đồng cổ đông.","b":"Khoản 3 Điều 120 Luật Doanh nghiệp","cid":"TH1.03"},{"id":"TH1.03.2","g":1,"lv":"VD","q":"Ông A có quyền biểu quyết tại Đại hội đồng cổ đông về việc chuyển nhượng cổ phần của mình không?","o":["Không có quyền biểu quyết về việc chuyển nhượng đó","Chỉ có quyền biểu quyết nếu ông A sở hữu trên 50% cổ phần","Có, như mọi cổ đông khác có cổ phần phổ thông","Có, và phiếu biểu quyết của ông A có tính quyết định"],"a":0,"e":"Khoản 3 Điều 120 Luật Doanh nghiệp 2020: trường hợp này, cổ đông sáng lập dự định chuyển nhượng cổ phần phổ thông thì không có quyền biểu quyết về việc chuyển nhượng cổ phần đó.","b":"Khoản 3 Điều 120 Luật Doanh nghiệp","cid":"TH1.03"},{"id":"TH1.03.3","g":1,"lv":"VD","q":"Ông A có thể chuyển nhượng cổ phần cho ai mà không cần Đại hội đồng cổ đông chấp thuận trong thời hạn này?","o":["Cho bất kỳ ai là người thân thích của ông A","Cho người lao động đang làm việc tại công ty","Cho công ty mẹ của ông D","Cho bà B hoặc ông C, là cổ đông sáng lập khác"],"a":3,"e":"Khoản 3 Điều 120 Luật Doanh nghiệp 2020: trong thời hạn 03 năm, cổ phần phổ thông của cổ đông sáng lập được tự do chuyển nhượng cho cổ đông sáng lập khác.","b":"Khoản 3 Điều 120 Luật Doanh nghiệp","cid":"TH1.03"},{"id":"TH1.03.4","g":1,"lv":"VD","q":"Từ thời điểm nào ông A được tự do chuyển nhượng cổ phần phổ thông cho người không phải cổ đông sáng lập?","o":["Từ ngày 01/3/2027, tròn 02 năm kể từ ngày thành lập","Từ ngày 01/3/2026, tròn 01 năm kể từ ngày thành lập","Sau ngày 01/3/2028, khi hết thời hạn 03 năm","Chỉ khi cổ phiếu của công ty được niêm yết trên sàn chứng khoán"],"a":2,"e":"Khoản 3 Điều 120 Luật Doanh nghiệp 2020: các hạn chế đối với cổ phần phổ thông của cổ đông sáng lập được bãi bỏ sau thời hạn 03 năm kể từ ngày công ty được cấp Giấy chứng nhận đăng ký doanh nghiệp. Sau đó việc chuyển nhượng thực hiện theo Điều 127.","b":"Khoản 3 Điều 120, Điều 127 Luật Doanh nghiệp","cid":"TH1.03"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"An Bình giao hàng ngày 05/5/2026, sớm hơn thời hạn thỏa thuận. Thịnh Phát có những lựa chọn nào?","o":["Bắt buộc phải từ chối và phạt vi phạm bên bán","Bắt buộc phải nhận hàng vì bên bán đã thực hiện nghĩa vụ","Chỉ được nhận hàng nếu bên bán đồng ý giảm giá","Có quyền nhận hoặc không nhận hàng, trừ khi có thỏa thuận khác"],"a":3,"e":"Điều 38 Luật Thương mại 2005: trường hợp bên bán giao hàng sớm hơn thời hạn đã thỏa thuận thì bên mua có quyền nhận hoặc không nhận hàng nếu các bên không có thỏa thuận khác.","b":"Điều 38 Luật Thương mại","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"50 tấn gạo ẩm mốc được xác định thế nào và Thịnh Phát có quyền gì?","o":["Là rủi ro thông thường trong vận chuyển, bên mua phải nhận","Hàng không phù hợp hợp đồng; được từ chối nhận","Là hàng có khiếm khuyết nhỏ, bên mua chỉ được giảm giá","Phải chờ giám định của cơ quan nhà nước mới được từ chối"],"a":1,"e":"Khoản 1 Điều 39 Luật Thương mại 2005: hàng hóa không phù hợp với hợp đồng khi không bảo đảm chất lượng đã thỏa thuận. Khoản 2: trừ trường hợp có thỏa thuận khác, bên mua có quyền từ chối nhận hàng nếu hàng hóa không phù hợp với hợp đồng.","b":"Khoản 1, khoản 2 Điều 39 Luật Thương mại","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Vì sao việc Thịnh Phát kiểm tra ngay khi nhận hàng có ý nghĩa pháp lý quan trọng?","o":["Vì việc kiểm tra thay thế nghĩa vụ thanh toán của bên mua","Vì chỉ hàng hóa đã được kiểm tra mới chuyển quyền sở hữu","Vì bên bán không chịu trách nhiệm về khiếm khuyết bên mua biết mà không báo kịp thời","Vì nếu không kiểm tra thì hợp đồng mua bán hàng hóa bị vô hiệu"],"a":2,"e":"Điều 44 Luật Thương mại 2005: bên mua phải kiểm tra hàng hóa trong khoảng thời gian ngắn nhất mà hoàn cảnh thực tế cho phép; bên bán không phải chịu trách nhiệm về những khiếm khuyết của hàng hóa mà bên mua đã biết hoặc phải biết nhưng không thông báo cho bên bán trong thời hạn hợp lý sau khi kiểm tra.","b":"Điều 44 Luật Thương mại","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Ai chịu rủi ro đối với 20 tấn gạo đạt chất lượng bị hỏng do kho của Thịnh Phát bị dột?","o":["Công ty Thịnh Phát, vì rủi ro đã chuyển khi nhận hàng","Không bên nào, vì đây là sự kiện bất khả kháng","Công ty An Bình, vì thời hạn giao hàng thỏa thuận là ngày 10/5","Hai bên chia đôi thiệt hại vì đều không có lỗi"],"a":0,"e":"Điều 57 Luật Thương mại 2005: trừ trường hợp có thỏa thuận khác, nếu bên bán có nghĩa vụ giao hàng cho bên mua tại một địa điểm nhất định thì rủi ro về mất mát, hư hỏng hàng hóa được chuyển cho bên mua khi hàng hóa đã được giao cho bên mua tại địa điểm đó. Thịnh Phát đã nhận hàng tại kho của mình.","b":"Điều 57 Luật Thương mại","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Quan hệ giữa Công ty Phúc An và anh Long là hoạt động thương mại nào?","o":["Môi giới thương mại","Đại lý thương mại","Đại diện cho thương nhân","Ủy thác mua bán hàng hóa"],"a":0,"e":"Điều 150 Luật Thương mại 2005: môi giới thương mại là hoạt động thương mại, theo đó một thương nhân làm trung gian cho các bên mua bán hàng hóa, cung ứng dịch vụ trong việc đàm phán, giao kết hợp đồng và được hưởng thù lao theo hợp đồng môi giới. Anh Long chỉ tìm và giới thiệu, không nhân danh bên nào giao kết.","b":"Điều 150 Luật Thương mại","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Anh Long được hưởng thù lao môi giới từ khi nào và bao nhiêu?","o":["Không được hưởng vì hợp đồng chưa thực hiện xong","Từ ngày 10/6/2026 khi hai công ty ký hợp đồng; 50 triệu đồng","Chỉ khi Hưng Long thanh toán đủ; 50 triệu đồng","Ngay khi giới thiệu được khách hàng; 25 triệu đồng"],"a":1,"e":"Điều 153 Luật Thương mại 2005: trừ trường hợp có thỏa thuận khác, quyền hưởng thù lao môi giới phát sinh từ thời điểm các bên được môi giới đã ký hợp đồng với nhau. Thù lao = 1% × 5.000.000.000 = 50.000.000 đồng.","b":"Điều 153 Luật Thương mại","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Hưng Long không có khả năng thanh toán. Phúc An có được yêu cầu anh Long trả thay không?","o":["Có, trong phạm vi 1% giá trị hợp đồng","Có, nếu anh Long đã nhận thù lao môi giới","Không, bên môi giới không chịu trách nhiệm về khả năng thanh toán","Có, vì anh Long là người giới thiệu Hưng Long cho Phúc An"],"a":2,"e":"Khoản 3 Điều 151 Luật Thương mại 2005: bên môi giới thương mại chịu trách nhiệm về tư cách pháp lý của các bên được môi giới, nhưng không chịu trách nhiệm về khả năng thanh toán của họ.","b":"Khoản 3 Điều 151 Luật Thương mại","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Việc anh Long tự ý thay mặt Phúc An nhận 500 triệu đồng tiền đặt trước được đánh giá thế nào?","o":["Hợp pháp, vì nhằm thúc đẩy giao dịch giữa các bên","Chỉ vi phạm nếu số tiền nhận trên 1 tỷ đồng","Hợp pháp, nếu anh Long chuyển lại tiền trong 30 ngày","Vi phạm nghĩa vụ của bên môi giới, vì không có ủy quyền"],"a":3,"e":"Khoản 4 Điều 151 Luật Thương mại 2005: bên môi giới không được tham gia thực hiện hợp đồng giữa các bên được môi giới, trừ trường hợp có ủy quyền của bên được môi giới. Anh Long phải hoàn trả số tiền và bồi thường thiệt hại nếu có.","b":"Khoản 4 Điều 151 Luật Thương mại","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Hợp đồng giữa Công ty Hoàng Thạch và bà Hà thuộc hình thức đại lý nào?","o":["Đại lý độc quyền","Tổng đại lý","Đại lý bao tiêu","Môi giới thương mại"],"a":2,"e":"Điều 169 Luật Thương mại 2005: đại lý bao tiêu là hình thức đại lý mà bên đại lý thực hiện việc mua, bán trọn vẹn một khối lượng hàng hóa hoặc cung ứng đầy đủ một dịch vụ cho bên giao đại lý. Bà Hà nhận hàng với giá ấn định và tự định giá bán.","b":"Điều 169 Luật Thương mại","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Thù lao đại lý của bà Hà được xác định thế nào?","o":["5% giá bán ra theo thông lệ ngành","Chênh lệch giá, tức 150.000 đồng/tấn","Tỷ lệ phần trăm trên doanh thu do pháp luật quy định","Do Ủy ban nhân dân cấp tỉnh ấn định"],"a":1,"e":"Khoản 3 Điều 171 Luật Thương mại 2005: trường hợp bên giao đại lý không ấn định giá mua, giá bán hàng hóa mà chỉ ấn định giá giao đại lý cho bên đại lý thì bên đại lý được hưởng chênh lệch giá (nếu ấn định giá bán thì thù lao là hoa hồng theo tỷ lệ phần trăm – khoản 2). Thù lao = 1.650.000 − 1.500.000 = 150.000 đồng/tấn.","b":"Khoản 3 Điều 171 Luật Thương mại","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Chủ nợ riêng của bà Hà có được kê biên 100 tấn xi măng trong kho để trả nợ không?","o":["Được, nếu bà Hà đồng ý với việc kê biên","Được kê biên một nửa số hàng tương ứng phần thù lao","Được, vì hàng đang nằm trong kho của bà Hà","Không, vì Hoàng Thạch là chủ sở hữu số hàng"],"a":3,"e":"Điều 170 Luật Thương mại 2005: bên giao đại lý là chủ sở hữu đối với hàng hóa hoặc tiền giao cho bên đại lý. Số xi măng chưa bán vẫn thuộc sở hữu của Công ty nên không thể dùng để thanh toán nợ riêng của bà Hà.","b":"Điều 170 Luật Thương mại","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Ai chịu thiệt hại đối với 30 tấn xi măng bị hỏng do bà Hà bảo quản không đúng yêu cầu?","o":["Bà Hà phải bồi thường do vi phạm nghĩa vụ bảo quản","Người mua xi măng, vì đã đặt hàng trước","Hai bên chia đôi thiệt hại theo hợp đồng đại lý","Công ty Hoàng Thạch, vì là chủ sở hữu hàng hóa"],"a":0,"e":"Điều 175 Luật Thương mại 2005: bên đại lý có nghĩa vụ bảo quản hàng hóa sau khi nhận đối với đại lý bán. Dù quyền sở hữu thuộc bên giao đại lý, bà Hà có lỗi trong bảo quản nên phải bồi thường thiệt hại.","b":"Điều 175 Luật Thương mại","cid":"TH2.03"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Mức phạt vi phạm tối đa Bảo Minh có thể yêu cầu là bao nhiêu?","o":["60 triệu đồng (15% phần nghĩa vụ bị vi phạm)","300 triệu đồng (15% giá trị hợp đồng)","160 triệu đồng (8% giá trị hợp đồng)","32 triệu đồng (8% phần bị vi phạm)"],"a":3,"e":"Điều 301 Luật Thương mại 2005: mức phạt đối với vi phạm nghĩa vụ hợp đồng hoặc tổng mức phạt đối với nhiều vi phạm do các bên thỏa thuận trong hợp đồng, nhưng không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm. Phần vi phạm là 400 triệu đồng: 8% × 400 triệu = 32 triệu đồng.","b":"Điều 301 Luật Thương mại","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Hợp đồng chỉ thỏa thuận phạt vi phạm, không đề cập bồi thường. Bảo Minh có được yêu cầu cả phạt và bồi thường không?","o":["Có, theo Luật Thương mại được áp dụng cả hai chế tài","Có, nhưng tổng hai khoản không được vượt quá 8% giá trị hợp đồng","Không, bên bị vi phạm chỉ được chọn một trong hai chế tài","Không, vì không thỏa thuận về bồi thường thì chỉ được phạt"],"a":0,"e":"Khoản 2 Điều 307 Luật Thương mại 2005: trường hợp các bên có thỏa thuận phạt vi phạm thì bên bị vi phạm có quyền áp dụng cả chế tài phạt vi phạm và buộc bồi thường thiệt hại, trừ trường hợp Luật này có quy định khác. Đây là điểm khác với khoản 3 Điều 418 BLDS (không thỏa thuận thì chỉ phạt).","b":"Khoản 2 Điều 307 Luật Thương mại","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Để được bồi thường 120 triệu đồng lợi nhuận bị mất, Bảo Minh phải chứng minh những gì?","o":["Chỉ cần có bảng tính lợi nhuận dự kiến nội bộ của công ty","Chỉ cần chứng minh Đông Á đã giao thiếu hàng","Tổn thất, mức tổn thất và quan hệ nhân quả trực tiếp","Không cần chứng minh, vì Đông Á đã thừa nhận vi phạm"],"a":2,"e":"Điều 303 Luật Thương mại 2005: trách nhiệm bồi thường phát sinh khi có hành vi vi phạm, có thiệt hại thực tế và hành vi vi phạm là nguyên nhân trực tiếp gây ra thiệt hại. Điều 304: bên yêu cầu bồi thường thiệt hại phải chứng minh tổn thất, mức độ tổn thất do hành vi vi phạm gây ra và khoản lợi trực tiếp mà bên bị vi phạm đáng lẽ được hưởng.","b":"Điều 303, Điều 304 Luật Thương mại","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Việc Bảo Minh không tìm nguồn hàng thay thế dù thị trường có sẵn ảnh hưởng thế nào đến mức bồi thường?","o":["Bảo Minh mất toàn bộ quyền được bồi thường thiệt hại","Đông Á được giảm phần tổn thất lẽ ra hạn chế được","Không ảnh hưởng, Đông Á vẫn phải bồi thường toàn bộ thiệt hại","Bảo Minh phải bồi thường ngược lại cho Đông Á"],"a":1,"e":"Điều 305 Luật Thương mại 2005: bên yêu cầu bồi thường thiệt hại phải áp dụng các biện pháp hợp lý để hạn chế tổn thất, kể cả tổn thất đối với khoản lợi trực tiếp đáng lẽ được hưởng; nếu không áp dụng thì bên vi phạm hợp đồng có quyền yêu cầu giảm bớt giá trị bồi thường thiệt hại bằng mức tổn thất đáng lẽ có thể hạn chế được.","b":"Điều 305 Luật Thương mại","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Mưa lũ lịch sử chia cắt tuyến đường duy nhất có thể là căn cứ miễn trách nhiệm không?","o":["Không, vì mưa lũ năm nào cũng xảy ra tại khu vực này","Không, vì Công ty Miền Trung sau đó vẫn giao được hàng","Có, mọi trường hợp mưa lớn đều được miễn trách nhiệm","Có thể, nếu đáp ứng điều kiện của sự kiện bất khả kháng"],"a":3,"e":"Điểm b khoản 1 Điều 294 Luật Thương mại 2005: bên vi phạm hợp đồng được miễn trách nhiệm khi xảy ra sự kiện bất khả kháng. Khái niệm bất khả kháng theo khoản 1 Điều 156 BLDS: sự kiện xảy ra khách quan, không thể lường trước được và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép. Không kết luận chỉ từ tên gọi \"mưa lũ\".","b":"Điểm b khoản 1 Điều 294 Luật Thương mại; khoản 1 Điều 156 BLDS","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Ai có nghĩa vụ chứng minh trường hợp miễn trách nhiệm?","o":["Công ty Nông sản Miền Trung (bên vi phạm)","Công ty Xuất khẩu Sài Gòn (bên bị vi phạm)","Tòa án tự xác minh","Cơ quan nhà nước xác nhận thiên tai"],"a":0,"e":"Khoản 2 Điều 294 Luật Thương mại 2005: bên vi phạm hợp đồng có nghĩa vụ chứng minh các trường hợp miễn trách nhiệm. Văn bản xác nhận thiên tai là một chứng cứ nhưng bên vi phạm còn phải chứng minh sự kiện tác động trực tiếp đến việc thực hiện nghĩa vụ.","b":"Khoản 2 Điều 294 Luật Thương mại","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Công ty Miền Trung không thông báo cho bên mua về sự kiện bất khả kháng. Hậu quả là gì?","o":["Mất toàn bộ quyền được miễn trách nhiệm do bất khả kháng","Hợp đồng đương nhiên bị hủy bỏ kể từ ngày xảy ra sự kiện","Phải bồi thường thiệt hại do không thông báo","Không có hậu quả gì, vì thiên tai là sự kiện ai cũng biết"],"a":2,"e":"Điều 295 Luật Thương mại 2005: bên vi phạm phải thông báo ngay bằng văn bản cho bên kia về trường hợp được miễn trách nhiệm và những hậu quả có thể xảy ra; nếu không thông báo hoặc thông báo không kịp thời cho bên kia thì phải bồi thường thiệt hại.","b":"Điều 295 Luật Thương mại","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Các bên không thỏa thuận được việc kéo dài thời hạn. Thời hạn giao hàng được kéo dài tối đa bao lâu?","o":["Không được kéo dài","Không quá 05 tháng","12 tháng","08 tháng"],"a":1,"e":"Điểm a khoản 1 Điều 296 Luật Thương mại 2005: nếu các bên không thỏa thuận được thì thời hạn thực hiện nghĩa vụ được tính thêm một thời gian bằng thời gian xảy ra bất khả kháng cộng với thời gian hợp lý để khắc phục hậu quả, nhưng không quá 05 tháng đối với hàng hóa có thời hạn giao không quá 12 tháng kể từ khi giao kết hợp đồng (hợp đồng ký 01/3, giao 30/6/2026). Mức 08 tháng áp dụng khi thời hạn giao trên 12 tháng.","b":"Điểm a khoản 1 Điều 296 Luật Thương mại","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Việc Thép Việt tạm ngừng giao đợt 2 có hợp pháp không?","o":["Không, vì chỉ được tạm ngừng khi có bản án của Tòa án","Hợp pháp, vì xảy ra vi phạm là điều kiện tạm ngừng đã thỏa thuận","Không, vì bên bán phải tiếp tục giao hàng theo hợp đồng","Chỉ hợp pháp nếu Công ty Hòa Bình đồng ý"],"a":1,"e":"Điều 308 Luật Thương mại 2005: trừ trường hợp miễn trách nhiệm, tạm ngừng thực hiện hợp đồng là việc một bên tạm thời không thực hiện nghĩa vụ khi xảy ra hành vi vi phạm mà các bên đã thỏa thuận là điều kiện để tạm ngừng, hoặc một bên vi phạm cơ bản nghĩa vụ hợp đồng. Hòa Bình chậm thanh toán quá 45 ngày, vượt điều kiện 30 ngày.","b":"Điều 308 Luật Thương mại","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Trong thời gian tạm ngừng, hợp đồng có hiệu lực không?","o":["Hợp đồng chấm dứt ngay từ thời điểm tạm ngừng","Hợp đồng được chuyển thành một hợp đồng mới","Vẫn còn hiệu lực; bên bị vi phạm được đòi bồi thường","Hợp đồng bị coi là vô hiệu từ thời điểm giao kết"],"a":2,"e":"Điều 309 Luật Thương mại 2005: khi hợp đồng bị tạm ngừng thực hiện thì hợp đồng vẫn còn hiệu lực; bên bị vi phạm có quyền yêu cầu bồi thường thiệt hại theo quy định của Luật này.","b":"Điều 309 Luật Thương mại","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Thép Việt có quyền hủy bỏ hợp đồng không?","o":["Không, vì đã chọn tạm ngừng thì không được hủy bỏ hợp đồng nữa","Không, vì chỉ Tòa án mới có quyền hủy bỏ hợp đồng","Có, nhưng chỉ sau 06 tháng kể từ khi tạm ngừng","Có, vì Hòa Bình vi phạm cơ bản; phải thông báo ngay"],"a":3,"e":"Khoản 13 Điều 3 Luật Thương mại 2005: vi phạm cơ bản là sự vi phạm hợp đồng của một bên gây thiệt hại cho bên kia đến mức làm cho bên kia không đạt được mục đích của việc giao kết hợp đồng. Điều 312: bên bị vi phạm có quyền hủy bỏ hợp đồng khi một bên vi phạm cơ bản. Điều 315: bên áp dụng phải thông báo ngay cho bên kia.","b":"Khoản 13 Điều 3, Điều 312, Điều 315 Luật Thương mại","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Sau khi hủy bỏ hợp đồng, quyền lợi của Thép Việt đối với đợt hàng 1 đã giao được giải quyết thế nào?","o":["Đòi lại phần đã thực hiện, lãi chậm trả và bồi thường","Chỉ được đòi lại hàng, không được đòi tiền lãi chậm trả","Chỉ được phạt vi phạm 8% giá trị phần bị vi phạm","Mất quyền đòi tiền, vì hợp đồng không còn hiệu lực"],"a":0,"e":"Điều 314 Luật Thương mại 2005: sau khi hủy bỏ, hợp đồng không có hiệu lực từ thời điểm giao kết; các bên có quyền đòi lại lợi ích do việc đã thực hiện phần nghĩa vụ của mình; bên bị vi phạm có quyền yêu cầu bồi thường thiệt hại. Điều 306: bên chậm thanh toán phải trả lãi trên số tiền chậm trả theo lãi suất nợ quá hạn trung bình trên thị trường, trừ thỏa thuận khác.","b":"Điều 314, Điều 306 Luật Thương mại","cid":"TH3.03"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Thỏa thuận \"giải quyết bằng trọng tài\" không ghi tổ chức trọng tài có hiệu lực không?","o":["Vô hiệu, vì không xác định được tổ chức trọng tài","Có hiệu lực; không thỏa thuận lại được thì theo yêu cầu nguyên đơn","Vô hiệu, vì không ghi luật áp dụng cho tranh chấp","Chỉ có hiệu lực nếu được công chứng"],"a":1,"e":"Khoản 4 Điều 43 Luật Trọng tài thương mại 2010: trường hợp thỏa thuận trọng tài không chỉ rõ hình thức trọng tài hoặc không xác định cụ thể tổ chức trọng tài thì khi có tranh chấp, các bên phải thỏa thuận lại; nếu không thỏa thuận được thì việc lựa chọn hình thức, tổ chức trọng tài để giải quyết tranh chấp được thực hiện theo yêu cầu của nguyên đơn. Thỏa thuận được lập bằng văn bản (Điều 16).","b":"Điều 16, khoản 4 Điều 43 Luật Trọng tài thương mại","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Công ty A khởi kiện tại Tòa án. Tòa án xử lý thế nào?","o":["Thụ lý, nếu giá trị tranh chấp trên 1 tỷ đồng","Thụ lý, vì Công ty A có quyền lựa chọn Tòa án hoặc trọng tài","Từ chối thụ lý vì có thỏa thuận trọng tài","Thụ lý rồi tạm đình chỉ để chờ kết quả trọng tài"],"a":2,"e":"Điều 6 Luật Trọng tài thương mại 2010: trong trường hợp các bên tranh chấp đã có thỏa thuận trọng tài mà một bên khởi kiện tại Tòa án thì Tòa án phải từ chối thụ lý, trừ trường hợp thỏa thuận trọng tài vô hiệu hoặc thỏa thuận trọng tài không thể thực hiện được.","b":"Điều 6 Luật Trọng tài thương mại","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Công ty A muốn \"kháng cáo\" phán quyết trọng tài. Nhận định nào đúng?","o":["Không được kháng cáo, vì phán quyết trọng tài là chung thẩm","Được kháng cáo nếu Công ty B đồng ý","Được kháng cáo lên Tòa án nhân dân cấp tỉnh trong 15 ngày","Được kháng cáo lên Hội đồng trọng tài cấp cao hơn"],"a":0,"e":"Khoản 5 Điều 4 Luật Trọng tài thương mại 2010: phán quyết trọng tài là chung thẩm. Phán quyết có hiệu lực kể từ ngày ban hành (Điều 61) và không có cấp xét xử lại theo thủ tục kháng cáo.","b":"Khoản 5 Điều 4 Luật Trọng tài thương mại","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Nếu có căn cứ cho rằng phán quyết vi phạm pháp luật, Công ty A có thể làm gì và trong thời hạn nào?","o":["Khởi kiện lại vụ án tại Tòa án vào bất kỳ lúc nào","Yêu cầu Hội đồng trọng tài xét xử lại trong 60 ngày","Đề nghị Viện kiểm sát kháng nghị giám đốc thẩm phán quyết","Yêu cầu Tòa án hủy phán quyết trong 30 ngày"],"a":3,"e":"Khoản 1 Điều 69 Luật Trọng tài thương mại 2010: trong thời hạn 30 ngày kể từ ngày nhận được phán quyết trọng tài, nếu một bên có đủ căn cứ chứng minh Hội đồng trọng tài đã ra phán quyết thuộc trường hợp tại khoản 2 Điều 68 thì có quyền làm đơn gửi Tòa án có thẩm quyền yêu cầu hủy phán quyết trọng tài. Tòa án chỉ xem xét căn cứ hủy, không xét xử lại nội dung tranh chấp.","b":"Điều 68, khoản 1 Điều 69 Luật Trọng tài thương mại","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Thời hiệu khởi kiện tranh chấp này là bao lâu?","o":["03 năm như tranh chấp hợp đồng dân sự","01 năm kể từ ngày giao hàng","02 năm kể từ khi quyền lợi bị xâm phạm","05 năm kể từ ngày ký hợp đồng"],"a":2,"e":"Điều 319 Luật Thương mại 2005: thời hiệu khởi kiện áp dụng đối với các tranh chấp thương mại là 02 năm, kể từ thời điểm quyền và lợi ích hợp pháp bị xâm phạm (trừ trường hợp tại điểm e khoản 1 Điều 237 về dịch vụ logistics). Luật Thương mại là luật chuyên ngành nên được ưu tiên áp dụng so với thời hiệu 03 năm của Điều 429 BLDS.","b":"Điều 319 Luật Thương mại","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Tháng 10/2026, Phú Gia còn thời hiệu khởi kiện không?","o":["Còn, đến ngày 15/02/2027 mới hết","Không, vì phải khiếu nại trước trong 03 tháng","Không, thời hiệu đã hết ngày 15/02/2026","Còn, vì thời hiệu kéo dài đến năm 2030"],"a":0,"e":"Quyền lợi của Phú Gia bị xâm phạm từ khi hết hạn thanh toán (15/02/2025); thời hiệu 02 năm tính từ ngày 16/02/2025 đến hết ngày 15/02/2027 (Điều 319 Luật Thương mại; cách tính thời hạn theo BLDS). Tháng 10/2026 còn thời hiệu.","b":"Điều 319 Luật Thương mại","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Tòa án nào có thẩm quyền giải quyết sơ thẩm vụ án?","o":["Tòa án nhân dân thành phố Hà Nội, vì tranh chấp có giá trị lớn","Tòa án nhân dân tỉnh Bắc Ninh, nơi nguyên đơn có trụ sở","Trung tâm Trọng tài Quốc tế Việt Nam","Tòa án nhân dân khu vực có thẩm quyền tại Hà Nội"],"a":3,"e":"Đây là tranh chấp kinh doanh, thương mại giữa các tổ chức có mục đích lợi nhuận (khoản 1 Điều 30 BLTTDS), thuộc thẩm quyền sơ thẩm của Tòa án nhân dân khu vực (khoản 1 Điều 35 BLTTDS sửa đổi 2025). Theo lãnh thổ: Tòa án nơi bị đơn có trụ sở (điểm a khoản 1 Điều 39) hoặc nơi hợp đồng được thực hiện (điểm g khoản 1 Điều 40) – cả hai đều ở Hà Nội. Không có thỏa thuận trọng tài nên trọng tài không có thẩm quyền.","b":"Khoản 1 Điều 30, khoản 1 Điều 35 BLTTDS (sửa đổi 2025); Điều 39, điểm g khoản 1 Điều 40 BLTTDS","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"lv":"VD","q":"Nếu Tòa án chấp nhận toàn bộ yêu cầu 3 tỷ đồng, án phí sơ thẩm là bao nhiêu và ai chịu?","o":["150 triệu đồng; Hưng Thịnh chịu","92 triệu đồng; Hưng Thịnh chịu","42 triệu đồng; Phú Gia chịu","2 triệu đồng; mỗi bên một nửa"],"a":1,"e":"Danh mục án phí: tranh chấp kinh doanh, thương mại có giá ngạch từ trên 2 tỷ đến 4 tỷ đồng chịu 72.000.000 đồng + 2% phần vượt quá 2 tỷ: 72 + 2% × 1.000 triệu = 92 triệu đồng. Khoản 1 Điều 147 BLTTDS: đương sự có yêu cầu không được chấp nhận (ở đây là nghĩa vụ của Hưng Thịnh) phải chịu án phí.","b":"Danh mục án phí, lệ phí Tòa án; Khoản 1 Điều 147 BLTTDS","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Biển Xanh phải khiếu nại về việc thiếu 02 máy chậm nhất khi nào?","o":["Trong 12 tháng theo thời hạn bảo hành","Trong 06 tháng kể từ ngày giao hàng","Không có thời hạn, vì hàng giao thiếu","Trong 03 tháng kể từ ngày giao hàng"],"a":3,"e":"Điểm a khoản 1 Điều 318 Luật Thương mại 2005: trừ trường hợp có thỏa thuận khác, thời hạn khiếu nại về số lượng hàng hóa là 03 tháng kể từ ngày giao hàng. Giao ngày 10/01/2026 nên hạn khiếu nại đến ngày 10/4/2026; Biển Xanh phát hiện ngày 20/3/2026 vẫn kịp khiếu nại.","b":"Điều 318 Luật Thương mại","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"Nếu máy không có bảo hành, thời hạn khiếu nại về chất lượng là bao lâu?","o":["06 tháng kể từ ngày giao hàng","03 tháng kể từ ngày giao hàng","12 tháng kể từ ngày giao hàng","02 năm kể từ ngày giao hàng"],"a":0,"e":"Điểm b khoản 1 Điều 318 Luật Thương mại 2005: thời hạn khiếu nại về chất lượng hàng hóa là 06 tháng kể từ ngày giao hàng; trường hợp hàng hóa có bảo hành thì thời hạn khiếu nại là 03 tháng kể từ ngày hết thời hạn bảo hành.","b":"Điều 318 Luật Thương mại","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Máy có bảo hành 12 tháng (hết ngày 10/01/2027). Biển Xanh có thể khiếu nại về chất lượng 10 máy hỏng đến khi nào?","o":["Đến ngày 10/7/2026, tức 06 tháng kể từ ngày giao hàng","Đến ngày 10/4/2027, tức 03 tháng sau khi hết bảo hành","Đến ngày 10/01/2028, tức 12 tháng sau khi hết bảo hành","Không được khiếu nại, vì đã hết thời hạn bảo hành"],"a":1,"e":"Điểm b khoản 1 Điều 318 Luật Thương mại 2005: đối với hàng hóa có bảo hành, thời hạn khiếu nại là 03 tháng kể từ ngày hết thời hạn bảo hành. Bảo hành hết ngày 10/01/2027 nên khiếu nại được đến ngày 10/4/2027; tháng 02/2027 vẫn trong hạn.","b":"Điều 318 Luật Thương mại","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Nếu Sao Mai không giải quyết khiếu nại, thời hiệu khởi kiện của Biển Xanh là bao lâu?","o":["01 năm kể từ ngày khiếu nại","03 năm kể từ ngày giao hàng","02 năm kể từ khi quyền lợi bị xâm phạm","06 tháng kể từ ngày hết bảo hành"],"a":2,"e":"Điều 319 Luật Thương mại 2005: thời hiệu khởi kiện áp dụng đối với các tranh chấp thương mại là 02 năm kể từ thời điểm quyền và lợi ích hợp pháp bị xâm phạm.","b":"Điều 319 Luật Thương mại","cid":"TH4.03"}],"th":[{"name":"Chương 1. Địa vị pháp lý của các chủ thể kinh doanh","items":[{"cid":"TH1.01","title":"Bán hàng online chưa đăng ký kinh doanh","text":"Từ năm 2024, anh Tùng thường xuyên nhập quần áo từ các xưởng may để bán lại qua mạng xã hội, doanh thu mỗi tháng khoảng 300 triệu đồng, có thuê 03 nhân viên đóng gói. Anh chưa đăng ký kinh doanh. Tháng 5/2026, anh ký hợp đồng mua 2.000 sản phẩm của Công ty May Hà Thành nhưng không thanh toán đúng hạn; khi bị đòi, anh cho rằng mình \"chưa phải thương nhân nên không chịu trách nhiệm theo Luật Thương mại\". Anh Tùng dự định đăng ký kinh doanh nhưng muốn chỉ chịu trách nhiệm trong phạm vi số vốn bỏ ra.","ask":["Anh Tùng có phải là thương nhân không? Việc chưa đăng ký kinh doanh có giúp anh thoát trách nhiệm theo Luật Thương mại không?","Tư vấn cho anh Tùng hình thức tổ chức kinh doanh phù hợp với mong muốn chỉ chịu trách nhiệm hữu hạn."],"guide":["Thương nhân bao gồm tổ chức kinh tế được thành lập hợp pháp, cá nhân hoạt động thương mại một cách độc lập, thường xuyên và có đăng ký kinh doanh (khoản 1 Điều 6 Luật Thương mại). Anh Tùng hoạt động thương mại độc lập, thường xuyên với quy mô lớn nên thuộc diện phải đăng ký kinh doanh.","Thương nhân có nghĩa vụ đăng ký kinh doanh; trường hợp chưa đăng ký, thương nhân vẫn phải chịu trách nhiệm về mọi hoạt động của mình theo Luật Thương mại và pháp luật khác (Điều 7). Lập luận của anh Tùng không có cơ sở; anh còn có thể bị xử phạt vì kinh doanh không đăng ký.","Muốn chịu trách nhiệm hữu hạn, anh Tùng nên thành lập công ty trách nhiệm hữu hạn một thành viên: chủ sở hữu chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản khác của công ty trong phạm vi số vốn điều lệ (khoản 1 Điều 74 Luật Doanh nghiệp). Nếu thành lập doanh nghiệp tư nhân, anh phải chịu trách nhiệm bằng toàn bộ tài sản của mình (khoản 1 Điều 188)."],"basis":"Khoản 1 Điều 6, Điều 7 Luật Thương mại; Khoản 1 Điều 74, khoản 1 Điều 188 Luật Doanh nghiệp","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]},{"cid":"TH1.02","title":"Thành viên không góp đủ vốn đã cam kết","text":"Công ty TNHH Minh Phát (hai thành viên trở lên) được cấp Giấy chứng nhận đăng ký doanh nghiệp ngày 05/01/2026, vốn điều lệ 3 tỷ đồng: ông Hải cam kết góp 1,5 tỷ, bà Lan 1 tỷ, anh Sơn 0,5 tỷ. Đến hết thời hạn góp vốn, ông Hải góp đủ, bà Lan mới góp 600 triệu đồng, anh Sơn chưa góp gì. Tháng 6/2026, công ty phát sinh khoản nợ 800 triệu đồng với nhà cung cấp; công ty vẫn chưa đăng ký thay đổi vốn điều lệ.","ask":["Xác định thời hạn góp vốn và tư cách thành viên của bà Lan, anh Sơn sau thời hạn đó.","Công ty phải làm gì với vốn điều lệ? Bà Lan, anh Sơn chịu trách nhiệm thế nào đối với khoản nợ phát sinh trước khi đăng ký thay đổi vốn điều lệ?"],"guide":["Thành viên phải góp vốn đủ và đúng loại tài sản đã cam kết trong thời hạn 90 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp (khoản 2 Điều 47 Luật Doanh nghiệp).","Hết thời hạn: thành viên chưa góp vốn đương nhiên không còn là thành viên (anh Sơn); thành viên chưa góp đủ có các quyền tương ứng với phần vốn đã góp (bà Lan); phần vốn chưa góp được chào bán theo nghị quyết, quyết định của Hội đồng thành viên (khoản 3 Điều 47).","Công ty phải đăng ký thay đổi vốn điều lệ, tỷ lệ phần vốn góp bằng số vốn đã góp trong thời hạn 30 ngày kể từ ngày cuối cùng phải góp đủ vốn; thành viên chưa góp hoặc chưa góp đủ phải chịu trách nhiệm tương ứng với phần vốn góp đã cam kết đối với nghĩa vụ tài chính phát sinh trước ngày đăng ký thay đổi (khoản 4 Điều 47)."],"basis":"Khoản 2, khoản 3, khoản 4 Điều 47 Luật Doanh nghiệp","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]},{"cid":"TH1.03","title":"Cổ đông sáng lập muốn bán cổ phần cho người ngoài","text":"Công ty cổ phần Sao Việt được cấp Giấy chứng nhận đăng ký doanh nghiệp ngày 01/3/2025, có ba cổ đông sáng lập là ông A, bà B và ông C. Tháng 8/2026, ông A muốn chuyển nhượng toàn bộ cổ phần phổ thông của mình cho ông D (không phải cổ đông sáng lập). Ông A cho rằng mình có quyền tự do chuyển nhượng vì \"cổ phần là tài sản của tôi\" và đòi được biểu quyết tại Đại hội đồng cổ đông về việc này.","ask":["Ông A có được tự do chuyển nhượng cổ phần cho ông D không? Ông A có quyền biểu quyết về việc chuyển nhượng này không?","Từ thời điểm nào ông A được tự do chuyển nhượng cổ phần phổ thông cho người ngoài?"],"guide":["Trong thời hạn 03 năm kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp, cổ phần phổ thông của cổ đông sáng lập được tự do chuyển nhượng cho cổ đông sáng lập khác và chỉ được chuyển nhượng cho người không phải cổ đông sáng lập nếu được Đại hội đồng cổ đông chấp thuận (khoản 3 Điều 120 Luật Doanh nghiệp). Tháng 8/2026 vẫn trong thời hạn 03 năm.","Cổ đông sáng lập dự định chuyển nhượng không có quyền biểu quyết về việc chuyển nhượng cổ phần đó (khoản 3 Điều 120).","Hết thời hạn 03 năm (sau ngày 01/3/2028), các hạn chế đối với cổ phần phổ thông của cổ đông sáng lập được bãi bỏ; ông A được tự do chuyển nhượng."],"basis":"Khoản 3 Điều 120 Luật Doanh nghiệp; Điều 127 Luật Doanh nghiệp","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]},{"name":"Chương 2. Pháp luật về hợp đồng thương mại và các hoạt động thương mại","items":[{"cid":"TH2.01","title":"Giao gạo sớm, thiếu và kém chất lượng","text":"Công ty An Bình (bên bán) và Công ty Thịnh Phát (bên mua) ký hợp đồng mua bán 1.000 tấn gạo, giao tại kho của bên mua ngày 10/5/2026. Ngày 05/5/2026, An Bình chở hàng đến giao; Thịnh Phát chưa chuẩn bị kho nhưng vẫn nhận. Kiểm tra ngay khi nhận cho thấy chỉ có 900 tấn, trong đó 50 tấn bị ẩm mốc, không đúng chất lượng thỏa thuận. Đêm 06/5/2026, kho của Thịnh Phát bị dột làm hỏng thêm 20 tấn gạo đạt chất lượng đã nhận.","ask":["Đánh giá việc giao hàng sớm, giao thiếu và giao hàng không phù hợp của Công ty An Bình. Thịnh Phát có những quyền gì?","Ai chịu rủi ro đối với 20 tấn gạo bị hỏng do kho dột?"],"guide":["Giao hàng sớm hơn thời hạn: bên mua có quyền nhận hoặc không nhận nếu các bên không có thỏa thuận khác (Điều 38 Luật Thương mại). Thịnh Phát đã nhận.","Hàng thiếu số lượng và không đúng chất lượng là hàng hóa không phù hợp với hợp đồng (khoản 1 Điều 39); bên mua có quyền từ chối nhận 50 tấn gạo ẩm mốc (khoản 2 Điều 39), yêu cầu giao đủ phần còn thiếu và áp dụng chế tài theo hợp đồng.","Bên mua phải kiểm tra hàng hóa trong thời gian ngắn nhất mà hoàn cảnh thực tế cho phép và thông báo khiếm khuyết trong thời hạn hợp lý; bên bán không chịu trách nhiệm về khiếm khuyết mà bên mua đã biết hoặc phải biết nhưng không thông báo (Điều 44).","Rủi ro chuyển sang bên mua khi hàng hóa đã được giao cho bên mua tại địa điểm đã thỏa thuận (Điều 57); 20 tấn gạo hỏng do kho của bên mua sau khi đã nhận nên Thịnh Phát chịu rủi ro."],"basis":"Điều 38, Điều 39, Điều 44, Điều 57 Luật Thương mại","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]},{"cid":"TH2.02","title":"Môi giới bán lô máy móc","text":"Công ty Phúc An (bên được môi giới) thuê anh Long, một thương nhân hành nghề môi giới, tìm người mua lô máy móc trị giá 5 tỷ đồng với thù lao 1% giá trị hợp đồng. Anh Long giới thiệu Công ty Hưng Long; hai công ty ký hợp đồng mua bán ngày 10/6/2026. Sau đó, anh Long tự ý thay mặt Phúc An nhận 500 triệu đồng tiền đặt trước từ Hưng Long mà không được ủy quyền. Đến hạn, Hưng Long không có khả năng thanh toán phần còn lại; Phúc An đòi anh Long trả thay và từ chối trả thù lao.","ask":["Xác định quyền hưởng thù lao của anh Long. Anh Long có phải chịu trách nhiệm về việc Hưng Long không thanh toán không?","Việc anh Long tự nhận tiền đặt trước có đúng không?"],"guide":["Môi giới thương mại là hoạt động thương mại, theo đó một thương nhân làm trung gian cho các bên trong việc đàm phán, giao kết hợp đồng và được hưởng thù lao (Điều 150 Luật Thương mại).","Trừ trường hợp có thỏa thuận khác, quyền hưởng thù lao môi giới phát sinh từ thời điểm các bên được môi giới đã ký hợp đồng với nhau (Điều 153): anh Long được hưởng thù lao 1% × 5 tỷ = 50 triệu đồng từ ngày 10/6/2026.","Bên môi giới chịu trách nhiệm về tư cách pháp lý của các bên được môi giới, nhưng không chịu trách nhiệm về khả năng thanh toán của họ; không được tham gia thực hiện hợp đồng giữa các bên được môi giới, trừ trường hợp có ủy quyền (Điều 151). Việc tự ý nhận tiền là vi phạm nghĩa vụ."],"basis":"Điều 150, Điều 151, Điều 153 Luật Thương mại","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]},{"cid":"TH2.03","title":"Đại lý bao tiêu xi măng","text":"Công ty Xi măng Hoàng Thạch (bên giao đại lý) ký hợp đồng đại lý bao tiêu bằng văn bản với cửa hàng của bà Hà (thương nhân, bên đại lý): Công ty giao xi măng với giá 1.500.000 đồng/tấn, bà Hà tự định giá bán và hưởng phần chênh lệch. Bà Hà bán ra với giá 1.650.000 đồng/tấn. Chủ nợ của bà Hà đề nghị kê biên 100 tấn xi măng đang nằm trong kho của bà để trả nợ riêng. Một đêm, do bà Hà không bảo quản đúng yêu cầu, 30 tấn xi măng bị ngấm nước, hỏng hoàn toàn.","ask":["Xác định hình thức đại lý và thù lao của bà Hà. Ai là chủ sở hữu số xi măng trong kho?","Đề nghị kê biên của chủ nợ và trách nhiệm đối với 30 tấn xi măng bị hỏng được giải quyết thế nào?"],"guide":["Đại lý bao tiêu là hình thức đại lý mà bên đại lý thực hiện việc mua, bán trọn vẹn một khối lượng hàng hóa với giá do bên giao đại lý ấn định hoặc tự định giá (Điều 169 Luật Thương mại); thù lao là khoản chênh lệch giữa giá mua bán thực tế với giá bên giao đại lý ấn định (Điều 171): 150.000 đồng/tấn.","Bên giao đại lý là chủ sở hữu đối với hàng hóa giao cho bên đại lý (Điều 170); vì vậy chủ nợ riêng của bà Hà không thể kê biên số xi măng thuộc sở hữu của Công ty.","Bên đại lý có nghĩa vụ bảo quản hàng hóa sau khi nhận và chịu trách nhiệm liên đới với bên giao đại lý trong một số trường hợp (Điều 175); bà Hà có lỗi bảo quản nên phải bồi thường thiệt hại 30 tấn xi măng.","Hợp đồng đại lý phải được lập thành văn bản hoặc hình thức khác có giá trị pháp lý tương đương (Điều 168)."],"basis":"Điều 168, Điều 169, Điều 170, Điều 171, Điều 175 Luật Thương mại","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]}]},{"name":"Chương 3. Chế tài thương mại","items":[{"cid":"TH3.01","title":"Giao thiếu hàng: phạt vi phạm và bồi thường","text":"Công ty Đông Á bán cho Công ty Bảo Minh lô thiết bị trị giá 2 tỷ đồng. Hợp đồng quy định: \"Bên vi phạm chịu phạt 15% giá trị hợp đồng\", không đề cập việc bồi thường. Đông Á giao thiếu 20% lô hàng (trị giá 400 triệu đồng). Bảo Minh yêu cầu phạt 300 triệu đồng và bồi thường 120 triệu đồng lợi nhuận bị mất, nhưng mới chỉ cung cấp bảng tính nội bộ; sau khi biết bị giao thiếu, Bảo Minh không tìm nguồn hàng thay thế dù thị trường có sẵn.","ask":["Xác định mức phạt vi phạm hợp pháp. Bảo Minh có được yêu cầu đồng thời phạt vi phạm và bồi thường thiệt hại không?","Bảo Minh phải chứng minh những gì để được bồi thường? Việc không tìm nguồn hàng thay thế ảnh hưởng thế nào?"],"guide":["Mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm (Điều 301 Luật Thương mại). Phần bị vi phạm là 400 triệu đồng nên mức phạt tối đa là 32 triệu đồng; thỏa thuận 15% toàn bộ giá trị hợp đồng vượt mức luật định.","Trường hợp các bên có thỏa thuận phạt vi phạm thì bên bị vi phạm có quyền áp dụng cả chế tài phạt vi phạm và buộc bồi thường thiệt hại, trừ trường hợp Luật Thương mại có quy định khác (khoản 2 Điều 307) – khác với Bộ luật Dân sự.","Căn cứ bồi thường: có hành vi vi phạm, có thiệt hại thực tế, hành vi vi phạm là nguyên nhân trực tiếp gây thiệt hại (Điều 303); bên yêu cầu bồi thường phải chứng minh tổn thất, mức độ tổn thất và khoản lợi trực tiếp đáng lẽ được hưởng (Điều 304). Bảng tính nội bộ chưa đủ.","Bên yêu cầu bồi thường phải áp dụng biện pháp hợp lý để hạn chế tổn thất; nếu không áp dụng thì bên vi phạm có quyền yêu cầu giảm bớt giá trị bồi thường bằng mức tổn thất đáng lẽ có thể hạn chế được (Điều 305)."],"basis":"Điều 301 Luật Thương mại; Khoản 2 Điều 307 Luật Thương mại; Điều 303, Điều 304 Luật Thương mại; Điều 305 Luật Thương mại","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]},{"cid":"TH3.02","title":"Giao hàng chậm vì mưa lũ","text":"Công ty Nông sản Miền Trung ký hợp đồng ngày 01/3/2026 giao 500 tấn cà phê cho Công ty Xuất khẩu Sài Gòn vào ngày 30/6/2026. Từ ngày 20/6 đến 10/7/2026, mưa lũ lịch sử làm sập cầu, chia cắt tuyến đường duy nhất từ kho ra quốc lộ; cơ quan có thẩm quyền xác nhận đây là thiên tai. Công ty Miền Trung không thông báo cho bên mua, đến ngày 25/7/2026 mới giao hàng. Bên mua yêu cầu phạt vi phạm vì giao chậm.","ask":["Công ty Miền Trung có được miễn trách nhiệm không? Ai có nghĩa vụ chứng minh?","Hậu quả của việc không thông báo cho bên mua và thời hạn thực hiện nghĩa vụ được kéo dài thế nào?"],"guide":["Bên vi phạm được miễn trách nhiệm khi xảy ra sự kiện bất khả kháng (điểm b khoản 1 Điều 294 Luật Thương mại). Mưa lũ lịch sử làm chia cắt tuyến đường duy nhất là sự kiện khách quan, không thể lường trước và không thể khắc phục dù đã áp dụng mọi biện pháp cần thiết.","Bên vi phạm có nghĩa vụ chứng minh các trường hợp miễn trách nhiệm (khoản 2 Điều 294).","Bên vi phạm phải thông báo ngay bằng văn bản cho bên kia về trường hợp miễn trách nhiệm và hậu quả có thể xảy ra; nếu không thông báo hoặc thông báo không kịp thời thì phải bồi thường thiệt hại phát sinh do việc không thông báo (Điều 295).","Nếu các bên không thỏa thuận được, thời hạn thực hiện nghĩa vụ được tính thêm bằng thời gian xảy ra bất khả kháng cộng thời gian hợp lý để khắc phục hậu quả, nhưng không quá 05 tháng đối với hàng hóa có thời hạn giao không quá 12 tháng kể từ khi giao kết (điểm a khoản 1 Điều 296)."],"basis":"Điều 294, Điều 295, Điều 296 Luật Thương mại; Điều 156 BLDS","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4"]},{"cid":"TH3.03","title":"Bên mua chậm thanh toán, bên bán hủy hợp đồng","text":"Công ty Thép Việt ký hợp đồng bán cho Công ty Xây dựng Hòa Bình 3.000 tấn thép, giao làm 03 đợt, mỗi đợt 1.000 tấn; thanh toán từng đợt trong 15 ngày sau khi nhận hàng. Hợp đồng thỏa thuận: \"Chậm thanh toán quá 30 ngày là điều kiện để bên bán tạm ngừng giao hàng.\" Hòa Bình nhận đợt 1 nhưng quá 45 ngày vẫn không thanh toán; Thép Việt tạm ngừng giao đợt 2. Sau đó Hòa Bình tuyên bố không có khả năng thanh toán và không cần thép nữa; Thép Việt quyết định hủy bỏ hợp đồng và đã thông báo ngay cho Hòa Bình.","ask":["Việc tạm ngừng giao đợt 2 có hợp pháp không? Hậu quả pháp lý của tạm ngừng?","Thép Việt có quyền hủy bỏ hợp đồng không? Hậu quả của việc hủy bỏ và quyền lợi của Thép Việt đối với tiền hàng đợt 1?"],"guide":["Tạm ngừng thực hiện hợp đồng được áp dụng khi xảy ra hành vi vi phạm mà các bên đã thỏa thuận là điều kiện để tạm ngừng hoặc một bên vi phạm cơ bản (Điều 308 Luật Thương mại). Chậm thanh toán quá 30 ngày là điều kiện đã thỏa thuận nên việc tạm ngừng là hợp pháp; khi tạm ngừng, hợp đồng vẫn còn hiệu lực (Điều 309).","Vi phạm cơ bản là vi phạm gây thiệt hại cho bên kia đến mức làm cho bên kia không đạt được mục đích giao kết hợp đồng (khoản 13 Điều 3). Hòa Bình không thanh toán và từ chối nhận hàng là vi phạm cơ bản, Thép Việt có quyền hủy bỏ hợp đồng (Điều 312) và phải thông báo ngay (Điều 315).","Hậu quả: hợp đồng không có hiệu lực từ thời điểm giao kết, các bên không phải tiếp tục thực hiện nghĩa vụ; các bên có quyền đòi lại lợi ích do việc đã thực hiện phần nghĩa vụ của mình; bên bị vi phạm có quyền yêu cầu bồi thường thiệt hại (Điều 314). Thép Việt có quyền đòi tiền hàng đợt 1 (hoặc đòi lại hàng) và lãi chậm trả theo lãi suất nợ quá hạn trung bình trên thị trường (Điều 306)."],"basis":"Điều 308, Điều 309 Luật Thương mại; Khoản 13 Điều 3, Điều 312, Điều 315 Luật Thương mại; Điều 314 Luật Thương mại; Điều 306 Luật Thương mại","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]}]},{"name":"Chương 4. Giải quyết tranh chấp thương mại","items":[{"cid":"TH4.01","title":"Điều khoản trọng tài không ghi tên tổ chức","text":"Hợp đồng mua bán giữa Công ty A và Công ty B (đều là thương nhân Việt Nam) ghi: \"Mọi tranh chấp phát sinh từ hợp đồng này được giải quyết bằng trọng tài\". Hợp đồng không ghi tổ chức trọng tài hay hình thức trọng tài. Khi tranh chấp phát sinh, hai bên không thỏa thuận lại được; Công ty A khởi kiện tại Tòa án, Công ty B phản đối. Sau đó, Hội đồng trọng tài ra phán quyết; Công ty A nhận phán quyết ngày 02/9/2026 và muốn \"kháng cáo\".","ask":["Thỏa thuận trọng tài có hiệu lực và thực hiện được không? Tòa án xử lý đơn khởi kiện của Công ty A thế nào?","Công ty A có thể \"kháng cáo\" phán quyết trọng tài không? Nếu không, A có cách nào?"],"guide":["Thỏa thuận trọng tài phải được xác lập dưới dạng văn bản (Điều 16 Luật Trọng tài thương mại). Thỏa thuận không chỉ rõ hình thức trọng tài hoặc tổ chức trọng tài không làm thỏa thuận vô hiệu; khi các bên không thỏa thuận lại được thì việc lựa chọn hình thức, tổ chức trọng tài được thực hiện theo yêu cầu của nguyên đơn (khoản 4 Điều 43).","Khi các bên đã có thỏa thuận trọng tài mà một bên khởi kiện tại Tòa án thì Tòa án phải từ chối thụ lý, trừ trường hợp thỏa thuận trọng tài vô hiệu hoặc không thể thực hiện được (Điều 6).","Phán quyết trọng tài là chung thẩm (khoản 5 Điều 4), không bị kháng cáo. Trong 30 ngày kể từ ngày nhận phán quyết, bên có đủ căn cứ theo khoản 2 Điều 68 có quyền làm đơn yêu cầu Tòa án có thẩm quyền hủy phán quyết trọng tài (Điều 69)."],"basis":"Điều 16, khoản 4 Điều 43 Luật Trọng tài thương mại; Điều 6 Luật Trọng tài thương mại; Khoản 5 Điều 4, Điều 68, Điều 69 Luật Trọng tài thương mại","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]},{"cid":"TH4.02","title":"Khởi kiện đòi tiền hàng tại Tòa án","text":"Công ty Phú Gia (trụ sở tại tỉnh Bắc Ninh) bán cho Công ty Hưng Thịnh (trụ sở tại Hà Nội) lô hàng trị giá 3 tỷ đồng, giao tại kho của Hưng Thịnh ở Hà Nội; hạn thanh toán ngày 15/02/2025. Hợp đồng không có thỏa thuận trọng tài. Hưng Thịnh không thanh toán. Tháng 10/2026, Phú Gia chuẩn bị khởi kiện.","ask":["Xác định thời hiệu khởi kiện và Tòa án có thẩm quyền.","Tính án phí sơ thẩm nếu Tòa án chấp nhận toàn bộ yêu cầu của Phú Gia."],"guide":["Thời hiệu khởi kiện tranh chấp thương mại là 02 năm kể từ thời điểm quyền và lợi ích hợp pháp bị xâm phạm (Điều 319 Luật Thương mại): từ ngày 16/02/2025 đến ngày 15/02/2027; tháng 10/2026 còn thời hiệu.","Tranh chấp phát sinh trong hoạt động kinh doanh, thương mại giữa các tổ chức có mục đích lợi nhuận (khoản 1 Điều 30 BLTTDS), thuộc thẩm quyền sơ thẩm của Tòa án nhân dân khu vực (khoản 1 Điều 35 BLTTDS sửa đổi 2025); theo lãnh thổ: Tòa án nơi bị đơn có trụ sở hoặc nơi hợp đồng được thực hiện (Điều 39, Điều 40 BLTTDS) – đều ở Hà Nội.","Án phí kinh doanh, thương mại có giá ngạch từ trên 2 tỷ đến 4 tỷ đồng: 72 triệu đồng + 2% phần vượt 2 tỷ = 72 + 20 = 92 triệu đồng, do Hưng Thịnh chịu nếu thua kiện (Danh mục án phí; khoản 1 Điều 147 BLTTDS)."],"basis":"Điều 319 Luật Thương mại; Khoản 1 Điều 30, khoản 1 Điều 35 BLTTDS (sửa đổi 2025); Điều 39, điểm g khoản 1 Điều 40 BLTTDS; Danh mục án phí, lệ phí Tòa án; Khoản 1 Điều 147 BLTTDS","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4"]},{"cid":"TH4.03","title":"Khiếu nại về chất lượng hàng hóa có bảo hành","text":"Ngày 10/01/2026, Công ty Điện máy Sao Mai giao cho Công ty Khách sạn Biển Xanh 50 máy điều hòa, bảo hành 12 tháng. Ngày 20/3/2026, Biển Xanh phát hiện thiếu 02 máy so với hợp đồng. Tháng 02/2027, sau khi hết bảo hành, 10 máy hỏng máy nén do lỗi sản xuất. Hợp đồng không thỏa thuận thời hạn khiếu nại.","ask":["Xác định thời hạn khiếu nại về số lượng và về chất lượng đối với hàng hóa có bảo hành.","Nếu khiếu nại không được giải quyết, Biển Xanh có thời hiệu khởi kiện bao lâu?"],"guide":["Trừ trường hợp có thỏa thuận khác, thời hạn khiếu nại về số lượng hàng hóa là 03 tháng kể từ ngày giao hàng; về chất lượng là 06 tháng kể từ ngày giao hàng; đối với hàng hóa có bảo hành thì thời hạn khiếu nại là 03 tháng kể từ ngày hết thời hạn bảo hành (Điều 318 Luật Thương mại).","Khiếu nại thiếu 02 máy phải gửi trước ngày 10/4/2026 (03 tháng từ 10/01/2026). Bảo hành hết ngày 10/01/2027 nên khiếu nại về chất lượng 10 máy có thể gửi đến ngày 10/4/2027.","Thời hiệu khởi kiện tranh chấp thương mại là 02 năm kể từ thời điểm quyền và lợi ích hợp pháp bị xâm phạm (Điều 319)."],"basis":"Điều 318 Luật Thương mại; Điều 319 Luật Thương mại","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]}]}],"vb":[{"name":"Văn bản pháp luật cần tra cứu","rows":[{"t":"Luật Thương mại số 36/2005/QH11","d":"","org":"","note":"Thương nhân, hoạt động thương mại, hợp đồng và hoạt động thương mại; phải đối chiếu sửa đổi, bổ sung và văn bản hợp nhất.","url":"https://thuvienphapluat.vn/van-ban/Thuong-mai/Luat-Thuong-mai-2005-36-2005-QH11-2633.aspx"},{"t":"Luật Doanh nghiệp số 59/2020/QH14, được sửa đổi, bổ sung bởi Luật số 76/2025/QH15","d":"","org":"","note":"Thành lập, tổ chức quản lý, loại hình doanh nghiệp, quyền và nghĩa vụ của doanh nghiệp, tổ chức lại và giải thể.","url":"https://thuvie
