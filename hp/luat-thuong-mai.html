nphapluat.vn/van-ban/Doanh-nghiep/Luat-Doanh-nghiep-2020-427301.aspx"},{"t":"Luật Đầu tư số 143/2025/QH15","d":"","org":"","note":"Điều kiện đầu tư kinh doanh và tổ chức kinh tế có vốn đầu tư nước ngoài; kiểm tra hiệu lực, văn bản hướng dẫn và chuyển tiếp.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=143/2025/QH15&match=True"},{"t":"Luật Hợp tác xã số 17/2023/QH15","d":"","org":"","note":"Địa vị pháp lý, tổ chức và hoạt động của hợp tác xã, liên hiệp hợp tác xã.","url":"https://thuvienphapluat.vn/van-ban/doanh-nghiep/Luat-Hop-tac-xa-2023-17-2023-QH15-499239.aspx"},{"t":"Bộ luật Dân sự số 91/2015/QH13","d":"","org":"","note":"Quy định chung về giao dịch, hợp đồng, đại diện, nghĩa vụ và trách nhiệm dân sự khi được áp dụng bổ sung.","url":"https://thuvienphapluat.vn/van-ban/Quyen-dan-su/Bo-luat-Dan-su-2015-296215.aspx"},{"t":"Luật Phục hồi, phá sản số 142/2025/QH15 (hiệu lực 01/03/2026)","d":"","org":"","note":"Phục hồi, phá sản doanh nghiệp và hợp tác xã; Luật Phá sản 2014 hết hiệu lực theo Điều 87, trừ trường hợp chuyển tiếp tại Điều 88.","url":"https://vbpl.moj.gov.vn/bocongthuong/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"t":"Luật Bảo vệ quyền lợi người tiêu dùng số 19/2023/QH15","d":"","org":"","note":"Giao dịch thương mại có người tiêu dùng; nghĩa vụ cung cấp thông tin và bảo vệ người tiêu dùng.","url":"https://thuviennhadat.vn/vbpl/luat-bao-ve-quyen-loi-nguoi-tieu-dung-2023-19-2023-qh15-500102.html"},{"t":"Luật Cạnh tranh số 23/2018/QH14","d":"","org":"","note":"Thỏa thuận hạn chế cạnh tranh, lạm dụng vị trí thống lĩnh/vị trí độc quyền và tập trung kinh tế.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=23/2018/QH14&match=True"},{"t":"Luật Giao dịch điện tử số 20/2023/QH15","d":"","org":"","note":"Thông điệp dữ liệu, giao dịch điện tử và giá trị pháp lý của thông tin điện tử.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=20/2023/QH15&match=True"},{"t":"Luật Quản lý ngoại thương số 05/2017/QH14","d":"","org":"","note":"Xuất khẩu, nhập khẩu, tạm nhập tái xuất, chuyển khẩu và hoạt động ngoại thương liên quan.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=05/2017/QH14&match=True"},{"t":"Luật Quảng cáo số 16/2012/QH13 và văn bản sửa đổi/hướng dẫn còn hiệu lực","d":"","org":"","note":"Quảng cáo thương mại; cần đối chiếu các sửa đổi và quy định chuyên ngành tại thời điểm áp dụng.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=16/2012/QH13&match=True"},{"t":"Luật Đấu thầu số 22/2023/QH15 và văn bản sửa đổi, bổ sung","d":"","org":"","note":"Đấu thầu hàng hóa, dịch vụ trong phạm vi điều chỉnh của pháp luật đấu thầu.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=22/2023/QH15&match=True"},{"t":"Luật Thương mại điện tử số 122/2025/QH15 (hiệu lực 01/07/2026)","d":"","org":"","note":"Giao dịch thương mại điện tử; đọc cùng nghị định hướng dẫn và quy định chuyển tiếp.","url":"https://vanban.chinhphu.vn/?classid=1&amp;docid=216503&amp;pageid=27160&amp;typegroupid=3"},{"t":"Nghị định 248/2026/NĐ-CP (hiệu lực 01/07/2026)","d":"","org":"","note":"Quy định chi tiết một số điều của Luật Thương mại điện tử.","url":"https://vanban.chinhphu.vn/?docid=218747&amp;pageid=27160"},{"t":"Văn bản hợp nhất 60/VBHN-VPQH ngày 15/08/2025 về Luật Trọng tài thương mại","d":"","org":"","note":"Bản hợp nhất để tra cứu; không đồng nhất văn bản hợp nhất với một luật sửa đổi độc lập.","url":"https://vanban.chinhphu.vn/?classid=2629&amp;docid=214982&amp;pageid=27160"},{"t":"Luật Đầu tư số 143/2025/QH15 (hiệu lực 01/03/2026)","d":"","org":"","note":"Điều kiện đầu tư kinh doanh và tổ chức kinh tế có vốn đầu tư nước ngoài.","url":"https://vanban.chinhphu.vn/?docid=216524&amp;pageid=27160"}]}],"al":[],"ly":{"root":"Luật Thương mại","ch":[{"t":"Chương 1. Địa vị pháp lý của các chủ thể kinh doanh","cs":"","b":[],"c":[{"t":"Khái quát về thương nhân và hoạt động thương mại","cs":"","b":["Hoạt động thương mại là hoạt động nhằm mục đích sinh lợi, bao gồm mua bán hàng hóa, cung ứng dịch vụ, đầu tư, xúc tiến thương mại và các hoạt động nhằm mục đích sinh lợi khác theo quy định pháp luật. Thương nhân gồm tổ chức kinh tế được thành lập hợp pháp và cá nhân hoạt động thương mại độc lập, thường xuyên, có đăng ký kinh doanh theo điều kiện luật định.","Cần phân biệt hoạt động thương mại (xác định theo tính chất, mục đích của hoạt động), thương nhân (xác định theo tư cách chủ thể) và doanh nghiệp (một loại tổ chức kinh tế được thành lập, đăng ký theo pháp luật doanh nghiệp). Không phải mọi chủ thể tham gia một giao dịch có tính chất thương mại đều mặc nhiên là doanh nghiệp."]},{"t":"Doanh nghiệp và các loại hình doanh nghiệp","cs":"","b":["Doanh nghiệp là tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định pháp luật nhằm mục đích kinh doanh. Việc xác định loại hình doanh nghiệp quyết định cơ cấu tổ chức, chế độ tài sản, quyền quản lý và phạm vi trách nhiệm của chủ sở hữu hoặc thành viên.","Doanh nghiệp tư nhân: Do một cá nhân làm chủ; chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản của mình đối với hoạt động của doanh nghiệp.","Công ty hợp danh: Có thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản theo luật; có thể có thành viên góp vốn chịu trách nhiệm trong phạm vi vốn cam kết góp.","Công ty TNHH: Gồm công ty TNHH một thành viên và từ hai thành viên trở lên; trách nhiệm tài sản của chủ sở hữu/thành viên về nguyên tắc gắn với phần vốn theo luật.","Công ty cổ phần: Vốn điều lệ chia thành cổ phần; có ít nhất ba cổ đông và không hạn chế số lượng tối đa theo luật; cổ đông chịu trách nhiệm trong phạm vi vốn góp."]},{"t":"Hộ kinh doanh và hợp tác xã","cs":"","b":["Hộ kinh doanh và hợp tác xã là các mô hình tổ chức hoạt động kinh doanh có cơ sở pháp lý và chế độ tổ chức riêng, không đồng nhất với các loại hình doanh nghiệp theo Luật Doanh nghiệp. Khi xác định quyền, nghĩa vụ và trách nhiệm tài sản phải áp dụng đúng luật điều chỉnh từng mô hình, không suy rộng quy tắc của công ty sang hộ kinh doanh hoặc hợp tác xã."]},{"t":"Doanh nghiệp nhà nước và doanh nghiệp có vốn đầu tư nước ngoài","cs":"","b":["Việc nhận diện doanh nghiệp nhà nước cần căn cứ tiêu chí sở hữu vốn hoặc quyền chi phối theo Luật Doanh nghiệp. Đối với tổ chức kinh tế có vốn đầu tư nước ngoài, cần đồng thời xem xét pháp luật doanh nghiệp và pháp luật đầu tư, nhất là điều kiện tiếp cận thị trường, thủ tục đầu tư và quy định chuyển tiếp."]},{"t":"Quyền tự do kinh doanh và nguyên tắc pháp luật thương mại","cs":"","b":["Quyền tự do kinh doanh được thực hiện trong khuôn khổ Hiến pháp và pháp luật; ngành, nghề bị cấm và ngành, nghề đầu tư kinh doanh có điều kiện phải được xác định theo văn bản hiện hành. Khi phân tích nguyên tắc pháp luật thương mại, cần xem xét bình đẳng, tự do thỏa thuận trong giới hạn luật, thiện chí và trung thực, bảo vệ lợi ích hợp pháp và các nguyên tắc điều chỉnh hoạt động thương mại quốc tế theo điều ước/hiệp định có liên quan."]},{"t":"Phân loại thương nhân và chế độ trách nhiệm tài sản","cs":"","b":["Phân loại thương nhân cần dựa vào hình thức pháp lý và tư cách hoạt động. Khi so sánh trách nhiệm vô hạn và trách nhiệm hữu hạn, cần xác định tài sản của chủ thể, tư cách thành viên, ngoại lệ do luật quy định và hậu quả khi chấm dứt hoạt động; không đồng nhất trách nhiệm của doanh nghiệp với trách nhiệm của người đại diện."]},{"t":"Thành lập và tổ chức quản lý doanh nghiệp","cs":"","b":["Phân tích quyền thành lập, chủ thể không được quyền thành lập/quản lý theo luật, điều kiện gia nhập thị trường, hồ sơ đăng ký, tên doanh nghiệp, ngành nghề, người đại diện theo pháp luật, cơ cấu quản lý và quyền, nghĩa vụ của chủ sở hữu/thành viên/cổ đông. Đối với doanh nghiệp có điều kiện đầu tư kinh doanh, phải kiểm tra điều kiện chuyên ngành ngoài thủ tục đăng ký doanh nghiệp."]},{"t":"Tổ chức lại, giải thể và phá sản doanh nghiệp","cs":"","b":["Tổ chức lại gồm các hình thức theo luật doanh nghiệp như chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình. Giải thể chỉ được tiến hành khi đáp ứng điều kiện luật định, trong đó có việc thanh toán các khoản nợ và nghĩa vụ tài sản; phá sản được xử lý theo pháp luật về phục hồi, phá sản. Phải xác định luật có hiệu lực tại thời điểm phát sinh sự kiện và quy định chuyển tiếp trước khi tư vấn."]},{"t":"Hợp tác xã","cs":"","b":["Hợp tác xã là mô hình kinh tế tập thể có quy chế thành viên, vốn góp, tài sản, cơ cấu quản lý và cơ chế phân phối riêng. Phân tích địa vị pháp lý phải dựa trực tiếp vào Luật Hợp tác xã 2023 và văn bản hiện hành; không áp dụng máy móc quy tắc về cổ đông công ty cổ phần. Cần xem xét điều kiện gia nhập, quyền và nghĩa vụ thành viên, tổ chức quản lý, tổ chức lại, giải thể và phá sản."]},{"t":"Phá sản doanh nghiệp","cs":"","b":["Phá sản là tình trạng pháp lý được xác định và xử lý theo trình tự luật định khi doanh nghiệp, hợp tác xã mất khả năng thanh toán và bị Tòa án nhân dân ra quyết định tuyên bố phá sản. Cần phân biệt mất khả năng thanh toán với việc chỉ có một khoản nợ đến hạn chưa trả; đồng thời phân biệt phá sản với giải thể về căn cứ, thủ tục và hậu quả pháp lý."]},{"t":"Trọng tâm ôn tập","cs":"","b":["xác định đúng tư cách chủ thể; so sánh chế độ trách nhiệm tài sản; phân biệt doanh nghiệp với hộ kinh doanh, hợp tác xã; phân biệt phá sản với giải thể. Các điều kiện, ngưỡng và thủ tục cụ thể phải đối chiếu văn bản hiện hành."]}]},{"t":"Chương 2. Pháp luật về hợp đồng thương mại và các hoạt động thương mại","cs":"","b":[],"c":[{"t":"Hợp đồng trong hoạt động thương mại","cs":"","b":["Hợp đồng thương mại là thỏa thuận làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ trong hoạt động thương mại. Khi xác định pháp luật áp dụng cần xem xét chủ thể, mục đích giao dịch, loại hoạt động, quy định chuyên ngành và mối quan hệ giữa Luật Thương mại với Bộ luật Dân sự. Không nên chỉ căn cứ tên gọi của hợp đồng để kết luận bản chất pháp lý.","Các vấn đề cần phân tích gồm: chủ thể và thẩm quyền đại diện; đề nghị và chấp nhận giao kết; hình thức; nội dung và điều kiện có hiệu lực; thực hiện nghĩa vụ; sửa đổi, chấm dứt; vi phạm và trách nhiệm pháp lý. Hình thức hợp đồng phải tuân theo quy định chung và yêu cầu riêng của từng loại giao dịch."]},{"t":"Hợp đồng thương mại quốc tế và nguồn luật","cs":"","b":["Với hợp đồng có yếu tố nước ngoài, cần xác định phạm vi lựa chọn luật, điều ước quốc tế có thể áp dụng, quy phạm xung đột và tập quán được viện dẫn. CISG 1980 có thể điều chỉnh hợp đồng mua bán hàng hóa quốc tế khi thỏa điều kiện áp dụng; không mặc nhiên áp dụng cho mọi hợp đồng thương mại. PICC 2016 là bộ nguyên tắc hợp đồng thương mại quốc tế, cần xác định cơ sở vận dụng trong từng giao dịch.","Incoterms 2020 của ICC phân bổ một số nghĩa vụ giao hàng, chi phí và rủi ro theo điều kiện được các bên viện dẫn; không thay thế toàn bộ hợp đồng và không tự quyết định mọi vấn đề về chuyển quyền sở hữu hoặc hiệu lực hợp đồng. UCP 600, URC 522 và ISP98 là các quy tắc thực hành ngân hàng quốc tế có thể liên quan đến tín dụng chứng từ, nhờ thu và cam kết dự phòng khi được dẫn chiếu/áp dụng phù hợp."]},{"t":"Mua bán hàng hóa","cs":"","b":["Hợp đồng mua bán hàng hóa làm phát sinh nghĩa vụ giao hàng, chuyển quyền sở hữu theo thỏa thuận và quy định pháp luật, đồng thời phát sinh nghĩa vụ thanh toán và tiếp nhận hàng. Khi giải quyết tranh chấp cần kiểm tra mô tả hàng hóa, số lượng, chất lượng, giá, thời hạn và địa điểm giao nhận, chứng từ, kiểm tra hàng hóa, chuyển rủi ro, bảo hành và khiếu nại."]},{"t":"Cung ứng dịch vụ","cs":"","b":["Trong hợp đồng cung ứng dịch vụ, bên cung ứng thực hiện dịch vụ và nhận thanh toán; bên sử dụng dịch vụ có nghĩa vụ phối hợp, cung cấp thông tin cần thiết và thanh toán theo thỏa thuận, pháp luật. Nội dung hợp đồng cần xác định rõ phạm vi công việc, tiêu chuẩn chất lượng, sản phẩm bàn giao, thời hạn, nghiệm thu, bảo mật và trách nhiệm khi không đạt yêu cầu."]},{"t":"Trung gian thương mại","cs":"","b":["Các hoạt động trung gian thương mại theo Luật Thương mại gồm đại diện cho thương nhân, môi giới thương mại, ủy thác mua bán hàng hóa và đại lý thương mại. Phải phân biệt căn cứ đại diện, việc nhân danh ai khi giao dịch, quyền hưởng thù lao và trách nhiệm với bên thứ ba; tên gọi gần nhau không làm các chế định này trở thành một."]},{"t":"Xúc tiến thương mại","cs":"","b":["Nhóm hoạt động xúc tiến thương mại gồm khuyến mại, quảng cáo thương mại, trưng bày, giới thiệu hàng hóa, dịch vụ và hội chợ, triển lãm thương mại. Mỗi hình thức có mục đích và điều kiện riêng; ngoài Luật Thương mại cần đối chiếu pháp luật quảng cáo, bảo vệ quyền lợi người tiêu dùng và các quy định chuyên ngành có liên quan."]},{"t":"Logistics và các hoạt động thương mại khác","cs":"","b":["Dịch vụ logistics gắn với một hoặc nhiều công việc như nhận hàng, vận chuyển, lưu kho, lưu bãi, làm thủ tục và các dịch vụ hỗ trợ hàng hóa theo thỏa thuận và pháp luật. Khi phân tích trách nhiệm cần làm rõ phạm vi dịch vụ, tư cách các bên, giới hạn trách nhiệm nếu được pháp luật cho phép, sự kiện miễn trách nhiệm và nghĩa vụ thông báo.","Đối với đấu giá hàng hóa, gia công trong thương mại, quá cảnh, tạm nhập tái xuất, chuyển khẩu và các hoạt động khác thuộc đề cương, cần xác định luật chung và luật chuyên ngành áp dụng cho từng loại hình. Không dùng một quy tắc duy nhất cho mọi hoạt động thương mại."]},{"t":"Đấu giá và đấu thầu hàng hóa, dịch vụ","cs":"","b":["Đấu giá và đấu thầu là các cơ chế khác nhau về mục tiêu, vai trò các bên, trình tự và tiêu chí lựa chọn. Khi xử lý tình huống phải xác định hoạt động thuộc phạm vi Luật Thương mại hay pháp luật đấu thầu chuyên ngành; không áp dụng một trình tự chung cho cả hai."]},{"t":"Nhượng quyền thương mại","cs":"","b":["Phân tích quyền sử dụng mô hình kinh doanh, nhãn hiệu/hệ thống nhận diện, phí nhượng quyền, hỗ trợ kỹ thuật, kiểm soát chất lượng và nghĩa vụ công bố thông tin theo luật. Điều khoản bảo mật, không cạnh tranh và hạn chế cạnh tranh cần được xem xét cùng pháp luật sở hữu trí tuệ, cạnh tranh và quy định bắt buộc có liên quan."]},{"t":"Trọng tâm ôn tập","cs":"","b":["Phương pháp xử lý bài tập: (1) định danh giao dịch; (2) xác định chủ thể và thẩm quyền; (3) tìm luật điều chỉnh; (4) xác định nghĩa vụ chính; (5) đối chiếu hành vi thực tế với nghĩa vụ; (6) xác định hậu quả và cơ chế giải quyết tranh chấp."]}]},{"t":"Chương 3. Chế tài thương mại","cs":"","b":[],"c":[{"t":"Khái niệm, đặc điểm chế tài thương mại","cs":"","b":["Chế tài thương mại là hậu quả pháp lý áp dụng với bên vi phạm trong quan hệ thương mại khi có đủ căn cứ luật định hoặc thỏa thuận hợp pháp. Cần xác định quan hệ hợp đồng, luật điều chỉnh, nghĩa vụ cụ thể, hành vi vi phạm, chứng cứ và quyền yêu cầu; phân biệt chế tài theo Luật Thương mại với trách nhiệm dân sự nói chung."]},{"t":"Căn cứ áp dụng chế tài","cs":"","b":["Đối chiếu điều khoản hợp đồng với nghĩa vụ thực tế, thời hạn, chất lượng, thông báo/khiếu nại và tài liệu chứng minh. Không kết luận chỉ từ việc một bên không hài lòng; phải xác định vi phạm và căn cứ pháp lý tương ứng.","Điều kiện áp dụng phụ thuộc từng chế tài. Xem xét quy định miễn trách nhiệm, điều khoản phạt, giới hạn hoặc loại trừ trách nhiệm trong phạm vi luật cho phép; thỏa thuận không đương nhiên có hiệu lực nếu trái quy định bắt buộc."]},{"t":"Các hình thức chế tài thương mại","cs":"","b":["Yêu cầu bên vi phạm tiếp tục thực hiện đúng nghĩa vụ hoặc áp dụng biện pháp khắc phục theo luật; xác định nghĩa vụ còn có thể thực hiện, cách sửa chữa/thay thế và chi phí phát sinh.","Phạt vi phạm: cần có thỏa thuận phạt hợp pháp. Theo Điều 301 Luật Thương mại 2005, mức phạt thông thường không quá 8% giá trị phần nghĩa vụ hợp đồng bị vi phạm, trừ trường hợp luật quy định khác.","Bồi thường: xem xét hành vi vi phạm, thiệt hại thực tế, quan hệ nhân quả trực tiếp và chứng cứ; bên yêu cầu phải chứng minh tổn thất, đồng thời thực hiện nghĩa vụ hạn chế tổn thất. Phạt và bồi thường có thể cùng được yêu cầu nếu đáp ứng điều kiện luật định và thỏa thuận.","Tạm ngừng là tạm thời không thực hiện nghĩa vụ; đình chỉ chấm dứt thực hiện hợp đồng theo điều kiện luật định; hủy bỏ làm phát sinh hậu quả pháp lý riêng đối với hiệu lực và nghĩa vụ hoàn trả. Phải phân biệt căn cứ, thời điểm có hiệu lực, nghĩa vụ thông báo và hậu quả."]},{"t":"Miễn trách nhiệm trong thương mại","cs":"","b":["Kiểm tra các trường hợp miễn trách nhiệm theo Luật Thương mại, gồm trường hợp đã thỏa thuận hợp lệ, bất khả kháng, vi phạm hoàn toàn do lỗi của bên kia và trường hợp thực hiện quyết định của cơ quan nhà nước có thẩm quyền trong điều kiện luật định. Bên viện dẫn phải chứng minh căn cứ và tuân thủ nghĩa vụ thông báo. Khó khăn kinh tế hoặc chi phí tăng không tự động là bất khả kháng."]},{"t":"Đối chiếu pháp luật hợp đồng quốc tế","cs":"","b":["CISG áp dụng cho hợp đồng mua bán hàng hóa quốc tế thuộc phạm vi Công ước; PICC 2016 được vận dụng theo cơ chế pháp lý thích hợp, không tự động thay luật quốc gia. Trọng tâm so sánh: vi phạm cơ bản, dự liệu thiệt hại, hạn chế tổn thất và nguyên tắc ưu tiên bảo tồn hợp đồng. Force majeure và hardship là hai vấn đề khác nhau, cần xét theo văn bản được áp dụng."]},{"t":"Trọng tâm ôn tập","cs":"","b":["Trình tự phân tích: luật áp dụng → nghĩa vụ → vi phạm → căn cứ chế tài → miễn trách nhiệm → thiệt hại/chứng cứ → thông báo và thời hạn."]}]},{"t":"Chương 4. Giải quyết tranh chấp thương mại","cs":"","b":[],"c":[{"t":"Tranh chấp thương mại","cs":"","b":["Tranh chấp thương mại là bất đồng về quyền, nghĩa vụ hoặc lợi ích liên quan đến hoạt động thương mại. Định danh dựa trên quan hệ thực tế, chủ thể, yêu cầu và quy phạm xác định thẩm quyền, không chỉ dựa vào tên gọi của vụ việc.","Nguyên nhân có thể đến từ quản trị, thông tin, thực hiện nghĩa vụ hoặc yếu tố thị trường, chuỗi cung ứng, chính sách. Hồ sơ cần xác định chủ thể, quan hệ pháp luật, nghĩa vụ tranh chấp, yêu cầu, chứng cứ, luật áp dụng, phương thức giải quyết và khả năng thi hành."]},{"t":"Giải quyết tranh chấp trong nước","cs":"","b":["Thương lượng: các bên tự trao đổi, linh hoạt nhưng phụ thuộc thiện chí. Hòa giải: người thứ ba trung lập hỗ trợ các bên tự nguyện tìm giải pháp; phân biệt hòa giải thương mại theo Nghị định 22/2017/NĐ-CP với hòa giải trong tố tụng. Trọng tài: cần thỏa thuận trọng tài hợp lệ và tranh chấp thuộc thẩm quyền; phán quyết có tính chung thẩm theo luật. Tòa án: giải quyết theo thẩm quyền và thủ tục tố tụng, kết quả có thể được cưỡng chế thi hành.","Nguyên tắc gồm tự nguyện, bình đẳng, bảo mật theo quy định, độc lập và vô tư của hòa giải viên, thỏa thuận không trái luật và đạo đức xã hội. Trình tự gồm yêu cầu, lựa chọn hòa giải viên, chuẩn bị, phiên hòa giải và ghi nhận kết quả. Phân biệt thỏa thuận hòa giải thành với quyết định được công nhận hoặc thi hành theo cơ chế pháp luật tương ứng. Công ước Singapore 2019 chỉ áp dụng trong phạm vi điều kiện của Công ước; không suy đoán tình trạng thành viên của Việt Nam.","Phân biệt trọng tài quy chế và trọng tài vụ việc; kiểm tra hình thức, hiệu lực và phạm vi thỏa thuận trọng tài, thẩm quyền, việc thành lập hội đồng, thủ tục, phán quyết và chi phí. Nguyên tắc kompetenz-kompetenz liên quan quyền hội đồng trọng tài xem xét thẩm quyền của mình, không loại trừ vai trò Tòa án trong trường hợp luật quy định. Thủ tục hủy phán quyết không phải xét xử lại nội dung như phúc thẩm.","Tòa án giải quyết tranh chấp thuộc thẩm quyền và hỗ trợ/giám sát trọng tài trong phạm vi luật quy định, như biện pháp khẩn cấp, một số vấn đề chứng cứ, hủy phán quyết hoặc công nhận và thi hành phán quyết nước ngoài. Phải xác định đúng căn cứ, thủ tục và văn bản có hiệu lực tại thời điểm xử lý."]},{"t":"Giải quyết tranh chấp thương mại quốc tế","cs":"","b":["DSU là cơ chế giải quyết tranh chấp giữa các thành viên WTO, không phải cơ chế xử lý tranh chấp hợp đồng tư nhân. Phân tích tham vấn, hội thẩm, thông qua báo cáo, thực hiện khuyến nghị và vấn đề thực tiễn của cơ chế phúc thẩm.","Kiểm tra điều khoản chọn luật, chọn Tòa án/trọng tài, địa điểm, ngôn ngữ, tống đạt, bảo toàn chứng cứ và khả năng thi hành. Khi không có thỏa thuận chọn luật, áp dụng quy phạm xung đột thích hợp và yếu tố kết nối; luật nơi ký hợp đồng không đương nhiên luôn được áp dụng.","Công ước New York 1958 điều chỉnh công nhận và thi hành phán quyết trọng tài nước ngoài trong phạm vi áp dụng. Công nhận bản án Tòa án nước ngoài theo cơ chế khác. Xác định nguồn gốc quyết định, điều ước liên quan, thẩm quyền, thủ tục và căn cứ từ chối theo pháp luật áp dụng."]},{"t":"Trọng tâm ôn tập","cs":"","b":["Chọn phương thức: kiểm tra thỏa thuận giải quyết tranh chấp, thời hiệu, chi phí, tốc độ, bảo mật, biện pháp khẩn cấp, yếu tố nước ngoài và khả năng thi hành."]}]}]}}</script>
