<script id="pn-data" type="application/json">{"meta":{"id":"luat-doanh-nghiep","name":"Luật Doanh nghiệp","title":"Tài liệu Luật Doanh nghiệp","menuTitle":"Luật Doanh nghiệp","asof":"01/11/2026","note":"Học phần Luật Doanh nghiệp đã được phát hành chính thức trên Phúc Nguyên Library ngày 01/11/2026. Mốc đối chiếu pháp luật: 01/11/2026.","laws":[{"re":"Luật Doanh nghiệp|VBHN 67/VBHN-VPQH","doc":"https://congbao.chinhphu.vn/cong-bao/cong-bao-so-1105-1106-ngay-31-08-2025-45864.htm"},{"re":"Luật 76/2025/QH15|Luật số 76/2025/QH15","doc":"https://chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"re":"Luật 03/2022/QH15|Luật số 03/2022/QH15","doc":"https://vanban.chinhphu.vn/?docid=206167&pageid=27160"},{"re":"Nghị định 168/2025/NĐ-CP","doc":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"re":"Nghị định 296/2026/NĐ-CP","doc":"https://chinhphu.vn/?classid=1&docid=218986&orggroupid=2&pageid=27160"},{"re":"Luật 143/2025/QH15|Luật Đầu tư","doc":"https://vanban.chinhphu.vn/?docid=216524&pageid=27160"},{"re":"Luật 68/2025/QH15|Luật Quản lý và đầu tư vốn nhà nước|VBHN 60/VBHN-VPQH","doc":"https://chinhphu.vn/?classid=2629&docid=217300&pageid=27160"},{"re":"Nghị định 366/2025/NĐ-CP","doc":"https://chinhphu.vn/?classid=1&docid=216383&pageid=27160&typegroupid=4"},{"re":"Luật 142/2025/QH15|Luật Phục hồi, phá sản","doc":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"re":"Luật 56/2024/QH15|Luật Chứng khoán","doc":"https://vanban.chinhphu.vn/?classid=1&docid=198541&pageid=27160&typegroupid=3"},{"re":"Luật Thương mại","doc":"https://vanban.chinhphu.vn/?classid=1&docid=14765&pageid=27160"},{"re":"Bộ luật Dân sự|BLDS","doc":"https://chinhphu.vn/default.aspx?docid=183188&pageid=27160"},{"re":"Luật Hợp tác xã","doc":"https://vanban.chinhphu.vn/?docid=208365&pageid=27160"}]},"chapters":[{"n":1,"name":"Địa vị pháp lý của doanh nghiệp và những vấn đề chung"},{"n":2,"name":"Thành lập, đăng ký doanh nghiệp và vốn góp"},{"n":3,"name":"Công ty trách nhiệm hữu hạn"},{"n":4,"name":"Công ty cổ phần"},{"n":5,"name":"Công ty hợp danh và doanh nghiệp tư nhân"},{"n":6,"name":"Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty"},{"n":7,"name":"Tổ chức lại, giải thể và phục hồi, phá sản"}],"q":[{"id":"LDN101","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, phạm vi điều chỉnh chủ yếu của Luật bao gồm nội dung nào?","o":["Toàn bộ hoạt động đầu tư của mọi nhà đầu tư trong nền kinh tế","Mọi quan hệ hợp đồng giữa thương nhân với nhau","Thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; nhóm công ty","Việc thành lập và hoạt động của tất cả tổ chức xã hội"],"a":2,"e":"Điều 1 xác định Luật Doanh nghiệp điều chỉnh việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp, công ty; không điều chỉnh toàn bộ hoạt động đầu tư hoặc mọi quan hệ hợp đồng thương mại.","b":"Điều 1 Luật Doanh nghiệp"},{"id":"LDN102","g":1,"lv":"TH","q":"Những chủ thể nào thuộc đối tượng áp dụng của Luật Doanh nghiệp?","o":["Doanh nghiệp và cơ quan, tổ chức, cá nhân có liên quan đến việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động của doanh nghiệp","Chỉ doanh nghiệp đã được cấp Giấy chứng nhận đăng ký doanh nghiệp","Chỉ chủ sở hữu và người đại diện theo pháp luật của doanh nghiệp","Chỉ cơ quan đăng ký kinh doanh"],"a":0,"e":"Đối tượng áp dụng không chỉ là doanh nghiệp đã đăng ký mà còn bao gồm cơ quan, tổ chức, cá nhân có liên quan đến việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động của doanh nghiệp.","b":"Điều 2 Luật Doanh nghiệp"},{"id":"LDN103","g":1,"lv":"TH","q":"Khi một vấn đề về doanh nghiệp được Luật Doanh nghiệp và luật chuyên ngành cùng điều chỉnh, cách xác định luật áp dụng phù hợp nhất là gì?","o":["Luôn áp dụng Luật Doanh nghiệp vì đây là luật chuyên biệt về chủ thể","Luôn áp dụng văn bản được ban hành sau, không cần xét điều khoản liên quan","Các bên được tự do chọn bất kỳ luật nào","Áp dụng quy định về áp dụng luật tại Điều 3 và quy định của luật chuyên ngành tương ứng"],"a":3,"e":"Điều 3 đặt ra nguyên tắc áp dụng Luật Doanh nghiệp cùng quy định của luật chuyên ngành tương ứng. Không thể mặc nhiên ưu tiên Luật Doanh nghiệp hoặc chỉ căn cứ văn bản ban hành sau mà bỏ qua quy tắc áp dụng luật.","b":"Điều 3 Luật Doanh nghiệp"},{"id":"LDN104","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, doanh nghiệp được hiểu là gì?","o":["Mọi cá nhân có hoạt động tạo ra thu nhập","Tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định của pháp luật nhằm mục đích kinh doanh","Mọi tổ chức có tài khoản ngân hàng và sử dụng lao động","Mọi đơn vị phụ thuộc của thương nhân"],"a":1,"e":"Khái niệm doanh nghiệp đòi hỏi đồng thời các dấu hiệu: có tên riêng, tài sản, trụ sở giao dịch, được thành lập hoặc đăng ký thành lập hợp pháp và nhằm mục đích kinh doanh. Cá nhân kinh doanh hoặc đơn vị phụ thuộc không mặc nhiên là doanh nghiệp.","b":"Khoản 10 Điều 4 Luật Doanh nghiệp"},{"id":"LDN105","g":1,"lv":"TH","q":"Nhận định nào phân biệt chính xác doanh nghiệp với thương nhân?","o":["Doanh nghiệp và thương nhân là hai thuật ngữ đồng nhất","Doanh nghiệp là tổ chức theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế hoặc cá nhân đáp ứng điều kiện của Luật Thương mại","Mọi thương nhân đều phải là công ty có tư cách pháp nhân","Cá nhân không thể là thương nhân"],"a":1,"e":"Doanh nghiệp là tổ chức được thành lập hoặc đăng ký theo pháp luật doanh nghiệp; thương nhân theo Luật Thương mại có thể là tổ chức kinh tế hoặc cá nhân đáp ứng điều kiện luật định. Hai khái niệm có phạm vi không hoàn toàn trùng nhau.","b":"Khoản 10 Điều 4 Luật Doanh nghiệp; khoản 1 Điều 6 Luật Thương mại"},{"id":"LDN106","g":1,"lv":"NB","q":"Luật Doanh nghiệp quy định những loại hình doanh nghiệp nào?","o":["Công ty TNHH, công ty cổ phần, hộ kinh doanh và hợp tác xã","Công ty TNHH, công ty hợp danh, hợp tác xã và doanh nghiệp nhà nước","Công ty cổ phần, hộ kinh doanh, doanh nghiệp tư nhân và tổ hợp tác","Công ty TNHH, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân"],"a":3,"e":"Điều 1 liệt kê bốn loại hình doanh nghiệp: công ty trách nhiệm hữu hạn, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân. Hộ kinh doanh và hợp tác xã không phải loại hình doanh nghiệp theo danh mục này.","b":"Điều 1 Luật Doanh nghiệp"},{"id":"LDN107","g":1,"lv":"TH","q":"Hộ kinh doanh được xử lý thế nào khi xác định phạm vi các loại hình doanh nghiệp theo Luật Doanh nghiệp?","o":["Không thuộc bốn loại hình doanh nghiệp được liệt kê tại Điều 1; đăng ký và hoạt động theo quy định riêng có liên quan","Được coi là công ty TNHH một thành viên","Là một loại hình doanh nghiệp thứ năm","Mặc nhiên có tư cách pháp nhân như công ty"],"a":0,"e":"Hộ kinh doanh không thuộc bốn loại hình doanh nghiệp tại Điều 1 Luật Doanh nghiệp và được đăng ký, hoạt động theo quy định riêng. Vì vậy không thể đồng nhất hộ kinh doanh với công ty TNHH hoặc mặc nhiên coi có tư cách pháp nhân.","b":"Điều 1 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP"},{"id":"LDN108","g":1,"lv":"TH","q":"Quyền tự do kinh doanh của doanh nghiệp được thể hiện cơ bản như thế nào?","o":["Chỉ được kinh doanh ngành nghề ghi trong Giấy chứng nhận đăng ký doanh nghiệp","Được kinh doanh cả ngành, nghề bị cấm nếu có đăng ký","Được tự do kinh doanh ngành, nghề mà luật không cấm, đồng thời phải đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện","Chỉ được kinh doanh sau khi có chấp thuận riêng cho từng giao dịch"],"a":2,"e":"Quyền tự do kinh doanh cho phép doanh nghiệp kinh doanh ngành, nghề mà luật không cấm; riêng ngành, nghề đầu tư kinh doanh có điều kiện, doanh nghiệp phải đáp ứng điều kiện tương ứng trước khi hoạt động.","b":"Điều 7 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013"},{"id":"LDN109","g":1,"lv":"VD","q":"Doanh nghiệp đã đăng ký ngành nghề kinh doanh có điều kiện nhưng chưa đáp ứng điều kiện chuyên ngành thì nhận định nào đúng?","o":["Giấy chứng nhận đăng ký doanh nghiệp tự thay thế mọi giấy phép, điều kiện chuyên ngành","Doanh nghiệp được kinh doanh vì ngành nghề đã được ghi nhận trong hồ sơ","Doanh nghiệp được miễn điều kiện trong năm đầu hoạt động","Doanh nghiệp chỉ được tiến hành hoạt động khi đáp ứng đủ điều kiện theo pháp luật chuyên ngành"],"a":3,"e":"Việc ghi nhận ngành, nghề trong hồ sơ đăng ký doanh nghiệp không thay thế giấy phép hoặc điều kiện chuyên ngành. Doanh nghiệp chỉ được tiến hành hoạt động kinh doanh có điều kiện khi đáp ứng đầy đủ yêu cầu pháp luật.","b":"Điều 7 Luật Doanh nghiệp"},{"id":"LDN110","g":1,"lv":"TH","q":"Nghĩa vụ nào được Luật Doanh nghiệp đặt ra đối với doanh nghiệp?","o":["Chỉ nộp thuế khi có lợi nhuận","Thực hiện chế độ kế toán, lập và nộp báo cáo tài chính, kê khai và nộp thuế cùng các nghĩa vụ luật định","Chỉ báo cáo khi cơ quan nhà nước yêu cầu bằng văn bản","Không phải bảo đảm quyền lợi người lao động nếu doanh nghiệp nhỏ"],"a":1,"e":"Điều 8 quy định các nghĩa vụ cơ bản của doanh nghiệp, trong đó có tổ chức công tác kế toán, lập và nộp báo cáo tài chính, kê khai và nộp thuế, cùng việc thực hiện các nghĩa vụ khác theo pháp luật. Nghĩa vụ không chỉ phát sinh khi có lợi nhuận.","b":"Điều 8 Luật Doanh nghiệp"},{"id":"LDN111","g":1,"lv":"VD","q":"Một công ty kê khai vốn điều lệ 10 tỷ đồng nhưng các thành viên chỉ góp 2 tỷ đồng, không thực hiện thủ tục điều chỉnh theo quy định. Hành vi này có thể bị nhận diện thế nào?","o":["Là quyền tự do định đoạt vốn, không bị điều chỉnh","Chỉ là vi phạm nội bộ không liên quan pháp luật doanh nghiệp","Là hành vi kê khai khống vốn điều lệ thuộc nhóm hành vi bị nghiêm cấm","Được hợp pháp hóa nếu công ty có doanh thu"],"a":2,"e":"Kê khai vốn điều lệ không đúng thực tế và không thực hiện điều chỉnh theo quy định có thể cấu thành hành vi kê khai khống vốn điều lệ bị nghiêm cấm. Doanh thu hoặc thỏa thuận nội bộ không hợp pháp hóa hành vi này.","b":"Khoản 5 Điều 16 Luật Doanh nghiệp"},{"id":"LDN112","g":1,"lv":"NB","q":"Luật Doanh nghiệp sửa đổi năm 2025 xác định chủ sở hữu hưởng lợi của doanh nghiệp có tư cách pháp nhân là ai?","o":["Cá nhân có quyền sở hữu trên thực tế vốn điều lệ hoặc có quyền chi phối đối với doanh nghiệp, trừ trường hợp luật loại trừ","Người trực tiếp ký hợp đồng thuê trụ sở","Mọi người đại diện theo pháp luật","Người đứng tên kế toán trưởng"],"a":0,"e":"Chủ sở hữu hưởng lợi được xác định theo quyền sở hữu thực tế vốn điều lệ hoặc quyền chi phối doanh nghiệp theo tiêu chí luật định; không đồng nhất với người đại diện theo pháp luật, người ký hợp đồng hoặc người đứng tên chức danh kế toán.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"LDN113","g":1,"lv":"VD","q":"Một cá nhân đứng tên trên hồ sơ nhưng thực tế không sở hữu vốn, không có quyền chi phối; người khác mới là người thực tế kiểm soát doanh nghiệp. Khi xác định chủ sở hữu hưởng lợi, cần căn cứ vào yếu tố nào?","o":["Quyền sở hữu trên thực tế vốn điều lệ hoặc quyền chi phối thực tế theo tiêu chí pháp luật","Chỉ căn cứ tên ghi trên Giấy chứng nhận đăng ký doanh nghiệp","Chỉ căn cứ người giữ con dấu","Chỉ căn cứ người trực tiếp điều hành hằng ngày"],"a":0,"e":"Việc xác định chủ sở hữu hưởng lợi phải xem xét quyền sở hữu và quyền chi phối thực tế, kể cả sở hữu gián tiếp; không chỉ căn cứ người đứng tên trên giấy tờ đăng ký hoặc người trực tiếp điều hành công việc hằng ngày.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"LDN114","g":1,"lv":"TH","q":"Sau sửa đổi năm 2025, doanh nghiệp có nghĩa vụ nào liên quan đến chủ sở hữu hưởng lợi?","o":["Công khai toàn bộ dữ liệu cá nhân của chủ sở hữu hưởng lợi trên website","Chỉ lưu thông tin trong 30 ngày","Thu thập, cập nhật, lưu giữ thông tin và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu","Không phải cập nhật khi có thay đổi"],"a":2,"e":"Doanh nghiệp có trách nhiệm thu thập, cập nhật, lưu giữ thông tin chủ sở hữu hưởng lợi và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu. Nghĩa vụ này không đồng nghĩa với việc công khai toàn bộ dữ liệu cá nhân trên website.","b":"Khoản 5a Điều 8 Luật Doanh nghiệp"},{"id":"LDN115","g":1,"lv":"VD","q":"Doanh nghiệp được thành lập trước ngày 01/07/2025 phải bổ sung thông tin về chủ sở hữu hưởng lợi vào thời điểm nào theo quy định chuyển tiếp?","o":["Bắt buộc trong 10 ngày kể từ ngày 01/07/2025","Đồng thời khi thực hiện thủ tục đăng ký thay đổi hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp chủ động bổ sung sớm hơn","Chỉ khi doanh nghiệp giải thể","Không bao giờ phải bổ sung"],"a":1,"e":"Khoản 1 Điều 3 Luật 76/2025/QH15 đặt ra quy định chuyển tiếp đối với doanh nghiệp thành lập trước ngày 01/07/2025: bổ sung thông tin chủ sở hữu hưởng lợi khi thực hiện lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn.","b":"Khoản 1 Điều 3 Luật 76/2025/QH15"},{"id":"LDN116","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, ai có thể là người đại diện theo pháp luật của doanh nghiệp?","o":["Chỉ chủ sở hữu doanh nghiệp","Chỉ Chủ tịch Hội đồng quản trị","Bất kỳ người lao động nào được giao giữ con dấu","Cá nhân đại diện cho doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện trước cơ quan giải quyết tranh chấp theo luật"],"a":3,"e":"Người đại diện theo pháp luật là cá nhân đại diện cho doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện doanh nghiệp trước cơ quan giải quyết tranh chấp, theo phạm vi và cách thức luật, Điều lệ quy định.","b":"Khoản 1 Điều 12 Luật Doanh nghiệp"},{"id":"LDN117","g":1,"lv":"VD","q":"Công ty TNHH có hai người đại diện theo pháp luật. Điều lệ không phân định rõ quyền, nghĩa vụ của từng người. Đối với bên thứ ba, nguyên tắc xử lý nào được áp dụng?","o":["Mỗi người chỉ có quyền ký khi người kia đồng ý bằng văn bản","Chỉ người có tên đầu tiên trong Giấy chứng nhận đăng ký doanh nghiệp có quyền đại diện","Mỗi người đại diện theo pháp luật đều là đại diện đủ thẩm quyền của doanh nghiệp trước bên thứ ba; các người đại diện chịu trách nhiệm theo quy định của luật","Giao dịch do một người ký luôn vô hiệu"],"a":2,"e":"Khi công ty có nhiều người đại diện theo pháp luật mà Điều lệ không phân định rõ quyền, nghĩa vụ, khoản 2 Điều 12 bảo vệ giao dịch với bên thứ ba bằng nguyên tắc mỗi người đại diện đều có đủ thẩm quyền đại diện trước bên thứ ba; trách nhiệm nội bộ được xử lý theo luật.","b":"Khoản 2 Điều 12 Luật Doanh nghiệp"},{"id":"LDN118","g":1,"lv":"NB","q":"Cơ quan nào là cơ quan có thẩm quyền cấp Giấy chứng nhận đăng ký doanh nghiệp theo quy định hiện hành?","o":["Ủy ban nhân dân cấp xã","Tòa án nhân dân khu vực","Cơ quan thuế cấp xã","Cơ quan đăng ký kinh doanh cấp tỉnh"],"a":3,"e":"Cơ quan đăng ký kinh doanh cấp tỉnh thực hiện thẩm quyền đăng ký doanh nghiệp theo cơ cấu và phân cấp hiện hành. UBND cấp xã, Tòa án hoặc cơ quan thuế không phải cơ quan cấp Giấy chứng nhận đăng ký doanh nghiệp.","b":"Điều 14, Điều 26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP"},{"id":"LDN119","g":1,"lv":"TH","q":"Giấy chứng nhận đăng ký doanh nghiệp có ý nghĩa pháp lý nào?","o":["Là văn bản ghi nhận thông tin đăng ký doanh nghiệp; không thay thế điều kiện, giấy phép chuyên ngành nếu pháp luật yêu cầu","Là giấy phép cho phép doanh nghiệp kinh doanh mọi ngành nghề có điều kiện","Là chứng nhận doanh nghiệp đã hoàn thành mọi nghĩa vụ thuế","Là văn bản xác nhận doanh nghiệp không còn nghĩa vụ với chủ nợ"],"a":0,"e":"Giấy chứng nhận đăng ký doanh nghiệp ghi nhận thông tin đăng ký doanh nghiệp. Văn bản này không phải giấy phép kinh doanh chung và không miễn trừ điều kiện, giấy phép chuyên ngành đối với ngành, nghề kinh doanh có điều kiện.","b":"Điều 28, Điều 7 Luật Doanh nghiệp"},{"id":"LDN120","g":1,"lv":"VD","q":"Một công ty sử dụng tài liệu giả để kê khai hồ sơ thành lập và cố ý kê khai vốn điều lệ không đúng thực tế. Nhận định nào phù hợp nhất?","o":["Đây là hành vi được phép nếu các thành viên đồng ý","Có thể thuộc các hành vi bị nghiêm cấm và làm phát sinh trách nhiệm pháp lý theo quy định liên quan","Chỉ phát sinh trách nhiệm dân sự với nhau, không có hậu quả pháp lý khác","Chỉ bị xử lý nếu doanh nghiệp đã có lãi"],"a":1,"e":"Sử dụng tài liệu giả và kê khai vốn điều lệ không đúng thực tế thuộc nhóm hành vi bị nghiêm cấm theo Điều 16; tùy tính chất, hậu quả, hành vi còn có thể làm phát sinh trách nhiệm hành chính, dân sự hoặc hình sự theo quy định liên quan.","b":"Khoản 4, khoản 5 Điều 16 Luật Doanh nghiệp"},{"id":"TH1.01.1","cid":"TH1.01","g":1,"q":"Anh Minh có thể được xác định là thương nhân theo Luật Thương mại trên cơ sở dữ kiện nào?","o":["Chỉ vì có doanh thu thì đương nhiên là thương nhân","Chỉ khi có từ 10 lao động trở lên","Vì hoạt động thương mại độc lập, thường xuyên và đáp ứng điều kiện đăng ký kinh doanh theo luật","Chỉ khi thành lập công ty cổ phần"],"a":2,"e":"Phân tích tình huống: Vì hoạt động thương mại độc lập, thường xuyên và đáp ứng điều kiện đăng ký kinh doanh theo luật.","b":"Khoản 1 Điều 6 Luật Thương mại"},{"id":"TH1.01.2","cid":"TH1.01","g":1,"q":"Việc chưa đăng ký kinh doanh có làm anh Minh đương nhiên được miễn trách nhiệm đối với hợp đồng đã ký không?","o":["Không; nghĩa vụ đăng ký và trách nhiệm đối với hoạt động đã thực hiện được xem xét theo Luật Thương mại và pháp luật liên quan","Có, vì chưa có tư cách thương nhân","Có, nếu hợp đồng không công chứng","Có, trừ khi bên bán chứng minh được thiệt hại"],"a":0,"e":"Phân tích tình huống: Không; nghĩa vụ đăng ký và trách nhiệm đối với hoạt động đã thực hiện được xem xét theo Luật Thương mại và pháp luật liên quan.","b":"Điều 7 Luật Thương mại"},{"id":"TH1.01.3","cid":"TH1.01","g":1,"q":"Nếu muốn tổ chức hoạt động dưới hình thức doanh nghiệp và giới hạn trách nhiệm tài sản theo nguyên tắc của công ty, loại hình nào có thể được cân nhắc?","o":["Doanh nghiệp tư nhân","Hộ kinh doanh","Chi nhánh của Công ty Ánh Dương","Công ty TNHH một thành viên"],"a":3,"e":"Phân tích tình huống: Công ty TNHH một thành viên.","b":"Khoản 1 Điều 74; khoản 1 Điều 188 Luật Doanh nghiệp"},{"id":"TH1.01.4","cid":"TH1.01","g":1,"q":"Nếu anh Minh thành lập doanh nghiệp tư nhân, trách nhiệm tài sản của anh được xác định thế nào?","o":["Chỉ trong phạm vi vốn điều lệ","Bằng toàn bộ tài sản của chủ doanh nghiệp tư nhân","Chỉ bằng tài sản đã đăng ký tại trụ sở","Không chịu trách nhiệm với khoản nợ trước đăng ký"],"a":1,"e":"Phân tích tình huống: Bằng toàn bộ tài sản của chủ doanh nghiệp tư nhân.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp"},{"id":"TH1.02.1","cid":"TH1.02","g":1,"q":"Theo Luật Doanh nghiệp đã được sửa đổi năm 2025, bà Hạnh có được thành lập và quản lý doanh nghiệp trong tình huống này không?","o":["Có, vì chỉ góp dưới 50% vốn","Không, vì cán bộ, công chức, viên chức thuộc nhóm bị hạn chế, trừ trường hợp ngoại lệ được luật quy định","Có, nếu người em đồng ý","Có, nếu công ty không kinh doanh với cơ quan nhà nước"],"a":1,"e":"Phân tích tình huống: Không, vì cán bộ, công chức, viên chức thuộc nhóm bị hạn chế, trừ trường hợp ngoại lệ được luật quy định.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.2","cid":"TH1.02","g":1,"q":"Việc bà Hạnh chỉ dự định góp 20% vốn có làm thay đổi kết luận về quyền góp vốn không?","o":["Có, vì tỷ lệ dưới 50% luôn được phép","Có, nếu không giữ chức danh quản lý","Có, nếu vốn góp là tài sản riêng","Không; cần xem xét quy định về đối tượng không được góp vốn theo pháp luật cán bộ, công chức, viên chức và phòng, chống tham nhũng"],"a":3,"e":"Phân tích tình huống: Không; cần xem xét quy định về đối tượng không được góp vốn theo pháp luật cán bộ, công chức, viên chức và phòng, chống tham nhũng.","b":"Điểm b khoản 3 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.3","cid":"TH1.02","g":1,"q":"Người em của bà Hạnh có thể thành lập công ty nếu bản thân không thuộc trường hợp bị cấm không?","o":["Có, quyền của người em được xác định độc lập theo các điều kiện luật định","Không, vì có quan hệ thân thích với công chức","Chỉ được thành lập doanh nghiệp tư nhân","Chỉ được thành lập nếu bà Hạnh đứng tên đại diện"],"a":0,"e":"Phân tích tình huống: Có, quyền của người em được xác định độc lập theo các điều kiện luật định.","b":"Khoản 1, khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.4","cid":"TH1.02","g":1,"q":"Ngoại lệ được bổ sung năm 2025 đối với cán bộ, công chức, viên chức liên quan đến lĩnh vực nào?","o":["Mọi lĩnh vực kinh doanh có điều kiện","Bất động sản và chứng khoán","Khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia theo quy định pháp luật","Chỉ hoạt động thương mại điện tử"],"a":2,"e":"Phân tích tình huống: Khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia theo quy định pháp luật.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.03.1","cid":"TH1.03","g":1,"q":"Ai có thể được xác định là chủ sở hữu hưởng lợi của Công ty Sao Bắc theo tiêu chí luật định?","o":["Chỉ ông Nam vì là người đứng tên 60% vốn","Chỉ bà Hoa vì là người đứng tên vốn thấp hơn","Kế toán trưởng công ty","Ông Phúc nếu chứng minh được quyền sở hữu trên thực tế vốn hoặc quyền chi phối đối với công ty"],"a":3,"e":"Phân tích tình huống: Ông Phúc nếu chứng minh được quyền sở hữu trên thực tế vốn hoặc quyền chi phối đối với công ty.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"TH1.03.2","cid":"TH1.03","g":1,"q":"Luật Doanh nghiệp sửa đổi năm 2025 đặt ra nghĩa vụ nào đối với thông tin chủ sở hữu hưởng lợi?","o":["Chỉ ghi nhận khi công ty phát hành cổ phần","Thu thập, cập nhật, lưu giữ và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu","Không cần lưu giữ nếu đã có người đại diện theo pháp luật","Chỉ công khai trên website doanh nghiệp"],"a":1,"e":"Phân tích tình huống: Thu thập, cập nhật, lưu giữ và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu.","b":"Khoản 5a Điều 8; điểm h khoản 1 Điều 11 Luật Doanh nghiệp"},{"id":"TH1.03.3","cid":"TH1.03","g":1,"q":"Công ty thành lập trước ngày 01/07/2025 phải bổ sung thông tin chủ sở hữu hưởng lợi vào thời điểm nào?","o":["Trong 03 ngày từ khi luật có hiệu lực","Chỉ khi thay đổi chủ tịch công ty","Đồng thời với lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn","Chỉ khi cơ quan thuế yêu cầu"],"a":2,"e":"Phân tích tình huống: Đồng thời với lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn.","b":"Khoản 1 Điều 3 Luật 76/2025/QH15"},{"id":"TH1.03.4","cid":"TH1.03","g":1,"q":"Nhận định nào đúng về trách nhiệm đối với thông tin kê khai?","o":["Người thành lập hoặc doanh nghiệp tự kê khai và chịu trách nhiệm trước pháp luật về tính hợp pháp, trung thực, chính xác theo quy định","Chỉ cơ quan đăng ký kinh doanh chịu trách nhiệm về tính chính xác","Người đứng tên hộ đương nhiên không phải chịu trách nhiệm","Có thể kê khai người khác là chủ sở hữu hưởng lợi nếu được đồng ý"],"a":0,"e":"Phân tích tình huống: Người thành lập hoặc doanh nghiệp tự kê khai và chịu trách nhiệm trước pháp luật về tính hợp pháp, trung thực, chính xác theo quy định.","b":"Điều 4 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP"},{"id":"TH2.01.1","g":2,"q":"Ai có thể gặp hạn chế quyền thành lập và quản lý doanh nghiệp trong dữ kiện này?","o":["Ông Phúc, vì cá nhân kinh doanh tự do không được thành lập công ty","Cả hai, vì công ty TNHH phải có ít nhất ba thành viên","Bà Lan, do đang là công chức, trừ trường hợp luật có ngoại lệ áp dụng","Không ai, vì mọi cá nhân đều có quyền thành lập doanh nghiệp"],"a":2,"e":"Trước hết phải xác định người dự kiến thành lập doanh nghiệp có phải là công chức theo pháp luật về cán bộ, công chức hay không. Cần phân biệt quyền thành lập, quản lý doanh nghiệp với quyền góp vốn, vì Điều 17 quy định các nhóm hạn chế riêng.","b":"Điểm b khoản 2, điểm b khoản 3 Điều 17 Luật Doanh nghiệp","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"q":"Cơ quan nào có thẩm quyền tiếp nhận hồ sơ đăng ký doanh nghiệp?","o":["Cơ quan đăng ký kinh doanh cấp tỉnh","Ủy ban nhân dân cấp xã nơi đặt trụ sở","Cơ quan thuế cấp xã","Tòa án nhân dân khu vực"],"a":0,"e":"Thẩm quyền đăng ký doanh nghiệp theo Nghị định 168/2025/NĐ-CP thuộc cơ quan đăng ký kinh doanh cấp tỉnh.","b":"Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"q":"Thông tin nào cần được bổ sung vào hồ sơ theo quy định sửa đổi năm 2025?","o":["Danh sách người lao động dự kiến tuyển dụng","Danh sách chủ nợ tương lai","Bản kê khai tài sản riêng của Giám đốc","Danh sách chủ sở hữu hưởng lợi của doanh nghiệp nếu có"],"a":3,"e":"Luật 76/2025/QH15 bổ sung yêu cầu về thông tin chủ sở hữu hưởng lợi trong hồ sơ và nghĩa vụ lưu giữ, cung cấp thông tin.","b":"Điều 11, Điều 20–25 Luật Doanh nghiệp; Luật 76/2025/QH15","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"q":"Nếu công ty được cấp Giấy chứng nhận đăng ký doanh nghiệp, công ty có được mặc nhiên kinh doanh mọi ngành nghề đã kê khai không?","o":["Được kinh doanh ngay vì đã có mã số doanh nghiệp","Chỉ được kinh doanh khi đáp ứng điều kiện chuyên ngành đối với ngành, nghề có điều kiện","Chỉ cần thông báo cho phường nơi đặt trụ sở","Phải chờ đủ 12 tháng kể từ ngày đăng ký"],"a":1,"e":"Đăng ký doanh nghiệp không thay thế giấy phép hoặc điều kiện kinh doanh chuyên ngành.","b":"Điều 7, Điều 8 Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"q":"Việc góp vốn bằng quyền sử dụng đất của ông Dũng cần đáp ứng yêu cầu nào?","o":["Chỉ cần ghi quyền sử dụng đất vào Điều lệ","Ông Dũng có quyền sử dụng hợp pháp và phải hoàn tất chuyển quyền cho công ty","Chỉ cần có xác nhận của ngân hàng cho vay","Không cần chuyển quyền nếu Hội đồng thành viên đồng ý"],"a":1,"e":"Tài sản góp vốn phải được chuyển quyền sử dụng cho công ty theo pháp luật đất đai và Luật Doanh nghiệp.","b":"Điều 34, Điều 35 Luật Doanh nghiệp","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"q":"Sau thời hạn góp vốn, bà Mai mới góp một nửa phần vốn cam kết. Công ty cần xử lý ra sao?","o":["Giữ nguyên vốn vì bà Mai đã góp một phần","Ghi nhận số thiếu là khoản vay của bà Mai mà không cần thỏa thuận","Tự động chuyển phần vốn thiếu cho bà Hoa","Điều chỉnh vốn điều lệ và phần vốn góp theo số vốn thực góp, xử lý trách nhiệm liên quan"],"a":3,"e":"Công ty không được duy trì vốn đăng ký không đúng thực tế; phải thực hiện điều chỉnh theo Điều 47.","b":"Điều 47 Luật Doanh nghiệp","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"q":"Việc định giá máy móc cao hơn giá thị trường có thể phát sinh trách nhiệm nào?","o":["Trách nhiệm của người góp vốn và người định giá theo quy định về định giá tài sản góp vốn","Không phát sinh vì các thành viên đã nhất trí","Chỉ phát sinh trách nhiệm thuế thu nhập cá nhân","Chỉ phát sinh nếu công ty bị phá sản"],"a":0,"e":"Cố ý định giá tài sản góp vốn không đúng giá trị thực tế là hành vi bị nghiêm cấm; chủ thể liên quan có thể phải chịu trách nhiệm.","b":"Điều 36, Điều 16 Luật Doanh nghiệp","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"q":"Mục tiêu giữ nguyên vốn điều lệ 6 tỷ đồng dù chưa góp đủ có phù hợp không?","o":["Có, vì vốn điều lệ chỉ là con số dự kiến","Có, nếu ngân hàng đồng ý cho vay","Không; phải phản ánh đúng số vốn thực góp và đăng ký điều chỉnh theo luật","Không cần điều chỉnh nếu doanh nghiệp vẫn có doanh thu"],"a":2,"e":"Kê khai khống vốn điều lệ là hành vi bị nghiêm cấm; nghĩa vụ điều chỉnh không phụ thuộc việc ngân hàng có đồng ý hay không.","b":"Điều 16, Điều 47 Luật Doanh nghiệp","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"q":"Bà Hạnh có thể thuộc diện chủ sở hữu hưởng lợi theo tiêu chí nào?","o":["Chỉ sở hữu trực tiếp từ 50% mới được xem xét","Chỉ là chủ sở hữu hưởng lợi nếu đứng tên người đại diện","Không thể là chủ sở hữu hưởng lợi khi có công ty trung gian","Sở hữu gián tiếp từ 25% tổng số cổ phần có quyền biểu quyết trở lên"],"a":3,"e":"Tiêu chí xác định bao gồm sở hữu gián tiếp từ 25% trở lên hoặc quyền chi phối theo quy định hướng dẫn.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"q":"Công ty có nghĩa vụ gì đối với thông tin về bà Hạnh?","o":["Chỉ lưu thông tin nếu bà Hạnh đồng ý bằng văn bản","Thu thập, cập nhật, lưu giữ và cung cấp thông tin chủ sở hữu hưởng lợi theo luật","Không phải lưu vì bà không đứng tên trực tiếp","Chỉ thông báo cho ngân hàng, không cung cấp cơ quan nhà nước"],"a":1,"e":"Luật 76/2025/QH15 bổ sung nghĩa vụ về thông tin chủ sở hữu hưởng lợi; doanh nghiệp phải thực hiện nghĩa vụ theo luật.","b":"Khoản 5a Điều 8; Điều 11, Điều 25 Luật Doanh nghiệp","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"q":"Hồ sơ thay đổi trực tuyến chưa được ký số hoặc xác thực có đáp ứng yêu cầu không?","o":["Có, chỉ cần gửi từ địa chỉ thư điện tử công ty","Có, vì thay đổi trụ sở không cần xác thực","Chưa; phải đáp ứng yêu cầu ký số hoặc xác thực bởi người có thẩm quyền","Có, nếu nộp thêm bản sao căn cước của người đại diện"],"a":2,"e":"Nghị định 168/2025/NĐ-CP yêu cầu hồ sơ điện tử phải được ký số hoặc xác thực đúng chủ thể.","b":"Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"q":"Việc thay đổi trụ sở và người đại diện theo pháp luật cần thực hiện theo hướng nào?","o":["Đăng ký thay đổi các nội dung tương ứng, đồng thời cập nhật dữ liệu chủ sở hữu hưởng lợi theo trường hợp","Chỉ sửa Điều lệ nội bộ","Chỉ gửi thông báo cho cơ quan thuế","Chờ đến kỳ báo cáo thường niên mới cập nhật"],"a":0,"e":"Các nội dung thay đổi đăng ký phải được cập nhật theo trình tự; thông tin chủ sở hữu hưởng lợi là dữ liệu phải thu thập, lưu giữ và cung cấp theo luật.","b":"Điều 30, Điều 31 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","cid":"TH2.03"},{"id":"LDN201","g":2,"q":"Công ty nào thuộc phạm vi điều chỉnh trực tiếp của Luật Doanh nghiệp?","o":["Hộ kinh doanh","Tổ hợp tác","Công ty trách nhiệm hữu hạn","Hợp tác xã"],"a":2,"e":"Công ty TNHH là một trong bốn loại hình doanh nghiệp; hộ kinh doanh và hợp tác xã hoạt động theo cơ chế pháp lý riêng.","b":"Điều 1 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN202","g":2,"q":"Chủ thể nào bị hạn chế quyền thành lập và quản lý doanh nghiệp theo quy định chung?","o":["Cán bộ, công chức, viên chức, trừ trường hợp luật có ngoại lệ","Người đủ 18 tuổi, có đầy đủ năng lực hành vi dân sự","Cá nhân không thuộc trường hợp bị cấm","Tổ chức được thành lập hợp pháp"],"a":0,"e":"Điều 17 liệt kê nhóm chủ thể bị hạn chế; phải kiểm tra ngoại lệ luật định và phân biệt quyền thành lập với quyền góp vốn.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN203","g":2,"q":"Hồ sơ đăng ký công ty cổ phần phải có danh sách nào?","o":["Danh sách thành viên hợp danh","Danh sách chủ nợ và người mắc nợ","Danh sách người lao động dự kiến","Danh sách cổ đông sáng lập và cổ đông là nhà đầu tư nước ngoài"],"a":3,"e":"Hồ sơ công ty cổ phần gắn với danh sách cổ đông sáng lập, cổ đông là nhà đầu tư nước ngoài và thông tin chủ sở hữu hưởng lợi nếu có.","b":"Điều 22, Điều 25 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN204","g":2,"q":"Cơ quan nào tiếp nhận, xem xét hồ sơ đăng ký doanh nghiệp theo cơ cấu hiện hành?","o":["Ủy ban nhân dân cấp xã","Cơ quan đăng ký kinh doanh cấp tỉnh","Cơ quan thuế cấp tỉnh","Phòng đăng ký kinh doanh cấp huyện"],"a":1,"e":"Nghị định 168/2025/NĐ-CP quy định cơ quan đăng ký kinh doanh cấp tỉnh; không tiếp tục sử dụng mô hình cấp huyện cũ.","b":"Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","lv":"NB"},{"id":"LDN205","g":2,"q":"Thời hạn thông thường để cơ quan đăng ký kinh doanh xem xét hồ sơ hợp lệ là bao lâu?","o":["03 ngày theo lịch","03 ngày làm việc","05 ngày làm việc","07 ngày làm việc"],"a":1,"e":"Thời hạn được tính bằng ngày làm việc kể từ ngày nhận hồ sơ; không đồng nhất với ngày theo lịch.","b":"Khoản 5 Điều 26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","lv":"NB"},{"id":"LDN206","g":2,"q":"Vì sao Giấy chứng nhận đăng ký doanh nghiệp không đồng nghĩa doanh nghiệp đủ điều kiện kinh doanh mọi ngành nghề?","o":["Doanh nghiệp phải được Tòa án cho phép kinh doanh","Giấy chứng nhận chỉ xác nhận quyền sở hữu tài sản","Doanh nghiệp phải xin phép tất cả chủ nợ","Ngành, nghề có điều kiện còn phải đáp ứng điều kiện chuyên ngành"],"a":3,"e":"Nội dung phù hợp là “Ngành, nghề có điều kiện còn phải đáp ứng điều kiện chuyên ngành”. Phương án nhiễu “Doanh nghiệp phải được Tòa án cho phép kinh doanh” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 7, Điều 8 Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15.","lv":"TH","b":"Điều 7, Điều 8 Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15"},{"id":"LDN207","g":2,"q":"Điểm khác biệt cơ bản giữa đăng ký doanh nghiệp và đăng ký đầu tư là gì?","o":["Đăng ký doanh nghiệp ghi nhận thông tin doanh nghiệp; thủ tục đầu tư xem xét điều kiện đầu tư theo luật","Đăng ký đầu tư thay thế hoàn toàn đăng ký doanh nghiệp","Đăng ký doanh nghiệp chỉ áp dụng cho nhà đầu tư trong nước","Hai thủ tục luôn có cùng mục đích"],"a":0,"e":"Nội dung phù hợp là “Đăng ký doanh nghiệp ghi nhận thông tin doanh nghiệp; thủ tục đầu tư xem xét điều kiện đầu tư theo luật”. Phương án nhiễu “Đăng ký đầu tư thay thế hoàn toàn đăng ký doanh nghiệp” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15.","lv":"TH","b":"Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15"},{"id":"LDN208","g":2,"q":"Cá nhân dùng quyền sử dụng đất để góp vốn vào công ty phải bảo đảm điều kiện cốt lõi nào?","o":["Chỉ ghi giá trị quyền sử dụng đất vào Điều lệ","Chỉ cần có xác nhận của ngân hàng","Có quyền sử dụng hợp pháp và hoàn tất thủ tục chuyển quyền cho công ty","Không cần chuyển quyền nếu thành viên đồng ý"],"a":2,"e":"Nội dung phù hợp là “Có quyền sử dụng hợp pháp và hoàn tất thủ tục chuyển quyền cho công ty”. Phương án nhiễu “Chỉ ghi giá trị quyền sử dụng đất vào Điều lệ” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 34, Điều 35 Luật Doanh nghiệp.","lv":"TH","b":"Điều 34, Điều 35 Luật Doanh nghiệp"},{"id":"LDN209","g":2,"q":"Hồ sơ đăng ký doanh nghiệp có thông tin kê khai không trung thực. Vấn đề pháp lý nào cần xem xét?","o":["Hồ sơ đương nhiên được chấp nhận nếu đã nộp lệ phí","Thông tin sai chỉ bị xử lý khi doanh nghiệp giải thể","Cơ quan đăng ký phải tự xác minh toàn bộ hoạt động","Trách nhiệm của người kê khai và biện pháp xử lý đăng ký theo luật"],"a":3,"e":"Nội dung phù hợp là “Trách nhiệm của người kê khai và biện pháp xử lý đăng ký theo luật”. Phương án nhiễu “Hồ sơ đương nhiên được chấp nhận nếu đã nộp lệ phí” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 16 Luật Doanh nghiệp; Điều 4 Nghị định 168/2025/NĐ-CP.","lv":"TH","b":"Điều 16 Luật Doanh nghiệp; Điều 4 Nghị định 168/2025/NĐ-CP"},{"id":"LDN210","g":2,"q":"Khi doanh nghiệp đăng ký trực tuyến, yêu cầu nào bảo đảm giá trị pháp lý của hồ sơ điện tử?","o":["Chỉ gửi ảnh chụp qua thư điện tử cá nhân","Kê khai đầy đủ và ký số hoặc xác thực bởi người có thẩm quyền","Chỉ nhập tên người nộp hồ sơ","Bắt buộc nộp bản giấy trong mọi trường hợp"],"a":1,"e":"Nội dung phù hợp là “Kê khai đầy đủ và ký số hoặc xác thực bởi người có thẩm quyền”. Phương án nhiễu “Chỉ gửi ảnh chụp qua thư điện tử cá nhân” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP.","lv":"TH","b":"Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP"},{"id":"LDN211","g":2,"q":"Công ty TNHH đăng ký vốn điều lệ 5 tỷ đồng. Hết thời hạn góp vốn, một thành viên mới góp 40% phần vốn cam kết. Công ty phải xử lý thế nào?","o":["Giữ nguyên vốn vì thành viên đã góp một phần","Ghi phần thiếu thành khoản vay mà không cần thỏa thuận","Điều chỉnh vốn điều lệ và tỷ lệ phần vốn góp theo số thực góp","Chấm dứt tư cách pháp nhân ngay lập tức"],"a":2,"e":"Nội dung phù hợp là “Điều chỉnh vốn điều lệ và tỷ lệ phần vốn góp theo số thực góp”. Phương án nhiễu “Giữ nguyên vốn vì thành viên đã góp một phần” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 47 Luật Doanh nghiệp.","lv":"VD","b":"Điều 47 Luật Doanh nghiệp"},{"id":"LDN212","g":2,"q":"Một cá nhân sở hữu gián tiếp 30% vốn điều lệ của công ty. Khi đáp ứng tiêu chí luật định, cá nhân đó được xác định theo tư cách nào?","o":["Chủ sở hữu hưởng lợi của doanh nghiệp","Người đại diện theo pháp luật đương nhiên","Thành viên hợp danh","Kiểm soát viên bắt buộc"],"a":0,"e":"Nội dung phù hợp là “Chủ sở hữu hưởng lợi của doanh nghiệp”. Phương án nhiễu “Người đại diện theo pháp luật đương nhiên” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 35 Điều 4 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP.","lv":"VD","b":"Khoản 35 Điều 4 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP"},{"id":"LDN213","g":2,"q":"Công ty thay đổi người đại diện theo pháp luật và trụ sở chính. Doanh nghiệp cần làm gì?","o":["Đăng ký thay đổi các nội dung tương ứng với cơ quan đăng ký kinh doanh cấp tỉnh","Chỉ thông báo miệng với cơ quan thuế","Xin phép Tòa án nhân dân khu vực","Chỉ sửa Điều lệ mà không cập nhật đăng ký"],"a":0,"e":"Nội dung phù hợp là “Đăng ký thay đổi các nội dung tương ứng với cơ quan đăng ký kinh doanh cấp tỉnh”. Phương án nhiễu “Chỉ thông báo miệng với cơ quan thuế” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 30, Điều 31 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP.","lv":"VD","b":"Điều 30, Điều 31 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP"},{"id":"LDN214","g":2,"q":"Doanh nghiệp muốn kinh doanh ngành, nghề có điều kiện ngay sau khi đăng ký. Cách xử lý nào đúng?","o":["Được kinh doanh ngay vì đã ghi ngành nghề trong đăng ký","Chỉ cần thông báo cho UBND cấp xã","Chỉ bắt đầu kinh doanh khi đã đáp ứng đủ điều kiện hoặc có giấy phép theo luật chuyên ngành","Chờ kỳ báo cáo tài chính đầu tiên"],"a":2,"e":"Nội dung phù hợp là “Chỉ bắt đầu kinh doanh khi đã đáp ứng đủ điều kiện hoặc có giấy phép theo luật chuyên ngành”. Phương án nhiễu “Được kinh doanh ngay vì đã ghi ngành nghề trong đăng ký” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 7, Điều 8 Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15.","lv":"VD","b":"Điều 7, Điều 8 Luật Doanh nghiệp; Luật Đầu tư 143/2025/QH15"},{"id":"LDN215","g":2,"q":"Công ty kê khai tài sản góp vốn cao hơn giá trị thực tế. Hệ quả nào cần được xem xét?","o":["Giá trị trong Điều lệ luôn là giá trị cuối cùng","Trách nhiệm của người góp vốn và người định giá theo quy định","Công ty được miễn trách nhiệm vì đã nhận tài sản","Chỉ người thẩm định giá chịu trách nhiệm trong mọi trường hợp"],"a":1,"e":"Nội dung phù hợp là “Trách nhiệm của người góp vốn và người định giá theo quy định”. Phương án nhiễu “Giá trị trong Điều lệ luôn là giá trị cuối cùng” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 36, Điều 16 Luật Doanh nghiệp.","lv":"VD","b":"Điều 36, Điều 16 Luật Doanh nghiệp"},{"id":"TH3.01.1","g":3,"q":"Sau thời hạn góp vốn, phần vốn ông Khải chưa góp được xử lý theo hướng nào?","o":["Ghi nhận đủ 4 tỷ vì đã cam kết","Chuyển phần vốn thiếu thành cổ phần","Điều chỉnh phần vốn góp theo số thực góp và thực hiện thủ tục đăng ký thay đổi","Tự động gia hạn vô thời hạn"],"a":2,"e":"Phần vốn chưa góp không được mặc nhiên coi là đã góp; công ty phải xử lý theo Điều 47 và cập nhật đăng ký.","b":"Điều 47 Luật Doanh nghiệp","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"q":"Ông Sơn chưa góp vốn thì có quyền thành viên tương ứng với phần vốn cam kết hay không?","o":["Không được mặc nhiên hưởng quyền tương ứng phần vốn chưa góp","Có đầy đủ quyền biểu quyết vì đã ký Điều lệ","Có quyền nhận lợi nhuận trên vốn cam kết","Được quyền phủ quyết mọi nghị quyết"],"a":0,"e":"Quyền và nghĩa vụ phải căn cứ phần vốn thực góp và cơ chế xử lý thành viên không góp vốn đúng hạn.","b":"Điều 47, Điều 49 Luật Doanh nghiệp","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"q":"Việc công ty giữ vốn điều lệ 7 tỷ đồng dù không góp đủ có rủi ro pháp lý nào?","o":["Chỉ là sai sót kế toán không liên quan pháp luật doanh nghiệp","Không có rủi ro nếu chủ nợ chưa khởi kiện","Chỉ vi phạm khi công ty bị giải thể","Kê khai khống vốn điều lệ và không thực hiện điều chỉnh theo luật"],"a":3,"e":"Kê khai khống vốn điều lệ là hành vi bị nghiêm cấm; công ty phải phản ánh đúng vốn thực góp.","b":"Khoản 5 Điều 16; Điều 47 Luật Doanh nghiệp","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"q":"Chủ nợ yêu cầu thông tin vốn góp, công ty cần xử lý thế nào?","o":["Từ chối tuyệt đối vì vốn góp là bí mật cá nhân","Cung cấp thông tin theo quyền tiếp cận và nghĩa vụ công khai được pháp luật quy định","Chỉ cung cấp khi mọi thành viên đồng ý","Chỉ cung cấp sau khi công ty giải thể"],"a":1,"e":"Thông tin đăng ký và vốn góp phải được kê khai trung thực; phạm vi cung cấp cho chủ nợ xác định theo quy định pháp luật và quan hệ hợp đồng.","b":"Điều 8, Điều 47 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"q":"Vấn đề pháp lý đầu tiên cần xem xét đối với giao dịch là gì?","o":["Điều kiện chào bán cổ phiếu ra công chúng","Trình tự chào bán ưu tiên phần vốn góp cho các thành viên còn lại","Quyền phát hành trái phiếu của công ty","Thủ tục giải thể doanh nghiệp"],"a":1,"e":"Chuyển nhượng phần vốn góp trong công ty TNHH hai thành viên trở lên chịu cơ chế ưu tiên mua theo Điều 52.","b":"Điều 52 Luật Doanh nghiệp","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"q":"Nếu thành viên còn lại không mua hoặc không mua hết trong thời hạn luật định, ông Long có thể làm gì?","o":["Tự động chuyển thành công ty cổ phần","Tặng phần vốn cho người ngoài mà không cần tuân thủ điều kiện","Yêu cầu cơ quan đăng ký kinh doanh quyết định người mua","Chuyển nhượng cho người ngoài theo điều kiện đã chào bán và quy định luật định"],"a":3,"e":"Sau khi bảo đảm quyền ưu tiên mua, thành viên có thể chuyển nhượng cho người ngoài theo điều kiện không thuận lợi hơn so với điều kiện đã chào bán.","b":"Điều 52 Luật Doanh nghiệp","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"q":"Bà Vân trở thành thành viên công ty từ thời điểm nào?","o":["Khi việc chuyển nhượng được ghi nhận theo quy định và hoàn tất thủ tục pháp lý tương ứng","Ngay khi hai bên ký hợp đồng trong mọi trường hợp","Khi bà Vân thanh toán 10% giá chuyển nhượng","Khi Chủ tịch UBND cấp xã xác nhận"],"a":0,"e":"Tư cách thành viên và quyền đối với phần vốn góp cần được xác lập, ghi nhận theo Điều lệ, sổ đăng ký thành viên và thủ tục đăng ký tương ứng.","b":"Điều 48, Điều 52 Luật Doanh nghiệp","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"q":"Công ty cần thực hiện công việc nào sau khi chuyển nhượng hợp lệ?","o":["Chỉ sửa báo cáo tài chính năm","Hủy Giấy chứng nhận đăng ký doanh nghiệp","Cập nhật sổ đăng ký thành viên và đăng ký thay đổi nội dung liên quan","Chuyển toàn bộ tài sản công ty cho thành viên mới"],"a":2,"e":"Thay đổi thành viên và tỷ lệ vốn góp thuộc nội dung phải cập nhật theo Luật Doanh nghiệp và Nghị định 168/2025/NĐ-CP.","b":"Điều 30, Điều 48, Điều 52 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"q":"Giao dịch chuyển nhượng toàn bộ vốn điều lệ làm thay đổi nội dung nào?","o":["Tư cách pháp nhân của công ty tự động chấm dứt","Loại hình công ty tự động thành công ty cổ phần","Cơ quan đăng ký doanh nghiệp trở thành chủ sở hữu","Chủ sở hữu công ty TNHH một thành viên"],"a":3,"e":"Công ty vẫn là công ty TNHH một thành viên nhưng chủ sở hữu thay đổi; phải cập nhật đăng ký và quản trị phù hợp.","b":"Điều 74–87 Luật Doanh nghiệp","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"q":"Cơ cấu quản lý sau khi chủ sở hữu là cá nhân cần được xử lý thế nào?","o":["Bắt buộc duy trì Hội đồng thành viên gồm các cổ đông","Điều chỉnh theo mô hình quản lý công ty TNHH một thành viên do cá nhân làm chủ","Chuyển thành Ban kiểm soát độc lập","Không cần cơ cấu quản lý theo Điều lệ"],"a":1,"e":"Luật quy định cơ cấu quản lý riêng đối với công ty TNHH một thành viên do cá nhân làm chủ; cần sửa Điều lệ và đăng ký thay đổi nếu có.","b":"Điều 85–87 Luật Doanh nghiệp","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"q":"Bà Phương có được tự do sử dụng tiền trong tài khoản công ty cho chi tiêu cá nhân không?","o":["Được vì bà là chủ sở hữu duy nhất","Được nếu kế toán đồng ý","Không; tài sản công ty độc lập với tài sản của chủ sở hữu và phải sử dụng đúng căn cứ pháp lý","Được nếu công ty có lợi nhuận"],"a":2,"e":"Công ty có tư cách pháp nhân và tài sản độc lập; chủ sở hữu không được tùy tiện đồng nhất tài sản công ty với tài sản cá nhân.","b":"Điều 74 Luật Doanh nghiệp; BLDS 2015","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"q":"Thủ tục nào cần thực hiện sau khi chuyển nhượng?","o":["Đăng ký thay đổi chủ sở hữu và cập nhật Điều lệ, thông tin quản lý theo quy định","Chỉ thông báo với ngân hàng","Chỉ thay đổi tên công ty","Không cần thủ tục vì chủ sở hữu mới là cá nhân"],"a":0,"e":"Thay đổi chủ sở hữu là nội dung đăng ký doanh nghiệp; hồ sơ thực hiện theo Nghị định 168/2025/NĐ-CP.","b":"Điều 30, Điều 76–87 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","cid":"TH3.03"},{"id":"LDN301","g":3,"q":"Công ty TNHH hai thành viên trở lên có số lượng thành viên trong giới hạn nào?","o":["Từ 03 thành viên, không giới hạn tối đa","Từ 02 thành viên, không giới hạn tối đa","Từ 02 đến 50 thành viên","Từ 01 đến 30 thành viên"],"a":2,"e":"Luật quy định giới hạn tối thiểu 02 và tối đa 50 thành viên; nếu vượt giới hạn phải xem xét chuyển đổi loại hình.","b":"Khoản 1 Điều 46 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN302","g":3,"q":"Cơ quan quyết định cao nhất trong công ty TNHH hai thành viên trở lên là cơ quan nào?","o":["Hội đồng thành viên","Đại hội đồng cổ đông","Ban kiểm soát","Giám đốc hoặc Tổng giám đốc"],"a":0,"e":"Hội đồng thành viên gồm tất cả thành viên công ty và là cơ quan quyết định cao nhất theo mô hình công ty TNHH hai thành viên trở lên.","b":"Điều 55 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN303","g":3,"q":"Thời hạn góp đủ vốn cam kết của thành viên công ty TNHH hai thành viên trở lên thông thường là bao lâu?","o":["30 ngày kể từ ngày ký Điều lệ","60 ngày kể từ ngày mở tài khoản ngân hàng","180 ngày kể từ ngày có nghị quyết Hội đồng thành viên","90 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp"],"a":3,"e":"Điều 47 quy định thời hạn góp vốn 90 ngày, không tính một số thời gian vận chuyển tài sản và thủ tục hành chính chuyển quyền sở hữu theo luật.","b":"Khoản 2 Điều 47 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN304","g":3,"q":"Chủ sở hữu công ty TNHH một thành viên có thể là chủ thể nào?","o":["Chỉ một cá nhân","Một tổ chức hoặc một cá nhân","Ít nhất hai cá nhân","Chỉ một tổ chức nhà nước"],"a":1,"e":"Công ty TNHH một thành viên do một tổ chức hoặc một cá nhân làm chủ sở hữu; chủ sở hữu không đồng nhất với người đại diện theo pháp luật.","b":"Khoản 1 Điều 74 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN305","g":3,"q":"Phần vốn góp của thành viên công ty TNHH hai thành viên trở lên được ghi nhận bằng tài liệu nào?","o":["Cổ phiếu phổ thông","Giấy chứng nhận phần vốn góp","Trái phiếu chuyển đổi bắt buộc","Giấy chứng nhận đăng ký hộ kinh doanh"],"a":1,"e":"Công ty cấp giấy chứng nhận phần vốn góp cho thành viên; phần vốn góp không được thể hiện bằng cổ phiếu như công ty cổ phần.","b":"Điều 48 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN306","g":3,"q":"Vì sao thành viên công ty TNHH không được tự do chuyển nhượng phần vốn góp như cổ đông công ty cổ phần?","o":["Vì phần vốn góp không phải là quyền tài sản","Vì mọi giao dịch chuyển nhượng đều bị cấm","Vì thành viên chỉ được chuyển nhượng khi công ty giải thể","Vì pháp luật đặt ra cơ chế ưu tiên chào bán cho thành viên còn lại"],"a":3,"e":"Công ty TNHH có tính chất đối nhân nhất định; Điều 52 đặt ra trình tự chào bán ưu tiên cho thành viên còn lại, trừ trường hợp luật quy định khác.","b":"Điều 52 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN307","g":3,"q":"Thành viên phản đối nghị quyết về tổ chức lại công ty có thể sử dụng quyền nào trong trường hợp luật định?","o":["Yêu cầu công ty mua lại phần vốn góp","Yêu cầu cơ quan đăng ký doanh nghiệp tự động giải thể công ty","Đơn phương rút vốn không cần tuân thủ thủ tục","Yêu cầu chuyển phần vốn góp thành cổ phần phổ thông"],"a":0,"e":"Quyền yêu cầu mua lại phần vốn góp được đặt ra khi thành viên không tán thành nghị quyết, quyết định thuộc trường hợp luật định và phải tuân thủ trình tự.","b":"Điều 51 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN308","g":3,"q":"Nghị quyết Hội đồng thành viên được thông qua theo cơ chế nào?","o":["Luôn phải có sự đồng ý tuyệt đối của tất cả thành viên","Chỉ cần Chủ tịch Hội đồng thành viên quyết định","Theo tỷ lệ biểu quyết và điều kiện thông qua do luật, Điều lệ quy định","Luôn tính theo số lượng thành viên, không tính vốn góp"],"a":2,"e":"Cơ chế thông qua nghị quyết phụ thuộc tính chất vấn đề, tỷ lệ vốn góp và quy định của Điều lệ trong giới hạn Luật Doanh nghiệp.","b":"Điều 59, Điều 60 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN309","g":3,"q":"Khi thành viên công ty TNHH hai thành viên trở lên chết, phần vốn góp được xử lý theo nguyên tắc nào?","o":["Phần vốn góp đương nhiên thuộc về Chủ tịch Hội đồng thành viên","Công ty bắt buộc chuyển thành doanh nghiệp tư nhân","Phần vốn góp tự động bị hủy","Người thừa kế theo di chúc hoặc theo pháp luật có thể trở thành thành viên"],"a":3,"e":"Phần vốn góp là tài sản có thể được thừa kế; tư cách thành viên của người thừa kế được xác định theo Luật Doanh nghiệp và pháp luật dân sự.","b":"Điều 53 Luật Doanh nghiệp; BLDS 2015","lv":"TH"},{"id":"LDN310","g":3,"q":"Trong công ty TNHH một thành viên do tổ chức làm chủ, mô hình quản lý được xác định theo căn cứ nào?","o":["Luôn phải có Đại hội đồng cổ đông","Theo mô hình Hội đồng thành viên hoặc Chủ tịch công ty cùng người điều hành theo luật","Luôn do một cá nhân chủ sở hữu trực tiếp điều hành","Không cần cơ quan quản lý"],"a":1,"e":"Nội dung phù hợp là “Theo mô hình Hội đồng thành viên hoặc Chủ tịch công ty cùng người điều hành theo luật”. Phương án nhiễu “Luôn phải có Đại hội đồng cổ đông” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 79–83 Luật Doanh nghiệp.","lv":"TH","b":"Điều 79–83 Luật Doanh nghiệp"},{"id":"LDN311","g":3,"q":"Công ty TNHH hai thành viên có 40 thành viên dự định tiếp nhận thêm 12 thành viên mới mà vẫn giữ loại hình hiện tại. Kết luận nào phù hợp?","o":["Được tiếp nhận vì luật không giới hạn số thành viên","Chỉ cần sửa Điều lệ để bỏ giới hạn","Không thể duy trì loại hình nếu số thành viên vượt quá 50","Được tiếp nhận nếu thành viên cũ đồng ý"],"a":2,"e":"Nội dung phù hợp là “Không thể duy trì loại hình nếu số thành viên vượt quá 50”. Phương án nhiễu “Được tiếp nhận vì luật không giới hạn số thành viên” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 1 Điều 46 Luật Doanh nghiệp.","lv":"VD","b":"Khoản 1 Điều 46 Luật Doanh nghiệp"},{"id":"LDN312","g":3,"q":"Thành viên cam kết góp 2 tỷ đồng nhưng hết thời hạn chỉ góp 1 tỷ đồng. Phần vốn chưa góp được xử lý thế nào?","o":["Xử lý theo Điều 47 và đăng ký điều chỉnh vốn, quyền thành viên","Thành viên vẫn biểu quyết trên toàn bộ 2 tỷ đồng","Công ty tự động ghi phần thiếu thành khoản vay","Không cần điều chỉnh vì đã góp một nửa"],"a":0,"e":"Nội dung phù hợp là “Xử lý theo Điều 47 và đăng ký điều chỉnh vốn, quyền thành viên”. Phương án nhiễu “Thành viên vẫn biểu quyết trên toàn bộ 2 tỷ đồng” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 47 Luật Doanh nghiệp.","lv":"VD","b":"Điều 47 Luật Doanh nghiệp"},{"id":"LDN313","g":3,"q":"Một thành viên muốn chuyển nhượng phần vốn góp cho người ngoài công ty. Trình tự thông thường cần thực hiện là gì?","o":["Chào bán phần vốn đó cho các thành viên còn lại theo điều kiện luật định trước","Chuyển nhượng ngay cho người ngoài mà không cần thông báo","Chỉ cần Giám đốc chấp thuận","Chỉ cần công chứng hợp đồng"],"a":0,"e":"Nội dung phù hợp là “Chào bán phần vốn đó cho các thành viên còn lại theo điều kiện luật định trước”. Phương án nhiễu “Chuyển nhượng ngay cho người ngoài mà không cần thông báo” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 52 Luật Doanh nghiệp.","lv":"VD","b":"Điều 52 Luật Doanh nghiệp"},{"id":"LDN314","g":3,"q":"Chủ sở hữu tổ chức chuyển nhượng toàn bộ vốn điều lệ cho một cá nhân. Hệ quả tổ chức nào cần được thực hiện?","o":["Công ty đương nhiên chấm dứt tư cách pháp nhân","Công ty phải chuyển thành công ty hợp danh","Đăng ký thay đổi chủ sở hữu và điều chỉnh mô hình quản trị phù hợp","Không cần cập nhật vì tư cách pháp nhân không đổi"],"a":2,"e":"Nội dung phù hợp là “Đăng ký thay đổi chủ sở hữu và điều chỉnh mô hình quản trị phù hợp”. Phương án nhiễu “Công ty đương nhiên chấm dứt tư cách pháp nhân” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 76–87 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP.","lv":"VD","b":"Điều 76–87 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP"},{"id":"LDN315","g":3,"q":"Công ty TNHH hai thành viên tăng vốn bằng cách tiếp nhận thành viên mới. Nội dung nào cần được cập nhật?","o":["Chỉ thay đổi tên doanh nghiệp","Vốn điều lệ, danh sách thành viên, tỷ lệ vốn góp và thông tin đăng ký tương ứng","Chỉ thay đổi người đại diện trong mọi trường hợp","Chỉ thay đổi số lượng lao động"],"a":1,"e":"Nội dung phù hợp là “Vốn điều lệ, danh sách thành viên, tỷ lệ vốn góp và thông tin đăng ký tương ứng”. Phương án nhiễu “Chỉ thay đổi tên doanh nghiệp” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 68 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP.","lv":"VD","b":"Điều 68 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP"},{"id":"TH4.01.1","g":4,"q":"Hạn chế chuyển nhượng nào cần được xem xét?","o":["Mọi cổ phần đều bị cấm chuyển nhượng trong 05 năm","Chỉ cổ phần ưu đãi cổ tức bị hạn chế","Cổ phần phổ thông của cổ đông sáng lập bị hạn chế chuyển cho người ngoài trong 03 năm đầu","Không có bất kỳ hạn chế nào đối với cổ đông sáng lập"],"a":2,"e":"Luật quy định hạn chế chuyển nhượng cổ phần phổ thông của cổ đông sáng lập cho người ngoài trong 03 năm, trừ ngoại lệ luật định.","b":"Khoản 3 Điều 120 Luật Doanh nghiệp","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"q":"Cơ quan nào có thẩm quyền chấp thuận chuyển nhượng cho người ngoài trong trường hợp này?","o":["Đại hội đồng cổ đông","Giám đốc hoặc Tổng giám đốc","Cơ quan đăng ký kinh doanh cấp tỉnh","Ban kiểm soát"],"a":0,"e":"Việc chuyển nhượng cho người không phải cổ đông sáng lập trong thời hạn hạn chế cần được Đại hội đồng cổ đông chấp thuận theo luật.","b":"Khoản 3 Điều 120 Luật Doanh nghiệp","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"q":"Nếu cổ phần được chuyển nhượng giữa các cổ đông sáng lập, hạn chế trên có áp dụng như trường hợp bán cho người ngoài không?","o":["Luôn phải được Tòa án chấp thuận","Luôn bị cấm tuyệt đối trong 03 năm","Phải chuyển thành cổ phần ưu đãi","Không áp dụng hạn chế theo cùng cách; cần đối chiếu ngoại lệ tại Điều 120"],"a":3,"e":"Điều 120 quy định ngoại lệ đối với chuyển nhượng giữa các cổ đông sáng lập; cần phân biệt người nhận là cổ đông sáng lập hay người ngoài.","b":"Khoản 3 Điều 120 Luật Doanh nghiệp","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"q":"Hội đồng quản trị có thể tự ghi nhận giao dịch mà bỏ qua điều kiện chấp thuận không?","o":["Có vì Hội đồng quản trị quyết định mọi giao dịch cổ đông","Không; phải bảo đảm điều kiện chuyển nhượng và thẩm quyền chấp thuận theo luật","Có nếu giá chuyển nhượng theo thị trường","Có nếu bên mua đã thanh toán đủ"],"a":1,"e":"Thẩm quyền quản trị không thể thay thế sự chấp thuận mà Luật Doanh nghiệp giao cho Đại hội đồng cổ đông.","b":"Điều 120, Điều 153 Luật Doanh nghiệp","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"q":"Điều kiện nào phải được xem xét trước khi trả cổ tức?","o":["Chỉ cần Đại hội đồng cổ đông thông qua","Công ty phải bảo đảm thanh toán đủ các khoản nợ và nghĩa vụ tài sản đến hạn sau khi trả","Chỉ cần có lợi nhuận kế toán","Chỉ cần nhóm cổ đông lớn đồng ý"],"a":1,"e":"Có lợi nhuận là điều kiện cần nhưng chưa đủ; công ty còn phải bảo đảm khả năng thanh toán sau khi trả cổ tức.","b":"Khoản 2 Điều 135 Luật Doanh nghiệp","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"q":"Công ty có thể trả cổ tức trong tình trạng nêu trên không?","o":["Có, vì khoản nợ đến hạn sau ngày họp cổ đông","Có, nếu cổ đông nhận cổ tức ký cam kết hoàn trả","Có, vì Hội đồng quản trị chịu trách nhiệm thay công ty","Không, nếu việc trả cổ tức làm công ty không bảo đảm thanh toán khoản nợ đến hạn"],"a":3,"e":"Điều kiện trả cổ tức phải được đánh giá tại thời điểm chi trả; khoản nợ đến hạn sau đó vẫn phải được tính đến.","b":"Khoản 2 Điều 135 Luật Doanh nghiệp","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"q":"Ai có trách nhiệm tổ chức thực hiện nghị quyết trả cổ tức nhưng phải bảo đảm điều kiện luật định?","o":["Hội đồng quản trị và người điều hành theo phân công, thẩm quyền","Cơ quan đăng ký kinh doanh","Chủ nợ có khoản vay đến hạn","Cổ đông không có quyền biểu quyết"],"a":0,"e":"Hội đồng quản trị tổ chức thực hiện nghị quyết nhưng không được thực hiện trái điều kiện trả cổ tức của Luật Doanh nghiệp.","b":"Điều 153, Điều 135 Luật Doanh nghiệp","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"q":"Nếu công ty đã trả cổ tức trái điều kiện, vấn đề nào cần xem xét?","o":["Cổ đông được giữ toàn bộ trong mọi trường hợp","Nghị quyết tự động làm mất khoản nợ ngân hàng","Trách nhiệm hoàn trả và trách nhiệm của người quyết định, tổ chức chi trả theo luật","Chỉ cần điều chỉnh báo cáo thuế"],"a":2,"e":"Việc trả cổ tức trái điều kiện có thể làm phát sinh nghĩa vụ hoàn trả và trách nhiệm của người quản lý, cổ đông nhận cổ tức theo luật.","b":"Điều 135, Điều 165 Luật Doanh nghiệp","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"q":"Quan hệ giữa bà Liên và Công ty Hoàng Gia cần được nhận diện như thế nào?","o":["Quan hệ giữa hai doanh nghiệp hoàn toàn độc lập","Quan hệ lao động giữa hai công ty","Quan hệ đại lý thương mại mặc nhiên","Quan hệ với người có liên quan và lợi ích liên quan trong giao dịch"],"a":3,"e":"Bà Liên vừa là người quản lý Đại Nam vừa kiểm soát Hoàng Gia, do đó phải xem xét quy định về người có liên quan.","b":"Điều 4, Điều 167 Luật Doanh nghiệp","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"q":"Bà Liên cần thực hiện nghĩa vụ nào trước khi giao dịch được xem xét?","o":["Chỉ cần cam kết bảo mật giá mua","Kê khai, thông báo lợi ích liên quan và không tham gia biểu quyết khi luật yêu cầu","Chỉ cần thông báo cho người lao động","Không cần công khai vì giá thấp hơn thị trường"],"a":1,"e":"Cơ chế công khai lợi ích và loại trừ biểu quyết của người có lợi ích liên quan nhằm phòng ngừa xung đột lợi ích.","b":"Điều 167 Luật Doanh nghiệp","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"q":"Thẩm quyền chấp thuận giao dịch được xác định theo căn cứ nào?","o":["Chỉ do bà Liên quyết định","Chỉ do cơ quan đăng ký kinh doanh quyết định","Giá trị giao dịch, đối tượng liên quan và thẩm quyền của Hội đồng quản trị hoặc Đại hội đồng cổ đông","Luôn do Ban kiểm soát quyết định"],"a":2,"e":"Điều 167 phân định thẩm quyền chấp thuận theo loại giao dịch, chủ thể liên quan, giá trị và Điều lệ công ty.","b":"Điều 167 Luật Doanh nghiệp","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"q":"Giá giao dịch thấp hơn thị trường có loại trừ nghĩa vụ về giao dịch với người có liên quan không?","o":["Không; vẫn phải tuân thủ công khai lợi ích và thủ tục chấp thuận","Có, vì công ty chắc chắn có lợi","Có, nếu hợp đồng được ký bằng văn bản","Có, nếu bà Liên không nhận tiền trực tiếp"],"a":0,"e":"Giá giao dịch không làm mất tư cách người có liên quan hoặc nghĩa vụ tuân thủ thủ tục kiểm soát xung đột lợi ích.","b":"Điều 167 Luật Doanh nghiệp","cid":"TH4.03"},{"id":"LDN401","g":4,"q":"Công ty cổ phần phải có tối thiểu bao nhiêu cổ đông?","o":["01 cổ đông","02 cổ đông","03 cổ đông","05 cổ đông"],"a":2,"e":"Điều 111 yêu cầu ít nhất 03 cổ đông và không hạn chế số lượng tối đa.","b":"Khoản 1 Điều 111 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN402","g":4,"q":"Vốn điều lệ của công ty cổ phần được chia thành đơn vị nào?","o":["Cổ phần","Phần vốn góp theo thành viên","Phần vốn đầu tư của chủ doanh nghiệp","Vốn góp hợp danh"],"a":0,"e":"Cấu trúc vốn điều lệ chia thành cổ phần là dấu hiệu pháp lý đặc trưng của công ty cổ phần.","b":"Khoản 1 Điều 111 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN403","g":4,"q":"Cổ đông chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản của công ty trong phạm vi nào?","o":["Toàn bộ tài sản riêng của cổ đông","Tài sản của người đại diện theo pháp luật","Giá trị tài sản của tất cả cổ đông cộng lại","Số vốn đã góp vào công ty"],"a":3,"e":"Cổ đông chịu trách nhiệm hữu hạn trong phạm vi vốn đã góp, trừ trường hợp luật quy định trách nhiệm khác.","b":"Khoản 1 Điều 111 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN404","g":4,"q":"Cơ quan nào là cơ quan quyết định cao nhất của công ty cổ phần?","o":["Hội đồng quản trị","Đại hội đồng cổ đông","Giám đốc hoặc Tổng giám đốc","Ban kiểm soát"],"a":1,"e":"Đại hội đồng cổ đông gồm tất cả cổ đông có quyền biểu quyết và là cơ quan quyết định cao nhất.","b":"Điều 138 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN405","g":4,"q":"Loại cổ phần nào công ty cổ phần bắt buộc phải có?","o":["Cổ phần ưu đãi cổ tức","Cổ phần phổ thông","Cổ phần ưu đãi hoàn lại","Cổ phần ưu đãi biểu quyết"],"a":1,"e":"Công ty cổ phần phải có cổ phần phổ thông; các loại cổ phần ưu đãi được phát hành theo điều kiện luật định.","b":"Điều 114 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN406","g":4,"q":"Vì sao cổ phần phổ thông của cổ đông sáng lập bị hạn chế chuyển nhượng trong thời hạn luật định?","o":["Vì cổ đông sáng lập không được sở hữu cổ phần","Vì mọi cổ phần phổ thông đều không được chuyển nhượng","Vì công ty cổ phần không được có cổ đông mới","Nhằm bảo đảm tính ổn định của nhóm sáng lập trong giai đoạn đầu hoạt động"],"a":3,"e":"Nội dung phù hợp là “Nhằm bảo đảm tính ổn định của nhóm sáng lập trong giai đoạn đầu hoạt động”. Phương án nhiễu “Vì cổ đông sáng lập không được sở hữu cổ phần” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 3 Điều 120 Luật Doanh nghiệp.","lv":"TH","b":"Khoản 3 Điều 120 Luật Doanh nghiệp"},{"id":"LDN407","g":4,"q":"Cổ đông phổ thông có quyền nào gắn trực tiếp với việc phân phối lợi nhuận?","o":["Nhận cổ tức theo nghị quyết và điều kiện luật định","Yêu cầu công ty trả cổ tức bất kể kết quả kinh doanh","Tự quyết định mức cổ tức của từng cổ đông","Nhận cổ tức trước khi công ty hoàn thành nghĩa vụ tài chính"],"a":0,"e":"Nội dung phù hợp là “Nhận cổ tức theo nghị quyết và điều kiện luật định”. Phương án nhiễu “Yêu cầu công ty trả cổ tức bất kể kết quả kinh doanh” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 115, Điều 135 Luật Doanh nghiệp.","lv":"TH","b":"Điều 115, Điều 135 Luật Doanh nghiệp"},{"id":"LDN408","g":4,"q":"Công ty cổ phần muốn chào bán cổ phần ra công chúng phải áp dụng thêm hệ thống pháp luật nào?","o":["Pháp luật về hộ kinh doanh","Pháp luật về công ty hợp danh","Pháp luật về chứng khoán","Pháp luật về đăng ký kết hôn"],"a":2,"e":"Nội dung phù hợp là “Pháp luật về chứng khoán”. Phương án nhiễu “Pháp luật về hộ kinh doanh” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 123 Luật Doanh nghiệp; Luật Chứng khoán 2019.","lv":"TH","b":"Điều 123 Luật Doanh nghiệp; Luật Chứng khoán 2019"},{"id":"LDN409","g":4,"q":"Hội đồng quản trị trong công ty cổ phần có chức năng pháp lý chủ yếu nào?","o":["Là cơ quan xét xử tranh chấp giữa cổ đông","Là cơ quan đăng ký doanh nghiệp","Là cơ quan đại diện cho toàn bộ chủ nợ","Là cơ quan quản lý công ty, quyết định vấn đề không thuộc Đại hội đồng cổ đông"],"a":3,"e":"Nội dung phù hợp là “Là cơ quan quản lý công ty, quyết định vấn đề không thuộc Đại hội đồng cổ đông”. Phương án nhiễu “Là cơ quan xét xử tranh chấp giữa cổ đông” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 153 Luật Doanh nghiệp.","lv":"TH","b":"Điều 153 Luật Doanh nghiệp"},{"id":"LDN410","g":4,"q":"Giao dịch của công ty với người quản lý hoặc người có liên quan phải đáp ứng yêu cầu nào?","o":["Chỉ cần người có liên quan ký xác nhận","Công khai lợi ích liên quan và được chấp thuận đúng thẩm quyền","Đương nhiên vô hiệu trong mọi trường hợp","Không cần thủ tục nếu giá trị giao dịch nhỏ"],"a":1,"e":"Nội dung phù hợp là “Công khai lợi ích liên quan và được chấp thuận đúng thẩm quyền”. Phương án nhiễu “Chỉ cần người có liên quan ký xác nhận” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 167 Luật Doanh nghiệp.","lv":"TH","b":"Điều 167 Luật Doanh nghiệp"},{"id":"LDN411","g":4,"q":"Công ty cổ phần có hai cổ đông và dự định đăng ký thành lập. Kết luận nào phù hợp?","o":["Đáp ứng vì công ty cổ phần chỉ cần một cổ đông","Đáp ứng nếu vốn điều lệ đủ lớn","Chưa đáp ứng điều kiện tối thiểu về số lượng cổ đông","Đáp ứng nếu có một cổ đông là tổ chức"],"a":2,"e":"Nội dung phù hợp là “Chưa đáp ứng điều kiện tối thiểu về số lượng cổ đông”. Phương án nhiễu “Đáp ứng vì công ty cổ phần chỉ cần một cổ đông” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 1 Điều 111 Luật Doanh nghiệp.","lv":"VD","b":"Khoản 1 Điều 111 Luật Doanh nghiệp"},{"id":"LDN412","g":4,"q":"Cổ đông sáng lập muốn chuyển nhượng cổ phần phổ thông cho người ngoài trong 03 năm đầu. Cách xử lý nào phù hợp?","o":["Phải được Đại hội đồng cổ đông chấp thuận, trừ trường hợp luật quy định ngoại lệ","Được tự do chuyển nhượng trong mọi trường hợp","Chỉ cần Hội đồng quản trị chấp thuận","Bị cấm chuyển nhượng tuyệt đối trong 03 năm"],"a":0,"e":"Nội dung phù hợp là “Phải được Đại hội đồng cổ đông chấp thuận, trừ trường hợp luật quy định ngoại lệ”. Phương án nhiễu “Được tự do chuyển nhượng trong mọi trường hợp” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 3 Điều 120 Luật Doanh nghiệp.","lv":"VD","b":"Khoản 3 Điều 120 Luật Doanh nghiệp"},{"id":"LDN413","g":4,"q":"Công ty có lợi nhuận nhưng sau khi trả cổ tức sẽ không thanh toán đủ khoản nợ đến hạn. Công ty có được trả cổ tức không?","o":["Không được trả nếu việc trả cổ tức làm công ty không bảo đảm khả năng thanh toán","Được trả vì chỉ cần có lợi nhuận kế toán","Được trả nếu đa số cổ đông đồng ý","Được trả nếu Hội đồng quản trị chịu trách nhiệm cá nhân"],"a":0,"e":"Nội dung phù hợp là “Không được trả nếu việc trả cổ tức làm công ty không bảo đảm khả năng thanh toán”. Phương án nhiễu “Được trả vì chỉ cần có lợi nhuận kế toán” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 2 Điều 135 Luật Doanh nghiệp.","lv":"VD","b":"Khoản 2 Điều 135 Luật Doanh nghiệp"},{"id":"LDN414","g":4,"q":"Cổ đông muốn dự họp và biểu quyết tại Đại hội đồng cổ đông phải dựa trên căn cứ nào?","o":["Chỉ cần là người lao động của công ty","Chỉ cần có hợp đồng cung ứng dịch vụ","Tư cách cổ đông có quyền biểu quyết và danh sách cổ đông có quyền dự họp","Chỉ cần là người thân của thành viên Hội đồng quản trị"],"a":2,"e":"Nội dung phù hợp là “Tư cách cổ đông có quyền biểu quyết và danh sách cổ đông có quyền dự họp”. Phương án nhiễu “Chỉ cần là người lao động của công ty” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 115, Điều 141 Luật Doanh nghiệp.","lv":"TH","b":"Điều 115, Điều 141 Luật Doanh nghiệp"},{"id":"LDN415","g":4,"q":"Mô hình công ty cổ phần có Ủy ban kiểm toán được tổ chức theo cấu trúc nào?","o":["Ủy ban kiểm toán trực thuộc cơ quan đăng ký kinh doanh","Ủy ban kiểm toán trực thuộc Hội đồng quản trị theo mô hình luật định","Ủy ban kiểm toán thay thế Đại hội đồng cổ đông","Ủy ban kiểm toán là cơ quan đại diện của chủ nợ"],"a":1,"e":"Nội dung phù hợp là “Ủy ban kiểm toán trực thuộc Hội đồng quản trị theo mô hình luật định”. Phương án nhiễu “Ủy ban kiểm toán trực thuộc cơ quan đăng ký kinh doanh” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 137, Điều 161 Luật Doanh nghiệp.","lv":"TH","b":"Điều 137, Điều 161 Luật Doanh nghiệp"},{"id":"TH5.01.1","g":5,"q":"Chế độ trách nhiệm của ông Bình và bà Hòa được xác định thế nào?","o":["Chỉ chịu trách nhiệm trong phạm vi vốn đã góp","Chỉ chịu trách nhiệm bằng tài sản được giao quản lý","Liên đới chịu trách nhiệm bằng toàn bộ tài sản của mình về nghĩa vụ công ty","Không chịu trách nhiệm vì công ty có tư cách pháp nhân"],"a":2,"e":"Thành viên hợp danh chịu trách nhiệm vô hạn và liên đới đối với nghĩa vụ của công ty theo Điều 177.","b":"Khoản 1 Điều 177 Luật Doanh nghiệp","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"q":"Trách nhiệm của Công ty Minh Phúc với tư cách thành viên góp vốn được xác định ra sao?","o":["Trong phạm vi số vốn đã cam kết góp","Vô hạn như thành viên hợp danh","Bằng toàn bộ tài sản của công ty mẹ","Không có bất kỳ nghĩa vụ góp vốn nào"],"a":0,"e":"Thành viên góp vốn có chế độ trách nhiệm hữu hạn theo phần vốn cam kết, khác với thành viên hợp danh.","b":"Khoản 1 Điều 177, Điều 187 Luật Doanh nghiệp","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"q":"Ngân hàng có thể yêu cầu thanh toán từ thành viên hợp danh theo nguyên tắc nào?","o":["Chỉ được yêu cầu thành viên góp vốn","Chỉ được yêu cầu Giám đốc nếu có","Chỉ được yêu cầu sau khi công ty giải thể","Có thể yêu cầu các thành viên hợp danh thực hiện trách nhiệm liên đới theo luật"],"a":3,"e":"Trách nhiệm liên đới của thành viên hợp danh bảo đảm chủ nợ có thể yêu cầu thực hiện nghĩa vụ theo quy định chung.","b":"Điều 177 Luật Doanh nghiệp; BLDS 2015","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"q":"Nếu Công ty Minh Phúc đã góp đủ vốn, ngân hàng có thể đòi công ty này trả vượt phần vốn cam kết chỉ vì là thành viên góp vốn không?","o":["Có, vì mọi thành viên hợp danh đều chịu trách nhiệm vô hạn","Không; trách nhiệm của thành viên góp vốn bị giới hạn theo luật","Có, nếu khoản vay được Hội đồng thành viên thông qua","Có, nếu công ty không còn tài sản"],"a":1,"e":"Không được đồng nhất thành viên góp vốn với thành viên hợp danh; phạm vi trách nhiệm của thành viên góp vốn được giới hạn.","b":"Điều 177, Điều 187 Luật Doanh nghiệp","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"q":"Chế độ trách nhiệm tài sản của ông Quân được xác định thế nào?","o":["Chỉ chịu trách nhiệm trong phạm vi vốn đăng ký","Chịu trách nhiệm bằng toàn bộ tài sản của mình về hoạt động doanh nghiệp","Chỉ chịu trách nhiệm bằng máy móc mua từ khoản vay","Không chịu trách nhiệm vì doanh nghiệp có mã số riêng"],"a":1,"e":"Chủ doanh nghiệp tư nhân chịu trách nhiệm vô hạn; mã số, con dấu và tài khoản không tạo ra sự tách biệt trách nhiệm như pháp nhân.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"q":"Doanh nghiệp tư nhân có tư cách pháp nhân độc lập với ông Quân không?","o":["Có, vì đã được cấp đăng ký doanh nghiệp","Có, nếu có tài khoản ngân hàng riêng","Có, nếu thuê Giám đốc điều hành","Không có tư cách pháp nhân"],"a":3,"e":"Doanh nghiệp tư nhân không có tư cách pháp nhân; chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"q":"Nếu ông Quân thuê Giám đốc điều hành, trách nhiệm của ông thay đổi thế nào?","o":["Ông vẫn chịu trách nhiệm về mọi hoạt động của doanh nghiệp","Chuyển toàn bộ trách nhiệm sang Giám đốc","Chỉ chịu trách nhiệm đối với hợp đồng do mình ký","Không còn quyền quản lý và nghĩa vụ tài sản"],"a":0,"e":"Thuê người quản lý không làm thay đổi chủ thể chịu trách nhiệm vô hạn là chủ doanh nghiệp tư nhân.","b":"Điều 190 Luật Doanh nghiệp","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"q":"Nếu ông Quân muốn đồng thời làm thành viên hợp danh tại công ty hợp danh khác, có được không?","o":["Được nếu công ty hợp danh ở tỉnh khác","Được nếu không tham gia điều hành","Không được đồng thời là thành viên hợp danh khi vẫn là chủ doanh nghiệp tư nhân","Được nếu vốn góp dưới 10%"],"a":2,"e":"Khoản 3 Điều 188 đặt ra hạn chế đối với chủ doanh nghiệp tư nhân khi đồng thời là thành viên hợp danh.","b":"Khoản 3 Điều 188 Luật Doanh nghiệp","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"q":"Nghĩa vụ nào của ông Hải cần được xem xét trước tiên?","o":["Nghĩa vụ góp đủ cổ phần phổ thông","Nghĩa vụ công bố báo cáo chứng khoán","Nghĩa vụ đăng ký hộ tịch","Nghĩa vụ trung thành và không cạnh tranh trái với lợi ích công ty"],"a":3,"e":"Thành viên hợp danh có nghĩa vụ trung thành, không lợi dụng tài sản, thông tin hoặc cơ hội kinh doanh của công ty để tư lợi.","b":"Điều 180 Luật Doanh nghiệp","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"q":"Việc sử dụng danh sách khách hàng và thông tin giá dịch vụ có thể bị đánh giá như thế nào?","o":["Sử dụng tài sản cá nhân hợp pháp trong mọi trường hợp","Lạm dụng thông tin và cơ hội kinh doanh của công ty để thu lợi riêng","Chỉ là vi phạm quy tắc kế toán","Không liên quan đến nghĩa vụ thành viên"],"a":1,"e":"Thông tin và cơ hội kinh doanh tiếp cận được do tư cách thành viên phải được sử dụng trung thành với lợi ích công ty.","b":"Điều 180 Luật Doanh nghiệp","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"q":"Các thành viên còn lại có thể yêu cầu biện pháp nào?","o":["Yêu cầu cơ quan đăng ký doanh nghiệp tự động tuyên bố phá sản","Tự động tịch thu toàn bộ tài sản cá nhân ông Hải","Yêu cầu chấm dứt hành vi vi phạm và xử lý lợi ích thu được theo luật, Điều lệ","Xóa tên ông Hải khỏi hồ sơ mà không cần thủ tục"],"a":2,"e":"Công ty có thể yêu cầu thực hiện nghĩa vụ và bồi thường hoặc hoàn trả lợi ích theo quy định; việc chấm dứt tư cách thành viên phải đúng trình tự.","b":"Điều 180–185 Luật Doanh nghiệp","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"q":"Nếu ông Hải chấm dứt tư cách thành viên, nghĩa vụ đối với các khoản nợ đã phát sinh trước đó được xử lý ra sao?","o":["Vẫn phải xem xét trách nhiệm theo quy định sau khi chấm dứt tư cách thành viên","Mọi nghĩa vụ tự động chấm dứt ngay ngày rút khỏi công ty","Chỉ còn trách nhiệm nếu tiếp tục giữ chức Giám đốc","Chủ nợ chỉ được yêu cầu công ty, không thể yêu cầu ông Hải"],"a":0,"e":"Chấm dứt tư cách thành viên không xóa bỏ ngay trách nhiệm đối với nghĩa vụ đã phát sinh; phải đối chiếu Điều 185.","b":"Điều 185 Luật Doanh nghiệp","cid":"TH5.03"},{"id":"LDN501","g":5,"q":"Công ty hợp danh phải có tối thiểu bao nhiêu thành viên hợp danh?","o":["01 thành viên hợp danh là tổ chức","03 thành viên hợp danh, trong đó có một pháp nhân","02 thành viên hợp danh là cá nhân","05 thành viên hợp danh bất kể tư cách"],"a":2,"e":"Điều 177 yêu cầu ít nhất hai thành viên hợp danh và các thành viên hợp danh phải là cá nhân.","b":"Khoản 1 Điều 177 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN502","g":5,"q":"Thành viên hợp danh chịu trách nhiệm về nghĩa vụ công ty theo chế độ nào?","o":["Liên đới chịu trách nhiệm bằng toàn bộ tài sản của mình","Chỉ trong phạm vi vốn đã góp theo cam kết, không phải dùng tài sản riêng để thanh toán nghĩa vụ của công ty","Chỉ bằng tài sản được công ty giao quản lý","Không phải chịu trách nhiệm cá nhân"],"a":0,"e":"Thành viên hợp danh chịu trách nhiệm vô hạn và liên đới đối với nghĩa vụ của công ty theo luật.","b":"Khoản 1 Điều 177 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN503","g":5,"q":"Công ty hợp danh có tư cách pháp nhân kể từ thời điểm nào?","o":["Ngày các thành viên ký hợp đồng góp vốn","Ngày công ty phát sinh doanh thu đầu tiên","Ngày có đủ tài sản thanh toán nợ","Ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp"],"a":3,"e":"Tư cách pháp nhân phát sinh từ thời điểm được cấp Giấy chứng nhận đăng ký doanh nghiệp.","b":"Khoản 2 Điều 177 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN504","g":5,"q":"Doanh nghiệp tư nhân do chủ thể nào làm chủ?","o":["Một tổ chức có tư cách pháp nhân","Một cá nhân","Ít nhất hai cá nhân cùng sở hữu","Một công ty cổ phần"],"a":1,"e":"Doanh nghiệp tư nhân do một cá nhân làm chủ; chủ doanh nghiệp tự chịu trách nhiệm bằng toàn bộ tài sản.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN505","g":5,"q":"Doanh nghiệp tư nhân có tư cách pháp nhân hay không?","o":["Có tư cách pháp nhân từ khi đăng ký","Không có tư cách pháp nhân","Có tư cách pháp nhân nếu thuê Giám đốc","Có tư cách pháp nhân khi có con dấu"],"a":1,"e":"Doanh nghiệp tư nhân không có tư cách pháp nhân; chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN506","g":5,"q":"Vì sao thành viên góp vốn của công ty hợp danh có chế độ trách nhiệm khác thành viên hợp danh?","o":["Thành viên góp vốn không có quyền tài sản","Thành viên góp vốn luôn là người đại diện theo pháp luật","Thành viên góp vốn phải chịu trách nhiệm vô hạn","Thành viên góp vốn chỉ chịu trách nhiệm trong phạm vi vốn đã cam kết góp"],"a":3,"e":"Luật phân biệt thành viên hợp danh với thành viên góp vốn về vai trò quản lý và trách nhiệm tài sản.","b":"Điều 177, Điều 187 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN507","g":5,"q":"Công ty hợp danh có được phát hành cổ phiếu hoặc trái phiếu không?","o":["Không được phát hành bất kỳ loại chứng khoán nào","Được phát hành cổ phiếu phổ thông nhưng không được phát hành trái phiếu","Được phát hành trái phiếu nếu thành viên đồng ý","Được phát hành chứng khoán cho thành viên góp vốn"],"a":0,"e":"Luật Doanh nghiệp quy định công ty hợp danh không được phát hành bất kỳ loại chứng khoán nào.","b":"Khoản 3 Điều 177 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN508","g":5,"q":"Thành viên hợp danh tự mình kinh doanh cùng ngành nghề để hưởng lợi riêng cần xem xét nghĩa vụ nào?","o":["Quyền tự do chuyển nhượng cổ phần","Quyền phát hành trái phiếu","Nghĩa vụ trung thành và hạn chế cạnh tranh của thành viên hợp danh","Quyền đơn phương giải thể công ty"],"a":2,"e":"Thành viên hợp danh chịu các nghĩa vụ và hạn chế đặc thù để bảo vệ lợi ích chung của công ty; hoạt động cạnh tranh phải tuân thủ Điều 180.","b":"Điều 180 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN509","g":5,"q":"Chủ doanh nghiệp tư nhân thuê người khác làm Giám đốc điều hành. Ai vẫn chịu trách nhiệm về hoạt động doanh nghiệp?","o":["Người được thuê thay thế hoàn toàn chủ doanh nghiệp","Cơ quan đăng ký kinh doanh","Người lao động có thâm niên cao nhất","Chủ doanh nghiệp tư nhân"],"a":3,"e":"Việc thuê người quản lý không làm thay đổi chế độ trách nhiệm vô hạn của chủ doanh nghiệp tư nhân.","b":"Điều 190 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN510","g":5,"q":"Khác biệt cơ bản về tư cách pháp lý giữa công ty hợp danh và doanh nghiệp tư nhân là gì?","o":["Cả hai đều có tư cách pháp nhân","Công ty hợp danh có tư cách pháp nhân; doanh nghiệp tư nhân không có","Cả hai đều không có tư cách pháp nhân","Doanh nghiệp tư nhân có tư cách pháp nhân còn công ty hợp danh không có"],"a":1,"e":"Luật ghi nhận công ty hợp danh có tư cách pháp nhân; doanh nghiệp tư nhân không có tư cách pháp nhân.","b":"Khoản 2 Điều 177; khoản 1 Điều 188 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN511","g":5,"q":"Chủ doanh nghiệp tư nhân muốn đồng thời đăng ký hộ kinh doanh do mình làm chủ. Phương án nào phù hợp?","o":["Được nếu hai hoạt động ở hai tỉnh khác nhau","Được nếu hộ kinh doanh không thuê lao động","Không được đồng thời là chủ doanh nghiệp tư nhân và chủ hộ kinh doanh","Được nếu doanh thu hộ kinh doanh thấp"],"a":2,"e":"Nội dung phù hợp là “Không được đồng thời là chủ doanh nghiệp tư nhân và chủ hộ kinh doanh”. Phương án nhiễu “Được nếu hai hoạt động ở hai tỉnh khác nhau” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 3 Điều 188 Luật Doanh nghiệp.","lv":"VD","b":"Khoản 3 Điều 188 Luật Doanh nghiệp"},{"id":"LDN512","g":5,"q":"Chủ doanh nghiệp tư nhân muốn phát hành cổ phiếu để huy động vốn. Kết luận nào phù hợp?","o":["Không được phát hành bất kỳ loại chứng khoán nào","Được phát hành cổ phiếu nếu đăng ký thay đổi vốn","Được phát hành trái phiếu cho người lao động","Được phát hành cổ phiếu nếu có kiểm toán"],"a":0,"e":"Nội dung phù hợp là “Không được phát hành bất kỳ loại chứng khoán nào”. Phương án nhiễu “Được phát hành cổ phiếu nếu đăng ký thay đổi vốn” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 188 Luật Doanh nghiệp.","lv":"VD","b":"Điều 188 Luật Doanh nghiệp"},{"id":"LDN513","g":5,"q":"Công ty hợp danh có hai thành viên hợp danh và một thành viên góp vốn. Chủ nợ yêu cầu thành viên góp vốn thanh toán vượt quá số vốn cam kết. Cách xác định nào đúng?","o":["Thành viên góp vốn chỉ chịu trách nhiệm trong phạm vi vốn đã cam kết góp","Thành viên góp vốn chịu trách nhiệm vô hạn như thành viên hợp danh","Thành viên góp vốn không phải chịu bất kỳ trách nhiệm nào","Thành viên góp vốn chỉ chịu trách nhiệm nếu là người đại diện"],"a":0,"e":"Nội dung phù hợp là “Thành viên góp vốn chỉ chịu trách nhiệm
