c cấp Giấy chứng nhận đăng ký doanh nghiệp."]},{"t":"Chủ sở hữu hưởng lợi","cs":"Căn cứ: Điều 177–178 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Theo tiêu chí bổ sung tại Nghị định 296/2026/NĐ-CP, tất cả thành viên hợp danh được xác định là chủ sở hữu hưởng lợi, không phụ thuộc tỷ lệ vốn góp hoặc quyền biểu quyết."]}]},{"t":"5.2. Trách nhiệm tài sản và quyền, nghĩa vụ của thành viên hợp danh","cs":"Căn cứ: Điều 179–182 Luật Doanh nghiệp","b":[],"c":[{"t":"Trách nhiệm vô hạn, liên đới","cs":"Căn cứ: Điều 179–182 Luật Doanh nghiệp","b":["Thành viên hợp danh liên đới chịu trách nhiệm bằng toàn bộ tài sản của mình về nghĩa vụ công ty."]},{"t":"Thành viên góp vốn","cs":"Căn cứ: Điều 179–182 Luật Doanh nghiệp","b":["Thành viên góp vốn chịu trách nhiệm trong phạm vi số vốn đã cam kết góp; không tham gia quản lý công ty như thành viên hợp danh."]},{"t":"Hạn chế cạnh tranh","cs":"Căn cứ: Điều 179–182 Luật Doanh nghiệp","b":["Thành viên hợp danh bị hạn chế thực hiện hoạt động cạnh tranh, nhân danh cá nhân hoặc người khác kinh doanh cùng ngành nghề nhằm tư lợi trái luật."]}]},{"t":"5.3. Quản lý và điều hành công ty hợp danh","cs":"Căn cứ: Điều 184–187 Luật Doanh nghiệp","b":[],"c":[{"t":"Quyền đại diện, điều hành","cs":"Căn cứ: Điều 184–187 Luật Doanh nghiệp","b":["Các thành viên hợp danh có quyền đại diện theo pháp luật và tổ chức điều hành hoạt động kinh doanh hằng ngày theo quy định."]},{"t":"Hội đồng thành viên","cs":"Căn cứ: Điều 184–187 Luật Doanh nghiệp","b":["Hội đồng thành viên gồm tất cả thành viên; thành viên hợp danh có quyền biểu quyết theo luật và Điều lệ."]},{"t":"Không phát hành chứng khoán","cs":"Căn cứ: Điều 184–187 Luật Doanh nghiệp","b":["Công ty hợp danh không được phát hành bất kỳ loại chứng khoán nào; việc huy động vốn phải theo cơ chế luật định."]}]},{"t":"5.4. Doanh nghiệp tư nhân: đặc điểm và trách nhiệm của chủ doanh nghiệp","cs":"Căn cứ: Điều 188–190 Luật Doanh nghiệp","b":[],"c":[{"t":"Một cá nhân làm chủ","cs":"Căn cứ: Điều 188–190 Luật Doanh nghiệp","b":["Doanh nghiệp tư nhân do một cá nhân làm chủ; mỗi cá nhân chỉ được thành lập một doanh nghiệp tư nhân."]},{"t":"Trách nhiệm vô hạn, không có tư cách pháp nhân","cs":"Căn cứ: Điều 188–190 Luật Doanh nghiệp","b":["Chủ doanh nghiệp tư nhân chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp; doanh nghiệp không có tư cách pháp nhân."]},{"t":"Hạn chế đối với chủ doanh nghiệp","cs":"Căn cứ: Điều 188–190 Luật Doanh nghiệp","b":["Chủ doanh nghiệp tư nhân không được đồng thời là chủ hộ kinh doanh hoặc thành viên hợp danh của công ty hợp danh; doanh nghiệp tư nhân không được phát hành chứng khoán."]}]},{"t":"5.5. Quản lý, sử dụng vốn và chuyển đổi doanh nghiệp tư nhân","cs":"Căn cứ: Điều 189–193 Luật Doanh nghiệp","b":[],"c":[{"t":"Vốn đầu tư","cs":"Căn cứ: Điều 189–193 Luật Doanh nghiệp","b":["Vốn đầu tư của chủ doanh nghiệp tư nhân do chủ doanh nghiệp tự đăng ký; chủ doanh nghiệp có quyền tăng hoặc giảm vốn theo luật."]},{"t":"Thuê người quản lý","cs":"Căn cứ: Điều 189–193 Luật Doanh nghiệp","b":["Chủ doanh nghiệp có thể trực tiếp quản lý hoặc thuê người khác quản lý, điều hành nhưng vẫn chịu trách nhiệm về hoạt động doanh nghiệp."]},{"t":"Chuyển đổi loại hình","cs":"Căn cứ: Điều 189–193 Luật Doanh nghiệp","b":["Doanh nghiệp tư nhân có thể chuyển đổi thành công ty TNHH, công ty cổ phần hoặc công ty hợp danh khi đáp ứng đủ điều kiện và thủ tục luật định."]}]}]},{"t":"6. Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty","cs":"Căn cứ: Điều 12–13, 46–197 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH; Luật 68/2025/QH15; Nghị định 366/2025/NĐ-CP","b":["Quản trị doanh nghiệp là hệ thống cơ quan, người quản lý, cơ chế ra quyết định, kiểm soát và trách nhiệm giải trình trong doanh nghiệp.","Người quản lý và người đại diện phải hành động trung thực, cẩn trọng, trung thành với lợi ích hợp pháp của doanh nghiệp; kiểm soát xung đột lợi ích và giao dịch với người có liên quan.","Doanh nghiệp nhà nước được nhận diện theo tiêu chí Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết theo Luật Doanh nghiệp.","Quản lý vốn nhà nước tại doanh nghiệp phải đặt trong khuôn khổ pháp luật chuyên ngành về vốn nhà nước, hiện hành là VBHN 60/VBHN-VPQH và Nghị định 366/2025/NĐ-CP.","Nhóm công ty là tập hợp các công ty có quan hệ liên kết; không phải một loại hình doanh nghiệp và không có tư cách pháp nhân độc lập."],"c":[{"t":"6.1. Nghĩa vụ của người quản lý và người đại diện","cs":"Căn cứ: Điều 12–13, Điều 71, 83, 165 và các điều khoản tương ứng Luật Doanh nghiệp","b":[],"c":[{"t":"Trung thực, cẩn trọng","cs":"Căn cứ: Điều 12–13, Điều 71, 83, 165 và các điều khoản tương ứng Luật Doanh nghiệp","b":["Người quản lý phải thực hiện quyền, nghĩa vụ trung thực, cẩn trọng và tốt nhất nhằm bảo đảm lợi ích hợp pháp của doanh nghiệp."]},{"t":"Không lạm dụng chức vụ","cs":"Căn cứ: Điều 12–13, Điều 71, 83, 165 và các điều khoản tương ứng Luật Doanh nghiệp","b":["Không được lạm dụng chức vụ, quyền hạn, thông tin, cơ hội kinh doanh hoặc tài sản của doanh nghiệp để tư lợi hay phục vụ lợi ích của tổ chức, cá nhân khác."]},{"t":"Trách nhiệm cá nhân","cs":"Khoản 2 Điều 13 Luật Doanh nghiệp","b":["Khoản 2 Điều 13 được Luật 76/2025/QH15 sửa đổi về cách diễn đạt trách nhiệm cá nhân theo quy định của pháp luật; nguyên tắc người đại diện chịu trách nhiệm cá nhân đối với thiệt hại do vi phạm nghĩa vụ đã có trong Luật Doanh nghiệp trước sửa đổi."]}]},{"t":"6.2. Quản trị công ty TNHH và công ty hợp danh","cs":"Căn cứ: Điều 54–87, 179–187 Luật Doanh nghiệp","b":[],"c":[{"t":"Quản trị công ty TNHH","cs":"Căn cứ: Điều 54–87, 179–187 Luật Doanh nghiệp","b":["Quản trị công ty TNHH dựa trên quyền của chủ sở hữu hoặc Hội đồng thành viên, cơ chế bổ nhiệm người điều hành và kiểm soát theo loại hình."]},{"t":"Quản trị công ty hợp danh","cs":"Căn cứ: Điều 54–87, 179–187 Luật Doanh nghiệp","b":["Quản trị công ty hợp danh gắn với vai trò của thành viên hợp danh, quyền đại diện và trách nhiệm tài sản vô hạn."]},{"t":"Vai trò của Điều lệ","cs":"Căn cứ: Điều 54–87, 179–187 Luật Doanh nghiệp","b":["Điều lệ công ty cụ thể hóa thẩm quyền, trình tự họp, biểu quyết và cơ chế phân công nhưng không được trái quy định bắt buộc của luật."]}]},{"t":"6.3. Quản trị công ty cổ phần và bảo vệ cổ đông","cs":"Căn cứ: Điều 137–176 Luật Doanh nghiệp; Luật Chứng khoán 2019, sửa đổi bởi Luật 56/2024/QH15","b":[],"c":[{"t":"Cấu trúc quản trị","cs":"Căn cứ: Điều 137–176 Luật Doanh nghiệp; Luật Chứng khoán 2019, sửa đổi bởi Luật 56/2024/QH15","b":["Đại hội đồng cổ đông, Hội đồng quản trị, Giám đốc/Tổng giám đốc và Ban kiểm soát hoặc Ủy ban kiểm toán tạo thành cấu trúc quản trị công ty cổ phần."]},{"t":"Minh bạch, bảo vệ cổ đông thiểu số","cs":"Căn cứ: Điều 137–176 Luật Doanh nghiệp; Luật Chứng khoán 2019, sửa đổi bởi Luật 56/2024/QH15","b":["Cơ chế công bố thông tin, giao dịch với người có liên quan và quyền của cổ đông thiểu số góp phần bảo đảm minh bạch, kiểm soát quyền lực nội bộ."]},{"t":"Công ty đại chúng","cs":"Căn cứ: Điều 137–176 Luật Doanh nghiệp; Luật Chứng khoán 2019, sửa đổi bởi Luật 56/2024/QH15","b":["Công ty đại chúng và tổ chức niêm yết phải tuân thủ thêm quy định chuyên ngành chứng khoán."]}]},{"t":"6.4. Doanh nghiệp nhà nước và quản lý vốn nhà nước","cs":"Căn cứ: Điều 88–110 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH ngày 23/03/2026; Nghị định 366/2025/NĐ-CP","b":[],"c":[{"t":"Tiêu chí trên 50% vốn","cs":"Căn cứ: Điều 88–110 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH ngày 23/03/2026; Nghị định 366/2025/NĐ-CP","b":["Doanh nghiệp nhà nước được xác định theo tỷ lệ Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết theo Luật Doanh nghiệp."]},{"t":"Luật quản lý, đầu tư vốn nhà nước","cs":"Căn cứ: Điều 88–110 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH ngày 23/03/2026; Nghị định 366/2025/NĐ-CP","b":["Luật 68/2025/QH15 là luật nền tảng về quản lý và đầu tư vốn nhà nước tại doanh nghiệp; nội dung hiện hành cần tra cứu theo VBHN 60/VBHN-VPQH."]},{"t":"Văn bản hướng dẫn","cs":"Căn cứ: Điều 88–110 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH ngày 23/03/2026; Nghị định 366/2025/NĐ-CP","b":["Nghị định 366/2025/NĐ-CP hướng dẫn đầu tư vốn nhà nước, quản lý vốn nhà nước tại doanh nghiệp và phân công, phân cấp thực hiện quyền đại diện chủ sở hữu."]}]},{"t":"6.5. Nhóm công ty, công ty mẹ và công ty con","cs":"Căn cứ: Điều 194–197 Luật Doanh nghiệp","b":[],"c":[{"t":"Khái niệm nhóm công ty","cs":"Căn cứ: Điều 194–197 Luật Doanh nghiệp","b":["Nhóm công ty gồm công ty mẹ, công ty con và các công ty thành viên có quan hệ liên kết; quan hệ được xác định theo quyền sở hữu, quyền chi phối hoặc quyền quyết định."]},{"t":"Công ty mẹ, con là pháp nhân độc lập","cs":"Căn cứ: Điều 194–197 Luật Doanh nghiệp","b":["Công ty mẹ và công ty con là các pháp nhân độc lập; việc công ty mẹ chi phối không tự động xóa bỏ tư cách pháp lý và trách nhiệm tài sản riêng của công ty con."]},{"t":"Không có tư cách pháp nhân","cs":"Căn cứ: Điều 194–197 Luật Doanh nghiệp","b":["Nhóm công ty không có tư cách pháp nhân; các hạn chế về góp vốn, đầu tư chéo và trách nhiệm của công ty mẹ phải được xem xét theo luật."]}]}]},{"t":"7. Tổ chức lại, giải thể và phục hồi, phá sản","cs":"Căn cứ: Điều 198–210 Luật Doanh nghiệp; Luật Phục hồi, phá sản 142/2025/QH15","b":["Tổ chức lại doanh nghiệp gồm chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình; phải xử lý quyền lợi của thành viên, cổ đông, người lao động và chủ nợ.","Giải thể là chấm dứt sự tồn tại của doanh nghiệp theo các căn cứ luật định, với điều kiện doanh nghiệp bảo đảm thanh toán hết các khoản nợ và nghĩa vụ tài sản.","Phục hồi, phá sản là thủ tục tư pháp riêng theo Luật 142/2025/QH15; ưu tiên thủ tục phục hồi nhằm tái cơ cấu và khôi phục khả năng thanh toán.","Từ ngày 01/03/2026, doanh nghiệp có nguy cơ mất khả năng thanh toán được nhận diện theo mốc 06 tháng; doanh nghiệp mất khả năng thanh toán là doanh nghiệp không thực hiện nghĩa vụ thanh toán sau thời hạn 06 tháng kể từ ngày đến hạn."],"c":[{"t":"7.1. Các hình thức tổ chức lại doanh nghiệp","cs":"Căn cứ: Điều 198–205 Luật Doanh nghiệp","b":[],"c":[{"t":"Chia công ty","cs":"Căn cứ: Điều 198–205 Luật Doanh nghiệp","b":["Chia công ty: công ty bị chia chấm dứt tồn tại và các công ty mới kế thừa quyền, nghĩa vụ theo phương án chia."]},{"t":"Tách công ty","cs":"Căn cứ: Điều 198–205 Luật Doanh nghiệp","b":["Tách công ty: công ty bị tách tiếp tục tồn tại, đồng thời chuyển một phần tài sản, quyền và nghĩa vụ sang công ty mới."]},{"t":"Hợp nhất, sáp nhập","cs":"Căn cứ: Điều 198–205 Luật Doanh nghiệp","b":["Hợp nhất tạo ra công ty mới và chấm dứt các công ty bị hợp nhất; sáp nhập làm công ty bị sáp nhập chấm dứt và công ty nhận sáp nhập tiếp tục tồn tại."]},{"t":"Chuyển đổi loại hình","cs":"Căn cứ: Điều 198–205 Luật Doanh nghiệp","b":["Chuyển đổi loại hình làm thay đổi cấu trúc pháp lý, chủ sở hữu hoặc thành viên nhưng phải bảo đảm kế thừa quyền, nghĩa vụ và xử lý các khoản nợ."]}]},{"t":"7.2. Căn cứ và điều kiện giải thể doanh nghiệp","cs":"Căn cứ: Điều 207 Luật Doanh nghiệp","b":[],"c":[{"t":"Các trường hợp giải thể","cs":"Căn cứ: Điều 207 Luật Doanh nghiệp","b":["Doanh nghiệp giải thể khi kết thúc thời hạn hoạt động ghi trong Điều lệ mà không gia hạn; theo nghị quyết, quyết định của chủ thể có thẩm quyền; không còn đủ số lượng thành viên tối thiểu trong thời hạn luật định; hoặc bị thu hồi Giấy chứng nhận đăng ký doanh nghiệp, trừ trường hợp luật quy định khác."]},{"t":"Điều kiện giải thể","cs":"Căn cứ: Điều 207 Luật Doanh nghiệp","b":["Doanh nghiệp chỉ được giải thể khi bảo đảm thanh toán hết các khoản nợ và nghĩa vụ tài sản khác, đồng thời không trong quá trình giải quyết tranh chấp tại Tòa án hoặc Trọng tài."]},{"t":"Mất khả năng thanh toán","cs":"Căn cứ: Điều 207 Luật Doanh nghiệp","b":["Nếu doanh nghiệp không có khả năng thanh toán các khoản nợ thì phải xem xét thủ tục phục hồi, phá sản thay vì sử dụng giải thể để né tránh nghĩa vụ."]}]},{"t":"7.3. Trình tự giải thể và thanh toán nghĩa vụ","cs":"Căn cứ: Điều 208–210 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":[],"c":[{"t":"Quyết định, thông báo giải thể","cs":"Căn cứ: Điều 208–210 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Chủ thể có thẩm quyền thông qua nghị quyết hoặc quyết định giải thể; doanh nghiệp gửi thông báo đến cơ quan đăng ký kinh doanh, chủ nợ và người có quyền lợi liên quan."]},{"t":"Thanh toán nợ, thanh lý tài sản","cs":"Căn cứ: Điều 208–210 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Doanh nghiệp lập phương án thanh toán nợ, thanh lý tài sản, thực hiện nghĩa vụ thuế, bảo hiểm, lao động và các nghĩa vụ khác."]},{"t":"Hồ sơ giải thể","cs":"Căn cứ: Điều 208–210 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Sau khi hoàn tất nghĩa vụ, doanh nghiệp gửi hồ sơ giải thể; cơ quan đăng ký kinh doanh cập nhật tình trạng pháp lý của doanh nghiệp theo quy định."]}]},{"t":"7.4. Phân biệt giải thể và phá sản","cs":"Căn cứ: Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật Phục hồi, phá sản 142/2025/QH15","b":[],"c":[{"t":"Giải thể","cs":"Căn cứ: Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật Phục hồi, phá sản 142/2025/QH15","b":["Giải thể phát sinh từ các căn cứ tổ chức hoặc quyết định của doanh nghiệp/cơ quan có thẩm quyền và đòi hỏi khả năng thanh toán hết nợ."]},{"t":"Phá sản","cs":"Căn cứ: Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật Phục hồi, phá sản 142/2025/QH15","b":["Phá sản gắn với tình trạng mất khả năng thanh toán và phải có quyết định tuyên bố phá sản của Tòa án."]},{"t":"Khác biệt về thủ tục","cs":"Căn cứ: Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật Phục hồi, phá sản 142/2025/QH15","b":["Giải thể không phải là thủ tục tư pháp phá sản; phá sản có cơ chế xử lý tài sản, chủ nợ và thứ tự thanh toán riêng."]}]},{"t":"7.5. Thủ tục phục hồi hoạt động kinh doanh","cs":"Căn cứ: Điều 1–5, Điều 24–37 và các quy định liên quan Luật 142/2025/QH15","b":[],"c":[{"t":"Ưu tiên phục hồi","cs":"Căn cứ: Điều 1–5, Điều 24–37 và các quy định liên quan Luật 142/2025/QH15","b":["Luật 142/2025/QH15 ưu tiên thủ tục phục hồi; doanh nghiệp có nguy cơ mất khả năng thanh toán có thể đề nghị áp dụng thủ tục để tái cơ cấu trước khi rơi vào tình trạng mất khả năng thanh toán."]},{"t":"Nguy cơ mất khả năng thanh toán","cs":"Căn cứ: Điều 1–5, Điều 24–37 và các quy định liên quan Luật 142/2025/QH15","b":["Doanh nghiệp có nguy cơ mất khả năng thanh toán là doanh nghiệp không thanh toán được khoản nợ sẽ đến hạn trong 06 tháng hoặc khoản nợ đã đến hạn nhưng chưa quá 06 tháng."]},{"t":"Phương án phục hồi","cs":"Căn cứ: Điều 1–5, Điều 24–37 và các quy định liên quan Luật 142/2025/QH15","b":["Phương án phục hồi phải nêu biện pháp phục hồi hoạt động, điều kiện, thời hạn và kế hoạch thanh toán nợ; việc thông qua và thực hiện chịu sự giám sát của Tòa án và chủ thể tiến hành thủ tục."]}]},{"t":"7.6. Thủ tục phá sản và hậu quả pháp lý","cs":"Căn cứ: Điều 5–7, Điều 38–67 và các quy định liên quan Luật 142/2025/QH15","b":[],"c":[{"t":"Mất khả năng thanh toán","cs":"Căn cứ: Điều 5–7, Điều 38–67 và các quy định liên quan Luật 142/2025/QH15","b":["Doanh nghiệp mất khả năng thanh toán là doanh nghiệp không thực hiện nghĩa vụ thanh toán khoản nợ sau thời hạn 06 tháng kể từ ngày đến hạn."]},{"t":"Các bước thủ tục phá sản","cs":"Căn cứ: Điều 5–7, Điều 38–67 và các quy định liên quan Luật 142/2025/QH15","b":["Thủ tục phá sản gồm nộp, xử lý đơn; xem xét mở thủ tục; xác định tài sản và chủ nợ; tổ chức Hội nghị chủ nợ; xem xét phục hồi hoặc tuyên bố phá sản theo điều kiện luật định."]},{"t":"Thủ tục rút gọn, xử lý tài sản","cs":"Căn cứ: Điều 5–7, Điều 38–67 và các quy định liên quan Luật 142/2025/QH15","b":["Luật 142/2025/QH15 quy định thủ tục rút gọn và cơ chế xử lý tài sản, giao dịch vô hiệu, hợp đồng, thứ tự phân chia tài sản; cần áp dụng đúng thời điểm và quy định chuyển tiếp."]}]}]}]}}</script>
