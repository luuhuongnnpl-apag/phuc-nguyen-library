 trong phạm vi vốn đã cam kết góp”. Phương án nhiễu “Thành viên góp vốn chịu trách nhiệm vô hạn như thành viên hợp danh” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 1 Điều 177, Điều 187 Luật Doanh nghiệp.","lv":"VD","b":"Khoản 1 Điều 177, Điều 187 Luật Doanh nghiệp"},{"id":"LDN514","g":5,"q":"Khi thành viên hợp danh rút khỏi công ty, trách nhiệm đối với nghĩa vụ đã phát sinh cần căn cứ vào yếu tố nào?","o":["Chỉ căn cứ ngày công ty đổi tên","Chỉ căn cứ số lượng lao động còn lại","Thời điểm phát sinh nghĩa vụ và quy định trách nhiệm sau khi chấm dứt tư cách thành viên","Chỉ căn cứ việc thành viên có giữ con dấu"],"a":2,"e":"Nội dung phù hợp là “Thời điểm phát sinh nghĩa vụ và quy định trách nhiệm sau khi chấm dứt tư cách thành viên”. Phương án nhiễu “Chỉ căn cứ ngày công ty đổi tên” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 185 Luật Doanh nghiệp.","lv":"VD","b":"Điều 185 Luật Doanh nghiệp"},{"id":"LDN515","g":5,"q":"Chủ doanh nghiệp tư nhân chết, việc xử lý doanh nghiệp cần căn cứ vào yếu tố nào?","o":["Doanh nghiệp tự động chuyển thành công ty cổ phần","Quy định về thừa kế và các phương án tiếp tục, chuyển đổi hoặc chấm dứt hoạt động","Toàn bộ tài sản đương nhiên thuộc cơ quan đăng ký kinh doanh","Người lao động tự động trở thành chủ doanh nghiệp"],"a":1,"e":"Nội dung phù hợp là “Quy định về thừa kế và các phương án tiếp tục, chuyển đổi hoặc chấm dứt hoạt động”. Phương án nhiễu “Doanh nghiệp tự động chuyển thành công ty cổ phần” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 193 Luật Doanh nghiệp; BLDS 2015.","lv":"TH","b":"Điều 193 Luật Doanh nghiệp; BLDS 2015"},{"id":"TH6.01.1","g":6,"q":"Quan hệ giữa ông Sơn và giao dịch cần được nhận diện thế nào?","o":["Giao dịch giữa hai doanh nghiệp không liên quan","Giao dịch lao động nội bộ","Giao dịch với người có liên quan và có xung đột lợi ích","Giao dịch chuyển đổi loại hình"],"a":2,"e":"Ông Sơn vừa là người quản lý Đông Á vừa kiểm soát Nam Việt, do đó phải xem xét quy định về người có liên quan.","b":"Điều 4, Điều 167 Luật Doanh nghiệp","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"q":"Ông Sơn phải thực hiện nghĩa vụ nào?","o":["Kê khai lợi ích liên quan và tuân thủ quy định không tham gia biểu quyết khi luật yêu cầu","Giữ kín lợi ích vì là cổ đông sáng lập","Chỉ thông báo sau khi hợp đồng hoàn tất","Không cần công khai nếu hợp đồng có lợi cho bên bán"],"a":0,"e":"Người quản lý phải công khai lợi ích liên quan và tuân thủ cơ chế chấp thuận giao dịch nhằm ngăn xung đột lợi ích.","b":"Điều 165, Điều 167 Luật Doanh nghiệp","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"q":"Nhóm cổ đông muốn kiểm tra giao dịch cần dựa trên cơ chế nào?","o":["Quyền tự ý hủy hợp đồng mà không cần thủ tục","Quyền yêu cầu cơ quan đăng ký doanh nghiệp định giá tài sản","Quyền thay thế Hội đồng quản trị ngay lập tức","Quyền tiếp cận thông tin, yêu cầu kiểm tra và quyền của cổ đông theo luật"],"a":3,"e":"Cổ đông hoặc nhóm cổ đông đáp ứng điều kiện luật định có quyền tiếp cận tài liệu và thực hiện quyền giám sát quản trị.","b":"Điều 115, Điều 166, Điều 167 Luật Doanh nghiệp","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"q":"Nếu giao dịch được thông qua sai thẩm quyền hoặc vi phạm nghĩa vụ, hệ quả nào có thể phát sinh?","o":["Giao dịch luôn được miễn trách nhiệm vì đã ký","Trách nhiệm của người quản lý và nghĩa vụ hoàn trả, bồi thường theo luật","Chỉ người mua chịu trách nhiệm trong mọi trường hợp","Công ty tự động bị giải thể"],"a":1,"e":"Vi phạm nghĩa vụ người quản lý và thủ tục giao dịch liên quan có thể làm phát sinh trách nhiệm bồi thường, hoàn trả lợi ích hoặc hậu quả pháp lý khác.","b":"Điều 165, Điều 167 Luật Doanh nghiệp","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"q":"Công ty Hạ tầng Bắc Việt có đáp ứng tiêu chí doanh nghiệp nhà nước không?","o":["Không, vì Nhà nước chưa nắm 100% vốn","Có, vì Nhà nước nắm giữ trên 50% vốn điều lệ","Không, vì công ty có hình thức công ty cổ phần","Chỉ được xác định khi có vốn vay ngân sách"],"a":1,"e":"Tỷ lệ Nhà nước nắm giữ 62% vốn điều lệ vượt ngưỡng trên 50% theo Điều 88 Luật Doanh nghiệp.","b":"Điều 88 Luật Doanh nghiệp","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"q":"Nguồn luật chuyên ngành nào cần áp dụng khi xem xét đầu tư và quản lý phần vốn nhà nước?","o":["Chỉ Luật Thương mại 2005","Chỉ Nghị định 168/2025/NĐ-CP","Chỉ Điều lệ công ty mẹ","VBHN 60/VBHN-VPQH và Nghị định 366/2025/NĐ-CP"],"a":3,"e":"Quản lý và đầu tư vốn nhà nước phải đối chiếu luật chuyên ngành hiện hành, được hợp nhất tại VBHN 60 và hướng dẫn bởi Nghị định 366.","b":"VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"q":"Người đại diện phần vốn nhà nước cần làm gì trước khi biểu quyết đầu tư?","o":["Thực hiện quyền, trách nhiệm đại diện chủ sở hữu theo phân công, phân cấp và pháp luật hiện hành","Tự quyết định không cần căn cứ","Chỉ hỏi ý kiến cổ đông tư nhân lớn nhất","Chuyển quyền quyết định cho công ty con"],"a":0,"e":"Quyền đại diện chủ sở hữu nhà nước được thực hiện theo khuôn khổ phân công, phân cấp và thẩm quyền của luật chuyên ngành.","b":"Luật 68/2025/QH15; VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"q":"Hội đồng quản trị công ty có thể bỏ qua quy định quản lý vốn nhà nước vì đã có nghị quyết nội bộ không?","o":["Có, vì Điều lệ là văn bản cao nhất của doanh nghiệp","Có, nếu khoản đầu tư có lợi nhuận dự kiến","Không; nghị quyết nội bộ phải phù hợp Luật Doanh nghiệp và pháp luật về vốn nhà nước","Có, nếu người đại diện vốn nhà nước đồng ý miệng"],"a":2,"e":"Nghị quyết nội bộ không thể thay thế hoặc loại trừ quy định bắt buộc của pháp luật về quản lý vốn nhà nước.","b":"Luật Doanh nghiệp; VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"q":"Quan hệ giữa Thành Công và Đại Phú được xác định thế nào?","o":["Quan hệ giữa hai chi nhánh cùng một pháp nhân","Quan hệ hợp danh giữa hai công ty","Quan hệ giữa doanh nghiệp và hộ kinh doanh","Quan hệ công ty mẹ – công ty con do sở hữu và chi phối vốn"],"a":3,"e":"Sở hữu 75% vốn điều lệ là căn cứ thể hiện quan hệ chi phối; hai công ty vẫn có tư cách pháp lý riêng.","b":"Điều 195 Luật Doanh nghiệp","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"q":"Đại Phú có mất tư cách pháp nhân chỉ vì bị công ty mẹ kiểm soát không?","o":["Có, vì công ty mẹ sở hữu trên 50% vốn","Không; công ty con vẫn là pháp nhân độc lập","Có, nếu công ty mẹ bổ nhiệm Giám đốc","Có, nếu hai công ty dùng chung thương hiệu"],"a":1,"e":"Quan hệ chi phối không xóa bỏ tư cách pháp nhân và tài sản độc lập của công ty con.","b":"Điều 194–197 Luật Doanh nghiệp; BLDS 2015","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"q":"Việc chuyển tài sản từ Đại Phú sang Thành Công cần được xem xét dưới góc độ nào?","o":["Chỉ là điều chuyển tài sản nội bộ không cần căn cứ","Chỉ là thay đổi địa chỉ trụ sở","Thẩm quyền nội bộ, giao dịch với người có liên quan và nghĩa vụ của người quản lý","Chỉ là thủ tục thuế giá trị gia tăng"],"a":2,"e":"Cần xác định việc công ty mẹ chỉ đạo công ty con chuyển tài sản có vượt quá quyền của chủ sở hữu, gây thiệt hại cho công ty con hoặc chủ nợ hay không; từ đó xem xét trách nhiệm của công ty mẹ theo các quy định về công ty mẹ, công ty con và nghĩa vụ của người quản lý.","b":"Điều 165, Điều 195–197 Luật Doanh nghiệp","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"q":"Ngân hàng có thể yêu cầu Thành Công trả toàn bộ khoản vay của Đại Phú chỉ dựa trên quan hệ sở hữu không?","o":["Không tự động; phải có căn cứ bảo lãnh, cam kết hoặc trách nhiệm luật định khác","Có, vì công ty mẹ luôn chịu mọi khoản nợ công ty con","Có, nếu tỷ lệ sở hữu vượt 50%","Có, vì nhóm công ty là một pháp nhân"],"a":0,"e":"Trách nhiệm tài sản riêng của công ty con không tự động chuyển sang công ty mẹ; phải xác định căn cứ nghĩa vụ cụ thể.","b":"Điều 194–197 Luật Doanh nghiệp; BLDS 2015","cid":"TH6.03"},{"id":"LDN601","g":6,"q":"Doanh nghiệp nhà nước được xác định theo tiêu chí sở hữu nào?","o":["Nhà nước nắm giữ từ 10% vốn điều lệ","Doanh nghiệp có một người lao động là công chức","Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết","Doanh nghiệp nhận khoản vay từ ngân hàng nhà nước"],"a":2,"e":"Tiêu chí xác định doanh nghiệp nhà nước gắn với tỷ lệ sở hữu vốn hoặc quyền biểu quyết của Nhà nước trên 50%.","b":"Điều 88 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN602","g":6,"q":"Văn bản hợp nhất hiện hành được dùng để tra cứu Luật Quản lý và đầu tư vốn nhà nước tại doanh nghiệp ở mốc 01/11/2026 là văn bản nào?","o":["60/VBHN-VPQH ngày 23/03/2026","69/VBHN-VPQH ngày 01/01/2025","67/VBHN-VPQH ngày 15/08/2025","01/VBHN-CP ngày 01/07/2025"],"a":0,"e":"VBHN 60/VBHN-VPQH hợp nhất Luật 68/2025/QH15 sau sửa đổi liên quan; VBHN 67 là Luật Doanh nghiệp.","b":"VBHN 60/VBHN-VPQH","lv":"NB"},{"id":"LDN603","g":6,"q":"Nghị định 366/2025/NĐ-CP điều chỉnh lĩnh vực nào?","o":["Đăng ký hộ tịch","Đăng ký doanh nghiệp thay thế Nghị định 168","Quản lý hoạt động công chứng","Quản lý và đầu tư vốn nhà nước tại doanh nghiệp"],"a":3,"e":"Nghị định 366/2025/NĐ-CP có hiệu lực từ 01/01/2026 và quy định về quản lý, đầu tư vốn nhà nước tại doanh nghiệp.","b":"Nghị định 366/2025/NĐ-CP","lv":"NB"},{"id":"LDN604","g":6,"q":"Nhóm công ty theo Luật Doanh nghiệp có tư cách pháp nhân độc lập hay không?","o":["Có tư cách pháp nhân như công ty mẹ","Không có tư cách pháp nhân","Có tư cách pháp nhân nếu có từ ba công ty con","Có tư cách pháp nhân khi đăng ký với cơ quan thuế"],"a":1,"e":"Nhóm công ty là tập hợp các công ty có quan hệ liên kết, không phải một loại hình doanh nghiệp và không có tư cách pháp nhân.","b":"Khoản 2 Điều 194 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN605","g":6,"q":"Cơ quan nào là cơ quan quản lý công ty cổ phần?","o":["Đại hội đồng cổ đông là cơ quan quản lý thường xuyên","Hội đồng quản trị","Cơ quan đăng ký kinh doanh cấp tỉnh","Hội nghị chủ nợ"],"a":1,"e":"Hội đồng quản trị là cơ quan quản lý công ty cổ phần; Đại hội đồng cổ đông là cơ quan quyết định cao nhất.","b":"Điều 153 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN606","g":6,"q":"Vì sao công ty con vẫn được xem là pháp nhân độc lập với công ty mẹ?","o":["Vì công ty mẹ không được sở hữu vốn tại công ty con","Vì công ty con không chịu sự chi phối của công ty mẹ","Vì nhóm công ty có một mã số doanh nghiệp chung","Vì mỗi công ty có tài sản, quyền và nghĩa vụ riêng dù có quan hệ chi phối"],"a":3,"e":"Quan hệ mẹ-con không xóa bỏ tư cách pháp nhân riêng; trách nhiệm tài sản của từng công ty được xác định độc lập theo luật.","b":"Điều 194–197 Luật Doanh nghiệp; BLDS 2015","lv":"TH"},{"id":"LDN607","g":6,"q":"Người quản lý sử dụng thông tin mật và cơ hội kinh doanh của công ty để thu lợi riêng. Nghĩa vụ nào bị xâm phạm?","o":["Nghĩa vụ trung thành và không lạm dụng thông tin, cơ hội kinh doanh","Nghĩa vụ đăng ký địa điểm kinh doanh","Nghĩa vụ công bố giá bán lẻ","Nghĩa vụ lập danh sách cổ đông sáng lập"],"a":0,"e":"Người quản lý phải trung thành với lợi ích doanh nghiệp và không được lạm dụng thông tin, cơ hội kinh doanh hoặc tài sản của công ty.","b":"Điều 12, Điều 165 Luật Doanh nghiệp","lv":"TH"},{"id":"LDN608","g":6,"q":"Tại sao giao dịch giữa công ty với người có liên quan phải có cơ chế chấp thuận đặc biệt?","o":["Để miễn trách nhiệm cho người đại diện","Để thay thế thủ tục đăng ký doanh nghiệp","Để kiểm soát xung đột lợi ích và bảo vệ lợi ích hợp pháp của công ty","Để bảo đảm mọi giao dịch đều có lợi nhuận"],"a":2,"e":"Nội dung phù hợp là “Để kiểm soát xung đột lợi ích và bảo vệ lợi ích hợp pháp của công ty”. Phương án nhiễu “Để miễn trách nhiệm cho người đại diện” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 67, Điều 86, Điều 167 Luật Doanh nghiệp.","lv":"TH","b":"Điều 67, Điều 86, Điều 167 Luật Doanh nghiệp"},{"id":"LDN609","g":6,"q":"Luật 68/2025/QH15 có vai trò gì trong quản trị doanh nghiệp nhà nước?","o":["Thay thế toàn bộ Luật Doanh nghiệp đối với mọi doanh nghiệp","Điều chỉnh đăng ký hộ kinh doanh","Quy định điều kiện thành lập công ty hợp danh","Đặt khuôn khổ về đầu tư và quản lý vốn nhà nước tại doanh nghiệp"],"a":3,"e":"Nội dung phù hợp là “Đặt khuôn khổ về đầu tư và quản lý vốn nhà nước tại doanh nghiệp”. Phương án nhiễu “Thay thế toàn bộ Luật Doanh nghiệp đối với mọi doanh nghiệp” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Luật 68/2025/QH15; VBHN 60/VBHN-VPQH.","lv":"TH","b":"Luật 68/2025/QH15; VBHN 60/VBHN-VPQH"},{"id":"LDN610","g":6,"q":"Công ty mẹ và công ty con có phải là một pháp nhân duy nhất không?","o":["Có, vì công ty mẹ nắm quyền chi phối","Không; mỗi công ty có tư cách pháp lý và trách nhiệm tài sản riêng","Có, nếu cùng sử dụng một thương hiệu","Có, nếu công ty mẹ sở hữu trên 50% vốn"],"a":1,"e":"Nội dung phù hợp là “Không; mỗi công ty có tư cách pháp lý và trách nhiệm tài sản riêng”. Phương án nhiễu “Có, vì công ty mẹ nắm quyền chi phối” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 194–197 Luật Doanh nghiệp.","lv":"TH","b":"Điều 194–197 Luật Doanh nghiệp"},{"id":"LDN611","g":6,"q":"Nhà nước nắm giữ 60% tổng số cổ phần có quyền biểu quyết tại một công ty cổ phần. Công ty được phân loại thế nào?","o":["Doanh nghiệp tư nhân","Công ty hợp danh","Doanh nghiệp nhà nước","Hộ kinh doanh"],"a":2,"e":"Nội dung phù hợp là “Doanh nghiệp nhà nước”. Phương án nhiễu “Doanh nghiệp tư nhân” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 88 Luật Doanh nghiệp.","lv":"VD","b":"Điều 88 Luật Doanh nghiệp"},{"id":"LDN612","g":6,"q":"Giám đốc công ty ký hợp đồng với doanh nghiệp do chính mình kiểm soát mà không công khai lợi ích liên quan. Vấn đề nào cần được xem xét?","o":["Giao dịch với người có liên quan và vi phạm nghĩa vụ của người quản lý","Giao dịch luôn hợp pháp vì hai pháp nhân độc lập","Chỉ cần kiểm tra ngành nghề đăng ký","Chỉ là vấn đề kế toán, không liên quan quản trị"],"a":0,"e":"Nội dung phù hợp là “Giao dịch với người có liên quan và vi phạm nghĩa vụ của người quản lý”. Phương án nhiễu “Giao dịch luôn hợp pháp vì hai pháp nhân độc lập” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 12, Điều 167 Luật Doanh nghiệp.","lv":"VD","b":"Điều 12, Điều 167 Luật Doanh nghiệp"},{"id":"LDN613","g":6,"q":"Công ty mẹ sở hữu 70% vốn công ty con. Chủ nợ của công ty con yêu cầu công ty mẹ trả toàn bộ nợ chỉ vì quan hệ sở hữu. Kết luận nào phù hợp?","o":["Không tự động phát sinh trách nhiệm; phải có căn cứ luật định hoặc cam kết riêng","Công ty mẹ luôn chịu mọi khoản nợ của công ty con","Công ty mẹ chỉ chịu nợ nếu công ty con là công ty cổ phần","Công ty mẹ phải trả nợ vì sở hữu trên 50% vốn"],"a":0,"e":"Nội dung phù hợp là “Không tự động phát sinh trách nhiệm; phải có căn cứ luật định hoặc cam kết riêng”. Phương án nhiễu “Công ty mẹ luôn chịu mọi khoản nợ của công ty con” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 194–197 Luật Doanh nghiệp; BLDS 2015.","lv":"VD","b":"Điều 194–197 Luật Doanh nghiệp; BLDS 2015"},{"id":"LDN614","g":6,"q":"Doanh nghiệp có vốn nhà nước cần quyết định đầu tư bổ sung vốn. Nguồn pháp lý nào cần được đối chiếu trực tiếp?","o":["Chỉ Luật Hộ tịch 2014","Chỉ Luật Thương mại 2005","VBHN 60/VBHN-VPQH và Nghị định 366/2025/NĐ-CP","Chỉ Điều lệ công ty mà không cần luật chuyên ngành"],"a":2,"e":"Nội dung phù hợp là “VBHN 60/VBHN-VPQH và Nghị định 366/2025/NĐ-CP”. Phương án nhiễu “Chỉ Luật Hộ tịch 2014” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP.","lv":"VD","b":"VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP"},{"id":"LDN615","g":6,"q":"Điểm khác biệt giữa quyền đại diện chủ sở hữu nhà nước và quyền quản lý doanh nghiệp là gì?","o":["Hai quyền luôn do một cá nhân thực hiện","Quyền đại diện chủ sở hữu thực hiện quyền của chủ sở hữu vốn; cơ quan quản trị điều hành doanh nghiệp theo luật và Điều lệ","Quyền đại diện chủ sở hữu thay thế mọi cơ quan quản trị","Quyền quản lý doanh nghiệp chỉ thuộc cơ quan đăng ký kinh doanh"],"a":1,"e":"Nội dung phù hợp là “Quyền đại diện chủ sở hữu thực hiện quyền của chủ sở hữu vốn; cơ quan quản trị điều hành doanh nghiệp theo luật và Điều lệ”. Phương án nhiễu “Hai quyền luôn do một cá nhân thực hiện” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Luật 68/2025/QH15; VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP.","lv":"TH","b":"Luật 68/2025/QH15; VBHN 60/VBHN-VPQH; Nghị định 366/2025/NĐ-CP"},{"id":"TH7.01.1","g":7,"q":"Hình thức tổ chức lại được mô tả là gì?","o":["Chia doanh nghiệp","Tách doanh nghiệp","Sáp nhập doanh nghiệp","Chuyển đổi doanh nghiệp tư nhân"],"a":2,"e":"Một hoặc một số công ty chuyển toàn bộ tài sản, quyền, nghĩa vụ sang công ty nhận sáp nhập và chấm dứt tồn tại là sáp nhập.","b":"Điều 201 Luật Doanh nghiệp","cid":"TH7.01"},{"id":"TH7.01.2","g":7,"q":"Công ty nhận sáp nhập kế thừa nghĩa vụ nào?","o":["Kế thừa quyền, nghĩa vụ và lợi ích hợp pháp của công ty bị sáp nhập theo luật","Chỉ kế thừa tài sản có lợi nhuận","Chỉ kế thừa nghĩa vụ với người lao động","Không kế thừa khoản nợ phát sinh trước sáp nhập"],"a":0,"e":"Công ty nhận sáp nhập kế thừa quyền và nghĩa vụ của công ty bị sáp nhập theo quy định pháp luật và hợp đồng sáp nhập.","b":"Điều 201 Luật Doanh nghiệp","cid":"TH7.01"},{"id":"TH7.01.3","g":7,"q":"Phương án sáp nhập cần xử lý thêm vấn đề nào đối với 35 người lao động?","o":["Chỉ cần thay đổi tên người sử dụng lao động trên bảng lương","Không cần xử lý vì hợp đồng lao động tự chấm dứt","Chỉ cần thông báo cho cơ quan đăng ký doanh nghiệp","Phương án sử dụng lao động và quyền, lợi ích hợp pháp của người lao động"],"a":3,"e":"Tổ chức lại doanh nghiệp phải gắn với phương án sử dụng lao động và bảo đảm quyền lợi người lao động theo pháp luật.","b":"Điều 201 Luật Doanh nghiệp; Bộ luật Lao động 2019","cid":"TH7.01"},{"id":"TH7.01.4","g":7,"q":"Việc chưa thông báo cho chủ nợ và chưa lập phương án sử dụng lao động có thể dẫn đến vấn đề gì?","o":["Không ảnh hưởng nếu thành viên đã biểu quyết","Chưa bảo đảm đầy đủ trình tự, thủ tục tổ chức lại theo luật","Tự động làm công ty nhận sáp nhập mất tư cách pháp nhân","Chỉ ảnh hưởng đến nghĩa vụ kê khai thuế"],"a":1,"e":"Tổ chức lại phải bảo đảm quyền của chủ nợ và người lao động; nghị quyết nội bộ không thay thế các nghĩa vụ thủ tục.","b":"Điều 201 Luật Doanh nghiệp","cid":"TH7.01"},{"id":"TH7.02.1","g":7,"q":"Công ty có đủ điều kiện giải thể tại thời điểm này không?","o":["Có, vì Đại hội đồng cổ đông đã thông qua nghị quyết","Chưa; còn nghĩa vụ nợ và đang trong quá trình giải quyết tranh chấp","Có, nếu công ty không còn doanh thu","Có, nếu Hội đồng quản trị cam kết thanh toán sau"],"a":1,"e":"Điều 207 yêu cầu doanh nghiệp thanh toán hết nợ, nghĩa vụ tài sản và không đang trong quá trình giải quyết tranh chấp tại Tòa án hoặc Trọng tài.","b":"Khoản 2 Điều 207 Luật Doanh nghiệp","cid":"TH7.02"},{"id":"TH7.02.2","g":7,"q":"Khoản nợ lương của người lao động có phải được xử lý trước khi giải thể không?","o":["Không, vì người lao động không phải chủ nợ","Chỉ thanh toán nếu người lao động khởi kiện","Có thể bỏ qua nếu đã có nghị quyết giải thể","Có; đây là nghĩa vụ tài sản phải được thanh toán theo thứ tự luật định"],"a":3,"e":"Nghĩa vụ tiền lương và quyền lợi người lao động là nghĩa vụ phải xử lý khi giải thể; không thể bị loại trừ bởi nghị quyết nội bộ.","b":"Điều 208, Điều 209 Luật Doanh nghiệp; Bộ luật Lao động 2019","cid":"TH7.02"},{"id":"TH7.02.3","g":7,"q":"Cam kết trả nợ sau khi hoàn tất giải thể có thay thế điều kiện thanh toán hết nợ không?","o":["Không; doanh nghiệp phải bảo đảm thanh toán hết nghĩa vụ trước khi hoàn tất giải thể","Có, nếu cam kết được công chứng","Có, nếu chủ nợ không phản đối trong 24 giờ","Có, nếu doanh nghiệp đã đóng mã số thuế"],"a":0,"e":"Điều kiện giải thể đòi hỏi khả năng thanh toán hết nợ và nghĩa vụ tài sản; không thể giải thể trước rồi mới xử lý nợ.","b":"Điều 207–209 Luật Doanh nghiệp","cid":"TH7.02"},{"id":"TH7.02.4","g":7,"q":"Hướng xử lý phù hợp nếu công ty thực sự không có khả năng thanh toán là gì?","o":["Tiếp tục giải thể bằng cam kết đơn phương","Chuyển toàn bộ nợ cho người lao động","Xem xét thủ tục phục hồi hoặc phá sản theo Luật 142/2025/QH15","Tự xóa khoản nợ trong sổ kế toán"],"a":2,"e":"Nếu mất khả năng thanh toán, phải xem xét thủ tục phục hồi hoặc phá sản; không dùng giải thể để né nghĩa vụ.","b":"Điều 5, Điều 24, Điều 38 Luật 142/2025/QH15","cid":"TH7.02"},{"id":"TH7.03.1","g":7,"q":"Tại ngày 15/07/2026, công ty thuộc tình trạng nào theo Điều 5 Luật 142?","o":["Đã mất khả năng thanh toán vì quá 03 tháng","Đã bị tuyên bố phá sản","Không thuộc tình trạng nào vì vẫn còn nhà xưởng","Có nguy cơ mất khả năng thanh toán vì khoản nợ đến hạn chưa quá 06 tháng"],"a":3,"e":"Từ ngày 01/03 đến 15/07 chưa quá 06 tháng; Điều 5 phân biệt nguy cơ mất khả năng thanh toán với tình trạng mất khả năng thanh toán.","b":"Khoản 1, khoản 2 Điều 5 Luật 142/2025/QH15","cid":"TH7.03"},{"id":"TH7.03.2","g":7,"q":"Hội đồng thành viên có thể xem xét cơ chế nào để tái cơ cấu sớm?","o":["Chỉ có thể nộp đơn giải thể","Yêu cầu áp dụng thủ tục phục hồi theo Luật 142/2025/QH15","Chỉ được chờ chủ nợ nộp đơn phá sản","Tự ý xóa nợ mà không cần thỏa thuận"],"a":1,"e":"Luật 142 ưu tiên thủ tục phục hồi và cho phép xem xét khi doanh nghiệp có nguy cơ mất khả năng thanh toán.","b":"Điều 3, Điều 24–28 Luật 142/2025/QH15","cid":"TH7.03"},{"id":"TH7.03.3","g":7,"q":"Thẩm quyền giải quyết sơ thẩm yêu cầu phục hồi, phá sản thuộc Tòa án nào?","o":["Tòa án nhân dân cấp huyện","Tòa án nhân dân cấp cao","Tòa án nhân dân khu vực có thẩm quyền theo lãnh thổ nơi doanh nghiệp đặt trụ sở chính","Ủy ban nhân dân cấp tỉnh"],"a":2,"e":"Điều 6 Luật 142 quy định Tòa án nhân dân khu vực giải quyết sơ thẩm theo lãnh thổ; không sử dụng mô hình Tòa án cấp huyện hoặc cấp cao cũ.","b":"Điều 6 Luật 142/2025/QH15","cid":"TH7.03"},{"id":"TH7.03.4","g":7,"q":"Nếu đến sau ngày 01/09/2026 công ty vẫn không thanh toán khoản nợ đến hạn ngày 01/03/2026, dấu hiệu pháp lý nào cần được xem xét?","o":["Mất khả năng thanh toán theo mốc 06 tháng nếu nghĩa vụ vẫn chưa được thực hiện","Chỉ là nguy cơ mất khả năng thanh toán trong mọi trường hợp","Tự động được giải thể","Đương nhiên được miễn nghĩa vụ trả nợ"],"a":0,"e":"Sau thời hạn 06 tháng kể từ ngày đến hạn mà không thực hiện nghĩa vụ thanh toán, doanh nghiệp đáp ứng tiêu chí mất khả năng thanh toán theo Điều 5.","b":"Khoản 2 Điều 5 Luật 142/2025/QH15","cid":"TH7.03"},{"id":"LDN701","g":7,"q":"Luật Doanh nghiệp quy định những hình thức tổ chức lại công ty nào?","o":["Giải thể, phá sản, tạm ngừng và chấm dứt mã số thuế","Thế chấp, cầm cố, bảo lãnh và đặt cọc","Chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình","Đăng ký, kê khai, kiểm toán và quyết toán thuế"],"a":2,"e":"Các hình thức tổ chức lại được quy định tại Chương IX Luật Doanh nghiệp; giải thể và phá sản là cơ chế chấm dứt khác.","b":"Điều 198–205 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN702","g":7,"q":"Điều kiện cơ bản để doanh nghiệp được giải thể là gì?","o":["Bảo đảm thanh toán hết các khoản nợ và nghĩa vụ tài sản khác","Có lợi nhuận trong năm tài chính gần nhất","Có sự đồng ý của tất cả người lao động","Có ít nhất hai chi nhánh đang hoạt động"],"a":0,"e":"Doanh nghiệp chỉ được giải thể khi bảo đảm thanh toán hết nợ và nghĩa vụ tài sản khác, đồng thời không đang giải quyết tranh chấp tại Tòa án hoặc Trọng tài.","b":"Khoản 2 Điều 207 Luật Doanh nghiệp","lv":"NB"},{"id":"LDN703","g":7,"q":"Luật Phục hồi, phá sản số 142/2025/QH15 có hiệu lực từ ngày nào?","o":["01/01/2026","01/07/2025","01/07/2026","01/03/2026"],"a":3,"e":"Luật 142/2025/QH15 có hiệu lực từ 01/03/2026 và thay thế Luật Phá sản 2014 theo quy định chuyển tiếp.","b":"Điều 87 Luật 142/2025/QH15","lv":"NB"},{"id":"LDN704","g":7,"q":"Theo Luật 142/2025/QH15, doanh nghiệp mất khả năng thanh toán là doanh nghiệp không thực hiện nghĩa vụ thanh toán sau thời hạn nào?","o":["03 tháng kể từ ngày đến hạn","06 tháng kể từ ngày đến hạn","01 tháng kể từ ngày đến hạn","12 tháng kể từ ngày đến hạn"],"a":1,"e":"Điều 5 Luật 142/2025/QH15 thay đổi mốc xác định mất khả năng thanh toán thành 06 tháng; không dùng mốc 03 tháng của Luật Phá sản 2014.","b":"Khoản 2 Điều 5 Luật 142/2025/QH15","lv":"NB"},{"id":"LDN705","g":7,"q":"Cơ quan có thẩm quyền giải quyết sơ thẩm vụ việc phục hồi, phá sản theo Luật 142/2025/QH15 là cơ quan nào?","o":["Tòa án nhân dân cấp huyện","Tòa án nhân dân khu vực","Tòa án nhân dân cấp cao","Ủy ban nhân dân cấp tỉnh"],"a":1,"e":"Luật 142/2025/QH15 quy định thẩm quyền theo lãnh thổ của Tòa án nhân dân khu vực; không dùng mô hình Tòa án cấp huyện hoặc cấp cao cũ.","b":"Điều 6 Luật 142/2025/QH15","lv":"NB"},{"id":"LDN706","g":7,"q":"Điểm khác biệt căn bản giữa giải thể và phá sản là gì?","o":["Giải thể luôn do Tòa án tuyên; phá sản do chủ sở hữu quyết định","Hai thủ tục đều chỉ dựa trên nghị quyết của thành viên","Phá sản chỉ áp dụng khi doanh nghiệp có lợi nhuận","Giải thể đòi hỏi bảo đảm thanh toán hết nợ; phá sản gắn với mất khả năng thanh toán và quyết định của Tòa án"],"a":3,"e":"Nội dung phù hợp là “Giải thể đòi hỏi bảo đảm thanh toán hết nợ; phá sản gắn với mất khả năng thanh toán và quyết định của Tòa án”. Phương án nhiễu “Giải thể luôn do Tòa án tuyên; phá sản do chủ sở hữu quyết định” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật 142/2025/QH15.","lv":"TH","b":"Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật 142/2025/QH15"},{"id":"LDN707","g":7,"q":"Trong giao dịch sáp nhập, công ty bị sáp nhập có số phận pháp lý như thế nào?","o":["Chấm dứt tồn tại; công ty nhận sáp nhập kế thừa quyền và nghĩa vụ theo luật","Tiếp tục tồn tại độc lập như trước","Trở thành chi nhánh của cơ quan đăng ký doanh nghiệp","Tự động chuyển thành doanh nghiệp tư nhân"],"a":0,"e":"Nội dung phù hợp là “Chấm dứt tồn tại; công ty nhận sáp nhập kế thừa quyền và nghĩa vụ theo luật”. Phương án nhiễu “Tiếp tục tồn tại độc lập như trước” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 201 Luật Doanh nghiệp.","lv":"TH","b":"Điều 201 Luật Doanh nghiệp"},{"id":"LDN708","g":7,"q":"Luật 142/2025/QH15 ưu tiên thủ tục nào khi doanh nghiệp gặp khó khăn thanh toán?","o":["Thủ tục giải thể bắt buộc","Thủ tục xử phạt hành chính","Thủ tục phục hồi nhằm tái cơ cấu và khôi phục khả năng thanh toán","Thủ tục chuyển đổi thành công ty cổ phần"],"a":2,"e":"Nội dung phù hợp là “Thủ tục phục hồi nhằm tái cơ cấu và khôi phục khả năng thanh toán”. Phương án nhiễu “Thủ tục giải thể bắt buộc” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 3 Luật 142/2025/QH15.","lv":"TH","b":"Điều 3 Luật 142/2025/QH15"},{"id":"LDN709","g":7,"q":"Doanh nghiệp có nguy cơ mất khả năng thanh toán theo Luật 142/2025/QH15 được nhận diện như thế nào?","o":["Không trả được nợ trong 03 tháng sau ngày đến hạn","Có vốn chủ sở hữu âm trong hai năm liên tiếp","Có doanh thu giảm trong ba quý liên tục","Không thanh toán được khoản nợ sẽ đến hạn trong 06 tháng hoặc khoản nợ đã đến hạn nhưng chưa quá 06 tháng"],"a":3,"e":"Nội dung phù hợp là “Không thanh toán được khoản nợ sẽ đến hạn trong 06 tháng hoặc khoản nợ đã đến hạn nhưng chưa quá 06 tháng”. Phương án nhiễu “Không trả được nợ trong 03 tháng sau ngày đến hạn” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 1 Điều 5 Luật 142/2025/QH15.","lv":"TH","b":"Khoản 1 Điều 5 Luật 142/2025/QH15"},{"id":"LDN710","g":7,"q":"Khi Tòa án tuyên bố doanh nghiệp phá sản, việc phân chia tài sản được thực hiện theo nguyên tắc nào?","o":["Theo thứ tự chủ nợ nộp đơn trước","Theo thứ tự ưu tiên và quy tắc phân chia tài sản của Luật Phục hồi, phá sản","Theo yêu cầu riêng của chủ doanh nghiệp","Chia đều cho mọi chủ nợ không phân biệt loại nợ"],"a":1,"e":"Nội dung phù hợp là “Theo thứ tự ưu tiên và quy tắc phân chia tài sản của Luật Phục hồi, phá sản”. Phương án nhiễu “Theo thứ tự chủ nợ nộp đơn trước” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 46 Luật 142/2025/QH15.","lv":"TH","b":"Điều 46 Luật 142/2025/QH15"},{"id":"LDN711","g":7,"q":"Công ty A có khoản nợ đến hạn ngày 01/04/2026 nhưng không thanh toán đến ngày 15/09/2026. Theo mốc luật định, công ty đã mất khả năng thanh toán chưa?","o":["Đã mất khả năng thanh toán vì quá 03 tháng","Đã phá sản ngay khi không trả nợ ngày đầu tiên","Chưa đủ 06 tháng kể từ ngày đến hạn","Không thể xem xét vì khoản nợ chưa được Tòa án xác nhận"],"a":2,"e":"Nội dung phù hợp là “Chưa đủ 06 tháng kể từ ngày đến hạn”. Phương án nhiễu “Đã mất khả năng thanh toán vì quá 03 tháng” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Khoản 2 Điều 5 Luật 142/2025/QH15.","lv":"VD","b":"Khoản 2 Điều 5 Luật 142/2025/QH15"},{"id":"LDN712","g":7,"q":"Công ty B không trả khoản nợ đến hạn ngày 01/02/2026 đến hết ngày 05/09/2026. Chủ thể có thể cân nhắc thủ tục nào?","o":["Thủ tục phục hồi hoặc thủ tục phá sản tùy điều kiện và quyền nộp đơn","Chỉ được giải thể tự nguyện","Chỉ được đăng ký tạm ngừng kinh doanh","Bắt buộc chuyển đổi thành công ty hợp danh"],"a":0,"e":"Nội dung phù hợp là “Thủ tục phục hồi hoặc thủ tục phá sản tùy điều kiện và quyền nộp đơn”. Phương án nhiễu “Chỉ được giải thể tự nguyện” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 5, Điều 24, Điều 38 Luật 142/2025/QH15.","lv":"VD","b":"Điều 5, Điều 24, Điều 38 Luật 142/2025/QH15"},{"id":"LDN713","g":7,"q":"Công ty còn nợ lương và bảo hiểm chưa thanh toán nhưng muốn giải thể. Hướng xử lý nào phù hợp?","o":["Chưa đủ điều kiện giải thể nếu chưa thanh toán hết nghĩa vụ tài sản","Vẫn giải thể nếu chủ sở hữu cam kết trả sau","Được giải thể nếu đã khóa mã số thuế","Được giải thể nếu người lao động không phản đối"],"a":0,"e":"Nội dung phù hợp là “Chưa đủ điều kiện giải thể nếu chưa thanh toán hết nghĩa vụ tài sản”. Phương án nhiễu “Vẫn giải thể nếu chủ sở hữu cam kết trả sau” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 207–209 Luật Doanh nghiệp.","lv":"VD","b":"Điều 207–209 Luật Doanh nghiệp"},{"id":"LDN714","g":7,"q":"Doanh nghiệp có nguy cơ mất khả năng thanh toán và muốn tái cơ cấu sớm. Cơ chế nào phù hợp nhất?","o":["Chỉ thực hiện thủ tục giải thể","Chờ chủ nợ nộp đơn phá sản mới được xử lý","Nộp yêu cầu áp dụng thủ tục phục hồi theo Luật 142/2025/QH15","Tự xóa các khoản nợ đã đến hạn"],"a":2,"e":"Nội dung phù hợp là “Nộp yêu cầu áp dụng thủ tục phục hồi theo Luật 142/2025/QH15”. Phương án nhiễu “Chỉ thực hiện thủ tục giải thể” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 5, Điều 24–28 Luật 142/2025/QH15.","lv":"VD","b":"Điều 5, Điều 24–28 Luật 142/2025/QH15"},{"id":"LDN715","g":7,"q":"Khi doanh nghiệp bị tuyên bố phá sản, chủ nợ được thanh toán theo căn cứ nào?","o":["Thứ tự chủ nợ nộp đơn yêu cầu trước","Thứ tự ưu tiên thanh toán và nguyên tắc phân chia tài sản do Luật 142 quy định","Thỏa thuận riêng giữa chủ doanh nghiệp và một chủ nợ","Tỷ lệ sở hữu vốn điều lệ của chủ nợ"],"a":1,"e":"Nội dung phù hợp là “Thứ tự ưu tiên thanh toán và nguyên tắc phân chia tài sản do Luật 142 quy định”. Phương án nhiễu “Thứ tự chủ nợ nộp đơn yêu cầu trước” không đúng vì nhầm lẫn chủ thể, điều kiện hoặc hệ quả pháp lý; cần áp dụng căn cứ Điều 46 Luật 142/2025/QH15.","lv":"TH","b":"Điều 46 Luật 142/2025/QH15"},{"id":"LDN516","g":5,"lv":"VD","q":"Theo tiêu chí được sửa đổi tại Nghị định 296/2026/NĐ-CP, chủ sở hữu hưởng lợi của công ty hợp danh được xác định thế nào?","o":["Chỉ thành viên hợp danh sở hữu từ 25% vốn điều lệ trở lên","Chỉ thành viên góp vốn có quyền chi phối hoạt động kinh doanh","Chỉ người đại diện theo pháp luật của công ty","Tất cả thành viên hợp danh, không phụ thuộc tỷ lệ vốn góp hoặc quyền biểu quyết"],"a":3,"e":"Quy định sửa đổi xác định tất cả thành viên hợp danh là chủ sở hữu hưởng lợi; không áp dụng ngưỡng 25% vốn góp đối với nhóm chủ thể này.","b":"Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Điều 3 Nghị định 296/2026/NĐ-CP"}],"th":[{"name":"Chương 1 · Tình huống 1","items":[{"cid":"TH1.01","title":"Cá nhân kinh doanh và tư cách thương nhân","text":"Từ tháng 01/2025, anh Minh tại thành phố Bắc Ninh thường xuyên mua thiết bị điện từ nhiều nhà phân phối để bán lại qua cửa hàng và nền tảng trực tuyến. Anh hoạt động độc lập, có doanh thu đều đặn nhưng chưa đăng ký hộ kinh doanh hoặc doanh nghiệp. Tháng 10/2026, anh ký hợp đồng mua 300 bộ thiết bị của Công ty Ánh Dương để bán lại; sau khi nhận hàng, anh không thanh toán đủ và cho rằng mình không phải thương nhân vì chưa đăng ký. Anh dự định mở rộng hoạt động, thuê thêm lao động và muốn tách bạch tài sản cá nhân với tài sản kinh doanh.","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]}]},{"name":"Chương 1 · Tình huống 2","items":[{"cid":"TH1.02","title":"Người có quyền thành lập và quản lý doanh nghiệp","text":"Bà Hạnh là công chức đang công tác tại một cơ quan chuyên môn thuộc UBND cấp tỉnh. Bà dự định cùng người em thành lập Công ty TNHH Minh Hà, đứng tên thành viên góp vốn và trực tiếp giữ Giám đốc. Người em của bà là cá nhân đủ năng lực hành vi dân sự, không thuộc trường hợp bị cấm. Bà Hạnh cho rằng mình được quyền tham gia vì chỉ góp 20% vốn và không sử dụng tài sản công. Dự kiến hoạt động của công ty thuộc lĩnh vực tư vấn quản lý thông thường, không thuộc lĩnh vực khoa học, công nghệ, đổi mới sáng tạo hoặc chuyển đổi số.","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]}]},{"name":"Chương 1 · Tình huống 3","items":[{"cid":"TH1.03","title":"Chủ sở hữu hưởng lợi và kê khai thông tin doanh nghiệp","text":"Công ty TNHH Sao Bắc được thành lập năm 2023. Trên hồ sơ đăng ký, ông Nam đứng tên sở hữu 60% vốn điều lệ, bà Hoa sở hữu 40%. Tuy nhiên, theo thỏa thuận nội bộ và việc kiểm soát thực tế, ông Phúc là người bỏ vốn thực tế, quyết định các vấn đề trọng yếu và có quyền chi phối hoạt động công ty; ông Nam chỉ đứng tên hộ. Tháng 10/2026, công ty thực hiện thủ tục thay đổi địa chỉ trụ sở chính. Người đại diện theo pháp luật cho rằng doanh nghiệp thành lập trước ngày 01/07/2025 nên không phải cập nhật thông tin chủ sở hữu hưởng lợi.","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]},{"name":"Chương 2 · Đăng ký thành lập và chủ thể bị hạn chế quyền","items":[{"cid":"TH2.01","title":"Đăng ký thành lập và chủ thể bị hạn chế quyền","text":"Ngày 12/08/2026, tại Hà Nội, bà Lan và ông Phúc dự kiến thành lập Công ty TNHH Minh Phát với vốn điều lệ 4 tỷ đồng. Bà Lan hiện là công chức tại một cơ quan hành chính; ông Phúc là cá nhân kinh doanh tự do. Hai người dự kiến để bà Lan đứng tên thành viên góp vốn 40%, còn ông Phúc làm Giám đốc và người đại diện theo pháp luật. Hồ sơ đã chuẩn bị Điều lệ, giấy đề nghị đăng ký và danh sách thành viên nhưng chưa kê khai thông tin chủ sở hữu hưởng lợi. Họ cho rằng chỉ cần nộp hồ sơ tại cơ quan đăng ký kinh doanh cấp xã vì công ty đặt trụ sở tại phường.","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]}]},{"name":"Chương 2 · Góp vốn bằng tài sản và kê khai vốn điều lệ","items":[{"cid":"TH2.02","title":"Góp vốn bằng tài sản và kê khai vốn điều lệ","text":"Ngày 05/01/2026, Công ty TNHH An Bình được cấp Giấy chứng nhận đăng ký doanh nghiệp tại thành phố Hải Phòng với vốn điều lệ 6 tỷ đồng. Bà Mai cam kết góp 3 tỷ đồng bằng tiền, ông Dũng góp 2 tỷ đồng bằng quyền sử dụng một thửa đất, còn bà Hoa góp 1 tỷ đồng bằng máy móc. Sau 90 ngày, bà Mai mới chuyển 1,5 tỷ đồng; quyền sử dụng đất của ông Dũng chưa hoàn tất thủ tục chuyển cho công ty; máy móc của bà Hoa được định giá cao hơn giá thị trường khoảng 300 triệu đồng. Các thành viên muốn giữ nguyên vốn điều lệ đã đăng ký để thuận tiện vay ngân hàng.","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]}]},{"name":"Chương 2 · Chủ sở hữu hưởng lợi và thay đổi thông tin","items":[{"cid":"TH2.03","title":"Chủ sở hữu hưởng lợi và thay đổi thông tin","text":"Ngày 20/09/2026, Công ty cổ phần Sao Việt tại tỉnh Bắc Ninh thông báo thay đổi trụ sở và người đại diện theo pháp luật. Bà Hạnh đứng tên sở hữu trực tiếp 10% cổ phần có quyền biểu quyết; phần còn lại được nắm giữ thông qua hai công ty trung gian do bà kiểm soát, tổng tỷ lệ sở hữu gián tiếp là 30%. Công ty cho rằng chỉ cần kê khai cổ đông đứng tên trực tiếp, không cần thông tin về bà Hạnh vì bà không xuất hiện trong sổ đăng ký cổ đông. Hồ sơ thay đổi được nộp trực tuyến nhưng người nộp hồ sơ không thực hiện ký số hoặc xác thực.","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]}]},{"name":"Chương 3 · Không góp đủ vốn và thay đổi tư cách thành viên","items":[{"cid":"TH3.01","title":"Không góp đủ vốn và thay đổi tư cách thành viên","text":"Ngày 10/02/2026, Công ty TNHH Bình Minh tại Đà Nẵng được cấp đăng ký doanh nghiệp với ba thành viên. Ông Khải cam kết góp 4 tỷ đồng, bà Ngọc góp 2 tỷ đồng và ông Sơn góp 1 tỷ đồng. Hết thời hạn góp vốn, ông Khải mới góp 2 tỷ đồng, bà Ngọc góp đủ, ông Sơn chưa góp đồng nào. Hội đồng thành viên vẫn biểu quyết cho ông Khải tham gia biểu quyết theo tỷ lệ 4 tỷ đồng và dự định giữ nguyên vốn điều lệ 7 tỷ đồng để ký hợp đồng tín dụng. Một chủ nợ yêu cầu công ty cung cấp thông tin về vốn thực góp.","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]}]},{"name":"Chương 3 · Chuyển nhượng phần vốn góp cho người ngoài","items":[{"cid":"TH3.02","title":"Chuyển nhượng phần vốn góp cho người ngoài","text":"Ngày 15/06/2026, ông Long là thành viên sở hữu 35% vốn tại Công ty TNHH Đại Phát ở tỉnh Quảng Ninh. Ông ký hợp đồng chuyển nhượng toàn bộ phần vốn góp cho bà Vân, người chưa phải thành viên công ty, với giá 3,5 tỷ đồng. Trước khi ký, ông Long không gửi thông báo chào bán cho các thành viên còn lại. Sau khi biết việc chuyển nhượng, hai thành viên khác phản đối và cho rằng họ có quyền ưu tiên mua phần vốn góp. Công ty chưa cập nhật sổ đăng ký thành viên và chưa thực hiện thủ tục đăng ký thay đổi.","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4"]}]},{"name":"Chương 3 · Chủ sở hữu công ty TNHH một thành viên thay đổi","items":[{"cid":"TH3.03","title":"Chủ sở hữu công ty TNHH một thành viên thay đổi","text":"Ngày 02/08/2026, Công ty TNHH một thành viên Hòa Phát tại tỉnh Hưng Yên do Công ty cổ phần Minh Thành làm chủ sở hữu. Chủ sở hữu quyết định chuyển nhượng toàn bộ vốn điều lệ cho bà Phương là cá nhân. Điều lệ hiện hành quy định cơ cấu quản lý gồm Hội đồng thành viên và Giám đốc. Sau khi nhận chuyển nhượng, bà Phương muốn tiếp tục sử dụng nguyên cơ cấu quản lý cũ và yêu cầu kế toán chuyển tiền của công ty vào tài khoản cá nhân để thuận tiện thanh toán. Công ty chưa cập nhật đăng ký doanh nghiệp.","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]}]},{"name":"Chương 4 · Chuyển nhượng cổ phần của cổ đông sáng lập","items":[{"cid":"TH4.01","title":"Chuyển nhượng cổ phần của cổ đông sáng lập","text":"Ngày 10/03/2026, Công ty cổ phần Sao Mai tại thành phố Huế được thành lập với bốn cổ đông sáng lập. Ông Tùng sở hữu 30% cổ phần phổ thông. Ngày 20/05/2026, ông ký hợp đồng bán toàn bộ cổ phần cho bà Hà, người không phải cổ đông sáng lập. Điều lệ không có quy định khác có lợi hơn cho việc chuyển nhượng. Ông Tùng cho rằng cổ phần là tài sản nên được tự do chuyển nhượng; Hội đồng quản trị đồng ý ghi nhận giao dịch mà không đưa ra Đại hội đồng cổ đông.","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]}]},{"name":"Chương 4 · Điều kiện trả cổ tức và khả năng thanh toán","items":[{"cid":"TH4.02","title":"Điều kiện trả cổ tức và khả năng thanh toán","text":"Ngày 30/06/2026, Đại hội đồng cổ đông Công ty cổ phần Phú An tại tỉnh Lâm Đồng thông qua kế hoạch chia cổ tức bằng tiền mặt 20% mệnh giá. Báo cáo tài chính cho thấy công ty có lợi nhuận sau thuế chưa phân phối. Tuy nhiên, công ty đang có khoản nợ vay 12 tỷ đồng đến hạn ngày 15/07/2026 và dự kiến sau khi trả cổ tức sẽ không còn đủ tiền thanh toán khoản nợ này. Hội đồng quản trị vẫn muốn thực hiện chi trả ngay để đáp ứng mong muốn của nhóm cổ đông lớn.","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4"]}]},{"name":"Chương 4 · Giao dịch với người có liên quan","items":[{"cid":"TH4.03","title":"Giao dịch với người có liên quan","text":"Ngày 12/08/2026, Công ty cổ phần Đại Nam tại thành phố Cần Thơ dự kiến ký hợp đồng mua thiết bị trị giá 18 tỷ đồng với Công ty Hoàng Gia. Bà Liên là thành viên Hội đồng quản trị Đại Nam đồng thời sở hữu 60% vốn của Hoàng Gia. Bà Liên tham gia cuộc họp Hội đồng quản trị và biểu quyết thông qua hợp đồng. Các thành viên khác cho rằng giá mua thấp hơn giá thị trường nên không cần thực hiện thủ tục về giao dịch với người có liên quan.","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]}]},{"name":"Chương 5 · Trách nhiệm của thành viên hợp danh đối với chủ nợ","items":[{"cid":"TH5.01","title":"Trách nhiệm của thành viên hợp danh đối với chủ nợ","text":"Ngày 03/04/2026, Công ty hợp danh Luật Việt tại Hà Nội có hai thành viên hợp danh là ông Bình và bà Hòa, cùng một thành viên góp vốn là Công ty Minh Phúc. Công ty vay ngân hàng 5 tỷ đồng để mở rộng hoạt động nhưng đến hạn không thanh toán. Ngân hàng yêu cầu ông Bình và bà Hòa thực hiện nghĩa vụ bằng tài sản riêng; đồng thời yêu cầu Công ty Minh Phúc thanh toán toàn bộ khoản vay vì đã góp vốn vào công ty. Công ty hợp danh vẫn đang hoạt động và có một phần tài sản nhưng không đủ trả nợ.","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]}]},{"name":"Chương 5 · Chủ doanh nghiệp tư nhân và nghĩa vụ tài sản","items":[{"cid":"TH5.02","title":"Chủ doanh nghiệp tư nhân và nghĩa vụ tài sản","text":"Ngày 15/05/2026, ông Quân là chủ Doanh nghiệp tư nhân Q tại tỉnh Nghệ An. Doanh nghiệp vay Công ty Tài chính M 2 tỷ đồng để mua máy móc, nhưng hoạt động kinh doanh thua lỗ và tài sản doanh nghiệp chỉ còn 700 triệu đồng. Công ty tài chính yêu cầu ông Quân thanh toán phần nợ còn thiếu. Ông Quân cho rằng doanh nghiệp có mã số doanh nghiệp, con dấu và tài khoản ngân hàng riêng nên chủ nợ chỉ được yêu cầu thanh toán bằng tài sản đứng tên doanh nghiệp. Ông cũng đang cân nhắc thuê một Giám đốc điều hành.","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4"]}]},{"name":"Chương 5 · Thành viên hợp danh kinh doanh cạnh tranh","items":[{"cid":"TH5.03","title":"Thành viên hợp danh kinh doanh cạnh tranh","text":"Ngày 01/07/2026, Công ty hợp danh Thiên Hà tại tỉnh Khánh Hòa hoạt động trong lĩnh vực tư vấn và cung ứng dịch vụ thương mại. Ông Hải là thành viên hợp danh, đồng thời tự mình thành lập một cơ sở kinh doanh cùng ngành nghề, sử dụng danh sách khách hàng và thông tin giá dịch vụ mà ông tiếp cận được trong quá trình làm việc tại công ty. Ông không thông báo cho các thành viên khác và giữ lại toàn bộ lợi nhuận từ các hợp đồng mới. Các thành viên còn lại yêu cầu ông chấm dứt hoạt động và hoàn trả khoản lợi ích thu được.","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4"]}]},{"name":"Chương 6 · Giao dịch có xung đột lợi ích trong công ty cổ phần","items":[{"cid":"TH6.01","title":"Giao dịch có xung đột lợi ích trong công ty cổ phần","text":"Ngày 18/08/2026, Công ty cổ phần Đông Á tại tỉnh Đồng Nai dự kiến mua dây chuyền sản xuất trị giá 25 tỷ đồng của Công ty Nam Việt. Ông Sơn là thành viên Hội đồng quản trị Đông Á và đồng thời là người sở hữu 55% vốn của Nam Việt. Ông Sơn không thông báo lợi ích liên quan, vẫn tham gia thảo luận và bỏ phiếu thông qua hợp đồng. Sau khi ký, một nhóm cổ đông phát hiện giá mua cao hơn báo giá của ba nhà cung cấp khác và yêu cầu kiểm tra trách nhiệm của người quản lý.","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]}]},{"name":"Chương 6 · Doanh nghiệp nhà nước và quyền đại diện chủ sở hữu","items":[{"cid":"TH6.02","title":"Doanh nghiệp nhà nước và quyền đại diện chủ sở hữu","text":"Ngày 05/09/2026, Công ty cổ phần Hạ tầng Bắc Việt có vốn điều lệ 1.000 tỷ đồng, trong đó Nhà nước nắm giữ 620 tỷ đồng vốn điều lệ. Công ty dự kiến đầu tư 200 tỷ đồng vào một công ty con và bổ sung vốn cho dự án mới. Người đại diện phần vốn nhà nước cho rằng chỉ cần xin ý kiến Hội đồng quản trị của công ty mẹ; bộ phận pháp chế lại đề nghị rà soát quyền, trách nhiệm của cơ quan đại diện chủ sở hữu và các quy định về đầu tư, quản lý vốn nhà nước hiện hành.","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4"]}]},{"name":"Chương 6 · Công ty mẹ, công ty con và trách nhiệm quản trị","items":[{"cid":"TH6.03","title":"Công ty mẹ, công ty con và trách nhiệm quản trị","text":"Ngày 22/07/2026, Công ty cổ phần Thành Công sở hữu 75% vốn điều lệ Công ty TNHH Đại Phú. Đại Phú ký hợp đồng vay ngân hàng 30 tỷ đồng để mở rộng nhà máy. Sau đó, Thành Công yêu cầu Đại Phú chuyển một phần tài sản sang công ty mẹ để phục vụ dự án khác, không thông qua cơ quan có thẩm quyền của Đại Phú. Khi Đại Phú mất khả năng thanh toán, ngân hàng yêu cầu Thành Công trả toàn bộ khoản vay với lý do công ty mẹ kiểm soát công ty con và đã chỉ đạo chuyển tài sản.","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4"]}]},{"name":"Chương 7 · Sáp nhập doanh nghiệp và bảo vệ chủ nợ, người lao động","items":[{"cid":"TH7.01","title":"Sáp nhập doanh nghiệp và bảo vệ chủ nợ, người lao động","text":"Ngày 01/06/2026, Công ty TNHH Hồng Hà và Công ty TNHH Nam Sơn tại tỉnh Ninh Bình thống nhất sáp nhập vào Công ty TNHH Đại Lộc. Phương án sáp nhập quy định Đại Lộc tiếp nhận toàn bộ tài sản, quyền và nghĩa vụ của hai công ty bị sáp nhập. Tuy nhiên, Hồng Hà đang nợ nhà cung cấp 4 tỷ đồng và còn 35 người lao động; phương án chưa nêu rõ kế hoạch sử dụng lao động và thông báo cho chủ nợ. Giám đốc cho rằng chỉ cần các thành viên thông qua hợp đồng sáp nhập là đủ để hoàn tất thủ tục.","mcq":["TH7.01.1","TH7.01.2","TH7.01.3","TH7.01.4"]}]},{"name":"Chương 7 · Giải thể khi còn nợ và tranh chấp","items":[{"cid":"TH7.02","title":"Giải thể khi còn nợ và tranh chấp","text":"Ngày 10/08/2026, Công ty cổ phần Bình An tại thành phố Hải Phòng thông qua nghị quyết giải thể do hoạt động kinh doanh không hiệu quả. Tại thời điểm thông qua, công ty còn nợ ngân hàng 8 tỷ đồng, nợ lương 3 tháng của 20 người lao động và đang là bị đơn trong vụ tranh chấp hợp đồng tại Tòa án nhân dân khu vực. Hội đồng quản trị đề xuất nộp hồ sơ giải thể ngay, đồng thời cam kết sẽ thanh toán các khoản nợ nếu thanh lý được tài sản sau khi hoàn tất thủ tục.","mcq":["TH7.02.1","TH7.02.2","TH7.02.3","TH7.02.4"]}]},{"name":"Chương 7 · Nguy cơ mất khả năng thanh toán và thủ tục phục hồi","items":[{"cid":"TH7.03","title":"Nguy cơ mất khả năng thanh toán và thủ tục phục hồi","text":"Công ty TNHH Phương Nam tại tỉnh Bình Dương có khoản nợ 10 tỷ đồng đến hạn ngày 01/03/2026. Đến ngày 15/07/2026, công ty vẫn chưa thanh toán được và dự kiến trong 2 tháng tới tiếp tục thiếu dòng tiền. Công ty có nhà xưởng đang hoạt động, hợp đồng mới và đề xuất phương án cơ cấu lại nợ, bán một phần tài sản không thiết yếu. Một chủ nợ muốn nộp đơn yêu cầu phá sản ngay; Hội đồng thành viên muốn áp dụng thủ tục phục hồi để duy trì hoạt động. Trụ sở công ty thuộc địa bàn một Tòa án nhân dân khu vực.","mcq":["TH7.03.1","TH7.03.2","TH7.03.3","TH7.03.4"]}]}],"vb":[{"name":"I. Luật Doanh nghiệp và văn bản sửa đổi, hợp nhất","rows":[{"t":"Luật Doanh nghiệp số 59/2020/QH14","d":"17/06/2020","note":"Có hiệu lực 01/01/2021; nội dung hiện hành tra cứu theo VBHN 67/VBHN-VPQH.","url":"https://chinhphu.vn/?classid=1&docid=200447&pageid=27160"},{"t":"Luật số 03/2022/QH15","d":"11/01/2022","note":"Có hiệu lực 01/03/2022; sửa đổi một số điều của Luật Doanh nghiệp và các luật khác.","url":"https://vanban.chinhphu.vn/?docid=206167&pageid=27160"},{"t":"Luật số 76/2025/QH15","d":"17/06/2025","note":"Có hiệu lực 01/07/2025; sửa đổi, bổ sung một số điều của Luật Doanh nghiệp.","url":"https://chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"t":"Văn bản hợp nhất số 67/VBHN-VPQH","d":"15/08/2025","note":"Hợp nhất Luật Doanh nghiệp 2020 sau sửa đổi bởi Luật 03/2022/QH15 và Luật 76/2025/QH15; dùng làm văn bản tra cứu chính.","url":"https://congbao.chinhphu.vn/cong-bao/cong-bao-so-1105-1106-ngay-31-08-2025-45864.htm"}]},{"name":"II. Đăng ký doanh nghiệp và đầu tư","rows":[{"t":"Nghị định số 168/2025/NĐ-CP","d":"30/06/2025","note":"Có hiệu lực 01/07/2025; quy định về đăng ký doanh nghiệp, thay thế Nghị định 01/2021/NĐ-CP.","url":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"t":"Nghị định số 296/2026/NĐ-CP","d":"23/07/2026","note":"Có hiệu lực 23/07/2026; sửa đổi, bổ sung một số điều của Nghị định 168/2025/NĐ-CP.","url":"https://chinhphu.vn/?classid=1&docid=218986&orggroupid=2&pageid=27160"},{"t":"Luật Đầu tư số 143/2025/QH15","d":"11/12/2025","note":"Có hiệu lực 01/03/2026; căn cứ đối chiếu điều kiện đầu tư, nhà đầu tư và hoạt động đầu tư kinh doanh.","url":"https://vanban.chinhphu.vn/?docid=216524&pageid=27160"}]},{"name":"III. Tổ chức quản trị và vốn nhà nước tại doanh nghiệp","rows":[{"t":"Luật Quản lý và đầu tư vốn nhà nước tại doanh nghiệp số 68/2025/QH15","d":"14/06/2025","note":"Có hiệu lực 01/08/2025; luật nền tảng về đầu tư và quản lý vốn nhà nước tại doanh nghiệp.","url":"https://chinhphu.vn/?classid=1&docid=214597&pageid=27160&typegroupid=3"},{"t":"Văn bản hợp nhất số 60/VBHN-VPQH","d":"23/03/2026","note":"Hợp nhất Luật 68/2025/QH15 sau sửa đổi, bổ sung bởi Luật Công nghệ cao 133/2025/QH15; tra cứu tình trạng pháp luật hiện hành.","url":"https://chinhphu.vn/?classid=2629&docid=217300&pageid=27160"},{"t":"Nghị định số 366/2025/NĐ-CP","d":"31/12/2025","note":"Có hiệu lực 01/01/2026; quy định về quản lý và đầu tư vốn nhà nước tại doanh nghiệp.","url":"https://chinhphu.vn/?classid=1&docid=216383&pageid=27160&typegroupid=4"},{"t":"Luật Chứng khoán số 54/2019/QH14","d":"26/11/2019","note":"Có hiệu lực 01/01/2021; áp dụng cùng Luật 56/2024/QH15 đối với công ty đại chúng, chào bán và thị trường chứng khoán.","url":"https://vanban.chinhphu.vn/?classid=1&docid=198541&pageid=27160&typegroupid=3"},{"t":"Luật số 56/2024/QH15","d":"29/11/2024","note":"Có hiệu lực 01/01/2025; sửa đổi, bổ sung một số điều của Luật Chứng khoán và các luật liên quan.","url":"https://congbao.chinhphu.vn/van-ban/luat-so-56-2024-qh15-43561/53650.htm"}]},{"name":"IV. Phục hồi, phá sản và pháp luật liên quan","rows":[{"t":"Luật Phục hồi, phá sản số 142/2025/QH15","d":"11/12/2025","note":"Có hiệu lực 01/03/2026; thay thế Luật Phá sản 2014; ưu tiên thủ tục phục hồi và quy định tiêu chí mất khả năng thanh toán theo mốc 06 tháng.","url":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"t":"Bộ luật Dân sự số 91/2015/QH13","d":"24/11/2015","note":"Có hiệu lực 01/01/2017; căn cứ chung về pháp nhân, tài sản, đại diện và giao dịch.","url":"https://chinhphu.vn/default.aspx?docid=183188&pageid=27160"},{"t":"Luật Thương mại số 36/2005/QH11","d":"27/06/2005","note":"Có hiệu lực 01/01/2006; căn cứ phân biệt thương nhân, hoạt động thương mại và doanh nghiệp.","url":"https://vanban.chinhphu.vn/?classid=1&docid=14765&pageid=27160"},{"t":"Luật Hợp tác xã số 17/2023/QH15","d":"20/06/2023","note":"Có hiệu lực 01/07/2024; dùng để phân biệt hợp tác xã với các loại hình doanh nghiệp.","url":"https://vanban.chinhphu.vn/?docid=208365&pageid=27160"}]}],"ly":{"root":"Luật Doanh nghiệp","sub":"Hệ thống kiến thức pháp luật doanh nghiệp Việt Nam; mốc đối chiếu 01/11/2026","updT":"Các điểm cập nhật pháp luật cần lưu ý","upd":{"t":"Các điểm cập nhật pháp luật cần lưu ý","cs":"Căn cứ: VBHN 67/VBHN-VPQH; Luật 76/2025/QH15; Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP; VBHN 60/VBHN-VPQH; Luật 142/2025/QH15.","b":["Luật Doanh nghiệp số 59/2020/QH14 được sửa đổi, bổ sung bởi Luật số 03/2022/QH15 và Luật số 76/2025/QH15; sử dụng VBHN 67/VBHN-VPQH ngày 15/08/2025 để tra cứu nội dung hợp nhất.","Luật 76/2025/QH15 bổ sung quy định về chủ sở hữu hưởng lợi, nghĩa vụ kê khai và lưu giữ thông tin; sửa đổi khoản 2 Điều 13 về trách nhiệm cá nhân của người đại diện theo pháp luật (nguyên tắc này đã có trước sửa đổi), và sửa đổi một số trường hợp hạn chế quyền thành lập, quản lý doanh nghiệp.","Thủ tục đăng ký doanh nghiệp áp dụng Nghị định 168/2025/NĐ-CP, được sửa đổi, bổ sung bởi Nghị định 296/2026/NĐ-CP; không tiếp tục dùng Nghị định 01/2021/NĐ-CP làm căn cứ hiện hành.","Quản lý và đầu tư vốn nhà nước tại doanh nghiệp phải đối chiếu VBHN 60/VBHN-VPQH ngày 23/03/2026 và Nghị định 366/2025/NĐ-CP; không tiếp tục lấy Luật 69/2014/QH13 làm căn cứ hiện hành.","Phục hồi, phá sản áp dụng Luật 142/2025/QH15 từ ngày 01/03/2026; tiêu chí nguy cơ mất khả năng thanh toán và mất khả năng thanh toán đã thay đổi so với Luật Phá sản 2014."]},"ch":[{"t":"1. Địa vị pháp lý của doanh nghiệp và những vấn đề chung","cs":"Căn cứ: Điều 1–18 Luật Doanh nghiệp; Điều 3, 6, 7 Luật Thương mại; Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":["Pháp luật doanh nghiệp điều chỉnh việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; đồng thời điều chỉnh nhóm công ty.","Doanh nghiệp là tổ chức có tên riêng, tài sản, trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo pháp luật nhằm mục đích kinh doanh.","Bốn loại hình doanh nghiệp gồm công ty trách nhiệm hữu hạn, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân; không đồng nhất doanh nghiệp với hộ kinh doanh hoặc hợp tác xã.","Doanh nghiệp có quyền tự do kinh doanh ngành, nghề luật không cấm; đồng thời phải thực hiện nghĩa vụ đăng ký, thuế, kế toán, lao động và điều kiện kinh doanh chuyên ngành.","Luật 76/2025/QH15 làm nổi bật nghĩa vụ kê khai, lưu giữ thông tin chủ sở hữu hưởng lợi và trách nhiệm cá nhân của người đại diện theo pháp luật."],"c":[{"t":"1.1. Phạm vi điều chỉnh, đối tượng áp dụng và nguyên tắc áp dụng luật","cs":"Căn cứ: Điều 1–3 Luật Doanh nghiệp","b":[],"c":[{"t":"Phạm vi điều chỉnh","cs":"Căn cứ: Điều 1–3 Luật Doanh nghiệp","b":["Phạm vi điều chỉnh bao gồm toàn bộ vòng đời pháp lý cơ bản của doanh nghiệp: thành lập, quản trị, tổ chức lại, giải thể và hoạt động liên quan."]},{"t":"Đối tượng áp dụng","cs":"Căn cứ: Điều 1–3 Luật Doanh nghiệp","b":["Đối tượng áp dụng không chỉ là doanh nghiệp mà còn gồm cơ quan, tổ chức, cá nhân có liên quan."]},{"t":"Áp dụng luật chuyên ngành","cs":"Điều 3 Luật Doanh nghiệp","b":["Khi luật chuyên ngành có quy định đặc thù về thành lập, quản lý, tổ chức lại, giải thể hoặc hoạt động doanh nghiệp thì xác định luật áp dụng theo Điều 3."]}]},{"t":"1.2. Khái niệm doanh nghiệp và các loại hình doanh nghiệp","cs":"Căn cứ: Khoản 10 Điều 4; Điều 46, 74, 111, 177, 188 Luật Doanh nghiệp","b":[],"c":[{"t":"Dấu hiệu của doanh nghiệp","cs":"Căn cứ: Khoản 10 Điều 4; Điều 46, 74, 111, 177, 188 Luật Doanh nghiệp","b":["Doanh nghiệp phải có tên riêng, tài sản, trụ sở giao dịch và được thành lập hoặc đăng ký thành lập theo quy định pháp luật nhằm mục đích kinh doanh."]},{"t":"Bốn loại hình doanh nghiệp","cs":"Căn cứ: Khoản 10 Điều 4; Điều 46, 74, 111, 177, 188 Luật Doanh nghiệp","b":["Công ty TNHH có loại một thành viên và hai thành viên trở lên; công ty cổ phần có vốn điều lệ chia thành cổ phần; công ty hợp danh có thành viên hợp danh; doanh nghiệp tư nhân do một cá nhân làm chủ."]},{"t":"Ý nghĩa của loại hình","cs":"Căn cứ: Khoản 10 Điều 4; Điều 46, 74, 111, 177, 188 Luật Doanh nghiệp","b":["Loại hình doanh nghiệp quyết định chế độ trách nhiệm tài sản, cơ cấu quản trị, khả năng huy động vốn và quyền chuyển nhượng vốn."]}]},{"t":"1.3. Phân biệt doanh nghiệp, thương nhân, hộ kinh doanh và hợp tác xã","cs":"Căn cứ: Điều 1, 4 Luật Doanh nghiệp; Điều 6, 7 Luật Thương mại; Luật Hợp tác xã 2023; Nghị định 168/2025/NĐ-CP","b":[],"c":[{"t":"Doanh nghiệp – thương nhân","cs":"Căn cứ: Điều 1, 4 Luật Doanh nghiệp; Điều 6, 7 Luật Thương mại; Luật Hợp tác xã 2023; Nghị định 168/2025/NĐ-CP","b":["Doanh nghiệp là tổ chức được thành lập theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế thành lập hợp pháp hoặc cá nhân hoạt động thương mại độc lập, thường xuyên và có đăng ký kinh doanh."]},{"t":"Hộ kinh doanh","cs":"Điều 1 Luật Doanh nghiệp","b":["Hộ kinh doanh đăng ký và hoạt động theo quy định riêng; không phải là một trong bốn loại hình doanh nghiệp tại Điều 1 Luật Doanh nghiệp."]},{"t":"Hợp tác xã","cs":"Căn cứ: Điều 1, 4 Luật Doanh nghiệp; Điều 6, 7 Luật Thương mại; Luật Hợp tác xã 2023; Nghị định 168/2025/NĐ-CP","b":["Hợp tác xã là tổ chức kinh tế tập thể, có tư cách pháp nhân và hoạt động theo Luật Hợp tác xã; không phải một loại hình công ty theo Luật Doanh nghiệp."]}]},{"t":"1.4. Quyền và nghĩa vụ cơ bản của doanh nghiệp","cs":"Căn cứ: Điều 7, 8 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013","b":[],"c":[{"t":"Tự do kinh doanh","cs":"Căn cứ: Điều 7, 8 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013","b":["Doanh nghiệp được tự do kinh doanh ngành, nghề mà luật không cấm; chủ động lựa chọn hình thức, phương thức, địa bàn và ngành nghề kinh doanh."]},{"t":"Ngành, nghề kinh doanh có điều kiện","cs":"Căn cứ: Điều 7, 8 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013","b":["Quyền tự do kinh doanh không loại trừ nghĩa vụ đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện."]},{"t":"Nghĩa vụ của doanh nghiệp","cs":"Căn cứ: Điều 7, 8 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013","b":["Doanh nghiệp phải thực hiện nghĩa vụ đăng ký, kê khai trung thực, tổ chức kế toán, nộp thuế, bảo đảm quyền lợi người lao động và nghĩa vụ khác theo luật."]}]},{"t":"1.5. Người đại diện theo pháp luật của doanh nghiệp","cs":"Căn cứ: Điều 12, 13 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":[],"c":[{"t":"Khái niệm","cs":"Căn cứ: Điều 12, 13 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Người đại diện theo pháp luật là cá nhân đại diện doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện doanh nghiệp với tư cách người yêu cầu giải quyết việc dân sự, nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan trước Trọng tài, Tòa án."]},{"t":"Một hoặc nhiều người đại diện","cs":"Căn cứ: Điều 12, 13 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Công ty TNHH và công ty cổ phần có thể có một hoặc nhiều người đại diện theo pháp luật; số lượng, chức danh, quyền và nghĩa vụ được xác định theo Luật và Điều lệ."]},{"t":"Trách nhiệm cá nhân","cs":"Khoản 2 Điều 13 Luật Doanh nghiệp","b":["Khoản 2 Điều 13 được Luật 76/2025/QH15 sửa đổi về cách diễn đạt trách nhiệm cá nhân theo quy định của pháp luật; nguyên tắc người đại diện chịu trách nhiệm cá nhân đối với thiệt hại do vi phạm nghĩa vụ đã có trong Luật Doanh nghiệp trước sửa đổi."]}]},{"t":"1.6. Chủ sở hữu hưởng lợi của doanh nghiệp","cs":"Căn cứ: Khoản 35 Điều 4; Điều 8, 11, 25 Luật Doanh nghiệp; Điều 17, Điều 18 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":[],"c":[{"t":"Khái niệm","cs":"Căn cứ: Khoản 35 Điều 4; Điều 8, 11, 25 Luật Doanh nghiệp; Điều 17, Điều 18 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Chủ sở hữu hưởng lợi là một hoặc nhiều cá nhân trực tiếp hoặc gián tiếp sở hữu, hoặc kiểm soát cuối cùng trên thực tế đối với doanh nghiệp có tư cách pháp nhân; không bao gồm cá nhân đại diện phần vốn nhà nước trong doanh nghiệp."]},{"t":"Tiêu chí sở hữu","cs":"Căn cứ: Khoản 35 Điều 4; Điều 8, 11, 25 Luật Doanh nghiệp; Điều 17, Điều 18 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Tiêu chí sở hữu gồm sở hữu trực tiếp, gián tiếp hoặc kết hợp trực tiếp và gián tiếp từ 25% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết trở lên. Nhóm cá nhân có quan hệ gia đình hoặc thỏa thuận cùng sở hữu đạt ngưỡng luật định cũng phải được xem xét."]},{"t":"Tiêu chí kiểm soát","cs":"Căn cứ: Khoản 35 Điều 4; Điều 8, 11, 25 Luật Doanh nghiệp; Điều 17, Điều 18 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Tiêu chí kiểm soát gồm quyền bổ nhiệm, miễn nhiệm đa số người quản lý; sửa Điều lệ; thay đổi cơ cấu tổ chức; quyết định chính sách tài chính, đầu tư và hoạt động; tổ chức lại hoặc giải thể doanh nghiệp."]},{"t":"Khi không có cá nhân đáp ứng","cs":"Căn cứ: Khoản 35 Điều 4; Điều 8, 11, 25 Luật Doanh nghiệp; Điều 17, Điều 18 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Trường hợp không có cá nhân đáp ứng tiêu chí sở hữu hoặc kiểm soát, doanh nghiệp xác định người quản lý có quyền hạn lớn nhất để hành động thay mặt; tất cả thành viên hợp danh là chủ sở hữu hưởng lợi không phụ thuộc tỷ lệ vốn góp."]}]},{"t":"1.7. Các hành vi bị nghiêm cấm trong hoạt động doanh nghiệp","cs":"Căn cứ: Điều 16 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15","b":[],"c":[{"t":"Kê khai không trung thực","cs":"Căn cứ: Điều 16 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15","b":["Kê khai giả mạo, không trung thực hoặc không chính xác hồ sơ đăng ký doanh nghiệp và hồ sơ thay đổi nội dung đăng ký."]},{"t":"Kê khai khống vốn điều lệ","cs":"Căn cứ: Điều 16 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15","b":["Kê khai khống vốn điều lệ do không góp đủ vốn đã đăng ký mà không điều chỉnh theo luật; cố ý định giá tài sản góp vốn không đúng giá trị."]},{"t":"Kinh doanh bị cấm, không đủ điều kiện","cs":"Căn cứ: Điều 16 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15","b":["Cấm thực hiện hoạt động kinh doanh bị cấm, kinh doanh không đủ điều kiện và hành vi bị pháp luật chuyên ngành nghiêm cấm."]}]}]},{"t":"2. Thành lập, đăng ký doanh nghiệp và vốn góp","cs":"Căn cứ: Điều 17–45 Luật Doanh nghiệp; Điều 34–36 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP; Luật Đầu tư 143/2025/QH15","b":["Quyền thành lập, quản lý doanh nghiệp và quyền góp vốn, mua cổ phần, mua phần vốn góp phải được xem xét độc lập theo điều kiện và nhóm chủ thể bị hạn chế hoặc cấm.","Đăng ký doanh nghiệp là thủ tục pháp lý ghi nhận thông tin doanh nghiệp; không thay thế giấy phép, chứng nhận hoặc điều kiện kinh doanh chuyên ngành.","Hồ sơ, trình tự, phương thức đăng ký và thay đổi thông tin thực hiện theo Luật Doanh nghiệp và Nghị định 168/2025/NĐ-CP đã được sửa đổi năm 2026.","Vốn góp có thể bằng tiền, vàng, quyền sử dụng đất, quyền sở hữu trí tuệ, công nghệ, bí quyết kỹ thuật và tài sản khác định giá được bằng Đồng Việt Nam; việc góp vốn phải hoàn tất theo thời hạn riêng của từng loại hình."],"c":[{"t":"2.1. Quyền thành lập, quản lý doanh nghiệp và quyền góp vốn","cs":"Căn cứ: Điều 17 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15; Luật Đầu tư 143/2025/QH15","b":[],"c":[{"t":"Quyền thành lập, quản lý","cs":"Căn cứ: Điều 17 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15; Luật Đầu tư 143/2025/QH15","b":["Cá nhân, tổ chức có quyền thành lập và quản lý doanh nghiệp, trừ các trường hợp bị cấm hoặc hạn chế theo luật."]},{"t":"Đối tượng bị hạn chế","cs":"Căn cứ: Điều 17 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15; Luật Đầu tư 143/2025/QH15","b":["Cán bộ, công chức, viên chức và các chủ thể khác phải được đối chiếu với quy định chuyên ngành; Luật 76/2025/QH15 có ngoại lệ liên quan hoạt động khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số theo luật."]},{"t":"Quyền góp vốn, mua cổ phần","cs":"Căn cứ: Điều 17 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15; Luật Đầu tư 143/2025/QH15","b":["Quyền góp vốn, mua cổ phần, mua phần vốn góp có nhóm hạn chế riêng; không suy luận quyền góp vốn hoàn toàn đồng nhất với quyền thành lập, quản lý."]}]},{"t":"2.2. Hồ sơ và trình tự đăng ký doanh nghiệp","cs":"Căn cứ: Điều 18–26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP","b":[],"c":[{"t":"Hồ sơ đăng ký","cs":"Căn cứ: Điều 18–26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP","b":["Hồ sơ đăng ký phụ thuộc loại hình doanh nghiệp, bao gồm giấy đề nghị đăng ký, Điều lệ và danh sách thành viên hoặc cổ đông theo trường hợp."]},{"t":"Tự kê khai, tự chịu trách nhiệm","cs":"Căn cứ: Điều 18–26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP","b":["Người thành lập doanh nghiệp hoặc doanh nghiệp tự kê khai và chịu trách nhiệm về tính hợp pháp, trung thực, chính xác của thông tin trong hồ sơ."]},{"t":"Đăng ký qua mạng","cs":"Căn cứ: Điều 18–26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP","b":["Đăng ký qua mạng thông tin điện tử được thực hiện theo yêu cầu về tài liệu điện tử, kê khai và ký số hoặc xác thực theo quy định."]},{"t":"Thời hạn xem xét hồ sơ","cs":"khoản 5 Điều 26 Luật Doanh nghiệp","b":["Cơ quan đăng ký kinh doanh xem xét hồ sơ hợp lệ trong thời hạn 03 ngày làm việc theo khoản 5 Điều 26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP quy định chi tiết quy trình, phương thức đăng ký."]}]},{"t":"2.3. Tên, trụ sở và thông tin đăng ký doanh nghiệp","cs":"Căn cứ: Điều 28–45 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":[],"c":[{"t":"Tên doanh nghiệp","cs":"Căn cứ: Điều 28–45 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Tên doanh nghiệp gồm loại hình doanh nghiệp và tên riêng; không được đặt tên trùng hoặc gây nhầm lẫn, vi phạm điều cấm của luật."]},{"t":"Trụ sở chính","cs":"Căn cứ: Điều 28–45 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Trụ sở chính phải ở Việt Nam, có địa chỉ liên lạc xác định theo đơn vị hành chính và thông tin liên hệ theo quy định."]},{"t":"Ngành, nghề kinh doanh","cs":"Căn cứ: Điều 28–45 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Doanh nghiệp đăng ký ngành, nghề kinh doanh và phải đáp ứng điều kiện chuyên ngành trước khi kinh doanh ngành, nghề có điều kiện."]},{"t":"Đơn vị phụ thuộc","cs":"Căn cứ: Điều 28–45 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Chi nhánh, văn phòng đại diện và địa điểm kinh doanh là đơn vị phụ thuộc; không mặc nhiên có tư cách pháp nhân độc lập."]}]},{"t":"2.4. Tài sản góp vốn, định giá và chuyển quyền sở hữu","cs":"Căn cứ: Điều 34–36 Luật Doanh nghiệp; BLDS 2015","b":[],"c":[{"t":"Các loại tài sản góp vốn","cs":"Căn cứ: Điều 34–36 Luật Doanh nghiệp; BLDS 2015","b":["Tài sản góp vốn gồm Đồng Việt Nam, ngoại tệ tự do chuyển đổi, vàng, quyền sử dụng đất, quyền sở hữu trí tuệ, công nghệ, bí quyết kỹ thuật và tài sản khác định giá được bằng Đồng Việt Nam."]},{"t":"Chuyển quyền sở hữu","cs":"Căn cứ: Điều 34–36 Luật Doanh nghiệp; BLDS 2015","b":["Chỉ chủ sở hữu hoặc người có quyền sử dụng hợp pháp mới có quyền dùng tài sản để góp vốn; tài sản phải được chuyển quyền sở hữu hoặc quyền sử dụng cho công ty theo luật."]},{"t":"Định giá tài sản góp vốn","cs":"Căn cứ: Điều 34–36 Luật Doanh nghiệp; BLDS 2015","b":["Tài sản không phải tiền, vàng hoặc ngoại tệ phải được định giá theo thỏa thuận hoặc thông qua tổ chức thẩm định giá; cố ý định giá cao hơn giá trị thực tế có thể phát sinh trách nhiệm."]}]},{"t":"2.5. Thời hạn góp vốn và xử lý việc không góp đủ vốn","cs":"Căn cứ: Điều 35–36, Điều 47, 75, 113 và quy định tương ứng về từng loại hình Luật Doanh nghiệp","b":[],"c":[{"t":"Theo từng loại hình","cs":"Căn cứ: Điều 35–36, Điều 47, 75, 113 và quy định tương ứng về từng loại hình Luật Doanh nghiệp","b":["Thời hạn góp vốn không áp dụng một cách máy móc cho mọi loại hình; phải xác định theo quy định riêng của công ty TNHH, công ty cổ phần, công ty hợp danh hoặc doanh nghiệp tư nhân."]},{"t":"Mốc 90 ngày","cs":"Căn cứ: Điều 35–36, Điều 47, 75, 113 và quy định tương ứng về từng loại hình Luật Doanh nghiệp","b":["Đối với công ty TNHH và công ty cổ phần, mốc góp đủ vốn hoặc thanh toán cổ phần đã đăng ký về cơ bản là 90 ngày, trừ trường hợp luật quy định khác."]},{"t":"Không góp đủ vốn","cs":"Căn cứ: Điều 35–36, Điều 47, 75, 113 và quy định tương ứng về từng loại hình Luật Doanh nghiệp","b":["Khi không góp đủ vốn đúng hạn, doanh nghiệp phải điều chỉnh vốn điều lệ, danh sách thành viên hoặc cổ đông và xử lý trách nhiệm tương ứng; không được duy trì vốn đăng ký khống."]}]},{"t":"2.6. Đăng ký thay đổi và thông tin chủ sở hữu hưởng lợi","cs":"Căn cứ: Điều 25, 30–31 Luật Doanh nghiệp; khoản 1 Điều 3 Luật 76/2025/QH15; Điều 17 và quy định hồ sơ tại Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":[],"c":[{"t":"Đăng ký, thông báo thay đổi","cs":"Căn cứ: Điều 25, 30–31 Luật Doanh nghiệp; khoản 1 Điều 3 Luật 76/2025/QH15; Điều 17 và quy định hồ sơ tại Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":["Doanh nghiệp phải đăng ký hoặc thông báo khi thay đổi nội dung đăng ký thuộc trường hợp luật định."]},{"t":"Danh sách chủ sở hữu hưởng lợi","cs":"Căn cứ: Điều 25, 30–31 Luật Doanh nghiệp; khoản 1 Điều 3 Luật 76/2025/QH15; Điều 17 và quy định hồ sơ tại Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":["Hồ sơ có thể phải cập nhật danh sách chủ sở hữu hưởng lợi và thông tin để xác định cá nhân sở hữu hoặc chi phối doanh nghiệp."]},{"t":"Quy định chuyển tiếp","cs":"Căn cứ: Điều 25, 30–31 Luật Doanh nghiệp; khoản 1 Điều 3 Luật 76/2025/QH15; Điều 17 và quy định hồ sơ tại Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":["Doanh nghiệp thành lập trước ngày 01/07/2025 thực hiện bổ sung thông tin chủ sở hữu hưởng lợi theo quy định chuyển tiếp, gắn với lần đăng ký hoặc thông báo thay đổi gần nhất, trừ trường hợp chủ động bổ sung sớm."]}]}]},{"t":"3. Công ty trách nhiệm hữu hạn","cs":"Căn cứ: Điều 46–87 Luật Doanh nghiệp; VBHN 67/VBHN-VPQH","b":["Công ty TNHH có tư cách pháp nhân kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp; thành viên hoặc chủ sở hữu chịu trách nhiệm về các khoản nợ trong phạm vi vốn góp hoặc vốn điều lệ theo luật.","Công ty TNHH hai thành viên trở lên có từ 02 đến 50 thành viên; công ty TNHH một thành viên do một tổ chức hoặc một cá nhân làm chủ sở hữu.","Vốn điều lệ không chia thành cổ phần; việc chuyển nhượng phần vốn góp bị giới hạn theo cơ chế luật định và Điều lệ.","Cơ cấu tổ chức quản lý khác nhau giữa công ty TNHH một thành viên và công ty TNHH hai thành viên trở lên."],"c":[{"t":"3.1. Đặc điểm pháp lý và chế độ trách nhiệm","cs":"Căn cứ: Điều 46, 74 Luật Doanh nghiệp; BLDS 2015","b":[],"c":[{"t":"Pháp nhân độc lập","cs":"Căn cứ: Điều 46, 74 Luật Doanh nghiệp; BLDS 2015","b":["Công ty TNHH là pháp nhân độc lập; tài sản của công ty tách biệt với tài sản của thành viên hoặc chủ sở hữu."]},{"t":"TNHH hai thành viên","cs":"Căn cứ: Điều 46, 74 Luật Doanh nghiệp; BLDS 2015","b":["Thành viên công ty TNHH hai thành viên trở lên chịu trách nhiệm trong phạm vi phần vốn đã góp, trừ trường hợp luật quy định trách nhiệm khác."]},{"t":"TNHH một thành viên","cs":"Căn cứ: Điều 46, 74 Luật Doanh nghiệp; BLDS 2015","b":["Công ty TNHH một thành viên do một tổ chức hoặc cá nhân làm chủ; chủ sở hữu chịu trách nhiệm trong phạm vi vốn điều lệ theo quy định."]}]},{"t":"3.2. Công ty TNHH hai thành viên trở lên: thành viên và vốn góp","cs":"Căn cứ: Điều 46–53 Luật Doanh nghiệp","b":[],"c":[{"t":"Từ 02 đến 50 thành viên","cs":"Căn cứ: Điều 46–53 Luật Doanh nghiệp","b":["Số lượng thành viên từ 02 đến 50; thành viên có thể là tổ chức hoặc cá nhân."]},{"t":"Góp vốn đúng hạn","cs":"Điều 47 Luật Doanh nghiệp","b":["Thành viên góp đủ và đúng loại tài sản đã cam kết trong thời hạn luật định; phần vốn chưa góp được xử lý theo Điều 47."]},{"t":"Quyền của thành viên","cs":"Căn cứ: Điều 46–53 Luật Doanh nghiệp","b":["Thành viên được cấp giấy chứng nhận phần vốn góp và có quyền yêu cầu công ty cung cấp thông tin, phân chia lợi nhuận, định đoạt phần vốn theo luật."]}]},{"t":"3.3. Chuyển nhượng, mua lại và thay đổi phần vốn góp","cs":"Căn cứ: Điều 51–53, Điều 68 Luật Doanh nghiệp","b":[],"c":[{"t":"Mua lại phần vốn góp","cs":"Căn cứ: Điều 51–53, Điều 68 Luật Doanh nghiệp","b":["Thành viên có quyền yêu cầu công ty mua lại phần vốn góp trong các trường hợp luật định, nhất là khi không tán thành nghị quyết, quyết định về vấn đề thuộc phạm vi luật quy định."]},{"t":"Chuyển nhượng phần vốn góp","cs":"Điều 52 Luật Doanh nghiệp","b":["Việc chuyển nhượng phần vốn góp phải tuân thủ trình tự ưu tiên chào bán cho thành viên còn lại và điều kiện chuyển nhượng theo Điều 52, trừ trường hợp luật có quy định khác."]},{"t":"Tăng, giảm vốn điều lệ","cs":"Căn cứ: Điều 51–53, Điều 68 Luật Doanh nghiệp","b":["Công ty có thể tăng hoặc giảm vốn điều lệ theo các căn cứ và thủ tục tại Luật Doanh nghiệp; việc giảm vốn không được làm ảnh hưởng trái luật đến khả năng thanh toán."]}]},{"t":"3.4. Tổ chức quản lý công ty TNHH hai thành viên trở lên","cs":"Căn cứ: Điều 54–67 Luật Doanh nghiệp","b":[],"c":[{"t":"Cơ cấu tổ chức quản lý","cs":"Căn cứ: Điều 54–67 Luật Doanh nghiệp","b":["Cơ cấu cơ bản gồm Hội đồng thành viên, Chủ tịch Hội đồng thành viên và Giám đốc hoặc Tổng giám đốc; Ban kiểm soát được tổ chức trong trường hợp luật định."]},{"t":"Hội đồng thành viên","cs":"Căn cứ: Điều 54–67 Luật Doanh nghiệp","b":["Hội đồng thành viên là cơ quan quyết định cao nhất, gồm tất cả thành viên công ty; quyền và nhiệm vụ được xác định theo Luật và Điều lệ."]},{"t":"Thông qua nghị quyết","cs":"Căn cứ: Điều 54–67 Luật Doanh nghiệp","b":["Nghị quyết, quyết định của Hội đồng thành viên phải tuân thủ điều kiện họp, tỷ lệ biểu quyết và thủ tục thông qua theo luật, Điều lệ."]}]},{"t":"3.5. Công ty TNHH một thành viên: chủ sở hữu và cơ cấu quản lý","cs":"Căn cứ: Điều 74–87 Luật Doanh nghiệp","b":[],"c":[{"t":"Quyền của chủ sở hữu","cs":"Căn cứ: Điều 74–87 Luật Doanh nghiệp","b":["Chủ sở hữu có quyền quyết định Điều lệ, chiến lược, cơ cấu quản lý, bổ nhiệm người quản lý và các vấn đề thuộc thẩm quyền."]},{"t":"Chủ sở hữu là tổ chức","cs":"Căn cứ: Điều 74–87 Luật Doanh nghiệp","b":["Nếu chủ sở hữu là tổ chức, mô hình quản lý được tổ chức theo Hội đồng thành viên hoặc Chủ tịch công ty cùng Giám đốc/Tổng giám đốc và Kiểm soát viên theo luật."]},{"t":"Chủ sở hữu là cá nhân","cs":"Căn cứ: Điều 74–87 Luật Doanh nghiệp","b":["Nếu chủ sở hữu là cá nhân, cơ cấu quản lý gồm Chủ tịch công ty và Giám đốc/Tổng giám đốc; chủ sở hữu có thể kiêm nhiệm theo điều kiện luật định."]},{"t":"Chuyển nhượng vốn điều lệ","cs":"Căn cứ: Điều 74–87 Luật Doanh nghiệp","b":["Khi chuyển nhượng một phần hoặc toàn bộ vốn điều lệ, công ty phải tổ chức lại hoặc đăng ký thay đổi loại hình phù hợp."]}]}]},{"t":"4. Công ty cổ phần","cs":"Căn cứ: Điều 111–176 Luật Doanh nghiệp; Luật Chứng khoán 2019 được sửa đổi bởi Luật 56/2024/QH15","b":["Công ty cổ phần có vốn điều lệ chia thành cổ phần, có tối thiểu 03 cổ đông và không hạn chế số lượng tối đa; cổ đông chịu trách nhiệm trong phạm vi vốn đã góp.","Công ty cổ phần có tư cách pháp nhân; có quyền phát hành cổ phần, trái phiếu và các loại chứng khoán khác theo điều kiện luật định.","Quản trị công ty cổ phần dựa trên Đại hội đồng cổ đông, Hội đồng quản trị, Giám đốc/Tổng giám đốc và cơ chế Ban kiểm soát hoặc Ủy ban kiểm toán tùy mô hình.","Quyền cổ đông, chuyển nhượng cổ phần, chào bán chứng khoán, công bố thông tin và giao dịch với người có liên quan phải được xem xét theo Luật Doanh nghiệp và pháp luật chứng khoán."],"c":[{"t":"4.1. Đặc điểm pháp lý, vốn điều lệ và cổ phần","cs":"Căn cứ: Điều 111–120 Luật Doanh nghiệp","b":[],"c":[{"t":"Cổ phần, cổ đông","cs":"Căn cứ: Điều 111–120 Luật Doanh nghiệp","b":["Vốn điều lệ được chia thành nhiều phần bằng nhau gọi là cổ phần; người sở hữu cổ phần là cổ đông."]},{"t":"Ít nhất 03 cổ đông","cs":"Căn cứ: Điều 111–120 Luật Doanh nghiệp","b":["Công ty phải có ít nhất 03 cổ đông; cổ đông có thể là tổ chức hoặc cá nhân và không bị giới hạn số lượng tối đa."]},{"t":"Cổ phần phổ thông, ưu đãi","cs":"Căn cứ: Điều 111–120 Luật Doanh nghiệp","b":["Cổ phần phổ thông là loại cổ phần bắt buộc; công ty có thể có cổ phần ưu đãi theo điều kiện của luật."]}]},{"t":"4.2. Quyền và nghĩa vụ của cổ đông","cs":"Căn cứ: Điều 115–119 Luật Doanh nghiệp","b":[],"c":[{"t":"Quyền của cổ đông phổ thông","cs":"Căn cứ: Điều 115–119 Luật Doanh nghiệp","b":["Cổ đông phổ thông có quyền dự họp, biểu quyết, nhận cổ tức, ưu tiên mua cổ phần mới và tiếp cận thông tin theo điều kiện luật định."]},{"t":"Quyền của cổ đông lớn","cs":"Căn cứ: Điều 115–119 Luật Doanh nghiệp","b":["Cổ đông hoặc nhóm cổ đông đạt tỷ lệ sở hữu và thời gian nắm giữ theo luật có các quyền đặc biệt như yêu cầu triệu tập họp, xem xét tài liệu và đề cử người quản lý."]},{"t":"Nghĩa vụ của cổ đông","cs":"Căn cứ: Điều 115–119 Luật Doanh nghiệp","b":["Cổ đông phải thanh toán đủ số cổ phần đã đăng ký mua và tuân thủ Điều lệ, nghị quyết hợp pháp của công ty."]}]},{"t":"4.3. Chào bán cổ phần, phát hành chứng khoán và cổ tức","cs":"Căn cứ: Điều 123–135, 148–150 Luật Doanh nghiệp; Luật Chứng khoán 2019 và Luật 56/2024/QH15","b":[],"c":[{"t":"Các hình thức chào bán","cs":"Căn cứ: Điều 123–135, 148–150 Luật Doanh nghiệp; Luật Chứng khoán 2019 và Luật 56/2024/QH15","b":["Công ty có thể chào bán cổ phần cho cổ đông hiện hữu, chào bán riêng lẻ hoặc chào bán ra công chúng theo điều kiện tương ứng."]},{"t":"Pháp luật chứng khoán","cs":"Căn cứ: Điều 123–135, 148–150 Luật Doanh nghiệp; Luật Chứng khoán 2019 và Luật 56/2024/QH15","b":["Việc chào bán ra công chúng, đăng ký công ty đại chúng, niêm yết và công bố thông tin còn chịu sự điều chỉnh của pháp luật chứng khoán."]},{"t":"Điều kiện trả cổ tức","cs":"Căn cứ: Điều 123–135, 148–150 Luật Doanh nghiệp; Luật Chứng khoán 2019 và Luật 56/2024/QH15","b":["Cổ tức chỉ được trả khi công ty đáp ứng điều kiện về lợi nhuận, hoàn thành nghĩa vụ tài chính và bảo đảm khả năng thanh toán sau khi trả."]}]},{"t":"4.4. Đại hội đồng cổ đông và Hội đồng quản trị","cs":"Căn cứ: Điều 138–165 Luật Doanh nghiệp","b":[],"c":[{"t":"Đại hội đồng cổ đông","cs":"Căn cứ: Điều 138–165 Luật Doanh nghiệp","b":["Đại hội đồng cổ đông gồm tất cả cổ đông có quyền biểu quyết và là cơ quan quyết định cao nhất của công ty cổ phần."]},{"t":"Hội đồng quản trị","cs":"Căn cứ: Điều 138–165 Luật Doanh nghiệp","b":["Hội đồng quản trị là cơ quan quản lý công ty, có quyền nhân danh công ty quyết định và thực hiện quyền, nghĩa vụ không thuộc thẩm quyền Đại hội đồng cổ đông."]},{"t":"Họp và thông qua nghị quyết","cs":"Căn cứ: Điều 138–165 Luật Doanh nghiệp","b":["Điều kiện tiến hành họp, tỷ lệ thông qua nghị quyết, hình thức lấy ý kiến bằng văn bản và quyền yêu cầu hủy nghị quyết phải tuân thủ luật và Điều lệ."]}]},{"t":"4.5. Giám đốc, Ủy ban kiểm toán, Ban kiểm soát và giao dịch có liên quan","cs":"Căn cứ: Điều 162–176 Luật Doanh nghiệp; Luật Chứng khoán 2019","b":[],"c":[{"t":"Giám đốc/Tổng giám đốc","cs":"Căn cứ: Điều 162–176 Luật Doanh nghiệp; Luật Chứng khoán 2019","b":["Giám đốc hoặc Tổng giám đốc điều hành hoạt động kinh doanh hằng ngày và chịu sự giám sát của Hội đồng quản trị."]},{"t":"Ban kiểm soát – Ủy ban kiểm toán","cs":"Căn cứ: Điều 162–176 Luật Doanh nghiệp; Luật Chứng khoán 2019","b":["Công ty lựa chọn mô hình quản trị có Ban kiểm soát hoặc mô hình có Ủy ban kiểm toán trực thuộc Hội đồng quản trị theo điều kiện luật định."]},{"t":"Giao dịch với người có liên quan","cs":"Căn cứ: Điều 162–176 Luật Doanh nghiệp; Luật Chứng khoán 2019","b":["Giao dịch với người có liên quan phải được nhận diện, công khai và chấp thuận đúng thẩm quyền nhằm phòng ngừa xung đột lợi ích."]}]}]},{"t":"5. Công ty hợp danh và doanh nghiệp tư nhân","cs":"Căn cứ: Điều 177–193 Luật Doanh nghiệp; BLDS 2015; Luật Thương mại 2005","b":["Công ty hợp danh phải có ít nhất 02 thành viên hợp danh là cá nhân; thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản của mình về nghĩa vụ công ty.","Thành viên góp vốn của công ty hợp danh chịu trách nhiệm trong phạm vi vốn đã cam kết góp; công ty hợp danh có tư cách pháp nhân nhưng không được phát hành chứng khoán.","Doanh nghiệp tư nhân do một cá nhân làm chủ và chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản; doanh nghiệp tư nhân không có tư cách pháp nhân.","Hai loại hình này có chế độ trách nhiệm tài sản khác biệt căn bản với công ty TNHH và công ty cổ phần."],"c":[{"t":"5.1. Công ty hợp danh: thành viên và tư cách pháp lý","cs":"Căn cứ: Điều 177–178 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":[],"c":[{"t":"Thành viên hợp danh, góp vốn","cs":"Căn cứ: Điều 177–178 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Công ty hợp danh có ít nhất 02 thành viên hợp danh là chủ sở hữu chung của công ty, cùng kinh doanh dưới một tên chung; có thể có thành viên góp vốn."]},{"t":"Thành viên hợp danh là cá nhân","cs":"Căn cứ: Điều 177–178 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Thành viên hợp danh phải là cá nhân; thành viên góp vốn có thể là tổ chức hoặc cá nhân."]},{"t":"Có tư cách pháp nhân","cs":"Căn cứ: Điều 177–178 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Công ty hợp danh có tư cách pháp nhân kể từ ngày đượ
