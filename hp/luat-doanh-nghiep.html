hành lập, đăng ký doanh nghiệp và vốn góp"},{"n":3,"name":"Công ty trách nhiệm hữu hạn"},{"n":4,"name":"Công ty cổ phần"},{"n":5,"name":"Công ty hợp danh và doanh nghiệp tư nhân"},{"n":6,"name":"Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty"},{"n":7,"name":"Tổ chức lại, giải thể và phục hồi, phá sản"}],"q":[{"id":"LDN101","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, phạm vi điều chỉnh chủ yếu của Luật bao gồm nội dung nào?","o":["Thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; nhóm công ty","Toàn bộ hoạt động đầu tư của mọi nhà đầu tư trong nền kinh tế","Mọi quan hệ hợp đồng giữa thương nhân với nhau","Việc thành lập và hoạt động của tất cả tổ chức xã hội"],"a":0,"e":"Đáp án đúng là A. Thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; nhóm công ty. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 1 Luật Doanh nghiệp"},{"id":"LDN102","g":1,"lv":"NB","q":"Những chủ thể nào thuộc đối tượng áp dụng của Luật Doanh nghiệp?","o":["Chỉ doanh nghiệp đã được cấp Giấy chứng nhận đăng ký doanh nghiệp","Chỉ chủ sở hữu và người đại diện theo pháp luật của doanh nghiệp","Chỉ cơ quan đăng ký kinh doanh","Doanh nghiệp và cơ quan, tổ chức, cá nhân có liên quan đến việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động của doanh nghiệp"],"a":3,"e":"Đáp án đúng là B. Doanh nghiệp và cơ quan, tổ chức, cá nhân có liên quan đến việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động của doanh nghiệp. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 2 Luật Doanh nghiệp"},{"id":"LDN103","g":1,"lv":"TH","q":"Khi một vấn đề về doanh nghiệp được Luật Doanh nghiệp và luật chuyên ngành cùng điều chỉnh, cách xác định luật áp dụng phù hợp nhất là gì?","o":["Luôn áp dụng Luật Doanh nghiệp vì đây là luật chuyên biệt về chủ thể","Luôn áp dụng văn bản được ban hành sau, không cần xét điều khoản liên quan","Các bên được tự do chọn bất kỳ luật nào","Áp dụng quy định về áp dụng luật tại Điều 3 và quy định của luật chuyên ngành tương ứng"],"a":3,"e":"Đáp án đúng là C. Áp dụng quy định về áp dụng luật tại Điều 3 và quy định của luật chuyên ngành tương ứng. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 3 Luật Doanh nghiệp"},{"id":"LDN104","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, doanh nghiệp được hiểu là gì?","o":["Tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định của pháp luật nhằm mục đích kinh doanh","Mọi cá nhân có hoạt động tạo ra thu nhập","Mọi tổ chức có tài khoản ngân hàng và sử dụng lao động","Mọi đơn vị phụ thuộc của thương nhân"],"a":0,"e":"Đáp án đúng là A. Tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định của pháp luật nhằm mục đích kinh doanh. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 10 Điều 4 Luật Doanh nghiệp"},{"id":"LDN105","g":1,"lv":"TH","q":"Nhận định nào phân biệt chính xác doanh nghiệp với thương nhân?","o":["Doanh nghiệp và thương nhân là hai thuật ngữ đồng nhất","Mọi thương nhân đều phải là công ty có tư cách pháp nhân","Cá nhân không thể là thương nhân","Doanh nghiệp là tổ chức theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế hoặc cá nhân đáp ứng điều kiện của Luật Thương mại"],"a":3,"e":"Đáp án đúng là C. Doanh nghiệp là tổ chức theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế hoặc cá nhân đáp ứng điều kiện của Luật Thương mại. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 10 Điều 4 Luật Doanh nghiệp; khoản 1 Điều 6 Luật Thương mại"},{"id":"LDN106","g":1,"lv":"NB","q":"Luật Doanh nghiệp quy định những loại hình doanh nghiệp nào?","o":["Công ty TNHH, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân","Công ty TNHH, công ty cổ phần, hộ kinh doanh và hợp tác xã","Công ty TNHH, công ty hợp danh, hợp tác xã và doanh nghiệp nhà nước","Công ty cổ phần, hộ kinh doanh, doanh nghiệp tư nhân và tổ hợp tác"],"a":0,"e":"Đáp án đúng là A. Công ty TNHH, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 1 Luật Doanh nghiệp"},{"id":"LDN107","g":1,"lv":"TH","q":"Hộ kinh doanh được xử lý thế nào khi xác định phạm vi các loại hình doanh nghiệp theo Luật Doanh nghiệp?","o":["Được coi là công ty TNHH một thành viên","Là một loại hình doanh nghiệp thứ năm","Mặc nhiên có tư cách pháp nhân như công ty","Không thuộc bốn loại hình doanh nghiệp được liệt kê tại Điều 1; đăng ký và hoạt động theo quy định riêng có liên quan"],"a":3,"e":"Đáp án đúng là C. Không thuộc bốn loại hình doanh nghiệp được liệt kê tại Điều 1; đăng ký và hoạt động theo quy định riêng có liên quan. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 1 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP"},{"id":"LDN108","g":1,"lv":"NB","q":"Quyền tự do kinh doanh của doanh nghiệp được thể hiện cơ bản như thế nào?","o":["Chỉ được kinh doanh ngành nghề ghi trong Giấy chứng nhận đăng ký doanh nghiệp","Được kinh doanh cả ngành, nghề bị cấm nếu có đăng ký","Được tự do kinh doanh ngành, nghề mà luật không cấm, đồng thời phải đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện","Chỉ được kinh doanh sau khi có chấp thuận riêng cho từng giao dịch"],"a":2,"e":"Đáp án đúng là B. Được tự do kinh doanh ngành, nghề mà luật không cấm, đồng thời phải đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 7 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013"},{"id":"LDN109","g":1,"lv":"TH","q":"Doanh nghiệp đã đăng ký ngành nghề kinh doanh có điều kiện nhưng chưa đáp ứng điều kiện chuyên ngành thì nhận định nào đúng?","o":["Giấy chứng nhận đăng ký doanh nghiệp tự thay thế mọi giấy phép, điều kiện chuyên ngành","Doanh nghiệp được kinh doanh vì ngành nghề đã được ghi nhận trong hồ sơ","Doanh nghiệp được miễn điều kiện trong năm đầu hoạt động","Doanh nghiệp chỉ được tiến hành hoạt động khi đáp ứng đủ điều kiện theo pháp luật chuyên ngành"],"a":3,"e":"Đáp án đúng là C. Doanh nghiệp chỉ được tiến hành hoạt động khi đáp ứng đủ điều kiện theo pháp luật chuyên ngành. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 7 Luật Doanh nghiệp"},{"id":"LDN110","g":1,"lv":"NB","q":"Nghĩa vụ nào được Luật Doanh nghiệp đặt ra đối với doanh nghiệp?","o":["Chỉ nộp thuế khi có lợi nhuận","Chỉ báo cáo khi cơ quan nhà nước yêu cầu bằng văn bản","Thực hiện chế độ kế toán, lập và nộp báo cáo tài chính, kê khai và nộp thuế cùng các nghĩa vụ luật định","Không phải bảo đảm quyền lợi người lao động nếu doanh nghiệp nhỏ"],"a":2,"e":"Đáp án đúng là B. Thực hiện chế độ kế toán, lập và nộp báo cáo tài chính, kê khai và nộp thuế cùng các nghĩa vụ luật định. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 8 Luật Doanh nghiệp"},{"id":"LDN111","g":1,"lv":"TH","q":"Một công ty kê khai vốn điều lệ 10 tỷ đồng nhưng các thành viên chỉ góp 2 tỷ đồng, không thực hiện thủ tục điều chỉnh theo quy định. Hành vi này có thể bị nhận diện thế nào?","o":["Là quyền tự do định đoạt vốn, không bị điều chỉnh","Là hành vi kê khai khống vốn điều lệ thuộc nhóm hành vi bị nghiêm cấm","Chỉ là vi phạm nội bộ không liên quan pháp luật doanh nghiệp","Được hợp pháp hóa nếu công ty có doanh thu"],"a":1,"e":"Đáp án đúng là B. Là hành vi kê khai khống vốn điều lệ thuộc nhóm hành vi bị nghiêm cấm. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 5 Điều 16 Luật Doanh nghiệp"},{"id":"LDN112","g":1,"lv":"NB","q":"Luật Doanh nghiệp sửa đổi năm 2025 xác định chủ sở hữu hưởng lợi của doanh nghiệp có tư cách pháp nhân là ai?","o":["Người trực tiếp ký hợp đồng thuê trụ sở","Cá nhân có quyền sở hữu trên thực tế vốn điều lệ hoặc có quyền chi phối đối với doanh nghiệp, trừ trường hợp luật loại trừ","Mọi người đại diện theo pháp luật","Người đứng tên kế toán trưởng"],"a":1,"e":"Đáp án đúng là B. Cá nhân có quyền sở hữu trên thực tế vốn điều lệ hoặc có quyền chi phối đối với doanh nghiệp, trừ trường hợp luật loại trừ. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"LDN113","g":1,"lv":"TH","q":"Một cá nhân đứng tên trên hồ sơ nhưng thực tế không sở hữu vốn, không có quyền chi phối; người khác mới là người thực tế kiểm soát doanh nghiệp. Khi xác định chủ sở hữu hưởng lợi, cần căn cứ vào yếu tố nào?","o":["Chỉ căn cứ tên ghi trên Giấy chứng nhận đăng ký doanh nghiệp","Chỉ căn cứ người giữ con dấu","Quyền sở hữu trên thực tế vốn điều lệ hoặc quyền chi phối thực tế theo tiêu chí pháp luật","Chỉ căn cứ người trực tiếp điều hành hằng ngày"],"a":2,"e":"Đáp án đúng là C. Quyền sở hữu trên thực tế vốn điều lệ hoặc quyền chi phối thực tế theo tiêu chí pháp luật. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"LDN114","g":1,"lv":"NB","q":"Sau sửa đổi năm 2025, doanh nghiệp có nghĩa vụ nào liên quan đến chủ sở hữu hưởng lợi?","o":["Thu thập, cập nhật, lưu giữ thông tin và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu","Công khai toàn bộ dữ liệu cá nhân của chủ sở hữu hưởng lợi trên website","Chỉ lưu thông tin trong 30 ngày","Không phải cập nhật khi có thay đổi"],"a":0,"e":"Đáp án đúng là A. Thu thập, cập nhật, lưu giữ thông tin và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 5a Điều 8 Luật Doanh nghiệp"},{"id":"LDN115","g":1,"lv":"TH","q":"Doanh nghiệp được thành lập trước ngày 01/07/2025 phải bổ sung thông tin về chủ sở hữu hưởng lợi vào thời điểm nào theo quy định chuyển tiếp?","o":["Bắt buộc trong 10 ngày kể từ ngày 01/07/2025","Đồng thời khi thực hiện thủ tục đăng ký thay đổi hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp chủ động bổ sung sớm hơn","Chỉ khi doanh nghiệp giải thể","Không bao giờ phải bổ sung"],"a":1,"e":"Đáp án đúng là B. Đồng thời khi thực hiện thủ tục đăng ký thay đổi hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp chủ động bổ sung sớm hơn. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 1 Điều 3 Luật 76/2025/QH15"},{"id":"LDN116","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, ai có thể là người đại diện theo pháp luật của doanh nghiệp?","o":["Chỉ chủ sở hữu doanh nghiệp","Chỉ Chủ tịch Hội đồng quản trị","Cá nhân đại diện cho doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện trước cơ quan giải quyết tranh chấp theo luật","Bất kỳ người lao động nào được giao giữ con dấu"],"a":2,"e":"Đáp án đúng là C. Cá nhân đại diện cho doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện trước cơ quan giải quyết tranh chấp theo luật. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 1 Điều 12 Luật Doanh nghiệp"},{"id":"LDN117","g":1,"lv":"TH","q":"Công ty TNHH có hai người đại diện theo pháp luật. Điều lệ không phân định rõ quyền, nghĩa vụ của từng người. Đối với bên thứ ba, nguyên tắc xử lý nào được áp dụng?","o":["Mỗi người chỉ có quyền ký khi người kia đồng ý bằng văn bản","Mỗi người đại diện theo pháp luật đều là đại diện đủ thẩm quyền của doanh nghiệp trước bên thứ ba; các người đại diện chịu trách nhiệm theo quy định của luật","Chỉ người có tên đầu tiên trong Giấy chứng nhận đăng ký doanh nghiệp có quyền đại diện","Giao dịch do một người ký luôn vô hiệu"],"a":1,"e":"Đáp án đúng là B. Mỗi người đại diện theo pháp luật đều là đại diện đủ thẩm quyền của doanh nghiệp trước bên thứ ba; các người đại diện chịu trách nhiệm theo quy định của luật. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 2 Điều 12 Luật Doanh nghiệp"},{"id":"LDN118","g":1,"lv":"NB","q":"Cơ quan nào là cơ quan có thẩm quyền cấp Giấy chứng nhận đăng ký doanh nghiệp theo quy định hiện hành?","o":["Cơ quan đăng ký kinh doanh cấp tỉnh","Ủy ban nhân dân cấp xã","Tòa án nhân dân khu vực","Cơ quan thuế cấp xã"],"a":0,"e":"Đáp án đúng là A. Cơ quan đăng ký kinh doanh cấp tỉnh. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 14, Điều 26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP"},{"id":"LDN119","g":1,"lv":"TH","q":"Giấy chứng nhận đăng ký doanh nghiệp có ý nghĩa pháp lý nào?","o":["Là giấy phép cho phép doanh nghiệp kinh doanh mọi ngành nghề có điều kiện","Là văn bản ghi nhận thông tin đăng ký doanh nghiệp; không thay thế điều kiện, giấy phép chuyên ngành nếu pháp luật yêu cầu","Là chứng nhận doanh nghiệp đã hoàn thành mọi nghĩa vụ thuế","Là văn bản xác nhận doanh nghiệp không còn nghĩa vụ với chủ nợ"],"a":1,"e":"Đáp án đúng là B. Là văn bản ghi nhận thông tin đăng ký doanh nghiệp; không thay thế điều kiện, giấy phép chuyên ngành nếu pháp luật yêu cầu. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 28, Điều 7 Luật Doanh nghiệp"},{"id":"LDN120","g":1,"lv":"VD","q":"Một công ty sử dụng tài liệu giả để kê khai hồ sơ thành lập và cố ý kê khai vốn điều lệ không đúng thực tế. Nhận định nào phù hợp nhất?","o":["Đây là hành vi được phép nếu các thành viên đồng ý","Chỉ phát sinh trách nhiệm dân sự với nhau, không có hậu quả pháp lý khác","Có thể thuộc các hành vi bị nghiêm cấm và làm phát sinh trách nhiệm pháp lý theo quy định liên quan","Chỉ bị xử lý nếu doanh nghiệp đã có lãi"],"a":2,"e":"Đáp án đúng là C. Có thể thuộc các hành vi bị nghiêm cấm và làm phát sinh trách nhiệm pháp lý theo quy định liên quan. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 4, khoản 5 Điều 16 Luật Doanh nghiệp"},{"id":"TH1.01.1","cid":"TH1.01","g":1,"q":"Anh Minh có thể được xác định là thương nhân theo Luật Thương mại trên cơ sở dữ kiện nào?","o":["Chỉ vì có doanh thu thì đương nhiên là thương nhân","Vì hoạt động thương mại độc lập, thường xuyên và đáp ứng điều kiện đăng ký kinh doanh theo luật","Chỉ khi có từ 10 lao động trở lên","Chỉ khi thành lập công ty cổ phần"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Vì hoạt động thương mại độc lập, thường xuyên và đáp ứng điều kiện đăng ký kinh doanh theo luật.","b":"Khoản 1 Điều 6 Luật Thương mại"},{"id":"TH1.01.2","cid":"TH1.01","g":1,"q":"Việc chưa đăng ký kinh doanh có làm anh Minh đương nhiên được miễn trách nhiệm đối với hợp đồng đã ký không?","o":["Có, vì chưa có tư cách thương nhân","Có, nếu hợp đồng không công chứng","Không; nghĩa vụ đăng ký và trách nhiệm đối với hoạt động đã thực hiện được xem xét theo Luật Thương mại và pháp luật liên quan","Có, trừ khi bên bán chứng minh được thiệt hại"],"a":2,"e":"Phân tích tình huống: đáp án đúng là C. Không; nghĩa vụ đăng ký và trách nhiệm đối với hoạt động đã thực hiện được xem xét theo Luật Thương mại và pháp luật liên quan.","b":"Điều 7 Luật Thương mại"},{"id":"TH1.01.3","cid":"TH1.01","g":1,"q":"Nếu muốn tổ chức hoạt động dưới hình thức doanh nghiệp và giới hạn trách nhiệm tài sản theo nguyên tắc của công ty, loại hình nào có thể được cân nhắc?","o":["Doanh nghiệp tư nhân","Công ty TNHH một thành viên","Hộ kinh doanh","Chi nhánh của Công ty Ánh Dương"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Công ty TNHH một thành viên.","b":"Khoản 1 Điều 74; khoản 1 Điều 188 Luật Doanh nghiệp"},{"id":"TH1.01.4","cid":"TH1.01","g":1,"q":"Nếu anh Minh thành lập doanh nghiệp tư nhân, trách nhiệm tài sản của anh được xác định thế nào?","o":["Chỉ trong phạm vi vốn điều lệ","Bằng toàn bộ tài sản của chủ doanh nghiệp tư nhân","Chỉ bằng tài sản đã đăng ký tại trụ sở","Không chịu trách nhiệm với khoản nợ trước đăng ký"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Bằng toàn bộ tài sản của chủ doanh nghiệp tư nhân.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp"},{"id":"TH1.02.1","cid":"TH1.02","g":1,"q":"Theo Luật Doanh nghiệp đã được sửa đổi năm 2025, bà Hạnh có được thành lập và quản lý doanh nghiệp trong tình huống này không?","o":["Có, vì chỉ góp dưới 50% vốn","Có, nếu người em đồng ý","Không, vì cán bộ, công chức, viên chức thuộc nhóm bị hạn chế, trừ trường hợp ngoại lệ được luật quy định","Có, nếu công ty không kinh doanh với cơ quan nhà nước"],"a":2,"e":"Phân tích tình huống: đáp án đúng là C. Không, vì cán bộ, công chức, viên chức thuộc nhóm bị hạn chế, trừ trường hợp ngoại lệ được luật quy định.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.2","cid":"TH1.02","g":1,"q":"Việc bà Hạnh chỉ dự định góp 20% vốn có làm thay đổi kết luận về quyền góp vốn không?","o":["Có, vì tỷ lệ dưới 50% luôn được phép","Không; cần xem xét quy định về đối tượng không được góp vốn theo pháp luật cán bộ, công chức, viên chức và phòng, chống tham nhũng","Có, nếu không giữ chức danh quản lý","Có, nếu vốn góp là tài sản riêng"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Không; cần xem xét quy định về đối tượng không được góp vốn theo pháp luật cán bộ, công chức, viên chức và phòng, chống tham nhũng.","b":"Điểm b khoản 3 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.3","cid":"TH1.02","g":1,"q":"Người em của bà Hạnh có thể thành lập công ty nếu bản thân không thuộc trường hợp bị cấm không?","o":["Không, vì có quan hệ thân thích với công chức","Có, quyền của người em được xác định độc lập theo các điều kiện luật định","Chỉ được thành lập doanh nghiệp tư nhân","Chỉ được thành lập nếu bà Hạnh đứng tên đại diện"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Có, quyền của người em được xác định độc lập theo các điều kiện luật định.","b":"Khoản 1, khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.4","cid":"TH1.02","g":1,"q":"Ngoại lệ được bổ sung năm 2025 đối với cán bộ, công chức, viên chức liên quan đến lĩnh vực nào?","o":["Mọi lĩnh vực kinh doanh có điều kiện","Bất động sản và chứng khoán","Khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia theo quy định pháp luật","Chỉ hoạt động thương mại điện tử"],"a":2,"e":"Phân tích tình huống: đáp án đúng là C. Khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia theo quy định pháp luật.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.03.1","cid":"TH1.03","g":1,"q":"Ai có thể được xác định là chủ sở hữu hưởng lợi của Công ty Sao Bắc theo tiêu chí luật định?","o":["Chỉ ông Nam vì là người đứng tên 60% vốn","Ông Phúc nếu chứng minh được quyền sở hữu trên thực tế vốn hoặc quyền chi phối đối với công ty","Chỉ bà Hoa vì là người đứng tên vốn thấp hơn","Kế toán trưởng công ty"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Ông Phúc nếu chứng minh được quyền sở hữu trên thực tế vốn hoặc quyền chi phối đối với công ty.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"TH1.03.2","cid":"TH1.03","g":1,"q":"Luật Doanh nghiệp sửa đổi năm 2025 đặt ra nghĩa vụ nào đối với thông tin chủ sở hữu hưởng lợi?","o":["Thu thập, cập nhật, lưu giữ và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu","Chỉ ghi nhận khi công ty phát hành cổ phần","Không cần lưu giữ nếu đã có người đại diện theo pháp luật","Chỉ công khai trên website doanh nghiệp"],"a":0,"e":"Phân tích tình huống: đáp án đúng là A. Thu thập, cập nhật, lưu giữ và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu.","b":"Khoản 5a Điều 8; điểm h khoản 1 Điều 11 Luật Doanh nghiệp"},{"id":"TH1.03.3","cid":"TH1.03","g":1,"q":"Công ty thành lập trước ngày 01/07/2025 phải bổ sung thông tin chủ sở hữu hưởng lợi vào thời điểm nào?","o":["Trong 03 ngày từ khi luật có hiệu lực","Đồng thời với lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn","Chỉ khi thay đổi chủ tịch công ty","Chỉ khi cơ quan thuế yêu cầu"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Đồng thời với lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn.","b":"Khoản 1 Điều 3 Luật 76/2025/QH15"},{"id":"TH1.03.4","cid":"TH1.03","g":1,"q":"Nhận định nào đúng về trách nhiệm đối với thông tin kê khai?","o":["Chỉ cơ quan đăng ký kinh doanh chịu trách nhiệm về tính chính xác","Người thành lập hoặc doanh nghiệp tự kê khai và chịu trách nhiệm trước pháp luật về tính hợp pháp, trung thực, chính xác theo quy định","Người đứng tên hộ đương nhiên không phải chịu trách nhiệm","Có thể kê khai người khác là chủ sở hữu hưởng lợi nếu được đồng ý"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Người thành lập hoặc doanh nghiệp tự kê khai và chịu trách nhiệm trước pháp luật về tính hợp pháp, trung thực, chính xác theo quy định.","b":"Điều 4 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP"}],"th":[{"name":"Chương 1 · Tình huống 1","items":[{"cid":"TH1.01","title":"Cá nhân kinh doanh và tư cách thương nhân","text":"Từ tháng 01/2025, anh Minh tại thành phố Bắc Ninh thường xuyên mua thiết bị điện từ nhiều nhà phân phối để bán lại qua cửa hàng và nền tảng trực tuyến. Anh hoạt động độc lập, có doanh thu đều đặn nhưng chưa đăng ký hộ kinh doanh hoặc doanh nghiệp. Tháng 10/2026, anh ký hợp đồng mua 300 bộ thiết bị của Công ty Ánh Dương để bán lại; sau khi nhận hàng, anh không thanh toán đủ và cho rằng mình không phải thương nhân vì chưa đăng ký. Anh dự định mở rộng hoạt động, thuê thêm lao động và muốn tách bạch tài sản cá nhân với tài sản kinh doanh.","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]}]},{"name":"Chương 1 · Tình huống 2","items":[{"cid":"TH1.02","title":"Người có quyền thành lập và quản lý doanh nghiệp","text":"Bà Hạnh là công chức đang công tác tại một cơ quan chuyên môn thuộc UBND cấp tỉnh. Bà dự định cùng người em thành lập Công ty TNHH Minh Hà, đứng tên thành viên góp vốn và trực tiếp giữ Giám đốc. Người em của bà là cá nhân đủ năng lực hành vi dân sự, không thuộc trường hợp bị cấm. Bà Hạnh cho rằng mình được quyền tham gia vì chỉ góp 20% vốn và không sử dụng tài sản công. Dự kiến hoạt động của công ty thuộc lĩnh vực tư vấn quản lý thông thường, không thuộc lĩnh vực khoa học, công nghệ, đổi mới sáng tạo hoặc chuyển đổi số.","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]}]},{"name":"Chương 1 · Tình huống 3","items":[{"cid":"TH1.03","title":"Chủ sở hữu hưởng lợi và kê khai thông tin doanh nghiệp","text":"Công ty TNHH Sao Bắc được thành lập năm 2023. Trên hồ sơ đăng ký, ông Nam đứng tên sở hữu 60% vốn điều lệ, bà Hoa sở hữu 40%. Tuy nhiên, theo thỏa thuận nội bộ và việc kiểm soát thực tế, ông Phúc là người bỏ vốn thực tế, quyết định các vấn đề trọng yếu và có quyền chi phối hoạt động công ty; ông Nam chỉ đứng tên hộ. Tháng 10/2026, công ty thực hiện thủ tục thay đổi địa chỉ trụ sở chính. Người đại diện theo pháp luật cho rằng doanh nghiệp thành lập trước ngày 01/07/2025 nên không phải cập nhật thông tin chủ sở hữu hưởng lợi.","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]}],"vb":[{"name":"I. Luật Doanh nghiệp và văn bản sửa đổi, hợp nhất","rows":[{"t":"Luật Doanh nghiệp số 59/2020/QH14","d":"17/06/2020","note":"Có hiệu lực 01/01/2021; nội dung hiện hành tra cứu theo VBHN 67/VBHN-VPQH.","url":"https://chinhphu.vn/?classid=1&docid=200447&pageid=27160"},{"t":"Luật số 03/2022/QH15","d":"11/01/2022","note":"Có hiệu lực 01/03/2022; sửa đổi một số điều của Luật Doanh nghiệp và các luật khác.","url":"https://vanban.chinhphu.vn/?docid=206167&pageid=27160"},{"t":"Luật số 76/2025/QH15","d":"17/06/2025","note":"Có hiệu lực 01/07/2025; sửa đổi, bổ sung một số điều của Luật Doanh nghiệp.","url":"https://chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"t":"Văn bản hợp nhất số 67/VBHN-VPQH","d":"15/08/2025","note":"Hợp nhất Luật Doanh nghiệp 2020 sau sửa đổi bởi Luật 03/2022/QH15 và Luật 76/2025/QH15; dùng làm văn bản tra cứu chính.","url":"https://congbao.chinhphu.vn/cong-bao/cong-bao-so-1105-1106-ngay-31-08-2025-45864.htm"}]},{"name":"II. Đăng ký doanh nghiệp và đầu tư","rows":[{"t":"Nghị định số 168/2025/NĐ-CP","d":"30/06/2025","note":"Có hiệu lực 01/07/2025; quy định về đăng ký doanh nghiệp, thay thế Nghị định 01/2021/NĐ-CP.","url":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"t":"Nghị định số 296/2026/NĐ-CP","d":"23/07/2026","note":"Có hiệu lực 23/07/2026; sửa đổi, bổ sung một số điều của Nghị định 168/2025/NĐ-CP.","url":"https://chinhphu.vn/?classid=1&docid=218986&orggroupid=2&pageid=27160"},{"t":"Luật Đầu tư số 143/2025/QH15","d":"11/12/2025","note":"Có hiệu lực 01/03/2026; căn cứ đối chiếu điều kiện đầu tư, nhà đầu tư và hoạt động đầu tư kinh doanh.","url":"https://vanban.chinhphu.vn/?docid=216524&pageid=27160"}]},{"name":"III. Tổ chức quản trị và vốn nhà nước tại doanh nghiệp","rows":[{"t":"Luật Quản lý và đầu tư vốn nhà nước tại doanh nghiệp số 68/2025/QH15","d":"14/06/2025","note":"Có hiệu lực 01/08/2025; luật nền tảng về đầu tư và quản lý vốn nhà nước tại doanh nghiệp.","url":"https://chinhphu.vn/?classid=1&docid=214597&pageid=27160&typegroupid=3"},{"t":"Văn bản hợp nhất số 60/VBHN-VPQH","d":"23/03/2026","note":"Hợp nhất Luật 68/2025/QH15 sau sửa đổi, bổ sung bởi Luật Công nghệ cao 133/2025/QH15; tra cứu tình trạng pháp luật hiện hành.","url":"https://chinhphu.vn/?classid=2629&docid=217300&pageid=27160"},{"t":"Nghị định số 366/2025/NĐ-CP","d":"31/12/2025","note":"Có hiệu lực 01/01/2026; quy định về quản lý và đầu tư vốn nhà nước tại doanh nghiệp.","url":"https://chinhphu.vn/?classid=1&docid=216383&pageid=27160&typegroupid=4"},{"t":"Luật Chứng khoán số 54/2019/QH14","d":"26/11/2019","note":"Có hiệu lực 01/01/2021; áp dụng cùng Luật 56/2024/QH15 đối với công ty đại chúng, chào bán và thị trường chứng khoán.","url":"https://vanban.chinhphu.vn/?classid=1&docid=198541&pageid=27160&typegroupid=3"},{"t":"Luật số 56/2024/QH15","d":"29/11/2024","note":"Có hiệu lực 01/01/2025; sửa đổi, bổ sung một số điều của Luật Chứng khoán và các luật liên quan.","url":"https://congbao.chinhphu.vn/van-ban/luat-so-56-2024-qh15-43561/53650.htm"}]},{"name":"IV. Phục hồi, phá sản và pháp luật liên quan","rows":[{"t":"Luật Phục hồi, phá sản số 142/2025/QH15","d":"11/12/2025","note":"Có hiệu lực 01/03/2026; thay thế Luật Phá sản 2014; ưu tiên thủ tục phục hồi và quy định tiêu chí mất khả năng thanh toán theo mốc 06 tháng.","url":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"t":"Bộ luật Dân sự số 91/2015/QH13","d":"24/11/2015","note":"Có hiệu lực 01/01/2017; căn cứ chung về pháp nhân, tài sản, đại diện và giao dịch.","url":"https://chinhphu.vn/default.aspx?docid=183188&pageid=27160"},{"t":"Luật Thương mại số 36/2005/QH11","d":"27/06/2005","note":"Có hiệu lực 01/01/2006; căn cứ phân biệt thương nhân, hoạt động thương mại và doanh nghiệp.","url":"https://vanban.chinhphu.vn/?classid=1&docid=14765&pageid=27160"},{"t":"Luật Hợp tác xã số 17/2023/QH15","d":"20/06/2023","note":"Có hiệu lực 01/07/2024; dùng để phân biệt hợp tác xã với các loại hình doanh nghiệp.","url":"https://vanban.chinhphu.vn/?docid=208365&pageid=27160"}]}],"ly":{"root":"Luật Doanh nghiệp","sub":"Hệ thống kiến thức pháp luật doanh nghiệp Việt Nam; mốc đối chiếu 01/11/2026","updT":"Các điểm cập nhật pháp luật cần lưu ý","upd":{"t":"Các điểm cập nhật pháp luật cần lưu ý","cs":"Căn cứ: VBHN 67/VBHN-VPQH; Luật 76/2025/QH15; Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP; VBHN 60/VBHN-VPQH; Luật 142/2025/QH15.","b":["Luật Doanh nghiệp số 59/2020/QH14 được sửa đổi, bổ sung bởi Luật số 03/2022/QH15 và Luật số 76/2025/QH15; sử dụng VBHN 67/VBHN-VPQH ngày 15/08/2025 để tra cứu nội dung hợp nhất.","Luật số 76/2025/QH15 bổ sung quy định về chủ sở hữu hưởng lợi, trách nhiệm cá nhân của người đại diện theo pháp luật, kê khai đăng ký doanh nghiệp và một số điều kiện đối với chủ thể thành lập, góp vốn.","Thủ tục đăng ký doanh nghiệp áp dụng Nghị định 168/2025/NĐ-CP, được sửa đổi, bổ sung bởi Nghị định 296/2026/NĐ-CP; không tiếp tục dùng Nghị định 01/2021/NĐ-CP làm căn cứ hiện hành.","Quản lý và đầu tư vốn nhà nước tại doanh nghiệp phải đối chiếu VBHN 60/VBHN-VPQH ngày 23/03/2026 và Nghị định 366/2025/NĐ-CP; không tiếp tục lấy Luật 69/2014/QH13 làm căn cứ hiện hành.","Phục hồi, phá sản áp dụng Luật 142/2025/QH15 từ ngày 01/03/2026; tiêu chí nguy cơ mất khả năng thanh toán và mất khả năng thanh toán đã thay đổi so với Luật Phá sản 2014."]},"ch":[{"t":"1. Địa vị pháp lý của doanh nghiệp và những vấn đề chung","cs":"Căn cứ: Điều 1–18 Luật Doanh nghiệp; Điều 3, 6, 7 Luật Thương mại; Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":["Pháp luật doanh nghiệp điều chỉnh việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; đồng thời điều chỉnh nhóm công ty.","Doanh nghiệp là tổ chức có tên riêng, tài sản, trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo pháp luật nhằm mục đích kinh doanh.","Bốn loại hình doanh nghiệp gồm công ty trách nhiệm hữu hạn, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân; không đồng nhất doanh nghiệp với hộ kinh doanh hoặc hợp tác xã.","Doanh nghiệp có quyền tự do kinh doanh ngành, nghề luật không cấm; đồng thời phải thực hiện nghĩa vụ đăng ký, thuế, kế toán, lao động và điều kiện kinh doanh chuyên ngành.","Luật 76/2025/QH15 làm nổi bật nghĩa vụ kê khai, lưu giữ thông tin chủ sở hữu hưởng lợi và trách nhiệm cá nhân của người đại diện theo pháp luật."],"c":[{"t":"1.1. Phạm vi điều chỉnh, đối tượng áp dụng và nguyên tắc áp dụng luật","cs":"Căn cứ: Điều 1–3 Luật Doanh nghiệp","b":["Phạm vi điều chỉnh bao gồm toàn bộ vòng đời pháp lý cơ bản của doanh nghiệp: thành lập, quản trị, tổ chức lại, giải thể và hoạt động liên quan.","Đối tượng áp dụng không chỉ là doanh nghiệp mà còn gồm cơ quan, tổ chức, cá nhân có liên quan.","Khi luật chuyên ngành có quy định đặc thù về thành lập, quản lý, tổ chức lại, giải thể hoặc hoạt động doanh nghiệp thì xác định luật áp dụng theo Điều 3."],"c":[]},{"t":"1.2. Khái niệm doanh nghiệp và các loại hình doanh nghiệp","cs":"Căn cứ: Khoản 10 Điều 4; Điều 46, 74, 111, 177, 188 Luật Doanh nghiệp","b":["Doanh nghiệp phải có tên riêng, tài sản, trụ sở giao dịch và được thành lập hoặc đăng ký thành lập theo quy định pháp luật nhằm mục đích kinh doanh.","Công ty TNHH có loại một thành viên và hai thành viên trở lên; công ty cổ phần có vốn điều lệ chia thành cổ phần; công ty hợp danh có thành viên hợp danh; doanh nghiệp tư nhân do một cá nhân làm chủ.","Loại hình doanh nghiệp quyết định chế độ trách nhiệm tài sản, cơ cấu quản trị, khả năng huy động vốn và quyền chuyển nhượng vốn."],"c":[]},{"t":"1.3. Phân biệt doanh nghiệp, thương nhân, hộ kinh doanh và hợp tác xã","cs":"Căn cứ: Điều 1, 4 Luật Doanh nghiệp; Điều 6, 7 Luật Thương mại; Luật Hợp tác xã 2023; Nghị định 168/2025/NĐ-CP","b":["Doanh nghiệp là tổ chức được thành lập theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế thành lập hợp pháp hoặc cá nhân hoạt động thương mại độc lập, thường xuyên và có đăng ký kinh doanh.","Hộ kinh doanh đăng ký và hoạt động theo quy định riêng; không phải là một trong bốn loại hình doanh nghiệp tại Điều 1 Luật Doanh nghiệp.","Hợp tác xã là tổ chức kinh tế tập thể, có tư cách pháp nhân và hoạt động theo Luật Hợp tác xã; không phải một loại hình công ty theo Luật Doanh nghiệp."],"c":[]},{"t":"1.4. Quyền và nghĩa vụ cơ bản của doanh nghiệp","cs":"Căn cứ: Điều 7, 8 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013","b":["Doanh nghiệp được tự do kinh doanh ngành, nghề mà luật không cấm; chủ động lựa chọn hình thức, phương thức, địa bàn và ngành nghề kinh doanh.","Quyền tự do kinh doanh không loại trừ nghĩa vụ đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện.","Doanh nghiệp phải thực hiện nghĩa vụ đăng ký, kê khai trung thực, tổ chức kế toán, nộp thuế, bảo đảm quyền lợi người lao động và nghĩa vụ khác theo luật."],"c":[]},{"t":"1.5. Người đại diện theo pháp luật của doanh nghiệp","cs":"Căn cứ: Điều 12, 13 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Người đại diện theo pháp luật là cá nhân đại diện doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện doanh nghiệp với tư cách người yêu cầu giải quyết việc dân sự, nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan trước Trọng tài, Tòa án.","Công ty TNHH và công ty cổ phần có thể có một hoặc nhiều người đại diện theo pháp luật; số lượng, chức danh, quyền và nghĩa vụ được xác định theo Luật và Điều lệ.","Người đại diện phải thực hiện quyền, nghĩa vụ trung thực, cẩn trọng, trung thành; Luật 76/2025/QH15 quy định trách nhiệm cá nhân đối với thiệt hại do vi phạm nghĩa vụ."],"c":[]},{"t":"1.6. Chủ sở hữu hưởng lợi của doanh nghiệp","cs":"Căn cứ: Khoản 35 Điều 4; Điều 8, 11, 25 Luật Doanh nghiệp; Điều 17 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP","b":["Chủ sở hữu hưởng lợi là cá nhân có quyền sở hữu thực tế vốn điều lệ hoặc có quyền chi phối doanh nghiệp theo tiêu chí luật định.","Nghị định 168/2025/NĐ-CP xác định tiêu chí sở hữu trực tiếp hoặc gián tiếp từ 25% vốn điều lệ hoặc 25% tổng số cổ phần có quyền biểu quyết trở lên, hoặc có quyền chi phối một số quyết định quản trị quan trọng.","Doanh nghiệp có nghĩa vụ thu thập, cập nhật, lưu giữ và cung cấp thông tin chủ sở hữu hưởng lợi cho cơ quan nhà nước có thẩm quyền."],"c":[]},{"t":"1.7. Các hành vi bị nghiêm cấm trong hoạt động doanh nghiệp","cs":"Căn cứ: Điều 16 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15","b":["Kê khai giả mạo, không trung thực hoặc không chính xác hồ sơ đăng ký doanh nghiệp và hồ sơ thay đổi nội dung đăng ký.","Kê khai khống vốn điều lệ do không góp đủ vốn đã đăng ký mà không điều chỉnh theo luật; cố ý định giá tài sản góp vốn không đúng giá trị.","Cấm thực hiện hoạt động kinh doanh bị cấm, kinh doanh không đủ điều kiện và hành vi bị pháp luật chuyên ngành nghiêm cấm."],"c":[]}]},{"t":"2. Thành lập, đăng ký doanh nghiệp và vốn góp","cs":"Căn cứ: Điều 17–45 Luật Doanh nghiệp; Điều 34–36 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP; Luật Đầu tư 143/2025/QH15","b":["Quyền thành lập, quản lý doanh nghiệp và quyền góp vốn, mua cổ phần, mua phần vốn góp phải được xem xét độc lập theo điều kiện và nhóm chủ thể bị hạn chế hoặc cấm.","Đăng ký doanh nghiệp là thủ tục pháp lý ghi nhận thông tin doanh nghiệp; không thay thế giấy phép, chứng nhận hoặc điều kiện kinh doanh chuyên ngành.","Hồ sơ, trình tự, phương thức đăng ký và thay đổi thông tin thực hiện theo Luật Doanh nghiệp và Nghị định 168/2025/NĐ-CP đã được sửa đổi năm 2026.","Vốn góp có thể bằng tiền, vàng, quyền sử dụng đất, quyền sở hữu trí tuệ, công nghệ, bí quyết kỹ thuật và tài sản khác định giá được bằng Đồng Việt Nam; việc góp vốn phải hoàn tất theo thời hạn riêng của từng loại hình."],"c":[{"t":"2.1. Quyền thành lập, quản lý doanh nghiệp và quyền góp vốn","cs":"Căn cứ: Điều 17 Luật Doanh nghiệp, được sửa đổi bởi Luật 76/2025/QH15; Luật Đầu tư 143/2025/QH15","b":["Cá nhân, tổ chức có quyền thành lập và quản lý doanh nghiệp, trừ các trường hợp bị cấm hoặc hạn chế theo luật.","Cán bộ, công chức, viên chức và các chủ thể khác phải được đối chiếu với quy định chuyên ngành; Luật 76/2025/QH15 có ngoại lệ liên quan hoạt động khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số theo luật.","Quyền góp vốn, mua cổ phần, mua phần vốn góp có nhóm hạn chế riêng; không suy luận quyền góp vốn hoàn toàn đồng nhất với quyền thành lập, quản lý."],"c":[]},{"t":"2.2. Hồ sơ và trình tự đăng ký doanh nghiệp","cs":"Căn cứ: Điều 18–26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP","b":["Hồ sơ đăng ký phụ thuộc loại hình doanh nghiệp, bao gồm giấy đề nghị đăng ký, Điều lệ và danh sách thành viên hoặc cổ đông theo trường hợp.","Người thành lập doanh nghiệp hoặc doanh nghiệp tự kê khai và chịu trách nhiệm về tính hợp pháp, trung thực, chính xác của thông tin trong hồ sơ.","Đăng ký qua mạng thông tin điện tử được thực hiện theo yêu cầu về tài liệu điện tử, kê khai và ký số hoặc xác thực theo quy định.","Cơ quan đăng ký kinh doanh cấp tỉnh xem xét tính hợp lệ của hồ sơ; thời hạn xử lý thông thường là 03 ngày làm việc kể từ khi nhận hồ sơ hợp lệ theo Nghị định 168/2025/NĐ-CP."],"c":[]},{"t":"2.3. Tên, trụ sở và thông tin đăng ký doanh nghiệp","cs":"Căn cứ: Điều 28–45 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Tên doanh nghiệp gồm loại hình doanh nghiệp và tên riêng; không được đặt tên trùng hoặc gây nhầm lẫn, vi phạm điều cấm của luật.","Trụ sở chính phải ở Việt Nam, có địa chỉ liên lạc xác định theo đơn vị hành chính và thông tin liên hệ theo quy định.","Doanh nghiệp đăng ký ngành, nghề kinh doanh và phải đáp ứng điều kiện chuyên ngành trước khi kinh doanh ngành, nghề có điều kiện.","Chi nhánh, văn phòng đại diện và địa điểm kinh doanh là đơn vị phụ thuộc; không mặc nhiên có tư cách pháp nhân độc lập."],"c":[]},{"t":"2.4. Tài sản góp vốn, định giá và chuyển quyền sở hữu","cs":"Căn cứ: Điều 34–36 Luật Doanh nghiệp; BLDS 2015","b":["Tài sản góp vốn gồm Đồng Việt Nam, ngoại tệ tự do chuyển đổi, vàng, quyền sử dụng đất, quyền sở hữu trí tuệ, công nghệ, bí quyết kỹ thuật và tài sản khác định giá được bằng Đồng Việt Nam.","Chỉ chủ sở hữu hoặc người có quyền sử dụng hợp pháp mới có quyền dùng tài sản để góp vốn; tài sản phải được chuyển quyền sở hữu hoặc quyền sử dụng cho công ty theo luật.","Tài sản không phải tiền, vàng hoặc ngoại tệ phải được định giá theo thỏa thuận hoặc thông qua tổ chức thẩm định giá; cố ý định giá cao hơn giá trị thực tế có thể phát sinh trách nhiệm."],"c":[]},{"t":"2.5. Thời hạn góp vốn và xử lý việc không góp đủ vốn","cs":"Căn cứ: Điều 35–36, Điều 47, 75, 113 và quy định tương ứng về từng loại hình Luật Doanh nghiệp","b":["Thời hạn góp vốn không áp dụng một cách máy móc cho mọi loại hình; phải xác định theo quy định riêng của công ty TNHH, công ty cổ phần, công ty hợp danh hoặc doanh nghiệp tư nhân.","Đối với công ty TNHH và công ty cổ phần, mốc góp đủ vốn hoặc thanh toán cổ phần đã đăng ký về cơ bản là 90 ngày, trừ trường hợp luật quy định khác.","Khi không góp đủ vốn đúng hạn, doanh nghiệp phải điều chỉnh vốn điều lệ, danh sách thành viên hoặc cổ đông và xử lý trách nhiệm tương ứng; không được duy trì vốn đăng ký khống."],"c":[]},{"t":"2.6. Đăng ký thay đổi và thông tin chủ sở hữu hưởng lợi","cs":"Căn cứ: Điều 25, 30–31 Luật Doanh nghiệp; Điều 17 và quy định hồ sơ tại Nghị định 168/2025/NĐ-CP; Nghị định 296/2026/NĐ-CP","b":["Doanh nghiệp phải đăng ký hoặc thông báo khi thay đổi nội dung đăng ký thuộc trường hợp luật định.","Hồ sơ có thể phải cập nhật danh sách chủ sở hữu hưởng lợi và thông tin để xác định cá nhân sở hữu hoặc chi phối doanh nghiệp.","Doanh nghiệp thành lập trước ngày 01/07/2025 thực hiện bổ sung thông tin chủ sở hữu hưởng lợi theo quy định chuyển tiếp, gắn với lần đăng ký hoặc thông báo thay đổi gần nhất, trừ trường hợp chủ động bổ sung sớm."],"c":[]}]},{"t":"3. Công ty trách nhiệm hữu hạn","cs":"Căn cứ: Điều 46–87 Luật Doanh nghiệp; VBHN 67/VBHN-VPQH","b":["Công ty TNHH có tư cách pháp nhân kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp; thành viên hoặc chủ sở hữu chịu trách nhiệm về các khoản nợ trong phạm vi vốn góp hoặc vốn điều lệ theo luật.","Công ty TNHH hai thành viên trở lên có từ 02 đến 50 thành viên; công ty TNHH một thành viên do một tổ chức hoặc một cá nhân làm chủ sở hữu.","Vốn điều lệ không chia thành cổ phần; việc chuyển nhượng phần vốn góp bị giới hạn theo cơ chế luật định và Điều lệ.","Cơ cấu tổ chức quản lý khác nhau giữa công ty TNHH một thành viên và công ty TNHH hai thành viên trở lên."],"c":[{"t":"3.1. Đặc điểm pháp lý và chế độ trách nhiệm","cs":"Căn cứ: Điều 46, 74 Luật Doanh nghiệp; BLDS 2015","b":["Công ty TNHH là pháp nhân độc lập; tài sản của công ty tách biệt với tài sản của thành viên hoặc chủ sở hữu.","Thành viên công ty TNHH hai thành viên trở lên chịu trách nhiệm trong phạm vi phần vốn đã góp, trừ trường hợp luật quy định trách nhiệm khác.","Công ty TNHH một thành viên do một tổ chức hoặc cá nhân làm chủ; chủ sở hữu chịu trách nhiệm trong phạm vi vốn điều lệ theo quy định."],"c":[]},{"t":"3.2. Công ty TNHH hai thành viên trở lên: thành viên và vốn góp","cs":"Căn cứ: Điều 46–53 Luật Doanh nghiệp","b":["Số lượng thành viên từ 02 đến 50; thành viên có thể là tổ chức hoặc cá nhân.","Thành viên góp đủ và đúng loại tài sản đã cam kết trong thời hạn luật định; phần vốn chưa góp được xử lý theo Điều 47.","Thành viên được cấp giấy chứng nhận phần vốn góp và có quyền yêu cầu công ty cung cấp thông tin, phân chia lợi nhuận, định đoạt phần vốn theo luật."],"c":[]},{"t":"3.3. Chuyển nhượng, mua lại và thay đổi phần vốn góp","cs":"Căn cứ: Điều 51–53, Điều 68 Luật Doanh nghiệp","b":["Thành viên có quyền yêu cầu công ty mua lại phần vốn góp trong các trường hợp luật định, nhất là khi không tán thành nghị quyết, quyết định về vấn đề thuộc phạm vi luật quy định.","Việc chuyển nhượng phần vốn góp phải tuân thủ trình tự ưu tiên chào bán cho thành viên còn lại và điều kiện chuyển nhượng theo Điều 52, trừ trường hợp luật có quy định khác.","Công ty có thể tăng hoặc giảm vốn điều lệ theo các căn cứ và thủ tục tại Luật Doanh nghiệp; việc giảm vốn không được làm ảnh hưởng trái luật đến khả năng thanh toán."],"c":[]},{"t":"3.4. Tổ chức quản lý công ty TNHH hai thành viên trở lên","cs":"Căn cứ: Điều 54–67 Luật Doanh nghiệp","b":["Cơ cấu cơ bản gồm Hội đồng thành viên, Chủ tịch Hội đồng thành viên và Giám đốc hoặc Tổng giám đốc; Ban kiểm soát được tổ chức trong trường hợp luật định.","Hội đồng thành viên là cơ quan quyết định cao nhất, gồm tất cả thành viên công ty; quyền và nhiệm vụ được xác định theo Luật và Điều lệ.","Nghị quyết, quyết định của Hội đồng thành viên phải tuân thủ điều kiện họp, tỷ lệ biểu quyết và thủ tục thông qua theo luật, Điều lệ."],"c":[]},{"t":"3.5. Công ty TNHH một thành viên: chủ sở hữu và cơ cấu quản lý","cs":"Căn cứ: Điều 74–87 Luật Doanh nghiệp","b":["Chủ sở hữu có quyền quyết định Điều lệ, chiến lược, cơ cấu quản lý, bổ nhiệm người quản lý và các vấn đề thuộc thẩm quyền.","Nếu chủ sở hữu là tổ chức, mô hình quản lý được tổ chức theo Hội đồng thành viên hoặc Chủ tịch công ty cùng Giám đốc/Tổng giám đốc và Kiểm soát viên theo luật.","Nếu chủ sở hữu là cá nhân, cơ cấu quản lý gồm Chủ tịch công ty và Giám đốc/Tổng giám đốc; chủ sở hữu có thể kiêm nhiệm theo điều kiện luật định.","Khi chuyển nhượng một phần hoặc toàn bộ vốn điều lệ, công ty phải tổ chức lại hoặc đăng ký thay đổi loại hình phù hợp."],"c":[]}]},{"t":"4. Công ty cổ phần","cs":"Căn cứ: Điều 111–176 Luật Doanh nghiệp; Luật Chứng khoán 2019 được sửa đổi bởi Luật 56/2024/QH15","b":["Công ty cổ phần có vốn điều lệ chia thành cổ phần, có tối thiểu 03 cổ đông và không hạn chế số lượng tối đa; cổ đông chịu trách nhiệm trong phạm vi vốn đã góp.","Công ty cổ phần có tư cách pháp nhân; có quyền phát hành cổ phần, trái phiếu và các loại chứng khoán khác theo điều kiện luật định.","Quản trị công ty cổ phần dựa trên Đại hội đồng cổ đông, Hội đồng quản trị, Giám đốc/Tổng giám đốc và cơ chế Ban kiểm soát hoặc Ủy ban kiểm toán tùy mô hình.","Quyền cổ đông, chuyển nhượng cổ phần, chào bán chứng khoán, công bố thông tin và giao dịch với người có liên quan phải được xem xét theo Luật Doanh nghiệp và pháp luật chứng khoán."],"c":[{"t":"4.1. Đặc điểm pháp lý, vốn điều lệ và cổ phần","cs":"Căn cứ: Điều 111–120 Luật Doanh nghiệp","b":["Vốn điều lệ được chia thành nhiều phần bằng nhau gọi là cổ phần; người sở hữu cổ phần là cổ đông.","Công ty phải có ít nhất 03 cổ đông; cổ đông có thể là tổ chức hoặc cá nhân và không bị giới hạn số lượng tối đa.","Cổ phần phổ thông là loại cổ phần bắt buộc; công ty có thể có cổ phần ưu đãi theo điều kiện của luật."],"c":[]},{"t":"4.2. Quyền và nghĩa vụ của cổ đông","cs":"Căn cứ: Điều 115–119 Luật Doanh nghiệp","b":["Cổ đông phổ thông có quyền dự họp, biểu quyết, nhận cổ tức, ưu tiên mua cổ phần mới và tiếp cận thông tin theo điều kiện luật định.","Cổ đông hoặc nhóm cổ đông đạt tỷ lệ sở hữu và thời gian nắm giữ theo luật có các quyền đặc biệt như yêu cầu triệu tập họp, xem xét tài liệu và đề cử người quản lý.","Cổ đông phải thanh toán đủ số cổ phần đã đăng ký mua và tuân thủ Điều lệ, nghị quyết hợp pháp của công ty."],"c":[]},{"t":"4.3. Chào bán cổ phần, phát hành chứng khoán và cổ tức","cs":"Căn cứ: Điều 123–135, 148–150 Luật Doanh nghiệp; Luật Chứng khoán 2019 và Luật 56/2024/QH15","b":["Công ty có thể chào bán cổ phần cho cổ đông hiện hữu, chào bán riêng lẻ hoặc chào bán ra công chúng theo điều kiện tương ứng.","Việc chào bán ra công chúng, đăng ký công ty đại chúng, niêm yết và công bố thông tin còn chịu sự điều chỉnh của pháp luật chứng khoán.","Cổ tức chỉ được trả khi công ty đáp ứng điều kiện về lợi nhuận, hoàn thành nghĩa vụ tài chính và bảo đảm khả năng thanh toán sau khi trả."],"c":[]},{"t":"4.4. Đại hội đồng cổ đông và Hội đồng quản trị","cs":"Căn cứ: Điều 138–165 Luật Doanh nghiệp","b":["Đại hội đồng cổ đông gồm tất cả cổ đông có quyền biểu quyết và là cơ quan quyết định cao nhất của công ty cổ phần.","Hội đồng quản trị là cơ quan quản lý công ty, có quyền nhân danh công ty quyết định và thực hiện quyền, nghĩa vụ không thuộc thẩm quyền Đại hội đồng cổ đông.","Điều kiện tiến hành họp, tỷ lệ thông qua nghị quyết, hình thức lấy ý kiến bằng văn bản và quyền yêu cầu hủy nghị quyết phải tuân thủ luật và Điều lệ."],"c":[]},{"t":"4.5. Giám đốc, Ủy ban kiểm toán, Ban kiểm soát và giao dịch có liên quan","cs":"Căn cứ: Điều 162–176 Luật Doanh nghiệp; Luật Chứng khoán 2019","b":["Giám đốc hoặc Tổng giám đốc điều hành hoạt động kinh doanh hằng ngày và chịu sự giám sát của Hội đồng quản trị.","Công ty lựa chọn mô hình quản trị có Ban kiểm soát hoặc mô hình có Ủy ban kiểm toán trực thuộc Hội đồng quản trị theo điều kiện luật định.","Giao dịch với người có liên quan phải được nhận diện, công khai và chấp thuận đúng thẩm quyền nhằm phòng ngừa xung đột lợi ích."],"c":[]}]},{"t":"5. Công ty hợp danh và doanh nghiệp tư nhân","cs":"Căn cứ: Điều 177–193 Luật Doanh nghiệp; BLDS 2015; Luật Thương mại 2005","b":["Công ty hợp danh phải có ít nhất 02 thành viên hợp danh là cá nhân; thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản của mình về nghĩa vụ công ty.","Thành viên góp vốn của công ty hợp danh chịu trách nhiệm trong phạm vi vốn đã cam kết góp; công ty hợp danh có tư cách pháp nhân nhưng không được phát hành chứng khoán.","Doanh nghiệp tư nhân do một cá nhân làm chủ và chủ doanh nghiệp chịu trách nhiệm bằng toàn bộ tài sản; doanh nghiệp tư nhân không có tư cách pháp nhân.","Hai loại hình này có chế độ trách nhiệm tài sản khác biệt căn bản với công ty TNHH và công ty cổ phần."],"c":[{"t":"5.1. Công ty hợp danh: thành viên và tư cách pháp lý","cs":"Căn cứ: Điều 177–178 Luật Doanh nghiệp","b":["Công ty hợp danh có ít nhất 02 thành viên hợp danh là chủ sở hữu chung của công ty, cùng kinh doanh dưới một tên chung; có thể có thành viên góp vốn.","Thành viên hợp danh phải là cá nhân; thành viên góp vốn có thể là tổ chức hoặc cá nhân.","Công ty hợp danh có tư cách pháp nhân kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp."],"c":[]},{"t":"5.2. Trách nhiệm tài sản và quyền, nghĩa vụ của thành viên hợp danh","cs":"Căn cứ: Điều 179–182 Luật Doanh nghiệp","b":["Thành viên hợp danh liên đới chịu trách nhiệm bằng toàn bộ tài sản của mình về nghĩa vụ công ty.","Thành viên góp vốn chịu trách nhiệm trong phạm vi số vốn đã cam kết góp; không tham gia quản lý công ty như thành viên hợp danh.","Thành viên hợp danh bị hạn chế thực hiện hoạt động cạnh tranh, nhân danh cá nhân hoặc người khác kinh doanh cùng ngành nghề nhằm tư lợi trái luật."],"c":[]},{"t":"5.3. Quản lý và điều hành công ty hợp danh","cs":"Căn cứ: Điều 184–187 Luật Doanh nghiệp","b":["Các thành viên hợp danh có quyền đại diện theo pháp luật và tổ chức điều hành hoạt động kinh doanh hằng ngày theo quy định.","Hội đồng thành viên gồm tất cả thành viên; thành viên hợp danh có quyền biểu quyết theo luật và Điều lệ.","Công ty hợp danh không được phát hành bất kỳ loại chứng khoán nào; việc huy động vốn phải theo cơ chế luật định."],"c":[]},{"t":"5.4. Doanh nghiệp tư nhân: đặc điểm và trách nhiệm của chủ doanh nghiệp","cs":"Căn cứ: Điều 188–190 Luật Doanh nghiệp","b":["Doanh nghiệp tư nhân do một cá nhân làm chủ; mỗi cá nhân chỉ được thành lập một doanh nghiệp tư nhân.","Chủ doanh nghiệp tư nhân chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp; doanh nghiệp không có tư cách pháp nhân.","Chủ doanh nghiệp tư nhân không được đồng thời là chủ hộ kinh doanh hoặc thành viên hợp danh của công ty hợp danh; doanh nghiệp tư nhân không được phát hành chứng khoán."],"c":[]},{"t":"5.5. Quản lý, sử dụng vốn và chuyển đổi doanh nghiệp tư nhân","cs":"Căn cứ: Điều 189–193 Luật Doanh nghiệp","b":["Vốn đầu tư của chủ doanh nghiệp tư nhân do chủ doanh nghiệp tự đăng ký; chủ doanh nghiệp có quyền tăng hoặc giảm vốn theo luật.","Chủ doanh nghiệp có thể trực tiếp quản lý hoặc thuê người khác quản lý, điều hành nhưng vẫn chịu trách nhiệm về hoạt động doanh nghiệp.","Doanh nghiệp tư nhân có thể chuyển đổi thành công ty TNHH, công ty cổ phần hoặc công ty hợp danh khi đáp ứng đủ điều kiện và thủ tục luật định."],"c":[]}]},{"t":"6. Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty","cs":"Căn cứ: Điều 12–13, 46–197 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH; Luật 68/2025/QH15; Nghị định 366/2025/NĐ-CP","b":["Quản trị doanh nghiệp là hệ thống cơ quan, người quản lý, cơ chế ra quyết định, kiểm soát và trách nhiệm giải trình trong doanh nghiệp.","Người quản lý và người đại diện phải hành động trung thực, cẩn trọng, trung thành với lợi ích hợp pháp của doanh nghiệp; kiểm soát xung đột lợi ích và giao dịch với người có liên quan.","Doanh nghiệp nhà nước được nhận diện theo tiêu chí Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết theo Luật Doanh nghiệp.","Quản lý vốn nhà nước tại doanh nghiệp phải đặt trong khuôn khổ pháp luật chuyên ngành về vốn nhà nước, hiện hành là VBHN 60/VBHN-VPQH và Nghị định 366/2025/NĐ-CP.","Nhóm công ty là tập hợp các công ty có quan hệ liên kết; không phải một loại hình doanh nghiệp và không có tư cách pháp nhân độc lập."],"c":[{"t":"6.1. Nghĩa vụ của người quản lý và người đại diện","cs":"Căn cứ: Điều 12–13, Điều 71, 83, 165 và các điều khoản tương ứng Luật Doanh nghiệp","b":["Người quản lý phải thực hiện quyền, nghĩa vụ trung thực, cẩn trọng và tốt nhất nhằm bảo đảm lợi ích hợp pháp của doanh nghiệp.","Không được lạm dụng chức vụ, quyền hạn, thông tin, cơ hội kinh doanh hoặc tài sản của doanh nghiệp để tư lợi hay phục vụ lợi ích của tổ chức, cá nhân khác.","Người đại diện theo pháp luật chịu trách nhiệm cá nhân đối với thiệt hại cho doanh nghiệp do vi phạm nghĩa vụ theo khoản 2 Điều 13 sau sửa đổi năm 2025."],"c":[]},{"t":"6.2. Quản trị công ty TNHH và công ty hợp danh","cs":"Căn cứ: Điều 54–87, 179–187 Luật Doanh nghiệp","b":["Quản trị công ty TNHH dựa trên quyền của chủ sở hữu hoặc Hội đồng thành viên, cơ chế bổ nhiệm người điều hành và kiểm soát theo loại hình.","Quản trị công ty hợp danh gắn với vai trò của thành viên hợp danh, quyền đại diện và trách nhiệm tài sản vô hạn.","Điều lệ công ty cụ thể hóa thẩm quyền, trình tự họp, biểu quyết và cơ chế phân công nhưng không được trái quy định bắt buộc của luật."],"c":[]},{"t":"6.3. Quản trị công ty cổ phần và bảo vệ cổ đông","cs":"Căn cứ: Điều 137–176 Luật Doanh nghiệp; Luật Chứng khoán 2019, sửa đổi bởi Luật 56/2024/QH15","b":["Đại hội đồng cổ đông, Hội đồng quản trị, Giám đốc/Tổng giám đốc và Ban kiểm soát hoặc Ủy ban kiểm toán tạo thành cấu trúc quản trị công ty cổ phần.","Cơ chế công bố thông tin, giao dịch với người có liên quan và quyền của cổ đông thiểu số góp phần bảo đảm minh bạch, kiểm soát quyền lực nội bộ.","Công ty đại chúng và tổ chức niêm yết phải tuân thủ thêm quy định chuyên ngành chứng khoán."],"c":[]},{"t":"6.4. Doanh nghiệp nhà nước và quản lý vốn nhà nước","cs":"Căn cứ: Điều 88–110 Luật Doanh nghiệp; VBHN 60/VBHN-VPQH ngày 23/03/2026; Nghị định 366/2025/NĐ-CP","b":["Doanh nghiệp nhà nước được xác định theo tỷ lệ Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết theo Luật Doanh nghiệp.","Luật 68/2025/QH15 là luật nền tảng về quản lý và đầu tư vốn nhà nước tại doanh nghiệp; nội dung hiện hành cần tra cứu theo VBHN 60/VBHN-VPQH.","Nghị định 366/2025/NĐ-CP hướng dẫn đầu tư vốn nhà nước, quản lý vốn nhà nước tại doanh nghiệp và phân công, phân cấp thực hiện quyền đại diện chủ sở hữu."],"c":[]},{"t":"6.5. Nhóm công ty, công ty mẹ và công ty con","cs":"Căn cứ: Điều 194–197 Luật Doanh nghiệp","b":["Nhóm công ty gồm công ty mẹ, công ty con và các công ty thành viên có quan hệ liên kết; quan hệ được xác định theo quyền sở hữu, quyền chi phối hoặc quyền quyết định.","Công ty mẹ và công ty con là các pháp nhân độc lập; việc công ty mẹ chi phối không tự động xóa bỏ tư cách pháp lý và trách nhiệm tài sản riêng của công ty con.","Nhóm công ty không có tư cách pháp nhân; các hạn chế về góp vốn, đầu tư chéo và trách nhiệm của công ty mẹ phải được xem xét theo luật."],"c":[]}]},{"t":"7. Tổ chức lại, giải thể và phục hồi, phá sản","cs":"Căn cứ: Điều 198–210 Luật Doanh nghiệp; Luật Phục hồi, phá sản 142/2025/QH15","b":["Tổ chức lại doanh nghiệp gồm chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình; phải xử lý quyền lợi của thành viên, cổ đông, người lao động và chủ nợ.","Giải thể là chấm dứt sự tồn tại của doanh nghiệp theo các căn cứ luật định, với điều kiện doanh nghiệp bảo đảm thanh toán hết các khoản nợ và nghĩa vụ tài sản.","Phục hồi, phá sản là thủ tục tư pháp riêng theo Luật 142/2025/QH15; ưu tiên thủ tục phục hồi nhằm tái cơ cấu và khôi phục khả năng thanh toán.","Từ ngày 01/03/2026, doanh nghiệp có nguy cơ mất khả năng thanh toán được nhận diện theo mốc 06 tháng; doanh nghiệp mất khả năng thanh toán là doanh nghiệp không thực hiện nghĩa vụ thanh toán sau thời hạn 06 tháng kể từ ngày đến hạn."],"c":[{"t":"7.1. Các hình thức tổ chức lại doanh nghiệp","cs":"Căn cứ: Điều 198–205 Luật Doanh nghiệp","b":["Chia công ty: công ty bị chia chấm dứt tồn tại và các công ty mới kế thừa quyền, nghĩa vụ theo phương án chia.","Tách công ty: công ty bị tách tiếp tục tồn tại, đồng thời chuyển một phần tài sản, quyền và nghĩa vụ sang công ty mới.","Hợp nhất tạo ra công ty mới và chấm dứt các công ty bị hợp nhất; sáp nhập làm công ty bị sáp nhập chấm dứt và công ty nhận sáp nhập tiếp tục tồn tại.","Chuyển đổi loại hình làm thay đổi cấu trúc pháp lý, chủ sở hữu hoặc thành viên nhưng phải bảo đảm kế thừa quyền, nghĩa vụ và xử lý các khoản nợ."],"c":[]},{"t":"7.2. Căn cứ và điều kiện giải thể doanh nghiệp","cs":"Căn cứ: Điều 207 Luật Doanh nghiệp","b":["Doanh nghiệp giải thể khi kết thúc thời hạn hoạt động ghi trong Điều lệ mà không gia hạn; theo nghị quyết, quyết định của chủ thể có thẩm quyền; không còn đủ số lượng thành viên tối thiểu trong thời hạn luật định; hoặc bị thu hồi Giấy chứng nhận đăng ký doanh nghiệp, trừ trường hợp luật quy định khác.","Doanh nghiệp chỉ được giải thể khi bảo đảm thanh toán hết các khoản nợ và nghĩa vụ tài sản khác, đồng thời không trong quá trình giải quyết tranh chấp tại Tòa án hoặc Trọng tài.","Nếu doanh nghiệp không có khả năng thanh toán các khoản nợ thì phải xem xét thủ tục phục hồi, phá sản thay vì sử dụng giải thể để né tránh nghĩa vụ."],"c":[]},{"t":"7.3. Trình tự giải thể và thanh toán nghĩa vụ","cs":"Căn cứ: Điều 208–210 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP","b":["Chủ thể có thẩm quyền thông qua nghị quyết hoặc quyết định giải thể; doanh nghiệp gửi thông báo đến cơ quan đăng ký kinh doanh, chủ nợ và người có quyền lợi liên quan.","Doanh nghiệp lập phương án thanh toán nợ, thanh lý tài sản, thực hiện nghĩa vụ thuế, bảo hiểm, lao động và các nghĩa vụ khác.","Sau khi hoàn tất nghĩa vụ, doanh nghiệp gửi hồ sơ giải thể; cơ quan đăng ký kinh doanh cập nhật tình trạng pháp lý của doanh nghiệp theo quy định."],"c":[]},{"t":"7.4. Phân biệt giải thể và phá sản","cs":"Căn cứ: Điều 207–210 Luật Doanh nghiệp; Điều 5 Luật Phục hồi, phá sản 142/2025/QH15","b":["Giải thể phát sinh từ các căn cứ tổ chức hoặc quyết định của doanh nghiệp/cơ quan có thẩm quyền và đòi hỏi khả năng thanh toán hết nợ.","Phá sản gắn với tình trạng mất khả năng thanh toán và phải có quyết định tuyên bố phá sản của Tòa án.","Giải thể không phải là thủ tục tư pháp phá sản; phá sản có cơ chế xử lý tài sản, chủ nợ và thứ tự thanh toán riêng."],"c":[]},{"t":"7.5. Thủ tục phục hồi hoạt động kinh doanh","cs":"Căn cứ: Điều 1–5, Điều 24–37 và các quy định liên quan Luật 142/2025/QH15","b":["Luật 142/2025/QH15 ưu tiên thủ tục phục hồi; doanh nghiệp có nguy cơ mất khả năng thanh toán có thể đề nghị áp dụng thủ tục để tái cơ cấu trước khi rơi vào tình trạng mất khả năng thanh toán.","Doanh nghiệp có nguy cơ mất khả năng thanh toán là doanh nghiệp không thanh toán được khoản nợ sẽ đến hạn trong 06 tháng hoặc khoản nợ đã đến hạn nhưng chưa quá 06 tháng.","Phương án phục hồi phải nêu biện pháp phục hồi hoạt động, điều kiện, thời hạn và kế hoạch thanh toán nợ; việc thông qua và thực hiện chịu sự giám sát của Tòa án và chủ thể tiến hành thủ tục."],"c":[]},{"t":"7.6. Thủ tục phá sản và hậu quả pháp lý","cs":"Căn cứ: Điều 5–7, Điều 38–67 và các quy định liên quan Luật 142/2025/QH15","b":["Doanh nghiệp mất khả năng thanh toán là doanh nghiệp không thực hiện nghĩa vụ thanh toán khoản nợ sau thời hạn 06 tháng kể từ ngày đến hạn.","Thủ tục phá sản gồm nộp, xử lý đơn; xem xét mở thủ tục; xác định tài sản và chủ nợ; tổ chức Hội nghị chủ nợ; xem xét phục hồi hoặc tuyên bố phá sản theo điều kiện luật định.","Luật 142/2025/QH15 quy định thủ tục rút gọn và cơ chế xử lý tài sản, giao dịch vô hiệu, hợp đồng, thứ tự phân chia tài sản; cần áp dụng đúng thời điểm và quy định chuyển tiếp."],"c":[]}]}]}}</script>
