<script id="pn-data" type="application/json">{"meta":{"id":"luat-doanh-nghiep","name":"Luật Doanh nghiệp","title":"Tài liệu Luật Doanh nghiệp","menuTitle":"Luật Doanh nghiệp","asof":"01/11/2026","note":"Chương 1 đã biên soạn: 20 câu lý thuyết, 03 tình huống × 04 câu và cây tóm tắt. Phạm vi được dựng từ nội dung chủ thể kinh doanh trong học phần Luật Thương mại do chưa có đề cương riêng; nội dung mới chờ giảng viên duyệt.","laws":[{"re":"Luật Doanh nghiệp","doc":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Van-ban-hop-nhat-67-VBHN-VPQH-2025-Luat-Doanh-nghiep-671127.aspx"},{"re":"Luật số 76/2025/QH15","doc":"https://vanban.chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"re":"Nghị định 168/2025/NĐ-CP","doc":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"re":"Nghị định 296/2026/NĐ-CP","doc":"https://vanban.chinhphu.vn/?classid=1&docid=218986&pageid=27160&typegroupid=4"},{"re":"Luật Phục hồi, phá sản 142/2025/QH15","doc":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"re":"Luật Thương mại 2005","doc":"https://thuvienphapluat.vn/van-ban/Thuong-mai/Luat-Thuong-mai-2005-36-2005-QH11-2633.aspx"},{"re":"Hiến pháp 2013","doc":"https://vanban.chinhphu.vn/?pageid=27160&docid=171264"}]},"chapters":[{"n":1,"name":"Địa vị pháp lý của doanh nghiệp và những vấn đề chung"},{"n":2,"name":"Thành lập, đăng ký doanh nghiệp và vốn góp"},{"n":3,"name":"Công ty trách nhiệm hữu hạn"},{"n":4,"name":"Công ty cổ phần"},{"n":5,"name":"Công ty hợp danh và doanh nghiệp tư nhân"},{"n":6,"name":"Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty"},{"n":7,"name":"Tổ chức lại, giải thể và phục hồi, phá sản"}],"q":[{"id":"LDN101","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, phạm vi điều chỉnh chủ yếu của Luật bao gồm nội dung nào?","o":["Thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; nhóm công ty","Toàn bộ hoạt động đầu tư của mọi nhà đầu tư trong nền kinh tế","Mọi quan hệ hợp đồng giữa thương nhân với nhau","Việc thành lập và hoạt động của tất cả tổ chức xã hội"],"a":0,"e":"Đáp án đúng là A. Thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của doanh nghiệp; nhóm công ty. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 1 Luật Doanh nghiệp"},{"id":"LDN102","g":1,"lv":"NB","q":"Những chủ thể nào thuộc đối tượng áp dụng của Luật Doanh nghiệp?","o":["Chỉ doanh nghiệp đã được cấp Giấy chứng nhận đăng ký doanh nghiệp","Chỉ chủ sở hữu và người đại diện theo pháp luật của doanh nghiệp","Chỉ cơ quan đăng ký kinh doanh","Doanh nghiệp và cơ quan, tổ chức, cá nhân có liên quan đến việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động của doanh nghiệp"],"a":3,"e":"Đáp án đúng là B. Doanh nghiệp và cơ quan, tổ chức, cá nhân có liên quan đến việc thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động của doanh nghiệp. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 2 Luật Doanh nghiệp"},{"id":"LDN103","g":1,"lv":"TH","q":"Khi một vấn đề về doanh nghiệp được Luật Doanh nghiệp và luật chuyên ngành cùng điều chỉnh, cách xác định luật áp dụng phù hợp nhất là gì?","o":["Luôn áp dụng Luật Doanh nghiệp vì đây là luật chuyên biệt về chủ thể","Luôn áp dụng văn bản được ban hành sau, không cần xét điều khoản liên quan","Các bên được tự do chọn bất kỳ luật nào","Áp dụng quy định về áp dụng luật tại Điều 3 và quy định của luật chuyên ngành tương ứng"],"a":3,"e":"Đáp án đúng là C. Áp dụng quy định về áp dụng luật tại Điều 3 và quy định của luật chuyên ngành tương ứng. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 3 Luật Doanh nghiệp"},{"id":"LDN104","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, doanh nghiệp được hiểu là gì?","o":["Tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định của pháp luật nhằm mục đích kinh doanh","Mọi cá nhân có hoạt động tạo ra thu nhập","Mọi tổ chức có tài khoản ngân hàng và sử dụng lao động","Mọi đơn vị phụ thuộc của thương nhân"],"a":0,"e":"Đáp án đúng là A. Tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo quy định của pháp luật nhằm mục đích kinh doanh. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 10 Điều 4 Luật Doanh nghiệp"},{"id":"LDN105","g":1,"lv":"TH","q":"Nhận định nào phân biệt chính xác doanh nghiệp với thương nhân?","o":["Doanh nghiệp và thương nhân là hai thuật ngữ đồng nhất","Mọi thương nhân đều phải là công ty có tư cách pháp nhân","Cá nhân không thể là thương nhân","Doanh nghiệp là tổ chức theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế hoặc cá nhân đáp ứng điều kiện của Luật Thương mại"],"a":3,"e":"Đáp án đúng là C. Doanh nghiệp là tổ chức theo pháp luật doanh nghiệp; thương nhân là tổ chức kinh tế hoặc cá nhân đáp ứng điều kiện của Luật Thương mại. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 10 Điều 4 Luật Doanh nghiệp; khoản 1 Điều 6 Luật Thương mại"},{"id":"LDN106","g":1,"lv":"NB","q":"Luật Doanh nghiệp quy định những loại hình doanh nghiệp nào?","o":["Công ty TNHH, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân","Công ty TNHH, công ty cổ phần, hộ kinh doanh và hợp tác xã","Công ty TNHH, công ty hợp danh, hợp tác xã và doanh nghiệp nhà nước","Công ty cổ phần, hộ kinh doanh, doanh nghiệp tư nhân và tổ hợp tác"],"a":0,"e":"Đáp án đúng là A. Công ty TNHH, công ty cổ phần, công ty hợp danh và doanh nghiệp tư nhân. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 1 Luật Doanh nghiệp"},{"id":"LDN107","g":1,"lv":"TH","q":"Hộ kinh doanh được xử lý thế nào khi xác định phạm vi các loại hình doanh nghiệp theo Luật Doanh nghiệp?","o":["Được coi là công ty TNHH một thành viên","Là một loại hình doanh nghiệp thứ năm","Mặc nhiên có tư cách pháp nhân như công ty","Không thuộc bốn loại hình doanh nghiệp được liệt kê tại Điều 1; đăng ký và hoạt động theo quy định riêng có liên quan"],"a":3,"e":"Đáp án đúng là C. Không thuộc bốn loại hình doanh nghiệp được liệt kê tại Điều 1; đăng ký và hoạt động theo quy định riêng có liên quan. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 1 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP"},{"id":"LDN108","g":1,"lv":"NB","q":"Quyền tự do kinh doanh của doanh nghiệp được thể hiện cơ bản như thế nào?","o":["Chỉ được kinh doanh ngành nghề ghi trong Giấy chứng nhận đăng ký doanh nghiệp","Được kinh doanh cả ngành, nghề bị cấm nếu có đăng ký","Được tự do kinh doanh ngành, nghề mà luật không cấm, đồng thời phải đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện","Chỉ được kinh doanh sau khi có chấp thuận riêng cho từng giao dịch"],"a":2,"e":"Đáp án đúng là B. Được tự do kinh doanh ngành, nghề mà luật không cấm, đồng thời phải đáp ứng điều kiện đối với ngành, nghề đầu tư kinh doanh có điều kiện. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 7 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013"},{"id":"LDN109","g":1,"lv":"TH","q":"Doanh nghiệp đã đăng ký ngành nghề kinh doanh có điều kiện nhưng chưa đáp ứng điều kiện chuyên ngành thì nhận định nào đúng?","o":["Giấy chứng nhận đăng ký doanh nghiệp tự thay thế mọi giấy phép, điều kiện chuyên ngành","Doanh nghiệp được kinh doanh vì ngành nghề đã được ghi nhận trong hồ sơ","Doanh nghiệp được miễn điều kiện trong năm đầu hoạt động","Doanh nghiệp chỉ được tiến hành hoạt động khi đáp ứng đủ điều kiện theo pháp luật chuyên ngành"],"a":3,"e":"Đáp án đúng là C. Doanh nghiệp chỉ được tiến hành hoạt động khi đáp ứng đủ điều kiện theo pháp luật chuyên ngành. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 7 Luật Doanh nghiệp"},{"id":"LDN110","g":1,"lv":"NB","q":"Nghĩa vụ nào được Luật Doanh nghiệp đặt ra đối với doanh nghiệp?","o":["Chỉ nộp thuế khi có lợi nhuận","Chỉ báo cáo khi cơ quan nhà nước yêu cầu bằng văn bản","Thực hiện chế độ kế toán, lập và nộp báo cáo tài chính, kê khai và nộp thuế cùng các nghĩa vụ luật định","Không phải bảo đảm quyền lợi người lao động nếu doanh nghiệp nhỏ"],"a":2,"e":"Đáp án đúng là B. Thực hiện chế độ kế toán, lập và nộp báo cáo tài chính, kê khai và nộp thuế cùng các nghĩa vụ luật định. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 8 Luật Doanh nghiệp"},{"id":"LDN111","g":1,"lv":"TH","q":"Một công ty kê khai vốn điều lệ 10 tỷ đồng nhưng các thành viên chỉ góp 2 tỷ đồng, không thực hiện thủ tục điều chỉnh theo quy định. Hành vi này có thể bị nhận diện thế nào?","o":["Là quyền tự do định đoạt vốn, không bị điều chỉnh","Là hành vi kê khai khống vốn điều lệ thuộc nhóm hành vi bị nghiêm cấm","Chỉ là vi phạm nội bộ không liên quan pháp luật doanh nghiệp","Được hợp pháp hóa nếu công ty có doanh thu"],"a":1,"e":"Đáp án đúng là B. Là hành vi kê khai khống vốn điều lệ thuộc nhóm hành vi bị nghiêm cấm. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 5 Điều 16 Luật Doanh nghiệp"},{"id":"LDN112","g":1,"lv":"NB","q":"Luật Doanh nghiệp sửa đổi năm 2025 xác định chủ sở hữu hưởng lợi của doanh nghiệp có tư cách pháp nhân là ai?","o":["Người trực tiếp ký hợp đồng thuê trụ sở","Cá nhân có quyền sở hữu trên thực tế vốn điều lệ hoặc có quyền chi phối đối với doanh nghiệp, trừ trường hợp luật loại trừ","Mọi người đại diện theo pháp luật","Người đứng tên kế toán trưởng"],"a":1,"e":"Đáp án đúng là B. Cá nhân có quyền sở hữu trên thực tế vốn điều lệ hoặc có quyền chi phối đối với doanh nghiệp, trừ trường hợp luật loại trừ. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"LDN113","g":1,"lv":"TH","q":"Một cá nhân đứng tên trên hồ sơ nhưng thực tế không sở hữu vốn, không có quyền chi phối; người khác mới là người thực tế kiểm soát doanh nghiệp. Khi xác định chủ sở hữu hưởng lợi, cần căn cứ vào yếu tố nào?","o":["Chỉ căn cứ tên ghi trên Giấy chứng nhận đăng ký doanh nghiệp","Chỉ căn cứ người giữ con dấu","Quyền sở hữu trên thực tế vốn điều lệ hoặc quyền chi phối thực tế theo tiêu chí pháp luật","Chỉ căn cứ người trực tiếp điều hành hằng ngày"],"a":2,"e":"Đáp án đúng là C. Quyền sở hữu trên thực tế vốn điều lệ hoặc quyền chi phối thực tế theo tiêu chí pháp luật. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"LDN114","g":1,"lv":"NB","q":"Sau sửa đổi năm 2025, doanh nghiệp có nghĩa vụ nào liên quan đến chủ sở hữu hưởng lợi?","o":["Thu thập, cập nhật, lưu giữ thông tin và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu","Công khai toàn bộ dữ liệu cá nhân của chủ sở hữu hưởng lợi trên website","Chỉ lưu thông tin trong 30 ngày","Không phải cập nhật khi có thay đổi"],"a":0,"e":"Đáp án đúng là A. Thu thập, cập nhật, lưu giữ thông tin và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 5a Điều 8 Luật Doanh nghiệp"},{"id":"LDN115","g":1,"lv":"TH","q":"Doanh nghiệp được thành lập trước ngày 01/07/2025 phải bổ sung thông tin về chủ sở hữu hưởng lợi vào thời điểm nào theo quy định chuyển tiếp?","o":["Bắt buộc trong 10 ngày kể từ ngày 01/07/2025","Đồng thời khi thực hiện thủ tục đăng ký thay đổi hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp chủ động bổ sung sớm hơn","Chỉ khi doanh nghiệp giải thể","Không bao giờ phải bổ sung"],"a":1,"e":"Đáp án đúng là B. Đồng thời khi thực hiện thủ tục đăng ký thay đổi hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp chủ động bổ sung sớm hơn. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 1 Điều 3 Luật 76/2025/QH15"},{"id":"LDN116","g":1,"lv":"NB","q":"Theo Luật Doanh nghiệp, ai có thể là người đại diện theo pháp luật của doanh nghiệp?","o":["Chỉ chủ sở hữu doanh nghiệp","Chỉ Chủ tịch Hội đồng quản trị","Cá nhân đại diện cho doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện trước cơ quan giải quyết tranh chấp theo luật","Bất kỳ người lao động nào được giao giữ con dấu"],"a":2,"e":"Đáp án đúng là C. Cá nhân đại diện cho doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch và đại diện trước cơ quan giải quyết tranh chấp theo luật. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 1 Điều 12 Luật Doanh nghiệp"},{"id":"LDN117","g":1,"lv":"TH","q":"Công ty TNHH có hai người đại diện theo pháp luật. Điều lệ không phân định rõ quyền, nghĩa vụ của từng người. Đối với bên thứ ba, nguyên tắc xử lý nào được áp dụng?","o":["Mỗi người chỉ có quyền ký khi người kia đồng ý bằng văn bản","Mỗi người đại diện theo pháp luật đều là đại diện đủ thẩm quyền của doanh nghiệp trước bên thứ ba; các người đại diện chịu trách nhiệm theo quy định của luật","Chỉ người có tên đầu tiên trong Giấy chứng nhận đăng ký doanh nghiệp có quyền đại diện","Giao dịch do một người ký luôn vô hiệu"],"a":1,"e":"Đáp án đúng là B. Mỗi người đại diện theo pháp luật đều là đại diện đủ thẩm quyền của doanh nghiệp trước bên thứ ba; các người đại diện chịu trách nhiệm theo quy định của luật. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 2 Điều 12 Luật Doanh nghiệp"},{"id":"LDN118","g":1,"lv":"NB","q":"Cơ quan nào là cơ quan có thẩm quyền cấp Giấy chứng nhận đăng ký doanh nghiệp theo quy định hiện hành?","o":["Cơ quan đăng ký kinh doanh cấp tỉnh","Ủy ban nhân dân cấp xã","Tòa án nhân dân khu vực","Cơ quan thuế cấp xã"],"a":0,"e":"Đáp án đúng là A. Cơ quan đăng ký kinh doanh cấp tỉnh. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 14, Điều 26 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP"},{"id":"LDN119","g":1,"lv":"TH","q":"Giấy chứng nhận đăng ký doanh nghiệp có ý nghĩa pháp lý nào?","o":["Là giấy phép cho phép doanh nghiệp kinh doanh mọi ngành nghề có điều kiện","Là văn bản ghi nhận thông tin đăng ký doanh nghiệp; không thay thế điều kiện, giấy phép chuyên ngành nếu pháp luật yêu cầu","Là chứng nhận doanh nghiệp đã hoàn thành mọi nghĩa vụ thuế","Là văn bản xác nhận doanh nghiệp không còn nghĩa vụ với chủ nợ"],"a":1,"e":"Đáp án đúng là B. Là văn bản ghi nhận thông tin đăng ký doanh nghiệp; không thay thế điều kiện, giấy phép chuyên ngành nếu pháp luật yêu cầu. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Điều 28, Điều 7 Luật Doanh nghiệp"},{"id":"LDN120","g":1,"lv":"VD","q":"Một công ty sử dụng tài liệu giả để kê khai hồ sơ thành lập và cố ý kê khai vốn điều lệ không đúng thực tế. Nhận định nào phù hợp nhất?","o":["Đây là hành vi được phép nếu các thành viên đồng ý","Chỉ phát sinh trách nhiệm dân sự với nhau, không có hậu quả pháp lý khác","Có thể thuộc các hành vi bị nghiêm cấm và làm phát sinh trách nhiệm pháp lý theo quy định liên quan","Chỉ bị xử lý nếu doanh nghiệp đã có lãi"],"a":2,"e":"Đáp án đúng là C. Có thể thuộc các hành vi bị nghiêm cấm và làm phát sinh trách nhiệm pháp lý theo quy định liên quan. Nội dung này được xác định theo quy định được dẫn chiếu; cần phân biệt quy tắc chung với ngoại lệ hoặc điều kiện chuyên ngành.","b":"Khoản 4, khoản 5 Điều 16 Luật Doanh nghiệp"},{"id":"TH1.01.1","cid":"TH1.01","g":1,"q":"Anh Minh có thể được xác định là thương nhân theo Luật Thương mại trên cơ sở dữ kiện nào?","o":["Chỉ vì có doanh thu thì đương nhiên là thương nhân","Vì hoạt động thương mại độc lập, thường xuyên và đáp ứng điều kiện đăng ký kinh doanh theo luật","Chỉ khi có từ 10 lao động trở lên","Chỉ khi thành lập công ty cổ phần"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Vì hoạt động thương mại độc lập, thường xuyên và đáp ứng điều kiện đăng ký kinh doanh theo luật.","b":"Khoản 1 Điều 6 Luật Thương mại"},{"id":"TH1.01.2","cid":"TH1.01","g":1,"q":"Việc chưa đăng ký kinh doanh có làm anh Minh đương nhiên được miễn trách nhiệm đối với hợp đồng đã ký không?","o":["Có, vì chưa có tư cách thương nhân","Có, nếu hợp đồng không công chứng","Không; nghĩa vụ đăng ký và trách nhiệm đối với hoạt động đã thực hiện được xem xét theo Luật Thương mại và pháp luật liên quan","Có, trừ khi bên bán chứng minh được thiệt hại"],"a":2,"e":"Phân tích tình huống: đáp án đúng là C. Không; nghĩa vụ đăng ký và trách nhiệm đối với hoạt động đã thực hiện được xem xét theo Luật Thương mại và pháp luật liên quan.","b":"Điều 7 Luật Thương mại"},{"id":"TH1.01.3","cid":"TH1.01","g":1,"q":"Nếu muốn tổ chức hoạt động dưới hình thức doanh nghiệp và giới hạn trách nhiệm tài sản theo nguyên tắc của công ty, loại hình nào có thể được cân nhắc?","o":["Doanh nghiệp tư nhân","Công ty TNHH một thành viên","Hộ kinh doanh","Chi nhánh của Công ty Ánh Dương"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Công ty TNHH một thành viên.","b":"Khoản 1 Điều 74; khoản 1 Điều 188 Luật Doanh nghiệp"},{"id":"TH1.01.4","cid":"TH1.01","g":1,"q":"Nếu anh Minh thành lập doanh nghiệp tư nhân, trách nhiệm tài sản của anh được xác định thế nào?","o":["Chỉ trong phạm vi vốn điều lệ","Bằng toàn bộ tài sản của chủ doanh nghiệp tư nhân","Chỉ bằng tài sản đã đăng ký tại trụ sở","Không chịu trách nhiệm với khoản nợ trước đăng ký"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Bằng toàn bộ tài sản của chủ doanh nghiệp tư nhân.","b":"Khoản 1 Điều 188 Luật Doanh nghiệp"},{"id":"TH1.02.1","cid":"TH1.02","g":1,"q":"Theo Luật Doanh nghiệp đã được sửa đổi năm 2025, bà Hạnh có được thành lập và quản lý doanh nghiệp trong tình huống này không?","o":["Có, vì chỉ góp dưới 50% vốn","Có, nếu người em đồng ý","Không, vì cán bộ, công chức, viên chức thuộc nhóm bị hạn chế, trừ trường hợp ngoại lệ được luật quy định","Có, nếu công ty không kinh doanh với cơ quan nhà nước"],"a":2,"e":"Phân tích tình huống: đáp án đúng là C. Không, vì cán bộ, công chức, viên chức thuộc nhóm bị hạn chế, trừ trường hợp ngoại lệ được luật quy định.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.2","cid":"TH1.02","g":1,"q":"Việc bà Hạnh chỉ dự định góp 20% vốn có làm thay đổi kết luận về quyền góp vốn không?","o":["Có, vì tỷ lệ dưới 50% luôn được phép","Không; cần xem xét quy định về đối tượng không được góp vốn theo pháp luật cán bộ, công chức, viên chức và phòng, chống tham nhũng","Có, nếu không giữ chức danh quản lý","Có, nếu vốn góp là tài sản riêng"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Không; cần xem xét quy định về đối tượng không được góp vốn theo pháp luật cán bộ, công chức, viên chức và phòng, chống tham nhũng.","b":"Điểm b khoản 3 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.3","cid":"TH1.02","g":1,"q":"Người em của bà Hạnh có thể thành lập công ty nếu bản thân không thuộc trường hợp bị cấm không?","o":["Không, vì có quan hệ thân thích với công chức","Có, quyền của người em được xác định độc lập theo các điều kiện luật định","Chỉ được thành lập doanh nghiệp tư nhân","Chỉ được thành lập nếu bà Hạnh đứng tên đại diện"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Có, quyền của người em được xác định độc lập theo các điều kiện luật định.","b":"Khoản 1, khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.02.4","cid":"TH1.02","g":1,"q":"Ngoại lệ được bổ sung năm 2025 đối với cán bộ, công chức, viên chức liên quan đến lĩnh vực nào?","o":["Mọi lĩnh vực kinh doanh có điều kiện","Bất động sản và chứng khoán","Khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia theo quy định pháp luật","Chỉ hoạt động thương mại điện tử"],"a":2,"e":"Phân tích tình huống: đáp án đúng là C. Khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia theo quy định pháp luật.","b":"Điểm b khoản 2 Điều 17 Luật Doanh nghiệp"},{"id":"TH1.03.1","cid":"TH1.03","g":1,"q":"Ai có thể được xác định là chủ sở hữu hưởng lợi của Công ty Sao Bắc theo tiêu chí luật định?","o":["Chỉ ông Nam vì là người đứng tên 60% vốn","Ông Phúc nếu chứng minh được quyền sở hữu trên thực tế vốn hoặc quyền chi phối đối với công ty","Chỉ bà Hoa vì là người đứng tên vốn thấp hơn","Kế toán trưởng công ty"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Ông Phúc nếu chứng minh được quyền sở hữu trên thực tế vốn hoặc quyền chi phối đối với công ty.","b":"Khoản 35 Điều 4 Luật Doanh nghiệp"},{"id":"TH1.03.2","cid":"TH1.03","g":1,"q":"Luật Doanh nghiệp sửa đổi năm 2025 đặt ra nghĩa vụ nào đối với thông tin chủ sở hữu hưởng lợi?","o":["Thu thập, cập nhật, lưu giữ và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu","Chỉ ghi nhận khi công ty phát hành cổ phần","Không cần lưu giữ nếu đã có người đại diện theo pháp luật","Chỉ công khai trên website doanh nghiệp"],"a":0,"e":"Phân tích tình huống: đáp án đúng là A. Thu thập, cập nhật, lưu giữ và cung cấp cho cơ quan nhà nước có thẩm quyền khi được yêu cầu.","b":"Khoản 5a Điều 8; điểm h khoản 1 Điều 11 Luật Doanh nghiệp"},{"id":"TH1.03.3","cid":"TH1.03","g":1,"q":"Công ty thành lập trước ngày 01/07/2025 phải bổ sung thông tin chủ sở hữu hưởng lợi vào thời điểm nào?","o":["Trong 03 ngày từ khi luật có hiệu lực","Đồng thời với lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn","Chỉ khi thay đổi chủ tịch công ty","Chỉ khi cơ quan thuế yêu cầu"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Đồng thời với lần đăng ký hoặc thông báo thay đổi nội dung đăng ký doanh nghiệp gần nhất, trừ trường hợp bổ sung sớm hơn.","b":"Khoản 1 Điều 3 Luật 76/2025/QH15"},{"id":"TH1.03.4","cid":"TH1.03","g":1,"q":"Nhận định nào đúng về trách nhiệm đối với thông tin kê khai?","o":["Chỉ cơ quan đăng ký kinh doanh chịu trách nhiệm về tính chính xác","Người thành lập hoặc doanh nghiệp tự kê khai và chịu trách nhiệm trước pháp luật về tính hợp pháp, trung thực, chính xác theo quy định","Người đứng tên hộ đương nhiên không phải chịu trách nhiệm","Có thể kê khai người khác là chủ sở hữu hưởng lợi nếu được đồng ý"],"a":1,"e":"Phân tích tình huống: đáp án đúng là B. Người thành lập hoặc doanh nghiệp tự kê khai và chịu trách nhiệm trước pháp luật về tính hợp pháp, trung thực, chính xác theo quy định.","b":"Điều 4 Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP"}],"th":[{"name":"Chương 1 · Tình huống 1","items":[{"cid":"TH1.01","title":"Cá nhân kinh doanh và tư cách thương nhân","text":"Từ tháng 01/2025, anh Minh tại thành phố Bắc Ninh thường xuyên mua thiết bị điện từ nhiều nhà phân phối để bán lại qua cửa hàng và nền tảng trực tuyến. Anh hoạt động độc lập, có doanh thu đều đặn nhưng chưa đăng ký hộ kinh doanh hoặc doanh nghiệp. Tháng 10/2026, anh ký hợp đồng mua 300 bộ thiết bị của Công ty Ánh Dương để bán lại; sau khi nhận hàng, anh không thanh toán đủ và cho rằng mình không phải thương nhân vì chưa đăng ký. Anh dự định mở rộng hoạt động, thuê thêm lao động và muốn tách bạch tài sản cá nhân với tài sản kinh doanh.","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]}]},{"name":"Chương 1 · Tình huống 2","items":[{"cid":"TH1.02","title":"Người có quyền thành lập và quản lý doanh nghiệp","text":"Bà Hạnh là công chức đang công tác tại một cơ quan chuyên môn thuộc UBND cấp tỉnh. Bà dự định cùng người em thành lập Công ty TNHH Minh Hà, đứng tên thành viên góp vốn và trực tiếp giữ Giám đốc. Người em của bà là cá nhân đủ năng lực hành vi dân sự, không thuộc trường hợp bị cấm. Bà Hạnh cho rằng mình được quyền tham gia vì chỉ góp 20% vốn và không sử dụng tài sản công. Dự kiến hoạt động của công ty thuộc lĩnh vực tư vấn quản lý thông thường, không thuộc lĩnh vực khoa học, công nghệ, đổi mới sáng tạo hoặc chuyển đổi số.","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]}]},{"name":"Chương 1 · Tình huống 3","items":[{"cid":"TH1.03","title":"Chủ sở hữu hưởng lợi và kê khai thông tin doanh nghiệp","text":"Công ty TNHH Sao Bắc được thành lập năm 2023. Trên hồ sơ đăng ký, ông Nam đứng tên sở hữu 60% vốn điều lệ, bà Hoa sở hữu 40%. Tuy nhiên, theo thỏa thuận nội bộ và việc kiểm soát thực tế, ông Phúc là người bỏ vốn thực tế, quyết định các vấn đề trọng yếu và có quyền chi phối hoạt động công ty; ông Nam chỉ đứng tên hộ. Tháng 10/2026, công ty thực hiện thủ tục thay đổi địa chỉ trụ sở chính. Người đại diện theo pháp luật cho rằng doanh nghiệp thành lập trước ngày 01/07/2025 nên không phải cập nhật thông tin chủ sở hữu hưởng lợi.","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]}],"vb":[{"t":"I. Văn bản nền tảng về doanh nghiệp","rows":[{"t":"Luật Doanh nghiệp số 59/2020/QH14","d":"17/06/2020 · Có hiệu lực 01/01/2021; đã được sửa đổi, bổ sung.","url":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Van-ban-hop-nhat-67-VBHN-VPQH-2025-Luat-Doanh-nghiep-671127.aspx"},{"t":"Luật số 03/2022/QH15","d":"11/01/2022 · Sửa đổi, bổ sung một số luật, trong đó có Luật Doanh nghiệp.","url":"https://vanban.chinhphu.vn/"},{"t":"Luật số 76/2025/QH15","d":"17/06/2025 · Có hiệu lực 01/07/2025 · Sửa đổi Luật Doanh nghiệp.","url":"https://vanban.chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"t":"Văn bản hợp nhất 67/VBHN-VPQH","d":"15/08/2025 · Hợp nhất Luật Doanh nghiệp sau các lần sửa đổi nêu trong văn bản.","url":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Van-ban-hop-nhat-67-VBHN-VPQH-2025-Luat-Doanh-nghiep-671127.aspx"}]},{"t":"II. Đăng ký doanh nghiệp","rows":[{"t":"Nghị định 168/2025/NĐ-CP","d":"30/06/2025 · Có hiệu lực 01/07/2025 · Đăng ký doanh nghiệp; thay thế Nghị định 01/2021/NĐ-CP.","url":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"t":"Nghị định 296/2026/NĐ-CP","d":"23/07/2026 · Có hiệu lực cùng ngày · Sửa đổi, bổ sung Nghị định 168/2025/NĐ-CP.","url":"https://vanban.chinhphu.vn/?classid=1&docid=218986&pageid=27160&typegroupid=4"}]},{"t":"III. Văn bản có liên quan","rows":[{"t":"Luật Phục hồi, phá sản số 142/2025/QH15","d":"11/12/2025 · Có hiệu lực 01/03/2026; thay Luật Phá sản 2014, trừ trường hợp chuyển tiếp tại Điều 88.","url":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"t":"Luật Thương mại số 36/2005/QH11","d":"14/06/2005 · Dùng để phân biệt doanh nghiệp với thương nhân và hoạt động thương mại.","url":"https://thuvienphapluat.vn/van-ban/Thuong-mai/Luat-Thuong-mai-2005-36-2005-QH11-2633.aspx"},{"t":"Hiến pháp năm 2013","d":"28/11/2013 · Điều 33 về quyền tự do kinh doanh; đọc cùng các sửa đổi Hiến pháp có liên quan.","url":"https://vanban.chinhphu.vn/?pageid=27160&docid=171264"}]}],"ly":[{"t":"Chương 1. Địa vị pháp lý của doanh nghiệp và những vấn đề chung","cs":"Căn cứ: Điều 1–18 Luật Doanh nghiệp 2020, được sửa đổi bởi Luật 03/2022/QH15 và Luật 76/2025/QH15; Điều 3, 6, 7 Luật Thương mại 2005; Nghị định 168/2025/NĐ-CP và Nghị định 296/2026/NĐ-CP.","b":["1. Khái quát pháp luật doanh nghiệp: phạm vi điều chỉnh; đối tượng áp dụng; quan hệ giữa Luật Doanh nghiệp và luật chuyên ngành.","2. Khái niệm và nhận diện doanh nghiệp: tổ chức có tên riêng, tài sản, trụ sở giao dịch, được thành lập/đăng ký thành lập theo pháp luật nhằm mục đích kinh doanh.","3. Các loại hình doanh nghiệp: công ty TNHH (một thành viên/hai thành viên trở lên), công ty cổ phần, công ty hợp danh, doanh nghiệp tư nhân. Phân biệt với hộ kinh doanh và hợp tác xã.","4. Doanh nghiệp và thương nhân: doanh nghiệp là tổ chức theo pháp luật doanh nghiệp; thương nhân gồm tổ chức kinh tế thành lập hợp pháp và cá nhân hoạt động thương mại độc lập, thường xuyên, có đăng ký kinh doanh theo luật.","5. Quyền của doanh nghiệp: tự do kinh doanh ngành nghề luật không cấm; chủ động lựa chọn hình thức, địa bàn, phương thức kinh doanh; huy động, sử dụng vốn và tuyển dụng lao động trong khuôn khổ pháp luật.","6. Nghĩa vụ của doanh nghiệp: duy trì điều kiện kinh doanh; thực hiện kế toán, thuế, báo cáo; bảo đảm quyền lợi người lao động; kê khai trung thực và tuân thủ pháp luật chuyên ngành.","7. Người đại diện theo pháp luật: cá nhân đại diện doanh nghiệp trong giao dịch, tố tụng; công ty có thể có một hoặc nhiều người đại diện theo luật và điều lệ; trách nhiệm cá nhân khi vi phạm nghĩa vụ.","8. Chủ sở hữu hưởng lợi: cá nhân có quyền sở hữu trên thực tế vốn điều lệ hoặc có quyền chi phối doanh nghiệp; doanh nghiệp có nghĩa vụ thu thập, cập nhật, lưu giữ và cung cấp thông tin theo luật sửa đổi năm 2025.","9. Hành vi bị nghiêm cấm: kê khai giả mạo/không trung thực; kê khai khống vốn điều lệ; cố ý định giá tài sản góp vốn sai; các hành vi khác tại Điều 16.","10. Nguyên tắc đăng ký doanh nghiệp: thực hiện tại cơ quan đăng ký kinh doanh cấp tỉnh theo cơ cấu hiện hành; đăng ký doanh nghiệp không thay thế giấy phép hoặc điều kiện kinh doanh chuyên ngành."]}]}</script>
