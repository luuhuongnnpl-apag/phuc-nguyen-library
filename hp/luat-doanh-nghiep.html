<script id="pn-data" type="application/json">{"meta":{"id":"luat-doanh-nghiep","name":"Luật Doanh nghiệp","title":"Tài liệu Luật Doanh nghiệp","menuTitle":"Luật Doanh nghiệp","asof":"01/11/2026","note":"Khung 7 chương được xây dựng riêng từ nội dung về chủ thể kinh doanh của học phần Luật Thương mại và mở rộng theo Luật Doanh nghiệp; chưa phải đề cương chính thức được cơ sở đào tạo phê duyệt.","laws":[{"re":"Luật Doanh nghiệp","doc":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Van-ban-hop-nhat-67-VBHN-VPQH-2025-Luat-Doanh-nghiep-671127.aspx"},{"re":"Luật số 76/2025/QH15","doc":"https://vanban.chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"re":"Nghị định 168/2025/NĐ-CP","doc":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"re":"Nghị định 296/2026/NĐ-CP","doc":"https://vanban.chinhphu.vn/?classid=1&docid=218986&pageid=27160&typegroupid=4"},{"re":"Luật Phục hồi, phá sản 142/2025/QH15","doc":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"re":"Luật Thương mại 2005","doc":"https://thuvienphapluat.vn/van-ban/Thuong-mai/Luat-Thuong-mai-2005-36-2005-QH11-2633.aspx"},{"re":"Hiến pháp 2013","doc":"https://vanban.chinhphu.vn/?pageid=27160&docid=171264"}]},"chapters":[{"n":1,"name":"Địa vị pháp lý của doanh nghiệp và những vấn đề chung"},{"n":2,"name":"Thành lập, đăng ký doanh nghiệp và vốn góp"},{"n":3,"name":"Công ty trách nhiệm hữu hạn"},{"n":4,"name":"Công ty cổ phần"},{"n":5,"name":"Công ty hợp danh và doanh nghiệp tư nhân"},{"n":6,"name":"Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty"},{"n":7,"name":"Tổ chức lại, giải thể và phục hồi, phá sản"}],"q":[],"th":[],"vb":[{"t":"I. Văn bản nền tảng về doanh nghiệp","rows":[{"t":"Luật Doanh nghiệp số 59/2020/QH14","d":"17/06/2020 · Có hiệu lực 01/01/2021; đã được sửa đổi, bổ sung.","url":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Van-ban-hop-nhat-67-VBHN-VPQH-2025-Luat-Doanh-nghiep-671127.aspx"},{"t":"Luật số 03/2022/QH15","d":"11/01/2022 · Sửa đổi, bổ sung một số luật, trong đó có Luật Doanh nghiệp.","url":"https://vanban.chinhphu.vn/"},{"t":"Luật số 76/2025/QH15","d":"17/06/2025 · Có hiệu lực 01/07/2025 · Sửa đổi Luật Doanh nghiệp.","url":"https://vanban.chinhphu.vn/?classid=1&docid=214562&pageid=27160&typegroupid=3"},{"t":"Văn bản hợp nhất 67/VBHN-VPQH","d":"15/08/2025 · Hợp nhất Luật Doanh nghiệp sau các lần sửa đổi nêu trong văn bản.","url":"https://thuvienphapluat.vn/van-ban/Doanh-nghiep/Van-ban-hop-nhat-67-VBHN-VPQH-2025-Luat-Doanh-nghiep-671127.aspx"}]},{"t":"II. Đăng ký doanh nghiệp","rows":[{"t":"Nghị định 168/2025/NĐ-CP","d":"30/06/2025 · Có hiệu lực 01/07/2025 · Đăng ký doanh nghiệp; thay thế Nghị định 01/2021/NĐ-CP.","url":"https://vanban.chinhphu.vn/?classid=1&docid=214334&orggroupid=2&pageid=27160"},{"t":"Nghị định 296/2026/NĐ-CP","d":"23/07/2026 · Có hiệu lực cùng ngày · Sửa đổi, bổ sung Nghị định 168/2025/NĐ-CP.","url":"https://vanban.chinhphu.vn/?classid=1&docid=218986&pageid=27160&typegroupid=4"}]},{"t":"III. Văn bản có liên quan","rows":[{"t":"Luật Phục hồi, phá sản số 142/2025/QH15","d":"11/12/2025 · Có hiệu lực 01/03/2026; thay Luật Phá sản 2014, trừ trường hợp chuyển tiếp tại Điều 88.","url":"https://vbpl.moj.gov.vn/TW/Pages/vbpq-toanvan.aspx?ItemID=187584"},{"t":"Luật Thương mại số 36/2005/QH11","d":"14/06/2005 · Dùng để phân biệt doanh nghiệp với thương nhân và hoạt động thương mại.","url":"https://thuvienphapluat.vn/van-ban/Thuong-mai/Luat-Thuong-mai-2005-36-2005-QH11-2633.aspx"},{"t":"Hiến pháp năm 2013","d":"28/11/2013 · Điều 33 về quyền tự do kinh doanh; đọc cùng các sửa đổi Hiến pháp có liên quan.","url":"https://vanban.chinhphu.vn/?pageid=27160&docid=171264"}]}],"ly":[{"t":"1. Địa vị pháp lý của doanh nghiệp và những vấn đề chung","cs":"Căn cứ: Điều 1–18, 27–35, 74–88 Luật Doanh nghiệp; Điều 33 Hiến pháp 2013.","b":["Doanh nghiệp là tổ chức có tên riêng, có tài sản, có trụ sở giao dịch, được thành lập hoặc đăng ký thành lập theo pháp luật nhằm mục đích kinh doanh.","Phạm vi điều chỉnh: thành lập, tổ chức quản lý, tổ chức lại, giải thể và hoạt động có liên quan của công ty TNHH, công ty cổ phần, công ty hợp danh, doanh nghiệp tư nhân; nhóm công ty.","Phân biệt doanh nghiệp với thương nhân: doanh nghiệp là hình thức tổ chức kinh doanh; thương nhân là tư cách chủ thể theo Luật Thương mại. Hai khái niệm có giao thoa nhưng không đồng nhất.","Bốn loại hình doanh nghiệp: công ty TNHH một thành viên; công ty TNHH hai thành viên trở lên; công ty cổ phần; công ty hợp danh; doanh nghiệp tư nhân (Luật quy định bốn nhóm loại hình, trong đó công ty TNHH có hai dạng).","Quyền cơ bản: tự do kinh doanh ngành, nghề luật không cấm; chủ động lựa chọn ngành nghề, địa bàn, hình thức kinh doanh; tuyển dụng, huy động và sử dụng vốn; khiếu nại, tham gia tố tụng.","Nghĩa vụ cơ bản: đáp ứng điều kiện kinh doanh; tổ chức kế toán, thuế, báo cáo; bảo đảm quyền lợi người lao động; kê khai trung thực; tuân thủ quy định về quốc phòng, an ninh, môi trường và nghĩa vụ chuyên ngành.","Nhận diện pháp lý: tên doanh nghiệp; trụ sở chính; tài sản; người đại diện theo pháp luật; con dấu; mã số doanh nghiệp; thông tin đăng ký và chủ sở hữu hưởng lợi.","Phân biệt trách nhiệm hữu hạn và vô hạn: thành viên/cổ đông công ty thường chịu trách nhiệm trong phạm vi vốn cam kết hoặc vốn góp theo luật; chủ DNTN và thành viên hợp danh chịu trách nhiệm bằng toàn bộ tài sản trong các trường hợp luật định."]},{"t":"2. Thành lập, đăng ký doanh nghiệp và vốn góp","cs":"Căn cứ: Điều 17–18, 22–28, 30–35, 46–47, 75, 112, 178 Luật Doanh nghiệp; Nghị định 168/2025/NĐ-CP, được sửa đổi bởi Nghị định 296/2026/NĐ-CP.","b":["Quyền thành lập, góp vốn, mua cổ phần, mua phần vốn góp được xác định theo Điều 17; phải rà soát các chủ thể bị cấm hoặc bị hạn chế theo luật.","Điều kiện nền tảng: chủ thể thành lập hợp lệ; lựa chọn loại hình; tên không vi phạm quy định; trụ sở hợp pháp; ngành, nghề không bị cấm và đáp ứng điều kiện nếu thuộc ngành nghề kinh doanh có điều kiện.","Hồ sơ đăng ký phụ thuộc loại hình doanh nghiệp, bao gồm giấy đề nghị đăng ký, điều lệ, danh sách thành viên/cổ đông và giấy tờ pháp lý tương ứng theo luật, nghị định.","Đăng ký doanh nghiệp được thực hiện tại cơ quan đăng ký kinh doanh có thẩm quyền theo cơ cấu hiện hành và Nghị định 168/2025/NĐ-CP; có thể thực hiện qua mạng thông tin điện tử.","Giấy chứng nhận đăng ký doanh nghiệp ghi nhận các nội dung đăng ký chủ yếu; cần phân biệt thời điểm được cấp giấy chứng nhận với việc đáp ứng điều kiện kinh doanh chuyên ngành.","Vốn điều lệ là tổng giá trị tài sản do thành viên/chủ sở hữu đã góp hoặc cam kết góp khi thành lập công ty TNHH, công ty hợp danh; hoặc tổng mệnh giá cổ phần đã bán/được đăng ký mua khi thành lập công ty cổ phần theo luật.","Góp vốn bằng tài sản: chỉ được coi là hoàn tất khi quyền sở hữu hợp pháp đối với tài sản góp vốn đã chuyển sang công ty theo quy định; tài sản phải được định giá theo phương thức luật định.","Thời hạn góp vốn phụ thuộc loại hình: công ty TNHH hai thành viên trở lên và công ty cổ phần có thời hạn luật định kể từ ngày cấp giấy chứng nhận, trừ trường hợp luật/điều lệ quy định hợp lệ; phải phân biệt cam kết góp vốn với vốn thực góp.","Không góp đủ, đúng hạn dẫn đến điều chỉnh quyền, nghĩa vụ, phần vốn/cổ phần và trách nhiệm đối với nghĩa vụ tài chính phát sinh theo từng loại hình.","Luật 76/2025/QH15 bổ sung quy định về kê khai, lưu giữ, cập nhật thông tin chủ sở hữu hưởng lợi; doanh nghiệp thành lập trước ngày luật có hiệu lực thực hiện theo điều khoản chuyển tiếp."]},{"t":"3. Công ty trách nhiệm hữu hạn","cs":"Căn cứ: Điều 46–73 Luật Doanh nghiệp đối với công ty TNHH hai thành viên trở lên; Điều 74–87 đối với công ty TNHH một thành viên.","b":["Công ty TNHH hai thành viên trở lên có từ 02 đến 50 thành viên; thành viên có thể là tổ chức hoặc cá nhân; công ty có tư cách pháp nhân từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp.","Thành viên chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản khác trong phạm vi số vốn đã góp, trừ trường hợp luật quy định trách nhiệm khác.","Vốn điều lệ là tổng giá trị phần vốn góp của các thành viên cam kết góp và ghi trong điều lệ; việc góp vốn, cấp giấy chứng nhận phần vốn góp, xử lý phần vốn chưa góp phải theo Điều 47.","Chuyển nhượng phần vốn góp: trước hết chào bán cho thành viên còn lại theo tỷ lệ tương ứng và cùng điều kiện; chỉ chuyển cho người ngoài nếu thành viên còn lại không mua hoặc không mua hết trong thời hạn luật định.","Cơ cấu quản lý gồm Hội đồng thành viên, Chủ tịch Hội đồng thành viên, Giám đốc/Tổng giám đốc; công ty có thể có Ban kiểm soát/kiểm soát viên trong trường hợp luật quy định.","Hội đồng thành viên là cơ quan quyết định cao nhất; thẩm quyền, triệu tập, điều kiện họp, tỷ lệ thông qua nghị quyết và biên bản phải theo luật và điều lệ.","Công ty TNHH một thành viên do một tổ chức hoặc một cá nhân làm chủ sở hữu; chủ sở hữu chịu trách nhiệm trong phạm vi vốn điều lệ, trừ trường hợp luật quy định khác.","Nếu chủ sở hữu là tổ chức, mô hình quản lý có thể theo Chủ tịch công ty hoặc Hội đồng thành viên và Giám đốc/Tổng giám đốc; nếu chủ sở hữu là cá nhân, có Chủ tịch công ty và Giám đốc/Tổng giám đốc.","Chủ sở hữu phải góp đủ vốn điều lệ trong thời hạn luật định; việc tăng, giảm vốn, chuyển nhượng một phần/toàn bộ vốn và rút vốn phải tuân thủ điều kiện riêng.","Không phát hành cổ phần, trừ trường hợp chuyển đổi thành công ty cổ phần; có thể phát hành trái phiếu theo điều kiện của Luật Doanh nghiệp và pháp luật liên quan."]},{"t":"4. Công ty cổ phần","cs":"Căn cứ: Điều 111–176 Luật Doanh nghiệp; đối chiếu Luật Chứng khoán khi chào bán, phát hành, niêm yết và giao dịch chứng khoán.","b":["Công ty cổ phần có vốn điều lệ chia thành các phần bằng nhau gọi là cổ phần; cổ đông có thể là tổ chức hoặc cá nhân; tối thiểu 03 cổ đông và không hạn chế số lượng tối đa.","Công ty có tư cách pháp nhân từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp; cổ đông chịu trách nhiệm về nợ và nghĩa vụ tài sản trong phạm vi vốn đã góp, trừ ngoại lệ luật định.","Cổ phần phổ thông là loại cổ phần bắt buộc; cổ phần ưu đãi gồm các loại được Luật Doanh nghiệp quy định như ưu đãi biểu quyết, cổ tức, hoàn lại và loại khác theo điều lệ/pháp luật.","Cổ đông phổ thông có quyền dự họp, biểu quyết, nhận cổ tức, ưu tiên mua cổ phần mới theo tỷ lệ, chuyển nhượng cổ phần và tiếp cận thông tin theo luật.","Thanh toán cổ phần đăng ký mua trong thời hạn luật định; xử lý cổ phần chưa thanh toán hoặc chỉ thanh toán một phần phải theo Điều 113 và điều khoản liên quan.","Cơ cấu quản trị có thể theo mô hình Đại hội đồng cổ đông, Hội đồng quản trị, Giám đốc/Tổng giám đốc và Ban kiểm soát; hoặc mô hình có Ủy ban kiểm toán trực thuộc Hội đồng quản trị theo điều kiện luật định.","Đại hội đồng cổ đông là cơ quan quyết định cao nhất; thẩm quyền gồm sửa điều lệ, định hướng phát triển, loại cổ phần/tổng số cổ phần được quyền chào bán, bầu/bãi nhiệm thành viên HĐQT và Ban kiểm soát, báo cáo tài chính và phân phối lợi nhuận.","Hội đồng quản trị là cơ quan quản lý, có toàn quyền nhân danh công ty quyết định và thực hiện quyền, nghĩa vụ không thuộc thẩm quyền Đại hội đồng cổ đông.","Giao dịch với người có liên quan phải tuân thủ cơ chế chấp thuận, công khai và kiểm soát xung đột lợi ích; người quản lý phải trung thành, cẩn trọng và trung thực.","Phân biệt chào bán cổ phần riêng lẻ, chào bán ra công chúng, phát hành trái phiếu và công ty đại chúng: điều kiện và thủ tục chịu sự điều chỉnh đồng thời của Luật Doanh nghiệp và pháp luật chứng khoán."]},{"t":"5. Công ty hợp danh và doanh nghiệp tư nhân","cs":"Căn cứ: Điều 177–187 Luật Doanh nghiệp (công ty hợp danh); Điều 188–193 Luật Doanh nghiệp (doanh nghiệp tư nhân).","b":["Công ty hợp danh phải có ít nhất 02 thành viên là chủ sở hữu chung của công ty, cùng kinh doanh dưới một tên chung; ngoài thành viên hợp danh có thể có thành viên góp vốn.","Thành viên hợp danh phải là cá nhân, chịu trách nhiệm bằng toàn bộ tài sản của mình về nghĩa vụ công ty; thành viên góp vốn chịu trách nhiệm trong phạm vi vốn cam kết góp.","Công ty hợp danh có tư cách pháp nhân từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp nhưng không được phát hành bất kỳ loại chứng khoán nào.","Hội đồng thành viên gồm tất cả thành viên; thành viên hợp danh có quyền quản lý, đại diện công ty theo luật; thành viên góp vốn có quyền và nghĩa vụ giới hạn theo luật và điều lệ.","Thành viên hợp danh bị hạn chế chuyển nhượng vốn, cạnh tranh, nhân danh cá nhân kinh doanh cùng ngành nghề hoặc nhân danh người khác kinh doanh nhằm tư lợi, trừ trường hợp luật/điều lệ cho phép.","Doanh nghiệp tư nhân do một cá nhân làm chủ và tự chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động; mỗi cá nhân chỉ được thành lập một DNTN theo luật.","DNTN không có tư cách pháp nhân; không được phát hành bất kỳ loại chứng khoán nào; chủ DNTN có quyền quyết định đối với hoạt động kinh doanh và sử dụng lợi nhuận sau khi hoàn thành nghĩa vụ.","Chủ DNTN có thể bán, cho thuê doanh nghiệp hoặc tạm ngừng, giải thể theo điều kiện luật định; phải phân biệt việc chuyển quyền sở hữu doanh nghiệp với trách nhiệm đối với các khoản nợ phát sinh.","Phân biệt hai mô hình: công ty hợp danh có tư cách pháp nhân, có thể có thành viên góp vốn; DNTN không có tư cách pháp nhân và chỉ có một chủ sở hữu là cá nhân."]},{"t":"6. Quản trị doanh nghiệp, doanh nghiệp nhà nước và nhóm công ty","cs":"Căn cứ: Điều 12–15, 24–25, 55–73, 79–87, 137–176, 188–193 và 194–197 Luật Doanh nghiệp.","b":["Người đại diện theo pháp luật đại diện doanh nghiệp thực hiện quyền, nghĩa vụ phát sinh từ giao dịch; đại diện trước Trọng tài, Tòa án và quyền, nghĩa vụ khác theo luật.","Công ty TNHH và công ty cổ phần có thể có một hoặc nhiều người đại diện theo pháp luật; điều lệ xác định số lượng, chức danh, quyền và nghĩa vụ; nếu có nhiều người thì phải phân định rõ.","Người quản lý doanh nghiệp phải thực hiện nghĩa vụ trung thực, cẩn trọng, trung thành; không lạm dụng địa vị, chức vụ, thông tin, cơ hội kinh doanh và tài sản công ty để tư lợi.","Kiểm soát giao dịch có liên quan: xác định người có liên quan, thẩm quyền chấp thuận, nghĩa vụ công khai và hậu quả khi giao dịch không tuân thủ.","Điều lệ là văn bản nội bộ nền tảng, nhưng không được trái quy định bắt buộc của luật; nghị quyết, quyết định nội bộ phải đúng thẩm quyền, trình tự, thủ tục.","Doanh nghiệp nhà nước được xác định theo tiêu chí Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết theo khoản 1 Điều 88; cần phân biệt với khái niệm doanh nghiệp do Nhà nước nắm giữ 100% vốn.","Quản trị doanh nghiệp nhà nước áp dụng các quy định riêng về cơ quan đại diện chủ sở hữu, Hội đồng thành viên/Chủ tịch công ty, Kiểm soát viên, công khai thông tin và giám sát vốn nhà nước.","Nhóm công ty không phải một loại hình doanh nghiệp độc lập; gồm công ty mẹ, công ty con và các hình thức liên kết khác theo luật.","Quan hệ công ty mẹ – công ty con được xác định theo khả năng chi phối về vốn, quyền biểu quyết hoặc quyền quyết định việc bổ nhiệm, miễn nhiệm đa số người quản lý; công ty con không được đầu tư, góp vốn, mua cổ phần của công ty mẹ trong trường hợp luật cấm.","Phải phân biệt trách nhiệm pháp lý độc lập của từng pháp nhân với cơ chế kiểm soát, báo cáo và trách nhiệm đặc thù trong quan hệ công ty mẹ – công ty con."]},{"t":"7. Tổ chức lại, giải thể và phục hồi, phá sản","cs":"Căn cứ: Điều 198–205, 207–210 Luật Doanh nghiệp; Luật Phục hồi, phá sản số 142/2025/QH15 (hiệu lực 01/03/2026).","b":["Tổ chức lại doanh nghiệp gồm chia, tách, hợp nhất, sáp nhập và chuyển đổi loại hình; mỗi phương thức có điều kiện, hồ sơ, trình tự và hậu quả pháp lý riêng.","Chia doanh nghiệp: công ty bị chia chấm dứt tồn tại sau khi các công ty mới được đăng ký; quyền, nghĩa vụ và trách nhiệm được phân chia theo phương án và luật.","Tách doanh nghiệp: công ty bị tách tiếp tục tồn tại, đồng thời thành lập công ty mới; cần xác định việc phân chia tài sản, quyền, nghĩa vụ và lao động.","Hợp nhất: hai hoặc nhiều công ty hợp nhất thành công ty mới; các công ty bị hợp nhất chấm dứt tồn tại; công ty hợp nhất kế thừa quyền, nghĩa vụ theo luật.","Sáp nhập: một hoặc nhiều công ty sáp nhập vào công ty khác; công ty nhận sáp nhập tiếp tục tồn tại và kế thừa quyền, nghĩa vụ; công ty bị sáp nhập chấm dứt.","Chuyển đổi loại hình: thay đổi cấu trúc pháp lý nhưng doanh nghiệp tiếp tục hoạt động theo hình thức mới; phải xử lý chủ sở hữu/thành viên/cổ đông, vốn và nghĩa vụ theo phương án chuyển đổi.","Giải thể là chấm dứt tồn tại doanh nghiệp theo các căn cứ luật định, với điều kiện bảo đảm thanh toán hết các khoản nợ và nghĩa vụ tài sản, không đang trong quá trình giải quyết tranh chấp tại Tòa án hoặc Trọng tài theo luật.","Trình tự giải thể gồm thông qua quyết định, thông báo cơ quan đăng ký kinh doanh và chủ thể liên quan, thanh lý tài sản, thanh toán nợ theo thứ tự luật định, hoàn tất nghĩa vụ thuế và đăng ký tình trạng giải thể.","Phục hồi, phá sản theo Luật 142/2025/QH15: ưu tiên cơ chế phục hồi; thủ tục phá sản áp dụng khi doanh nghiệp mất khả năng thanh toán và đáp ứng điều kiện luật định; Tòa án giải quyết theo trình tự tư pháp.","Phân biệt giải thể và phá sản: giải thể không đồng nghĩa với mất khả năng thanh toán; phá sản gắn với thủ tục tư pháp, mất khả năng thanh toán và quyết định tuyên bố phá sản. Luật Phá sản 2014 đã hết hiệu lực từ 01/03/2026, trừ trường hợp chuyển tiếp tại Điều 88 Luật 142/2025/QH15."]}]}</script>
