 15 tuổi trong thời gian trường học trực tiếp quản lý mà gây thiệt hại thì trường học phải bồi thường; khoản 3: nếu trường học chứng minh được mình không có lỗi trong quản lý thì cha mẹ của người chưa thành niên phải bồi thường.","b":"Điều 599 BLDS 2015","cid":"TH8.02"},{"id":"TH8.02.4","g":8,"lv":"VD","q":"Nếu ông G đỗ xe ở nơi cấm đỗ, sát sân bóng của khu dân cư, việc bồi thường được xem xét thế nào?","o":["Không ảnh hưởng, cha mẹ cháu F vẫn bồi thường toàn bộ","Ông G mất toàn bộ quyền được bồi thường","Cha mẹ cháu F phải bồi thường gấp đôi","Không bồi thường phần thiệt hại do lỗi của ông G"],"a":3,"e":"Khoản 4 Điều 585 BLDS 2015: khi bên bị thiệt hại có lỗi trong việc gây thiệt hại thì không được bồi thường phần thiệt hại do lỗi của mình gây ra. Cần xác định mức độ lỗi của ông G khi đỗ xe sai quy định.","b":"Khoản 4 Điều 585 BLDS 2015","cid":"TH8.02"},{"id":"TH8.03.1","g":8,"lv":"VD","q":"Ông O có thể yêu cầu ai bồi thường thiệt hại 40 triệu đồng?","o":["Chỉ doanh nghiệp bảo hiểm xe máy của anh M","Không ai, vì đây là rủi ro giao thông","Công ty N, vì anh M gây thiệt hại khi thực hiện công việc được giao","Chỉ anh M, vì xe là tài sản của cá nhân anh"],"a":2,"e":"Điều 600 BLDS 2015: cá nhân, pháp nhân phải bồi thường thiệt hại do người làm công, người học nghề gây ra trong khi thực hiện công việc được giao. Anh M đang giao hàng theo phân công của Công ty N.","b":"Điều 600 BLDS 2015","cid":"TH8.03"},{"id":"TH8.03.2","g":8,"lv":"VD","q":"Việc anh M dùng xe máy của cá nhân để giao hàng có làm thay đổi trách nhiệm của Công ty N không?","o":["Có, Công ty N được miễn trách nhiệm hoàn toàn","Có, vì xe máy là nguồn nguy hiểm cao độ nên chỉ chủ xe chịu","Có, vì xe là của anh M nên chỉ anh M bồi thường","Không làm mất trách nhiệm của Công ty N"],"a":3,"e":"Anh M vừa là người làm công đang thực hiện công việc được giao (Điều 600) vừa là chủ sở hữu nguồn nguy hiểm cao độ (Điều 601). Nghị quyết 02/2022/NQ-HĐTP hướng dẫn trường hợp người làm công sử dụng phương tiện của mình để thực hiện công việc được giao; trách nhiệm của Công ty N đối với ông O không mất đi.","b":"Điều 600, Điều 601 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","cid":"TH8.03"},{"id":"TH8.03.3","g":8,"lv":"VD","q":"Sau khi bồi thường cho ông O, Công ty N có quyền gì đối với anh M?","o":["Sa thải anh M và giữ lại tiền lương tháng cuối","Yêu cầu anh M hoàn trả một khoản tiền","Yêu cầu anh M hoàn trả gấp đôi số tiền đã bồi thường","Không có quyền gì đối với anh M"],"a":1,"e":"Điều 600 BLDS 2015: cá nhân, pháp nhân có quyền yêu cầu người làm công, người học nghề có lỗi trong việc gây thiệt hại phải hoàn trả một khoản tiền theo quy định của pháp luật (kết hợp pháp luật lao động về bồi thường thiệt hại của người lao động).","b":"Điều 600 BLDS 2015","cid":"TH8.03"},{"id":"TH8.03.4","g":8,"lv":"VD","q":"Giả sử anh M gây tai nạn khi đang dùng xe đi chơi vào ngày nghỉ. Ai chịu trách nhiệm bồi thường?","o":["Anh M, với tư cách chủ sở hữu, người chiếm hữu và người gây thiệt hại","Công ty N và anh M liên đới bồi thường","Không ai, vì không phải giờ làm việc","Công ty N, vì anh M là nhân viên của công ty"],"a":0,"e":"Điều 600 BLDS 2015 chỉ áp dụng khi thiệt hại xảy ra trong khi thực hiện công việc được giao. Đi chơi ngày nghỉ không phải công việc được giao nên anh M tự chịu trách nhiệm (Điều 584, Điều 601).","b":"Điều 584, Điều 600, Điều 601 BLDS 2015","cid":"TH8.03"},{"id":"TH9.01.1","g":9,"lv":"VD","q":"Khoản 1 tỷ đồng bố mẹ tặng riêng cho chị K1 là tài sản gì?","o":["Tài sản riêng của chị K1, vì được tặng cho riêng","Tài sản chung vì được tặng trong thời kỳ hôn nhân","Tài sản chung của đại gia đình","Tài sản của bố mẹ chị K1"],"a":0,"e":"Khoản 1 Điều 43 Luật HNGĐ 2014: tài sản riêng của vợ, chồng gồm tài sản mà mỗi người được thừa kế riêng, được tặng cho riêng trong thời kỳ hôn nhân. Giấy tặng cho ghi rõ \"tặng riêng con gái\".","b":"Khoản 1 Điều 43 Luật HNGĐ 2014","cid":"TH9.01"},{"id":"TH9.01.2","g":9,"lv":"VD","q":"Căn hộ mua bằng 1 tỷ đồng tiền riêng và 500 triệu đồng tiền lương chung, đứng tên hai vợ chồng, được xác định là tài sản gì?","o":["Tài sản của con chung","Tài sản riêng của mỗi người theo tỷ lệ tiền đã góp","Tài sản riêng của chị K1, vì phần lớn tiền là của chị","Có thể là tài sản chung vì đã nhập vào tài sản chung"],"a":3,"e":"Thu nhập do lao động trong thời kỳ hôn nhân là tài sản chung (khoản 1 Điều 33 Luật HNGĐ). Căn hộ hình thành từ cả tiền chung và tiền riêng, lại đứng tên hai vợ chồng, nên có thể xác định chị K1 đã nhập tài sản riêng vào tài sản chung (Điều 46); khoản 3 Điều 33: trường hợp có tranh chấp mà không chứng minh được là tài sản riêng thì là tài sản chung.","b":"Điều 33, Điều 46 Luật HNGĐ 2014","cid":"TH9.01"},{"id":"TH9.01.3","g":9,"lv":"VD","q":"Khi ly hôn, khoản 1 tỷ đồng tiền riêng chị K1 bỏ ra được xem xét thế nào khi chia căn hộ?","o":["Chỉ xem xét nếu chồng chị K1 đồng ý","Chị K1 được nhận lại đúng 1 tỷ đồng, phần còn lại chia đôi bắt buộc","Được xét là công sức đóng góp, chia phần lớn hơn","Không được xem xét vì đã nhập vào tài sản chung"],"a":2,"e":"Điểm b khoản 2 Điều 59 Luật HNGĐ 2014: khi chia tài sản chung, Tòa án xem xét công sức đóng góp của vợ, chồng vào việc tạo lập, duy trì và phát triển khối tài sản chung (hướng dẫn tại Điều 7 Thông tư liên tịch 01/2016). Việc chị K1 đóng góp 1 tỷ đồng từ tài sản riêng là căn cứ để chia cho chị phần nhiều hơn.","b":"Điểm b khoản 2 Điều 59 Luật HNGĐ 2014; TTLT 01/2016/TTLT-TANDTC-VKSNDTC-BTP","cid":"TH9.01"},{"id":"TH9.01.4","g":9,"lv":"VD","q":"Để căn hộ được xác định là tài sản riêng, chị K1 lẽ ra nên làm gì khi mua?","o":["Không cần làm gì, vì tiền riêng luôn tạo ra tài sản riêng","Dùng tiền riêng, đứng tên mình, lưu chứng cứ nguồn gốc","Đăng ký đứng tên cả hai vợ chồng","Nhờ bố mẹ đứng tên hộ căn hộ"],"a":1,"e":"Khoản 2 Điều 43 Luật HNGĐ 2014: tài sản được hình thành từ tài sản riêng của vợ, chồng cũng là tài sản riêng. Người có tài sản riêng cần chứng minh được nguồn gốc (khoản 3 Điều 33); việc trộn với tiền chung và đăng ký tên hai vợ chồng làm mất tính riêng biệt.","b":"Khoản 2 Điều 43, khoản 3 Điều 33 Luật HNGĐ 2014","cid":"TH9.01"},{"id":"TH9.02.1","g":9,"lv":"VD","q":"Để bán chiếc ô tô, anh L1 cần đáp ứng điều kiện gì?","o":["Có thỏa thuận bằng văn bản của vợ chồng","Chỉ cần chiếc xe đứng tên anh L1","Chỉ cần hợp đồng mua bán được công chứng","Chỉ cần anh L1 là chủ gia đình"],"a":0,"e":"Khoản 2 Điều 35 Luật HNGĐ 2014: việc định đoạt tài sản chung là động sản mà theo quy định phải đăng ký quyền sở hữu, hoặc tài sản đang là nguồn tạo ra thu nhập chủ yếu của gia đình phải có sự thỏa thuận bằng văn bản của vợ chồng.","b":"Khoản 2 Điều 35 Luật HNGĐ 2014","cid":"TH9.02"},{"id":"TH9.02.2","g":9,"lv":"VD","q":"Chị M1 có quyền gì đối với giao dịch bán xe?","o":["Không có quyền vì xe đứng tên chồng","Yêu cầu Tòa án tuyên bố giao dịch vô hiệu","Yêu cầu công an thu hồi xe","Chỉ được yêu cầu chia đôi tiền bán xe"],"a":1,"e":"Khoản 2 Điều 26 và Điều 35 Luật HNGĐ 2014: tài sản chung đứng tên một bên mà bên đó tự mình xác lập giao dịch trái quy định về đại diện giữa vợ chồng thì giao dịch đó vô hiệu, trừ trường hợp người thứ ba ngay tình được bảo vệ theo quy định của BLDS. Chị M1 có quyền yêu cầu Tòa án tuyên bố vô hiệu.","b":"Khoản 2 Điều 26, Điều 35 Luật HNGĐ 2014","cid":"TH9.02"},{"id":"TH9.02.3","g":9,"lv":"VD","q":"Quyền lợi của ông N1 (người mua tin xe là tài sản riêng của anh L1) được xem xét theo quy định nào?","o":["Luật Thương mại về mua bán hàng hóa","Không được bảo vệ trong mọi trường hợp","Luôn được giữ xe vì đã trả đủ tiền mua","Điều 133 BLDS về bảo vệ người thứ ba ngay tình"],"a":3,"e":"Khoản 2 Điều 26 Luật HNGĐ dẫn chiếu việc bảo vệ người thứ ba ngay tình theo BLDS. Điều 133 BLDS quy định các trường hợp người thứ ba ngay tình được bảo vệ; nếu giao dịch bị tuyên bố vô hiệu, các bên hoàn trả cho nhau những gì đã nhận và bên có lỗi (anh L1) phải bồi thường (Điều 131).","b":"Điều 131, Điều 133 BLDS 2015; khoản 2 Điều 26 Luật HNGĐ 2014","cid":"TH9.02"},{"id":"TH9.02.4","g":9,"lv":"VD","q":"Khoản nợ cá nhân mà anh L1 muốn trả bằng tiền bán xe được xác định thế nào?","o":["Nghĩa vụ chung của cả gia đình","Nghĩa vụ của người mua xe","Nghĩa vụ riêng của anh L1","Nghĩa vụ chung của vợ chồng"],"a":2,"e":"Điều 45 Luật HNGĐ 2014: vợ, chồng có nghĩa vụ riêng về tài sản đối với nghĩa vụ phát sinh từ giao dịch do mỗi bên xác lập, thực hiện không vì nhu cầu của gia đình; nghĩa vụ riêng được thanh toán bằng tài sản riêng của người đó.","b":"Điều 45 Luật HNGĐ 2014","cid":"TH9.02"},{"id":"TH9.03.1","g":9,"lv":"VD","q":"Khi anh S1 và chị T1 không thỏa thuận được, Tòa án căn cứ vào đâu để giao con?","o":["Quyền lợi mọi mặt của con và nguyện vọng của con","Người khởi kiện ly hôn được ưu tiên","Thu nhập cao hơn của một bên","Ý kiến của ông bà nội, ngoại"],"a":0,"e":"Khoản 2 Điều 81 Luật HNGĐ 2014: vợ, chồng thỏa thuận về người trực tiếp nuôi con; nếu không thỏa thuận được thì Tòa án quyết định giao con cho một bên trực tiếp nuôi căn cứ vào quyền lợi về mọi mặt của con; nếu con từ đủ 07 tuổi trở lên thì phải xem xét nguyện vọng của con.","b":"Khoản 2 Điều 81 Luật HNGĐ 2014","cid":"TH9.03"},{"id":"TH9.03.2","g":9,"lv":"VD","q":"Nguyện vọng ở với bố của cháu V1 (8 tuổi) có ý nghĩa gì?","o":["Không có ý nghĩa, vì cháu chưa thành niên","Có tính quyết định, Tòa án phải giao con theo nguyện vọng","Phải được xem xét cùng quyền lợi mọi mặt của cháu","Chỉ được xem xét nếu cháu đủ 10 tuổi"],"a":2,"e":"Khoản 2 Điều 81 Luật HNGĐ 2014 yêu cầu xem xét nguyện vọng của con từ đủ 07 tuổi trở lên; nguyện vọng là căn cứ quan trọng nhưng Tòa án vẫn quyết định trên cơ sở quyền lợi mọi mặt của con.","b":"Khoản 2 Điều 81 Luật HNGĐ 2014","cid":"TH9.03"},{"id":"TH9.03.3","g":9,"lv":"VD","q":"Cháu U1 mới 30 tháng tuổi. Có bắt buộc giao cho mẹ trực tiếp nuôi không?","o":["Có, nếu người mẹ có thu nhập cao hơn","Không bắt buộc nếu mẹ không đủ điều kiện nuôi con","Không, con luôn được giao cho cha khi mẹ làm việc ở nước ngoài","Có, con dưới 36 tháng tuổi luôn được giao cho mẹ"],"a":1,"e":"Khoản 3 Điều 81 Luật HNGĐ 2014: con dưới 36 tháng tuổi được giao cho mẹ trực tiếp nuôi, trừ trường hợp người mẹ không đủ điều kiện để trực tiếp trông nom, chăm sóc, nuôi dưỡng, giáo dục con. Theo Án lệ 54/2022/AL và Nghị quyết 01/2024/NQ-HĐTP, khi người mẹ làm việc ở nước ngoài, không trực tiếp chăm sóc con thì Tòa án có thể giao con cho cha.","b":"Khoản 3 Điều 81 Luật HNGĐ 2014; Án lệ 54/2022/AL; Nghị quyết 01/2024/NQ-HĐTP","cid":"TH9.03"},{"id":"TH9.03.4","g":9,"lv":"VD","q":"Người không trực tiếp nuôi con có nghĩa vụ và quyền gì?","o":["Chỉ có quyền thăm nom khi được bên kia đồng ý","Phải giao toàn bộ tài sản cho người trực tiếp nuôi con","Không có nghĩa vụ gì nếu không có thu nhập","Cấp dưỡng cho con và có quyền thăm nom"],"a":3,"e":"Điều 82 Luật HNGĐ 2014: cha, mẹ không trực tiếp nuôi con có nghĩa vụ cấp dưỡng cho con (Điều 110) và có quyền, nghĩa vụ thăm nom con mà không ai được cản trở.","b":"Điều 82, Điều 110 Luật HNGĐ 2014","cid":"TH9.03"}],"th":[{"name":"Chương 1. Khái quát chung về Luật Dân sự","items":[{"cid":"TH1.01","title":"Tranh chấp về \"vần công\" làm nhà theo tập quán","text":"Năm 2025, ở bản Hua Tát, gia đình anh Lò Văn Pòm và gia đình anh Lường Văn Xôm thỏa thuận miệng \"vần công\" theo tập quán của người Thái trong bản: khi nhà nào làm nhà sàn thì nhà kia góp công, đến lượt mình làm nhà thì được góp công lại với số ngày tương đương. Gia đình anh Pòm đã góp 30 ngày công cho nhà anh Xôm. Năm 2026, đến lượt anh Pòm làm nhà, anh Xôm từ chối góp công và cũng không chịu trả tiền. Anh Pòm khởi kiện yêu cầu anh Xôm trả giá trị 30 ngày công. Hai bên không thỏa thuận về cách xử lý khi một bên không góp công lại; pháp luật cũng không có quy định riêng về \"vần công\". Tòa án tìm hiểu được tập quán trong bản: ai không góp công lại thì phải trả tiền công theo giá thuê nhân công phổ biến tại địa phương.","ask":["Quan hệ giữa hai gia đình có thuộc đối tượng điều chỉnh của luật dân sự không?","Tòa án áp dụng quy định nào để giải quyết? Nếu không có tập quán thì Tòa án giải quyết theo trình tự nào?"],"guide":["Quan hệ \"vần công\" là quan hệ tài sản (trao đổi sức lao động có giá trị bằng tiền) hình thành trên cơ sở bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm nên thuộc đối tượng điều chỉnh của luật dân sự (Điều 1 BLDS 2015).","Các bên không có thỏa thuận và pháp luật không quy định thì có thể áp dụng tập quán, nhưng tập quán không được trái với các nguyên tắc cơ bản của pháp luật dân sự (khoản 2 Điều 5). Tập quán \"không góp công lại thì trả tiền công theo giá phổ biến\" rõ ràng, được thừa nhận trong cộng đồng, không trái nguyên tắc nên Tòa án áp dụng.","Nếu không có tập quán thì áp dụng quy định của pháp luật điều chỉnh quan hệ dân sự tương tự (tương tự pháp luật – khoản 1 Điều 6, ví dụ quy định về hợp đồng dịch vụ); nếu không có quy định tương tự thì áp dụng các nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng (khoản 2 Điều 6).","Tòa án không được từ chối giải quyết vụ việc dân sự vì lý do chưa có điều luật để áp dụng (khoản 2 Điều 14)."],"basis":"Điều 1, Điều 3, Điều 5, Điều 6, khoản 2 Điều 14 BLDS 2015","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]},{"cid":"TH1.02","title":"Ủy ban nhân dân xã mua đất của dân bằng sức ép","text":"Năm 2026, Ủy ban nhân dân xã M cần mở rộng sân nhà văn hóa nhưng dự án không thuộc trường hợp Nhà nước thu hồi đất. Xã ký hợp đồng mua lại 200 m² đất vườn của bà Liên. Trước khi ký, Chủ tịch xã nói với bà Liên: \"Nếu không bán với giá xã đưa ra thì hồ sơ xin cấp giấy phép xây dựng của con bà sẽ không được giải quyết\". Bà Liên miễn cưỡng ký với giá chỉ bằng một nửa giá thị trường.","ask":["Quan hệ mua bán giữa Ủy ban nhân dân xã và bà Liên là quan hệ hành chính hay quan hệ dân sự? Vì sao?","Việc giao kết hợp đồng có vi phạm nguyên tắc cơ bản nào của pháp luật dân sự không? Bà Liên có thể bảo vệ quyền lợi bằng cách nào?"],"guide":["Khi tham gia mua bán, Ủy ban nhân dân xã không sử dụng quyền lực nhà nước mà tham gia với tư cách chủ thể của quan hệ dân sự, bình đẳng với bà Liên (Điều 97 BLDS: Nhà nước, cơ quan nhà nước tham gia quan hệ dân sự bình đẳng với các chủ thể khác). Đây là quan hệ dân sự (Điều 1).","Việc dùng thẩm quyền giải quyết hồ sơ của con bà Liên để ép giá vi phạm nguyên tắc bình đẳng, không được lấy bất kỳ lý do nào để phân biệt đối xử (khoản 1 Điều 3) và nguyên tắc tự do, tự nguyện cam kết, thỏa thuận (khoản 2 Điều 3).","Lời nói của Chủ tịch xã là đe dọa (gây thiệt hại về quyền, lợi ích hợp pháp của người thân thích của bà Liên) nên bà Liên có quyền yêu cầu Tòa án tuyên bố hợp đồng vô hiệu (Điều 127); thời hiệu 02 năm kể từ ngày người có hành vi đe dọa chấm dứt hành vi đó (điểm c khoản 1 Điều 132).","Hậu quả: các bên hoàn trả cho nhau những gì đã nhận; bên có lỗi gây thiệt hại phải bồi thường (Điều 131)."],"basis":"Điều 1, Điều 3, Điều 97, Điều 127, Điều 131, Điều 132 BLDS 2015","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]},{"cid":"TH1.03","title":"Quán karaoke hát thâu đêm","text":"Bà Thảo mở quán karaoke trong nhà mình tại khu dân cư. Quán thường hoạt động đến 2 giờ sáng, tiếng ồn lớn, khiến gia đình ông Tín bên cạnh mất ngủ kéo dài; con ông Tín đang ôn thi phải đi khám vì suy nhược. Ông Tín nhiều lần đề nghị nhưng bà Thảo cho rằng \"nhà tôi, tôi có quyền kinh doanh\". Một đêm, ông Tín tự ý cắt cầu dao điện của quán bà Thảo làm hỏng một số thiết bị.","ask":["Việc bà Thảo cho rằng mình có toàn quyền kinh doanh trong nhà mình được đánh giá thế nào?","Ông Tín có thể bảo vệ quyền lợi của gia đình bằng những phương thức nào? Việc tự cắt điện có hợp pháp không?"],"guide":["Cá nhân thực hiện quyền dân sự không được xâm phạm quyền, lợi ích hợp pháp của người khác (khoản 4 Điều 3); không được lạm dụng quyền dân sự gây thiệt hại cho người khác (khoản 1 Điều 10). Chủ sở hữu thực hiện quyền đối với tài sản không được gây thiệt hại cho chủ sở hữu bất động sản liền kề, phải tuân thủ quy định về bảo vệ môi trường (tiếng ồn) (Điều 164, Điều 172).","Ông Tín có thể tự bảo vệ phù hợp hoặc yêu cầu cơ quan có thẩm quyền: buộc chấm dứt hành vi vi phạm, bồi thường thiệt hại (Điều 11, Điều 12, Điều 14); có thể phản ánh để cơ quan có thẩm quyền xử phạt vi phạm hành chính về tiếng ồn.","Tự bảo vệ phải phù hợp với tính chất, mức độ xâm phạm và không trái nguyên tắc cơ bản (Điều 12). Tự ý cắt điện làm hỏng thiết bị là vượt quá giới hạn tự bảo vệ, ông Tín có thể phải bồi thường thiệt hại đã gây ra (Điều 584)."],"basis":"Khoản 4 Điều 3, Điều 10, Điều 11, Điều 12, Điều 14, Điều 584 BLDS 2015","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]},{"name":"Chương 2. Chủ thể của quan hệ pháp luật dân sự","items":[{"cid":"TH2.01","title":"Người 17 tuổi tự mua xe máy bằng tiền lương","text":"Em Quân, 17 tuổi, làm công nhân tại một nhà máy theo hợp đồng lao động, có thu nhập ổn định. Tháng 5/2026, Quân dùng tiền lương tự ký hợp đồng mua một chiếc xe máy 25 triệu đồng của cửa hàng X (xe phải đăng ký quyền sở hữu) mà không hỏi ý kiến cha mẹ. Cùng tháng, Quân mua một chiếc điện thoại 5 triệu đồng. Cha mẹ Quân không đồng ý việc mua xe vì cho rằng Quân chưa có giấy phép lái xe.","ask":["Xác định năng lực hành vi dân sự của Quân và hiệu lực của từng giao dịch.","Cha mẹ Quân có quyền gì đối với giao dịch mua xe? Hậu quả nếu giao dịch bị tuyên bố vô hiệu?"],"guide":["Quân từ đủ 15 đến chưa đủ 18 tuổi nên tự mình xác lập, thực hiện giao dịch dân sự, trừ giao dịch liên quan đến bất động sản, động sản phải đăng ký và giao dịch khác theo quy định của luật phải được người đại diện theo pháp luật đồng ý (khoản 4 Điều 21 BLDS).","Mua điện thoại 5 triệu đồng: Quân tự mình xác lập được, giao dịch có hiệu lực nếu đáp ứng Điều 117. Mua xe máy (động sản phải đăng ký): cần sự đồng ý của cha mẹ; không có sự đồng ý nên giao dịch có thể bị tuyên bố vô hiệu theo yêu cầu của người đại diện (Điều 125).","Cha mẹ (người đại diện theo pháp luật – Điều 136) có quyền yêu cầu Tòa án tuyên bố giao dịch mua xe vô hiệu trong thời hiệu 02 năm kể từ ngày biết hoặc phải biết (điểm a khoản 1 Điều 132).","Hậu quả (Điều 131): khôi phục tình trạng ban đầu – cửa hàng nhận lại xe, trả lại tiền; bên có lỗi gây thiệt hại phải bồi thường."],"basis":"Khoản 4 Điều 21, Điều 117, Điều 125, Điều 131, Điều 132, Điều 136 BLDS 2015","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]},{"cid":"TH2.02","title":"Ngư dân mất tích sau bão","text":"Anh Pha là ngư dân. Ngày 20/10/2020, tàu của anh bị chìm trong cơn bão lớn; cơn bão chấm dứt ngày 22/10/2020. Lực lượng cứu hộ không tìm thấy anh. Vợ anh là chị Hoa đã đăng tin tìm kiếm nhiều lần nhưng không có tin tức. Tháng 3/2026, chị Hoa yêu cầu Tòa án tuyên bố anh Pha đã chết để giải quyết việc thừa kế căn nhà đứng tên anh. Năm 2027, chị Hoa kết hôn với anh Tùng. Năm 2028, anh Pha bất ngờ trở về.","ask":["Yêu cầu tuyên bố anh Pha đã chết có đủ điều kiện không? Ngày chết được xác định thế nào?","Khi anh Pha trở về, quan hệ hôn nhân và tài sản được giải quyết thế nào?"],"guide":["Điểm c khoản 1 Điều 71 BLDS: người bị tai nạn hoặc thảm họa, thiên tai mà sau 02 năm, kể từ ngày tai nạn, thảm họa, thiên tai đó chấm dứt vẫn không có tin tức xác thực là còn sống thì có thể bị tuyên bố là đã chết. Bão chấm dứt ngày 22/10/2020, đến tháng 3/2026 đã quá 02 năm.","Tòa án xác định ngày chết của người bị tuyên bố là đã chết căn cứ vào các trường hợp tại khoản 1 Điều 71 (khoản 2 Điều 71); quan hệ về hôn nhân, gia đình và tài sản được giải quyết như đối với người đã chết (Điều 72).","Khi anh Pha trở về, theo yêu cầu của anh hoặc người có quyền, lợi ích liên quan, Tòa án hủy bỏ quyết định tuyên bố chết (Điều 73). Quan hệ nhân thân được khôi phục, trừ trường hợp vợ đã được kết hôn với người khác thì quan hệ hôn nhân mới có hiệu lực (khoản 2 Điều 73).","Anh Pha có quyền yêu cầu người đã nhận tài sản thừa kế trả lại tài sản hiện còn (khoản 3 Điều 73)."],"basis":"Điều 71, Điều 72, Điều 73 BLDS 2015","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]},{"cid":"TH2.03","title":"Chi nhánh ký hợp đồng rồi không thanh toán","text":"Công ty cổ phần An Phát (trụ sở tại Hà Nội) có Chi nhánh tại Đà Nẵng. Giám đốc Chi nhánh được Công ty ủy quyền bằng văn bản ký các hợp đồng mua vật tư. Tháng 4/2026, Chi nhánh ký hợp đồng mua của Công ty Bình Minh lô xi măng trị giá 800 triệu đồng nhưng không thanh toán. Công ty Bình Minh muốn khởi kiện Chi nhánh và yêu cầu các cổ đông của Công ty An Phát dùng tài sản riêng để trả nợ.","ask":["Chi nhánh có phải là pháp nhân không? Ai chịu trách nhiệm đối với khoản nợ?","Yêu cầu các cổ đông dùng tài sản riêng trả nợ có cơ sở không?"],"guide":["Chi nhánh là đơn vị phụ thuộc của pháp nhân, không phải là pháp nhân (khoản 1 Điều 84 BLDS); người đứng đầu chi nhánh thực hiện nhiệm vụ theo ủy quyền của pháp nhân (khoản 5 Điều 84).","Pháp nhân có quyền, nghĩa vụ dân sự phát sinh từ giao dịch dân sự do chi nhánh xác lập, thực hiện (khoản 6 Điều 84): Công ty An Phát là bên có nghĩa vụ thanh toán 800 triệu đồng.","Pháp nhân chịu trách nhiệm dân sự bằng tài sản của mình; thành viên của pháp nhân không chịu trách nhiệm dân sự thay cho pháp nhân đối với nghĩa vụ do pháp nhân xác lập (Điều 87). Yêu cầu cổ đông dùng tài sản riêng trả nợ không có cơ sở."],"basis":"Điều 84, Điều 87 BLDS 2015","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]}]},{"name":"Chương 3. Giao dịch dân sự, đại diện, thời hạn và thời hiệu","items":[{"cid":"TH3.01","title":"Người chưa thành niên bán đất được thừa kế","text":"Em M (16 tuổi) được hưởng thừa kế một thửa đất từ ông nội và đã được cấp giấy chứng nhận. Tháng 6/2025, M tự ký hợp đồng chuyển nhượng thửa đất cho ông N với giá thấp hơn giá thị trường, hợp đồng được công chứng do M khai sai năm sinh. Tháng 9/2026, mẹ M phát hiện sự việc.","ask":["Giao dịch có hiệu lực không?","Mẹ M có quyền gì, thời hạn thực hiện ra sao? Nếu giao dịch bị tuyên vô hiệu thì hậu quả pháp lý thế nào?"],"guide":["Giao dịch liên quan đến bất động sản của người từ đủ 15 đến chưa đủ 18 tuổi phải được người đại diện theo pháp luật đồng ý (khoản 4 Điều 21). M không có sự đồng ý của mẹ nên giao dịch thuộc trường hợp vô hiệu theo Điều 125.","Đây là vô hiệu tương đối: mẹ M (người đại diện theo pháp luật – Điều 136) có quyền yêu cầu Tòa án tuyên bố vô hiệu. Thời hiệu 02 năm kể từ ngày người đại diện biết hoặc phải biết người được đại diện tự mình xác lập giao dịch (điểm a khoản 1 Điều 132): mẹ M biết vào tháng 9/2026 nên vẫn trong thời hiệu.","Việc M khai gian năm sinh không làm giao dịch có hiệu lực; tuy nhiên đây là yếu tố xem xét lỗi khi giải quyết bồi thường.","Hậu quả (Điều 131): khôi phục tình trạng ban đầu, M trả lại tiền, ông N trả lại đất; bên có lỗi gây thiệt hại phải bồi thường; xem xét trách nhiệm của công chứng viên nếu có sai sót trong việc kiểm tra năng lực hành vi.","Liên hệ: nếu giao dịch được xác lập vì nhu cầu thiết yếu hoặc chỉ làm phát sinh quyền cho M thì không vô hiệu (khoản 2 Điều 125) – không thuộc trường hợp này."],"basis":"Điều 21, 125, 131, 132, 136 BLDS 2015","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]},{"cid":"TH3.02","title":"Mua ô tô bị che giấu tình trạng ngập nước","text":"Chị R mua của anh S một chiếc ô tô cũ giá 450 triệu đồng. Khi giao kết, anh S khẳng định xe “chưa từng bị ngập nước”. Sau 4 tháng sử dụng, xe hỏng nặng; gara kết luận xe từng bị ngập nước sâu và đã được làm lại nội thất để che giấu. Chị R có bằng chứng tin nhắn anh S cam kết như trên.","ask":["Chị R có những phương án pháp lý nào?","Nếu chị R chọn yêu cầu tuyên bố hợp đồng vô hiệu thì cần đáp ứng điều kiện gì về thời hiệu? Hậu quả pháp lý ra sao?"],"guide":["Hành vi cố ý cung cấp thông tin sai về tính chất của đối tượng giao dịch là lừa dối (Điều 127). Chị R có quyền yêu cầu Tòa án tuyên bố hợp đồng vô hiệu.","Thời hiệu: 02 năm kể từ ngày chị R biết hoặc phải biết giao dịch được xác lập do bị lừa dối (điểm b khoản 1 Điều 132) – tính từ thời điểm có kết luận của gara.","Hậu quả: hoàn trả xe – tiền; anh S có lỗi phải bồi thường thiệt hại (chi phí sửa chữa, giám định...) (Điều 131).","Phương án khác: không yêu cầu vô hiệu mà yêu cầu bên bán chịu trách nhiệm về chất lượng tài sản (sửa chữa, giảm giá, đổi vật hoặc trả lại vật, lấy lại tiền) và bồi thường thiệt hại theo các quy định về chất lượng và bảo hành trong hợp đồng mua bán (Điều 432, Điều 444–448 BLDS 2015).","Kỹ năng: chọn phương án căn cứ vào mục tiêu của khách hàng (giữ xe hay trả xe), chứng cứ và thời hiệu."],"basis":"Điều 127, 131, 132, 432 BLDS 2015","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4"]},{"cid":"TH3.03","title":"Đại diện bán nhà với giá thấp hơn ủy quyền","text":"Ông Y ủy quyền bằng văn bản có công chứng cho anh Z bán căn nhà của ông với giá không thấp hơn 3 tỷ đồng. Anh Z ký hợp đồng bán cho bà K với giá 2,7 tỷ đồng. Bà K không được xem văn bản ủy quyền, chỉ được anh Z cho biết “có giấy ủy quyền bán nhà”.","ask":["Hợp đồng giữa anh Z và bà K có ràng buộc ông Y không?","Bà K có những quyền gì? Trách nhiệm của anh Z?"],"guide":["Người đại diện chỉ được xác lập giao dịch trong phạm vi đại diện (Điều 141). Bán với giá thấp hơn giá tối thiểu là vượt quá phạm vi đại diện.","Giao dịch không làm phát sinh quyền, nghĩa vụ của ông Y đối với phần vượt quá, trừ khi ông Y đồng ý, biết mà không phản đối trong thời hạn hợp lý, hoặc ông Y có lỗi khiến bà K không biết (khoản 1 Điều 143).","Anh Z có nghĩa vụ thông báo phạm vi đại diện cho bên giao dịch (khoản 4 Điều 141); bà K không được biết nên anh Z phải thực hiện nghĩa vụ đối với bà K về phần vượt quá (khoản 2 Điều 143).","Bà K có quyền đơn phương chấm dứt thực hiện hoặc hủy bỏ giao dịch đối với phần vượt quá hoặc toàn bộ giao dịch và yêu cầu bồi thường thiệt hại (khoản 3 Điều 143).","Nếu anh Z và bà K cố ý thông đồng gây thiệt hại cho ông Y thì liên đới bồi thường (khoản 4 Điều 143)."],"basis":"Điều 141, 143 BLDS 2015","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]}]},{"name":"Chương 4. Tài sản và quyền đối với tài sản","items":[{"cid":"TH4.01","title":"Nhặt được tài sản đánh rơi","text":"Ngày 01/8/2025, anh H nhặt được một túi xách trong công viên, bên trong có 60 triệu đồng và một chiếc nhẫn vàng trị giá 15 triệu đồng, không có giấy tờ tùy thân. Anh H giao nộp cho công an phường; công an đã thông báo công khai ngay trong ngày. Đến tháng 9/2026 vẫn không có ai đến nhận.","ask":["Xác định quyền sở hữu đối với tài sản nói trên.","Giả sử anh H giữ lại tài sản, không giao nộp thì hậu quả pháp lý ra sao?"],"guide":["Người nhặt được tài sản đánh rơi không biết địa chỉ người đánh rơi phải thông báo hoặc giao nộp cho UBND cấp xã hoặc công an cấp xã nơi gần nhất (khoản 1 Điều 230) – anh H đã làm đúng.","Sau 01 năm kể từ ngày thông báo công khai (01/8/2026) không xác định được chủ sở hữu: tổng giá trị 75 triệu đồng > 10 lần mức lương cơ sở (10 × 2,53 = 25,3 triệu đồng).","Anh H được hưởng giá trị bằng 10 lần mức lương cơ sở và 50% phần vượt: 25,3 + 50% × (75 − 25,3) = 25,3 + 24,85 = 50,15 triệu đồng; phần còn lại 24,85 triệu đồng thuộc về Nhà nước (điểm b khoản 2 Điều 230).","Nếu anh H giữ lại: đây là chiếm hữu không có căn cứ pháp luật, không ngay tình (Điều 165, Điều 181); chủ sở hữu có quyền đòi lại (Điều 166); anh H phải hoàn trả cùng hoa lợi, lợi tức (Điều 581) và có thể bị xử lý theo pháp luật hình sự về tội chiếm giữ trái phép tài sản nếu đủ yếu tố cấu thành."],"basis":"Điều 165, 166, 181, 230, 581 BLDS 2015; Nghị định 161/2026/NĐ-CP","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]},{"cid":"TH4.02","title":"Mua lại xe máy do trộm cắp mà có","text":"Anh I bị mất trộm chiếc xe máy đã đăng ký đứng tên anh. Kẻ trộm làm giả giấy tờ và bán xe cho cửa hàng của ông J; ông J bán lại cho chị K với giá thị trường. Chị K hoàn toàn không biết xe là tài sản trộm cắp. Anh I phát hiện xe và yêu cầu chị K trả lại.","ask":["Xác định tính chất chiếm hữu của chị K.","Anh I có quyền đòi lại xe không? Quyền lợi của chị K được giải quyết thế nào?"],"guide":["Chị K là người chiếm hữu ngay tình (có căn cứ để tin mình có quyền – Điều 180) nhưng không có căn cứ pháp luật vì người bán không có quyền định đoạt.","Xe máy là động sản phải đăng ký. Chủ sở hữu có quyền đòi lại động sản phải đăng ký từ người chiếm hữu ngay tình, trừ trường hợp khoản 2 Điều 133 (Điều 168).","Khoản 2 Điều 133 bảo vệ người thứ ba ngay tình giao dịch căn cứ vào việc đăng ký hợp pháp, mua qua đấu giá hoặc theo bản án bị hủy, sửa. Ở đây xe chưa từng được đăng ký hợp pháp sang tên người bán (giấy tờ giả), nên không thuộc ngoại lệ → anh I có quyền đòi lại.","Chị K có quyền yêu cầu ông J (người bán) hoàn trả tiền và bồi thường thiệt hại; ông J có quyền yêu cầu kẻ trộm bồi thường (khoản 3 Điều 133 và các quy định về giao dịch vô hiệu)."],"basis":"Điều 133, 166, 168, 180 BLDS 2015","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4"]},{"cid":"TH4.03","title":"Bán phần sở hữu chung vi phạm quyền ưu tiên mua","text":"Ba anh em L, M, N cùng được cha mẹ tặng cho một căn nhà, giấy chứng nhận ghi mỗi người sở hữu 1/3. Tháng 02/2026, L bán phần của mình cho ông O với giá 1 tỷ đồng mà không thông báo cho M, N. Tháng 6/2026, M phát hiện việc mua bán.","ask":["Xác định hình thức sở hữu đối với căn nhà.","M có quyền gì? Thời hạn thực hiện?"],"guide":["Căn nhà là sở hữu chung theo phần, phần quyền của mỗi người được xác định (Điều 209).","Khi một chủ sở hữu chung theo phần bán phần quyền của mình thì các chủ sở hữu chung khác có quyền ưu tiên mua; người bán phải thông báo bằng văn bản về việc bán và điều kiện bán; thời hạn trả lời với bất động sản là 03 tháng (khoản 3 Điều 218).","L vi phạm quyền ưu tiên mua. Trong thời hạn 03 tháng kể từ ngày phát hiện vi phạm (tháng 6/2026), M có quyền yêu cầu Tòa án chuyển sang cho mình quyền và nghĩa vụ của người mua (với giá 1 tỷ đồng); bên có lỗi gây thiệt hại phải bồi thường.","Kỹ năng: đề xuất M thu thập chứng cứ về thời điểm phát hiện và chuẩn bị khả năng thanh toán để thực hiện quyền."],"basis":"Điều 209, 218 BLDS 2015","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]}]},{"name":"Chương 5. Thừa kế","items":[{"cid":"TH5.01","title":"Chia di sản theo pháp luật","text":"Ông A và bà B là vợ chồng hợp pháp, có hai con C và D đang học đại học. Trước khi kết hôn, ông A có một căn nhà trị giá 1,5 tỷ đồng. Sau khi kết hôn, vợ chồng dành dụm được 1 tỷ đồng, gửi tiết kiệm đứng tên bà B. Năm 2013, mẹ ông A chết (cha ông A đã chết từ trước). Năm 2014, ông bà vay của hàng xóm 100 triệu đồng để sửa nhà. Tháng 7/2018, ông A chết do tai biến, không để lại di chúc. Tháng 9/2019, những người thừa kế tiến hành chia di sản.","ask":["Xác định thời điểm mở thừa kế, di sản và người thừa kế của ông A.","Tính phần di sản mỗi người thừa kế được hưởng."],"guide":["Thời điểm mở thừa kế: tháng 7/2018 (khoản 1 Điều 611).","Di sản: nhà 1,5 tỷ (tài sản riêng có trước hôn nhân – Điều 43 Luật HNGĐ) + 1/2 khoản tiết kiệm chung 1 tỷ = 0,5 tỷ (đứng tên bà B nhưng là tài sản chung – Điều 33 Luật HNGĐ) → 2 tỷ đồng.","Nghĩa vụ tài sản: khoản vay 100 triệu là nghĩa vụ chung của vợ chồng (Điều 37 Luật HNGĐ); phần của ông A là 50 triệu, thanh toán từ di sản trước khi chia (Điều 615, Điều 658) → di sản còn 1.950 triệu đồng.","Người thừa kế hàng thứ nhất: vợ B, con C, D (mẹ ông A chết trước nên không là người thừa kế; cha đã chết) (Điều 651). Mỗi người hưởng 650 triệu đồng.","Thời hiệu chia di sản là bất động sản 30 năm, động sản 10 năm kể từ 7/2018 → còn thời hiệu (Điều 623)."],"basis":"Điều 611, 615, 623, 651, 658 BLDS 2015; Điều 33, 37, 43 Luật HNGĐ 2014","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]},{"cid":"TH5.02","title":"Di chúc bỏ qua vợ và con tàn tật","text":"Ông E lập di chúc hợp pháp để lại toàn bộ di sản 1,2 tỷ đồng cho con trai cả F (35 tuổi, có thu nhập ổn định), không cho vợ là bà G và con út H (25 tuổi, bị tàn tật, không có khả năng lao động) hưởng. Ông E chết năm 2026; cha mẹ ông đã chết trước.","ask":["Bà G và anh H có được hưởng di sản không? Tính phần được hưởng.","F được hưởng bao nhiêu?"],"guide":["Người thừa kế không phụ thuộc vào nội dung di chúc: cha, mẹ, vợ, chồng, con chưa thành niên; con thành niên mà không có khả năng lao động – được hưởng phần bằng 2/3 suất của một người thừa kế theo pháp luật nếu di chúc không cho hưởng hoặc cho hưởng ít hơn (khoản 1 Điều 644).","Giả định chia theo pháp luật: hàng thứ nhất gồm G, F, H → một suất = 1,2 tỷ : 3 = 400 triệu đồng. Bà G và anh H mỗi người được 2/3 × 400 = 266,67 triệu đồng.","F được hưởng phần còn lại: 1.200 − 2 × 266,67 = 666,67 triệu đồng."],"basis":"Điều 644, 651 BLDS 2015","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4"]},{"cid":"TH5.03","title":"Thừa kế thế vị","text":"Cụ I có ba người con: J, K, L. Năm 2020, J chết, để lại con là M (15 tuổi). Năm 2025, cụ I chết, không để lại di chúc, di sản 900 triệu đồng; vợ cụ đã chết trước. K từ chối nhận di sản hợp lệ trước khi chia.","ask":["Xác định những người thừa kế của cụ I.","Tính phần di sản của mỗi người."],"guide":["Hàng thừa kế thứ nhất của cụ I gồm J, K, L (Điều 651). J chết trước cụ I nên M được thừa kế thế vị, hưởng phần J được hưởng nếu còn sống (Điều 652).","K từ chối nhận di sản hợp lệ (Điều 620) nên không hưởng di sản; những người còn lại cùng hàng được hưởng phần di sản bằng nhau (khoản 2 Điều 651).","Di sản chia giữa L và M (thế vị J): mỗi người 450 triệu đồng.","Lưu ý: M chưa thành niên, việc nhận và quản lý di sản do người đại diện theo pháp luật thực hiện; tài sản riêng của con chưa đủ 15 tuổi do cha mẹ quản lý (Điều 76 Luật HNGĐ) – M 15 tuổi có quyền tự quản lý tài sản riêng hoặc nhờ cha mẹ quản lý."],"basis":"Điều 620, 651, 652 BLDS 2015; Điều 76 Luật HNGĐ 2014","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4"]}]},{"name":"Chương 6. Nghĩa vụ và bảo đảm thực hiện nghĩa vụ","items":[{"cid":"TH6.01","title":"Bảo lãnh khoản vay giữa các cá nhân","text":"Ngày 01/3/2026, chị Yến vay ông Zung 500.000.000 đồng, thời hạn 06 tháng, lãi suất 12%/năm. Anh Uy cam kết bằng văn bản với ông Zung: \"nếu đến hạn chị Yến không trả thì tôi trả thay\". Hai bên không thỏa thuận anh Uy chỉ trả khi chị Yến không có khả năng trả. Đến hạn ngày 01/9/2026, chị Yến không trả dù vẫn có tài sản. Ông Zung yêu cầu anh Uy trả nợ.","ask":["Xác định biện pháp bảo đảm và thời điểm ông Zung có quyền yêu cầu anh Uy thực hiện nghĩa vụ.","Sau khi trả nợ thay, anh Uy có quyền gì? Chị Yến chậm trả thì phải chịu lãi thế nào?"],"guide":["Cam kết của anh Uy là bảo lãnh: bên bảo lãnh cam kết với bên nhận bảo lãnh sẽ thực hiện nghĩa vụ thay cho bên được bảo lãnh nếu khi đến thời hạn thực hiện nghĩa vụ mà bên được bảo lãnh không thực hiện hoặc thực hiện không đúng nghĩa vụ (khoản 1 Điều 335 BLDS).","Các bên không thỏa thuận anh Uy chỉ thực hiện khi chị Yến không có khả năng thực hiện (khoản 2 Điều 335) nên khi đến hạn chị Yến không trả, ông Zung có quyền yêu cầu anh Uy trả, không phải chờ xử lý tài sản của chị Yến.","Bên bảo lãnh đã thực hiện nghĩa vụ có quyền yêu cầu bên được bảo lãnh thực hiện nghĩa vụ đối với mình trong phạm vi đã bảo lãnh (Điều 340).","Chậm trả nợ gốc trong hợp đồng vay có lãi: lãi trên nợ gốc quá hạn bằng 150% lãi suất vay theo hợp đồng tương ứng với thời gian chậm trả, trừ trường hợp có thỏa thuận khác (điểm b khoản 5 Điều 466)."],"basis":"Điều 335, Điều 340, khoản 5 Điều 466 BLDS 2015","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]},{"cid":"TH6.02","title":"Thế chấp một căn nhà cho hai chủ nợ","text":"Ông Ánh có căn nhà trị giá 3 tỷ đồng. Tháng 02/2026, ông thế chấp căn nhà cho Ngân hàng B để vay 1,5 tỷ đồng, hợp đồng được công chứng và đăng ký thế chấp ngày 10/02/2026. Tháng 4/2026, ông tiếp tục thế chấp chính căn nhà đó cho ông Cường để vay 1 tỷ đồng; hợp đồng được công chứng nhưng không đăng ký. Đến hạn, ông Ánh không trả được cả hai khoản nợ; căn nhà được xử lý, thu được 2,2 tỷ đồng. Trước đó, ông Ánh còn định bán căn nhà cho người khác mà không hỏi ý kiến Ngân hàng B.","ask":["Ông Ánh có được dùng một căn nhà để bảo đảm hai khoản nợ không? Thứ tự thanh toán giữa Ngân hàng B và ông Cường?","Ông Ánh có được bán căn nhà đang thế chấp không?"],"guide":["Một tài sản có thể được dùng để bảo đảm thực hiện nhiều nghĩa vụ (Điều 296 BLDS); bên bảo đảm phải thông báo cho bên nhận bảo đảm sau về việc tài sản đang bảo đảm nghĩa vụ khác.","Biện pháp bảo đảm phát sinh hiệu lực đối kháng với người thứ ba từ khi đăng ký (Điều 297). Thứ tự ưu tiên: các bên cùng nhận bảo đảm, biện pháp có hiệu lực đối kháng được ưu tiên trước biện pháp không có hiệu lực đối kháng (điểm b khoản 1 Điều 308). Ngân hàng B được thanh toán 1,5 tỷ trước; ông Cường nhận phần còn lại 700 triệu đồng, phần nợ còn lại trở thành nghĩa vụ không có bảo đảm.","Bên thế chấp chỉ được bán tài sản thế chấp (không phải hàng hóa luân chuyển trong sản xuất, kinh doanh) nếu được bên nhận thế chấp đồng ý hoặc theo quy định của luật (Điều 321); ông Ánh không được tự ý bán."],"basis":"Điều 296, Điều 297, Điều 308, Điều 321 BLDS 2015","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4"]},{"cid":"TH6.03","title":"Cầm cố xe máy tại tiệm cầm đồ","text":"Ngày 05/5/2026, chị Diệp mang chiếc xe máy trị giá 30 triệu đồng đến tiệm cầm đồ của ông Hải để vay 15 triệu đồng trong 02 tháng; hai bên lập hợp đồng cầm cố và chị giao xe cho ông Hải. Trong thời gian giữ xe, ông Hải cho người khác thuê xe để chạy dịch vụ. Đến hạn, chị Diệp không trả nợ. Ông Hải tuyên bố \"xe thuộc về tôi\" và không trả lại phần chênh lệch.","ask":["Xác định thời điểm hợp đồng cầm cố có hiệu lực và có hiệu lực đối kháng. Việc ông Hải cho thuê xe có đúng không?","Khi chị Diệp không trả nợ, tài sản cầm cố được xử lý thế nào?"],"guide":["Cầm cố là việc bên cầm cố giao tài sản thuộc quyền sở hữu của mình cho bên nhận cầm cố để bảo đảm thực hiện nghĩa vụ (Điều 309 BLDS). Hợp đồng cầm cố có hiệu lực từ thời điểm giao kết; cầm cố có hiệu lực đối kháng với người thứ ba kể từ thời điểm bên nhận cầm cố nắm giữ tài sản (Điều 310).","Bên nhận cầm cố không được bán, trao đổi, tặng cho, cho thuê, cho mượn tài sản cầm cố; không được đem tài sản cầm cố bảo đảm cho nghĩa vụ khác; không được khai thác công dụng nếu không được bên cầm cố đồng ý (Điều 313, Điều 314). Ông Hải cho thuê xe là vi phạm.","Khi đến hạn mà bên có nghĩa vụ không thực hiện, tài sản cầm cố được xử lý theo phương thức các bên thỏa thuận (bán đấu giá, bên nhận bảo đảm tự bán hoặc nhận chính tài sản để thay thế nghĩa vụ) (Điều 303); số tiền thu được sau khi thanh toán nghĩa vụ phải trả lại cho bên bảo đảm phần còn thừa (Điều 307)."],"basis":"Điều 303, Điều 307, Điều 309, Điều 310, Điều 313, Điều 314 BLDS 2015","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4"]}]},{"name":"Chương 7. Hợp đồng","items":[{"cid":"TH7.01","title":"Phạt vi phạm và bồi thường thiệt hại","text":"Ông C thuê đội thợ của anh D xây nhà, hợp đồng (dân sự) quy định: “Nếu chậm bàn giao, bên B chịu phạt 15% giá trị hợp đồng”. Anh D chậm bàn giao 2 tháng, khiến ông C phải thuê nhà ở với chi phí 20 triệu đồng.","ask":["Mức phạt 15% có hợp pháp không?","Ông C có được yêu cầu cả phạt vi phạm và bồi thường 20 triệu đồng tiền thuê nhà không?"],"guide":["Mức phạt vi phạm trong hợp đồng dân sự do các bên thỏa thuận, trừ trường hợp luật liên quan có quy định khác (khoản 2 Điều 418). Mức trần 8% chỉ áp dụng cho hợp đồng thương mại theo Luật Thương mại 2005; hợp đồng giữa ông C và anh D là hợp đồng dân sự nên mức 15% hợp pháp.","Các bên có thể thỏa thuận bên vi phạm vừa phải nộp phạt vừa phải bồi thường. Trường hợp các bên có thỏa thuận về phạt vi phạm nhưng không thỏa thuận về việc vừa phạt vừa bồi thường thì bên vi phạm chỉ phải nộp phạt (khoản 3 Điều 418).","Hợp đồng chỉ thỏa thuận phạt, nên ông C chỉ được yêu cầu phạt 15%, không được đồng thời đòi 20 triệu đồng tiền thuê nhà.","Kỹ năng soạn thảo: khi tư vấn soạn hợp đồng, cần ghi rõ “bên vi phạm vừa phải nộp phạt vừa phải bồi thường thiệt hại”."],"basis":"Điều 360, 418 BLDS 2015; Điều 301 Luật Thương mại 2005","mcq":["TH7.01.1","TH7.01.2","TH7.01.3","TH7.01.4"]},{"cid":"TH7.02","title":"Đặt cọc mua đất chưa có giấy chứng nhận","text":"Ngày 05/3/2026, ông G nhận đặt cọc 200 triệu đồng của bà H để bảo đảm việc giao kết hợp đồng chuyển nhượng một thửa đất mà ông G đang làm thủ tục cấp giấy chứng nhận; hai bên thỏa thuận: nếu đến ngày 05/7/2026 ông G có giấy chứng nhận thì ký hợp đồng chuyển nhượng; bên nào vi phạm phải chịu phạt cọc. Đến hạn, ông G chưa được cấp giấy chứng nhận do cơ quan đăng ký đất đai chậm giải quyết. Ông G yêu cầu tuyên bố hợp đồng đặt cọc vô hiệu vì “đất chưa có giấy chứng nhận thì không được chuyển nhượng”.","ask":["Hợp đồng đặt cọc có hiệu lực không?","Ông G có phải chịu phạt cọc không?"],"guide":["Thỏa thuận đặt cọc để bảo đảm giao kết hợp đồng mà tại thời điểm đặt cọc, hợp đồng (nếu được giao kết) có thể bị vô hiệu thì thỏa thuận đặt cọc vẫn có hiệu lực nếu đáp ứng các điều kiện tại Điều 117 BLDS (Điều 3 Nghị quyết 03/2026/NQ-HĐTP). Yêu cầu tuyên bố vô hiệu của ông G không có cơ sở.","Xử lý đặt cọc theo khoản 2 Điều 328 BLDS và thỏa thuận: nếu bên nhận đặt cọc từ chối giao kết thì phải trả lại tài sản đặt cọc và một khoản tiền tương đương.","Tuy nhiên, việc không giao kết được do cơ quan nhà nước chậm cấp giấy chứng nhận có thể được xem là trở ngại khách quan, không do lỗi của ông G; khi đó ông G không phải chịu phạt cọc mà chỉ trả lại 200 triệu đồng (tham khảo Án lệ 25/2018/AL và hướng dẫn về các trường hợp không bị phạt cọc tại Nghị quyết 03/2026/NQ-HĐTP).","Kỹ năng: cần làm rõ ông G có thực hiện đầy đủ thủ tục, có lỗi gây chậm trễ hay không; nghĩa vụ chứng minh thuộc về ông G."],"basis":"Điều 117, 328 BLDS 2015; Nghị quyết 03/2026/NQ-HĐTP; Án lệ 25/2018/AL","mcq":["TH7.02.1","TH7.02.2","TH7.02.3","TH7.02.4"]},{"cid":"TH7.03","title":"Vay tiền với lãi suất 5%/tháng","text":"Ngày 01/01/2025, anh I vay của chị K 100 triệu đồng, thời hạn 12 tháng, lãi suất 5%/tháng, trả lãi hằng tháng. Anh I trả lãi đủ 6 tháng đầu (30 triệu đồng) rồi ngừng trả. Đến hạn (01/01/2026) anh I không trả gốc. Tháng 10/2026 chị K khởi kiện.","ask":["Thỏa thuận lãi suất có hợp pháp không?","Xác định nghĩa vụ trả nợ của anh I (nêu phương pháp tính)."],"guide":["Lãi suất thỏa thuận 5%/tháng = 60%/năm vượt mức trần 20%/năm; phần lãi suất vượt quá không có hiệu lực (khoản 1 Điều 468). Lãi suất được tính lại là 20%/năm.","Số lãi anh I đã trả vượt mức hợp pháp được trừ vào nợ gốc (hướng dẫn tại Nghị quyết 01/2019/NQ-HĐTP): 6 tháng × 100 triệu × 20%/12 = 10 triệu lãi hợp pháp; anh I đã trả 30 triệu → 20 triệu vượt được trừ vào gốc.","Hợp đồng vay có lãi, đến hạn không trả: bên vay phải trả lãi trên nợ gốc theo lãi suất thỏa thuận (đã điều chỉnh) tương ứng với thời hạn vay chưa trả, lãi chậm trả theo khoản 2 Điều 468 nếu chậm trả lãi; lãi trên nợ gốc quá hạn bằng 150% lãi suất vay tương ứng với thời gian chậm trả, trừ thỏa thuận khác (khoản 5 Điều 466).","Liên hệ: cho vay với lãi suất gấp 05 lần trở lên mức cao nhất quy định trong BLDS có thể bị xử lý hình sự (Điều 201 BLHS; Nghị quyết 01/2021/NQ-HĐTP) – 60%/năm là 03 lần nên chưa đến ngưỡng này."],"basis":"Điều 466, 468 BLDS 2015; Nghị quyết 01/2019/NQ-HĐTP","mcq":["TH7.03.1","TH7.03.2","TH7.03.3","TH7.03.4"]}]},{"name":"Chương 8. Bồi thường thiệt hại ngoài hợp đồng","items":[{"cid":"TH8.01","title":"Tai nạn giao thông gây thương tích","text":"Anh A điều khiển xe máy vượt đèn đỏ, đâm vào chị B đang đi bộ đúng phần đường, làm chị B gãy chân, phải điều trị 3 tháng. Chi phí điều trị 60 triệu đồng; thu nhập thực tế bị mất 3 tháng là 45 triệu đồng; chồng chị B nghỉ việc chăm sóc, mất thu nhập 30 triệu đồng. Các bên không thỏa thuận được mức bồi thường.","ask":["Xác định căn cứ phát sinh trách nhiệm bồi thường của anh A.","Xác định các khoản thiệt hại chị B được bồi thường; mức tối đa bù đắp tổn thất tinh thần?"],"guide":["Căn cứ (khoản 1 Điều 584): hành vi trái pháp luật (vượt đèn đỏ, xâm phạm sức khỏe), thiệt hại thực tế, mối quan hệ nhân quả; anh A có lỗi. Xe máy là phương tiện giao thông cơ giới – nguồn nguy hiểm cao độ (Điều 601): chủ sở hữu, người chiếm hữu phải bồi thường cả khi không có lỗi, trừ trường hợp loại trừ.","Thiệt hại do sức khỏe bị xâm phạm (khoản 1 Điều 590): chi phí cứu chữa 60 triệu; thu nhập thực tế bị mất của chị B 45 triệu; chi phí hợp lý và thu nhập thực tế bị mất của người chăm sóc 30 triệu.","Tổn thất tinh thần: không thỏa thuận được thì tối đa 50 lần mức lương cơ sở = 50 × 2,53 = 126,5 triệu đồng (khoản 2 Điều 590), mức cụ thể do Tòa án xác định căn cứ mức độ tổn thương (hướng dẫn tại Nghị quyết 02/2022/NQ-HĐTP).","Thời hiệu khởi kiện 03 năm kể từ ngày chị B biết quyền lợi bị xâm phạm (Điều 588)."],"basis":"Điều 584, 585, 588, 590, 601 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","mcq":["TH8.01.1","TH8.01.2","TH8.01.3","TH8.01.4"]},{"cid":"TH8.02","title":"Con 13 tuổi làm vỡ kính ô tô","text":"Cháu F (13 tuổi) chơi đá bóng ngoài đường vào cuối tuần, làm vỡ kính chắn gió chiếc ô tô của ông G đang đỗ, thiệt hại 18 triệu đồng. Cháu F đang được cha mẹ nuôi dưỡng; cháu có sổ tiết kiệm riêng 10 triệu đồng do ông bà tặng.","ask":["Ai phải bồi thường thiệt hại cho ông G?","Có được dùng sổ tiết kiệm của cháu F để bồi thường không?"],"guide":["Người chưa đủ 15 tuổi gây thiệt hại mà còn cha, mẹ thì cha, mẹ phải bồi thường toàn bộ thiệt hại (khoản 2 Điều 586).","Nếu tài sản của cha, mẹ không đủ để bồi thường mà con chưa thành niên gây thiệt hại có tài sản riêng thì lấy tài sản đó để bồi thường phần còn thiếu – chỉ khi cha mẹ không đủ tài sản.","Sự việc xảy ra ngoài thời gian trường học quản lý nên không áp dụng Điều 599.","Nếu ông G đỗ xe sai quy định góp phần gây thiệt hại thì xem xét lỗi của bên bị thiệt hại (khoản 4 Điều 585)."],"basis":"Điều 585, 586 BLDS 2015; Điều 74 Luật HNGĐ 2014","mcq":["TH8.02.1","TH8.02.2","TH8.02.3","TH8.02.4"]},{"cid":"TH8.03","title":"Nhân viên giao hàng gây tai nạn","text":"Anh M là nhân viên giao hàng của Công ty N, điều khiển xe máy của cá nhân anh để giao hàng theo phân công của công ty. Trên đường giao hàng, anh M phóng nhanh, đâm vào xe của ông O gây thiệt hại 40 triệu đồng.","ask":["Ông O có thể yêu cầu ai bồi thường?","Quan hệ hoàn trả giữa Công ty N và anh M?"],"guide":["Cá nhân, pháp nhân phải bồi thường thiệt hại do người làm công, người học nghề gây ra trong khi thực hiện công việc được giao (Điều 600): anh M đang thực hiện công việc theo phân công → Công ty N có trách nhiệm bồi thường cho ông O.","Đồng thời, anh M là chủ sở hữu, người chiếm hữu nguồn nguy hiểm cao độ (xe máy – Điều 601); việc xác định chủ thể bồi thường cụ thể theo hướng dẫn tại Nghị quyết 02/2022/NQ-HĐTP về trường hợp người làm công sử dụng phương tiện của mình để thực hiện công việc được giao.","Sau khi bồi thường, Công ty N có quyền yêu cầu anh M (có lỗi) hoàn trả một khoản tiền theo quy định của pháp luật (Điều 600; pháp luật lao động về bồi thường của người lao động)."],"basis":"Điều 600, 601 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","mcq":["TH8.03.1","TH8.03.2","TH8.03.3","TH8.03.4"]}]},{"name":"Chương 9. Hôn nhân và gia đình","items":[{"cid":"TH9.01","title":"Tài sản chung hay tài sản riêng","text":"Trong thời kỳ hôn nhân, chị K1 được bố mẹ đẻ tặng riêng 1 tỷ đồng (có giấy tặng cho ghi rõ “tặng riêng con gái”), chị dùng số tiền đó cộng với 500 triệu đồng tiền lương của hai vợ chồng để mua một căn hộ đứng tên hai vợ chồng. Khi ly hôn, chị K1 cho rằng căn hộ là tài sản riêng của mình.","ask":["Căn hộ là tài sản chung hay riêng?","Khi chia, quyền lợi của chị K1 được xem xét thế nào?"],"guide":["Tiền được tặng cho riêng là tài sản riêng (khoản 1 Điều 43); tài sản hình thành từ tài sản riêng cũng là tài sản riêng (khoản 2 Điều 43). Tuy nhiên, căn hộ được mua bằng cả tiền riêng và tiền chung, lại đăng ký đứng tên hai vợ chồng → có thể xác định chị K1 đã nhập tài sản riêng vào tài sản chung (Điều 46) hoặc căn hộ là tài sản chung; nếu có tranh chấp mà không chứng minh được là tài sản riêng thì là tài sản chung (khoản 3 Điều 33).","Khi chia tài sản chung, Tòa án xem xét công sức đóng góp của mỗi bên vào việc tạo lập tài sản; khoản 1 tỷ đồng từ tài sản riêng của chị K1 là yếu tố quan trọng để chia cho chị phần lớn hơn (điểm b khoản 2 Điều 59; Điều 7 TTLT 01/2016).","Tham khảo Án lệ 82/2025/AL về xác định tài sản chung của vợ chồng hình thành trước khi đăng ký kết hôn."],"basis":"Điều 33, 43, 46, 59 Luật HNGĐ 2014; TTLT 01/2016/TTLT-TANDTC-VKSNDTC-BTP","mcq":["TH9.01.1","TH9.01.2","TH9.01.3","TH9.01.4"]},{"cid":"TH9.02","title":"Chồng tự ý bán ô tô chung","text":"Vợ chồng anh L1 – chị M1 mua chiếc ô tô trong thời kỳ hôn nhân, đăng ký đứng tên anh L1. Ô tô là phương tiện chạy dịch vụ – nguồn thu nhập chủ yếu của gia đình. Anh L1 tự ý bán xe cho ông N1 (người mua tin rằng xe là tài sản riêng của anh L1 vì đứng tên anh) để trả nợ cá nhân.","ask":["Việc anh L1 tự ý bán ô tô có đúng pháp luật không?","Chị M1 có quyền gì? Quyền lợi của ông N1 được giải quyết thế nào?"],"guide":["Việc định đoạt tài sản chung là động sản phải đăng ký quyền sở hữu hoặc tài sản đang là nguồn tạo ra thu nhập chủ yếu của gia đình phải có sự thỏa thuận bằng văn bản của vợ chồng (khoản 2 Điều 35).","Tài sản chung đứng tên một bên mà bên đó tự mình xác lập giao dịch trái quy định về đại diện giữa vợ chồng thì giao dịch vô hiệu, trừ trường hợp người thứ ba ngay tình được bảo vệ theo quy định của pháp luật (khoản 2 Điều 26).","Chị M1 có quyền yêu cầu Tòa án tuyên bố giao dịch vô hiệu (thời hiệu theo BLDS). Việc bảo vệ ông N1 phải xem xét theo Điều 133 BLDS (người thứ ba ngay tình căn cứ vào việc đăng ký); nếu giao dịch vô hiệu, ông N1 được hoàn trả tiền và yêu cầu anh L1 bồi thường.","Khoản nợ cá nhân của anh L1 là nghĩa vụ riêng (Điều 45), không được dùng tài sản chung để thanh toán khi không có thỏa thuận."],"basis":"Điều 26, 35, 45 Luật HNGĐ 2014; Điều 133 BLDS 2015","mcq":["TH9.02.1","TH9.02.2","TH9.02.3","TH9.02.4"]},{"cid":"TH9.03","title":"Giành quyền nuôi con khi ly hôn","text":"Anh S1 và chị T1 ly hôn, có hai con: U1 (30 tháng tuổi) và V1 (8 tuổi). Chị T1 làm việc ở nước ngoài từ khi U1 được 6 tháng tuổi, các con do anh S1 và ông bà nội trực tiếp chăm sóc. Cả hai đều muốn nuôi cả hai con. V1 bày tỏ nguyện vọng ở với bố.","ask":["Tòa án giải quyết việc nuôi con như thế nào?","Nghĩa vụ của người không trực tiếp nuôi con?"],"guide":["Vợ chồng thỏa thuận người trực tiếp nuôi con; không thỏa thuận được thì Tòa án quyết định giao con cho một bên căn cứ vào quyền lợi về mọi mặt của con; con từ đủ 07 tuổi trở lên thì phải xem xét nguyện vọng của con (khoản 2 Điều 81) → nguyện vọng của V1 (8 tuổi) được xem xét.","Con dưới 36 tháng tuổi được giao cho mẹ trực tiếp nuôi, trừ trường hợp người mẹ không đủ điều kiện trực tiếp trông nom, chăm sóc, nuôi dưỡng, giáo dục con (khoản 3 Điều 81). Theo Án lệ 54/2022/AL, khi người mẹ không trực tiếp chăm sóc con (đi làm ở nước ngoài) thì Tòa án có thể giao con dưới 36 tháng cho cha nuôi nếu bảo đảm quyền lợi của con. Hướng dẫn chi tiết tại Điều 6 Nghị quyết 01/2024/NQ-HĐTP.","Người không trực tiếp nuôi con có nghĩa vụ cấp dưỡng (Điều 82, Điều 110) và quyền thăm nom; không ai được cản trở (khoản 3 Điều 82).","Việc thay đổi người trực tiếp nuôi con sau này thực hiện theo Điều 84."],"basis":"Điều 81–84, 110 Luật HNGĐ 2014; Án lệ 54/2022/AL; Nghị quyết 01/2024/NQ-HĐTP","mcq":["TH9.03.1","TH9.03.2","TH9.03.3","TH9.03.4"]}]}],"vb":[{"name":"Văn bản chung của luật dân sự","rows":[{"t":"Hiến pháp nước CHXHCN Việt Nam 2013 (sửa đổi, bổ sung theo Nghị quyết 203/2025/QH15)","d":"28/11/2013","org":"Quốc hội","note":"Nguồn có giá trị pháp lý cao nhất; quyền con người, quyền công dân, quyền sở hữu","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"t":"Bộ luật Dân sự số 91/2015/QH13","d":"24/11/2015","org":"Quốc hội","note":"Hiệu lực từ 01/01/2017; được sửa đổi, bổ sung bởi Luật Phục hồi, phá sản số 142/2025/QH15 (hiệu lực 01/3/2026)","url":"https://thuvienphapluat.vn/van-ban/Quyen-dan-su/Bo-luat-Dan-su-2015-296215.aspx"},{"t":"Nghị quyết 103/2015/QH13 về việc thi hành Bộ luật Tố tụng dân sự","d":"25/11/2015","org":"Quốc hội","note":"Quy định chuyển tiếp khi áp dụng BLTTDS 2015 (quy định chuyển tiếp của BLDS 2015 nằm tại Điều 688)","url":"https://thuviennhadat.vn/vbpl/nghi-quyet-103-2015-qh13-thi-hanh-bo-luat-to-tung-dan-su-298383.html"},{"t":"Bộ luật Tố tụng dân sự số 92/2015/QH13 (sửa đổi, bổ sung năm 2025 theo Luật 85/2025/QH15)","d":"25/11/2015","org":"Quốc hội","note":"Thủ tục giải quyết vụ việc dân sự, hôn nhân và gia đình","url":"https://thuvienphapluat hanh toán khi xử lý tài sản bảo đảm","lv":"Nghĩa vụ – bảo đảm","url":"https://hethongphapluat.com/an-le-so-87-2026-al-ve-thu-tu-uu-tien-thanh-toan-khi-xu-ly-tai-san-bao-dam.html"}],"ly":{"root":"Luật Dân sự","ch":[{"t":"Chương 1. Khái quát chung về Luật Dân sự","cs":"Điều 1 – Điều 14 BLDS 2015","b":["Bốn nội dung: khái niệm, đối tượng và phương pháp điều chỉnh; nguyên tắc cơ bản; nguồn; quan hệ pháp luật dân sự."],"c":[{"t":"Khái niệm Luật Dân sự","cs":"Điều 1 BLDS 2015","b":["Ngành luật trong hệ thống pháp luật Việt Nam, tổng hợp các quy phạm pháp luật điều chỉnh quan hệ tài sản mang tính hàng hóa – tiền tệ và quan hệ nhân thân.","Điều chỉnh trên cơ sở bình đẳng, độc lập của các chủ thể khi tham gia quan hệ."]},{"t":"Đối tượng điều chỉnh","cs":"Điều 1 BLDS 2015","b":["Gồm hai nhóm: quan hệ tài sản và quan hệ nhân thân."],"c":[{"t":"Quan hệ tài sản","cs":"Điều 1 BLDS 2015","b":["Quan hệ giữa người với người thông qua tài sản mang tính hàng hóa – tiền tệ.","Đặc điểm: mang tính ý chí; mang tính hàng hóa – tiền tệ; có tính chất đền bù tương đương."]},{"t":"Quan hệ nhân thân","cs":"Điều 1, Điều 25 BLDS 2015","b":["Quan hệ giữa người với người gắn với yếu tố nhân thân của một cá nhân hoặc tổ chức.","Không trị giá được thành tiền; mang lại lợi ích phi vật chất cho chủ thể.","Gồm: quan hệ nhân thân gắn với tài sản và quan hệ nhân thân không gắn với tài sản."]}]},{"t":"Phương pháp điều chỉnh","cs":"Điều 1, Điều 3 BLDS 2015","b":["Bình đẳng, thỏa thuận: các chủ thể bình đẳng về địa vị pháp lý, tự thỏa thuận xác lập quyền và nghĩa vụ."],"c":[{"t":"Bình đẳng","cs":"Khoản 1 Điều 3 BLDS 2015","b":["Vị thế các bên ngang nhau; quyền, nghĩa vụ như nhau khi tham gia quan hệ.","Bình đẳng khi xác lập, thực hiện giao dịch và khi giải quyết tranh chấp."]},{"t":"Tự do ý chí, tự định đoạt","cs":"Khoản 2 Điều 3 BLDS 2015","b":["Tự do đưa ra ý chí; tự do giao kết và thực hiện giao dịch; chủ động thực hiện quyền.","Giới hạn: không vi phạm điều cấm của luật, không trái đạo đức xã hội, không xâm phạm quyền của chủ thể khác."]},{"t":"Độc lập về tài sản","cs":"Điều 1 BLDS 2015","b":["Chủ thể tham gia quan hệ pháp luật dân sự phải độc lập về tài sản."]},{"t":"Trách nhiệm dân sự","cs":"Khoản 5 Điều 3 BLDS 2015","b":["Trách nhiệm dân sự trước hết là trách nhiệm về tài sản.","Các bên có thể thỏa thuận điều kiện phát sinh và hậu quả của trách nhiệm."]}]},{"t":"Nguyên tắc cơ bản","cs":"Điều 3, Điều 7 BLDS 2015","b":["Năm nguyên tắc tại 5 khoản của Điều 3; chính sách của Nhà nước tại Điều 7."],"c":[{"t":"Bình đẳng","cs":"Khoản 1 Điều 3 BLDS 2015","b":["Không được lấy bất kỳ lý do nào để phân biệt đối xử.","Được pháp luật bảo hộ như nhau về quyền nhân thân và quyền tài sản."]},{"t":"Tự do, tự nguyện cam kết, thỏa thuận","cs":"Khoản 2 Điều 3 BLDS 2015","b":["Xác lập, thực hiện, chấm dứt quyền, nghĩa vụ trên cơ sở tự do, tự nguyện.","Cam kết, thỏa thuận không vi phạm điều cấm của luật, không trái đạo đức xã hội thì có hiệu lực với các bên và phải được chủ thể khác tôn trọng."]},{"t":"Thiện chí, trung thực","cs":"Khoản 3 Điều 3 BLDS 2015","b":["Hợp tác, giúp đỡ nhau khi tạo lập, thực hiện quyền và nghĩa vụ.","Cùng tìm biện pháp khắc phục, hạn chế thiệt hại."]},{"t":"Tôn trọng lợi ích Nhà nước, công cộng, người khác","cs":"Khoản 4 Điều 3 BLDS 2015","b":["Không được xâm phạm lợi ích quốc gia, dân tộc, lợi ích công cộng, quyền và lợi ích hợp pháp của người khác."]},{"t":"Tự chịu trách nhiệm dân sự","cs":"Khoản 5 Điều 3 BLDS 2015","b":["Tự chịu trách nhiệm về việc không thực hiện hoặc thực hiện không đúng nghĩa vụ dân sự."]},{"t":"Chính sách của Nhà nước","cs":"Điều 7 BLDS 2015","b":["Tôn trọng đạo đức, truyền thống tốt đẹp, phong tục tập quán tốt đẹp (khoản 1).","Khuyến khích hòa giải; không sử dụng vũ lực hoặc đe dọa sử dụng vũ lực khi tham gia quan hệ và giải quyết tranh chấp dân sự (khoản 2)."]}]},{"t":"Nguồn của Luật Dân sự","cs":"Điều 4, Điều 5, Điều 6 BLDS 2015","b":["Văn bản quy phạm pháp luật là nguồn chủ yếu; tập quán, án lệ áp dụng khi pháp luật không quy định."],"c":[{"t":"Hiến pháp","cs":"Hiến pháp 2013 (Chương II, Chương III)","b":["Quy định những vấn đề chung nhất: quyền con người, quyền và nghĩa vụ cơ bản của công dân, chế độ kinh tế, sở hữu."]},{"t":"Bộ luật Dân sự","cs":"Điều 4 BLDS 2015","b":["Nguồn chủ yếu và trực tiếp; là luật chung điều chỉnh các quan hệ dân sự.","Luật khác có liên quan không được trái nguyên tắc cơ bản tại Điều 3; luật khác không quy định hoặc quy định trái Điều 3 thì áp dụng BLDS."]},{"t":"Luật và văn bản dưới luật có liên quan","cs":"Khoản 2, khoản 3 Điều 4 BLDS 2015","b":["Nguồn bổ trợ, cụ thể hóa BLDS: Luật HNGĐ, Luật Đất đai, Luật Doanh nghiệp, Luật Thương mại, nghị định, nghị quyết HĐTP…"]},{"t":"Tập quán","cs":"Điều 5 BLDS 2015","b":["Quy tắc xử sự có nội dung rõ ràng, được hình thành và lặp lại nhiều lần trong thời gian dài, được thừa nhận rộng rãi.","Chỉ áp dụng khi các bên không có thỏa thuận và pháp luật không quy định; không trái nguyên tắc tại Điều 3."]},{"t":"Áp dụng tương tự pháp luật","cs":"Khoản 1 Điều 6 BLDS 2015","b":["Không có tập quán thì áp dụng quy định pháp luật điều chỉnh quan hệ dân sự tương tự."]},{"t":"Án lệ, lẽ công bằng","cs":"Khoản 2 Điều 6 BLDS 2015","b":["Không thể áp dụng tương tự pháp luật thì áp dụng nguyên tắc cơ bản, án lệ, lẽ công bằng.","Tòa án không được từ chối giải quyết vụ việc dân sự vì lý do chưa có điều luật để áp dụng (khoản 2 Điều 14)."]}]},{"t":"Quan hệ pháp luật dân sự","cs":"Điều 1, Điều 8 BLDS 2015","b":["Quan hệ xã hội được quy phạm pháp luật dân sự điều chỉnh, làm phát sinh quyền và nghĩa vụ của các bên, được Nhà nước bảo đảm thực hiện."],"c":[{"t":"Đặc trưng","cs":"Điều 1, Điều 3 BLDS 2015","b":["Chủ thể đa dạng: cá nhân, pháp nhân, tổ chức.","Tiền đề là quan hệ tài sản (lợi ích vật chất).","Trách nhiệm pháp lý trước hết là trách nhiệm về tài sản.","Địa vị pháp lý các bên bình đẳng."]},{"t":"Thành phần","cs":"Điều 1, Điều 105 BLDS 2015","b":["Gồm chủ thể, khách thể, nội dung."],"c":[{"t":"Chủ thể","cs":"Điều 1 BLDS 2015","b":["Cá nhân, pháp nhân tham gia quan hệ pháp luật dân sự; điều kiện là có năng lực chủ thể (năng lực pháp luật và năng lực hành vi dân sự)."]},{"t":"Khách thể","cs":"Điều 105, Điều 25 BLDS 2015","b":["Lợi ích vật chất hoặc tinh thần mà pháp luật bảo vệ: tài sản; hành vi, dịch vụ; kết quả hoạt động tinh thần sáng tạo; giá trị nhân thân; giá trị quyền sử dụng đất."]},{"t":"Nội dung","cs":"Điều 9, Điều 274 BLDS 2015","b":["Quyền dân sự: cách xử sự được phép (tự thực hiện hành vi, yêu cầu người khác thực hiện, yêu cầu bảo vệ khi bị xâm phạm).","Nghĩa vụ dân sự: cách xử sự bắt buộc; không thực hiện đúng thì phải chịu trách nhiệm."]}]},{"t":"Sự kiện pháp lý","cs":"Điều 8 BLDS 2015","b":["Căn cứ làm phát sinh, thay đổi, chấm dứt quan hệ pháp luật dân sự."],"c":[{"t":"Hành vi pháp lý","cs":"Điều 8 BLDS 2015","b":["Hành vi có mục đích của chủ thể nhằm phát sinh hậu quả pháp lý: hành vi hợp pháp (hợp đồng, hành vi pháp lý đơn phương), hành vi bất hợp pháp (gây thiệt hại), quyết định của cơ quan nhà nước có thẩm quyền."]},{"t":"Sự biến pháp lý","cs":"Điều 8 BLDS 2015","b":["Sự kiện xảy ra không phụ thuộc ý chí của chủ thể: sự biến tuyệt đối (thiên tai), sự biến tương đối (do con người gây ra nhưng không phụ thuộc chủ thể của quan hệ)."]},{"t":"Xử sự pháp lý","cs":"Điều 8, Điều 229 BLDS 2015","b":["Hành vi không nhằm phát sinh hậu quả pháp lý nhưng pháp luật quy định làm phát sinh hậu quả (ví dụ: tìm thấy tài sản bị chôn giấu)."]},{"t":"Thời hạn","cs":"Điều 144, Điều 149 BLDS 2015","b":["Đến một thời điểm nhất định, theo quy định pháp luật làm phát sinh hoặc chấm dứt hậu quả pháp lý."]}]},{"t":"Phân loại","cs":"Điều 158, Điều 274 BLDS 2015","b":["Quan hệ tài sản – quan hệ nhân thân.","Tuyệt đối (chỉ chủ thể quyền được xác định, ví dụ quyền sở hữu) – tương đối (cả chủ thể quyền và chủ thể nghĩa vụ được xác định, ví dụ hợp đồng).","Vật quyền (chủ thể tự thực hiện quyền đối với vật) – trái quyền (thực hiện quyền thông qua hành vi của bên có nghĩa vụ)."]}]}]},{"t":"Chương 2. Chủ thể của quan hệ pháp luật dân sự","cs":"Phần thứ nhất, Chương III – Chương VI BLDS 2015 (Điều 16 – Điều 104)","b":["Chủ thể gồm cá nhân và các tổ chức: pháp nhân, tổ chức không có tư cách pháp nhân, Nhà nước và cơ quan nhà nước."],"c":[{"t":"Cá nhân","cs":"Chương III BLDS 2015 (Điều 16 – Điều 73)","b":["Gồm công dân Việt Nam, người nước ngoài, người không có quốc tịch."],"c":[{"t":"Năng lực pháp luật dân sự","cs":"Điều 16 – Điều 18 BLDS 2015","b":["Khả năng của cá nhân có quyền dân sự và nghĩa vụ dân sự; mọi cá nhân có năng lực pháp luật như nhau."],"c":[{"t":"Thời điểm bắt đầu, kết thúc","cs":"Khoản 3 Điều 16 BLDS 2015","b":["Có từ khi người đó sinh ra và chấm dứt khi người đó chết."]},{"t":"Nội dung","cs":"Điều 17 BLDS 2015","b":["Quyền nhân thân không gắn với tài sản và quyền nhân thân gắn với tài sản.","Quyền sở hữu, quyền thừa kế và quyền khác đối với tài sản.","Quyền tham gia quan hệ dân sự và có nghĩa vụ phát sinh từ quan hệ đó."]},{"t":"Không bị hạn chế","cs":"Điều 18 BLDS 2015","b":["Năng lực pháp luật dân sự của cá nhân không bị hạn chế, trừ trường hợp luật khác có liên quan quy định."]}]},{"t":"Năng lực hành vi dân sự","cs":"Điều 19 – Điều 24 BLDS 2015","b":["Khả năng của cá nhân bằng hành vi của mình xác lập, thực hiện quyền, nghĩa vụ dân sự.","Phụ thuộc độ tuổi, khả năng nhận thức và điều khiển hành vi."],"c":[{"t":"Năng lực hành vi dân sự đầy đủ","cs":"Điều 20 BLDS 2015","b":["Người thành niên (từ đủ 18 tuổi trở lên).","Trừ người mất năng lực hành vi, hạn chế năng lực hành vi hoặc có khó khăn trong nhận thức, làm chủ hành vi."]},{"t":"Năng lực hành vi dân sự một phần (người chưa thành niên)","cs":"Điều 21 BLDS 2015","b":["Dưới 6 tuổi: giao dịch do người đại diện theo pháp luật xác lập, thực hiện.","Từ đủ 6 đến dưới 15 tuổi: giao dịch phải được người đại diện đồng ý, trừ giao dịch phục vụ nhu cầu sinh hoạt hằng ngày phù hợp lứa tuổi.","Từ đủ 15 đến dưới 18 tuổi: tự mình xác lập, thực hiện, trừ giao dịch liên quan bất động sản, động sản phải đăng ký và giao dịch khác luật quy định phải được người đại diện đồng ý."]},{"t":"Người có khó khăn trong nhận thức, làm chủ hành vi","cs":"Điều 23 BLDS 2015","b":["Người thành niên do tình trạng thể chất hoặc tinh thần mà không đủ khả năng nhận thức, làm chủ hành vi nhưng chưa đến mức mất năng lực hành vi dân sự.","Tòa án ra quyết định tuyên bố theo yêu cầu của chính người đó, người có quyền, lợi ích liên quan hoặc cơ quan, tổ chức hữu quan, trên cơ sở kết luận giám định pháp y tâm thần.","Tòa án chỉ định người giám hộ và xác định quyền, nghĩa vụ của người giám hộ."]},{"t":"Người bị hạn chế năng lực hành vi dân sự","cs":"Điều 24 BLDS 2015","b":["Người nghiện ma túy, nghiện các chất kích thích khác dẫn đến phá tán tài sản của gia đình.","Tòa án tuyên bố theo yêu cầu của người có quyền, lợi ích liên quan hoặc cơ quan, tổ chức hữu quan; quyết định người đại diện theo pháp luật và phạm vi đại diện.","Giao dịch liên quan đến tài sản phải có sự đồng ý của người đại diện, trừ giao dịch phục vụ nhu cầu sinh hoạt hằng ngày hoặc luật có quy định khác."]},{"t":"Người mất năng lực hành vi dân sự","cs":"Điều 22 BLDS 2015","b":["Người do bị bệnh tâm thần hoặc mắc bệnh khác mà không thể nhận thức, làm chủ được hành vi.","Tòa án tuyên bố theo yêu cầu, trên cơ sở kết luận giám định pháp y tâm thần.","Giao dịch dân sự phải do người đại diện theo pháp luật xác lập, thực hiện."]}]},{"t":"Tuyên bố vắng mặt, mất tích, chết","cs":"Điều 64 – Điều 73 BLDS 2015","b":["Các trạng thái pháp lý của cá nhân vắng mặt tại nơi cư trú."],"c":[{"t":"Thông báo tìm kiếm người vắng mặt","cs":"Điều 64, Điều 65 BLDS 2015","b":["Biệt tích 06 tháng liền trở lên: người có quyền, lợi ích liên quan yêu cầu Tòa án thông báo tìm kiếm và áp dụng biện pháp quản lý tài sản."]},{"t":"Tuyên bố mất tích","cs":"Điều 68, Điều 70 BLDS 2015","b":["Biệt tích 02 năm liền trở lên, đã thông báo tìm kiếm nhưng không có tin tức xác thực còn sống hay đã chết.","Vợ/chồng của người bị tuyên bố mất tích yêu cầu ly hôn thì Tòa án giải quyết cho ly hôn.","Người bị tuyên bố mất tích trở về: Tòa án hủy quyết định, được nhận lại tài sản."]},{"t":"Tuyên bố chết","cs":"Điều 71 BLDS 2015","b":["Sau 03 năm kể từ ngày quyết định tuyên bố mất tích có hiệu lực mà không có tin tức xác thực còn sống.","Biệt tích trong chiến tranh sau 05 năm kể từ ngày chiến tranh kết thúc.","Bị tai nạn, thảm họa, thiên tai sau 02 năm kể từ ngày đó chấm dứt mà không có tin tức.","Biệt tích 05 năm liền trở lên và không có tin tức xác thực còn sống."]},{"t":"Hủy quyết định tuyên bố chết","cs":"Điều 73 BLDS 2015","b":["Quan hệ nhân thân được khôi phục, trừ: vợ/chồng đã được ly hôn hoặc đã kết hôn với người khác.","Được yêu cầu những người đã nhận tài sản thừa kế trả lại tài sản hiện còn."]}]}]},{"t":"Giám hộ","cs":"Mục 4 Chương III BLDS 2015 (Điều 46 – Điều 63)","b":["Việc cá nhân, pháp nhân được luật quy định, được Ủy ban nhân dân cấp xã cử, được Tòa án chỉ định hoặc được lựa chọn để chăm sóc, bảo vệ quyền, lợi ích hợp pháp của người được giám hộ."],"c":[{"t":"Người được giám hộ","cs":"Khoản 1 Điều 47 BLDS 2015","b":["Một người chỉ được một người giám hộ, trừ cha, mẹ cùng giám hộ con hoặc ông, bà cùng giám hộ cháu (khoản 2 Điều 47)."],"c":[{"t":"Người chưa thành niên","cs":"Điểm a, b khoản 1 Điều 47 BLDS 2015","b":["Không còn cha, mẹ hoặc không xác định được cha, mẹ.","Có cha, mẹ nhưng cha, mẹ đều mất năng lực hành vi, có khó khăn trong nhận thức, làm chủ hành vi, bị hạn chế năng lực hành vi; đều bị Tòa án tuyên bố hạn chế quyền đối với con; hoặc đều không có điều kiện chăm sóc, giáo dục con và có yêu cầu người giám hộ."]},{"t":"Người mất năng lực hành vi dân sự","cs":"Điểm c khoản 1 Điều 47 BLDS 2015","b":["Người đã bị Tòa án tuyên bố mất năng lực hành vi dân sự."]},{"t":"Người có khó khăn trong nhận thức, làm chủ hành vi","cs":"Điểm d khoản 1 Điều 47 BLDS 2015","b":["Người đã bị Tòa án tuyên bố có khó khăn trong nhận thức, làm chủ hành vi."]}]},{"t":"Người giám hộ","cs":"Điều 48 – Điều 54 BLDS 2015","b":["Cá nhân, pháp nhân đủ điều kiện để chăm sóc, bảo vệ quyền, lợi ích hợp pháp của người được giám hộ."],"c":[{"t":"Giám hộ đương nhiên","cs":"Điều 52, Điều 53 BLDS 2015","b":["Của người chưa thành niên: anh ruột là anh cả hoặc chị ruột là chị cả → anh, chị tiếp theo → ông nội, bà nội, ông ngoại, bà ngoại → bác, chú, cậu, cô, dì ruột.","Của người mất năng lực hành vi: vợ/chồng → con cả (con tiếp theo) → cha, mẹ."]},{"t":"Giám hộ được cử, được chỉ định","cs":"Điều 54 BLDS 2015","b":["Không có người giám hộ đương nhiên: Ủy ban nhân dân cấp xã nơi cư trú của người được giám hộ cử người giám hộ.","Có tranh chấp: Tòa án chỉ định.","Người có khó khăn trong nhận thức, làm chủ hành vi: Tòa án chỉ định người giám hộ."]},{"t":"Giám hộ được lựa chọn","cs":"Khoản 2 Điều 48 BLDS 2015","b":["Người có năng lực hành vi dân sự đầy đủ lựa chọn người giám hộ cho mình khi lâm vào tình trạng cần được giám hộ; việc lựa chọn lập thành văn bản có công chứng hoặc chứng thực."]},{"t":"Điều kiện của cá nhân làm người giám hộ","cs":"Điều 49 BLDS 2015","b":["Có năng lực hành vi dân sự đầy đủ.","Có tư cách đạo đức tốt và điều kiện cần thiết để thực hiện quyền, nghĩa vụ của người giám hộ.","Không phải là người đang bị truy cứu trách nhiệm hình sự hoặc người bị kết án nhưng chưa được xóa án tích về tội cố ý xâm phạm tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản của người khác.","Không phải là người bị Tòa án tuyên bố hạn chế quyền đối với con chưa thành niên."]},{"t":"Điều kiện của pháp nhân làm người giám hộ","cs":"Điều 50 BLDS 2015","b":["Có năng lực pháp luật dân sự phù hợp với việc giám hộ.","Có điều kiện cần thiết để thực hiện quyền, nghĩa vụ của người giám hộ."]}]},{"t":"Nghĩa vụ của người giám hộ","cs":"Điều 55, Điều 56, Điều 57 BLDS 2015","b":["Chăm sóc, giáo dục người được giám hộ.","Đại diện cho người được giám hộ trong các giao dịch dân sự.","Quản lý tài sản của người được giám hộ.","Bảo vệ quyền, lợi ích hợp pháp của người được giám hộ."]},{"t":"Quyền của người giám hộ","cs":"Điều 58, Điều 59 BLDS 2015","b":["Sử dụng tài sản của người được giám hộ để chăm sóc, chi dùng cho nhu cầu thiết yếu của người được giám hộ.","Được thanh toán chi phí hợp lý cho việc quản lý tài sản của người được giám hộ.","Đại diện cho người được giám hộ xác lập, thực hiện giao dịch.","Không được đem tài sản của người được giám hộ tặng cho người khác; giao dịch tài sản có giá trị lớn phải được người giám sát việc giám hộ đồng ý (Điều 59)."]}]},{"t":"Tổ chức","cs":"Chương IV, Chương V, Chương VI BLDS 2015 (Điều 74 – Điều 104)","b":["Gồm: pháp nhân; tổ chức không có tư cách pháp nhân; Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, cơ quan nhà nước ở trung ương, ở địa phương."],"c":[{"t":"Pháp nhân","cs":"Chương IV BLDS 2015 (Điều 74 – Điều 96)","b":["Tổ chức thống nhất, độc lập, hợp pháp, có tài sản riêng, tự chịu trách nhiệm bằng tài sản của mình và nhân danh mình tham gia quan hệ pháp luật."],"c":[{"t":"Điều kiện là pháp nhân","cs":"Khoản 1 Điều 74 BLDS 2015","b":["Được thành lập hợp pháp theo BLDS và luật khác có liên quan.","Có cơ cấu tổ chức chặt chẽ (có cơ quan điều hành theo Điều 83).","Có tài sản độc lập với cá nhân, pháp nhân khác và tự chịu trách nhiệm bằng tài sản của mình.","Nhân danh mình tham gia quan hệ pháp luật một cách độc lập."]},{"t":"Phân loại pháp nhân","cs":"Điều 75, Điều 76 BLDS 2015","b":["Pháp nhân thương mại: mục tiêu chính là tìm kiếm lợi nhuận và lợi nhuận được chia cho các thành viên (doanh nghiệp, tổ chức kinh tế khác).","Pháp nhân phi thương mại: không có mục tiêu chính là tìm kiếm lợi nhuận; nếu có lợi nhuận cũng không được phân chia cho thành viên (cơ quan nhà nước, đơn vị vũ trang, tổ chức chính trị – xã hội, quỹ xã hội, tổ chức xã hội – nghề nghiệp…)."]},{"t":"Năng lực pháp luật dân sự của pháp nhân","cs":"Điều 86 BLDS 2015","b":["Phát sinh từ thời điểm được cơ quan nhà nước có thẩm quyền thành lập hoặc cho phép thành lập; nếu phải đăng ký hoạt động thì từ thời điểm ghi vào sổ đăng ký.","Chấm dứt kể từ thời điểm chấm dứt pháp nhân."]},{"t":"Yếu tố lý lịch","cs":"Điều 77 – Điều 84 BLDS 2015","b":["Điều lệ (Điều 77); tên gọi (Điều 78); trụ sở (Điều 79); quốc tịch – pháp nhân thành lập theo pháp luật Việt Nam là pháp nhân Việt Nam (Điều 80); cơ quan điều hành (Điều 83).","Chi nhánh, văn phòng đại diện là đơn vị phụ thuộc, không phải là pháp nhân (Điều 84)."]},{"t":"Đại diện của pháp nhân","cs":"Điều 85 BLDS 2015","b":["Pháp nhân xác lập, thực hiện quyền, nghĩa vụ dân sự thông qua người đại diện theo pháp luật hoặc theo ủy quyền."]},{"t":"Trách nhiệm dân sự của pháp nhân","cs":"Điều 87 BLDS 2015","b":["Chịu trách nhiệm dân sự về nghĩa vụ do người đại diện xác lập, thực hiện nhân danh pháp nhân, bằng tài sản của mình.","Không chịu trách nhiệm thay cho thành viên đối với nghĩa vụ thành viên xác lập không nhân danh pháp nhân, và ngược lại."]},{"t":"Tổ chức lại, chấm dứt pháp nhân","cs":"Điều 88 – Điều 96 BLDS 2015","b":["Hợp nhất (Điều 88), sáp nhập (Điều 89), chia (Điều 90), tách (Điều 91), chuyển đổi hình thức (Điều 92).","Giải thể (Điều 93), phá sản (Điều 95); pháp nhân chấm dứt tồn tại kể từ thời điểm xóa tên trong sổ đăng ký (Điều 96)."]}]},{"t":"Tổ chức không có tư cách pháp nhân","cs":"Chương VI BLDS 2015 (Điều 101 – Điều 104)","b":["Hộ gia đình, tổ hợp tác, tổ chức khác không có tư cách pháp nhân (ví dụ câu lạc bộ)."],"c":[{"t":"Chủ thể tham gia quan hệ","cs":"Điều 101 BLDS 2015","b":["Các thành viên là chủ thể tham gia xác lập, thực hiện giao dịch dân sự hoặc ủy quyền cho người đại diện tham gia.","Việc ủy quyền phải lập thành văn bản, trừ khi có thỏa thuận khác."]},{"t":"Tài sản chung của các thành viên","cs":"Điều 102 BLDS 2015","b":["Xác định, chiếm hữu, sử dụng, định đoạt theo quy định về sở hữu chung."]},{"t":"Trách nhiệm dân sự","cs":"Điều 103 BLDS 2015","b":["Nghĩa vụ phát sinh được bảo đảm thực hiện bằng tài sản chung của các thành viên.","Tài sản chung không đủ thì các thành viên chịu trách nhiệm liên đới bằng tài sản riêng theo phần tương ứng."]},{"t":"Giao dịch do thành viên không có quyền đại diện xác lập","cs":"Điều 104 BLDS 2015","b":["Thành viên không có quyền đại diện hoặc vượt quá phạm vi đại diện mà xác lập, thực hiện giao dịch thì xử lý theo quy định về đại diện (Điều 142, Điều 143)."]}]},{"t":"Nhà nước, cơ quan nhà nước","cs":"Chương V BLDS 2015 (Điều 97 – Điều 100)","b":["Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, cơ quan nhà nước ở trung ương, ở địa phương khi tham gia quan hệ dân sự thì bình đẳng với các chủ thể khác (Điều 97)."],"c":[{"t":"Đại diện tham gia quan hệ dân sự","cs":"Điều 98 BLDS 2015","b":["Thực hiện theo quy định của pháp luật về chức năng, nhiệm vụ, quyền hạn và tổ chức bộ máy của cơ quan nhà nước.","Đại diện thông qua cá nhân, pháp nhân khác chỉ trong trường hợp và theo trình tự, thủ tục pháp luật quy định."]},{"t":"Trách nhiệm về nghĩa vụ dân sự","cs":"Điều 99 BLDS 2015","b":["Chịu trách nhiệm bằng tài sản mà mình là đại diện chủ sở hữu và thống nhất quản lý, trừ tài sản đã chuyển giao cho pháp nhân.","Không chịu trách nhiệm về nghĩa vụ của pháp nhân do mình thành lập (kể cả doanh nghiệp nhà nước), trừ trường hợp bảo lãnh; pháp nhân đó cũng không chịu trách nhiệm về nghĩa vụ của Nhà nước."]},{"t":"Quan hệ dân sự có yếu tố nước ngoài","cs":"Điều 100 BLDS 2015","b":["Chịu trách nhiệm về nghĩa vụ xác lập với nhà nước, pháp nhân, cá nhân nước ngoài khi từ bỏ quyền miễn trừ (theo điều ước quốc tế, theo thỏa thuận hoặc tự mình từ bỏ)."]}]}]}]},{"t":"Chương 3. Giao dịch dân sự, đại diện, thời hạn, thời hiệu","cs":"Chương VIII – Chương X BLDS 2015 (Điều 116 – Điều 157)","b":["Bốn nội dung theo slide: giao dịch dân sự; đại diện; thời hạn; thời hiệu."],"c":[{"t":"Giao dịch dân sự","cs":"Chương VIII BLDS 2015 (Điều 116 – Điều 133)","b":["Hợp đồng hoặc hành vi pháp lý đơn phương làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự (Điều 116)."],"c":[{"t":"Các loại giao dịch dân sự","cs":"Điều 116 BLDS 2015","b":["Hợp đồng: thể hiện ý chí của hai hay nhiều bên.","Hành vi pháp lý đơn phương: thể hiện ý chí của một bên (lập di chúc, hứa thưởng, thi có giải…)."]},{"t":"Giao dịch dân sự có điều kiện","cs":"Điều 120 BLDS 2015","b":["Không phải một loại giao dịch riêng: là giao dịch mà hiệu lực phát sinh hoặc bị hủy bỏ phụ thuộc vào việc xảy ra sự kiện nhất định do các bên thỏa thuận."]},{"t":"Điều kiện có hiệu lực","cs":"Khoản 1 Điều 117 BLDS 2015","b":["Thiếu một trong các điều kiện thì giao dịch vô hiệu, trừ trường hợp BLDS có quy định khác (Điều 122)."],"c":[{"t":"Chủ thể","cs":"Điểm a khoản 1 Điều 117 BLDS 2015","b":["Có năng lực pháp luật dân sự, năng lực hành vi dân sự phù hợp với giao dịch được xác lập.","Cá nhân: theo các mức năng lực hành vi (dưới 6 tuổi; đủ 6 – dưới 15; đủ 15 – dưới 18; từ đủ 18).","Pháp nhân: giao dịch qua người đại diện theo pháp luật hoặc theo ủy quyền."]},{"t":"Ý chí tự nguyện","cs":"Điểm b khoản 1 Điều 117 BLDS 2015","b":["Chủ thể hoàn toàn tự nguyện, tự do bày tỏ ý chí; không bị lừa dối, đe dọa, cưỡng ép."]},{"t":"Mục đích và nội dung","cs":"Điểm c khoản 1 Điều 117 BLDS 2015","b":["Không vi phạm điều cấm của luật, không trái đạo đức xã hội.","Không nhằm che giấu giao dịch khác, không nhằm trốn tránh nghĩa vụ."]},{"t":"Hình thức","cs":"Khoản 2 Điều 117, Điều 119 BLDS 2015","b":["Giao dịch được thể hiện bằng lời nói, bằng văn bản hoặc bằng hành vi cụ thể.","Hình thức là điều kiện có hiệu lực trong trường hợp luật có quy định (văn bản có công chứng, chứng thực, đăng ký)."]}]},{"t":"Giao dịch dân sự vô hiệu","cs":"Điều 122 – Điều 133 BLDS 2015","b":["Giao dịch không có một trong các điều kiện có hiệu lực tại Điều 117 (Điều 122)."],"c":[{"t":"Vô hiệu tuyệt đối","cs":"Điều 123, Điều 124, khoản 3 Điều 132 BLDS 2015","b":["Do vi phạm điều cấm của luật, trái đạo đức xã hội (Điều 123).","Do giả tạo (Điều 124): giao dịch giả tạo vô hiệu; giao dịch bị che giấu vẫn có hiệu lực nếu không vô hiệu theo quy định khác; giả tạo nhằm trốn tránh nghĩa vụ với người thứ ba thì vô hiệu.","Thời hiệu yêu cầu Tòa án tuyên bố vô hiệu không bị hạn chế."]},{"t":"Vô hiệu tương đối","cs":"Điều 125 – Điều 129, Điều 132 BLDS 2015","b":["Do người chưa thành niên, người mất, hạn chế năng lực hành vi, người có khó khăn trong nhận thức xác lập (Điều 125).","Do bị nhầm lẫn (Điều 126).","Do bị lừa dối, đe dọa, cưỡng ép (Điều 127).","Do người xác lập không nhận thức và làm chủ được hành vi của mình (Điều 128).","Do không tuân thủ quy định về hình thức (Điều 129).","Phải có người có quyền yêu cầu và Tòa án tuyên bố; thời hiệu 02 năm (Điều 132)."]},{"t":"Ngoại lệ về hình thức: đã thực hiện 2/3 nghĩa vụ","cs":"Điều 129 BLDS 2015; Án lệ 55/2022/AL","b":["Giao dịch phải lập văn bản nhưng không đúng quy định, hoặc phải công chứng, chứng thực mà không thực hiện, nhưng một bên hoặc các bên đã thực hiện ít nhất 2/3 nghĩa vụ: theo yêu cầu, Tòa án công nhận hiệu lực."]},{"t":"Hậu quả pháp lý","cs":"Điều 131, Điều 133 BLDS 2015","b":["Không làm phát sinh, thay đổi, chấm dứt quyền, nghĩa vụ kể từ thời điểm giao dịch được xác lập.","Khôi phục tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận; không hoàn trả được bằng hiện vật thì trị giá thành tiền.","Bên ngay tình trong việc thu hoa lợi, lợi tức không phải hoàn trả hoa lợi, lợi tức đó.","Bên có lỗi gây thiệt hại phải bồi thường.","Bảo vệ quyền lợi của người thứ ba ngay tình (Điều 133)."]}]}]},{"t":"Đại diện","cs":"Chương IX BLDS 2015 (Điều 134 – Điều 143)","b":["Việc cá nhân, pháp nhân nhân danh và vì lợi ích của cá nhân, pháp nhân khác xác lập, thực hiện giao dịch dân sự (khoản 1 Điều 134).","Cá nhân không được để người khác đại diện nếu pháp luật quy định họ phải tự mình xác lập, thực hiện giao dịch đó."],"c":[{"t":"Đại diện theo pháp luật","cs":"Điều 135, Điều 136, Điều 137 BLDS 2015","b":["Đại diện do pháp luật quy định hoặc do cơ quan nhà nước có thẩm quyền quyết định."],"c":[{"t":"Đại diện theo pháp luật của cá nhân","cs":"Điều 136 BLDS 2015","b":["Cha, mẹ đối với con chưa thành niên.","Người giám hộ đối với người được giám hộ; người giám hộ của người có khó khăn trong nhận thức là người đại diện nếu được Tòa án chỉ định.","Người do Tòa án chỉ định khi không xác định được người đại diện nêu trên.","Người do Tòa án chỉ định đối với người bị hạn chế năng lực hành vi dân sự."]},{"t":"Đại diện theo pháp luật của pháp nhân","cs":"Điều 137 BLDS 2015","b":["Người được pháp nhân chỉ định theo điều lệ.","Người có thẩm quyền đại diện theo quy định của pháp luật.","Người do Tòa án chỉ định trong quá trình tố tụng tại Tòa án.","Một pháp nhân có thể có nhiều người đại diện theo pháp luật, mỗi người có phạm vi và thời hạn đại diện riêng."]}]},{"t":"Đại diện theo ủy quyền","cs":"Điều 135, Điều 138 BLDS 2015","b":["Đại diện được xác lập theo sự ủy quyền giữa người được đại diện và người đại diện.","Cá nhân, pháp nhân ủy quyền cho cá nhân, pháp nhân khác; thành viên hộ gia đình, tổ hợp tác, tổ chức không có tư cách pháp nhân thỏa thuận cử người đại diện.","Người từ đủ 15 đến dưới 18 tuổi có thể là người đại diện theo ủy quyền, trừ giao dịch pháp luật quy định phải do người từ đủ 18 tuổi xác lập."]},{"t":"Thời hạn đại diện","cs":"Khoản 1, khoản 2 Điều 140 BLDS 2015","b":["Xác định theo văn bản ủy quyền, quyết định của cơ quan có thẩm quyền, điều lệ của pháp nhân hoặc theo quy định pháp luật.","Không xác định được: đại diện trong giao dịch cụ thể thì tính đến thời điểm chấm dứt giao dịch đó; trường hợp khác là 01 năm kể từ thời điểm phát sinh quyền đại diện."]},{"t":"Phạm vi đại diện","cs":"Điều 141 BLDS 2015","b":["Chỉ được xác lập, thực hiện giao dịch trong phạm vi đại diện, vì lợi ích của người được đại diện.","Có thể đại diện cho nhiều người nhưng không được xác lập giao dịch với chính mình hoặc với người thứ ba mà mình cũng là người đại diện, trừ trường hợp pháp luật có quy định khác.","Phải thông báo cho bên giao dịch biết về phạm vi đại diện của mình."]},{"t":"Hậu quả pháp lý của hành vi đại diện","cs":"Điều 139 BLDS 2015","b":["Giao dịch trong phạm vi đại diện làm phát sinh quyền, nghĩa vụ đối với người được đại diện.","Người đại diện có quyền xác lập, thực hiện hành vi cần thiết để đạt mục đích đại diện.","Người đại diện biết
