t kỳ lúc nào trước khi giao","Trong 30 ngày kể từ ngày nhận","Trong 01 năm"],"a":0,"e":"Khi các bên không thỏa thuận thời hạn thanh toán thì bên mua phải thanh toán ngay tại thời điểm nhận tài sản.","b":"Khoản 3 Điều 434 BLDS 2015","lv":"VD","id":"7.20","g":7},{"q":"Theo khoản 1 Điều 584 BLDS 2015, căn cứ phát sinh trách nhiệm bồi thường thiệt hại ngoài hợp đồng gồm:","o":["Bắt buộc phải có lỗi cố ý","Chỉ cần có thiệt hại xảy ra","Hành vi xâm phạm, thiệt hại xảy ra và mối quan hệ nhân quả; lỗi không phải căn cứ bắt buộc trong mọi trường hợp","Phải có bản án hình sự"],"a":2,"e":"Khoản 1 Điều 584: người có hành vi xâm phạm gây thiệt hại thì phải bồi thường, trừ trường hợp luật khác quy định khác. Có những trường hợp phải bồi thường cả khi không có lỗi, như nguồn nguy hiểm cao độ (khoản 3 Điều 601). Xem Nghị quyết 02/2022/NQ-HĐTP.","b":"Khoản 1 Điều 584, khoản 3 Điều 601 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","lv":"TH","id":"8.1","g":8},{"q":"Người chịu trách nhiệm bồi thường được giảm mức bồi thường khi:","o":["Có lỗi cố ý nhưng hoàn cảnh khó khăn","Thiệt hại dưới 10 triệu đồng","Không có lỗi hoặc có lỗi vô ý và thiệt hại quá lớn so với khả năng kinh tế của mình","Người bị thiệt hại có thu nhập cao"],"a":2,"e":"Khoản 2 Điều 585: phải đồng thời thỏa mãn hai điều kiện: không có lỗi hoặc có lỗi vô ý, và thiệt hại quá lớn so với khả năng kinh tế. Lỗi cố ý không được giảm mức bồi thường.","b":"Khoản 2 Điều 585 BLDS 2015","lv":"TH","id":"8.2","g":8},{"q":"Thời hiệu khởi kiện yêu cầu bồi thường thiệt hại ngoài hợp đồng là:","o":["03 năm","01 năm","05 năm","02 năm"],"a":0,"e":"Điều 588: thời hiệu là 03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm.","b":"Điều 588 BLDS 2015","lv":"NB","id":"8.3","g":8},{"q":"Cháu K (12 tuổi, có tài sản riêng) gây thiệt hại 40 triệu đồng khi đang chơi ở nhà; cha mẹ K chỉ có thể bồi thường 30 triệu đồng. Phần còn thiếu 10 triệu đồng:","o":["Người bị thiệt hại tự chịu","Ông bà của K phải bồi thường","Lấy tài sản riêng của K để bồi thường","Nhà nước bồi thường"],"a":2,"e":"Khoản 2 Điều 586: người chưa đủ 15 tuổi gây thiệt hại mà còn cha, mẹ thì cha, mẹ phải bồi thường toàn bộ; nếu tài sản của cha, mẹ không đủ mà con có tài sản riêng thì lấy tài sản đó bồi thường phần còn thiếu, trừ trường hợp Điều 599 (đang do trường học, bệnh viện, pháp nhân khác quản lý).","b":"Khoản 2 Điều 586, Điều 599 BLDS 2015","lv":"VD","id":"8.4","g":8},{"q":"A bị B tấn công bằng tay không; A dùng dao đâm B trọng thương, vượt quá giới hạn phòng vệ chính đáng. Trách nhiệm dân sự của A:","o":["Không phải bồi thường vì đang phòng vệ","Phải bồi thường cho B","Nhà nước bồi thường thay A","B phải bồi thường cho A toàn bộ"],"a":1,"e":"Điều 594: người gây thiệt hại trong trường hợp phòng vệ chính đáng không phải bồi thường; nhưng người gây thiệt hại do vượt quá giới hạn phòng vệ chính đáng phải bồi thường cho người bị thiệt hại.","b":"Điều 594 BLDS 2015","lv":"VD","id":"8.5","g":8},{"q":"Nhân viên G của công ty H, trong khi lắp đặt điều hòa theo nhiệm vụ được giao, làm vỡ kính nhà khách hàng. Ai bồi thường cho khách hàng?","o":["G và H mỗi bên một nửa","Riêng G","Công ty H; sau đó H có quyền yêu cầu G (nếu có lỗi) hoàn trả theo quy định của pháp luật","Khách hàng tự chịu"],"a":2,"e":"Điều 600: cá nhân, pháp nhân phải bồi thường thiệt hại do người làm công, người học nghề gây ra khi thực hiện công việc được giao và có quyền yêu cầu người có lỗi hoàn trả một khoản tiền theo quy định của pháp luật.","b":"Điều 600 BLDS 2015","lv":"VD","id":"8.6","g":8},{"q":"Chủ sở hữu nguồn nguy hiểm cao độ KHÔNG phải bồi thường khi:","o":["Mình không có lỗi","Thiệt hại xảy ra hoàn toàn do lỗi cố ý của người bị thiệt hại","Người bị thiệt hại không có bảo hiểm","Thiệt hại xảy ra ban đêm"],"a":1,"e":"Khoản 3 Điều 601: chủ sở hữu, người chiếm hữu nguồn nguy hiểm cao độ phải bồi thường cả khi không có lỗi, trừ trường hợp thiệt hại xảy ra hoàn toàn do lỗi cố ý của người bị thiệt hại; thiệt hại xảy ra trong trường hợp bất khả kháng hoặc tình thế cấp thiết, trừ trường hợp luật có quy định khác.","b":"Khoản 3 Điều 601 BLDS 2015","lv":"TH","id":"8.7","g":8},{"q":"Sức khỏe của C bị xâm phạm; các bên không thỏa thuận được mức bồi thường tổn thất tinh thần. Với mức lương cơ sở 2.530.000 đồng, mức tối đa là:","o":["253 triệu đồng","25,3 triệu đồng","50 triệu đồng","126,5 triệu đồng"],"a":3,"e":"Khoản 2 Điều 590: nếu không thỏa thuận được thì mức tối đa cho một người có sức khỏe bị xâm phạm không quá 50 lần mức lương cơ sở: 50 × 2.530.000 = 126.500.000 đồng. Mức lương cơ sở là mức tại thời điểm giải quyết bồi thường (Nghị quyết 02/2022/NQ-HĐTP; Nghị định 161/2026/NĐ-CP).","b":"Khoản 2 Điều 590 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP; Nghị định 161/2026/NĐ-CP","lv":"VD","id":"8.8","g":8},{"q":"D đi xe máy vượt đèn đỏ và va chạm với ô tô của E (E cũng chạy quá tốc độ); D bị thiệt hại. Phần thiệt hại do lỗi của chính D gây ra:","o":["E phải bồi thường toàn bộ","Nhà nước bồi thường","D không được bồi thường phần thiệt hại do lỗi của mình gây ra","Được bồi thường gấp đôi"],"a":2,"e":"Khoản 4 Điều 585: khi bên bị thiệt hại có lỗi trong việc gây thiệt hại thì không được bồi thường phần thiệt hại do lỗi của mình gây ra; nếu thiệt hại xảy ra hoàn toàn do lỗi của bên bị thiệt hại thì bên gây thiệt hại không phải bồi thường (khoản 2 Điều 584).","b":"Khoản 4 Điều 585 BLDS 2015","lv":"VD","id":"8.9","g":8},{"q":"F uống rượu say đến mức mất khả năng nhận thức, làm chủ hành vi và đập phá tài sản của G. Trách nhiệm của F:","o":["Chỉ bồi thường một nửa","Không phải bồi thường vì không nhận thức được hành vi","Phải bồi thường vì tự đặt mình vào tình trạng mất khả năng nhận thức","Người bán rượu phải bồi thường"],"a":2,"e":"Khoản 1 Điều 596: người do uống rượu hoặc dùng chất kích thích khác mà lâm vào tình trạng mất khả năng nhận thức, làm chủ hành vi, gây thiệt hại thì phải bồi thường.","b":"Khoản 1 Điều 596 BLDS 2015","lv":"VD","id":"8.10","g":8},{"q":"Nguyên tắc bồi thường thiệt hại ngoài hợp đồng là:","o":["Chỉ bồi thường bằng tiền","Bồi thường một nửa thiệt hại","Thiệt hại thực tế phải được bồi thường toàn bộ và kịp thời","Chỉ bồi thường khi có lỗi cố ý"],"a":2,"e":"Các bên có thể thỏa thuận về mức bồi thường, hình thức bồi thường (tiền, hiện vật, thực hiện công việc), phương thức một lần hoặc nhiều lần.","b":"Khoản 1 Điều 585 BLDS 2015","lv":"NB","id":"8.11","g":8},{"q":"Khoản nào KHÔNG thuộc thiệt hại do sức khỏe bị xâm phạm?","o":["Chi phí hợp lý cho việc mai táng","Chi phí hợp lý cho việc cứu chữa, bồi dưỡng, phục hồi sức khỏe","Thu nhập thực tế bị mất hoặc bị giảm sút","Tổn thất về tinh thần"],"a":0,"e":"Chi phí mai táng thuộc thiệt hại do tính mạng bị xâm phạm (Điều 591).","b":"Điều 590, Điều 591 BLDS 2015","lv":"TH","id":"8.12","g":8},{"q":"Nếu các bên không thỏa thuận được, mức bồi thường tổn thất tinh thần khi tính mạng bị xâm phạm tối đa là:","o":["50 lần mức lương cơ sở","Không giới hạn","10 lần mức lương cơ sở","100 lần mức lương cơ sở"],"a":3,"e":"Khoản tiền này dành cho người thân thích thuộc hàng thừa kế thứ nhất; nếu không có thì người mà người bị thiệt hại đã trực tiếp nuôi dưỡng, người đã trực tiếp nuôi dưỡng người bị thiệt hại.","b":"Khoản 2 Điều 591 BLDS 2015","lv":"NB","id":"8.13","g":8},{"q":"Nếu các bên không thỏa thuận được, mức bồi thường tổn thất tinh thần khi danh dự, nhân phẩm, uy tín bị xâm phạm tối đa là:","o":["05 lần mức lương cơ sở","100 lần mức lương cơ sở","10 lần mức lương cơ sở","50 lần mức lương cơ sở"],"a":2,"e":"Mức trần 10 lần lương cơ sở áp dụng cho tổn thất tinh thần do danh dự, nhân phẩm, uy tín bị xâm phạm (so sánh: sức khỏe 50 lần, tính mạng 100 lần).","b":"Khoản 2 Điều 592 BLDS 2015","lv":"NB","id":"8.14","g":8},{"q":"Thời hiệu khởi kiện yêu cầu bồi thường thiệt hại ngoài hợp đồng được tính từ:","o":["Ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm","Ngày xảy ra hành vi gây thiệt hại","Ngày có kết luận giám định","Ngày nộp đơn khởi kiện"],"a":0,"e":"Thời hiệu 03 năm không tính từ ngày xảy ra hành vi mà từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm.","b":"Điều 588 BLDS 2015","lv":"NB","id":"8.15","g":8},{"q":"Ông A chết trong một vụ tai nạn do B gây ra. Các bên không thỏa thuận được mức bồi thường tổn thất tinh thần. Với mức lương cơ sở 2.530.000 đồng, mức tối đa Tòa án có thể buộc B bồi thường cho người thân của ông A về tổn thất tinh thần là:","o":["126,5 triệu đồng","25,3 triệu đồng","253 triệu đồng","506 triệu đồng"],"a":2,"e":"100 × 2.530.000 = 253.000.000 đồng. Mức lương cơ sở áp dụng là mức tại thời điểm giải quyết bồi thường.","b":"Khoản 2 Điều 591 BLDS 2015; Nghị định 161/2026/NĐ-CP","lv":"VD","id":"8.16","g":8},{"q":"Học sinh H (10 tuổi) gây thương tích cho bạn trong giờ học tại trường. Trách nhiệm bồi thường:","o":["H tự bồi thường bằng tài sản riêng","Không ai phải bồi thường","Cha mẹ H luôn phải bồi thường","Trường học bồi thường; nếu trường chứng minh mình không có lỗi trong quản lý thì cha mẹ H phải bồi thường"],"a":3,"e":"Người chưa đủ 15 tuổi gây thiệt hại trong thời gian trường học trực tiếp quản lý thì trường học bồi thường; nếu trường chứng minh không có lỗi trong quản lý thì cha, mẹ phải bồi thường.","b":"Khoản 1, 3 Điều 599 BLDS 2015","lv":"VD","id":"8.17","g":8},{"q":"Cây cổ thụ trong vườn ông C bị đổ do bão lớn (sự kiện bất khả kháng), đè hỏng xe của D đỗ đúng nơi quy định. Ông C đã thường xuyên chăm sóc, chằng chống cây. Nhận định đúng:","o":["Ông C không phải bồi thường nếu chứng minh thiệt hại xảy ra hoàn toàn do sự kiện bất khả kháng","Ông C phải bồi thường trong mọi trường hợp","UBND xã phải bồi thường","Ông C và D mỗi người chịu một nửa"],"a":0,"e":"Chủ sở hữu, người chiếm hữu, người quản lý cây cối phải bồi thường thiệt hại do cây cối gây ra, nhưng không phải bồi thường trong trường hợp thiệt hại phát sinh do sự kiện bất khả kháng, trừ trường hợp có thỏa thuận khác hoặc luật có quy định khác.","b":"Khoản 2 Điều 584, Điều 605 BLDS 2015","lv":"VD","id":"8.18","g":8},{"q":"Tài xế F của công ty E điều khiển xe ô tô của công ty đi giao hàng thì gây tai nạn. Chủ thể chịu trách nhiệm bồi thường trước người bị thiệt hại là:","o":["Doanh nghiệp bảo hiểm trong mọi trường hợp","Riêng tài xế F","Người bị thiệt hại tự chịu","Công ty E"],"a":3,"e":"Công ty E vừa là chủ sở hữu nguồn nguy hiểm cao độ vừa là người sử dụng người lao động; sau khi bồi thường, E có quyền yêu cầu F (nếu có lỗi) hoàn trả theo quy định.","b":"Điều 600, Điều 601 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","lv":"VD","id":"8.19","g":8},{"q":"G và H cùng đánh I gây thương tích. Trách nhiệm bồi thường của G và H là:","o":["Liên đới bồi thường; trách nhiệm của mỗi người xác định tương ứng với mức độ lỗi, nếu không xác định được thì chia đều","I tự chịu","Mỗi người bồi thường toàn bộ thiệt hại một cách độc lập","Chỉ người gây thương tích nặng hơn bồi thường"],"a":0,"e":"Nhiều người cùng gây thiệt hại thì phải liên đới bồi thường; phần trách nhiệm của từng người xác định tương ứng mức độ lỗi, không xác định được thì chia đều.","b":"Điều 587 BLDS 2015","lv":"VD","id":"8.20","g":8},{"q":"Điều kiện về độ tuổi kết hôn theo Luật HNGĐ 2014 là:","o":["Nam từ đủ 21 tuổi trở lên, nữ từ đủ 19 tuổi trở lên","Nam, nữ từ đủ 20 tuổi trở lên","Nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên","Nam, nữ từ đủ 18 tuổi trở lên"],"a":2,"e":"Điểm a khoản 1 Điều 8 Luật HNGĐ 2014: nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên. Ngoài ra còn các điều kiện: tự nguyện; không bị mất năng lực hành vi dân sự; không thuộc trường hợp cấm kết hôn.","b":"Điểm a khoản 1 Điều 8 Luật HNGĐ 2014","lv":"NB","id":"9.1","g":9},{"q":"Theo Luật HNGĐ 2014, đối với hôn nhân giữa những người cùng giới tính:","o":["Pháp luật cấm và xử phạt","Được đăng ký nếu có con nuôi chung","Nhà nước không thừa nhận","Được đăng ký kết hôn như nam nữ"],"a":2,"e":"Khoản 2 Điều 8 Luật HNGĐ 2014: Nhà nước không thừa nhận hôn nhân giữa những người cùng giới tính. Luật 2014 đã bỏ quy định cấm kết hôn cùng giới của Luật 2000 nhưng không thừa nhận quan hệ này.","b":"Khoản 2 Điều 8 Luật HNGĐ 2014","lv":"TH","id":"9.2","g":9},{"q":"Tài sản mà vợ được thừa kế riêng trong thời kỳ hôn nhân là:","o":["Tài sản riêng của vợ, trừ trường hợp vợ chồng thỏa thuận nhập vào tài sản chung","Tài sản chung của vợ chồng","Tài sản chung của gia đình","Tài sản chung nếu được dùng cho sinh hoạt"],"a":0,"e":"Khoản 1 Điều 43 Luật HNGĐ 2014: tài sản được thừa kế riêng, tặng cho riêng trong thời kỳ hôn nhân là tài sản riêng; chỉ thành tài sản chung khi vợ chồng thỏa thuận nhập (khoản 1 Điều 33, Điều 46).","b":"Khoản 1 Điều 33, khoản 1 Điều 43 Luật HNGĐ 2014","lv":"TH","id":"9.3","g":9},{"q":"Thỏa thuận về chế độ tài sản của vợ chồng phải đáp ứng yêu cầu nào?","o":["Lập trước khi kết hôn, bằng văn bản có công chứng hoặc chứng thực","Đăng ký tại Tòa án","Lập sau khi đăng ký kết hôn, bằng văn bản","Lập bằng lời nói trước người làm chứng"],"a":0,"e":"Điều 47 Luật HNGĐ 2014: thỏa thuận phải được lập trước khi kết hôn, bằng hình thức văn bản có công chứng hoặc chứng thực; chế độ tài sản theo thỏa thuận được xác lập kể từ ngày đăng ký kết hôn.","b":"Điều 47 Luật HNGĐ 2014","lv":"TH","id":"9.4","g":9},{"q":"Theo khoản 3 Điều 51 Luật HNGĐ 2014, chồng KHÔNG có quyền yêu cầu ly hôn khi vợ:","o":["Đang thất nghiệp","Đang nuôi con dưới 36 tháng tuổi","Đang điều trị bệnh","Đang có thai, sinh con hoặc đang nuôi con dưới 12 tháng tuổi"],"a":3,"e":"Khoản 3 Điều 51: chồng không có quyền yêu cầu ly hôn trong trường hợp vợ đang có thai, sinh con hoặc đang nuôi con dưới 12 tháng tuổi. Nghị quyết 01/2024/NQ-HĐTP hướng dẫn hạn chế này áp dụng không phụ thuộc vào việc vợ có thai, sinh con với ai.","b":"Khoản 3 Điều 51 Luật HNGĐ 2014; Điều 2 Nghị quyết 01/2024/NQ-HĐTP","lv":"TH","id":"9.5","g":9},{"q":"Anh N bị Tòa án tuyên bố mất tích. Quan hệ hôn nhân giữa anh N và vợ:","o":["Chấm dứt sau 01 năm kể từ ngày tuyên bố mất tích","Vẫn tồn tại; vợ anh N có quyền yêu cầu ly hôn và được Tòa án giải quyết cho ly hôn","Chuyển thành hôn nhân tạm hoãn","Đương nhiên chấm dứt khi quyết định tuyên bố mất tích có hiệu lực"],"a":1,"e":"Tuyên bố mất tích không làm chấm dứt hôn nhân; đó là căn cứ để bên kia yêu cầu và được Tòa án giải quyết cho ly hôn (khoản 2 Điều 56 Luật HNGĐ, khoản 2 Điều 68 BLDS). Hôn nhân chấm dứt khi một bên chết, bị tuyên bố đã chết (Điều 65) hoặc ly hôn.","b":"Khoản 2 Điều 56, Điều 65 Luật HNGĐ 2014; khoản 2 Điều 68 BLDS 2015","lv":"VD","id":"9.6","g":9},{"q":"Khi ly hôn, vợ chồng có con chung 2 tuổi và không thỏa thuận được người trực tiếp nuôi con; người mẹ đủ điều kiện chăm sóc con. Tòa án giao con cho:","o":["Người cha vì có thu nhập cao hơn","Theo nguyện vọng của con","Người mẹ trực tiếp nuôi","Ông bà nội"],"a":2,"e":"Khoản 3 Điều 81 Luật HNGĐ 2014: con dưới 36 tháng tuổi được giao cho mẹ trực tiếp nuôi, trừ trường hợp người mẹ không đủ điều kiện trực tiếp trông nom, chăm sóc, nuôi dưỡng, giáo dục con hoặc cha mẹ có thỏa thuận khác phù hợp với lợi ích của con. Tham khảo Án lệ 54/2022/AL.","b":"Khoản 3 Điều 81 Luật HNGĐ 2014; Án lệ số 54/2022/AL","lv":"VD","id":"9.7","g":9},{"q":"H và K đã ly hôn, nay muốn xác lập lại quan hệ vợ chồng. Họ phải:","o":["Thông báo cho UBND cấp xã","Đăng ký kết hôn","Làm đơn xin Tòa án hủy bản án ly hôn","Chỉ cần chung sống lại với nhau"],"a":1,"e":"Khoản 2 Điều 9 Luật HNGĐ 2014: vợ chồng đã ly hôn muốn xác lập lại quan hệ vợ chồng thì phải đăng ký kết hôn; chung sống lại mà không đăng ký không làm phát sinh quan hệ vợ chồng.","b":"Khoản 2 Điều 9 Luật HNGĐ 2014","lv":"VD","id":"9.8","g":9},{"q":"Ngôi nhà là tài sản chung và là nơi ở duy nhất của vợ chồng, giấy chứng nhận chỉ đứng tên chồng. Người chồng muốn bán nhà. Yêu cầu đúng là:","o":["Chỉ cần báo miệng cho vợ","Phải có sự thỏa thuận bằng văn bản của vợ chồng","Phải có quyết định của Tòa án","Chồng tự quyết vì nhà đứng tên chồng"],"a":1,"e":"Khoản 2 Điều 35 Luật HNGĐ 2014: việc định đoạt bất động sản chung, tài sản chung là nguồn thu nhập chủ yếu của gia đình phải có thỏa thuận bằng văn bản của vợ chồng; Điều 31 bảo vệ quyền về chỗ ở của vợ chồng. Giao dịch trái quy định có thể bị tuyên vô hiệu theo yêu cầu của bên kia, trừ trường hợp người thứ ba ngay tình được bảo vệ theo quy định.","b":"Điều 26, Điều 31, khoản 2 Điều 35 Luật HNGĐ 2014","lv":"VD","id":"9.9","g":9},{"q":"Đặc điểm của nghĩa vụ cấp dưỡng theo Luật HNGĐ 2014 là:","o":["Chấm dứt khi người cấp dưỡng chuyển nơi cư trú","Có thể thay thế bằng nghĩa vụ khác nếu các bên đồng ý","Có thể chuyển giao cho người khác","Không thể thay thế bằng nghĩa vụ khác và không thể chuyển giao cho người khác"],"a":3,"e":"Khoản 2 Điều 107 Luật HNGĐ 2014: nghĩa vụ cấp dưỡng không thể thay thế bằng nghĩa vụ khác và không thể chuyển giao cho người khác; chuyển nơi cư trú không làm chấm dứt nghĩa vụ.","b":"Khoản 2 Điều 107 Luật HNGĐ 2014","lv":"TH","id":"9.10","g":9},{"q":"Hành vi nào KHÔNG thuộc các hành vi bị cấm theo khoản 2 Điều 5 Luật HNGĐ 2014?","o":["Tảo hôn, cưỡng ép kết hôn","Kết hôn giả tạo","Kết hôn giữa những người khác tôn giáo","Người đang có vợ, có chồng mà kết hôn với người khác"],"a":2,"e":"Pháp luật không cấm kết hôn giữa những người khác tôn giáo; ngược lại, cản trở kết hôn mới là hành vi bị cấm.","b":"Khoản 2 Điều 5 Luật HNGĐ 2014","lv":"TH","id":"9.11","g":9},{"q":"Người tự mình có quyền yêu cầu Tòa án hủy việc kết hôn trái pháp luật do bị cưỡng ép, bị lừa dối kết hôn là:","o":["UBND cấp xã","Công an cấp xã","Hàng xóm của người bị cưỡng ép","Người bị cưỡng ép, bị lừa dối kết hôn"],"a":3,"e":"Người này cũng có quyền đề nghị cá nhân, tổ chức quy định tại khoản 2 Điều 10 yêu cầu Tòa án hủy việc kết hôn trái pháp luật.","b":"Khoản 1 Điều 10 Luật HNGĐ 2014","lv":"NB","id":"9.12","g":9},{"q":"Tài sản nào KHÔNG phải tài sản chung của vợ chồng (khi không có thỏa thuận khác)?","o":["Quyền sử dụng đất có được sau khi kết hôn (trừ thừa kế riêng, tặng cho riêng, giao dịch bằng tài sản riêng)","Tài sản mỗi người có trước khi kết hôn","Thu nhập do lao động trong thời kỳ hôn nhân","Hoa lợi, lợi tức phát sinh từ tài sản riêng trong thời kỳ hôn nhân"],"a":1,"e":"Tài sản có trước khi kết hôn là tài sản riêng (Điều 43). Hoa lợi, lợi tức từ tài sản riêng trong thời kỳ hôn nhân là tài sản chung (khoản 1 Điều 33).","b":"Điều 33, Điều 43 Luật HNGĐ 2014","lv":"TH","id":"9.13","g":9},{"q":"Con sinh ra trong thời hạn bao nhiêu ngày kể từ thời điểm chấm dứt hôn nhân được coi là con do người vợ có thai trong thời kỳ hôn nhân?","o":["365 ngày","400 ngày","200 ngày","300 ngày"],"a":3,"e":"Đây là suy đoán pháp lý về con chung; cha mẹ có quyền yêu cầu xác định lại (Điều 88, Điều 89).","b":"Khoản 1 Điều 88 Luật HNGĐ 2014","lv":"NB","id":"9.14","g":9},{"q":"Khi giải quyết việc nuôi con sau ly hôn, Tòa án phải xem xét nguyện vọng của con nếu con từ đủ:","o":["15 tuổi","07 tuổi","09 tuổi","05 tuổi"],"a":1,"e":"Con từ đủ 07 tuổi trở lên thì Tòa án phải xem xét nguyện vọng của con; con dưới 36 tháng tuổi được giao cho mẹ trực tiếp nuôi, trừ trường hợp người mẹ không đủ điều kiện hoặc cha mẹ có thỏa thuận khác.","b":"Khoản 2 Điều 81 Luật HNGĐ 2014","lv":"NB","id":"9.15","g":9},{"q":"Vợ chồng A – B tạo lập căn nhà trong thời kỳ hôn nhân, giấy chứng nhận chỉ đứng tên A. Khi ly hôn, căn nhà được giải quyết:","o":["Thuộc về A vì A đứng tên","Về nguyên tắc chia đôi, có tính đến hoàn cảnh gia đình, công sức đóng góp, bảo vệ lợi ích chính đáng trong sản xuất kinh doanh, lỗi của mỗi bên","Thuộc về người trực tiếp nuôi con","Chia theo tỷ lệ thu nhập của mỗi người"],"a":1,"e":"Nhà tạo lập trong thời kỳ hôn nhân là tài sản chung dù chỉ đứng tên một bên (Điều 33, Điều 34). Hướng dẫn chi tiết tại Điều 7 TTLT 01/2016/TTLT-TANDTC-VKSNDTC-BTP.","b":"Điều 33, Điều 34, khoản 2 Điều 59 Luật HNGĐ 2014","lv":"VD","id":"9.16","g":9},{"q":"Vợ chồng thỏa thuận chia một phần tài sản chung trong thời kỳ hôn nhân. Phần tài sản đã chia và hoa lợi, lợi tức phát sinh từ phần đó:","o":["Phải nộp vào ngân sách","Là tài sản riêng của mỗi bên, trừ trường hợp vợ chồng có thỏa thuận khác","Vẫn là tài sản chung","Thuộc về người có thu nhập cao hơn"],"a":1,"e":"Phần tài sản còn lại không chia vẫn là tài sản chung.","b":"Khoản 1 Điều 40 Luật HNGĐ 2014","lv":"VD","id":"9.17","g":9},{"q":"Anh D (chồng) vay 50 triệu đồng để đóng học phí, mua sữa cho con. Trách nhiệm trả khoản nợ này thuộc về:","o":["Không ai phải trả vì vợ không ký","Vợ chồng liên đới","Chỉ anh D","Chỉ vợ anh D"],"a":1,"e":"Giao dịch nhằm đáp ứng nhu cầu thiết yếu của gia đình làm phát sinh trách nhiệm liên đới của vợ chồng.","b":"Điều 27, Điều 30, Điều 37 Luật HNGĐ 2014","lv":"VD","id":"9.18","g":9},{"q":"Sau ly hôn, người không trực tiếp nuôi con:","o":["Có thể chuyển nghĩa vụ cấp dưỡng cho ông bà","Chỉ cấp dưỡng khi con đã thành niên","Không còn quyền, nghĩa vụ gì đối với con","Có nghĩa vụ cấp dưỡng cho con và có quyền thăm nom con, không ai được cản trở"],"a":3,"e":"Cha mẹ vẫn có quyền, nghĩa vụ trông nom, nuôi dưỡng, chăm sóc, giáo dục con sau ly hôn.","b":"Điều 81, Điều 82 Luật HNGĐ 2014","lv":"VD","id":"9.19","g":9},{"q":"Sau khi ly hôn, một bên có nghĩa vụ cấp dưỡng cho bên kia khi:","o":["Luôn luôn","Chỉ khi có con chung","Bên kia khó khăn, túng thiếu, có yêu cầu cấp dưỡng và có lý do chính đáng","Không bao giờ"],"a":2,"e":"Nghĩa vụ cấp dưỡng chấm dứt khi bên được cấp dưỡng sau ly hôn đã kết hôn (Điều 118).","b":"Điều 115, Điều 118 Luật HNGĐ 2014","lv":"VD","id":"9.20","g":9},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Quan hệ \"vần công\" giữa hai gia đình có thuộc đối tượng điều chỉnh của luật dân sự không?","o":["Không, vì đây chỉ là quan hệ tình cảm làng xóm, không mang tính tài sản","Không, vì thỏa thuận miệng không có giá trị pháp lý","Có, nhưng chỉ khi thỏa thuận được Ủy ban nhân dân xã xác nhận","Có, vì đây là quan hệ tài sản dựa trên bình đẳng, tự nguyện"],"a":3,"e":"Điều 1 BLDS 2015: luật dân sự điều chỉnh quan hệ nhân thân và quan hệ tài sản của cá nhân, pháp nhân trên cơ sở bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm. Góp công lao động có giá trị bằng tiền nên là quan hệ tài sản; hình thức miệng không làm quan hệ đó nằm ngoài luật dân sự.","b":"Điều 1 BLDS 2015","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Hai bên không thỏa thuận và pháp luật không quy định riêng. Tòa án có thể áp dụng tập quán trong bản không?","o":["Có, nếu tập quán không trái nguyên tắc cơ bản","Không, Tòa án chỉ được áp dụng văn bản quy phạm pháp luật","Có, Tòa án được áp dụng mọi tập quán đang tồn tại trong cộng đồng","Có, nhưng chỉ khi cả hai bên cùng đồng ý áp dụng tập quán"],"a":0,"e":"Khoản 2 Điều 5 BLDS 2015: trường hợp các bên không có thỏa thuận và pháp luật không quy định thì có thể áp dụng tập quán nhưng tập quán áp dụng không được trái với các nguyên tắc cơ bản của pháp luật dân sự quy định tại Điều 3. Tập quán \"không góp công lại thì trả tiền công theo giá phổ biến\" đáp ứng điều kiện này; luật không đòi hỏi các bên phải đồng ý.","b":"Khoản 2 Điều 5, Điều 3 BLDS 2015","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Giả sử trong bản không có tập quán về vấn đề này. Tòa án giải quyết theo thứ tự nào?","o":["Đề nghị Quốc hội ban hành luật để có căn cứ giải quyết","Đình chỉ giải quyết vì không có căn cứ pháp lý để áp dụng","Áp dụng tương tự pháp luật; sau đó là nguyên tắc cơ bản, án lệ, lẽ công bằng","Áp dụng ngay lẽ công bằng theo đánh giá của Thẩm phán"],"a":2,"e":"Điều 6 BLDS 2015: trường hợp phát sinh quan hệ thuộc phạm vi điều chỉnh của luật dân sự mà các bên không có thỏa thuận, pháp luật không có quy định và không có tập quán được áp dụng thì áp dụng quy định của pháp luật điều chỉnh quan hệ dân sự tương tự (khoản 1); nếu không thể áp dụng tương tự pháp luật thì áp dụng các nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng (khoản 2).","b":"Điều 6 BLDS 2015","cid":"TH1.01"},{"id":"TH1.01.4","g":1,"lv":"VD","q":"Anh Xôm đề nghị Tòa án không thụ lý vì \"luật không có điều nào quy định về vần công\". Đề nghị này được giải quyết thế nào?","o":["Chấp nhận, vì Tòa án chỉ giải quyết khi có điều luật cụ thể","Không chấp nhận; Tòa án không được từ chối vì chưa có điều luật","Chấp nhận, và hướng dẫn anh Pòm đề nghị Ủy ban nhân dân xã giải quyết","Tạm đình chỉ để chờ hướng dẫn của Tòa án nhân dân tối cao"],"a":1,"e":"Khoản 2 Điều 14 BLDS 2015: Tòa án không được từ chối giải quyết vụ việc dân sự vì lý do chưa có điều luật để áp dụng; trường hợp này, quyền dân sự được giải quyết theo tập quán hoặc tương tự pháp luật (Điều 5, Điều 6).","b":"Khoản 2 Điều 14 BLDS 2015","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Quan hệ mua bán đất giữa Ủy ban nhân dân xã và bà Liên thuộc loại quan hệ nào?","o":["Quan hệ dân sự, vì xã tham gia như chủ thể bình đẳng","Quan hệ hành chính, vì một bên là cơ quan nhà nước","Quan hệ đất đai giữa Nhà nước với người sử dụng đất theo thủ tục thu hồi","Quan hệ hành chính, vì mục đích là phục vụ lợi ích cộng đồng"],"a":0,"e":"Điều 97 BLDS 2015: Nhà nước, cơ quan nhà nước tham gia quan hệ dân sự bình đẳng với các chủ thể khác. Dự án không thuộc trường hợp thu hồi đất, xã ký hợp đồng mua bán nên đây là quan hệ tài sản thuộc đối tượng điều chỉnh của luật dân sự (Điều 1), không phải quan hệ quyền lực – phục tùng.","b":"Điều 1, Điều 97 BLDS 2015","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Hành vi của Chủ tịch xã vi phạm những nguyên tắc cơ bản nào?","o":["Nguyên tắc tự chịu trách nhiệm dân sự của chủ thể","Không vi phạm, vì xã có quyền quản lý đất đai trên địa bàn","Nguyên tắc bình đẳng; tự do, tự nguyện thỏa thuận","Nguyên tắc thiện chí, trung thực và nguyên tắc tôn trọng đạo đức"],"a":2,"e":"Khoản 1 Điều 3 BLDS 2015: mọi cá nhân, pháp nhân đều bình đẳng, không được lấy bất kỳ lý do nào để phân biệt đối xử. Khoản 2: cá nhân, pháp nhân xác lập, thực hiện quyền, nghĩa vụ dân sự trên cơ sở tự do, tự nguyện cam kết, thỏa thuận. Dùng thẩm quyền hành chính để ép bà Liên ký là vi phạm cả hai nguyên tắc.","b":"Khoản 1, khoản 2 Điều 3 BLDS 2015","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Bà Liên có thể yêu cầu Tòa án tuyên bố hợp đồng vô hiệu trên căn cứ nào?","o":["Vi phạm điều cấm của luật về chuyển nhượng đất","Bị đe dọa, vì bà ký do sợ thiệt hại cho quyền lợi của con","Giả tạo, vì giá ghi trong hợp đồng thấp hơn thực tế","Nhầm lẫn về đối tượng của hợp đồng"],"a":1,"e":"Điều 127 BLDS 2015: đe dọa, cưỡng ép trong giao dịch dân sự là hành vi cố ý của một bên hoặc người thứ ba làm cho bên kia buộc phải thực hiện giao dịch nhằm tránh thiệt hại về tính mạng, sức khỏe, danh dự, uy tín, nhân phẩm, tài sản của mình hoặc của người thân thích của mình. Bà Liên ký để tránh thiệt hại cho con nên có quyền yêu cầu tuyên bố vô hiệu.","b":"Điều 127 BLDS 2015","cid":"TH1.02"},{"id":"TH1.02.4","g":1,"lv":"VD","q":"Thời hiệu để bà Liên yêu cầu tuyên bố hợp đồng vô hiệu được tính thế nào?","o":["03 năm kể từ ngày ký hợp đồng","Không có thời hạn, vì giao dịch vi phạm nguyên tắc cơ bản","01 năm kể từ ngày bà Liên nhận tiền","02 năm kể từ ngày chấm dứt hành vi đe dọa"],"a":3,"e":"Điểm c khoản 1 Điều 132 BLDS 2015: thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu do bị đe dọa, cưỡng ép là 02 năm kể từ ngày người có hành vi đe dọa, cưỡng ép chấm dứt hành vi đó.","b":"Điểm c khoản 1 Điều 132 BLDS 2015","cid":"TH1.02"},{"id":"TH1.03.1","g":1,"lv":"VD","q":"Lập luận \"nhà tôi, tôi có quyền kinh doanh\" của bà Thảo sai ở điểm nào?","o":["Không sai, ông Tín phải tự lắp cách âm cho nhà mình","Chỉ sai nếu bà Thảo chưa đăng ký kinh doanh","Bà Thảo không có quyền sử dụng nhà ở để kinh doanh","Thực hiện quyền không được xâm phạm lợi ích hợp pháp của người khác"],"a":3,"e":"Khoản 4 Điều 3 BLDS 2015: việc xác lập, thực hiện, chấm dứt quyền, nghĩa vụ dân sự không được xâm phạm đến lợi ích quốc gia, dân tộc, lợi ích công cộng, quyền và lợi ích hợp pháp của người khác. Khoản 1 Điều 10: cá nhân không được lạm dụng quyền dân sự của mình gây thiệt hại cho người khác. Quyền kinh doanh có giới hạn.","b":"Khoản 4 Điều 3, khoản 1 Điều 10 BLDS 2015","cid":"TH1.03"},{"id":"TH1.03.2","g":1,"lv":"VD","q":"Ông Tín có thể yêu cầu cơ quan có thẩm quyền áp dụng phương thức bảo vệ quyền dân sự nào?","o":["Chỉ được yêu cầu Ủy ban nhân dân xã đóng cửa quán vĩnh viễn","Yêu cầu Tòa án tịch thu toàn bộ thiết bị karaoke","Buộc chấm dứt vi phạm và bồi thường thiệt hại","Chỉ được yêu cầu bà Thảo xin lỗi công khai"],"a":2,"e":"Điều 11 BLDS 2015: khi quyền dân sự bị xâm phạm, cá nhân có quyền tự bảo vệ hoặc yêu cầu cơ quan, tổ chức có thẩm quyền: công nhận, tôn trọng, bảo vệ và bảo đảm quyền; buộc chấm dứt hành vi vi phạm; buộc xin lỗi, cải chính công khai; buộc thực hiện nghĩa vụ; buộc bồi thường thiệt hại… Tịch thu thiết bị không phải phương thức bảo vệ quyền dân sự.","b":"Điều 11, Điều 14 BLDS 2015","cid":"TH1.03"},{"id":"TH1.03.3","g":1,"lv":"VD","q":"Việc ông Tín tự ý cắt cầu dao điện làm hỏng thiết bị của quán được đánh giá thế nào?","o":["Chỉ vi phạm nếu ông Tín không báo trước cho bà Thảo","Vượt quá giới hạn tự bảo vệ; có thể phải bồi thường","Hợp pháp, vì bà Thảo đã vi phạm trước","Hợp pháp, vì là biện pháp tự bảo vệ quyền dân sự"],"a":1,"e":"Điều 12 BLDS 2015: việc tự bảo vệ quyền dân sự phải phù hợp với tính chất, mức độ xâm phạm đến quyền dân sự đó và không được trái với các nguyên tắc cơ bản của pháp luật dân sự. Cắt điện làm hỏng tài sản của người khác là hành vi trái pháp luật gây thiệt hại, có thể phát sinh trách nhiệm bồi thường (Điều 584).","b":"Điều 12, Điều 584 BLDS 2015","cid":"TH1.03"},{"id":"TH1.03.4","g":1,"lv":"VD","q":"Nếu bà Thảo vẫn không chấm dứt vi phạm, cơ quan nào có thẩm quyền giải quyết yêu cầu bồi thường của ông Tín?","o":["Tòa án, theo thủ tục giải quyết tranh chấp dân sự","Hội đồng nhân dân xã nơi có quán karaoke","Chỉ Tổ hòa giải ở cơ sở nơi hai gia đình cư trú","Công an phường quyết định mức bồi thường"],"a":0,"e":"Điều 14 BLDS 2015: Tòa án, cơ quan có thẩm quyền khác có trách nhiệm tôn trọng, bảo vệ quyền dân sự. Yêu cầu bồi thường thiệt hại là tranh chấp dân sự thuộc thẩm quyền của Tòa án; việc xử phạt vi phạm hành chính về tiếng ồn do cơ quan hành chính thực hiện, không quyết định mức bồi thường.","b":"Điều 14 BLDS 2015","cid":"TH1.03"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Năng lực hành vi dân sự của Quân được xác định thế nào?","o":["Chưa đầy đủ; một số giao dịch cần người đại diện đồng ý","Bị hạn chế năng lực hành vi dân sự theo quyết định của Tòa án","Không có năng lực hành vi dân sự vì chưa thành niên","Đầy đủ, vì Quân đã đi làm và có thu nhập riêng"],"a":0,"e":"Khoản 4 Điều 21 BLDS 2015: người từ đủ 15 tuổi đến chưa đủ 18 tuổi tự mình xác lập, thực hiện giao dịch dân sự, trừ giao dịch dân sự liên quan đến bất động sản, động sản phải đăng ký và giao dịch dân sự khác theo quy định của luật phải được người đại diện theo pháp luật đồng ý. Việc có thu nhập không làm Quân có năng lực hành vi đầy đủ.","b":"Khoản 4 Điều 21 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Giao dịch mua điện thoại 5 triệu đồng của Quân có hiệu lực không?","o":["Không, vì người chưa thành niên không được tự mua tài sản","Chỉ có hiệu lực khi cha mẹ Quân ký xác nhận","Có, vì điện thoại không phải động sản phải đăng ký","Có hiệu lực chỉ khi giá trị giao dịch dưới 2 triệu đồng"],"a":2,"e":"Theo khoản 4 Điều 21 BLDS 2015, giao dịch mua điện thoại không thuộc nhóm phải có người đại diện đồng ý; Quân tự mình xác lập và giao dịch có hiệu lực nếu đáp ứng các điều kiện tại Điều 117.","b":"Khoản 4 Điều 21, Điều 117 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Giao dịch mua xe máy của Quân có thể bị xử lý thế nào?","o":["Đương nhiên vô hiệu ngay tại thời điểm ký kết","Có thể bị tuyên vô hiệu theo yêu cầu của cha mẹ Quân","Có hiệu lực vì Quân dùng tiền lương của mình để mua","Chỉ vô hiệu nếu Quân chưa có giấy phép lái xe"],"a":1,"e":"Điều 125 BLDS 2015: khi giao dịch do người chưa thành niên xác lập, thực hiện mà theo quy định phải do người đại diện xác lập hoặc đồng ý, thì theo yêu cầu của người đại diện, Tòa án tuyên bố giao dịch vô hiệu. Đây là vô hiệu tương đối, không đương nhiên vô hiệu; giấy phép lái xe không phải điều kiện của giao dịch mua bán.","b":"Điều 125 BLDS 2015","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Nếu giao dịch mua xe bị tuyên bố vô hiệu, hậu quả pháp lý là gì?","o":["Cửa hàng X bị phạt hành chính, chiếc xe bị tịch thu","Quân phải trả thêm phí sử dụng xe cho cửa hàng","Quân mất số tiền đã trả, cửa hàng được giữ lại tiền","Hoàn trả xe và tiền; bên có lỗi phải bồi thường"],"a":3,"e":"Khoản 2 Điều 131 BLDS 2015: khi giao dịch dân sự vô hiệu thì các bên khôi phục lại tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận; khoản 4: bên có lỗi gây thiệt hại thì phải bồi thường.","b":"Điều 131 BLDS 2015","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Yêu cầu tuyên bố anh Pha đã chết vào tháng 3/2026 có đủ điều kiện về thời gian không?","o":["Đủ, vì đã hơn 02 năm kể từ khi bão chấm dứt","Chưa, vì phải biệt tích 05 năm liền trở lên","Đủ, vì chỉ cần 06 tháng kể từ ngày tàu chìm","Chưa, vì phải tuyên bố anh Pha mất tích trước"],"a":0,"e":"Điểm c khoản 1 Điều 71 BLDS 2015: người bị tai nạn hoặc thảm họa, thiên tai mà sau 02 năm kể từ ngày tai nạn, thảm họa, thiên tai đó chấm dứt vẫn không có tin tức xác thực là còn sống thì có thể bị tuyên bố là đã chết. Trường hợp này không đòi hỏi phải tuyên bố mất tích trước (khác điểm a: sau 03 năm kể từ ngày quyết định tuyên bố mất tích có hiệu lực).","b":"Điểm c khoản 1 Điều 71 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Sau khi quyết định tuyên bố anh Pha đã chết có hiệu lực, căn nhà đứng tên anh được giải quyết thế nào?","o":["Chị Hoa đương nhiên được toàn quyền sở hữu căn nhà","Được giải quyết như di sản, chia theo pháp luật về thừa kế","Không được chia trong 05 năm kể từ ngày tuyên bố chết","Giao cho Ủy ban nhân dân xã quản lý, chờ anh Pha trở về"],"a":1,"e":"Điều 72 BLDS 2015: quan hệ về tài sản của người bị Tòa án tuyên bố là đã chết được giải quyết như đối với người đã chết; tài sản của người đó được giải quyết theo quy định của pháp luật về thừa kế.","b":"Điều 72 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Năm 2028 anh Pha trở về. Quan hệ hôn nhân giữa anh Pha và chị Hoa được giải quyết thế nào?","o":["Tự động khôi phục, hôn nhân giữa chị Hoa và anh Tùng chấm dứt","Chị Hoa được lựa chọn chung sống với một trong hai người","Hôn nhân với anh Tùng vô hiệu do kết hôn trái pháp luật","Quyết định tuyên bố chết bị hủy; hôn nhân với anh Tùng vẫn có hiệu lực"],"a":3,"e":"Khoản 2 Điều 73 BLDS 2015: quan hệ nhân thân của người bị tuyên bố đã chết được khôi phục khi Tòa án hủy quyết định, trừ trường hợp vợ hoặc chồng của người đó đã được Tòa án cho ly hôn hoặc đã kết hôn với người khác thì quyết định cho ly hôn và quan hệ hôn nhân với người khác vẫn có hiệu lực pháp luật.","b":"Khoản 2 Điều 73 BLDS 2015","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Anh Pha có quyền gì đối với căn nhà đã được chia thừa kế?","o":["Không có quyền gì, vì việc chia thừa kế đã hoàn tất","Yêu cầu Nhà nước bồi thường toàn bộ giá trị căn nhà","Yêu cầu người đã nhận thừa kế trả lại tài sản hiện còn","Chỉ được nhận lại nếu những người thừa kế đồng ý"],"a":2,"e":"Khoản 3 Điều 73 BLDS 2015: người bị tuyên bố là đã chết mà còn sống có quyền yêu cầu những người đã nhận tài sản thừa kế trả lại tài sản, giá trị tài sản hiện còn.","b":"Khoản 3 Điều 73 BLDS 2015","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Chi nhánh tại Đà Nẵng có tư cách pháp lý gì?","o":["Không phải pháp nhân; là đơn vị phụ thuộc","Là pháp nhân độc lập, vì có con dấu và tài khoản riêng","Là thành viên góp vốn của Công ty An Phát","Là pháp nhân phụ thuộc của Công ty An Phát"],"a":0,"e":"Khoản 1 Điều 84 BLDS 2015: chi nhánh, văn phòng đại diện là đơn vị phụ thuộc của pháp nhân, không phải là pháp nhân. Việc có con dấu, tài khoản không làm chi nhánh trở thành pháp nhân.","b":"Khoản 1 Điều 84 BLDS 2015","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Giám đốc Chi nhánh ký hợp đồng với tư cách gì?","o":["Người đại diện theo pháp luật của Chi nhánh","Người đại diện theo ủy quyền của pháp nhân","Người ký với tư cách cá nhân nên tự chịu trách nhiệm","Người đại diện theo pháp luật của Công ty An Phát"],"a":1,"e":"Khoản 5 Điều 84 BLDS 2015: người đứng đầu chi nhánh, văn phòng đại diện thực hiện nhiệm vụ theo ủy quyền của pháp nhân trong phạm vi và thời hạn được ủy quyền. Giám đốc Chi nhánh được ủy quyền ký hợp đồng mua vật tư nên ký trong phạm vi đại diện.","b":"Khoản 5 Điều 84 BLDS 2015","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Ai là bên có nghĩa vụ thanh toán 800 triệu đồng cho Công ty Bình Minh?","o":["Liên đới giữa Chi nhánh và Giám đốc Chi nhánh","Giám đốc Chi nhánh bằng tài sản cá nhân","Chi nhánh tại Đà Nẵng tự chịu trách nhiệm","Công ty cổ phần An Phát, vì chi nhánh không phải là pháp nhân"],"a":3,"e":"Khoản 6 Điều 84 BLDS 2015: pháp nhân có quyền, nghĩa vụ dân sự phát sinh từ giao dịch dân sự do chi nhánh, văn phòng đại diện xác lập, thực hiện. Vì vậy Công ty An Phát là bên có nghĩa vụ thanh toán.","b":"Khoản 6 Điều 84 BLDS 2015","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Yêu cầu các cổ đông của Công ty An Phát dùng tài sản riêng trả nợ được giải quyết thế nào?","o":["Chấp nhận, vì cổ đông là chủ sở hữu của công ty","Chấp nhận, nếu Công ty An Phát không đủ tài sản trả nợ","Không chấp nhận; pháp nhân tự chịu trách nhiệm bằng tài sản của mình","Chấp nhận đối với cổ đông sở hữu nhiều cổ phần nhất"],"a":2,"e":"Điều 87 BLDS 2015: pháp nhân phải chịu trách nhiệm dân sự về việc thực hiện quyền, nghĩa vụ dân sự do người đại diện xác lập, thực hiện nhân danh pháp nhân, bằng tài sản của mình; người của pháp nhân không chịu trách nhiệm dân sự thay cho pháp nhân đối với nghĩa vụ dân sự do pháp nhân xác lập, trừ trường hợp luật có quy định khác.","b":"Điều 87 BLDS 2015","cid":"TH2.03"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Giao dịch chuyển nhượng thửa đất do M (16 tuổi) tự ký có hiệu lực không?","o":["Có hiệu lực, vì hợp đồng đã được công chứng","Đương nhiên vô hiệu vì vi phạm điều cấm của luật","Có thể bị tuyên vô hiệu vì thiếu sự đồng ý của người đại diện","Có hiệu lực, vì M đã đủ 15 tuổi"],"a":2,"e":"Khoản 4 Điều 21 BLDS 2015: người từ đủ 15 đến chưa đủ 18 tuổi tự mình xác lập giao dịch, trừ giao dịch liên quan đến bất động sản, động sản phải đăng ký… phải được người đại diện theo pháp luật đồng ý. M không có sự đồng ý của mẹ nên giao dịch thuộc trường hợp vô hiệu theo Điều 125 (vô hiệu tương đối); việc công chứng không khắc phục được.","b":"Khoản 4 Điều 21, Điều 125 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Ai có quyền yêu cầu Tòa án tuyên bố giao dịch vô hiệu?","o":["Viện kiểm sát nhân dân nơi có thửa đất","Công chứng viên đã công chứng hợp đồng chuyển nhượng","Ông N, vì giá chuyển nhượng thấp hơn giá thị trường","Mẹ M, người đại diện theo pháp luật của M"],"a":3,"e":"Điều 125 BLDS 2015: giao dịch do người chưa thành niên xác lập mà theo quy định phải được người đại diện đồng ý thì theo yêu cầu của người đại diện, Tòa án tuyên bố vô hiệu. Mẹ M là người đại diện theo pháp luật của con chưa thành niên (Điều 136).","b":"Điều 125, Điều 136 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Tháng 9/2026 mẹ M mới phát hiện. Quyền yêu cầu tuyên bố vô hiệu còn thời hiệu không?","o":["Còn, vì yêu cầu tuyên bố vô hiệu không bị giới hạn thời hiệu","Còn, vì 02 năm tính từ khi người đại diện biết","Không, vì hợp đồng đã được công chứng nên không áp dụng thời hiệu","Không, vì đã quá 01 năm kể từ ngày ký hợp đồng"],"a":1,"e":"Điểm a khoản 1 Điều 132 BLDS 2015: thời hiệu yêu cầu tuyên bố giao dịch vô hiệu theo Điều 125 là 02 năm kể từ ngày người đại diện của người chưa thành niên biết hoặc phải biết người được đại diện tự mình xác lập, thực hiện giao dịch. Mẹ M biết vào tháng 9/2026 nên vẫn trong thời hiệu.","b":"Điểm a khoản 1 Điều 132 BLDS 2015","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Việc M khai sai năm sinh để được công chứng ảnh hưởng thế nào đến hậu quả khi giao dịch bị tuyên bố vô hiệu?","o":["Vẫn hoàn trả; lỗi của M được xét khi bồi thường","Ông N được giữ thửa đất, không phải hoàn trả","Làm giao dịch có hiệu lực, vì lỗi thuộc về M","M phải bồi thường gấp đôi giá chuyển nhượng"],"a":0,"e":"Khoản 2 Điều 131 BLDS 2015: khi giao dịch vô hiệu, các bên khôi phục tình trạng ban đầu, hoàn trả cho nhau những gì đã nhận; khoản 4: bên có lỗi gây thiệt hại phải bồi thường. Việc khai gian năm sinh không làm giao dịch có hiệu lực mà chỉ ảnh hưởng đến việc xác định lỗi và trách nhiệm bồi thường.","b":"Điều 131 BLDS 2015","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Hành vi khẳng định xe \"chưa từng bị ngập nước\" của anh S được xác định là gì?","o":["Giao dịch giả tạo nhằm che giấu giá thật","Nhầm lẫn của hai bên về tình trạng xe","Lừa dối, vì cố ý cung cấp thông tin sai về tình trạng xe","Vi phạm điều cấm của luật về mua bán xe"],"a":2,"e":"Điều 127 BLDS 2015: lừa dối trong giao dịch dân sự là hành vi cố ý của một bên nhằm làm cho bên kia hiểu sai lệch về chủ thể, tính chất của đối tượng hoặc nội dung của giao dịch nên đã xác lập giao dịch đó. Anh S làm lại nội thất để che giấu và cam kết sai sự thật bằng tin nhắn.","b":"Điều 127 BLDS 2015","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Thời hiệu để chị R yêu cầu tuyên bố hợp đồng vô hiệu được tính từ khi nào?","o":["Từ ngày chị R nhận xe","Từ khi chị R biết bị lừa dối (kết luận của gara)","Không giới hạn thời hiệu, vì có hành vi lừa dối","Từ ngày ký hợp đồng mua bán xe"],"a":1,"e":"Điểm b khoản 1 Điều 132 BLDS 2015: thời hiệu yêu cầu Tòa án tuyên bố giao dịch vô hiệu do bị lừa dối là 02 năm kể từ ngày người bị lừa dối biết hoặc phải biết giao dịch được xác lập do bị lừa dối. Thời điểm chị R biết là khi có kết luận của gara.","b":"Điểm b khoản 1 Điều 132 BLDS 2015","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Nếu hợp đồng bị tuyên bố vô hiệu, hậu quả pháp lý là gì?","o":["Hoàn trả xe và 450 triệu đồng; anh S bồi thường","Chị R giữ xe và được trả lại một nửa số tiền","Hai bên chia đôi thiệt hại vì cùng có lỗi","Anh S giữ tiền, chị R trả lại xe cho anh S"],"a":0,"e":"Điều 131 BLDS 2015: giao dịch vô hiệu thì các bên hoàn trả cho nhau những gì đã nhận; bên có lỗi gây thiệt hại thì phải bồi thường. Anh S có lỗi cố ý nên phải bồi thường các thiệt hại hợp lý của chị R.","b":"Điều 131 BLDS 2015","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Nếu chị R muốn giữ xe nhưng đòi quyền lợi, phương án pháp lý phù hợp là gì?","o":["Yêu cầu Ủy ban nhân dân xã xử phạt hành chính anh S","Không có phương án nào ngoài yêu cầu tuyên bố vô hiệu","Khởi kiện gara vì đã kết luận xe bị ngập nước","Yêu cầu bên bán chịu trách nhiệm về chất lượng tài sản"],"a":3,"e":"Điều 432 và các Điều 444–448 BLDS 2015: bên bán phải bảo đảm chất lượng vật mua bán; khi vật không đúng chất lượng, bên mua có quyền yêu cầu sửa chữa, giảm giá, đổi vật hoặc trả lại vật, lấy lại tiền và yêu cầu bồi thường thiệt hại. Lựa chọn phương án tùy mục tiêu của khách hàng (giữ xe hay trả xe).","b":"Điều 432, Điều 444, Điều 445 BLDS 2015","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Việc anh Z bán nhà với giá 2,7 tỷ đồng được xác định thế nào?","o":["Đại diện theo pháp luật nên không bị giới hạn phạm vi","Vượt quá phạm vi đại diện, vì giá ủy quyền tối thiểu là 3 tỷ đồng","Không có thẩm quyền đại diện ngay từ đầu","Trong phạm vi đại diện, vì anh Z có giấy ủy quyền bán nhà"],"a":1,"e":"Điều 141 BLDS 2015: người đại diện chỉ được xác lập, thực hiện giao dịch dân sự trong phạm vi đại diện. Phạm vi đại diện được xác định theo văn bản ủy quyền; bán thấp hơn giá tối thiểu là vượt quá phạm vi.","b":"Điều 141 BLDS 2015","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Hợp đồng giữa anh Z và bà K có ràng buộc ông Y không?","o":["Không, trừ khi ông Y đồng ý hoặc biết mà không phản đối","Có, vì anh Z có giấy ủy quyền đã được công chứng","Có, vì bà K là người thứ ba ngay tình","Không, và hợp đồng đương nhiên vô hiệu toàn bộ"],"a":0,"e":"Khoản 1 Điều 143 BLDS 2015: giao dịch do người đại diện xác lập, thực hiện vượt quá phạm vi đại diện không làm phát sinh quyền, nghĩa vụ của người được đại diện đối với phần vượt quá, trừ trường hợp người được đại diện đồng ý, biết mà không phản đối trong thời hạn hợp lý, hoặc có lỗi dẫn đến việc người đã giao dịch không biết.","b":"Khoản 1 Điều 143 BLDS 2015","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Bà K không được xem văn bản ủy quyền. Anh Z có trách nhiệm gì đối với bà K?","o":["Chỉ phải xin lỗi bà K vì không cung cấp văn bản ủy quyền","Không có trách nhiệm, vì anh Z chỉ là người đại diện","Thực hiện nghĩa vụ với bà K về phần vượt quá","Phải nộp phạt vi phạm cho ông Y"],"a":2,"e":"Khoản 4 Điều 141 BLDS 2015: người đại diện phải thông báo cho bên giao dịch biết về phạm vi đại diện của mình. Khoản 2 Điều 143: trường hợp giao dịch vượt quá phạm vi đại diện không được người được đại diện đồng ý thì người đại diện phải thực hiện nghĩa vụ đối với người đã giao dịch về phần vượt quá, trừ trường hợp người đã giao dịch biết hoặc phải biết về việc vượt quá.","b":"Khoản 4 Điều 141, khoản 2 Điều 143 BLDS 2015","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Bà K có quyền gì để bảo vệ lợi ích của mình?","o":["Chỉ được yêu cầu ông Y giao nhà với giá 2,7 tỷ đồng","Không có quyền gì vì đã không kiểm tra giấy ủy quyền","Yêu cầu công chứng viên bồi thường thay cho anh Z","Chấm dứt hoặc hủy bỏ giao dịch và đòi bồi thường"],"a":3,"e":"Khoản 3 Điều 143 BLDS 2015: người đã giao dịch với người đại diện có quyền đơn phương chấm dứt thực hiện hoặc hủy bỏ giao dịch dân sự đối với phần vượt quá phạm vi đại diện hoặc toàn bộ giao dịch và yêu cầu bồi thường thiệt hại, trừ trường hợp người đó biết hoặc phải biết về việc vượt quá phạm vi đại diện.","b":"Khoản 3 Điều 143 BLDS 2015","cid":"TH3.03"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Khi không biết địa chỉ người đánh rơi, anh H phải làm gì với túi xách nhặt được?","o":["Nộp cho Ủy ban nhân dân cấp tỉnh để thông báo công khai","Tự giữ và đăng tin trên mạng xã hội trong 06 tháng","Giao nộp Ủy ban nhân dân hoặc công an cấp xã gần nhất","Nộp cho Tòa án nhân dân khu vực nơi nhặt được"],"a":2,"e":"Khoản 1 Điều 230 BLDS 2015: người nhặt được tài sản bị đánh rơi, bỏ quên mà biết được địa chỉ của người đánh rơi thì phải thông báo hoặc trả lại; nếu không biết địa chỉ thì phải thông báo hoặc giao nộp cho Ủy ban nhân dân cấp xã hoặc công an cấp xã nơi gần nhất để thông báo công khai.","b":"Khoản 1 Điều 230 BLDS 2015","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Từ thời điểm nào việc xác lập quyền sở hữu đối với số tài sản được đặt ra?","o":["Sau 05 năm kể từ ngày thông báo công khai","Từ ngày 01/8/2026, sau 01 năm kể từ ngày thông báo công khai","Sau 06 tháng kể từ ngày nhặt được","Ngày 01/8/2025, ngày anh H nhặt được"],"a":1,"e":"Khoản 2 Điều 230 BLDS 2015: sau 01 năm kể từ ngày thông báo công khai về tài sản nhặt được mà không xác định được người là chủ sở hữu hoặc chủ sở hữu không đến nhận thì quyền sở hữu đối với tài sản được xác định theo quy định tại điểm a, b khoản này.","b":"Khoản 2 Điều 230 BLDS 2015","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Mức lương cơ sở là 2.530.000 đồng. Anh H được hưởng giá trị bao nhiêu từ tổng tài sản 75 triệu đồng (chưa trừ chi phí bảo quản)?","o":["25,3 triệu đồng","75 triệu đồng","37,5 triệu đồng","50,15 triệu đồng"],"a":3,"e":"Điểm b khoản 2 Điều 230 BLDS 2015: tài sản có giá trị lớn hơn 10 lần mức lương cơ sở thì người nhặt được được hưởng giá trị bằng 10 lần mức lương cơ sở và 50% giá trị phần vượt quá. 10 × 2,53 = 25,3 triệu; phần vượt 75 − 25,3 = 49,7 triệu; 50% là 24,85 triệu. Anh H được 25,3 + 24,85 = 50,15 triệu đồng; 24,85 triệu đồng còn lại thuộc về Nhà nước.","b":"Điểm b khoản 2 Điều 230 BLDS 2015","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Giả sử anh H giữ lại tài sản, không giao nộp. Tính chất chiếm hữu và hậu quả pháp lý là gì?","o":["Không có căn cứ, không ngay tình; phải trả cả hoa lợi","Chiếm hữu có căn cứ pháp luật, vì tài sản không có chủ","Chiếm hữu ngay tình, anh H được xác lập quyền sở hữu sau 01 năm","Không có hậu quả gì, vì chủ sở hữu không đến nhận lại"],"a":0,"e":"Anh H biết tài sản không phải của mình mà không làm thủ tục theo Điều 230 nên chiếm hữu không có căn cứ pháp luật (Điều 165), không ngay tình (Điều 181). Chủ sở hữu có quyền đòi lại (Điều 166); người chiếm hữu không ngay tình phải hoàn trả tài sản cùng hoa lợi, lợi tức (Điều 581); có thể bị xử lý hình sự nếu đủ yếu tố cấu thành tội chiếm giữ trái phép tài sản.","b":"Điều 165, Điều 166, Điều 181, Điều 581 BLDS 2015","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Tính chất chiếm hữu của chị K đối với chiếc xe được xác định thế nào?","o":["Ngay tình nhưng không có căn cứ pháp luật, vì người bán không có quyền","Chiếm hữu không ngay tình, vì xe là tài sản do trộm cắp mà có","Chiếm hữu của người được ủy quyền quản lý tài sản","Chiếm hữu có căn cứ pháp luật, vì đã trả tiền theo giá thị trường"],"a":0,"e":"Điều 180 BLDS 2015: chiếm hữu ngay tình là việc chiếm hữu mà người chiếm hữu có căn cứ để tin rằng mình có quyền đối với tài sản. Chị K không biết và không thể biết xe do trộm cắp nên ngay tình; nhưng xe được bán bởi người không có quyền định đoạt nên chiếm hữu không có căn cứ pháp luật (Điều 165).","b":"Điều 165, Điều 180 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Anh I có quyền đòi lại xe từ chị K không?","o":["Không, vì chị K đã mua theo giá thị trường","Có, vì xe máy là động sản phải đăng ký quyền sở hữu","Có, nhưng chỉ khi anh I trả lại cho chị K số tiền mua xe","Không, vì chị K là người chiếm hữu ngay tình"],"a":1,"e":"Điều 168 BLDS 2015: chủ sở hữu có quyền đòi lại động sản phải đăng ký hoặc bất động sản từ người chiếm hữu ngay tình, trừ trường hợp khoản 2 Điều 133. Khoản 2 Điều 133 chỉ bảo vệ người thứ ba ngay tình nhận tài sản căn cứ vào việc đăng ký hợp pháp, qua đấu giá… Xe chưa từng được đăng ký hợp pháp cho người bán (giấy tờ giả) nên không thuộc ngoại lệ.","b":"Điều 133, Điều 168 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Sau khi phải trả xe cho anh I, chị K có thể bảo vệ quyền lợi của mình thế nào?","o":["Yêu cầu Nhà nước bồi thường thiệt hại","Yêu cầu anh I trả lại số tiền mua xe","Yêu cầu ông J hoàn trả tiền và bồi thường","Không có quyền gì, vì đã mua phải tài sản trộm cắp"],"a":2,"e":"Khoản 3 Điều 133 BLDS 2015: chủ sở hữu không có quyền đòi lại tài sản từ người thứ ba ngay tình trong trường hợp khoản 2 nhưng có quyền khởi kiện chủ thể có lỗi; theo nguyên tắc này, khi phải trả lại tài sản, người thứ ba ngay tình có quyền yêu cầu bên bán (ông J) hoàn trả tiền và bồi thường thiệt hại. Ông J có quyền yêu cầu kẻ trộm bồi thường.","b":"Khoản 3 Điều 133 BLDS 2015","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"lv":"VD","q":"Giả sử chị K mua chiếc xe qua một cuộc đấu giá hợp pháp, sau đó kết quả xác định xe từng bị trộm. Anh I có quyền đòi lại xe từ chị K không?","o":["Có, nếu anh I hoàn trả tiền cho chị K","Có, vì động sản phải đăng ký luôn được đòi lại","Không, vì chiếc xe đã thuộc sở hữu Nhà nước","Không; chị K được bảo vệ vì mua qua đấu giá"],"a":3,"e":"Khoản 2 Điều 133 BLDS 2015: trường hợp người thứ ba ngay tình nhận được tài sản thông qua bán đấu giá tài sản (hoặc giao dịch với người theo bản án, quyết định của cơ quan có thẩm quyền là chủ sở hữu tài sản nhưng sau đó bị hủy, sửa) thì giao dịch không bị vô hiệu; khoản 3: chủ sở hữu không được đòi lại tài sản từ người thứ ba ngay tình nhưng có quyền khởi kiện chủ thể có lỗi.","b":"Khoản 2, khoản 3 Điều 133 BLDS 2015","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Căn nhà của ba anh em L, M, N thuộc hình thức sở hữu nào?","o":["Sở hữu chung của cộng đồng","Sở hữu chung theo phần","Sở hữu chung hợp nhất","Sở hữu riêng của người anh cả"],"a":1,"e":"Điều 209 BLDS 2015: sở hữu chung theo phần là sở hữu chung mà trong đó phần quyền sở hữu của mỗi chủ sở hữu được xác định đối với tài sản chung. Giấy chứng nhận ghi mỗi người sở hữu 1/3.","b":"Điều 209 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"L bán phần quyền của mình mà không thông báo cho M, N. Việc này vi phạm quyền gì?","o":["Không vi phạm vì L có quyền định đoạt phần của mình","Quyền hưởng dụng của M, N","Quyền chiếm hữu của M, N","Quyền ưu tiên mua của các chủ sở hữu chung còn lại"],"a":3,"e":"Khoản 3 Điều 218 BLDS 2015: trường hợp một chủ sở hữu chung theo phần bán phần quyền sở hữu của mình thì chủ sở hữu chung khác được quyền ưu tiên mua; người bán phải thông báo bằng văn bản về việc bán và các điều kiện bán. L có quyền bán nhưng phải bảo đảm quyền ưu tiên mua.","b":"Khoản 3 Điều 218 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Nếu L thông báo đúng quy định, M, N có thời hạn bao lâu để trả lời đối với căn nhà?","o":["03 tháng kể từ ngày nhận được thông báo","01 tháng kể từ ngày nhận được thông báo","06 tháng kể từ ngày nhận được thông báo","15 ngày kể từ ngày nhận được thông báo"],"a":0,"e":"Khoản 3 Điều 218 BLDS 2015: trong thời hạn 03 tháng đối với bất động sản, 01 tháng đối với động sản kể từ ngày các chủ sở hữu chung khác nhận được thông báo mà không có chủ sở hữu chung nào mua thì chủ sở hữu đó được quyền bán cho người khác.","b":"Khoản 3 Điều 218 BLDS 2015","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Tháng 6/2026 M phát hiện việc mua bán. M có quyền gì và trong thời hạn nào?","o":["Yêu cầu ông O chia đôi phần nhà đã mua","Yêu cầu tuyên bố hợp đồng vô hiệu trong 02 năm","Trong 03 tháng, yêu cầu được chuyển quyền của người mua","Yêu cầu L bồi thường gấp đôi giá bán"],"a":2,"e":"Khoản 3 Điều 218 BLDS 2015: trường hợp bán phần quyền sở hữu mà vi phạm quyền ưu tiên mua thì trong thời hạn 03 tháng kể từ ngày phát hiện có việc vi phạm, chủ sở hữu chung theo phần có quyền yêu cầu Tòa án chuyển sang cho mình quyền và nghĩa vụ của người mua; bên có lỗi gây thiệt hại phải bồi thường.","b":"Khoản 3 Điều 218 BLDS 2015","cid":"TH4.03"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Di sản của ông A gồm những gì?","o":["Một nửa căn nhà và một nửa khoản tiết kiệm","Căn nhà 1,5 tỷ đồng và toàn bộ 1 tỷ đồng tiết kiệm","Căn nhà 1,5 tỷ đồng và 500 triệu đồng là phần trong khoản tiết kiệm chung","Chỉ căn nhà 1,5 tỷ đồng vì sổ tiết kiệm đứng tên bà B"],"a":2,"e":"Căn nhà có trước hôn nhân là tài sản riêng của ông A (Điều 43 Luật HNGĐ); khoản tiết kiệm dành dụm trong thời kỳ hôn nhân là tài sản chung dù đứng tên bà B (Điều 33), nên phần của ông A là 1/2. Di sản = 1,5 tỷ + 0,5 tỷ = 2 tỷ đồng (Điều 612 BLDS).","b":"Điều 612 BLDS 2015; Điều 33, Điều 43 Luật HNGĐ 2014","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Khoản vay 100 triệu đồng của hai vợ chồng được xử lý thế nào khi chia di sản?","o":["Không phải thanh toán, vì ông A đã chết","Bà B phải trả toàn bộ, vì bà B còn sống","Chia đều cho các con trả sau khi nhận di sản","Thanh toán 50 triệu đồng từ di sản trước khi chia"],"a":3,"e":"Khoản vay để sửa nhà là nghĩa vụ chung của vợ chồng (Điều 37 Luật HNGĐ); phần của ông A là 50 triệu đồng. Theo Điều 615 và Điều 658 BLDS, nghĩa vụ tài sản do người chết để lại được thanh toán từ di sản trước khi chia, nên di sản còn 1,95 tỷ đồng.","b":"Điều 615, Điều 658 BLDS 2015; Điều 37 Luật HNGĐ 2014","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Những người thừa kế theo pháp luật của ông A gồm ai?","o":["Bà B, C, D và mẹ ông A","Bà B, C và D","Bà B và mẹ ông A","Chỉ C và D"],"a":1,"e":"Điều 651 BLDS 2015: hàng thừa kế thứ nhất gồm vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết. Mẹ ông A chết năm 2013, trước thời điểm mở thừa kế (7/2018), nên không phải người thừa kế; cha ông A cũng đã chết.","b":"Điều 611, Điều 651 BLDS 2015","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"lv":"VD","q":"Mỗi người thừa kế được hưởng bao nhiêu?","o":["650 triệu đồng","975 triệu đồng","500 triệu đồng","666,67 triệu đồng"],"a":0,"e":"Di sản sau khi thanh toán nghĩa vụ là 1.950 triệu đồng, chia đều cho ba người cùng hàng thừa kế thứ nhất (khoản 2 Điều 651 BLDS): 1.950 : 3 = 650 triệu đồng/người. Bà B còn có phần tài sản của mình trong khối tài sản chung (500 triệu tiết kiệm), không phải di sản.","b":"Khoản 2 Điều 651 BLDS 2015","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Bà G và anh H có thuộc diện người thừa kế không phụ thuộc vào nội dung di chúc không?","o":["Chỉ anh H, vì anh H không có khả năng lao động","Không ai, vì di chúc hợp pháp phải được tôn trọng tuyệt đối","Cả hai: bà G là vợ, anh H là con thành niên không có khả năng lao động","Chỉ bà G, vì anh H đã thành niên"],"a":2,"e":"Khoản 1 Điều 644 BLDS 2015: cha, mẹ, vợ, chồng, con chưa thành niên và con thành niên mà không có khả năng lao động vẫn được hưởng phần di sản bằng hai phần ba suất của một người thừa kế theo pháp luật nếu di chúc không cho hưởng hoặc cho hưởng ít hơn hai phần ba suất đó.","b":"Khoản 1 Điều 644 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Một suất thừa kế theo pháp luật để tính phần của bà G và anh H là bao nhiêu?","o":["400 triệu đồng","1,2 tỷ đồng","300 triệu đồng","600 triệu đồng"],"a":0,"e":"Giả định chia theo pháp luật: hàng thừa kế thứ nhất gồm bà G, F, H (cha mẹ ông E đã chết) – 3 người (Điều 651). Một suất = 1,2 tỷ : 3 = 400 triệu đồng.","b":"Điều 644, Điều 651 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Bà G và anh H mỗi người được hưởng bao nhiêu?","o":["600 triệu đồng, bằng một nửa di sản","Khoảng 266,67 triệu đồng, bằng 2/3 một suất thừa kế","400 triệu đồng, bằng một suất thừa kế theo pháp luật","200 triệu đồng, bằng một nửa suất thừa kế"],"a":1,"e":"Khoản 1 Điều 644 BLDS 2015: mỗi người được hưởng 2/3 × 400 triệu = 266,67 triệu đồng (làm tròn), không phải một suất đầy đủ.","b":"Khoản 1 Điều 644 BLDS 2015","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"lv":"VD","q":"Anh F được hưởng bao nhiêu từ di sản?","o":["933,33 triệu đồng, sau khi trừ phần của một người","1,2 tỷ đồng, toàn bộ di sản theo di chúc","400 triệu đồng, bằng một suất thừa kế theo pháp luật","Khoảng 666,67 triệu đồng, phần còn lại của di sản"],"a":3,"e":"Di chúc vẫn có hiệu lực đối với phần còn lại: F nhận 1.200 − 2 × 266,67 = 666,67 triệu đồng. Phần của người thừa kế không phụ thuộc di chúc được trích từ phần di sản mà di chúc định đoạt cho F.","b":"Điều 644 BLDS 2015","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"VD","q":"Ai được hưởng di sản của cụ I trong vị trí của J?","o":["Nhà nước, vì không còn người thừa kế","Không ai, vì J chết trước cụ I","Vợ của J, với tư cách người thừa kế của J","M, con của J, theo thừa kế thế vị"],"a":3,"e":"Điều 652 BLDS 2015: trường hợp con của người để lại di sản chết trước hoặc cùng một thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống. M được thế vị J.","b":"Điều 652 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"VD","q":"Việc K từ chối nhận di sản có hợp pháp và ảnh hưởng thế nào?","o":["Không hợp pháp, người thừa kế không được từ chối nhận di sản","Hợp pháp, phần của K thuộc về Nhà nước","Hợp pháp; phần của K chia cho người cùng hàng còn lại","Hợp pháp, phần của K được giữ lại cho con của K"],"a":2,"e":"Điều 620 BLDS 2015: người thừa kế có quyền từ chối nhận di sản (trừ trường hợp nhằm trốn tránh nghĩa vụ tài sản), việc từ chối phải lập thành văn bản trước thời điểm phân chia di sản. Khi K từ chối, những người cùng hàng còn lại hưởng phần bằng nhau (khoản 2 Điều 651); con của K không được thế vị vì K còn sống.","b":"Điều 620, khoản 2 Điều 651 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Phần di sản của mỗi người thừa kế là bao nhiêu?","o":["L và M mỗi người 450 triệu đồng","L 600 triệu đồng, M 300 triệu đồng","L 900 triệu đồng","L, M, K mỗi người 300 triệu đồng"],"a":0,"e":"Hàng thứ nhất ban đầu gồm J, K, L. J chết trước nên M thế vị; K từ chối. Di sản 900 triệu đồng chia cho L và M (thế vị J): mỗi người 450 triệu đồng.","b":"Điều 620, Điều 651, Điều 652 BLDS 2015","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"lv":"VD","q":"M (15 tuổi) nhận và quản lý phần di sản được hưởng thế nào?","o":["Phần của M được nhập vào phần của L để quản lý chung","Người đại diện nhận thay; M có thể tự quản lý tài sản riêng","M không được nhận di sản cho đến khi đủ 18 tuổi","Ủy ban nhân dân xã quản lý phần di sản thay cho M"],"a":1,"e":"Điều 76 Luật HNGĐ 2014: con từ đủ 15 tuổi trở lên sống chung với cha mẹ có quyền tự quản lý tài sản riêng hoặc nhờ cha mẹ quản lý; tài sản riêng của con dưới 15 tuổi do cha mẹ quản lý. Giao dịch liên quan đến bất động sản, động sản phải đăng ký của người chưa thành niên cần người đại diện đồng ý (khoản 4 Điều 21 BLDS).","b":"Điều 76 Luật HNGĐ 2014; khoản 4 Điều 21 BLDS 2015","cid":"TH5.03"},{"id":"TH6.01.1","g":6,"lv":"VD","q":"Cam kết của anh Uy là biện pháp bảo đảm nào?","o":["Tín chấp","Cầm cố tài sản","Ký quỹ","Bảo lãnh"],"a":3,"e":"Khoản 1 Điều 335 BLDS 2015: bảo lãnh là việc người thứ ba (bên bảo lãnh) cam kết với bên có quyền (bên nhận bảo lãnh) sẽ thực hiện nghĩa vụ thay cho bên có nghĩa vụ (bên được bảo lãnh) nếu khi đến thời hạn thực hiện nghĩa vụ mà bên được bảo lãnh không thực hiện hoặc thực hiện không đúng nghĩa vụ.","b":"Khoản 1 Điều 335 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"VD","q":"Chị Yến không trả nợ dù vẫn có tài sản. Ông Zung có quyền yêu cầu anh Uy trả nợ ngay không?","o":["Không, phải xử lý hết tài sản của chị Yến trước","Có, vì đến hạn chị Yến không thực hiện nghĩa vụ","Chỉ khi chị Yến đồng ý để anh Uy trả thay","Không, phải có bản án buộc chị Yến trả nợ trước"],"a":1,"e":"Khoản 1 Điều 335 BLDS 2015: bên bảo lãnh thực hiện nghĩa vụ thay khi đến hạn bên được bảo lãnh không thực hiện hoặc thực hiện không đúng. Khoản 2: các bên có thể thỏa thuận bên bảo lãnh chỉ phải thực hiện khi bên được bảo lãnh không có khả năng thực hiện; ở đây không có thỏa thuận đó.","b":"Khoản 1, khoản 2 Điều 335 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Sau khi trả 500 triệu đồng cho ông Zung, anh Uy có quyền gì?","o":["Yêu cầu chị Yến hoàn trả trong phạm vi đã bảo lãnh","Không có quyền gì, vì đã tự nguyện bảo lãnh","Yêu cầu ông Zung hoàn trả lại số tiền đã nhận","Chỉ được yêu cầu chị Yến trả một nửa số tiền"],"a":0,"e":"Điều 340 BLDS 2015: trường hợp bên bảo lãnh đã thực hiện xong nghĩa vụ bảo lãnh thì có quyền yêu cầu bên được bảo lãnh thực hiện nghĩa vụ đối với mình trong phạm vi bảo lãnh, trừ trường hợp có thỏa thuận khác.","b":"Điều 340 BLDS 2015","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"lv":"VD","q":"Chị Yến chậm trả nợ gốc từ ngày 01/9/2026. Lãi đối với nợ gốc quá hạn được tính thế nào (không có thỏa thuận khác)?","o":["12%/năm như lãi suất trong hạn","20%/năm là mức trần lãi suất","18%/năm, bằng 150% lãi suất vay","10%/năm theo lãi suất cơ bản"],"a":2,"e":"Điểm b khoản 5 Điều 466 BLDS 2015: trường hợp vay có lãi mà khi đến hạn bên vay không trả hoặc trả không đầy đủ thì bên vay phải trả lãi trên nợ gốc quá hạn bằng 150% lãi suất vay theo hợp đồng tương ứng với thời gian chậm trả, trừ trường hợp có thỏa thuận khác: 150% × 12% = 18%/năm.","b":"Điểm b khoản 5 Điều 466 BLDS 2015","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"VD","q":"Ông Ánh có được thế chấp căn nhà cho ông Cường khi căn nhà đang thế chấp tại Ngân hàng B không?","o":["Được, một tài sản có thể bảo đảm nhiều nghĩa vụ","Chỉ được nếu Ngân hàng B đồng ý bằng văn bản","Chỉ được nếu tổng khoản vay không vượt quá 50% giá trị căn nhà","Không, mỗi tài sản chỉ được bảo đảm cho một nghĩa vụ"],"a":0,"e":"Khoản 1 Điều 296 BLDS 2015: một tài sản có thể được dùng để bảo đảm thực hiện nhiều nghĩa vụ, nếu có giá trị tại thời điểm xác lập giao dịch bảo đảm lớn hơn tổng giá trị các nghĩa vụ được bảo đảm, trừ trường hợp có thỏa thuận hoặc luật có quy định khác. Giá trị nhà 3 tỷ đồng lớn hơn tổng 2,5 tỷ đồng.","b":"Điều 296 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"VD","q":"Biện pháp thế chấp của Ngân hàng B có hiệu lực đối kháng với người thứ ba từ thời điểm nào?","o":["Từ ngày ông Ánh thế chấp cho ông Cường","Từ ngày đăng ký thế chấp 10/02/2026","Từ ngày ký hợp đồng thế chấp","Từ ngày giải ngân khoản vay"],"a":1,"e":"Khoản 1 Điều 297 BLDS 2015: biện pháp bảo đảm phát sinh hiệu lực đối kháng với người thứ ba từ khi đăng ký biện pháp bảo đảm hoặc bên nhận bảo đảm nắm giữ hoặc chiếm giữ tài sản bảo đảm.","b":"Điều 297 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Số tiền 2,2 tỷ đồng thu được từ xử lý căn nhà được thanh toán thế nào?","o":["Ông Cường được thanh toán trước vì cho vay sau","Mỗi bên nhận 1,1 tỷ đồng vì cùng là bên nhận thế chấp","Chia theo tỷ lệ khoản vay giữa Ngân hàng B và ông Cường","Ngân hàng B nhận 1,5 tỷ trước; ông Cường nhận 700 triệu"],"a":3,"e":"Điểm b khoản 1 Điều 308 BLDS 2015: trường hợp có biện pháp bảo đảm phát sinh hiệu lực đối kháng và có biện pháp không phát sinh hiệu lực đối kháng thì nghĩa vụ có biện pháp bảo đảm phát sinh hiệu lực đối kháng được thanh toán trước. Phần nợ 300 triệu đồng chưa được thanh toán của ông Cường trở thành nghĩa vụ không có bảo đảm.","b":"Điểm b khoản 1 Điều 308 BLDS 2015","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"lv":"VD","q":"Ông Ánh có được tự ý bán căn nhà đang thế chấp không?","o":["Được, nếu giá bán cao hơn tổng khoản nợ","Được, vì ông Ánh vẫn là chủ sở hữu căn nhà","Không, trừ khi bên nhận thế chấp đồng ý","Được, nhưng phải thông báo cho Ngân hàng B sau khi bán"],"a":2,"e":"Điều 321 BLDS 2015: bên thế chấp được bán, thay thế, trao đổi, tặng cho tài sản thế chấp (không phải hàng hóa luân chuyển trong quá trình sản xuất, kinh doanh) nếu được bên nhận thế chấp đồng ý hoặc theo quy định của luật.","b":"Điều 321 BLDS 2015","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"lv":"VD","q":"Hợp đồng cầm cố giữa chị Diệp và ông Hải có hiệu lực đối kháng với người thứ ba từ thời điểm nào?","o":["Từ thời điểm ông Hải nắm giữ chiếc xe","Từ khi đăng ký tại cơ quan công an","Từ khi hết thời hạn 02 tháng","Từ khi chị Diệp nhận 15 triệu đồng"],"a":0,"e":"Điều 310 BLDS 2015: hợp đồng cầm cố tài sản có hiệu lực từ thời điểm giao kết, trừ trường hợp có thỏa thuận khác hoặc luật có quy định khác; cầm cố tài sản có hiệu lực đối kháng với người thứ ba kể từ thời điểm bên nhận cầm cố nắm giữ tài sản cầm cố.","b":"Điều 310 BLDS 2015","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"lv":"VD","q":"Việc ông Hải cho người khác thuê xe trong thời gian cầm cố được đánh giá thế nào?","o":["Hợp pháp, vì ông đang chiếm hữu hợp pháp chiếc xe","Hợp pháp, nếu ông trích tiền thuê trả lãi cho chị Diệp","Chỉ vi phạm nếu chiếc xe bị hư hỏng","Vi phạm nghĩa vụ của bên nhận cầm cố"],"a":3,"e":"Điều 313 BLDS 2015: bên nhận cầm cố có nghĩa vụ không được bán, trao đổi, tặng cho, sử dụng tài sản cầm cố để bảo đảm cho việc thực hiện nghĩa vụ khác; không được cho thuê, cho mượn, khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản cầm cố, trừ trường hợp có thỏa thuận khác.","b":"Điều 313 BLDS 2015","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"lv":"VD","q":"Chị Diệp không trả nợ khi đến hạn. Chiếc xe cầm cố được xử lý thế nào?","o":["Ông Hải phải trả lại xe cho chị Diệp vô điều kiện","Xử lý theo thỏa thuận hoặc theo quy định của pháp luật","Đương nhiên thuộc về ông Hải khi quá hạn trả nợ","Thuộc về ông Hải nếu quá hạn trả nợ trên 30 ngày"],"a":1,"e":"Điều 303 BLDS 2015: bên bảo đảm và bên nhận bảo đảm có quyền thỏa thuận phương thức xử lý tài sản (bán đấu giá, bên nhận bảo đảm tự bán, bên nhận bảo đảm nhận chính tài sản để thay thế cho việc thực hiện nghĩa vụ…). Bên nhận cầm cố không đương nhiên trở thành chủ sở hữu; nếu nhận chính tài sản để thay thế nghĩa vụ thì phải theo thỏa thuận và thanh toán chênh lệch.","b":"Điều 303 BLDS 2015","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"lv":"VD","q":"Xe được bán với giá 30 triệu đồng, nghĩa vụ của chị Diệp (gốc, lãi, chi phí) là 16 triệu đồng. Số tiền còn lại xử lý thế nào?","o":["Thuộc về ông Hải như tiền phạt vi phạm","Nộp vào ngân sách nhà nước","Trả lại cho chị Diệp 14 triệu đồng","Chia đôi giữa chị Diệp và ông Hải"],"a":2,"e":"Khoản 2 Điều 307 BLDS 2015: trường hợp số tiền có được từ việc xử lý tài sản bảo đảm sau khi thanh toán chi phí bảo quản, thu giữ và xử lý tài sản bảo đảm lớn hơn giá trị nghĩa vụ được bảo đảm thì số tiền chênh lệch phải được trả cho bên bảo đảm: 30 − 16 = 14 triệu đồng.","b":"Điều 307 BLDS 2015","cid":"TH6.03"},{"id":"TH7.01.1","g":7,"lv":"VD","q":"Mức phạt 15% giá trị hợp đồng trong hợp đồng xây nhà giữa ông C và anh D có hợp pháp không?","o":["Hợp pháp, vì mức phạt trong hợp đồng dân sự do các bên tự thỏa thuận","Không, vì phạt vi phạm chỉ áp dụng trong hợp đồng thương mại","Chỉ hợp pháp nếu hợp đồng được công chứng","Không, vì mức phạt tối đa là 8% giá trị phần nghĩa vụ vi phạm"],"a":0,"e":"Khoản 2 Điều 418 BLDS 2015: mức phạt vi phạm do các bên thỏa thuận, trừ trường hợp luật liên quan có quy định khác. Mức trần 8% (Điều 301 Luật Thương mại) chỉ áp dụng cho hợp đồng thương mại; đây là hợp đồng dân sự.","b":"Khoản 2 Điều 418 BLDS 2015; Điều 301 Luật Thương mại 2005","cid":"TH7.01"},{"id":"TH7.01.2","g":7,"lv":"VD","q":"Ông C có được yêu cầu cả tiền phạt và bồi thường 20 triệu đồng tiền thuê nhà không?","o":["Có, vì phạt vi phạm và bồi thường luôn được áp dụng đồng thời","Không, vì không thỏa thuận vừa phạt vừa bồi thường","Có, nếu thiệt hại thực tế lớn hơn tiền phạt","Không, ông C chỉ được đòi bồi thường, không được đòi phạt"],"a":1,"e":"Khoản 3 Điều 418 BLDS 2015: trường hợp các bên có thỏa thuận về phạt vi phạm nhưng không thỏa thuận về việc vừa phải chịu phạt vi phạm vừa phải bồi thường thiệt hại thì bên vi phạm nghĩa vụ chỉ phải chịu phạt vi phạm.","b":"Khoản 3 Điều 418 BLDS 2015","cid":"TH7.01"},{"id":"TH7.01.3","g":7,"lv":"VD","q":"Giả sử anh D chứng minh việc chậm bàn giao là do bão lớn làm sập giàn giáo, không thể lường trước và khắc phục. Anh D có phải chịu phạt không?","o":["Có, vì hợp đồng đã quy định phạt khi chậm bàn giao","Chỉ chịu một nửa mức phạt đã thỏa thuận","Không, vì vi phạm do sự kiện bất khả kháng, trừ khi có thỏa thuận khác","Phải chịu phạt và bồi thường gấp đôi"],"a":2,"e":"Khoản 2 Điều 351 BLDS 2015: trường hợp bên có nghĩa vụ không thực hiện đúng nghĩa vụ do sự kiện bất khả kháng thì không phải chịu trách nhiệm dân sự, trừ trường hợp có thỏa thuận khác hoặc pháp luật có quy định khác. Sự kiện bất khả kháng là sự kiện xảy ra khách quan, không thể lường trước và không thể khắc phục (khoản 1 Điều 156).","b":"Khoản 2 Điều 351, khoản 1 Điều 156 BLDS 2015","cid":"TH7.01"},{"id":"TH7.01.4","g":7,"lv":"VD","q":"Khi tư vấn soạn hợp đồng cho ông C, cần ghi điều khoản thế nào để vừa được phạt vừa được bồi thường?","o":["Không cần ghi gì vì luật đã quy định sẵn","Ghi \"bên vi phạm chịu mọi trách nhiệm pháp lý\"","Ghi mức phạt cao hơn 15% để bù đắp thiệt hại","Ghi rõ bên vi phạm vừa nộp phạt vừa bồi thường"],"a":3,"e":"Khoản 3 Điều 418 BLDS 2015: các bên có thể thỏa thuận về việc bên vi phạm nghĩa vụ chỉ phải chịu phạt vi phạm mà không phải bồi thường hoặc vừa phải chịu phạt vi phạm và vừa phải bồi thường thiệt hại. Phải thỏa thuận rõ thì mới được áp dụng đồng thời.","b":"Khoản 3 Điều 418 BLDS 2015","cid":"TH7.01"},{"id":"TH7.02.1","g":7,"lv":"VD","q":"Yêu cầu tuyên bố hợp đồng đặt cọc vô hiệu của ông G vì \"đất chưa có giấy chứng nhận\" có cơ sở không?","o":["Có, vì đất chưa có giấy chứng nhận thì mọi giao dịch đều vô hiệu","Không, vì đặt cọc vẫn có hiệu lực nếu đáp ứng Điều 117","Không, vì hợp đồng đặt cọc không bao giờ bị vô hiệu","Có, vì hợp đồng đặt cọc không được công chứng"],"a":1,"e":"Điều 3 Nghị quyết 03/2026/NQ-HĐTP hướng dẫn: thỏa thuận đặt cọc để bảo đảm giao kết hợp đồng mà tại thời điểm đặt cọc hợp đồng đó nếu được giao kết có thể vô hiệu (ví dụ đất chưa được cấp giấy chứng nhận, có hẹn thời hạn có giấy) thì thỏa thuận đặt cọc vẫn có hiệu lực nếu đáp ứng các điều kiện tại Điều 117 BLDS.","b":"Điều 117 BLDS 2015; Nghị quyết 03/2026/NQ-HĐTP","cid":"TH7.02"},{"id":"TH7.02.2","g":7,"lv":"VD","q":"Theo nguyên tắc chung, nếu bên nhận đặt cọc từ chối giao kết hợp đồng thì phải chịu hậu quả gì?","o":["Chỉ trả lại 200 triệu đồng tiền đặt cọc","Trả lại gấp ba lần số tiền đặt cọc","Trả lại tiền cọc và một khoản tương đương","Không phải trả lại, vì tiền đặt cọc là tiền phạt"],"a":2,"e":"Khoản 2 Điều 328 BLDS 2015: trường hợp bên nhận đặt cọc từ chối việc giao kết, thực hiện hợp đồng thì phải trả cho bên đặt cọc tài sản đặt cọc và một khoản tiền tương đương giá trị tài sản đặt cọc, trừ trường hợp có thỏa thuận khác.","b":"Khoản 2 Điều 328 BLDS 2015","cid":"TH7.02"},{"id":"TH7.02.3","g":7,"lv":"VD","q":"Việc ông G chưa có giấy chứng nhận do cơ quan đăng ký đất đai chậm giải quyết ảnh hưởng thế nào đến trách nhiệm phạt cọc?","o":["Cơ quan đăng ký đất đai phải trả tiền phạt cọc thay ông G","Bà H phải chịu phạt cọc vì không chờ thêm","Không ảnh hưởng, ông G vẫn phải chịu phạt cọc","Có thể là trở ngại khách quan; ông G chỉ trả lại tiền cọc"],"a":3,"e":"Theo hướng dẫn của Nghị quyết 03/2026/NQ-HĐTP và tinh thần Án lệ 25/2018/AL, trường hợp hợp đồng không được giao kết do trở ngại khách quan, không do lỗi của bên nhận đặt cọc (như cơ quan nhà nước chậm cấp giấy chứng nhận) thì bên nhận đặt cọc không bị phạt cọc mà chỉ phải trả lại tài sản đặt cọc.","b":"Nghị quyết 03/2026/NQ-HĐTP; Án lệ 25/2018/AL","cid":"TH7.02"},{"id":"TH7.02.4","g":7,"lv":"VD","q":"Để được miễn phạt cọc, ông G phải chứng minh điều gì?","o":["Đã làm thủ tục đúng hạn và việc chậm không do lỗi của mình","Chỉ cần chứng minh đất chưa có giấy chứng nhận","Không cần chứng minh gì vì đây là sự kiện bất khả kháng đương nhiên","Không phải chứng minh; bà H phải chứng minh ông G có lỗi"],"a":0,"e":"Đương sự đưa ra yêu cầu, sự phản đối phải chứng minh (Điều 91 BLTTDS). Ông G viện dẫn trở ngại khách quan để không bị phạt cọc nên phải chứng minh đã nộp hồ sơ đầy đủ, đúng hạn và việc chậm trễ hoàn toàn do cơ quan đăng ký đất đai, không có lỗi của mình.","b":"Nghị quyết 03/2026/NQ-HĐTP; Điều 91 BLTTDS","cid":"TH7.02"},{"id":"TH7.03.1","g":7,"lv":"VD","q":"Thỏa thuận lãi suất 5%/tháng có hợp pháp không?","o":["Phần vượt 20%/năm không có hiệu lực","Hợp pháp, nếu hợp đồng vay được công chứng","Hợp pháp, vì do hai bên tự nguyện thỏa thuận","Vô hiệu toàn bộ, anh I không phải trả lãi"],"a":0,"e":"Khoản 1 Điều 468 BLDS 2015: lãi suất theo thỏa thuận không được vượt quá 20%/năm của khoản tiền vay (trừ trường hợp luật khác có liên quan quy định khác); trường hợp vượt quá thì mức lãi suất vượt quá không có hiệu lực. 5%/tháng = 60%/năm.","b":"Khoản 1 Điều 468 BLDS 2015","cid":"TH7.03"},{"id":"TH7.03.2","g":7,"lv":"VD","q":"Trong 6 tháng đầu, anh I đã trả 30 triệu đồng tiền lãi. Số tiền lãi hợp pháp tương ứng là bao nhiêu?","o":["30 triệu đồng","10 triệu đồng","20 triệu đồng","5 triệu đồng"],"a":1,"e":"Lãi hợp pháp = 100 triệu × 20%/năm × 6/12 = 10 triệu đồng. Số đã trả 30 triệu nên vượt 20 triệu đồng.","b":"Khoản 1 Điều 468 BLDS 2015","cid":"TH7.03"},{"id":"TH7.03.3","g":7,"lv":"VD","q":"Khoản 20 triệu đồng tiền lãi anh I đã trả vượt mức được xử lý thế nào?","o":["Chỉ được trả lại sau khi anh I trả hết nợ gốc","Chị K được giữ lại vì anh I tự nguyện trả","Được trừ vào nợ gốc, nợ gốc còn 80 triệu đồng","Sung vào ngân sách nhà nước"],"a":2,"e":"Theo hướng dẫn tại Nghị quyết 01/2019/NQ-HĐTP, số tiền lãi đã trả vượt quá mức lãi suất theo quy định được trừ vào số tiền nợ gốc tại thời điểm trả lãi; số tiền lãi đã trả vượt quá còn lại sau khi trừ hết nợ gốc thì được trả lại cho bên vay.","b":"Nghị quyết 01/2019/NQ-HĐTP","cid":"TH7.03"},{"id":"TH7.03.4","g":7,"lv":"VD","q":"Hành vi cho vay của chị K với lãi suất 60%/năm có thể bị truy cứu trách nhiệm hình sự về tội cho vay lãi nặng không?","o":["Có, vì lãi suất vượt mức trần 20%/năm","Không bao giờ, vì đây là quan hệ dân sự","Có, nếu anh I có đơn tố cáo","Chưa, vì chưa gấp 05 lần mức trần (100%/năm)"],"a":3,"e":"Điều 201 BLHS: người nào trong cho vay tài sản mà cho vay với lãi suất gấp 05 lần trở lên của mức lãi suất cao nhất quy định trong Bộ luật Dân sự, thu lợi bất chính đủ mức luật định thì có thể bị truy cứu trách nhiệm hình sự (hướng dẫn tại Nghị quyết 01/2021/NQ-HĐTP). 60%/năm chỉ gấp 03 lần mức 20%/năm.","b":"Điều 201 BLHS; Nghị quyết 01/2021/NQ-HĐTP","cid":"TH7.03"},{"id":"TH8.01.1","g":8,"lv":"VD","q":"Trách nhiệm bồi thường của anh A phát sinh dựa trên căn cứ nào?","o":["Chỉ khi có thỏa thuận bồi thường giữa hai bên","Chỉ khi anh A bị xử phạt vi phạm hành chính về giao thông","Chỉ khi chị B chứng minh được anh A cố ý gây thiệt hại","Hành vi gây thiệt hại; xe máy là nguồn nguy hiểm cao độ"],"a":3,"e":"Khoản 1 Điều 584 BLDS 2015: người nào có hành vi xâm phạm tính mạng, sức khỏe… của người khác mà gây thiệt hại thì phải bồi thường. Điều 601: phương tiện giao thông vận tải cơ giới là nguồn nguy hiểm cao độ; chủ sở hữu, người chiếm hữu phải bồi thường thiệt hại cả khi không có lỗi, trừ trường hợp loại trừ (thiệt hại do lỗi cố ý của người bị thiệt hại, bất khả kháng, tình thế cấp thiết).","b":"Khoản 1 Điều 584, Điều 601 BLDS 2015","cid":"TH8.01"},{"id":"TH8.01.2","g":8,"lv":"VD","q":"Các khoản thiệt hại vật chất chị B được bồi thường gồm những khoản nào?","o":["Chi phí điều trị và thu nhập bị mất của chị B, không tính người chăm sóc","Chi phí điều trị, thu nhập mất của chị B và người chăm sóc","Chỉ chi phí điều trị 60 triệu đồng","Toàn bộ 135 triệu đồng và thêm gấp đôi chi phí điều trị"],"a":1,"e":"Khoản 1 Điều 590 BLDS 2015: thiệt hại do sức khỏe bị xâm phạm gồm chi phí hợp lý cho việc cứu chữa, bồi dưỡng, phục hồi sức khỏe; thu nhập thực tế bị mất hoặc bị giảm sút của người bị thiệt hại; chi phí hợp lý và phần thu nhập thực tế bị mất của người chăm sóc trong thời gian điều trị. Tổng thiệt hại vật chất 135 triệu đồng.","b":"Khoản 1 Điều 590 BLDS 2015","cid":"TH8.01"},{"id":"TH8.01.3","g":8,"lv":"VD","q":"Các bên không thỏa thuận được. Mức tối đa bù đắp tổn thất về tinh thần cho chị B là bao nhiêu (lương cơ sở 2.530.000 đồng)?","o":["75,9 triệu đồng (30 lần lương cơ sở)","253 triệu đồng (100 lần lương cơ sở)","126,5 triệu đồng (50 lần lương cơ sở)","25,3 triệu đồng (10 lần lương cơ sở)"],"a":2,"e":"Khoản 2 Điều 590 BLDS 2015: mức bồi thường bù đắp tổn thất về tinh thần do các bên thỏa thuận; nếu không thỏa thuận được thì mức tối đa cho một người có sức khỏe bị xâm phạm không quá 50 lần mức lương cơ sở: 50 × 2,53 = 126,5 triệu đồng. Mức 100 lần áp dụng khi tính mạng bị xâm phạm (Điều 591).","b":"Khoản 2 Điều 590 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","cid":"TH8.01"},{"id":"TH8.01.4","g":8,"lv":"VD","q":"Thời hiệu khởi kiện yêu cầu bồi thường của chị B là bao lâu?","o":["03 năm kể từ ngày biết quyền bị xâm phạm","01 năm kể từ ngày xảy ra tai nạn","02 năm kể từ ngày chị B ra viện","10 năm kể từ ngày xảy ra tai nạn"],"a":0,"e":"Điều 588 BLDS 2015: thời hiệu khởi kiện yêu cầu bồi thường thiệt hại là 03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm.","b":"Điều 588 BLDS 2015","cid":"TH8.01"},{"id":"TH8.02.1","g":8,"lv":"VD","q":"Ai phải bồi thường thiệt hại 18 triệu đồng cho ông G?","o":["Cháu F tự bồi thường bằng sổ tiết kiệm của mình","Cha mẹ cháu F, vì cháu chưa đủ 15 tuổi","Nhà trường nơi cháu F đang theo học","Không ai, vì cháu F chưa có năng lực trách nhiệm"],"a":1,"e":"Khoản 2 Điều 586 BLDS 2015: người chưa đủ 15 tuổi gây thiệt hại mà còn cha, mẹ thì cha, mẹ phải bồi thường toàn bộ thiệt hại. Sự việc xảy ra ngoài thời gian trường học quản lý nên không áp dụng Điều 599.","b":"Khoản 2 Điều 586 BLDS 2015","cid":"TH8.02"},{"id":"TH8.02.2","g":8,"lv":"VD","q":"Có được dùng sổ tiết kiệm 10 triệu đồng của cháu F để bồi thường không?","o":["Chỉ khi tài sản của cha mẹ không đủ","Có, phải dùng tài sản của cháu F trước","Có, nếu ông G yêu cầu dùng sổ tiết kiệm","Không bao giờ được dùng tài sản riêng của con"],"a":0,"e":"Khoản 2 Điều 586 BLDS 2015: nếu tài sản của cha mẹ không đủ để bồi thường mà con chưa thành niên gây thiệt hại có tài sản riêng thì lấy tài sản đó để bồi thường phần còn thiếu, trừ trường hợp quy định tại Điều 599.","b":"Khoản 2 Điều 586 BLDS 2015","cid":"TH8.02"},{"id":"TH8.02.3","g":8,"lv":"VD","q":"Giả sử sự việc xảy ra trong giờ học thể dục do nhà trường tổ chức. Ai chịu trách nhiệm bồi thường?","o":["Cha mẹ cháu F trong mọi trường hợp","Ông G tự chịu vì đỗ xe gần trường học","Nhà trường; nếu chứng minh không có lỗi thì cha mẹ bồi thường","Giáo viên thể dục bằng tài sản cá nhân"],"a":2,"e":"Khoản 1 Điều 599 BLDS 2015: người chưa đủ
