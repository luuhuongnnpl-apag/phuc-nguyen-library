 hoặc phải biết việc xác lập giao dịch do bị nhầm lẫn, lừa dối, đe dọa, cưỡng ép thì không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi người được đại diện biết mà vẫn đồng ý."]},{"t":"Giao dịch do người không có quyền đại diện xác lập","cs":"Điều 142 BLDS 2015","b":["Không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi: người được đại diện công nhận; biết mà không phản đối trong thời hạn hợp lý; hoặc có lỗi làm bên kia không biết.","Người không có quyền đại diện phải thực hiện nghĩa vụ với bên giao dịch, trừ khi bên đó biết hoặc phải biết.","Bên giao dịch có quyền đơn phương chấm dứt, hủy bỏ giao dịch và yêu cầu bồi thường, trừ khi biết hoặc phải biết về việc không có quyền đại diện."]},{"t":"Giao dịch vượt quá phạm vi đại diện","cs":"Điều 143 BLDS 2015","b":["Phần vượt quá không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi người được đại diện đồng ý; biết mà không phản đối trong thời hạn hợp lý; hoặc có lỗi làm bên kia không biết.","Người đại diện phải thực hiện nghĩa vụ đối với phần vượt quá, trừ khi bên giao dịch biết hoặc phải biết.","Bên giao dịch có quyền đơn phương chấm dứt, hủy bỏ phần vượt quá hoặc toàn bộ giao dịch và yêu cầu bồi thường."]},{"t":"Chấm dứt đại diện","cs":"Khoản 3, khoản 4 Điều 140 BLDS 2015","b":["Theo ủy quyền: theo thỏa thuận; hết thời hạn ủy quyền; công việc đã hoàn thành; một bên đơn phương chấm dứt; người đại diện hoặc người được đại diện chết, chấm dứt tồn tại; người đại diện không còn đủ điều kiện; căn cứ khác làm việc đại diện không thể thực hiện.","Theo pháp luật: người được đại diện đã thành niên hoặc năng lực hành vi đã được khôi phục; người được đại diện chết; pháp nhân được đại diện chấm dứt tồn tại; căn cứ khác."]}]},{"t":"Thời hạn","cs":"Chương X BLDS 2015 (Điều 144 – Điều 148)","b":["Khoảng thời gian được xác định từ thời điểm này đến thời điểm khác; xác định bằng phút, giờ, ngày, tuần, tháng, năm hoặc một sự kiện có thể sẽ xảy ra (Điều 144)."],"c":[{"t":"Cách tính thời hạn","cs":"Điều 145 BLDS 2015","b":["Theo thỏa thuận của các bên; nếu không có thỏa thuận thì theo BLDS.","Thời hạn tính theo dương lịch, trừ khi có thỏa thuận khác."]},{"t":"Quy định về thời hạn, thời điểm tính thời hạn","cs":"Điều 146 BLDS 2015","b":["Một năm 365 ngày; nửa năm 06 tháng; một tháng 30 ngày; nửa tháng 15 ngày; một tuần 07 ngày; một ngày 24 giờ; một giờ 60 phút; một phút 60 giây.","Đầu tháng: ngày đầu tiên; giữa tháng: ngày 15; cuối tháng: ngày cuối cùng của tháng.","Đầu năm: ngày đầu tiên của tháng 01; giữa năm: ngày cuối cùng của tháng 6; cuối năm: ngày cuối cùng của tháng 12."]},{"t":"Thời điểm bắt đầu thời hạn","cs":"Điều 147 BLDS 2015","b":["Xác định bằng phút, giờ: bắt đầu từ thời điểm đã xác định.","Xác định bằng ngày, tuần, tháng, năm: ngày đầu tiên không tính, bắt đầu từ ngày tiếp theo liền kề.","Xác định bằng sự kiện: ngày xảy ra sự kiện không tính, bắt đầu từ ngày tiếp theo liền kề."]},{"t":"Kết thúc thời hạn","cs":"Điều 148 BLDS 2015","b":["Bằng ngày: kết thúc tại thời điểm kết thúc ngày cuối cùng (24 giờ).","Bằng tuần: kết thúc tại thời điểm kết thúc ngày tương ứng của tuần cuối cùng.","Bằng tháng: kết thúc ngày tương ứng của tháng cuối cùng; tháng đó không có ngày tương ứng thì kết thúc vào ngày cuối cùng của tháng.","Bằng năm: kết thúc ngày, tháng tương ứng của năm cuối cùng.","Ngày cuối cùng là ngày nghỉ cuối tuần, ngày nghỉ lễ: kết thúc tại thời điểm kết thúc ngày làm việc tiếp theo."]}]},{"t":"Thời hiệu","cs":"Chương XI BLDS 2015 (Điều 149 – Điều 157)","b":["Thời hạn do luật quy định mà khi kết thúc thì phát sinh hậu quả pháp lý đối với chủ thể theo điều kiện luật quy định (khoản 1 Điều 149).","Ý nghĩa: ổn định các quan hệ dân sự; tạo điều kiện để chủ thể kịp thời bảo vệ quyền."],"c":[{"t":"Các loại thời hiệu","cs":"Điều 150 BLDS 2015","b":["Thời hiệu hưởng quyền dân sự: hết thời hạn thì chủ thể được hưởng quyền.","Thời hiệu miễn trừ nghĩa vụ dân sự: hết thời hạn thì người có nghĩa vụ được miễn thực hiện nghĩa vụ.","Thời hiệu khởi kiện: thời hạn được khởi kiện vụ án dân sự; hết thời hạn thì mất quyền khởi kiện.","Thời hiệu yêu cầu giải quyết việc dân sự: hết thời hạn thì mất quyền yêu cầu."]},{"t":"Áp dụng thời hiệu","cs":"Khoản 2, khoản 3 Điều 149 BLDS 2015","b":["Tòa án chỉ áp dụng thời hiệu theo yêu cầu của một bên hoặc các bên, đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định.","Người được hưởng lợi từ thời hiệu có quyền từ chối áp dụng, trừ trường hợp nhằm trốn tránh nghĩa vụ."]},{"t":"Cách tính thời hiệu","cs":"Điều 151, Điều 154 BLDS 2015","b":["Tính từ thời điểm bắt đầu ngày đầu tiên và chấm dứt tại thời điểm kết thúc ngày cuối cùng.","Thời hiệu khởi kiện bắt đầu từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp của mình bị xâm phạm."]},{"t":"Không tính vào thời hiệu và bắt đầu lại","cs":"Điều 153, Điều 156, Điều 157 BLDS 2015","b":["Thời hiệu hưởng quyền, miễn trừ nghĩa vụ có tính liên tục; bị gián đoạn khi có quyết định của cơ quan có thẩm quyền hoặc Tòa án giải quyết (Điều 153).","Không tính vào thời hiệu khởi kiện: thời gian xảy ra sự kiện bất khả kháng, trở ngại khách quan; người có quyền khởi kiện là người chưa thành niên, mất năng lực… chưa có người đại diện (Điều 156).","Bắt đầu lại: bên có nghĩa vụ thừa nhận hoặc thực hiện xong một phần nghĩa vụ; các bên tự hòa giải (Điều 157)."]},{"t":"Không áp dụng thời hiệu khởi kiện","cs":"Điều 155 BLDS 2015","b":["Yêu cầu bảo vệ quyền nhân thân không gắn với tài sản.","Yêu cầu bảo vệ quyền sở hữu, trừ trường hợp BLDS, luật khác có liên quan quy định khác.","Tranh chấp về quyền sử dụng đất theo quy định của Luật Đất đai.","Trường hợp khác do luật quy định."]}]}]},{"t":"Chương 4. Tài sản, quyền sở hữu và thừa kế","cs":"Chương VII, Phần thứ hai, Phần thứ tư BLDS 2015","b":["Bốn nội dung theo slide: tài sản; quyền sở hữu tài sản; các quyền khác đối với tài sản; thừa kế."],"c":[{"t":"Tài sản","cs":"Chương VII BLDS 2015 (Điều 105 – Điều 115)","b":["Tài sản là vật, tiền, giấy tờ có giá và quyền tài sản (khoản 1 Điều 105)."],"c":[{"t":"Vật, tiền, giấy tờ có giá, quyền tài sản","cs":"Điều 105, Điều 115 BLDS 2015","b":["Vật: bộ phận của thế giới vật chất, con người chiếm hữu được, có giá trị sử dụng (ô tô, xe máy, nhà máy…).","Tiền: phương tiện thanh toán, thước đo giá trị của tài sản khác.","Giấy tờ có giá: cổ phiếu, trái phiếu, tín phiếu…","Quyền tài sản: quyền trị giá được bằng tiền, gồm quyền tài sản đối với đối tượng quyền sở hữu trí tuệ, quyền sử dụng đất và quyền tài sản khác (Điều 115)."]},{"t":"Bất động sản và động sản","cs":"Điều 107 BLDS 2015","b":["Bất động sản: đất đai; nhà, công trình xây dựng gắn liền với đất đai; tài sản khác gắn liền với đất đai, nhà, công trình xây dựng; tài sản khác theo quy định pháp luật.","Động sản: những tài sản không phải là bất động sản."]},{"t":"Tài sản hiện có và tài sản hình thành trong tương lai","cs":"Điều 108 BLDS 2015","b":["Tài sản hiện có: tài sản đã hình thành và chủ thể đã xác lập quyền sở hữu, quyền khác đối với tài sản.","Tài sản hình thành trong tương lai: tài sản chưa hình thành hoặc đã hình thành nhưng chủ thể xác lập quyền sau thời điểm giao dịch."]},{"t":"Phân loại vật","cs":"Điều 109 – Điều 114 BLDS 2015","b":["Hoa lợi (sản vật tự nhiên mà tài sản mang lại) và lợi tức (khoản lợi thu được từ khai thác tài sản) (Điều 109).","Vật chính và vật phụ: khi thực hiện nghĩa vụ chuyển giao vật chính thì phải chuyển giao cả vật phụ, trừ thỏa thuận khác (Điều 110).","Vật chia được (khi phân chia vẫn giữ nguyên tính chất, tính năng sử dụng ban đầu) và vật không chia được (Điều 111).","Vật tiêu hao (qua một lần sử dụng thì mất đi hoặc không giữ được tính chất ban đầu; không thể là đối tượng của hợp đồng cho thuê, cho mượn) và vật không tiêu hao (Điều 112).","Vật cùng loại, vật đặc định (Điều 113); vật đồng bộ (Điều 114)."]}]},{"t":"Quyền sở hữu tài sản","cs":"Phần thứ hai BLDS 2015 (Điều 158 – Điều 244)","b":["Quyền sở hữu bao gồm quyền chiếm hữu, quyền sử dụng và quyền định đoạt tài sản của chủ sở hữu (Điều 158).","Chủ sở hữu được thực hiện mọi hành vi theo ý chí của mình đối với tài sản nhưng không được trái luật, gây thiệt hại đến lợi ích quốc gia, công cộng, người khác (khoản 2 Điều 160)."],"c":[{"t":"Quyền chiếm hữu","cs":"Điều 179 – Điều 186 BLDS 2015","b":["Chiếm hữu là việc chủ thể nắm giữ, chi phối tài sản một cách trực tiếp hoặc gián tiếp như chủ thể có quyền đối với tài sản (Điều 179).","Chủ sở hữu được thực hiện mọi hành vi theo ý chí của mình để nắm giữ, chi phối tài sản nhưng không được trái pháp luật, đạo đức xã hội (Điều 186)."],"c":[{"t":"Chiếm hữu có căn cứ pháp luật","cs":"Điều 165 BLDS 2015","b":["Chủ sở hữu chiếm hữu tài sản.","Người được chủ sở hữu ủy quyền quản lý tài sản.","Người được chuyển giao quyền chiếm hữu thông qua giao dịch dân sự phù hợp quy định pháp luật.","Người phát hiện và giữ tài sản vô chủ, không xác định được chủ sở hữu, bị đánh rơi, bỏ quên, bị chôn, giấu, bị vùi lấp, chìm đắm phù hợp với điều kiện luật định.","Người phát hiện và giữ gia súc, gia cầm, vật nuôi dưới nước bị thất lạc phù hợp với điều kiện luật định.","Trường hợp khác do pháp luật quy định."]},{"t":"Chiếm hữu ngay tình, không ngay tình","cs":"Điều 180, Điều 181 BLDS 2015","b":["Ngay tình: người chiếm hữu có căn cứ để tin rằng mình có quyền đối với tài sản đang chiếm hữu.","Không ngay tình: người chiếm hữu biết hoặc phải biết mình không có quyền đối với tài sản đang chiếm hữu."]},{"t":"Chiếm hữu liên tục, công khai","cs":"Điều 182, Điều 183 BLDS 2015","b":["Liên tục: diễn ra trong một khoảng thời gian mà không có tranh chấp về quyền đối với tài sản hoặc có tranh chấp nhưng chưa được giải quyết bằng bản án, quyết định có hiệu lực.","Công khai: thực hiện một cách minh bạch, không giấu giếm; tài sản được sử dụng theo tính năng, công dụng và được bảo quản như tài sản của chính mình."]}]},{"t":"Quyền sử dụng","cs":"Điều 189 – Điều 191 BLDS 2015","b":["Quyền khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản (Điều 189).","Có thể được chuyển giao cho người khác theo thỏa thuận hoặc theo quy định pháp luật; không được gây thiệt hại, ảnh hưởng đến lợi ích của chủ thể khác."]},{"t":"Quyền định đoạt","cs":"Điều 192 – Điều 196 BLDS 2015","b":["Quyền chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản (Điều 192).","Định đoạt về pháp lý (chuyển giao, từ bỏ quyền sở hữu qua giao dịch) và định đoạt về thực tế (tiêu dùng, tiêu hủy).","Người không phải chủ sở hữu chỉ được định đoạt theo ủy quyền của chủ sở hữu hoặc theo quy định của luật (Điều 195)."]},{"t":"Hình thức sở hữu","cs":"Điều 197 – Điều 220 BLDS 2015","b":["Ba hình thức: sở hữu toàn dân, sở hữu riêng, sở hữu chung."],"c":[{"t":"Sở hữu toàn dân","cs":"Điều 197 – Điều 204 BLDS 2015","b":["Đất đai, tài nguyên nước, tài nguyên khoáng sản, nguồn lợi ở vùng biển, vùng trời, tài nguyên thiên nhiên khác và tài sản do Nhà nước đầu tư, quản lý là tài sản công thuộc sở hữu toàn dân (Điều 197).","Nhà nước đại diện, thực hiện quyền của chủ sở hữu và thống nhất quản lý (Điều 198)."]},{"t":"Sở hữu riêng","cs":"Điều 205, Điều 206 BLDS 2015","b":["Sở hữu của một cá nhân hoặc một pháp nhân.","Tài sản hợp pháp thuộc sở hữu riêng không bị hạn chế về số lượng, giá trị."]},{"t":"Sở hữu chung","cs":"Điều 207 – Điều 220 BLDS 2015","b":["Sở hữu của nhiều chủ thể đối với tài sản; gồm sở hữu chung theo phần và sở hữu chung hợp nhất (Điều 207).","Theo phần: phần quyền sở hữu của mỗi chủ sở hữu được xác định (Điều 209).","Hợp nhất: phần quyền không được xác định; gồm loại có thể phân chia và không thể phân chia (Điều 210). Sở hữu chung của vợ chồng là sở hữu chung hợp nhất có thể phân chia (Điều 213).","Sở hữu chung của cộng đồng (Điều 211); sở hữu chung của các thành viên gia đình (Điều 212); sở hữu chung trong nhà chung cư (Điều 214).","Bán phần quyền sở hữu chung: chủ sở hữu chung khác có quyền ưu tiên mua (Điều 218)."]}]},{"t":"Căn cứ xác lập, chấm dứt quyền sở hữu","cs":"Điều 221, Điều 237 BLDS 2015","b":["Xác lập (Điều 221): lao động, sản xuất kinh doanh hợp pháp; chuyển quyền theo hợp đồng; thu hoa lợi, lợi tức; tạo thành vật mới do sáp nhập, trộn lẫn, chế biến; được thừa kế; chiếm hữu tài sản vô chủ, bị đánh rơi, bỏ quên, chôn giấu, gia súc thất lạc theo điều kiện luật định; theo bản án, quyết định; chiếm hữu theo thời hiệu (Điều 236).","Chấm dứt (Điều 237): chuyển quyền sở hữu cho người khác; từ bỏ; tài sản đã được tiêu dùng, bị tiêu hủy; bị xử lý để thực hiện nghĩa vụ; bị trưng mua, tịch thu; người khác được xác lập quyền sở hữu theo thời hiệu…"]},{"t":"Giới hạn quyền sở hữu","cs":"Điều 171 – Điều 178 BLDS 2015","b":["Tình thế cấp thiết (Điều 171); bảo vệ môi trường (Điều 172); trật tự, an toàn xã hội (Điều 173); tôn trọng quy tắc xây dựng (Điều 174); ranh giới, mốc giới (Điều 175, 176); bảo đảm an toàn công trình, cây cối (Điều 177); trổ cửa nhìn sang bất động sản liền kề (Điều 178)."]},{"t":"Bảo vệ quyền sở hữu","cs":"Điều 163 – Điều 170 BLDS 2015","b":["Tự bảo vệ, ngăn chặn hành vi xâm phạm bằng biện pháp không trái pháp luật (Điều 164).","Kiện vật quyền – đòi lại tài sản (Điều 166): chủ sở hữu có quyền đòi lại tài sản từ người chiếm hữu, sử dụng, được lợi không có căn cứ pháp luật.","Đòi động sản không phải đăng ký từ người chiếm hữu ngay tình: chỉ khi người đó có được qua hợp đồng không có đền bù; hoặc qua hợp đồng có đền bù nhưng tài sản bị lấy cắp, bị mất, chiếm hữu ngoài ý chí (Điều 167).","Đòi động sản phải đăng ký, bất động sản từ người chiếm hữu ngay tình: được đòi lại, trừ trường hợp khoản 2 Điều 133 (Điều 168).","Yêu cầu chấm dứt hành vi cản trở trái pháp luật (Điều 169); kiện trái quyền – yêu cầu bồi thường thiệt hại (Điều 170)."]}]},{"t":"Các quyền khác đối với tài sản","cs":"Điều 159, Điều 245 – Điều 273 BLDS 2015","b":["Gồm quyền đối với bất động sản liền kề, quyền hưởng dụng, quyền bề mặt (Điều 159).","Vẫn có hiệu lực khi quyền sở hữu được chuyển giao, trừ trường hợp BLDS, luật khác quy định khác."],"c":[{"t":"Quyền đối với bất động sản liền kề","cs":"Điều 245 – Điều 256 BLDS 2015","b":["Quyền được thực hiện trên một bất động sản (bất động sản chịu hưởng quyền) nhằm phục vụ việc khai thác một bất động sản khác thuộc quyền sở hữu của người khác (bất động sản được hưởng quyền) (Điều 245).","Căn cứ xác lập: địa thế tự nhiên, theo quy định của luật, theo thỏa thuận hoặc theo di chúc (Điều 246).","Nội dung: cấp, thoát nước (Điều 252); tưới nước, tiêu nước trong canh tác (Điều 253); lối đi qua (Điều 254); mắc đường dây tải điện, thông tin liên lạc (Điều 255)."]},{"t":"Quyền hưởng dụng","cs":"Điều 257 – Điều 266 BLDS 2015","b":["Quyền của chủ thể được khai thác công dụng và hưởng hoa lợi, lợi tức đối với tài sản thuộc quyền sở hữu của chủ thể khác trong một thời hạn nhất định (Điều 257).","Căn cứ xác lập: theo quy định của luật, theo thỏa thuận hoặc theo di chúc (Điều 258).","Thời hạn: cá nhân tối đa đến hết cuộc đời người hưởng dụng đầu tiên; pháp nhân tối đa 30 năm (Điều 260).","Hết thời hạn phải hoàn trả tài sản cho chủ sở hữu, trừ thỏa thuận khác (Điều 266)."]},{"t":"Quyền bề mặt","cs":"Điều 267 – Điều 273 BLDS 2015","b":["Quyền của một chủ thể đối với mặt đất, mặt nước, khoảng không gian trên mặt đất, mặt nước và lòng đất mà quyền sử dụng đất đó thuộc về chủ thể khác (Điều 267).","Căn cứ xác lập: theo quy định của luật, theo thỏa thuận hoặc theo di chúc (Điều 268).","Nội dung: được khai thác, sử dụng, xây dựng công trình, trồng cây, canh tác; là chủ sở hữu tài sản tạo lập trong thời hạn quyền bề mặt (Điều 271).","Chấm dứt (Điều 272): hết thời hạn; chủ thể có quyền bề mặt và chủ thể có quyền sử dụng đất là một; người có quyền bề mặt từ bỏ quyền; quyền sử dụng đất bị thu hồi theo Luật Đất đai; theo thỏa thuận hoặc luật quy định."]}]},{"t":"Thừa kế","cs":"Phần thứ tư BLDS 2015 (Điều 609 – Điều 662)","b":["Cá nhân có quyền lập di chúc để định đoạt tài sản của mình, để lại tài sản cho người thừa kế theo pháp luật, hưởng di sản theo di chúc hoặc theo pháp luật (Điều 609).","Hai hình thức: thừa kế theo di chúc và thừa kế theo pháp luật."],"c":[{"t":"Quy định chung về thừa kế","cs":"Chương XXI BLDS 2015 (Điều 609 – Điều 623)","b":["Các vấn đề chung áp dụng cho cả thừa kế theo di chúc và theo pháp luật."],"c":[{"t":"Thời điểm, địa điểm mở thừa kế","cs":"Điều 611 BLDS 2015","b":["Thời điểm: thời điểm người có tài sản chết; bị Tòa án tuyên bố chết thì là ngày được xác định trong quyết định.","Địa điểm: nơi cư trú cuối cùng của người để lại di sản; không xác định được thì là nơi có toàn bộ hoặc phần lớn di sản."]},{"t":"Di sản","cs":"Điều 612 BLDS 2015","b":["Gồm tài sản riêng của người chết và phần tài sản của người chết trong tài sản chung với người khác."]},{"t":"Người thừa kế","cs":"Điều 613 BLDS 2015","b":["Cá nhân còn sống vào thời điểm mở thừa kế hoặc sinh ra và còn sống sau thời điểm mở thừa kế nhưng đã thành thai trước khi người để lại di sản chết.","Cơ quan, tổ chức phải còn tồn tại vào thời điểm mở thừa kế (người thừa kế theo di chúc)."]},{"t":"Thực hiện nghĩa vụ tài sản do người chết để lại","cs":"Điều 615 BLDS 2015","b":["Người thừa kế thực hiện nghĩa vụ trong phạm vi di sản do người chết để lại, trừ thỏa thuận khác.","Di sản chưa chia: người quản lý di sản thực hiện theo thỏa thuận của những người thừa kế; đã chia: mỗi người thực hiện tương ứng nhưng không vượt quá phần tài sản đã nhận."]},{"t":"Người quản lý di sản","cs":"Điều 616 – Điều 618 BLDS 2015","b":["Người được chỉ định trong di chúc hoặc do những người thừa kế thỏa thuận cử ra; chưa xác định được thì người đang chiếm hữu, sử dụng, quản lý di sản; không có thì cơ quan nhà nước có thẩm quyền.","Nghĩa vụ: lập danh mục di sản, bảo quản, thông báo tình trạng di sản, giao lại di sản theo yêu cầu; không được định đoạt di sản nếu không được những người thừa kế đồng ý.","Quyền: đại diện cho người thừa kế với người thứ ba; được thanh toán chi phí bảo quản; hưởng thù lao theo thỏa thuận."]},{"t":"Từ chối nhận di sản","cs":"Điều 620 BLDS 2015","b":["Có quyền từ chối, trừ trường hợp nhằm trốn tránh thực hiện nghĩa vụ tài sản của mình với người khác.","Phải lập thành văn bản, gửi đến người quản lý di sản, những người thừa kế khác, người được giao nhiệm vụ phân chia di sản.","Phải được thể hiện trước thời điểm phân chia di sản."]},{"t":"Người không được quyền hưởng di sản","cs":"Điều 621 BLDS 2015","b":["Bị kết án về hành vi cố ý xâm phạm tính mạng, sức khỏe hoặc ngược đãi nghiêm trọng, hành hạ người để lại di sản, xâm phạm nghiêm trọng danh dự, nhân phẩm của người đó.","Vi phạm nghiêm trọng nghĩa vụ nuôi dưỡng người để lại di sản.","Bị kết án về hành vi cố ý xâm phạm tính mạng người thừa kế khác nhằm hưởng một phần hoặc toàn bộ di sản.","Lừa dối, cưỡng ép, ngăn cản người để lại di sản lập di chúc; giả mạo, sửa chữa, hủy, che giấu di chúc.","Vẫn được hưởng nếu người để lại di sản đã biết hành vi đó nhưng vẫn cho hưởng theo di chúc."]},{"t":"Thời hiệu thừa kế","cs":"Điều 623 BLDS 2015","b":["Yêu cầu chia di sản: 30 năm đối với bất động sản, 10 năm đối với động sản, kể từ thời điểm mở thừa kế; hết thời hạn thì di sản thuộc về người thừa kế đang quản lý di sản.","Yêu cầu xác nhận quyền thừa kế của mình hoặc bác bỏ quyền thừa kế của người khác: 10 năm kể từ thời điểm mở thừa kế.","Yêu cầu người thừa kế thực hiện nghĩa vụ về tài sản của người chết để lại: 03 năm kể từ thời điểm mở thừa kế."]}]},{"t":"Thừa kế theo di chúc","cs":"Chương XXII BLDS 2015 (Điều 624 – Điều 648)","b":["Di chúc là sự thể hiện ý chí của cá nhân nhằm chuyển tài sản của mình cho người khác sau khi chết (Điều 624)."],"c":[{"t":"Người lập di chúc","cs":"Điều 625 BLDS 2015","b":["Người thành niên minh mẫn, sáng suốt, không bị lừa dối, đe dọa, cưỡng ép.","Người từ đủ 15 tuổi đến chưa đủ 18 tuổi được lập di chúc nếu được cha, mẹ hoặc người giám hộ đồng ý."]},{"t":"Di chúc hợp pháp","cs":"Điều 630 BLDS 2015","b":["Người lập di chúc minh mẫn, sáng suốt, không bị lừa dối, đe dọa, cưỡng ép.","Nội dung không vi phạm điều cấm của luật, không trái đạo đức xã hội; hình thức không trái quy định của luật.","Người bị hạn chế về thể chất hoặc không biết chữ: di chúc phải được người làm chứng lập thành văn bản và có công chứng, chứng thực."]},{"t":"Di chúc bằng văn bản","cs":"Điều 628, Điều 633 – Điều 636 BLDS 2015","b":["Gồm: không có người làm chứng (người lập tự viết và ký); có người làm chứng (ít nhất 02 người); có công chứng; có chứng thực.","Không viết tắt, không viết bằng ký hiệu; nhiều trang thì đánh số và có chữ ký hoặc điểm chỉ ở mỗi trang (Điều 631)."]},{"t":"Di chúc miệng","cs":"Điều 629, khoản 5 Điều 630 BLDS 2015","b":["Chỉ khi tính mạng bị cái chết đe dọa và không thể lập di chúc bằng văn bản.","Thể hiện ý chí cuối cùng trước mặt ít nhất 02 người làm chứng; người làm chứng ghi chép lại, cùng ký hoặc điểm chỉ; trong 05 ngày làm việc phải được công chứng hoặc chứng thực.","Sau 03 tháng kể từ thời điểm di chúc miệng mà người lập còn sống, minh mẫn, sáng suốt thì di chúc mặc nhiên bị hủy bỏ."]},{"t":"Người làm chứng cho việc lập di chúc","cs":"Điều 632 BLDS 2015","b":["Không được là: người thừa kế theo di chúc hoặc theo pháp luật của người lập di chúc; người có quyền, nghĩa vụ tài sản liên quan tới nội dung di chúc; người chưa thành niên, người mất năng lực hành vi, người có khó khăn trong nhận thức, làm chủ hành vi."]},{"t":"Hiệu lực của di chúc","cs":"Điều 643 BLDS 2015","b":["Có hiệu lực từ thời điểm mở thừa kế.","Không có hiệu lực toàn bộ hoặc một phần khi: người thừa kế chết trước hoặc cùng thời điểm với người lập di chúc; cơ quan, tổ chức được thừa kế không còn tồn tại; di sản không còn vào thời điểm mở thừa kế."]},{"t":"Người thừa kế không phụ thuộc vào nội dung di chúc","cs":"Điều 644 BLDS 2015","b":["Con chưa thành niên, cha, mẹ, vợ, chồng; con thành niên mà không có khả năng lao động.","Được hưởng phần di sản bằng 2/3 suất của một người thừa kế theo pháp luật nếu di sản được chia theo pháp luật.","Không áp dụng với người từ chối nhận di sản hoặc người không có quyền hưởng di sản."]}]},{"t":"Thừa kế theo pháp luật","cs":"Chương XXIII BLDS 2015 (Điều 649 – Điều 655)","b":["Thừa kế theo hàng thừa kế, điều kiện và trình tự thừa kế do pháp luật quy định (Điều 649)."],"c":[{"t":"Trường hợp thừa kế theo pháp luật","cs":"Điều 650 BLDS 2015","b":["Không có di chúc; di chúc không hợp pháp.","Người thừa kế theo di chúc chết trước hoặc cùng thời điểm với người lập di chúc; cơ quan, tổ chức được thừa kế không còn tồn tại.","Người được chỉ định làm người thừa kế theo di chúc không có quyền hưởng di sản hoặc từ chối nhận di sản."]},{"t":"Hàng thừa kế","cs":"Điều 651 BLDS 2015","b":["Hàng thứ nhất: vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết.","Hàng thứ hai: ông nội, bà nội, ông ngoại, bà ngoại, anh ruột, chị ruột, em ruột của người chết; cháu ruột của người chết mà người chết là ông, bà.","Hàng thứ ba: cụ nội, cụ ngoại; bác, chú, cậu, cô, dì ruột của người chết; cháu ruột mà người chết là bác, chú, cậu, cô, dì ruột; chắt ruột mà người chết là cụ.","Những người cùng hàng được hưởng phần di sản bằng nhau; hàng sau chỉ được hưởng khi không còn ai ở hàng trước."]},{"t":"Thừa kế thế vị","cs":"Điều 652 BLDS 2015","b":["Con của người để lại di sản chết trước hoặc cùng thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống.","Nếu cháu cũng chết trước hoặc cùng thời điểm thì chắt được hưởng phần mà cha hoặc mẹ của chắt được hưởng nếu còn sống."]},{"t":"Con nuôi, con riêng","cs":"Điều 653, Điều 654 BLDS 2015","b":["Con nuôi và cha nuôi, mẹ nuôi được thừa kế di sản của nhau (Điều 653).","Con riêng và bố dượng, mẹ kế nếu có quan hệ chăm sóc, nuôi dưỡng nhau như cha con, mẹ con thì được thừa kế di sản của nhau (Điều 654)."]}]},{"t":"Thanh toán và phân chia di sản","cs":"Chương XXIV BLDS 2015 (Điều 656 – Điều 662)","b":["Thứ tự ưu tiên thanh toán (Điều 658): chi phí mai táng → tiền cấp dưỡng còn thiếu → chi phí bảo quản di sản → trợ cấp cho người sống nương nhờ → tiền công lao động → tiền bồi thường thiệt hại → thuế và khoản phải nộp ngân sách → khoản nợ khác → tiền phạt → chi phí khác.","Phân chia theo di chúc theo ý chí người lập; di chúc không xác định rõ phần của từng người thì chia đều cho những người được chỉ định (Điều 659).","Phân chia theo pháp luật: chia đều cho người cùng hàng; người thành thai trước khi mở thừa kế được chia như người khác (Điều 660)."]}]}]},{"t":"Chương 5. Nghĩa vụ, hợp đồng, bồi thường thiệt hại ngoài hợp đồng","cs":"Phần thứ ba BLDS 2015 (Điều 274 – Điều 608)","b":["Ba nội dung theo slide: nghĩa vụ dân sự; hợp đồng; bồi thường thiệt hại ngoài hợp đồng."],"c":[{"t":"Nghĩa vụ dân sự","cs":"Chương XV – Chương XVI BLDS 2015 (Điều 274 – Điều 384)","b":["Việc một hoặc nhiều chủ thể (bên có nghĩa vụ) phải chuyển giao vật, chuyển giao quyền, trả tiền hoặc giấy tờ có giá, thực hiện hoặc không được thực hiện công việc nhất định vì lợi ích của một hoặc nhiều chủ thể khác (bên có quyền) (Điều 274)."],"c":[{"t":"Đặc điểm và thành phần","cs":"Điều 274, Điều 276 BLDS 2015","b":["Là sự ràng buộc pháp lý giữa các bên; quyền và nghĩa vụ đối lập tương xứng; quan hệ trái quyền (quyền đối nhân).","Chủ thể: bên có quyền, bên có nghĩa vụ. Nội dung: quyền yêu cầu và nghĩa vụ.","Đối tượng (Điều 276): tài sản (giao vật, giao tiền, giấy tờ có giá, quyền), công việc phải thực hiện hoặc không được thực hiện; phải được xác định."]},{"t":"Căn cứ phát sinh nghĩa vụ","cs":"Điều 275 BLDS 2015","b":["Hợp đồng.","Hành vi pháp lý đơn phương.","Thực hiện công việc không có ủy quyền.","Chiếm hữu, sử dụng tài sản hoặc được lợi về tài sản không có căn cứ pháp luật.","Gây thiệt hại do hành vi trái pháp luật.","Căn cứ khác do pháp luật quy định."]},{"t":"Phân loại nghĩa vụ","cs":"Điều 287 – Điều 291 BLDS 2015","b":["Nghĩa vụ riêng rẽ: mỗi người có nghĩa vụ thực hiện phần nghĩa vụ của mình độc lập (Điều 287).","Nghĩa vụ liên đới: bên có quyền yêu cầu bất kỳ ai trong số những người có nghĩa vụ phải thực hiện toàn bộ nghĩa vụ (Điều 288).","Nghĩa vụ hoàn lại: người đã thực hiện toàn bộ nghĩa vụ liên đới có quyền yêu cầu những người có nghĩa vụ liên đới khác hoàn lại phần của họ (khoản 2 Điều 288).","Nghĩa vụ phân chia được theo phần và không phân chia được theo phần (Điều 290, Điều 291)."]},{"t":"Thực hiện nghĩa vụ","cs":"Điều 277 – Điều 286 BLDS 2015","b":["Thực hiện đúng đối tượng, đúng địa điểm (Điều 277), đúng thời hạn (Điều 278), đúng thỏa thuận; trung thực, theo tinh thần hợp tác (Điều 3).","Có thể thực hiện thông qua người thứ ba (Điều 283).","Chậm trả tiền thì phải trả lãi trên số tiền chậm trả (Điều 357)."]},{"t":"Chuyển giao quyền yêu cầu và nghĩa vụ","cs":"Điều 365 – Điều 371 BLDS 2015","b":["Chuyển giao quyền yêu cầu: không cần sự đồng ý của bên có nghĩa vụ nhưng phải thông báo bằng văn bản cho bên có nghĩa vụ; không chuyển giao quyền gắn liền với nhân thân hoặc khi các bên thỏa thuận không được chuyển giao (Điều 365).","Chuyển giao nghĩa vụ: phải được bên có quyền đồng ý; không chuyển giao nghĩa vụ gắn liền với nhân thân (Điều 370)."]},{"t":"Biện pháp bảo đảm thực hiện nghĩa vụ","cs":"Điều 292 – Điều 350 BLDS 2015","b":["Chín biện pháp (Điều 292): cầm cố, thế chấp, đặt cọc, ký cược, ký quỹ, bảo lưu quyền sở hữu, bảo lãnh, tín chấp, cầm giữ tài sản."],"c":[{"t":"Cầm cố, thế chấp","cs":"Điều 309, Điều 317 BLDS 2015","b":["Cầm cố: bên cầm cố giao tài sản thuộc quyền sở hữu của mình cho bên nhận cầm cố.","Thế chấp: bên thế chấp dùng tài sản thuộc sở hữu của mình để bảo đảm và không giao tài sản cho bên nhận thế chấp."]},{"t":"Đặt cọc","cs":"Điều 328 BLDS 2015; Án lệ 25/2018/AL","b":["Hợp đồng được giao kết, thực hiện thì tài sản đặt cọc được trả lại hoặc trừ vào nghĩa vụ trả tiền.","Bên đặt cọc từ chối giao kết, thực hiện hợp đồng thì mất tài sản đặt cọc; bên nhận đặt cọc từ chối thì phải trả lại tài sản đặt cọc và một khoản tiền tương đương giá trị tài sản đặt cọc, trừ thỏa thuận khác."]},{"t":"Ký cược, ký quỹ, bảo lưu quyền sở hữu","cs":"Điều 329, Điều 330, Điều 331 BLDS 2015","b":["Ký cược: bên thuê động sản giao cho bên cho thuê tài sản để bảo đảm việc trả lại tài sản thuê.","Ký quỹ: gửi tiền, kim khí quý, đá quý, giấy tờ có giá vào tài khoản phong tỏa tại tổ chức tín dụng.","Bảo lưu quyền sở hữu: trong hợp đồng mua bán, quyền sở hữu được bên bán bảo lưu cho đến khi bên mua thanh toán đủ."]},{"t":"Bảo lãnh, tín chấp, cầm giữ","cs":"Điều 335, Điều 344, Điều 346 BLDS 2015","b":["Bảo lãnh: người thứ ba cam kết với bên có quyền sẽ thực hiện nghĩa vụ thay cho bên có nghĩa vụ nếu đến hạn mà bên có nghĩa vụ không thực hiện hoặc thực hiện không đúng.","Tín chấp: tổ chức chính trị – xã hội ở cơ sở bảo đảm bằng tín chấp cho cá nhân, hộ gia đình nghèo vay vốn tại tổ chức tín dụng.","Cầm giữ: bên có quyền đang nắm giữ hợp pháp tài sản là đối tượng của hợp đồng song vụ được chiếm giữ tài sản khi bên có nghĩa vụ không thực hiện hoặc thực hiện không đúng."]},{"t":"Hiệu lực đối kháng với người thứ ba","cs":"Điều 297 BLDS 2015","b":["Phát sinh từ khi đăng ký biện pháp bảo đảm hoặc bên nhận bảo đảm nắm giữ hoặc chiếm giữ tài sản bảo đảm."]}]},{"t":"Chấm dứt nghĩa vụ","cs":"Điều 372 BLDS 2015","b":["Nghĩa vụ được hoàn thành; theo thỏa thuận của các bên; bên có quyền miễn việc thực hiện nghĩa vụ; được thay thế bằng nghĩa vụ khác; được bù trừ.","Bên có quyền và bên có nghĩa vụ hòa nhập làm một; thời hiệu miễn trừ nghĩa vụ đã hết.","Bên có nghĩa vụ là cá nhân chết hoặc pháp nhân chấm dứt tồn tại mà nghĩa vụ phải do chính họ thực hiện; bên có quyền chết mà quyền yêu cầu không thuộc di sản thừa kế.","Vật đặc định là đối tượng của nghĩa vụ không còn và được thay thế bằng nghĩa vụ khác."]}]},{"t":"Hợp đồng","cs":"Chương XV Mục 7, Chương XVI BLDS 2015 (Điều 385 – Điều 569)","b":["Hợp đồng là sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự (Điều 385).","Đặc điểm: là sự thỏa thuận (ý chí chung); tạo ràng buộc pháp lý giữa các bên; các bên có mục đích chung."],"c":[{"t":"Phân loại hợp đồng","cs":"Điều 402 BLDS 2015","b":["Hợp đồng song vụ (các bên đều có nghĩa vụ đối với nhau) – hợp đồng đơn vụ (chỉ một bên có nghĩa vụ).","Hợp đồng chính (hiệu lực không phụ thuộc hợp đồng khác) – hợp đồng phụ (hiệu lực phụ thuộc hợp đồng chính).","Hợp đồng vì lợi ích của người thứ ba; hợp đồng có điều kiện."]},{"t":"Điều kiện có hiệu lực và hợp đồng vô hiệu","cs":"Điều 117, Điều 122 – Điều 133, Điều 407 BLDS 2015","b":["Điều kiện có hiệu lực: như giao dịch dân sự (chủ thể, ý chí, mục đích – nội dung, hình thức).","Vô hiệu toàn bộ hoặc vô hiệu một phần; vô hiệu tuyệt đối hoặc vô hiệu tương đối.","Hợp đồng chính vô hiệu làm chấm dứt hợp đồng phụ, trừ thỏa thuận hợp đồng phụ được thay thế hợp đồng chính; hợp đồng phụ vô hiệu không làm chấm dứt hợp đồng chính, trừ thỏa thuận khác (Điều 407)."]},{"t":"Giao kết hợp đồng","cs":"Điều 386 – Điều 408 BLDS 2015","b":["Đề nghị giao kết: thể hiện rõ ý định giao kết và chịu sự ràng buộc về đề nghị (Điều 386); có hiệu lực khi bên được đề nghị nhận được, trừ thỏa thuận khác (Điều 388).","Thay đổi, rút lại đề nghị trước hoặc cùng lúc bên được đề nghị nhận được đề nghị (Điều 389); hủy bỏ đề nghị khi đã nêu rõ quyền này (Điều 390).","Chấp nhận đề nghị: trả lời chấp nhận toàn bộ nội dung; im lặng không là chấp nhận, trừ thỏa thuận hoặc thói quen (Điều 393); chấp nhận có sửa đổi là đề nghị mới (Điều 392).","Thời điểm giao kết: khi bên đề nghị nhận được chấp nhận; bằng văn bản là khi bên sau cùng ký vào văn bản (Điều 400). Hiệu lực từ thời điểm giao kết, trừ thỏa thuận hoặc luật khác (Điều 401).","Nội dung có thể thỏa thuận: đối tượng; số lượng, chất lượng; giá, phương thức thanh toán; thời hạn, địa điểm, phương thức thực hiện; quyền, nghĩa vụ; trách nhiệm do vi phạm; giải quyết tranh chấp (Điều 398)."]},{"t":"Thực hiện hợp đồng","cs":"Điều 409 – Điều 420 BLDS 2015","b":["Hợp đồng đơn vụ: bên có nghĩa vụ thực hiện đúng thỏa thuận; chỉ thực hiện trước hoặc sau thời hạn nếu bên kia đồng ý (Điều 409).","Hợp đồng song vụ: thực hiện đúng thời hạn; không thỏa thuận ai thực hiện trước thì thực hiện đồng thời; nghĩa vụ cần nhiều thời gian hơn thì thực hiện trước (Điều 410).","Quyền hoãn thực hiện nghĩa vụ khi bên kia không có khả năng thực hiện (Điều 411).","Phạt vi phạm: mức phạt do các bên thỏa thuận; chỉ thỏa thuận phạt vi phạm mà không thỏa thuận bồi thường thì chỉ phải nộp phạt (Điều 418).","Hoàn cảnh thay đổi cơ bản: đàm phán lại; không được thì yêu cầu Tòa án chấm dứt hoặc sửa đổi hợp đồng (Điều 420)."]},{"t":"Sửa đổi, chấm dứt, hủy bỏ hợp đồng","cs":"Điều 421 – Điều 429 BLDS 2015","b":["Sửa đổi theo thỏa thuận hoặc theo quy định tại Điều 420 (Điều 421).","Chấm dứt (Điều 422): hoàn thành; theo thỏa thuận; cá nhân giao kết chết, pháp nhân chấm dứt tồn tại mà hợp đồng phải do chính họ thực hiện; bị hủy bỏ, đơn phương chấm dứt; không thể thực hiện do đối tượng không còn; hoàn cảnh thay đổi cơ bản.","Hủy bỏ (Điều 423, Điều 427): khi bên kia vi phạm là điều kiện hủy bỏ đã thỏa thuận, vi phạm nghiêm trọng hoặc trường hợp luật định; hợp đồng không có hiệu lực từ thời điểm giao kết, các bên hoàn trả cho nhau những gì đã nhận, bên có lỗi bồi thường.","Đơn phương chấm dứt (Điều 428): hợp đồng chấm dứt kể từ thời điểm bên kia nhận được thông báo; bên vi phạm phải bồi thường.","Thời hiệu khởi kiện tranh chấp hợp đồng: 03 năm kể từ ngày biết hoặc phải biết quyền, lợi ích bị xâm phạm (Điều 429)."]},{"t":"Hợp đồng thông dụng","cs":"Chương XVI BLDS 2015 (Điều 430 – Điều 569)","b":["Tám hợp đồng theo slide: mua bán; tặng cho; thuê; mượn; vay; về quyền sử dụng đất; ủy quyền; dịch vụ."],"c":[{"t":"Hợp đồng mua bán tài sản","cs":"Điều 430 – Điều 454 BLDS 2015","b":["Bên bán chuyển quyền sở hữu tài sản cho bên mua; bên mua trả tiền (Điều 430).","Giao tài sản đúng số lượng, chất lượng; cung cấp thông tin cần thiết.","Rủi ro: bên bán chịu trước khi giao, bên mua chịu từ khi nhận tài sản; tài sản phải đăng ký thì bên mua chịu từ khi hoàn thành thủ tục đăng ký (Điều 441).","Một số hình thức đặc thù: mua trả chậm, trả dần (Điều 453); chuộc lại tài sản đã bán (Điều 454); bảo hành (Điều 446)."]},{"t":"Hợp đồng tặng cho tài sản","cs":"Điều 457 – Điều 462 BLDS 2015","b":["Bên tặng cho giao tài sản và chuyển quyền sở hữu cho bên được tặng cho mà không yêu cầu đền bù (Điều 457).","Động sản: hiệu lực khi bên được tặng cho nhận tài sản; động sản phải đăng ký thì từ thời điểm đăng ký (Điều 458).","Bất động sản: lập văn bản có công chứng, chứng thực hoặc đăng ký nếu luật yêu cầu; hiệu lực từ thời điểm đăng ký (Điều 459).","Tặng cho có điều kiện: điều kiện không vi phạm điều cấm, không trái đạo đức xã hội (Điều 462)."]},{"t":"Hợp đồng thuê tài sản","cs":"Điều 472 – Điều 493 BLDS 2015","b":["Bên cho thuê giao tài sản cho bên thuê để sử dụng trong thời hạn; bên thuê trả tiền thuê (Điều 472).","Cho thuê lại phải được bên cho thuê đồng ý (Điều 475).","Bên thuê chậm trả tiền thuê 03 kỳ liên tiếp thì bên cho thuê có quyền đơn phương chấm dứt (Điều 481).","Thuê khoán: đối tượng là đất đai, rừng, mặt nước, gia súc, cơ sở sản xuất, kinh doanh, tư liệu sản xuất khác (Điều 483)."]},{"t":"Hợp đồng mượn tài sản","cs":"Điều 494 – Điều 499 BLDS 2015","b":["Bên cho mượn giao tài sản cho bên mượn sử dụng trong thời hạn mà không phải trả tiền; bên mượn trả lại khi hết thời hạn hoặc đạt mục đích (Điều 494).","Đối tượng chỉ là tài sản không tiêu hao (Điều 495).","Bên mượn giữ gìn, bảo quản; không tự ý thay đổi tình trạng tài sản; không cho mượn lại nếu không được đồng ý (Điều 496)."]},{"t":"Hợp đồng vay tài sản","cs":"Điều 463 – Điều 471 BLDS 2015","b":["Bên cho vay giao tài sản cho bên vay; khi đến hạn bên vay hoàn trả tài sản cùng loại đúng số lượng, chất lượng và chỉ trả lãi nếu có thỏa thuận hoặc luật quy định (Điều 463).","Lãi suất thỏa thuận không vượt quá 20%/năm của khoản tiền vay; phần vượt không có hiệu lực (Điều 468)."]},{"t":"Hợp đồng về quyền sử dụng đất","cs":"Điều 500 – Điều 503 BLDS 2015; Luật Đất đai 2024","b":["Người sử dụng đất chuyển đổi, chuyển nhượng, cho thuê, cho thuê lại, tặng cho, thế chấp, góp vốn quyền sử dụng đất (Điều 500).","Lập thành văn bản theo hình thức phù hợp với BLDS và pháp luật về đất đai (Điều 502).","Hiệu lực của việc chuyển quyền sử dụng đất kể từ thời điểm đăng ký theo Luật Đất đai (Điều 503)."]},{"t":"Hợp đồng ủy quyền","cs":"Điều 562 – Điều 569 BLDS 2015","b":["Bên được ủy quyền thực hiện công việc nhân danh bên ủy quyền; bên ủy quyền chỉ trả thù lao nếu có thỏa thuận hoặc luật quy định (Điều 562).","Thời hạn do các bên thỏa thuận hoặc luật quy định; không có thì 01 năm kể từ ngày xác lập (Điều 563).","Ủy quyền lại khi được bên ủy quyền đồng ý hoặc do sự kiện bất khả kháng (Điều 564).","Đơn phương chấm dứt: ủy quyền có thù lao thì bên ủy quyền phải trả thù lao tương ứng và bồi thường; không có thù lao thì phải báo trước một thời gian hợp lý (Điều 569)."]},{"t":"Hợp đồng dịch vụ","cs":"Điều 513 – Điều 521 BLDS 2015","b":["Bên cung ứng dịch vụ thực hiện công việc cho bên sử dụng dịch vụ; bên sử dụng dịch vụ trả tiền dịch vụ (Điều 513).","Đối tượng là công việc có thể thực hiện được, không bị pháp luật cấm, không trái đạo đức xã hội (Điều 514)."]}]}]},{"t":"Bồi thường thiệt hại ngoài hợp đồng","cs":"Chương XX BLDS 2015 (Điều 584 – Điều 608)","b":["Ba nội dung theo slide: quy định chung; xác định thiệt hại; bồi thường trong trường hợp cụ thể."],"c":[{"t":"Căn cứ phát sinh trách nhiệm","cs":"Điều 584 BLDS 2015","b":["Có hành vi xâm phạm tính mạng, sức khỏe, danh dự, nhân phẩm, uy tín, tài sản, quyền, lợi ích hợp pháp khác của người khác.","Có thiệt hại xảy ra.","Có mối quan hệ nhân quả giữa hành vi và thiệt hại.","Không phải bồi thường khi thiệt hại phát sinh do sự kiện bất khả kháng hoặc hoàn toàn do lỗi của bên bị thiệt hại, trừ thỏa thuận hoặc luật khác."]},{"t":"Nguyên tắc bồi thường","cs":"Điều 585 BLDS 2015","b":["Thiệt hại thực tế phải được bồi thường toàn bộ và kịp thời; các bên thỏa thuận mức, hình thức (tiền, hiện vật, thực hiện công việc), phương thức (một lần hoặc nhiều lần).","Được giảm mức bồi thường nếu không có lỗi hoặc có lỗi vô ý và thiệt hại quá lớn so với khả năng kinh tế.","Mức bồi thường không còn phù hợp với thực tế thì có quyền yêu cầu Tòa án, cơ quan có thẩm quyền thay đổi.","Bên bị thiệt hại có lỗi trong việc gây thiệt hại thì không được bồi thường phần thiệt hại do lỗi của mình gây ra.","Bên có quyền, lợi ích bị xâm phạm không được bồi thường nếu thiệt hại xảy ra do không áp dụng biện pháp cần thiết, hợp lý để ngăn chặn, hạn chế thiệt hại cho chính mình."]},{"t":"Năng lực chịu trách nhiệm bồi thường","cs":"Điều 586 BLDS 2015","b":["Người từ đủ 18 tuổi trở lên gây thiệt hại thì phải tự bồi thường.","Người chưa đủ 15 tuổi gây thiệt hại mà còn cha, mẹ thì cha, mẹ bồi thường toàn bộ; tài sản của cha mẹ không đủ mà con có tài sản riêng thì lấy tài sản đó bồi thường phần còn thiếu.","Người từ đủ 15 đến chưa đủ 18 tuổi gây thiệt hại thì bồi thường bằng tài sản của mình; không đủ thì cha, mẹ bồi thường phần còn thiếu.","Người được giám hộ gây thiệt hại: người giám hộ được dùng tài sản của người được giám hộ để bồi thường; không đủ thì người giám hộ bồi thường bằng tài sản của mình, trừ khi chứng minh không có lỗi."]},{"t":"Liên đới bồi thường, thời hiệu","cs":"Điều 587, Điều 588 BLDS 2015","b":["Nhiều người cùng gây thiệt hại thì liên đới bồi thường; phần của mỗi người xác định tương ứng mức độ lỗi; không xác định được mức độ lỗi thì bồi thường theo phần bằng nhau (Điều 587).","Thời hiệu khởi kiện: 03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích bị xâm phạm (Điều 588)."]},{"t":"Xác định thiệt hại","cs":"Điều 589 – Điều 592 BLDS 2015; Nghị quyết 02/2022/NQ-HĐTP","b":["Mức lương cơ sở tính tổn thất tinh thần là mức tại thời điểm giải quyết bồi thường; hiện là 2.530.000 đồng/tháng (Nghị định 161/2026/NĐ-CP)."],"c":[{"t":"Thiệt hại do tài sản bị xâm phạm","cs":"Điều 589 BLDS 2015","b":["Tài sản bị mất, bị hủy hoại hoặc bị hư hỏng.","Lợi ích gắn liền với việc sử dụng, khai thác tài sản bị mất, bị giảm sút.","Chi phí hợp lý để ngăn chặn, hạn chế và khắc phục thiệt hại."]},{"t":"Thiệt hại do sức khỏe bị xâm phạm","cs":"Điều 590 BLDS 2015","b":["Chi phí hợp lý cho việc cứu chữa, bồi dưỡng, phục hồi sức khỏe và chức năng bị mất, bị giảm sút.","Thu nhập thực tế bị mất hoặc bị giảm sút của người bị thiệt hại.","Chi phí hợp lý và thu nhập thực tế bị mất của người chăm sóc.","Tổn thất về tinh thần: do các bên thỏa thuận; không thỏa thuận được thì tối đa không quá 50 lần mức lương cơ sở."]},{"t":"Thiệt hại do tính mạng bị xâm phạm","cs":"Điều 591 BLDS 2015","b":["Thiệt hại do sức khỏe bị xâm phạm trước khi chết.","Chi phí hợp lý cho việc mai táng.","Tiền cấp dưỡng cho những người mà người bị thiệt hại có nghĩa vụ cấp dưỡng.","Tổn thất về tinh thần cho người thân thích thuộc hàng thừa kế thứ nhất (không có thì người trực tiếp nuôi dưỡng): tối đa không quá 100 lần mức lương cơ sở nếu không thỏa thuận được."]},{"t":"Thiệt hại do danh dự, nhân phẩm, uy tín bị xâm phạm","cs":"Điều 592 BLDS 2015","b":["Chi phí hợp lý để hạn chế, khắc phục thiệt hại.","Thu nhập thực tế bị mất hoặc bị giảm sút.","Tổn thất về tinh thần: tối đa không quá 10 lần mức lương cơ sở nếu không thỏa thuận được."]}]},{"t":"Bồi thường trong trường hợp cụ thể","cs":"Điều 594 – Điều 608 BLDS 2015","b":["Vượt quá giới hạn phòng vệ chính đáng (Điều 594); vượt quá yêu cầu của tình thế cấp thiết (Điều 595); người dùng chất kích thích gây thiệt hại (Điều 596).","Người của pháp nhân gây thiệt hại khi thực hiện nhiệm vụ (Điều 597); người thi hành công vụ (Điều 598); người làm công, học nghề (Điều 600).","Người dưới 15 tuổi, người mất năng lực hành vi gây thiệt hại trong thời gian trường học, bệnh viện, pháp nhân khác trực tiếp quản lý (Điều 599).","Nguồn nguy hiểm cao độ: chủ sở hữu, người chiếm hữu phải bồi thường cả khi không có lỗi, trừ thiệt hại hoàn toàn do lỗi cố ý của người bị thiệt hại hoặc do bất khả kháng, tình thế cấp thiết (Điều 601).","Làm ô nhiễm môi trường (Điều 602); súc vật (Điều 603); cây cối (Điều 604); nhà cửa, công trình (Điều 605); xâm phạm thi thể, mồ mả (Điều 606, 607); vi phạm quyền lợi người tiêu dùng (Điều 608)."]}]}]},{"t":"Chương 6. Hôn nhân và gia đình","cs":"Luật HNGĐ 2014 (VBHN 2025); BLDS 2015; Nghị định 126/2014/NĐ-CP; Nghị quyết 01/2024/NQ-HĐTP","b":["Năm nội dung theo slide: quan hệ pháp luật hôn nhân và gia đình; kết hôn; quan hệ giữa các thành viên gia đình; cấp dưỡng; chấm dứt hôn nhân.","Luật HNGĐ không quy định thì áp dụng BLDS (Điều 6 Luật HNGĐ)."],"c":[{"t":"Quan hệ pháp luật hôn nhân và gia đình","cs":"Điều 2, Điều 3 Luật HNGĐ 2014","b":["Hôn nhân là quan hệ giữa vợ và chồng sau khi kết hôn; gia đình là tập hợp những người gắn bó do hôn nhân, huyết thống hoặc nuôi dưỡng (khoản 1, khoản 2 Điều 3)."],"c":[{"t":"Nguyên tắc cơ bản","cs":"Điều 2 Luật HNGĐ 2014","b":["Hôn nhân tự nguyện, tiến bộ, một vợ một chồng, vợ chồng bình đẳng.","Các thành viên gia đình tôn trọng, quan tâm, chăm sóc, giúp đỡ nhau; không phân biệt đối xử giữa các con.","Nhà nước, xã hội và gia đình có trách nhiệm bảo vệ, hỗ trợ trẻ em, người cao tuổi, người khuyết tật."]},{"t":"Thành phần quan hệ","cs":"Điều 3 Luật HNGĐ 2014","b":["Chủ thể: các thành viên trong gia đình.","Khách thể: giá trị nhân thân và tài sản.","Nội dung: quyền và nghĩa vụ giữa các thành viên."]},{"t":"Căn cứ phát sinh, thay đổi, chấm dứt","cs":"Luật HNGĐ 2014","b":["Phát sinh: kết hôn, sinh con, nhận nuôi con nuôi.","Thay đổi: hạn chế quyền của cha, mẹ đối với con; chia tài sản chung trong thời kỳ hôn nhân.","Chấm dứt: ly hôn; vợ hoặc chồng chết, bị Tòa án tuyên bố đã chết."]}]},{"t":"Kết hôn","cs":"Chương II Luật HNGĐ 2014 (Điều 8 – Điều 16)","b":["Kết hôn là việc nam và nữ xác lập quan hệ vợ chồng theo điều kiện kết hôn và đăng ký kết hôn (khoản 5 Điều 3)."],"c":[{"t":"Điều kiện kết hôn","cs":"Điều 8, khoản 2 Điều 5 Luật HNGĐ 2014","b":["Nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên.","Việc kết hôn do nam và nữ tự nguyện quyết định.","Không bị mất năng lực hành vi dân sự.","Không thuộc trường hợp cấm kết hôn: kết hôn giả tạo; tảo hôn, cưỡng ép, lừa dối, cản trở kết hôn; người đang có vợ, có chồng; giữa người cùng dòng máu về trực hệ, có họ trong phạm vi ba đời, giữa cha mẹ nuôi với con nuôi…","Nhà nước không thừa nhận hôn nhân giữa những người cùng giới tính."]},{"t":"Đăng ký kết hôn","cs":"Điều 9 Luật HNGĐ 2014; Luật Hộ tịch 2014; Nghị định 120/2025/NĐ-CP","b":["Việc kết hôn phải được đăng ký tại cơ quan nhà nước có thẩm quyền (Ủy ban nhân dân cấp xã); không đăng ký thì không có giá trị pháp lý.","Vợ chồng đã ly hôn muốn xác lập lại quan hệ vợ chồng thì phải đăng ký kết hôn."]},{"t":"Kết hôn trái pháp luật","cs":"Điều 10, Điều 11 Luật HNGĐ 2014","b":["Việc kết hôn đã đăng ký nhưng vi phạm điều kiện kết hôn tại Điều 8.","Người bị cưỡng ép, bị lừa dối kết hôn tự mình yêu cầu hoặc đề nghị cá nhân, tổ chức yêu cầu Tòa án hủy.","Vợ, chồng của người đang có vợ, có chồng mà kết hôn; cha, mẹ, con, người giám hộ, người đại diện; cơ quan quản lý nhà nước về gia đình, về trẻ em; Hội Liên hiệp phụ nữ có quyền yêu cầu hủy.","Hai bên đã đủ điều kiện kết hôn và cùng yêu cầu công nhận thì Tòa án công nhận quan hệ hôn nhân (khoản 2 Điều 11)."]},{"t":"Hậu quả pháp lý","cs":"Điều 12 – Điều 16 Luật HNGĐ 2014","b":["Hủy kết hôn trái pháp luật: hai bên phải chấm dứt quan hệ như vợ chồng; quyền, nghĩa vụ đối với con, tài sản giải quyết theo Điều 15, Điều 16 (Điều 12).","Đăng ký kết hôn không đúng thẩm quyền: thu hồi, hủy giấy chứng nhận và yêu cầu đăng ký lại (Điều 13).","Chung sống như vợ chồng không đăng ký kết hôn: không làm phát sinh quyền, nghĩa vụ giữa vợ và chồng; quyền, nghĩa vụ với con giải quyết như cha mẹ và con; tài sản giải quyết theo thỏa thuận, không có thỏa thuận thì theo BLDS (Điều 14 – Điều 16)."]}]},{"t":"Quan hệ giữa các thành viên gia đình","cs":"Chương III, Chương V Luật HNGĐ 2014","b":["Gồm quan hệ vợ chồng; cha, mẹ và con; các thành viên khác."],"c":[{"t":"Vợ và chồng","cs":"Chương III Luật HNGĐ 2014 (Điều 17 – Điều 67)","b":["Ba nhóm: quyền, nghĩa vụ nhân thân; đại diện; chế độ tài sản."],"c":[{"t":"Quyền và nghĩa vụ nhân thân","cs":"Điều 17 – Điều 23 Luật HNGĐ 2014","b":["Bình đẳng về quyền, nghĩa vụ trong mọi mặt của gia đình (Điều 17).","Yêu thương, chung thủy, tôn trọng, quan tâm, chăm sóc, giúp đỡ nhau; cùng chung sống (Điều 19).","Lựa chọn nơi cư trú do vợ chồng thỏa thuận (Điều 20); tôn trọng danh dự, nhân phẩm, uy tín (Điều 21); tôn trọng tự do tín ngưỡng, tôn giáo (Điều 22); giúp đỡ nhau học tập, làm việc (Điều 23)."]},{"t":"Đại diện giữa vợ và chồng","cs":"Điều 24 – Điều 27 Luật HNGĐ 2014","b":["Căn cứ: theo pháp luật (vợ/chồng mất năng lực hành vi, khó khăn trong nhận thức mà bên kia đủ điều kiện làm người giám hộ) hoặc theo ủy quyền (Điều 24).","Kinh doanh chung: vợ chồng cùng kinh doanh là đại diện theo pháp luật của nhau, trừ thỏa thuận khác (Điều 25).","Tài sản chung đứng tên một bên: bên đứng tên tự mình giao dịch trái quy định về đại diện thì giao dịch vô hiệu, trừ trường hợp bảo vệ người thứ ba ngay tình (Điều 26).","Vợ, chồng liên đới chịu trách nhiệm đối với giao dịch do một bên thực hiện để đáp ứng nhu cầu thiết yếu của gia đình (Điều 27)."]},{"t":"Chế độ tài sản của vợ chồng","cs":"Điều 28 – Điều 50 Luật HNGĐ 2014; Điều 210, Điều 213 BLDS 2015","b":["Áp dụng chế độ tài sản theo luật định hoặc theo thỏa thuận (khoản 1 Điều 28)."],"c":[{"t":"Tài sản chung","cs":"Điều 33 Luật HNGĐ 2014","b":["Tài sản do vợ, chồng tạo ra; thu nhập do lao động, sản xuất, kinh doanh; hoa lợi, lợi tức phát sinh từ tài sản riêng; thu nhập hợp pháp khác trong thời kỳ hôn nhân.","Tài sản được thừa kế chung, tặng cho chung; tài sản vợ chồng thỏa thuận là tài sản chung; quyền sử dụng đất có được sau khi kết hôn (trừ trường hợp được thừa kế riêng, tặng cho riêng).","Là sở hữu chung hợp nhất; không chứng minh được là tài sản riêng thì là tài sản chung (khoản 3)."]},{"t":"Tài sản riêng","cs":"Điều 43 Luật HNGĐ 2014; Điều 11 Nghị định 126/2014/NĐ-CP","b":["Tài sản có trước khi kết hôn; được thừa kế riêng, tặng cho riêng trong thời kỳ hôn nhân; được chia riêng theo Điều 38 – Điều 40.","Tài sản phục vụ nhu cầu thiết yếu của vợ, chồng; tài sản hình thành từ tài sản riêng; tài sản khác mà theo pháp luật thuộc sở hữu riêng."]},{"t":"Định đoạt tài sản chung, nghĩa vụ tài sản","cs":"Điều 30, Điều 31, Điều 35, Điều 37, Điều 45 Luật HNGĐ 2014","b":["Chiếm hữu, sử dụng, định đoạt tài sản chung do vợ chồng thỏa thuận (khoản 1 Điều 35).","Bất động sản, động sản phải đăng ký, tài sản đang là nguồn tạo ra thu nhập chủ yếu của gia đình: phải có thỏa thuận bằng văn bản (khoản 2 Điều 35).","Nhà là nơi ở duy nhất của vợ chồng: định đoạt phải có sự thỏa thuận, kể cả khi là tài sản riêng (Điều 31).","Nghĩa vụ chung về tài sản (Điều 37), trong đó có giao dịch đáp ứng nhu cầu thiết yếu của gia đình (Điều 30); nghĩa vụ riêng (Điều 45)."]},{"t":"Chia tài sản chung trong thời kỳ hôn nhân","cs":"Điều 38 – Điều 42 Luật HNGĐ 2014","b":["Vợ chồng thỏa thuận chia một phần hoặc toàn bộ; không thỏa thuận được thì yêu cầu Tòa án giải quyết; lập thành văn bản (Điều 38).","Phần tài sản được chia, hoa lợi, lợi tức phát sinh từ đó là tài sản riêng (Điều 40).","Việc chia vô hiệu khi ảnh hưởng nghiêm trọng đến lợi ích gia đình, quyền lợi của con hoặc nhằm trốn tránh nghĩa vụ (Điều 42)."]},{"t":"Chế độ tài sản theo thỏa thuận","cs":"Điều 47 – Điều 50 Luật HNGĐ 2014","b":["Lập trước khi kết hôn bằng văn bản có công chứng hoặc chứng thực; có hiệu lực từ ngày đăng ký kết hôn (Điều 47).","Nội dung (Điều 48); sửa đổi, bổ sung (Điều 49); bị vô hiệu trong các trường hợp tại Điều 50."]}]}]},{"t":"Cha, mẹ và con","cs":"Chương V Luật HNGĐ 2014 (Điều 68 – Điều 102)","b":["Cha, mẹ là người đại diện theo pháp luật của con chưa thành niên (khoản 1 Điều 136 BLDS 2015)."],"c":[{"t":"Quyền và nghĩa vụ nhân thân","cs":"Điều 68 – Điều 74 Luật HNGĐ 2014","b":["Con bình đẳng, không phụ thuộc tình trạng hôn nhân của cha mẹ (Điều 68).","Cha mẹ thương yêu, nuôi dưỡng, chăm sóc, giáo dục con; con kính trọng, chăm sóc, phụng dưỡng cha mẹ (Điều 69 – Điều 72).","Cha mẹ đại diện cho con chưa thành niên, con thành niên mất năng lực hành vi (Điều 73); bồi thường thiệt hại do con gây ra theo BLDS (Điều 74)."]},{"t":"Tài sản riêng của con","cs":"Điều 75 – Điều 77 Luật HNGĐ 2014","b":["Con có quyền có tài sản riêng; con từ đủ 15 tuổi sống chung với cha mẹ mà có thu nhập thì đóng góp vào nhu cầu thiết yếu của gia đình (Điều 75).","Con từ đủ 15 tuổi có thể tự quản lý tài sản riêng; dưới 15 tuổi do cha mẹ quản lý (Điều 76).","Con dưới 15 tuổi: cha mẹ định đoạt vì lợi ích của con, con từ đủ 09 tuổi thì xem xét nguyện vọng; con từ đủ 15 đến dưới 18 tuổi tự định đoạt, trừ bất động sản, động sản phải đăng ký, tài sản dùng để kinh doanh phải được cha mẹ đồng ý bằng văn bản (Điều 77)."]},{"t":"Hạn chế quyền của cha, mẹ đối với con chưa thành niên","cs":"Điều 85 – Điều 87 Luật HNGĐ 2014; Nghị quyết 01/2024/NQ-HĐTP","b":["Căn cứ: bị kết án về tội cố ý xâm phạm sức khỏe, danh dự, nhân phẩm của con; vi phạm nghiêm trọng nghĩa vụ trông nom, chăm sóc, nuôi dưỡng, giáo dục con; phá tán tài sản của con; có lối sống đồi trụy; xúi giục, ép buộc con làm việc trái pháp luật, trái đạo đức xã hội (khoản 1 Điều 85).","Thời hạn hạn chế từ 01 năm đến 05 năm (khoản 2 Điều 85).","Người bị hạn chế quyền vẫn phải thực hiện nghĩa vụ cấp dưỡng cho con (Điều 87)."]},{"t":"Xác định cha, mẹ, con","cs":"Điều 88 – Điều 100 Luật HNGĐ 2014","b":["Con sinh ra trong thời kỳ hôn nhân hoặc do người vợ có thai trong thời kỳ hôn nhân là con chung; con sinh ra trong 300 ngày kể từ khi hôn nhân chấm dứt được coi là con do người vợ có thai trong thời kỳ hôn nhân; con sinh ra trước ngày đăng ký kết hôn và được cha mẹ thừa nhận là con chung (Điều 88).","Nhận cha, mẹ, con (Điều 89 – Điều 92); sinh con bằng kỹ thuật hỗ trợ sinh sản, mang thai hộ vì mục đích nhân đạo (Điều 93 – Điều 100)."]}]},{"t":"Các thành viên khác trong gia đình","cs":"Điều 103 – Điều 106 Luật HNGĐ 2014","b":["Các thành viên quan tâm, chăm sóc, giúp đỡ, tôn trọng nhau (Điều 103).","Ông bà nội, ngoại – cháu (Điều 104); anh, chị, em (Điều 105); cô, dì, chú, cậu, bác ruột – cháu ruột (Điều 106).","Nghĩa vụ trông nom, chăm sóc, nuôi dưỡng phát sinh khi không còn người gần hơn có điều kiện nuôi dưỡng."]}]},{"t":"Cấp dưỡng","cs":"Chương VI Luật HNGĐ 2014 (Điều 107 – Điều 120)","b":["Việc một người có nghĩa vụ đóng góp tiền hoặc tài sản khác để đáp ứng nhu cầu thiết yếu của người không sống chung với mình mà có quan hệ hôn nhân, huyết thống hoặc nuôi dưỡng (khoản 24 Điều 3).","Không thể thay thế bằng nghĩa vụ khác và không thể chuyển giao cho người khác (Điều 107)."],"c":[{"t":"Các trường hợp cấp dưỡng","cs":"Điều 110 – Điều 115 Luật HNGĐ 2014","b":["Người được cấp dưỡng: người chưa thành niên; người thành niên không có khả năng lao động và không có tài sản để tự nuôi mình; người gặp khó khăn, túng thiếu.","Cha, mẹ đối với con (Điều 110); con đối với cha, mẹ (Điều 111); anh, chị, em (Điều 112); ông bà – cháu (Điều 113); cô, dì, chú, cậu, bác ruột – cháu ruột (Điều 114); vợ, chồng khi ly hôn nếu bên khó khăn, túng thiếu có yêu cầu và có lý do chính đáng (Điều 115)."]},{"t":"Mức, phương thức cấp dưỡng","cs":"Điều 116, Điều 117, Điều 119 Luật HNGĐ 2014","b":["Mức do các bên thỏa thuận căn cứ thu nhập, khả năng thực tế của người cấp dưỡng và nhu cầu thiết yếu của người được cấp dưỡng; không thỏa thuận được thì yêu cầu Tòa án giải quyết (Điều 116).","Phương thức định kỳ hằng tháng, hằng quý, nửa năm, hằng năm hoặc một lần (Điều 117).","Người có quyền yêu cầu thực hiện nghĩa vụ cấp dưỡng (Điều 119)."]},{"t":"Chấm dứt nghĩa vụ cấp dưỡng","cs":"Điều 118 Luật HNGĐ 2014","b":["Người được cấp dưỡng đã thành niên và có khả năng lao động hoặc có tài sản để tự nuôi mình.","Người được cấp dưỡng được nhận làm con nuôi.","Người cấp dưỡng đã trực tiếp nuôi dưỡng người được cấp dưỡng.","Người cấp dưỡng hoặc người được cấp dưỡng chết.","Bên được cấp dưỡng sau khi ly hôn đã kết hôn; trường hợp khác theo luật."]}]},{"t":"Chấm dứt hôn nhân","cs":"Chương IV Luật HNGĐ 2014 (Điều 51 – Điều 67)","b":["Hôn nhân chấm dứt do vợ hoặc chồng chết, bị Tòa án tuyên bố đã chết, hoặc do ly hôn."],"c":[{"t":"Vợ, chồng chết hoặc bị tuyên bố đã chết","cs":"Điều 65 – Điều 67 Luật HNGĐ 2014; Điều 71, Điều 73 BLDS 2015","b":["Thời điểm chấm dứt hôn nhân: thời điểm vợ hoặc chồng chết; bị tuyên bố đã chết thì là ngày chết được xác định trong bản án, quyết định (Điều 65).","Bên còn sống quản lý tài sản chung; tài sản chung được chia đôi, phần của người chết được chia theo pháp luật về thừa kế (Điều 66).","Người bị tuyên bố đã chết trở về: quan hệ hôn nhân được khôi phục nếu vợ/chồng chưa kết hôn với người khác; đã kết hôn thì hôn nhân sau có hiệu lực (Điều 67).","Bị tuyên bố mất tích không làm chấm dứt hôn nhân; là căn cứ để bên kia yêu cầu ly hôn (khoản 2 Điều 56)."]},{"t":"Ly hôn","cs":"Điều 51 – Điều 64, Điều 81 – Điều 84 Luật HNGĐ 2014; Nghị quyết 01/2024/NQ-HĐTP","b":["Ly hôn là việc chấm dứt quan hệ vợ chồng theo bản án, quyết định có hiệu lực pháp luật của Tòa án (khoản 14 Điều 3)."],"c":[{"t":"Quyền yêu cầu ly hôn","cs":"Điều 51 Luật HNGĐ 2014; Điều 2 Nghị quyết 01/2024/NQ-HĐTP","b":["Vợ, chồng hoặc cả hai người có quyền yêu cầu Tòa án giải quyết ly hôn.","Cha, mẹ, người thân thích khác yêu cầu ly hôn khi một bên vợ, chồng bị bệnh tâm thần hoặc bệnh khác mà không nhận thức, làm chủ được hành vi, đồng thời là nạn nhân của bạo lực gia đình do chồng, vợ gây ra.","Chồng không có quyền yêu cầu ly hôn khi vợ đang có thai, sinh con hoặc đang nuôi con dưới 12 tháng tuổi."]},{"t":"Thuận tình ly hôn","cs":"Điều 55 Luật HNGĐ 2014; Điều 3 Nghị quyết 01/2024/NQ-HĐTP","b":["Hai vợ chồng cùng yêu cầu ly hôn, thật sự tự nguyện.","Đã thỏa thuận về việc chia tài sản, việc trông nom, nuôi dưỡng, chăm sóc, giáo dục con trên cơ sở bảo đảm quyền lợi chính đáng của vợ và con: Tòa án công nhận thuận tình ly hôn.","Không thỏa thuận được hoặc thỏa thuận không bảo đảm quyền lợi của vợ, con thì Tòa án giải quyết việc ly hôn."]},{"t":"Ly hôn theo yêu cầu của một bên","cs":"Điều 56 Luật HNGĐ 2014; Điều 4 Nghị quyết 01/2024/NQ-HĐTP","b":["Hòa giải tại Tòa án không thành, có căn cứ về việc vợ, chồng có hành vi bạo lực gia đình hoặc vi phạm nghiêm trọng quyền, nghĩa vụ làm hôn nhân lâm vào tình trạng trầm trọng, đời sống chung không thể kéo dài, mục đích hôn nhân không đạt được (khoản 1).","Vợ hoặc chồng bị Tòa án tuyên bố mất tích (khoản 2).","Trường hợp yêu cầu ly hôn theo khoản 2 Điều 51 (khoản 3)."]},{"t":"Hậu quả ly hôn đối với con","cs":"Điều 81 – Điều 84 Luật HNGĐ 2014; Điều 6 Nghị quyết 01/2024/NQ-HĐTP; Án lệ 54/2022/AL","b":["Cha mẹ vẫn có quyền, nghĩa vụ trông nom, chăm sóc, nuôi dưỡng, giáo dục con (khoản 1 Điều 81).","Vợ chồng thỏa thuận người trực tiếp nuôi con; không thỏa thuận được thì Tòa án quyết định căn cứ quyền lợi về mọi mặt của con; con từ đủ 07 tuổi trở lên thì xem xét nguyện vọng của con (khoản 2 Điều 81).","Con dưới 36 tháng tuổi được giao cho mẹ trực tiếp nuôi, trừ trường hợp người mẹ không đủ điều kiện hoặc cha mẹ có thỏa thuận khác (khoản 3 Điều 81).","Người không trực tiếp nuôi con có nghĩa vụ cấp dưỡng, có quyền thăm nom con (Điều 82, Điều 83); thay đổi người trực tiếp nuôi con (Điều 84)."]},{"t":"Hậu quả ly hôn về tài sản","cs":"Điều 59 – Điều 64 Luật HNGĐ 2014","b":["Do vợ chồng thỏa thuận; không thỏa thuận được thì Tòa án giải quyết (Điều 59).","Tài sản chung được chia đôi nhưng có tính đến: hoàn cảnh của gia đình và của vợ, chồng; công sức đóng góp; bảo vệ lợi ích chính đáng trong sản xuất, kinh doanh, nghề nghiệp; lỗi của mỗi bên trong vi phạm quyền, nghĩa vụ (khoản 2 Điều 59).","Chia bằng hiện vật, không chia được thì theo giá trị; tài sản riêng thuộc về người đó; bảo vệ quyền lợi của vợ, con chưa thành niên, con mất năng lực hành vi (khoản 3 – khoản 5 Điều 59).","Quyền, nghĩa vụ với người thứ ba vẫn có hiệu lực (Điều 60); chia quyền sử dụng đất (Điều 62); quyền lưu cư 06 tháng đối với nhà thuộc sở hữu riêng của bên kia (Điều 63)."]}]}]}]},{"t":"Chương 7. Quan hệ dân sự có yếu tố nước ngoài","cs":"Phần thứ năm BLDS 2015 (Điều 663 – Điều 687); Chương VIII Luật HNGĐ 2014","b":["Chương này chưa có slide; tóm tắt trực tiếp từ BLDS 2015 và Luật HNGĐ 2014."],"c":[{"t":"Khái niệm yếu tố nước ngoài","cs":"Khoản 2 Điều 663 BLDS 2015","b":["Có ít nhất một trong các bên tham gia là cá nhân, pháp nhân nước ngoài.","Các bên đều là công dân, pháp nhân Việt Nam nhưng việc xác lập, thay đổi, thực hiện hoặc chấm dứt quan hệ xảy ra tại nước ngoài.","Các bên đều là công dân, pháp nhân Việt Nam nhưng đối tượng của quan hệ dân sự ở nước ngoài."]},{"t":"Xác định pháp luật áp dụng","cs":"Điều 664 BLDS 2015","b":["Theo điều ước quốc tế mà Việt Nam là thành viên hoặc luật Việt Nam.","Các bên được lựa chọn pháp luật áp dụng khi điều ước quốc tế hoặc luật Việt Nam cho phép.","Không xác định được theo hai cách trên thì áp dụng pháp luật của nước có mối liên hệ gắn bó nhất."]},{"t":"Một số quy tắc xung đột","cs":"Điều 673, Điều 674, Điều 678, Điều 680, Điều 683 BLDS 2015","b":["Năng lực pháp luật, năng lực hành vi của cá nhân: theo pháp luật của nước mà người đó có quốc tịch (Điều 673, Điều 674).","Quyền sở hữu và quyền khác đối với tài sản: theo pháp luật của nước nơi có tài sản (Điều 678).","Thừa kế: theo pháp luật của nước mà người để lại di sản có quốc tịch ngay trước khi chết; thừa kế bất động sản theo pháp luật của nước nơi có bất động sản (Điều 680).","Hợp đồng: các bên được thỏa thuận lựa chọn pháp luật áp dụng; hợp đồng có đối tượng là bất động sản thì áp dụng pháp luật của nước nơi có bất động sản (Điều 683)."]},{"t":"Hôn nhân và gia đình có yếu tố nước ngoài","cs":"Khoản 25 Điều 3, Điều 121 – Điều 130 Luật HNGĐ 2014; Nghị định 120/2025/NĐ-CP","b":["Quan hệ giữa công dân Việt Nam với người nước ngoài; giữa người nước ngoài với nhau thường trú tại Việt Nam; giữa công dân Việt Nam với nhau mà căn cứ xác lập, thay đổi, chấm dứt theo pháp luật nước ngoài, phát sinh tại nước ngoài hoặc tài sản ở nước ngoài.","Kết hôn: mỗi bên tuân theo pháp luật của nước mình về điều kiện kết hôn; kết hôn tại cơ quan có thẩm quyền của Việt Nam thì người nước ngoài phải tuân theo Luật HNGĐ về điều kiện kết hôn (Điều 126).","Ly hôn (Điều 127); đăng ký tại Ủy ban nhân dân cấp xã theo Nghị định 120/2025/NĐ-CP."]}]}],"upd":{"t":"Điểm cần lưu ý so với slide","cs":"Đối chiếu BLDS 2015, Luật HNGĐ 2014","b":["Quyền chiếm hữu: slide trích “Điều 182 – Quyền chiếm hữu là quyền nắm giữ, quản lý tài sản”; Điều 182 BLDS 2015 quy định chiếm hữu liên tục. Khái niệm chiếm hữu ở Điều 179, quyền chiếm hữu của chủ sở hữu ở Điều 186.","Điều kiện người giám hộ là cá nhân: slide ghi Điều 48; đúng là Điều 49 BLDS 2015 (Điều 48 là người giám hộ).","Chuyển giao nghĩa vụ: slide ghi “phải được bên có nghĩa vụ đồng ý, lập thành văn bản”; Điều 370 BLDS 2015 yêu cầu sự đồng ý của bên có quyền.","Tranh chấp hợp đồng: slide ghi “các bên cùng có lỗi thì mỗi bên chịu một nửa”; BLDS không quy định chia đôi – bên bị thiệt hại có lỗi thì không được bồi thường phần thiệt hại do lỗi của mình (khoản 4 Điều 585; Điều 363 đối với vi phạm nghĩa vụ).","Quyền hưởng dụng: slide ghi “của bất động sản khác”; Điều 257 BLDS 2015 áp dụng cho tài sản nói chung thuộc sở hữu của chủ thể khác.","Quyền bề mặt: slide ghi “thông báo bằng văn bản cho bên kia ít nhất 06 tháng”; chưa tìm thấy quy định này tại Điều 267 – Điều 273 BLDS 2015 nên sơ đồ chưa đưa vào.","Danh mục văn bản trong slide còn nhiều văn bản đã hết hiệu lực (Luật Đất đai 2013, Luật Cư trú 2006, Luật Doanh nghiệp 2014, Nghị định 102/2017…); dùng tab “Văn bản & án lệ” để tra văn bản hiện hành.","Giao dịch dân sự có điều kiện (Điều 120) không phải một loại giao dịch; giao dịch dân sự chỉ gồm hợp đồng và hành vi pháp lý đơn phương (Điều 116)."]}}}</script>
