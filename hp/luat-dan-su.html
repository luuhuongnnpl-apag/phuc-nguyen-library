</head><body><script id="PNLIB_COURSE_GATE">
(function(){
  const courseId="luat-dan-su";
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let access=false;
  try{
    const raw=localStorage.getItem("pnlib-ma-lop");
    const session=raw?JSON.parse(raw):null;
    const scopes=session&&Array.isArray(session.courses)?session.courses:null;
    access=!!(session&&session.code&&session.han&&today()<=session.han&&(!scopes||!scopes.length||scopes.includes("*")||scopes.includes(courseId)));
  }catch(e){access=false}
  if(!access){
    document.documentElement.style.visibility="hidden";
    if(window.top!==window.self){
      window.parent.postMessage({pn:"home",course:courseId},"*");
    }else{
      window.location.replace("../index.html#"+courseId);
    }
  }
})();
</script>

<script id="pn-data" type="application/json">{"meta":{"id":"luat-dan-su","name":"Luật Dân sự","title":"Tài liệu Luật Dân sự","menuTitle":"Luật Dân sự","asof":"29/10/2026","laws":[{"re":"BLDS|Bộ luật Dân sự","base":"https://hethongphapluat.com/bo-luat-dan-su-2015"},{"re":"HNGĐ|Hôn nhân và gia đình","base":"https://hethongphapluat.com/luat-hon-nhan-va-gia-dinh-2014"},{"re":"Luật Đất đai","doc":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-523642.aspx"},{"re":"Hiến pháp","doc":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"}]},"chapters":[{"n":1,"name":"Khái quát chung về Luật Dân sự","ch":"Chương 1"},{"n":2,"name":"Chủ thể của quan hệ pháp luật dân sự","ch":"Chương 2"},{"n":3,"name":"Giao dịch dân sự, đại diện, thời hạn và thời hiệu","ch":"Chương 3"},{"n":4,"name":"Tài sản và quyền đối với tài sản","ch":"Chương 4"},{"n":5,"name":"Thừa kế","ch":"Chương 4"},{"n":6,"name":"Nghĩa vụ và bảo đảm thực hiện nghĩa vụ","ch":"Chương 5"},{"n":7,"name":"Hợp đồng","ch":"Chương 5"},{"n":8,"name":"Bồi thường thiệt hại ngoài hợp đồng","ch":"Chương 5"},{"n":9,"name":"Hôn nhân và gia đình","ch":"Chương 6"}],"q":[{"q":"Theo Điều 1 BLDS 2015, phạm vi điều chỉnh của luật dân sự gồm:","o":["Chỉ các quan hệ nhân thân không gắn với tài sản","Quan hệ nhân thân và quan hệ tài sản hình thành trên cơ sở bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm","Chỉ các quan hệ tài sản giữa cá nhân, pháp nhân","Mọi quan hệ tài sản, kể cả quan hệ thuế và xử phạt hành chính"],"a":1,"e":"Luật dân sự điều chỉnh cả quan hệ nhân thân lẫn quan hệ tài sản, với điều kiện quan hệ đó hình thành trên cơ sở bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm. Phương án chỉ nêu quan hệ tài sản hoặc chỉ nêu quan hệ nhân thân là thiếu; quan hệ thuế, xử phạt là quan hệ quyền lực – phục tùng, thuộc luật hành chính.","b":"Điều 1 BLDS 2015","lv":"NB","id":"1.1","g":1},{"q":"Đặc điểm của quyền nhân thân theo BLDS 2015 là:","o":["Có thể chuyển nhượng cho người khác nếu có thỏa thuận","Gắn liền với mỗi cá nhân, không thể chuyển giao cho người khác, trừ trường hợp luật khác có liên quan quy định khác","Chỉ phát sinh khi cá nhân đủ 18 tuổi","Luôn được định giá bằng tiền như quyền tài sản"],"a":1,"e":"Quyền nhân thân gắn liền với mỗi cá nhân nên về nguyên tắc không chuyển giao được; ngoại lệ chỉ do luật quy định chứ không do các bên thỏa thuận. Quyền nhân thân có từ khi sinh ra, không phụ thuộc tuổi, và không mang giá trị tiền tệ như quyền tài sản.","b":"Khoản 1 Điều 25 BLDS 2015","lv":"NB","id":"1.2","g":1},{"q":"Dấu hiệu nào giúp xác định một quan hệ xã hội thuộc phạm vi điều chỉnh của BLDS 2015?","o":["Các bên bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm","Có sự tham gia của cơ quan nhà nước với tư cách quản lý","Quan hệ có giá trị tài sản từ 10 triệu đồng trở lên","Quan hệ đã được ghi nhận bằng văn bản có công chứng"],"a":0,"e":"Điều 1 dùng bốn dấu hiệu bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm để nhận diện quan hệ dân sự; đây cũng là phương pháp điều chỉnh đặc thù của luật dân sự. Sự tham gia của cơ quan nhà nước với tư cách quản lý là dấu hiệu quan hệ hành chính; giá trị tài sản và hình thức công chứng không quyết định quan hệ có phải là quan hệ dân sự hay không.","b":"Điều 1 BLDS 2015","lv":"TH","id":"1.3","g":1},{"q":"Luật khác có liên quan quy định về quan hệ dân sự trong lĩnh vực cụ thể được áp dụng thay cho BLDS 2015 khi:","o":["Trong mọi trường hợp, luật chuyên ngành luôn được ưu tiên","Các bên trong quan hệ đồng ý áp dụng","Luật khác không trái với các nguyên tắc cơ bản của pháp luật dân sự tại Điều 3 BLDS","Luật khác được ban hành sau BLDS"],"a":2,"e":"Luật khác chỉ được ưu tiên áp dụng khi không trái nguyên tắc cơ bản tại Điều 3; nếu luật khác không quy định hoặc quy định trái nguyên tắc cơ bản thì áp dụng BLDS. Vì vậy không thể nói luật chuyên ngành luôn được ưu tiên; thời điểm ban hành hay sự đồng ý của các bên không phải điều kiện theo Điều 4.","b":"Khoản 2, 3 Điều 4 BLDS 2015","lv":"TH","id":"1.4","g":1},{"q":"Tập quán được áp dụng để xác định quyền, nghĩa vụ dân sự khi:","o":["Tòa án thấy tập quán hợp lý hơn quy định của luật","Tập quán được đa số người dân địa phương thừa nhận, dù trái với thỏa thuận của các bên","Các bên không có thỏa thuận, pháp luật không quy định và tập quán không trái các nguyên tắc cơ bản của pháp luật dân sự","Một bên yêu cầu áp dụng tập quán"],"a":2,"e":"Khoản 2 Điều 5 đặt ba điều kiện cùng lúc: không có thỏa thuận, pháp luật không quy định, và tập quán không trái Điều 3. Tập quán không được đặt cao hơn thỏa thuận hay quy định của luật, cũng không phụ thuộc vào yêu cầu của một bên.","b":"Khoản 2 Điều 5 BLDS 2015","lv":"NB","id":"1.5","g":1},{"q":"Theo khoản 2 Điều 6 BLDS 2015, khi không thể áp dụng tương tự pháp luật thì áp dụng:","o":["Ý kiến của cơ quan quản lý nhà nước cấp tỉnh","Các nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng","Điều ước quốc tế bất kỳ","Quy định của Bộ luật Dân sự năm 2005"],"a":1,"e":"BLDS 2015 lần đầu ghi nhận án lệ, lẽ công bằng cùng các nguyên tắc cơ bản là căn cứ cuối cùng khi không có tập quán và không thể áp dụng tương tự pháp luật. Ý kiến cơ quan hành chính hay văn bản đã hết hiệu lực không phải nguồn được luật dẫn chiếu.","b":"Khoản 2 Điều 6 BLDS 2015","lv":"TH","id":"1.6","g":1},{"q":"Một vụ việc dân sự chưa có điều luật trực tiếp điều chỉnh, các bên không có thỏa thuận. Tòa án phải:","o":["Thụ lý, giải quyết theo thứ tự: tập quán, tương tự pháp luật, rồi nguyên tắc cơ bản, án lệ, lẽ công bằng","Chuyển vụ việc cho UBND cấp tỉnh giải quyết","Trả lại đơn khởi kiện vì chưa có điều luật để áp dụng","Đình chỉ giải quyết và kiến nghị Quốc hội ban hành luật"],"a":0,"e":"Tòa án không được từ chối giải quyết vụ, việc dân sự vì lý do chưa có điều luật để áp dụng. Khi đó Tòa án lần lượt áp dụng tập quán (Điều 5), tương tự pháp luật (khoản 1 Điều 6), rồi nguyên tắc cơ bản, án lệ, lẽ công bằng (khoản 2 Điều 6).","b":"Khoản 2 Điều 14; Điều 5, Điều 6 BLDS 2015","lv":"VD","id":"1.7","g":1},{"q":"A thực hiện quyền dân sự của mình nhằm gây thiệt hại cho người khác (lạm dụng quyền). Hậu quả pháp lý theo Điều 10 BLDS 2015:","o":["A đương nhiên bị tước toàn bộ quyền dân sự","A chỉ bị nhắc nhở, không phải bồi thường","Tòa án hoặc cơ quan có thẩm quyền căn cứ tính chất, hậu quả để có thể không bảo vệ một phần hoặc toàn bộ quyền của A; A phải bồi thường nếu gây thiệt hại","A không chịu hậu quả gì vì đang thực hiện quyền của mình"],"a":2,"e":"Lạm dụng quyền dân sự gây thiệt hại thì phải bồi thường, và Tòa án có thể không bảo vệ một phần hoặc toàn bộ quyền của người đó. Không có chế tài tước toàn bộ quyền dân sự; việc đang thực hiện quyền cũng không loại trừ trách nhiệm khi quyền bị lạm dụng.","b":"Điều 10 BLDS 2015","lv":"VD","id":"1.8","g":1},{"q":"Quan hệ pháp luật dân sự nào sau đây là quan hệ tuyệt đối?","o":["Quan hệ bồi thường thiệt hại giữa người gây thiệt hại và người bị thiệt hại","Quan hệ hợp đồng mua bán giữa A và B","Quan hệ vay tiền giữa ngân hàng và khách hàng","Quan hệ sở hữu: chủ sở hữu được xác định, mọi chủ thể khác có nghĩa vụ tôn trọng"],"a":3,"e":"Trong quan hệ tuyệt đối chỉ chủ thể quyền được xác định, còn mọi người khác là chủ thể mang nghĩa vụ không xâm phạm; quan hệ sở hữu là ví dụ điển hình. Hợp đồng, vay, bồi thường thiệt hại đều là quan hệ tương đối vì cả bên có quyền và bên có nghĩa vụ đều đã xác định.","b":"Giáo trình Luật Dân sự Việt Nam, tập I (ĐH Luật Hà Nội); Điều 160 BLDS 2015","lv":"TH","id":"1.9","g":1},{"q":"Trường hợp điều ước quốc tế mà Việt Nam là thành viên có quy định khác BLDS về cùng một vấn đề thì:","o":["Tòa án xin ý kiến Bộ Ngoại giao rồi mới áp dụng","Luôn áp dụng BLDS vì là luật trong nước","Các bên tự chọn quy định có lợi hơn","Áp dụng quy định của điều ước quốc tế"],"a":3,"e":"Khoản 4 Điều 4 ghi nhận nguyên tắc ưu tiên áp dụng điều ước quốc tế mà Việt Nam là thành viên khi có quy định khác BLDS về cùng một vấn đề.","b":"Khoản 4 Điều 4 BLDS 2015","lv":"NB","id":"1.10","g":1},{"q":"Đối tượng điều chỉnh của luật dân sự là:","o":["Mọi quan hệ xã hội có liên quan đến tài sản","Quan hệ giữa Nhà nước và công dân về tài sản","Quan hệ nhân thân và quan hệ tài sản hình thành trên cơ sở bình đẳng, tự do ý chí, độc lập về tài sản và tự chịu trách nhiệm","Chỉ các quan hệ tài sản"],"a":2,"e":"BLDS điều chỉnh cả quan hệ nhân thân và quan hệ tài sản mang các dấu hiệu bình đẳng, tự do ý chí, độc lập tài sản, tự chịu trách nhiệm. Quan hệ tài sản mang tính quyền lực – phục tùng (thuế, xử phạt) không thuộc luật dân sự.","b":"Điều 1 BLDS 2015","lv":"NB","id":"1.11","g":1},{"q":"Phương pháp điều chỉnh đặc trưng của luật dân sự là:","o":["Mệnh lệnh – phục tùng","Cưỡng chế nhà nước là chủ yếu","Quyền uy hành chính","Bình đẳng, thỏa thuận và tự định đoạt của các chủ thể"],"a":3,"e":"Các chủ thể bình đẳng về địa vị pháp lý, tự do thỏa thuận và tự định đoạt; trách nhiệm dân sự trước hết là trách nhiệm tài sản.","b":"Điều 1, Điều 3 BLDS 2015","lv":"NB","id":"1.12","g":1},{"q":"Khi giải quyết một quan hệ dân sự mà các bên không có thỏa thuận và pháp luật không quy định, thứ tự áp dụng đúng là:","o":["Tập quán → tương tự pháp luật → nguyên tắc cơ bản, án lệ, lẽ công bằng","Tương tự pháp luật → tập quán → án lệ","Án lệ → tập quán → lẽ công bằng","Lẽ công bằng → tập quán → tương tự pháp luật"],"a":0,"e":"Điều 5 cho phép áp dụng tập quán trước; nếu không có tập quán thì áp dụng tương tự pháp luật (khoản 1 Điều 6); nếu không thể áp dụng tương tự pháp luật thì áp dụng nguyên tắc cơ bản, án lệ, lẽ công bằng (khoản 2 Điều 6).","b":"Điều 5, Điều 6 BLDS 2015","lv":"TH","id":"1.13","g":1},{"q":"Nội dung nào KHÔNG phải là nguyên tắc cơ bản của pháp luật dân sự theo Điều 3 BLDS 2015?","o":["Ưu tiên bảo vệ tài sản thuộc sở hữu toàn dân trong mọi tranh chấp","Tự chịu trách nhiệm dân sự","Bình đẳng","Thiện chí, trung thực"],"a":0,"e":"Điều 3 gồm 5 nguyên tắc: bình đẳng; tự do, tự nguyện cam kết, thỏa thuận; thiện chí, trung thực; không xâm phạm lợi ích quốc gia, công cộng, quyền lợi hợp pháp của người khác; tự chịu trách nhiệm. Không có nguyên tắc “ưu tiên” bảo vệ một hình thức sở hữu.","b":"Điều 3 BLDS 2015","lv":"TH","id":"1.14","g":1},{"q":"Theo BLDS 2015, “điều cấm của luật” là:","o":["Chuẩn mực ứng xử chung được cộng đồng thừa nhận","Tập quán của địa phương nơi giao dịch được xác lập","Mọi quy định trong văn bản quy phạm pháp luật","Những quy định của luật không cho phép chủ thể thực hiện những hành vi nhất định"],"a":3,"e":"Điều 123 định nghĩa điều cấm của luật là quy định của luật không cho phép chủ thể thực hiện hành vi nhất định; còn “chuẩn mực ứng xử chung được cộng đồng thừa nhận” là định nghĩa đạo đức xã hội.","b":"Điều 123 BLDS 2015","lv":"TH","id":"1.15","g":1},{"q":"Quan hệ nào sau đây thuộc đối tượng điều chỉnh của luật dân sự?","o":["UBND xã xử phạt vi phạm hành chính đối với ông C","Anh A cho anh B vay 50 triệu đồng có lãi","Cơ quan thuế ra quyết định truy thu thuế đối với doanh nghiệp X","Tòa án tuyên phạt tù bị cáo D"],"a":1,"e":"Quan hệ vay tài sản giữa A và B là quan hệ tài sản hình thành trên cơ sở bình đẳng, tự nguyện thỏa thuận. Các phương án còn lại là quan hệ quyền lực – phục tùng (hành chính, hình sự).","b":"Điều 1 BLDS 2015","lv":"VD","id":"1.16","g":1},{"q":"A và B ký hợp đồng có một điều khoản không rõ nghĩa, pháp luật không quy định. Tại địa phương có một tập quán rõ ràng, được áp dụng lâu dài và không trái Điều 3 BLDS. Tòa án nên:","o":["Trả lại đơn vì không có điều luật để áp dụng","Áp dụng tập quán đó","Áp dụng ngay tương tự pháp luật","Áp dụng lẽ công bằng"],"a":1,"e":"Khi các bên không có thỏa thuận và pháp luật không quy định thì có thể áp dụng tập quán không trái nguyên tắc cơ bản; việc giải thích hợp đồng cũng có thể căn cứ vào tập quán nơi giao kết.","b":"Khoản 2 Điều 5, Điều 404 BLDS 2015","lv":"VD","id":"1.17","g":1},{"q":"Theo BLDS 2015, quyền dân sự chỉ có thể bị hạn chế:","o":["Theo quyết định của Chủ tịch UBND cấp tỉnh","Theo tập quán địa phương","Theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe cộng đồng","Theo yêu cầu của bên có quyền lợi đối lập"],"a":2,"e":"Hạn chế quyền dân sự phải do luật quy định và chỉ vì các lý do được liệt kê; đây là sự cụ thể hóa khoản 2 Điều 14 Hiến pháp 2013.","b":"Khoản 2 Điều 2 BLDS 2015","lv":"VD","id":"1.18","g":1},{"q":"Sự kiện nào sau đây là sự biến pháp lý làm phát sinh quan hệ pháp luật dân sự?","o":["Hai bên ký hợp đồng mua bán","Người có tài sản chết, làm phát sinh quan hệ thừa kế","Ông A lập di chúc","Công ty X công khai hứa thưởng"],"a":1,"e":"Sự biến là sự kiện xảy ra không phụ thuộc ý chí của chủ thể; cái chết của người có tài sản làm mở thừa kế. Ký hợp đồng, lập di chúc, hứa thưởng là hành vi pháp lý (hợp đồng, hành vi pháp lý đơn phương).","b":"Giáo trình Luật Dân sự Việt Nam, tập I (ĐH Luật Hà Nội); khoản 1 Điều 611 BLDS 2015","lv":"VD","id":"1.19","g":1},{"q":"Cá nhân có quyền dân sự bị xâm phạm được bồi thường như thế nào?","o":["Chỉ thiệt hại vật chất, không bao gồm tổn thất tinh thần","Một nửa thiệt hại","Toàn bộ thiệt hại, trừ trường hợp các bên có thỏa thuận khác hoặc luật có quy định khác","Theo mức do bên gây thiệt hại tự đề xuất"],"a":2,"e":"Nguyên tắc bồi thường toàn bộ thiệt hại là nguyên tắc chung của việc bảo vệ quyền dân sự.","b":"Điều 13 BLDS 2015","lv":"VD","id":"1.20","g":1},{"q":"Năng lực pháp luật dân sự của cá nhân:","o":["Có từ khi người đó được đăng ký khai sinh","Có từ khi người đó đủ 18 tuổi","Có từ khi người đó sinh ra và chấm dứt khi người đó chết","Có từ khi người đó đủ 6 tuổi"],"a":2,"e":"Mọi cá nhân có năng lực pháp luật dân sự như nhau, xuất hiện khi sinh ra và chấm dứt khi chết. Mốc 6 tuổi, 18 tuổi gắn với năng lực hành vi; việc đăng ký khai sinh không làm phát sinh năng lực pháp luật.","b":"Khoản 2, 3 Điều 16 BLDS 2015","lv":"NB","id":"2.1","g":2},{"q":"Người từ đủ 15 tuổi đến chưa đủ 18 tuổi tự mình xác lập giao dịch dân sự nào sau đây mà KHÔNG cần người đại diện theo pháp luật đồng ý?","o":["Thế chấp quyền sử dụng đất đứng tên mình","Mua sách, đồ dùng học tập bằng tiền tiết kiệm","Bán căn nhà đứng tên mình","Mua một chiếc xe máy (động sản phải đăng ký)"],"a":1,"e":"Người từ đủ 15 đến chưa đủ 18 tuổi tự mình xác lập, thực hiện giao dịch, trừ giao dịch liên quan đến bất động sản, động sản phải đăng ký và giao dịch khác theo luật phải được người đại diện đồng ý. Bán nhà, thế chấp đất (bất động sản) và mua xe máy (động sản phải đăng ký) đều cần sự đồng ý đó.","b":"Khoản 4 Điều 21 BLDS 2015","lv":"TH","id":"2.2","g":2},{"q":"Người nghiện ma túy, nghiện chất kích thích khác dẫn đến phá tán tài sản của gia đình có thể bị Tòa án tuyên bố:","o":["Mất năng lực hành vi dân sự","Mất tích","Có khó khăn trong nhận thức, làm chủ hành vi","Hạn chế năng lực hành vi dân sự"],"a":3,"e":"Khoản 1 Điều 24 quy định người nghiện ma túy, chất kích thích khác dẫn đến phá tán tài sản gia đình có thể bị tuyên bố hạn chế năng lực hành vi dân sự; Tòa án quyết định người đại diện và phạm vi đại diện. Mất năng lực hành vi (Điều 22) và khó khăn trong nhận thức (Điều 23) có căn cứ là tình trạng tâm thần, thể chất, không phải hành vi nghiện.","b":"Khoản 1 Điều 24 BLDS 2015","lv":"TH","id":"2.3","g":2},{"q":"Về địa vị pháp lý của chi nhánh, văn phòng đại diện của pháp nhân, phát biểu đúng là:","o":["Chi nhánh chỉ được thực hiện chức năng đại diện, không được kinh doanh","Chi nhánh là đơn vị phụ thuộc, không phải là pháp nhân; pháp nhân có quyền, nghĩa vụ dân sự phát sinh từ giao dịch do chi nhánh xác lập","Chi nhánh là pháp nhân độc lập, tự chịu trách nhiệm bằng tài sản riêng","Chi nhánh chịu trách nhiệm thay pháp nhân với mọi khoản nợ"],"a":1,"e":"Theo Điều 84, chi nhánh, văn phòng đại diện là đơn vị phụ thuộc, không phải pháp nhân; quyền, nghĩa vụ phát sinh từ giao dịch do chi nhánh xác lập thuộc về pháp nhân. Chi nhánh có thể thực hiện toàn bộ hoặc một phần chức năng của pháp nhân, còn chức năng chỉ đại diện là của văn phòng đại diện.","b":"Khoản 1, khoản 6 Điều 84 BLDS 2015","lv":"TH","id":"2.4","g":2},{"q":"Theo khoản 2 Điều 47 BLDS 2015, một người chỉ có thể được một người giám hộ, TRỪ trường hợp:","o":["Cha, mẹ cùng giám hộ cho con hoặc ông, bà cùng giám hộ cho cháu","UBND cấp xã cử thêm người giám hộ","Người được giám hộ có nhiều tài sản","Người được giám hộ từ đủ 15 tuổi tự chọn thêm người giám hộ"],"a":0,"e":"Nguyên tắc một người được giám hộ – một người giám hộ chỉ có hai ngoại lệ luật định: cha, mẹ cùng giám hộ cho con; ông, bà cùng giám hộ cho cháu. Giá trị tài sản hay quyết định cử thêm của UBND không phải ngoại lệ.","b":"Khoản 2 Điều 47 BLDS 2015","lv":"NB","id":"2.5","g":2},{"q":"Anh A biệt tích 6 tháng liền, không có tin tức. Vợ anh A có quyền yêu cầu Tòa án:","o":["Tuyên bố anh A đã chết","Thông báo tìm kiếm anh A vắng mặt tại nơi cư trú và áp dụng biện pháp quản lý tài sản","Giải quyết ly hôn ngay vì anh A biệt tích","Tuyên bố anh A mất tích"],"a":1,"e":"Biệt tích 6 tháng liền trở lên đủ căn cứ yêu cầu Tòa án thông báo tìm kiếm người vắng mặt tại nơi cư trú (Điều 64). Tuyên bố mất tích cần biệt tích 02 năm liền dù đã thông báo, tìm kiếm (Điều 68); tuyên bố chết cần các mốc thời gian dài hơn (Điều 71). Ly hôn với người mất tích chỉ đặt ra sau khi đã có quyết định tuyên bố mất tích.","b":"Điều 64, khoản 1 Điều 68 BLDS 2015","lv":"VD","id":"2.6","g":2},{"q":"Ông B bị tuyên bố đã chết; vợ ông đã kết hôn với người khác. Sau đó quyết định tuyên bố ông B đã chết bị hủy. Quan hệ hôn nhân:","o":["Cả hai quan hệ hôn nhân đều vô hiệu","Hôn nhân sau của người vợ vẫn có hiệu lực; quan hệ hôn nhân với ông B không được khôi phục","Người vợ phải lựa chọn một trong hai người chồng","Giữa ông B và vợ cũ đương nhiên được khôi phục, hôn nhân sau chấm dứt"],"a":1,"e":"Khi quyết định tuyên bố chết bị hủy, quan hệ nhân thân được khôi phục, trừ trường hợp vợ hoặc chồng đã được ly hôn hoặc đã kết hôn với người khác; khi đó việc kết hôn sau vẫn có hiệu lực pháp luật.","b":"Điểm b khoản 2 Điều 73 BLDS 2015; Điều 67 Luật HNGĐ 2014","lv":"VD","id":"2.7","g":2},{"q":"Người giám hộ muốn đem tài sản của người được giám hộ tặng cho người khác. Việc tặng cho này:","o":["Hợp pháp nếu có sự đồng ý của người giám sát việc giám hộ","Hợp pháp nếu được UBND cấp xã chấp thuận","Không được thực hiện trong mọi trường hợp","Hợp pháp nếu giá trị tài sản dưới 10 triệu đồng"],"a":2,"e":"Khoản 1 Điều 59 cấm người giám hộ đem tài sản của người được giám hộ tặng cho người khác. Sự đồng ý của người giám sát chỉ là điều kiện đối với giao dịch bán, trao đổi, cho thuê, cho mượn, cho vay, cầm cố, thế chấp, đặt cọc tài sản có giá trị lớn, không làm hợp pháp việc tặng cho.","b":"Khoản 1 Điều 59 BLDS 2015","lv":"VD","id":"2.8","g":2},{"q":"Việc thay đổi tên cho người từ đủ 9 tuổi trở lên:","o":["Chỉ cần ý kiến của cơ quan đăng ký hộ tịch","Chỉ cần quyết định của cha, mẹ","Phải có sự đồng ý của người đó","Không được thực hiện cho đến khi người đó đủ 18 tuổi"],"a":2,"e":"Khoản 2 Điều 28 BLDS 2015 yêu cầu việc thay đổi tên cho người từ đủ 9 tuổi trở lên phải có sự đồng ý của người đó; quy định tương tự áp dụng với thay đổi họ (khoản 2 Điều 27).","b":"Khoản 2 Điều 28, khoản 2 Điều 27 BLDS 2015","lv":"TH","id":"2.9","g":2},{"q":"Giám đốc công ty X ký hợp đồng vay tiền nhân danh cá nhân mình, không nhân danh công ty. Trách nhiệm trả nợ thuộc về:","o":["Giám đốc và công ty X liên đới","Giám đốc với tư cách cá nhân; công ty X không chịu trách nhiệm thay, trừ trường hợp luật có quy định khác","Công ty X, vì người ký là người đại diện theo pháp luật","Các thành viên công ty X theo tỷ lệ vốn góp"],"a":1,"e":"Khoản 2 Điều 87: pháp nhân không chịu trách nhiệm thay cho người của pháp nhân đối với nghĩa vụ do người đó xác lập, thực hiện không nhân danh pháp nhân, trừ trường hợp luật có quy định khác. Tư cách đại diện theo pháp luật chỉ ràng buộc pháp nhân khi người đó nhân danh pháp nhân.","b":"Khoản 2 Điều 87 BLDS 2015","lv":"VD","id":"2.10","g":2},{"q":"Giao dịch dân sự của người chưa đủ 6 tuổi do ai xác lập, thực hiện?","o":["UBND cấp xã nơi người đó cư trú","Người đó tự mình xác lập","Người đại diện theo pháp luật của người đó","Bất kỳ người thân thích nào"],"a":2,"e":"Người chưa đủ 6 tuổi chưa có năng lực hành vi dân sự; giao dịch do người đại diện theo pháp luật xác lập, thực hiện.","b":"Khoản 2 Điều 21 BLDS 2015","lv":"NB","id":"2.11","g":2},{"q":"Điều kiện nào KHÔNG thuộc các điều kiện để một tổ chức được công nhận là pháp nhân?","o":["Có ít nhất 50 thành viên","Có cơ cấu tổ chức theo Điều 83 BLDS","Được thành lập theo quy định của BLDS, luật khác có liên quan","Có tài sản độc lập và tự chịu trách nhiệm bằng tài sản của mình"],"a":0,"e":"Điều 74 nêu 4 điều kiện: thành lập hợp pháp; có cơ cấu tổ chức; tài sản độc lập và tự chịu trách nhiệm bằng tài sản; nhân danh mình tham gia quan hệ pháp luật độc lập. Không có điều kiện về số lượng thành viên.","b":"Khoản 1 Điều 74 BLDS 2015","lv":"TH","id":"2.12","g":2},{"q":"Pháp nhân thương mại là pháp nhân:","o":["Có mục tiêu chính là tìm kiếm lợi nhuận và lợi nhuận được chia cho các thành viên","Không có tài sản riêng","Có lợi nhuận nhưng không được chia cho thành viên","Do Nhà nước thành lập"],"a":0,"e":"Pháp nhân có lợi nhuận nhưng không được chia cho thành viên là pháp nhân phi thương mại (Điều 76).","b":"Khoản 1 Điều 75 BLDS 2015","lv":"TH","id":"2.13","g":2},{"q":"Người giám hộ đương nhiên của người chưa thành niên không còn cha, mẹ được xác định đầu tiên là:","o":["Người do UBND cấp xã cử","Bác, chú, cậu, cô, dì ruột","Anh ruột là anh cả hoặc chị ruột là chị cả","Ông nội, bà nội, ông ngoại, bà ngoại"],"a":2,"e":"Thứ tự: anh cả/chị cả (hoặc anh, chị tiếp theo) → ông bà nội, ngoại → bác, chú, cậu, cô, dì ruột. Chỉ khi không có giám hộ đương nhiên mới cử, chỉ định người giám hộ.","b":"Điều 52, Điều 54 BLDS 2015","lv":"TH","id":"2.14","g":2},{"q":"Điều kiện nào KHÔNG phải điều kiện để cá nhân làm người giám hộ?","o":["Không bị Tòa án tuyên bố hạn chế quyền đối với con chưa thành niên","Có trình độ đại học trở lên","Có tư cách đạo đức tốt và điều kiện cần thiết","Có năng lực hành vi dân sự đầy đủ"],"a":1,"e":"Điều 49 không đặt điều kiện về trình độ học vấn.","b":"Điều 49 BLDS 2015","lv":"TH","id":"2.15","g":2},{"q":"H, 16 tuổi, dùng tiền tiết kiệm mua một chiếc xe máy mà không hỏi ý kiến cha mẹ. Giao dịch này:","o":["Có hiệu lực vì H đã đủ 15 tuổi","Cần sự đồng ý của người đại diện theo pháp luật; nếu không có, cha mẹ H có quyền yêu cầu Tòa án tuyên bố giao dịch vô hiệu","Đương nhiên vô hiệu tuyệt đối","Chỉ vô hiệu nếu bên bán yêu cầu"],"a":1,"e":"Xe máy là động sản phải đăng ký nên giao dịch cần người đại diện theo pháp luật đồng ý. Đây là trường hợp vô hiệu tương đối: theo yêu cầu của người đại diện, Tòa án tuyên bố vô hiệu; thời hiệu 02 năm.","b":"Khoản 4 Điều 21, khoản 1 Điều 125, Điều 132 BLDS 2015","lv":"VD","id":"2.16","g":2},{"q":"Quyết định tuyên bố ông M mất tích đã có hiệu lực pháp luật. Người có quyền, lợi ích liên quan có thể yêu cầu Tòa án tuyên bố ông M đã chết khi:","o":["Sau 03 năm kể từ ngày quyết định tuyên bố mất tích có hiệu lực mà vẫn không có tin tức xác thực là còn sống","Sau 02 năm kể từ ngày quyết định tuyên bố mất tích có hiệu lực","Ngay sau khi có quyết định tuyên bố mất tích","Sau 06 tháng kể từ ngày có quyết định tuyên bố mất tích"],"a":0,"e":"Đây là căn cứ tại điểm a khoản 1 Điều 71; Tòa án sẽ xác định ngày chết của người bị tuyên bố chết.","b":"Điểm a khoản 1, khoản 2 Điều 71 BLDS 2015","lv":"VD","id":"2.17","g":2},{"q":"Anh K (35 tuổi) bị Tòa án tuyên bố mất năng lực hành vi dân sự; anh có vợ đủ điều kiện làm người giám hộ và chưa lựa chọn người giám hộ từ trước. Người giám hộ đương nhiên của anh K là:","o":["Con cả của anh K","Người do UBND cấp xã cử","Vợ anh K","Cha, mẹ anh K"],"a":2,"e":"Vợ là người mất năng lực hành vi dân sự thì chồng là người giám hộ và ngược lại.","b":"Khoản 1 Điều 53, khoản 2 Điều 48 BLDS 2015","lv":"VD","id":"2.18","g":2},{"q":"Hộ gia đình X (không có tư cách pháp nhân) tham gia giao dịch dân sự. Chủ thể của giao dịch là:","o":["UBND cấp xã nơi hộ cư trú","Chủ hộ trên sổ hộ khẩu một cách đương nhiên","Hộ gia đình X với tư cách một pháp nhân","Các thành viên hộ gia đình hoặc người được các thành viên ủy quyền làm đại diện"],"a":3,"e":"BLDS 2015 không coi hộ gia đình là chủ thể độc lập; các thành viên là chủ thể hoặc ủy quyền bằng văn bản cho người đại diện.","b":"Khoản 1 Điều 101 BLDS 2015","lv":"VD","id":"2.19","g":2},{"q":"Giao dịch giữa người giám hộ với người được giám hộ liên quan đến tài sản của người được giám hộ:","o":["Chỉ cần UBND cấp xã đồng ý","Luôn có hiệu lực","Vô hiệu, trừ trường hợp được thực hiện vì lợi ích của người được giám hộ và có sự đồng ý của người giám sát việc giám hộ","Có hiệu lực nếu được công chứng"],"a":2,"e":"Quy định nhằm ngăn xung đột lợi ích giữa người giám hộ và người được giám hộ.","b":"Khoản 1 Điều 59 BLDS 2015","lv":"VD","id":"2.20","g":2},{"q":"Giao dịch dân sự là:","o":["Hợp đồng hoặc hành vi pháp lý đơn phương làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự","Quyết định của cơ quan nhà nước về tài sản","Mọi hành vi của cá nhân trong đời sống","Chỉ bao gồm hợp đồng"],"a":0,"e":"Điều 116 định nghĩa giao dịch dân sự gồm hợp đồng và hành vi pháp lý đơn phương (di chúc, hứa thưởng, từ chối nhận di sản...). Quyết định của cơ quan nhà nước là hành vi hành chính, không phải giao dịch dân sự.","b":"Điều 116 BLDS 2015","lv":"NB","id":"3.1","g":3},{"q":"Hình thức của giao dịch dân sự là điều kiện có hiệu lực của giao dịch:","o":["Chỉ đối với giao dịch có giá trị trên 100 triệu đồng","Trong mọi trường hợp","Chỉ khi các bên yêu cầu công chứng","Trong trường hợp luật có quy định"],"a":3,"e":"Khoản 2 Điều 117: hình thức chỉ là điều kiện có hiệu lực của giao dịch trong trường hợp luật có quy định (ví dụ hợp đồng chuyển nhượng quyền sử dụng đất phải công chứng, chứng thực). BLDS không đặt ngưỡng giá trị cho yêu cầu hình thức.","b":"Khoản 2 Điều 117 BLDS 2015","lv":"TH","id":"3.2","g":3},{"q":"A và B lập hợp đồng tặng cho nhà để che giấu hợp đồng mua bán nhà. Hậu quả pháp lý:","o":["Hợp đồng tặng cho giả tạo vô hiệu; hợp đồng mua bán bị che giấu vẫn có hiệu lực, trừ trường hợp giao dịch đó cũng vô hiệu theo quy định","Hợp đồng tặng cho có hiệu lực, hợp đồng mua bán vô hiệu","Cả hai giao dịch đều vô hiệu","Cả hai giao dịch đều có hiệu lực"],"a":0,"e":"Khoản 1 Điều 124: giao dịch giả tạo nhằm che giấu giao dịch khác thì giao dịch giả tạo vô hiệu, còn giao dịch bị che giấu vẫn có hiệu lực, trừ trường hợp giao dịch đó cũng vô hiệu theo BLDS hoặc luật khác có liên quan.","b":"Khoản 1 Điều 124 BLDS 2015","lv":"TH","id":"3.3","g":3},{"q":"Thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu do vi phạm điều cấm của luật, trái đạo đức xã hội là:","o":["Không bị hạn chế","02 năm","03 năm","01 năm"],"a":0,"e":"Khoản 3 Điều 132: đối với giao dịch vô hiệu theo Điều 123 (vi phạm điều cấm, trái đạo đức xã hội) và Điều 124 (giả tạo), thời hiệu yêu cầu tuyên bố vô hiệu không bị hạn chế. Thời hiệu 02 năm áp dụng cho các trường hợp tại Điều 125–129.","b":"Khoản 3 Điều 132 BLDS 2015","lv":"NB","id":"3.4","g":3},{"q":"Người từ đủ 15 tuổi đến chưa đủ 18 tuổi có thể là người đại diện theo ủy quyền:","o":["Chỉ khi được UBND cấp xã cho phép","Được, trừ trường hợp pháp luật quy định giao dịch phải do người từ đủ 18 tuổi trở lên xác lập, thực hiện","Trong mọi giao dịch","Không được làm đại diện theo ủy quyền trong bất kỳ trường hợp nào"],"a":1,"e":"Khoản 3 Điều 138 cho phép người từ đủ 15 đến chưa đủ 18 tuổi làm đại diện theo ủy quyền, trừ trường hợp pháp luật quy định giao dịch dân sự phải do người từ đủ 18 tuổi trở lên xác lập, thực hiện.","b":"Khoản 3 Điều 138 BLDS 2015","lv":"TH","id":"3.5","g":3},{"q":"A ủy quyền cho B bán chiếc ô tô của A. B nhân danh A bán xe cho chính B. A không đồng ý. Giao dịch này:","o":["Không làm phát sinh quyền, nghĩa vụ đối với A, trừ trường hợp A đồng ý hoặc biết mà không phản đối trong thời hạn hợp lý","Ràng buộc A vì B đã có giấy ủy quyền","Đương nhiên vô hiệu tuyệt đối","Có hiệu lực nếu B trả đúng giá thị trường"],"a":0,"e":"Khoản 3 Điều 141 cấm người đại diện nhân danh người được đại diện xác lập giao dịch với chính mình, trừ trường hợp pháp luật có quy định khác. Giao dịch vượt phạm vi đại diện không làm phát sinh quyền, nghĩa vụ với người được đại diện, trừ khi người đó đồng ý hoặc biết mà không phản đối trong thời hạn hợp lý (Điều 143); giá bán không làm thay đổi kết luận.","b":"Khoản 3 Điều 141, Điều 143 BLDS 2015","lv":"VD","id":"3.6","g":3},{"q":"Hợp đồng chuyển nhượng quyền sử dụng đất giữa hai cá nhân lập bằng giấy viết tay, không công chứng. Bên mua đã trả 70% giá, bên bán đã giao đất. Theo yêu cầu của một bên, Tòa án:","o":["Chỉ công nhận phần đất tương ứng 70% số tiền đã trả","Buộc các bên đi công chứng lại rồi mới giải quyết","Có thể ra quyết định công nhận hiệu lực của hợp đồng vì một bên đã thực hiện ít nhất 2/3 nghĩa vụ, nếu các điều kiện khác được bảo đảm","Phải tuyên hợp đồng vô hiệu vì vi phạm hình thức"],"a":2,"e":"Khoản 2 Điều 129: giao dịch đã được xác lập bằng văn bản nhưng vi phạm quy định bắt buộc về công chứng, chứng thực mà một bên hoặc các bên đã thực hiện ít nhất 2/3 nghĩa vụ thì theo yêu cầu của một bên hoặc các bên, Tòa án ra quyết định công nhận hiệu lực, không phải công chứng lại. Tòa án vẫn xem xét các điều kiện khác (chủ thể, nội dung, điều kiện chuyển nhượng theo Luật Đất đai); tham khảo Án lệ 55/2022/AL.","b":"Khoản 2 Điều 129 BLDS 2015; Án lệ số 55/2022/AL","lv":"VD","id":"3.7","g":3},{"q":"Hợp đồng quy định thời hạn 10 ngày kể từ ngày 05/3. Ngày đầu tiên của thời hạn được tính là:","o":["Ngày 05/3","Ngày 15/3","Ngày 04/3","Ngày 06/3"],"a":3,"e":"Khoản 2 Điều 147: khi thời hạn được xác định bằng ngày, tuần, tháng, năm thì ngày đầu tiên của thời hạn không được tính mà tính từ ngày tiếp theo liền kề ngày được xác định, tức ngày 06/3.","b":"Khoản 2 Điều 147 BLDS 2015","lv":"VD","id":"3.8","g":3},{"q":"Ngày cuối cùng của một thời hạn rơi vào chủ nhật. Thời hạn kết thúc vào:","o":["Cuối ngày thứ hai của tuần kế tiếp nữa","Cuối ngày chủ nhật đó","Cuối ngày thứ bảy liền trước","Thời điểm kết thúc ngày làm việc tiếp theo ngày nghỉ đó"],"a":3,"e":"Khoản 5 Điều 148: khi ngày cuối cùng của thời hạn là ngày nghỉ cuối tuần hoặc ngày nghỉ lễ thì thời hạn kết thúc tại thời điểm kết thúc ngày làm việc tiếp theo ngày nghỉ đó.","b":"Khoản 5 Điều 148 BLDS 2015","lv":"VD","id":"3.9","g":3},{"q":"Tòa án áp dụng quy định về thời hiệu khởi kiện khi:","o":["Viện kiểm sát yêu cầu","Có yêu cầu của một bên hoặc các bên, đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định giải quyết vụ việc","Có yêu cầu ở bất kỳ giai đoạn nào, kể cả phúc thẩm","Tòa án tự phát hiện đã hết thời hiệu"],"a":1,"e":"Khoản 2 Điều 149: Tòa án chỉ áp dụng quy định về thời hiệu theo yêu cầu áp dụng thời hiệu của một bên hoặc các bên, và yêu cầu này phải đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định. Tòa án không tự mình áp dụng thời hiệu.","b":"Khoản 2 Điều 149 BLDS 2015","lv":"TH","id":"3.10","g":3},{"q":"Nội dung nào KHÔNG phải điều kiện có hiệu lực của giao dịch dân sự theo khoản 1 Điều 117 BLDS 2015?","o":["Chủ thể tham gia hoàn toàn tự nguyện","Mục đích, nội dung không vi phạm điều cấm của luật, không trái đạo đức xã hội","Chủ thể có năng lực pháp luật, năng lực hành vi dân sự phù hợp","Giao dịch phải được công chứng trong mọi trường hợp"],"a":3,"e":"Công chứng, chứng thực chỉ là điều kiện hình thức khi luật có quy định (khoản 2 Điều 117).","b":"Điều 117 BLDS 2015","lv":"TH","id":"3.11","g":3},{"q":"Thời hiệu yêu cầu Tòa án tuyên bố giao dịch dân sự vô hiệu do bị nhầm lẫn, lừa dối là:","o":["01 năm","02 năm","03 năm","Không bị hạn chế"],"a":1,"e":"Thời hiệu 02 năm áp dụng cho các trường hợp tại Điều 125–129; hết thời hiệu mà không có yêu cầu thì giao dịch có hiệu lực.","b":"Khoản 1, 2 Điều 132 BLDS 2015","lv":"NB","id":"3.12","g":3},{"q":"Người đại diện theo pháp luật của con chưa thành niên là:","o":["Cha, mẹ","Ông, bà","UBND cấp xã","Anh, chị ruột"],"a":0,"e":"Cha, mẹ là người đại diện theo pháp luật của con chưa thành niên; người giám hộ là đại diện của người được giám hộ.","b":"Khoản 1 Điều 136 BLDS 2015; Điều 73 Luật HNGĐ 2014","lv":"NB","id":"3.13","g":3},{"q":"Trường hợp không xác định được thời hạn đại diện và quyền đại diện không gắn với một giao dịch cụ thể, thời hạn đại diện là:","o":["06 tháng","01 năm kể từ thời điểm phát sinh quyền đại diện","Vô thời hạn","02 năm"],"a":1,"e":"Nếu quyền đại diện gắn với giao dịch cụ thể thì thời hạn tính đến khi chấm dứt giao dịch đó.","b":"Khoản 2 Điều 140 BLDS 2015","lv":"NB","id":"3.14","g":3},{"q":"Thời hiệu khởi kiện KHÔNG áp dụng đối với:","o":["Tranh chấp hợp đồng mua bán","Yêu cầu bảo vệ quyền nhân thân không gắn với tài sản","Yêu cầu bồi thường thiệt hại ngoài hợp đồng","Yêu cầu tuyên bố giao dịch vô hiệu do lừa dối"],"a":1,"e":"Điều 155 còn loại trừ: yêu cầu bảo vệ quyền sở hữu (trừ trường hợp luật khác quy định), tranh chấp quyền sử dụng đất theo Luật Đất đai, trường hợp khác do luật quy định.","b":"Điều 155 BLDS 2015","lv":"TH","id":"3.15","g":3},{"q":"C (25 tuổi) say rượu đến mức không nhận thức được hành vi, ký giấy bán chiếc đồng hồ quý cho D. Sau khi tỉnh, C có thể:","o":["Chỉ được yêu cầu bồi thường thiệt hại","Yêu cầu Tòa án tuyên bố giao dịch vô hiệu trong thời hiệu 02 năm","Không có quyền gì vì đã thành niên","Coi giao dịch đương nhiên vô hiệu tuyệt đối"],"a":1,"e":"Người có năng lực hành vi nhưng xác lập giao dịch vào đúng thời điểm không nhận thức, làm chủ được hành vi có quyền yêu cầu Tòa án tuyên bố vô hiệu.","b":"Điều 128, điểm d khoản 1 Điều 132 BLDS 2015","lv":"VD","id":"3.16","g":3},{"q":"Ngày 10/5/2025, D phát hiện mình bị E lừa dối khi mua một bức tranh giả. Thời hiệu để D yêu cầu Tòa án tuyên bố hợp đồng vô hiệu là:","o":["03 năm kể từ ngày giao kết hợp đồng","01 năm kể từ ngày giao kết hợp đồng","Không bị hạn chế","02 năm kể từ ngày D biết hoặc phải biết mình bị lừa dối"],"a":3,"e":"Với giao dịch do bị lừa dối, thời hiệu 02 năm tính từ ngày người bị lừa dối biết hoặc phải biết giao dịch được xác lập do bị lừa dối.","b":"Điều 127, điểm b khoản 1 Điều 132 BLDS 2015","lv":"VD","id":"3.17","g":3},{"q":"G ủy quyền cho H mua một căn nhà. H nhân danh G mua thêm một chiếc ô tô của I; I biết rõ H chỉ được ủy quyền mua nhà. G không đồng ý với việc mua ô tô. Hậu quả đối với giao dịch mua ô tô:","o":["G và H liên đới thanh toán","G phải thanh toán tiền ô tô","Không phát sinh nghĩa vụ đối với G; H cũng không phải thực hiện nghĩa vụ với I vì I biết việc vượt quá phạm vi đại diện","Giao dịch đương nhiên có hiệu lực"],"a":2,"e":"Phần vượt phạm vi đại diện không ràng buộc người được đại diện. Người đại diện phải thực hiện nghĩa vụ với người đã giao dịch, trừ khi người đó biết hoặc phải biết việc vượt quá phạm vi mà vẫn giao dịch.","b":"Khoản 1, 2 Điều 143 BLDS 2015","lv":"VD","id":"3.18","g":3},{"q":"I (14 tuổi) mua một điện thoại trị giá 30 triệu đồng mà không có sự đồng ý của cha mẹ. Ai có quyền yêu cầu Tòa án tuyên bố giao dịch vô hiệu?","o":["Người bán","Cha, mẹ của I (người đại diện theo pháp luật)","Viện kiểm sát","UBND cấp xã"],"a":1,"e":"Giao dịch không phục vụ nhu cầu sinh hoạt hằng ngày phù hợp lứa tuổi nên cần người đại diện đồng ý; quyền yêu cầu tuyên bố vô hiệu thuộc người đại diện.","b":"Khoản 3 Điều 21, khoản 1 Điều 125 BLDS 2015","lv":"VD","id":"3.19","g":3},{"q":"Giao dịch nào sau đây vô hiệu mà thời hiệu yêu cầu tuyên bố vô hiệu không bị hạn chế?","o":["Giao dịch do nhầm lẫn","Giao dịch do bị lừa dối","Giao dịch giả tạo nhằm trốn tránh nghĩa vụ với người thứ ba","Giao dịch vi phạm quy định về hình thức"],"a":2,"e":"Giao dịch giả tạo (Điều 124) và giao dịch vi phạm điều cấm, trái đạo đức (Điều 123) không bị giới hạn thời hiệu yêu cầu tuyên bố vô hiệu.","b":"Khoản 2 Điều 124, khoản 3 Điều 132 BLDS 2015","lv":"VD","id":"3.20","g":3},{"q":"Theo Điều 105 BLDS 2015, tài sản bao gồm:","o":["Chỉ vật và tiền","Vật, tiền và sức lao động","Chỉ bất động sản và tiền","Vật, tiền, giấy tờ có giá và quyền tài sản"],"a":3,"e":"Điều 105 liệt kê bốn loại: vật, tiền, giấy tờ có giá và quyền tài sản; tài sản gồm bất động sản và động sản, có thể là tài sản hiện có hoặc hình thành trong tương lai. Sức lao động không được BLDS ghi nhận là tài sản.","b":"Điều 105 BLDS 2015","lv":"NB","id":"4.1","g":4},{"q":"Quyền sử dụng đất theo BLDS 2015 thuộc loại tài sản nào?","o":["Giấy tờ có giá","Tiền","Quyền tài sản","Vật"],"a":2,"e":"Điều 115: quyền tài sản là quyền trị giá được bằng tiền, bao gồm quyền tài sản đối với đối tượng quyền sở hữu trí tuệ, quyền sử dụng đất và các quyền tài sản khác. Giấy chứng nhận quyền sử dụng đất không phải giấy tờ có giá.","b":"Điều 115 BLDS 2015","lv":"NB","id":"4.2","g":4},{"q":"Vật tiêu hao KHÔNG thể là đối tượng của hợp đồng nào sau đây?","o":["Hợp đồng vay","Hợp đồng cho thuê","Hợp đồng tặng cho","Hợp đồng mua bán"],"a":1,"e":"Khoản 1 Điều 112: vật tiêu hao không thể là đối tượng của hợp đồng cho thuê hoặc hợp đồng cho mượn vì bên thuê, bên mượn phải trả lại chính vật đó. Vật tiêu hao vẫn có thể được mua bán, tặng cho, cho vay (vay trả lại vật cùng loại).","b":"Khoản 1 Điều 112 BLDS 2015","lv":"TH","id":"4.3","g":4},{"q":"Quyền khác đối với tài sản theo khoản 2 Điều 159 BLDS 2015 gồm:","o":["Quyền thừa kế, quyền tặng cho, quyền cho thuê","Quyền thế chấp, quyền cầm cố, quyền bảo lãnh","Quyền đối với bất động sản liền kề, quyền hưởng dụng, quyền bề mặt","Quyền chiếm hữu, quyền sử dụng, quyền định đoạt"],"a":2,"e":"BLDS 2015 ghi nhận ba quyền khác đối với tài sản: quyền đối với bất động sản liền kề, quyền hưởng dụng, quyền bề mặt. Chiếm hữu, sử dụng, định đoạt là nội dung quyền sở hữu (Điều 158); cầm cố, thế chấp, bảo lãnh là biện pháp bảo đảm.","b":"Khoản 2 Điều 159 BLDS 2015","lv":"NB","id":"4.4","g":4},{"q":"Sở hữu chung của vợ chồng là loại sở hữu chung nào?","o":["Sở hữu chung hợp nhất có thể phân chia","Sở hữu chung của cộng đồng","Sở hữu chung hợp nhất không phân chia","Sở hữu chung theo phần"],"a":0,"e":"Điều 213 BLDS 2015 và Điều 33 Luật HNGĐ 2014: sở hữu chung của vợ chồng là sở hữu chung hợp nhất có thể phân chia; vợ chồng có quyền ngang nhau trong chiếm hữu, sử dụng, định đoạt và có thể chia theo thỏa thuận hoặc theo quyết định của Tòa án. Sở hữu chung hợp nhất không phân chia là sở hữu chung của cộng đồng hoặc phần sở hữu chung trong nhà chung cư.","b":"Điều 213 BLDS 2015; Điều 33 Luật HNGĐ 2014","lv":"TH","id":"4.5","g":4},{"q":"A nhặt được một chiếc ví không rõ chủ trên đường. A phải:","o":["Thông báo hoặc trả lại cho chủ sở hữu; nếu không biết chủ sở hữu thì thông báo hoặc giao nộp cho UBND cấp xã hoặc công an cấp xã nơi gần nhất để thông báo công khai","Giữ 50% số tiền và nộp lại phần còn lại","Nộp vào ngân sách nhà nước ngay","Giữ lại, vì người nhặt được trở thành chủ sở hữu ngay"],"a":0,"e":"Điều 230: người phát hiện tài sản bị đánh rơi, bỏ quên phải thông báo hoặc trả lại cho chủ sở hữu; nếu không biết chủ sở hữu thì thông báo hoặc giao nộp cho UBND cấp xã hoặc công an cấp xã nơi gần nhất để thông báo công khai. Chỉ sau 01 năm kể từ ngày thông báo công khai mà không xác định được chủ sở hữu thì quyền sở hữu mới được xác định theo khoản 2 Điều 230.","b":"Điều 230 BLDS 2015","lv":"VD","id":"4.6","g":4},{"q":"Người chiếm hữu, người được lợi về tài sản không có căn cứ pháp luật nhưng ngay tình, liên tục, công khai trở thành chủ sở hữu bất động sản sau thời hạn:","o":["20 năm","30 năm","50 năm","10 năm"],"a":1,"e":"Điều 236: thời hạn là 10 năm đối với động sản và 30 năm đối với bất động sản, kể từ thời điểm bắt đầu chiếm hữu, trừ trường hợp BLDS, luật khác có liên quan quy định khác. Riêng quyền sử dụng đất chịu sự điều chỉnh của Luật Đất đai.","b":"Điều 236 BLDS 2015","lv":"TH","id":"4.7","g":4},{"q":"C mua ngay tình, có đền bù một chiếc tivi (động sản không phải đăng ký) từ D; D không có quyền định đoạt chiếc tivi vì đã mượn của E. E có quyền đòi lại tivi từ C không?","o":["Không, vì tivi đã được C sử dụng","Có, nếu E trả lại cho C số tiền C đã mua","Không, vì C ngay tình và giao dịch có đền bù, tivi không bị lấy cắp, không bị mất hoặc chiếm hữu ngoài ý chí của E","Có, chủ sở hữu luôn được đòi lại tài sản"],"a":2,"e":"Điều 167: chủ sở hữu được đòi lại động sản không phải đăng ký từ người chiếm hữu ngay tình chỉ khi người đó có được tài sản qua hợp đồng không có đền bù với người không có quyền định đoạt; nếu là hợp đồng có đền bù thì chỉ đòi được khi tài sản bị lấy cắp, bị mất hoặc chiếm hữu ngoài ý chí của chủ sở hữu. E tự giao tivi cho D mượn nên không thuộc trường hợp chiếm hữu ngoài ý chí; E yêu cầu D bồi thường.","b":"Điều 167 BLDS 2015","lv":"VD","id":"4.8","g":4},{"q":"Trong sở hữu chung theo phần đối với một chiếc xe ô tô, A muốn bán phần quyền sở hữu của mình cho người ngoài. A phải:","o":["Được tự do bán, không cần thông báo","Xin phép Tòa án","Thông báo bằng văn bản cho các chủ sở hữu chung khác về việc bán và điều kiện bán; họ có quyền ưu tiên mua","Chia ô tô bằng hiện vật trước khi bán"],"a":2,"e":"Khoản 3 Điều 218: chủ sở hữu chung có quyền ưu tiên mua; người bán phải thông báo bằng văn bản về việc bán và điều kiện bán. Với động sản, thời hạn trả lời là 01 tháng (bất động sản 03 tháng). Nếu vi phạm quyền ưu tiên mua, trong 03 tháng kể từ ngày phát hiện, chủ sở hữu chung có quyền yêu cầu Tòa án chuyển sang cho mình quyền và nghĩa vụ của người mua.","b":"Khoản 3 Điều 218 BLDS 2015","lv":"VD","id":"4.9","g":4},{"q":"Thời hạn của quyền hưởng dụng khi người hưởng dụng đầu tiên là cá nhân:","o":["Tối đa 30 năm","Tối đa đến hết cuộc đời của người hưởng dụng đầu tiên","Tối đa 50 năm","Không giới hạn, có thể để thừa kế"],"a":1,"e":"Điều 260: thời hạn của quyền hưởng dụng do các bên thỏa thuận hoặc luật quy định nhưng tối đa đến hết cuộc đời của người hưởng dụng đầu tiên nếu là cá nhân; nếu là pháp nhân thì đến khi pháp nhân chấm dứt tồn tại nhưng không quá 30 năm.","b":"Điều 260 BLDS 2015","lv":"TH","id":"4.10","g":4},{"q":"Tài sản nào sau đây KHÔNG phải là bất động sản?","o":["Nhà, công trình xây dựng gắn liền với đất","Đất đai","Tài sản khác gắn liền với đất đai, nhà, công trình xây dựng","Chiếc xe ô tô"],"a":3,"e":"Động sản là những tài sản không phải là bất động sản; ô tô là động sản phải đăng ký.","b":"Điều 107 BLDS 2015","lv":"TH","id":"4.11","g":4},{"q":"Hoa lợi là:","o":["Sản vật tự nhiên mà tài sản mang lại","Tiền cho thuê nhà","Khoản lợi thu được từ việc khai thác tài sản","Tiền lãi gửi tiết kiệm"],"a":0,"e":"“Khoản lợi thu được từ việc khai thác tài sản” là định nghĩa lợi tức; tiền lãi, tiền thuê là lợi tức.","b":"Điều 109 BLDS 2015","lv":"TH","id":"4.12","g":4},{"q":"Nội dung quyền sở hữu gồm:","o":["Quyền chiếm hữu, quyền quản lý, quyền bảo quản","Quyền sử dụng, quyền thế chấp, quyền định đoạt","Quyền chiếm hữu, quyền đăng ký, quyền định đoạt","Quyền chiếm hữu, quyền sử dụng, quyền định đoạt"],"a":3,"e":"Ba quyền năng của chủ sở hữu.","b":"Điều 158 BLDS 2015","lv":"NB","id":"4.13","g":4},{"q":"Khi luật không quy định và các bên không có thỏa thuận, thời điểm xác lập quyền sở hữu là:","o":["Thời điểm thanh toán đủ tiền","Thời điểm tài sản được chuyển giao","Thời điểm giao kết hợp đồng","Thời điểm công chứng hợp đồng"],"a":1,"e":"Thời điểm tài sản được chuyển giao là thời điểm bên có quyền hoặc người đại diện hợp pháp của họ chiếm hữu tài sản.","b":"Khoản 1 Điều 161 BLDS 2015","lv":"TH","id":"4.14","g":4},{"q":"Khi thực hiện nghĩa vụ chuyển giao vật chính thì:","o":["Chỉ chuyển giao vật phụ khi bên nhận trả thêm tiền","Không phải chuyển giao vật phụ","Phải chuyển giao cả vật phụ, trừ trường hợp có thỏa thuận khác","Tùy bên chuyển giao quyết định"],"a":2,"e":"Ví dụ: bán tivi phải giao kèm điều khiển từ xa nếu không có thỏa thuận khác.","b":"Khoản 3 Điều 110 BLDS 2015","lv":"NB","id":"4.15","g":4},{"q":"A, B, C sở hữu chung theo phần một căn nhà. A muốn bán phần quyền sở hữu của mình. Cách làm đúng là:","o":["Bắt buộc bán cho Nhà nước","Thông báo bằng văn bản cho B, C về việc bán và điều kiện bán; B, C có quyền ưu tiên mua trong 03 tháng","Tự do bán cho người ngoài","Phải có quyết định của Tòa án"],"a":1,"e":"Với bất động sản, thời hạn để chủ sở hữu chung trả lời là 03 tháng (động sản: 01 tháng); hết thời hạn không ai mua thì A được bán cho người khác.","b":"Khoản 3 Điều 218 BLDS 2015","lv":"VD","id":"4.16","g":4},{"q":"Ông T nhặt được 20 triệu đồng bị đánh rơi, đã giao nộp và thông báo công khai đúng quy định; sau 01 năm không xác định được chủ sở hữu. Biết mức lương cơ sở là 2.530.000 đồng/tháng. Ông T:","o":["Được xác lập quyền sở hữu toàn bộ 20 triệu đồng","Được 50% số tiền","Không được gì, toàn bộ thuộc Nhà nước","Được 10 triệu đồng"],"a":0,"e":"Tài sản có giá trị nhỏ hơn hoặc bằng 10 lần mức lương cơ sở (25,3 triệu đồng) thì người nhặt được được xác lập quyền sở hữu.","b":"Điểm a khoản 2 Điều 230 BLDS 2015; Nghị định 161/2026/NĐ-CP","lv":"VD","id":"4.17","g":4},{"q":"X mua một chiếc xe máy (động sản phải đăng ký) tại cửa hàng của Y với giá thị trường, hoàn toàn ngay tình; thực tế xe do Y lấy trộm của Z và chưa từng đăng ký sang tên Y. Z có quyền gì?","o":["Chỉ được đòi lại một nửa giá trị xe","Không được đòi lại vì X ngay tình","Phải chia đôi giá trị xe với X","Được đòi lại xe theo Điều 168; X có quyền yêu cầu Y hoàn trả tiền và bồi thường thiệt hại"],"a":3,"e":"Chủ sở hữu được đòi lại động sản phải đăng ký từ người chiếm hữu ngay tình, trừ trường hợp khoản 2 Điều 133 (giao dịch căn cứ vào việc đăng ký, bán đấu giá, giao dịch theo bản án bị hủy). Trường hợp này không thuộc ngoại lệ.","b":"Điều 168, khoản 2 Điều 133 BLDS 2015","lv":"VD","id":"4.18","g":4},{"q":"Thửa đất của ông P bị vây bọc bởi các thửa đất khác, không có lối đi ra đường công cộng. Ông P:","o":["Được tự mở lối đi tùy ý, không phải đền bù","Không có quyền gì","Được yêu cầu UBND thu hồi đất của hàng xóm","Có quyền yêu cầu chủ sở hữu bất động sản vây bọc dành cho mình một lối đi hợp lý và phải đền bù, trừ trường hợp có thỏa thuận khác"],"a":3,"e":"Lối đi được mở trên bất động sản liền kề nào mà được coi là thuận tiện và hợp lý nhất, có tính đến đặc điểm cụ thể của địa điểm, lợi ích của bất động sản bị vây bọc và thiệt hại gây ra là ít nhất.","b":"Điều 254 BLDS 2015","lv":"VD","id":"4.19","g":4},{"q":"Phát biểu nào về quyền bề mặt là đúng?","o":["Quyền bề mặt chỉ được xác lập theo di chúc","Quyền bề mặt không chấm dứt khi quyền sử dụng đất bị thu hồi","Chủ thể quyền bề mặt đồng thời là người sử dụng đất","Quyền bề mặt là quyền của chủ thể đối với mặt đất, mặt nước, khoảng không gian trên mặt đất, mặt nước và lòng đất mà quyền sử dụng đất đó thuộc về chủ thể khác"],"a":3,"e":"Quyền bề mặt xác lập theo luật, thỏa thuận hoặc di chúc; chấm dứt khi quyền sử dụng đất bị thu hồi theo Luật Đất đai.","b":"Điều 267, Điều 268, Điều 272 BLDS 2015","lv":"VD","id":"4.20","g":4},{"q":"Trường hợp Tòa án tuyên bố một người là đã chết, thời điểm mở thừa kế là:","o":["Ngày được xác định tại khoản 2 Điều 71 BLDS (ngày chết ghi trong quyết định của Tòa án)","Ngày quyết định tuyên bố chết có hiệu lực pháp luật","Ngày cuối cùng có tin tức về người đó","Ngày người có quyền lợi nộp đơn yêu cầu"],"a":0,"e":"Khoản 1 Điều 611: thời điểm mở thừa kế là thời điểm người có tài sản chết; trường hợp Tòa án tuyên bố một người là đã chết thì thời điểm mở thừa kế là ngày được xác định tại khoản 2 Điều 71, tức ngày chết do Tòa án xác định trong quyết định.","b":"Khoản 1 Điều 611 BLDS 2015","lv":"NB","id":"5.1","g":5},{"q":"Người thừa kế là cá nhân phải:","o":["Còn sống vào thời điểm mở thừa kế hoặc sinh ra và còn sống sau thời điểm mở thừa kế nhưng đã thành thai trước khi người để lại di sản chết","Đủ 18 tuổi vào thời điểm mở thừa kế","Có quốc tịch Việt Nam","Còn sống vào thời điểm chia di sản"],"a":0,"e":"Điều 613 cho phép cả người đã thành thai trước khi người để lại di sản chết (sinh ra và còn sống sau đó) được hưởng thừa kế. Pháp luật không đặt điều kiện về tuổi hay quốc tịch của người thừa kế; mốc là thời điểm mở thừa kế, không phải thời điểm chia di sản.","b":"Điều 613 BLDS 2015","lv":"TH","id":"5.2","g":5},{"q":"Thời hiệu để người thừa kế yêu cầu chia di sản, kể từ thời điểm mở thừa kế, là:","o":["30 năm đối với bất động sản, 10 năm đối với động sản","10 năm đối với bất động sản, 03 năm đối với động sản","20 năm đối với mọi loại di sản","Không hạn chế đối với mọi loại di sản"],"a":0,"e":"Khoản 1 Điều 623: 30 năm đối với bất động sản, 10 năm đối với động sản. Hết thời hạn này di sản thuộc về người thừa kế đang quản lý di sản; nếu không có thì giải quyết theo điểm a, b khoản 1 Điều 623. Tham khảo Án lệ 26/2018/AL về thời điểm tính thời hiệu.","b":"Khoản 1 Điều 623 BLDS 2015","lv":"NB","id":"5.3","g":5},{"q":"Thời hiệu yêu cầu người thừa kế thực hiện nghĩa vụ về tài sản do người chết để lại là:","o":["01 năm","03 năm","30 năm","10 năm"],"a":1,"e":"Khoản 3 Điều 623: 03 năm kể từ thời điểm mở thừa kế. Thời hiệu 10 năm áp dụng cho yêu cầu xác nhận quyền thừa kế của mình hoặc bác bỏ quyền thừa kế của người khác (khoản 2); 30 năm/10 năm là thời hiệu yêu cầu chia di sản (khoản 1).","b":"Khoản 2, 3 Điều 623 BLDS 2015","lv":"TH","id":"5.4","g":5},{"q":"Người từ đủ 15 tuổi đến chưa đủ 18 tuổi được lập di chúc khi:","o":["Chỉ được lập di chúc miệng","Được tự do lập di chúc như người thành niên","Được lập di chúc nếu được cha, mẹ hoặc người giám hộ đồng ý về việc lập di chúc","Không được lập di chúc"],"a":2,"e":"Khoản 2 Điều 625: người từ đủ 15 đến chưa đủ 18 tuổi được lập di chúc nếu được cha, mẹ hoặc người giám hộ đồng ý về việc lập di chúc. Di chúc của người này phải lập thành văn bản (khoản 2 Điều 630).","b":"Khoản 2 Điều 625 BLDS 2015","lv":"TH","id":"5.5","g":5},{"q":"Ông M bị tai nạn, tính mạng bị đe dọa, không thể lập di chúc bằng văn bản; ông thể hiện ý chí cuối cùng trước hai người làm chứng. Để di chúc miệng hợp pháp còn cần:","o":["Người làm chứng ghi chép lại, cùng ký tên hoặc điểm chỉ; trong 05 ngày làm việc kể từ ngày ông M thể hiện ý chí cuối cùng, di chúc được công chứng viên hoặc cơ quan có thẩm quyền chứng thực xác nhận chữ ký hoặc điểm chỉ của người làm chứng","Không cần gì thêm","Được UBND cấp xã phê duyệt trong 30 ngày","Có thêm người làm chứng thứ ba"],"a":0,"e":"Khoản 5 Điều 630: di chúc miệng hợp pháp khi người di chúc thể hiện ý chí cuối cùng trước mặt ít nhất hai người làm chứng; ngay sau đó người làm chứng ghi chép lại, cùng ký tên hoặc điểm chỉ; trong 05 ngày làm việc phải được công chứng, chứng thực chữ ký/điểm chỉ của người làm chứng. Ngoài ra, sau 03 tháng mà người lập di chúc còn sống, minh mẫn thì di chúc miệng mặc nhiên bị hủy bỏ (khoản 2 Điều 629).","b":"Điều 629, khoản 5 Điều 630 BLDS 2015","lv":"VD","id":"5.6","g":5},{"q":"Người nào sau đây ĐƯỢC làm chứng cho việc lập di chúc?","o":["Người chưa thành niên","Người thừa kế theo di chúc của người lập di chúc","Người có quyền, nghĩa vụ tài sản liên quan tới nội dung di chúc","Người hàng xóm 30 tuổi, minh mẫn, không có quyền lợi liên quan"],"a":3,"e":"Điều 632 loại trừ: người thừa kế theo di chúc hoặc theo pháp luật của người lập di chúc; người có quyền, nghĩa vụ tài sản liên quan tới nội dung di chúc; người chưa thành niên, người mất năng lực hành vi dân sự, người có khó khăn trong nhận thức, làm chủ hành vi. Người thành niên không có quyền lợi liên quan được làm chứng.","b":"Điều 632 BLDS 2015","lv":"TH","id":"5.7","g":5},{"q":"Bà H là mẹ kế của anh K; hai người có quan hệ chăm sóc, nuôi dưỡng nhau như mẹ con. Bà H chết không để lại di chúc. Anh K:","o":["Không được hưởng thừa kế vì không cùng huyết thống","Được thừa kế di sản của bà H theo pháp luật như con","Chỉ được hưởng 2/3 suất thừa kế","Chỉ được hưởng nếu được những người thừa kế khác đồng ý"],"a":1,"e":"Điều 654: con riêng và bố dượng, mẹ kế nếu có quan hệ chăm sóc, nuôi dưỡng nhau như cha con, mẹ con thì được thừa kế di sản của nhau và còn được thừa kế thế vị theo Điều 652.","b":"Điều 654 BLDS 2015","lv":"VD","id":"5.8","g":5},{"q":"Ông T lập di chúc truất quyền thừa kế của con trai 12 tuổi. Người con này:","o":["Không được hưởng gì vì đã bị truất quyền","Được hưởng toàn bộ một suất thừa kế","Vẫn được hưởng phần di sản bằng 2/3 suất của một người thừa kế theo pháp luật","Được hưởng 1/2 suất thừa kế"],"a":2,"e":"Khoản 1 Điều 644: con chưa thành niên của người lập di chúc vẫn được hưởng phần di sản bằng 2/3 suất của một người thừa kế theo pháp luật nếu di sản được chia theo pháp luật, trừ khi họ từ chối nhận di sản hoặc không có quyền hưởng di sản theo Điều 620, khoản 1 Điều 621.","b":"Khoản 1, 2 Điều 644 BLDS 2015","lv":"VD","id":"5.9","g":5},{"q":"Người thừa kế muốn từ chối nhận di sản phải đáp ứng điều kiện nào?","o":["Lập thành văn bản, gửi đến những người có liên quan, thể hiện trước thời điểm phân chia di sản và không nhằm trốn tránh nghĩa vụ tài sản","Chỉ cần tuyên bố miệng trước các đồng thừa kế","Phải được Tòa án cho phép","Có thể từ chối bất cứ lúc nào, kể cả sau khi đã chia di sản"],"a":0,"e":"Điều 620: việc từ chối nhận di sản phải lập thành văn bản, gửi đến người quản lý di sản, những người thừa kế khác, người được giao nhiệm vụ phân chia di sản; phải thể hiện trước thời điểm phân chia di sản; không được từ chối nhằm trốn tránh nghĩa vụ tài sản của mình đối với người khác.","b":"Điều 620 BLDS 2015","lv":"TH","id":"5.10","g":5},{"q":"Hàng thừa kế thứ nhất gồm:","o":["Cháu ruột của người chết","Anh, chị, em ruột của người chết","Vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết","Vợ, chồng, con và ông bà nội, ngoại"],"a":2,"e":"Ông bà, anh chị em ruột, cháu ruột (khi người chết là ông bà) thuộc hàng thứ hai.","b":"Điểm a khoản 1 Điều 651 BLDS 2015","lv":"NB","id":"5.11","g":5},{"q":"Địa điểm mở thừa kế là:","o":["Nơi cư trú cuối cùng của người để lại di sản; nếu không xác định được thì là nơi có toàn bộ hoặc phần lớn di sản","Nơi cư trú của người thừa kế lớn tuổi nhất","Trụ sở UBND cấp tỉnh","Trụ sở Tòa án nơi có yêu cầu"],"a":0,"e":"Quy định này có ý nghĩa xác định thẩm quyền giải quyết và nơi thực hiện các thủ tục thừa kế.","b":"Khoản 2 Điều 611 BLDS 2015","lv":"NB","id":"5.12","g":5},{"q":"Thời hiệu để người thừa kế yêu cầu xác nhận quyền thừa kế của mình hoặc bác bỏ quyền thừa kế của người khác là:","o":["30 năm","Không hạn chế","03 năm","10 năm"],"a":3,"e":"Thời hiệu tính từ thời điểm mở thừa kế.","b":"Khoản 2 Điều 623 BLDS 2015","lv":"NB","id":"5.13","g":5},{"q":"Người nào sau đây KHÔNG thuộc trường hợp không được quyền hưởng di sản theo khoản 1 Điều 621 BLDS 2015?","o":["Người vi phạm nghiêm trọng nghĩa vụ nuôi dưỡng người để lại di sản","Người bị kết án về hành vi cố ý xâm phạm tính mạng người để lại di sản","Người giả mạo di chúc nhằm hưởng di sản","Người con đã thành niên, có khả năng lao động"],"a":3,"e":"Con đã thành niên có khả năng lao động vẫn có quyền thừa kế theo pháp luật; họ chỉ không thuộc diện “không phụ thuộc nội dung di chúc”.","b":"Khoản 1 Điều 621 BLDS 2015","lv":"TH","id":"5.14","g":5},{"q":"Di chúc có hiệu lực từ thời điểm:","o":["Công chứng di chúc","Mở thừa kế","Chia di sản","Lập di chúc"],"a":1,"e":"Di chúc là giao dịch có hiệu lực sau khi người lập chết.","b":"Khoản 1 Điều 643 BLDS 2015","lv":"NB","id":"5.15","g":5},{"q":"Ông A chết không để lại di chúc, di sản 1,2 tỷ đồng. Hàng thừa kế thứ nhất còn sống gồm vợ B, hai con C, D và mẹ của ông A. Mỗi người được hưởng:","o":["Mẹ ông A không được hưởng","400 triệu đồng (chỉ B, C, D)","300 triệu đồng","600 triệu đồng cho B, phần còn lại chia cho C, D"],"a":2,"e":"Mẹ đẻ thuộc hàng thừa kế thứ nhất; bốn người cùng hàng được hưởng phần bằng nhau: 1,2 tỷ : 4 = 300 triệu.","b":"Khoản 1, 2 Điều 651 BLDS 2015","lv":"VD","id":"5.16","g":5},{"q":"Ông X chết không để lại di chúc. Con trai Y của ông đã chết trước ông; Y có con là Z. Z được hưởng:","o":["2/3 một suất thừa kế","Một nửa phần của Y","Phần di sản mà Y được hưởng nếu còn sống (thừa kế thế vị)","Không được hưởng vì Z thuộc hàng thừa kế thứ hai"],"a":2,"e":"Con của người để lại di sản chết trước hoặc cùng thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống.","b":"Điều 652 BLDS 2015","lv":"VD","id":"5.17","g":5},{"q":"Ông K lập di chúc để toàn bộ di sản 900 triệu đồng cho người cháu. Ông K có vợ L còn sống và hai con đã thành niên, có khả năng lao động. Bà L được hưởng không phụ thuộc vào nội dung di chúc:","o":["Không được hưởng","200 triệu đồng","300 triệu đồng","450 triệu đồng"],"a":1,"e":"Một suất thừa kế theo pháp luật = 900 triệu : 3 (L và hai con) = 300 triệu; L được 2/3 suất = 200 triệu. Hai con thành niên có khả năng lao động không thuộc diện Điều 644.","b":"Điều 644, Điều 651 BLDS 2015","lv":"VD","id":"5.18","g":5},{"q":"Chưa xác định được người thừa kế và di sản chưa có người quản lý. Di sản do ai quản lý?","o":["Người hàng xóm gần nhất do Tòa án chỉ định","Người thừa kế lớn tuổi nhất","Không ai quản lý cho đến khi có người nhận","Cơ quan nhà nước có thẩm quyền"],"a":3,"e":"Thứ tự: người được chỉ định trong di chúc hoặc do những người thừa kế thỏa thuận cử → người đang chiếm hữu, sử dụng, quản lý di sản → cơ quan nhà nước có thẩm quyền (khi chưa xác định được người thừa kế và di sản chưa có người quản lý).","b":"Điều 616 BLDS 2015","lv":"VD","id":"5.19","g":5},{"q":"Di chúc bằng văn bản không có người làm chứng hợp pháp khi:","o":["Người khác viết hộ, không có người làm chứng","Di chúc được ghi âm bằng điện thoại","Di chúc được đánh máy, không có chữ ký","Người lập di chúc tự viết và ký vào bản di chúc, đáp ứng các nội dung tại Điều 631"],"a":3,"e":"Di chúc không có người làm chứng phải do người lập tự viết và ký; các trường hợp nhờ viết hộ, đánh máy phải có ít nhất hai người làm chứng.","b":"Điều 633, Điều 634 BLDS 2015","lv":"VD","id":"5.20","g":5},{"q":"Căn cứ nào sau đây làm phát sinh nghĩa vụ dân sự theo Điều 275 BLDS 2015?","o":["Quyết định xử phạt vi phạm hành chính","Quan hệ hàng xóm láng giềng","Thực hiện công việc không có ủy quyền","Quan hệ quen biết, bạn bè"],"a":2,"e":"Điều 275 liệt kê: hợp đồng; hành vi pháp lý đơn phương; thực hiện công việc không có ủy quyền; chiếm hữu, sử dụng, được lợi về tài sản không có căn cứ pháp luật; gây thiệt hại do hành vi trái pháp luật; căn cứ khác do pháp luật quy định. Quan hệ quen biết không tự làm phát sinh nghĩa vụ; xử phạt hành chính là quan hệ hành chính.","b":"Điều 275 BLDS 2015","lv":"NB","id":"6.1","g":6},{"q":"Bên có quyền chuyển giao quyền yêu cầu cho người thế quyền. Điều kiện đúng là:","o":["Phải được bên có nghĩa vụ đồng ý","Phải được công chứng","Không cần bên có nghĩa vụ đồng ý, nhưng bên chuyển giao phải thông báo bằng văn bản cho bên có nghĩa vụ","Chỉ được chuyển giao khi nghĩa vụ đã đến hạn"],"a":2,"e":"Điều 365: việc chuyển giao quyền yêu cầu không cần sự đồng ý của bên có nghĩa vụ, trừ trường hợp có thỏa thuận hoặc luật có quy định khác; bên chuyển giao phải thông báo bằng văn bản cho bên có nghĩa vụ. Khác với chuyển giao nghĩa vụ phải được bên có quyền đồng ý (Điều 370).","b":"Điều 365 BLDS 2015","lv":"TH","id":"6.2","g":6},{"q":"Chuyển giao nghĩa vụ cho người thế nghĩa vụ hợp pháp khi:","o":["Được bên có quyền đồng ý, và nghĩa vụ không gắn liền với nhân thân","Được UBND cấp xã xác nhận","Bên có nghĩa vụ chỉ cần thông báo cho bên có quyền","Người thế nghĩa vụ có tài sản lớn hơn"],"a":0,"e":"Khoản 1 Điều 370: bên có nghĩa vụ có thể chuyển giao nghĩa vụ cho người thế nghĩa vụ nếu được bên có quyền đồng ý, trừ nghĩa vụ gắn liền với nhân thân hoặc pháp luật quy định không được chuyển giao. Thông báo đơn thuần chỉ đủ cho chuyển giao quyền yêu cầu.","b":"Khoản 1 Điều 370 BLDS 2015","lv":"TH","id":"6.3","g":6},{"q":"Trong nghĩa vụ liên đới, bên có quyền:","o":["Phải yêu cầu tất cả cùng lúc","Chỉ được yêu cầu mỗi người thực hiện phần nghĩa vụ của họ","Chỉ được yêu cầu người có tài sản lớn nhất","Có thể yêu cầu bất cứ ai trong số những người có nghĩa vụ phải thực hiện toàn bộ nghĩa vụ"],"a":3,"e":"Điều 288: bên có quyền có thể yêu cầu bất cứ ai trong số những người có nghĩa vụ liên đới thực hiện toàn bộ nghĩa vụ; người đã thực hiện toàn bộ có quyền yêu cầu những người còn lại thực hiện phần nghĩa vụ liên đới của họ đối với mình. Yêu cầu từng người thực hiện phần của mình là đặc điểm của nghĩa vụ theo phần (Điều 290).","b":"Điều 288 BLDS 2015","lv":"TH","id":"6.4","g":6},{"q":"Biện pháp nào là biện pháp bảo đảm thực hiện nghĩa vụ theo Điều 292 BLDS 2015?","o":["Lãi chậm trả","Phạt vi phạm","Tín chấp","Bồi thường thiệt hại"],"a":2,"e":"Điều 292 ghi nhận 9 biện pháp: cầm cố, thế chấp, đặt cọc, ký cược, ký quỹ, bảo lưu quyền sở hữu, bảo lãnh, tín chấp, cầm giữ tài sản. Phạt vi phạm, bồi thường thiệt hại, lãi chậm trả là trách nhiệm do vi phạm nghĩa vụ, không phải biện pháp bảo đảm.","b":"Điều 292 BLDS 2015","lv":"NB","id":"6.5","g":6},{"q":"X đặt cọc 30 triệu đồng cho Y để bảo đảm giao kết hợp đồng mua đất; sau đó X (bên đặt cọc) từ chối giao kết. Các bên không có thỏa thuận khác. Hậu quả:","o":["Khoản tiền đặt cọc 30 triệu đồng thuộc về Y","Hai bên chia đôi khoản tiền đặt cọc","Y phải trả lại X 30 triệu đồng","X phải trả thêm cho Y 30 triệu đồng"],"a":0,"e":"Khoản 2 Điều 328: nếu bên đặt cọc từ chối giao kết, thực hiện hợp đồng thì tài sản đặt cọc thuộc về bên nhận đặt cọc; nếu bên nhận đặt cọc từ chối thì phải trả lại tài sản đặt cọc và một khoản tiền tương đương giá trị tài sản đặt cọc, trừ trường hợp có thỏa thuận khác. Xem thêm Nghị quyết 03/2026/NQ-HĐTP.","b":"Khoản 2 Điều 328 BLDS 2015; Nghị quyết 03/2026/NQ-HĐTP","lv":"VD","id":"6.6","g":6},{"q":"Điểm khác biệt cơ bản giữa thế chấp và cầm cố tài sản là:","o":["Cầm cố chỉ áp dụng cho bất động sản","Thế chấp chỉ áp dụng cho động sản","Thế chấp không bắt buộc giao tài sản cho bên nhận thế chấp; cầm cố phải giao tài sản cho bên nhận cầm cố","Cầm cố phải đăng ký, thế chấp không cần"],"a":2,"e":"Điều 317: thế chấp là việc dùng tài sản để bảo đảm mà không giao tài sản cho bên nhận thế chấp; Điều 309: cầm cố là việc giao tài sản cho bên nhận cầm cố. Cả hai đều có thể áp dụng với động sản; thế chấp phổ biến với bất động sản.","b":"Điều 309, Điều 317 BLDS 2015","lv":"TH","id":"6.7","g":6},{"q":"A cho B vay tiền, thỏa thuận lãi suất 25%/năm (không thuộc trường hợp luật khác quy định khác). Phần lãi suất có hiệu lực tối đa là:","o":["10%/năm","Không có hiệu lực toàn bộ thỏa thuận lãi","20%/năm của khoản tiền vay; phần vượt quá không có hiệu lực","25%/năm theo thỏa thuận"],"a":2,"e":"Khoản 1 Điều 468: lãi suất theo thỏa thuận không được vượt quá 20%/năm của khoản tiền vay, trừ trường hợp luật khác có liên quan quy định khác; mức vượt quá không có hiệu lực, phần trong giới hạn vẫn có hiệu lực. Tham khảo Nghị quyết 01/2019/NQ-HĐTP.","b":"Khoản 1 Điều 468 BLDS 2015","lv":"VD","id":"6.8","g":6},{"q":"Bên có nghĩa vụ trả tiền chậm trả; các bên không có thỏa thuận về lãi suất chậm trả. Lãi suất áp dụng là:","o":["Theo khoản 2 Điều 468 BLDS 2015, bằng 50% mức lãi suất giới hạn tại khoản 1 Điều 468 (10%/năm)","20%/năm","Lãi suất cơ bản của Ngân hàng Nhà nước","Không phải trả lãi"],"a":0,"e":"Khoản 2 Điều 357: trường hợp chậm trả, bên chậm trả phải trả lãi trên số tiền chậm trả; lãi suất theo thỏa thuận nhưng không vượt quá khoản 1 Điều 468, nếu không có thỏa thuận thì áp dụng khoản 2 Điều 468 (50% của 20%/năm, tức 10%/năm).","b":"Khoản 2 Điều 357, Điều 468 BLDS 2015","lv":"VD","id":"6.9","g":6},{"q":"Nghĩa vụ nào sau đây KHÔNG được bù trừ?","o":["Nghĩa vụ trả tiền vay đã đến hạn","Nghĩa vụ trả tiền mua hàng đã đến hạn","Nghĩa vụ bồi thường thiệt hại do xâm phạm tính mạng, sức khỏe","Nghĩa vụ trả tiền thuê nhà đã đến hạn"],"a":2,"e":"Điều 379 không cho bù trừ: nghĩa vụ đang có tranh chấp; nghĩa vụ bồi thường thiệt hại do xâm phạm tính mạng, sức khỏe, danh dự, nhân phẩm, uy tín; nghĩa vụ cấp dưỡng; nghĩa vụ khác do luật quy định. Các nghĩa vụ tiền đã đến hạn còn lại được bù trừ theo Điều 378.","b":"Điều 379 BLDS 2015","lv":"TH","id":"6.10","g":6},{"q":"Biện pháp nào KHÔNG phải là biện pháp bảo đảm thực hiện nghĩa vụ theo Điều 292 BLDS 2015?","o":["Ký quỹ","Phạt vi phạm","Bảo lưu quyền sở hữu","Cầm giữ tài sản"],"a":1,"e":"Phạt vi phạm là thỏa thuận trong hợp đồng về chế tài (Điều 418), không phải biện pháp bảo đảm.","b":"Điều 292, Điều 418 BLDS 2015","lv":"TH","id":"6.11","g":6},{"q":"Nếu các bên không có thỏa thuận, nghĩa vụ có đối tượng là bất động sản phải được thực hiện tại:","o":["Nơi cư trú của bên có nghĩa vụ","Nơi cư trú của bên có quyền","Trụ sở Tòa án","Nơi có bất động sản"],"a":3,"e":"Nếu đối tượng không phải bất động sản thì thực hiện tại nơi cư trú hoặc trụ sở của bên có quyền.","b":"Khoản 2 Điều 277 BLDS 2015","lv":"NB","id":"6.12","g":6},{"q":"Căn cứ nào KHÔNG làm chấm dứt nghĩa vụ dân sự?","o":["Nghĩa vụ được hoàn thành","Bên có quyền miễn việc thực hiện nghĩa vụ","Nghĩa vụ được bù trừ","Bên có nghĩa vụ chuyển nơi cư trú"],"a":3,"e":"Thay đổi nơi cư trú chỉ phát sinh nghĩa vụ thông báo, không làm chấm dứt nghĩa vụ.","b":"Điều 372 BLDS 2015","lv":"TH","id":"6.13","g":6},{"q":"Trong biện pháp bảo lãnh, nếu không có thỏa thuận khác, bên bảo lãnh phải thực hiện nghĩa vụ thay cho bên được bảo lãnh khi:","o":["Bất cứ khi nào bên nhận bảo lãnh yêu cầu","Đến thời hạn mà bên được bảo lãnh không thực hiện hoặc thực hiện không đúng nghĩa vụ","Ngay khi ký hợp đồng bảo lãnh","Có quyết định của UBND"],"a":1,"e":"Các bên có thể thỏa thuận bên bảo lãnh chỉ thực hiện khi bên được bảo lãnh không có khả năng thực hiện nghĩa vụ.","b":"Điều 335 BLDS 2015","lv":"NB","id":"6.14","g":6},{"q":"Biện pháp bảo đảm phát sinh hiệu lực đối kháng với người thứ ba từ khi:","o":["Công chứng hợp đồng bảo đảm","Đăng ký biện pháp bảo đảm hoặc bên nhận bảo đảm nắm giữ, chiếm giữ tài sản bảo đảm","Ký hợp đồng bảo đảm","Đến hạn thực hiện nghĩa vụ"],"a":1,"e":"Hiệu lực đối kháng quyết định thứ tự ưu tiên thanh toán khi xử lý tài sản bảo đảm.","b":"Khoản 1 Điều 297 BLDS 2015; Nghị định 21/2021/NĐ-CP","lv":"TH","id":"6.15","g":6},{"q":"A vay của B 100 triệu đồng, thỏa thuận lãi suất 30%/năm. Hậu quả pháp lý:","o":["A không phải trả bất kỳ khoản lãi nào","Hợp đồng vay vô hiệu toàn bộ","Áp dụng đúng mức 30%/năm theo thỏa thuận","Mức lãi suất vượt quá 20%/năm không có hiệu lực; hợp đồng vẫn có hiệu lực"],"a":3,"e":"Chỉ phần lãi vượt trần bị vô hiệu (vô hiệu từng phần), khoản vay và lãi trong giới hạn vẫn có hiệu lực.","b":"Khoản 1 Điều 468, Điều 130 BLDS 2015","lv":"VD","id":"6.16","g":6},{"q":"Bên mua đặt cọc 50 triệu đồng để bảo đảm giao kết hợp đồng mua nhà; sau đó bên bán (bên nhận đặt cọc) từ chối giao kết, các bên không có thỏa thuận khác. Bên bán phải trả cho bên mua:","o":["50 triệu đồng","100 triệu đồng","150 triệu đồng","Không phải trả gì"],"a":1,"e":"Trả lại tài sản đặt cọc (50 triệu) và một khoản tiền tương đương giá trị tài sản đặt cọc (50 triệu). Nếu việc từ chối do trở ngại khách quan, tham khảo Án lệ 25/2018/AL và Nghị quyết 03/2026/NQ-HĐTP về trường hợp không bị phạt cọc.","b":"Khoản 2 Điều 328 BLDS 2015; Án lệ 25/2018/AL","lv":"VD","id":"6.17","g":6},{"q":"M, N, P liên đới nợ Q 90 triệu đồng (phần nghĩa vụ của mỗi người bằng nhau). M đã trả toàn bộ cho Q. M có quyền:","o":["Không được đòi ai","Yêu cầu N và P mỗi người hoàn trả cho mình 30 triệu đồng","Đòi Q trả lại 60 triệu đồng","Yêu cầu N hoàn trả 90 triệu đồng"],"a":1,"e":"Người đã thực hiện toàn bộ nghĩa vụ liên đới có quyền yêu cầu những người còn lại thực hiện phần nghĩa vụ của họ đối với mình.","b":"Khoản 2 Điều 288 BLDS 2015","lv":"VD","id":"6.18","g":6},{"q":"Trong hợp đồng vay không kỳ hạn và không có lãi, bên cho vay được đòi lại tài sản:","o":["Chỉ khi bên vay đồng ý","Chỉ sau 01 năm","Không được đòi","Bất cứ lúc nào nhưng phải báo trước cho bên vay một thời gian hợp lý"],"a":3,"e":"Bên vay cũng có quyền trả nợ vào bất cứ lúc nào.","b":"Khoản 1 Điều 469 BLDS 2015","lv":"VD","id":"6.19","g":6},{"q":"C nợ D 50 triệu đồng, D nợ C 30 triệu đồng; cả hai nghĩa vụ đều đã đến hạn, cùng là tiền. Sau khi bù trừ:","o":["Cả hai nghĩa vụ chấm dứt hoàn toàn","D còn nợ C 20 triệu đồng","Không được bù trừ","C còn nợ D 20 triệu đồng"],"a":3,"e":"Các bên có nghĩa vụ ngang nhau về tài sản cùng loại, đến hạn thì không phải thực hiện nghĩa vụ đối với nhau trong phạm vi tương ứng; phần chênh lệch vẫn phải thực hiện.","b":"Điều 378 BLDS 2015","lv":"VD","id":"6.20","g":6},{"q":"Theo Điều 385 BLDS 2015, hợp đồng là:","o":["Sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự","Quyết định của cơ quan có thẩm quyền về quyền, nghĩa vụ của các bên","Văn bản có chữ ký của các bên và được công chứng","Ý chí đơn phương của một bên được bên kia biết"],"a":0,"e":"Bản chất của hợp đồng là sự thỏa thuận (thống nhất ý chí) của các bên. Hình thức văn bản, công chứng chỉ bắt buộc khi luật quy định; ý chí đơn phương là hành vi pháp lý đơn phương.","b":"Điều 385 BLDS 2015","lv":"NB","id":"7.1","g":7},{"q":"Sự im lặng của bên được đề nghị được coi là chấp nhận đề nghị giao kết hợp đồng khi:","o":["Bên đề nghị ghi rõ trong đề nghị rằng im lặng là đồng ý","Có thỏa thuận hoặc theo thói quen đã được xác lập giữa các bên","Đã hết 30 ngày kể từ khi nhận đề nghị","Trong mọi trường hợp"],"a":1,"e":"Khoản 2 Điều 393: sự im lặng của bên được đề nghị không được coi là chấp nhận, trừ trường hợp có thỏa thuận hoặc theo thói quen đã được xác lập giữa các bên. Bên đề nghị không thể đơn phương áp đặt im lặng là đồng ý.","b":"Khoản 2 Điều 393 BLDS 2015","lv":"TH","id":"7.2","g":7},{"q":"Hợp đồng được giao kết hợp pháp có hiệu lực từ thời điểm nào, nếu không có thỏa thuận khác và luật không quy định khác?","o":["Thời điểm giao kết","Thời điểm thực hiện xong nghĩa vụ","Thời điểm công chứng","Thời điểm đăng ký tại cơ quan nhà nước"],"a":0,"e":"Khoản 1 Điều 401: hợp đồng giao kết hợp pháp có hiệu lực từ thời điểm giao kết, trừ trường hợp có thỏa thuận khác hoặc luật liên quan có quy định khác (ví dụ tặng cho động sản phải đăng ký có hiệu lực từ thời điểm đăng ký).","b":"Khoản 1 Điều 401 BLDS 2015","lv":"TH","id":"7.3","g":7},{"q":"Các bên thỏa thuận phạt vi phạm nhưng không thỏa thuận việc vừa phạt vi phạm vừa bồi thường thiệt hại. Theo BLDS 2015, khi có vi phạm:","o":["Bên bị vi phạm được chọn mức cao hơn giữa tiền phạt và thiệt hại","Bên vi phạm chỉ phải nộp tiền phạt vi phạm","Bên vi phạm chỉ phải bồi thường thiệt hại","Bên vi phạm phải vừa nộp phạt vừa bồi thường thiệt hại"],"a":1,"e":"Khoản 3 Điều 418: các bên có thể thỏa thuận bên vi phạm vừa phải nộp phạt vừa phải bồi thường; nếu chỉ thỏa thuận phạt vi phạm mà không thỏa thuận về việc vừa phạt vừa bồi thường thì bên vi phạm chỉ phải nộp phạt. Cách tiếp cận này khác Luật Thương mại 2005 (Điều 307).","b":"Khoản 3 Điều 418 BLDS 2015","lv":"TH","id":"7.4","g":7},{"q":"Hợp đồng mượn tài sản là hợp đồng:","o":["Luôn phải công chứng","Không có đền bù","Có đền bù","Có đối tượng là vật tiêu hao"],"a":1,"e":"Điều 494: bên mượn sử dụng tài sản trong một thời hạn mà không phải trả tiền, nên hợp đồng mượn là hợp đồng không có đền bù; đối tượng chỉ có thể là vật không tiêu hao (Điều 495).","b":"Điều 494 BLDS 2015","lv":"NB","id":"7.5","g":7},{"q":"Sau khi giao kết hợp đồng, hoàn cảnh thay đổi cơ bản theo Điều 420 BLDS 2015. Bên có lợi ích bị ảnh hưởng có quyền:","o":["Đơn phương chấm dứt hợp đồng ngay","Không có quyền gì vì hợp đồng đã giao kết","Yêu cầu bên kia đàm phán lại hợp đồng trong một thời hạn hợp lý; nếu không thỏa thuận được thì yêu cầu Tòa án chấm dứt hoặc sửa đổi hợp đồng","Ngừng thực hiện mọi nghĩa vụ cho đến khi hoàn cảnh trở lại bình thường"],"a":2,"e":"Điều 420: bên có lợi ích bị ảnh hưởng có quyền yêu cầu đàm phán lại trong thời hạn hợp lý; trong quá trình đàm phán các bên vẫn phải tiếp tục thực hiện nghĩa vụ, trừ trường hợp có thỏa thuận khác. Nếu không đạt được thỏa thuận, một trong các bên có thể yêu cầu Tòa án chấm dứt hoặc sửa đổi hợp đồng.","b":"Điều 420 BLDS 2015","lv":"VD","id":"7.6","g":7},{"q":"Hậu quả pháp lý của việc hủy bỏ hợp đồng là:","o":["Chỉ bên vi phạm phải hoàn trả","Hợp đồng chấm dứt từ thời điểm thông báo hủy, các bên không phải hoàn trả","Hợp đồng tạm ngừng thực hiện","Hợp đồng không có hiệu lực từ thời điểm giao kết; các bên hoàn trả cho nhau những gì đã nhận, trừ thỏa thuận về phạt vi phạm, bồi thường thiệt hại, giải quyết tranh chấp"],"a":3,"e":"Khoản 1, 2 Điều 427: khi hợp đồng bị hủy bỏ thì hợp đồng không có hiệu lực từ thời điểm giao kết, các bên không phải thực hiện nghĩa vụ đã thỏa thuận, trừ thỏa thuận về phạt vi phạm, bồi thường thiệt hại và giải quyết tranh chấp; các bên hoàn trả cho nhau những gì đã nhận. Chấm dứt từ thời điểm thông báo là hậu quả của đơn phương chấm dứt (Điều 428).","b":"Khoản 1, 2 Điều 427 BLDS 2015","lv":"TH","id":"7.7","g":7},{"q":"A tặng B một chiếc đồng hồ (động sản không phải đăng ký), không có thỏa thuận khác. Hợp đồng tặng cho có hiệu lực khi:","o":["A ký giấy tặng cho","A và B thỏa thuận xong","B nhận chiếc đồng hồ","Hợp đồng được công chứng"],"a":2,"e":"Điều 458: hợp đồng tặng cho động sản có hiệu lực kể từ thời điểm bên được tặng cho nhận tài sản, trừ trường hợp có thỏa thuận khác; đối với động sản phải đăng ký quyền sở hữu thì có hiệu lực từ thời điểm đăng ký.","b":"Điều 458 BLDS 2015","lv":"VD","id":"7.8","g":7},{"q":"Thời hiệu khởi kiện yêu cầu Tòa án giải quyết tranh chấp hợp đồng là:","o":["Không bị hạn chế","02 năm kể từ ngày giao kết hợp đồng","03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm","05 năm kể từ ngày hợp đồng hết hạn"],"a":2,"e":"Điều 429: thời hiệu 03 năm, bắt đầu từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích hợp pháp bị xâm phạm, không phải từ ngày giao kết.","b":"Điều 429 BLDS 2015","lv":"TH","id":"7.9","g":7},{"q":"Anh P thuê căn hộ của bà Q trong 2 năm. Anh P muốn cho người khác thuê lại một phòng. Điều kiện để anh P được cho thuê lại là:","o":["Báo cho công an khu vực","Thời hạn thuê lại không quá 6 tháng","Được bà Q (bên cho thuê) đồng ý","Không cần điều kiện gì"],"a":2,"e":"Điều 475: bên thuê có quyền cho thuê lại tài sản mà mình đã thuê nếu được bên cho thuê đồng ý.","b":"Điều 475 BLDS 2015","lv":"VD","id":"7.10","g":7},{"q":"Nếu bên đề nghị không ấn định, đề nghị giao kết hợp đồng có hiệu lực kể từ khi:","o":["Bên đề nghị gửi đề nghị đi","Đề nghị được công chứng","Bên đề nghị ký vào văn bản đề nghị","Bên được đề nghị nhận được đề nghị"],"a":3,"e":"Thời điểm có hiệu lực do bên đề nghị ấn định; nếu không ấn định thì kể từ khi bên được đề nghị nhận được.","b":"Khoản 1 Điều 388 BLDS 2015","lv":"NB","id":"7.11","g":7},{"q":"Thời điểm giao kết hợp đồng bằng văn bản là:","o":["Thời điểm bên đầu tiên ký","Thời điểm bên sau cùng ký vào văn bản hay bằng hình thức chấp nhận khác được thể hiện trên văn bản","Thời điểm công chứng","Thời điểm thanh toán"],"a":1,"e":"Hợp đồng bằng văn bản được giao kết khi bên sau cùng ký vào văn bản; công chứng chỉ là điều kiện về hình thức khi luật yêu cầu, không quyết định thời điểm giao kết.","b":"Khoản 4 Điều 400 BLDS 2015","lv":"NB","id":"7.12","g":7},{"q":"Mức phạt vi phạm trong hợp đồng dân sự theo BLDS 2015:","o":["Tối đa 8% giá trị phần nghĩa vụ bị vi phạm","Do các bên thỏa thuận, trừ trường hợp luật liên quan có quy định khác","Tối đa 12% giá trị hợp đồng","Tối đa 20% giá trị hợp đồng"],"a":1,"e":"Mức trần 8% là quy định của Luật Thương mại 2005 đối với hợp đồng thương mại, không phải BLDS.","b":"Khoản 2 Điều 418 BLDS 2015","lv":"TH","id":"7.13","g":7},{"q":"Hợp đồng nào sau đây là hợp đồng song vụ?","o":["Từ chối nhận di sản","Hợp đồng mua bán tài sản","Hứa thưởng","Hợp đồng tặng cho tài sản không có điều kiện"],"a":1,"e":"Trong hợp đồng mua bán, mỗi bên đều có nghĩa vụ đối với nhau (giao tài sản – trả tiền). Hứa thưởng và từ chối nhận di sản là hành vi pháp lý đơn phương.","b":"Điều 402, Điều 430 BLDS 2015","lv":"TH","id":"7.14","g":7},{"q":"Nếu không có thỏa thuận khác và tài sản không phải đăng ký, rủi ro đối với tài sản mua bán:","o":["Bên bán chịu cho đến khi được thanh toán đủ","Hai bên chia đôi","Bên bán chịu trước khi tài sản được giao; bên mua chịu kể từ thời điểm nhận tài sản","Bên mua chịu ngay khi ký hợp đồng"],"a":2,"e":"Với tài sản phải đăng ký thì bên mua chịu rủi ro kể từ thời điểm hoàn thành thủ tục đăng ký (khoản 2 Điều 441).","b":"Khoản 1 Điều 441 BLDS 2015","lv":"TH","id":"7.15","g":7},{"q":"Công ty X thuê máy xúc của ông Y, thỏa thuận trả tiền thuê theo tháng. X không trả tiền thuê trong ba tháng liên tiếp. Quyền của ông Y:","o":["Đơn phương chấm dứt thực hiện hợp đồng, trừ trường hợp có thỏa thuận khác hoặc luật có quy định khác","Chỉ được yêu cầu phạt vi phạm","Phải chờ hết thời hạn thuê","Phải xin phép Tòa án trước khi chấm dứt"],"a":0,"e":"Bên đơn phương chấm dứt phải thông báo ngay cho bên kia; nếu không thông báo mà gây thiệt hại thì phải bồi thường.","b":"Khoản 3 Điều 481, Điều 428 BLDS 2015","lv":"VD","id":"7.16","g":7},{"q":"Trong hợp đồng vay có kỳ hạn và có lãi, bên vay trả nợ trước hạn thì:","o":["Không phải trả lãi","Chỉ trả lãi tính đến thời điểm trả nợ","Phải trả toàn bộ lãi theo kỳ hạn, trừ trường hợp có thỏa thuận khác hoặc luật có quy định khác","Bị phạt 20% khoản vay"],"a":2,"e":"Quy định bảo vệ lợi ích hợp lý của bên cho vay đã tính toán theo kỳ hạn.","b":"Khoản 2 Điều 470 BLDS 2015","lv":"VD","id":"7.17","g":7},{"q":"E ủy quyền có thù lao cho F làm thủ tục mua nhà. F muốn đơn phương chấm dứt hợp đồng. Phát biểu đúng là:","o":["F chỉ được chấm dứt khi E đồng ý","F không được đơn phương chấm dứt","F có quyền đơn phương chấm dứt bất cứ lúc nào và phải bồi thường thiệt hại cho E, nếu có","F phải trả lại gấp đôi thù lao"],"a":2,"e":"Nếu ủy quyền không có thù lao, bên được ủy quyền có quyền chấm dứt bất cứ lúc nào nhưng phải báo trước một thời gian hợp lý.","b":"Khoản 2 Điều 569 BLDS 2015","lv":"VD","id":"7.18","g":7},{"q":"Hợp đồng chuyển nhượng quyền sử dụng đất giữa hai cá nhân phải tuân thủ hình thức nào?","o":["Lập thành văn bản và được công chứng hoặc chứng thực","Giấy viết tay không cần công chứng","Đăng ký tại Tòa án","Bằng lời nói có người làm chứng"],"a":0,"e":"Trừ trường hợp một bên hoặc các bên là tổ chức hoạt động kinh doanh bất động sản thì công chứng, chứng thực theo yêu cầu. Việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký vào sổ địa chính.","b":"Điều 502, Điều 503 BLDS 2015; điểm a khoản 3 Điều 27 Luật Đất đai 2024","lv":"VD","id":"7.19","g":7},{"q":"A bán cho B một lô hàng, không thỏa thuận thời hạn thanh toán. B phải thanh toán:","o":["Ngay tại thời điểm nhận tài sản","Khi A yêu cầu, bấ
