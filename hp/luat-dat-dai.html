2024","cid":"TH2.07"},{"id":"TH2.07.5","g":2,"lv":"VD","q":"Nhà chùa có được thế chấp quyền sử dụng đất khuôn viên để vay vốn không?","o":["Không, vì tổ chức tôn giáo được giao đất không thu tiền không có quyền thế chấp quyền sử dụng đất","Được, nếu Ủy ban nhân dân tỉnh chấp thuận","Được, nếu tín đồ đồng ý","Được, tại tổ chức tín dụng hoạt động tại Việt Nam"],"a":0,"e":"Khoản 2 Điều 32 Luật Đất đai 2024: tổ chức tôn giáo được Nhà nước giao đất không thu tiền sử dụng đất không có quyền chuyển đổi, chuyển nhượng, tặng cho, cho thuê quyền sử dụng đất; không được thế chấp, góp vốn bằng quyền sử dụng đất. Ý kiến tín đồ hay chấp thuận của UBND tỉnh không làm phát sinh quyền này.","b":"Khoản 2 Điều 32 Luật Đất đai 2024","cid":"TH2.07"},{"id":"TH2.08.1","g":2,"lv":"VD","q":"Công ty Hưng Thịnh có được chuyển 30 ha sang trả tiền thuê đất một lần không?","o":["Được chuyển sang trả tiền thuê một lần cho toàn bộ hoặc từng phần diện tích","Không, hình thức trả tiền thuê đất không được thay đổi","Chỉ được nếu chuyển toàn bộ 100 ha","Chỉ được khi đã cho thuê lại hết diện tích"],"a":0,"e":"Khoản 3 Điều 202 Luật Đất đai 2024: nhà đầu tư kinh doanh kết cấu hạ tầng khu công nghiệp được Nhà nước cho thuê đất trả tiền hằng năm được chuyển sang hình thức thuê đất trả tiền một lần cho toàn bộ hoặc từng phần diện tích. Công ty Hưng Thịnh được chuyển 30 ha.","b":"Khoản 3 Điều 202 Luật Đất đai 2024","cid":"TH2.08"},{"id":"TH2.08.2","g":2,"lv":"VD","q":"Việc cho Công ty Khánh An thuê lại 5 ha thuộc phần đất trả tiền hằng năm theo hình thức trả tiền một lần có hợp pháp không?","o":["Hợp pháp với điều kiện thời hạn thuê lại dưới 40 năm","Chỉ hợp pháp khi Khánh An là doanh nghiệp trong nước","Không, phần đất trả tiền thuê hằng năm chỉ được cho thuê lại theo hình thức trả tiền hằng năm","Hợp pháp, các bên được tự do thỏa thuận hình thức trả tiền"],"a":2,"e":"Khoản 3 Điều 202 Luật Đất đai 2024: đối với phần diện tích thuê đất trả tiền hằng năm thì nhà đầu tư chỉ được cho thuê lại đất theo hình thức trả tiền thuê đất hằng năm. Việc cho Khánh An thuê lại trả tiền một lần trên phần đất này là trái luật.","b":"Khoản 3 Điều 202 Luật Đất đai 2024","cid":"TH2.08"},{"id":"TH2.08.3","g":2,"lv":"VD","q":"Công ty Hưng Thịnh có phải nộp tiền thuê đất cho 8 ha đường nội bộ và hệ thống xử lý nước thải dùng chung không?","o":["Phải nộp tiền thuê đất hằng năm","Phải nộp 50% tiền thuê đất","Không phải nộp tiền thuê đất","Phải nộp tiền sử dụng đất một lần"],"a":2,"e":"Khoản 3 Điều 202 Luật Đất đai 2024: nhà đầu tư không phải nộp tiền thuê đất đối với diện tích đất xây dựng kết cấu hạ tầng sử dụng chung (đường nội bộ, hệ thống xử lý nước thải…) trong khu công nghiệp theo quy hoạch đã được phê duyệt.","b":"Khoản 3 Điều 202 Luật Đất đai 2024","cid":"TH2.08"},{"id":"TH2.08.4","g":2,"lv":"VD","q":"Dự án của Khánh An có thời hạn 60 năm, dài hơn 40 năm còn lại của khu công nghiệp. Hướng xử lý nào đúng?","o":["Khánh An được sử dụng 60 năm mà không phải làm thủ tục","Chủ đầu tư xin điều chỉnh thời hạn sử dụng đất, tổng thời hạn không quá 70 năm và phải nộp tiền cho phần thời hạn tăng thêm","Nhà nước tự động gia hạn khu công nghiệp lên 99 năm","Dự án phải rút ngắn xuống 40 năm, không được điều chỉnh"],"a":1,"e":"Khoản 4 Điều 202 Luật Đất đai 2024: trường hợp thời hạn dự án đầu tư trong khu công nghiệp dài hơn thời hạn sử dụng đất còn lại của khu công nghiệp thì chủ đầu tư hạ tầng được điều chỉnh thời hạn sử dụng đất cho phù hợp nhưng tổng thời hạn không quá 70 năm và phải nộp tiền thuê đất cho phần thời hạn tăng thêm.","b":"Khoản 4 Điều 202 Luật Đất đai 2024","cid":"TH2.08"},{"id":"TH2.09.1","g":2,"lv":"VD","q":"Thời hạn sử dụng 200 m² đất ở của bà Nga sau khi chuyển mục đích là gì?","o":["Thời hạn còn lại đến năm 2050","Ổn định lâu dài","50 năm kể từ năm 2026","70 năm kể từ năm 2026"],"a":1,"e":"Điểm d khoản 1 Điều 173 Luật Đất đai 2024: chuyển đất nông nghiệp sang đất phi nông nghiệp thì thời hạn được xác định theo thời hạn của loại đất sau khi chuyển; đất ở là đất sử dụng ổn định lâu dài (khoản 1 Điều 171). Vì vậy 200 m² đất ở của bà Nga sử dụng ổn định lâu dài.","b":"Điểm d khoản 1 Điều 173, khoản 1 Điều 171 Luật Đất đai 2024","cid":"TH2.09"},{"id":"TH2.09.2","g":2,"lv":"VD","q":"Thời hạn sử dụng 300 m² đất trồng cây lâu năm của ông Lực được xác định thế nào?","o":["Ổn định lâu dài","Theo thỏa thuận giữa bà Nga và ông Lực","Thời hạn mới 50 năm từ năm 2026","Thời hạn còn lại đến năm 2050; hết hạn được tiếp tục sử dụng mà không phải gia hạn"],"a":3,"e":"Khoản 1 Điều 174 Luật Đất đai 2024: ông Lực nhận chuyển nhượng đất có thời hạn nên được sử dụng thời gian còn lại (đến năm 2050). Là cá nhân trực tiếp sản xuất nông nghiệp, khi hết hạn ông được tiếp tục sử dụng mà không phải gia hạn (điểm a khoản 1 Điều 172).","b":"Khoản 1 Điều 174, điểm a khoản 1 Điều 172 Luật Đất đai 2024","cid":"TH2.09"},{"id":"TH2.09.3","g":2,"lv":"VD","q":"Thời hạn sử dụng 300 m² đất ở của ông Bảo (chuyển từ đất thương mại, dịch vụ thuê 30 năm) là gì?","o":["50 năm kể từ ngày được phép chuyển mục đích","Thời hạn còn lại của hợp đồng thuê 30 năm","Ổn định lâu dài","Theo thời hạn của dự án đầu tư"],"a":2,"e":"Khoản 3 Điều 173 Luật Đất đai 2024: trường hợp chuyển mục đích từ đất phi nông nghiệp sử dụng có thời hạn sang đất phi nông nghiệp sử dụng ổn định lâu dài (như đất ở) thì thời hạn sử dụng đất là ổn định lâu dài.","b":"Khoản 3 Điều 173 Luật Đất đai 2024","cid":"TH2.09"},{"id":"TH2.09.4","g":2,"lv":"VD","q":"Bà Nga phải thực hiện nghĩa vụ tài chính gì khi được chuyển 200 m² sang đất ở?","o":["Nộp tiền thuê đất hằng năm","Không phải nộp khoản nào","Nộp tiền sử dụng đất","Nộp lệ phí trước bạ thay cho tiền sử dụng đất"],"a":2,"e":"Khoản 2 Điều 121 Luật Đất đai 2024: khi chuyển mục đích sử dụng đất, người sử dụng đất phải thực hiện nghĩa vụ tài chính theo quy định; chuyển từ đất nông nghiệp được giao trong hạn mức sang đất ở thì phải nộp tiền sử dụng đất (theo pháp luật về thu tiền sử dụng đất).","b":"Khoản 2 Điều 121 Luật Đất đai 2024","cid":"TH2.09"},{"id":"TH2.10.1","g":2,"lv":"VD","q":"Ông Dũng đã có 20 ha đất rừng sản xuất là rừng trồng. Ông được giao thêm không thu tiền tối đa bao nhiêu?","o":["15 ha","Không được giao thêm","5 ha","10 ha; phần vượt hạn mức phải chuyển sang thuê đất"],"a":3,"e":"Điểm b khoản 3 Điều 176 Luật Đất đai 2024: hạn mức giao đất rừng sản xuất là rừng trồng cho cá nhân không quá 30 ha. Ông Dũng đã có 20 ha nên được giao thêm tối đa 10 ha không thu tiền; phần vượt hạn mức (5 ha) phải chuyển sang thuê đất (điểm a khoản 1 Điều 184).","b":"Điểm b khoản 3 Điều 176, điểm a khoản 1 Điều 184 Luật Đất đai 2024","cid":"TH2.10"},{"id":"TH2.10.2","g":2,"lv":"VD","q":"Thời hạn sử dụng đất rừng sản xuất là rừng trồng giao cho ông Dũng trong hạn mức là bao lâu?","o":["50 năm; hết hạn được tiếp tục sử dụng mà không phải gia hạn","70 năm","Ổn định lâu dài","30 năm"],"a":0,"e":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024: đất rừng sản xuất là rừng trồng giao cho cá nhân trong hạn mức có thời hạn 50 năm; hết hạn được tiếp tục sử dụng mà không phải làm thủ tục gia hạn.","b":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024","cid":"TH2.10"},{"id":"TH2.10.3","g":2,"lv":"VD","q":"Đất chăn nuôi tập trung mà Công ty Green Farm muốn sử dụng thuộc nhóm đất nào?","o":["Nhóm đất chưa sử dụng","Nhóm đất nông nghiệp","Đất khu công nghiệp","Nhóm đất phi nông nghiệp"],"a":1,"e":"Điểm đ khoản 2 Điều 9 Luật Đất đai 2024: đất chăn nuôi tập trung là một loại đất trong nhóm đất nông nghiệp (Luật 2024 bổ sung loại đất này). Đây không phải đất phi nông nghiệp hay đất khu công nghiệp.","b":"Điểm đ khoản 2 Điều 9 Luật Đất đai 2024","cid":"TH2.10"},{"id":"TH2.10.4","g":2,"lv":"VD","q":"Anh Tú sống ở thành phố có được nhận chuyển nhượng thửa đất ở trong khu vực rừng phòng hộ của xã Sơn Hà không?","o":["Không, cá nhân không sinh sống trong khu vực rừng phòng hộ không được nhận chuyển nhượng đất ở trong khu vực đó","Được, nếu diện tích dưới 300 m²","Được, nếu thửa đất đã có Giấy chứng nhận","Được, nếu Ủy ban nhân dân xã đồng ý"],"a":0,"e":"Khoản 8 Điều 45 Luật Đất đai 2024: cá nhân không sinh sống trong khu vực rừng phòng hộ, rừng đặc dụng thì không được nhận chuyển nhượng, nhận tặng cho quyền sử dụng đất ở và đất khác trong khu vực đó. Anh Tú sống ở thành phố nên không được nhận chuyển nhượng.","b":"Khoản 8 Điều 45 Luật Đất đai 2024","cid":"TH2.10"},{"id":"3.01","g":3,"lv":"NB","q":"Cơ quan nào thống nhất quản lý nhà nước về đất đai trong phạm vi cả nước?","o":["Chính phủ","Ủy ban Thường vụ Quốc hội","Bộ Nông nghiệp và Môi trường","Quốc hội"],"a":0,"e":"Khoản 1 Điều 21 Luật Đất đai 2024: Chính phủ thống nhất quản lý nhà nước về đất đai trong phạm vi cả nước. Bộ Nông nghiệp và Môi trường chịu trách nhiệm trước Chính phủ trong việc thực hiện quản lý (khoản 2); Quốc hội thực hiện quyền đại diện chủ sở hữu và giám sát tối cao.","b":"Khoản 1 Điều 21 Luật Đất đai 2024"},{"id":"3.02","g":3,"lv":"NB","q":"Hoạt động nào sau đây thuộc nội dung quản lý nhà nước về đất đai theo Điều 20 Luật Đất đai 2024?","o":["Xét xử vụ án hình sự về tội vi phạm quy định về quản lý đất đai","Công chứng hợp đồng chuyển nhượng quyền sử dụng đất","Giải quyết tranh chấp đất đai; giải quyết khiếu nại, tố cáo về đất đai","Định giá cổ phần của doanh nghiệp có tài sản là quyền sử dụng đất"],"a":2,"e":"Khoản 16 Điều 20 Luật Đất đai 2024: giải quyết tranh chấp đất đai; giải quyết khiếu nại, tố cáo về đất đai là một nội dung quản lý nhà nước về đất đai. Xét xử hình sự thuộc Tòa án; công chứng, định giá cổ phần không phải nội dung quản lý nhà nước về đất đai.","b":"Khoản 16 Điều 20 Luật Đất đai 2024"},{"id":"3.03","g":3,"lv":"NB","q":"Hoạt động điều tra, đánh giá chất lượng đất, thoái hóa đất, ô nhiễm đất được thực hiện theo chu kỳ nào?","o":["Chỉ khi có yêu cầu của Bộ trưởng","Hằng năm","Định kỳ 10 năm một lần","Định kỳ 05 năm một lần"],"a":3,"e":"Khoản 3 Điều 52 Luật Đất đai 2024: điều tra, đánh giá chất lượng đất, thoái hóa đất, ô nhiễm đất được thực hiện định kỳ 05 năm một lần (và theo chuyên đề khi cần). Thống kê đất đai mới thực hiện hằng năm.","b":"Khoản 3 Điều 52 Luật Đất đai 2024"},{"id":"3.04","g":3,"lv":"NB","q":"Kiểm kê đất đai định kỳ được thực hiện tính đến hết ngày 31 tháng 12 của năm nào?","o":["Năm cuối của thời kỳ quy hoạch sử dụng đất","Mọi năm chẵn","Năm có chữ số tận cùng là 0 hoặc 5","Năm có chữ số tận cùng là 4 hoặc 9"],"a":3,"e":"Điểm b khoản 2 Điều 57 Luật Đất đai 2024: kiểm kê đất đai định kỳ được thực hiện 05 năm một lần, tính đến hết ngày 31 tháng 12 của năm có chữ số tận cùng là 4 hoặc 9 (2024, 2029…). Thống kê thực hiện hằng năm, trừ năm thực hiện kiểm kê.","b":"Điểm b khoản 2 Điều 57 Luật Đất đai 2024"},{"id":"3.05","g":3,"lv":"NB","q":"Thời kỳ kế hoạch sử dụng đất quốc gia và kế hoạch sử dụng đất cấp tỉnh là bao lâu?","o":["Hằng năm","10 năm","03 năm","05 năm"],"a":3,"e":"Khoản 4 Điều 62 Luật Đất đai 2024: thời kỳ quy hoạch sử dụng đất là 10 năm; thời kỳ kế hoạch sử dụng đất quốc gia, kế hoạch sử dụng đất cấp tỉnh là 05 năm.","b":"Khoản 4 Điều 62 Luật Đất đai 2024"},{"id":"3.06","g":3,"lv":"TH","q":"Theo nguyên tắc lập quy hoạch sử dụng đất, thứ tự quyết định, phê duyệt quy hoạch các cấp được xác định thế nào?","o":["Quy hoạch cấp thấp hơn được phê duyệt trước để làm cơ sở cho cấp cao hơn","Quy hoạch cấp cao hơn phải được quyết định, phê duyệt trước quy hoạch cấp thấp hơn","Quy hoạch nào hoàn thành hồ sơ trước thì phê duyệt trước","Các cấp được phê duyệt độc lập, không phụ thuộc thứ tự"],"a":1,"e":"Khoản 9 Điều 60 Luật Đất đai 2024: quy hoạch sử dụng đất cấp trên phải được quyết định, phê duyệt trước quy hoạch sử dụng đất cấp dưới; quy hoạch cấp dưới phải phù hợp quy hoạch cấp trên. Điều này bảo đảm tính thống nhất, thứ bậc của hệ thống quy hoạch.","b":"Khoản 9 Điều 60 Luật Đất đai 2024"},{"id":"3.07","g":3,"lv":"TH","q":"Quy hoạch sử dụng đất quốc phòng thuộc loại quy hoạch nào trong hệ thống quy hoạch quốc gia?","o":["Quy hoạch đô thị","Quy hoạch ngành quốc gia","Quy hoạch tỉnh","Quy hoạch xây dựng vùng liên huyện"],"a":1,"e":"Khoản 2 Điều 61 và khoản 1 Điều 68 Luật Đất đai 2024: quy hoạch sử dụng đất quốc phòng, quy hoạch sử dụng đất an ninh là quy hoạch ngành quốc gia trong hệ thống quy hoạch quốc gia theo Luật Quy hoạch, do Bộ Quốc phòng, Bộ Công an tổ chức lập.","b":"Khoản 2 Điều 61, khoản 1 Điều 68 Luật Đất đai 2024"},{"id":"3.08","g":3,"lv":"NB","q":"Quan hệ giao đất giữa Nhà nước và người sử dụng đất được xác lập bằng hình thức pháp lý nào?","o":["Quyết định giao đất của cơ quan nhà nước có thẩm quyền","Văn bản công chứng thỏa thuận giao đất","Biên bản hòa giải tại Ủy ban nhân dân cấp xã","Hợp đồng giao quyền sử dụng đất"],"a":0,"e":"Khoản 34 Điều 3 Luật Đất đai 2024: Nhà nước giao quyền sử dụng đất (giao đất) là việc Nhà nước ban hành quyết định giao đất để trao quyền sử dụng đất cho đối tượng có nhu cầu sử dụng đất. Hình thức pháp lý là quyết định hành chính, không phải hợp đồng hay văn bản công chứng (khác cho thuê đất có hợp đồng thuê).","b":"Khoản 34 Điều 3 Luật Đất đai 2024"},{"id":"3.09","g":3,"lv":"NB","q":"Cá nhân trực tiếp sản xuất nông nghiệp được Nhà nước giao đất nông nghiệp trong hạn mức theo hình thức nào?","o":["Cho thuê đất trả tiền hằng năm","Giao đất có thu tiền sử dụng đất","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền một lần"],"a":2,"e":"Khoản 1 Điều 118 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất đối với cá nhân trực tiếp sản xuất nông nghiệp, lâm nghiệp, nuôi trồng thủy sản, làm muối được giao đất nông nghiệp trong hạn mức. Vượt hạn mức thì phải thuê đất.","b":"Khoản 1 Điều 118 Luật Đất đai 2024"},{"id":"3.10","g":3,"lv":"NB","q":"Cá nhân được Nhà nước giao đất ở thì thuộc trường hợp nào?","o":["Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền hằng năm","Giao đất có thu tiền sử dụng đất","Công nhận quyền sử dụng đất"],"a":2,"e":"Điều 119 Luật Đất đai 2024: Nhà nước giao đất có thu tiền sử dụng đất trong trường hợp cá nhân được giao đất ở (cùng với các trường hợp tổ chức kinh tế thực hiện dự án nhà ở thương mại để bán…). Công nhận quyền sử dụng đất chỉ áp dụng với người đang sử dụng đất ổn định.","b":"Điều 119 Luật Đất đai 2024"},{"id":"3.11","g":3,"lv":"NB","q":"Đơn vị sự nghiệp công lập sử dụng đất xây dựng công trình sự nghiệp được Nhà nước trao quyền sử dụng đất theo hình thức nào?","o":["Cho thuê đất trả tiền một lần","Giao đất có thu tiền sử dụng đất","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền hằng năm"],"a":2,"e":"Khoản 4 Điều 118 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất cho đơn vị sự nghiệp công lập sử dụng đất xây dựng công trình sự nghiệp (trường hợp không lựa chọn thuê đất). Đây là đất phục vụ hoạt động sự nghiệp công, không nhằm kinh doanh.","b":"Khoản 4 Điều 118 Luật Đất đai 2024"},{"id":"3.12","g":3,"lv":"TH","q":"Trường hợp chuyển mục đích nào trong nội bộ nhóm đất nông nghiệp phải được cơ quan nhà nước có thẩm quyền cho phép?","o":["Chuyển đất trồng cây lâu năm sang đất trồng cây hằng năm khác","Chuyển đất trồng lúa sang đất trồng cây lâu năm","Chuyển đất nuôi trồng thủy sản sang đất trồng cây hằng năm khác","Chuyển đất trồng cây hằng năm khác sang đất nuôi trồng thủy sản"],"a":1,"e":"Điểm a khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất trồng lúa, đất rừng đặc dụng, rừng phòng hộ, rừng sản xuất sang loại đất khác trong nhóm đất nông nghiệp phải được cơ quan có thẩm quyền cho phép. Các trường hợp chuyển giữa đất trồng cây hằng năm khác, cây lâu năm, nuôi trồng thủy sản không thuộc khoản 1 nên không phải xin phép (khoản 3).","b":"Điểm a khoản 1, khoản 3 Điều 121 Luật Đất đai 2024"},{"id":"3.13","g":3,"lv":"TH","q":"Trường hợp chuyển mục đích nào sau đây phải được cơ quan nhà nước có thẩm quyền cho phép?","o":["Chuyển đất trồng cây hằng năm khác sang đất trồng cây lâu năm","Chuyển đất thương mại, dịch vụ sang đất cơ sở sản xuất phi nông nghiệp","Chuyển đất phi nông nghiệp không phải đất ở sang đất ở","Chuyển đất ở sang đất thương mại, dịch vụ"],"a":2,"e":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất phi nông nghiệp không phải là đất ở sang đất ở phải được cơ quan có thẩm quyền cho phép. Chuyển đất ở sang đất thương mại, dịch vụ hay giữa các loại đất sản xuất kinh doanh phi nông nghiệp không thuộc diện phải xin phép.","b":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024"},{"id":"3.14","g":3,"lv":"TH","q":"Đăng ký đất đai có tính chất pháp lý như thế nào đối với người sử dụng đất?","o":["Theo yêu cầu của người sử dụng đất","Bắt buộc đối với người sử dụng đất và người được giao đất để quản lý","Bắt buộc riêng đối với tổ chức kinh tế","Bắt buộc riêng khi chuyển nhượng quyền sử dụng đất"],"a":1,"e":"Khoản 1 Điều 131 Luật Đất đai 2024: đăng ký đất đai là bắt buộc đối với người sử dụng đất và người được giao đất để quản lý. Đăng ký không chỉ đặt ra khi chuyển nhượng hay đối với tổ chức kinh tế.","b":"Khoản 1 Điều 131 Luật Đất đai 2024"},{"id":"3.15","g":3,"lv":"TH","q":"Việc đăng ký quyền sở hữu nhà ở, công trình xây dựng gắn liền với đất được thực hiện thế nào?","o":["Theo yêu cầu của chủ sở hữu","Bắt buộc trong 30 ngày kể từ ngày hoàn thành xây dựng","Chỉ thực hiện khi Nhà nước thu hồi đất","Bắt buộc như đăng ký đất đai"],"a":0,"e":"Khoản 2 Điều 131 Luật Đất đai 2024: đăng ký quyền sở hữu nhà ở, công trình xây dựng gắn liền với đất được thực hiện theo yêu cầu của chủ sở hữu. Khác với đăng ký đất đai là bắt buộc.","b":"Khoản 2 Điều 131 Luật Đất đai 2024"},{"id":"3.16","g":3,"lv":"NB","q":"Đăng ký đất đai bằng hình thức điện tử có giá trị pháp lý thế nào so với đăng ký trên giấy?","o":["Chỉ áp dụng được cho đăng ký biến động","Giá trị thấp hơn đăng ký trên giấy","Có giá trị pháp lý như nhau","Chỉ để tham khảo cho đến khi nộp bản giấy"],"a":2,"e":"Khoản 3 Điều 131 Luật Đất đai 2024: đăng ký đất đai, tài sản gắn liền với đất gồm đăng ký trên giấy và đăng ký điện tử; hai hình thức có giá trị pháp lý như nhau.","b":"Khoản 3 Điều 131 Luật Đất đai 2024"},{"id":"3.17","g":3,"lv":"TH","q":"Trường hợp nào sau đây KHÔNG được cấp Giấy chứng nhận?","o":["Đất ở của cá nhân đang sử dụng ổn định, không tranh chấp","Đất tổ chức kinh tế được Nhà nước cho thuê","Đất nông nghiệp sử dụng vào mục đích công ích","Đất tín ngưỡng của cộng đồng dân cư"],"a":2,"e":"Điều 151 Luật Đất đai 2024 liệt kê các trường hợp không cấp Giấy chứng nhận, trong đó có đất nông nghiệp sử dụng vào mục đích công ích do UBND cấp xã quản lý. Đất tín ngưỡng của cộng đồng, đất ở cá nhân sử dụng ổn định, đất tổ chức kinh tế thuê của Nhà nước đều được cấp Giấy chứng nhận.","b":"Điều 151 Luật Đất đai 2024"},{"id":"3.18","g":3,"lv":"TH","q":"Người thuê đất được cấp Giấy chứng nhận trong trường hợp nào?","o":["Thuê lại đất của hộ gia đình đã có Giấy chứng nhận","Thuê, thuê lại đất của chủ đầu tư xây dựng kinh doanh kết cấu hạ tầng phù hợp với dự án đã được phê duyệt","Thuê đất nông nghiệp công ích của Ủy ban nhân dân cấp xã","Thuê đất trồng rau của một cá nhân trong thời hạn trên 05 năm"],"a":1,"e":"Điều 151 Luật Đất đai 2024: người thuê, thuê lại đất của người sử dụng đất không được cấp Giấy chứng nhận, trừ trường hợp thuê, thuê lại đất của nhà đầu tư xây dựng, kinh doanh kết cấu hạ tầng (khu công nghiệp, cụm công nghiệp…) phù hợp với dự án đầu tư đã được phê duyệt. Thuê đất của cá nhân, thuê đất công ích không được cấp.","b":"Điều 151 Luật Đất đai 2024"},{"id":"3.19","g":3,"lv":"NB","q":"Quyền sử dụng đất là tài sản chung của vợ chồng thì Giấy chứng nhận được ghi tên như thế nào?","o":["Ghi cả họ, tên vợ và họ, tên chồng, trừ trường hợp vợ chồng thỏa thuận ghi tên một người làm đại diện","Ghi \"Hộ gia đình\" kèm tên người đại diện","Chỉ ghi tên người chồng là chủ hộ","Ghi tên người trực tiếp trả tiền nhận chuyển nhượng"],"a":0,"e":"Khoản 4 Điều 135 Luật Đất đai 2024: trường hợp quyền sử dụng đất là tài sản chung của vợ và chồng thì phải ghi cả họ, tên vợ và họ, tên chồng vào Giấy chứng nhận, trừ trường hợp vợ và chồng có thỏa thuận ghi tên một người để đứng tên làm đại diện. Luật 2024 không còn ghi 'hộ gia đình'.","b":"Khoản 4 Điều 135 Luật Đất đai 2024"},{"id":"3.20","g":3,"lv":"TH","q":"Thửa đất đã có quyết định thu hồi đất nhưng chưa thực hiện thì được xem xét cấp Giấy chứng nhận khi nào?","o":["Khi người sử dụng đất khiếu nại quyết định thu hồi","Không được cấp trong mọi trường hợp","Đã quá 03 năm kể từ thời điểm có quyết định thu hồi mà không thực hiện","Đã quá 12 tháng kể từ thời điểm có quyết định thu hồi"],"a":2,"e":"Điều 151 Luật Đất đai 2024: đất đã có quyết định thu hồi thì không cấp Giấy chứng nhận, trừ trường hợp đã quá 03 năm kể từ thời điểm có quyết định thu hồi đất mà không thực hiện. Quy định nhằm bảo vệ người sử dụng đất khỏi tình trạng 'treo' quyết định thu hồi.","b":"Điều 151 Luật Đất đai 2024"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Hoạt động (2) thống kê đất đai năm 2025 thuộc nội dung quản lý nhà nước về đất đai nào?","o":["Đo đạc, lập bản đồ về đất đai","Điều tra, đánh giá đất đai","Quản lý tài chính về đất đai","Thống kê, kiểm kê đất đai"],"a":3,"e":"Khoản 13 Điều 20 Luật Đất đai 2024: thống kê, kiểm kê đất đai là một nội dung quản lý nhà nước về đất đai. Thống kê đất đai năm 2025 là việc tổng hợp, đánh giá hiện trạng sử dụng đất trên hồ sơ địa chính.","b":"Khoản 13 Điều 20 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Hoạt động (3) cấp Giấy chứng nhận lần đầu cho các hộ dân thuộc nội dung quản lý nhà nước về đất đai nào?","o":["Đăng ký đất đai, lập và quản lý hồ sơ địa chính, cấp Giấy chứng nhận","Phát triển, quản lý và khai thác quỹ đất","Giao đất, cho thuê đất, công nhận quyền sử dụng đất theo hình thức hợp đồng","Cung cấp dịch vụ công về đất đai của tổ chức tư nhân"],"a":0,"e":"Khoản 12 Điều 20 Luật Đất đai 2024: đăng ký đất đai, tài sản gắn liền với đất; lập và quản lý hồ sơ địa chính; cấp, đính chính, thu hồi, hủy Giấy chứng nhận là nội dung quản lý nhà nước. Cấp Giấy chứng nhận lần đầu thuộc nội dung này, không phải giao đất hay dịch vụ tư nhân.","b":"Khoản 12 Điều 20 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Ý kiến \"ở cấp xã không có người làm công tác quản lý đất đai\" được đánh giá thế nào?","o":["Không đúng, vì cấp xã có Văn phòng đăng ký đất đai độc lập","Đúng, việc quản lý đất đai chỉ được tổ chức ở cấp tỉnh","Đúng, cấp xã chỉ có tổ chức đăng ký đất đai","Không đúng, Ủy ban nhân dân cấp xã có công chức làm công tác địa chính giúp quản lý đất đai"],"a":3,"e":"Khoản 5 Điều 22 Luật Đất đai 2024: UBND cấp xã có công chức làm công tác địa chính có trách nhiệm giúp UBND cấp xã trong việc quản lý đất đai tại địa phương. Văn phòng đăng ký đất đai được tổ chức ở cấp tỉnh (có chi nhánh), không phải ở cấp xã.","b":"Khoản 5 Điều 22 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Tổ chức nào sau đây là tổ chức dịch vụ công về đất đai?","o":["Ủy ban Mặt trận Tổ quốc tỉnh","Hội đồng nhân dân tỉnh","Thanh tra tỉnh","Tổ chức phát triển quỹ đất"],"a":3,"e":"Khoản 4 Điều 22 Luật Đất đai 2024: tổ chức dịch vụ công về đất đai gồm Văn phòng đăng ký đất đai, tổ chức phát triển quỹ đất và các tổ chức khác theo quy định. HĐND, Mặt trận, Thanh tra không phải tổ chức dịch vụ công về đất đai.","b":"Khoản 4 Điều 22 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.5","g":3,"lv":"VD","q":"Ủy ban Mặt trận Tổ quốc Việt Nam tỉnh P có quyền phản biện xã hội đối với dự thảo quy hoạch sử dụng đất cấp tỉnh không?","o":["Không, chỉ Ủy ban Trung ương Mặt trận mới có quyền phản biện","Không, vì quy hoạch sử dụng đất là tài liệu mật","Chỉ khi Hội đồng nhân dân tỉnh yêu cầu","Có, Ủy ban Mặt trận các cấp phản biện xã hội đối với dự thảo quy hoạch, kế hoạch sử dụng đất cùng cấp"],"a":3,"e":"Điểm a khoản 2 Điều 19 Luật Đất đai 2024: Ủy ban Mặt trận Tổ quốc Việt Nam các cấp tham gia xây dựng pháp luật, phản biện xã hội đối với dự thảo quy hoạch, kế hoạch sử dụng đất cùng cấp. Quyền này không phụ thuộc yêu cầu của HĐND và không chỉ của Ủy ban Trung ương.","b":"Điểm a khoản 2 Điều 19 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Điểm khác nhau cơ bản giữa kiểm kê đất đai và thống kê đất đai là gì?","o":["Kiểm kê được thực hiện trên hồ sơ địa chính và trên thực địa; thống kê chỉ tổng hợp trên hồ sơ địa chính","Kiểm kê chỉ áp dụng cho đất nông nghiệp","Thống kê thực hiện 05 năm một lần, kiểm kê thực hiện hằng năm","Thống kê do Tòa án thực hiện, kiểm kê do Ủy ban nhân dân thực hiện"],"a":0,"e":"Khoản 29 và khoản 41 Điều 3 Luật Đất đai 2024: kiểm kê đất đai là việc tổng hợp, đánh giá trên hồ sơ địa chính và trên thực địa về hiện trạng sử dụng đất tại thời điểm kiểm kê và tình hình biến động giữa hai lần kiểm kê; thống kê đất đai là việc tổng hợp, đánh giá trên hồ sơ địa chính về hiện trạng sử dụng đất tại thời điểm thống kê.","b":"Khoản 29, khoản 41 Điều 3 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Năm 2026, xã Hòa Bình phải thực hiện thống kê hay kiểm kê đất đai?","o":["Không phải thực hiện gì vì đã kiểm kê năm 2024","Cả thống kê và kiểm kê theo đề xuất của xã","Kiểm kê đất đai, vì xã có quyền chọn kiểm kê thay thống kê","Thống kê đất đai, vì 2026 không phải năm kiểm kê"],"a":3,"e":"Khoản 2 Điều 57 Luật Đất đai 2024: thống kê đất đai được tiến hành hằng năm (trừ năm kiểm kê); kiểm kê định kỳ 05 năm tính đến năm có chữ số tận cùng 4 hoặc 9. Năm 2026 không phải năm kiểm kê nên xã phải thực hiện thống kê; xã không có quyền tự chọn kiểm kê thay thống kê.","b":"Khoản 2 Điều 57 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Kỳ kiểm kê đất đai định kỳ tiếp theo sau kỳ tính đến hết năm 2024 sẽ tính đến thời điểm nào?","o":["Hết ngày 31/12/2030","Hết ngày 31/12/2029","Hết ngày 31/12/2034","Hết ngày 31/12/2026"],"a":1,"e":"Điểm b khoản 2 Điều 57 Luật Đất đai 2024: kỳ kiểm kê tiếp theo sau kỳ tính đến hết năm 2024 là kỳ tính đến hết ngày 31/12/2029 (năm có chữ số tận cùng là 9).","b":"Điểm b khoản 2 Điều 57 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Ủy ban nhân dân cấp tỉnh phải công bố kết quả thống kê đất đai và báo cáo cơ quan trung ương trước thời điểm nào?","o":["Trước ngày 30/9 của năm kế tiếp","Trước ngày 31/3 của năm kế tiếp","Trước ngày 31/12 của năm thống kê","Trước ngày 30/6 của năm kế tiếp"],"a":1,"e":"Khoản 3 Điều 59 Luật Đất đai 2024 quy định trách nhiệm của UBND cấp tỉnh tổ chức thực hiện thống kê đất đai, công bố kết quả và báo cáo Bộ Nông nghiệp và Môi trường trước ngày 31/3 của năm kế tiếp.","b":"Khoản 3 Điều 59 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.5","g":3,"lv":"VD","q":"Ai có thẩm quyền quyết định kiểm kê đất đai chuyên đề ở địa phương?","o":["Giám đốc Văn phòng đăng ký đất đai","Chủ tịch Ủy ban nhân dân cấp xã","Chủ tịch Ủy ban nhân dân cấp tỉnh","Hội đồng nhân dân cấp tỉnh"],"a":2,"e":"Khoản 3 Điều 57 và khoản 7 Điều 59 Luật Đất đai 2024: kiểm kê đất đai chuyên đề được thực hiện theo quyết định của Bộ trưởng Bộ Nông nghiệp và Môi trường hoặc Chủ tịch UBND cấp tỉnh trong phạm vi địa phương. Ở địa phương, thẩm quyền thuộc Chủ tịch UBND cấp tỉnh.","b":"Khoản 3 Điều 57, khoản 7 Điều 59 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Ý kiến (1) \"quy hoạch sử dụng đất cấp tỉnh có thể được phê duyệt trước quy hoạch sử dụng đất quốc gia\" được đánh giá thế nào?","o":["Có cơ sở vì các cấp quy hoạch độc lập với nhau","Sai, quy hoạch sử dụng đất cấp cao hơn phải được quyết định, phê duyệt trước quy hoạch cấp thấp hơn","Phù hợp nếu nhằm thu hút đầu tư khẩn cấp","Hợp lệ khi Hội đồng nhân dân tỉnh đồng ý"],"a":1,"e":"Khoản 9 Điều 60 Luật Đất đai 2024: quy hoạch sử dụng đất cấp trên phải được quyết định, phê duyệt trước quy hoạch cấp dưới. Nhu cầu thu hút đầu tư hay sự đồng ý của HĐND tỉnh không làm thay đổi thứ tự này.","b":"Khoản 9 Điều 60 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Khi kết thúc thời kỳ quy hoạch mà quy hoạch thời kỳ mới chưa được phê duyệt, các chỉ tiêu sử dụng đất chưa thực hiện được xử lý thế nào?","o":["Đương nhiên hết hiệu lực","Được tiếp tục thực hiện đến khi quy hoạch thời kỳ tiếp theo được phê duyệt","Chỉ được thực hiện thêm 12 tháng","Phải được Quốc hội gia hạn bằng nghị quyết riêng"],"a":1,"e":"Khoản 9 Điều 60 Luật Đất đai 2024: khi kết thúc thời kỳ quy hoạch sử dụng đất mà quy hoạch thời kỳ tiếp theo chưa được quyết định, phê duyệt thì các chỉ tiêu sử dụng đất chưa thực hiện được tiếp tục thực hiện đến khi quy hoạch thời kỳ tiếp theo được phê duyệt. Không đương nhiên hết hiệu lực.","b":"Khoản 9 Điều 60 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Ý kiến (3) \"kế hoạch sử dụng đất cấp tỉnh có thời kỳ 10 năm\" sai vì thời kỳ đúng là bao lâu?","o":["Hằng năm","20 năm","03 năm","05 năm"],"a":3,"e":"Khoản 4 Điều 62 Luật Đất đai 2024: thời kỳ kế hoạch sử dụng đất quốc gia và cấp tỉnh là 05 năm; 10 năm là thời kỳ quy hoạch sử dụng đất.","b":"Khoản 4 Điều 62 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Ý kiến (4) \"lập quy hoạch sử dụng đất là việc nội bộ, không cần người dân tham gia\" trái với nguyên tắc nào?","o":["Quy hoạch phải sử dụng đất tiết kiệm, hiệu quả","Quy hoạch phải bảo đảm quốc phòng, an ninh","Quy hoạch cấp dưới phải phù hợp quy hoạch cấp trên","Lập quy hoạch phải có sự tham gia của tổ chức chính trị - xã hội, cộng đồng, cá nhân; bảo đảm công khai, minh bạch"],"a":3,"e":"Khoản 8 Điều 60 Luật Đất đai 2024: việc lập quy hoạch sử dụng đất phải bảo đảm sự tham gia của tổ chức chính trị – xã hội, cộng đồng, cá nhân; bảo đảm công khai, minh bạch. Lấy ý kiến nhân dân là thủ tục bắt buộc (Điều 70).","b":"Khoản 8 Điều 60 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.04.1","g":3,"lv":"VD","q":"Đề nghị (1) của ông An, cá nhân trực tiếp sản xuất nông nghiệp, xin 1 ha đất trồng cây hằng năm trong hạn mức được giải quyết theo hình thức nào?","o":["Cho thuê đất trả tiền hằng năm","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền một lần","Giao đất có thu tiền sử dụng đất"],"a":1,"e":"Khoản 1 Điều 118 Luật Đất đai 2024: cá nhân trực tiếp sản xuất nông nghiệp được giao đất nông nghiệp trong hạn mức thì Nhà nước giao đất không thu tiền sử dụng đất.","b":"Khoản 1 Điều 118 Luật Đất đai 2024","cid":"TH3.04"},{"id":"TH3.04.2","g":3,"lv":"VD","q":"Trường Trung học phổ thông công lập Lê Lợi xin đất xây dựng trường được Nhà nước giao đất theo hình thức nào?","o":["Giao đất không thu tiền sử dụng đất","Đấu giá quyền sử dụng đất","Cho thuê đất trả tiền hằng năm","Giao đất có thu tiền sử dụng đất"],"a":0,"e":"Khoản 4 Điều 118 Luật Đất đai 2024: đơn vị sự nghiệp công lập (trường THPT công lập) sử dụng đất xây dựng công trình sự nghiệp được giao đất không thu tiền sử dụng đất.","b":"Khoản 4 Điều 118 Luật Đất đai 2024","cid":"TH3.04"},{"id":"TH3.04.3","g":3,"lv":"VD","q":"Công ty cổ phần Phú Quý xin đất thực hiện dự án nhà ở thương mại để bán được giao đất theo hình thức nào?","o":["Công nhận quyền sử dụng đất","Giao đất có thu tiền sử dụng đất","Cho thuê đất trả tiền hằng năm","Giao đất không thu tiền sử dụng đất"],"a":1,"e":"Điều 119 Luật Đất đai 2024: tổ chức kinh tế được giao đất để thực hiện dự án đầu tư xây dựng nhà ở thương mại để bán hoặc để bán kết hợp cho thuê thuộc trường hợp giao đất có thu tiền sử dụng đất (thông qua đấu giá hoặc đấu thầu dự án, trừ trường hợp luật quy định khác).","b":"Điều 119 Luật Đất đai 2024","cid":"TH3.04"},{"id":"TH3.04.4","g":3,"lv":"VD","q":"Ban quản lý rừng phòng hộ đầu nguồn xin giao đất rừng phòng hộ được giải quyết theo hình thức nào?","o":["Cho thuê đất trả tiền hằng năm","Giao đất không thu tiền sử dụng đất","Giao đất có thu tiền sử dụng đất","Cho thuê đất trả tiền một lần"],"a":1,"e":"Khoản 3 Điều 118 Luật Đất đai 2024: tổ chức quản lý rừng phòng hộ, rừng đặc dụng được giao đất không thu tiền sử dụng đất để quản lý, bảo vệ, phát triển rừng.","b":"Khoản 3 Điều 118 Luật Đất đai 2024","cid":"TH3.04"},{"id":"TH3.05.1","g":3,"lv":"VD","q":"Dự định (1) chuyển 500 m² đất trồng lúa sang trồng cây lâu năm có phải xin phép không?","o":["Không phải xin phép vì vẫn trong nhóm đất nông nghiệp","Chỉ cần thông báo cho Ủy ban nhân dân xã","Phải được cơ quan nhà nước có thẩm quyền cho phép","Chỉ cần đăng ký biến động"],"a":2,"e":"Điểm a khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất trồng lúa sang loại đất khác trong nhóm đất nông nghiệp (như đất trồng cây lâu năm) phải được cơ quan nhà nước có thẩm quyền cho phép; khoản 3 Điều 182 còn đặt ra nghĩa vụ nộp tiền bảo vệ, phát triển đất trồng lúa.","b":"Điểm a khoản 1 Điều 121, khoản 3 Điều 182 Luật Đất đai 2024","cid":"TH3.05"},{"id":"TH3.05.2","g":3,"lv":"VD","q":"Dự định (2) chuyển 300 m² đất trồng cây hằng năm khác sang đất nuôi trồng thủy sản có phải xin phép không?","o":["Phải đấu giá quyền sử dụng đất","Phải được Hội đồng nhân dân tỉnh thông qua","Phải được Ủy ban nhân dân tỉnh cho phép","Không phải xin phép cơ quan nhà nước có thẩm quyền"],"a":3,"e":"Khoản 3 Điều 121 Luật Đất đai 2024: các trường hợp chuyển mục đích không thuộc khoản 1 thì không phải xin phép (đăng ký biến động theo quy định). Chuyển đất trồng cây hằng năm khác sang nuôi trồng thủy sản không thuộc khoản 1.","b":"Khoản 3 Điều 121 Luật Đất đai 2024","cid":"TH3.05"},{"id":"TH3.05.3","g":3,"lv":"VD","q":"Dự định (3) chuyển 300 m² đất thương mại, dịch vụ sang đất ở có phải xin phép không?","o":["Phải xin phép vì là chuyển đất phi nông nghiệp không phải đất ở sang đất ở","Chỉ cần đăng ký biến động khi có nhu cầu","Chỉ cần sự đồng ý của các hộ liền kề","Không phải xin phép vì cùng nhóm đất phi nông nghiệp"],"a":0,"e":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất phi nông nghiệp không phải là đất ở sang đất ở phải được cho phép. Dù cùng nhóm đất phi nông nghiệp, đất thương mại, dịch vụ sang đất ở vẫn phải xin phép.","b":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024","cid":"TH3.05"},{"id":"TH3.05.4","g":3,"lv":"VD","q":"Dự định (4) chuyển 100 m² đất ở sang đất thương mại, dịch vụ có phải xin phép không?","o":["Không phải xin phép vì không thuộc các trường hợp tại khoản 1 Điều 121","Phải nộp hồ sơ xin phép và nộp tiền sử dụng đất","Bị cấm vì đất ở không được chuyển mục đích","Phải được Ủy ban nhân dân tỉnh cho phép"],"a":0,"e":"Chuyển đất ở sang đất thương mại, dịch vụ không thuộc các trường hợp phải xin phép tại khoản 1 Điều 121 Luật Đất đai 2024 nên theo khoản 3, người sử dụng đất không phải xin phép (thực hiện đăng ký biến động theo quy định).","b":"Khoản 1, khoản 3 Điều 121 Luật Đất đai 2024","cid":"TH3.05"},{"id":"TH3.05.5","g":3,"lv":"VD","q":"Khi được phép chuyển 300 m² đất thương mại, dịch vụ (có thời hạn) sang đất ở, thời hạn sử dụng là gì?","o":["Thời hạn còn lại của đất thương mại, dịch vụ","70 năm kể từ ngày được phép","50 năm kể từ ngày được phép","Ổn định lâu dài"],"a":3,"e":"Khoản 3 Điều 173 Luật Đất đai 2024: chuyển đất phi nông nghiệp có thời hạn sang đất phi nông nghiệp sử dụng ổn định lâu dài thì thời hạn là ổn định lâu dài; đất ở là đất sử dụng ổn định lâu dài (khoản 1 Điều 171).","b":"Khoản 3 Điều 173, khoản 1 Điều 171 Luật Đất đai 2024","cid":"TH3.05"},{"id":"TH3.06.1","g":3,"lv":"VD","q":"Ý kiến \"đăng ký đất đai là tùy ý\" của ông Định được đánh giá thế nào?","o":["Không đúng, đăng ký đất đai là bắt buộc đối với người sử dụng đất","Có cơ sở, vì ông Định chưa có giấy tờ về quyền sử dụng đất","Hợp lý khi đất không có tranh chấp","Đăng ký chỉ bắt buộc khi ông Định muốn chuyển nhượng"],"a":0,"e":"Khoản 1 Điều 131 Luật Đất đai 2024: đăng ký đất đai là bắt buộc đối với người sử dụng đất, kể cả khi chưa có giấy tờ về quyền sử dụng đất. Việc không có tranh chấp hay chưa muốn chuyển nhượng không làm thay đổi nghĩa vụ này.","b":"Khoản 1 Điều 131 Luật Đất đai 2024","cid":"TH3.06"},{"id":"TH3.06.2","g":3,"lv":"VD","q":"Ông Định có bắt buộc đăng ký quyền sở hữu ngôi nhà tự xây năm 2000 không?","o":["Bắt buộc đăng ký cùng lúc với đất","Bắt buộc trong 30 ngày kể từ khi đăng ký đất","Không bắt buộc, nhà ở được đăng ký theo yêu cầu của chủ sở hữu","Bắt buộc nếu nhà xây trước năm 2014"],"a":2,"e":"Khoản 2 Điều 131 Luật Đất đai 2024: đăng ký quyền sở hữu nhà ở, công trình xây dựng gắn liền với đất được thực hiện theo yêu cầu của chủ sở hữu. Ông Định không bắt buộc phải đăng ký quyền sở hữu ngôi nhà.","b":"Khoản 2 Điều 131 Luật Đất đai 2024","cid":"TH3.06"},{"id":"TH3.06.3","g":3,"lv":"VD","q":"Việc ông Định đăng ký thửa đất đang sử dụng mà chưa đăng ký lần nào là loại đăng ký gì?","o":["Đăng ký thế chấp","Đăng ký lần đầu","Đăng ký tạm thời","Đăng ký biến động"],"a":1,"e":"Điều 132 Luật Đất đai 2024: đăng ký lần đầu được thực hiện đối với thửa đất chưa được đăng ký, được giao để quản lý mà chưa đăng ký… Thửa đất của ông Định chưa đăng ký lần nào nên là đăng ký lần đầu (khác đăng ký biến động tại Điều 133).","b":"Điều 132 Luật Đất đai 2024","cid":"TH3.06"},{"id":"TH3.06.4","g":3,"lv":"VD","q":"Ông Định sử dụng đất từ năm 1988, không có giấy tờ. Giai đoạn sử dụng đất của ông được xác định thế nào?","o":["Từ ngày 18/12/1980 đến trước ngày 15/10/1993","Sau ngày 01/7/2014","Trước ngày 18/12/1980","Từ ngày 15/10/1993 đến trước ngày 01/7/2014"],"a":0,"e":"Khoản 2 Điều 138 Luật Đất đai 2024 quy định cấp Giấy chứng nhận cho cá nhân sử dụng đất không có giấy tờ, sử dụng từ ngày 18/12/1980 đến trước ngày 15/10/1993 (ngày Luật Đất đai 1993 có hiệu lực). Năm 1988 thuộc giai đoạn này.","b":"Khoản 2 Điều 138 Luật Đất đai 2024","cid":"TH3.06"},{"id":"TH3.07.1","g":3,"lv":"VD","q":"Chị Giang có thể yêu cầu ghi thêm tên mình vào Giấy chứng nhận không?","o":["Chỉ khi ly hôn","Có, Giấy chứng nhận chỉ ghi tên một bên được cấp đổi sang ghi cả họ, tên vợ và chồng nếu có yêu cầu","Không, vì Giấy chứng nhận đã cấp không được thay đổi","Chỉ khi anh Phong đồng ý bằng bản án của Tòa án"],"a":1,"e":"Khoản 4 Điều 135 Luật Đất đai 2024: quyền sử dụng đất là tài sản chung của vợ chồng phải ghi cả họ, tên vợ và chồng; trường hợp Giấy chứng nhận đã cấp chỉ ghi họ, tên của vợ hoặc chồng thì được cấp đổi sang ghi cả họ, tên vợ và chồng nếu có yêu cầu. Không cần ly hôn hay bản án.","b":"Khoản 4 Điều 135 Luật Đất đai 2024","cid":"TH3.07"},{"id":"TH3.07.2","g":3,"lv":"VD","q":"Giấy chứng nhận cho ba anh em ông Hải được cấp như thế nào khi chưa thống nhất?","o":["Cấp chung 01 Giấy và giao Ủy ban nhân dân xã giữ","Cấp chung 01 Giấy chứng nhận cho người anh cả","Không cấp cho đến khi chia xong di sản","Ghi đủ tên những người có chung quyền và cấp cho mỗi người 01 Giấy chứng nhận"],"a":3,"e":"Khoản 2 Điều 135 Luật Đất đai 2024: thửa đất có nhiều người chung quyền sử dụng thì Giấy chứng nhận phải ghi đầy đủ tên những người có chung quyền và cấp cho mỗi người 01 Giấy chứng nhận; trường hợp những người có chung quyền có yêu cầu thì cấp chung 01 Giấy chứng nhận và trao cho người đại diện. Khi không thống nhất yêu cầu cấp chung, mỗi người được cấp 01 Giấy.","b":"Khoản 2 Điều 135 Luật Đất đai 2024","cid":"TH3.07"},{"id":"TH3.07.3","g":3,"lv":"TH","q":"Người sử dụng đất được nhận Giấy chứng nhận vào thời điểm nào?","o":["Sau khi đã hoàn thành nghĩa vụ tài chính, trừ trường hợp được miễn, không phải nộp hoặc được ghi nợ","Ngay khi nộp hồ sơ hợp lệ","Sau khi ký hợp đồng thuê đất với Nhà nước","Sau khi có xác nhận của hàng xóm"],"a":0,"e":"Khoản 3 Điều 135 Luật Đất đai 2024: người sử dụng đất được nhận Giấy chứng nhận sau khi đã hoàn thành nghĩa vụ tài chính theo quy định, trừ trường hợp được miễn, không phải nộp hoặc được ghi nợ nghĩa vụ tài chính.","b":"Khoản 3 Điều 135 Luật Đất đai 2024","cid":"TH3.07"},{"id":"TH3.07.4","g":3,"lv":"NB","q":"Giấy chứng nhận có giá trị pháp lý gì?","o":["Là quyết định giao đất của Ủy ban nhân dân","Là hợp đồng giữa Nhà nước và người sử dụng đất","Là giấy tờ xác lập quyền sở hữu đất đai của người được cấp","Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp"],"a":3,"e":"Khoản 21 Điều 3 Luật Đất đai 2024: Giấy chứng nhận là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp. Đất đai thuộc sở hữu toàn dân nên Giấy chứng nhận không xác lập quyền sở hữu đất; cũng không phải quyết định giao đất hay hợp đồng.","b":"Khoản 21 Điều 3 Luật Đất đai 2024","cid":"TH3.07"},{"id":"TH3.08.1","g":3,"lv":"VD","q":"Hồ sơ (1) anh Tú thuê 500 m² đất của bà Lan được giải quyết thế nào?","o":["Cấp Giấy chứng nhận nếu thời hạn thuê trên 05 năm","Không cấp Giấy chứng nhận vì là đất thuê của người sử dụng đất","Cấp Giấy chứng nhận chung cho anh Tú và bà Lan","Cấp Giấy chứng nhận cho anh Tú đối với 500 m²"],"a":1,"e":"Điều 151 Luật Đất đai 2024: không cấp Giấy chứng nhận cho người thuê, thuê lại đất của người sử dụng đất (trừ trường hợp thuê đất của nhà đầu tư kinh doanh hạ tầng phù hợp dự án). Anh Tú thuê đất của bà Lan nên không được cấp, bất kể thời hạn thuê.","b":"Điều 151 Luật Đất đai 2024","cid":"TH3.08"},{"id":"TH3.08.2","g":3,"lv":"VD","q":"Hồ sơ (3) thửa đất của ông Bảo đang có tranh chấp ranh giới chưa giải quyết xong được xử lý thế nào?","o":["Cấp Giấy chứng nhận và ghi chú tranh chấp","Không cấp Giấy chứng nhận khi đất đang có tranh chấp","Cấp Giấy chứng nhận cho người nộp hồ sơ trước","Cấp Giấy chứng nhận tạm thời"],"a":1,"e":"Điều 151 Luật Đất đai 2024: không cấp Giấy chứng nhận đối với thửa đất đang có tranh chấp (trừ phần đã xác định được phạm vi không tranh chấp theo quy định). Không có 'Giấy chứng nhận tạm thời'.","b":"Điều 151 Luật Đất đai 2024","cid":"TH3.08"},{"id":"TH3.08.3","g":3,"lv":"VD","q":"Hồ sơ (4) thửa đất của bà Hằng có quyết định thu hồi từ tháng 3/2022 nhưng chưa thực hiện được xử lý thế nào?","o":["Có thể được xem xét cấp vì đã quá 03 năm kể từ khi có quyết định thu hồi mà không thực hiện","Chỉ cấp khi bà Hằng khởi kiện thắng kiện","Không cấp vì đã có quyết định thu hồi","Chỉ cấp khi Ủy ban nhân dân hủy quyết định thu hồi"],"a":0,"e":"Điều 151 Luật Đất đai 2024: đất đã có quyết định thu hồi thì không cấp Giấy chứng nhận, trừ trường hợp đã quá 03 năm kể từ thời điểm có quyết định thu hồi mà không thực hiện. Quyết định từ tháng 3/2022 đến nay đã quá 03 năm nên bà Hằng có thể được xem xét cấp.","b":"Điều 151 Luật Đất đai 2024","cid":"TH3.08"},{"id":"TH3.08.4","g":3,"lv":"VD","q":"Hồ sơ (6) đất hành lang đường bộ giao cho một tổ chức quản lý được xử lý thế nào?","o":["Cấp Giấy chứng nhận cho Bộ Xây dựng","Cấp Giấy chứng nhận cho Ủy ban nhân dân xã","Không cấp Giấy chứng nhận vì là đất được giao để quản lý","Cấp Giấy chứng nhận cho tổ chức quản lý"],"a":2,"e":"Điều 151 và điểm a khoản 1 Điều 7 Luật Đất đai 2024: tổ chức được giao quản lý công trình công cộng (đường giao thông, hành lang bảo vệ…) là người được giao đất để quản lý, không phải người sử dụng đất, nên không được cấp Giấy chứng nhận.","b":"Điều 151, điểm a khoản 1 Điều 7 Luật Đất đai 2024","cid":"TH3.08"},{"id":"TH3.09.1","g":3,"lv":"VD","q":"Bà Huệ sử dụng đất từ năm 1979 thuộc giai đoạn nào theo Điều 138 Luật Đất đai 2024?","o":["Trước ngày 18/12/1980","Từ ngày 18/12/1980 đến trước ngày 15/10/1993","Sau ngày 01/7/2014","Từ ngày 15/10/1993 đến trước ngày 01/7/2014"],"a":0,"e":"Khoản 1 Điều 138 Luật Đất đai 2024 điều chỉnh trường hợp sử dụng đất không có giấy tờ trước ngày 18/12/1980 (ngày Hiến pháp 1980 có hiệu lực). Bà Huệ sử dụng từ năm 1979 thuộc giai đoạn này.","b":"Khoản 1 Điều 138 Luật Đất đai 2024","cid":"TH3.09"},{"id":"TH3.09.2","g":3,"lv":"VD","q":"Cơ quan nào xác nhận tình trạng không có tranh chấp để làm căn cứ cấp Giấy chứng nhận cho ba người?","o":["Hàng xóm liền kề","Ủy ban Mặt trận Tổ quốc xã","Ủy ban nhân dân cấp xã nơi có đất","Tòa án nhân dân khu vực"],"a":2,"e":"Khoản 1, 2, 3 Điều 138 Luật Đất đai 2024: việc cấp Giấy chứng nhận cho đất không có giấy tờ đòi hỏi UBND cấp xã nơi có đất xác nhận không có tranh chấp, sử dụng ổn định. Xác nhận của hàng xóm chỉ là nguồn thông tin; Tòa án chỉ giải quyết khi có tranh chấp.","b":"Khoản 1, 2, 3 Điều 138 Luật Đất đai 2024","cid":"TH3.09"},{"id":"TH3.09.3","g":3,"lv":"VD","q":"Ông Khánh sử dụng đất từ năm 2008 thuộc giai đoạn nào?","o":["Trước ngày 18/12/1980","Sau ngày 01/8/2024","Từ ngày 18/12/1980 đến trước ngày 15/10/1993","Từ ngày 15/10/1993 đến trước ngày 01/7/2014"],"a":3,"e":"Khoản 3 Điều 138 Luật Đất đai 2024 điều chỉnh trường hợp sử dụng đất không có giấy tờ từ ngày 15/10/1993 đến trước ngày 01/7/2014 (ngày Luật Đất đai 2013 có hiệu lực). Ông Khánh sử dụng từ năm 2008 thuộc giai đoạn này.","b":"Khoản 3 Điều 138 Luật Đất đai 2024","cid":"TH3.09"},{"id":"TH3.09.4","g":3,"lv":"TH","q":"Việc cấp Giấy chứng nhận lần đầu cho những người này là hình thức trao quyền nào của Nhà nước?","o":["Giao đất có thu tiền thông qua đấu giá","Cho thuê đất trả tiền hằng năm","Giao đất không thu tiền sử dụng đất","Công nhận quyền sử dụng đất"],"a":3,"e":"Khoản 33 Điều 3 và khoản 9 Điều 13 Luật Đất đai 2024: cấp Giấy chứng nhận lần đầu cho người đang sử dụng đất ổn định mà không có nguồn gốc giao, cho thuê là hình thức Nhà nước công nhận quyền sử dụng đất.","b":"Khoản 33 Điều 3, khoản 9 Điều 13 Luật Đất đai 2024","cid":"TH3.09"},{"id":"TH3.10.1","g":3,"lv":"VD","q":"Bà Liên chưa được cấp Giấy chứng nhận. Loại đất của bà được xác định dựa trên căn cứ nào?","o":["Quyết định giao đất của cơ quan nhà nước có thẩm quyền","Bản đồ quy hoạch đô thị","Lời khai của hàng xóm","Hiện trạng trồng cây lâu năm"],"a":0,"e":"Điểm c khoản 1 Điều 10 Luật Đất đai 2024: đối với trường hợp chưa được cấp Giấy chứng nhận, loại đất được xác định theo quyết định giao đất, cho thuê đất, cho phép chuyển mục đích của cơ quan nhà nước có thẩm quyền. Hiện trạng trồng cây lâu năm không phải căn cứ.","b":"Điểm c khoản 1 Điều 10 Luật Đất đai 2024","cid":"TH3.10"},{"id":"TH3.10.2","g":3,"lv":"VD","q":"Loại đất trên Giấy chứng nhận của ông Mạnh khác với hiện trạng sử dụng thì xác định loại đất như thế nào?","o":["Theo ý chí của ông Mạnh","Theo hiện trạng sử dụng thực tế","Theo quyết định của Ủy ban nhân dân xã","Theo quy định của Chính phủ"],"a":3,"e":"Khoản 2 Điều 10 Luật Đất đai 2024: đối với trường hợp loại đất xác định trên giấy tờ đã cấp khác với phân loại đất theo Luật này hoặc khác với hiện trạng sử dụng đất thì việc xác định loại đất thực hiện theo quy định của Chính phủ. Ông Mạnh không tự xác định theo ý chí hay hiện trạng.","b":"Khoản 2 Điều 10 Luật Đất đai 2024","cid":"TH3.10"},{"id":"TH3.10.3","g":3,"lv":"NB","q":"Bản đồ địa chính được đo đạc, lập theo đơn vị nào?","o":["Chi tiết đến từng thửa đất, theo đơn vị hành chính cấp xã","Theo từng tỉnh, tỷ lệ chung cho cả tỉnh","Theo từng dự án đầu tư","Theo từng loại đất"],"a":0,"e":"Khoản 1 Điều 50 Luật Đất đai 2024: bản đồ địa chính được đo đạc, lập chi tiết đến từng thửa đất theo đơn vị hành chính cấp xã. Bản đồ địa chính là thành phần của hồ sơ địa chính, dùng để cấp Giấy chứng nhận, đăng ký biến động.","b":"Khoản 1 Điều 50 Luật Đất đai 2024","cid":"TH3.10"},{"id":"TH3.10.4","g":3,"lv":"TH","q":"Cơ quan nào chịu trách nhiệm tổ chức đo đạc, lập, chỉnh lý bản đồ địa chính ở địa phương?","o":["Tòa án nhân dân cấp tỉnh","Ủy ban nhân dân cấp xã","Văn phòng công chứng","Ủy ban nhân dân cấp tỉnh"],"a":3,"e":"Khoản 3 Điều 50 Luật Đất đai 2024: UBND cấp tỉnh có trách nhiệm tổ chức việc đo đạc, lập, chỉnh lý bản đồ địa chính và quản lý, khai thác bản đồ địa chính ở địa phương. UBND cấp xã phối hợp, xác nhận; Tòa án, văn phòng công chứng không có chức năng này.","b":"Khoản 3 Điều 50 Luật Đất đai 2024","cid":"TH3.10"},{"id":"4.01","g":4,"lv":"NB","q":"Quyền nào sau đây thuộc nhóm quyền chung của người sử dụng đất theo Điều 26 Luật Đất đai 2024?","o":["Được chuyển mục đích sử dụng đất theo quy định của pháp luật","Được tự quyết định giá đất khi Nhà nước thu hồi đất","Được sử dụng đất không thời hạn đối với mọi loại đất","Được miễn đăng ký đất đai nếu đất có nguồn gốc thừa kế"],"a":0,"e":"Khoản 6 Điều 26 Luật Đất đai 2024: người sử dụng đất có quyền chung được chuyển mục đích sử dụng đất theo quy định của pháp luật. Mọi loại đất không phải đều không thời hạn; đăng ký đất đai là bắt buộc; giá đất bồi thường do Nhà nước quyết định.","b":"Khoản 6 Điều 26 Luật Đất đai 2024"},{"id":"4.02","g":4,"lv":"TH","q":"Tổ chức trong nước được Nhà nước giao đất không thu tiền sử dụng đất có quyền nào đối với quyền sử dụng đất?","o":["Được cho thuê quyền sử dụng đất trong thời hạn tối đa 05 năm","Chỉ có các quyền và nghĩa vụ chung; không được chuyển nhượng, cho thuê, thế chấp, góp vốn bằng quyền sử dụng đất","Được góp vốn bằng quyền sử dụng đất với tổ chức kinh tế","Được thế chấp quyền sử dụng đất tại tổ chức tín dụng"],"a":1,"e":"Khoản 1, 2 Điều 32 Luật Đất đai 2024: tổ chức trong nước được Nhà nước giao đất không thu tiền sử dụng đất chỉ có các quyền, nghĩa vụ chung (Điều 26, 31); không được chuyển đổi, chuyển nhượng, tặng cho, cho thuê quyền sử dụng đất; không được thế chấp, góp vốn bằng quyền sử dụng đất.","b":"Khoản 1, khoản 2 Điều 32 Luật Đất đai 2024"},{"id":"4.03","g":4,"lv":"TH","q":"Tổ chức kinh tế được Nhà nước giao đất có thu tiền sử dụng đất được tặng cho quyền sử dụng đất trong trường hợp nào?","o":["Tặng cho tổ chức kinh tế khác là đối tác kinh doanh","Tặng cho cộng đồng dân cư để mở rộng đường giao thông theo quy hoạch","Tặng cho cá nhân có quan hệ thân thích với người đại diện theo pháp luật","Tặng cho người lao động của công ty"],"a":1,"e":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024: tổ chức kinh tế được giao đất có thu tiền sử dụng đất chỉ được tặng cho quyền sử dụng đất cho Nhà nước, cho cộng đồng dân cư để xây dựng công trình phục vụ lợi ích chung, tặng cho để xây nhà tình nghĩa, nhà tình thương, nhà đại đoàn kết. Không được tặng cho người lao động, đối tác hay cá nhân thân thích.","b":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024"},{"id":"4.04","g":4,"lv":"TH","q":"Tổ chức kinh tế được Nhà nước cho thuê đất thu tiền thuê đất hằng năm được thế chấp tài sản nào?","o":["Tài sản thuộc sở hữu của mình gắn liền với đất thuê","Quyền sử dụng đất thuê","Quyền sử dụng đất và tài sản gắn liền với đất thuê","Toàn bộ tiền thuê đất đã nộp"],"a":0,"e":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024: tổ chức kinh tế được Nhà nước cho thuê đất thu tiền thuê đất hằng năm được thế chấp tài sản thuộc sở hữu của mình gắn liền với đất thuê tại tổ chức tín dụng… Không được thế chấp quyền sử dụng đất thuê vì chưa trả trước tiền thuê cho cả thời gian thuê.","b":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024"},{"id":"4.05","g":4,"lv":"TH","q":"Cá nhân được Nhà nước cho thuê đất thu tiền thuê đất hằng năm được để thừa kế những gì?","o":["Chỉ tiền thuê đất đã nộp trước","Tài sản thuộc sở hữu của mình gắn liền với đất và quyền thuê trong hợp đồng thuê đất","Không được để thừa kế bất kỳ quyền nào liên quan đến đất thuê","Quyền sử dụng đất thuê như đất được giao có thu tiền"],"a":1,"e":"Điểm c khoản 2 Điều 37 Luật Đất đai 2024: cá nhân thuê đất trả tiền hằng năm được để thừa kế, tặng cho tài sản thuộc sở hữu của mình gắn liền với đất thuê; người nhận thừa kế, tặng cho được Nhà nước tiếp tục cho thuê đất… Luật 2024 bổ sung khái niệm 'quyền thuê trong hợp đồng thuê đất' cũng được thừa kế cùng tài sản.","b":"Điểm c khoản 2 Điều 37 Luật Đất đai 2024"},{"id":"4.06","g":4,"lv":"NB","q":"Cá nhân được chuyển đổi quyền sử dụng đất nông nghiệp cho cá nhân khác trong phạm vi nào?","o":["Trên phạm vi toàn quốc","Trong cùng đơn vị hành chính cấp xã","Trong cùng đơn vị hành chính cấp tỉnh","Trong cùng vùng kinh tế - xã hội"],"a":2,"e":"Điều 47 và điểm b khoản 1 Điều 37 Luật Đất đai 2024: cá nhân sử dụng đất nông nghiệp do được Nhà nước giao, nhận chuyển nhượng, thừa kế… được chuyển đổi quyền sử dụng đất nông nghiệp trong cùng đơn vị hành chính cấp tỉnh cho cá nhân khác (Luật 2013 giới hạn trong cùng xã).","b":"Điều 47, điểm b khoản 1 Điều 37 Luật Đất đai 2024"},{"id":"4.07","g":4,"lv":"NB","q":"Hợp đồng cho thuê quyền sử dụng đất giữa hai cá nhân phải đáp ứng yêu cầu nào về công chứng, chứng thực?","o":["Bắt buộc công chứng hoặc chứng thực","Chỉ có hiệu lực khi được Ủy ban nhân dân cấp xã chứng thực","Phải công chứng nếu thời hạn thuê trên 05 năm","Được công chứng hoặc chứng thực theo yêu cầu của các bên"],"a":3,"e":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng cho thuê, cho thuê lại quyền sử dụng đất, hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp… được công chứng hoặc chứng thực theo yêu cầu của các bên. Chỉ hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn mới bắt buộc công chứng, chứng thực (điểm a).","b":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024"},{"id":"4.08","g":4,"lv":"NB","q":"Văn bản về thừa kế quyền sử dụng đất được công chứng, chứng thực theo quy định nào?","o":["Theo quyết định của Ủy ban nhân dân cấp xã","Theo quy định của pháp luật về dân sự","Không cần công chứng, chứng thực","Bắt buộc theo Luật Đất đai trong mọi trường hợp"],"a":1,"e":"Điểm c khoản 3 Điều 27 Luật Đất đai 2024: văn bản về thừa kế quyền sử dụng đất, quyền sử dụng đất và tài sản gắn liền với đất được công chứng hoặc chứng thực theo quy định của pháp luật về dân sự (BLDS, Luật Công chứng).","b":"Điểm c khoản 3 Điều 27 Luật Đất đai 2024"},{"id":"4.09","g":4,"lv":"TH","q":"Trường hợp nào sau đây bị cấm nhận chuyển nhượng quyền sử dụng đất?","o":["Cá nhân nhận chuyển nhượng đất ở của cá nhân khác ở tỉnh khác","Cá nhân trực tiếp sản xuất nông nghiệp nhận chuyển nhượng đất trồng lúa trong hạn mức","Tổ chức kinh tế nhận chuyển nhượng đất thương mại, dịch vụ của tổ chức kinh tế khác","Tổ chức kinh tế nhận chuyển nhượng đất rừng phòng hộ của cá nhân, trừ trường hợp được chuyển mục đích theo quy hoạch"],"a":3,"e":"Điểm a khoản 8 Điều 45 Luật Đất đai 2024: tổ chức kinh tế không được nhận chuyển nhượng quyền sử dụng đất rừng đặc dụng, rừng phòng hộ, rừng sản xuất của cá nhân, trừ trường hợp được chuyển mục đích sử dụng đất theo quy hoạch, kế hoạch sử dụng đất đã được phê duyệt. Các trường hợp còn lại đều được phép.","b":"Điểm a khoản 8 Điều 45 Luật Đất đai 2024"},{"id":"4.10","g":4,"lv":"TH","q":"Người sử dụng đất đang được ghi nợ nghĩa vụ tài chính muốn chuyển nhượng quyền sử dụng đất thì phải làm gì?","o":["Chỉ cần ghi chú khoản nợ trong hợp đồng chuyển nhượng","Thực hiện xong nghĩa vụ tài chính trước khi chuyển nhượng","Được chuyển nhượng, khoản nợ tự động được xóa","Được chuyển nhượng và chuyển khoản nợ cho bên nhận chuyển nhượng"],"a":1,"e":"Khoản 5 Điều 45 Luật Đất đai 2024: người sử dụng đất được ghi nợ hoặc được chậm nộp nghĩa vụ tài chính thì phải hoàn thành nghĩa vụ tài chính trước khi thực hiện các quyền chuyển nhượng, tặng cho, thế chấp… Khoản nợ không được chuyển cho bên nhận hay tự động xóa.","b":"Khoản 5 Điều 45 Luật Đất đai 2024"},{"id":"4.11","g":4,"lv":"TH","q":"Người có Giấy chứng nhận nhưng quyền sử dụng đất đang bị áp dụng biện pháp khẩn cấp tạm thời thì có được chuyển nhượng không?","o":["Không được, vì không bị áp dụng biện pháp khẩn cấp tạm thời là một điều kiện bắt buộc","Được nếu bên nhận chuyển nhượng đồng ý","Được, vì đã có Giấy chứng nhận","Được nếu hợp đồng đã công chứng"],"a":0,"e":"Điểm đ khoản 1 Điều 45 Luật Đất đai 2024: một điều kiện để chuyển nhượng là quyền sử dụng đất không bị áp dụng biện pháp khẩn cấp tạm thời theo quy định của pháp luật. Việc có Giấy chứng nhận hay công chứng hợp đồng không khắc phục được điều kiện này.","b":"Điểm đ khoản 1 Điều 45 Luật Đất đai 2024"},{"id":"4.12","g":4,"lv":"TH","q":"Trường hợp nào người sử dụng đất được thực hiện quyền mà không bắt buộc phải có Giấy chứng nhận?","o":["Chuyển nhượng quyền sử dụng đất cho cá nhân","Góp vốn bằng quyền sử dụng đất vào doanh nghiệp","Thế chấp quyền sử dụng đất tại ngân hàng","Tặng cho quyền sử dụng đất cho Nhà nước"],"a":3,"e":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024: điều kiện có Giấy chứng nhận có ngoại lệ, trong đó có trường hợp tặng cho quyền sử dụng đất cho Nhà nước hoặc cho cộng đồng dân cư, chuyển đổi khi dồn điền, đổi thửa, thừa kế. Chuyển nhượng, góp vốn, thế chấp vẫn phải có Giấy chứng nhận.","b":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024"},{"id":"4.13","g":4,"lv":"TH","q":"Cộng đồng dân cư có quyền và nghĩa vụ như cá nhân có hình thức sử dụng đất tương ứng, trừ quyền nào?","o":["Quyền để thừa kế","Quyền được cấp Giấy chứng nhận","Quyền được bảo hộ khi bị xâm phạm","Quyền khiếu nại, tố cáo, khởi kiện"],"a":0,"e":"Khoản 2 Điều 39 Luật Đất đai 2024: cộng đồng dân cư sử dụng đất có quyền, nghĩa vụ như cá nhân sử dụng đất theo hình thức tương ứng nhưng không được chuyển đổi, chuyển nhượng, tặng cho, cho thuê, thế chấp, góp vốn và cũng không có quyền để thừa kế (vì cộng đồng không phải con người tự nhiên).","b":"Khoản 2 Điều 39 Luật Đất đai 2024"},{"id":"4.14","g":4,"lv":"TH","q":"Người nước ngoài thuộc hàng thừa kế, không thuộc đối tượng được sở hữu nhà ở tại Việt Nam, được hưởng phần thừa kế là nhà ở gắn liền với quyền sử dụng đất ở như thế nào?","o":["Không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho phần thừa kế cho người đủ điều kiện","Mất toàn bộ quyền hưởng di sản","Được cấp Giấy chứng nhận như công dân Việt Nam","Được cấp Giấy chứng nhận có thời hạn 50 năm"],"a":0,"e":"Khoản 3, 5 Điều 44 Luật Đất đai 2024: người thừa kế là người nước ngoài hoặc người gốc Việt Nam định cư ở nước ngoài không thuộc đối tượng được sở hữu nhà ở tại Việt Nam thì không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho quyền sử dụng đất thừa kế cho người đủ điều kiện để hưởng giá trị.","b":"Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024"},{"id":"4.15","g":4,"lv":"TH","q":"Việc tổ chức trong nước, cá nhân nhận chuyển nhượng quyền sử dụng đất có phụ thuộc vào nơi cư trú, nơi đóng trụ sở không?","o":["Chỉ không phụ thuộc đối với đất ở","Phải cư trú hoặc đóng trụ sở tại cùng tỉnh nơi có đất","Không phụ thuộc, trừ một số trường hợp luật định","Người nhận cần thường trú tại cùng xã nơi có đất"],"a":2,"e":"Khoản 2 Điều 28 Luật Đất đai 2024: tổ chức trong nước, cá nhân, cộng đồng dân cư… được nhận chuyển quyền sử dụng đất không phụ thuộc vào nơi cư trú, nơi đóng trụ sở, trừ trường hợp luật quy định khác (như đất trong khu vực rừng phòng hộ, đất trồng lúa của người không trực tiếp sản xuất).","b":"Khoản 2 Điều 28 Luật Đất đai 2024"},{"id":"4.16","g":4,"lv":"NB","q":"Quyền thuê trong hợp đồng thuê đất hình thành khi nào?","o":["Khi cá nhân cho tổ chức thuê quyền sử dụng đất","Khi Nhà nước cho thuê đất thu tiền thuê đất hằng năm","Khi Nhà nước giao đất có thu tiền sử dụng đất","Khi Nhà nước cho thuê đất thu tiền thuê đất một lần"],"a":1,"e":"Khoản 37 Điều 3 Luật Đất đai 2024: quyền thuê trong hợp đồng thuê đất là quyền của người sử dụng đất được hình thành khi Nhà nước cho thuê đất thu tiền thuê đất hằng năm. Người thuê có thể bán, thừa kế, tặng cho, thế chấp tài sản gắn liền với đất cùng quyền thuê.","b":"Khoản 37 Điều 3 Luật Đất đai 2024"},{"id":"4.17","g":4,"lv":"TH","q":"Cá nhân được giao đất có thu tiền nhưng được miễn tiền sử dụng đất có quyền và nghĩa vụ như thế nào?","o":["Không được chuyển nhượng trong 10 năm","Như tổ chức được giao đất không thu tiền","Chỉ được để thừa kế, không được chuyển nhượng","Như trường hợp không được miễn, không được giảm"],"a":3,"e":"Khoản 4 Điều 37 Luật Đất đai 2024: cá nhân được giao đất có thu tiền, cho thuê đất trả tiền một lần mà được miễn, giảm tiền sử dụng đất, tiền thuê đất thì có quyền và nghĩa vụ như trường hợp không được miễn, không được giảm.","b":"Khoản 4 Điều 37 Luật Đất đai 2024"},{"id":"4.18","g":4,"lv":"TH","q":"Đơn vị sự nghiệp công lập được giao đất không thu tiền muốn dùng một phần diện tích để cung cấp dịch vụ thì phải làm gì?","o":["Chuyển nhượng phần diện tích đó cho doanh nghiệp","Chuyển sang thuê đất trả tiền hằng năm đối với phần diện tích đó","Chuyển sang giao đất có thu tiền sử dụng đất cho toàn bộ diện tích","Không được sử dụng đất vào dịch vụ"],"a":1,"e":"Khoản 3 Điều 30 Luật Đất đai 2024: đơn vị sự nghiệp công lập được giao đất không thu tiền sử dụng đất mà có nhu cầu sử dụng một phần hoặc toàn bộ diện tích vào mục đích sản xuất, kinh doanh, dịch vụ thì được lựa chọn chuyển sang thuê đất trả tiền thuê đất hằng năm đối với phần diện tích đó.","b":"Khoản 3 Điều 30 Luật Đất đai 2024"},{"id":"4.19","g":4,"lv":"TH","q":"Tổ chức kinh tế nhận chuyển nhượng quyền sử dụng đất nông nghiệp phải đáp ứng yêu cầu nào?","o":["Có phương án sử dụng đất nông nghiệp được cơ quan có thẩm quyền chấp thuận","Có vốn điều lệ tối thiểu 100 tỷ đồng","Có ít nhất 50% lao động là người địa phương","Có trụ sở tại xã nơi có đất"],"a":0,"e":"Khoản 6 Điều 45 Luật Đất đai 2024: tổ chức kinh tế nhận chuyển nhượng quyền sử dụng đất nông nghiệp phải có phương án sử dụng đất nông nghiệp được UBND cấp có thẩm quyền chấp thuận. Pháp luật không đặt điều kiện về lao động địa phương, trụ sở hay vốn điều lệ.","b":"Khoản 6 Điều 45 Luật Đất đai 2024"},{"id":"4.20","g":4,"lv":"NB","q":"Nghĩa vụ nào sau đây là nghĩa vụ chung của người sử dụng đất theo Điều 31 Luật Đất đai 2024?","o":["Báo cáo tình hình sử dụng đất cho Ủy ban nhân dân xã hằng quý","Bàn giao lại đất khi Nhà nước có quyết định thu hồi đất","Mua bảo hiểm cho quyền sử dụng đất","Nộp tiền sử dụng đất hằng năm đối với đất ở"],"a":1,"e":"Khoản 7 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ chung bàn giao lại đất khi Nhà nước có quyết định thu hồi đất theo quy định. Đất ở không phải nộp tiền sử dụng đất hằng năm; không có nghĩa vụ mua bảo hiểm hay báo cáo hằng quý.","b":"Khoản 7 Điều 31 Luật Đất đai 2024"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Tại thời điểm 05/3/2026, ông Hùng có đủ điều kiện chuyển nhượng quyền sử dụng đất không?","o":["Giấy chứng nhận chỉ ghi tên một người nên không giao dịch được","Thiếu văn bản cho phép của Ủy ban nhân dân xã","Đủ điều kiện: có Giấy chứng nhận, không tranh chấp, không bị kê biên, còn thời hạn sử dụng, không bị áp dụng biện pháp khẩn cấp tạm thời","Thời hạn sử dụng đất ở 50 năm của ông Hùng đã hết"],"a":2,"e":"Khoản 1 Điều 45 Luật Đất đai 2024: ông Hùng có Giấy chứng nhận, đất không tranh chấp, không bị kê biên, đất ở sử dụng ổn định lâu dài (còn thời hạn), không bị áp dụng biện pháp khẩn cấp tạm thời nên đủ điều kiện chuyển nhượng. Không cần văn bản cho phép của UBND xã; Giấy chứng nhận cấp riêng cho ông nên ông tự mình giao dịch.","b":"Khoản 1 Điều 45 Luật Đất đai 2024","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Yêu cầu hủy giao dịch của ông Hùng với lý do \"chưa công chứng\" được giải quyết thế nào?","o":["Bác yêu cầu; bà Lan đã thực hiện ít nhất hai phần ba nghĩa vụ nên có quyền yêu cầu Tòa án công nhận hiệu lực hợp đồng","Hủy được nếu ông Hùng trả lại gấp đôi số tiền đã nhận","Giấy viết tay có hai người làm chứng có giá trị như văn bản công chứng","Hợp đồng không công chứng đương nhiên vô hiệu nên phải hủy"],"a":0,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024 yêu cầu hợp đồng chuyển nhượng phải công chứng, chứng thực. Tuy nhiên, khoản 2 Điều 129 BLDS: giao dịch vi phạm hình thức mà một bên đã thực hiện ít nhất hai phần ba nghĩa vụ thì theo yêu cầu của các bên, Tòa án ra quyết định công nhận hiệu lực. Bà Lan đã trả 1,35/1,8 tỷ (75%) nên yêu cầu hủy của ông Hùng không được chấp nhận.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024; khoản 2 Điều 129 Bộ luật Dân sự 2015","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Giả sử Tòa án đã công nhận hợp đồng. Việc chuyển quyền sử dụng đất cho bà Lan có hiệu lực từ khi nào?","o":["Khi bà Lan nhận bản gốc Giấy chứng nhận","Từ thời điểm đăng ký theo quy định của Luật Đất đai","Từ ngày 05/3/2026 khi hai bên ký giấy viết tay","Khi bà Lan trả đủ 1,8 tỷ đồng"],"a":1,"e":"Điều 503 BLDS và khoản 3 Điều 133 Luật Đất đai 2024: việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký vào sổ địa chính. Bản án công nhận hợp đồng là căn cứ để bà Lan đăng ký biến động; việc nhận bản gốc Giấy chứng nhận hay trả đủ tiền không phải thời điểm chuyển quyền.","b":"Điều 503 Bộ luật Dân sự 2015; điểm a khoản 1, khoản 3 Điều 133 Luật Đất đai 2024","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Tranh chấp 12 m² giữa ông Tâm và bà Lan được giải quyết theo trình tự nào?","o":["Ủy ban Mặt trận Tổ quốc xã ra quyết định giải quyết","Hòa giải bắt buộc tại Ủy ban nhân dân cấp xã; không thành thì Tòa án giải quyết vì ông Tâm có Giấy chứng nhận","Chủ tịch Ủy ban nhân dân tỉnh giải quyết lần đầu","Khởi kiện ngay tại Tòa án, không cần hòa giải"],"a":1,"e":"Khoản 2 Điều 235 Luật Đất đai 2024: trước khi khởi kiện tranh chấp đất đai tại Tòa án, các bên phải hòa giải tại UBND cấp xã nơi có đất (bắt buộc). Khoản 1 Điều 236: tranh chấp đất đai mà các bên hoặc một bên có Giấy chứng nhận do Tòa án giải quyết. Ông Tâm có Giấy chứng nhận nên nếu hòa giải không thành thì khởi kiện tại Tòa án.","b":"Khoản 2 Điều 235, khoản 1 Điều 236 Luật Đất đai 2024","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Công ty Minh Phát được thế chấp gì để vay vốn ngân hàng?","o":["Quyền sử dụng 2 ha đất thuê","Không được thế chấp bất kỳ tài sản nào","Quyền sử dụng đất và toàn bộ tiền thuê đất đã nộp","Tài sản thuộc sở hữu của mình gắn liền với đất thuê (nhà xưởng)"],"a":3,"e":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024: tổ chức kinh tế thuê đất trả tiền hằng năm chỉ được thế chấp tài sản thuộc sở hữu của mình gắn liền với đất thuê (nhà xưởng đã xây, đã đăng ký); không được thế chấp quyền sử dụng 2 ha đất thuê.","b":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Nếu việc mua bán nhà xưởng kèm quyền thuê hợp pháp, Công ty Thịnh An có quyền gì đối với đất thuê?","o":["Được giao đất có thu tiền sử dụng đất","Được tự chọn mục đích sử dụng đất mới","Được Nhà nước tiếp tục cho thuê đất theo mục đích đã xác định, trong thời hạn còn lại, kế thừa quyền và nghĩa vụ của bên bán","Được cấp Giấy chứng nhận quyền sử dụng đất ổn định lâu dài"],"a":2,"e":"Điểm c khoản 1 Điều 34 Luật Đất đai 2024: tổ chức kinh tế thuê đất trả tiền hằng năm được bán tài sản gắn liền với đất thuê và quyền thuê trong hợp đồng thuê khi đủ điều kiện (Điều 46); người mua được Nhà nước tiếp tục cho thuê đất theo mục đích đã xác định, trong thời hạn còn lại và kế thừa quyền, nghĩa vụ của bên bán.","b":"Điểm c khoản 1 Điều 34 Luật Đất đai 2024","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Công ty Minh Phát có được chuyển sang thuê đất trả tiền một lần cho thời gian còn lại không?","o":["Chỉ được khi đã hoàn thành 100% dự án","Được; khi chuyển phải xác định lại giá đất tại thời điểm có quyết định cho phép chuyển","Được, giữ nguyên giá đất tại thời điểm thuê năm 2023","Không, hình thức trả tiền thuê đã chọn không được thay đổi"],"a":1,"e":"Khoản 1 Điều 30 Luật Đất đai 2024: tổ chức kinh tế đang thuê đất trả tiền hằng năm, nếu thuộc trường hợp được thuê đất trả tiền một lần, được chuyển sang trả tiền một lần cho thời gian thuê còn lại; giá đất tính tiền thuê được xác định tại thời điểm có quyết định cho phép chuyển (Nghị quyết 254/2025/QH15 tiếp tục hướng dẫn việc xác định giá). Không giữ nguyên giá năm 2023.","b":"Khoản 1 Điều 30 Luật Đất đai 2024; khoản 2 Điều 4 Nghị quyết 254/2025/QH15","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Dự định (1) tặng cho 200 m² cho ông Giám đốc có hợp pháp không?","o":["Được phép khi Đại hội đồng cổ đông thông qua","Không, tổ chức kinh tế chỉ được tặng cho Nhà nước, cộng đồng dân cư hoặc để làm nhà tình nghĩa, nhà tình thương, nhà đại đoàn kết","Hợp pháp vì công ty có quyền định đoạt tài sản","Được phép nếu ông Giám đốc nộp thuế thu nhập"],"a":1,"e":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024: tổ chức kinh tế chỉ được tặng cho quyền sử dụng đất cho Nhà nước, cộng đồng dân cư để xây công trình phục vụ lợi ích chung hoặc tặng cho để làm nhà tình nghĩa, nhà tình thương, nhà đại đoàn kết. Tặng cho Giám đốc không thuộc các trường hợp này, dù có nghị quyết của Đại hội đồng cổ đông.","b":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"Dự định (2) thế chấp quyền sử dụng 1 ha đất cho một cá nhân để vay tiền có hợp pháp không?","o":["Không, đất dự án nhà ở không được thế chấp","Hợp pháp, tổ chức kinh tế được thế chấp tại tổ chức tín dụng, tổ chức kinh tế khác hoặc cá nhân","Không, chỉ được thế chấp tại ngân hàng","Chỉ hợp pháp nếu cá nhân là cổ đông"],"a":1,"e":"Điểm đ khoản 1 Điều 33 Luật Đất đai 2024: tổ chức kinh tế được giao đất có thu tiền được thế chấp quyền sử dụng đất, tài sản gắn liền với đất tại tổ chức tín dụng, tổ chức kinh tế khác hoặc cá nhân theo quy định của pháp luật. Luật 2024 mở rộng bên nhận thế chấp là cá nhân.","b":"Điểm đ khoản 1 Điều 33 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Dự định (3) góp vốn bằng quyền sử dụng 1 ha đất vào tổ chức kinh tế có vốn đầu tư nước ngoài có hợp pháp không?","o":["Hợp pháp","Không, chỉ được góp vốn với tổ chức trong nước","Không, đất được giảm tiền sử dụng đất không được góp vốn","Chỉ hợp pháp nếu Thủ tướng Chính phủ chấp thuận"],"a":0,"e":"Điểm e khoản 1 Điều 33 Luật Đất đai 2024: tổ chức kinh tế được giao đất có thu tiền được góp vốn bằng quyền sử dụng đất, tài sản gắn liền với đất để hợp tác sản xuất, kinh doanh với tổ chức, cá nhân, người gốc Việt Nam định cư ở nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài. Việc được giảm tiền sử dụng đất không làm mất quyền này (khoản 4 Điều 33 về quyền như không được giảm).","b":"Điểm e khoản 1 Điều 33 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Khi chuyển nhượng 2 ha đất, Công ty Đông Đô phải thực hiện nghĩa vụ gì liên quan đến khoản tiền sử dụng đất được giảm 30%?","o":["Không phải nộp gì vì được giảm là quyền lợi ưu đãi","Nộp gấp đôi số tiền đã được giảm","Nộp cho Nhà nước khoản tiền tương ứng với số tiền sử dụng đất đã được giảm tại thời điểm giao đất","Bên nhận chuyển nhượng được tiếp tục hưởng mức giảm 30%"],"a":2,"e":"Điểm b khoản 3 Điều 33 Luật Đất đai 2024: tổ chức kinh tế được giảm tiền sử dụng đất khi chuyển nhượng quyền sử dụng đất phải nộp cho Nhà nước khoản tiền tương ứng với số tiền sử dụng đất đã được giảm tại thời điểm giao đất (trừ trường hợp luật quy định khác). Ưu đãi không chuyển sang bên nhận chuyển nhượng.","b":"Điểm b khoản 3 Điều 33 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.04.1","g":4,"lv":"VD","q":"Chị Chín, người gốc Việt Nam quốc tịch Mỹ được phép nhập cảnh, có được nhận thừa kế quyền sử dụng đất ở và được cấp Giấy chứng nhận không?","o":["Chỉ được nếu thôi quốc tịch Mỹ","Được, vì chị thuộc đối tượng được sở hữu nhà ở gắn liền với quyền sử dụng đất ở tại Việt Nam","Không, chỉ được hưởng giá trị phần thừa kế","Không, vì chị không có quốc tịch Việt Nam"],"a":1,"e":"Khoản 1 Điều 44 Luật Đất đai 2024: người gốc Việt Nam định cư ở nước ngoài thuộc đối tượng được sở hữu nhà ở tại Việt Nam (được phép nhập cảnh) thì được nhận thừa kế nhà ở gắn liền với quyền sử dụng đất ở và được cấp Giấy chứng nhận. Chị Chín được phép nhập cảnh nên đủ điều kiện, không cần thôi quốc tịch Mỹ.","b":"Khoản 1 Điều 44, điểm đ khoản 1 Điều 37 Luật Đất đai 2024","cid":"TH4.04"},{"id":"TH4.04.2","g":4,"lv":"VD","q":"Anh Peter, quốc tịch Úc, được hưởng phần di sản là quyền sử dụng đất ở như thế nào?","o":["Không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho phần thừa kế cho người đủ điều kiện","Phần thừa kế thuộc về Nhà nước","Mất quyền hưởng di sản vì là con nuôi","Được cấp Giấy chứng nhận như các đồng thừa kế khác"],"a":0,"e":"Khoản 3, 5 Điều 44 Luật Đất đai 2024: anh Peter là người nước ngoài, không thuộc đối tượng được sở hữu nhà ở gắn với quyền sử dụng đất ở theo diện thừa kế này, nên không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho phần thừa kế cho người đủ điều kiện. Con nuôi hợp pháp vẫn thuộc hàng thừa kế thứ nhất.","b":"Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024","cid":"TH4.04"},{"id":"TH4.04.3","g":4,"lv":"VD","q":"Khi chưa phân chia di sản, những người thừa kế phải làm thủ tục gì?","o":["Nộp hồ sơ về việc nhận thừa kế tại tổ chức đăng ký đất đai để cập nhật vào Sổ địa chính","Không phải làm gì cho đến khi phân chia","Khởi kiện chia di sản tại Tòa án","Đề nghị Ủy ban nhân dân xã cấp Giấy chứng nhận chung"],"a":0,"e":"Khoản 5 Điều 44 Luật Đất đai 2024: trường hợp chưa phân chia thừa kế, người nhận thừa kế hoặc người đại diện nộp hồ sơ về việc nhận thừa kế tại cơ quan đăng ký đất đai để cập nhật vào sổ địa chính. Không cấp Giấy chứng nhận chung khi chưa phân chia và không bắt buộc khởi kiện.","b":"Khoản 5 Điều 44 Luật Đất đai 2024","cid":"TH4.04"},{"id":"TH4.04.4","g":4,"lv":"VD","q":"Anh Peter có thể ủy quyền cho anh Tám trông nom phần di sản của mình không?","o":["Không được ủy quyền vì anh Peter là người nước ngoài","Người được ủy quyền bắt buộc phải là luật sư","Việc ủy quyền chỉ cần thỏa thuận miệng","Được ủy quyền bằng văn bản cho người khác trông nom, tạm sử dụng đất và thực hiện nghĩa vụ theo pháp luật đất đai"],"a":3,"e":"Khoản 6 Điều 44 Luật Đất đai 2024: người nhận thừa kế chưa được cấp Giấy chứng nhận (như người nước ngoài) được ủy quyền bằng văn bản cho người trông nom, tạm sử dụng đất và thực hiện nghĩa vụ theo quy định của pháp luật đất đai. Không bắt buộc người được ủy quyền là luật sư.","b":"Khoản 6 Điều 44 Luật Đất đai 2024","cid":"TH4.04"},{"id":"TH4.05.1","g":4,"lv":"VD","q":"Giao dịch (1) đổi thửa số 12 lấy thửa số 15 giữa ông Hòa và ông Lâm cùng xã có hợp pháp không?","o":["Đất trồng lúa không được chuyển đổi","Hợp pháp, cá nhân được chuyển đổi đất nông nghiệp với cá nhân khác trong cùng đơn vị hành chính cấp tỉnh","Cần được Ủy ban nhân dân tỉnh cho phép","Các bên bắt buộc phải dùng hình thức chuyển nhượng"],"a":1,"e":"Điều 47 và điểm b khoản 1 Điều 37 Luật Đất đai 2024: cá nhân được chuyển đổi quyền sử dụng đất nông nghiệp trong cùng đơn vị hành chính cấp tỉnh cho cá nhân khác. Hai thửa cùng xã nên giao dịch (1) hợp pháp, không cần UBND tỉnh cho phép.","b":"Điều 47, điểm b khoản 1 Điều 37 Luật Đất đai 2024","cid":"TH4.05"},{"id":"TH4.05.2","g":4,"lv":"VD","q":"Giao dịch (2) đổi thửa số 20 lấy thửa đất của ông Kha ở tỉnh B giáp ranh có hợp pháp theo hình thức chuyển đổi không?","o":["Hợp pháp vì hai tỉnh giáp ranh","Được phép nếu cùng là đất trồng lúa","Được phép nếu Ủy ban nhân dân hai tỉnh đồng ý","Không, vì hai thửa không cùng đơn vị hành chính cấp tỉnh"],"a":3,"e":"Điều 47 Luật Đất đai 2024 giới hạn việc chuyển đổi đất nông nghiệp trong cùng đơn vị hành chính cấp tỉnh. Thửa của ông Kha ở tỉnh B nên không thể chuyển đổi; nếu muốn, các bên phải dùng hình thức chuyển nhượng hai chiều.","b":"Điều 47 Luật Đất đai 2024","cid":"TH4.05"},{"id":"TH4.05.3","g":4,"lv":"VD","q":"Hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp không công chứng có hợp lệ về hình thức không?","o":["Không hợp lệ, phải công chứng","Phải chứng thực tại Ủy ban nhân dân xã mới hợp lệ","Hợp lệ, vì hợp đồng này được công chứng hoặc chứng thực theo yêu cầu của các bên","Chỉ hợp lệ nếu diện tích dưới 1.000 m²"],"a":2,"e":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp được công chứng hoặc chứng thực theo yêu cầu của các bên. Không công chứng vẫn hợp lệ về hình thức (nhưng phải đăng ký biến động).","b":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH4.05"},{"id":"TH4.05.4","g":4,"lv":"VD","q":"Thửa đất chưa có Giấy chứng nhận nằm trong phương án dồn điền, đổi thửa có được chuyển đổi không?","o":["Được, chuyển đổi khi dồn điền, đổi thửa là ngoại lệ của điều kiện phải có Giấy chứng nhận","Không, phải có Giấy chứng nhận mới được chuyển đổi","Chỉ được nếu Tòa án cho phép","Chỉ được sau khi nộp tiền sử dụng đất"],"a":0,"e":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024: trường hợp chuyển đổi quyền sử dụng đất nông nghiệp khi dồn điền, đổi thửa là ngoại lệ của điều kiện phải có Giấy chứng nhận.","b":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024","cid":"TH4.05"},{"id":"TH4.05.5","g":4,"lv":"NB","q":"Chủ thể nào được nhận chuyển đổi quyền sử dụng đất nông nghiệp?","o":["Cá nhân","Người gốc Việt Nam định cư ở nước ngoài","Tổ chức kinh tế","Tổ chức kinh tế có vốn đầu tư nước ngoài"],"a":0,"e":"Điểm a khoản 1 Điều 28 Luật Đất đai 2024: cá nhân được nhận chuyển quyền sử dụng đất thông qua chuyển đổi quyền sử dụng đất nông nghiệp. Tổ chức kinh tế, người gốc Việt Nam định cư ở nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài không nhận chuyển đổi.","b":"Điểm a khoản 1 Điều 28 Luật Đất đai 2024","cid":"TH4.05"},{"id":"TH4.06.1","g":4,"lv":"VD","q":"Bà Yến có được thế chấp quyền sử dụng đất cho ông Phát (cá nhân) để vay tiền không?","o":["Chỉ được nếu ông Phát là người thân","Được, cá nhân được thế chấp tại tổ chức tín dụng, tổ chức kinh tế khác hoặc cá nhân","Không, chỉ được thế chấp tại ngân hàng","Không, đất ở không được thế chấp"],"a":1,"e":"Điểm g khoản 1 Điều 37 Luật Đất đai 2024: cá nhân sử dụng đất được thế chấp quyền sử dụng đất tại tổ chức tín dụng, tổ chức kinh tế khác hoặc cá nhân theo quy định của pháp luật. Bà Yến được thế chấp cho ông Phát.","b":"Điểm g khoản 1 Điều 37 Luật Đất đai 2024","cid":"TH4.06"},{"id":"TH4.06.2","g":4,"lv":"VD","q":"Hợp đồng thế chấp chỉ có chữ ký hai bên được đánh giá thế nào về hình thức?","o":["Vi phạm, vì hợp đồng thế chấp quyền sử dụng đất phải được công chứng hoặc chứng thực","Khoản vay dưới 2 tỷ đồng thì không cần công chứng","Hợp lệ, vì thế chấp không bắt buộc công chứng","Có người làm chứng là đủ điều kiện hình thức"],"a":0,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng thế chấp quyền sử dụng đất phải được công chứng hoặc chứng thực. Hợp đồng chỉ có chữ ký hai bên vi phạm hình thức; giá trị khoản vay không làm thay đổi yêu cầu này.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH4.06"},{"id":"TH4.06.3","g":4,"lv":"VD","q":"Sau khi nhận góp vốn bằng quyền sử dụng đất của bà Yến, Công ty Sơn Hà có quyền và nghĩa vụ như chủ thể nào?","o":["Như người được giao đất để quản lý","Như tổ chức kinh tế được Nhà nước giao đất có thu tiền sử dụng đất","Như tổ chức được giao đất không thu tiền sử dụng đất","Như cá nhân thuê đất trả tiền hằng năm"],"a":1,"e":"Khi nhận góp vốn, quyền sử dụng đất chuyển sang Công ty Sơn Hà. Theo Luật Đất đai 2024 (Điều 33, khoản 1 Điều 36 về nhận chuyển quyền), tổ chức kinh tế nhận góp vốn bằng quyền sử dụng đất có quyền, nghĩa vụ như tổ chức kinh tế được Nhà nước giao đất có thu tiền sử dụng đất.","b":"Điểm b khoản 1 Điều 36, Điều 33 Luật Đất đai 2024","cid":"TH4.06"},{"id":"TH4.06.4","g":4,"lv":"VD","q":"Điểm khác nhau cơ bản giữa góp vốn và hợp tác sản xuất, kinh doanh bằng quyền sử dụng đất là gì?","o":["Hợp tác kinh doanh bắt buộc phải thành lập pháp nhân mới","Góp vốn không làm chuyển quyền sử dụng đất; hợp tác kinh doanh làm chuyển quyền","Hai hình thức có bản chất pháp lý giống nhau","Góp vốn làm chuyển quyền sử dụng đất sang tổ chức kinh tế; hợp tác kinh doanh không làm thay đổi quyền sử dụng đất"],"a":3,"e":"Khoản 22 Điều 3 Luật Đất đai 2024: góp vốn bằng quyền sử dụng đất là sự chuyển giao quyền sử dụng đất để trở thành tài sản của tổ chức kinh tế, người góp vốn nhận phần vốn góp; khoản 26: hợp tác sản xuất, kinh doanh bằng quyền sử dụng đất là thỏa thuận giữa các bên mà không làm thay đổi quyền sử dụng đất của bên tham gia.","b":"Khoản 22, khoản 26 Điều 3 Luật Đất đai 2024","cid":"TH4.06"},{"id":"TH4.07.1","g":4,"lv":"VD","q":"Anh Quân không trực tiếp sản xuất nông nghiệp, muốn nhận chuyển nhượng 5 ha đất trồng lúa (vượt hạn mức). Anh phải đáp ứng điều kiện gì?","o":["Không được nhận chuyển nhượng đất trồng lúa trong mọi trường hợp","Phải chuyển hộ khẩu về xã nơi có đất","Thành lập tổ chức kinh tế và có phương án sử dụng đất trồng lúa được cơ quan có thẩm quyền phê duyệt","Chỉ cần ký hợp đồng chuyển nhượng có công chứng"],"a":2,"e":"Khoản 7 Điều 45 Luật Đất đai 2024: cá nhân không trực tiếp sản xuất nông nghiệp khi nhận chuyển nhượng, nhận tặng cho đất trồng lúa quá hạn mức thì phải thành lập tổ chức kinh tế và có phương án sử dụng đất trồng lúa được cơ quan có thẩm quyền phê duyệt. Không cấm tuyệt đối và không yêu cầu chuyển hộ khẩu.","b":"Khoản 7 Điều 45 Luật Đất đai 2024","cid":"TH4.07"},{"id":"TH4.07.2","g":4,"lv":"NB","q":"Hạn mức giao đất trồng lúa tại tỉnh vùng đồng bằng sông Hồng dùng làm căn cứ xác định việc vượt hạn mức là bao nhiêu?","o":["Không quá 03 ha","Không quá 02 ha","Không quá 05 ha","Không quá 30 ha"],"a":1,"e":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024: hạn mức giao đất trồng cây hằng năm (bao gồm đất trồng lúa) tại tỉnh ngoài Đông Nam Bộ và đồng bằng sông Cửu Long là không quá 02 ha. Đây là căn cứ xác định 'quá hạn mức' tại khoản 7 Điều 45.","b":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024","cid":"TH4.07"},{"id":"TH4.07.3","g":4,"lv":"VD","q":"Việc anh Quân nhận tặng cho 1 ha đất trồng lúa từ bố có phải thành lập tổ chức kinh tế không?","o":["Chỉ phải thành lập hợp tác xã","Có, vì anh Quân không trực tiếp sản xuất nông nghiệp","Có, nếu diện tích trên 0,5 ha","Không, vì anh Quân thuộc hàng thừa kế của người tặng cho"
