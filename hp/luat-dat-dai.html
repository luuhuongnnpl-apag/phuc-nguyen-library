</head><body><script id="PNLIB_COURSE_GATE">
(function(){
  const courseId="luat-dat-dai";
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let access=false;
  try{
    const raw=localStorage.getItem("pnlib-ma-lop");
    const session=raw?JSON.parse(raw):null;
    const scopes=session&&Array.isArray(session.courses)?session.courses:null;
    access=!!(session&&session.code&&session.han&&today()<=session.han&&(!scopes||!scopes.length||scopes.includes("*")||scopes.includes(courseId)));
  }catch(e){access=false}
  if(!access){
    document.documentElement.style.visibility="hidden";
    if(window.top!==window.self){
      window.parent.postMessage({pn:"home",course:courseId},"*");
    }else{
      window.location.replace("../index.html#"+courseId);
    }
  }
})();
</script>

<script id="pn-data" type="application/json">{"meta":{"id":"luat-dat-dai","name":"Luật Đất đai","title":"Tài liệu Luật Đất đai","menuTitle":"Luật Đất đai","asof":"29/10/2026","laws":[{"re":"Luật Đất đai|LĐĐ","doc":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-523642.aspx"},{"re":"254/2025","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=254/2025/QH15&match=True"},{"re":"Bộ luật Dân sự|BLDS","base":"https://hethongphapluat.com/bo-luat-dan-su-2015"},{"re":"Hiến pháp","doc":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"}],"note":"Ngân hàng câu hỏi soạn theo pháp luật có hiệu lực tại ngày 29/10/2026: Luật Đất đai 2024 (VBHN 44/VBHN-VPQH), Nghị quyết 254/2025/QH15 và các nghị định hướng dẫn. Dự án Luật Đất đai (sửa đổi) đang được Quốc hội thảo luận tại Kỳ họp thứ 2, khóa XVI; nội dung sẽ được rà soát lại khi luật mới được thông qua."},"chapters":[{"n":1,"name":"Những vấn đề chung về Luật Đất đai"},{"n":2,"name":"Chế độ sử dụng các loại đất"},{"n":3,"name":"Quản lý nhà nước về đất đai"},{"n":4,"name":"Người sử dụng đất, quyền và nghĩa vụ"},{"n":5,"name":"Thu hồi đất, bồi thường, hỗ trợ, tái định cư"},{"n":6,"name":"Thanh tra, xử lý vi phạm, giải quyết tranh chấp, khiếu nại, tố cáo"}],"q":[{"id":"1.01","g":1,"lv":"NB","q":"Theo Luật Đất đai 2024, Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất xác nhận điều gì đối với người được cấp?","o":["Thẩm quyền quản lý nhà nước đối với thửa đất","Quyền sử dụng đất hợp pháp và quyền sở hữu tài sản gắn liền với đất hợp pháp","Quyền sở hữu tư nhân đối với thửa đất","Tư cách đại diện chủ sở hữu toàn dân về đất đai"],"a":1,"e":"Khoản 21 Điều 3 Luật Đất đai 2024: Giấy chứng nhận là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền. Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu (Điều 12; Điều 53 Hiến pháp), nên Giấy chứng nhận không xác nhận quyền sở hữu tư nhân về đất, cũng không trao tư cách đại diện chủ sở hữu hay thẩm quyền quản lý.","b":"Khoản 21 Điều 3, Điều 12 Luật Đất đai 2024; Điều 53 Hiến pháp 2013"},{"id":"1.02","g":1,"lv":"NB","q":"Ngoài người sử dụng đất, Luật Đất đai 2024 dành riêng một mục quy định quyền và nghĩa vụ đối với đất đai của chủ thể nào?","o":["Cơ quan tiến hành tố tụng","Tổ chức nước ngoài không có chức năng ngoại giao","Tổ chức tín dụng","Công dân"],"a":3,"e":"Luật Đất đai 2024 lần đầu dành riêng một mục (Điều 23–25) quy định quyền và nghĩa vụ của công dân đối với đất đai: tham gia xây dựng, góp ý, giám sát chính sách; tiếp cận thông tin; tham gia đấu giá; nghĩa vụ giữ gìn, bảo vệ tài nguyên đất… Đây là chủ thể khác với người sử dụng đất (Điều 4). Tổ chức tín dụng, cơ quan tố tụng không có mục riêng.","b":"Điều 1, Điều 23 đến Điều 25 Luật Đất đai 2024"},{"id":"1.03","g":1,"lv":"TH","q":"Ngành luật đất đai sử dụng phương pháp điều chỉnh nào?","o":["Chỉ dùng mệnh lệnh hành chính cho mọi quan hệ đất đai","Phương pháp trừng trị bằng chế tài hình sự là chủ yếu","Kết hợp phương pháp hành chính – mệnh lệnh và phương pháp bình đẳng – thỏa thuận","Chỉ dùng thỏa thuận dân sự cho mọi quan hệ đất đai"],"a":2,"e":"Luật đất đai kết hợp hai phương pháp: hành chính – mệnh lệnh trong quan hệ giữa Nhà nước (đại diện chủ sở hữu, quản lý) với người sử dụng đất như giao đất, cho thuê, thu hồi (Điều 13); bình đẳng – thỏa thuận trong quan hệ giữa những người sử dụng đất khi thực hiện các quyền chuyển đổi, chuyển nhượng, cho thuê, thế chấp (Điều 27). Chỉ dùng một phương pháp hay dùng chế tài hình sự làm chủ yếu là sai.","b":"Điều 13, khoản 1 Điều 27 Luật Đất đai 2024"},{"id":"1.04","g":1,"lv":"NB","q":"Công dân Việt Nam định cư ở nước ngoài được xếp vào nhóm người sử dụng đất nào theo Điều 4 Luật Đất đai 2024?","o":["Người gốc Việt Nam định cư ở nước ngoài","Tổ chức nước ngoài","Cá nhân","Hộ gia đình"],"a":2,"e":"Khoản 3 Điều 4 Luật Đất đai 2024: cá nhân trong nước và người Việt Nam định cư ở nước ngoài là công dân Việt Nam được gọi chung là 'cá nhân'. Người còn quốc tịch Việt Nam được đối xử như cá nhân trong nước; 'người gốc Việt Nam định cư ở nước ngoài' (khoản 6) chỉ người không còn quốc tịch Việt Nam.","b":"Khoản 3 Điều 4 Luật Đất đai 2024"},{"id":"1.05","g":1,"lv":"VD","q":"Bà X mang quốc tịch Pháp, không còn quốc tịch Việt Nam, có cha mẹ là người Việt Nam và đang định cư tại Pháp. Theo Luật Đất đai 2024, bà X thuộc nhóm người sử dụng đất nào?","o":["Cá nhân trong nước","Người gốc Việt Nam định cư ở nước ngoài","Bà X không thuộc nhóm người sử dụng đất nào","Tổ chức kinh tế có vốn đầu tư nước ngoài"],"a":1,"e":"Khoản 6 Điều 4 Luật Đất đai 2024: người gốc Việt Nam định cư ở nước ngoài là người Việt Nam đã từng có quốc tịch Việt Nam hoặc có cha, mẹ, ông, bà là người Việt Nam nhưng không còn quốc tịch Việt Nam, đang định cư ở nước ngoài. Bà X có quốc tịch Pháp, cha mẹ là người Việt Nam nên thuộc nhóm này, không phải cá nhân trong nước hay tổ chức.","b":"Khoản 6 Điều 4 Luật Đất đai 2024"},{"id":"1.06","g":1,"lv":"TH","q":"Theo Luật Đất đai 2024, những người có quan hệ hôn nhân, huyết thống, nuôi dưỡng, đang sống chung được coi là \"hộ gia đình sử dụng đất\" khi đáp ứng điều kiện nào?","o":["Cùng có nơi thường trú tại thời điểm thực hiện giao dịch về quyền sử dụng đất","Xác lập quyền sử dụng đất chung vào bất kỳ thời điểm nào, kể cả sau ngày Luật Đất đai 2024 có hiệu lực","Có quyền sử dụng đất chung tại thời điểm được giao, cho thuê, công nhận, nhận chuyển quyền sử dụng đất trước ngày Luật Đất đai 2024 có hiệu lực","Cùng đứng tên trên Giấy chứng nhận tại thời điểm cấp đổi Giấy chứng nhận"],"a":2,"e":"Khoản 25 Điều 3 Luật Đất đai 2024: hộ gia đình sử dụng đất là những người có quan hệ hôn nhân, huyết thống, nuôi dưỡng theo pháp luật hôn nhân và gia đình, đang sống chung và có quyền sử dụng đất chung tại thời điểm được Nhà nước giao đất, cho thuê đất, công nhận quyền sử dụng đất; nhận chuyển quyền sử dụng đất trước ngày Luật này có hiệu lực. Luật 2024 không còn giao đất mới cho hộ gia đình; mốc xác định là thời điểm xác lập quyền, không phải thời điểm cấp đổi hay nơi thường trú.","b":"Khoản 25 Điều 3 Luật Đất đai 2024"},{"id":"1.07","g":1,"lv":"NB","q":"Nhà nước không thừa nhận việc đòi lại đất đã được giao cho người khác sử dụng trong quá trình thực hiện chính sách đất đai của những chính quyền nào?","o":["Chính quyền thực hiện cải cách ruộng đất những năm 1953–1956","Riêng Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam kể từ năm 1976","Nhà nước Việt Nam dân chủ cộng hòa, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam và Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","Mọi chính quyền từng tồn tại trên lãnh thổ Việt Nam, kể cả chính quyền thuộc địa"],"a":2,"e":"Khoản 2 Điều 17 Luật Đất đai 2024: Nhà nước không thừa nhận việc đòi lại đất đã được giao theo quy định của Nhà nước cho người khác sử dụng trong quá trình thực hiện chính sách đất đai của Nhà nước Việt Nam dân chủ cộng hòa, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam và Nhà nước CHXHCN Việt Nam. Quy định không bao gồm chính quyền thuộc địa hay chỉ riêng giai đoạn từ 1976.","b":"Khoản 2 Điều 17 Luật Đất đai 2024"},{"id":"1.08","g":1,"lv":"NB","q":"Cơ quan nào quyết định quy hoạch sử dụng đất quốc gia?","o":["Chính phủ","Bộ Nông nghiệp và Môi trường","Quốc hội","Thủ tướng Chính phủ"],"a":2,"e":"Khoản 1 Điều 14 Luật Đất đai 2024: Quốc hội ban hành luật, nghị quyết về đất đai; quyết định quy hoạch sử dụng đất quốc gia; thực hiện quyền giám sát tối cao. Thủ tướng Chính phủ phê duyệt quy hoạch sử dụng đất cấp tỉnh, quy hoạch quốc phòng, an ninh; Chính phủ trình Quốc hội.","b":"Khoản 1 Điều 14 Luật Đất đai 2024"},{"id":"1.09","g":1,"lv":"NB","q":"Nội dung nào là một nguyên tắc sử dụng đất theo Điều 5 Luật Đất đai 2024?","o":["Sử dụng đất theo hiện trạng, không phụ thuộc mục đích ghi trên Giấy chứng nhận","Lợi ích của người sử dụng đất được ưu tiên hơn lợi ích công cộng","Không xâm phạm quyền, lợi ích hợp pháp của người sử dụng đất liền kề và xung quanh","Người sử dụng đất được tự chuyển mục đích trong nhóm đất phi nông nghiệp"],"a":2,"e":"Khoản 4 Điều 5 Luật Đất đai 2024: việc sử dụng đất phải bảo đảm không xâm phạm quyền, lợi ích hợp pháp của người sử dụng đất liền kề và xung quanh. Các phương án còn lại trái với nguyên tắc sử dụng đất đúng mục đích (khoản 1) và với việc tự chuyển mục đích phải được phép (Điều 121).","b":"Khoản 4 Điều 5 Luật Đất đai 2024"},{"id":"1.10","g":1,"lv":"TH","q":"Yếu tố nào phân biệt hành vi lấn đất với hành vi chiếm đất?","o":["Lấn đất chỉ xảy ra đối với đất do Nhà nước quản lý","Khái niệm lấn đất chỉ áp dụng đối với đất nông nghiệp","Lấn đất gắn với việc chuyển dịch mốc giới, ranh giới thửa đất đang sử dụng để mở rộng diện tích","Hành vi lấn đất luôn làm suy giảm chất lượng đất"],"a":2,"e":"Khoản 31 Điều 3 Luật Đất đai 2024: lấn đất là việc người đang sử dụng đất tự chuyển dịch mốc giới hoặc ranh giới thửa đất để mở rộng diện tích đất sử dụng. Chiếm đất (khoản 9) là việc sử dụng đất của Nhà nước chưa được cho phép hoặc đất của người khác chưa được người đó cho phép. Lấn đất có thể xảy ra với cả đất của Nhà nước và đất của người khác, mọi loại đất.","b":"Khoản 9, khoản 31 Điều 3 Luật Đất đai 2024"},{"id":"1.11","g":1,"lv":"NB","q":"Hành vi làm suy giảm chất lượng đất mà làm mất hoặc giảm khả năng sử dụng đất theo mục đích đã được xác định được gọi là gì?","o":["Chiếm đất","Hủy hoại đất","Sử dụng đất không đúng mục đích","Lấn đất"],"a":1,"e":"Khoản 27 Điều 3 Luật Đất đai 2024: hủy hoại đất là hành vi làm biến dạng địa hình hoặc làm suy giảm chất lượng đất mà làm mất hoặc giảm khả năng sử dụng đất theo mục đích đã được xác định. Khác với lấn, chiếm đất (xâm phạm ranh giới, quyền quản lý) và sử dụng đất không đúng mục đích.","b":"Khoản 27 Điều 3 Luật Đất đai 2024"},{"id":"1.12","g":1,"lv":"NB","q":"Hành vi nào sau đây thuộc danh mục hành vi bị nghiêm cấm theo Điều 11 Luật Đất đai 2024?","o":["Cho thuê quyền sử dụng đất nông nghiệp bằng hợp đồng không công chứng","Tạm ngừng canh tác đất nông nghiệp vì thiên tai","Chuyển đổi cơ cấu cây trồng trên đất trồng lúa mà vẫn giữ điều kiện trồng lúa trở lại","Phân biệt đối xử về giới trong quản lý, sử dụng đất đai"],"a":3,"e":"Khoản 11 Điều 11 Luật Đất đai 2024 nghiêm cấm phân biệt đối xử về giới trong quản lý, sử dụng đất đai. Tạm ngừng canh tác do thiên tai, chuyển đổi cơ cấu cây trồng trên đất lúa vẫn giữ điều kiện trồng lúa là hợp pháp; cho thuê đất nông nghiệp không bắt buộc công chứng (điểm b khoản 3 Điều 27) nên không phải hành vi bị cấm.","b":"Khoản 11 Điều 11 Luật Đất đai 2024"},{"id":"1.13","g":1,"lv":"NB","q":"Luật Đất đai 2024 xác định hành vi thực hiện giao dịch về quyền sử dụng đất mà không đăng ký với cơ quan có thẩm quyền là gì?","o":["Hành vi hợp pháp nếu hợp đồng đã được công chứng","Hành vi thuộc quyền tự định đoạt của người sử dụng đất","Hành vi chỉ bị nhắc nhở, không bị coi là vi phạm","Hành vi bị nghiêm cấm"],"a":3,"e":"Khoản 8 Điều 11 Luật Đất đai 2024 nghiêm cấm 'thực hiện giao dịch về quyền sử dụng đất mà không đăng ký với cơ quan có thẩm quyền'. Đăng ký biến động là bắt buộc (Điều 133) và là thời điểm giao dịch có hiệu lực (khoản 3 Điều 45); việc công chứng không thay thế được đăng ký.","b":"Khoản 8 Điều 11 Luật Đất đai 2024"},{"id":"1.14","g":1,"lv":"NB","q":"Theo Điều 19 Luật Đất đai 2024, Ủy ban Mặt trận Tổ quốc Việt Nam các cấp có trách nhiệm nào sau đây?","o":["Ban hành bảng giá đất","Cấp Giấy chứng nhận cho cộng đồng dân cư","Tham gia hòa giải tranh chấp đất đai","Quyết định giao đất cho các tổ chức thành viên"],"a":2,"e":"Điểm d khoản 2 Điều 19 Luật Đất đai 2024: Ủy ban Mặt trận Tổ quốc Việt Nam các cấp tham gia hòa giải tranh chấp đất đai, cùng với tham gia xây dựng pháp luật, giám sát, góp ý về thu hồi đất… Mặt trận không có thẩm quyền giao đất, ban hành bảng giá đất hay cấp Giấy chứng nhận (thẩm quyền của cơ quan nhà nước).","b":"Điểm d khoản 2 Điều 19 Luật Đất đai 2024"},{"id":"1.15","g":1,"lv":"NB","q":"Nghĩa vụ giữ gìn, bảo vệ và phát triển tài nguyên đất theo Điều 25 Luật Đất đai 2024 thuộc về chủ thể nào?","o":["Chỉ người đã được cấp Giấy chứng nhận","Mọi công dân","Chỉ tổ chức kinh tế sử dụng đất","Chỉ người được Nhà nước giao đất"],"a":1,"e":"Khoản 2 Điều 25 Luật Đất đai 2024 quy định nghĩa vụ của công dân: giữ gìn, bảo vệ và phát triển tài nguyên đất. Nghĩa vụ này đặt ra với mọi công dân, không chỉ người được giao đất hay đã có Giấy chứng nhận.","b":"Khoản 2 Điều 25 Luật Đất đai 2024"},{"id":"1.16","g":1,"lv":"TH","q":"Nhà nước công nhận quyền sử dụng đất thông qua hình thức pháp lý nào?","o":["Cấp Giấy chứng nhận lần đầu cho người đang sử dụng đất ổn định","Ban hành quyết định giao đất","Ký hợp đồng cho thuê đất với người sử dụng đất","Chứng thực hợp đồng chuyển nhượng quyền sử dụng đất"],"a":0,"e":"Khoản 33 Điều 3 Luật Đất đai 2024: Nhà nước công nhận quyền sử dụng đất là việc Nhà nước trao quyền sử dụng đất cho người đang sử dụng đất ổn định mà không có nguồn gốc được Nhà nước giao, cho thuê, thông qua cấp Giấy chứng nhận lần đầu. Giao đất, cho thuê đất là quyết định hành chính; chứng thực hợp đồng chuyển nhượng là giao dịch giữa người sử dụng đất.","b":"Khoản 33 Điều 3, Điều 12 Luật Đất đai 2024"},{"id":"1.17","g":1,"lv":"NB","q":"Ai là người chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất nông nghiệp vào mục đích công ích của xã?","o":["Chủ tịch Ủy ban nhân dân cấp tỉnh","Chủ tịch Hội đồng nhân dân cấp xã","Chủ tịch Ủy ban nhân dân cấp xã","Công chức làm công tác địa chính cấp xã"],"a":2,"e":"Khoản 2 Điều 6 Luật Đất đai 2024: Chủ tịch Ủy ban nhân dân cấp xã chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất nông nghiệp vào mục đích công ích, đất phi nông nghiệp đã giao cho UBND cấp xã sử dụng. Công chức địa chính chỉ tham mưu; Chủ tịch HĐND hay UBND tỉnh không phải người chịu trách nhiệm trực tiếp.","b":"Khoản 2 Điều 6 Luật Đất đai 2024"},{"id":"1.18","g":1,"lv":"NB","q":"Theo Luật Đất đai 2024, việc sử dụng đất của một công ty cổ phần do ai chịu trách nhiệm trước Nhà nước?","o":["Kế toán trưởng của công ty","Cổ đông sở hữu nhiều cổ phần nhất","Chủ tịch Ủy ban nhân dân cấp xã nơi có đất","Người đại diện theo pháp luật của công ty"],"a":3,"e":"Khoản 1 Điều 6 Luật Đất đai 2024: người đại diện theo pháp luật của tổ chức trong nước, tổ chức kinh tế có vốn đầu tư nước ngoài chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất của tổ chức mình. Cổ đông lớn hay kế toán trưởng không có tư cách này.","b":"Khoản 1 Điều 6 Luật Đất đai 2024"},{"id":"1.19","g":1,"lv":"NB","q":"Quyền điều tiết phần giá trị tăng thêm từ đất mà không do người sử dụng đất đầu tư mang lại thuộc về chủ thể nào?","o":["Cộng đồng dân cư nơi có đất","Người đang sử dụng đất","Tổ chức tín dụng nhận thế chấp quyền sử dụng đất","Nhà nước với tư cách đại diện chủ sở hữu về đất đai"],"a":3,"e":"Khoản 11 Điều 13 Luật Đất đai 2024: Nhà nước với tư cách đại diện chủ sở hữu quyết định chính sách điều tiết phần giá trị tăng thêm từ đất mà không do người sử dụng đất đầu tư mang lại (thông qua tiền sử dụng đất, thuế…). Người sử dụng đất chỉ hưởng thành quả đầu tư của mình.","b":"Khoản 11 Điều 13 Luật Đất đai 2024"},{"id":"1.20","g":1,"lv":"NB","q":"Bản Hiến pháp nào lần đầu tiên quy định đất đai thuộc sở hữu toàn dân?","o":["Hiến pháp năm 1946","Hiến pháp năm 1959","Hiến pháp năm 1992","Hiến pháp năm 1980"],"a":3,"e":"Điều 19 Hiến pháp 1980 lần đầu quy định đất đai thuộc sở hữu toàn dân. Hiến pháp 1946 và 1959 thừa nhận nhiều hình thức sở hữu đất đai (nhà nước, tập thể, tư nhân); Hiến pháp 1992 và 2013 kế thừa chế độ sở hữu toàn dân.","b":"Điều 19 Hiến pháp 1980"},{"id":"2.01","g":2,"lv":"NB","q":"Theo Luật Đất đai 2024, đất ở có thời hạn sử dụng như thế nào?","o":["50 năm và được gia hạn","70 năm","Theo thời hạn của dự án đầu tư","Ổn định lâu dài"],"a":3,"e":"Khoản 1 Điều 171 Luật Đất đai 2024: đất ở là đất sử dụng ổn định lâu dài. Thời hạn 50 năm, 70 năm áp dụng cho đất được giao, cho thuê có thời hạn (Điều 172); thời hạn theo dự án đầu tư áp dụng cho tổ chức thực hiện dự án.","b":"Khoản 1 Điều 171 Luật Đất đai 2024"},{"id":"2.02","g":2,"lv":"TH","q":"Khi hết thời hạn giao đất trồng cây hằng năm trong hạn mức, cá nhân trực tiếp sản xuất nông nghiệp được xử lý thế nào?","o":["Phải nộp hồ sơ gia hạn chậm nhất 06 tháng trước khi hết hạn","Được tiếp tục sử dụng đất theo thời hạn 50 năm mà không phải làm thủ tục gia hạn","Phải chuyển sang hình thức thuê đất trả tiền hằng năm","Nhà nước thu hồi đất rồi giao lại theo nhu cầu"],"a":1,"e":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024: thời hạn giao đất nông nghiệp trong hạn mức cho cá nhân trực tiếp sản xuất nông nghiệp là 50 năm; khi hết thời hạn được tiếp tục sử dụng đất theo thời hạn quy định mà không phải làm thủ tục gia hạn. Đây là điểm khác với các trường hợp phải nộp hồ sơ gia hạn trước 06 tháng.","b":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.03","g":2,"lv":"NB","q":"Dự án đầu tư có thời hạn hoạt động trên 50 năm theo Luật Đầu tư thì thời hạn giao đất, cho thuê đất tối đa là bao lâu?","o":["99 năm","70 năm","Ổn định lâu dài","50 năm"],"a":1,"e":"Điểm c khoản 1 Điều 172 Luật Đất đai 2024: thời hạn giao đất, cho thuê đất cho tổ chức, cá nhân thực hiện dự án đầu tư được xem xét theo thời hạn hoạt động của dự án nhưng không quá 50 năm; dự án có thời hạn hoạt động trên 50 năm theo Luật Đầu tư thì không quá 70 năm.","b":"Điểm c khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.04","g":2,"lv":"NB","q":"Thời hạn cho thuê đất xây dựng trụ sở làm việc của tổ chức nước ngoài có chức năng ngoại giao là bao lâu?","o":["Không quá 50 năm","Ổn định lâu dài","Không quá 70 năm","Không quá 99 năm"],"a":3,"e":"Điểm d khoản 1 Điều 172 Luật Đất đai 2024: thời hạn cho thuê đất xây dựng trụ sở làm việc của tổ chức nước ngoài có chức năng ngoại giao không quá 99 năm; hết hạn nếu có nhu cầu được xem xét gia hạn hoặc cho thuê đất khác.","b":"Điểm d khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.05","g":2,"lv":"NB","q":"Người sử dụng đất có thời hạn (không thuộc trường hợp miễn gia hạn) muốn gia hạn phải nộp hồ sơ chậm nhất khi nào?","o":["03 tháng trước khi hết thời hạn sử dụng đất","12 tháng trước khi hết thời hạn sử dụng đất","Trong 24 tháng sau khi hết thời hạn sử dụng đất","06 tháng trước khi hết thời hạn sử dụng đất"],"a":3,"e":"Khoản 3 Điều 172 Luật Đất đai 2024: người sử dụng đất có nhu cầu gia hạn phải nộp hồ sơ chậm nhất là 06 tháng trước khi hết thời hạn sử dụng đất (trừ trường hợp được tiếp tục sử dụng không phải gia hạn). Mốc 24 tháng là thời hạn xử lý tài sản khi không được gia hạn (khoản 4).","b":"Khoản 3 Điều 172 Luật Đất đai 2024"},{"id":"2.06","g":2,"lv":"TH","q":"Người nhận chuyển nhượng quyền sử dụng đất thuộc loại đất có thời hạn được sử dụng đất trong thời hạn nào?","o":["Thời gian còn lại của thời hạn sử dụng đất trước khi nhận chuyển quyền","Thời hạn mới 50 năm tính từ ngày nhận chuyển nhượng","Thời hạn do các bên thỏa thuận trong hợp đồng","Ổn định lâu dài kể từ ngày đăng ký biến động"],"a":0,"e":"Khoản 1 Điều 174 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất đối với loại đất có thời hạn thì thời hạn sử dụng đất là thời gian sử dụng đất còn lại của thời hạn trước khi nhận chuyển quyền. Các bên không được thỏa thuận thời hạn mới.","b":"Khoản 1 Điều 174 Luật Đất đai 2024"},{"id":"2.07","g":2,"lv":"TH","q":"Cá nhân được phép chuyển đất trồng cây hằng năm sang đất rừng phòng hộ thì thời hạn sử dụng đất là gì?","o":["Thời hạn còn lại của đất trồng cây hằng năm","50 năm kể từ ngày được phép chuyển mục đích","70 năm kể từ ngày được phép chuyển mục đích","Ổn định lâu dài"],"a":3,"e":"Điểm b khoản 1 Điều 173 Luật Đất đai 2024: trường hợp chuyển đất nông nghiệp sang đất rừng phòng hộ, rừng đặc dụng thì thời hạn sử dụng đất là ổn định lâu dài. Đây là ngoại lệ so với quy tắc chung khi chuyển mục đích trong nhóm đất nông nghiệp (thời hạn được xác định theo thời hạn đã giao, cho thuê).","b":"Điểm b khoản 1 Điều 173 Luật Đất đai 2024"},{"id":"2.08","g":2,"lv":"NB","q":"Hạn mức giao đất trồng cây hằng năm cho cá nhân trực tiếp sản xuất nông nghiệp tại một tỉnh vùng đồng bằng sông Hồng là bao nhiêu?","o":["Không quá 02 ha","Không quá 05 ha","Không quá 03 ha","Không quá 10 ha"],"a":0,"e":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024: hạn mức giao đất trồng cây hằng năm, nuôi trồng thủy sản, làm muối cho cá nhân trực tiếp sản xuất nông nghiệp là không quá 02 ha cho mỗi loại đất đối với tỉnh, thành phố khác (ngoài Đông Nam Bộ và đồng bằng sông Cửu Long, nơi hạn mức là 03 ha).","b":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024"},{"id":"2.09","g":2,"lv":"TH","q":"Diện tích đất nông nghiệp cá nhân có được do nhận chuyển nhượng từ người khác được xử lý thế nào khi xác định hạn mức giao đất nông nghiệp?","o":["Chỉ tính vào hạn mức nếu nhận chuyển nhượng ngoài xã nơi thường trú","Không tính vào hạn mức giao đất nông nghiệp","Cộng toàn bộ vào hạn mức giao đất nông nghiệp","Tính một nửa diện tích vào hạn mức giao đất"],"a":1,"e":"Khoản 7 Điều 176 Luật Đất đai 2024: diện tích đất nông nghiệp của cá nhân do nhận chuyển nhượng, thuê, thuê lại, nhận thừa kế, được tặng cho, nhận góp vốn… không tính vào hạn mức giao đất nông nghiệp. Diện tích này chịu sự điều chỉnh của hạn mức nhận chuyển quyền (Điều 177).","b":"Khoản 7 Điều 176 Luật Đất đai 2024"},{"id":"2.10","g":2,"lv":"NB","q":"Hạn mức nhận chuyển quyền sử dụng đất nông nghiệp của cá nhân đối với mỗi loại đất tối đa là bao nhiêu?","o":["Không giới hạn nếu cá nhân trực tiếp sản xuất nông nghiệp","Không quá 15 lần hạn mức giao đất nông nghiệp","Không quá 20 lần hạn mức giao đất nông nghiệp","Không quá 10 lần hạn mức giao đất nông nghiệp"],"a":1,"e":"Khoản 1 Điều 177 Luật Đất đai 2024: hạn mức nhận chuyển quyền sử dụng đất nông nghiệp của cá nhân không quá 15 lần hạn mức giao đất nông nghiệp của cá nhân đối với mỗi loại đất (Luật 2013 là 10 lần). Mức cụ thể do UBND cấp tỉnh quy định.","b":"Khoản 1 Điều 177 Luật Đất đai 2024"},{"id":"2.11","g":2,"lv":"NB","q":"Theo Luật Đất đai 2024, đất chuyên trồng lúa là đất như thế nào?","o":["Đất trồng từ 02 vụ lúa trở lên","Đất trồng lúa nương","Đất trồng 01 vụ lúa kết hợp nuôi thủy sản","Đất nằm trong vùng quy hoạch lúa chất lượng cao, không phụ thuộc số vụ"],"a":0,"e":"Khoản 1 Điều 182 Luật Đất đai 2024: đất trồng lúa gồm đất chuyên trồng lúa và đất trồng lúa còn lại; đất chuyên trồng lúa là đất trồng từ hai vụ lúa trở lên. Lúa nương, đất trồng một vụ lúa thuộc đất trồng lúa còn lại.","b":"Khoản 1 Điều 182 Luật Đất đai 2024"},{"id":"2.12","g":2,"lv":"TH","q":"Người sử dụng đất trồng lúa được chuyển đổi cơ cấu cây trồng, vật nuôi với điều kiện nào?","o":["Được Ủy ban nhân dân cấp tỉnh cho phép chuyển mục đích sử dụng đất","Không làm mất đi điều kiện cần thiết để trồng lúa trở lại","Đã nộp tiền để Nhà nước bổ sung diện tích đất trồng lúa","Chỉ áp dụng với đất trồng lúa còn lại, không áp dụng với đất chuyên trồng lúa"],"a":1,"e":"Khoản 5 Điều 182 Luật Đất đai 2024: người sử dụng đất trồng lúa được chuyển đổi cơ cấu cây trồng, vật nuôi trên đất trồng lúa nhưng không làm mất đi các điều kiện phù hợp để trồng lúa trở lại. Chuyển đổi cơ cấu không phải chuyển mục đích nên không cần UBND tỉnh cho phép; áp dụng cho cả đất chuyên trồng lúa.","b":"Khoản 5 Điều 182 Luật Đất đai 2024"},{"id":"2.13","g":2,"lv":"TH","q":"Loại đất rừng nào sau đây là đất sử dụng ổn định lâu dài?","o":["Đất rừng sản xuất là rừng trồng giao cho cá nhân trong hạn mức","Đất rừng sản xuất do tổ chức quản lý","Đất rừng sản xuất Nhà nước cho cá nhân thuê","Đất rừng sản xuất cá nhân nhận chuyển nhượng"],"a":1,"e":"Khoản 3 Điều 171 Luật Đất đai 2024: đất rừng đặc dụng, rừng phòng hộ và đất rừng sản xuất do tổ chức quản lý là đất sử dụng ổn định lâu dài. Đất rừng sản xuất là rừng trồng giao cho cá nhân trong hạn mức, cho thuê hoặc nhận chuyển nhượng là đất có thời hạn (Điều 172, 174).","b":"Khoản 3 Điều 171, điểm a khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.14","g":2,"lv":"TH","q":"Người được Nhà nước cho thuê đất rừng sản xuất là rừng tự nhiên bị hạn chế quyền nào?","o":["Không được trả tiền thuê đất hằng năm","Không được khai thác lâm sản theo quy định của pháp luật lâm nghiệp","Không được chuyển nhượng, cho thuê lại, thế chấp, góp vốn bằng quyền sử dụng đất và quyền thuê đất","Không được xây dựng công trình hạ tầng phục vụ bảo vệ, phát triển rừng"],"a":2,"e":"Khoản 3 Điều 184 Luật Đất đai 2024: tổ chức, cá nhân được Nhà nước cho thuê đất rừng sản xuất là rừng tự nhiên để bảo vệ, phát triển rừng… không được chuyển nhượng, cho thuê lại, thế chấp, góp vốn bằng quyền sử dụng đất và quyền thuê trong hợp đồng thuê đất. Họ vẫn được khai thác lâm sản và xây công trình phục vụ bảo vệ rừng theo pháp luật lâm nghiệp.","b":"Khoản 3 Điều 184 Luật Đất đai 2024"},{"id":"2.15","g":2,"lv":"NB","q":"Diện tích đất nông nghiệp công ích chưa sử dụng được Ủy ban nhân dân cấp xã cho thuê theo hình thức và thời hạn nào?","o":["Đấu giá, mỗi lần thuê không quá 10 năm","Chỉ định, thời hạn theo thỏa thuận","Đấu giá, mỗi lần thuê không quá 20 năm","Chỉ định, mỗi lần thuê không quá 05 năm"],"a":0,"e":"Khoản 3 Điều 179 Luật Đất đai 2024: đối với diện tích quỹ đất nông nghiệp công ích chưa sử dụng, UBND cấp xã cho cá nhân tại địa phương thuê để sản xuất nông nghiệp, nuôi trồng thủy sản theo hình thức đấu giá; thời hạn sử dụng đất đối với mỗi lần thuê không quá 10 năm.","b":"Khoản 3 Điều 179 Luật Đất đai 2024"},{"id":"2.16","g":2,"lv":"NB","q":"Đất có đình, đền, miếu, am, nhà thờ họ thuộc loại đất nào?","o":["Đất tôn giáo","Đất ở","Đất tín ngưỡng","Đất sử dụng vào mục đích công cộng"],"a":2,"e":"Khoản 1 Điều 212 và điểm g khoản 3 Điều 9 Luật Đất đai 2024: đất tín ngưỡng gồm đất có công trình đình, đền, miếu, am, nhà thờ họ, công trình tín ngưỡng khác. Đất tôn giáo là đất cơ sở tôn giáo, trụ sở tổ chức tôn giáo (Điều 213).","b":"Khoản 1 Điều 212, điểm g khoản 3 Điều 9 Luật Đất đai 2024"},{"id":"2.17","g":2,"lv":"NB","q":"Nhà nước trao quyền sử dụng đất xây dựng cơ sở tôn giáo, trụ sở của tổ chức tôn giáo theo hình thức nào?","o":["Giao đất có thu tiền sử dụng đất","Cho thuê đất trả tiền thuê một lần","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền thuê đất hằng năm"],"a":2,"e":"Khoản 2 Điều 213 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất cho tổ chức tôn giáo, tổ chức tôn giáo trực thuộc sử dụng đất xây dựng cơ sở tôn giáo, trụ sở của tổ chức tôn giáo, công trình sự nghiệp của tổ chức tôn giáo. Phần đất dùng cho mục đích sản xuất kinh doanh thì Nhà nước cho thuê (khoản 3).","b":"Khoản 2 Điều 213 Luật Đất đai 2024"},{"id":"2.18","g":2,"lv":"TH","q":"Người đang sử dụng đất nằm trong quy hoạch sử dụng đất quốc phòng nhưng chưa có nhu cầu sử dụng vào mục đích quốc phòng được xử lý thế nào?","o":["Được tiếp tục sử dụng đến khi có quyết định thu hồi đất nhưng không được làm biến dạng địa hình tự nhiên","Phải bàn giao ngay đất cho đơn vị quân đội","Phải chuyển sang thuê đất của Bộ Quốc phòng","Được chuyển nhượng cho đơn vị quân đội theo giá thỏa thuận"],"a":0,"e":"Khoản 3 Điều 200 Luật Đất đai 2024: người đang sử dụng đất nằm trong quy hoạch sử dụng đất quốc phòng, an ninh nhưng chưa có nhu cầu sử dụng vào mục đích quốc phòng, an ninh thì được tiếp tục sử dụng đến khi có quyết định thu hồi đất, nhưng không được làm biến dạng địa hình tự nhiên. Không phải bàn giao ngay hay chuyển sang thuê.","b":"Khoản 3 Điều 200 Luật Đất đai 2024"},{"id":"2.19","g":2,"lv":"TH","q":"Đối với diện tích đất xây dựng kết cấu hạ tầng sử dụng chung trong khu công nghiệp theo quy hoạch đã được phê duyệt, chủ đầu tư hạ tầng có nghĩa vụ tài chính gì?","o":["Không phải nộp tiền thuê đất","Nộp tiền thuê đất bằng 50% mức thông thường","Nộp tiền thuê đất hằng năm như phần đất kinh doanh","Nộp tiền sử dụng đất một lần"],"a":0,"e":"Khoản 3 Điều 202 Luật Đất đai 2024: nhà đầu tư xây dựng, kinh doanh kết cấu hạ tầng khu công nghiệp không phải nộp tiền thuê đất đối với diện tích đất xây dựng kết cấu hạ tầng sử dụng chung trong khu công nghiệp theo quy hoạch đã được phê duyệt.","b":"Khoản 3 Điều 202 Luật Đất đai 2024"},{"id":"2.20","g":2,"lv":"TH","q":"Đất thương mại, dịch vụ của cá nhân là đất sử dụng ổn định lâu dài trong trường hợp nào?","o":["Được Nhà nước cho thuê trả tiền một lần","Đang sử dụng ổn định, được Nhà nước công nhận mà không phải là đất được Nhà nước giao có thời hạn, cho thuê","Nhận chuyển nhượng từ tổ chức kinh tế thuê đất","Được Nhà nước giao có thời hạn để thực hiện dự án"],"a":1,"e":"Khoản 4 Điều 171 Luật Đất đai 2024: đất thương mại, dịch vụ, đất cơ sở sản xuất phi nông nghiệp của cá nhân là đất sử dụng ổn định lâu dài khi đang sử dụng ổn định được Nhà nước công nhận mà không phải là đất được Nhà nước giao có thời hạn, cho thuê. Đất được giao có thời hạn, cho thuê hoặc nhận chuyển nhượng từ tổ chức thuê đất là đất có thời hạn.","b":"Khoản 4 Điều 171 Luật Đất đai 2024"},{"id":"3.01","g":3,"lv":"NB","q":"Cơ quan nào thống nhất quản lý nhà nước về đất đai trong phạm vi cả nước?","o":["Chính phủ","Ủy ban Thường vụ Quốc hội","Bộ Nông nghiệp và Môi trường","Quốc hội"],"a":0,"e":"Khoản 1 Điều 21 Luật Đất đai 2024: Chính phủ thống nhất quản lý nhà nước về đất đai trong phạm vi cả nước. Bộ Nông nghiệp và Môi trường chịu trách nhiệm trước Chính phủ trong việc thực hiện quản lý (khoản 2); Quốc hội thực hiện quyền đại diện chủ sở hữu và giám sát tối cao.","b":"Khoản 1 Điều 21 Luật Đất đai 2024"},{"id":"3.02","g":3,"lv":"NB","q":"Hoạt động nào sau đây thuộc nội dung quản lý nhà nước về đất đai theo Điều 20 Luật Đất đai 2024?","o":["Xét xử vụ án hình sự về tội vi phạm quy định về quản lý đất đai","Công chứng hợp đồng chuyển nhượng quyền sử dụng đất","Giải quyết tranh chấp đất đai; giải quyết khiếu nại, tố cáo về đất đai","Định giá cổ phần của doanh nghiệp có tài sản là quyền sử dụng đất"],"a":2,"e":"Khoản 16 Điều 20 Luật Đất đai 2024: giải quyết tranh chấp đất đai; giải quyết khiếu nại, tố cáo về đất đai là một nội dung quản lý nhà nước về đất đai. Xét xử hình sự thuộc Tòa án; công chứng, định giá cổ phần không phải nội dung quản lý nhà nước về đất đai.","b":"Khoản 16 Điều 20 Luật Đất đai 2024"},{"id":"3.03","g":3,"lv":"NB","q":"Hoạt động điều tra, đánh giá chất lượng đất, thoái hóa đất, ô nhiễm đất được thực hiện theo chu kỳ nào?","o":["Chỉ khi có yêu cầu của Bộ trưởng","Hằng năm","Định kỳ 10 năm một lần","Định kỳ 05 năm một lần"],"a":3,"e":"Khoản 3 Điều 52 Luật Đất đai 2024: điều tra, đánh giá chất lượng đất, thoái hóa đất, ô nhiễm đất được thực hiện định kỳ 05 năm một lần (và theo chuyên đề khi cần). Thống kê đất đai mới thực hiện hằng năm.","b":"Khoản 3 Điều 52 Luật Đất đai 2024"},{"id":"3.04","g":3,"lv":"NB","q":"Kiểm kê đất đai định kỳ được thực hiện tính đến hết ngày 31 tháng 12 của năm nào?","o":["Năm cuối của thời kỳ quy hoạch sử dụng đất","Mọi năm chẵn","Năm có chữ số tận cùng là 0 hoặc 5","Năm có chữ số tận cùng là 4 hoặc 9"],"a":3,"e":"Điểm b khoản 2 Điều 57 Luật Đất đai 2024: kiểm kê đất đai định kỳ được thực hiện 05 năm một lần, tính đến hết ngày 31 tháng 12 của năm có chữ số tận cùng là 4 hoặc 9 (2024, 2029…). Thống kê thực hiện hằng năm, trừ năm thực hiện kiểm kê.","b":"Điểm b khoản 2 Điều 57 Luật Đất đai 2024"},{"id":"3.05","g":3,"lv":"NB","q":"Thời kỳ kế hoạch sử dụng đất quốc gia và kế hoạch sử dụng đất cấp tỉnh là bao lâu?","o":["Hằng năm","10 năm","03 năm","05 năm"],"a":3,"e":"Khoản 4 Điều 62 Luật Đất đai 2024: thời kỳ quy hoạch sử dụng đất là 10 năm; thời kỳ kế hoạch sử dụng đất quốc gia, kế hoạch sử dụng đất cấp tỉnh là 05 năm.","b":"Khoản 4 Điều 62 Luật Đất đai 2024"},{"id":"3.06","g":3,"lv":"TH","q":"Theo nguyên tắc lập quy hoạch sử dụng đất, thứ tự quyết định, phê duyệt quy hoạch các cấp được xác định thế nào?","o":["Quy hoạch cấp thấp hơn được phê duyệt trước để làm cơ sở cho cấp cao hơn","Quy hoạch cấp cao hơn phải được quyết định, phê duyệt trước quy hoạch cấp thấp hơn","Quy hoạch nào hoàn thành hồ sơ trước thì phê duyệt trước","Các cấp được phê duyệt độc lập, không phụ thuộc thứ tự"],"a":1,"e":"Khoản 9 Điều 60 Luật Đất đai 2024: quy hoạch sử dụng đất cấp trên phải được quyết định, phê duyệt trước quy hoạch sử dụng đất cấp dưới; quy hoạch cấp dưới phải phù hợp quy hoạch cấp trên. Điều này bảo đảm tính thống nhất, thứ bậc của hệ thống quy hoạch.","b":"Khoản 9 Điều 60 Luật Đất đai 2024"},{"id":"3.07","g":3,"lv":"TH","q":"Quy hoạch sử dụng đất quốc phòng thuộc loại quy hoạch nào trong hệ thống quy hoạch quốc gia?","o":["Quy hoạch đô thị","Quy hoạch ngành quốc gia","Quy hoạch tỉnh","Quy hoạch xây dựng vùng liên huyện"],"a":1,"e":"Khoản 2 Điều 61 và khoản 1 Điều 68 Luật Đất đai 2024: quy hoạch sử dụng đất quốc phòng, quy hoạch sử dụng đất an ninh là quy hoạch ngành quốc gia trong hệ thống quy hoạch quốc gia theo Luật Quy hoạch, do Bộ Quốc phòng, Bộ Công an tổ chức lập.","b":"Khoản 2 Điều 61, khoản 1 Điều 68 Luật Đất đai 2024"},{"id":"3.08","g":3,"lv":"NB","q":"Quan hệ giao đất giữa Nhà nước và người sử dụng đất được xác lập bằng hình thức pháp lý nào?","o":["Quyết định giao đất của cơ quan nhà nước có thẩm quyền","Văn bản công chứng thỏa thuận giao đất","Biên bản hòa giải tại Ủy ban nhân dân cấp xã","Hợp đồng giao quyền sử dụng đất"],"a":0,"e":"Khoản 34 Điều 3 Luật Đất đai 2024: Nhà nước giao quyền sử dụng đất (giao đất) là việc Nhà nước ban hành quyết định giao đất để trao quyền sử dụng đất cho đối tượng có nhu cầu sử dụng đất. Hình thức pháp lý là quyết định hành chính, không phải hợp đồng hay văn bản công chứng (khác cho thuê đất có hợp đồng thuê).","b":"Khoản 34 Điều 3 Luật Đất đai 2024"},{"id":"3.09","g":3,"lv":"NB","q":"Cá nhân trực tiếp sản xuất nông nghiệp được Nhà nước giao đất nông nghiệp trong hạn mức theo hình thức nào?","o":["Cho thuê đất trả tiền hằng năm","Giao đất có thu tiền sử dụng đất","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền một lần"],"a":2,"e":"Khoản 1 Điều 118 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất đối với cá nhân trực tiếp sản xuất nông nghiệp, lâm nghiệp, nuôi trồng thủy sản, làm muối được giao đất nông nghiệp trong hạn mức. Vượt hạn mức thì phải thuê đất.","b":"Khoản 1 Điều 118 Luật Đất đai 2024"},{"id":"3.10","g":3,"lv":"NB","q":"Cá nhân được Nhà nước giao đất ở thì thuộc trường hợp nào?","o":["Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền hằng năm","Giao đất có thu tiền sử dụng đất","Công nhận quyền sử dụng đất"],"a":2,"e":"Điều 119 Luật Đất đai 2024: Nhà nước giao đất có thu tiền sử dụng đất trong trường hợp cá nhân được giao đất ở (cùng với các trường hợp tổ chức kinh tế thực hiện dự án nhà ở thương mại để bán…). Công nhận quyền sử dụng đất chỉ áp dụng với người đang sử dụng đất ổn định.","b":"Điều 119 Luật Đất đai 2024"},{"id":"3.11","g":3,"lv":"NB","q":"Đơn vị sự nghiệp công lập sử dụng đất xây dựng công trình sự nghiệp được Nhà nước trao quyền sử dụng đất theo hình thức nào?","o":["Cho thuê đất trả tiền một lần","Giao đất có thu tiền sử dụng đất","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền hằng năm"],"a":2,"e":"Khoản 4 Điều 118 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất cho đơn vị sự nghiệp công lập sử dụng đất xây dựng công trình sự nghiệp (trường hợp không lựa chọn thuê đất). Đây là đất phục vụ hoạt động sự nghiệp công, không nhằm kinh doanh.","b":"Khoản 4 Điều 118 Luật Đất đai 2024"},{"id":"3.12","g":3,"lv":"TH","q":"Trường hợp chuyển mục đích nào trong nội bộ nhóm đất nông nghiệp phải được cơ quan nhà nước có thẩm quyền cho phép?","o":["Chuyển đất trồng cây lâu năm sang đất trồng cây hằng năm khác","Chuyển đất trồng lúa sang đất trồng cây lâu năm","Chuyển đất nuôi trồng thủy sản sang đất trồng cây hằng năm khác","Chuyển đất trồng cây hằng năm khác sang đất nuôi trồng thủy sản"],"a":1,"e":"Điểm a khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất trồng lúa, đất rừng đặc dụng, rừng phòng hộ, rừng sản xuất sang loại đất khác trong nhóm đất nông nghiệp phải được cơ quan có thẩm quyền cho phép. Các trường hợp chuyển giữa đất trồng cây hằng năm khác, cây lâu năm, nuôi trồng thủy sản không thuộc khoản 1 nên không phải xin phép (khoản 3).","b":"Điểm a khoản 1, khoản 3 Điều 121 Luật Đất đai 2024"},{"id":"3.13","g":3,"lv":"TH","q":"Trường hợp chuyển mục đích nào sau đây phải được cơ quan nhà nước có thẩm quyền cho phép?","o":["Chuyển đất trồng cây hằng năm khác sang đất trồng cây lâu năm","Chuyển đất thương mại, dịch vụ sang đất cơ sở sản xuất phi nông nghiệp","Chuyển đất phi nông nghiệp không phải đất ở sang đất ở","Chuyển đất ở sang đất thương mại, dịch vụ"],"a":2,"e":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất phi nông nghiệp không phải là đất ở sang đất ở phải được cơ quan có thẩm quyền cho phép. Chuyển đất ở sang đất thương mại, dịch vụ hay giữa các loại đất sản xuất kinh doanh phi nông nghiệp không thuộc diện phải xin phép.","b":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024"},{"id":"3.14","g":3,"lv":"TH","q":"Đăng ký đất đai có tính chất pháp lý như thế nào đối với người sử dụng đất?","o":["Theo yêu cầu của người sử dụng đất","Bắt buộc đối với người sử dụng đất và người được giao đất để quản lý","Bắt buộc riêng đối với tổ chức kinh tế","Bắt buộc riêng khi chuyển nhượng quyền sử dụng đất"],"a":1,"e":"Khoản 1 Điều 131 Luật Đất đai 2024: đăng ký đất đai là bắt buộc đối với người sử dụng đất và người được giao đất để quản lý. Đăng ký không chỉ đặt ra khi chuyển nhượng hay đối với tổ chức kinh tế.","b":"Khoản 1 Điều 131 Luật Đất đai 2024"},{"id":"3.15","g":3,"lv":"TH","q":"Việc đăng ký quyền sở hữu nhà ở, công trình xây dựng gắn liền với đất được thực hiện thế nào?","o":["Theo yêu cầu của chủ sở hữu","Bắt buộc trong 30 ngày kể từ ngày hoàn thành xây dựng","Chỉ thực hiện khi Nhà nước thu hồi đất","Bắt buộc như đăng ký đất đai"],"a":0,"e":"Khoản 2 Điều 131 Luật Đất đai 2024: đăng ký quyền sở hữu nhà ở, công trình xây dựng gắn liền với đất được thực hiện theo yêu cầu của chủ sở hữu. Khác với đăng ký đất đai là bắt buộc.","b":"Khoản 2 Điều 131 Luật Đất đai 2024"},{"id":"3.16","g":3,"lv":"NB","q":"Đăng ký đất đai bằng hình thức điện tử có giá trị pháp lý thế nào so với đăng ký trên giấy?","o":["Chỉ áp dụng được cho đăng ký biến động","Giá trị thấp hơn đăng ký trên giấy","Có giá trị pháp lý như nhau","Chỉ để tham khảo cho đến khi nộp bản giấy"],"a":2,"e":"Khoản 3 Điều 131 Luật Đất đai 2024: đăng ký đất đai, tài sản gắn liền với đất gồm đăng ký trên giấy và đăng ký điện tử; hai hình thức có giá trị pháp lý như nhau.","b":"Khoản 3 Điều 131 Luật Đất đai 2024"},{"id":"3.17","g":3,"lv":"TH","q":"Trường hợp nào sau đây KHÔNG được cấp Giấy chứng nhận?","o":["Đất ở của cá nhân đang sử dụng ổn định, không tranh chấp","Đất tổ chức kinh tế được Nhà nước cho thuê","Đất nông nghiệp sử dụng vào mục đích công ích","Đất tín ngưỡng của cộng đồng dân cư"],"a":2,"e":"Điều 151 Luật Đất đai 2024 liệt kê các trường hợp không cấp Giấy chứng nhận, trong đó có đất nông nghiệp sử dụng vào mục đích công ích do UBND cấp xã quản lý. Đất tín ngưỡng của cộng đồng, đất ở cá nhân sử dụng ổn định, đất tổ chức kinh tế thuê của Nhà nước đều được cấp Giấy chứng nhận.","b":"Điều 151 Luật Đất đai 2024"},{"id":"3.18","g":3,"lv":"TH","q":"Người thuê đất được cấp Giấy chứng nhận trong trường hợp nào?","o":["Thuê lại đất của hộ gia đình đã có Giấy chứng nhận","Thuê, thuê lại đất của chủ đầu tư xây dựng kinh doanh kết cấu hạ tầng phù hợp với dự án đã được phê duyệt","Thuê đất nông nghiệp công ích của Ủy ban nhân dân cấp xã","Thuê đất trồng rau của một cá nhân trong thời hạn trên 05 năm"],"a":1,"e":"Điều 151 Luật Đất đai 2024: người thuê, thuê lại đất của người sử dụng đất không được cấp Giấy chứng nhận, trừ trường hợp thuê, thuê lại đất của nhà đầu tư xây dựng, kinh doanh kết cấu hạ tầng (khu công nghiệp, cụm công nghiệp…) phù hợp với dự án đầu tư đã được phê duyệt. Thuê đất của cá nhân, thuê đất công ích không được cấp.","b":"Điều 151 Luật Đất đai 2024"},{"id":"3.19","g":3,"lv":"NB","q":"Quyền sử dụng đất là tài sản chung của vợ chồng thì Giấy chứng nhận được ghi tên như thế nào?","o":["Ghi cả họ, tên vợ và họ, tên chồng, trừ trường hợp vợ chồng thỏa thuận ghi tên một người làm đại diện","Ghi \"Hộ gia đình\" kèm tên người đại diện","Chỉ ghi tên người chồng là chủ hộ","Ghi tên người trực tiếp trả tiền nhận chuyển nhượng"],"a":0,"e":"Khoản 4 Điều 135 Luật Đất đai 2024: trường hợp quyền sử dụng đất là tài sản chung của vợ và chồng thì phải ghi cả họ, tên vợ và họ, tên chồng vào Giấy chứng nhận, trừ trường hợp vợ và chồng có thỏa thuận ghi tên một người để đứng tên làm đại diện. Luật 2024 không còn ghi 'hộ gia đình'.","b":"Khoản 4 Điều 135 Luật Đất đai 2024"},{"id":"3.20","g":3,"lv":"TH","q":"Thửa đất đã có quyết định thu hồi đất nhưng chưa thực hiện thì được xem xét cấp Giấy chứng nhận khi nào?","o":["Khi người sử dụng đất khiếu nại quyết định thu hồi","Không được cấp trong mọi trường hợp","Đã quá 03 năm kể từ thời điểm có quyết định thu hồi mà không thực hiện","Đã quá 12 tháng kể từ thời điểm có quyết định thu hồi"],"a":2,"e":"Điều 151 Luật Đất đai 2024: đất đã có quyết định thu hồi thì không cấp Giấy chứng nhận, trừ trường hợp đã quá 03 năm kể từ thời điểm có quyết định thu hồi đất mà không thực hiện. Quy định nhằm bảo vệ người sử dụng đất khỏi tình trạng 'treo' quyết định thu hồi.","b":"Điều 151 Luật Đất đai 2024"},{"id":"4.01","g":4,"lv":"NB","q":"Quyền nào sau đây thuộc nhóm quyền chung của người sử dụng đất theo Điều 26 Luật Đất đai 2024?","o":["Được chuyển mục đích sử dụng đất theo quy định của pháp luật","Được tự quyết định giá đất khi Nhà nước thu hồi đất","Được sử dụng đất không thời hạn đối với mọi loại đất","Được miễn đăng ký đất đai nếu đất có nguồn gốc thừa kế"],"a":0,"e":"Khoản 6 Điều 26 Luật Đất đai 2024: người sử dụng đất có quyền chung được chuyển mục đích sử dụng đất theo quy định của pháp luật. Mọi loại đất không phải đều không thời hạn; đăng ký đất đai là bắt buộc; giá đất bồi thường do Nhà nước quyết định.","b":"Khoản 6 Điều 26 Luật Đất đai 2024"},{"id":"4.02","g":4,"lv":"TH","q":"Tổ chức trong nước được Nhà nước giao đất không thu tiền sử dụng đất có quyền nào đối với quyền sử dụng đất?","o":["Được cho thuê quyền sử dụng đất trong thời hạn tối đa 05 năm","Chỉ có các quyền và nghĩa vụ chung; không được chuyển nhượng, cho thuê, thế chấp, góp vốn bằng quyền sử dụng đất","Được góp vốn bằng quyền sử dụng đất với tổ chức kinh tế","Được thế chấp quyền sử dụng đất tại tổ chức tín dụng"],"a":1,"e":"Khoản 1, 2 Điều 32 Luật Đất đai 2024: tổ chức trong nước được Nhà nước giao đất không thu tiền sử dụng đất chỉ có các quyền, nghĩa vụ chung (Điều 26, 31); không được chuyển đổi, chuyển nhượng, tặng cho, cho thuê quyền sử dụng đất; không được thế chấp, góp vốn bằng quyền sử dụng đất.","b":"Khoản 1, khoản 2 Điều 32 Luật Đất đai 2024"},{"id":"4.03","g":4,"lv":"TH","q":"Tổ chức kinh tế được Nhà nước giao đất có thu tiền sử dụng đất được tặng cho quyền sử dụng đất trong trường hợp nào?","o":["Tặng cho tổ chức kinh tế khác là đối tác kinh doanh","Tặng cho cộng đồng dân cư để mở rộng đường giao thông theo quy hoạch","Tặng cho cá nhân có quan hệ thân thích với người đại diện theo pháp luật","Tặng cho người lao động của công ty"],"a":1,"e":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024: tổ chức kinh tế được giao đất có thu tiền sử dụng đất chỉ được tặng cho quyền sử dụng đất cho Nhà nước, cho cộng đồng dân cư để xây dựng công trình phục vụ lợi ích chung, tặng cho để xây nhà tình nghĩa, nhà tình thương, nhà đại đoàn kết. Không được tặng cho người lao động, đối tác hay cá nhân thân thích.","b":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024"},{"id":"4.04","g":4,"lv":"TH","q":"Tổ chức kinh tế được Nhà nước cho thuê đất thu tiền thuê đất hằng năm được thế chấp tài sản nào?","o":["Tài sản thuộc sở hữu của mình gắn liền với đất thuê","Quyền sử dụng đất thuê","Quyền sử dụng đất và tài sản gắn liền với đất thuê","Toàn bộ tiền thuê đất đã nộp"],"a":0,"e":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024: tổ chức kinh tế được Nhà nước cho thuê đất thu tiền thuê đất hằng năm được thế chấp tài sản thuộc sở hữu của mình gắn liền với đất thuê tại tổ chức tín dụng… Không được thế chấp quyền sử dụng đất thuê vì chưa trả trước tiền thuê cho cả thời gian thuê.","b":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024"},{"id":"4.05","g":4,"lv":"TH","q":"Cá nhân được Nhà nước cho thuê đất thu tiền thuê đất hằng năm được để thừa kế những gì?","o":["Chỉ tiền thuê đất đã nộp trước","Tài sản thuộc sở hữu của mình gắn liền với đất và quyền thuê trong hợp đồng thuê đất","Không được để thừa kế bất kỳ quyền nào liên quan đến đất thuê","Quyền sử dụng đất thuê như đất được giao có thu tiền"],"a":1,"e":"Điểm c khoản 2 Điều 37 Luật Đất đai 2024: cá nhân thuê đất trả tiền hằng năm được để thừa kế, tặng cho tài sản thuộc sở hữu của mình gắn liền với đất thuê; người nhận thừa kế, tặng cho được Nhà nước tiếp tục cho thuê đất… Luật 2024 bổ sung khái niệm 'quyền thuê trong hợp đồng thuê đất' cũng được thừa kế cùng tài sản.","b":"Điểm c khoản 2 Điều 37 Luật Đất đai 2024"},{"id":"4.06","g":4,"lv":"NB","q":"Cá nhân được chuyển đổi quyền sử dụng đất nông nghiệp cho cá nhân khác trong phạm vi nào?","o":["Trên phạm vi toàn quốc","Trong cùng đơn vị hành chính cấp xã","Trong cùng đơn vị hành chính cấp tỉnh","Trong cùng vùng kinh tế - xã hội"],"a":2,"e":"Điều 47 và điểm b khoản 1 Điều 37 Luật Đất đai 2024: cá nhân sử dụng đất nông nghiệp do được Nhà nước giao, nhận chuyển nhượng, thừa kế… được chuyển đổi quyền sử dụng đất nông nghiệp trong cùng đơn vị hành chính cấp tỉnh cho cá nhân khác (Luật 2013 giới hạn trong cùng xã).","b":"Điều 47, điểm b khoản 1 Điều 37 Luật Đất đai 2024"},{"id":"4.07","g":4,"lv":"NB","q":"Hợp đồng cho thuê quyền sử dụng đất giữa hai cá nhân phải đáp ứng yêu cầu nào về công chứng, chứng thực?","o":["Bắt buộc công chứng hoặc chứng thực","Chỉ có hiệu lực khi được Ủy ban nhân dân cấp xã chứng thực","Phải công chứng nếu thời hạn thuê trên 05 năm","Được công chứng hoặc chứng thực theo yêu cầu của các bên"],"a":3,"e":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng cho thuê, cho thuê lại quyền sử dụng đất, hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp… được công chứng hoặc chứng thực theo yêu cầu của các bên. Chỉ hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn mới bắt buộc công chứng, chứng thực (điểm a).","b":"Điểm b khoản 3 Điều 27 Luật Đất đai 2024"},{"id":"4.08","g":4,"lv":"NB","q":"Văn bản về thừa kế quyền sử dụng đất được công chứng, chứng thực theo quy định nào?","o":["Theo quyết định của Ủy ban nhân dân cấp xã","Theo quy định của pháp luật về dân sự","Không cần công chứng, chứng thực","Bắt buộc theo Luật Đất đai trong mọi trường hợp"],"a":1,"e":"Điểm c khoản 3 Điều 27 Luật Đất đai 2024: văn bản về thừa kế quyền sử dụng đất, quyền sử dụng đất và tài sản gắn liền với đất được công chứng hoặc chứng thực theo quy định của pháp luật về dân sự (BLDS, Luật Công chứng).","b":"Điểm c khoản 3 Điều 27 Luật Đất đai 2024"},{"id":"4.09","g":4,"lv":"TH","q":"Trường hợp nào sau đây bị cấm nhận chuyển nhượng quyền sử dụng đất?","o":["Cá nhân nhận chuyển nhượng đất ở của cá nhân khác ở tỉnh khác","Cá nhân trực tiếp sản xuất nông nghiệp nhận chuyển nhượng đất trồng lúa trong hạn mức","Tổ chức kinh tế nhận chuyển nhượng đất thương mại, dịch vụ của tổ chức kinh tế khác","Tổ chức kinh tế nhận chuyển nhượng đất rừng phòng hộ của cá nhân, trừ trường hợp được chuyển mục đích theo quy hoạch"],"a":3,"e":"Điểm a khoản 8 Điều 45 Luật Đất đai 2024: tổ chức kinh tế không được nhận chuyển nhượng quyền sử dụng đất rừng đặc dụng, rừng phòng hộ, rừng sản xuất của cá nhân, trừ trường hợp được chuyển mục đích sử dụng đất theo quy hoạch, kế hoạch sử dụng đất đã được phê duyệt. Các trường hợp còn lại đều được phép.","b":"Điểm a khoản 8 Điều 45 Luật Đất đai 2024"},{"id":"4.10","g":4,"lv":"TH","q":"Người sử dụng đất đang được ghi nợ nghĩa vụ tài chính muốn chuyển nhượng quyền sử dụng đất thì phải làm gì?","o":["Chỉ cần ghi chú khoản nợ trong hợp đồng chuyển nhượng","Thực hiện xong nghĩa vụ tài chính trước khi chuyển nhượng","Được chuyển nhượng, khoản nợ tự động được xóa","Được chuyển nhượng và chuyển khoản nợ cho bên nhận chuyển nhượng"],"a":1,"e":"Khoản 5 Điều 45 Luật Đất đai 2024: người sử dụng đất được ghi nợ hoặc được chậm nộp nghĩa vụ tài chính thì phải hoàn thành nghĩa vụ tài chính trước khi thực hiện các quyền chuyển nhượng, tặng cho, thế chấp… Khoản nợ không được chuyển cho bên nhận hay tự động xóa.","b":"Khoản 5 Điều 45 Luật Đất đai 2024"},{"id":"4.11","g":4,"lv":"TH","q":"Người có Giấy chứng nhận nhưng quyền sử dụng đất đang bị áp dụng biện pháp khẩn cấp tạm thời thì có được chuyển nhượng không?","o":["Không được, vì không bị áp dụng biện pháp khẩn cấp tạm thời là một điều kiện bắt buộc","Được nếu bên nhận chuyển nhượng đồng ý","Được, vì đã có Giấy chứng nhận","Được nếu hợp đồng đã công chứng"],"a":0,"e":"Điểm đ khoản 1 Điều 45 Luật Đất đai 2024: một điều kiện để chuyển nhượng là quyền sử dụng đất không bị áp dụng biện pháp khẩn cấp tạm thời theo quy định của pháp luật. Việc có Giấy chứng nhận hay công chứng hợp đồng không khắc phục được điều kiện này.","b":"Điểm đ khoản 1 Điều 45 Luật Đất đai 2024"},{"id":"4.12","g":4,"lv":"TH","q":"Trường hợp nào người sử dụng đất được thực hiện quyền mà không bắt buộc phải có Giấy chứng nhận?","o":["Chuyển nhượng quyền sử dụng đất cho cá nhân","Góp vốn bằng quyền sử dụng đất vào doanh nghiệp","Thế chấp quyền sử dụng đất tại ngân hàng","Tặng cho quyền sử dụng đất cho Nhà nước"],"a":3,"e":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024: điều kiện có Giấy chứng nhận có ngoại lệ, trong đó có trường hợp tặng cho quyền sử dụng đất cho Nhà nước hoặc cho cộng đồng dân cư, chuyển đổi khi dồn điền, đổi thửa, thừa kế. Chuyển nhượng, góp vốn, thế chấp vẫn phải có Giấy chứng nhận.","b":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024"},{"id":"4.13","g":4,"lv":"TH","q":"Cộng đồng dân cư có quyền và nghĩa vụ như cá nhân có hình thức sử dụng đất tương ứng, trừ quyền nào?","o":["Quyền để thừa kế","Quyền được cấp Giấy chứng nhận","Quyền được bảo hộ khi bị xâm phạm","Quyền khiếu nại, tố cáo, khởi kiện"],"a":0,"e":"Khoản 2 Điều 39 Luật Đất đai 2024: cộng đồng dân cư sử dụng đất có quyền, nghĩa vụ như cá nhân sử dụng đất theo hình thức tương ứng nhưng không được chuyển đổi, chuyển nhượng, tặng cho, cho thuê, thế chấp, góp vốn và cũng không có quyền để thừa kế (vì cộng đồng không phải con người tự nhiên).","b":"Khoản 2 Điều 39 Luật Đất đai 2024"},{"id":"4.14","g":4,"lv":"TH","q":"Người nước ngoài thuộc hàng thừa kế, không thuộc đối tượng được sở hữu nhà ở tại Việt Nam, được hưởng phần thừa kế là nhà ở gắn liền với quyền sử dụng đất ở như thế nào?","o":["Không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho phần thừa kế cho người đủ điều kiện","Mất toàn bộ quyền hưởng di sản","Được cấp Giấy chứng nhận như công dân Việt Nam","Được cấp Giấy chứng nhận có thời hạn 50 năm"],"a":0,"e":"Khoản 3, 5 Điều 44 Luật Đất đai 2024: người thừa kế là người nước ngoài hoặc người gốc Việt Nam định cư ở nước ngoài không thuộc đối tượng được sở hữu nhà ở tại Việt Nam thì không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho quyền sử dụng đất thừa kế cho người đủ điều kiện để hưởng giá trị.","b":"Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024"},{"id":"4.15","g":4,"lv":"TH","q":"Việc tổ chức trong nước, cá nhân nhận chuyển nhượng quyền sử dụng đất có phụ thuộc vào nơi cư trú, nơi đóng trụ sở không?","o":["Chỉ không phụ thuộc đối với đất ở","Phải cư trú hoặc đóng trụ sở tại cùng tỉnh nơi có đất","Không phụ thuộc, trừ một số trường hợp luật định","Người nhận cần thường trú tại cùng xã nơi có đất"],"a":2,"e":"Khoản 2 Điều 28 Luật Đất đai 2024: tổ chức trong nước, cá nhân, cộng đồng dân cư… được nhận chuyển quyền sử dụng đất không phụ thuộc vào nơi cư trú, nơi đóng trụ sở, trừ trường hợp luật quy định khác (như đất trong khu vực rừng phòng hộ, đất trồng lúa của người không trực tiếp sản xuất).","b":"Khoản 2 Điều 28 Luật Đất đai 2024"},{"id":"4.16","g":4,"lv":"NB","q":"Quyền thuê trong hợp đồng thuê đất hình thành khi nào?","o":["Khi cá nhân cho tổ chức thuê quyền sử dụng đất","Khi Nhà nước cho thuê đất thu tiền thuê đất hằng năm","Khi Nhà nước giao đất có thu tiền sử dụng đất","Khi Nhà nước cho thuê đất thu tiền thuê đất một lần"],"a":1,"e":"Khoản 37 Điều 3 Luật Đất đai 2024: quyền thuê trong hợp đồng thuê đất là quyền của người sử dụng đất được hình thành khi Nhà nước cho thuê đất thu tiền thuê đất hằng năm. Người thuê có thể bán, thừa kế, tặng cho, thế chấp tài sản gắn liền với đất cùng quyền thuê.","b":"Khoản 37 Điều 3 Luật Đất đai 2024"},{"id":"4.17","g":4,"lv":"TH","q":"Cá nhân được giao đất có thu tiền nhưng được miễn tiền sử dụng đất có quyền và nghĩa vụ như thế nào?","o":["Không được chuyển nhượng trong 10 năm","Như tổ chức được giao đất không thu tiền","Chỉ được để thừa kế, không được chuyển nhượng","Như trường hợp không được miễn, không được giảm"],"a":3,"e":"Khoản 4 Điều 37 Luật Đất đai 2024: cá nhân được giao đất có thu tiền, cho thuê đất trả tiền một lần mà được miễn, giảm tiền sử dụng đất, tiền thuê đất thì có quyền và nghĩa vụ như trường hợp không được miễn, không được giảm.","b":"Khoản 4 Điều 37 Luật Đất đai 2024"},{"id":"4.18","g":4,"lv":"TH","q":"Đơn vị sự nghiệp công lập được giao đất không thu tiền muốn dùng một phần diện tích để cung cấp dịch vụ thì phải làm gì?","o":["Chuyển nhượng phần diện tích đó cho doanh nghiệp","Chuyển sang thuê đất trả tiền hằng năm đối với phần diện tích đó","Chuyển sang giao đất có thu tiền sử dụng đất cho toàn bộ diện tích","Không được sử dụng đất vào dịch vụ"],"a":1,"e":"Khoản 3 Điều 30 Luật Đất đai 2024: đơn vị sự nghiệp công lập được giao đất không thu tiền sử dụng đất mà có nhu cầu sử dụng một phần hoặc toàn bộ diện tích vào mục đích sản xuất, kinh doanh, dịch vụ thì được lựa chọn chuyển sang thuê đất trả tiền thuê đất hằng năm đối với phần diện tích đó.","b":"Khoản 3 Điều 30 Luật Đất đai 2024"},{"id":"4.19","g":4,"lv":"TH","q":"Tổ chức kinh tế nhận chuyển nhượng quyền sử dụng đất nông nghiệp phải đáp ứng yêu cầu nào?","o":["Có phương án sử dụng đất nông nghiệp được cơ quan có thẩm quyền chấp thuận","Có vốn điều lệ tối thiểu 100 tỷ đồng","Có ít nhất 50% lao động là người địa phương","Có trụ sở tại xã nơi có đất"],"a":0,"e":"Khoản 6 Điều 45 Luật Đất đai 2024: tổ chức kinh tế nhận chuyển nhượng quyền sử dụng đất nông nghiệp phải có phương án sử dụng đất nông nghiệp được UBND cấp có thẩm quyền chấp thuận. Pháp luật không đặt điều kiện về lao động địa phương, trụ sở hay vốn điều lệ.","b":"Khoản 6 Điều 45 Luật Đất đai 2024"},{"id":"4.20","g":4,"lv":"NB","q":"Nghĩa vụ nào sau đây là nghĩa vụ chung của người sử dụng đất theo Điều 31 Luật Đất đai 2024?","o":["Báo cáo tình hình sử dụng đất cho Ủy ban nhân dân xã hằng quý","Bàn giao lại đất khi Nhà nước có quyết định thu hồi đất","Mua bảo hiểm cho quyền sử dụng đất","Nộp tiền sử dụng đất hằng năm đối với đất ở"],"a":1,"e":"Khoản 7 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ chung bàn giao lại đất khi Nhà nước có quyết định thu hồi đất theo quy định. Đất ở không phải nộp tiền sử dụng đất hằng năm; không có nghĩa vụ mua bảo hiểm hay báo cáo hằng quý.","b":"Khoản 7 Điều 31 Luật Đất đai 2024"},{"id":"5.01","g":5,"lv":"TH","q":"Nhà nước thu hồi đất để phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng trong những trường hợp nào?","o":["Các trường hợp luật liệt kê; trường hợp khác thì Quốc hội sửa đổi, bổ sung theo trình tự rút gọn","Bất kỳ dự án nào làm tăng thu ngân sách địa phương","Mọi dự án được Hội đồng nhân dân xã thông qua","Mọi dự án có nhà đầu tư đề xuất và được Ủy ban nhân dân tỉnh chấp thuận"],"a":0,"e":"Điều 79 Luật Đất đai 2024 liệt kê cụ thể các trường hợp Nhà nước thu hồi đất để phát triển kinh tế – xã hội vì lợi ích quốc gia, công cộng; trường hợp dự án không thuộc danh mục thì Quốc hội sửa đổi, bổ sung danh mục theo trình tự, thủ tục rút gọn. Ý chí của nhà đầu tư, HĐND xã hay mục tiêu tăng thu ngân sách không phải căn cứ.","b":"Điều 79 Luật Đất đai 2024"},{"id":"5.02","g":5,"lv":"TH","q":"Dự án nào sau đây thuộc trường hợp Nhà nước thu hồi đất để phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng?","o":["Xây dựng cơ sở y tế do Nhà nước thành lập","Xây dựng biệt thự nghỉ dưỡng của một cá nhân","Mở rộng nhà xưởng của doanh nghiệp tư nhân ngoài khu công nghiệp","Xây dựng trang trại chăn nuôi gia đình"],"a":0,"e":"Điều 79 Luật Đất đai 2024 có trường hợp thu hồi đất để xây dựng công trình y tế, giáo dục, văn hóa… do Nhà nước đầu tư, thành lập. Trang trại gia đình, nhà xưởng tư nhân ngoài khu công nghiệp, biệt thự cá nhân không thuộc danh mục; nhà đầu tư phải thỏa thuận nhận quyền sử dụng đất.","b":"Điều 79 Luật Đất đai 2024"},{"id":"5.03","g":5,"lv":"NB","q":"Theo Nghị quyết 254/2025/QH15, thời hạn thông báo thu hồi đất nông nghiệp trước khi có quyết định thu hồi tối thiểu là bao lâu?","o":["30 ngày","120 ngày","90 ngày","60 ngày"],"a":3,"e":"Nghị quyết 254/2025/QH15 (hiệu lực 01/01/2026) rút ngắn thời hạn thông báo thu hồi đất: chậm nhất 60 ngày đối với đất nông nghiệp (Luật Đất đai 2024 quy định 90 ngày) trước khi ban hành quyết định thu hồi. Nghị quyết được ưu tiên áp dụng khi quy định khác Luật.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.04","g":5,"lv":"NB","q":"Theo Nghị quyết 254/2025/QH15, thời hạn thông báo thu hồi đất phi nông nghiệp trước khi có quyết định thu hồi tối thiểu là bao lâu?","o":["120 ngày","180 ngày","90 ngày","60 ngày"],"a":0,"e":"Nghị quyết 254/2025/QH15: thông báo thu hồi đất phi nông nghiệp phải gửi chậm nhất 120 ngày trước khi có quyết định thu hồi (Luật Đất đai 2024 quy định 180 ngày). Mục đích là đẩy nhanh giải phóng mặt bằng nhưng vẫn bảo đảm thời gian chuẩn bị cho người có đất.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.05","g":5,"lv":"NB","q":"Theo Nghị quyết 254/2025/QH15, phương án bồi thường, hỗ trợ, tái định cư được niêm yết công khai trong thời hạn bao lâu?","o":["60 ngày","15 ngày","10 ngày","30 ngày"],"a":2,"e":"Nghị quyết 254/2025/QH15 rút ngắn thời hạn niêm yết công khai phương án bồi thường, hỗ trợ, tái định cư xuống 10 ngày (Luật Đất đai 2024 quy định 30 ngày) tại trụ sở UBND cấp xã và điểm sinh hoạt chung khu dân cư.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.06","g":5,"lv":"TH","q":"Theo Nghị quyết 254/2025/QH15, về nguyên tắc, quyết định thu hồi đất chỉ được ban hành khi nào?","o":["Đã hoàn thành việc phê duyệt phương án bồi thường, hỗ trợ, tái định cư","Khi chủ đầu tư đã ký hợp đồng thi công","Khi đã cưỡng chế kiểm đếm xong","Ngay sau khi có thông báo thu hồi đất"],"a":0,"e":"Nghị quyết 254/2025/QH15 giữ nguyên tắc: quyết định thu hồi đất chỉ được ban hành sau khi đã phê duyệt phương án bồi thường, hỗ trợ, tái định cư (trừ trường hợp đặc biệt Nghị quyết cho phép). Không ban hành ngay sau thông báo hay chờ cưỡng chế kiểm đếm.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.07","g":5,"lv":"TH","q":"Trường hợp nào sau đây là thu hồi đất do vi phạm pháp luật về đất đai?","o":["Đất được thuê có thời hạn nhưng không được gia hạn","Sử dụng đất không đúng mục đích, đã bị xử phạt vi phạm hành chính mà tiếp tục vi phạm","Đất có nguy cơ sạt lở đe dọa tính mạng con người","Người sử dụng đất tự nguyện trả lại đất"],"a":1,"e":"Khoản 1 Điều 81 Luật Đất đai 2024: thu hồi đất do vi phạm pháp luật khi sử dụng đất không đúng mục đích đã được giao, cho thuê, công nhận và đã bị xử phạt vi phạm hành chính mà tiếp tục vi phạm. Tự nguyện trả lại đất, hết hạn không gia hạn là chấm dứt sử dụng đất theo pháp luật (Điều 82); đất có nguy cơ sạt lở là thu hồi do đe dọa tính mạng.","b":"Khoản 1 Điều 81 Luật Đất đai 2024"},{"id":"5.08","g":5,"lv":"NB","q":"Đất trồng cây hằng năm không được sử dụng trong thời gian bao lâu liên tục (đã bị xử phạt mà không đưa đất vào sử dụng) thì bị thu hồi?","o":["06 tháng","24 tháng","12 tháng","18 tháng"],"a":2,"e":"Khoản 7 Điều 81 Luật Đất đai 2024: đất trồng cây hằng năm, đất nuôi trồng thủy sản không được sử dụng trong thời gian 12 tháng liên tục; đất trồng cây lâu năm 18 tháng; đất trồng rừng 24 tháng, đã bị xử phạt mà không đưa đất vào sử dụng theo thời hạn ghi trong quyết định xử phạt thì bị thu hồi.","b":"Khoản 7 Điều 81 Luật Đất đai 2024"},{"id":"5.09","g":5,"lv":"TH","q":"Dự án đầu tư chậm tiến độ sử dụng đất 24 tháng so với tiến độ ghi trong dự án thì chủ đầu tư được gia hạn tối đa bao lâu?","o":["Không được gia hạn trong mọi trường hợp","36 tháng, chỉ nộp tiền phạt vi phạm hành chính","24 tháng, phải nộp bổ sung tiền sử dụng đất, tiền thuê đất cho thời gian gia hạn","12 tháng, không phải nộp thêm tiền"],"a":2,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: dự án chậm tiến độ sử dụng đất 24 tháng so với tiến độ ghi trong dự án thì được gia hạn không quá 24 tháng và phải nộp bổ sung cho Nhà nước khoản tiền tương ứng với tiền sử dụng đất, tiền thuê đất cho thời gian gia hạn; hết thời gian gia hạn mà chưa đưa đất vào sử dụng thì bị thu hồi.","b":"Khoản 8 Điều 81 Luật Đất đai 2024"},{"id":"5.10","g":5,"lv":"TH","q":"Trường hợp nào sau đây là thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật?","o":["Đất được giao sai đối tượng, sai thẩm quyền","Người sử dụng đất không thực hiện nghĩa vụ tài chính","Đất bị hủy hoại đã bị xử phạt mà tiếp tục vi phạm","Cá nhân sử dụng đất chết mà không có người thừa kế"],"a":3,"e":"Điểm b khoản 1 Điều 82 Luật Đất đai 2024: thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật khi cá nhân sử dụng đất chết mà không có người thừa kế sau khi đã thực hiện nghĩa vụ về tài sản. Giao đất sai thẩm quyền, không thực hiện nghĩa vụ tài chính, hủy hoại đất là căn cứ thu hồi do vi phạm (Điều 81).","b":"Điểm b khoản 1 Điều 82 Luật Đất đai 2024"},{"id":"5.11","g":5,"lv":"NB","q":"Thời gian nào sau đây KHÔNG được tiến hành cưỡng chế thực hiện quyết định thu hồi đất?","o":["Sau khi quyết định cưỡng chế đã có hiệu lực","Trong 15 ngày trước và sau Tết Âm lịch","Sau khi đã niêm yết quyết định cưỡng chế","Trong giờ hành chính của ngày làm việc"],"a":1,"e":"Khoản 1 Điều 89 Luật Đất đai 2024: không thực hiện cưỡng chế trong khoảng thời gian từ 22 giờ ngày hôm trước đến 06 giờ sáng ngày hôm sau; các ngày nghỉ, ngày lễ theo quy định; trong thời gian 15 ngày trước và sau thời gian nghỉ Tết Âm lịch và các trường hợp đặc biệt khác ảnh hưởng đến an ninh, chính trị, trật tự an toàn xã hội.","b":"Khoản 1 Điều 89 Luật Đất đai 2024"},{"id":"5.12","g":5,"lv":"TH","q":"Điều kiện nào sau đây là một trong các điều kiện bắt buộc để cưỡng chế thực hiện quyết định thu hồi đất?","o":["Tòa án đã có bản án về việc thu hồi đất","Hội đồng nhân dân xã đã biểu quyết thông qua","Quyết định cưỡng chế đã được niêm yết công khai tại trụ sở Ủy ban nhân dân cấp xã hoặc địa điểm sinh hoạt chung của khu dân cư","Người bị cưỡng chế đã đồng ý bằng văn bản"],"a":2,"e":"Khoản 2 Điều 89 Luật Đất đai 2024: cưỡng chế thực hiện quyết định thu hồi đất khi đủ các điều kiện, trong đó có việc quyết định cưỡng chế đã được niêm yết công khai tại trụ sở UBND cấp xã, địa điểm sinh hoạt chung của khu dân cư nơi có đất thu hồi. Không cần sự đồng ý của người bị cưỡng chế, nghị quyết HĐND hay bản án của Tòa án.","b":"Điểm b khoản 2 Điều 89 Luật Đất đai 2024"},{"id":"5.13","g":5,"lv":"TH","q":"Theo nguyên tắc bồi thường, Nhà nước bồi thường về đất cho người có đất thu hồi bằng hình thức ưu tiên nào?","o":["Cấp cổ phần của chủ đầu tư dự án","Trả tiền theo giá thị trường do các bên tự thỏa thuận trong mọi trường hợp","Bố trí nhà ở tái định cư cho mọi trường hợp","Giao đất có cùng mục đích sử dụng với loại đất thu hồi; không có đất thì bồi thường bằng tiền"],"a":3,"e":"Khoản 2 Điều 91 Luật Đất đai 2024: việc bồi thường về đất được thực hiện bằng việc giao đất có cùng mục đích sử dụng với loại đất thu hồi; nếu không có đất để bồi thường thì được bồi thường bằng tiền theo giá đất cụ thể (hoặc bằng đất khác mục đích, nhà ở nếu người có đất có nhu cầu và địa phương có điều kiện).","b":"Khoản 2 Điều 91 Luật Đất đai 2024"},{"id":"5.14","g":5,"lv":"TH","q":"Việc phê duyệt phương án và bố trí tái định cư phải hoàn thành vào thời điểm nào?","o":["Trước khi có quyết định thu hồi đất","Khi dự án hoàn thành, đưa vào sử dụng","Sau khi cưỡng chế thu hồi đất","Trong 12 tháng sau khi có quyết định thu hồi đất"],"a":0,"e":"Khoản 6 Điều 91 Luật Đất đai 2024: việc thu hồi đất ở chỉ được thực hiện sau khi hoàn thành bố trí tái định cư (trừ trường hợp người dân tự nguyện…); việc phê duyệt phương án và bố trí tái định cư phải hoàn thành trước khi có quyết định thu hồi đất.","b":"Khoản 6 Điều 91 Luật Đất đai 2024"},{"id":"5.15","g":5,"lv":"TH","q":"Cá nhân đang sử dụng đất (không phải đất thuê trả tiền hằng năm) bị thu hồi đất được bồi thường về đất khi đáp ứng điều kiện nào?","o":["Có xác nhận sử dụng đất của hàng xóm liền kề","Đã đóng thuế sử dụng đất nông nghiệp ít nhất 05 năm","Đã xây dựng công trình kiên cố trên đất","Có Giấy chứng nhận hoặc có giấy tờ về quyền sử dụng đất làm căn cứ cấp Giấy chứng nhận"],"a":3,"e":"Khoản 1, 2 Điều 95 Luật Đất đai 2024: cá nhân đang sử dụng đất không phải đất thuê trả tiền hằng năm, có Giấy chứng nhận hoặc có quyết định giao đất, cho thuê, hoặc có giấy tờ về quyền sử dụng đất làm căn cứ để cấp Giấy chứng nhận… thì được bồi thường về đất. Công trình kiên cố, thời gian đóng thuế hay xác nhận hàng xóm không phải điều kiện.","b":"Khoản 1, khoản 2 Điều 95 Luật Đất đai 2024"},{"id":"5.16","g":5,"lv":"TH","q":"Người nhận chuyển quyền sử dụng đất hợp pháp nhưng chưa hoàn thành thủ tục đăng ký đất đai, khi bị thu hồi đất thì sao?","o":["Vẫn thuộc trường hợp đủ điều kiện được bồi thường về đất","Chỉ được hỗ trợ bằng 50% giá đất","Người chuyển nhượng được nhận tiền bồi thường","Không được bồi thường vì chưa đăng ký"],"a":0,"e":"Điểm d khoản 2 Điều 95 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất theo quy định của pháp luật từ người có quyền sử dụng đất hợp pháp nhưng chưa hoàn thành thủ tục đăng ký đất đai vẫn thuộc trường hợp đủ điều kiện được bồi thường về đất.","b":"Điểm d khoản 2 Điều 95 Luật Đất đai 2024"},{"id":"5.17","g":5,"lv":"NB","q":"Khoản hỗ trợ nào sau đây thuộc các khoản hỗ trợ khi Nhà nước thu hồi đất theo Điều 108 Luật Đất đai 2024?","o":["Hỗ trợ mua phương tiện đi lại","Hỗ trợ trả nợ vay ngân hàng của người có đất","Hỗ trợ đào tạo, chuyển đổi nghề và tìm kiếm việc làm","Hỗ trợ học phí đại học cho con của người có đất"],"a":2,"e":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024: các khoản hỗ trợ khi Nhà nước thu hồi đất gồm hỗ trợ ổn định đời sống; ổn định sản xuất, kinh doanh; di dời vật nuôi; đào tạo, chuyển đổi nghề và tìm kiếm việc làm; tái định cư… Không có hỗ trợ trả nợ ngân hàng, mua phương tiện hay học phí đại học.","b":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024"},{"id":"5.18","g":5,"lv":"NB","q":"Ngoài các khoản hỗ trợ luật định, cơ quan nào quyết định biện pháp hỗ trợ khác cho từng dự án cụ thể?","o":["Ủy ban Mặt trận Tổ quốc cấp xã","Chủ đầu tư dự án","Bộ Tài chính","Ủy ban nhân dân cấp tỉnh"],"a":3,"e":"Khoản 2 Điều 108 Luật Đất đai 2024: ngoài các khoản hỗ trợ luật định, căn cứ tình hình thực tế tại địa phương, Chủ tịch UBND cấp tỉnh quyết định biện pháp hỗ trợ khác để bảo đảm có chỗ ở, ổn định đời sống, sản xuất và công bằng đối với người có đất thu hồi.","b":"Khoản 2 Điều 108 Luật Đất đai 2024"},{"id":"5.19","g":5,"lv":"NB","q":"Thời hạn trưng dụng đất tối đa là bao lâu kể từ khi quyết định trưng dụng có hiệu lực (ngoài thời chiến, tình trạng khẩn cấp)?","o":["Không giới hạn đến khi hoàn thành mục đích","Không quá 30 ngày, được gia hạn không quá 30 ngày","Không quá 90 ngày, được gia hạn không quá 90 ngày","Không quá 12 tháng"],"a":1,"e":"Khoản 4 Điều 90 Luật Đất đai 2024: thời hạn trưng dụng đất là không quá 30 ngày kể từ khi quyết định trưng dụng có hiệu lực thi hành (trừ thời chiến, tình trạng khẩn cấp); trường hợp hết thời hạn mà mục đích chưa hoàn thành thì được gia hạn nhưng không quá 30 ngày.","b":"Khoản 4 Điều 90 Luật Đất đai 2024"},{"id":"5.20","g":5,"lv":"TH","q":"Trường hợp tiền bồi thường về đất ở không đủ để được giao một suất tái định cư tối thiểu thì người có đất thu hồi được xử lý thế nào?","o":["Phải tự bù phần chênh lệch","Được miễn toàn bộ tiền sử dụng đất tại mọi khu tái định cư","Không được bố trí tái định cư","Được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu"],"a":3,"e":"Khoản 8 Điều 111 Luật Đất đai 2024: trường hợp người có đất thu hồi được bố trí tái định cư mà tiền bồi thường về đất ở không đủ để được giao một suất tái định cư tối thiểu thì được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu.","b":"Khoản 8 Điều 111 Luật Đất đai 2024"},{"id":"6.01","g":6,"lv":"NB","q":"Trước khi cơ quan nhà nước có thẩm quyền giải quyết tranh chấp đất đai theo Điều 236 Luật Đất đai 2024, các bên phải thực hiện thủ tục gì?","o":["Thỏa thuận trước Ủy ban Mặt trận Tổ quốc cấp tỉnh","Công chứng biên bản thỏa thuận","Hòa giải tại Tòa án nhân dân","Hòa giải tại Ủy ban nhân dân cấp xã nơi có đất tranh chấp"],"a":3,"e":"Khoản 2 Điều 235 Luật Đất đai 2024: trước khi cơ quan có thẩm quyền giải quyết tranh chấp đất đai theo Điều 236, các bên tranh chấp phải thực hiện hòa giải tại UBND cấp xã nơi có đất tranh chấp. Đây là thủ tục bắt buộc.","b":"Khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.02","g":6,"lv":"NB","q":"Ai thành lập Hội đồng hòa giải tranh chấp đất đai cấp xã?","o":["Chủ tịch Ủy ban Mặt trận Tổ quốc cấp xã","Chủ tịch Ủy ban nhân dân cấp xã","Chủ tịch Hội đồng nhân dân cấp xã","Chánh án Tòa án nhân dân khu vực"],"a":1,"e":"Điểm a khoản 2 Điều 235 Luật Đất đai 2024: Chủ tịch UBND cấp xã có trách nhiệm thành lập Hội đồng hòa giải tranh chấp đất đai để thực hiện hòa giải tranh chấp đất đai tại địa phương.","b":"Điểm a khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.03","g":6,"lv":"NB","q":"Thành phần nào sau đây có trong Hội đồng hòa giải tranh chấp đất đai cấp xã?","o":["Thẩm phán Tòa án nhân dân","Kiểm sát viên Viện kiểm sát","Công chứng viên","Đại diện Ủy ban Mặt trận Tổ quốc cấp xã"],"a":3,"e":"Điểm b khoản 2 Điều 235 Luật Đất đai 2024: thành phần Hội đồng hòa giải gồm Chủ tịch hoặc Phó Chủ tịch UBND cấp xã là Chủ tịch Hội đồng; đại diện Ủy ban Mặt trận Tổ quốc cấp xã; công chức làm công tác địa chính; người sinh sống lâu năm biết rõ nguồn gốc, quá trình sử dụng thửa đất… Không có công chứng viên, thẩm phán, kiểm sát viên.","b":"Điểm b khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.04","g":6,"lv":"NB","q":"Thời hạn hòa giải tranh chấp đất đai tại Ủy ban nhân dân cấp xã là bao lâu?","o":["Không quá 45 ngày kể từ ngày nhận đơn","Không quá 30 ngày kể từ ngày nhận được đơn yêu cầu hòa giải","Không quá 60 ngày kể từ ngày nhận đơn","Không quá 15 ngày kể từ ngày nhận đơn"],"a":1,"e":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024: việc hòa giải tại UBND cấp xã được thực hiện trong thời hạn không quá 30 ngày kể từ ngày nhận được đơn yêu cầu giải quyết tranh chấp đất đai.","b":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.05","g":6,"lv":"NB","q":"Việc hòa giải tranh chấp đất đai tại cấp xã phải được thể hiện bằng hình thức nào?","o":["Biên bản có chữ ký của các bên và xác nhận hòa giải thành hoặc không thành của Ủy ban nhân dân cấp xã","Quyết định hành chính của Chủ tịch Ủy ban nhân dân xã","Bản án của Tòa án","Văn bản công chứng thỏa thuận"],"a":0,"e":"Điểm d khoản 2 Điều 235 Luật Đất đai 2024: việc hòa giải phải được lập thành biên bản có chữ ký của các bên và có xác nhận hòa giải thành hoặc hòa giải không thành của UBND cấp xã; biên bản được gửi cho các bên và lưu tại UBND cấp xã.","b":"Điểm d khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.06","g":6,"lv":"TH","q":"Trường hợp một bên không ký biên bản hòa giải tranh chấp đất đai thì xử lý thế nào?","o":["Biên bản không có giá trị, phải hòa giải lại từ đầu","Chủ tịch và các thành viên Hội đồng hòa giải ký, đóng dấu Ủy ban nhân dân cấp xã và gửi cho các bên","Xã chuyển ngay hồ sơ sang Tòa án","Bên không ký bị xử phạt vi phạm hành chính"],"a":1,"e":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024: trường hợp hòa giải không thành hoặc một trong các bên không ký vào biên bản thì Chủ tịch Hội đồng, các thành viên Hội đồng hòa giải tranh chấp đất đai ký, đóng dấu của UBND cấp xã và gửi cho các bên tranh chấp. Biên bản vẫn có giá trị để các bên tiếp tục yêu cầu giải quyết.","b":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.07","g":6,"lv":"NB","q":"Tranh chấp đất đai mà một trong các bên có Giấy chứng nhận thuộc thẩm quyền giải quyết của cơ quan nào?","o":["Ủy ban Mặt trận Tổ quốc cấp xã","Tòa án nhân dân","Chủ tịch Ủy ban nhân dân cấp tỉnh","Thanh tra tỉnh"],"a":1,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: tranh chấp đất đai mà các bên hoặc một trong các bên tranh chấp có Giấy chứng nhận hoặc có một trong các loại giấy tờ quy định tại Điều 137 và tranh chấp về tài sản gắn liền với đất thì do Tòa án giải quyết.","b":"Khoản 1 Điều 236 Luật Đất đai 2024"},{"id":"6.08","g":6,"lv":"NB","q":"Tranh chấp về tài sản gắn liền với đất thuộc thẩm quyền giải quyết của cơ quan nào?","o":["Ủy ban nhân dân cấp xã","Tòa án nhân dân","Văn phòng đăng ký đất đai","Hội đồng nhân dân cấp tỉnh"],"a":1,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: tranh chấp về tài sản gắn liền với đất do Tòa án giải quyết (cùng với tranh chấp đất đai mà có Giấy chứng nhận hoặc giấy tờ theo Điều 137).","b":"Khoản 1 Điều 236 Luật Đất đai 2024"},{"id":"6.09","g":6,"lv":"TH","q":"Tranh chấp đất đai mà các bên đều không có Giấy chứng nhận hoặc giấy tờ theo Điều 137 thì được giải quyết thế nào?","o":["Bắt buộc giải quyết tại Ủy ban nhân dân cấp tỉnh","Các bên được lựa chọn nộp đơn tại Ủy ban nhân dân cấp có thẩm quyền hoặc khởi kiện tại Tòa án","Bắt buộc giải quyết tại Tòa án","Không được giải quyết cho đến khi được cấp Giấy chứng nhận"],"a":1,"e":"Khoản 2 Điều 236 Luật Đất đai 2024: tranh chấp đất đai mà các bên đều không có Giấy chứng nhận hoặc giấy tờ theo Điều 137 thì các bên chỉ được lựa chọn một trong hai hình thức: nộp đơn yêu cầu giải quyết tại UBND cấp có thẩm quyền hoặc khởi kiện tại Tòa án theo pháp luật tố tụng dân sự.","b":"Khoản 2 Điều 236 Luật Đất đai 2024"},{"id":"6.10","g":6,"lv":"NB","q":"Theo Luật Đất đai 2024, \"tranh chấp đất đai\" được hiểu là gì?","o":["Tranh chấp về quyền, nghĩa vụ của người sử dụng đất giữa hai hoặc nhiều bên trong quan hệ đất đai","Tranh chấp về hợp đồng vay tiền có thế chấp nhà","Mọi bất đồng giữa người dân và cơ quan nhà nước về quyết định hành chính","Khiếu nại về giá đất trong bảng giá đất"],"a":0,"e":"Khoản 47 Điều 3 Luật Đất đai 2024: tranh chấp đất đai là tranh chấp về quyền, nghĩa vụ của người sử dụng đất giữa hai hoặc nhiều bên trong quan hệ đất đai. Khiếu nại quyết định hành chính, tranh chấp hợp đồng vay có thế chấp là các loại việc khác.","b":"Điều 3 Luật Đất đai 2024"},{"id":"6.11","g":6,"lv":"NB","q":"Người sử dụng đất không đồng ý với quyết định hành chính về đất đai có quyền gì?","o":["Tự ý không chấp hành mà không cần thủ tục","Khiếu nại, khởi kiện quyết định hành chính đó","Yêu cầu Ủy ban Mặt trận Tổ quốc hủy quyết định","Yêu cầu Hội đồng hòa giải cấp xã sửa quyết định"],"a":1,"e":"Khoản 8 Điều 26 và Điều 237 Luật Đất đai 2024: người sử dụng đất có quyền khiếu nại, khởi kiện quyết định hành chính, hành vi hành chính về đất đai; việc giải quyết theo pháp luật về khiếu nại và tố tụng hành chính. Không được tự ý không chấp hành; Mặt trận, Hội đồng hòa giải không có quyền hủy, sửa quyết định.","b":"Khoản 8 Điều 26, Điều 237 Luật Đất đai 2024"},{"id":"6.12","g":6,"lv":"TH","q":"Người có hành vi vi phạm pháp luật về đất đai bị xử lý theo hình thức nào?","o":["Chỉ bị xử phạt vi phạm hành chính","Tùy tính chất, mức độ: xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự; gây thiệt hại thì bồi thường","Chỉ bị nhắc nhở lần đầu","Chỉ bị thu hồi Giấy chứng nhận"],"a":1,"e":"Điều 239 Luật Đất đai 2024: người có hành vi vi phạm pháp luật về đất đai thì tùy theo tính chất, mức độ vi phạm mà bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự; nếu gây thiệt hại thì phải bồi thường theo quy định của pháp luật.","b":"Điều 239 Luật Đất đai 2024"},{"id":"6.13","g":6,"lv":"TH","q":"Trường hợp nào sau đây Nhà nước thu hồi đất do vi phạm pháp luật về đất đai?","o":["Đất thuê hết hạn không được gia hạn","Đất có nguy cơ sạt lở đe dọa tính mạng","Đất được Nhà nước giao để quản lý mà để bị lấn, chiếm","Người sử dụng đất tự nguyện trả lại đất"],"a":2,"e":"Khoản 5 Điều 81 Luật Đất đai 2024: đất được Nhà nước giao để quản lý mà để bị lấn đất, chiếm đất là căn cứ thu hồi do vi phạm pháp luật về đất đai. Tự nguyện trả lại đất, hết hạn thuê, nguy cơ sạt lở thuộc các nhóm căn cứ khác (Điều 82).","b":"Khoản 5 Điều 81 Luật Đất đai 2024"},{"id":"6.14","g":6,"lv":"TH","q":"Đất được giao, cho thuê không đúng đối tượng hoặc không đúng thẩm quyền thì bị xử lý thế nào?","o":["Được cấp Giấy chứng nhận theo hiện trạng","Chỉ phải nộp bổ sung tiền sử dụng đất","Thuộc trường hợp Nhà nước thu hồi đất do vi phạm pháp luật về đất đai","Được giữ nguyên quyền sử dụng đất nếu đã sử dụng ổn định"],"a":2,"e":"Khoản 3 Điều 81 Luật Đất đai 2024: đất được giao, cho thuê không đúng đối tượng hoặc không đúng thẩm quyền là căn cứ Nhà nước thu hồi đất do vi phạm pháp luật về đất đai. Việc đã sử dụng ổn định hay nộp bổ sung tiền không hợp thức hóa được.","b":"Khoản 3 Điều 81 Luật Đất đai 2024"},{"id":"6.15","g":6,"lv":"TH","q":"Đất nhận chuyển nhượng từ người được giao đất mà người đó không được chuyển nhượng theo quy định thì bị xử lý thế nào?","o":["Hợp đồng được công nhận nếu đã công chứng","Chỉ bị phạt tiền, không thu hồi đất","Bên nhận chuyển nhượng được cấp Giấy chứng nhận nếu đã trả đủ tiền","Nhà nước thu hồi đất do vi phạm pháp luật về đất đai"],"a":3,"e":"Khoản 4 Điều 81 Luật Đất đai 2024: đất nhận chuyển nhượng, nhận tặng cho từ người được Nhà nước giao đất, cho thuê đất mà người đó không được chuyển nhượng, tặng cho theo quy định thì bị thu hồi do vi phạm pháp luật về đất đai. Công chứng hay trả đủ tiền không làm giao dịch hợp pháp.","b":"Khoản 4 Điều 81 Luật Đất đai 2024"},{"id":"6.16","g":6,"lv":"TH","q":"Người sử dụng đất không thực hiện nghĩa vụ tài chính với Nhà nước (không có sự kiện bất khả kháng) thì có thể bị xử lý thế nào?","o":["Được miễn nghĩa vụ sau 05 năm","Bị thu hồi đất do vi phạm pháp luật về đất đai","Được chuyển nghĩa vụ cho người thừa kế mà không bị xử lý","Chỉ bị nhắc nhở bằng văn bản"],"a":1,"e":"Khoản 6, khoản 9 Điều 81 Luật Đất đai 2024: người sử dụng đất không thực hiện nghĩa vụ tài chính với Nhà nước (đã bị xử phạt mà không chấp hành) thì bị thu hồi đất do vi phạm, trừ trường hợp có sự kiện bất khả kháng. Nghĩa vụ không tự động được miễn hay chuyển cho người thừa kế.","b":"Khoản 6, khoản 9 Điều 81 Luật Đất đai 2024"},
