</head><body><script id="PNLIB_COURSE_GATE">
(function(){
  const courseId="luat-dat-dai";
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let access=false;
  try{
    const raw=localStorage.getItem("pnlib-ma-lop");
    const session=raw?JSON.parse(raw):null;
    const scopes=session&&Array.isArray(session.courses)?session.courses:null;
    access=!!(session&&session.code&&session.han&&today()<=session.han&&(!scopes||!scopes.length||scopes.includes("*")||scopes.includes(courseId)));
  }catch(e){access=false}
  if(!access){
    document.documentElement.style.visibility="hidden";
    if(window.top!==window.self){
      window.parent.postMessage({pn:"home",course:courseId},"*");
    }else{
      window.location.replace("../index.html#"+courseId);
    }
  }
})();
</script>

<script id="pn-data" type="application/json">{"meta":{"id":"luat-dat-dai","name":"Luật Đất đai","title":"Tài liệu Luật Đất đai","menuTitle":"Luật Đất đai","asof":"29/10/2026","laws":[{"re":"Luật Đất đai|LĐĐ","doc":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-523642.aspx"},{"re":"254/2025","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=254/2025/QH15&match=True"},{"re":"Bộ luật Dân sự|BLDS","base":"https://hethongphapluat.com/bo-luat-dan-su-2015"},{"re":"Hiến pháp","doc":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"}],"note":"Ngân hàng câu hỏi soạn theo pháp luật có hiệu lực tại ngày 29/10/2026: Luật Đất đai 2024 (VBHN 44/VBHN-VPQH), Nghị quyết 254/2025/QH15 và các nghị định hướng dẫn. Dự án Luật Đất đai (sửa đổi) đang được Quốc hội thảo luận tại Kỳ họp thứ 2, khóa XVI; nội dung sẽ được rà soát lại khi luật mới được thông qua."},"chapters":[{"n":1,"name":"Những vấn đề chung về Luật Đất đai"},{"n":2,"name":"Chế độ sử dụng các loại đất"},{"n":3,"name":"Quản lý nhà nước về đất đai"},{"n":4,"name":"Người sử dụng đất, quyền và nghĩa vụ"},{"n":5,"name":"Thu hồi đất, bồi thường, hỗ trợ, tái định cư"},{"n":6,"name":"Thanh tra, xử lý vi phạm, giải quyết tranh chấp, khiếu nại, tố cáo"}],"q":[{"id":"1.01","g":1,"lv":"NB","q":"Theo Luật Đất đai 2024, Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất xác nhận điều gì đối với người được cấp?","o":["Thẩm quyền quản lý nhà nước đối với thửa đất","Quyền sử dụng đất hợp pháp và quyền sở hữu tài sản gắn liền với đất hợp pháp","Quyền sở hữu tư nhân đối với thửa đất","Tư cách đại diện chủ sở hữu toàn dân về đất đai"],"a":1,"e":"Khoản 21 Điều 3 Luật Đất đai 2024: Giấy chứng nhận là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền. Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu (Điều 12; Điều 53 Hiến pháp), nên Giấy chứng nhận không xác nhận quyền sở hữu tư nhân về đất, cũng không trao tư cách đại diện chủ sở hữu hay thẩm quyền quản lý.","b":"Khoản 21 Điều 3, Điều 12 Luật Đất đai 2024; Điều 53 Hiến pháp 2013"},{"id":"1.02","g":1,"lv":"NB","q":"Ngoài người sử dụng đất, Luật Đất đai 2024 dành riêng một mục quy định quyền và nghĩa vụ đối với đất đai của chủ thể nào?","o":["Cơ quan tiến hành tố tụng","Tổ chức nước ngoài không có chức năng ngoại giao","Tổ chức tín dụng","Công dân"],"a":3,"e":"Luật Đất đai 2024 lần đầu dành riêng một mục (Điều 23–25) quy định quyền và nghĩa vụ của công dân đối với đất đai: tham gia xây dựng, góp ý, giám sát chính sách; tiếp cận thông tin; tham gia đấu giá; nghĩa vụ giữ gìn, bảo vệ tài nguyên đất… Đây là chủ thể khác với người sử dụng đất (Điều 4). Tổ chức tín dụng, cơ quan tố tụng không có mục riêng.","b":"Điều 1, Điều 23 đến Điều 25 Luật Đất đai 2024"},{"id":"1.03","g":1,"lv":"TH","q":"Ngành luật đất đai sử dụng phương pháp điều chỉnh nào?","o":["Chỉ dùng mệnh lệnh hành chính cho mọi quan hệ đất đai","Phương pháp trừng trị bằng chế tài hình sự là chủ yếu","Kết hợp phương pháp hành chính – mệnh lệnh và phương pháp bình đẳng – thỏa thuận","Chỉ dùng thỏa thuận dân sự cho mọi quan hệ đất đai"],"a":2,"e":"Luật đất đai kết hợp hai phương pháp: hành chính – mệnh lệnh trong quan hệ giữa Nhà nước (đại diện chủ sở hữu, quản lý) với người sử dụng đất như giao đất, cho thuê, thu hồi (Điều 13); bình đẳng – thỏa thuận trong quan hệ giữa những người sử dụng đất khi thực hiện các quyền chuyển đổi, chuyển nhượng, cho thuê, thế chấp (Điều 27). Chỉ dùng một phương pháp hay dùng chế tài hình sự làm chủ yếu là sai.","b":"Điều 13, khoản 1 Điều 27 Luật Đất đai 2024"},{"id":"1.04","g":1,"lv":"NB","q":"Công dân Việt Nam định cư ở nước ngoài được xếp vào nhóm người sử dụng đất nào theo Điều 4 Luật Đất đai 2024?","o":["Người gốc Việt Nam định cư ở nước ngoài","Tổ chức nước ngoài","Cá nhân","Hộ gia đình"],"a":2,"e":"Khoản 3 Điều 4 Luật Đất đai 2024: cá nhân trong nước và người Việt Nam định cư ở nước ngoài là công dân Việt Nam được gọi chung là 'cá nhân'. Người còn quốc tịch Việt Nam được đối xử như cá nhân trong nước; 'người gốc Việt Nam định cư ở nước ngoài' (khoản 6) chỉ người không còn quốc tịch Việt Nam.","b":"Khoản 3 Điều 4 Luật Đất đai 2024"},{"id":"1.05","g":1,"lv":"VD","q":"Bà X mang quốc tịch Pháp, không còn quốc tịch Việt Nam, có cha mẹ là người Việt Nam và đang định cư tại Pháp. Theo Luật Đất đai 2024, bà X thuộc nhóm người sử dụng đất nào?","o":["Cá nhân trong nước","Người gốc Việt Nam định cư ở nước ngoài","Bà X không thuộc nhóm người sử dụng đất nào","Tổ chức kinh tế có vốn đầu tư nước ngoài"],"a":1,"e":"Khoản 6 Điều 4 Luật Đất đai 2024: người gốc Việt Nam định cư ở nước ngoài là người Việt Nam đã từng có quốc tịch Việt Nam hoặc có cha, mẹ, ông, bà là người Việt Nam nhưng không còn quốc tịch Việt Nam, đang định cư ở nước ngoài. Bà X có quốc tịch Pháp, cha mẹ là người Việt Nam nên thuộc nhóm này, không phải cá nhân trong nước hay tổ chức.","b":"Khoản 6 Điều 4 Luật Đất đai 2024"},{"id":"1.06","g":1,"lv":"TH","q":"Theo Luật Đất đai 2024, những người có quan hệ hôn nhân, huyết thống, nuôi dưỡng, đang sống chung được coi là \"hộ gia đình sử dụng đất\" khi đáp ứng điều kiện nào?","o":["Cùng có nơi thường trú tại thời điểm thực hiện giao dịch về quyền sử dụng đất","Xác lập quyền sử dụng đất chung vào bất kỳ thời điểm nào, kể cả sau ngày Luật Đất đai 2024 có hiệu lực","Có quyền sử dụng đất chung tại thời điểm được giao, cho thuê, công nhận, nhận chuyển quyền sử dụng đất trước ngày Luật Đất đai 2024 có hiệu lực","Cùng đứng tên trên Giấy chứng nhận tại thời điểm cấp đổi Giấy chứng nhận"],"a":2,"e":"Khoản 25 Điều 3 Luật Đất đai 2024: hộ gia đình sử dụng đất là những người có quan hệ hôn nhân, huyết thống, nuôi dưỡng theo pháp luật hôn nhân và gia đình, đang sống chung và có quyền sử dụng đất chung tại thời điểm được Nhà nước giao đất, cho thuê đất, công nhận quyền sử dụng đất; nhận chuyển quyền sử dụng đất trước ngày Luật này có hiệu lực. Luật 2024 không còn giao đất mới cho hộ gia đình; mốc xác định là thời điểm xác lập quyền, không phải thời điểm cấp đổi hay nơi thường trú.","b":"Khoản 25 Điều 3 Luật Đất đai 2024"},{"id":"1.07","g":1,"lv":"NB","q":"Nhà nước không thừa nhận việc đòi lại đất đã được giao cho người khác sử dụng trong quá trình thực hiện chính sách đất đai của những chính quyền nào?","o":["Chính quyền thực hiện cải cách ruộng đất những năm 1953–1956","Riêng Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam kể từ năm 1976","Nhà nước Việt Nam dân chủ cộng hòa, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam và Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","Mọi chính quyền từng tồn tại trên lãnh thổ Việt Nam, kể cả chính quyền thuộc địa"],"a":2,"e":"Khoản 2 Điều 17 Luật Đất đai 2024: Nhà nước không thừa nhận việc đòi lại đất đã được giao theo quy định của Nhà nước cho người khác sử dụng trong quá trình thực hiện chính sách đất đai của Nhà nước Việt Nam dân chủ cộng hòa, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam và Nhà nước CHXHCN Việt Nam. Quy định không bao gồm chính quyền thuộc địa hay chỉ riêng giai đoạn từ 1976.","b":"Khoản 2 Điều 17 Luật Đất đai 2024"},{"id":"1.08","g":1,"lv":"NB","q":"Cơ quan nào quyết định quy hoạch sử dụng đất quốc gia?","o":["Chính phủ","Bộ Nông nghiệp và Môi trường","Quốc hội","Thủ tướng Chính phủ"],"a":2,"e":"Khoản 1 Điều 14 Luật Đất đai 2024: Quốc hội ban hành luật, nghị quyết về đất đai; quyết định quy hoạch sử dụng đất quốc gia; thực hiện quyền giám sát tối cao. Thủ tướng Chính phủ phê duyệt quy hoạch sử dụng đất cấp tỉnh, quy hoạch quốc phòng, an ninh; Chính phủ trình Quốc hội.","b":"Khoản 1 Điều 14 Luật Đất đai 2024"},{"id":"1.09","g":1,"lv":"NB","q":"Nội dung nào là một nguyên tắc sử dụng đất theo Điều 5 Luật Đất đai 2024?","o":["Sử dụng đất theo hiện trạng, không phụ thuộc mục đích ghi trên Giấy chứng nhận","Lợi ích của người sử dụng đất được ưu tiên hơn lợi ích công cộng","Không xâm phạm quyền, lợi ích hợp pháp của người sử dụng đất liền kề và xung quanh","Người sử dụng đất được tự chuyển mục đích trong nhóm đất phi nông nghiệp"],"a":2,"e":"Khoản 4 Điều 5 Luật Đất đai 2024: việc sử dụng đất phải bảo đảm không xâm phạm quyền, lợi ích hợp pháp của người sử dụng đất liền kề và xung quanh. Các phương án còn lại trái với nguyên tắc sử dụng đất đúng mục đích (khoản 1) và với việc tự chuyển mục đích phải được phép (Điều 121).","b":"Khoản 4 Điều 5 Luật Đất đai 2024"},{"id":"1.10","g":1,"lv":"TH","q":"Yếu tố nào phân biệt hành vi lấn đất với hành vi chiếm đất?","o":["Lấn đất chỉ xảy ra đối với đất do Nhà nước quản lý","Khái niệm lấn đất chỉ áp dụng đối với đất nông nghiệp","Lấn đất gắn với việc chuyển dịch mốc giới, ranh giới thửa đất đang sử dụng để mở rộng diện tích","Hành vi lấn đất luôn làm suy giảm chất lượng đất"],"a":2,"e":"Khoản 31 Điều 3 Luật Đất đai 2024: lấn đất là việc người đang sử dụng đất tự chuyển dịch mốc giới hoặc ranh giới thửa đất để mở rộng diện tích đất sử dụng. Chiếm đất (khoản 9) là việc sử dụng đất của Nhà nước chưa được cho phép hoặc đất của người khác chưa được người đó cho phép. Lấn đất có thể xảy ra với cả đất của Nhà nước và đất của người khác, mọi loại đất.","b":"Khoản 9, khoản 31 Điều 3 Luật Đất đai 2024"},{"id":"1.11","g":1,"lv":"NB","q":"Hành vi làm suy giảm chất lượng đất mà làm mất hoặc giảm khả năng sử dụng đất theo mục đích đã được xác định được gọi là gì?","o":["Chiếm đất","Hủy hoại đất","Sử dụng đất không đúng mục đích","Lấn đất"],"a":1,"e":"Khoản 27 Điều 3 Luật Đất đai 2024: hủy hoại đất là hành vi làm biến dạng địa hình hoặc làm suy giảm chất lượng đất mà làm mất hoặc giảm khả năng sử dụng đất theo mục đích đã được xác định. Khác với lấn, chiếm đất (xâm phạm ranh giới, quyền quản lý) và sử dụng đất không đúng mục đích.","b":"Khoản 27 Điều 3 Luật Đất đai 2024"},{"id":"1.12","g":1,"lv":"NB","q":"Hành vi nào sau đây thuộc danh mục hành vi bị nghiêm cấm theo Điều 11 Luật Đất đai 2024?","o":["Cho thuê quyền sử dụng đất nông nghiệp bằng hợp đồng không công chứng","Tạm ngừng canh tác đất nông nghiệp vì thiên tai","Chuyển đổi cơ cấu cây trồng trên đất trồng lúa mà vẫn giữ điều kiện trồng lúa trở lại","Phân biệt đối xử về giới trong quản lý, sử dụng đất đai"],"a":3,"e":"Khoản 11 Điều 11 Luật Đất đai 2024 nghiêm cấm phân biệt đối xử về giới trong quản lý, sử dụng đất đai. Tạm ngừng canh tác do thiên tai, chuyển đổi cơ cấu cây trồng trên đất lúa vẫn giữ điều kiện trồng lúa là hợp pháp; cho thuê đất nông nghiệp không bắt buộc công chứng (điểm b khoản 3 Điều 27) nên không phải hành vi bị cấm.","b":"Khoản 11 Điều 11 Luật Đất đai 2024"},{"id":"1.13","g":1,"lv":"NB","q":"Luật Đất đai 2024 xác định hành vi thực hiện giao dịch về quyền sử dụng đất mà không đăng ký với cơ quan có thẩm quyền là gì?","o":["Hành vi hợp pháp nếu hợp đồng đã được công chứng","Hành vi thuộc quyền tự định đoạt của người sử dụng đất","Hành vi chỉ bị nhắc nhở, không bị coi là vi phạm","Hành vi bị nghiêm cấm"],"a":3,"e":"Khoản 8 Điều 11 Luật Đất đai 2024 nghiêm cấm 'thực hiện giao dịch về quyền sử dụng đất mà không đăng ký với cơ quan có thẩm quyền'. Đăng ký biến động là bắt buộc (Điều 133) và là thời điểm giao dịch có hiệu lực (khoản 3 Điều 45); việc công chứng không thay thế được đăng ký.","b":"Khoản 8 Điều 11 Luật Đất đai 2024"},{"id":"1.14","g":1,"lv":"NB","q":"Theo Điều 19 Luật Đất đai 2024, Ủy ban Mặt trận Tổ quốc Việt Nam các cấp có trách nhiệm nào sau đây?","o":["Ban hành bảng giá đất","Cấp Giấy chứng nhận cho cộng đồng dân cư","Tham gia hòa giải tranh chấp đất đai","Quyết định giao đất cho các tổ chức thành viên"],"a":2,"e":"Điểm d khoản 2 Điều 19 Luật Đất đai 2024: Ủy ban Mặt trận Tổ quốc Việt Nam các cấp tham gia hòa giải tranh chấp đất đai, cùng với tham gia xây dựng pháp luật, giám sát, góp ý về thu hồi đất… Mặt trận không có thẩm quyền giao đất, ban hành bảng giá đất hay cấp Giấy chứng nhận (thẩm quyền của cơ quan nhà nước).","b":"Điểm d khoản 2 Điều 19 Luật Đất đai 2024"},{"id":"1.15","g":1,"lv":"NB","q":"Nghĩa vụ giữ gìn, bảo vệ và phát triển tài nguyên đất theo Điều 25 Luật Đất đai 2024 thuộc về chủ thể nào?","o":["Chỉ người đã được cấp Giấy chứng nhận","Mọi công dân","Chỉ tổ chức kinh tế sử dụng đất","Chỉ người được Nhà nước giao đất"],"a":1,"e":"Khoản 2 Điều 25 Luật Đất đai 2024 quy định nghĩa vụ của công dân: giữ gìn, bảo vệ và phát triển tài nguyên đất. Nghĩa vụ này đặt ra với mọi công dân, không chỉ người được giao đất hay đã có Giấy chứng nhận.","b":"Khoản 2 Điều 25 Luật Đất đai 2024"},{"id":"1.16","g":1,"lv":"TH","q":"Nhà nước công nhận quyền sử dụng đất thông qua hình thức pháp lý nào?","o":["Cấp Giấy chứng nhận lần đầu cho người đang sử dụng đất ổn định","Ban hành quyết định giao đất","Ký hợp đồng cho thuê đất với người sử dụng đất","Chứng thực hợp đồng chuyển nhượng quyền sử dụng đất"],"a":0,"e":"Khoản 33 Điều 3 Luật Đất đai 2024: Nhà nước công nhận quyền sử dụng đất là việc Nhà nước trao quyền sử dụng đất cho người đang sử dụng đất ổn định mà không có nguồn gốc được Nhà nước giao, cho thuê, thông qua cấp Giấy chứng nhận lần đầu. Giao đất, cho thuê đất là quyết định hành chính; chứng thực hợp đồng chuyển nhượng là giao dịch giữa người sử dụng đất.","b":"Khoản 33 Điều 3, Điều 12 Luật Đất đai 2024"},{"id":"1.17","g":1,"lv":"NB","q":"Ai là người chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất nông nghiệp vào mục đích công ích của xã?","o":["Chủ tịch Ủy ban nhân dân cấp tỉnh","Chủ tịch Hội đồng nhân dân cấp xã","Chủ tịch Ủy ban nhân dân cấp xã","Công chức làm công tác địa chính cấp xã"],"a":2,"e":"Khoản 2 Điều 6 Luật Đất đai 2024: Chủ tịch Ủy ban nhân dân cấp xã chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất nông nghiệp vào mục đích công ích, đất phi nông nghiệp đã giao cho UBND cấp xã sử dụng. Công chức địa chính chỉ tham mưu; Chủ tịch HĐND hay UBND tỉnh không phải người chịu trách nhiệm trực tiếp.","b":"Khoản 2 Điều 6 Luật Đất đai 2024"},{"id":"1.18","g":1,"lv":"NB","q":"Theo Luật Đất đai 2024, việc sử dụng đất của một công ty cổ phần do ai chịu trách nhiệm trước Nhà nước?","o":["Kế toán trưởng của công ty","Cổ đông sở hữu nhiều cổ phần nhất","Chủ tịch Ủy ban nhân dân cấp xã nơi có đất","Người đại diện theo pháp luật của công ty"],"a":3,"e":"Khoản 1 Điều 6 Luật Đất đai 2024: người đại diện theo pháp luật của tổ chức trong nước, tổ chức kinh tế có vốn đầu tư nước ngoài chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất của tổ chức mình. Cổ đông lớn hay kế toán trưởng không có tư cách này.","b":"Khoản 1 Điều 6 Luật Đất đai 2024"},{"id":"1.19","g":1,"lv":"NB","q":"Quyền điều tiết phần giá trị tăng thêm từ đất mà không do người sử dụng đất đầu tư mang lại thuộc về chủ thể nào?","o":["Cộng đồng dân cư nơi có đất","Người đang sử dụng đất","Tổ chức tín dụng nhận thế chấp quyền sử dụng đất","Nhà nước với tư cách đại diện chủ sở hữu về đất đai"],"a":3,"e":"Khoản 11 Điều 13 Luật Đất đai 2024: Nhà nước với tư cách đại diện chủ sở hữu quyết định chính sách điều tiết phần giá trị tăng thêm từ đất mà không do người sử dụng đất đầu tư mang lại (thông qua tiền sử dụng đất, thuế…). Người sử dụng đất chỉ hưởng thành quả đầu tư của mình.","b":"Khoản 11 Điều 13 Luật Đất đai 2024"},{"id":"1.20","g":1,"lv":"NB","q":"Bản Hiến pháp nào lần đầu tiên quy định đất đai thuộc sở hữu toàn dân?","o":["Hiến pháp năm 1946","Hiến pháp năm 1959","Hiến pháp năm 1992","Hiến pháp năm 1980"],"a":3,"e":"Điều 19 Hiến pháp 1980 lần đầu quy định đất đai thuộc sở hữu toàn dân. Hiến pháp 1946 và 1959 thừa nhận nhiều hình thức sở hữu đất đai (nhà nước, tập thể, tư nhân); Hiến pháp 1992 và 2013 kế thừa chế độ sở hữu toàn dân.","b":"Điều 19 Hiến pháp 1980"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Bà Sophie thuộc nhóm người sử dụng đất nào?","o":["Người gốc Việt Nam định cư ở nước ngoài","Tổ chức nước ngoài","Tổ chức kinh tế có vốn đầu tư nước ngoài","Cá nhân"],"a":0,"e":"Bà Sophie mang quốc tịch Pháp, có gốc Việt Nam nên là người gốc Việt Nam định cư ở nước ngoài (khoản 6 Điều 4 Luật Đất đai 2024), không phải cá nhân (chỉ dành cho công dân Việt Nam) hay tổ chức.","b":"Khoản 6 Điều 4 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Hội Liên hiệp Phụ nữ xã Hòa Lạc thuộc nhóm người sử dụng đất nào?","o":["Cộng đồng dân cư","Tổ chức trong nước","Cá nhân","Tổ chức kinh tế"],"a":1,"e":"Hội Liên hiệp Phụ nữ xã là tổ chức chính trị – xã hội, thuộc nhóm 'tổ chức trong nước' theo điểm a khoản 1 Điều 4 Luật Đất đai 2024 (cơ quan nhà nước, tổ chức chính trị, tổ chức chính trị – xã hội…). Không phải tổ chức kinh tế hay cộng đồng dân cư.","b":"Điểm a khoản 1 Điều 4 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Điều kiện bắt buộc để bà Sophie được mua nhà ở gắn liền với quyền sử dụng đất ở trong dự án phát triển nhà ở là gì?","o":["Được Ủy ban nhân dân tỉnh H chấp thuận bằng văn bản","Có nơi thường trú tại tỉnh H","Được phép nhập cảnh vào Việt Nam","Đã thôi quốc tịch Pháp"],"a":2,"e":"Điểm h khoản 1 Điều 28 và khoản 1 Điều 44 Luật Đất đai 2024: người gốc Việt Nam định cư ở nước ngoài được phép nhập cảnh vào Việt Nam thì được sở hữu nhà ở gắn liền với quyền sử dụng đất ở theo pháp luật về nhà ở. Không đòi hỏi thôi quốc tịch nước ngoài, thường trú hay chấp thuận của UBND tỉnh.","b":"Điểm h khoản 1 Điều 28, khoản 1 Điều 44 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.4","g":1,"lv":"VD","q":"Bà Sophie được nhận chuyển nhượng quyền sử dụng đất ở khu vực nào?","o":["Ở bất kỳ địa phương nào nếu là đất nông nghiệp","Trong khu công nghiệp, cụm công nghiệp, khu công nghệ cao","Tại vùng nông thôn nếu diện tích không quá 2.000 m²","Tại nơi có người thân của bà thường trú"],"a":1,"e":"Điểm c khoản 1 Điều 28 Luật Đất đai 2024: người gốc Việt Nam định cư ở nước ngoài được nhận chuyển nhượng quyền sử dụng đất trong khu công nghiệp, cụm công nghiệp, khu công nghệ cao. Họ không được nhận chuyển nhượng đất nông nghiệp của cá nhân ngoài các khu này, nên dự định nhận 2.000 m² đất trồng cây lâu năm để trồng cam không thực hiện được.","b":"Điểm c khoản 1 Điều 28 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.5","g":1,"lv":"VD","q":"Pháp luật quy định thế nào về việc cộng đồng thôn Đông thế chấp quyền sử dụng đất nông nghiệp được Nhà nước giao?","o":["Không được thế chấp","Chỉ thế chấp khi Ủy ban nhân dân cấp xã đồng ý","Được thế chấp tại tổ chức tín dụng hoạt động tại Việt Nam","Thế chấp với thời hạn tối đa 05 năm"],"a":0,"e":"Khoản 2 Điều 39 Luật Đất đai 2024: cộng đồng dân cư sử dụng đất có quyền và nghĩa vụ chung nhưng không được chuyển đổi, chuyển nhượng, tặng cho, cho thuê quyền sử dụng đất; không được thế chấp, góp vốn bằng quyền sử dụng đất. Đất giao để bảo tồn bản sắc dân tộc phải được giữ ổn định.","b":"Khoản 2 Điều 39 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Việc ông Bình dời cọc mốc, xây tường mở rộng thêm 20 m² sang thửa đất của bà Cúc là hành vi gì?","o":["Hủy hoại đất","Chuyển mục đích sử dụng đất trái phép","Chiếm đất","Lấn đất"],"a":3,"e":"Ông Bình là người đang sử dụng thửa đất của mình, tự dời cọc mốc, xây tường để mở rộng diện tích sang đất của bà Cúc – đúng định nghĩa lấn đất tại khoản 31 Điều 3 Luật Đất đai 2024; lấn đất là hành vi bị nghiêm cấm (khoản 1 Điều 11).","b":"Khoản 31 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Việc ông Bình rào 300 m² đất công cộng do Ủy ban nhân dân xã quản lý để trồng cây ăn quả là hành vi gì?","o":["Lấn đất","Chiếm đất","Hủy hoại đất","Không đăng ký đất đai"],"a":1,"e":"Phần đất công cộng 300 m² do UBND xã quản lý không liền với việc dịch chuyển ranh giới thửa đất của ông Bình; ông Bình sử dụng đất của Nhà nước mà chưa được phép – là chiếm đất (khoản 9 Điều 3), hành vi bị nghiêm cấm (khoản 1 Điều 11).","b":"Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Việc Công ty Y đổ chất thải làm ruộng ô nhiễm, không thể tiếp tục trồng lúa là hành vi gì?","o":["Không thực hiện nghĩa vụ tài chính về đất đai","Hủy hoại đất","Lấn đất","Chiếm đất"],"a":1,"e":"Công ty Y làm suy giảm chất lượng đất trồng lúa đến mức không thể tiếp tục trồng lúa – mất khả năng sử dụng theo mục đích đã xác định – là hủy hoại đất (khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024).","b":"Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.4","g":1,"lv":"VD","q":"Việc công chức địa chính xã biết các vi phạm nhưng không báo cáo, không xử lý được đánh giá như thế nào?","o":["Hợp pháp, vì xử lý vi phạm đất đai thuộc thẩm quyền cấp tỉnh","Chỉ vi phạm đạo đức công vụ, không vi phạm pháp luật đất đai","Chưa vi phạm khi các bên chưa có đơn yêu cầu","Là hành vi bị nghiêm cấm: không ngăn chặn, không xử lý hành vi vi phạm pháp luật về đất đai"],"a":3,"e":"Khoản 6 Điều 11 Luật Đất đai 2024 nghiêm cấm hành vi không ngăn chặn, không xử lý kịp thời, không đúng quy định đối với hành vi vi phạm pháp luật về đất đai của người có thẩm quyền, người có trách nhiệm. Công chức địa chính xã biết mà không báo cáo, không xử lý là vi phạm pháp luật đất đai, không chỉ là vi phạm đạo đức.","b":"Khoản 6 Điều 11 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.5","g":1,"lv":"VD","q":"Ai chịu trách nhiệm trước Nhà nước đối với 300 m² đất công cộng bị ông Bình rào?","o":["Ông Bình","Chủ tịch Ủy ban nhân dân tỉnh K","Chủ tịch Ủy ban nhân dân xã An Phú","Công chức địa chính xã An Phú"],"a":2,"e":"Khoản 2 Điều 7 Luật Đất đai 2024: Chủ tịch Ủy ban nhân dân cấp xã chịu trách nhiệm đối với việc quản lý đất sử dụng vào mục đích công cộng được giao quản lý và đất chưa giao, chưa cho thuê tại địa phương. Vì vậy Chủ tịch UBND xã An Phú chịu trách nhiệm đối với phần đất bị ông Bình chiếm.","b":"Khoản 2 Điều 7 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.03.1","g":1,"lv":"VD","q":"Loại đất của thửa đất của bà Hoa được xác định căn cứ vào đâu?","o":["Ý chí của người sử dụng đất","Bản đồ quy hoạch đô thị","Giấy chứng nhận đã cấp","Hiện trạng sử dụng tại thời điểm kiểm tra năm 2026"],"a":2,"e":"Điểm a khoản 1 Điều 10 Luật Đất đai 2024: việc xác định loại đất căn cứ vào Giấy chứng nhận đã cấp (trừ trường hợp mục đích sử dụng ghi không đúng). Hiện trạng sử dụng hay ý chí người sử dụng không phải căn cứ; bà Hoa tự xây nhà không làm thay đổi loại đất.","b":"Điểm a khoản 1 Điều 10 Luật Đất đai 2024","cid":"TH1.03"},{"id":"TH1.03.2","g":1,"lv":"VD","q":"Thửa đất của bà Hoa thuộc nhóm đất nào?","o":["Nhóm đất nông nghiệp","Nhóm đất phi nông nghiệp","Đất ở tại nông thôn","Nhóm đất chưa sử dụng"],"a":0,"e":"Điểm b khoản 2 Điều 9 Luật Đất đai 2024: đất trồng cây lâu năm thuộc nhóm đất nông nghiệp. Vì loại đất xác định theo Giấy chứng nhận, thửa đất của bà Hoa (kể cả phần đã xây nhà trái phép) vẫn thuộc nhóm đất nông nghiệp.","b":"Điểm b khoản 2 Điều 9 Luật Đất đai 2024","cid":"TH1.03"},{"id":"TH1.03.3","g":1,"lv":"VD","q":"Việc bà Hoa tự xây nhà ở trên 100 m² đất trồng cây lâu năm vi phạm nguyên tắc sử dụng đất nào?","o":["Thực hiện nghĩa vụ trong thời hạn sử dụng đất","Tuân thủ hạn mức giao đất","Không lạm dụng thuốc bảo vệ thực vật","Sử dụng đất đúng mục đích"],"a":3,"e":"Khoản 1 Điều 5 Luật Đất đai 2024: sử dụng đất phải đúng mục đích. Xây nhà ở trên đất trồng cây lâu năm khi chưa được chuyển mục đích là sử dụng đất không đúng mục đích, hành vi bị nghiêm cấm (Điều 11) và có thể bị xử phạt.","b":"Khoản 1 Điều 5 Luật Đất đai 2024","cid":"TH1.03"},{"id":"TH1.03.4","g":1,"lv":"VD","q":"Muốn xây nhà ở hợp pháp trên phần đất này, bà Hoa phải làm gì?","o":["Không cần thủ tục gì vì thửa đất đã có Giấy chứng nhận","Thông báo bằng văn bản cho Ủy ban nhân dân xã trước khi xây","Đăng ký biến động sau khi đã xây xong nhà","Được cơ quan nhà nước có thẩm quyền cho phép chuyển mục đích sang đất ở"],"a":3,"e":"Điểm b khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất nông nghiệp sang đất phi nông nghiệp (đất ở) phải được cơ quan nhà nước có thẩm quyền cho phép. Đăng ký biến động hay thông báo không thay thế cho quyết định cho phép chuyển mục đích; bà Hoa còn phải thực hiện nghĩa vụ tài chính.","b":"Điểm b khoản 1 Điều 121 Luật Đất đai 2024","cid":"TH1.03"},{"id":"TH1.03.5","g":1,"lv":"VD","q":"Quan điểm \"thửa đất là của bà nên bà có toàn quyền quyết định mục đích sử dụng\" sai vì lý do nào?","o":["Đất trồng cây lâu năm thuộc sở hữu của Ủy ban nhân dân xã","Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu, bà Hoa chỉ có quyền sử dụng đất","Bà Hoa chỉ có quyền sở hữu đất khi đã sử dụng ổn định trên 20 năm","Quyền sở hữu của bà chỉ giới hạn ở phần đất đã xây nhà"],"a":1,"e":"Điều 53 Hiến pháp 2013 và Điều 12 Luật Đất đai 2024: đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý. Người sử dụng đất chỉ có quyền sử dụng đất và phải sử dụng theo mục đích được Nhà nước xác định (khoản 2 Điều 13: Nhà nước quyết định mục đích sử dụng đất).","b":"Điều 12, khoản 2 Điều 13 Luật Đất đai 2024; Điều 53 Hiến pháp 2013","cid":"TH1.03"},{"id":"TH1.04.1","g":1,"lv":"VD","q":"Yêu cầu đòi lại 1.000 m² đất của ông Tư được giải quyết như thế nào?","o":["Diện tích đất được chia đôi giữa ông Tư và ông Năm","Ông Tư được bồi thường bằng tiền thay cho việc trả lại đất","Được chấp nhận, vì ông Tư là cháu nội, thuộc hàng thừa kế của cụ Lê","Không được chấp nhận, vì Nhà nước không thừa nhận việc đòi lại đất đã giao theo chính sách đất đai của Nhà nước Việt Nam dân chủ cộng hòa"],"a":3,"e":"Khoản 2 Điều 17 Luật Đất đai 2024: Nhà nước không thừa nhận việc đòi lại đất đã giao cho người khác sử dụng trong quá trình thực hiện chính sách đất đai của Nhà nước Việt Nam dân chủ cộng hòa. Đất được giao năm 1960 cho hộ ông Năm, ông Năm đã được cấp Giấy chứng nhận, nên yêu cầu đòi lại của ông Tư không được chấp nhận; quan hệ thừa kế không đặt ra.","b":"Khoản 2 Điều 17 Luật Đất đai 2024","cid":"TH1.04"},{"id":"TH1.04.2","g":1,"lv":"VD","q":"Việc ông Tư tự ý rào 200 m² trong thửa đất của ông Năm là hành vi gì?","o":["Chiếm đất","Hủy hoại đất","Thực hiện quyền của người thừa kế","Lấn đất"],"a":0,"e":"Ông Tư sử dụng đất của người sử dụng đất hợp pháp khác (ông Năm) khi chưa được cho phép – là chiếm đất (khoản 9 Điều 3 Luật Đất đai 2024), hành vi bị nghiêm cấm. Đây không phải lấn đất vì ông Tư không dịch chuyển ranh giới thửa đất của mình.","b":"Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH1.04"},{"id":"TH1.04.3","g":1,"lv":"VD","q":"Khi bị ông Tư xâm phạm, ông Năm có quyền gì?","o":["Yêu cầu Ủy ban Mặt trận Tổ quốc xã ra quyết định xử phạt","Khiếu nại, tố cáo, khởi kiện về hành vi vi phạm quyền sử dụng đất hợp pháp của mình","Tự cưỡng chế, phá dỡ hàng rào và tài sản của ông Tư","Yêu cầu Nhà nước thu hồi rồi giao lại đất cho mình"],"a":1,"e":"Khoản 5, khoản 8 Điều 26 Luật Đất đai 2024: người sử dụng đất được Nhà nước bảo hộ khi bị xâm phạm quyền; được khiếu nại, tố cáo, khởi kiện về hành vi vi phạm quyền sử dụng đất hợp pháp. Không được tự cưỡng chế, phá dỡ tài sản của người khác; Mặt trận không có thẩm quyền xử phạt.","b":"Khoản 5, khoản 8 Điều 26 Luật Đất đai 2024","cid":"TH1.04"},{"id":"TH1.04.4","g":1,"lv":"VD","q":"Ông Tư có thể thực hiện quyền nào của công dân đối với vấn đề này?","o":["Yêu cầu hủy Giấy chứng nhận của ông Năm mà không cần căn cứ","Kiến nghị, phản ánh với cơ quan nhà nước về công tác quản lý, sử dụng đất đai","Tự xác lập lại quyền sử dụng đất của dòng họ","Được ưu tiên giao lại đất vì là cháu nội chủ cũ"],"a":1,"e":"Khoản 2 Điều 23 Luật Đất đai 2024: công dân có quyền kiến nghị, phản ánh với cơ quan nhà nước có thẩm quyền về công tác quản lý, sử dụng đất đai. Ông Tư không có quyền tự xác lập lại quyền của dòng họ hay yêu cầu hủy Giấy chứng nhận không có căn cứ.","b":"Khoản 2 Điều 23 Luật Đất đai 2024","cid":"TH1.04"},{"id":"TH1.05.1","g":1,"lv":"VD","q":"Lý do \"không phải chủ đất\" mà cán bộ đưa ra để từ chối cung cấp thông tin được đánh giá như thế nào?","o":["Chỉ hợp pháp đối với thông tin về kết quả giải quyết tranh chấp","Có căn cứ, vì chỉ người sử dụng đất mới được tiếp cận thông tin về thửa đất","Hợp pháp nếu anh Khoa không xuất trình giấy ủy quyền của chủ đất","Trái pháp luật, vì tiếp cận thông tin đất đai là quyền của công dân, không phụ thuộc việc có quyền sử dụng đất"],"a":3,"e":"Khoản 1 Điều 24 Luật Đất đai 2024: công dân được tiếp cận thông tin về quy hoạch, kế hoạch sử dụng đất, giá đất, kết quả giải quyết tranh chấp… Quyền này không phụ thuộc việc có quyền sử dụng đất. Khoản 5 Điều 11 nghiêm cấm việc không cung cấp hoặc cung cấp thông tin đất đai không chính xác theo quy định.","b":"Khoản 1 Điều 24, khoản 5 Điều 11 Luật Đất đai 2024","cid":"TH1.05"},{"id":"TH1.05.2","g":1,"lv":"TH","q":"Loại thông tin nào trong Hệ thống thông tin quốc gia về đất đai không được công bố công khai?","o":["Thông tin thuộc bí mật nhà nước","Quy hoạch sử dụng đất đã được phê duyệt","Bảng giá đất đã công bố","Kết quả giải quyết tranh chấp đất đai"],"a":0,"e":"Khoản 2 Điều 18 Luật Đất đai 2024: Nhà nước công khai thông tin trong Hệ thống thông tin quốc gia về đất đai, trừ thông tin thuộc bí mật nhà nước. Quy hoạch đã phê duyệt, kết quả giải quyết tranh chấp, bảng giá đất đều thuộc nhóm thông tin được tiếp cận.","b":"Khoản 2 Điều 18 Luật Đất đai 2024","cid":"TH1.05"},{"id":"TH1.05.3","g":1,"lv":"VD","q":"Việc anh Khoa góp ý dự thảo kế hoạch sử dụng đất là thực hiện quyền nào?","o":["Quyền đại diện chủ sở hữu về đất đai","Quyền của công dân tham gia xây dựng, góp ý, giám sát việc thực hiện chính sách, pháp luật về đất đai","Quyền của người sử dụng đất được chuyển mục đích sử dụng đất","Quyền của tổ chức kinh tế được giao đất có thu tiền"],"a":1,"e":"Khoản 1 Điều 23 Luật Đất đai 2024: công dân có quyền tham gia xây dựng, góp ý, giám sát trong việc hoàn thiện và thực hiện chính sách, pháp luật về đất đai, trong đó có góp ý dự thảo quy hoạch, kế hoạch sử dụng đất. Đây không phải quyền của người sử dụng đất hay quyền đại diện chủ sở hữu.","b":"Khoản 1 Điều 23 Luật Đất đai 2024","cid":"TH1.05"},{"id":"TH1.05.4","g":1,"lv":"VD","q":"Anh Khoa có quyền tham gia đấu giá quyền sử dụng đất do Nhà nước tổ chức không?","o":["Chỉ khi được Ủy ban Mặt trận Tổ quốc giới thiệu","Không, vì đấu giá quyền sử dụng đất chỉ dành cho tổ chức kinh tế","Chỉ khi anh Khoa đã có quyền sử dụng đất tại cùng địa phương","Có, tham gia đấu giá quyền sử dụng đất là quyền của công dân theo quy định của pháp luật"],"a":3,"e":"Khoản 4 Điều 23 Luật Đất đai 2024: công dân có quyền tham gia đấu giá quyền sử dụng đất theo quy định của pháp luật. Việc đã có đất tại địa phương hay giới thiệu của Mặt trận không phải điều kiện; đấu giá không chỉ dành cho tổ chức kinh tế.","b":"Khoản 4 Điều 23 Luật Đất đai 2024","cid":"TH1.05"},{"id":"TH1.06.1","g":1,"lv":"VD","q":"Ai chịu trách nhiệm trước Nhà nước đối với thửa đất 400 m² của ông Hải, ông Hà, ông Hưng?","o":["Người đứng tên đầu tiên trên Giấy chứng nhận","Chủ tịch Ủy ban nhân dân xã Phú Lương","Riêng người lớn tuổi nhất trong ba anh em","Ba người có chung quyền sử dụng đất hoặc người đại diện cho nhóm"],"a":3,"e":"Khoản 6 Điều 6 Luật Đất đai 2024: người có chung quyền sử dụng đất hoặc người đại diện cho nhóm người có chung quyền sử dụng đất chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất đó. Không mặc nhiên là người đứng tên đầu tiên hay người lớn tuổi nhất.","b":"Khoản 6 Điều 6 Luật Đất đai 2024","cid":"TH1.06"},{"id":"TH1.06.2","g":1,"lv":"VD","q":"Ai chịu trách nhiệm trước Nhà nước đối với 2 ha đất nông nghiệp giao cho cộng đồng thôn Bản Mường?","o":["Chủ tịch Ủy ban nhân dân xã Phú Lương","Từng hộ trong thôn theo phần bằng nhau","Người đại diện cho cộng đồng dân cư, ở đây là trưởng thôn hoặc người được cộng đồng thỏa thuận cử ra","Ủy ban Mặt trận Tổ quốc xã"],"a":2,"e":"Khoản 3 Điều 6 Luật Đất đai 2024: người đại diện cho cộng đồng dân cư là trưởng thôn, làng, ấp, bản, buôn… hoặc người được cộng đồng thỏa thuận cử ra chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất đã giao cho cộng đồng.","b":"Khoản 3 Điều 6 Luật Đất đai 2024","cid":"TH1.06"},{"id":"TH1.06.3","g":1,"lv":"VD","q":"Ai chịu trách nhiệm quản lý bãi đất ven sông chưa giao, chưa cho thuê đang bị lấn chiếm?","o":["Chủ tịch Ủy ban nhân dân tỉnh Q","Chủ tịch Ủy ban nhân dân xã Phú Lương","Những người đang lấn chiếm bãi đất","Cơ quan quản lý đường thủy nội địa"],"a":1,"e":"Khoản 2 Điều 7 Luật Đất đai 2024: Chủ tịch UBND cấp xã chịu trách nhiệm quản lý đất chưa giao, chưa cho thuê tại địa phương. Người lấn chiếm không có quyền đối với đất; cơ quan đường thủy nội địa chỉ quản lý hành lang bảo vệ theo pháp luật chuyên ngành.","b":"Khoản 2 Điều 7 Luật Đất đai 2024","cid":"TH1.06"},{"id":"TH1.06.4","g":1,"lv":"VD","q":"Ai chịu trách nhiệm đối với đất chưa sử dụng tại hòn đảo chưa giao cho đơn vị hành chính cấp xã quản lý?","o":["Chủ tịch Ủy ban nhân dân tỉnh Q","Thủ tướng Chính phủ","Chủ tịch Ủy ban nhân dân xã gần hòn đảo nhất","Bộ Quốc phòng"],"a":0,"e":"Khoản 3 Điều 7 Luật Đất đai 2024: Chủ tịch UBND cấp tỉnh chịu trách nhiệm quản lý đất chưa sử dụng tại các đảo chưa có người ở thuộc địa phương (chưa giao cho đơn vị hành chính cấp xã quản lý).","b":"Khoản 3 Điều 7 Luật Đất đai 2024","cid":"TH1.06"},{"id":"TH1.07.1","g":1,"lv":"VD","q":"Theo Luật Đất đai 2024, các thành viên hộ ông Sơn được xác định thế nào đối với 2.000 m² đất được giao năm 2010?","o":["Nhóm người có chung quyền sử dụng đất, có quyền và nghĩa vụ như cá nhân","Một tổ chức kinh tế sử dụng đất","Một cộng đồng dân cư sử dụng đất","Một pháp nhân sử dụng đất"],"a":0,"e":"Hộ ông Sơn được giao đất năm 2010 (trước Luật Đất đai 2024), các thành viên có quan hệ hôn nhân, huyết thống, sống chung – là hộ gia đình sử dụng đất (khoản 25 Điều 3). Theo điểm a khoản 2 Điều 27, nhóm người có chung quyền sử dụng đất gồm các cá nhân có quyền và nghĩa vụ như cá nhân.","b":"Khoản 25 Điều 3, điểm a khoản 2 Điều 27 Luật Đất đai 2024","cid":"TH1.07"},{"id":"TH1.07.2","g":1,"lv":"VD","q":"Quyền sử dụng đất chung của hộ chưa chia theo phần. Để chuyển nhượng 500 m² hợp pháp cần điều kiện gì về chủ thể thực hiện?","o":["Các thành viên cùng thực hiện hoặc ủy quyền cho người đại diện","Chỉ cần xác nhận của Ủy ban nhân dân xã","Chỉ cần chữ ký của người đứng tên chủ hộ","Chỉ cần sự đồng ý của vợ ông Sơn"],"a":0,"e":"Điểm b khoản 2 Điều 27 Luật Đất đai 2024: trường hợp quyền sử dụng đất của nhóm người chưa phân chia theo phần thì các thành viên cùng nhau thực hiện hoặc ủy quyền cho người đại diện để thực hiện quyền. Ông Sơn tự ký không có ủy quyền của vợ và hai con là không đủ thẩm quyền.","b":"Điểm b khoản 2 Điều 27 Luật Đất đai 2024","cid":"TH1.07"},{"id":"TH1.07.3","g":1,"lv":"VD","q":"Hợp đồng chuyển nhượng giữa ông Sơn và ông Tùng phải đáp ứng yêu cầu hình thức nào?","o":["Được công chứng hoặc chứng thực","Lập thành văn bản có hai người làm chứng là đủ","Chỉ cần đăng ký tại Ủy ban nhân dân xã","Có thể thỏa thuận miệng nếu đã giao đủ tiền"],"a":0,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất phải được công chứng hoặc chứng thực (trừ trường hợp một bên là tổ chức kinh doanh bất động sản). Giấy tự viết không công chứng, chứng thực không đáp ứng hình thức.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH1.07"},{"id":"TH1.07.4","g":1,"lv":"TH","q":"Yêu cầu nào KHÔNG phải là điều kiện chung để chuyển nhượng quyền sử dụng đất?","o":["Có Giấy chứng nhận","Đất không có tranh chấp hoặc tranh chấp đã được giải quyết","Còn trong thời hạn sử dụng đất","Người chuyển nhượng phải thường trú tại xã nơi có đất"],"a":3,"e":"Khoản 1 Điều 45 Luật Đất đai 2024 quy định điều kiện chung: có Giấy chứng nhận (trừ trường hợp luật quy định khác); đất không có tranh chấp hoặc tranh chấp đã được giải quyết; quyền sử dụng đất không bị kê biên, áp dụng biện pháp khác để bảo đảm thi hành án; trong thời hạn sử dụng đất; không bị áp dụng biện pháp khẩn cấp tạm thời. Không có điều kiện người chuyển nhượng phải thường trú tại xã.","b":"Khoản 1 Điều 45 Luật Đất đai 2024","cid":"TH1.07"},{"id":"TH1.08.1","g":1,"lv":"VD","q":"Việc bà Lụa phun thuốc bảo vệ thực vật vượt nhiều lần liều khuyến cáo làm đất ô nhiễm vi phạm nguyên tắc sử dụng đất nào?","o":["Thực hiện quyền trong thời hạn sử dụng đất","Tuân thủ hạn mức giao đất nông nghiệp","Tiết kiệm tài nguyên trong lòng đất","Bảo vệ đất, bảo vệ môi trường, không lạm dụng thuốc bảo vệ thực vật làm ô nhiễm, thoái hóa đất"],"a":3,"e":"Khoản 3 Điều 5 Luật Đất đai 2024: sử dụng đất phải bảo vệ đất, bảo vệ môi trường, thích ứng biến đổi khí hậu, không được lạm dụng thuốc bảo vệ thực vật, phân hóa học làm ô nhiễm, thoái hóa đất. Hành vi của bà Lụa vi phạm nguyên tắc này.","b":"Khoản 3 Điều 5 Luật Đất đai 2024","cid":"TH1.08"},{"id":"TH1.08.2","g":1,"lv":"VD","q":"Gia đình ông Quang có quyền yêu cầu lối đi qua đất bà Lụa trên cơ sở nào?","o":["Thửa đất bị vây bọc, không có lối đi ra đường công cộng nên có quyền yêu cầu một lối đi hợp lý","Phần lối đi đã được ông Quang nộp tiền sử dụng đất","Lối đi là đất công cộng do Nhà nước quản lý","Việc đi qua nhiều năm đã làm phát sinh quyền sở hữu lối đi"],"a":0,"e":"Khoản 1 Điều 29 Luật Đất đai 2024 và Điều 254 BLDS 2015: chủ sở hữu bất động sản bị vây bọc bởi các bất động sản khác mà không có lối đi ra đường công cộng có quyền yêu cầu chủ sở hữu bất động sản vây bọc dành cho mình một lối đi hợp lý trên phần đất của họ (có đền bù nếu không có thỏa thuận khác). Thời gian đi qua không làm phát sinh quyền sở hữu.","b":"Khoản 1 Điều 29 Luật Đất đai 2024; Điều 254 Bộ luật Dân sự 2015","cid":"TH1.08"},{"id":"TH1.08.3","g":1,"lv":"VD","q":"Quyền về lối đi qua thửa đất liền kề được xác lập theo pháp luật nào và cần thủ tục gì?","o":["Do Ủy ban nhân dân tỉnh quyết định khi giao đất","Bằng thỏa thuận miệng, không phải đăng ký","Theo pháp luật dân sự và phải đăng ký theo Điều 133 Luật Đất đai 2024","Bằng quyết định hành chính của Ủy ban nhân dân xã, không phải đăng ký"],"a":2,"e":"Khoản 2 Điều 29 Luật Đất đai 2024: quyền đối với thửa đất liền kề được xác lập theo quy định của pháp luật dân sự và phải đăng ký theo quy định tại Điều 133. Việc đăng ký giúp quyền này được công khai, đối kháng với người thứ ba.","b":"Khoản 2 Điều 29, điểm l khoản 1 Điều 133 Luật Đất đai 2024","cid":"TH1.08"},{"id":"TH1.08.4","g":1,"lv":"VD","q":"Sau khi bị chặn lối đi, ông Quang có thể bảo vệ quyền của mình bằng cách nào?","o":["Tự phá bức tường để mở lại lối đi","Yêu cầu bà Lụa dành lối đi hợp lý; không thỏa thuận được thì khởi kiện yêu cầu Tòa án giải quyết","Yêu cầu Nhà nước bồi thường thiệt hại","Đề nghị Ủy ban nhân dân xã thu hồi một phần đất của bà Lụa để giao cho mình"],"a":1,"e":"Ông Quang có quyền yêu cầu bà Lụa mở lối đi hợp lý (Điều 254 BLDS); nếu không thỏa thuận được thì khởi kiện yêu cầu Tòa án giải quyết (khoản 8 Điều 26 Luật Đất đai 2024 – quyền khởi kiện khi quyền sử dụng đất bị xâm phạm). Không được tự phá tường; Nhà nước không thu hồi đất trong trường hợp này.","b":"Khoản 8 Điều 26 Luật Đất đai 2024; Điều 254 Bộ luật Dân sự 2015","cid":"TH1.08"},{"id":"TH1.09.1","g":1,"lv":"VD","q":"Ý kiến \"chỉ Quốc hội mới có quyền đại diện chủ sở hữu toàn dân về đất đai\" được đánh giá như thế nào?","o":["Có cơ sở, vì Quốc hội là cơ quan quyền lực nhà nước cao nhất","Hoàn toàn chính xác, vì Hiến pháp giao toàn bộ quyền đại diện chủ sở hữu cho Quốc hội","Không đúng, vì Quốc hội, Hội đồng nhân dân, Chính phủ và Ủy ban nhân dân các cấp đều thực hiện quyền đại diện chủ sở hữu theo thẩm quyền","Chỉ sai đối với Hội đồng nhân dân, còn Ủy ban nhân dân không có quyền này"],"a":2,"e":"Điều 14 Luật Đất đai 2024: Nhà nước thực hiện quyền đại diện chủ sở hữu thông qua Quốc hội, Hội đồng nhân dân các cấp, Chính phủ và Ủy ban nhân dân các cấp theo thẩm quyền. Vì vậy hoạt động của HĐND và UBND tỉnh M là đúng thẩm quyền.","b":"Điều 14 Luật Đất đai 2024","cid":"TH1.09"},{"id":"TH1.09.2","g":1,"lv":"VD","q":"Việc Hội đồng nhân dân tỉnh M thông qua việc thu hồi đất để thực hiện dự án vì lợi ích công cộng của địa phương thể hiện vai trò gì?","o":["Giám sát tối cao việc thi hành pháp luật đất đai","Xét xử tranh chấp đất đai tại địa phương","Hành động với tư cách người sử dụng đất","Thực hiện quyền đại diện chủ sở hữu về đất đai theo thẩm quyền"],"a":3,"e":"Khoản 2 Điều 14 Luật Đất đai 2024: Hội đồng nhân dân các cấp thực hiện quyền đại diện chủ sở hữu theo thẩm quyền, trong đó có thông qua quy hoạch sử dụng đất của địa phương trước khi trình phê duyệt và thông qua danh mục dự án cần thu hồi đất vì lợi ích quốc gia, công cộng. HĐND không xét xử, không là người sử dụng đất.","b":"Khoản 2 Điều 14 Luật Đất đai 2024","cid":"TH1.09"},{"id":"TH1.09.3","g":1,"lv":"VD","q":"Việc Ủy ban nhân dân tỉnh M quyết định giao đất cho chủ đầu tư thể hiện quyền nào của Nhà nước với tư cách đại diện chủ sở hữu?","o":["Quyết định trưng dụng đất","Quyết định giá đất cụ thể","Công nhận quyền sử dụng đất","Quyết định giao đất"],"a":3,"e":"Khoản 7 Điều 13 Luật Đất đai 2024: Nhà nước với tư cách đại diện chủ sở hữu có quyền quyết định giao đất, cho thuê đất, công nhận quyền sử dụng đất, thu hồi đất, trưng dụng đất. UBND tỉnh giao đất cho chủ đầu tư là thực hiện quyền 'quyết định giao đất'.","b":"Khoản 7 Điều 13 Luật Đất đai 2024","cid":"TH1.09"},{"id":"TH1.09.4","g":1,"lv":"VD","q":"Ủy ban Mặt trận Tổ quốc Việt Nam tỉnh M có trách nhiệm gì đối với việc thu hồi đất này?","o":["Tham gia ý kiến về trường hợp thu hồi đất, phương án bồi thường, hỗ trợ, tái định cư","Quyết định thu hồi đất thay Ủy ban nhân dân tỉnh","Phê duyệt giá đất để tính bồi thường","Trực tiếp tổ chức cưỡng chế thu hồi đất"],"a":0,"e":"Điểm b khoản 2 Điều 19 Luật Đất đai 2024: Ủy ban Mặt trận Tổ quốc tham gia ý kiến về các trường hợp thu hồi đất, phương án bồi thường, hỗ trợ, tái định cư, tham gia giám sát. Mặt trận không có thẩm quyền quyết định thu hồi, cưỡng chế hay phê duyệt giá đất.","b":"Điểm b khoản 2 Điều 19 Luật Đất đai 2024","cid":"TH1.09"},{"id":"TH1.10.1","g":1,"lv":"VD","q":"Quan hệ cho thuê đất giữa Ủy ban nhân dân tỉnh P và Công ty Thành Đạt được điều chỉnh chủ yếu bằng phương pháp nào?","o":["Bình đẳng – thỏa thuận","Áp dụng tập quán địa phương","Hòa giải ở cơ sở","Hành chính – mệnh lệnh"],"a":3,"e":"Cho thuê đất là quan hệ giữa Nhà nước (đại diện chủ sở hữu, khoản 8 Điều 13) và người sử dụng đất, được xác lập bằng quyết định hành chính đơn phương. Vì vậy phương pháp điều chỉnh chủ yếu là hành chính – mệnh lệnh.","b":"Khoản 8 Điều 13 Luật Đất đai 2024","cid":"TH1.10"},{"id":"TH1.10.2","g":1,"lv":"VD","q":"Quan hệ chuyển nhượng giữa ông Cường và bà Dung được điều chỉnh chủ yếu bằng phương pháp nào?","o":["Hành chính – mệnh lệnh","Bình đẳng – thỏa thuận","Kế hoạch hóa tập trung","Kỷ luật công vụ"],"a":1,"e":"Chuyển nhượng quyền sử dụng đất giữa hai cá nhân là giao dịch dân sự, các bên tự thỏa thuận giá và điều kiện (khoản 1 Điều 27 Luật Đất đai 2024). Phương pháp điều chỉnh chủ yếu là bình đẳng – thỏa thuận.","b":"Khoản 1 Điều 27 Luật Đất đai 2024","cid":"TH1.10"},{"id":"TH1.10.3","g":1,"lv":"VD","q":"Quan hệ thuê đất giữa Nhà nước và Công ty Thành Đạt được xác lập bằng hình thức pháp lý nào?","o":["Quyết định cho thuê đất của cơ quan nhà nước có thẩm quyền","Biên bản đấu giá của tổ chức đấu giá tài sản","Hợp đồng chuyển nhượng quyền sử dụng đất","Giấy chứng nhận cấp lần đầu"],"a":0,"e":"Khoản 32 Điều 3 Luật Đất đai 2024: Nhà nước cho thuê quyền sử dụng đất là việc Nhà nước quyết định trao quyền sử dụng đất cho đối tượng có nhu cầu thông qua hợp đồng cho thuê. Hình thức xác lập là quyết định cho thuê đất của cơ quan có thẩm quyền (kèm hợp đồng thuê đất), không phải hợp đồng chuyển nhượng hay Giấy chứng nhận.","b":"Khoản 32 Điều 3 Luật Đất đai 2024","cid":"TH1.10"},{"id":"TH1.10.4","g":1,"lv":"VD","q":"Sau khi công chứng hợp đồng, ông Cường và bà Dung phải đăng ký biến động trong thời hạn bao lâu kể từ ngày có biến động?","o":["15 ngày","60 ngày","30 ngày","90 ngày"],"a":2,"e":"Khoản 3 Điều 133 Luật Đất đai 2024: các trường hợp đăng ký biến động (trong đó có chuyển nhượng) phải thực hiện thủ tục trong thời hạn 30 ngày kể từ ngày có biến động.","b":"Điểm a khoản 1, khoản 3 Điều 133 Luật Đất đai 2024","cid":"TH1.10"},{"id":"TH1.10.5","g":1,"lv":"VD","q":"Việc chuyển quyền sử dụng đất từ ông Cường sang bà Dung có hiệu lực từ thời điểm nào?","o":["Thời điểm đăng ký theo quy định của Luật Đất đai","Thời điểm hai bên ký hợp đồng","Thời điểm hợp đồng được công chứng","Thời điểm bà Dung thanh toán đủ 3 tỷ đồng"],"a":0,"e":"Điều 503 BLDS 2015 và khoản 3 Điều 27 Luật Đất đai 2024: việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký vào sổ địa chính theo quy định của Luật Đất đai. Công chứng chỉ làm hợp đồng có hiệu lực về hình thức; thanh toán là nghĩa vụ hợp đồng.","b":"Điều 503 Bộ luật Dân sự 2015","cid":"TH1.10"},{"id":"2.01","g":2,"lv":"NB","q":"Theo Luật Đất đai 2024, đất ở có thời hạn sử dụng như thế nào?","o":["50 năm và được gia hạn","70 năm","Theo thời hạn của dự án đầu tư","Ổn định lâu dài"],"a":3,"e":"Khoản 1 Điều 171 Luật Đất đai 2024: đất ở là đất sử dụng ổn định lâu dài. Thời hạn 50 năm, 70 năm áp dụng cho đất được giao, cho thuê có thời hạn (Điều 172); thời hạn theo dự án đầu tư áp dụng cho tổ chức thực hiện dự án.","b":"Khoản 1 Điều 171 Luật Đất đai 2024"},{"id":"2.02","g":2,"lv":"TH","q":"Khi hết thời hạn giao đất trồng cây hằng năm trong hạn mức, cá nhân trực tiếp sản xuất nông nghiệp được xử lý thế nào?","o":["Phải nộp hồ sơ gia hạn chậm nhất 06 tháng trước khi hết hạn","Được tiếp tục sử dụng đất theo thời hạn 50 năm mà không phải làm thủ tục gia hạn","Phải chuyển sang hình thức thuê đất trả tiền hằng năm","Nhà nước thu hồi đất rồi giao lại theo nhu cầu"],"a":1,"e":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024: thời hạn giao đất nông nghiệp trong hạn mức cho cá nhân trực tiếp sản xuất nông nghiệp là 50 năm; khi hết thời hạn được tiếp tục sử dụng đất theo thời hạn quy định mà không phải làm thủ tục gia hạn. Đây là điểm khác với các trường hợp phải nộp hồ sơ gia hạn trước 06 tháng.","b":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.03","g":2,"lv":"NB","q":"Dự án đầu tư có thời hạn hoạt động trên 50 năm theo Luật Đầu tư thì thời hạn giao đất, cho thuê đất tối đa là bao lâu?","o":["99 năm","70 năm","Ổn định lâu dài","50 năm"],"a":1,"e":"Điểm c khoản 1 Điều 172 Luật Đất đai 2024: thời hạn giao đất, cho thuê đất cho tổ chức, cá nhân thực hiện dự án đầu tư được xem xét theo thời hạn hoạt động của dự án nhưng không quá 50 năm; dự án có thời hạn hoạt động trên 50 năm theo Luật Đầu tư thì không quá 70 năm.","b":"Điểm c khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.04","g":2,"lv":"NB","q":"Thời hạn cho thuê đất xây dựng trụ sở làm việc của tổ chức nước ngoài có chức năng ngoại giao là bao lâu?","o":["Không quá 50 năm","Ổn định lâu dài","Không quá 70 năm","Không quá 99 năm"],"a":3,"e":"Điểm d khoản 1 Điều 172 Luật Đất đai 2024: thời hạn cho thuê đất xây dựng trụ sở làm việc của tổ chức nước ngoài có chức năng ngoại giao không quá 99 năm; hết hạn nếu có nhu cầu được xem xét gia hạn hoặc cho thuê đất khác.","b":"Điểm d khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.05","g":2,"lv":"NB","q":"Người sử dụng đất có thời hạn (không thuộc trường hợp miễn gia hạn) muốn gia hạn phải nộp hồ sơ chậm nhất khi nào?","o":["03 tháng trước khi hết thời hạn sử dụng đất","12 tháng trước khi hết thời hạn sử dụng đất","Trong 24 tháng sau khi hết thời hạn sử dụng đất","06 tháng trước khi hết thời hạn sử dụng đất"],"a":3,"e":"Khoản 3 Điều 172 Luật Đất đai 2024: người sử dụng đất có nhu cầu gia hạn phải nộp hồ sơ chậm nhất là 06 tháng trước khi hết thời hạn sử dụng đất (trừ trường hợp được tiếp tục sử dụng không phải gia hạn). Mốc 24 tháng là thời hạn xử lý tài sản khi không được gia hạn (khoản 4).","b":"Khoản 3 Điều 172 Luật Đất đai 2024"},{"id":"2.06","g":2,"lv":"TH","q":"Người nhận chuyển nhượng quyền sử dụng đất thuộc loại đất có thời hạn được sử dụng đất trong thời hạn nào?","o":["Thời gian còn lại của thời hạn sử dụng đất trước khi nhận chuyển quyền","Thời hạn mới 50 năm tính từ ngày nhận chuyển nhượng","Thời hạn do các bên thỏa thuận trong hợp đồng","Ổn định lâu dài kể từ ngày đăng ký biến động"],"a":0,"e":"Khoản 1 Điều 174 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất đối với loại đất có thời hạn thì thời hạn sử dụng đất là thời gian sử dụng đất còn lại của thời hạn trước khi nhận chuyển quyền. Các bên không được thỏa thuận thời hạn mới.","b":"Khoản 1 Điều 174 Luật Đất đai 2024"},{"id":"2.07","g":2,"lv":"TH","q":"Cá nhân được phép chuyển đất trồng cây hằng năm sang đất rừng phòng hộ thì thời hạn sử dụng đất là gì?","o":["Thời hạn còn lại của đất trồng cây hằng năm","50 năm kể từ ngày được phép chuyển mục đích","70 năm kể từ ngày được phép chuyển mục đích","Ổn định lâu dài"],"a":3,"e":"Điểm b khoản 1 Điều 173 Luật Đất đai 2024: trường hợp chuyển đất nông nghiệp sang đất rừng phòng hộ, rừng đặc dụng thì thời hạn sử dụng đất là ổn định lâu dài. Đây là ngoại lệ so với quy tắc chung khi chuyển mục đích trong nhóm đất nông nghiệp (thời hạn được xác định theo thời hạn đã giao, cho thuê).","b":"Điểm b khoản 1 Điều 173 Luật Đất đai 2024"},{"id":"2.08","g":2,"lv":"NB","q":"Hạn mức giao đất trồng cây hằng năm cho cá nhân trực tiếp sản xuất nông nghiệp tại một tỉnh vùng đồng bằng sông Hồng là bao nhiêu?","o":["Không quá 02 ha","Không quá 05 ha","Không quá 03 ha","Không quá 10 ha"],"a":0,"e":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024: hạn mức giao đất trồng cây hằng năm, nuôi trồng thủy sản, làm muối cho cá nhân trực tiếp sản xuất nông nghiệp là không quá 02 ha cho mỗi loại đất đối với tỉnh, thành phố khác (ngoài Đông Nam Bộ và đồng bằng sông Cửu Long, nơi hạn mức là 03 ha).","b":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024"},{"id":"2.09","g":2,"lv":"TH","q":"Diện tích đất nông nghiệp cá nhân có được do nhận chuyển nhượng từ người khác được xử lý thế nào khi xác định hạn mức giao đất nông nghiệp?","o":["Chỉ tính vào hạn mức nếu nhận chuyển nhượng ngoài xã nơi thường trú","Không tính vào hạn mức giao đất nông nghiệp","Cộng toàn bộ vào hạn mức giao đất nông nghiệp","Tính một nửa diện tích vào hạn mức giao đất"],"a":1,"e":"Khoản 7 Điều 176 Luật Đất đai 2024: diện tích đất nông nghiệp của cá nhân do nhận chuyển nhượng, thuê, thuê lại, nhận thừa kế, được tặng cho, nhận góp vốn… không tính vào hạn mức giao đất nông nghiệp. Diện tích này chịu sự điều chỉnh của hạn mức nhận chuyển quyền (Điều 177).","b":"Khoản 7 Điều 176 Luật Đất đai 2024"},{"id":"2.10","g":2,"lv":"NB","q":"Hạn mức nhận chuyển quyền sử dụng đất nông nghiệp của cá nhân đối với mỗi loại đất tối đa là bao nhiêu?","o":["Không giới hạn nếu cá nhân trực tiếp sản xuất nông nghiệp","Không quá 15 lần hạn mức giao đất nông nghiệp","Không quá 20 lần hạn mức giao đất nông nghiệp","Không quá 10 lần hạn mức giao đất nông nghiệp"],"a":1,"e":"Khoản 1 Điều 177 Luật Đất đai 2024: hạn mức nhận chuyển quyền sử dụng đất nông nghiệp của cá nhân không quá 15 lần hạn mức giao đất nông nghiệp của cá nhân đối với mỗi loại đất (Luật 2013 là 10 lần). Mức cụ thể do UBND cấp tỉnh quy định.","b":"Khoản 1 Điều 177 Luật Đất đai 2024"},{"id":"2.11","g":2,"lv":"NB","q":"Theo Luật Đất đai 2024, đất chuyên trồng lúa là đất như thế nào?","o":["Đất trồng từ 02 vụ lúa trở lên","Đất trồng lúa nương","Đất trồng 01 vụ lúa kết hợp nuôi thủy sản","Đất nằm trong vùng quy hoạch lúa chất lượng cao, không phụ thuộc số vụ"],"a":0,"e":"Khoản 1 Điều 182 Luật Đất đai 2024: đất trồng lúa gồm đất chuyên trồng lúa và đất trồng lúa còn lại; đất chuyên trồng lúa là đất trồng từ hai vụ lúa trở lên. Lúa nương, đất trồng một vụ lúa thuộc đất trồng lúa còn lại.","b":"Khoản 1 Điều 182 Luật Đất đai 2024"},{"id":"2.12","g":2,"lv":"TH","q":"Người sử dụng đất trồng lúa được chuyển đổi cơ cấu cây trồng, vật nuôi với điều kiện nào?","o":["Được Ủy ban nhân dân cấp tỉnh cho phép chuyển mục đích sử dụng đất","Không làm mất đi điều kiện cần thiết để trồng lúa trở lại","Đã nộp tiền để Nhà nước bổ sung diện tích đất trồng lúa","Chỉ áp dụng với đất trồng lúa còn lại, không áp dụng với đất chuyên trồng lúa"],"a":1,"e":"Khoản 5 Điều 182 Luật Đất đai 2024: người sử dụng đất trồng lúa được chuyển đổi cơ cấu cây trồng, vật nuôi trên đất trồng lúa nhưng không làm mất đi các điều kiện phù hợp để trồng lúa trở lại. Chuyển đổi cơ cấu không phải chuyển mục đích nên không cần UBND tỉnh cho phép; áp dụng cho cả đất chuyên trồng lúa.","b":"Khoản 5 Điều 182 Luật Đất đai 2024"},{"id":"2.13","g":2,"lv":"TH","q":"Loại đất rừng nào sau đây là đất sử dụng ổn định lâu dài?","o":["Đất rừng sản xuất là rừng trồng giao cho cá nhân trong hạn mức","Đất rừng sản xuất do tổ chức quản lý","Đất rừng sản xuất Nhà nước cho cá nhân thuê","Đất rừng sản xuất cá nhân nhận chuyển nhượng"],"a":1,"e":"Khoản 3 Điều 171 Luật Đất đai 2024: đất rừng đặc dụng, rừng phòng hộ và đất rừng sản xuất do tổ chức quản lý là đất sử dụng ổn định lâu dài. Đất rừng sản xuất là rừng trồng giao cho cá nhân trong hạn mức, cho thuê hoặc nhận chuyển nhượng là đất có thời hạn (Điều 172, 174).","b":"Khoản 3 Điều 171, điểm a khoản 1 Điều 172 Luật Đất đai 2024"},{"id":"2.14","g":2,"lv":"TH","q":"Người được Nhà nước cho thuê đất rừng sản xuất là rừng tự nhiên bị hạn chế quyền nào?","o":["Không được trả tiền thuê đất hằng năm","Không được khai thác lâm sản theo quy định của pháp luật lâm nghiệp","Không được chuyển nhượng, cho thuê lại, thế chấp, góp vốn bằng quyền sử dụng đất và quyền thuê đất","Không được xây dựng công trình hạ tầng phục vụ bảo vệ, phát triển rừng"],"a":2,"e":"Khoản 3 Điều 184 Luật Đất đai 2024: tổ chức, cá nhân được Nhà nước cho thuê đất rừng sản xuất là rừng tự nhiên để bảo vệ, phát triển rừng… không được chuyển nhượng, cho thuê lại, thế chấp, góp vốn bằng quyền sử dụng đất và quyền thuê trong hợp đồng thuê đất. Họ vẫn được khai thác lâm sản và xây công trình phục vụ bảo vệ rừng theo pháp luật lâm nghiệp.","b":"Khoản 3 Điều 184 Luật Đất đai 2024"},{"id":"2.15","g":2,"lv":"NB","q":"Diện tích đất nông nghiệp công ích chưa sử dụng được Ủy ban nhân dân cấp xã cho thuê theo hình thức và thời hạn nào?","o":["Đấu giá, mỗi lần thuê không quá 10 năm","Chỉ định, thời hạn theo thỏa thuận","Đấu giá, mỗi lần thuê không quá 20 năm","Chỉ định, mỗi lần thuê không quá 05 năm"],"a":0,"e":"Khoản 3 Điều 179 Luật Đất đai 2024: đối với diện tích quỹ đất nông nghiệp công ích chưa sử dụng, UBND cấp xã cho cá nhân tại địa phương thuê để sản xuất nông nghiệp, nuôi trồng thủy sản theo hình thức đấu giá; thời hạn sử dụng đất đối với mỗi lần thuê không quá 10 năm.","b":"Khoản 3 Điều 179 Luật Đất đai 2024"},{"id":"2.16","g":2,"lv":"NB","q":"Đất có đình, đền, miếu, am, nhà thờ họ thuộc loại đất nào?","o":["Đất tôn giáo","Đất ở","Đất tín ngưỡng","Đất sử dụng vào mục đích công cộng"],"a":2,"e":"Khoản 1 Điều 212 và điểm g khoản 3 Điều 9 Luật Đất đai 2024: đất tín ngưỡng gồm đất có công trình đình, đền, miếu, am, nhà thờ họ, công trình tín ngưỡng khác. Đất tôn giáo là đất cơ sở tôn giáo, trụ sở tổ chức tôn giáo (Điều 213).","b":"Khoản 1 Điều 212, điểm g khoản 3 Điều 9 Luật Đất đai 2024"},{"id":"2.17","g":2,"lv":"NB","q":"Nhà nước trao quyền sử dụng đất xây dựng cơ sở tôn giáo, trụ sở của tổ chức tôn giáo theo hình thức nào?","o":["Giao đất có thu tiền sử dụng đất","Cho thuê đất trả tiền thuê một lần","Giao đất không thu tiền sử dụng đất","Cho thuê đất trả tiền thuê đất hằng năm"],"a":2,"e":"Khoản 2 Điều 213 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất cho tổ chức tôn giáo, tổ chức tôn giáo trực thuộc sử dụng đất xây dựng cơ sở tôn giáo, trụ sở của tổ chức tôn giáo, công trình sự nghiệp của tổ chức tôn giáo. Phần đất dùng cho mục đích sản xuất kinh doanh thì Nhà nước cho thuê (khoản 3).","b":"Khoản 2 Điều 213 Luật Đất đai 2024"},{"id":"2.18","g":2,"lv":"TH","q":"Người đang sử dụng đất nằm trong quy hoạch sử dụng đất quốc phòng nhưng chưa có nhu cầu sử dụng vào mục đích quốc phòng được xử lý thế nào?","o":["Được tiếp tục sử dụng đến khi có quyết định thu hồi đất nhưng không được làm biến dạng địa hình tự nhiên","Phải bàn giao ngay đất cho đơn vị quân đội","Phải chuyển sang thuê đất của Bộ Quốc phòng","Được chuyển nhượng cho đơn vị quân đội theo giá thỏa thuận"],"a":0,"e":"Khoản 3 Điều 200 Luật Đất đai 2024: người đang sử dụng đất nằm trong quy hoạch sử dụng đất quốc phòng, an ninh nhưng chưa có nhu cầu sử dụng vào mục đích quốc phòng, an ninh thì được tiếp tục sử dụng đến khi có quyết định thu hồi đất, nhưng không được làm biến dạng địa hình tự nhiên. Không phải bàn giao ngay hay chuyển sang thuê.","b":"Khoản 3 Điều 200 Luật Đất đai 2024"},{"id":"2.19","g":2,"lv":"TH","q":"Đối với diện tích đất xây dựng kết cấu hạ tầng sử dụng chung trong khu công nghiệp theo quy hoạch đã được phê duyệt, chủ đầu tư hạ tầng có nghĩa vụ tài chính gì?","o":["Không phải nộp tiền thuê đất","Nộp tiền thuê đất bằng 50% mức thông thường","Nộp tiền thuê đất hằng năm như phần đất kinh doanh","Nộp tiền sử dụng đất một lần"],"a":0,"e":"Khoản 3 Điều 202 Luật Đất đai 2024: nhà đầu tư xây dựng, kinh doanh kết cấu hạ tầng khu công nghiệp không phải nộp tiền thuê đất đối với diện tích đất xây dựng kết cấu hạ tầng sử dụng chung trong khu công nghiệp theo quy hoạch đã được phê duyệt.","b":"Khoản 3 Điều 202 Luật Đất đai 2024"},{"id":"2.20","g":2,"lv":"TH","q":"Đất thương mại, dịch vụ của cá nhân là đất sử dụng ổn định lâu dài trong trường hợp nào?","o":["Được Nhà nước cho thuê trả tiền một lần","Đang sử dụng ổn định, được Nhà nước công nhận mà không phải là đất được Nhà nước giao có thời hạn, cho thuê","Nhận chuyển nhượng từ tổ chức kinh tế thuê đất","Được Nhà nước giao có thời hạn để thực hiện dự án"],"a":1,"e":"Khoản 4 Điều 171 Luật Đất đai 2024: đất thương mại, dịch vụ, đất cơ sở sản xuất phi nông nghiệp của cá nhân là đất sử dụng ổn định lâu dài khi đang sử dụng ổn định được Nhà nước công nhận mà không phải là đất được Nhà nước giao có thời hạn, cho thuê. Đất được giao có thời hạn, cho thuê hoặc nhận chuyển nhượng từ tổ chức thuê đất là đất có thời hạn.","b":"Khoản 4 Điều 171 Luật Đất đai 2024"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Thời hạn sử dụng 1,5 ha đất được giao của ông Tâm là bao lâu và khi hết hạn có phải gia hạn không?","o":["30 năm; Nhà nước thu hồi khi hết hạn","Ổn định lâu dài; không có vấn đề gia hạn","50 năm; hết hạn được tiếp tục sử dụng mà không phải làm thủ tục gia hạn","20 năm; phải làm thủ tục gia hạn"],"a":2,"e":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024: đất nông nghiệp giao trong hạn mức cho cá nhân trực tiếp sản xuất nông nghiệp có thời hạn 50 năm; khi hết thời hạn được tiếp tục sử dụng mà không phải làm thủ tục gia hạn. Diện tích 1,5 ha của ông Tâm nằm trong hạn mức nên thuộc trường hợp này.","b":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Thời hạn cho thuê đất nông nghiệp đối với cá nhân được quy định thế nào?","o":["Không quá 50 năm; hết hạn nếu có nhu cầu được xem xét cho thuê tiếp","Theo thỏa thuận giữa cá nhân và Ủy ban nhân dân cấp xã","Không quá 20 năm và không được thuê tiếp","Không quá 70 năm"],"a":0,"e":"Điểm b khoản 1 Điều 172 Luật Đất đai 2024: thời hạn cho cá nhân thuê đất nông nghiệp không quá 50 năm; khi hết thời hạn thuê nếu có nhu cầu thì được Nhà nước xem xét cho thuê tiếp. Hợp đồng thuê 30 năm của ông Tâm nằm trong giới hạn này.","b":"Điểm b khoản 1 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Muốn tiếp tục thuê 3 ha đất sau năm 2030, ông Tâm phải nộp hồ sơ gia hạn chậm nhất khi nào?","o":["06 tháng trước khi hết thời hạn thuê đất","Ngay trong năm 2026","Không cần nộp hồ sơ vì được tự động gia hạn","Trong 24 tháng sau khi hết thời hạn thuê đất"],"a":0,"e":"Khoản 3 Điều 172 Luật Đất đai 2024: đất thuê không thuộc trường hợp được tự động tiếp tục sử dụng; ông Tâm phải nộp hồ sơ đề nghị gia hạn chậm nhất 06 tháng trước khi hết thời hạn thuê (năm 2030).","b":"Khoản 3 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Nếu không được gia hạn, nhà kho trên đất thuê của ông Tâm được xử lý thế nào?","o":["Ông Tâm được tiếp tục sử dụng đất xây nhà kho không thời hạn","Nhà kho đương nhiên thuộc sở hữu Nhà nước, không phải thu hồi đất","Nhà nước bồi thường giá trị nhà kho theo giá thị trường","Ông Tâm phải tự xử lý tài sản; quá 24 tháng không xử lý thì Nhà nước thu hồi đất, không bồi thường về đất và tài sản"],"a":3,"e":"Khoản 4 Điều 172 Luật Đất đai 2024: trường hợp không được gia hạn, người sử dụng đất phải tự xử lý tài sản gắn liền với đất trong thời hạn 24 tháng; quá thời hạn này mà không xử lý thì Nhà nước thu hồi đất mà không bồi thường về đất và tài sản gắn liền với đất.","b":"Khoản 4 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.5","g":2,"lv":"VD","q":"Thời hạn sử dụng 0,5 ha đất ông Hùng nhận chuyển nhượng được xác định thế nào?","o":["Thời gian còn lại của thời hạn sử dụng đất; hết hạn được tiếp tục sử dụng mà không phải gia hạn vì ông Hùng trực tiếp sản xuất nông nghiệp trong hạn mức","Ổn định lâu dài vì đã nhận chuyển nhượng hợp pháp","Thời hạn do ông Tâm và ông Hùng thỏa thuận","Thời hạn mới 50 năm kể từ năm 2026"],"a":0,"e":"Khoản 1 Điều 174 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất có thời hạn được sử dụng trong thời gian còn lại. Ông Hùng là cá nhân trực tiếp sản xuất nông nghiệp, nhận đất trong hạn mức nên khi hết hạn được tiếp tục sử dụng mà không phải gia hạn (điểm a khoản 1 Điều 172).","b":"Khoản 1 Điều 174 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Hạn mức giao đất trồng cây hằng năm áp dụng cho chị Ngân là bao nhiêu?","o":["Không quá 02 ha","Không quá 05 ha","Không quá 30 ha","Không quá 03 ha"],"a":0,"e":"Đồng bằng sông Hồng thuộc nhóm 'tỉnh, thành phố khác' nên hạn mức giao đất trồng cây hằng năm cho cá nhân là không quá 02 ha (điểm b khoản 1 Điều 176 Luật Đất đai 2024); mức 03 ha chỉ áp dụng ở Đông Nam Bộ và đồng bằng sông Cửu Long.","b":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Chị Ngân được giao thêm tối đa bao nhiêu đất trồng cây hằng năm?","o":["0,2 ha","Không được giao thêm","3,2 ha","1 ha"],"a":0,"e":"Chị Ngân đã được giao 1,8 ha đất trồng cây hằng năm, hạn mức loại đất này là 02 ha nên chỉ được giao thêm tối đa 0,2 ha. Tổng diện tích các loại đất (1,8 + 1 + 0,2 = 3 ha) vẫn trong tổng hạn mức 05 ha khi được giao nhiều loại đất (khoản 4 Điều 176).","b":"Điểm b khoản 1, khoản 4 Điều 176 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"10 ha đất trồng lúa chị Ngân nhận chuyển nhượng có tính vào hạn mức giao đất nông nghiệp không?","o":["Tính phần vượt 02 ha vào hạn mức giao đất","Không tính vào hạn mức giao đất nông nghiệp","Tính toàn bộ vào hạn mức giao đất","Chỉ tính khi chị Ngân xin giao thêm đất"],"a":1,"e":"Khoản 7 Điều 176 Luật Đất đai 2024: diện tích đất nông nghiệp có được do nhận chuyển nhượng không tính vào hạn mức giao đất nông nghiệp. 10 ha đất trồng lúa chị Ngân nhận chuyển nhượng chỉ chịu hạn mức nhận chuyển quyền tại Điều 177.","b":"Khoản 7 Điều 176 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Việc nhận chuyển nhượng 10 ha đất trồng lúa phải tuân thủ hạn mức nào?","o":["Không phải tuân thủ hạn mức nào","Hạn mức giao đất nông nghiệp 02 ha","Hạn mức giao đất ở tại nông thôn","Hạn mức nhận chuyển quyền: không quá 15 lần hạn mức giao đất, mức cụ thể do Ủy ban nhân dân cấp tỉnh quy định"],"a":3,"e":"Khoản 1, 3 Điều 177 Luật Đất đai 2024: hạn mức nhận chuyển quyền sử dụng đất nông nghiệp của cá nhân không quá 15 lần hạn mức giao đất đối với mỗi loại đất; UBND cấp tỉnh quy định mức cụ thể. Với hạn mức giao 02 ha, mức trần là 30 ha nên 10 ha nằm trong giới hạn.","b":"Khoản 1, khoản 3 Điều 177 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.5","g":2,"lv":"VD","q":"Chị Ngân có phải thành lập tổ chức kinh tế để nhận chuyển nhượng đất trồng lúa vượt hạn mức không?","o":["Có, nếu diện tích nhận chuyển nhượng trên 05 ha","Có, mọi trường hợp nhận chuyển nhượng đất trồng lúa vượt hạn mức đều phải thành lập","Chỉ phải thành lập hợp tác xã, không phải doanh nghiệp","Không, vì nghĩa vụ này chỉ áp dụng với cá nhân không trực tiếp sản xuất nông nghiệp"],"a":3,"e":"Khoản 7 Điều 45 Luật Đất đai 2024: cá nhân không trực tiếp sản xuất nông nghiệp khi nhận chuyển nhượng, tặng cho đất trồng lúa quá hạn mức thì phải thành lập tổ chức kinh tế và có phương án sử dụng đất trồng lúa. Chị Ngân trực tiếp sản xuất nông nghiệp nên không phải thành lập tổ chức kinh tế.","b":"Khoản 7 Điều 45 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Thửa đất 3.000 m² cấy hai vụ mỗi năm của ông Hiếu là loại đất gì?","o":["Đất trồng cây lâu năm","Đất trồng lúa còn lại","Đất chuyên trồng lúa","Đất nông nghiệp khác"],"a":2,"e":"Thửa đất cấy hai vụ mỗi năm là đất trồng từ hai vụ lúa trở lên, thuộc đất chuyên trồng lúa (khoản 1 Điều 182 Luật Đất đai 2024).","b":"Khoản 1 Điều 182 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Dự định (1) và (2) của ông Hiếu được đánh giá như thế nào?","o":["Phải xin phép chuyển mục đích sang đất phi nông nghiệp cho cả hai dự định","Người sử dụng đất được tự do thực hiện cả hai dự định","Dự định (2) được thực hiện; dự định (1) không được","Dự định (1) được thực hiện; dự định (2) không được thực hiện theo hình thức chuyển đổi cơ cấu vì làm mất điều kiện trồng lúa trở lại"],"a":3,"e":"Khoản 5 Điều 182 Luật Đất đai 2024 cho phép chuyển đổi cơ cấu cây trồng, vật nuôi trên đất trồng lúa nếu không làm mất điều kiện trồng lúa trở lại. Trồng dưa hấu luân canh (1) đáp ứng; đào ao sâu 3 m làm mất tầng canh tác (2) không đáp ứng nên không thể thực hiện theo hình thức chuyển đổi cơ cấu (nếu muốn phải chuyển mục đích và được cho phép).","b":"Khoản 5 Điều 182 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Ông Hiếu có được xây nhà kho 30 m² chứa thóc và máy cày trên đất trồng lúa không?","o":["Được, vì người sử dụng đất trồng lúa được dùng một phần diện tích xây công trình phục vụ trực tiếp sản xuất nông nghiệp","Phải chuyển 30 m² sang đất ở rồi mới được xây","Chỉ công trình tạm dưới 10 m² mới được phép","Không, mọi công trình trên đất trồng lúa đều bị cấm"],"a":0,"e":"Luật Đất đai 2024 (khoản 5 Điều 182, khoản 3 Điều 178) cho phép người sử dụng đất trồng lúa được sử dụng một phần diện tích để xây dựng công trình phục vụ trực tiếp sản xuất nông nghiệp theo quy định của Chính phủ. Nhà kho chứa thóc, máy cày phục vụ trực tiếp sản xuất nên được phép, không phải chuyển sang đất ở.","b":"Khoản 5 Điều 182, khoản 3 Điều 178 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Để xây nhà ở cho con trai trên 200 m² đất trồng lúa, ông Hiếu phải đáp ứng yêu cầu nào?","o":["Chỉ cần nộp tiền sử dụng đất, không cần cho phép","Chỉ cần đăng ký biến động sau khi xây","Chỉ cần sự đồng ý của các hộ liền kề","Được cơ quan nhà nước có thẩm quyền cho phép chuyển mục đích sang đất ở, phù hợp quy hoạch, kế hoạch sử dụng đất"],"a":3,"e":"Xây nhà ở trên đất trồng lúa là chuyển từ đất nông nghiệp sang đất phi nông nghiệp – phải được cơ quan có thẩm quyền cho phép (điểm b khoản 1 Điều 121), căn cứ quy hoạch, kế hoạch sử dụng đất (Điều 116) và tuân thủ quy định hạn chế chuyển đất trồng lúa (khoản 3 Điều 182). Không thể xây trước rồi đăng ký.","b":"Khoản 3 Điều 182, điểm b khoản 1 Điều 121, Điều 116 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.04.1","g":2,"lv":"VD","q":"Việc Ủy ban nhân dân xã Tân Lập dùng 1 ha đất công ích xây nhà văn hóa xã có đúng pháp luật không?","o":["Đúng, quỹ đất công ích được dùng xây dựng công trình văn hóa công cộng do Ủy ban nhân dân cấp xã đầu tư, quản lý","Sai, quỹ đất công ích chỉ được cho thuê để sản xuất nông nghiệp","Sai, phải được Thủ tướng Chính phủ cho phép","Đúng, nhưng chỉ khi đã đấu giá quyền sử dụng đất"],"a":0,"e":"Điểm a khoản 2 Điều 179 Luật Đất đai 2024: quỹ đất nông nghiệp công ích được sử dụng để xây dựng các công trình công cộng của xã như công trình văn hóa, thể dục thể thao, vui chơi giải trí… do UBND cấp xã đầu tư, quản lý. Việc xây nhà văn hóa xã là đúng pháp luật.","b":"Điểm a khoản 2 Điều 179 Luật Đất đai 2024","cid":"TH2.04"},{"id":"TH2.04.2","g":2,"lv":"VD","q":"Việc cho ông Kiên thuê 5 ha đất công ích vi phạm pháp luật ở điểm nào?","o":["Đất công ích không được dùng để nuôi trồng thủy sản","Ông Kiên không phải là đối tượng được thuê vì thường trú tại xã","Ủy ban nhân dân xã không có thẩm quyền quản lý quỹ đất công ích","Cho thuê theo hình thức chỉ định thay vì đấu giá và thời hạn 15 năm vượt mức tối đa 10 năm"],"a":3,"e":"Khoản 3 Điều 179 Luật Đất đai 2024: diện tích đất công ích chưa sử dụng phải cho thuê theo hình thức đấu giá, thời hạn mỗi lần thuê không quá 10 năm. Việc cho ông Kiên thuê theo hình thức chỉ định và thời hạn 15 năm vi phạm cả hình thức và thời hạn; ông Kiên thường trú tại xã vẫn có thể là đối tượng được thuê.","b":"Khoản 3 Điều 179 Luật Đất đai 2024","cid":"TH2.04"},{"id":"TH2.04.3","g":2,"lv":"VD","q":"Ai chịu trách nhiệm trước Nhà nước về việc sử dụng quỹ đất công ích của xã Tân Lập?","o":["Chủ tịch Hội đồng nhân dân xã Tân Lập","Chủ tịch Ủy ban nhân dân xã Tân Lập","Giám đốc Sở Nông nghiệp và Môi trường","Ông Kiên là người thuê đất"],"a":1,"e":"Khoản 2 Điều 6 Luật Đất đai 2024: Chủ tịch UBND cấp xã chịu trách nhiệm trước Nhà nước đối với việc sử dụng đất nông nghiệp vào mục đích công ích; khoản 4 Điều 179 giao UBND cấp xã quản lý, sử dụng quỹ đất này.","b":"Khoản 2 Điều 6, khoản 4 Điều 179 Luật Đất đai 2024","cid":"TH2.04"},{"id":"TH2.04.4","g":2,"lv":"VD","q":"Nếu xây nhà văn hóa phải thu hồi đất của một số hộ lân cận, quỹ đất công ích còn được dùng vào việc gì?","o":["Bồi thường cho người có đất bị thu hồi để xây dựng công trình công cộng đó","Cho doanh nghiệp thuê dài hạn 50 năm","Bán đấu giá để lấy tiền xây nhà văn hóa","Giao cho các hộ dân làm đất ở không thu tiền"],"a":0,"e":"Điểm b khoản 2 Điều 179 Luật Đất đai 2024: quỹ đất công ích được sử dụng để bồi thường cho người có đất được sử dụng để xây dựng các công trình công cộng của xã. Không được bán đấu giá, giao làm đất ở không thu tiền hay cho thuê dài hạn 50 năm.","b":"Điểm b khoản 2 Điều 179 Luật Đất đai 2024","cid":"TH2.04"},{"id":"TH2.05.1","g":2,"lv":"VD","q":"Tranh chấp 10 m² ở góc thửa đất có làm ông Phú không được tách thửa không?","o":["Không, vì tranh chấp dưới 20 m² được bỏ qua","Có, cho đến khi Tòa án giải quyết xong tranh chấp","Không, vì phạm vi, ranh giới phần tranh chấp đã xác định rõ nên phần còn lại vẫn được tách thửa","Có, đất đang có tranh chấp thì toàn bộ thửa không được tách"],"a":2,"e":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024: thửa đất không có tranh chấp thì mới được tách; trường hợp có tranh chấp một phần mà xác định được phạm vi diện tích, ranh giới đang tranh chấp thì phần diện tích, ranh giới còn lại không tranh chấp được phép tách thửa.","b":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024","cid":"TH2.05"},{"id":"TH2.05.2","g":2,"lv":"VD","q":"Ông Phú có được tách riêng thửa đất 40 m² để tặng cho con gái không?","o":["Không được tách thành thửa riêng vì nhỏ hơn diện tích tối thiểu 50 m², trừ khi đồng thời hợp thửa với thửa đất liền kề","Không được trong mọi trường hợp","Được, nếu con gái đã có nhà ở nơi khác","Được, vì tặng cho trong gia đình không áp dụng diện tích tối thiểu"],"a":0,"e":"Điểm a khoản 2 Điều 220 Luật Đất đai 2024: thửa đất được hình thành từ việc tách thửa phải bảo đảm diện tích tối thiểu với loại đất đang sử dụng theo quy định của UBND tỉnh; trường hợp tách thửa có diện tích nhỏ hơn mức tối thiểu thì phải đồng thời hợp thửa với thửa đất liền kề. Thửa 40 m² nhỏ hơn 50 m² nên không được tách riêng.","b":"Điểm a khoản 2 Điều 220 Luật Đất đai 2024","cid":"TH2.05"},{"id":"TH2.05.3","g":2,"lv":"NB","q":"Cơ quan nào quy định cụ thể diện tích tối thiểu được tách thửa đối với đất ở?","o":["Ủy ban nhân dân cấp xã","Chính phủ","Ủy ban nhân dân cấp tỉnh","Bộ Nông nghiệp và Môi trường"],"a":2,"e":"Khoản 4 Điều 220 Luật Đất đai 2024: UBND cấp tỉnh căn cứ các nguyên tắc, điều kiện tại Điều này và tình hình thực tế tại địa phương để quy định cụ thể điều kiện, diện tích tối thiểu của việc tách thửa, hợp thửa đối với từng loại đất.","b":"Khoản 4 Điều 220 Luật Đất đai 2024","cid":"TH2.05"},{"id":"TH2.05.4","g":2,"lv":"VD","q":"Phần đất ở 15 m² dành làm lối đi khi tách thửa có phải chuyển mục đích sử dụng không?","o":["Phải chuyển sang đất giao thông","Phải chuyển sang đất thương mại, dịch vụ","Phải bàn giao cho Nhà nước làm đất công cộng","Không phải chuyển mục đích sử dụng đất"],"a":3,"e":"Điểm d khoản 1 Điều 220 Luật Đất đai 2024: trường hợp tách thửa phải dành một phần diện tích làm lối đi thì không phải chuyển mục đích sử dụng đất đối với phần diện tích đất dành làm lối đi đó. Phần 15 m² vẫn là đất ở của ông Phú.","b":"Điểm d khoản 1 Điều 220 Luật Đất đai 2024","cid":"TH2.05"},{"id":"TH2.06.1","g":2,"lv":"VD","q":"Bà Thủy có được tiếp tục sử dụng 1 ha đất nằm trong quy hoạch quốc phòng không?","o":["Phải bàn giao đất ngay khi có quy hoạch","Được tiếp tục sử dụng đến khi có quyết định thu hồi đất","Chỉ được sử dụng thêm 12 tháng kể từ khi có quy hoạch","Phải chuyển sang thuê đất của đơn vị quân đội"],"a":1,"e":"Khoản 3 Điều 200 Luật Đất đai 2024: người đang sử dụng đất nằm trong quy hoạch đất quốc phòng nhưng chưa có nhu cầu sử dụng vào mục đích quốc phòng thì được tiếp tục sử dụng đến khi có quyết định thu hồi đất.","b":"Khoản 3 Điều 200 Luật Đất đai 2024","cid":"TH2.06"},{"id":"TH2.06.2","g":2,"lv":"VD","q":"Dự định đào đất bán cho các công trình san lấp của bà Thủy có được phép không?","o":["Được, nếu nộp thuế tài nguyên","Được, nếu Ủy ban nhân dân xã đồng ý","Được, vì bà Thủy đã có Giấy chứng nhận","Không, người đang sử dụng đất trong quy hoạch quốc phòng không được làm biến dạng địa hình tự nhiên"],"a":3,"e":"Khoản 3 Điều 200 Luật Đất đai 2024 yêu cầu người sử dụng đất trong quy hoạch quốc phòng không được làm biến dạng địa hình tự nhiên. Đào đất bán san lấp còn làm biến dạng địa hình, có thể là hủy hoại đất (khoản 27 Điều 3) – hành vi bị nghiêm cấm (Điều 11).","b":"Khoản 3 Điều 200; khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH2.06"},{"id":"TH2.06.3","g":2,"lv":"VD","q":"Để sử dụng đất quốc phòng kết hợp hoạt động lao động sản xuất, Đơn vị G phải đáp ứng điều kiện gì?","o":["Lập phương án sử dụng đất trình Bộ trưởng Bộ Quốc phòng phê duyệt","Được Hội đồng nhân dân tỉnh thông qua","Thành lập doanh nghiệp tư nhân để quản lý đất","Được Ủy ban nhân dân tỉnh cho thuê lại đất"],"a":0,"e":"Khoản 2 Điều 201 Luật Đất đai 2024: đơn vị vũ trang nhân dân sử dụng đất quốc phòng kết hợp với hoạt động lao động sản xuất, xây dựng kinh tế phải lập phương án sử dụng đất kết hợp trình Bộ trưởng Bộ Quốc phòng phê duyệt.","b":"Khoản 2 Điều 201 Luật Đất đai 2024","cid":"TH2.06"},{"id":"TH2.06.4","g":2,"lv":"VD","q":"Đơn vị G có được cho doanh nghiệp tư nhân thuê lại và thế chấp quyền sử dụng đất không?","o":["Được thế chấp nhưng không được cho thuê","Không được cho thuê, không được thế chấp quyền sử dụng đất","Được cả hai nếu Bộ trưởng Bộ Quốc phòng đồng ý","Được cho thuê nhưng không được thế chấp"],"a":1,"e":"Điểm d, đ khoản 3 Điều 201 Luật Đất đai 2024: đơn vị sử dụng đất quốc phòng kết hợp sản xuất không được cho thuê quyền sử dụng đất và không được thế chấp, góp vốn bằng quyền sử dụng đất. Sự đồng ý của Bộ trưởng không làm phát sinh các quyền này.","b":"Điểm d, điểm đ khoản 3 Điều 201 Luật Đất đai 2024","cid":"TH2.06"},{"id":"TH2.06.5","g":2,"lv":"VD","q":"Khi chấm dứt phương án kết hợp để phục vụ nhiệm vụ quốc phòng, Đơn vị G có được bồi thường không?","o":["Được hỗ trợ bằng đất ở tái định cư","Không được bồi thường về đất và tài sản gắn liền với đất","Chỉ được bồi thường tài sản theo giá thị trường","Được bồi thường về đất theo bảng giá đất"],"a":1,"e":"Điểm c khoản 3 Điều 201 Luật Đất đai 2024: khi Nhà nước chấm dứt việc sử dụng đất kết hợp để phục vụ nhiệm vụ quốc phòng, an ninh thì đơn vị không được bồi thường về đất và tài sản gắn liền với đất, vì đất vẫn là đất quốc phòng.","b":"Điểm c khoản 3 Điều 201 Luật Đất đai 2024","cid":"TH2.06"},{"id":"TH2.07.1","g":2,"lv":"VD","q":"Hình thức và thời hạn sử dụng đất khuôn viên chùa An Lạc là gì?","o":["Nhà nước cho thuê đất trả tiền hằng năm; 50 năm","Nhà nước giao đất có thu tiền sử dụng đất; 70 năm","Nhà nước giao đất không thu tiền sử dụng đất; sử dụng ổn định lâu dài","Nhà nước cho thuê trả tiền một lần; ổn định lâu dài"],"a":2,"e":"Khoản 2 Điều 213 Luật Đất đai 2024: Nhà nước giao đất không thu tiền sử dụng đất cho tổ chức tôn giáo sử dụng đất xây dựng cơ sở tôn giáo; khoản 8 Điều 171: đất tôn giáo là đất sử dụng ổn định lâu dài (trừ trường hợp luật quy định khác).","b":"Khoản 2 Điều 213, khoản 8 Điều 171 Luật Đất đai 2024","cid":"TH2.07"},{"id":"TH2.07.2","g":2,"lv":"VD","q":"Đối với 2 ha ngoài khuôn viên để làm trang trại trồng rau, Nhà nước áp dụng hình thức nào?","o":["Cho thuê đất thu tiền thuê đất hằng năm","Công nhận quyền sử dụng đất","Giao đất có thu tiền sử dụng đất","Giao đất không thu tiền sử dụng đất"],"a":0,"e":"Khoản 3 Điều 213 Luật Đất đai 2024: đối với đất mà tổ chức tôn giáo sử dụng vào mục đích sản xuất nông nghiệp, lâm nghiệp, sản xuất kinh doanh phi nông nghiệp… thì Nhà nước cho thuê đất thu tiền thuê đất hằng năm. Không được giao không thu tiền cho phần đất này.","b":"Khoản 3 Điều 213 Luật Đất đai 2024","cid":"TH2.07"},{"id":"TH2.07.3","g":2,"lv":"VD","q":"Dự định mở dịch vụ lưu trú có thu phí trong khuôn viên chùa phải bảo đảm yêu cầu nào?","o":["Không làm thay đổi loại đất, không làm mất điều kiện trở lại mục đích chính và thực hiện đầy đủ nghĩa vụ tài chính","Phải được Thủ tướng Chính phủ cho phép","Phải chuyển phần đất đó sang đất thương mại, dịch vụ","Bị cấm tuyệt đối trên đất tôn giáo"],"a":0,"e":"Khoản 5 Điều 213 và khoản 2 Điều 218 Luật Đất đai 2024: đất tôn giáo được sử dụng kết hợp với mục đích thương mại, dịch vụ nếu không làm thay đổi loại đất, không làm mất điều kiện để sử dụng vào mục đích chính, bảo đảm an toàn và người sử dụng đất thực hiện đầy đủ nghĩa vụ tài chính đối với phần sử dụng kết hợp.","b":"Khoản 5 Điều 213, khoản 2 Điều 218 Luật Đất đai 2024","cid":"TH2.07"},{"id":"TH2.07.4","g":2,"lv":"VD","q":"Đất có đình làng Hạ là loại đất gì và có thời hạn sử dụng ra sao?","o":["Đất ở; ổn định lâu dài","Đất công cộng; theo thời hạn quy hoạch","Đất tín ngưỡng; sử dụng ổn định lâu dài","Đất tôn giáo; 50 năm"],"a":2,"e":"Khoản 1 Điều 212 Luật Đất đai 2024: đất có đình, đền, miếu, am, nhà thờ họ là đất tín ngưỡng; khoản 7 Điều 171: đất tín ngưỡng là đất sử dụng ổn định lâu dài. Cộng đồng dân cư là chủ thể sử dụng đất tín ngưỡng.","b":"Khoản 1 Điều 212, khoản 7 Điều 171 Luật Đất đai
