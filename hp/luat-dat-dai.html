 luật về đất đai","Không có hậu quả pháp lý","Các hộ dân được công nhận quyền sử dụng đất"],"a":1,"e":"Khoản 5 Điều 81 Luật Đất đai 2024: đất được Nhà nước giao để quản lý mà để bị lấn đất, chiếm đất thì Nhà nước thu hồi đất do vi phạm pháp luật về đất đai. Các hộ lấn chiếm không được công nhận quyền.","b":"Khoản 5 Điều 81 Luật Đất đai 2024","cid":"TH6.10"},{"id":"TH6.10.2","g":6,"lv":"VD","q":"Ai chịu trách nhiệm trước Nhà nước đối với hành lang bảo vệ kênh được giao cho Công ty Thủy lợi X quản lý?","o":["Các hộ dân đang dựng lều quán","Người đại diện của Công ty Thủy lợi X","Ủy ban Mặt trận Tổ quốc xã","Chủ tịch Hội đồng nhân dân xã"],"a":1,"e":"Điểm a khoản 1 Điều 7 Luật Đất đai 2024: người đứng đầu (đại diện) của tổ chức được Nhà nước giao quản lý công trình công cộng, hành lang bảo vệ… chịu trách nhiệm trước Nhà nước đối với việc quản lý đất được giao.","b":"Điểm a khoản 1 Điều 7 Luật Đất đai 2024","cid":"TH6.10"},{"id":"TH6.10.3","g":6,"lv":"VD","q":"Hành vi dựng lều quán trên hành lang bảo vệ kênh của các hộ dân là gì?","o":["Chiếm đất, là hành vi bị nghiêm cấm","Sử dụng đất hợp pháp vì đã sử dụng lâu năm","Lấn đất của người sử dụng đất liền kề","Sử dụng đất kết hợp đa mục đích hợp pháp"],"a":0,"e":"Hành lang bảo vệ kênh là đất Nhà nước giao cho tổ chức quản lý; các hộ dân dựng lều quán khi chưa được cho phép là chiếm đất (khoản 9 Điều 3), hành vi bị nghiêm cấm. Thời gian sử dụng lâu năm không làm phát sinh quyền.","b":"Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH6.10"},{"id":"TH6.10.4","g":6,"lv":"VD","q":"Hành lang bảo vệ kênh giao cho Công ty Thủy lợi X quản lý có được cấp Giấy chứng nhận không?","o":["Có, cấp cho Ủy ban nhân dân xã","Có, cấp cho các hộ dân đang sử dụng","Có, cấp cho Công ty Thủy lợi X","Không, vì là đất được giao để quản lý"],"a":3,"e":"Điều 151 Luật Đất đai 2024: không cấp Giấy chứng nhận đối với đất được giao để quản lý (trừ trường hợp được giao quản lý đồng thời với giao đất có thu tiền…). Hành lang bảo vệ kênh giao cho công ty quản lý không được cấp Giấy chứng nhận cho công ty, UBND xã hay hộ lấn chiếm.","b":"Điều 151 Luật Đất đai 2024","cid":"TH6.10"}],"th":[{"name":"Chương 1. Những vấn đề chung về Luật Đất đai","items":[{"cid":"TH1.01","title":"Xác định người sử dụng đất","text":"Tại xã Hòa Lạc, tỉnh H có các chủ thể sau đang có nhu cầu sử dụng đất: (1) anh Minh, công dân Việt Nam định cư tại Đức; (2) bà Sophie, người gốc Việt Nam, quốc tịch Pháp, được phép nhập cảnh vào Việt Nam; (3) Công ty TNHH Sao Mai là tổ chức kinh tế có vốn đầu tư nước ngoài; (4) Hội Liên hiệp Phụ nữ xã Hòa Lạc; (5) cộng đồng thôn Đông gồm các hộ cùng phong tục, tập quán. Năm 2026, bà Sophie có hai dự định: mua một căn nhà gắn liền với quyền sử dụng đất ở trong dự án phát triển nhà ở tại tỉnh H; nhận chuyển nhượng 2.000 m² đất trồng cây lâu năm của một cá nhân để trồng cam. Cộng đồng thôn Đông được Nhà nước giao đất nông nghiệp để bảo tồn bản sắc dân tộc và muốn thế chấp quyền sử dụng đất này để vay vốn.","ask":[],"guide":[],"basis":"Khoản 6 Điều 4 Luật Đất đai 2024; Điểm a khoản 1 Điều 4 Luật Đất đai 2024; Điểm h khoản 1 Điều 28, khoản 1 Điều 44 Luật Đất đai 2024; Điểm c khoản 1 Điều 28 Luật Đất đai 2024; Khoản 2 Điều 39 Luật Đất đai 2024","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4","TH1.01.5"]},{"cid":"TH1.02","title":"Hành vi bị nghiêm cấm trong lĩnh vực đất đai","text":"Ông Bình có Giấy chứng nhận đối với thửa đất ở 200 m² tại xã An Phú, tỉnh K. Tháng 3/2026, ông Bình dời cọc mốc, xây tường mở rộng thêm 20 m² sang thửa đất liền kề của bà Cúc. Tháng 5/2026, ông Bình rào 300 m² đất công cộng chưa giao, do Ủy ban nhân dân xã quản lý, để trồng cây ăn quả. Cùng thời gian, Công ty Y đang thuê 1 ha đất trồng lúa của Nhà nước đã đổ chất thải sản xuất xuống ruộng, làm đất ô nhiễm, không thể tiếp tục trồng lúa. Công chức địa chính xã biết các sự việc trên nhưng không báo cáo, không xử lý.","ask":[],"guide":[],"basis":"Khoản 31 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 6 Điều 11 Luật Đất đai 2024; Khoản 2 Điều 7 Luật Đất đai 2024","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4","TH1.02.5"]},{"cid":"TH1.03","title":"Xác định loại đất và quan hệ pháp luật đất đai","text":"Bà Hoa được cấp Giấy chứng nhận năm 2015 đối với thửa đất 500 m², mục đích sử dụng ghi trên Giấy chứng nhận là đất trồng cây lâu năm. Năm 2020, bà Hoa tự xây nhà ở cấp 4 trên 100 m² của thửa đất mà không xin phép. Năm 2026, khi cơ quan nhà nước kiểm tra, bà Hoa cho rằng thửa đất là \"của bà\" nên bà có toàn quyền quyết định mục đích sử dụng.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 10 Luật Đất đai 2024; Điểm b khoản 2 Điều 9 Luật Đất đai 2024; Khoản 1 Điều 5 Luật Đất đai 2024; Điểm b khoản 1 Điều 121 Luật Đất đai 2024; Điều 12, khoản 2 Điều 13 Luật Đất đai 2024; Điều 53 Hiến pháp 2013","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4","TH1.03.5"]},{"cid":"TH1.04","title":"Yêu cầu đòi lại đất đã giao theo chính sách","text":"Năm 1960, trong quá trình thực hiện chính sách đất đai của Nhà nước Việt Nam dân chủ cộng hòa, chính quyền địa phương giao 1.000 m² đất trước đây của cụ Lê cho hộ ông Năm sử dụng. Hộ ông Năm sử dụng ổn định; năm 2005, ông Năm được cấp Giấy chứng nhận. Năm 2026, ông Tư là cháu nội cụ Lê làm đơn đòi lại toàn bộ diện tích đất. Do chưa được giải quyết, ông Tư tự ý rào 200 m² trong thửa đất của ông Năm để trồng rau.","ask":[],"guide":[],"basis":"Khoản 2 Điều 17 Luật Đất đai 2024; Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 5, khoản 8 Điều 26 Luật Đất đai 2024; Khoản 2 Điều 23 Luật Đất đai 2024","mcq":["TH1.04.1","TH1.04.2","TH1.04.3","TH1.04.4"]},{"cid":"TH1.05","title":"Quyền tiếp cận thông tin đất đai","text":"Anh Khoa có ý định mua một thửa đất tại phường Đông Hưng, tỉnh T. Anh đến cơ quan có thẩm quyền đề nghị cung cấp: quy hoạch sử dụng đất đã được phê duyệt tại khu vực, bảng giá đất đã công bố và kết quả giải quyết một vụ tranh chấp liên quan đến thửa đất. Cán bộ tiếp nhận từ chối với lý do anh Khoa \"không phải chủ đất\". Anh Khoa còn muốn tham gia góp ý dự thảo kế hoạch sử dụng đất và đăng ký tham gia đấu giá quyền sử dụng đất do Nhà nước tổ chức.","ask":[],"guide":[],"basis":"Khoản 1 Điều 24, khoản 5 Điều 11 Luật Đất đai 2024; Khoản 2 Điều 18 Luật Đất đai 2024; Khoản 1 Điều 23 Luật Đất đai 2024; Khoản 4 Điều 23 Luật Đất đai 2024","mcq":["TH1.05.1","TH1.05.2","TH1.05.3","TH1.05.4"]},{"cid":"TH1.06","title":"Người chịu trách nhiệm trước Nhà nước về sử dụng đất","text":"Tại xã Phú Lương, tỉnh Q có các thửa đất sau: (1) 5 ha Công ty cổ phần Hoàng Gia được Nhà nước cho thuê, ông Long là Giám đốc kiêm người đại diện theo pháp luật; (2) 3 ha đất nông nghiệp sử dụng vào mục đích công ích của xã; (3) thửa đất 400 m² do ba anh em ông Hải, ông Hà, ông Hưng cùng đứng tên Giấy chứng nhận; (4) 2 ha đất nông nghiệp giao cho cộng đồng thôn Bản Mường, trưởng thôn là ông Lò; (5) bãi đất chưa giao, chưa cho thuê ven sông thuộc địa bàn xã bị một số người lấn chiếm. Ngoài ra, tỉnh Q có một hòn đảo chưa giao cho đơn vị hành chính cấp xã quản lý.","ask":[],"guide":[],"basis":"Khoản 6 Điều 6 Luật Đất đai 2024; Khoản 3 Điều 6 Luật Đất đai 2024; Khoản 2 Điều 7 Luật Đất đai 2024; Khoản 3 Điều 7 Luật Đất đai 2024","mcq":["TH1.06.1","TH1.06.2","TH1.06.3","TH1.06.4"]},{"cid":"TH1.07","title":"Quyền sử dụng đất của hộ gia đình","text":"Năm 2010, hộ ông Sơn gồm ông Sơn, vợ là bà Mai và hai con đã thành niên đang sống chung được Nhà nước giao 2.000 m² đất trồng lúa; Giấy chứng nhận ghi \"Hộ ông Đỗ Văn Sơn\". Năm 2026, ông Sơn tự ký giấy chuyển nhượng 500 m² cho ông Tùng mà không hỏi ý kiến vợ và các con. Giấy chuyển nhượng do hai bên tự viết, không công chứng, chứng thực.","ask":[],"guide":[],"basis":"Khoản 25 Điều 3, điểm a khoản 2 Điều 27 Luật Đất đai 2024; Điểm b khoản 2 Điều 27 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; Khoản 1 Điều 45 Luật Đất đai 2024","mcq":["TH1.07.1","TH1.07.2","TH1.07.3","TH1.07.4"]},{"cid":"TH1.08","title":"Nguyên tắc sử dụng đất và quyền đối với thửa đất liền kề","text":"Bà Lụa có Giấy chứng nhận đối với 1.200 m² đất trồng cây hằng năm. Để tăng năng suất, bà phun thuốc bảo vệ thực vật vượt nhiều lần liều khuyến cáo, làm đất bị ô nhiễm. Thửa đất ở của gia đình ông Quang nằm phía sau, bị vây bọc, không có lối đi ra đường công cộng. Nhiều năm nay, gia đình ông Quang đi qua một lối nhỏ trên đất của bà Lụa theo thỏa thuận miệng. Tháng 8/2026, do mâu thuẫn, bà Lụa xây tường chặn lối đi.","ask":[],"guide":[],"basis":"Khoản 3 Điều 5 Luật Đất đai 2024; Khoản 1 Điều 29 Luật Đất đai 2024; Điều 254 Bộ luật Dân sự 2015; Khoản 2 Điều 29, điểm l khoản 1 Điều 133 Luật Đất đai 2024; Khoản 8 Điều 26 Luật Đất đai 2024","mcq":["TH1.08.1","TH1.08.2","TH1.08.3","TH1.08.4"]},{"cid":"TH1.09","title":"Nhà nước thực hiện quyền đại diện chủ sở hữu về đất đai","text":"Năm 2026, Hội đồng nhân dân tỉnh M thông qua dự thảo quy hoạch sử dụng đất của tỉnh trước khi trình cơ quan có thẩm quyền phê duyệt, đồng thời thông qua việc thu hồi đất để thực hiện một dự án phát triển kinh tế - xã hội vì lợi ích công cộng của địa phương. Sau đó, Ủy ban nhân dân tỉnh M quyết định giao đất cho chủ đầu tư. Một số người dân cho rằng chỉ Quốc hội mới có quyền đại diện chủ sở hữu toàn dân về đất đai nên các hoạt động trên của tỉnh M là trái pháp luật.","ask":[],"guide":[],"basis":"Điều 14 Luật Đất đai 2024; Khoản 2 Điều 14 Luật Đất đai 2024; Khoản 7 Điều 13 Luật Đất đai 2024; Điểm b khoản 2 Điều 19 Luật Đất đai 2024","mcq":["TH1.09.1","TH1.09.2","TH1.09.3","TH1.09.4"]},{"cid":"TH1.10","title":"Quan hệ pháp luật đất đai và phương pháp điều chỉnh","text":"Năm 2025, Ủy ban nhân dân tỉnh P ban hành quyết định cho Công ty TNHH Thành Đạt thuê 2 ha đất để xây dựng cơ sở sản xuất, trả tiền thuê đất hằng năm. Năm 2026, ông Cường chuyển nhượng thửa đất ở 120 m² đã có Giấy chứng nhận cho bà Dung; hai bên tự thỏa thuận giá 3 tỷ đồng và ký hợp đồng tại tổ chức hành nghề công chứng.","ask":[],"guide":[],"basis":"Khoản 8 Điều 13 Luật Đất đai 2024; Khoản 1 Điều 27 Luật Đất đai 2024; Khoản 32 Điều 3 Luật Đất đai 2024; Điểm a khoản 1, khoản 3 Điều 133 Luật Đất đai 2024; Điều 503 Bộ luật Dân sự 2015","mcq":["TH1.10.1","TH1.10.2","TH1.10.3","TH1.10.4","TH1.10.5"]}]},{"name":"Chương 2. Chế độ sử dụng các loại đất","items":[{"cid":"TH2.01","title":"Thời hạn sử dụng đất nông nghiệp","text":"Ông Tâm là cá nhân trực tiếp sản xuất nông nghiệp tại tỉnh N (không thuộc Đông Nam Bộ, đồng bằng sông Cửu Long). Năm 1996, ông được Nhà nước giao 1,5 ha đất trồng cây hằng năm trong hạn mức. Năm 2000, ông được Nhà nước cho thuê thêm 3 ha đất trồng cây hằng năm với thời hạn 30 năm, trả tiền thuê hằng năm; trên đất thuê ông xây nhà kho. Năm 2026, ông Tâm chuyển nhượng 0,5 ha đất được giao cho ông Hùng, cũng là cá nhân trực tiếp sản xuất nông nghiệp.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024; Điểm b khoản 1 Điều 172 Luật Đất đai 2024; Khoản 3 Điều 172 Luật Đất đai 2024; Khoản 4 Điều 172 Luật Đất đai 2024; Khoản 1 Điều 174 Luật Đất đai 2024","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4","TH2.01.5"]},{"cid":"TH2.02","title":"Hạn mức giao đất và hạn mức nhận chuyển quyền","text":"Chị Ngân là cá nhân trực tiếp sản xuất nông nghiệp tại một tỉnh vùng đồng bằng sông Hồng. Chị đã được Nhà nước giao 1,8 ha đất trồng cây hằng năm và 1 ha đất nuôi trồng thủy sản. Năm 2026, chị làm đơn xin giao thêm 1 ha đất trồng cây hằng năm. Cùng năm, chị nhận chuyển nhượng 10 ha đất trồng lúa của nhiều hộ trong xã để sản xuất lúa hàng hóa.","ask":[],"guide":[],"basis":"Điểm b khoản 1 Điều 176 Luật Đất đai 2024; Điểm b khoản 1, khoản 4 Điều 176 Luật Đất đai 2024; Khoản 7 Điều 176 Luật Đất đai 2024; Khoản 1, khoản 3 Điều 177 Luật Đất đai 2024; Khoản 7 Điều 45 Luật Đất đai 2024","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4","TH2.02.5"]},{"cid":"TH2.03","title":"Chế độ sử dụng đất trồng lúa","text":"Ông Hiếu có Giấy chứng nhận đối với 3.000 m² đất trồng lúa, cấy hai vụ mỗi năm. Năm 2026, ông dự định: (1) chuyển 1.000 m² sang trồng dưa hấu luân canh với lúa; (2) đào 500 m² thành ao sâu 3 m nuôi cá, làm mất tầng canh tác; (3) xây một nhà kho 30 m² để chứa thóc và máy cày; (4) san lấp 200 m² để xây nhà ở cho con trai.","ask":[],"guide":[],"basis":"Khoản 1 Điều 182 Luật Đất đai 2024; Khoản 5 Điều 182 Luật Đất đai 2024; Khoản 5 Điều 182, khoản 3 Điều 178 Luật Đất đai 2024; Khoản 3 Điều 182, điểm b khoản 1 Điều 121, Điều 116 Luật Đất đai 2024","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]},{"cid":"TH2.04","title":"Quỹ đất nông nghiệp sử dụng vào mục đích công ích","text":"Ủy ban nhân dân xã Tân Lập đang quản lý 20 ha quỹ đất nông nghiệp sử dụng vào mục đích công ích. Năm 2026, xã sử dụng 1 ha để xây nhà văn hóa xã. Với 5 ha chưa sử dụng, Chủ tịch Ủy ban nhân dân xã ký hợp đồng cho ông Kiên, thường trú tại xã, thuê để nuôi trồng thủy sản trong 15 năm theo hình thức chỉ định, không qua đấu giá.","ask":[],"guide":[],"basis":"Điểm a khoản 2 Điều 179 Luật Đất đai 2024; Khoản 3 Điều 179 Luật Đất đai 2024; Khoản 2 Điều 6, khoản 4 Điều 179 Luật Đất đai 2024; Điểm b khoản 2 Điều 179 Luật Đất đai 2024","mcq":["TH2.04.1","TH2.04.2","TH2.04.3","TH2.04.4"]},{"cid":"TH2.05","title":"Tách thửa đất ở","text":"Ông Phú có Giấy chứng nhận đối với thửa đất ở tại nông thôn 150 m², thời hạn lâu dài. Ông muốn tách 40 m² để tặng cho con gái. Theo quy định của Ủy ban nhân dân tỉnh nơi có đất, diện tích tối thiểu được tách thửa đối với đất ở tại nông thôn là 50 m². Giữa ông Phú và hàng xóm đang có tranh chấp 10 m² ở góc thửa đất; phạm vi, ranh giới phần tranh chấp đã được xác định rõ. Để thửa đất tách ra có đường đi, ông Phú dự định dành một dải đất ở 15 m² làm lối đi.","ask":[],"guide":[],"basis":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024; Điểm a khoản 2 Điều 220 Luật Đất đai 2024; Khoản 4 Điều 220 Luật Đất đai 2024; Điểm d khoản 1 Điều 220 Luật Đất đai 2024","mcq":["TH2.05.1","TH2.05.2","TH2.05.3","TH2.05.4"]},{"cid":"TH2.06","title":"Đất quốc phòng, an ninh","text":"Bà Thủy đang canh tác 1 ha đất trồng cây hằng năm có Giấy chứng nhận. Năm 2025, khu vực này được đưa vào quy hoạch sử dụng đất quốc phòng nhưng chưa có quyết định thu hồi đất. Bà Thủy dự định đào đất bán cho các công trình san lấp. Trong khi đó, Đơn vị quân đội G đang sử dụng đất quốc phòng kết hợp với hoạt động lao động sản xuất theo phương án đã được phê duyệt; đơn vị muốn cho một doanh nghiệp tư nhân thuê lại quyền sử dụng một phần đất và thế chấp quyền sử dụng đất để vay vốn.","ask":[],"guide":[],"basis":"Khoản 3 Điều 200 Luật Đất đai 2024; Khoản 3 Điều 200; khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 2 Điều 201 Luật Đất đai 2024; Điểm d, điểm đ khoản 3 Điều 201 Luật Đất đai 2024; Điểm c khoản 3 Điều 201 Luật Đất đai 2024","mcq":["TH2.06.1","TH2.06.2","TH2.06.3","TH2.06.4","TH2.06.5"]},{"cid":"TH2.07","title":"Đất tôn giáo, đất tín ngưỡng","text":"Chùa An Lạc là cơ sở tôn giáo của một tổ chức tôn giáo, đang sử dụng 3.000 m² đất. Năm 2026, nhà chùa dự định: (1) dùng một dãy nhà trong khuôn viên để mở dịch vụ lưu trú cho khách thập phương có thu phí; (2) đề nghị Nhà nước cho sử dụng thêm 2 ha đất ngoài khuôn viên để làm trang trại trồng rau; (3) thế chấp quyền sử dụng đất khuôn viên chùa để vay vốn. Cùng xã có đình làng Hạ do cộng đồng dân cư quản lý.","ask":[],"guide":[],"basis":"Khoản 2 Điều 213, khoản 8 Điều 171 Luật Đất đai 2024; Khoản 3 Điều 213 Luật Đất đai 2024; Khoản 5 Điều 213, khoản 2 Điều 218 Luật Đất đai 2024; Khoản 1 Điều 212, khoản 7 Điều 171 Luật Đất đai 2024; Khoản 2 Điều 32 Luật Đất đai 2024","mcq":["TH2.07.1","TH2.07.2","TH2.07.3","TH2.07.4","TH2.07.5"]},{"cid":"TH2.08","title":"Đất khu công nghiệp","text":"Công ty Hưng Thịnh được Nhà nước cho thuê 100 ha đất trả tiền thuê hằng năm để đầu tư xây dựng kinh doanh kết cấu hạ tầng khu công nghiệp; thời hạn sử dụng đất còn lại của khu công nghiệp là 40 năm. Năm 2026, Công ty dự định: (1) chuyển 30 ha sang hình thức trả tiền thuê một lần; (2) cho Công ty Khánh An thuê lại 5 ha thuộc phần đất vẫn trả tiền hằng năm, theo hình thức Khánh An trả tiền thuê lại một lần. Dự án của Khánh An có thời hạn hoạt động 60 năm. Trong khu công nghiệp có 8 ha đường nội bộ và hệ thống xử lý nước thải dùng chung theo quy hoạch.","ask":[],"guide":[],"basis":"Khoản 3 Điều 202 Luật Đất đai 2024; Khoản 4 Điều 202 Luật Đất đai 2024","mcq":["TH2.08.1","TH2.08.2","TH2.08.3","TH2.08.4"]},{"cid":"TH2.09","title":"Thời hạn sử dụng đất khi chuyển mục đích và nhận chuyển nhượng","text":"Năm 2000, bà Nga được Nhà nước giao 500 m² đất trồng cây lâu năm trong hạn mức, thời hạn 50 năm. Năm 2026, bà được cơ quan có thẩm quyền cho phép chuyển 200 m² sang đất ở. Cùng năm, bà chuyển nhượng 300 m² đất trồng cây lâu năm còn lại cho ông Lực, là cá nhân trực tiếp sản xuất nông nghiệp. Ông Bảo, em trai bà Nga, đang sử dụng 1.000 m² đất thương mại, dịch vụ được Nhà nước cho thuê 30 năm; năm 2026 ông được phép chuyển 300 m² sang đất ở.","ask":[],"guide":[],"basis":"Điểm d khoản 1 Điều 173, khoản 1 Điều 171 Luật Đất đai 2024; Khoản 1 Điều 174, điểm a khoản 1 Điều 172 Luật Đất đai 2024; Khoản 3 Điều 173 Luật Đất đai 2024; Khoản 2 Điều 121 Luật Đất đai 2024","mcq":["TH2.09.1","TH2.09.2","TH2.09.3","TH2.09.4"]},{"cid":"TH2.10","title":"Đất lâm nghiệp và đất chăn nuôi tập trung","text":"Ông Dũng là cá nhân trực tiếp sản xuất nông nghiệp, thường trú tại xã Sơn Hà, tỉnh L. Ông đã được Nhà nước giao 20 ha đất rừng sản xuất là rừng trồng và nay đề nghị giao thêm 15 ha cùng loại. Công ty Green Farm là tổ chức kinh tế có vốn đầu tư nước ngoài muốn có đất tại tỉnh L để xây dựng trang trại chăn nuôi tập trung. Anh Tú sống ở thành phố, muốn nhận chuyển nhượng một thửa đất ở trong khu vực rừng phòng hộ của xã Sơn Hà để làm nhà nghỉ dưỡng.","ask":[],"guide":[],"basis":"Điểm b khoản 3 Điều 176, điểm a khoản 1 Điều 184 Luật Đất đai 2024; Điểm a khoản 1 Điều 172 Luật Đất đai 2024; Điểm đ khoản 2 Điều 9 Luật Đất đai 2024; Khoản 8 Điều 45 Luật Đất đai 2024","mcq":["TH2.10.1","TH2.10.2","TH2.10.3","TH2.10.4"]}]},{"name":"Chương 3. Quản lý nhà nước về đất đai","items":[{"cid":"TH3.01","title":"Nội dung và bộ máy quản lý nhà nước về đất đai","text":"Trong năm 2026, tại tỉnh P diễn ra các hoạt động: (1) đo đạc, chỉnh lý bản đồ địa chính các xã; (2) thống kê đất đai năm 2025; (3) cấp Giấy chứng nhận lần đầu cho các hộ dân; (4) giải quyết một vụ tranh chấp đất đai; (5) thanh tra việc sử dụng đất của các doanh nghiệp. Ủy ban Mặt trận Tổ quốc Việt Nam tỉnh đề nghị được phản biện xã hội đối với dự thảo quy hoạch sử dụng đất cấp tỉnh. Một sinh viên cho rằng ở cấp xã không có người làm công tác quản lý đất đai chuyên trách.","ask":[],"guide":[],"basis":"Khoản 13 Điều 20 Luật Đất đai 2024; Khoản 12 Điều 20 Luật Đất đai 2024; Khoản 5 Điều 22 Luật Đất đai 2024; Khoản 4 Điều 22 Luật Đất đai 2024; Điểm a khoản 2 Điều 19 Luật Đất đai 2024","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4","TH3.01.5"]},{"cid":"TH3.02","title":"Thống kê, kiểm kê đất đai","text":"Tháng 9/2026, Ủy ban nhân dân xã Hòa Bình dự định thực hiện \"kiểm kê đất đai năm 2026\" thay cho thống kê để có số liệu đầy đủ, đồng thời đề xuất chỉ báo cáo diện tích các loại đất. Một cán bộ cho rằng năm 2026 phải thống kê, còn kỳ kiểm kê gần nhất đã thực hiện tính đến hết năm 2024. Ủy ban nhân dân tỉnh muốn tổ chức thêm một đợt kiểm kê chuyên đề về đất khu công nghiệp.","ask":[],"guide":[],"basis":"Khoản 29, khoản 41 Điều 3 Luật Đất đai 2024; Khoản 2 Điều 57 Luật Đất đai 2024; Điểm b khoản 2 Điều 57 Luật Đất đai 2024; Khoản 3 Điều 59 Luật Đất đai 2024; Khoản 3 Điều 57, khoản 7 Điều 59 Luật Đất đai 2024","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4","TH3.02.5"]},{"cid":"TH3.03","title":"Nguyên tắc lập quy hoạch, kế hoạch sử dụng đất","text":"Trong buổi thảo luận, nhóm sinh viên đưa ra bốn ý kiến: (1) quy hoạch sử dụng đất cấp tỉnh có thể được phê duyệt trước quy hoạch sử dụng đất quốc gia để kịp thu hút đầu tư; (2) khi kết thúc thời kỳ quy hoạch mà quy hoạch thời kỳ mới chưa được phê duyệt thì các chỉ tiêu sử dụng đất chưa thực hiện đương nhiên hết hiệu lực; (3) kế hoạch sử dụng đất cấp tỉnh có thời kỳ 10 năm; (4) việc lập quy hoạch sử dụng đất là việc nội bộ của cơ quan nhà nước, không cần sự tham gia của người dân.","ask":[],"guide":[],"basis":"Khoản 9 Điều 60 Luật Đất đai 2024; Khoản 4 Điều 62 Luật Đất đai 2024; Khoản 8 Điều 60 Luật Đất đai 2024","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]},{"cid":"TH3.04","title":"Hình thức giao đất","text":"Năm 2026, tại tỉnh K có các đề nghị sau: (1) ông An, cá nhân trực tiếp sản xuất nông nghiệp, xin giao 1 ha đất trồng cây hằng năm trong hạn mức; (2) Trường Trung học phổ thông công lập Lê Lợi xin đất xây dựng trường; (3) chị Bích xin giao 120 m² đất ở; (4) Công ty cổ phần Phú Quý xin giao đất thực hiện dự án nhà ở thương mại để bán; (5) Ban quản lý rừng phòng hộ đầu nguồn xin giao đất rừng phòng hộ.","ask":[],"guide":[],"basis":"Khoản 1 Điều 118 Luật Đất đai 2024; Khoản 4 Điều 118 Luật Đất đai 2024; Điều 119 Luật Đất đai 2024; Khoản 3 Điều 118 Luật Đất đai 2024","mcq":["TH3.04.1","TH3.04.2","TH3.04.3","TH3.04.4"]},{"cid":"TH3.05","title":"Chuyển mục đích sử dụng đất","text":"Ông Dương có Giấy chứng nhận đối với các thửa đất: 2.000 m² đất trồng lúa; 1.000 m² đất trồng cây hằng năm khác; 300 m² đất thương mại, dịch vụ; 200 m² đất ở. Năm 2026, ông dự định: (1) chuyển 500 m² đất trồng lúa sang trồng cây lâu năm; (2) chuyển 300 m² đất trồng cây hằng năm khác sang đất nuôi trồng thủy sản; (3) chuyển 300 m² đất thương mại, dịch vụ sang đất ở; (4) chuyển 100 m² đất ở sang đất thương mại, dịch vụ để mở cửa hàng.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 121, khoản 3 Điều 182 Luật Đất đai 2024; Khoản 3 Điều 121 Luật Đất đai 2024; Điểm đ khoản 1 Điều 121 Luật Đất đai 2024; Khoản 1, khoản 3 Điều 121 Luật Đất đai 2024; Khoản 3 Điều 173, khoản 1 Điều 171 Luật Đất đai 2024","mcq":["TH3.05.1","TH3.05.2","TH3.05.3","TH3.05.4","TH3.05.5"]},{"cid":"TH3.06","title":"Đăng ký đất đai và đất không có giấy tờ","text":"Ông Định sử dụng ổn định 300 m² đất ở tại xã Tân Phú từ năm 1988 đến nay, không có giấy tờ về quyền sử dụng đất, không có tranh chấp, không vi phạm pháp luật đất đai. Trên đất có ngôi nhà ông tự xây năm 2000. Đến năm 2026, ông chưa từng đăng ký đất đai và cho rằng việc đăng ký là tùy ý. Ông cũng hỏi có cần đăng ký quyền sở hữu ngôi nhà không và có thể nộp hồ sơ điện tử không.","ask":[],"guide":[],"basis":"Khoản 1 Điều 131 Luật Đất đai 2024; Khoản 2 Điều 131 Luật Đất đai 2024; Điều 132 Luật Đất đai 2024; Khoản 2 Điều 138 Luật Đất đai 2024","mcq":["TH3.06.1","TH3.06.2","TH3.06.3","TH3.06.4"]},{"cid":"TH3.07","title":"Nguyên tắc ghi tên trên Giấy chứng nhận","text":"Năm 2025, trong thời kỳ hôn nhân, anh Phong và chị Giang dùng tiền chung mua một thửa đất ở; khi làm thủ tục, Giấy chứng nhận chỉ ghi tên anh Phong. Năm 2026, chị Giang đề nghị ghi thêm tên mình. Cùng xã, ba anh em ông Hải, ông Hà, ông Hưng cùng được thừa kế chung một thửa đất, chưa chia; hai người muốn mỗi người có một Giấy chứng nhận riêng, một người muốn cấp chung.","ask":[],"guide":[],"basis":"Khoản 4 Điều 135 Luật Đất đai 2024; Khoản 2 Điều 135 Luật Đất đai 2024; Khoản 3 Điều 135 Luật Đất đai 2024; Khoản 21 Điều 3 Luật Đất đai 2024","mcq":["TH3.07.1","TH3.07.2","TH3.07.3","TH3.07.4"]},{"cid":"TH3.08","title":"Trường hợp không cấp Giấy chứng nhận","text":"Ủy ban nhân dân xã An Hòa nhận được 6 hồ sơ đề nghị cấp Giấy chứng nhận: (1) anh Tú thuê 500 m² đất của bà Lan để trồng rau; (2) 2 ha đất nông nghiệp công ích của xã; (3) thửa đất của ông Bảo đang có tranh chấp ranh giới với hàng xóm, chưa giải quyết xong; (4) thửa đất của bà Hằng có quyết định thu hồi từ tháng 3/2022 nhưng đến nay Nhà nước chưa thực hiện thu hồi; (5) diện tích đất ông Phúc nhận khoán của một công ty lâm nghiệp; (6) đất hành lang đường bộ giao cho một tổ chức quản lý.","ask":[],"guide":[],"basis":"Điều 151 Luật Đất đai 2024; Điều 151, điểm a khoản 1 Điều 7 Luật Đất đai 2024","mcq":["TH3.08.1","TH3.08.2","TH3.08.3","TH3.08.4"]},{"cid":"TH3.09","title":"Cấp Giấy chứng nhận cho đất không có giấy tờ","text":"Tại xã Bình Minh có ba trường hợp sử dụng đất ở không có giấy tờ về quyền sử dụng đất, không vi phạm pháp luật đất đai, phù hợp quy hoạch: bà Huệ sử dụng từ năm 1979; ông Ích sử dụng từ năm 1990; ông Khánh sử dụng từ năm 2008. Cả ba đều được hàng xóm xác nhận sử dụng liên tục, không tranh chấp.","ask":[],"guide":[],"basis":"Khoản 1 Điều 138 Luật Đất đai 2024; Khoản 1, 2, 3 Điều 138 Luật Đất đai 2024; Khoản 3 Điều 138 Luật Đất đai 2024; Khoản 33 Điều 3, khoản 9 Điều 13 Luật Đất đai 2024","mcq":["TH3.09.1","TH3.09.2","TH3.09.3","TH3.09.4"]},{"cid":"TH3.10","title":"Xác định loại đất và bản đồ địa chính","text":"Năm 1998, bà Liên được Ủy ban nhân dân huyện ra quyết định giao 800 m² đất vườn nhưng đến nay chưa được cấp Giấy chứng nhận; thực tế bà trồng cây lâu năm. Thửa đất bên cạnh của ông Mạnh có Giấy chứng nhận ghi \"đất trồng cây hằng năm khác\" nhưng ông đã chuyển sang trồng cây lâu năm nhiều năm. Năm 2026, xã đo đạc lại bản đồ địa chính và phát hiện ranh giới hai thửa đã thay đổi.","ask":[],"guide":[],"basis":"Điểm c khoản 1 Điều 10 Luật Đất đai 2024; Khoản 2 Điều 10 Luật Đất đai 2024; Khoản 1 Điều 50 Luật Đất đai 2024; Khoản 3 Điều 50 Luật Đất đai 2024","mcq":["TH3.10.1","TH3.10.2","TH3.10.3","TH3.10.4"]}]},{"name":"Chương 4. Người sử dụng đất, quyền và nghĩa vụ","items":[{"cid":"TH4.01","title":"Chuyển nhượng bằng giấy viết tay và tranh chấp lấn đất","text":"Ông Hùng có Giấy chứng nhận quyền sử dụng 150 m² đất ở tại xã An Bình, tỉnh H, cấp riêng cho ông; thửa đất không có tranh chấp và không bị kê biên. Ngày 05/3/2026, ông Hùng và bà Lan lập giấy viết tay chuyển nhượng toàn bộ thửa đất với giá 1,8 tỷ đồng, có chữ ký hai bên và hai người làm chứng. Bà Lan đã trả 1,35 tỷ đồng; ông Hùng đã giao đất và bản gốc Giấy chứng nhận. Tháng 6/2026, bà Lan xây tường rào lấn sang 12 m² thửa đất liền kề của ông Tâm; ông Tâm đã có Giấy chứng nhận. Tháng 9/2026, giá đất tăng, ông Hùng đòi hủy giao dịch với lý do \"chưa công chứng\" và đề nghị trả lại 1,35 tỷ đồng.","ask":[],"guide":[],"basis":"Khoản 1 Điều 45 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; khoản 2 Điều 129 Bộ luật Dân sự 2015; Điều 503 Bộ luật Dân sự 2015; điểm a khoản 1, khoản 3 Điều 133 Luật Đất đai 2024; Khoản 2 Điều 235, khoản 1 Điều 236 Luật Đất đai 2024","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]},{"cid":"TH4.02","title":"Quyền của tổ chức kinh tế thuê đất trả tiền hằng năm","text":"Năm 2023, Công ty TNHH Minh Phát được Nhà nước cho thuê 2 ha đất trả tiền thuê hằng năm để xây dựng nhà máy chế biến gỗ theo dự án đầu tư đã được chấp thuận. Đến tháng 10/2026, Công ty mới xây xong 60% hạng mục theo dự án; nhà xưởng đã xây đã được đăng ký. Công ty dự định: (1) thế chấp quyền sử dụng 2 ha đất tại ngân hàng để vay vốn; (2) bán toàn bộ nhà xưởng kèm quyền thuê trong hợp đồng thuê đất cho Công ty Thịnh An; (3) chuyển sang hình thức thuê đất trả tiền một lần cho thời gian còn lại.","ask":[],"guide":[],"basis":"Điểm b khoản 1 Điều 34 Luật Đất đai 2024; Điểm c khoản 1 Điều 34 Luật Đất đai 2024; Khoản 1 Điều 30 Luật Đất đai 2024; khoản 2 Điều 4 Nghị quyết 254/2025/QH15","mcq":["TH4.02.1","TH4.02.2","TH4.02.3"]},{"cid":"TH4.03","title":"Quyền của tổ chức kinh tế được giao đất có thu tiền","text":"Công ty cổ phần Đông Đô được Nhà nước giao 5 ha đất có thu tiền sử dụng đất để thực hiện dự án nhà ở để bán; theo chính sách ưu đãi đầu tư, Công ty được giảm 30% tiền sử dụng đất. Năm 2026, Công ty dự định: (1) tặng cho 200 m² cho ông Giám đốc để ghi nhận đóng góp; (2) thế chấp quyền sử dụng 1 ha đất cho một cá nhân để vay tiền; (3) góp vốn bằng quyền sử dụng 1 ha đất vào một tổ chức kinh tế có vốn đầu tư nước ngoài; (4) chuyển nhượng 2 ha đất cho Công ty Hà Thành.","ask":[],"guide":[],"basis":"Điểm d khoản 1 Điều 33 Luật Đất đai 2024; Điểm đ khoản 1 Điều 33 Luật Đất đai 2024; Điểm e khoản 1 Điều 33 Luật Đất đai 2024; Điểm b khoản 3 Điều 33 Luật Đất đai 2024","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]},{"cid":"TH4.04","title":"Thừa kế quyền sử dụng đất có yếu tố nước ngoài","text":"Ông Bảy chết năm 2025 không để lại di chúc. Di sản là nhà ở gắn liền với 200 m² đất ở đã có Giấy chứng nhận tại phường Tân Định, tỉnh S. Hàng thừa kế thứ nhất gồm: anh Tám, công dân Việt Nam sống tại tỉnh S; chị Chín, người gốc Việt Nam quốc tịch Mỹ, được phép nhập cảnh vào Việt Nam; anh Peter, quốc tịch Úc, là con nuôi hợp pháp của ông Bảy. Đến tháng 10/2026, những người thừa kế chưa phân chia di sản. Anh Peter sống ở Úc và muốn nhờ anh Tám trông nom phần di sản của mình.","ask":[],"guide":[],"basis":"Khoản 1 Điều 44, điểm đ khoản 1 Điều 37 Luật Đất đai 2024; Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024; Khoản 5 Điều 44 Luật Đất đai 2024; Khoản 6 Điều 44 Luật Đất đai 2024","mcq":["TH4.04.1","TH4.04.2","TH4.04.3","TH4.04.4"]},{"cid":"TH4.05","title":"Chuyển đổi quyền sử dụng đất nông nghiệp","text":"Ông Hòa có Giấy chứng nhận đối với 3 thửa đất trồng lúa tại xã Đông Phong, tỉnh A. Năm 2026, ông thỏa thuận: (1) đổi thửa số 12 lấy thửa số 15 của ông Lâm cùng xã cho liền bờ; (2) đổi thửa số 20 lấy một thửa đất trồng lúa của ông Kha ở tỉnh B giáp ranh. Ngoài ra, xã Đông Phong đang thực hiện phương án dồn điền, đổi thửa; một thửa của ông Hòa chưa được cấp Giấy chứng nhận nằm trong phương án này. Các bên dự định tự lập hợp đồng chuyển đổi, không công chứng.","ask":[],"guide":[],"basis":"Điều 47, điểm b khoản 1 Điều 37 Luật Đất đai 2024; Điều 47 Luật Đất đai 2024; Điểm b khoản 3 Điều 27 Luật Đất đai 2024; Điểm a khoản 1 Điều 45 Luật Đất đai 2024; Điểm a khoản 1 Điều 28 Luật Đất đai 2024","mcq":["TH4.05.1","TH4.05.2","TH4.05.3","TH4.05.4","TH4.05.5"]},{"cid":"TH4.06","title":"Thế chấp và góp vốn bằng quyền sử dụng đất","text":"Bà Yến có Giấy chứng nhận đối với hai thửa đất ở. Năm 2026, bà ký hợp đồng thế chấp thửa thứ nhất cho ông Phát (cá nhân) để vay 1 tỷ đồng; hợp đồng chỉ có chữ ký hai bên. Với thửa thứ hai, bà dự định góp vốn bằng quyền sử dụng đất vào Công ty TNHH Sơn Hà để nhận phần vốn góp. Một người bạn khuyên bà chỉ nên \"hợp tác kinh doanh\" với công ty bằng quyền sử dụng đất để vẫn giữ quyền sử dụng đất.","ask":[],"guide":[],"basis":"Điểm g khoản 1 Điều 37 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; Điểm b khoản 1 Điều 36, Điều 33 Luật Đất đai 2024; Khoản 22, khoản 26 Điều 3 Luật Đất đai 2024","mcq":["TH4.06.1","TH4.06.2","TH4.06.3","TH4.06.4"]},{"cid":"TH4.07","title":"Nhận chuyển nhượng đất trồng lúa của cá nhân không trực tiếp sản xuất nông nghiệp","text":"Anh Quân là kỹ sư phần mềm sống ở thành phố, không trực tiếp sản xuất nông nghiệp. Năm 2026, anh muốn nhận chuyển nhượng 5 ha đất trồng lúa tại một tỉnh vùng đồng bằng sông Hồng để làm mô hình lúa hữu cơ. Cùng năm, bố anh Quân dự định tặng cho anh 1 ha đất trồng lúa tại quê.","ask":[],"guide":[],"basis":"Khoản 7 Điều 45 Luật Đất đai 2024; Điểm b khoản 1 Điều 176 Luật Đất đai 2024; Khoản 1, khoản 3 Điều 177 Luật Đất đai 2024","mcq":["TH4.07.1","TH4.07.2","TH4.07.3","TH4.07.4"]},{"cid":"TH4.08","title":"Cho thuê và tặng cho quyền sử dụng đất của cá nhân","text":"Bà Hạnh được Nhà nước giao 1,5 ha đất trồng cây lâu năm trong hạn mức và đã có Giấy chứng nhận. Năm 2026, bà: (1) cho Công ty TNHH Nông sản Việt thuê 1 ha trong 10 năm, hợp đồng không công chứng; (2) muốn tặng cho 0,3 ha cho cháu ruột là Lisa, người gốc Việt Nam quốc tịch Pháp nhưng đang bị cấm nhập cảnh vào Việt Nam; (3) tặng 200 m² dọc đường thôn để mở rộng đường giao thông theo quy hoạch.","ask":[],"guide":[],"basis":"Điểm d khoản 1 Điều 37, điểm b khoản 3 Điều 27 Luật Đất đai 2024; Khoản 3 Điều 34 Luật Đất đai 2024; Điều 500 Bộ luật Dân sự 2015; Điểm e khoản 1 Điều 37, khoản 1 Điều 44 Luật Đất đai 2024; Điểm a khoản 1 Điều 45 Luật Đất đai 2024","mcq":["TH4.08.1","TH4.08.2","TH4.08.3","TH4.08.4"]},{"cid":"TH4.09","title":"Lựa chọn hình thức trả tiền thuê đất","text":"Tại tỉnh V có ba trường hợp: (1) Công ty Đại Phong đang thuê đất trả tiền một lần cho cả thời gian thuê, muốn chuyển sang trả tiền hằng năm để giảm áp lực tài chính; (2) Công ty Hoàng Long đang thuê đất trả tiền hằng năm nhưng thuộc trường hợp được thuê đất trả tiền một lần, muốn chuyển sang trả một lần cho thời gian còn lại; (3) Trường Cao đẳng nghề tỉnh V (đơn vị sự nghiệp công lập) được giao đất không thu tiền, nay muốn dùng 2.000 m² mở dịch vụ trông giữ xe và cho một doanh nghiệp liên kết khai thác.","ask":[],"guide":[],"basis":"Khoản 2 Điều 30 Luật Đất đai 2024; Khoản 1 Điều 30 Luật Đất đai 2024; Khoản 3 Điều 30 Luật Đất đai 2024; Điểm b khoản 2 Điều 34 Luật Đất đai 2024","mcq":["TH4.09.1","TH4.09.2","TH4.09.3","TH4.09.4"]},{"cid":"TH4.10","title":"Nghĩa vụ của người sử dụng đất","text":"Ông Mạnh nhận chuyển nhượng một thửa đất ở năm 2025 nhưng đến nay chưa đăng ký biến động. Năm 2026, khi đào móng xây nhà, ông phát hiện một chum đồng cổ và mang về cất giữ. Ông còn đào tầng hầm sâu vượt quá quy định, làm hỏng một đoạn đường ống cấp nước công cộng chạy ngầm dưới thửa đất. Ông cũng đang nợ tiền thuê đối với một thửa đất khác thuê của Nhà nước.","ask":[],"guide":[],"basis":"Khoản 6 Điều 31 Luật Đất đai 2024; Khoản 1 Điều 31 Luật Đất đai 2024; Khoản 2 Điều 31, khoản 8 Điều 11 Luật Đất đai 2024; Khoản 3 Điều 31, khoản 9 Điều 11 Luật Đất đai 2024","mcq":["TH4.10.1","TH4.10.2","TH4.10.3","TH4.10.4"]}]},{"name":"Chương 5. Thu hồi đất, bồi thường, hỗ trợ, tái định cư","items":[{"cid":"TH5.01","title":"Căn cứ thu hồi đất vì lợi ích quốc gia, công cộng","text":"Năm 2026, tỉnh M dự kiến thu hồi đất để thực hiện ba dự án: (1) mở rộng quốc lộ đi qua xã Đông Hòa; (2) xây dựng bệnh viện đa khoa công lập của tỉnh; (3) một khu nghỉ dưỡng tư nhân do Công ty X đề xuất, không thuộc danh mục trường hợp thu hồi đất của Luật Đất đai. Ông Lâm có 1.500 m² đất trồng lúa có Giấy chứng nhận nằm trong phạm vi dự án (1).","ask":[],"guide":[],"basis":"Khoản 1 Điều 79 Luật Đất đai 2024; Điều 79 Luật Đất đai 2024; Điều 79, khoản 1 Điều 27 Luật Đất đai 2024; Khoản 1, điểm a khoản 2 Điều 95 Luật Đất đai 2024","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]},{"cid":"TH5.02","title":"Thông báo thu hồi và lấy ý kiến phương án bồi thường","text":"Ngày 01/3/2026, cơ quan có thẩm quyền ban hành thông báo thu hồi 2 ha đất nông nghiệp và 5.000 m² đất ở của các hộ dân xã Tân An để xây dựng trường học công lập. Phương án bồi thường, hỗ trợ, tái định cư được niêm yết công khai tại trụ sở Ủy ban nhân dân xã. Một số hộ không đồng ý với mức bồi thường và đề nghị được đối thoại.","ask":[],"guide":[],"basis":"Điều 3 Nghị quyết 254/2025/QH15","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4"]},{"cid":"TH5.03","title":"Điều kiện được bồi thường về đất","text":"Trong phạm vi một dự án đường giao thông có các trường hợp: (1) bà Hoa có Giấy chứng nhận đất ở; (2) ông Phúc nhận chuyển nhượng hợp pháp 300 m² đất trồng cây lâu năm năm 2025 nhưng chưa đăng ký biến động; (3) Công ty Y thuê đất trả tiền hằng năm làm xưởng sản xuất; (4) ông Tài tự ý lấn chiếm 200 m² đất công từ năm 2020.","ask":[],"guide":[],"basis":"Điểm a khoản 2 Điều 95 Luật Đất đai 2024; Điểm d khoản 2 Điều 95 Luật Đất đai 2024; Điểm a, điểm e khoản 1 Điều 95 Luật Đất đai 2024; Khoản 2 Điều 95 Luật Đất đai 2024","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4"]},{"cid":"TH5.04","title":"Bồi thường khi thu hồi đất nông nghiệp","text":"Bà Liên là cá nhân trực tiếp sản xuất nông nghiệp, có 1,2 ha đất trồng cây hằng năm được giao trong hạn mức và đã được cấp Giấy chứng nhận. Năm 2026, toàn bộ diện tích bị thu hồi để xây dựng khu công nghiệp. Địa phương không còn quỹ đất nông nghiệp để bồi thường. Bà Liên muốn được bồi thường bằng tiền và được hỗ trợ để chuyển sang nghề khác.","ask":[],"guide":[],"basis":"Khoản 1 Điều 96 Luật Đất đai 2024; Khoản 2 Điều 91 Luật Đất đai 2024; Điểm a khoản 2 Điều 96 Luật Đất đai 2024; Điểm d khoản 1 Điều 108 Luật Đất đai 2024","mcq":["TH5.04.1","TH5.04.2","TH5.04.3","TH5.04.4"]},{"cid":"TH5.05","title":"Bồi thường, hỗ trợ khi thu hồi đất ở","text":"Gia đình ông Hưng có Giấy chứng nhận đối với 150 m² đất ở và ngôi nhà ba tầng; toàn bộ thửa đất bị thu hồi để mở rộng đường. Gia đình không còn chỗ ở nào khác trên địa bàn xã. Ngôi nhà phải tháo dỡ toàn bộ. Theo phương án, giá trị tiền bồi thường về đất ở của gia đình thấp hơn giá trị một suất tái định cư tối thiểu.","ask":[],"guide":[],"basis":"Khoản 1 Điều 98 Luật Đất đai 2024; Khoản 8 Điều 111 Luật Đất đai 2024; Khoản 1 Điều 102 Luật Đất đai 2024; Điều 111 Luật Đất đai 2024","mcq":["TH5.05.1","TH5.05.2","TH5.05.3","TH5.05.4"]},{"cid":"TH5.06","title":"Thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật","text":"Năm 2026 tại xã Bình Sơn có các trường hợp: (1) Công ty Z được thuê đất 20 năm, hết hạn tháng 6/2026 nhưng không được gia hạn; (2) ông Ba chết năm 2025, không có người thừa kế, đã thanh toán xong nghĩa vụ tài sản; (3) bà Năm có đơn tự nguyện trả lại 500 m² đất trồng cây lâu năm; (4) một khu dân cư có nguy cơ sạt lở đe dọa tính mạng người dân theo văn bản của cơ quan có thẩm quyền.","ask":[],"guide":[],"basis":"Điểm c khoản 1 Điều 82 Luật Đất đai 2024; Điểm b khoản 1 Điều 82 Luật Đất đai 2024; Khoản 2, điểm e khoản 5 Điều 82 Luật Đất đai 2024; Điểm b khoản 3 Điều 82 Luật Đất đai 2024","mcq":["TH5.06.1","TH5.06.2","TH5.06.3","TH5.06.4"]},{"cid":"TH5.07","title":"Cưỡng chế thực hiện quyết định thu hồi đất","text":"Quyết định thu hồi đất của gia đình ông Toàn đã có hiệu lực từ tháng 5/2026. Ủy ban nhân dân xã, Ủy ban Mặt trận Tổ quốc xã và đơn vị bồi thường đã vận động, thuyết phục nhưng ông Toàn không bàn giao đất. Cơ quan có thẩm quyền ban hành quyết định cưỡng chế và dự kiến tổ chức cưỡng chế vào ngày mùng 5 Tết Âm lịch năm 2027, bắt đầu lúc 5 giờ sáng.","ask":[],"guide":[],"basis":"Khoản 1 Điều 89 Luật Đất đai 2024; Điểm d khoản 2 Điều 89 Luật Đất đai 2024; Khoản 4 Điều 89 Luật Đất đai 2024","mcq":["TH5.07.1","TH5.07.2","TH5.07.3","TH5.07.4"]},{"cid":"TH5.08","title":"Trưng dụng đất trong tình trạng khẩn cấp","text":"Do lũ lớn, ngày 10/9/2026 Chủ tịch Ủy ban nhân dân tỉnh K quyết định bằng lời nói trưng dụng 3 ha đất trồng màu của các hộ dân xã Hà Lĩnh để làm nơi tập kết vật tư cứu hộ. Sau khi sử dụng, một phần mặt đất bị hư hỏng nặng và hoa màu của các hộ bị mất trắng.","ask":[],"guide":[],"basis":"Khoản 2 Điều 90 Luật Đất đai 2024; Khoản 4 Điều 90 Luật Đất đai 2024; Khoản 7 Điều 90 Luật Đất đai 2024","mcq":["TH5.08.1","TH5.08.2","TH5.08.3","TH5.08.4"]},{"cid":"TH5.09","title":"Thu hồi đất theo Nghị quyết 254/2025/QH15","text":"Dự án khu dân cư nông thôn của Công ty Phúc An thuộc trường hợp nhà đầu tư thỏa thuận nhận quyền sử dụng đất nhưng đã hết thời hạn thực hiện thỏa thuận. Đến tháng 8/2026, công ty đã thỏa thuận được với các hộ chiếm 80% diện tích và 80% số người sử dụng đất của dự án; phần còn lại không thỏa thuận được. Công ty đề nghị Nhà nước thu hồi phần diện tích còn lại.","ask":[],"guide":[],"basis":"Điều 3 Nghị quyết 254/2025/QH15; Nghị quyết 254/2025/QH15","mcq":["TH5.09.1","TH5.09.2","TH5.09.3","TH5.09.4"]},{"cid":"TH5.10","title":"Bố trí tái định cư","text":"Dự án nâng cấp đê sông Hồng phải di dời 40 hộ dân. Ủy ban nhân dân dự kiến bố trí tái định cư tại khu đất mới đang san lấp, chưa có đường, điện, nước. Một số hộ đề nghị được nhận tiền để tự lo chỗ ở thay vì nhận đất tái định cư.","ask":[],"guide":[],"basis":"Khoản 5 Điều 91 Luật Đất đai 2024; Khoản 2 Điều 91 Luật Đất đai 2024; Khoản 1 Điều 111 Luật Đất đai 2024; Khoản 3 Điều 111 Luật Đất đai 2024","mcq":["TH5.10.1","TH5.10.2","TH5.10.3","TH5.10.4"]}]},{"name":"Chương 6. Thanh tra, xử lý vi phạm, giải quyết tranh chấp, khiếu nại, tố cáo","items":[{"cid":"TH6.01","title":"Hòa giải tranh chấp ranh giới tại Ủy ban nhân dân cấp xã","text":"Ông Khải và bà Dung có hai thửa đất liền kề, đều đã có Giấy chứng nhận. Tháng 3/2026, hai bên tranh chấp 15 m² ở ranh giới. Ngày 10/4/2026, bà Dung nộp đơn yêu cầu hòa giải tại Ủy ban nhân dân xã. Đến ngày 25/5/2026, xã vẫn chưa tổ chức hòa giải. Tại buổi hòa giải sau đó, ông Khải không ký biên bản.","ask":[],"guide":[],"basis":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024; Điểm đ khoản 2 Điều 235 Luật Đất đai 2024; Khoản 1 Điều 236 Luật Đất đai 2024","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]},{"cid":"TH6.02","title":"Thẩm quyền giải quyết tranh chấp khi có Giấy chứng nhận","text":"Bà Thơm có Giấy chứng nhận đối với 200 m² đất ở; người hàng xóm là ông Bằng không có giấy tờ nhưng cho rằng 30 m² trong thửa đất của bà Thơm là của gia đình mình. Hai bên đã hòa giải tại Ủy ban nhân dân xã nhưng không thành. Bà Thơm muốn được giải quyết dứt điểm.","ask":[],"guide":[],"basis":"Khoản 1 Điều 236 Luật Đất đai 2024; Khoản 2 Điều 235 Luật Đất đai 2024; Điểm d, điểm k khoản 1 Điều 133 Luật Đất đai 2024; Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4"]},{"cid":"TH6.03","title":"Tranh chấp đất không có giấy tờ","text":"Hai anh em ông Sơn và ông Thủy cùng sử dụng một mảnh đất vườn 500 m² do cha mẹ để lại; cả hai đều không có Giấy chứng nhận hay giấy tờ quy định tại Điều 137 Luật Đất đai 2024. Năm 2026, hai ông tranh chấp về ranh giới và đã hòa giải tại Ủy ban nhân dân xã nhưng không thành.","ask":[],"guide":[],"basis":"Khoản 2 Điều 236 Luật Đất đai 2024; Khoản 2 Điều 235 Luật Đất đai 2024; Điểm b khoản 2 Điều 235 Luật Đất đai 2024","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4"]},{"cid":"TH6.04","title":"Khiếu nại quyết định hành chính về đất đai","text":"Ông Hoàng nhận được quyết định thu hồi đất để thực hiện dự án đường giao thông. Ông cho rằng diện tích đất bị thu hồi ghi trong quyết định lớn hơn thực tế và mức bồi thường chưa đúng. Ông muốn biết mình có thể làm gì để bảo vệ quyền lợi.","ask":[],"guide":[],"basis":"Khoản 8 Điều 26, Điều 237 Luật Đất đai 2024; Điều 237 Luật Đất đai 2024; Điểm đ khoản 1 Điều 24 Luật Đất đai 2024","mcq":["TH6.04.1","TH6.04.2","TH6.04.3","TH6.04.4"]},{"cid":"TH6.05","title":"Thu hồi đất do không đưa đất vào sử dụng","text":"Năm 2023, Công ty Thành Công được Nhà nước cho thuê 5 ha đất để thực hiện dự án nhà máy. Công ty nhận bàn giao đất ngoài thực địa tháng 1/2024 nhưng đến tháng 10/2026 vẫn chưa triển khai xây dựng; không có sự kiện bất khả kháng.","ask":[],"guide":[],"basis":"Khoản 8 Điều 81 Luật Đất đai 2024; Khoản 9 Điều 81 Luật Đất đai 2024","mcq":["TH6.05.1","TH6.05.2","TH6.05.3","TH6.05.4"]},{"cid":"TH6.06","title":"Xử lý hành vi hủy hoại đất","text":"Ông Lực thuê máy xúc đào sâu 3 m trên 2.000 m² đất trồng lúa của mình để lấy đất bán, làm mất tầng canh tác. Năm 2025 ông đã bị xử phạt vi phạm hành chính về hành vi này nhưng năm 2026 tiếp tục đào thêm.","ask":[],"guide":[],"basis":"Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 2 Điều 81 Luật Đất đai 2024; Điều 239 Luật Đất đai 2024; Khoản 4 Điều 31 Luật Đất đai 2024","mcq":["TH6.06.1","TH6.06.2","TH6.06.3","TH6.06.4"]},{"cid":"TH6.07","title":"Vi phạm của cán bộ quản lý đất đai","text":"Ông Q, công chức địa chính xã, nhận tiền của một số hộ để làm ngơ cho việc xây dựng nhà ở trái phép trên đất nông nghiệp; ông cũng cố ý cung cấp thông tin sai lệch về quy hoạch sử dụng đất cho người dân.","ask":[],"guide":[],"basis":"Khoản 4 Điều 11 Luật Đất đai 2024; Khoản 5 Điều 11 Luật Đất đai 2024; Khoản 6 Điều 11 Luật Đất đai 2024; Điều 239 Luật Đất đai 2024","mcq":["TH6.07.1","TH6.07.2","TH6.07.3","TH6.07.4"]},{"cid":"TH6.08","title":"Tranh chấp hợp đồng chuyển nhượng quyền sử dụng đất","text":"Bà Mai ký hợp đồng có công chứng chuyển nhượng thửa đất ở cho ông Đức với giá 2 tỷ đồng. Ông Đức đã trả 1 tỷ đồng nhưng sau đó không trả tiếp; bà Mai muốn hủy hợp đồng và đòi lại đất, còn ông Đức đề nghị Ủy ban nhân dân xã giải quyết.","ask":[],"guide":[],"basis":"Khoản 1 Điều 27 Luật Đất đai 2024; Bộ luật Dân sự 2015; Khoản 1 Điều 236 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; Điều 503 Bộ luật Dân sự 2015","mcq":["TH6.08.1","TH6.08.2","TH6.08.3","TH6.08.4"]},{"cid":"TH6.09","title":"Tố cáo vi phạm pháp luật về đất đai","text":"Bà Hằng phát hiện một doanh nghiệp tự ý san lấp hồ chứa nước công cộng để mở rộng bãi đỗ xe, và cho rằng một số cán bộ xã đã bao che cho doanh nghiệp. Bà muốn báo cho cơ quan nhà nước có thẩm quyền biết để xử lý.","ask":[],"guide":[],"basis":"Điều 238 Luật Đất đai 2024; Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 6 Điều 11 Luật Đất đai 2024","mcq":["TH6.09.1","TH6.09.2","TH6.09.3","TH6.09.4"]},{"cid":"TH6.10","title":"Đất được giao để quản lý bị lấn chiếm","text":"Công ty Thủy lợi X được giao quản lý hành lang bảo vệ kênh chính. Trong nhiều năm, công ty để các hộ dân lấn chiếm xây dựng lều quán trên hành lang mà không có biện pháp ngăn chặn. Năm 2026, một hộ dân tranh chấp với công ty về quyền sử dụng phần đất lều quán.","ask":[],"guide":[],"basis":"Khoản 5 Điều 81 Luật Đất đai 2024; Điểm a khoản 1 Điều 7 Luật Đất đai 2024; Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Điều 151 Luật Đất đai 2024","mcq":["TH6.10.1","TH6.10.2","TH6.10.3","TH6.10.4"]}]}],"vb":[{"name":"Hiến pháp và luật","rows":[{"t":"Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam (Điều 53, 54)","d":"28/11/2013","org":"Quốc hội","note":"Đã sửa đổi, bổ sung năm 2025","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"t":"Luật Đất đai số 31/2024/QH15","d":"18/01/2024","org":"Quốc hội","note":"Hiệu lực 01/8/2024","url":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-523642.aspx"},{"t":"Văn bản hợp nhất số 44/VBHN-VPQH – Luật Đất đai","d":"16/03/2026","org":"Văn phòng Quốc hội","note":"Hợp nhất các lần sửa đổi bởi 12 luật (từ Luật 43/2024/QH15 đến Luật 147/2025/QH15); dùng bản này khi tra cứu","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%2044/VBHN-VPQH%20%E2%80%93%20Lu%E1%BA%ADt%20%C4%90%E1%BA%A5t%20%C4%91ai&match=True"},{"t":"Luật số 43/2024/QH15 sửa đổi Luật Đất đai, Luật Nhà ở, Luật Kinh doanh bất động sản, Luật Các tổ chức tín dụng","d":"29/06/2024","org":"Quốc hội","note":"Hiệu lực 01/8/2024","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=43/2024/QH15&match=True"},{"t":"Luật số
