],"a":3,"e":"Khoản 7 Điều 45 Luật Đất đai 2024 loại trừ trường hợp người nhận tặng cho là người thuộc hàng thừa kế của người tặng cho. Anh Quân là con (hàng thừa kế thứ nhất) của bố nên không phải thành lập tổ chức kinh tế.","b":"Khoản 7 Điều 45 Luật Đất đai 2024","cid":"TH4.07"},{"id":"TH4.07.4","g":4,"lv":"VD","q":"Diện tích đất nông nghiệp anh Quân được nhận chuyển nhượng bị giới hạn bởi quy định nào?","o":["Hạn mức giao đất ở tại đô thị","Không bị giới hạn","Hạn mức giao đất nông nghiệp 02 ha","Hạn mức nhận chuyển quyền: không quá 15 lần hạn mức giao đất, mức cụ thể do Ủy ban nhân dân cấp tỉnh quy định"],"a":3,"e":"Khoản 1, 3 Điều 177 Luật Đất đai 2024: hạn mức nhận chuyển quyền sử dụng đất nông nghiệp của cá nhân không quá 15 lần hạn mức giao đất cho mỗi loại; UBND tỉnh quy định cụ thể. Hạn mức giao đất 02 ha chỉ dùng để tính hạn mức nhận chuyển quyền, không giới hạn trực tiếp.","b":"Khoản 1, khoản 3 Điều 177 Luật Đất đai 2024","cid":"TH4.07"},{"id":"TH4.08.1","g":4,"lv":"VD","q":"Hợp đồng cho Công ty Nông sản Việt thuê 1 ha trong 10 năm không công chứng có hợp lệ về hình thức không?","o":["Hợp lệ, vì hợp đồng cho thuê quyền sử dụng đất được công chứng, chứng thực theo yêu cầu của các bên","Chỉ hợp lệ nếu đăng ký tại Ủy ban nhân dân tỉnh","Không hợp lệ vì thời hạn thuê trên 05 năm","Không hợp lệ, phải công chứng"],"a":0,"e":"Điểm d khoản 1 Điều 37 và điểm b khoản 3 Điều 27 Luật Đất đai 2024: cá nhân được cho thuê quyền sử dụng đất; hợp đồng cho thuê được công chứng, chứng thực theo yêu cầu của các bên. Thời hạn thuê 10 năm không làm phát sinh yêu cầu công chứng bắt buộc.","b":"Điểm d khoản 1 Điều 37, điểm b khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH4.08"},{"id":"TH4.08.2","g":4,"lv":"VD","q":"Quan hệ thuê đất giữa Công ty Nông sản Việt và bà Hạnh được điều chỉnh theo pháp luật nào?","o":["Pháp luật hành chính về giao đất","Pháp luật về đầu tư công","Pháp luật dân sự","Pháp luật về đấu giá tài sản"],"a":2,"e":"Quan hệ thuê quyền sử dụng đất giữa người sử dụng đất (bà Hạnh) và tổ chức kinh tế là giao dịch dân sự, tuân theo pháp luật dân sự (Điều 500 BLDS về hợp đồng về quyền sử dụng đất; khoản 3 Điều 34 Luật Đất đai 2024 về tổ chức kinh tế thuê đất của người sử dụng đất).","b":"Khoản 3 Điều 34 Luật Đất đai 2024; Điều 500 Bộ luật Dân sự 2015","cid":"TH4.08"},{"id":"TH4.08.3","g":4,"lv":"VD","q":"Bà Hạnh có được tặng cho 0,3 ha cho cháu Lisa, người gốc Việt Nam đang bị cấm nhập cảnh vào Việt Nam không?","o":["Được, nếu hợp đồng tặng cho được công chứng","Được, nếu Lisa ủy quyền cho người khác nhận","Được, vì Lisa là cháu ruột","Không, người gốc Việt Nam nhận tặng cho phải thuộc đối tượng được sở hữu nhà ở, tức được phép nhập cảnh vào Việt Nam"],"a":3,"e":"Điểm e khoản 1 Điều 37 và khoản 1 Điều 44 Luật Đất đai 2024: cá nhân được tặng cho quyền sử dụng đất cho người gốc Việt Nam định cư ở nước ngoài thuộc đối tượng được sở hữu nhà ở tại Việt Nam, tức được phép nhập cảnh. Lisa đang bị cấm nhập cảnh nên không đủ điều kiện nhận tặng cho; quan hệ huyết thống hay công chứng không khắc phục được.","b":"Điểm e khoản 1 Điều 37, khoản 1 Điều 44 Luật Đất đai 2024","cid":"TH4.08"},{"id":"TH4.08.4","g":4,"lv":"VD","q":"Việc tặng 200 m² để mở rộng đường giao thông theo quy hoạch có bắt buộc phải có Giấy chứng nhận không?","o":["Hợp đồng tặng cho phải được công chứng trước","Không bắt buộc, tặng cho Nhà nước, cộng đồng dân cư là ngoại lệ của điều kiện có Giấy chứng nhận","Cần có quyết định của Ủy ban nhân dân tỉnh","Bắt buộc phải có Giấy chứng nhận"],"a":1,"e":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024: tặng cho quyền sử dụng đất cho Nhà nước hoặc cộng đồng dân cư (mở rộng đường giao thông theo quy hoạch) là ngoại lệ, không bắt buộc phải có Giấy chứng nhận. Tuy vậy bà Hạnh đã có Giấy chứng nhận nên càng thuận lợi.","b":"Điểm a khoản 1 Điều 45 Luật Đất đai 2024","cid":"TH4.08"},{"id":"TH4.09.1","g":4,"lv":"VD","q":"Công ty Đại Phong đang thuê đất trả tiền một lần có được chuyển sang trả tiền thuê hằng năm không? Số tiền đã nộp xử lý thế nào?","o":["Được; Nhà nước hoàn trả ngay toàn bộ tiền đã nộp","Được; số tiền đã nộp không được tính lại","Được; tiền thuê đất đã nộp được khấu trừ vào tiền thuê đất hằng năm phải nộp","Không được chuyển"],"a":2,"e":"Khoản 2 Điều 30 Luật Đất đai 2024: tổ chức kinh tế đang thuê đất trả tiền một lần được chuyển sang thuê đất trả tiền hằng năm; tiền thuê đất đã nộp được khấu trừ vào tiền thuê đất hằng năm phải nộp theo quy định của Chính phủ. Không hoàn trả ngay và cũng không 'mất' số tiền đã nộp.","b":"Khoản 2 Điều 30 Luật Đất đai 2024","cid":"TH4.09"},{"id":"TH4.09.2","g":4,"lv":"VD","q":"Khi Công ty Hoàng Long chuyển sang trả tiền thuê một lần cho thời gian còn lại, tiền thuê được xác định thế nào?","o":["Bằng tổng tiền thuê hằng năm còn lại không điều chỉnh","Theo giá do doanh nghiệp tự kê khai","Xác định lại giá đất để tính tiền thuê tại thời điểm có quyết định cho phép chuyển","Giữ nguyên giá đất tại thời điểm thuê ban đầu"],"a":2,"e":"Khoản 1 Điều 30 Luật Đất đai 2024: khi chuyển từ thuê đất trả tiền hằng năm sang trả tiền một lần cho thời gian còn lại, giá đất để tính tiền thuê đất được xác định tại thời điểm có quyết định cho phép chuyển sang thuê đất trả tiền một lần.","b":"Khoản 1 Điều 30 Luật Đất đai 2024","cid":"TH4.09"},{"id":"TH4.09.3","g":4,"lv":"VD","q":"Trường Cao đẳng nghề dùng 2.000 m² mở dịch vụ trông giữ xe phải chuyển phần diện tích này sang hình thức nào?","o":["Giao đất có thu tiền sử dụng đất","Giữ nguyên giao đất không thu tiền","Thuê đất trả tiền một lần","Thuê đất trả tiền hằng năm"],"a":3,"e":"Khoản 3 Điều 30 Luật Đất đai 2024: đơn vị sự nghiệp công lập được giao đất không thu tiền mà sử dụng một phần diện tích vào kinh doanh, dịch vụ thì chuyển sang thuê đất trả tiền hằng năm đối với phần diện tích đó.","b":"Khoản 3 Điều 30 Luật Đất đai 2024","cid":"TH4.09"},{"id":"TH4.09.4","g":4,"lv":"VD","q":"Việc Trường liên kết với doanh nghiệp để khai thác 2.000 m² phải đáp ứng yêu cầu gì?","o":["Có đề án sử dụng tài sản công được cấp có thẩm quyền phê duyệt","Phải chuyển nhượng đất cho doanh nghiệp","Phải được Hội đồng nhân dân xã thông qua","Chỉ cần hợp đồng liên kết được công chứng"],"a":0,"e":"Điểm b khoản 2 Điều 34 Luật Đất đai 2024: đơn vị sự nghiệp công lập thuê đất trả tiền hằng năm được cho thuê, liên doanh, liên kết khai thác tài sản gắn liền với đất khi có đề án sử dụng tài sản công vào mục đích kinh doanh, cho thuê, liên doanh, liên kết được cấp có thẩm quyền phê duyệt theo pháp luật về quản lý, sử dụng tài sản công.","b":"Điểm b khoản 2 Điều 34 Luật Đất đai 2024","cid":"TH4.09"},{"id":"TH4.10.1","g":4,"lv":"VD","q":"Việc ông Mạnh tự cất giữ chum đồng cổ tìm thấy khi đào móng vi phạm nghĩa vụ nào?","o":["Bàn giao lại đất khi bị thu hồi","Sử dụng đất đúng mục đích","Tuân thủ quy định của pháp luật về việc tìm thấy vật trong lòng đất","Thực hiện nghĩa vụ tài chính"],"a":2,"e":"Khoản 6 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ tuân theo quy định của pháp luật về việc tìm thấy vật trong lòng đất. Chum đồng cổ có thể là di vật, cổ vật phải khai báo, giao nộp theo pháp luật dân sự (Điều 229 BLDS) và di sản văn hóa; ông Mạnh tự cất giữ là vi phạm.","b":"Khoản 6 Điều 31 Luật Đất đai 2024","cid":"TH4.10"},{"id":"TH4.10.2","g":4,"lv":"VD","q":"Hành vi đào tầng hầm vượt độ sâu, làm hỏng đường ống cấp nước công cộng vi phạm nghĩa vụ nào?","o":["Sử dụng đất đúng quy định về độ sâu trong lòng đất và bảo vệ công trình công cộng trong lòng đất","Bàn giao đất khi Nhà nước thu hồi","Kê khai, đăng ký đất đai","Tuân thủ quy định về vật tìm thấy trong lòng đất"],"a":0,"e":"Khoản 1 Điều 31 Luật Đất đai 2024: người sử dụng đất phải sử dụng đất đúng mục đích, đúng ranh giới thửa đất, đúng quy định về sử dụng độ sâu trong lòng đất và chiều cao trên không, bảo vệ các công trình công cộng trong lòng đất. Đào tầng hầm vượt độ sâu, làm hỏng đường ống cấp nước vi phạm nghĩa vụ này.","b":"Khoản 1 Điều 31 Luật Đất đai 2024","cid":"TH4.10"},{"id":"TH4.10.3","g":4,"lv":"VD","q":"Việc ông Mạnh chưa đăng ký biến động sau khi nhận chuyển nhượng năm 2025 được đánh giá thế nào?","o":["Vi phạm nghĩa vụ đăng ký; sử dụng đất, giao dịch mà không đăng ký là hành vi bị nghiêm cấm","Chỉ vi phạm khi ông Mạnh bán lại thửa đất","Đăng ký biến động là tùy ý nên không vi phạm","Hợp pháp vì hợp đồng đã công chứng"],"a":0,"e":"Khoản 2 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ thực hiện kê khai, đăng ký đất đai, làm đầy đủ thủ tục khi chuyển quyền. Khoản 8 Điều 11 nghiêm cấm thực hiện giao dịch về quyền sử dụng đất mà không đăng ký. Việc hợp đồng đã công chứng không thay thế nghĩa vụ đăng ký biến động.","b":"Khoản 2 Điều 31, khoản 8 Điều 11 Luật Đất đai 2024","cid":"TH4.10"},{"id":"TH4.10.4","g":4,"lv":"VD","q":"Việc ông Mạnh nợ tiền thuê đất đối với thửa đất thuê của Nhà nước vi phạm quy định nào?","o":["Không thực hiện đầy đủ nghĩa vụ tài chính về đất đai, là hành vi bị nghiêm cấm","Sử dụng đất không đúng mục đích","Lấn, chiếm đất","Hủy hoại đất"],"a":0,"e":"Khoản 3 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ thực hiện nghĩa vụ tài chính về đất đai; khoản 9 Điều 11 nghiêm cấm không thực hiện hoặc thực hiện không đầy đủ nghĩa vụ tài chính với Nhà nước. Nợ tiền thuê đất là vi phạm nghĩa vụ tài chính, không phải lấn chiếm hay hủy hoại đất.","b":"Khoản 3 Điều 31, khoản 9 Điều 11 Luật Đất đai 2024","cid":"TH4.10"},{"id":"5.01","g":5,"lv":"TH","q":"Nhà nước thu hồi đất để phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng trong những trường hợp nào?","o":["Các trường hợp luật liệt kê; trường hợp khác thì Quốc hội sửa đổi, bổ sung theo trình tự rút gọn","Bất kỳ dự án nào làm tăng thu ngân sách địa phương","Mọi dự án được Hội đồng nhân dân xã thông qua","Mọi dự án có nhà đầu tư đề xuất và được Ủy ban nhân dân tỉnh chấp thuận"],"a":0,"e":"Điều 79 Luật Đất đai 2024 liệt kê cụ thể các trường hợp Nhà nước thu hồi đất để phát triển kinh tế – xã hội vì lợi ích quốc gia, công cộng; trường hợp dự án không thuộc danh mục thì Quốc hội sửa đổi, bổ sung danh mục theo trình tự, thủ tục rút gọn. Ý chí của nhà đầu tư, HĐND xã hay mục tiêu tăng thu ngân sách không phải căn cứ.","b":"Điều 79 Luật Đất đai 2024"},{"id":"5.02","g":5,"lv":"TH","q":"Dự án nào sau đây thuộc trường hợp Nhà nước thu hồi đất để phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng?","o":["Xây dựng cơ sở y tế do Nhà nước thành lập","Xây dựng biệt thự nghỉ dưỡng của một cá nhân","Mở rộng nhà xưởng của doanh nghiệp tư nhân ngoài khu công nghiệp","Xây dựng trang trại chăn nuôi gia đình"],"a":0,"e":"Điều 79 Luật Đất đai 2024 có trường hợp thu hồi đất để xây dựng công trình y tế, giáo dục, văn hóa… do Nhà nước đầu tư, thành lập. Trang trại gia đình, nhà xưởng tư nhân ngoài khu công nghiệp, biệt thự cá nhân không thuộc danh mục; nhà đầu tư phải thỏa thuận nhận quyền sử dụng đất.","b":"Điều 79 Luật Đất đai 2024"},{"id":"5.03","g":5,"lv":"NB","q":"Theo Nghị quyết 254/2025/QH15, thời hạn thông báo thu hồi đất nông nghiệp trước khi có quyết định thu hồi tối thiểu là bao lâu?","o":["30 ngày","120 ngày","90 ngày","60 ngày"],"a":3,"e":"Nghị quyết 254/2025/QH15 (hiệu lực 01/01/2026) rút ngắn thời hạn thông báo thu hồi đất: chậm nhất 60 ngày đối với đất nông nghiệp (Luật Đất đai 2024 quy định 90 ngày) trước khi ban hành quyết định thu hồi. Nghị quyết được ưu tiên áp dụng khi quy định khác Luật.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.04","g":5,"lv":"NB","q":"Theo Nghị quyết 254/2025/QH15, thời hạn thông báo thu hồi đất phi nông nghiệp trước khi có quyết định thu hồi tối thiểu là bao lâu?","o":["120 ngày","180 ngày","90 ngày","60 ngày"],"a":0,"e":"Nghị quyết 254/2025/QH15: thông báo thu hồi đất phi nông nghiệp phải gửi chậm nhất 120 ngày trước khi có quyết định thu hồi (Luật Đất đai 2024 quy định 180 ngày). Mục đích là đẩy nhanh giải phóng mặt bằng nhưng vẫn bảo đảm thời gian chuẩn bị cho người có đất.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.05","g":5,"lv":"NB","q":"Theo Nghị quyết 254/2025/QH15, phương án bồi thường, hỗ trợ, tái định cư được niêm yết công khai trong thời hạn bao lâu?","o":["60 ngày","15 ngày","10 ngày","30 ngày"],"a":2,"e":"Nghị quyết 254/2025/QH15 rút ngắn thời hạn niêm yết công khai phương án bồi thường, hỗ trợ, tái định cư xuống 10 ngày (Luật Đất đai 2024 quy định 30 ngày) tại trụ sở UBND cấp xã và điểm sinh hoạt chung khu dân cư.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.06","g":5,"lv":"TH","q":"Theo Nghị quyết 254/2025/QH15, về nguyên tắc, quyết định thu hồi đất chỉ được ban hành khi nào?","o":["Đã hoàn thành việc phê duyệt phương án bồi thường, hỗ trợ, tái định cư","Khi chủ đầu tư đã ký hợp đồng thi công","Khi đã cưỡng chế kiểm đếm xong","Ngay sau khi có thông báo thu hồi đất"],"a":0,"e":"Nghị quyết 254/2025/QH15 giữ nguyên tắc: quyết định thu hồi đất chỉ được ban hành sau khi đã phê duyệt phương án bồi thường, hỗ trợ, tái định cư (trừ trường hợp đặc biệt Nghị quyết cho phép). Không ban hành ngay sau thông báo hay chờ cưỡng chế kiểm đếm.","b":"Điều 3 Nghị quyết 254/2025/QH15"},{"id":"5.07","g":5,"lv":"TH","q":"Trường hợp nào sau đây là thu hồi đất do vi phạm pháp luật về đất đai?","o":["Đất được thuê có thời hạn nhưng không được gia hạn","Sử dụng đất không đúng mục đích, đã bị xử phạt vi phạm hành chính mà tiếp tục vi phạm","Đất có nguy cơ sạt lở đe dọa tính mạng con người","Người sử dụng đất tự nguyện trả lại đất"],"a":1,"e":"Khoản 1 Điều 81 Luật Đất đai 2024: thu hồi đất do vi phạm pháp luật khi sử dụng đất không đúng mục đích đã được giao, cho thuê, công nhận và đã bị xử phạt vi phạm hành chính mà tiếp tục vi phạm. Tự nguyện trả lại đất, hết hạn không gia hạn là chấm dứt sử dụng đất theo pháp luật (Điều 82); đất có nguy cơ sạt lở là thu hồi do đe dọa tính mạng.","b":"Khoản 1 Điều 81 Luật Đất đai 2024"},{"id":"5.08","g":5,"lv":"NB","q":"Đất trồng cây hằng năm không được sử dụng trong thời gian bao lâu liên tục (đã bị xử phạt mà không đưa đất vào sử dụng) thì bị thu hồi?","o":["06 tháng","24 tháng","12 tháng","18 tháng"],"a":2,"e":"Khoản 7 Điều 81 Luật Đất đai 2024: đất trồng cây hằng năm, đất nuôi trồng thủy sản không được sử dụng trong thời gian 12 tháng liên tục; đất trồng cây lâu năm 18 tháng; đất trồng rừng 24 tháng, đã bị xử phạt mà không đưa đất vào sử dụng theo thời hạn ghi trong quyết định xử phạt thì bị thu hồi.","b":"Khoản 7 Điều 81 Luật Đất đai 2024"},{"id":"5.09","g":5,"lv":"TH","q":"Dự án đầu tư chậm tiến độ sử dụng đất 24 tháng so với tiến độ ghi trong dự án thì chủ đầu tư được gia hạn tối đa bao lâu?","o":["Không được gia hạn trong mọi trường hợp","36 tháng, chỉ nộp tiền phạt vi phạm hành chính","24 tháng, phải nộp bổ sung tiền sử dụng đất, tiền thuê đất cho thời gian gia hạn","12 tháng, không phải nộp thêm tiền"],"a":2,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: dự án chậm tiến độ sử dụng đất 24 tháng so với tiến độ ghi trong dự án thì được gia hạn không quá 24 tháng và phải nộp bổ sung cho Nhà nước khoản tiền tương ứng với tiền sử dụng đất, tiền thuê đất cho thời gian gia hạn; hết thời gian gia hạn mà chưa đưa đất vào sử dụng thì bị thu hồi.","b":"Khoản 8 Điều 81 Luật Đất đai 2024"},{"id":"5.10","g":5,"lv":"TH","q":"Trường hợp nào sau đây là thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật?","o":["Đất được giao sai đối tượng, sai thẩm quyền","Người sử dụng đất không thực hiện nghĩa vụ tài chính","Đất bị hủy hoại đã bị xử phạt mà tiếp tục vi phạm","Cá nhân sử dụng đất chết mà không có người thừa kế"],"a":3,"e":"Điểm b khoản 1 Điều 82 Luật Đất đai 2024: thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật khi cá nhân sử dụng đất chết mà không có người thừa kế sau khi đã thực hiện nghĩa vụ về tài sản. Giao đất sai thẩm quyền, không thực hiện nghĩa vụ tài chính, hủy hoại đất là căn cứ thu hồi do vi phạm (Điều 81).","b":"Điểm b khoản 1 Điều 82 Luật Đất đai 2024"},{"id":"5.11","g":5,"lv":"NB","q":"Thời gian nào sau đây KHÔNG được tiến hành cưỡng chế thực hiện quyết định thu hồi đất?","o":["Sau khi quyết định cưỡng chế đã có hiệu lực","Trong 15 ngày trước và sau Tết Âm lịch","Sau khi đã niêm yết quyết định cưỡng chế","Trong giờ hành chính của ngày làm việc"],"a":1,"e":"Khoản 1 Điều 89 Luật Đất đai 2024: không thực hiện cưỡng chế trong khoảng thời gian từ 22 giờ ngày hôm trước đến 06 giờ sáng ngày hôm sau; các ngày nghỉ, ngày lễ theo quy định; trong thời gian 15 ngày trước và sau thời gian nghỉ Tết Âm lịch và các trường hợp đặc biệt khác ảnh hưởng đến an ninh, chính trị, trật tự an toàn xã hội.","b":"Khoản 1 Điều 89 Luật Đất đai 2024"},{"id":"5.12","g":5,"lv":"TH","q":"Điều kiện nào sau đây là một trong các điều kiện bắt buộc để cưỡng chế thực hiện quyết định thu hồi đất?","o":["Tòa án đã có bản án về việc thu hồi đất","Hội đồng nhân dân xã đã biểu quyết thông qua","Quyết định cưỡng chế đã được niêm yết công khai tại trụ sở Ủy ban nhân dân cấp xã hoặc địa điểm sinh hoạt chung của khu dân cư","Người bị cưỡng chế đã đồng ý bằng văn bản"],"a":2,"e":"Khoản 2 Điều 89 Luật Đất đai 2024: cưỡng chế thực hiện quyết định thu hồi đất khi đủ các điều kiện, trong đó có việc quyết định cưỡng chế đã được niêm yết công khai tại trụ sở UBND cấp xã, địa điểm sinh hoạt chung của khu dân cư nơi có đất thu hồi. Không cần sự đồng ý của người bị cưỡng chế, nghị quyết HĐND hay bản án của Tòa án.","b":"Điểm b khoản 2 Điều 89 Luật Đất đai 2024"},{"id":"5.13","g":5,"lv":"TH","q":"Theo nguyên tắc bồi thường, Nhà nước bồi thường về đất cho người có đất thu hồi bằng hình thức ưu tiên nào?","o":["Cấp cổ phần của chủ đầu tư dự án","Trả tiền theo giá thị trường do các bên tự thỏa thuận trong mọi trường hợp","Bố trí nhà ở tái định cư cho mọi trường hợp","Giao đất có cùng mục đích sử dụng với loại đất thu hồi; không có đất thì bồi thường bằng tiền"],"a":3,"e":"Khoản 2 Điều 91 Luật Đất đai 2024: việc bồi thường về đất được thực hiện bằng việc giao đất có cùng mục đích sử dụng với loại đất thu hồi; nếu không có đất để bồi thường thì được bồi thường bằng tiền theo giá đất cụ thể (hoặc bằng đất khác mục đích, nhà ở nếu người có đất có nhu cầu và địa phương có điều kiện).","b":"Khoản 2 Điều 91 Luật Đất đai 2024"},{"id":"5.14","g":5,"lv":"TH","q":"Việc phê duyệt phương án và bố trí tái định cư phải hoàn thành vào thời điểm nào?","o":["Trước khi có quyết định thu hồi đất","Khi dự án hoàn thành, đưa vào sử dụng","Sau khi cưỡng chế thu hồi đất","Trong 12 tháng sau khi có quyết định thu hồi đất"],"a":0,"e":"Khoản 6 Điều 91 Luật Đất đai 2024: việc thu hồi đất ở chỉ được thực hiện sau khi hoàn thành bố trí tái định cư (trừ trường hợp người dân tự nguyện…); việc phê duyệt phương án và bố trí tái định cư phải hoàn thành trước khi có quyết định thu hồi đất.","b":"Khoản 6 Điều 91 Luật Đất đai 2024"},{"id":"5.15","g":5,"lv":"TH","q":"Cá nhân đang sử dụng đất (không phải đất thuê trả tiền hằng năm) bị thu hồi đất được bồi thường về đất khi đáp ứng điều kiện nào?","o":["Có xác nhận sử dụng đất của hàng xóm liền kề","Đã đóng thuế sử dụng đất nông nghiệp ít nhất 05 năm","Đã xây dựng công trình kiên cố trên đất","Có Giấy chứng nhận hoặc có giấy tờ về quyền sử dụng đất làm căn cứ cấp Giấy chứng nhận"],"a":3,"e":"Khoản 1, 2 Điều 95 Luật Đất đai 2024: cá nhân đang sử dụng đất không phải đất thuê trả tiền hằng năm, có Giấy chứng nhận hoặc có quyết định giao đất, cho thuê, hoặc có giấy tờ về quyền sử dụng đất làm căn cứ để cấp Giấy chứng nhận… thì được bồi thường về đất. Công trình kiên cố, thời gian đóng thuế hay xác nhận hàng xóm không phải điều kiện.","b":"Khoản 1, khoản 2 Điều 95 Luật Đất đai 2024"},{"id":"5.16","g":5,"lv":"TH","q":"Người nhận chuyển quyền sử dụng đất hợp pháp nhưng chưa hoàn thành thủ tục đăng ký đất đai, khi bị thu hồi đất thì sao?","o":["Vẫn thuộc trường hợp đủ điều kiện được bồi thường về đất","Chỉ được hỗ trợ bằng 50% giá đất","Người chuyển nhượng được nhận tiền bồi thường","Không được bồi thường vì chưa đăng ký"],"a":0,"e":"Điểm d khoản 2 Điều 95 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất theo quy định của pháp luật từ người có quyền sử dụng đất hợp pháp nhưng chưa hoàn thành thủ tục đăng ký đất đai vẫn thuộc trường hợp đủ điều kiện được bồi thường về đất.","b":"Điểm d khoản 2 Điều 95 Luật Đất đai 2024"},{"id":"5.17","g":5,"lv":"NB","q":"Khoản hỗ trợ nào sau đây thuộc các khoản hỗ trợ khi Nhà nước thu hồi đất theo Điều 108 Luật Đất đai 2024?","o":["Hỗ trợ mua phương tiện đi lại","Hỗ trợ trả nợ vay ngân hàng của người có đất","Hỗ trợ đào tạo, chuyển đổi nghề và tìm kiếm việc làm","Hỗ trợ học phí đại học cho con của người có đất"],"a":2,"e":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024: các khoản hỗ trợ khi Nhà nước thu hồi đất gồm hỗ trợ ổn định đời sống; ổn định sản xuất, kinh doanh; di dời vật nuôi; đào tạo, chuyển đổi nghề và tìm kiếm việc làm; tái định cư… Không có hỗ trợ trả nợ ngân hàng, mua phương tiện hay học phí đại học.","b":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024"},{"id":"5.18","g":5,"lv":"NB","q":"Ngoài các khoản hỗ trợ luật định, cơ quan nào quyết định biện pháp hỗ trợ khác cho từng dự án cụ thể?","o":["Ủy ban Mặt trận Tổ quốc cấp xã","Chủ đầu tư dự án","Bộ Tài chính","Ủy ban nhân dân cấp tỉnh"],"a":3,"e":"Khoản 2 Điều 108 Luật Đất đai 2024: ngoài các khoản hỗ trợ luật định, căn cứ tình hình thực tế tại địa phương, Chủ tịch UBND cấp tỉnh quyết định biện pháp hỗ trợ khác để bảo đảm có chỗ ở, ổn định đời sống, sản xuất và công bằng đối với người có đất thu hồi.","b":"Khoản 2 Điều 108 Luật Đất đai 2024"},{"id":"5.19","g":5,"lv":"NB","q":"Thời hạn trưng dụng đất tối đa là bao lâu kể từ khi quyết định trưng dụng có hiệu lực (ngoài thời chiến, tình trạng khẩn cấp)?","o":["Không giới hạn đến khi hoàn thành mục đích","Không quá 30 ngày, được gia hạn không quá 30 ngày","Không quá 90 ngày, được gia hạn không quá 90 ngày","Không quá 12 tháng"],"a":1,"e":"Khoản 4 Điều 90 Luật Đất đai 2024: thời hạn trưng dụng đất là không quá 30 ngày kể từ khi quyết định trưng dụng có hiệu lực thi hành (trừ thời chiến, tình trạng khẩn cấp); trường hợp hết thời hạn mà mục đích chưa hoàn thành thì được gia hạn nhưng không quá 30 ngày.","b":"Khoản 4 Điều 90 Luật Đất đai 2024"},{"id":"5.20","g":5,"lv":"TH","q":"Trường hợp tiền bồi thường về đất ở không đủ để được giao một suất tái định cư tối thiểu thì người có đất thu hồi được xử lý thế nào?","o":["Phải tự bù phần chênh lệch","Được miễn toàn bộ tiền sử dụng đất tại mọi khu tái định cư","Không được bố trí tái định cư","Được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu"],"a":3,"e":"Khoản 8 Điều 111 Luật Đất đai 2024: trường hợp người có đất thu hồi được bố trí tái định cư mà tiền bồi thường về đất ở không đủ để được giao một suất tái định cư tối thiểu thì được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu.","b":"Khoản 8 Điều 111 Luật Đất đai 2024"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Dự án (1) mở rộng quốc lộ có thuộc trường hợp Nhà nước thu hồi đất vì lợi ích quốc gia, công cộng không?","o":["Chỉ khi các hộ dân đồng ý","Có, công trình giao thông thuộc danh mục trường hợp thu hồi đất","Chỉ khi chủ đầu tư là doanh nghiệp nhà nước","Không, vì quốc lộ do trung ương quản lý"],"a":1,"e":"Khoản 1 Điều 79 Luật Đất đai 2024: xây dựng công trình giao thông (đường bộ, quốc lộ…) thuộc danh mục các trường hợp Nhà nước thu hồi đất vì lợi ích quốc gia, công cộng. Không phụ thuộc chủ đầu tư hay sự đồng ý của các hộ.","b":"Khoản 1 Điều 79 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Dự án (2) xây dựng bệnh viện đa khoa công lập của tỉnh được đánh giá thế nào?","o":["Chỉ được thuê đất của người dân","Không được thu hồi vì không phải công trình quốc phòng","Thuộc trường hợp thu hồi đất vì lợi ích quốc gia, công cộng","Chỉ được thực hiện qua thỏa thuận nhận chuyển nhượng"],"a":2,"e":"Điều 79 Luật Đất đai 2024 bao gồm trường hợp xây dựng công trình y tế do Nhà nước đầu tư (bệnh viện công lập). Dự án (2) thuộc trường hợp thu hồi đất vì lợi ích quốc gia, công cộng.","b":"Điều 79 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Đối với dự án (3) khu nghỉ dưỡng không thuộc danh mục thu hồi đất, Công ty X có thể tiếp cận đất bằng cách nào?","o":["Yêu cầu Hội đồng nhân dân xã thu hồi đất","Tự san lấp và bồi thường sau","Đề nghị Ủy ban nhân dân tỉnh thu hồi đất như dự án công","Thỏa thuận nhận chuyển nhượng, thuê, nhận góp vốn quyền sử dụng đất với người sử dụng đất"],"a":3,"e":"Dự án khu nghỉ dưỡng tư nhân không thuộc Điều 79 nên Nhà nước không thu hồi đất. Công ty X phải thỏa thuận nhận chuyển nhượng, thuê quyền sử dụng đất, nhận góp vốn… với người sử dụng đất (khoản 1 Điều 27, Điều 127 về thỏa thuận nhận quyền sử dụng đất). UBND không thể thu hồi như dự án công.","b":"Điều 79, khoản 1 Điều 27 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"lv":"VD","q":"Ông Lâm có Giấy chứng nhận đối với 1.500 m² đất trồng lúa bị thu hồi cho dự án (1). Ông có được bồi thường về đất không?","o":["Không, đất trồng lúa không được bồi thường","Chỉ được hỗ trợ, không được bồi thường","Có, ông đủ điều kiện được bồi thường về đất","Chỉ được bồi thường tài sản trên đất"],"a":2,"e":"Khoản 1, điểm a khoản 2 Điều 95 Luật Đất đai 2024: ông Lâm có Giấy chứng nhận đối với đất trồng lúa (không phải đất thuê trả tiền hằng năm) nên đủ điều kiện bồi thường về đất, ngoài bồi thường tài sản và các khoản hỗ trợ.","b":"Khoản 1, điểm a khoản 2 Điều 95 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Thông báo thu hồi 2 ha đất nông nghiệp phải được ban hành trước khi có quyết định thu hồi ít nhất bao lâu?","o":["30 ngày","180 ngày","90 ngày","60 ngày"],"a":3,"e":"Theo Nghị quyết 254/2025/QH15 (áp dụng từ 01/01/2026, ưu tiên so với Luật Đất đai), thông báo thu hồi đất nông nghiệp phải ban hành trước khi có quyết định thu hồi ít nhất 60 ngày.","b":"Điều 3 Nghị quyết 254/2025/QH15","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Thông báo thu hồi 5.000 m² đất ở phải được ban hành trước khi có quyết định thu hồi ít nhất bao lâu?","o":["180 ngày","60 ngày","120 ngày","30 ngày"],"a":2,"e":"Theo Nghị quyết 254/2025/QH15, thông báo thu hồi đất phi nông nghiệp (đất ở) phải ban hành trước khi có quyết định thu hồi ít nhất 120 ngày.","b":"Điều 3 Nghị quyết 254/2025/QH15","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Phương án bồi thường của dự án phải niêm yết công khai trong thời hạn bao lâu?","o":["10 ngày","45 ngày","15 ngày","30 ngày"],"a":0,"e":"Nghị quyết 254/2025/QH15 quy định thời hạn niêm yết công khai phương án bồi thường, hỗ trợ, tái định cư là 10 ngày (thay cho 30 ngày tại Luật Đất đai 2024).","b":"Điều 3 Nghị quyết 254/2025/QH15","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"lv":"VD","q":"Với các hộ không đồng ý, việc đối thoại được tổ chức trong thời hạn nào?","o":["Không bắt buộc tổ chức đối thoại","Không quá 30 ngày kể từ ngày lấy ý kiến về phương án","Không quá 90 ngày kể từ ngày có quyết định thu hồi","Chỉ tổ chức sau khi cưỡng chế"],"a":1,"e":"Nghị quyết 254/2025/QH15: trường hợp còn ý kiến không đồng ý về phương án, UBND cấp xã phối hợp với đơn vị bồi thường tổ chức đối thoại trong thời hạn không quá 30 ngày kể từ ngày lấy ý kiến về phương án. Đối thoại là bắt buộc, không tổ chức sau khi cưỡng chế.","b":"Điều 3 Nghị quyết 254/2025/QH15","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"VD","q":"Bà Hoa có Giấy chứng nhận đất ở. Bà có đủ điều kiện được bồi thường về đất không?","o":["Chỉ được hỗ trợ ổn định đời sống","Không, vì đất ở chỉ được tái định cư","Chỉ khi bà không còn chỗ ở khác","Có"],"a":3,"e":"Điểm a khoản 2 Điều 95 Luật Đất đai 2024: người có Giấy chứng nhận đủ điều kiện bồi thường về đất. Bà Hoa có Giấy chứng nhận đất ở nên được bồi thường về đất (bằng đất ở, nhà ở hoặc tiền), không chỉ được hỗ trợ.","b":"Điểm a khoản 2 Điều 95 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"VD","q":"Ông Phúc nhận chuyển nhượng hợp pháp năm 2025 nhưng chưa đăng ký biến động. Ông có được bồi thường về đất không?","o":["Người chuyển nhượng cũ được nhận bồi thường","Không, vì chưa đăng ký biến động","Chỉ được bồi thường 50%","Có, người nhận chuyển quyền hợp pháp chưa đăng ký vẫn đủ điều kiện"],"a":3,"e":"Điểm d khoản 2 Điều 95 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất hợp pháp nhưng chưa hoàn thành thủ tục đăng ký vẫn đủ điều kiện được bồi thường về đất. Ông Phúc là người được bồi thường, không phải người chuyển nhượng cũ.","b":"Điểm d khoản 2 Điều 95 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Công ty Y thuê đất trả tiền hằng năm. Khi bị thu hồi đất, công ty được xử lý thế nào về đất?","o":["Được bồi thường bằng đất thuê ở vị trí khác không thời hạn","Được hoàn lại toàn bộ tiền thuê đất đã nộp từ đầu","Được bồi thường về đất như đất giao có thu tiền","Không thuộc trường hợp được bồi thường về đất theo Điều 95"],"a":3,"e":"Điều 95 Luật Đất đai 2024 chỉ bồi thường về đất cho người sử dụng đất không phải là đất thuê trả tiền thuê đất hằng năm. Công ty Y thuê đất trả tiền hằng năm nên không được bồi thường về đất (có thể được bồi thường chi phí đầu tư vào đất còn lại, tài sản trên đất theo Điều 107).","b":"Điểm a, điểm e khoản 1 Điều 95 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"lv":"VD","q":"Ông Tài tự ý lấn chiếm 200 m² đất công từ năm 2020. Ông có được bồi thường về đất không?","o":["Không, vì không đáp ứng điều kiện được bồi thường về đất","Có, vì đã sử dụng trên 05 năm","Có, nếu đã xây nhà trên đất","Có, nếu không có tranh chấp"],"a":0,"e":"Khoản 2 Điều 95 Luật Đất đai 2024 không bao gồm trường hợp lấn chiếm đất công. Ông Tài không có Giấy chứng nhận, không có giấy tờ, sử dụng đất do vi phạm pháp luật nên không được bồi thường về đất, dù đã sử dụng nhiều năm hay đã xây nhà.","b":"Khoản 2 Điều 95 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.04.1","g":5,"lv":"VD","q":"Bà Liên được bồi thường về đất bằng những hình thức nào?","o":["Chỉ bằng đất nông nghiệp ở địa phương khác","Chỉ bằng cổ phần của khu công nghiệp","Chỉ bằng việc làm tại khu công nghiệp","Bằng đất nông nghiệp, bằng tiền, bằng đất có mục đích khác hoặc nhà ở"],"a":3,"e":"Khoản 1 Điều 96 Luật Đất đai 2024: cá nhân đang sử dụng đất nông nghiệp bị thu hồi được bồi thường bằng đất nông nghiệp hoặc bằng tiền hoặc bằng đất có mục đích sử dụng khác hoặc nhà ở nếu địa phương có điều kiện về quỹ đất, quỹ nhà.","b":"Khoản 1 Điều 96 Luật Đất đai 2024","cid":"TH5.04"},{"id":"TH5.04.2","g":5,"lv":"VD","q":"Địa phương không còn quỹ đất nông nghiệp. Bà Liên được bồi thường thế nào?","o":["Không được bồi thường","Bằng tiền theo giá do chủ đầu tư tự xác định","Chờ đến khi có quỹ đất mới được bồi thường","Bằng tiền theo giá đất cụ thể tại thời điểm phê duyệt phương án"],"a":3,"e":"Khoản 2 Điều 91 Luật Đất đai 2024: không có đất để bồi thường thì người có đất thu hồi được bồi thường bằng tiền theo giá đất cụ thể của loại đất thu hồi do UBND cấp có thẩm quyền quyết định tại thời điểm phê duyệt phương án. Chủ đầu tư không tự xác định giá.","b":"Khoản 2 Điều 91 Luật Đất đai 2024","cid":"TH5.04"},{"id":"TH5.04.3","g":5,"lv":"VD","q":"Diện tích 1,2 ha được giao trong hạn mức có được tính để bồi thường về đất không?","o":["Không, đất giao không thu tiền thì không được bồi thường","Có, diện tích trong hạn mức được bồi thường","Chỉ được tính phần đã có công trình","Chỉ được tính 1 ha"],"a":1,"e":"Điểm a khoản 2 Điều 96 Luật Đất đai 2024: diện tích đất nông nghiệp được giao trong hạn mức (kể cả giao không thu tiền) thuộc diện được bồi thường về đất. Vì vậy 1,2 ha của bà Liên được tính bồi thường toàn bộ.","b":"Điểm a khoản 2 Điều 96 Luật Đất đai 2024","cid":"TH5.04"},{"id":"TH5.04.4","g":5,"lv":"VD","q":"Nguyện vọng được hỗ trợ để chuyển sang nghề khác của bà Liên thuộc khoản hỗ trợ nào?","o":["Hỗ trợ tái định cư","Hỗ trợ tháo dỡ, phá dỡ công trình","Hỗ trợ đào tạo, chuyển đổi nghề và tìm kiếm việc làm","Hỗ trợ di dời vật nuôi"],"a":2,"e":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024: hỗ trợ đào tạo, chuyển đổi nghề và tìm kiếm việc làm áp dụng cho cá nhân trực tiếp sản xuất nông nghiệp bị thu hồi đất nông nghiệp. Đây đúng là nguyện vọng của bà Liên.","b":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024","cid":"TH5.04"},{"id":"TH5.05.1","g":5,"lv":"VD","q":"Gia đình ông Hưng có Giấy chứng nhận đất ở. Hình thức bồi thường về đất có thể áp dụng là gì?","o":["Chỉ bằng tiền theo giá thỏa thuận","Chỉ bằng đất nông nghiệp","Bằng đất ở, nhà ở, tiền hoặc đất có mục đích khác","Chỉ hỗ trợ thuê nhà tạm thời"],"a":2,"e":"Khoản 1 Điều 98 Luật Đất đai 2024: cá nhân có đất ở bị thu hồi đủ điều kiện bồi thường thì được bồi thường bằng đất ở hoặc nhà ở hoặc bằng tiền hoặc bằng đất có mục đích sử dụng khác với loại đất thu hồi (tùy nguyện vọng và quỹ đất, quỹ nhà của địa phương).","b":"Khoản 1 Điều 98 Luật Đất đai 2024","cid":"TH5.05"},{"id":"TH5.05.2","g":5,"lv":"VD","q":"Tiền bồi thường về đất ở của gia đình ông Hưng thấp hơn giá trị một suất tái định cư tối thiểu. Gia đình được xử lý thế nào?","o":["Phải tự bù phần thiếu","Chỉ được nhận tiền, không được tái định cư","Được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu","Được giao đất nông nghiệp thay thế"],"a":2,"e":"Khoản 8 Điều 111 Luật Đất đai 2024: tiền bồi thường về đất ở không đủ để được giao một suất tái định cư tối thiểu thì người có đất được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu. Gia đình ông Hưng không phải tự bù phần thiếu.","b":"Khoản 8 Điều 111 Luật Đất đai 2024","cid":"TH5.05"},{"id":"TH5.05.3","g":5,"lv":"VD","q":"Ngôi nhà ở phải tháo dỡ toàn bộ được bồi thường thế nào?","o":["Không được bồi thường vì là tài sản trên đất","Theo giá do gia đình tự kê khai","Theo giá trị còn lại sau khấu hao","Theo giá trị xây dựng mới của nhà có tiêu chuẩn kỹ thuật tương đương"],"a":3,"e":"Khoản 1 Điều 102 Luật Đất đai 2024: đối với nhà ở, công trình phục vụ sinh hoạt gắn liền với đất phải tháo dỡ toàn bộ, chủ sở hữu được bồi thường bằng giá trị xây dựng mới của nhà ở, công trình có tiêu chuẩn kỹ thuật tương đương. Không tính theo giá trị còn lại sau khấu hao.","b":"Khoản 1 Điều 102 Luật Đất đai 2024","cid":"TH5.05"},{"id":"TH5.05.4","g":5,"lv":"TH","q":"Cơ quan nào quy định chi tiết suất tái định cư tối thiểu?","o":["Ủy ban nhân dân cấp tỉnh","Chủ đầu tư dự án","Quốc hội","Ủy ban nhân dân cấp xã"],"a":0,"e":"Điều 111 Luật Đất đai 2024: UBND cấp tỉnh quy định chi tiết suất tái định cư tối thiểu (về diện tích đất ở, nhà ở) phù hợp với điều kiện của địa phương.","b":"Điều 111 Luật Đất đai 2024","cid":"TH5.05"},{"id":"TH5.06.1","g":5,"lv":"VD","q":"Trường hợp (1) Công ty Z thuê đất hết hạn, không được gia hạn thuộc căn cứ thu hồi nào?","o":["Thu hồi vì lợi ích quốc gia, công cộng","Chấm dứt việc sử dụng đất theo pháp luật","Trưng dụng đất","Vi phạm pháp luật về đất đai"],"a":1,"e":"Điểm c khoản 1 Điều 82 Luật Đất đai 2024: đất được Nhà nước giao, cho thuê có thời hạn mà hết thời hạn sử dụng đất không được gia hạn là trường hợp thu hồi do chấm dứt việc sử dụng đất theo pháp luật, không phải do vi phạm.","b":"Điểm c khoản 1 Điều 82 Luật Đất đai 2024","cid":"TH5.06"},{"id":"TH5.06.2","g":5,"lv":"VD","q":"Trường hợp (2) ông Ba chết không có người thừa kế được xử lý thế nào?","o":["Đất được giữ nguyên chờ người thừa kế xuất hiện trong 30 năm","Ủy ban nhân dân xã được hưởng quyền sử dụng đất như người thừa kế","Hàng xóm liền kề được ưu tiên nhận chuyển nhượng","Nhà nước thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật"],"a":3,"e":"Điểm b khoản 1 Điều 82 Luật Đất đai 2024: cá nhân sử dụng đất chết mà không có người thừa kế sau khi đã thực hiện nghĩa vụ về tài sản thì Nhà nước thu hồi đất do chấm dứt việc sử dụng đất theo pháp luật.","b":"Điểm b khoản 1 Điều 82 Luật Đất đai 2024","cid":"TH5.06"},{"id":"TH5.06.3","g":5,"lv":"VD","q":"Trường hợp (3) bà Năm tự nguyện trả lại đất cần có căn cứ gì để thu hồi?","o":["Bản án của Tòa án","Quyết định xử phạt vi phạm hành chính","Văn bản trả lại đất của người sử dụng đất","Biên bản hòa giải tại xã"],"a":2,"e":"Khoản 2 và điểm e khoản 5 Điều 82 Luật Đất đai 2024: người sử dụng đất tự nguyện trả lại đất thì căn cứ để thu hồi là văn bản trả lại đất của người sử dụng đất. Không cần quyết định xử phạt hay bản án.","b":"Khoản 2, điểm e khoản 5 Điều 82 Luật Đất đai 2024","cid":"TH5.06"},{"id":"TH5.06.4","g":5,"lv":"VD","q":"Trường hợp (4) khu dân cư có nguy cơ sạt lở đe dọa tính mạng thuộc căn cứ thu hồi nào?","o":["Thu hồi do vi phạm pháp luật về đất đai","Thu hồi để thực hiện dự án đầu tư","Thu hồi do không thực hiện nghĩa vụ tài chính","Thu hồi đất có nguy cơ đe dọa tính mạng con người"],"a":3,"e":"Điểm b khoản 3 Điều 82 Luật Đất đai 2024: đất có nguy cơ sạt lở, sụt lún… đe dọa tính mạng con người thì Nhà nước thu hồi đất (sau khi có văn bản xác định của cơ quan có thẩm quyền), thuộc nhóm thu hồi do chấm dứt việc sử dụng đất theo pháp luật/có nguy cơ đe dọa tính mạng.","b":"Điểm b khoản 3 Điều 82 Luật Đất đai 2024","cid":"TH5.06"},{"id":"TH5.07.1","g":5,"lv":"VD","q":"Việc dự kiến cưỡng chế vào ngày mùng 5 Tết Âm lịch có đúng pháp luật không?","o":["Hợp pháp vì quyết định cưỡng chế đã có hiệu lực","Được phép nếu có lực lượng công an hỗ trợ","Không, không được cưỡng chế trong 15 ngày trước và sau Tết Âm lịch","Hợp lệ khi ông Toàn đã được thông báo trước"],"a":2,"e":"Khoản 1 Điều 89 Luật Đất đai 2024: không thực hiện cưỡng chế trong thời gian 15 ngày trước và sau thời gian nghỉ Tết Âm lịch. Ngày mùng 5 Tết nằm trong khoảng thời gian cấm, dù quyết định đã có hiệu lực hay có lực lượng hỗ trợ.","b":"Khoản 1 Điều 89 Luật Đất đai 2024","cid":"TH5.07"},{"id":"TH5.07.2","g":5,"lv":"VD","q":"Việc bắt đầu cưỡng chế lúc 5 giờ sáng vi phạm nguyên tắc nào?","o":["Phải bắt đầu sau 08 giờ sáng ngày Chủ nhật","Pháp luật không quy định về giờ cưỡng chế","Việc cưỡng chế chỉ được làm vào thứ Bảy","Không cưỡng chế từ 22 giờ ngày hôm trước đến 06 giờ sáng ngày hôm sau"],"a":3,"e":"Khoản 1 Điều 89 Luật Đất đai 2024: không thực hiện cưỡng chế trong khoảng thời gian từ 22 giờ ngày hôm trước đến 06 giờ sáng ngày hôm sau. Bắt đầu lúc 5 giờ sáng là vi phạm.","b":"Khoản 1 Điều 89 Luật Đất đai 2024","cid":"TH5.07"},{"id":"TH5.07.3","g":5,"lv":"VD","q":"Điều kiện nào sau đây phải đáp ứng trước khi cưỡng chế ông Toàn?","o":["Đã có bản án của Tòa án về thu hồi đất","Đã có ý kiến đồng ý của Hội đồng nhân dân tỉnh","Ông Toàn đã nhận được quyết định cưỡng chế có hiệu lực, hoặc có biên bản về việc từ chối nhận hay vắng mặt","Ông Toàn đã ký biên bản đồng ý cưỡng chế"],"a":2,"e":"Điểm d khoản 2 Điều 89 Luật Đất đai 2024: một điều kiện cưỡng chế là người có đất thu hồi đã nhận được quyết định cưỡng chế có hiệu lực thi hành; trường hợp từ chối nhận hoặc vắng mặt thì UBND cấp xã lập biên bản. Không cần bản án hay sự đồng ý của người bị cưỡng chế.","b":"Điểm d khoản 2 Điều 89 Luật Đất đai 2024","cid":"TH5.07"},{"id":"TH5.07.4","g":5,"lv":"VD","q":"Nếu tại buổi cưỡng chế ông Toàn tự nguyện chấp hành thì phải bàn giao đất chậm nhất khi nào?","o":["90 ngày kể từ ngày lập biên bản","Sau Tết Âm lịch","Ngay trong ngày","30 ngày kể từ ngày lập biên bản"],"a":3,"e":"Khoản 4 Điều 89 Luật Đất đai 2024: trường hợp người bị cưỡng chế chấp hành quyết định cưỡng chế thì Ban thực hiện cưỡng chế lập biên bản ghi nhận và việc bàn giao đất được thực hiện chậm nhất sau 30 ngày kể từ ngày lập biên bản.","b":"Khoản 4 Điều 89 Luật Đất đai 2024","cid":"TH5.07"},{"id":"TH5.08.1","g":5,"lv":"VD","q":"Việc Chủ tịch Ủy ban nhân dân tỉnh K quyết định trưng dụng bằng lời nói có hợp pháp không?","o":["Hợp pháp, không cần xác nhận bằng văn bản","Hợp pháp trong trường hợp khẩn cấp, nhưng phải viết giấy xác nhận và xác nhận bằng văn bản trong 48 giờ","Không hợp pháp, quyết định trưng dụng luôn phải bằng văn bản ngay","Chỉ hợp pháp nếu Hội đồng nhân dân tỉnh đồng ý"],"a":1,"e":"Khoản 2 Điều 90 Luật Đất đai 2024: quyết định trưng dụng đất phải bằng văn bản; trường hợp khẩn cấp không thể ra quyết định bằng văn bản thì người có thẩm quyền được quyết định bằng lời nói nhưng phải viết giấy xác nhận việc quyết định trưng dụng ngay tại thời điểm trưng dụng và trong 48 giờ phải xác nhận bằng văn bản.","b":"Khoản 2 Điều 90 Luật Đất đai 2024","cid":"TH5.08"},{"id":"TH5.08.2","g":5,"lv":"VD","q":"Thời hạn trưng dụng 3 ha đất được tính thế nào trong tình trạng khẩn cấp?","o":["Đến không quá 30 ngày kể từ khi bãi bỏ tình trạng khẩn cấp","Tối đa 07 ngày","Không giới hạn","Tối đa 12 tháng"],"a":0,"e":"Khoản 4 Điều 90 Luật Đất đai 2024: trong tình trạng khẩn cấp, thời hạn trưng dụng đất tính từ ngày ra quyết định đến không quá 30 ngày kể từ ngày bãi bỏ tình trạng khẩn cấp.","b":"Khoản 4 Điều 90 Luật Đất đai 2024","cid":"TH5.08"},{"id":"TH5.08.3","g":5,"lv":"VD","q":"Phần mặt đất bị hư hỏng nặng do trưng dụng được bồi thường theo cách nào?","o":["Bằng giao đất khác cùng diện tích","Không bồi thường vì là trưng dụng","Theo bảng giá đất của tỉnh","Bằng tiền theo giá chuyển nhượng quyền sử dụng đất trên thị trường tại thời điểm thanh toán"],"a":3,"e":"Khoản 7 Điều 90 Luật Đất đai 2024: trường hợp đất bị hủy hoại khi trưng dụng thì việc bồi thường được thực hiện bằng tiền theo giá chuyển nhượng quyền sử dụng đất trên thị trường tại thời điểm thanh toán; thiệt hại về thu nhập (hoa màu) cũng được bồi thường.","b":"Khoản 7 Điều 90 Luật Đất đai 2024","cid":"TH5.08"},{"id":"TH5.08.4","g":5,"lv":"VD","q":"Tiền bồi thường thiệt hại do trưng dụng được chi trả thế nào?","o":["Chủ đầu tư dự án chi trả theo tiến độ","Do quỹ phòng chống thiên tai cấp xã chi trả dần","Ngân sách nhà nước chi trả một lần, trực tiếp trong 30 ngày kể từ ngày hoàn trả đất","Chi trả bằng trái phiếu chính phủ trong 05 năm"],"a":2,"e":"Khoản 7 Điều 90 Luật Đất đai 2024: tiền bồi thường thiệt hại do trưng dụng đất được ngân sách nhà nước chi trả một lần, trực tiếp cho người có đất trưng dụng trong thời hạn 30 ngày kể từ ngày hoàn trả đất.","b":"Khoản 7 Điều 90 Luật Đất đai 2024","cid":"TH5.08"},{"id":"TH5.09.1","g":5,"lv":"VD","q":"Theo Nghị quyết 254/2025/QH15, phần diện tích còn lại của dự án có thể bị Nhà nước thu hồi khi nào?","o":["Khi chủ đầu tư thỏa thuận được trên 50% diện tích","Khi đã thỏa thuận được trên 75% diện tích và trên 75% số người sử dụng đất, và được Hội đồng nhân dân cấp tỉnh xem xét, thông qua","Ngay khi hết thời hạn thực hiện thỏa thuận","Không được thu hồi trong mọi trường hợp"],"a":1,"e":"Nghị quyết 254/2025/QH15: dự án thuộc trường hợp thỏa thuận nhận quyền sử dụng đất mà hết thời hạn thực hiện thỏa thuận, nếu nhà đầu tư đã thỏa thuận được trên 75% diện tích đất và trên 75% số người sử dụng đất thì HĐND cấp tỉnh xem xét, thông qua việc thu hồi phần diện tích còn lại để giao, cho thuê cho nhà đầu tư.","b":"Điều 3 Nghị quyết 254/2025/QH15","cid":"TH5.09"},{"id":"TH5.09.2","g":5,"lv":"VD","q":"Công ty Phúc An đã thỏa thuận được 80% diện tích và 80% số người sử dụng đất. Đề nghị thu hồi phần còn lại được đánh giá thế nào?","o":["Ngưỡng bắt buộc là trên 90%","Chưa đủ vì phải đạt 100%","Đáp ứng ngưỡng trên 75% để được xem xét thu hồi phần còn lại","Không liên quan vì đây là dự án tư nhân"],"a":2,"e":"Công ty Phúc An đã thỏa thuận được 80% diện tích và 80% số người sử dụng đất – vượt ngưỡng 75% của Nghị quyết 254/2025/QH15 – nên có thể được HĐND tỉnh xem xét thông qua việc thu hồi phần còn lại. Không đòi hỏi 100% hay 90%.","b":"Điều 3 Nghị quyết 254/2025/QH15","cid":"TH5.09"},{"id":"TH5.09.3","g":5,"lv":"TH","q":"Khi Nghị quyết 254/2025/QH15 và Luật Đất đai quy định khác nhau về cùng một vấn đề thì áp dụng văn bản nào?","o":["Văn bản nào có lợi hơn cho chủ đầu tư","Nghị quyết 254/2025/QH15","Luật Đất đai 2024","Nghị định hướng dẫn của Chính phủ"],"a":1,"e":"Nghị quyết 254/2025/QH15 là văn bản của Quốc hội quy định cơ chế đặc thù tháo gỡ vướng mắc thi hành Luật Đất đai; Nghị quyết xác định trường hợp có quy định khác nhau về cùng một vấn đề giữa Nghị quyết và Luật Đất đai thì áp dụng Nghị quyết này.","b":"Nghị quyết 254/2025/QH15","cid":"TH5.09"},{"id":"TH5.09.4","g":5,"lv":"NB","q":"Nghị quyết 254/2025/QH15 có hiệu lực thi hành (nguyên tắc chung) từ ngày nào?","o":["01/01/2026","01/3/2027","01/7/2025","01/8/2024"],"a":0,"e":"Nghị quyết 254/2025/QH15 được Quốc hội thông qua ngày 11/12/2025, có hiệu lực thi hành từ ngày 01/01/2026 (một số quy định có thời hạn áp dụng riêng). Luật Đất đai 2024 có hiệu lực 01/8/2024.","b":"Nghị quyết 254/2025/QH15","cid":"TH5.09"},{"id":"TH5.10.1","g":5,"lv":"VD","q":"Việc bố trí tái định cư tại khu đất chưa có đường, điện, nước có phù hợp nguyên tắc không?","o":["Hợp lý vì người dân tự đầu tư hạ tầng","Chấp nhận được nếu Nhà nước cam kết hoàn thiện trong 05 năm","Được phép khi các hộ nhận thêm tiền hỗ trợ","Không, khu tái định cư phải có hạ tầng kỹ thuật, hạ tầng xã hội đồng bộ theo quy hoạch chi tiết đã được phê duyệt"],"a":3,"e":"Khoản 5 Điều 91 Luật Đất đai 2024: khu tái định cư phải hoàn thiện các điều kiện về hạ tầng kỹ thuật, hạ tầng xã hội đồng bộ theo quy hoạch chi tiết được cấp có thẩm quyền phê duyệt, phù hợp với truyền thống văn hóa, phong tục tập quán. Khu đất chưa có đường, điện, nước không đáp ứng.","b":"Khoản 5 Điều 91 Luật Đất đai 2024","cid":"TH5.10"},{"id":"TH5.10.2","g":5,"lv":"VD","q":"Các hộ muốn nhận tiền để tự lo chỗ ở thay vì nhận đất tái định cư thì sao?","o":["Không được nhận bất kỳ khoản nào","Phải chuyển nhượng suất tái định cư cho người khác","Được bồi thường bằng tiền theo nguyện vọng đã đăng ký","Bắt buộc nhận đất tái định cư"],"a":2,"e":"Khoản 2 Điều 91 Luật Đất đai 2024: người có đất thu hồi nếu có nhu cầu được bồi thường bằng tiền thì được bồi thường bằng tiền theo nguyện vọng đã đăng ký khi lập phương án. Họ không bắt buộc nhận đất tái định cư.","b":"Khoản 2 Điều 91 Luật Đất đai 2024","cid":"TH5.10"},{"id":"TH5.10.3","g":5,"lv":"VD","q":"Phương án bố trí tái định cư dự kiến phải được niêm yết công khai ít nhất bao lâu?","o":["30 ngày","05 ngày","15 ngày","60 ngày"],"a":2,"e":"Khoản 1 Điều 111 Luật Đất đai 2024: phương án bố trí tái định cư phải được niêm yết công khai ít nhất 15 ngày tại trụ sở UBND cấp xã, địa điểm sinh hoạt chung của khu dân cư nơi có đất thu hồi và nơi tái định cư trước khi trình phê duyệt.","b":"Khoản 1 Điều 111 Luật Đất đai 2024","cid":"TH5.10"},{"id":"TH5.10.4","g":5,"lv":"VD","q":"Giá đất tính tiền sử dụng đất tại nơi tái định cư được xác định thế nào?","o":["Do các hộ thỏa thuận với chủ đầu tư","Theo bảng giá đất tại thời điểm phê duyệt phương án","Theo giá thị trường tại thời điểm bàn giao đất","Theo giá đấu giá quyền sử dụng đất"],"a":1,"e":"Khoản 3 Điều 111 Luật Đất đai 2024: giá đất tính tiền sử dụng đất tại nơi tái định cư là giá đất được xác định theo bảng giá đất tại thời điểm phê duyệt phương án bồi thường, hỗ trợ, tái định cư. Không theo giá thị trường hay thỏa thuận.","b":"Khoản 3 Điều 111 Luật Đất đai 2024","cid":"TH5.10"},{"id":"6.01","g":6,"lv":"NB","q":"Trước khi cơ quan nhà nước có thẩm quyền giải quyết tranh chấp đất đai theo Điều 236 Luật Đất đai 2024, các bên phải thực hiện thủ tục gì?","o":["Thỏa thuận trước Ủy ban Mặt trận Tổ quốc cấp tỉnh","Công chứng biên bản thỏa thuận","Hòa giải tại Tòa án nhân dân","Hòa giải tại Ủy ban nhân dân cấp xã nơi có đất tranh chấp"],"a":3,"e":"Khoản 2 Điều 235 Luật Đất đai 2024: trước khi cơ quan có thẩm quyền giải quyết tranh chấp đất đai theo Điều 236, các bên tranh chấp phải thực hiện hòa giải tại UBND cấp xã nơi có đất tranh chấp. Đây là thủ tục bắt buộc.","b":"Khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.02","g":6,"lv":"NB","q":"Ai thành lập Hội đồng hòa giải tranh chấp đất đai cấp xã?","o":["Chủ tịch Ủy ban Mặt trận Tổ quốc cấp xã","Chủ tịch Ủy ban nhân dân cấp xã","Chủ tịch Hội đồng nhân dân cấp xã","Chánh án Tòa án nhân dân khu vực"],"a":1,"e":"Điểm a khoản 2 Điều 235 Luật Đất đai 2024: Chủ tịch UBND cấp xã có trách nhiệm thành lập Hội đồng hòa giải tranh chấp đất đai để thực hiện hòa giải tranh chấp đất đai tại địa phương.","b":"Điểm a khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.03","g":6,"lv":"NB","q":"Thành phần nào sau đây có trong Hội đồng hòa giải tranh chấp đất đai cấp xã?","o":["Thẩm phán Tòa án nhân dân","Kiểm sát viên Viện kiểm sát","Công chứng viên","Đại diện Ủy ban Mặt trận Tổ quốc cấp xã"],"a":3,"e":"Điểm b khoản 2 Điều 235 Luật Đất đai 2024: thành phần Hội đồng hòa giải gồm Chủ tịch hoặc Phó Chủ tịch UBND cấp xã là Chủ tịch Hội đồng; đại diện Ủy ban Mặt trận Tổ quốc cấp xã; công chức làm công tác địa chính; người sinh sống lâu năm biết rõ nguồn gốc, quá trình sử dụng thửa đất… Không có công chứng viên, thẩm phán, kiểm sát viên.","b":"Điểm b khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.04","g":6,"lv":"NB","q":"Thời hạn hòa giải tranh chấp đất đai tại Ủy ban nhân dân cấp xã là bao lâu?","o":["Không quá 45 ngày kể từ ngày nhận đơn","Không quá 30 ngày kể từ ngày nhận được đơn yêu cầu hòa giải","Không quá 60 ngày kể từ ngày nhận đơn","Không quá 15 ngày kể từ ngày nhận đơn"],"a":1,"e":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024: việc hòa giải tại UBND cấp xã được thực hiện trong thời hạn không quá 30 ngày kể từ ngày nhận được đơn yêu cầu giải quyết tranh chấp đất đai.","b":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.05","g":6,"lv":"NB","q":"Việc hòa giải tranh chấp đất đai tại cấp xã phải được thể hiện bằng hình thức nào?","o":["Biên bản có chữ ký của các bên và xác nhận hòa giải thành hoặc không thành của Ủy ban nhân dân cấp xã","Quyết định hành chính của Chủ tịch Ủy ban nhân dân xã","Bản án của Tòa án","Văn bản công chứng thỏa thuận"],"a":0,"e":"Điểm d khoản 2 Điều 235 Luật Đất đai 2024: việc hòa giải phải được lập thành biên bản có chữ ký của các bên và có xác nhận hòa giải thành hoặc hòa giải không thành của UBND cấp xã; biên bản được gửi cho các bên và lưu tại UBND cấp xã.","b":"Điểm d khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.06","g":6,"lv":"TH","q":"Trường hợp một bên không ký biên bản hòa giải tranh chấp đất đai thì xử lý thế nào?","o":["Biên bản không có giá trị, phải hòa giải lại từ đầu","Chủ tịch và các thành viên Hội đồng hòa giải ký, đóng dấu Ủy ban nhân dân cấp xã và gửi cho các bên","Xã chuyển ngay hồ sơ sang Tòa án","Bên không ký bị xử phạt vi phạm hành chính"],"a":1,"e":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024: trường hợp hòa giải không thành hoặc một trong các bên không ký vào biên bản thì Chủ tịch Hội đồng, các thành viên Hội đồng hòa giải tranh chấp đất đai ký, đóng dấu của UBND cấp xã và gửi cho các bên tranh chấp. Biên bản vẫn có giá trị để các bên tiếp tục yêu cầu giải quyết.","b":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024"},{"id":"6.07","g":6,"lv":"NB","q":"Tranh chấp đất đai mà một trong các bên có Giấy chứng nhận thuộc thẩm quyền giải quyết của cơ quan nào?","o":["Ủy ban Mặt trận Tổ quốc cấp xã","Tòa án nhân dân","Chủ tịch Ủy ban nhân dân cấp tỉnh","Thanh tra tỉnh"],"a":1,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: tranh chấp đất đai mà các bên hoặc một trong các bên tranh chấp có Giấy chứng nhận hoặc có một trong các loại giấy tờ quy định tại Điều 137 và tranh chấp về tài sản gắn liền với đất thì do Tòa án giải quyết.","b":"Khoản 1 Điều 236 Luật Đất đai 2024"},{"id":"6.08","g":6,"lv":"NB","q":"Tranh chấp về tài sản gắn liền với đất thuộc thẩm quyền giải quyết của cơ quan nào?","o":["Ủy ban nhân dân cấp xã","Tòa án nhân dân","Văn phòng đăng ký đất đai","Hội đồng nhân dân cấp tỉnh"],"a":1,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: tranh chấp về tài sản gắn liền với đất do Tòa án giải quyết (cùng với tranh chấp đất đai mà có Giấy chứng nhận hoặc giấy tờ theo Điều 137).","b":"Khoản 1 Điều 236 Luật Đất đai 2024"},{"id":"6.09","g":6,"lv":"TH","q":"Tranh chấp đất đai mà các bên đều không có Giấy chứng nhận hoặc giấy tờ theo Điều 137 thì được giải quyết thế nào?","o":["Bắt buộc giải quyết tại Ủy ban nhân dân cấp tỉnh","Các bên được lựa chọn nộp đơn tại Ủy ban nhân dân cấp có thẩm quyền hoặc khởi kiện tại Tòa án","Bắt buộc giải quyết tại Tòa án","Không được giải quyết cho đến khi được cấp Giấy chứng nhận"],"a":1,"e":"Khoản 2 Điều 236 Luật Đất đai 2024: tranh chấp đất đai mà các bên đều không có Giấy chứng nhận hoặc giấy tờ theo Điều 137 thì các bên chỉ được lựa chọn một trong hai hình thức: nộp đơn yêu cầu giải quyết tại UBND cấp có thẩm quyền hoặc khởi kiện tại Tòa án theo pháp luật tố tụng dân sự.","b":"Khoản 2 Điều 236 Luật Đất đai 2024"},{"id":"6.10","g":6,"lv":"NB","q":"Theo Luật Đất đai 2024, \"tranh chấp đất đai\" được hiểu là gì?","o":["Tranh chấp về quyền, nghĩa vụ của người sử dụng đất giữa hai hoặc nhiều bên trong quan hệ đất đai","Tranh chấp về hợp đồng vay tiền có thế chấp nhà","Mọi bất đồng giữa người dân và cơ quan nhà nước về quyết định hành chính","Khiếu nại về giá đất trong bảng giá đất"],"a":0,"e":"Khoản 47 Điều 3 Luật Đất đai 2024: tranh chấp đất đai là tranh chấp về quyền, nghĩa vụ của người sử dụng đất giữa hai hoặc nhiều bên trong quan hệ đất đai. Khiếu nại quyết định hành chính, tranh chấp hợp đồng vay có thế chấp là các loại việc khác.","b":"Điều 3 Luật Đất đai 2024"},{"id":"6.11","g":6,"lv":"NB","q":"Người sử dụng đất không đồng ý với quyết định hành chính về đất đai có quyền gì?","o":["Tự ý không chấp hành mà không cần thủ tục","Khiếu nại, khởi kiện quyết định hành chính đó","Yêu cầu Ủy ban Mặt trận Tổ quốc hủy quyết định","Yêu cầu Hội đồng hòa giải cấp xã sửa quyết định"],"a":1,"e":"Khoản 8 Điều 26 và Điều 237 Luật Đất đai 2024: người sử dụng đất có quyền khiếu nại, khởi kiện quyết định hành chính, hành vi hành chính về đất đai; việc giải quyết theo pháp luật về khiếu nại và tố tụng hành chính. Không được tự ý không chấp hành; Mặt trận, Hội đồng hòa giải không có quyền hủy, sửa quyết định.","b":"Khoản 8 Điều 26, Điều 237 Luật Đất đai 2024"},{"id":"6.12","g":6,"lv":"TH","q":"Người có hành vi vi phạm pháp luật về đất đai bị xử lý theo hình thức nào?","o":["Chỉ bị xử phạt vi phạm hành chính","Tùy tính chất, mức độ: xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự; gây thiệt hại thì bồi thường","Chỉ bị nhắc nhở lần đầu","Chỉ bị thu hồi Giấy chứng nhận"],"a":1,"e":"Điều 239 Luật Đất đai 2024: người có hành vi vi phạm pháp luật về đất đai thì tùy theo tính chất, mức độ vi phạm mà bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự; nếu gây thiệt hại thì phải bồi thường theo quy định của pháp luật.","b":"Điều 239 Luật Đất đai 2024"},{"id":"6.13","g":6,"lv":"TH","q":"Trường hợp nào sau đây Nhà nước thu hồi đất do vi phạm pháp luật về đất đai?","o":["Đất thuê hết hạn không được gia hạn","Đất có nguy cơ sạt lở đe dọa tính mạng","Đất được Nhà nước giao để quản lý mà để bị lấn, chiếm","Người sử dụng đất tự nguyện trả lại đất"],"a":2,"e":"Khoản 5 Điều 81 Luật Đất đai 2024: đất được Nhà nước giao để quản lý mà để bị lấn đất, chiếm đất là căn cứ thu hồi do vi phạm pháp luật về đất đai. Tự nguyện trả lại đất, hết hạn thuê, nguy cơ sạt lở thuộc các nhóm căn cứ khác (Điều 82).","b":"Khoản 5 Điều 81 Luật Đất đai 2024"},{"id":"6.14","g":6,"lv":"TH","q":"Đất được giao, cho thuê không đúng đối tượng hoặc không đúng thẩm quyền thì bị xử lý thế nào?","o":["Được cấp Giấy chứng nhận theo hiện trạng","Chỉ phải nộp bổ sung tiền sử dụng đất","Thuộc trường hợp Nhà nước thu hồi đất do vi phạm pháp luật về đất đai","Được giữ nguyên quyền sử dụng đất nếu đã sử dụng ổn định"],"a":2,"e":"Khoản 3 Điều 81 Luật Đất đai 2024: đất được giao, cho thuê không đúng đối tượng hoặc không đúng thẩm quyền là căn cứ Nhà nước thu hồi đất do vi phạm pháp luật về đất đai. Việc đã sử dụng ổn định hay nộp bổ sung tiền không hợp thức hóa được.","b":"Khoản 3 Điều 81 Luật Đất đai 2024"},{"id":"6.15","g":6,"lv":"TH","q":"Đất nhận chuyển nhượng từ người được giao đất mà người đó không được chuyển nhượng theo quy định thì bị xử lý thế nào?","o":["Hợp đồng được công nhận nếu đã công chứng","Chỉ bị phạt tiền, không thu hồi đất","Bên nhận chuyển nhượng được cấp Giấy chứng nhận nếu đã trả đủ tiền","Nhà nước thu hồi đất do vi phạm pháp luật về đất đai"],"a":3,"e":"Khoản 4 Điều 81 Luật Đất đai 2024: đất nhận chuyển nhượng, nhận tặng cho từ người được Nhà nước giao đất, cho thuê đất mà người đó không được chuyển nhượng, tặng cho theo quy định thì bị thu hồi do vi phạm pháp luật về đất đai. Công chứng hay trả đủ tiền không làm giao dịch hợp pháp.","b":"Khoản 4 Điều 81 Luật Đất đai 2024"},{"id":"6.16","g":6,"lv":"TH","q":"Người sử dụng đất không thực hiện nghĩa vụ tài chính với Nhà nước (không có sự kiện bất khả kháng) thì có thể bị xử lý thế nào?","o":["Được miễn nghĩa vụ sau 05 năm","Bị thu hồi đất do vi phạm pháp luật về đất đai","Được chuyển nghĩa vụ cho người thừa kế mà không bị xử lý","Chỉ bị nhắc nhở bằng văn bản"],"a":1,"e":"Khoản 6, khoản 9 Điều 81 Luật Đất đai 2024: người sử dụng đất không thực hiện nghĩa vụ tài chính với Nhà nước (đã bị xử phạt mà không chấp hành) thì bị thu hồi đất do vi phạm, trừ trường hợp có sự kiện bất khả kháng. Nghĩa vụ không tự động được miễn hay chuyển cho người thừa kế.","b":"Khoản 6, khoản 9 Điều 81 Luật Đất đai 2024"},{"id":"6.17","g":6,"lv":"TH","q":"Dự án đầu tư hết thời gian được gia hạn mà vẫn chưa đưa đất vào sử dụng thì hậu quả pháp lý là gì?","o":["Được chuyển nhượng dự án cho nhà đầu tư khác không cần điều kiện","Được gia hạn tiếp 24 tháng","Được bồi thường toàn bộ chi phí đầu tư","Nhà nước thu hồi đất, không bồi thường về đất, tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại"],"a":3,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: hết thời hạn được gia hạn mà chủ đầu tư vẫn chưa đưa đất vào sử dụng thì Nhà nước thu hồi đất mà không bồi thường về đất, tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại (trừ trường hợp bất khả kháng).","b":"Khoản 8 Điều 81 Luật Đất đai 2024"},{"id":"6.18","g":6,"lv":"NB","q":"Hành vi nào sau đây của người có chức vụ, quyền hạn bị nghiêm cấm trong lĩnh vực đất đai?","o":["Hòa giải tranh chấp đất đai theo đơn yêu cầu","Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật trong quản lý đất đai","Tiếp nhận hồ sơ đăng ký đất đai đúng thời hạn","Công khai quy hoạch sử dụng đất đã được phê duyệt"],"a":1,"e":"Khoản 4 Điều 11 Luật Đất đai 2024 nghiêm cấm lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật trong quản lý đất đai. Hòa giải, tiếp nhận hồ sơ đúng hạn, công khai quy hoạch là nhiệm vụ đúng pháp luật.","b":"Khoản 4 Điều 11 Luật Đất đai 2024"},{"id":"6.19","g":6,"lv":"NB","q":"Hành vi cố ý cung cấp thông tin về đất đai không chính xác, không đáp ứng yêu cầu về thời hạn được Luật Đất đai 2024 xác định là gì?","o":["Hành vi chỉ bị xử lý khi có người khiếu nại","Vi phạm đạo đức nghề nghiệp, không phải vi phạm pháp luật","Hành vi được phép nếu thông tin chưa được phê duyệt","Hành vi bị nghiêm cấm"],"a":3,"e":"Khoản 5 Điều 11 Luật Đất đai 2024 nghiêm cấm không cung cấp hoặc cung cấp thông tin về đất đai không chính xác, không đáp ứng yêu cầu về thời hạn theo quy định của pháp luật. Đây là vi phạm pháp luật, không chỉ vi phạm đạo đức.","b":"Khoản 5 Điều 11 Luật Đất đai 2024"},{"id":"6.20","g":6,"lv":"TH","q":"Các trường hợp thu hồi đất do không thực hiện nghĩa vụ tài chính, không sử dụng đất hoặc chậm tiến độ không áp dụng khi nào?","o":["Khi dự án có vốn đầu tư nước ngoài","Khi có sự kiện bất khả kháng","Khi người sử dụng đất là tổ chức kinh tế nhà nước","Khi đất đã có Giấy chứng nhận"],"a":1,"e":"Khoản 9 Điều 81 Luật Đất đai 2024: các trường hợp thu hồi do không thực hiện nghĩa vụ tài chính, không sử dụng đất, chậm tiến độ (khoản 6, 7, 8) không áp dụng đối với trường hợp có sự kiện bất khả kháng. Loại hình doanh nghiệp hay việc có Giấy chứng nhận không phải căn cứ loại trừ.","b":"Khoản 9 Điều 81 Luật Đất đai 2024"},{"id":"TH6.01.1","g":6,"lv":"VD","q":"Bà Dung nộp đơn ngày 10/4/2026. Việc hòa giải phải hoàn thành chậm nhất trong thời hạn nào?","o":["Không quá 30 ngày kể từ ngày nhận đơn, tức là chậm nhất ngày 10/5/2026","Không quá 60 ngày kể từ ngày nhận đơn","Không quá 90 ngày kể từ ngày nhận đơn","Không có thời hạn"],"a":0,"e":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024: hòa giải tại UBND cấp xã thực hiện trong thời hạn không quá 30 ngày kể từ ngày nhận được đơn. Đơn nộp ngày 10/4/2026 thì hạn chót là ngày 10/5/2026.","b":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"VD","q":"Đến ngày 25/5/2026 xã vẫn chưa hòa giải. Việc này được đánh giá thế nào?","o":["Vi phạm thời hạn hòa giải không quá 30 ngày","Chưa vi phạm vì chưa có ý kiến của ông Khải","Không vi phạm vì hòa giải không bắt buộc","Hợp pháp vì xã còn 60 ngày"],"a":0,"e":"Đến ngày 25/5/2026 đã quá thời hạn 30 ngày kể từ ngày nhận đơn (hạn chót 10/5/2026) nên UBND xã vi phạm điểm c khoản 2 Điều 235 Luật Đất đai 2024. Hòa giải là thủ tục bắt buộc và thời hạn không phụ thuộc ý kiến của ông Khải.","b":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Ông Khải không ký biên bản hòa giải. Biên bản được xử lý thế nào?","o":["Xã ra quyết định xử phạt ông Khải","Biên bản chỉ có giá trị đối với bà Dung","Biên bản vô hiệu, phải hòa giải lại","Chủ tịch và các thành viên Hội đồng hòa giải ký, đóng dấu Ủy ban nhân dân xã và gửi cho các bên"],"a":3,"e":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024: trường hợp một bên không ký biên bản thì Chủ tịch, các thành viên Hội đồng hòa giải ký, đóng dấu UBND cấp xã và gửi cho các bên. Biên bản vẫn có giá trị; không xử phạt người không ký.","b":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"lv":"VD","q":"Hòa giải không thành, cả hai bên đều có Giấy chứng nhận. Tranh chấp do cơ quan nào giải quyết?","o":["Chủ tịch Ủy ban nhân dân tỉnh","Văn phòng đăng ký đất đai","Hội đồng hòa giải xã ra quyết định cuối cùng","Tòa án nhân dân"],"a":3,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: tranh chấp mà các bên hoặc một bên có Giấy chứng nhận do Tòa án giải quyết. Hai bên đều có Giấy chứng nhận nên sau hòa giải không thành, tranh chấp thuộc thẩm quyền Tòa án; Hội đồng hòa giải không ra quyết định giải quyết.","b":"Khoản 1 Điều 236 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"VD","q":"Bà Thơm có Giấy chứng nhận, ông Bằng không có giấy tờ. Tranh chấp thuộc thẩm quyền của cơ quan nào?","o":["Các bên tự chọn Ủy ban nhân dân hoặc Tòa án","Tòa án nhân dân, vì một trong các bên có Giấy chứng nhận","Ủy ban Mặt trận Tổ quốc xã","Ủy ban nhân dân cấp có thẩm quyền, vì ông Bằng không có giấy tờ"],"a":1,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: chỉ cần một trong các bên có Giấy chứng nhận thì tranh chấp do Tòa án giải quyết. Bà Thơm có Giấy chứng nhận nên các bên không được lựa chọn UBND.","b":"Khoản 1 Điều 236 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"VD","q":"Thủ tục bắt buộc mà hai bên đã thực hiện trước khi yêu cầu giải quyết là gì?","o":["Công chứng thỏa thuận ranh giới","Giám định tư pháp diện tích","Hòa giải tại Ủy ban nhân dân xã nơi có đất","Đăng ký biến động đất đai"],"a":2,"e":"Khoản 2 Điều 235 Luật Đất đai 2024: hòa giải tại UBND cấp xã nơi có đất là thủ tục bắt buộc trước khi cơ quan có thẩm quyền giải quyết tranh chấp đất đai (đối với tranh chấp ai là người có quyền sử dụng đất, ranh giới).","b":"Khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Nếu Tòa án giải quyết xong và làm thay đổi ranh giới thửa đất, các bên phải làm thủ tục gì?","o":["Đấu giá lại quyền sử dụng đất","Xin phép chuyển mục đích sử dụng đất","Đăng ký đất đai lần đầu","Đăng ký biến động đất đai"],"a":3,"e":"Điểm d, k khoản 1 Điều 133 Luật Đất đai 2024: thay đổi ranh giới, mốc giới, diện tích thửa đất và thay đổi quyền sử dụng đất theo bản án, quyết định của Tòa án là trường hợp phải đăng ký biến động đất đai.","b":"Điểm d, điểm k khoản 1 Điều 133 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"lv":"VD","q":"Ông Bằng tự ý rào 30 m² trong thửa đất của bà Thơm khi đang tranh chấp. Hành vi này là gì?","o":["Hành vi hợp pháp nếu có người làm chứng","Lấn đất của Nhà nước","Thực hiện quyền của người đang tranh chấp","Chiếm đất, là hành vi bị nghiêm cấm"],"a":3,"e":"Ông Bằng sử dụng phần đất mà bà Thơm đang có Giấy chứng nhận khi chưa được cho phép, trong lúc tranh chấp chưa được giải quyết – là chiếm đất (khoản 9 Điều 3), hành vi bị nghiêm cấm (khoản 1 Điều 11 Luật Đất đai 2024). Việc đang tranh chấp không cho phép tự xác lập quyền.","b":"Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"lv":"VD","q":"Hai ông đều không có Giấy chứng nhận hay giấy tờ theo Điều 137. Sau khi hòa giải không thành, họ có những lựa chọn nào?","o":["Phải chờ được cấp Giấy chứng nhận rồi mới giải quyết","Chỉ được nộp đơn tại Ủy ban nhân dân tỉnh","Nộp đơn tại Ủy ban nhân dân cấp có thẩm quyền hoặc khởi kiện tại Tòa án","Chỉ được khởi kiện tại Tòa án"],"a":2,"e":"Khoản 2 Điều 236 Luật Đất đai 2024: tranh chấp mà các bên không có Giấy chứng nhận hoặc giấy tờ theo Điều 137 thì các bên chỉ được lựa chọn một trong hai hình thức: nộp đơn yêu cầu giải quyết tại UBND cấp có thẩm quyền hoặc khởi kiện tại Tòa án.","b":"Khoản 2 Điều 236 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"lv":"VD","q":"Nếu chọn khởi kiện tại Tòa án, vụ việc được giải quyết theo pháp luật nào?","o":["Pháp luật về khiếu nại","Pháp luật về tố tụng dân sự","Pháp luật về tố tụng hành chính","Pháp luật về tố cáo"],"a":1,"e":"Khoản 2 Điều 236 Luật Đất đai 2024: trường hợp các bên lựa chọn khởi kiện tại Tòa án thì việc giải quyết theo quy định của pháp luật về tố tụng dân sự (tranh chấp giữa hai chủ thể ngang quyền).","b":"Khoản 2 Điều 236 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"lv":"VD","q":"Thủ tục bắt buộc trước khi cơ quan nhà nước giải quyết tranh chấp giữa hai anh em là gì?","o":["Phân chia di sản tại Tòa án","Hòa giải tại Ủy ban nhân dân xã nơi có đất","Đo đạc lại bản đồ địa chính","Lấy ý kiến của họ hàng"],"a":1,"e":"Khoản 2 Điều 235 Luật Đất đai 2024: trước khi cơ quan nhà nước có thẩm quyền giải quyết tranh chấp, các bên phải hòa giải tại UBND cấp xã nơi có đất. Đây là điều kiện bắt buộc, kể cả khi các bên là anh em.","b":"Khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"lv":"VD","q":"Hội đồng hòa giải có thể mời thêm ai để làm rõ nguồn gốc mảnh đất?","o":["Luật sư của một bên làm thành viên Hội đồng","Thẩm phán Tòa án khu vực","Người sinh sống lâu năm, biết rõ nguồn gốc và quá trình sử dụng thửa đất","Công chứng viên nơi có đất"],"a":2,"e":"Điểm b khoản 2 Điều 235 Luật Đất đai 2024: thành phần Hội đồng hòa giải có thể gồm người sinh sống lâu năm tại xã, biết rõ về nguồn gốc và quá trình sử dụng đối với thửa đất tranh chấp. Luật sư của một bên, công chứng viên, thẩm phán không phải thành viên Hội đồng.","b":"Điểm b khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.04.1","g":6,"lv":"VD","q":"Ông Hoàng không đồng ý với quyết định thu hồi đất. Ông có quyền gì?","o":["Yêu cầu Hội đồng hòa giải xã hủy quyết định","Yêu cầu chủ đầu tư thương lượng lại giá","Tự ý không bàn giao đất mà không có hậu quả","Khiếu nại hoặc khởi kiện quyết định hành chính"],"a":3,"e":"Khoản 8 Điều 26 và Điều 237 Luật Đất đai 2024: người sử dụng đất có quyền khiếu nại, khởi kiện quyết định hành chính về đất đai. Ông Hoàng có thể khiếu nại hoặc khởi kiện quyết định thu hồi đất; trong thời gian giải quyết vẫn phải chấp hành quyết định nếu không có quyết định tạm đình chỉ.","b":"Khoản 8 Điều 26, Điều 237 Luật Đất đai 2024","cid":"TH6.04"},{"id":"TH6.04.2","g":6,"lv":"VD","q":"Việc khiếu nại quyết định thu hồi đất của ông Hoàng được thực hiện theo pháp luật nào?","o":["Pháp luật về hòa giải ở cơ sở","Pháp luật về tố tụng dân sự","Pháp luật về trọng tài thương mại","Pháp luật về khiếu nại"],"a":3,"e":"Điều 237 Luật Đất đai 2024: việc giải quyết khiếu nại quyết định hành chính, hành vi hành chính về đất đai thực hiện theo quy định của pháp luật về khiếu nại.","b":"Điều 237 Luật Đất đai 2024","cid":"TH6.04"},{"id":"TH6.04.3","g":6,"lv":"VD","q":"Nếu khởi kiện quyết định thu hồi đất ra Tòa án, vụ việc được giải quyết theo thủ tục nào?","o":["Tố tụng hình sự","Tố tụng dân sự","Hòa giải tại Tòa án theo thủ tục thương mại","Tố tụng hành chính"],"a":3,"e":"Điều 237 Luật Đất đai 2024: khởi kiện quyết định hành chính về đất đai được thực hiện theo pháp luật về tố tụng hành chính. Đây là tranh chấp giữa người dân với cơ quan hành chính, không phải tranh chấp dân sự.","b":"Điều 237 Luật Đất đai 2024","cid":"TH6.04"},{"id":"TH6.04.4","g":6,"lv":"VD","q":"Ông Hoàng có quyền tiếp cận thông tin về phương án bồi thường đã được phê duyệt không?","o":["Không, đây là thông tin nội bộ","Có, phương án bồi thường, hỗ trợ, tái định cư đã được phê duyệt thuộc thông tin công dân được tiếp cận","Chỉ khi có văn bản của Tòa án","Chỉ khi được chủ đầu tư đồng ý"],"a":1,"e":"Điểm đ khoản 1 Điều 24 Luật Đất đai 2024: công dân được tiếp cận thông tin về phương án bồi thường, hỗ trợ, tái định cư đã được cơ quan có thẩm quyền phê duyệt. Đây không phải thông tin nội bộ.","b":"Điểm đ khoản 1 Điều 24 Luật Đất đai 2024","cid":"TH6.04"},{"id":"TH6.05.1","g":6,"lv":"VD","q":"Công ty Thành Công không sử dụng đất sau khi nhận bàn giao tháng 1/2024. Khi nào hành vi này thuộc căn cứ bị xử lý thu hồi?","o":["Không sử dụng đất trong 12 tháng liên tục kể từ ngày nhận bàn giao đất trên thực địa","Không sử dụng đất trong 36 tháng","Không sử dụng đất trong 06 tháng","Không có thời hạn"],"a":0,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: đất được giao, cho thuê để thực hiện dự án mà không được sử dụng trong thời gian 12 tháng liên tục kể từ ngày nhận bàn giao đất trên thực địa (hoặc chậm tiến độ 24 tháng) thì thuộc căn cứ xử lý. Công ty nhận đất tháng 1/2024 nên đã vượt 12 tháng.","b":"Khoản 8 Điều 81 Luật Đất đai 2024","cid":"TH6.05"},{"id":"TH6.05.2","g":6,"lv":"VD","q":"Công ty có thể được gia hạn sử dụng đất tối đa bao lâu?","o":["Không được gia hạn","48 tháng","12 tháng và không phải nộp thêm","24 tháng và phải nộp bổ sung tiền thuê đất cho thời gian gia hạn"],"a":3,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: chủ đầu tư được gia hạn sử dụng không quá 24 tháng và phải nộp bổ sung cho Nhà nước khoản tiền tương ứng với tiền thuê đất cho thời gian được gia hạn.","b":"Khoản 8 Điều 81 Luật Đất đai 2024","cid":"TH6.05"},{"id":"TH6.05.3","g":6,"lv":"VD","q":"Hết thời gian gia hạn mà công ty vẫn chưa đưa đất vào sử dụng thì Nhà nước xử lý thế nào?","o":["Chỉ phạt tiền","Thu hồi đất, không bồi thường về đất, tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại","Thu hồi đất và bồi thường theo bảng giá đất","Gia hạn thêm 24 tháng"],"a":1,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: hết thời gian gia hạn mà chủ đầu tư vẫn chưa đưa đất vào sử dụng thì Nhà nước thu hồi đất mà không bồi thường về đất, tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại.","b":"Khoản 8 Điều 81 Luật Đất đai 2024","cid":"TH6.05"},{"id":"TH6.05.4","g":6,"lv":"VD","q":"Nếu việc chậm triển khai là do sự kiện bất khả kháng thì sao?","o":["Phải chuyển nhượng dự án","Bị phạt gấp đôi","Không áp dụng căn cứ thu hồi đất do không sử dụng đất, chậm tiến độ","Vẫn bị thu hồi ngay"],"a":2,"e":"Khoản 9 Điều 81 Luật Đất đai 2024: căn cứ thu hồi do không sử dụng đất, chậm tiến độ không áp dụng trong trường hợp có sự kiện bất khả kháng.","b":"Khoản 9 Điều 81 Luật Đất đai 2024","cid":"TH6.05"},{"id":"TH6.06.1","g":6,"lv":"VD","q":"Hành vi đào sâu làm mất tầng canh tác trên đất trồng lúa của ông Lực là hành vi gì?","o":["Chuyển đổi cơ cấu cây trồng","Hủy hoại đất","Chiếm đất","Lấn đất"],"a":1,"e":"Đào sâu 3 m làm mất tầng canh tác, làm đất trồng lúa không còn khả năng sử dụng theo mục đích – là hủy hoại đất (khoản 27 Điều 3), hành vi bị nghiêm cấm (khoản 1 Điều 11 Luật Đất đai 2024). Không phải chuyển đổi cơ cấu cây trồng.","b":"Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH6.06"},{"id":"TH6.06.2","g":6,"lv":"VD","q":"Ông Lực đã bị xử phạt năm 2025 nhưng năm 2026 tiếp tục vi phạm. Ông có thể bị xử lý thế nào về đất?","o":["Chỉ bị phạt tiền lần hai, không thu hồi đất","Được chuyển sang thuê đất","Chỉ bị nhắc nhở","Bị Nhà nước thu hồi đất do vi phạm pháp luật về đất đai"],"a":3,"e":"Khoản 2 Điều 81 Luật Đất đai 2024: người sử dụng đất hủy hoại đất và đã bị xử phạt vi phạm hành chính mà tiếp tục vi phạm thì Nhà nước thu hồi đất do vi phạm pháp luật về đất đai.","b":"Khoản 2 Điều 81 Luật Đất đai 2024","cid":"TH6.06"},{"id":"TH6.06.3","g":6,"lv":"VD","q":"Ngoài thu hồi đất, ông Lực có thể phải chịu trách nhiệm pháp lý nào?","o":["Chỉ chịu trách nhiệm dân sự với hàng xóm","Không phải chịu trách nhiệm nào khác","Chỉ bị xử lý kỷ luật","Xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ; gây thiệt hại thì bồi thường"],"a":3,"e":"Điều 239 Luật Đất đai 2024: tùy tính chất, mức độ, ông Lực có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự (tội vi phạm quy định về sử dụng đất đai – Điều 228 BLHS); gây thiệt hại thì phải bồi thường.","b":"Điều 239 Luật Đất đai 2024","cid":"TH6.06"},{"id":"TH6.06.4","g":6,"lv":"VD","q":"Ông Lực vi phạm nghĩa vụ nào của người sử dụng đất?","o":["Thực hiện biện pháp bảo vệ đất","Bàn giao đất khi Nhà nước thu hồi","Tuân thủ quy định về vật tìm thấy trong lòng đất","Kê khai đăng ký đất đai"],"a":0,"e":"Khoản 4 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ thực hiện biện pháp bảo vệ đất, không làm tổn hại đến lợi ích hợp pháp của người sử dụng đất có liên quan. Đào lấy đất làm mất tầng canh tác vi phạm nghĩa vụ này.","b":"Khoản 4 Điều 31 Luật Đất đai 2024","cid":"TH6.06"},{"id":"TH6.07.1","g":6,"lv":"VD","q":"Hành vi nhận tiền để làm ngơ cho xây dựng trái phép của ông Q vi phạm điều gì?","o":["Lợi dụng chức vụ, quyền hạn làm trái quy định của pháp luật trong quản lý đất đai","Sử dụng đất không đúng mục đích","Không ngăn chặn tranh chấp dân sự","Chậm thực hiện nghĩa vụ tài chính"],"a":0,"e":"Khoản 4 Điều 11 Luật Đất đai 2024 nghiêm cấm lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật trong quản lý đất đai. Nhận tiền để làm ngơ vi phạm còn có dấu hiệu tội nhận hối lộ (Điều 354 BLHS).","b":"Khoản 4 Điều 11 Luật Đất đai 2024","cid":"TH6.07"},{"id":"TH6.07.2","g":6,"lv":"VD","q":"Việc cố ý cung cấp thông tin sai lệch về quy hoạch sử dụng đất của ông Q là gì?","o":["Chỉ vi phạm nội quy cơ quan","Sai sót kỹ thuật không bị xử lý","Hành vi bị nghiêm cấm: cung cấp thông tin về đất đai không chính xác","Hành vi được phép vì quy hoạch có thể điều chỉnh"],"a":2,"e":"Khoản 5 Điều 11 Luật Đất đai 2024 nghiêm cấm cung cấp thông tin về đất đai không chính xác. Cố ý cung cấp thông tin sai lệch về quy hoạch là vi phạm pháp luật, không phải sai sót kỹ thuật.","b":"Khoản 5 Điều 11 Luật Đất đai 2024","cid":"TH6.07"},{"id":"TH6.07.3","g":6,"lv":"VD","q":"Việc không ngăn chặn xây dựng trái phép trên đất nông nghiệp còn vi phạm hành vi bị nghiêm cấm nào?","o":["Phân biệt đối xử về giới","Không ngăn chặn, không xử lý hành vi vi phạm pháp luật về đất đai","Cản trở việc sử dụng đất hợp pháp","Không đăng ký đất đai"],"a":1,"e":"Khoản 6 Điều 11 Luật Đất đai 2024 nghiêm cấm việc không ngăn chặn, không xử lý kịp thời, không đúng quy định đối với hành vi vi phạm pháp luật về đất đai. Công chức địa chính không ngăn chặn xây dựng trái phép trên đất nông nghiệp vi phạm quy định này.","b":"Khoản 6 Điều 11 Luật Đất đai 2024","cid":"TH6.07"},{"id":"TH6.07.4","g":6,"lv":"VD","q":"Ông Q có thể bị xử lý theo những hình thức nào?","o":["Chỉ bị nhắc nhở","Kỷ luật, xử phạt hoặc truy cứu trách nhiệm hình sự tùy mức độ; gây thiệt hại thì bồi thường","Không bị xử lý vì là công chức","Chỉ bị điều chuyển công tác"],"a":1,"e":"Điều 239 Luật Đất đai 2024: người có chức vụ, quyền hạn vi phạm pháp luật đất đai bị xử lý kỷ luật, xử phạt hoặc truy cứu trách nhiệm hình sự tùy mức độ; gây thiệt hại thì phải bồi thường. Tư cách công chức không miễn trừ trách nhiệm.","b":"Điều 239 Luật Đất đai 2024","cid":"TH6.07"},{"id":"TH6.08.1","g":6,"lv":"VD","q":"Tranh chấp giữa bà Mai và ông Đức là loại tranh chấp gì?","o":["Khiếu nại quyết định hành chính","Tranh chấp ranh giới thửa đất","Tố cáo vi phạm pháp luật đất đai","Tranh chấp hợp đồng liên quan đến quyền sử dụng đất"],"a":3,"e":"Tranh chấp giữa bà Mai và ông Đức phát sinh từ việc thực hiện hợp đồng chuyển nhượng quyền sử dụng đất (nghĩa vụ thanh toán) – là tranh chấp hợp đồng liên quan đến quyền sử dụng đất, điều chỉnh bởi BLDS và khoản 1 Điều 27 Luật Đất đai 2024. Không phải tranh chấp ranh giới hay khiếu nại hành chính.","b":"Khoản 1 Điều 27 Luật Đất đai 2024; Bộ luật Dân sự 2015","cid":"TH6.08"},{"id":"TH6.08.2","g":6,"lv":"VD","q":"Đề nghị của ông Đức để Ủy ban nhân dân xã giải quyết tranh chấp hợp đồng có phù hợp không?","o":["Không phù hợp, vì tranh chấp hợp đồng và thửa đất đã có Giấy chứng nhận thuộc thẩm quyền của Tòa án","Được nếu giá trị hợp đồng dưới 3 tỷ đồng","Ủy ban nhân dân xã có quyền ra quyết định giải quyết","Được nếu bà Mai đồng ý"],"a":0,"e":"Tranh chấp hợp đồng chuyển nhượng quyền sử dụng đất là tranh chấp dân sự thuộc thẩm quyền Tòa án (Điều 26 BLTTDS); thửa đất đã có Giấy chứng nhận nên theo khoản 1 Điều 236 Luật Đất đai 2024 cũng thuộc Tòa án. UBND xã không có thẩm quyền ra quyết định giải quyết.","b":"Khoản 1 Điều 236 Luật Đất đai 2024","cid":"TH6.08"},{"id":"TH6.08.3","g":6,"lv":"VD","q":"Hợp đồng chuyển nhượng giữa bà Mai và ông Đức có đáp ứng yêu cầu hình thức không?","o":["Có, vì đã được công chứng","Không, vì phải chứng thực tại xã","Có, nhưng chỉ khi có người làm chứng","Không, vì chưa đăng ký biến động"],"a":0,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng chuyển nhượng quyền sử dụng đất phải được công chứng hoặc chứng thực. Hợp đồng đã được công chứng nên đáp ứng yêu cầu hình thức; đăng ký biến động là điều kiện chuyển quyền, không phải điều kiện hình thức hợp đồng.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH6.08"},{"id":"TH6.08.4","g":6,"lv":"VD","q":"Nếu hợp đồng được thực hiện xong, việc chuyển quyền sử dụng đất có hiệu lực từ khi nào?","o":["Từ thời điểm đăng ký theo quy định của Luật Đất đai","Từ ngày công chứng hợp đồng","Từ ngày bàn giao đất trên thực địa","Từ ngày ông Đức trả đủ tiền"],"a":0,"e":"Điều 503 BLDS 2015: việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký theo quy định của Luật Đất đai. Ngày công chứng, bàn giao hay thanh toán đủ không phải thời điểm chuyển quyền.","b":"Điều 503 Bộ luật Dân sự 2015","cid":"TH6.08"},{"id":"TH6.09.1","g":6,"lv":"VD","q":"Việc bà Hằng báo cho cơ quan có thẩm quyền về hành vi vi phạm của doanh nghiệp và cán bộ là thực hiện quyền gì?","o":["Quyền yêu cầu hòa giải","Quyền khiếu nại","Quyền tố cáo","Quyền khởi kiện vụ án dân sự"],"a":2,"e":"Điều 238 Luật Đất đai 2024: cá nhân có quyền tố cáo vi phạm pháp luật về quản lý và sử dụng đất đai. Bà Hằng không có quyền lợi bị xâm phạm trực tiếp mà báo cho cơ quan có thẩm quyền về hành vi vi phạm – đó là tố cáo, không phải khiếu nại hay khởi kiện.","b":"Điều 238 Luật Đất đai 2024","cid":"TH6.09"},{"id":"TH6.09.2","g":6,"lv":"VD","q":"Việc giải quyết tố cáo về đất đai được thực hiện theo pháp luật nào?","o":["Pháp luật về tố tụng dân sự","Pháp luật về trọng tài thương mại","Pháp luật về hòa giải ở cơ sở","Pháp luật về tố cáo"],"a":3,"e":"Điều 238 Luật Đất đai 2024: việc giải quyết tố cáo vi phạm pháp luật về quản lý và sử dụng đất đai thực hiện theo quy định của pháp luật về tố cáo (Luật Tố cáo).","b":"Điều 238 Luật Đất đai 2024","cid":"TH6.09"},{"id":"TH6.09.3","g":6,"lv":"VD","q":"Hành vi tự ý san lấp hồ chứa nước công cộng của doanh nghiệp là hành vi gì?","o":["Hoạt động kinh doanh không liên quan đến đất đai","Sử dụng đất kết hợp đa mục đích","Chiếm đất do Nhà nước quản lý, là hành vi bị nghiêm cấm","Chuyển đổi cơ cấu sử dụng đất hợp pháp"],"a":2,"e":"Hồ chứa nước công cộng là đất do Nhà nước quản lý; doanh nghiệp tự ý san lấp để sử dụng khi chưa được phép là chiếm đất (khoản 9 Điều 3), hành vi bị nghiêm cấm (khoản 1 Điều 11 Luật Đất đai 2024).","b":"Khoản 9 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH6.09"},{"id":"TH6.09.4","g":6,"lv":"VD","q":"Việc cán bộ xã bao che cho doanh nghiệp, nếu có, vi phạm hành vi bị nghiêm cấm nào?","o":["Không ngăn chặn, không xử lý hành vi vi phạm pháp luật về đất đai","Phân biệt đối xử về giới","Không đăng ký đất đai","Không thực hiện nghĩa vụ tài chính"],"a":0,"e":"Khoản 6 Điều 11 Luật Đất đai 2024 nghiêm cấm việc không ngăn chặn, không xử lý kịp thời hành vi vi phạm pháp luật về đất đai. Nếu cán bộ xã bao che, họ vi phạm quy định này và có thể có dấu hiệu lợi dụng chức vụ (khoản 4).","b":"Khoản 6 Điều 11 Luật Đất đai 2024","cid":"TH6.09"},{"id":"TH6.10.1","g":6,"lv":"VD","q":"Công ty Thủy lợi X để hành lang được giao quản lý bị lấn chiếm thì phần đất đó có thể bị xử lý thế nào?","o":["Công ty được cấp Giấy chứng nhận cho phần đất","Nhà nước thu hồi đất do vi phạm pháp
