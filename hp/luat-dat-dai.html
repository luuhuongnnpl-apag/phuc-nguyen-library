{"id":"6.17","g":6,"lv":"TH","q":"Dự án đầu tư hết thời gian được gia hạn mà vẫn chưa đưa đất vào sử dụng thì hậu quả pháp lý là gì?","o":["Được chuyển nhượng dự án cho nhà đầu tư khác không cần điều kiện","Được gia hạn tiếp 24 tháng","Được bồi thường toàn bộ chi phí đầu tư","Nhà nước thu hồi đất, không bồi thường về đất, tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại"],"a":3,"e":"Khoản 8 Điều 81 Luật Đất đai 2024: hết thời hạn được gia hạn mà chủ đầu tư vẫn chưa đưa đất vào sử dụng thì Nhà nước thu hồi đất mà không bồi thường về đất, tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại (trừ trường hợp bất khả kháng).","b":"Khoản 8 Điều 81 Luật Đất đai 2024"},{"id":"6.18","g":6,"lv":"NB","q":"Hành vi nào sau đây của người có chức vụ, quyền hạn bị nghiêm cấm trong lĩnh vực đất đai?","o":["Hòa giải tranh chấp đất đai theo đơn yêu cầu","Lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật trong quản lý đất đai","Tiếp nhận hồ sơ đăng ký đất đai đúng thời hạn","Công khai quy hoạch sử dụng đất đã được phê duyệt"],"a":1,"e":"Khoản 4 Điều 11 Luật Đất đai 2024 nghiêm cấm lợi dụng chức vụ, quyền hạn để làm trái quy định của pháp luật trong quản lý đất đai. Hòa giải, tiếp nhận hồ sơ đúng hạn, công khai quy hoạch là nhiệm vụ đúng pháp luật.","b":"Khoản 4 Điều 11 Luật Đất đai 2024"},{"id":"6.19","g":6,"lv":"NB","q":"Hành vi cố ý cung cấp thông tin về đất đai không chính xác, không đáp ứng yêu cầu về thời hạn được Luật Đất đai 2024 xác định là gì?","o":["Hành vi chỉ bị xử lý khi có người khiếu nại","Vi phạm đạo đức nghề nghiệp, không phải vi phạm pháp luật","Hành vi được phép nếu thông tin chưa được phê duyệt","Hành vi bị nghiêm cấm"],"a":3,"e":"Khoản 5 Điều 11 Luật Đất đai 2024 nghiêm cấm không cung cấp hoặc cung cấp thông tin về đất đai không chính xác, không đáp ứng yêu cầu về thời hạn theo quy định của pháp luật. Đây là vi phạm pháp luật, không chỉ vi phạm đạo đức.","b":"Khoản 5 Điều 11 Luật Đất đai 2024"},{"id":"6.20","g":6,"lv":"TH","q":"Các trường hợp thu hồi đất do không thực hiện nghĩa vụ tài chính, không sử dụng đất hoặc chậm tiến độ không áp dụng khi nào?","o":["Khi dự án có vốn đầu tư nước ngoài","Khi có sự kiện bất khả kháng","Khi người sử dụng đất là tổ chức kinh tế nhà nước","Khi đất đã có Giấy chứng nhận"],"a":1,"e":"Khoản 9 Điều 81 Luật Đất đai 2024: các trường hợp thu hồi do không thực hiện nghĩa vụ tài chính, không sử dụng đất, chậm tiến độ (khoản 6, 7, 8) không áp dụng đối với trường hợp có sự kiện bất khả kháng. Loại hình doanh nghiệp hay việc có Giấy chứng nhận không phải căn cứ loại trừ.","b":"Khoản 9 Điều 81 Luật Đất đai 2024"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Phần đất 100 m² đã xây nhà hiện được xác định là loại đất gì?","o":["Đất ở, vì nhà đã tồn tại ổn định trên 05 năm","Đất trồng cây lâu năm, theo Giấy chứng nhận đã cấp","Đất chưa sử dụng, vì không còn được dùng để trồng cây","Đất ở tại nông thôn, vì loại đất được xác định theo hiện trạng đang sử dụng"],"a":1,"e":"Điểm a khoản 1 Điều 10 Luật Đất đai 2024: việc xác định loại đất căn cứ vào Giấy chứng nhận đã cấp. Đất trồng cây lâu năm thuộc nhóm đất nông nghiệp (điểm b khoản 2 Điều 9). Việc tự xây nhà và thời gian sử dụng không làm thay đổi loại đất.","b":"Điểm a khoản 1 Điều 10, điểm b khoản 2 Điều 9 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Việc bà Hoa tự xây nhà ở trên đất trồng cây lâu năm vi phạm nguyên tắc sử dụng đất nào?","o":["Sử dụng đất đúng mục đích","Tuân thủ hạn mức giao đất","Thực hiện quyền trong thời hạn sử dụng đất","Không lạm dụng thuốc bảo vệ thực vật, phân hóa học"],"a":0,"e":"Khoản 1 Điều 5 Luật Đất đai 2024: sử dụng đất phải đúng mục đích sử dụng đất. Xây nhà ở trên đất trồng cây lâu năm khi chưa được chuyển mục đích là sử dụng đất không đúng mục đích, thuộc hành vi bị nghiêm cấm tại Điều 11 và có thể bị xử phạt vi phạm hành chính.","b":"Khoản 1 Điều 5, Điều 11 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Muốn hợp thức hóa việc ở trên 100 m² đất này, bà Hoa phải làm gì?","o":["Không cần thủ tục gì, vì thửa đất đã được cấp Giấy chứng nhận","Chỉ cần đăng ký biến động sau khi đã xây xong nhà","Thông báo bằng văn bản cho Ủy ban nhân dân xã nơi có đất","Xin phép chuyển mục đích sang đất ở, nộp nghĩa vụ tài chính"],"a":3,"e":"Điểm b khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất nông nghiệp sang đất phi nông nghiệp (trong đó có đất ở) phải được cơ quan nhà nước có thẩm quyền cho phép; người sử dụng đất phải thực hiện nghĩa vụ tài chính khi chuyển mục đích. Đăng ký biến động hay thông báo không thay thế quyết định cho phép.","b":"Điểm b khoản 1 Điều 121 Luật Đất đai 2024","cid":"TH1.01"},{"id":"TH1.01.4","g":1,"lv":"VD","q":"Quan điểm \"thửa đất là của bà nên bà có toàn quyền quyết định mục đích sử dụng\" sai ở điểm nào?","o":["Đất trồng cây lâu năm thuộc sở hữu của Ủy ban nhân dân xã nơi có đất","Bà Hoa chỉ có quyền sở hữu đất khi đã sử dụng ổn định trên 20 năm","Đất thuộc sở hữu toàn dân; bà Hoa chỉ có quyền sử dụng đất","Quyền sở hữu của bà Hoa chỉ giới hạn ở phần đất đã xây nhà"],"a":2,"e":"Điều 53 Hiến pháp 2013 và Điều 12 Luật Đất đai 2024: đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý. Khoản 2 Điều 13: Nhà nước quyết định mục đích sử dụng đất thông qua quy hoạch, kế hoạch sử dụng đất. Người sử dụng đất chỉ có quyền sử dụng đất theo mục đích được xác định.","b":"Điều 12, khoản 2 Điều 13 Luật Đất đai 2024; Điều 53 Hiến pháp 2013","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Theo Luật Đất đai 2024, các thành viên hộ ông Sơn được xác định thế nào đối với 2.000 m² đất được giao năm 2010?","o":["Nhóm người có chung quyền sử dụng đất, mỗi người có quyền như cá nhân","Một cộng đồng dân cư sử dụng đất theo phong tục, tập quán","Một tổ chức kinh tế sử dụng đất, do ông Sơn làm người đại diện","Ông Sơn là người sử dụng đất duy nhất vì đứng tên chủ hộ"],"a":0,"e":"Hộ ông Sơn được giao đất trước Luật Đất đai 2024, các thành viên có quan hệ hôn nhân, huyết thống, sống chung – là hộ gia đình sử dụng đất (khoản 25 Điều 3). Theo điểm a khoản 2 Điều 27, các thành viên này là nhóm người có chung quyền sử dụng đất, có quyền và nghĩa vụ như cá nhân; việc đứng tên chủ hộ không làm ông Sơn trở thành người sử dụng duy nhất.","b":"Khoản 25 Điều 3, điểm a khoản 2 Điều 27 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Để chuyển nhượng 500 m² hợp pháp, ai phải thực hiện giao dịch?","o":["Chỉ cần chữ ký của ông Sơn là người đứng tên chủ hộ","Chỉ cần có xác nhận của Ủy ban nhân dân xã nơi có đất","Các thành viên chung quyền cùng ký hoặc ủy quyền đại diện","Chỉ cần sự đồng ý của vợ ông Sơn bằng văn bản"],"a":2,"e":"Điểm b khoản 2 Điều 27 Luật Đất đai 2024: trường hợp quyền sử dụng đất của nhóm người chưa phân chia theo phần thì các thành viên cùng nhau thực hiện hoặc ủy quyền cho người đại diện để thực hiện quyền. Ông Sơn tự ký, không có ủy quyền của vợ và hai con.","b":"Điểm b khoản 2 Điều 27 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Ngoài vấn đề chủ thể, giấy chuyển nhượng còn thiếu yêu cầu nào?","o":["Chưa ghi giá chuyển nhượng bằng chữ","Chưa được công chứng hoặc chứng thực","Thiếu hai người làm chứng","Chưa có xác nhận của trưởng thôn"],"a":1,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất phải được công chứng hoặc chứng thực (trừ trường hợp một bên là tổ chức hoạt động kinh doanh bất động sản). Giấy tự viết không đáp ứng yêu cầu hình thức.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH1.02"},{"id":"TH1.02.4","g":1,"lv":"VD","q":"Bà Mai và các con có thể bảo vệ quyền lợi của mình như thế nào?","o":["Tự rào lại 500 m² và yêu cầu ông Tùng rời khỏi thửa đất","Không làm gì được, vì ông Sơn là chủ hộ có quyền quyết định","Đề nghị Ủy ban nhân dân xã ra quyết định hủy giao dịch","Yêu cầu Tòa án giải quyết vì thiếu sự đồng ý của họ"],"a":3,"e":"Giao dịch do người không có quyền đại diện xác lập không làm phát sinh quyền, nghĩa vụ đối với người được đại diện, trừ khi họ chấp thuận (Điều 142 BLDS). Ông Sơn tự ý định đoạt quyền sử dụng đất chung, trái điểm b khoản 2 Điều 27 Luật Đất đai 2024; các thành viên khác có quyền yêu cầu Tòa án giải quyết. Ủy ban nhân dân xã không có thẩm quyền hủy hợp đồng dân sự.","b":"Điểm b khoản 2 Điều 27 Luật Đất đai 2024; Điều 142 Bộ luật Dân sự 2015","cid":"TH1.02"},{"id":"TH1.03.1","g":1,"lv":"VD","q":"Gia đình ông Quang có quyền yêu cầu lối đi qua đất bà Lụa trên cơ sở nào?","o":["Việc đi qua nhiều năm đã làm phát sinh quyền sở hữu đối với lối đi","Lối đi là đất công cộng do Nhà nước trực tiếp quản lý","Ông Quang đã nộp tiền sử dụng đất cho phần diện tích lối đi","Thửa đất bị vây bọc, không có lối ra đường công cộng"],"a":3,"e":"Khoản 1 Điều 29 Luật Đất đai 2024 và Điều 254 BLDS: chủ sở hữu bất động sản bị vây bọc mà không có hoặc không đủ lối đi ra đường công cộng có quyền yêu cầu chủ sở hữu bất động sản vây bọc dành cho mình một lối đi hợp lý. Thời gian đi qua không làm phát sinh quyền sở hữu, vì đất đai thuộc sở hữu toàn dân.","b":"Khoản 1 Điều 29 Luật Đất đai 2024; Điều 254 Bộ luật Dân sự 2015","cid":"TH1.03"},{"id":"TH1.03.2","g":1,"lv":"VD","q":"Lối đi được mở ở đâu và gia đình ông Quang có phải đền bù không?","o":["Ở bất kỳ vị trí nào ông Quang chọn; không phải đền bù cho bà Lụa","Ở vị trí hợp lý, ít phiền hà nhất; phải đền bù nếu không thỏa thuận khác","Do Ủy ban nhân dân xã ấn định; Nhà nước đền bù cho bà Lụa","Chỉ được mở bằng chiều rộng tối thiểu 4 m; không phải đền bù"],"a":1,"e":"Điều 254 BLDS: lối đi được mở trên bất động sản liền kề nào mà được coi là thuận tiện và hợp lý nhất, có tính đến đặc điểm cụ thể của địa điểm, lợi ích của bất động sản bị vây bọc và thiệt hại ít nhất cho bất động sản có mở lối đi; chủ sở hữu bất động sản được hưởng quyền về lối đi phải đền bù cho chủ sở hữu bất động sản chịu hưởng quyền, trừ trường hợp có thỏa thuận khác.","b":"Điều 254 Bộ luật Dân sự 2015","cid":"TH1.03"},{"id":"TH1.03.3","g":1,"lv":"VD","q":"Để quyền về lối đi được công khai và bảo đảm lâu dài, cần làm gì?","o":["Xin quyết định giao đất làm lối đi của Ủy ban nhân dân tỉnh","Chuyển mục đích phần lối đi sang đất giao thông công cộng","Xác lập quyền và đăng ký quyền đối với thửa đất liền kề","Chỉ cần tiếp tục thỏa thuận miệng như trước đây giữa hai gia đình"],"a":2,"e":"Khoản 2 Điều 29 Luật Đất đai 2024: quyền đối với thửa đất liền kề được xác lập theo quy định của pháp luật dân sự và phải đăng ký theo quy định tại Điều 133. Thỏa thuận miệng chưa đăng ký chính là lý do lối đi của ông Quang dễ bị chặn.","b":"Khoản 2 Điều 29 Luật Đất đai 2024","cid":"TH1.03"},{"id":"TH1.03.4","g":1,"lv":"VD","q":"Sau khi bị chặn lối đi, ông Quang nên làm gì?","o":["Yêu cầu bà Lụa mở lối đi; không được thì khởi kiện ra Tòa án","Tự phá bức tường để mở lại lối đi như trước","Yêu cầu Nhà nước bồi thường thiệt hại do bị chặn lối đi","Đề nghị Ủy ban nhân dân xã thu hồi một phần đất của bà Lụa để giao cho mình"],"a":0,"e":"Ông Quang có quyền yêu cầu bà Lụa mở lối đi hợp lý (Điều 254 BLDS); nếu không thỏa thuận được thì khởi kiện yêu cầu Tòa án giải quyết (khoản 8 Điều 26 Luật Đất đai 2024 – quyền khởi kiện khi quyền sử dụng đất hợp pháp bị xâm phạm). Không được tự phá tường; Nhà nước không thu hồi đất trong trường hợp này.","b":"Khoản 8 Điều 26 Luật Đất đai 2024; Điều 254 Bộ luật Dân sự 2015","cid":"TH1.03"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Thời hạn sử dụng 1,5 ha đất được giao của ông Tâm là bao lâu và khi hết hạn xử lý thế nào?","o":["50 năm; hết hạn được tiếp tục sử dụng, không phải gia hạn","30 năm; Nhà nước thu hồi đất khi hết hạn","Ổn định lâu dài; không đặt ra vấn đề hết hạn","20 năm; phải làm thủ tục gia hạn trước khi hết hạn"],"a":0,"e":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024: đất nông nghiệp giao trong hạn mức cho cá nhân trực tiếp sản xuất nông nghiệp có thời hạn 50 năm; khi hết thời hạn được tiếp tục sử dụng theo thời hạn quy định mà không phải làm thủ tục gia hạn.","b":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Thời hạn thuê 3 ha đất hết vào năm 2030. Muốn tiếp tục thuê, ông Tâm phải làm gì?","o":["Không phải làm gì, vì đất nông nghiệp được tự động gia hạn khi hết hạn","Nộp hồ sơ đề nghị gia hạn trong vòng 24 tháng sau khi hết hạn","Nộp hồ sơ gia hạn chậm nhất 06 tháng trước khi hết hạn","Nộp hồ sơ ngay trong năm 2026 để được ưu tiên xem xét"],"a":2,"e":"Khoản 3 Điều 172 Luật Đất đai 2024: đất thuê không thuộc trường hợp được tiếp tục sử dụng không phải gia hạn; người sử dụng đất có nhu cầu gia hạn phải nộp hồ sơ đề nghị gia hạn chậm nhất 06 tháng trước khi hết thời hạn sử dụng đất.","b":"Khoản 3 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Nếu không được gia hạn, nhà kho trên đất thuê của ông Tâm được xử lý thế nào?","o":["Nhà nước bồi thường giá trị nhà kho theo giá thị trường","Nhà kho đương nhiên thuộc sở hữu Nhà nước khi hết thời hạn thuê","Ông Tâm được tiếp tục sử dụng phần đất xây nhà kho không thời hạn","Ông Tâm tự xử lý tài sản trong 24 tháng; quá hạn thì bị thu hồi, không bồi thường"],"a":3,"e":"Khoản 4 Điều 172 Luật Đất đai 2024: trường hợp không được gia hạn, người sử dụng đất phải tự xử lý tài sản gắn liền với đất trong thời hạn 24 tháng; quá thời hạn này mà không xử lý thì Nhà nước thu hồi đất mà không bồi thường về đất và tài sản gắn liền với đất.","b":"Khoản 4 Điều 172 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Thời hạn sử dụng 0,5 ha đất ông Hùng nhận chuyển nhượng được xác định thế nào?","o":["Ổn định lâu dài, vì đã nhận chuyển nhượng hợp pháp","Thời gian còn lại của thời hạn sử dụng đất","Do ông Tâm và ông Hùng tự thỏa thuận trong hợp đồng","Thời hạn mới 50 năm, tính từ năm 2026"],"a":1,"e":"Khoản 1 Điều 174 Luật Đất đai 2024: người nhận chuyển quyền sử dụng đất nông nghiệp có thời hạn được sử dụng trong thời gian còn lại. Ông Hùng là cá nhân trực tiếp sản xuất nông nghiệp; nếu diện tích trong hạn mức thì khi hết hạn được tiếp tục sử dụng mà không phải gia hạn (điểm a khoản 1 Điều 172).","b":"Khoản 1 Điều 174 Luật Đất đai 2024","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Thửa đất 3.000 m² cấy hai vụ mỗi năm của ông Hiếu là loại đất gì?","o":["Đất trồng cây hằng năm khác","Đất chuyên trồng lúa","Đất trồng lúa còn lại","Đất nông nghiệp khác"],"a":1,"e":"Khoản 1 Điều 182 Luật Đất đai 2024: đất trồng lúa gồm đất chuyên trồng lúa và đất trồng lúa còn lại; đất trồng từ hai vụ lúa trở lên trong năm là đất chuyên trồng lúa.","b":"Khoản 1 Điều 182 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Việc đào ao sâu 3 m có được thực hiện theo hình thức chuyển đổi cơ cấu cây trồng, vật nuôi trên đất trồng lúa không?","o":["Không, vì làm mất điều kiện trồng lúa trở lại","Được, vì nuôi cá vẫn là hoạt động sản xuất nông nghiệp","Không, vì đất trồng lúa không bao giờ được chuyển đổi cơ cấu cây trồng","Được, nếu diện tích ao dưới 30% diện tích thửa đất"],"a":0,"e":"Khoản 5 Điều 182 Luật Đất đai 2024 cho phép chuyển đổi cơ cấu cây trồng, vật nuôi trên đất trồng lúa nhưng không được làm mất đi các điều kiện phù hợp để trồng lúa trở lại. Đào ao sâu 3 m làm mất tầng canh tác nên không thuộc trường hợp chuyển đổi cơ cấu.","b":"Khoản 5 Điều 182 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Muốn đào ao nuôi cá hợp pháp, ông Hiếu phải làm gì?","o":["Chỉ cần thông báo bằng văn bản cho Ủy ban nhân dân xã","Được các hộ có đất liền kề đồng ý bằng văn bản","Xin phép chuyển mục đích sang đất nuôi trồng thủy sản và nộp tiền bảo vệ đất trồng lúa","Chỉ cần đăng ký biến động sau khi đào ao xong"],"a":2,"e":"Điểm a khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất trồng lúa sang loại đất khác trong nhóm đất nông nghiệp phải được cơ quan nhà nước có thẩm quyền cho phép. Khoản 3 Điều 182: người được phép chuyển đất chuyên trồng lúa sang mục đích khác phải nộp tiền để bảo vệ, phát triển đất trồng lúa (hoặc bổ sung diện tích, tăng hiệu quả sử dụng đất trồng lúa).","b":"Điểm a khoản 1 Điều 121, khoản 3 Điều 182 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Nếu ông Hiếu tự ý đào ao, làm mất tầng canh tác mà không được phép, hành vi đó được xác định là gì?","o":["Chuyển đổi cơ cấu cây trồng không đăng ký","Lấn đất","Chiếm đất","Hủy hoại đất, là hành vi bị nghiêm cấm"],"a":3,"e":"Khoản 27 Điều 3 Luật Đất đai 2024: hủy hoại đất là hành vi làm biến dạng địa hình, làm suy giảm chất lượng đất… dẫn đến làm mất hoặc giảm khả năng sử dụng đất theo mục đích đã được xác định. Làm mất tầng canh tác của đất trồng lúa là hủy hoại đất, bị nghiêm cấm theo khoản 1 Điều 11.","b":"Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Tranh chấp 10 m² ở góc thửa đất có ngăn ông Phú tách thửa không?","o":["Không, vì tranh chấp dưới 20 m² được bỏ qua khi tách thửa","Có, cho đến khi Tòa án giải quyết xong tranh chấp","Có, đất đang có tranh chấp thì toàn bộ thửa đất không được tách","Không, vì phần tranh chấp đã xác định rõ ranh giới"],"a":3,"e":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024: thửa đất được tách phải không có tranh chấp; trường hợp có tranh chấp một phần mà xác định được phạm vi diện tích, ranh giới đang tranh chấp thì phần diện tích, ranh giới còn lại không tranh chấp được phép tách thửa.","b":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Ông Phú có được tách 40 m² thành một thửa đất riêng không?","o":["Được, vì tặng cho trong gia đình không áp dụng diện tích tối thiểu","Không, vì 40 m² nhỏ hơn diện tích tối thiểu được tách thửa là 50 m²","Không được trong mọi trường hợp, kể cả khi đồng thời hợp thửa","Được, nếu Ủy ban nhân dân xã đồng ý bằng văn bản"],"a":1,"e":"Điểm a khoản 2 Điều 220 Luật Đất đai 2024: thửa đất hình thành từ việc tách thửa phải bảo đảm diện tích tối thiểu theo quy định của Ủy ban nhân dân cấp tỉnh (khoản 4 Điều 220); trường hợp tách thửa có diện tích nhỏ hơn mức tối thiểu thì phải đồng thời hợp thửa với thửa đất liền kề.","b":"Điểm a khoản 2 Điều 220, khoản 4 Điều 220 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Phương án nào giúp ông Phú tặng cho con gái 40 m² hợp pháp?","o":["Tách 40 m² đồng thời hợp thửa với thửa đất ở liền kề của con gái","Lập giấy tặng cho viết tay, không tách thửa","Tách 40 m² trước, làm thủ tục hợp thửa sau khi con gái có nhu cầu xây nhà","Đề nghị Ủy ban nhân dân tỉnh hạ diện tích tối thiểu cho riêng trường hợp này"],"a":0,"e":"Điểm a khoản 2 Điều 220 Luật Đất đai 2024 cho phép tách thửa có diện tích nhỏ hơn mức tối thiểu nếu đồng thời hợp thửa với thửa đất liền kề, để thửa đất mới hình thành bảo đảm diện tích tối thiểu. Con gái ông Phú có thửa đất ở liền kề nên phương án này khả thi; việc tặng cho phải lập hợp đồng có công chứng, chứng thực.","b":"Điểm a khoản 2 Điều 220 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Phần đất ở 15 m² dành làm lối đi khi tách thửa có phải chuyển mục đích sử dụng không?","o":["Phải chuyển sang đất giao thông trước khi tách thửa","Phải chuyển sang đất thương mại, dịch vụ","Không phải chuyển mục đích sử dụng đối với phần dành làm lối đi","Phải bàn giao cho Nhà nước để quản lý làm đất công cộng"],"a":2,"e":"Điểm d khoản 1 Điều 220 Luật Đất đai 2024: trường hợp khi tách thửa phải dành một phần diện tích làm lối đi thì không phải chuyển mục đích sử dụng đất đối với phần diện tích dành làm lối đi đó.","b":"Điểm d khoản 1 Điều 220 Luật Đất đai 2024","cid":"TH2.03"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Ông Định có nghĩa vụ đăng ký đất đai không?","o":["Không, vì thửa đất không có tranh chấp với ai","Chỉ phải đăng ký khi muốn chuyển nhượng thửa đất","Không, vì ông chưa có giấy tờ về quyền sử dụng đất","Có, đăng ký đất đai là bắt buộc kể cả khi chưa có giấy tờ"],"a":3,"e":"Khoản 1 Điều 131 Luật Đất đai 2024: đăng ký đất đai là bắt buộc đối với người sử dụng đất và người được giao đất để quản lý. Việc không có giấy tờ, không có tranh chấp hay chưa muốn chuyển nhượng không làm thay đổi nghĩa vụ này.","b":"Khoản 1 Điều 131 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Việc ông Định đăng ký thửa đất đang sử dụng mà chưa đăng ký lần nào là loại đăng ký gì?","o":["Đăng ký thế chấp","Đăng ký tạm thời","Đăng ký lần đầu","Đăng ký biến động"],"a":2,"e":"Điều 132 Luật Đất đai 2024: đăng ký lần đầu được thực hiện đối với thửa đất chưa được đăng ký. Đăng ký biến động (Điều 133) chỉ đặt ra khi đã đăng ký mà có thay đổi.","b":"Điều 132 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Thời điểm bắt đầu sử dụng đất của ông Định thuộc giai đoạn nào khi xét cấp Giấy chứng nhận cho đất không có giấy tờ?","o":["Từ ngày 15/10/1993 đến trước ngày 01/7/2014","Từ ngày 18/12/1980 đến trước ngày 15/10/1993","Từ ngày 01/7/2014 đến trước ngày 01/8/2024","Trước ngày 18/12/1980"],"a":1,"e":"Khoản 2 Điều 138 Luật Đất đai 2024 quy định việc công nhận quyền sử dụng đất, cấp Giấy chứng nhận cho người sử dụng đất không có giấy tờ, sử dụng ổn định từ ngày 18/12/1980 đến trước ngày 15/10/1993, không vi phạm pháp luật đất đai, được Ủy ban nhân dân cấp xã xác nhận không có tranh chấp. Năm 1988 thuộc giai đoạn này.","b":"Khoản 2 Điều 138 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Ông Định có bắt buộc đăng ký quyền sở hữu ngôi nhà tự xây năm 2000 không?","o":["Không bắt buộc; đăng ký theo yêu cầu của chủ sở hữu","Bắt buộc trong 30 ngày kể từ ngày đăng ký đất","Bắt buộc đăng ký cùng lúc với đăng ký đất đai","Bắt buộc, nếu nhà được xây trước năm 2014"],"a":0,"e":"Khoản 2 Điều 131 Luật Đất đai 2024: đăng ký quyền sở hữu nhà ở, công trình xây dựng gắn liền với đất được thực hiện theo yêu cầu của chủ sở hữu. Đăng ký đất là bắt buộc, còn đăng ký tài sản trên đất là theo yêu cầu.","b":"Khoản 2 Điều 131 Luật Đất đai 2024","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Chị Giang có thể yêu cầu ghi thêm tên mình vào Giấy chứng nhận không?","o":["Có, được cấp đổi để ghi tên cả vợ và chồng","Chỉ khi có bản án của Tòa án xác định tài sản chung","Chỉ khi vợ chồng ly hôn và chia tài sản chung","Không, vì Giấy chứng nhận đã cấp không được thay đổi"],"a":0,"e":"Khoản 4 Điều 135 Luật Đất đai 2024: quyền sử dụng đất là tài sản chung của vợ chồng thì phải ghi cả họ, tên vợ và họ, tên chồng vào Giấy chứng nhận, trừ trường hợp có thỏa thuận ghi tên một người; trường hợp Giấy chứng nhận đã cấp chỉ ghi họ, tên của vợ hoặc chồng thì được cấp đổi sang ghi cả họ, tên vợ và chồng nếu có yêu cầu.","b":"Khoản 4 Điều 135 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Sau khi được giải quyết cấp đổi, vợ chồng anh Phong nhận Giấy chứng nhận mới khi nào?","o":["Sau khi có xác nhận của các hộ liền kề về ranh giới thửa đất","Ngay khi nộp hồ sơ hợp lệ tại bộ phận một cửa","Sau 01 năm kể từ ngày nộp hồ sơ, hết thời hạn niêm yết công khai","Sau khi hoàn thành nghĩa vụ tài chính (trừ trường hợp được miễn, ghi nợ)"],"a":3,"e":"Khoản 3 Điều 135 Luật Đất đai 2024: người sử dụng đất được nhận Giấy chứng nhận sau khi đã hoàn thành nghĩa vụ tài chính theo quy định, trừ trường hợp được miễn, không phải nộp hoặc được ghi nợ nghĩa vụ tài chính.","b":"Khoản 3 Điều 135 Luật Đất đai 2024","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Lập luận \"sổ đỏ đứng tên tôi\" của anh Phong sai ở điểm nào về giá trị của Giấy chứng nhận?","o":["Giấy chứng nhận là hợp đồng giữa Nhà nước và người đứng tên","Giấy chứng nhận là giấy tờ xác lập quyền sở hữu đất của người đứng tên","Đứng tên một người không làm mất tính chất tài sản chung","Giấy chứng nhận chỉ có giá trị khi có tên cả hai vợ chồng"],"a":2,"e":"Khoản 21 Điều 3 Luật Đất đai 2024: Giấy chứng nhận là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp. Quyền sử dụng đất mua bằng tiền chung trong thời kỳ hôn nhân là tài sản chung (Điều 33 Luật HNGĐ), dù Giấy chứng nhận chỉ ghi tên một người.","b":"Khoản 21 Điều 3 Luật Đất đai 2024; Điều 33 Luật Hôn nhân và gia đình 2014","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Anh Phong có được một mình ký hợp đồng chuyển nhượng thửa đất không?","o":["Được, nếu chị Giang không phản đối trong thời hạn 30 ngày","Không, vì phải có thỏa thuận bằng văn bản của vợ chồng","Được, nếu hợp đồng chuyển nhượng được công chứng","Được, vì Giấy chứng nhận chỉ ghi tên anh Phong"],"a":1,"e":"Điều 35 Luật Hôn nhân và gia đình 2014: việc định đoạt tài sản chung là bất động sản phải có sự thỏa thuận bằng văn bản của vợ chồng. Thửa đất là tài sản chung nên anh Phong không được một mình chuyển nhượng; công chứng viên cũng phải yêu cầu sự đồng ý của chị Giang.","b":"Điều 35 Luật Hôn nhân và gia đình 2014","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Thủ tục pháp lý để ông Dương chuyển đất thương mại, dịch vụ sang đất ở là gì?","o":["Chỉ đăng ký biến động, vì chỉ chuyển trong nhóm đất nông nghiệp mới phải xin phép","Không có thủ tục nào, vì đất thương mại, dịch vụ không được chuyển mục đích","Chỉ đăng ký biến động, nếu diện tích chuyển mục đích dưới 500 m²","Phải được cơ quan có thẩm quyền cho phép chuyển mục đích"],"a":3,"e":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024: chuyển đất phi nông nghiệp không phải là đất ở sang đất ở phải được cơ quan nhà nước có thẩm quyền cho phép. Dù cùng nhóm đất phi nông nghiệp, trường hợp này vẫn phải xin phép.","b":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Cơ quan có thẩm quyền xem xét cho phép chuyển mục đích dựa trên căn cứ nào?","o":["Nhu cầu và khả năng tài chính của ông Dương","Kế hoạch sử dụng đất đã được phê duyệt","Ý kiến đồng thuận của các hộ có đất liền kề","Giá đất thị trường tại thời điểm xin chuyển mục đích"],"a":1,"e":"Điều 116 Luật Đất đai 2024: căn cứ cho phép chuyển mục đích sử dụng đất là quy hoạch, kế hoạch sử dụng đất đã được cơ quan nhà nước có thẩm quyền phê duyệt (và nhu cầu sử dụng đất thể hiện trong đơn). Ý kiến hộ liền kề hay giá thị trường không phải căn cứ.","b":"Điều 116 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Nếu được phép chuyển sang đất ở, thời hạn sử dụng 300 m² đất của ông Dương là gì?","o":["Ổn định lâu dài, theo thời hạn sử dụng của đất ở","Thời hạn còn lại của đất thương mại, dịch vụ","50 năm kể từ ngày được phép","70 năm kể từ ngày được phép"],"a":0,"e":"Khoản 3 Điều 173 Luật Đất đai 2024: chuyển đất phi nông nghiệp có thời hạn sang đất phi nông nghiệp sử dụng ổn định lâu dài thì người sử dụng đất được sử dụng ổn định lâu dài; đất ở là đất sử dụng ổn định lâu dài (khoản 1 Điều 171).","b":"Khoản 3 Điều 173, khoản 1 Điều 171 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Sau khi được cho phép, ông Dương phải thực hiện nghĩa vụ gì và áp dụng chế độ sử dụng đất nào?","o":["Không phải nộp tiền, vì đã nộp tiền khi được giao đất thương mại, dịch vụ","Nộp tiền nhưng vẫn áp dụng chế độ đất thương mại, dịch vụ","Thực hiện nghĩa vụ tài chính; áp dụng chế độ sử dụng đất ở","Chỉ nộp lệ phí trước bạ, vẫn áp dụng chế độ đất cũ"],"a":2,"e":"Khoản 4 Điều 121 Luật Đất đai 2024: khi chuyển mục đích sử dụng đất thuộc trường hợp phải xin phép thì người sử dụng đất phải thực hiện nghĩa vụ tài chính theo quy định; chế độ sử dụng đất, quyền và nghĩa vụ của người sử dụng đất được áp dụng theo loại đất sau khi được chuyển mục đích.","b":"Khoản 4 Điều 121 Luật Đất đai 2024","cid":"TH3.03"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Tại thời điểm 05/3/2026, ông Hùng có đủ điều kiện chuyển nhượng quyền sử dụng đất không?","o":["Đủ, vì đáp ứng các điều kiện tại khoản 1 Điều 45","Không, vì thời hạn sử dụng đất ở đã hết","Không, vì Giấy chứng nhận chỉ ghi tên một người","Không, vì thiếu văn bản cho phép của Ủy ban nhân dân xã"],"a":0,"e":"Khoản 1 Điều 45 Luật Đất đai 2024: ông Hùng có Giấy chứng nhận, đất không tranh chấp, không bị kê biên, đất ở sử dụng ổn định lâu dài, không bị áp dụng biện pháp khẩn cấp tạm thời nên đủ điều kiện chuyển nhượng. Giấy chứng nhận cấp riêng cho ông nên ông tự mình giao dịch.","b":"Khoản 1 Điều 45 Luật Đất đai 2024","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Yêu cầu hủy giao dịch của ông Hùng với lý do \"chưa công chứng\" được giải quyết thế nào?","o":["Chấp nhận, nếu ông Hùng trả lại gấp đôi số tiền đã nhận","Chấp nhận, vì hợp đồng không công chứng đương nhiên vô hiệu","Không chấp nhận, vì bà Lan đã thực hiện ít nhất 2/3 nghĩa vụ","Không chấp nhận, vì giấy viết tay có hai người làm chứng có giá trị như công chứng"],"a":2,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024 yêu cầu hợp đồng chuyển nhượng phải công chứng, chứng thực. Tuy nhiên, khoản 2 Điều 129 BLDS: giao dịch đã được xác lập bằng văn bản nhưng vi phạm quy định bắt buộc về công chứng, chứng thực mà một bên hoặc các bên đã thực hiện ít nhất hai phần ba nghĩa vụ thì theo yêu cầu, Tòa án ra quyết định công nhận hiệu lực. Bà Lan đã trả 1,35/1,8 tỷ đồng (75%).","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024; khoản 2 Điều 129 Bộ luật Dân sự 2015","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Tòa án công nhận hợp đồng. Việc chuyển quyền sử dụng đất cho bà Lan có hiệu lực từ khi nào?","o":["Khi bà Lan trả đủ 1,8 tỷ đồng cho ông Hùng","Khi bà Lan nhận bản gốc Giấy chứng nhận","Từ ngày 05/3/2026 khi hai bên ký giấy viết tay","Từ thời điểm đăng ký vào sổ địa chính"],"a":3,"e":"Điều 503 BLDS: việc chuyển quyền sử dụng đất có hiệu lực kể từ thời điểm đăng ký theo quy định của Luật Đất đai. Bản án công nhận hợp đồng là căn cứ để bà Lan đăng ký biến động; việc nhận bản gốc Giấy chứng nhận hay trả đủ tiền không phải thời điểm chuyển quyền.","b":"Điều 503 Bộ luật Dân sự 2015","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Sau khi bản án có hiệu lực, bà Lan phải đăng ký biến động trong thời hạn nào?","o":["90 ngày kể từ ngày bản án có hiệu lực","30 ngày kể từ ngày có biến động","Không có thời hạn, đăng ký khi bà Lan có nhu cầu","06 tháng kể từ ngày bản án có hiệu lực"],"a":1,"e":"Khoản 3 Điều 133 Luật Đất đai 2024: các trường hợp đăng ký biến động (trong đó có chuyển nhượng quyền sử dụng đất) thì trong thời hạn 30 ngày kể từ ngày có biến động, người sử dụng đất phải thực hiện thủ tục đăng ký biến động.","b":"Khoản 3 Điều 133 Luật Đất đai 2024","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Chị Chín có được nhận thừa kế quyền sử dụng đất ở và được cấp Giấy chứng nhận không?","o":["Chỉ được, nếu chị Chín thôi quốc tịch Mỹ","Được, vì chị là người gốc Việt Nam được phép nhập cảnh","Không, chị Chín chỉ được hưởng giá trị của phần thừa kế","Không, vì chị Chín không có quốc tịch Việt Nam"],"a":1,"e":"Khoản 1 Điều 44 Luật Đất đai 2024: người gốc Việt Nam định cư ở nước ngoài thuộc đối tượng được sở hữu nhà ở tại Việt Nam thì được nhận thừa kế nhà ở gắn liền với quyền sử dụng đất ở và được cấp Giấy chứng nhận. Chị Chín được phép nhập cảnh nên đủ điều kiện.","b":"Khoản 1 Điều 44 Luật Đất đai 2024","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Anh Peter, quốc tịch Úc, được hưởng phần di sản là quyền sử dụng đất ở như thế nào?","o":["Không được cấp Giấy chứng nhận, nhưng được chuyển nhượng, tặng cho phần thừa kế","Được cấp Giấy chứng nhận như các đồng thừa kế khác","Phần thừa kế thuộc về Nhà nước vì không có người nhận hợp lệ","Mất quyền hưởng di sản vì là con nuôi người nước ngoài"],"a":0,"e":"Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024: người nhận thừa kế không thuộc đối tượng được đứng tên quyền sử dụng đất thì không được cấp Giấy chứng nhận nhưng được chuyển nhượng hoặc tặng cho quyền sử dụng đất thừa kế cho người đủ điều kiện. Con nuôi hợp pháp vẫn thuộc hàng thừa kế thứ nhất.","b":"Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Khi chưa phân chia di sản, những người thừa kế phải làm thủ tục gì về đất đai?","o":["Đề nghị Ủy ban nhân dân xã cấp Giấy chứng nhận chung cho tất cả","Khởi kiện chia di sản thừa kế tại Tòa án","Không phải làm gì cho đến khi phân chia di sản","Nộp hồ sơ nhận thừa kế để cập nhật vào sổ địa chính"],"a":3,"e":"Khoản 5 Điều 44 Luật Đất đai 2024: trường hợp chưa phân chia thừa kế, người nhận thừa kế hoặc người đại diện nộp hồ sơ về việc nhận thừa kế tại cơ quan đăng ký đất đai để cập nhật vào sổ địa chính. Việc khởi kiện chỉ đặt ra khi có tranh chấp.","b":"Khoản 5 Điều 44 Luật Đất đai 2024","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"lv":"VD","q":"Anh Peter có thể nhờ anh Tám trông nom phần di sản bằng cách nào?","o":["Chỉ cần thỏa thuận miệng giữa anh Peter và anh Tám","Phải ủy quyền cho luật sư hoặc tổ chức hành nghề luật sư","Ủy quyền bằng văn bản cho anh Tám trông nom, tạm sử dụng đất","Không được, vì anh Peter là người nước ngoài"],"a":2,"e":"Khoản 6 Điều 44 Luật Đất đai 2024: người nhận thừa kế chưa được cấp Giấy chứng nhận được ủy quyền bằng văn bản cho người trông nom hoặc tạm sử dụng đất và thực hiện nghĩa vụ theo quy định của pháp luật đất đai. Không bắt buộc người được ủy quyền là luật sư.","b":"Khoản 6 Điều 44 Luật Đất đai 2024","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Bà Yến có được thế chấp quyền sử dụng đất cho ông Phát (cá nhân) không?","o":["Chỉ được, nếu ông Phát là người thân thích của bà Yến","Không, chỉ được thế chấp tại tổ chức tín dụng","Không, đất ở không được dùng để thế chấp","Được, cá nhân có thể nhận thế chấp quyền sử dụng đất"],"a":3,"e":"Điểm g khoản 1 Điều 37 Luật Đất đai 2024: cá nhân sử dụng đất được thế chấp quyền sử dụng đất tại tổ chức tín dụng, tổ chức kinh tế khác hoặc cá nhân theo quy định của pháp luật.","b":"Điểm g khoản 1 Điều 37 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"Hợp đồng thế chấp chỉ có chữ ký hai bên được đánh giá thế nào về hình thức?","o":["Vi phạm, vì phải được công chứng hoặc chứng thực","Hợp lệ, vì hợp đồng thế chấp không bắt buộc công chứng","Hợp lệ, vì khoản vay dưới 2 tỷ đồng thì không cần công chứng","Hợp lệ, vì có người làm chứng ký vào hợp đồng là đủ"],"a":0,"e":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024: hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất phải được công chứng hoặc chứng thực. Giá trị khoản vay không làm thay đổi yêu cầu này.","b":"Điểm a khoản 3 Điều 27 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Nếu bà Yến muốn vẫn giữ quyền sử dụng đất khi cùng làm ăn với Công ty Sơn Hà, bà nên chọn hình thức nào và vì sao?","o":["Cho công ty thuê đất dài hạn rồi góp vốn sau để giữ quyền","Hợp tác kinh doanh, vì không làm chuyển quyền sử dụng đất","Góp vốn, vì góp vốn không làm chuyển quyền sử dụng đất sang công ty","Hai hình thức có hệ quả như nhau nên chọn hình thức nào cũng được"],"a":1,"e":"Khoản 22 Điều 3 Luật Đất đai 2024: góp vốn bằng quyền sử dụng đất là sự chuyển giao quyền sử dụng đất để trở thành vốn, tài sản của tổ chức kinh tế, người góp vốn nhận phần vốn góp. Khoản 26: hợp tác sản xuất, kinh doanh bằng quyền sử dụng đất là thỏa thuận giữa các bên mà không làm thay đổi quyền sử dụng đất của bên có quyền sử dụng đất.","b":"Khoản 22, khoản 26 Điều 3 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Nếu bà Yến chọn góp vốn, Công ty Sơn Hà có quyền và nghĩa vụ đối với thửa đất như chủ thể nào?","o":["Như cá nhân thuê đất trả tiền thuê đất hằng năm","Như người được Nhà nước giao đất để quản lý","Như tổ chức kinh tế được giao đất có thu tiền","Như tổ chức được giao đất không thu tiền sử dụng đất"],"a":2,"e":"Khi nhận góp vốn, quyền sử dụng đất chuyển sang Công ty Sơn Hà. Theo Luật Đất đai 2024 (Điều 33, điểm b khoản 1 Điều 36 về tổ chức kinh tế nhận chuyển quyền sử dụng đất), tổ chức kinh tế nhận góp vốn bằng quyền sử dụng đất có quyền, nghĩa vụ như tổ chức kinh tế được Nhà nước giao đất có thu tiền sử dụng đất.","b":"Điểm b khoản 1 Điều 36, Điều 33 Luật Đất đai 2024","cid":"TH4.03"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Diện tích 1,2 ha được giao không thu tiền trong hạn mức có được bồi thường về đất không?","o":["Chỉ được tính phần diện tích đã có công trình xây dựng","Có, vì đất nông nghiệp được giao trong hạn mức thì được bồi thường","Chỉ được bồi thường 1 ha theo hạn mức giao đất tối thiểu","Không, vì đất giao không thu tiền thì không được bồi thường"],"a":1,"e":"Điểm a khoản 2 Điều 96 Luật Đất đai 2024: diện tích đất nông nghiệp được giao trong hạn mức thuộc diện được bồi thường về đất, kể cả khi được giao không thu tiền sử dụng đất. Vì vậy toàn bộ 1,2 ha của bà Liên được tính bồi thường.","b":"Điểm a khoản 2 Điều 96 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Bà Liên có thể được bồi thường về đất bằng những hình thức nào?","o":["Bằng đất nông nghiệp, bằng tiền, hoặc đất khác, nhà ở nếu có quỹ","Chỉ bằng cổ phần của doanh nghiệp đầu tư khu công nghiệp","Chỉ bằng việc làm tại khu công nghiệp","Chỉ bằng đất nông nghiệp ở địa phương khác"],"a":0,"e":"Khoản 1 Điều 96 Luật Đất đai 2024: cá nhân đang sử dụng đất nông nghiệp khi Nhà nước thu hồi đất được bồi thường bằng đất nông nghiệp hoặc bằng tiền hoặc bằng đất có mục đích sử dụng khác với loại đất thu hồi hoặc bằng nhà ở nếu địa phương có điều kiện về quỹ đất, quỹ nhà.","b":"Khoản 1 Điều 96 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Địa phương không còn quỹ đất nông nghiệp. Tiền bồi thường cho bà Liên được tính theo giá nào?","o":["Giá do chủ đầu tư khu công nghiệp tự xác định","Giá do bà Liên đề xuất và được Hội đồng bồi thường chấp nhận","Giá trong hợp đồng chuyển nhượng gần nhất tại địa phương","Giá đất cụ thể tại thời điểm phê duyệt phương án"],"a":3,"e":"Khoản 2 Điều 91 Luật Đất đai 2024: trường hợp không có đất để bồi thường thì người có đất thu hồi được bồi thường bằng tiền theo giá đất cụ thể của loại đất thu hồi do cơ quan có thẩm quyền quyết định tại thời điểm phê duyệt phương án bồi thường, hỗ trợ, tái định cư.","b":"Khoản 2 Điều 91 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"lv":"VD","q":"Nguyện vọng được hỗ trợ để chuyển sang nghề khác của bà Liên thuộc khoản hỗ trợ nào?","o":["Hỗ trợ di dời vật nuôi","Hỗ trợ tái định cư cho hộ phải di chuyển chỗ ở","Hỗ trợ đào tạo, chuyển đổi nghề, tìm việc làm","Hỗ trợ tháo dỡ, phá dỡ công trình trên đất thu hồi"],"a":2,"e":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024: hỗ trợ đào tạo, chuyển đổi nghề và tìm kiếm việc làm áp dụng cho cá nhân trực tiếp sản xuất nông nghiệp khi Nhà nước thu hồi đất nông nghiệp.","b":"Điểm d khoản 1 Điều 108 Luật Đất đai 2024","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Gia đình ông Hưng có thể được bồi thường về đất bằng hình thức nào?","o":["Chỉ bằng tiền theo giá thỏa thuận với chủ đầu tư dự án","Chỉ được hỗ trợ tiền thuê nhà tạm thời","Chỉ bằng đất nông nghiệp tại địa phương","Bằng đất ở, nhà ở, tiền hoặc đất khác"],"a":3,"e":"Khoản 1 Điều 98 Luật Đất đai 2024: cá nhân đang sử dụng đất ở có đủ điều kiện được bồi thường thì được bồi thường bằng đất ở hoặc bằng nhà ở hoặc bằng tiền hoặc bằng đất có mục đích sử dụng khác với loại đất thu hồi, tùy nguyện vọng và quỹ đất, quỹ nhà của địa phương.","b":"Khoản 1 Điều 98 Luật Đất đai 2024","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Ngôi nhà ba tầng phải tháo dỡ toàn bộ được bồi thường thế nào?","o":["Theo giá trị xây dựng mới của nhà tương đương","Không được bồi thường, vì chỉ bồi thường về đất","Theo giá do gia đình ông Hưng tự kê khai","Theo giá trị còn lại của ngôi nhà sau khấu hao"],"a":0,"e":"Khoản 1 Điều 102 Luật Đất đai 2024: đối với nhà ở, công trình phục vụ sinh hoạt gắn liền với đất phải tháo dỡ toàn bộ, chủ sở hữu được bồi thường bằng giá trị xây dựng mới của nhà ở, công trình có tiêu chuẩn kỹ thuật tương đương.","b":"Khoản 1 Điều 102 Luật Đất đai 2024","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Tiền bồi thường về đất ở thấp hơn giá trị một suất tái định cư tối thiểu. Gia đình được xử lý thế nào?","o":["Chỉ được nhận tiền bồi thường, không được bố trí tái định cư","Được hỗ trợ đủ để nhận một suất tái định cư tối thiểu","Được giao đất nông nghiệp thay thế cho phần còn thiếu","Phải tự bù phần thiếu để được nhận suất tái định cư"],"a":1,"e":"Khoản 8 Điều 111 Luật Đất đai 2024: trường hợp tiền bồi thường về đất ở không đủ để được giao một suất tái định cư tối thiểu thì được Nhà nước hỗ trợ tiền đủ để được giao một suất tái định cư tối thiểu.","b":"Khoản 8 Điều 111 Luật Đất đai 2024","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"lv":"VD","q":"Diện tích, quy mô của suất tái định cư tối thiểu áp dụng cho gia đình ông Hưng do cơ quan nào quy định?","o":["Chủ đầu tư dự án mở rộng đường","Quốc hội","Ủy ban nhân dân cấp tỉnh","Ủy ban nhân dân cấp xã"],"a":2,"e":"Điều 111 Luật Đất đai 2024 giao Ủy ban nhân dân cấp tỉnh quy định chi tiết suất tái định cư tối thiểu (bằng đất ở, nhà ở hoặc bằng tiền) phù hợp với điều kiện của địa phương.","b":"Điều 111 Luật Đất đai 2024","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"VD","q":"Trước khi cưỡng chế, cần đáp ứng điều kiện nào liên quan đến ông Toàn?","o":["Đã có ý kiến đồng ý của Hội đồng nhân dân tỉnh","Ông Toàn đã nhận quyết định cưỡng chế hoặc có biên bản từ chối, vắng mặt","Ông Toàn đã ký biên bản đồng ý với việc cưỡng chế","Đã có bản án của Tòa án về việc thu hồi đất"],"a":1,"e":"Điểm d khoản 2 Điều 89 Luật Đất đai 2024: một điều kiện cưỡng chế là người có đất thu hồi đã nhận được quyết định cưỡng chế có hiệu lực thi hành; trường hợp từ chối nhận hoặc vắng mặt thì Ủy ban nhân dân cấp xã lập biên bản. Không cần bản án hay sự đồng ý của người bị cưỡng chế.","b":"Điểm d khoản 2 Điều 89 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"VD","q":"Việc dự kiến cưỡng chế vào ngày mùng 5 Tết Âm lịch có đúng pháp luật không?","o":["Không, vì không được cưỡng chế trong 15 ngày trước và sau Tết","Hợp pháp, vì quyết định cưỡng chế đã có hiệu lực thi hành","Hợp pháp, nếu có lực lượng công an hỗ trợ bảo đảm an ninh","Hợp pháp, vì ông Toàn đã được thông báo trước thời điểm cưỡng chế"],"a":0,"e":"Khoản 1 Điều 89 Luật Đất đai 2024: không thực hiện cưỡng chế trong thời gian 15 ngày trước và sau thời gian nghỉ Tết Âm lịch. Ngày mùng 5 Tết nằm trong khoảng thời gian cấm.","b":"Khoản 1 Điều 89 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Thời điểm bắt đầu cưỡng chế lúc 5 giờ sáng vi phạm quy định nào?","o":["Quy định chỉ được bắt đầu cưỡng chế sau 08 giờ sáng","Quy định chỉ được cưỡng chế vào ngày thứ Bảy, Chủ nhật","Không vi phạm, vì pháp luật không quy định về giờ cưỡng chế","Quy định cấm cưỡng chế từ 22 giờ hôm trước đến 06 giờ sáng hôm sau"],"a":3,"e":"Khoản 1 Điều 89 Luật Đất đai 2024: việc cưỡng chế không thực hiện trong khoảng thời gian từ 22 giờ ngày hôm trước đến 06 giờ sáng ngày hôm sau. Bắt đầu lúc 5 giờ sáng là vi phạm.","b":"Khoản 1 Điều 89 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"lv":"VD","q":"Nếu đến ngày cưỡng chế hợp lệ, ông Toàn tự nguyện chấp hành thì việc bàn giao đất được thực hiện chậm nhất khi nào?","o":["Ngay trong ngày lập biên bản ghi nhận việc chấp hành","90 ngày kể từ ngày lập biên bản ghi nhận việc chấp hành","30 ngày kể từ ngày lập biên bản ghi nhận việc chấp hành","Sau khi ông Toàn nhận đủ tiền bồi thường bổ sung"],"a":2,"e":"Khoản 4 Điều 89 Luật Đất đai 2024: trường hợp người bị cưỡng chế chấp hành quyết định cưỡng chế thì Ban thực hiện cưỡng chế lập biên bản ghi nhận sự chấp hành và việc bàn giao đất được thực hiện chậm nhất sau 30 ngày kể từ ngày lập biên bản.","b":"Khoản 4 Điều 89 Luật Đất đai 2024","cid":"TH5.03"},{"id":"TH6.01.1","g":6,"lv":"VD","q":"Việc hòa giải phải hoàn thành chậm nhất vào ngày nào?","o":["Ngày 12/6/2026","Ngày 12/7/2026","Ngày 13/5/2026","Ngày 12/5/2026"],"a":2,"e":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024: việc hòa giải tại Ủy ban nhân dân cấp xã được thực hiện trong thời hạn không quá 30 ngày kể từ ngày nhận được đơn. Ngày bắt đầu tính là 14/4/2026, ngày thứ 30 là 13/5/2026 (thứ Tư).","b":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"VD","q":"Đến ngày 25/5/2026 xã vẫn chưa hòa giải. Việc này được đánh giá thế nào?","o":["Vi phạm thời hạn hòa giải không quá 30 ngày","Không vi phạm, vì xã còn thời hạn hòa giải 60 ngày","Chưa vi phạm, vì chưa có ý kiến của ông Khải","Không vi phạm, vì hòa giải ở cơ sở không bắt buộc"],"a":0,"e":"Đến ngày 25/5/2026 đã quá thời hạn 30 ngày kể từ ngày nhận đơn (hạn chót 13/5/2026) nên Ủy ban nhân dân xã vi phạm điểm c khoản 2 Điều 235 Luật Đất đai 2024. Thời hạn không phụ thuộc ý kiến của bên kia.","b":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Ông Khải không ký biên bản hòa giải. Biên bản được xử lý thế nào?","o":["Biên bản vô hiệu, phải tổ chức hòa giải lại từ đầu","Ủy ban nhân dân xã ra quyết định xử phạt ông Khải","Biên bản chỉ có giá trị đối với bà Dung là người đã ký","Hội đồng hòa giải ký, đóng dấu xã và gửi các bên"],"a":3,"e":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024: trường hợp một trong các bên không ký biên bản thì Chủ tịch, các thành viên Hội đồng hòa giải ký, đóng dấu của Ủy ban nhân dân cấp xã và gửi cho các bên. Biên bản vẫn có giá trị là căn cứ để yêu cầu giải quyết tiếp.","b":"Điểm đ khoản 2 Điều 235 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"lv":"VD","q":"Hòa giải không thành, cả hai bên đều có Giấy chứng nhận. Tranh chấp do cơ quan nào giải quyết?","o":["Văn phòng đăng ký đất đai","Tòa án nhân dân, vì các bên đã có Giấy chứng nhận","Hội đồng hòa giải xã ra quyết định cuối cùng","Chủ tịch Ủy ban nhân dân tỉnh"],"a":1,"e":"Khoản 1 Điều 236 Luật Đất đai 2024: tranh chấp đất đai mà các bên hoặc một trong các bên có Giấy chứng nhận hoặc giấy tờ quy định tại Điều 137 do Tòa án giải quyết. Hội đồng hòa giải không có quyền ra quyết định giải quyết tranh chấp.","b":"Khoản 1 Điều 236 Luật Đất đai 2024","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"VD","q":"Để có căn cứ đối chiếu diện tích và mức bồi thường, ông Hoàng có quyền tiếp cận phương án bồi thường đã phê duyệt không?","o":["Không, vì đây là thông tin nội bộ của cơ quan nhà nước","Chỉ khi chủ đầu tư dự án đồng ý cung cấp","Chỉ khi có văn bản yêu cầu của Tòa án đang giải quyết vụ việc","Có, vì đây là thông tin đất đai được công khai"],"a":3,"e":"Điểm đ khoản 1 Điều 24 Luật Đất đai 2024: công dân được tiếp cận thông tin về phương án bồi thường, hỗ trợ, tái định cư khi Nhà nước thu hồi đất đã được cơ quan có thẩm quyền phê duyệt. Đây là bước đầu để ông Hoàng có chứng cứ khi khiếu nại, khởi kiện.","b":"Điểm đ khoản 1 Điều 24 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"VD","q":"Ông Hoàng có những con đường pháp lý nào để phản đối quyết định thu hồi đất?","o":["Yêu cầu Hội đồng hòa giải xã hủy quyết định thu hồi đất","Khiếu nại hoặc khởi kiện vụ án hành chính","Yêu cầu chủ đầu tư thương lượng lại giá bồi thường","Không bàn giao đất cho đến khi được giải quyết xong"],"a":1,"e":"Khoản 8 Điều 26 và Điều 237 Luật Đất đai 2024: người sử dụng đất có quyền khiếu nại, tố cáo, khởi kiện về những hành vi vi phạm quyền sử dụng đất hợp pháp; khiếu nại, khởi kiện quyết định hành chính, hành vi hành chính về đất đai. Hội đồng hòa giải xã không có quyền hủy quyết định hành chính.","b":"Khoản 8 Điều 26, Điều 237 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Nếu ông Hoàng chọn khiếu nại, việc giải quyết được thực hiện theo pháp luật nào?","o":["Pháp luật về khiếu nại, đối với quyết định hành chính về đất đai","Pháp luật về tố tụng dân sự","Pháp luật về trọng tài thương mại","Pháp luật về hòa giải ở cơ sở"],"a":0,"e":"Điều 237 Luật Đất đai 2024: việc giải quyết khiếu nại quyết định hành chính, hành vi hành chính về đất đai thực hiện theo quy định của pháp luật về khiếu nại.","b":"Điều 237 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"lv":"VD","q":"Nếu ông Hoàng khởi kiện quyết định thu hồi đất ra Tòa án, vụ việc được giải quyết theo thủ tục nào?","o":["Tố tụng dân sự, vì liên quan đến quyền sử dụng đất","Tố tụng hình sự, vì có dấu hiệu làm trái công vụ","Tố tụng hành chính, vì đối tượng là quyết định hành chính","Thủ tục rút gọn, vì chứng cứ đã rõ ràng"],"a":2,"e":"Điều 237 Luật Đất đai 2024: việc khởi kiện quyết định hành chính, hành vi hành chính về đất đai thực hiện theo pháp luật về tố tụng hành chính. Đây là quan hệ giữa người dân với cơ quan hành chính, không phải tranh chấp dân sự giữa các bên bình đẳng.","b":"Điều 237 Luật Đất đai 2024","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"lv":"VD","q":"Hành vi đào sâu làm mất tầng canh tác trên đất trồng lúa của ông Lực là hành vi gì?","o":["Lấn đất","Chiếm đất","Hủy hoại đất","Chuyển đổi cơ cấu cây trồng"],"a":2,"e":"Đào sâu 3 m làm mất tầng canh tác, làm đất trồng lúa không còn khả năng sử dụng theo mục đích – là hủy hoại đất (khoản 27 Điều 3), hành vi bị nghiêm cấm (khoản 1 Điều 11 Luật Đất đai 2024).","b":"Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"lv":"VD","q":"Ông Lực đã vi phạm nghĩa vụ nào của người sử dụng đất?","o":["Kê khai đăng ký đất đai","Tuân thủ quy định về vật tìm thấy trong lòng đất","Bàn giao đất khi Nhà nước thu hồi","Thực hiện biện pháp bảo vệ đất"],"a":3,"e":"Khoản 4 Điều 31 Luật Đất đai 2024: người sử dụng đất có nghĩa vụ thực hiện biện pháp bảo vệ đất, không làm tổn hại đến lợi ích hợp pháp của người sử dụng đất có liên quan. Đào lấy đất làm mất tầng canh tác vi phạm nghĩa vụ này.","b":"Khoản 4 Điều 31 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"lv":"VD","q":"Ông Lực đã bị xử phạt năm 2025 nhưng năm 2026 tiếp tục vi phạm. Ông có thể bị xử lý thế nào về đất?","o":["Chỉ bị phạt tiền lần hai, không bị thu hồi đất","Bị thu hồi đất do vi phạm pháp luật đất đai","Chỉ bị nhắc nhở, yêu cầu khắc phục hậu quả","Được chuyển sang hình thức thuê đất trả tiền hằng năm"],"a":1,"e":"Khoản 2 Điều 81 Luật Đất đai 2024: người sử dụng đất hủy hoại đất và đã bị xử phạt vi phạm hành chính mà tiếp tục vi phạm thì Nhà nước thu hồi đất do vi phạm pháp luật về đất đai.","b":"Khoản 2 Điều 81 Luật Đất đai 2024","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"lv":"VD","q":"Ngoài thu hồi đất, ông Lực có thể phải chịu trách nhiệm pháp lý nào khác?","o":["Bị xử phạt hành chính hoặc truy cứu hình sự; phải bồi thường nếu gây thiệt hại","Không phải chịu trách nhiệm nào khác ngoài việc bị thu hồi đất","Chỉ chịu trách nhiệm dân sự đối với các hộ liền kề","Chỉ bị xử lý kỷ luật tại nơi công tác"],"a":0,"e":"Điều 239 Luật Đất đai 2024: người có hành vi vi phạm pháp luật về đất đai thì tùy theo tính chất, mức độ vi phạm mà bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự; nếu gây thiệt hại thì phải bồi thường theo quy định của pháp luật.","b":"Điều 239 Luật Đất đai 2024","cid":"TH6.03"}],"th":[{"name":"Chương 1. Những vấn đề chung về Luật Đất đai","items":[{"cid":"TH1.01","title":"Tự xây nhà trên đất trồng cây lâu năm","text":"Bà Hoa được cấp Giấy chứng nhận năm 2015 đối với thửa đất 500 m², mục đích sử dụng ghi trên Giấy chứng nhận là đất trồng cây lâu năm. Năm 2020, bà Hoa tự xây nhà ở cấp 4 trên 100 m² của thửa đất mà không xin phép. Năm 2026, khi cơ quan nhà nước kiểm tra, bà Hoa cho rằng thửa đất là \"của bà\" nên bà có toàn quyền quyết định mục đích sử dụng, và phần đất đã xây nhà nay \"đương nhiên là đất ở\".","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 10, điểm b khoản 2 Điều 9 Luật Đất đai 2024; Khoản 1 Điều 5, Điều 11 Luật Đất đai 2024; Điểm b khoản 1 Điều 121 Luật Đất đai 2024; Điều 12, khoản 2 Điều 13 Luật Đất đai 2024; Điều 53 Hiến pháp 2013","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]},{"cid":"TH1.02","title":"Chủ hộ tự ký chuyển nhượng đất của hộ","text":"Năm 2010, hộ ông Sơn gồm ông Sơn, vợ là bà Mai và hai con đã thành niên đang sống chung được Nhà nước giao 2.000 m² đất trồng lúa; Giấy chứng nhận ghi \"Hộ ông Đỗ Văn Sơn\". Năm 2026, ông Sơn tự ký giấy chuyển nhượng 500 m² cho ông Tùng mà không hỏi ý kiến vợ và các con. Giấy chuyển nhượng do hai bên tự viết, không công chứng, chứng thực. Bà Mai và các con phản đối.","ask":[],"guide":[],"basis":"Khoản 25 Điều 3, điểm a khoản 2 Điều 27 Luật Đất đai 2024; Điểm b khoản 2 Điều 27 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; Điều 142 Bộ luật Dân sự 2015","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]},{"cid":"TH1.03","title":"Lối đi qua thửa đất liền kề bị chặn","text":"Thửa đất ở của gia đình ông Quang nằm phía sau thửa đất 1.200 m² của bà Lụa, bị vây bọc, không có lối đi ra đường công cộng. Nhiều năm nay, gia đình ông Quang đi qua một lối nhỏ trên đất của bà Lụa theo thỏa thuận miệng, chưa đăng ký. Tháng 8/2026, do mâu thuẫn, bà Lụa xây tường chặn lối đi. Ông Quang cho rằng đi qua nhiều năm nên lối đi \"đã thuộc quyền sở hữu\" của gia đình ông.","ask":[],"guide":[],"basis":"Khoản 1 Điều 29 Luật Đất đai 2024; Điều 254 Bộ luật Dân sự 2015; Khoản 2 Điều 29 Luật Đất đai 2024; Khoản 8 Điều 26 Luật Đất đai 2024","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]},{"name":"Chương 2. Chế độ sử dụng các loại đất","items":[{"cid":"TH2.01","title":"Thời hạn đất giao, đất thuê và đất nhận chuyển nhượng","text":"Ông Tâm là cá nhân trực tiếp sản xuất nông nghiệp tại tỉnh N (không thuộc Đông Nam Bộ, đồng bằng sông Cửu Long). Năm 1996, ông được Nhà nước giao 1,5 ha đất trồng cây hằng năm trong hạn mức. Năm 2000, ông được Nhà nước cho thuê thêm 3 ha đất trồng cây hằng năm với thời hạn 30 năm, trả tiền thuê hằng năm; trên đất thuê ông xây nhà kho. Năm 2026, ông Tâm chuyển nhượng 0,5 ha đất được giao cho ông Hùng, cũng là cá nhân trực tiếp sản xuất nông nghiệp.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 172 Luật Đất đai 2024; Khoản 3 Điều 172 Luật Đất đai 2024; Khoản 4 Điều 172 Luật Đất đai 2024; Khoản 1 Điều 174 Luật Đất đai 2024","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]},{"cid":"TH2.02","title":"Đào ao nuôi cá trên đất chuyên trồng lúa","text":"Ông Hiếu có Giấy chứng nhận đối với 3.000 m² đất trồng lúa, cấy hai vụ mỗi năm. Năm 2026, ông muốn đào 500 m² thành ao sâu 3 m để nuôi cá; việc đào ao sẽ làm mất tầng canh tác, không thể trồng lúa trở lại. Ông cho rằng đây chỉ là \"chuyển đổi cơ cấu cây trồng, vật nuôi\" nên không cần xin phép.","ask":[],"guide":[],"basis":"Khoản 1 Điều 182 Luật Đất đai 2024; Khoản 5 Điều 182 Luật Đất đai 2024; Điểm a khoản 1 Điều 121, khoản 3 Điều 182 Luật Đất đai 2024; Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]},{"cid":"TH2.03","title":"Tách thửa đất ở để tặng cho con","text":"Ông Phú có Giấy chứng nhận đối với thửa đất ở tại nông thôn 150 m², thời hạn lâu dài. Ông muốn tách 40 m² để tặng cho con gái; con gái ông đang sử dụng hợp pháp một thửa đất ở liền kề. Theo quy định của Ủy ban nhân dân tỉnh nơi có đất, diện tích tối thiểu được tách thửa đối với đất ở tại nông thôn là 50 m². Giữa ông Phú và hàng xóm đang có tranh chấp 10 m² ở góc thửa đất; phạm vi, ranh giới phần tranh chấp đã được xác định rõ. Để phần đất còn lại có đường đi, ông Phú dự định dành một dải đất ở 15 m² làm lối đi.","ask":[],"guide":[],"basis":"Điểm c khoản 1 Điều 220 Luật Đất đai 2024; Điểm a khoản 2 Điều 220 Luật Đất đai 2024; Khoản 4 Điều 220 Luật Đất đai 2024; Điểm d khoản 1 Điều 220 Luật Đất đai 2024","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]}]},{"name":"Chương 3. Quản lý nhà nước về đất đai","items":[{"cid":"TH3.01","title":"Người sử dụng đất từ năm 1988 chưa từng đăng ký","text":"Ông Định sử dụng ổn định 300 m² đất ở tại xã Tân Phú từ năm 1988 đến nay, không có giấy tờ về quyền sử dụng đất, không có tranh chấp, không vi phạm pháp luật đất đai. Trên đất có ngôi nhà ông tự xây năm 2000. Đến năm 2026, ông chưa từng đăng ký đất đai và cho rằng việc đăng ký là tùy ý. Ông muốn được cấp Giấy chứng nhận và hỏi có bắt buộc đăng ký quyền sở hữu ngôi nhà không.","ask":[],"guide":[],"basis":"Khoản 1 Điều 131 Luật Đất đai 2024; Điều 132 Luật Đất đai 2024; Khoản 2 Điều 138 Luật Đất đai 2024; Khoản 2 Điều 131 Luật Đất đai 2024","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]},{"cid":"TH3.02","title":"Giấy chứng nhận chỉ ghi tên chồng","text":"Năm 2025, trong thời kỳ hôn nhân, anh Phong và chị Giang dùng tiền chung mua một thửa đất ở; khi làm thủ tục, Giấy chứng nhận chỉ ghi tên anh Phong. Năm 2026, chị Giang đề nghị ghi thêm tên mình. Cùng thời gian đó, anh Phong định một mình ký hợp đồng chuyển nhượng thửa đất cho người khác vì \"sổ đỏ đứng tên tôi\".","ask":[],"guide":[],"basis":"Khoản 4 Điều 135 Luật Đất đai 2024; Khoản 3 Điều 135 Luật Đất đai 2024; Khoản 21 Điều 3 Luật Đất đai 2024; Điều 33, Điều 35 Luật Hôn nhân và gia đình 2014","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4"]},{"cid":"TH3.03","title":"Chuyển đất thương mại, dịch vụ sang đất ở","text":"Ông Dương được Nhà nước giao 300 m² đất thương mại, dịch vụ có thu tiền sử dụng đất, thời hạn 50 năm, đã có Giấy chứng nhận. Năm 2026, ông muốn chuyển toàn bộ diện tích này sang đất ở để xây nhà cho gia đình. Ông cho rằng vì cùng thuộc nhóm đất phi nông nghiệp nên chỉ cần đăng ký biến động.","ask":[],"guide":[],"basis":"Điểm đ khoản 1 Điều 121 Luật Đất đai 2024; Điều 116 Luật Đất đai 2024; Khoản 3 Điều 173, khoản 1 Điều 171 Luật Đất đai 2024; Khoản 4 Điều 121 Luật Đất đai 2024","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]}]},{"name":"Chương 4. Người sử dụng đất, quyền và nghĩa vụ","items":[{"cid":"TH4.01","title":"Chuyển nhượng đất bằng giấy viết tay","text":"Ông Hùng có Giấy chứng nhận quyền sử dụng 150 m² đất ở tại xã An Bình, tỉnh H, cấp riêng cho ông; thửa đất không có tranh chấp và không bị kê biên. Ngày 05/3/2026, ông Hùng và bà Lan lập giấy viết tay chuyển nhượng toàn bộ thửa đất với giá 1,8 tỷ đồng, có chữ ký hai bên và hai người làm chứng. Bà Lan đã trả 1,35 tỷ đồng; ông Hùng đã giao đất và bản gốc Giấy chứng nhận. Tháng 9/2026, giá đất tăng, ông Hùng đòi hủy giao dịch với lý do \"chưa công chứng\". Bà Lan yêu cầu Tòa án công nhận hợp đồng.","ask":[],"guide":[],"basis":"Khoản 1 Điều 45 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; khoản 2 Điều 129 Bộ luật Dân sự 2015; Điều 503 Bộ luật Dân sự 2015; Khoản 3 Điều 133 Luật Đất đai 2024","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]},{"cid":"TH4.02","title":"Thừa kế quyền sử dụng đất có yếu tố nước ngoài","text":"Ông Bảy chết năm 2025 không để lại di chúc. Di sản là nhà ở gắn liền với 200 m² đất ở đã có Giấy chứng nhận tại phường Tân Định, tỉnh S. Hàng thừa kế thứ nhất gồm: anh Tám, công dân Việt Nam sống tại tỉnh S; chị Chín, người gốc Việt Nam quốc tịch Mỹ, được phép nhập cảnh vào Việt Nam; anh Peter, quốc tịch Úc, là con nuôi hợp pháp của ông Bảy. Đến tháng 10/2026, những người thừa kế chưa phân chia di sản. Anh Peter sống ở Úc và muốn nhờ anh Tám trông nom phần di sản của mình.","ask":[],"guide":[],"basis":"Khoản 1 Điều 44 Luật Đất đai 2024; Khoản 3, khoản 5 Điều 44 Luật Đất đai 2024; Khoản 5 Điều 44 Luật Đất đai 2024; Khoản 6 Điều 44 Luật Đất đai 2024","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4"]},{"cid":"TH4.03","title":"Thế chấp rồi góp vốn bằng quyền sử dụng đất","text":"Bà Yến có Giấy chứng nhận đối với một thửa đất ở. Năm 2025, bà ký hợp đồng thế chấp thửa đất cho ông Phát (cá nhân) để vay 1 tỷ đồng; hợp đồng chỉ có chữ ký hai bên. Năm 2026, sau khi trả hết nợ và xóa thế chấp, bà dự định góp vốn bằng quyền sử dụng thửa đất này vào Công ty TNHH Sơn Hà để nhận phần vốn góp. Một người bạn khuyên bà chỉ nên \"hợp tác kinh doanh\" bằng quyền sử dụng đất để vẫn giữ quyền sử dụng đất.","ask":[],"guide":[],"basis":"Điểm g khoản 1 Điều 37 Luật Đất đai 2024; Điểm a khoản 3 Điều 27 Luật Đất đai 2024; Khoản 22, khoản 26 Điều 3 Luật Đất đai 2024; Điểm b khoản 1 Điều 36, Điều 33 Luật Đất đai 2024","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]}]},{"name":"Chương 5. Thu hồi đất, bồi thường, hỗ trợ, tái định cư","items":[{"cid":"TH5.01","title":"Bồi thường khi thu hồi đất nông nghiệp","text":"Bà Liên là cá nhân trực tiếp sản xuất nông nghiệp, có 1,2 ha đất trồng cây hằng năm được Nhà nước giao không thu tiền trong hạn mức và đã được cấp Giấy chứng nhận. Năm 2026, toàn bộ diện tích bị thu hồi để xây dựng khu công nghiệp. Địa phương không còn quỹ đất nông nghiệp để bồi thường. Bà Liên muốn được bồi thường bằng tiền và được hỗ trợ để chuyển sang nghề khác.","ask":[],"guide":[],"basis":"Điểm a khoản 2 Điều 96 Luật Đất đai 2024; Khoản 1 Điều 96 Luật Đất đai 2024; Khoản 2 Điều 91 Luật Đất đai 2024; Điểm d khoản 1 Điều 108 Luật Đất đai 2024","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]},{"cid":"TH5.02","title":"Thu hồi đất ở để mở rộng đường","text":"Gia đình ông Hưng có Giấy chứng nhận đối với 150 m² đất ở và ngôi nhà ba tầng; toàn bộ thửa đất bị thu hồi để mở rộng đường. Gia đình không còn chỗ ở nào khác trên địa bàn xã. Ngôi nhà phải tháo dỡ toàn bộ. Theo phương án, giá trị tiền bồi thường về đất ở của gia đình thấp hơn giá trị một suất tái định cư tối thiểu.","ask":[],"guide":[],"basis":"Khoản 1 Điều 98 Luật Đất đai 2024; Khoản 1 Điều 102 Luật Đất đai 2024; Khoản 8 Điều 111 Luật Đất đai 2024; Điều 111 Luật Đất đai 2024","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4"]},{"cid":"TH5.03","title":"Cưỡng chế thực hiện quyết định thu hồi đất","text":"Quyết định thu hồi đất của gia đình ông Toàn đã có hiệu lực từ tháng 5/2026. Ủy ban nhân dân xã, Ủy ban Mặt trận Tổ quốc xã và đơn vị bồi thường đã vận động, thuyết phục nhưng ông Toàn không bàn giao đất. Cơ quan có thẩm quyền ban hành quyết định cưỡng chế và dự kiến tổ chức cưỡng chế vào ngày mùng 5 Tết Âm lịch năm 2027, bắt đầu lúc 5 giờ sáng.","ask":[],"guide":[],"basis":"Điểm d khoản 2 Điều 89 Luật Đất đai 2024; Khoản 1 Điều 89 Luật Đất đai 2024; Khoản 4 Điều 89 Luật Đất đai 2024","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4"]}]},{"name":"Chương 6. Thanh tra, xử lý vi phạm, giải quyết tranh chấp, khiếu nại, tố cáo","items":[{"cid":"TH6.01","title":"Hòa giải tranh chấp ranh giới tại Ủy ban nhân dân cấp xã","text":"Ông Khải và bà Dung có hai thửa đất liền kề, đều đã có Giấy chứng nhận. Tháng 3/2026, hai bên tranh chấp 15 m² ở ranh giới. Ngày 13/4/2026, bà Dung nộp đơn yêu cầu hòa giải tại Ủy ban nhân dân xã. Đến ngày 25/5/2026, xã vẫn chưa tổ chức hòa giải. Tại buổi hòa giải sau đó, hai bên không thống nhất; ông Khải không ký biên bản.","ask":[],"guide":[],"basis":"Điểm c khoản 2 Điều 235 Luật Đất đai 2024; Điểm đ khoản 2 Điều 235 Luật Đất đai 2024; Khoản 1 Điều 236 Luật Đất đai 2024","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]},{"cid":"TH6.02","title":"Không đồng ý quyết định thu hồi đất","text":"Ông Hoàng nhận được quyết định thu hồi 250 m² đất để thực hiện dự án đường giao thông. Ông cho rằng diện tích ghi trong quyết định lớn hơn thực tế khoảng 30 m² và mức bồi thường chưa đúng. Ông chưa được xem phương án bồi thường, hỗ trợ, tái định cư đã được phê duyệt và muốn biết cách bảo vệ quyền lợi.","ask":[],"guide":[],"basis":"Điểm đ khoản 1 Điều 24 Luật Đất đai 2024; Khoản 8 Điều 26, Điều 237 Luật Đất đai 2024; Điều 237 Luật Đất đai 2024","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4"]},{"cid":"TH6.03","title":"Đào đất ruộng để bán","text":"Ông Lực thuê máy xúc đào sâu 3 m trên 2.000 m² đất trồng lúa của mình để lấy đất bán, làm mất tầng canh tác. Năm 2025 ông đã bị xử phạt vi phạm hành chính về hành vi này nhưng năm 2026 tiếp tục đào thêm.","ask":[],"guide":[],"basis":"Khoản 27 Điều 3, khoản 1 Điều 11 Luật Đất đai 2024; Khoản 4 Điều 31 Luật Đất đai 2024; Khoản 2 Điều 81 Luật Đất đai 2024; Điều 239 Luật Đất đai 2024","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4"]}]}],"vb":[{"name":"Hiến pháp và luật","rows":[{"t":"Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam (Điều 53, 54)","d":"28/11/2013","org":"Quốc hội","note":"Đã sửa đổi, bổ sung năm 2025","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"t":"Luật Đất đai số 31/2024/QH15","d":"18/01/2024","org":"Quốc hội","note":"Hiệu lực 01/8/2024","url":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-31-2024-QH15-523642.aspx"},{"t":"Văn bản hợp nhất số 44/VBHN-VPQH – Luật Đất đai","d":"16/03/2026","org":"Văn phòng Quốc hội","note":"Hợp nhất các lần sửa đổi bởi 12 luật (từ Luật 43/2024/QH15 đến Luật 147/2025/QH15); dùng bản này khi tra cứu","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%2044/VBHN-VPQH%20%E2%80%93%20L
