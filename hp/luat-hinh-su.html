nh niên phụ thuộc tuổi, loại tội, số lần phạm tội, vai trò của từng người; nguyên tắc cá thể hóa trong đồng phạm (Điều 58 BLHS) cũng đòi hỏi đánh giá riêng. Không thể áp dụng chung một biện pháp cho cả nhóm.","b":"Điều 58 BLHS; Điều 37, 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.21","g":4,"lv":"TH","q":"Thông tin cá nhân của người chưa thành niên trong quá trình giải quyết vụ việc được xử lý thế nào?","o":["Phải được giữ bí mật, bảo vệ đời tư; không công bố thông tin làm lộ danh tính trừ trường hợp luật cho phép","Được công khai để răn đe","Chỉ giữ bí mật khi gia đình yêu cầu","Được cung cấp cho báo chí nếu vụ việc gây chú ý"],"a":0,"e":"Luật Tư pháp người chưa thành niên quy định nguyên tắc bảo đảm bí mật cá nhân, đời sống riêng tư của người chưa thành niên trong suốt quá trình xử lý chuyển hướng, tố tụng và thi hành án, nhằm bảo vệ nhân phẩm và tạo điều kiện tái hòa nhập. Việc công khai danh tính trái quy định là vi phạm.","b":"Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.22","g":4,"lv":"TH","q":"Người từ đủ 14 tuổi đến dưới 16 tuổi phạm tội mà điều luật quy định tù có thời hạn thì mức tù cao nhất (trừ nhóm tội giữ mức theo BLHS) là:","o":["Không quá một phần hai mức phạt tù mà điều luật quy định","Không quá hai phần năm mức phạt tù mà điều luật quy định","Không quá ba phần tư mức phạt tù mà điều luật quy định","Không quá ba phần năm mức phạt tù mà điều luật quy định"],"a":1,"e":"Điều 119 Luật Tư pháp người chưa thành niên: đối với người từ đủ 14 đến dưới 16 tuổi, điều luật quy định tù chung thân hoặc tử hình thì mức cao nhất không quá 09 năm; tù có thời hạn thì không quá hai phần năm mức phạt tù điều luật quy định (trừ một số tội vẫn giữ mức theo BLHS: 12 năm và một phần hai). Ba phần năm là mức cho người từ đủ 16 đến dưới 18 tuổi.","b":"Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"5.01","g":5,"lv":"NB","q":"Các tội xâm phạm an ninh quốc gia được quy định tại chương nào của BLHS?","o":["Chương XVI","Chương XIII","Chương XIV","Chương XXIII"],"a":1,"e":"Phần các tội phạm của BLHS bắt đầu bằng Chương XIII – Các tội xâm phạm an ninh quốc gia (Điều 108–122). Chương XIV là các tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự; Chương XVI là các tội xâm phạm sở hữu; Chương XXIII là các tội phạm về chức vụ.","b":"Chương XIII BLHS"},{"id":"5.02","g":5,"lv":"TH","q":"Đặc điểm chung về mặt chủ quan của các tội xâm phạm an ninh quốc gia là:","o":["Được thực hiện với lỗi cố ý trực tiếp, nhiều tội đòi hỏi mục đích chống chính quyền nhân dân","Có thể thực hiện với lỗi vô ý","Không cần xác định mục đích trong mọi trường hợp","Chỉ cần hậu quả nghiêm trọng xảy ra là đủ"],"a":0,"e":"Các tội xâm phạm an ninh quốc gia được thực hiện với lỗi cố ý trực tiếp; nhiều tội (như Điều 109, 113, 117) đòi hỏi dấu hiệu mục đích 'nhằm chống chính quyền nhân dân' hoặc 'nhằm lật đổ chính quyền nhân dân'. Do đó không thể suy diễn tội danh chỉ từ quan điểm, quan hệ; phải chứng minh hành vi và mục đích theo cấu thành.","b":"Chương XIII BLHS"},{"id":"5.03","g":5,"lv":"TH","q":"Dấu hiệu quan trọng nhất để phân biệt tội giết người (Điều 123) với tội cố ý gây thương tích dẫn đến chết người (khoản 4 Điều 134) là:","o":["Số lần tấn công nạn nhân","Quan hệ quen biết giữa người phạm tội và nạn nhân","Loại hung khí được sử dụng","Thái độ tâm lý của người phạm tội đối với hậu quả chết người: mong muốn hoặc để mặc (giết người) hay vô ý (cố ý gây thương tích dẫn đến chết người)"],"a":3,"e":"Ở tội giết người, người phạm tội cố ý (trực tiếp hoặc gián tiếp) đối với hậu quả chết người. Ở tội cố ý gây thương tích dẫn đến chết người, người phạm tội chỉ cố ý gây thương tích, còn hậu quả chết người xảy ra ngoài ý muốn (lỗi vô ý). Hung khí, vị trí, số lần tấn công chỉ là căn cứ để đánh giá ý thức chủ quan.","b":"Điều 123, khoản 4 Điều 134 BLHS"},{"id":"5.04","g":5,"lv":"TH","q":"Theo khoản 1 Điều 134 BLHS, hành vi cố ý gây thương tích cấu thành tội phạm khi:","o":["Gây tỷ lệ tổn thương cơ thể từ 5% trở lên","Gây thương tích bất kỳ, không phụ thuộc tỷ lệ tổn thương","Gây tổn hại sức khỏe với tỷ lệ tổn thương cơ thể từ 11% đến 30%, hoặc dưới 11% nhưng thuộc các trường hợp luật liệt kê (dùng hung khí nguy hiểm, có tổ chức…)","Chỉ khi tỷ lệ tổn thương cơ thể từ 31% trở lên"],"a":2,"e":"Khoản 1 Điều 134 BLHS: người nào cố ý gây thương tích hoặc gây tổn hại sức khỏe của người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30% hoặc dưới 11% nhưng thuộc một trong các trường hợp (dùng vũ khí, vật liệu nổ, hung khí nguy hiểm; có tổ chức; phạm tội đối với người dưới 16 tuổi; có tính chất côn đồ…) thì phạm tội. Tỷ lệ từ 31% trở lên là tình tiết định khung tăng nặng.","b":"Khoản 1 Điều 134 BLHS"},{"id":"5.05","g":5,"lv":"TH","q":"Tội giết người trong trạng thái tinh thần bị kích động mạnh (Điều 125) đòi hỏi trạng thái đó phải do:","o":["Mâu thuẫn bình thường trong sinh hoạt","Hành vi trái pháp luật nghiêm trọng của nạn nhân đối với người đó hoặc người thân thích của người đó gây ra","Người phạm tội tự dùng rượu bia gây ra","Áp lực công việc kéo dài của người phạm tội"],"a":1,"e":"Điều 125 BLHS: người nào giết người trong trạng thái tinh thần bị kích động mạnh do hành vi ngược đãi nghiêm trọng hoặc xúc phạm nghiêm trọng của nạn nhân đối với người đó hoặc đối với người thân thích của người đó thì bị phạt tù từ 06 tháng đến 03 năm. Nguyên nhân phải xuất phát từ hành vi trái pháp luật nghiêm trọng của nạn nhân, không phải từ say rượu hay mâu thuẫn thông thường.","b":"Điều 125 BLHS"},{"id":"5.06","g":5,"lv":"TH","q":"A bị B dùng dao tấn công; A giật được dao và đâm B tử vong trong khi B đã bị khống chế, không còn nguy hiểm. Nếu xác định A đã vượt quá giới hạn phòng vệ chính đáng, A phạm tội gì?","o":["Tội vô ý làm chết người (Điều 128)","Tội giết người (Điều 123)","Không phạm tội vì là phòng vệ chính đáng","Tội giết người do vượt quá giới hạn phòng vệ chính đáng (Điều 126)"],"a":3,"e":"Khoản 2 Điều 22 BLHS: vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết, không phù hợp với tính chất, mức độ nguy hiểm của hành vi xâm hại; người đó phải chịu TNHS. Nếu gây chết người, BLHS có tội danh riêng – Điều 126 (phạt cải tạo không giam giữ đến 02 năm hoặc tù từ 03 tháng đến 02 năm) – nhẹ hơn nhiều so với Điều 123.","b":"Điều 22, Điều 126 BLHS"},{"id":"5.07","g":5,"lv":"TH","q":"Dấu hiệu đặc trưng về hành vi khách quan của tội cướp tài sản (Điều 168) là:","o":["Dùng thủ đoạn gian dối để người khác tự nguyện giao tài sản","Lén lút chiếm đoạt tài sản khi chủ sở hữu không biết","Công khai, nhanh chóng giật lấy tài sản rồi tẩu thoát","Dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản"],"a":3,"e":"Khoản 1 Điều 168 BLHS mô tả hành vi cướp: dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản. Lén lút là trộm cắp (Điều 173), gian dối là lừa đảo (Điều 174), giật lấy công khai nhanh chóng là cướp giật (Điều 171).","b":"Khoản 1 Điều 168 BLHS"},{"id":"5.08","g":5,"lv":"TH","q":"Tội cướp tài sản được coi là hoàn thành khi nào?","o":["Khi người phạm tội đã thực hiện hành vi dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc… nhằm chiếm đoạt, dù chưa chiếm đoạt được tài sản","Khi người phạm tội đã chiếm đoạt được tài sản","Khi tài sản bị chiếm đoạt có giá trị từ 2.000.000 đồng trở lên","Khi người phạm tội đã tiêu thụ tài sản"],"a":0,"e":"Tội cướp tài sản có cấu thành hình thức: chỉ cần thực hiện hành vi tấn công (dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc…) với mục đích chiếm đoạt là tội phạm hoàn thành, không phụ thuộc việc đã lấy được tài sản hay giá trị tài sản. Giá trị tài sản chỉ có ý nghĩa định khung.","b":"Khoản 1 Điều 168 BLHS"},{"id":"5.09","g":5,"lv":"TH","q":"Hành vi đe dọa sẽ dùng vũ lực (không ngay tức khắc) hoặc dùng thủ đoạn khác uy hiếp tinh thần người khác nhằm chiếm đoạt tài sản cấu thành tội gì?","o":["Tội cưỡng đoạt tài sản (Điều 170)","Tội công nhiên chiếm đoạt tài sản (Điều 172)","Tội cướp tài sản (Điều 168)","Tội cướp giật tài sản (Điều 171)"],"a":0,"e":"Khoản 1 Điều 170 BLHS: người nào đe dọa sẽ dùng vũ lực hoặc có thủ đoạn khác uy hiếp tinh thần người khác nhằm chiếm đoạt tài sản. Điểm khác với cướp tài sản là tính 'ngay tức khắc': ở tội cướp, vũ lực được đe dọa sử dụng ngay, khiến nạn nhân không thể chống cự; ở cưỡng đoạt, nạn nhân còn thời gian, điều kiện lựa chọn.","b":"Khoản 1 Điều 170 BLHS"},{"id":"5.10","g":5,"lv":"NB","q":"Giá trị tài sản tối thiểu để hành vi trộm cắp tài sản cấu thành tội phạm (khi không thuộc các trường hợp đặc biệt) là:","o":["Từ 4.000.000 đồng","Từ 2.000.000 đồng","Từ 500.000 đồng","Từ 5.000.000 đồng"],"a":1,"e":"Khoản 1 Điều 173 BLHS: người nào trộm cắp tài sản của người khác trị giá từ 2.000.000 đồng đến dưới 50.000.000 đồng hoặc dưới 2.000.000 đồng nhưng thuộc một trong các trường hợp (đã bị xử phạt vi phạm hành chính về hành vi chiếm đoạt; đã bị kết án về tội này hoặc các tội chiếm đoạt chưa được xóa án tích mà còn vi phạm; gây ảnh hưởng xấu đến an ninh, trật tự; tài sản là phương tiện kiếm sống chính…) thì phạm tội.","b":"Khoản 1 Điều 173 BLHS"},{"id":"5.11","g":5,"lv":"TH","q":"Điểm khác nhau cơ bản giữa tội lừa đảo chiếm đoạt tài sản (Điều 174) và tội lạm dụng tín nhiệm chiếm đoạt tài sản (Điều 175) là:","o":["Lừa đảo không đòi hỏi giá trị tài sản tối thiểu","Lạm dụng tín nhiệm luôn có hành vi dùng vũ lực","Ở lừa đảo, thủ đoạn gian dối có trước và là nguyên nhân khiến chủ tài sản giao tài sản; ở lạm dụng tín nhiệm, người phạm tội nhận tài sản hợp pháp qua hợp đồng rồi mới nảy sinh ý định chiếm đoạt","Lừa đảo chỉ áp dụng với tiền, lạm dụng tín nhiệm chỉ áp dụng với vật"],"a":2,"e":"Ở tội lừa đảo (Điều 174), thủ đoạn gian dối xuất hiện trước, khiến chủ tài sản tin và tự nguyện giao tài sản. Ở tội lạm dụng tín nhiệm (Điều 175), người phạm tội nhận được tài sản một cách hợp pháp qua hợp đồng vay, mượn, thuê, nhận giữ hộ… rồi mới dùng thủ đoạn gian dối, bỏ trốn hoặc sử dụng vào mục đích bất hợp pháp dẫn đến không trả lại. Thời điểm nảy sinh ý định chiếm đoạt là tiêu chí phân biệt.","b":"Điều 174, Điều 175 BLHS"},{"id":"5.12","g":5,"lv":"NB","q":"Giá trị tài sản tối thiểu để hành vi lạm dụng tín nhiệm chiếm đoạt tài sản cấu thành tội phạm (khi không thuộc trường hợp đặc biệt) là:","o":["Từ 2.000.000 đồng","Từ 1.000.000 đồng","Từ 4.000.000 đồng","Từ 10.000.000 đồng"],"a":2,"e":"Khoản 1 Điều 175 BLHS: người nào vay, mượn, thuê tài sản hoặc nhận được tài sản bằng hình thức hợp đồng rồi chiếm đoạt tài sản trị giá từ 4.000.000 đồng đến dưới 50.000.000 đồng hoặc dưới 4.000.000 đồng nhưng đã bị xử phạt vi phạm hành chính về hành vi chiếm đoạt… thì phạm tội. Ngưỡng 2.000.000 đồng áp dụng cho các tội trộm cắp, lừa đảo.","b":"Khoản 1 Điều 175 BLHS"},{"id":"5.13","g":5,"lv":"TH","q":"Hành vi công khai, nhanh chóng giật lấy tài sản của người khác rồi tẩu thoát cấu thành tội gì?","o":["Tội cướp giật tài sản (Điều 171)","Tội trộm cắp tài sản (Điều 173)","Tội cướp tài sản (Điều 168)","Tội công nhiên chiếm đoạt tài sản (Điều 172)"],"a":0,"e":"Tội cướp giật tài sản (Điều 171) đặc trưng bởi hành vi công khai và nhanh chóng giật lấy tài sản, lợi dụng sơ hở của chủ tài sản rồi tẩu thoát; không dùng vũ lực khống chế (khác cướp), không lén lút (khác trộm cắp), không lợi dụng việc chủ tài sản không có điều kiện ngăn cản (khác công nhiên chiếm đoạt).","b":"Khoản 1 Điều 171 BLHS"},{"id":"5.14","g":5,"lv":"TH","q":"Chủ thể của tội tham ô tài sản (Điều 353) là:","o":["Người có chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý","Người được thuê giữ tài sản theo hợp đồng dân sự","Chỉ công chức trong cơ quan nhà nước","Mọi người từ đủ 16 tuổi trở lên"],"a":0,"e":"Tội tham ô có chủ thể đặc biệt: người có chức vụ, quyền hạn (khái niệm tại Điều 352) lợi dụng chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý. Từ năm 2018, chủ thể còn bao gồm người có chức vụ, quyền hạn trong doanh nghiệp, tổ chức ngoài nhà nước (khoản 6 Điều 353). Người được thuê giữ tài sản theo hợp đồng chiếm đoạt có thể phạm tội lạm dụng tín nhiệm.","b":"Điều 352, Điều 353 BLHS"},{"id":"5.15","g":5,"lv":"TH","q":"Dấu hiệu bắt buộc của tội nhận hối lộ (Điều 354) là:","o":["Người nhận lợi ích phải là công chức cấp cao","Người có chức vụ, quyền hạn trực tiếp hoặc qua trung gian nhận lợi ích để làm hoặc không làm một việc vì lợi ích hoặc theo yêu cầu của người đưa hối lộ","Bất kỳ người nào nhận quà biếu","Lợi ích nhận được phải là tiền mặt"],"a":1,"e":"Khoản 1 Điều 354 BLHS: người nào lợi dụng chức vụ, quyền hạn trực tiếp hoặc qua trung gian nhận hoặc sẽ nhận bất kỳ lợi ích nào (tiền, tài sản, lợi ích vật chất từ 2.000.000 đồng; lợi ích phi vật chất) cho chính bản thân hoặc người khác để làm hoặc không làm một việc vì lợi ích hoặc theo yêu cầu của người đưa hối lộ. Mối liên hệ giữa lợi ích và việc làm/không làm thuộc chức vụ là dấu hiệu bắt buộc.","b":"Khoản 1 Điều 354 BLHS"},{"id":"5.16","g":5,"lv":"TH","q":"Người bị ép buộc đưa hối lộ mà chủ động khai báo trước khi bị phát giác thì:","o":["Được miễn hình phạt","Được coi là không có tội và được trả lại toàn bộ của đã dùng để đưa hối lộ","Bị tịch thu của hối lộ và phải chịu TNHS","Vẫn phải chịu TNHS nhưng được giảm nhẹ"],"a":1,"e":"Khoản 7 Điều 364 BLHS: người bị ép buộc đưa hối lộ mà chủ động khai báo trước khi bị phát giác thì được coi là không có tội và được trả lại toàn bộ của đã dùng để đưa hối lộ. Nếu không bị ép buộc nhưng chủ động khai báo trước khi bị phát giác thì có thể được miễn TNHS (khoản 6).","b":"Khoản 7 Điều 364 BLHS"},{"id":"5.17","g":5,"lv":"TH","q":"Hành vi dùng vũ lực, đe dọa dùng vũ lực hoặc dùng thủ đoạn khác cản trở người thi hành công vụ thực hiện công vụ cấu thành tội:","o":["Cố ý gây thương tích (Điều 134)","Làm nhục người khác (Điều 155)","Chống người thi hành công vụ (Điều 330)","Gây rối trật tự công cộng (Điều 318)"],"a":2,"e":"Khoản 1 Điều 330 BLHS: người nào dùng vũ lực, đe dọa dùng vũ lực hoặc dùng thủ đoạn khác cản trở người thi hành công vụ thực hiện công vụ của họ hoặc ép buộc họ thực hiện hành vi trái pháp luật thì phạm tội. Phải xác định người bị cản trở đang thi hành công vụ hợp pháp; nếu gây thương tích nặng có thể phạm thêm tội khác.","b":"Khoản 1 Điều 330 BLHS"},{"id":"5.18","g":5,"lv":"NB","q":"Hành vi đánh bạc trái phép bằng tiền hoặc hiện vật cấu thành tội phạm khi trị giá dùng đánh bạc từ:","o":["1.000.000 đồng trở lên","10.000.000 đồng trở lên","5.000.000 đồng trở lên","2.000.000 đồng trở lên"],"a":2,"e":"Khoản 1 Điều 321 BLHS: người nào đánh bạc trái phép dưới bất kỳ hình thức nào được thua bằng tiền hay hiện vật trị giá từ 5.000.000 đồng đến dưới 50.000.000 đồng hoặc dưới 5.000.000 đồng nhưng đã bị xử phạt vi phạm hành chính về hành vi này hoặc đã bị kết án về tội này hoặc tội tổ chức đánh bạc, chưa được xóa án tích mà còn vi phạm.","b":"Khoản 1 Điều 321 BLHS"},{"id":"5.19","g":5,"lv":"TH","q":"Theo Luật số 86/2025/QH15, tội sử dụng trái phép chất ma túy (Điều 256a) được bổ sung với đặc điểm nào?","o":["Áp dụng cho người từ đủ 14 tuổi","Mọi hành vi sử dụng ma túy lần đầu đều bị xử lý hình sự","Chỉ áp dụng với pháp nhân thương mại","Chỉ xử lý hình sự người sử dụng trái phép chất ma túy đang trong thời hạn cai nghiện, điều trị thay thế, quản lý sau cai… theo các trường hợp luật định; chủ thể từ đủ 16 tuổi"],"a":3,"e":"Luật 86/2025/QH15 bổ sung Điều 256a – Tội sử dụng trái phép chất ma túy, nhưng chỉ xử lý hình sự khi người đó đang trong thời hạn cai nghiện hoặc điều trị nghiện bằng thuốc thay thế; trong thời hạn quản lý sau cai nghiện; trong 02 năm sau khi hết thời hạn quản lý sau cai…; chủ thể là người từ đủ 16 tuổi. Sử dụng lần đầu không thuộc trường hợp trên vẫn xử lý hành chính.","b":"Điều 256a BLHS (bổ sung bởi Luật 86/2025/QH15)"},{"id":"5.20","g":5,"lv":"TH","q":"Các tội xâm phạm trật tự an toàn giao thông đường bộ (như Điều 260) được thực hiện với lỗi nào?","o":["Lỗi cố ý trực tiếp","Lỗi vô ý đối với hậu quả xảy ra","Không cần xác định lỗi","Lỗi cố ý gián tiếp"],"a":1,"e":"Tội vi phạm quy định về tham gia giao thông đường bộ (Điều 260) có lỗi vô ý đối với hậu quả (chết người, thương tích, thiệt hại tài sản); người phạm tội có thể cố ý vi phạm quy tắc giao thông nhưng không mong muốn hậu quả. Nếu cố ý dùng phương tiện để gây hậu quả thì có thể phạm tội giết người, cố ý gây thương tích.","b":"Điều 260 BLHS"},{"id":"5.21","g":5,"lv":"TH","q":"Khi định tội đối với vụ tai nạn giao thông, những vấn đề cần làm rõ là:","o":["Chỉ cần xác định mức bồi thường gia đình nạn nhân yêu cầu","Quy tắc an toàn giao thông bị vi phạm, hậu quả, mối quan hệ nhân quả giữa vi phạm và hậu quả, lỗi của người điều khiển","Chỉ cần xác định có tai nạn xảy ra","Chỉ cần xác định loại phương tiện"],"a":1,"e":"Cấu thành tội tại Điều 260 BLHS đòi hỏi: hành vi vi phạm quy định về an toàn giao thông, hậu quả thuộc các trường hợp luật định, quan hệ nhân quả giữa vi phạm và hậu quả, lỗi vô ý. Nếu tai nạn do lỗi hoàn toàn của nạn nhân hoặc sự kiện bất ngờ thì người điều khiển không phạm tội.","b":"Điều 260 BLHS"},{"id":"5.22","g":5,"lv":"TH","q":"Tội làm nhục người khác (Điều 155) xâm phạm khách thể nào?","o":["Trật tự quản lý hành chính","Quyền sở hữu","Nhân phẩm, danh dự của con người","An toàn công cộng"],"a":2,"e":"Điều 155 thuộc Chương XIV – Các tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự của con người. Hành vi xúc phạm nghiêm trọng nhân phẩm, danh dự của người khác bị xử lý hình sự. Khác với tội vu khống (Điều 156) ở chỗ vu khống là bịa đặt, loan truyền điều biết rõ là sai sự thật.","b":"Điều 155 BLHS"},{"id":"5.23","g":5,"lv":"TH","q":"Hành vi lợi dụng chủ tài sản không có điều kiện ngăn cản để công khai chiếm đoạt tài sản cấu thành tội:","o":["Cướp tài sản (Điều 168)","Trộm cắp tài sản (Điều 173)","Công nhiên chiếm đoạt tài sản (Điều 172)","Cướp giật tài sản (Điều 171)"],"a":2,"e":"Tội công nhiên chiếm đoạt tài sản (Điều 172): người phạm tội công khai chiếm đoạt tài sản, lợi dụng hoàn cảnh chủ tài sản không có điều kiện ngăn cản (như khi xảy ra thiên tai, tai nạn, chủ tài sản ở xa). Khác cướp giật ở chỗ không cần hành vi nhanh chóng giật lấy, tẩu thoát; khác trộm cắp ở tính công khai.","b":"Khoản 1 Điều 172 BLHS"},{"id":"5.24","g":5,"lv":"TH","q":"Các tội phạm về chức vụ (Chương XXIII) xâm phạm khách thể nào?","o":["Quyền tự do kinh doanh","Quyền sở hữu của cá nhân","Hoạt động đúng đắn của cơ quan, tổ chức do người có chức vụ, quyền hạn xâm phạm trong khi thực hiện công vụ, nhiệm vụ","An ninh quốc gia"],"a":2,"e":"Điều 352 BLHS: các tội phạm về chức vụ là những hành vi xâm phạm hoạt động đúng đắn của cơ quan, tổ chức do người có chức vụ thực hiện trong khi thực hiện công vụ, nhiệm vụ. Một số tội (tham ô, nhận hối lộ) đồng thời xâm phạm sở hữu nhưng khách thể chính là hoạt động đúng đắn của cơ quan, tổ chức.","b":"Điều 352 BLHS"},{"id":"5.25","g":5,"lv":"VD","q":"Một hành vi thỏa mãn dấu hiệu của tội cố ý gây thương tích và đồng thời là phương thức của tội cướp tài sản. Cách định tội đúng là:","o":["Để người bị hại lựa chọn tội danh","Định tội cướp tài sản; hậu quả thương tích được xem xét là tình tiết định khung của tội cướp (nếu luật quy định), không xử lý riêng tội cố ý gây thương tích","Luôn xử lý cả hai tội: cướp tài sản và cố ý gây thương tích","Chỉ xử lý tội cố ý gây thương tích"],"a":1,"e":"Vũ lực gây thương tích là phương thức của tội cướp tài sản; Điều 168 đã quy định các tình tiết định khung theo tỷ lệ tổn thương cơ thể (khoản 2, 3, 4). Vì vậy khi hành vi gây thương tích nằm trong cấu thành tội cướp, chỉ định một tội là cướp tài sản, trừ trường hợp hậu quả vượt quá phạm vi cấu thành (ví dụ cố ý giết người) mới xem xét thêm tội khác.","b":"Điều 168 BLHS"},{"id":"5.26","g":5,"lv":"TH","q":"Phân biệt dấu hiệu định tội với tình tiết định khung có ý nghĩa gì?","o":["Hai loại dấu hiệu giống nhau và có thể thay thế cho nhau","Dấu hiệu định tội xác định tội danh; tình tiết định khung xác định khung hình phạt áp dụng trong điều luật","Tình tiết định khung được dùng để định tội","Dấu hiệu định tội chỉ dùng khi quyết định hình phạt"],"a":1,"e":"Dấu hiệu định tội (mô tả ở khoản 1 của điều luật) quyết định hành vi phạm tội gì; tình tiết định khung (khoản 2, 3, 4…) quyết định khung hình phạt. Một tình tiết đã dùng để định khung thì không được dùng lại làm tình tiết tăng nặng (khoản 2 Điều 52).","b":"BLHS – Phần các tội phạm"},{"id":"6.01","g":6,"lv":"NB","q":"Dự báo tội phạm là gì?","o":["Khẳng định chắc chắn từng vụ phạm tội cụ thể sẽ xảy ra","Hoạt động điều tra để xác định người phạm tội","Hoạt động khoa học nhận định xu hướng, quy mô, cơ cấu, động thái của tình hình tội phạm trong tương lai dựa trên dữ liệu và phương pháp phù hợp","Thống kê các vụ án đã xét xử trong năm"],"a":2,"e":"Dự báo tội phạm là việc dựa trên số liệu về tình hình tội phạm, nguyên nhân, điều kiện và các yếu tố kinh tế – xã hội để đưa ra nhận định có căn cứ khoa học về trạng thái, xu hướng, cơ cấu của tội phạm trong tương lai. Dự báo mang tính xác suất, không khẳng định từng vụ việc; thống kê quá khứ chỉ là dữ liệu đầu vào; điều tra là hoạt động tố tụng.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.02","g":6,"lv":"TH","q":"Căn cứ quan trọng nhất của dự báo tội phạm là:","o":["Suy đoán cá nhân của người làm dự báo","Tin đồn trên mạng xã hội","Dữ liệu về tình hình tội phạm, nguyên nhân, điều kiện của tội phạm và các yếu tố kinh tế – xã hội liên quan","Số người bị bắt trong một ngày"],"a":2,"e":"Dự báo phải dựa trên chuỗi dữ liệu đủ dài, tin cậy về tình hình tội phạm (mức độ, cơ cấu, động thái) và các yếu tố tác động (kinh tế, xã hội, pháp luật, dân cư). Tin đồn, suy đoán hay số liệu một thời điểm không phản ánh xu hướng.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.03","g":6,"lv":"TH","q":"Vì sao dự báo tội phạm luôn có độ bất định?","o":["Vì dự báo không cần dữ liệu","Vì tội phạm tuân theo một quy luật cố định","Vì không có phương pháp khoa học nào để dự báo","Vì tội phạm là hiện tượng xã hội phức tạp, chịu tác động của nhiều yếu tố thay đổi, và số liệu ghi nhận không phản ánh đầy đủ tội phạm thực tế"],"a":3,"e":"Tội phạm chịu ảnh hưởng của nhiều yếu tố kinh tế, xã hội, chính sách, công nghệ; số liệu thống kê có 'tội phạm ẩn'. Do đó dự báo chỉ đưa ra xu hướng có xác suất và phải nêu rõ giả định, giới hạn; không phải là không có phương pháp khoa học.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.04","g":6,"lv":"TH","q":"Phương pháp thống kê trong dự báo tội phạm giúp gì?","o":["Xác định danh tính người phạm tội trong tương lai","Chứng minh chắc chắn nguyên nhân duy nhất của tội phạm","Nhận diện mức độ, cơ cấu, phân bố và xu hướng của tình hình tội phạm từ dữ liệu","Thay thế việc kiểm tra chất lượng dữ liệu"],"a":2,"e":"Phương pháp thống kê (ngoại suy xu hướng, phân tích chuỗi thời gian, tương quan) dùng để mô tả và ước lượng xu hướng của tình hình tội phạm. Thống kê không chứng minh quan hệ nhân quả duy nhất, không dự đoán cá nhân và đòi hỏi kiểm tra chất lượng dữ liệu.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.05","g":6,"lv":"TH","q":"Khi sử dụng số liệu thống kê tội phạm để dự báo, cần lưu ý vấn đề nào?","o":["Không cần xét sự thay đổi cách ghi nhận số liệu","Độ tin cậy, tính đầy đủ, khả năng so sánh của số liệu và tình trạng tội phạm ẩn","Mọi số liệu ghi nhận đều phản ánh đầy đủ tội phạm thực tế","Có thể bỏ qua đơn vị đo và phạm vi thống kê"],"a":1,"e":"Số liệu tội phạm chỉ phản ánh tội phạm rõ (đã được phát hiện, ghi nhận). Thay đổi cách tiếp nhận tin báo, chiến dịch trấn áp, sự sáp nhập đơn vị hành chính… làm số liệu biến động mà không phản ánh thay đổi thực tế. Do đó phải đánh giá độ tin cậy, tính so sánh được và ước lượng tội phạm ẩn.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.06","g":6,"lv":"TH","q":"Tội phạm ẩn ảnh hưởng thế nào đến dự báo tội phạm?","o":["Chỉ tồn tại trong nhóm tội phạm kinh tế","Làm số liệu ghi nhận thấp hơn hoặc khác với tình hình tội phạm thực tế","Không ảnh hưởng đến dữ liệu","Luôn làm số liệu ghi nhận cao hơn thực tế"],"a":1,"e":"Tội phạm ẩn là những tội phạm đã xảy ra nhưng không được phát hiện, không được ghi nhận trong thống kê chính thức (ẩn tự nhiên và ẩn nhân tạo). Nó khiến số liệu thấp hơn thực tế và tồn tại ở nhiều nhóm tội (xâm hại tình dục, ma túy, tham nhũng, bạo lực gia đình…).","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.07","g":6,"lv":"TH","q":"Dự báo ngắn hạn và dự báo dài hạn khác nhau chủ yếu ở điểm nào?","o":["Không có khác biệt","Dự báo dài hạn luôn chính xác hơn","Dự báo ngắn hạn không cần căn cứ","Khoảng thời gian dự báo, mục tiêu sử dụng, mức độ bất định và phương pháp, dữ liệu phù hợp"],"a":3,"e":"Dự báo ngắn hạn (thường 1–2 năm) phục vụ kế hoạch tác nghiệp, ít bất định hơn; dự báo trung hạn, dài hạn (5–10 năm trở lên) phục vụ hoạch định chính sách, chịu nhiều yếu tố biến động hơn nên độ bất định cao hơn và cần phương pháp khác (chuyên gia, kịch bản).","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.08","g":6,"lv":"TH","q":"Một kết quả dự báo tội phạm khoa học cần được trình bày như thế nào?","o":["Chỉ nêu một con số không giải thích","Khẳng định chắc chắn mà không nêu căn cứ","Ẩn các hạn chế để tăng tính thuyết phục","Nêu rõ giả định, dữ liệu, phương pháp, giới hạn và mức độ bất định"],"a":3,"e":"Tính khoa học của dự báo thể hiện ở việc người đọc có thể kiểm tra lại: cần công bố dữ liệu, phương pháp, giả định và khoảng sai số. Kết luận tuyệt đối hóa hoặc che giấu hạn chế làm sai lệch việc hoạch định biện pháp phòng ngừa.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.09","g":6,"lv":"NB","q":"Phòng ngừa tội phạm được hiểu là:","o":["Chỉ là việc tăng mức hình phạt","Hệ thống biện pháp tác động vào nguyên nhân, điều kiện của tội phạm nhằm ngăn chặn, hạn chế, tiến tới loại trừ tội phạm","Chỉ là việc xử lý hình sự sau khi tội phạm xảy ra","Thay thế hoàn toàn hoạt động tố tụng hình sự"],"a":1,"e":"Phòng ngừa tội phạm là tổng thể các biện pháp của Nhà nước và xã hội tác động vào nguyên nhân, điều kiện phát sinh tội phạm nhằm không để tội phạm xảy ra, hạn chế tác hại. Xử lý hình sự và hình phạt chỉ là một bộ phận (phòng ngừa thông qua răn đe), không thay thế biện pháp xã hội.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.10","g":6,"lv":"TH","q":"Hoạt động phòng ngừa tội phạm phải tuân thủ nguyên tắc nào?","o":["Tuân thủ pháp luật, tôn trọng quyền con người, có căn cứ khoa học, phối hợp đồng bộ và phù hợp thực tiễn","Cho phép giám sát không giới hạn mọi công dân","Xử lý tập thể theo địa bàn có nhiều tội phạm","Được sử dụng biện pháp trái pháp luật nếu hiệu quả"],"a":0,"e":"Phòng ngừa tội phạm là hoạt động của Nhà nước và xã hội nên phải tôn trọng Hiến pháp, pháp luật và quyền con người (Điều 14 Hiến pháp: quyền con người chỉ có thể bị hạn chế theo luật). Biện pháp trái pháp luật, giám sát tràn lan hay xử lý tập thể là vi phạm nguyên tắc pháp chế.","b":"Giáo trình Tội phạm học; đề cương Chương 6; Điều 14 Hiến pháp"},{"id":"6.11","g":6,"lv":"TH","q":"Phòng ngừa xã hội (phòng ngừa chung) tập trung chủ yếu vào:","o":["Điều tra sau khi tội phạm xảy ra","Tịch thu tài sản của người phạm tội","Áp dụng hình phạt tù","Cải thiện điều kiện kinh tế – xã hội, giáo dục, văn hóa, hỗ trợ cộng đồng nhằm loại bỏ, hạn chế nguyên nhân và điều kiện của tội phạm"],"a":3,"e":"Phòng ngừa xã hội hướng vào gốc rễ của tội phạm: phát triển kinh tế, việc làm, giáo dục, văn hóa, quản lý xã hội, hỗ trợ nhóm yếu thế. Đây là hướng phòng ngừa có tính căn bản, lâu dài, do nhiều chủ thể thực hiện.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.12","g":6,"lv":"TH","q":"Phòng ngừa nghiệp vụ (chuyên biệt) khác phòng ngừa xã hội ở điểm nào?","o":["Phòng ngừa nghiệp vụ không cần căn cứ pháp luật","Do cơ quan chuyên trách (Công an, Viện kiểm sát, Tòa án…) thực hiện bằng biện pháp nghiệp vụ theo pháp luật, hướng vào đối tượng, địa bàn, loại tội cụ thể","Hai loại hoàn toàn đồng nhất","Phòng ngừa xã hội chỉ do Tòa án thực hiện"],"a":1,"e":"Phòng ngừa nghiệp vụ là hoạt động của các cơ quan chuyên trách sử dụng biện pháp nghiệp vụ (quản lý đối tượng, địa bàn, tuần tra, điều tra cơ bản…) trong khuôn khổ pháp luật. Phòng ngừa xã hội có phạm vi rộng hơn, huy động mọi thiết chế xã hội.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.13","g":6,"lv":"NB","q":"Chủ thể phòng ngừa tội phạm gồm:","o":["Chỉ cơ quan điều tra","Chỉ Tòa án","Nhà nước, các cơ quan chức năng, tổ chức xã hội, gia đình, nhà trường và công dân theo chức năng, trách nhiệm","Chỉ người từng là nạn nhân của tội phạm"],"a":2,"e":"Điều 4 BLHS giao trách nhiệm phòng ngừa, đấu tranh chống tội phạm cho Công an, Viện kiểm sát, Tòa án, các cơ quan khác, tổ chức và mọi công dân. Tội phạm học coi phòng ngừa là hoạt động của toàn xã hội với nhiều chủ thể có vai trò khác nhau.","b":"Giáo trình Tội phạm học; đề cương Chương 6; Điều 4 BLHS"},{"id":"6.14","g":6,"lv":"TH","q":"Sự phối hợp giữa các chủ thể phòng ngừa tội phạm có tác dụng gì?","o":["Xóa bỏ trách nhiệm riêng của từng cơ quan","Cho phép chia sẻ mọi dữ liệu cá nhân không giới hạn","Kết nối thông tin, phân định trách nhiệm và triển khai biện pháp bổ trợ nhau trong khuôn khổ pháp luật","Thay thế cơ chế giám sát, kiểm tra"],"a":2,"e":"Phối hợp giúp tránh chồng chéo, bỏ sót, tận dụng thế mạnh từng chủ thể; tuy nhiên vẫn phải giữ trách nhiệm riêng và tuân thủ pháp luật về bảo vệ dữ liệu cá nhân, quyền riêng tư.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.15","g":6,"lv":"TH","q":"Đánh giá hiệu quả của biện pháp phòng ngừa tội phạm nên dựa trên:","o":["Chỉ số vụ bắt giữ mà không xét bối cảnh","Cảm nhận chủ quan của người tổ chức","Mục tiêu rõ ràng, chỉ báo phù hợp, dữ liệu trước và sau khi triển khai, đánh giá cả tác động ngoài dự kiến","Số lượng cuộc họp đã tổ chức"],"a":2,"e":"Hiệu quả phòng ngừa được đo bằng sự thay đổi của tình hình tội phạm và các yếu tố nguy cơ so với mục tiêu đặt ra, có so sánh trước – sau và xem xét tác động phụ (như dịch chuyển tội phạm sang địa bàn khác). Số cuộc họp hay cảm nhận không phải chỉ báo kết quả.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.16","g":6,"lv":"TH","q":"Vì sao phòng ngừa tội phạm không thể chỉ dựa vào tăng nặng hình phạt?","o":["Vì hình phạt không có vai trò phòng ngừa nào","Vì biện pháp xã hội luôn thay thế pháp luật","Vì tội phạm có nhiều nguyên nhân, điều kiện; phòng ngừa hiệu quả cần kết hợp biện pháp pháp lý, kinh tế – xã hội, giáo dục và hỗ trợ","Vì mọi tội phạm chỉ do một nguyên nhân"],"a":2,"e":"Hình phạt có chức năng phòng ngừa chung và riêng (Điều 31 BLHS) nhưng chỉ tác động vào người đã phạm tội và vào nhận thức của người khác. Nguyên nhân, điều kiện của tội phạm nằm ở nhiều lĩnh vực nên cần biện pháp tổng hợp.","b":"Giáo trình Tội phạm học; đề cương Chương 6; Điều 31 BLHS"},{"id":"6.17","g":6,"lv":"TH","q":"Khi dự báo một nhóm tội phạm cụ thể, cần làm gì?","o":["Xác định phạm vi, thời kỳ, dữ liệu, chỉ báo và các yếu tố tác động riêng của nhóm tội đó","Dựa vào một vụ án nổi bật","Bỏ qua thay đổi pháp luật và cách ghi nhận dữ liệu","Gộp mọi nhóm tội phạm không phân biệt"],"a":0,"e":"Mỗi nhóm tội (ma túy, xâm phạm sở hữu, công nghệ cao…) có quy luật, nguyên nhân và tỷ lệ ẩn khác nhau; thay đổi pháp luật (như bổ sung Điều 256a năm 2025) cũng làm thay đổi số liệu. Dự báo phải xác định rõ phạm vi và dữ liệu đặc thù.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.18","g":6,"lv":"TH","q":"Quan hệ giữa dự báo tội phạm và phòng ngừa tội phạm là:","o":["Phòng ngừa không cần thông tin dự báo","Hai hoạt động không liên quan","Dự báo thay thế hoàn toàn phòng ngừa","Dự báo cung cấp căn cứ để lựa chọn, phân bổ và điều chỉnh biện pháp phòng ngừa"],"a":3,"e":"Dự báo cho biết xu hướng, điểm nóng, nhóm nguy cơ để xây dựng kế hoạch phòng ngừa; kết quả phòng ngừa lại là dữ liệu để điều chỉnh dự báo. Hai hoạt động gắn bó nhưng không thay thế nhau.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.19","g":6,"lv":"TH","q":"Nếu kết quả dự báo không chính xác, cách ứng xử chuyên môn đúng là:","o":["Tiếp tục khẳng định dự báo đúng","Rà soát giả định, chất lượng dữ liệu, phương pháp và cập nhật dự báo một cách minh bạch","Che giấu sai số","Loại bỏ dữ liệu trái với kỳ vọng"],"a":1,"e":"Sai lệch dự báo là thông tin để cải tiến: cần kiểm tra lại giả định, dữ liệu, mô hình và công bố điều chỉnh. Che giấu hay loại bỏ dữ liệu bất lợi vi phạm chuẩn mực khoa học.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.20","g":6,"lv":"TH","q":"Biện pháp phòng ngừa tình huống (giảm cơ hội phạm tội) là:","o":["Tăng mức hình phạt trong BLHS","Công khai danh tính người bị nghi ngờ","Áp dụng hình phạt tù đối với mọi người có nguy cơ","Tác động vào môi trường cụ thể để làm tăng khó khăn, rủi ro cho việc phạm tội (lắp camera, chiếu sáng, khóa an toàn…)"],"a":3,"e":"Phòng ngừa tình huống hướng vào điều kiện, cơ hội phạm tội tại địa điểm, thời điểm cụ thể: tăng giám sát, tăng khó khăn tiếp cận mục tiêu, giảm lợi ích thu được. Biện pháp phải tuân thủ pháp luật, không xâm phạm quyền riêng tư hay suy đoán có tội.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Đối với hành vi ngày 12/3/2026, Minh có thể bị truy cứu trách nhiệm hình sự không?","o":["Có, vì nghị định của Chính phủ đã quy định hành vi X là vi phạm pháp luật","Có, nếu Cơ quan điều tra đề nghị và Viện kiểm sát phê chuẩn khởi tố","Có, vì hành vi gây bức xúc trong dư luận và có tính nguy hiểm cho xã hội","Không, vì khi thực hiện, hành vi X chưa được BLHS quy định là tội phạm"],"a":3,"e":"Khoản 1 Điều 2 BLHS: chỉ người nào phạm một tội đã được Bộ luật Hình sự quy định mới phải chịu trách nhiệm hình sự. Nghị định chỉ quy định xử phạt vi phạm hành chính; dư luận hay đề nghị của cơ quan tố tụng không thay thế được căn cứ luật định.","b":"Khoản 1 Điều 2 BLHS","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Có thể áp dụng luật sửa đổi có hiệu lực từ 01/9/2026 để xử lý hành vi ngày 12/3/2026 không?","o":["Không, vì điều luật quy định tội phạm mới không có hiệu lực hồi tố","Có, nếu trước đó Minh chưa bị xử phạt vi phạm hành chính về hành vi này","Có, nếu Tòa án xét thấy cần thiết để giáo dục, răn đe chung","Có, vì vụ việc được giải quyết sau ngày luật mới có hiệu lực thi hành"],"a":0,"e":"Khoản 2 Điều 7 BLHS: điều luật quy định một tội phạm mới, một hình phạt nặng hơn, một tình tiết tăng nặng mới hoặc hạn chế phạm vi áp dụng các quy định có lợi thì không được áp dụng đối với hành vi phạm tội đã thực hiện trước khi điều luật đó có hiệu lực. Luật áp dụng là luật có hiệu lực tại thời điểm thực hiện hành vi (khoản 1).","b":"Khoản 1, khoản 2 Điều 7 BLHS","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Đối với hành vi ngày 15/9/2026, nhận định nào đúng?","o":["Chỉ bị truy cứu trách nhiệm hình sự nếu người bị thiệt hại có yêu cầu","Không bị truy cứu vì Minh đã thực hiện hành vi tương tự trước khi luật có hiệu lực","Có thể bị truy cứu theo điều luật mới vì hành vi xảy ra khi luật đã có hiệu lực","Chỉ bị xử phạt vi phạm hành chính như đối với hành vi lần trước"],"a":2,"e":"Khoản 1 Điều 7 BLHS: điều luật được áp dụng đối với một hành vi phạm tội là điều luật đang có hiệu lực thi hành tại thời điểm mà hành vi phạm tội được thực hiện. Ngày 15/9/2026, hành vi X đã là tội phạm nên Minh có thể bị truy cứu trách nhiệm hình sự.","b":"Khoản 1 Điều 7 BLHS","cid":"TH1.01"},{"id":"TH1.01.4","g":1,"lv":"VD","q":"Khi xét xử hành vi ngày 15/9/2026, Viện kiểm sát đề nghị áp dụng tình tiết tăng nặng \"phạm tội 02 lần trở lên\" vì Minh đã thực hiện hành vi X hai lần. Hội đồng xét xử nên xử lý đề nghị này thế nào?","o":["Chấp nhận, vì luật mới được áp dụng chung cho cả hai hành vi của Minh","Không chấp nhận, vì hành vi ngày 12/3/2026 không phải là tội phạm","Chấp nhận, nếu đối với lần thứ nhất Minh chưa bị xử phạt hành chính","Chấp nhận, vì trên thực tế Minh đã thực hiện hành vi X hai lần"],"a":1,"e":"Tình tiết tăng nặng \"phạm tội 02 lần trở lên\" (điểm g khoản 1 Điều 52 BLHS) đòi hỏi mỗi lần đều là hành vi phạm tội. Hành vi ngày 12/3/2026 không phải tội phạm (Điều 2, Điều 8) và luật mới không hồi tố, nên chỉ hành vi ngày 15/9/2026 bị xem xét là tội phạm.","b":"Điều 2, Điều 8, điểm g khoản 1 Điều 52 BLHS","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Tòa án có thể tuyên hình phạt tử hình đối với An không?","o":["Có, nếu Viện kiểm sát đề nghị mức hình phạt cao nhất của khung","Không, vì quy định bỏ tử hình có lợi cho người phạm tội nên được hồi tố","Có, nếu số tiền chiếm đoạt chưa được khắc phục tại thời điểm xét xử","Có, vì hành vi được thực hiện trước ngày 01/7/2025 nên áp dụng luật cũ"],"a":1,"e":"Khoản 3 Điều 7 BLHS: điều luật xóa bỏ một hình phạt hoặc quy định hình phạt nhẹ hơn được áp dụng đối với hành vi phạm tội đã thực hiện trước khi điều luật đó có hiệu lực. Vì vậy, khi xét xử tháng 3/2026, khung hình phạt áp dụng cho An chỉ còn tù 20 năm hoặc tù chung thân.","b":"Khoản 3 Điều 7 BLHS; Luật số 86/2025/QH15","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Hành vi của An bị phát hiện muộn. Thời hiệu truy cứu trách nhiệm hình sự được xác định thế nào?","o":["10 năm, tính từ ngày phát hiện hành vi phạm tội","15 năm, vì khung hình phạt không còn hình phạt tử hình","Không áp dụng thời hiệu (tham ô thuộc khoản 4 Điều 353)","20 năm, vì đây là tội đặc biệt nghiêm trọng"],"a":2,"e":"Điều 28 BLHS: không áp dụng thời hiệu truy cứu trách nhiệm hình sự đối với tội tham ô tài sản thuộc khoản 3, khoản 4 Điều 353 và tội nhận hối lộ thuộc khoản 3, khoản 4 Điều 354. Đây là ngoại lệ so với quy tắc chung tại Điều 27.","b":"Điều 28 BLHS","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Bản án tử hình đối với Bình đã có hiệu lực từ tháng 5/2025 nhưng chưa thi hành. Bản án đó được xử lý thế nào?","o":["Không thi hành tử hình; Chánh án TAND tối cao chuyển thành tù chung thân","Hủy bản án và giao hồ sơ để xét xử lại vụ án từ đầu theo luật mới","Tạm hoãn thi hành 05 năm rồi xem xét lại theo đơn của người bị kết án","Vẫn thi hành vì bản án có hiệu lực trước ngày Luật 86/2025/QH15 có hiệu lực"],"a":0,"e":"Điều khoản chuyển tiếp của Luật số 86/2025/QH15: người bị kết án tử hình về các tội mà luật mới bỏ hình phạt tử hình (trong đó có Điều 353) nhưng bản án chưa thi hành thì không thi hành hình phạt tử hình; Chánh án Tòa án nhân dân tối cao quyết định chuyển hình phạt tử hình thành tù chung thân. Không phải xét xử lại.","b":"Luật số 86/2025/QH15; khoản 3 Điều 7 BLHS","cid":"TH1.02"},{"id":"TH1.02.4","g":1,"lv":"VD","q":"Sau khi được chuyển sang tù chung thân, Bình muốn được xét giảm thời hạn chấp hành hình phạt. Điều kiện riêng đối với Bình là gì?","o":["Phải chấp hành ít nhất 30 năm tù và được trại giam đề nghị","Không có điều kiện riêng, chỉ cần chấp hành tốt nội quy trại giam","Chỉ cần gia đình có đơn xin giảm án và cam kết giám sát","Nộp lại ít nhất 3/4 tài sản tham ô và hợp tác tích cực với cơ quan chức năng"],"a":3,"e":"Luật số 86/2025/QH15 sửa đổi quy định về giảm thời hạn chấp hành hình phạt (Điều 63 BLHS): người bị kết án tù chung thân về tội tham ô tài sản, nhận hối lộ chỉ được xét giảm khi đã chủ động nộp lại ít nhất ba phần tư tài sản tham ô, nhận hối lộ và hợp tác tích cực với cơ quan chức năng. Điều khoản chuyển tiếp của Luật quy định điều kiện này áp dụng đối với người được chuyển từ tử hình sang tù chung thân như Bình.","b":"Điều 63 BLHS (sửa đổi bởi Luật 86/2025/QH15); Luật số 86/2025/QH15","cid":"TH1.02"},{"id":"TH1.03.1","g":1,"lv":"VD","q":"Hành vi của Hải xảy ra ngoài lãnh thổ Việt Nam. Bộ luật Hình sự Việt Nam có được áp dụng không?","o":["Chỉ áp dụng nếu người bị hại trong vụ việc là công dân Việt Nam","Không, vì hành vi xảy ra ở vùng trời quốc tế, ngoài chủ quyền Việt Nam","Chỉ áp dụng nếu quốc gia nơi máy bay cất cánh đồng ý chuyển giao","Có, vì hành vi xảy ra trên tàu bay mang quốc tịch Việt Nam"],"a":3,"e":"Khoản 3 Điều 6 BLHS: đối với hành vi phạm tội xảy ra trên tàu bay, tàu biển mang quốc tịch Việt Nam đang ở biển cả hoặc tại vùng trời nằm ngoài lãnh thổ Việt Nam thì người phạm tội có thể bị truy cứu trách nhiệm hình sự theo Bộ luật Hình sự Việt Nam. Quốc tịch người bị hại hay ý kiến nước khác không phải điều kiện.","b":"Khoản 3 Điều 6 BLHS","cid":"TH1.03"},{"id":"TH1.03.2","g":1,"lv":"VD","q":"Hành vi của Hải thuộc khung hình phạt nào và loại tội phạm gì?","o":["Khoản 2 Điều 173; tội rất nghiêm trọng","Khoản 2 Điều 173; tội nghiêm trọng","Khoản 3 Điều 173; tội rất nghiêm trọng","Khoản 1 Điều 173; tội ít nghiêm trọng"],"a":1,"e":"Lén lút chiếm đoạt tài sản trị giá 50.000.000 đồng thuộc điểm c khoản 2 Điều 173 BLHS (từ 50.000.000 đồng đến dưới 200.000.000 đồng), phạt tù từ 02 năm đến 07 năm. Mức cao nhất của khung là 07 năm nên theo điểm b khoản 1 Điều 9 đây là tội nghiêm trọng.","b":"Điểm c khoản 2 Điều 173, điểm b khoản 1 Điều 9 BLHS","cid":"TH1.03"},{"id":"TH1.03.3","g":1,"lv":"VD","q":"Thời hiệu truy cứu trách nhiệm hình sự đối với hành vi của Hải là bao lâu?","o":["15 năm","Không áp dụng thời hiệu vì phạm tội ngoài lãnh thổ","10 năm kể từ ngày tội phạm được thực hiện","05 năm"],"a":2,"e":"Điểm b khoản 2 Điều 27 BLHS: thời hiệu truy cứu trách nhiệm hình sự đối với tội nghiêm trọng là 10 năm, tính từ ngày tội phạm được thực hiện. Việc phạm tội ngoài lãnh thổ không làm mất thời hiệu.","b":"Điểm b khoản 2 Điều 27 BLHS","cid":"TH1.03"},{"id":"TH1.03.4","g":1,"lv":"VD","q":"Giả sử người lấy túi là một công dân Đức. Người này có thể bị truy cứu theo Bộ luật Hình sự Việt Nam không?","o":["Có thể, vì căn cứ là nơi xảy ra hành vi, không phụ thuộc quốc tịch","Không, chỉ công dân Việt Nam mới bị truy cứu theo Bộ luật Hình sự Việt Nam","Không, vì người nước ngoài phạm tội phải được dẫn độ về nước mình xét xử","Chỉ khi Cộng hòa Liên bang Đức đồng ý cho Việt Nam xét xử công dân của mình"],"a":0,"e":"Khoản 3 Điều 6 BLHS gắn với quốc tịch của tàu bay, không phụ thuộc quốc tịch người phạm tội: người phạm tội trên tàu bay mang quốc tịch Việt Nam ở vùng trời ngoài lãnh thổ có thể bị truy cứu theo Bộ luật Hình sự Việt Nam, trừ trường hợp điều ước quốc tế mà Việt Nam là thành viên có quy định khác.","b":"Khoản 3 Điều 6 BLHS","cid":"TH1.03"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Hành vi của An được đánh giá thế nào?","o":["An chỉ phạm tội cố ý gây thương tích, vì hậu quả chết người không xảy ra","An được miễn trách nhiệm hình sự, vì Bình đã được cứu sống kịp thời","An phạm tội giết người ở giai đoạn chuẩn bị, vì hành vi chưa hoàn thành","An phạm tội giết người chưa đạt, vì hậu quả không xảy ra ngoài ý muốn của An"],"a":3,"e":"Điều 15 BLHS: phạm tội chưa đạt là cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì những nguyên nhân ngoài ý muốn. An đã thực hiện hành vi tấn công với mong muốn Bình chết, hậu quả không xảy ra do Bình được cấp cứu và An bị khống chế, nên là giết người chưa đạt; không phải giai đoạn chuẩn bị vì An đã thực hiện hành vi khách quan.","b":"Điều 15, Điều 123 BLHS","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Dữ kiện nào có ý nghĩa quyết định để phân biệt tội giết người chưa đạt với tội cố ý gây thương tích trong vụ này?","o":["Ý thức của An đối với hậu quả chết người, thể hiện qua tin nhắn, hung khí, vị trí tấn công","Mức độ quen biết và mâu thuẫn trước đó giữa An và Bình","Việc An bị những người xung quanh khống chế ngay tại chỗ","Tỷ lệ tổn thương cơ thể và chi phí điều trị thực tế của Bình"],"a":0,"e":"Ranh giới giữa hai tội nằm ở mặt chủ quan: người phạm tội mong muốn (hoặc bỏ mặc) hậu quả chết người hay chỉ cố ý gây thương tích (Điều 10 BLHS). Ý thức đó được chứng minh qua dấu hiệu khách quan: tin nhắn \"cho nó chết\", hung khí nguy hiểm, vị trí trọng yếu, số nhát, cường độ tấn công.","b":"Điều 10, Điều 123, Điều 134 BLHS","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"An bị truy tố theo khoản 1 Điều 123 BLHS (khung có tù chung thân, tử hình). Mức hình phạt cao nhất có thể áp dụng cho An là bao nhiêu?","o":["Tử hình","Tù có thời hạn không quá 20 năm","Không quá ba phần tư mức cao nhất của khung","Tù chung thân"],"a":1,"e":"Khoản 3 Điều 57 BLHS: đối với trường hợp phạm tội chưa đạt, nếu điều luật được áp dụng có quy định hình phạt cao nhất là tù chung thân hoặc tử hình thì chỉ có thể áp dụng hình phạt tù không quá 20 năm; nếu là tù có thời hạn thì mức hình phạt không quá ba phần tư mức phạt tù mà điều luật quy định.","b":"Khoản 3 Điều 57 BLHS","cid":"TH2.01"},{"id":"TH2.01.4","g":2,"lv":"VD","q":"Giả sử sau nhát đánh đầu tiên, An tự dừng lại dù không có gì ngăn cản và đưa Bình đi cấp cứu. Trách nhiệm hình sự của An thay đổi thế nào?","o":["An chỉ được giảm nhẹ hình phạt, không được miễn trách nhiệm","Không thay đổi, An vẫn phạm tội giết người chưa đạt","Được miễn TNHS về tội giết người; chịu TNHS về tội khác nếu có","An đương nhiên không phải chịu bất kỳ trách nhiệm hình sự nào"],"a":2,"e":"Điều 16 BLHS: tự ý nửa chừng chấm dứt việc phạm tội là tự mình không thực hiện tội phạm đến cùng, tuy không có gì ngăn cản; người đó được miễn trách nhiệm hình sự về tội định phạm, nhưng nếu hành vi thực tế đã thực hiện có đủ yếu tố cấu thành của một tội khác (như cố ý gây thương tích) thì phải chịu trách nhiệm hình sự về tội này.","b":"Điều 16 BLHS","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Quan hệ giữa Cường và Dũng được xác định thế nào?","o":["Chỉ Cường phạm tội, vì Dũng không trực tiếp lấy tài sản","Hai tội phạm độc lập, vì mỗi người thực hiện một hành vi riêng","Đồng phạm tội trộm cắp tài sản, vì cùng cố ý thực hiện một tội phạm","Chỉ phát sinh trách nhiệm dân sự liên đới bồi thường thiệt hại"],"a":2,"e":"Khoản 1 Điều 17 BLHS: đồng phạm là trường hợp có hai người trở lên cố ý cùng thực hiện một tội phạm. Cường và Dũng bàn bạc, phân công, cùng hướng tới việc chiếm đoạt tài sản; người không trực tiếp lấy tài sản vẫn là đồng phạm.","b":"Khoản 1 Điều 17 BLHS","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Vai trò của Dũng trong vụ án là gì?","o":["Người xúi giục, vì đã khích lệ Cường thực hiện việc trộm cắp","Người thực hành, vì có mặt tại hiện trường khi tội phạm xảy ra","Người tổ chức, vì biết trước và đồng ý với kế hoạch của Cường","Người giúp sức, vì cảnh giới tạo điều kiện cho việc thực hiện tội phạm"],"a":3,"e":"Khoản 3 Điều 17 BLHS: người giúp sức là người tạo điều kiện tinh thần hoặc vật chất cho việc thực hiện tội phạm. Việc cảnh giới giúp Cường yên tâm, an toàn khi lấy tài sản. Người trực tiếp lấy tài sản là Cường.","b":"Khoản 3 Điều 17 BLHS","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Tình tiết \"tái phạm\" của Cường được xác định và áp dụng thế nào?","o":["Cường tái phạm; tình tiết này áp dụng cho cả Dũng vì là đồng phạm","Cường tái phạm; tình tiết này chỉ áp dụng đối với Cường","Không ai tái phạm, vì tội mới thuộc loại tội ít nghiêm trọng","Cường không tái phạm, vì tội trước và tội sau cùng một tội danh"],"a":1,"e":"Khoản 1 Điều 53 BLHS: tái phạm là trường hợp đã bị kết án, chưa được xóa án tích mà lại thực hiện hành vi phạm tội do cố ý. Theo Điều 58, các tình tiết tăng nặng, giảm nhẹ hoặc miễn trách nhiệm hình sự thuộc người đồng phạm nào thì chỉ áp dụng đối với người đó, nên không áp dụng cho Dũng.","b":"Khoản 1 Điều 53, Điều 58 BLHS","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Khi quyết định hình phạt đối với Cường và Dũng, Tòa án phải làm gì?","o":["Cá thể hóa theo mức độ tham gia; Cường chịu mức nặng hơn","Chỉ căn cứ vào giá trị tài sản bị chiếm đoạt để quyết định hình phạt","Chỉ xử lý hình sự Cường là người khởi xướng, miễn cho Dũng","Tuyên hai người cùng một mức hình phạt vì cùng phạm một tội"],"a":0,"e":"Điều 58 BLHS: khi quyết định hình phạt đối với những người đồng phạm, Tòa án phải xét đến tính chất của đồng phạm, tính chất và mức độ tham gia phạm tội của từng người. Cường rủ rê, vạch kế hoạch và trực tiếp lấy tài sản, lại tái phạm, nên vai trò và trách nhiệm lớn hơn Dũng.","b":"Điều 58 BLHS","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Tội trộm cắp của Hòa thuộc loại tội phạm nào và có thời hiệu truy cứu bao lâu?","o":["Tội ít nghiêm trọng; thời hiệu 03 năm","Tội nghiêm trọng; thời hiệu 10 năm","Tội ít nghiêm trọng; thời hiệu 05 năm","Tội rất nghiêm trọng; thời hiệu 15 năm"],"a":2,"e":"Mức cao nhất của khung là 03 năm tù nên tội trộm cắp theo khoản 1 Điều 173 là tội ít nghiêm trọng (điểm a khoản 1 Điều 9 BLHS); thời hiệu truy cứu trách nhiệm hình sự là 05 năm (điểm a khoản 2 Điều 27).","b":"Điểm a khoản 1 Điều 9; điểm a khoản 2 Điều 27 BLHS","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Việc Hòa phạm tội lừa đảo ngày 10/5/2022 ảnh hưởng thế nào đến thời hiệu đối với tội trộm cắp?","o":["Thời hiệu được cộng thêm toàn bộ thời hiệu của tội lừa đảo mới thực hiện","Làm chấm dứt thời hiệu, nên Hòa bị truy cứu về tội trộm cắp bất cứ lúc nào","Không ảnh hưởng; thời hiệu đối với tội trộm cắp hết vào ngày 01/3/2024","Thời hiệu đối với tội trộm cắp được tính lại từ ngày 10/5/2022"],"a":3,"e":"Khoản 3 Điều 27 BLHS: nếu trong thời hạn thời hiệu, người phạm tội lại thực hiện hành vi phạm tội mới mà mức cao nhất của khung hình phạt đối với tội ấy trên 01 năm tù thì thời hiệu đối với tội cũ được tính lại kể từ ngày thực hiện hành vi phạm tội mới. Ngày 10/5/2022 vẫn trong thời hiệu của tội trộm cắp (hết ngày 01/3/2024), và tội lừa đảo có mức cao nhất 03 năm tù.","b":"Khoản 3 Điều 27 BLHS","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Tháng 9/2026, Hòa còn bị truy cứu trách nhiệm hình sự về tội trộm cắp không?","o":["Chỉ còn bị truy cứu nếu người bị hại có yêu cầu khởi tố","Còn, vì thời hiệu tính lại đến tháng 5/2027 mới hết","Không, vì đã quá 05 năm kể từ ngày 01/3/2019","Không, vì án tích về tội trộm cắp đã được xóa"],"a":1,"e":"Thời hiệu 05 năm tính lại từ ngày 10/5/2022 sẽ hết vào tháng 5/2027 (khoản 2, khoản 3 Điều 27 BLHS); tháng 9/2026 vẫn trong thời hiệu. Xóa án tích chỉ đặt ra với người đã bị kết án.","b":"Khoản 2, khoản 3 Điều 27 BLHS","cid":"TH2.03"},{"id":"TH2.03.4","g":2,"lv":"VD","q":"Thời hiệu truy cứu trách nhiệm hình sự đối với tội lừa đảo chiếm đoạt tài sản của Hòa kết thúc khi nào (nếu Hòa không phạm tội mới)?","o":["Ngày 10/5/2027","Ngày 10/5/2025","Ngày 10/5/2032","Ngày 01/3/2029"],"a":0,"e":"Khoản 1 Điều 174 có mức cao nhất 03 năm tù nên là tội ít nghiêm trọng; thời hiệu 05 năm tính từ ngày tội phạm được thực hiện (10/5/2022), kết thúc vào tháng 5/2027 (điểm a khoản 2 Điều 27 BLHS). Thời hiệu của từng tội được tính riêng.","b":"Điểm a khoản 2 Điều 27 BLHS","cid":"TH2.03"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Bình có những tình tiết giảm nhẹ nào thuộc khoản 1 Điều 51 BLHS?","o":["Không có tình tiết nào, vì giá trị tài sản chiếm đoạt trên 2.000.000 đồng","Bồi thường; phạm tội lần đầu, ít nghiêm trọng; thành khẩn khai báo","Chỉ có tình tiết nhân thân tốt, chưa có tiền án, tiền sự","Chỉ có tình tiết tự nguyện bồi thường thiệt hại cho bị hại"],"a":1,"e":"Khoản 1 Điều 51 BLHS: điểm b – tự nguyện sửa chữa, bồi thường thiệt hại hoặc khắc phục hậu quả; điểm i – phạm tội lần đầu và thuộc trường hợp ít nghiêm trọng; điểm s – thành khẩn khai báo hoặc ăn năn hối cải. Nhân thân tốt có thể được Tòa án coi là tình tiết giảm nhẹ theo khoản 2.","b":"Khoản 1, khoản 2 Điều 51 BLHS","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Với các tình tiết trên và khoản 1 Điều 173 là khung nhẹ nhất, Tòa án có thể quyết định hình phạt thế nào?","o":["Bắt buộc tuyên mức thấp nhất của khung là 06 tháng tù","Bắt buộc miễn trách nhiệm hình sự cho Bình vì có nhiều tình tiết giảm nhẹ","Chỉ được tuyên hình phạt cảnh cáo vì đây là hình phạt nhẹ nhất","Có thể chuyển sang một hình phạt khác thuộc loại nhẹ hơn"],"a":3,"e":"Khoản 1 Điều 54 BLHS: Tòa án có thể quyết định hình phạt nhẹ hơn khi người phạm tội có ít nhất hai tình tiết giảm nhẹ tại khoản 1 Điều 51. Khoản 3: nếu điều luật chỉ có một khung hoặc khung đó là khung nhẹ nhất thì Tòa án có thể quyết định dưới mức thấp nhất của khung hoặc chuyển sang hình phạt khác thuộc loại nhẹ hơn; lý do phải ghi rõ trong bản án.","b":"Khoản 1, khoản 3 Điều 54 BLHS","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Bình bị xử phạt 09 tháng tù cho hưởng án treo. Thời gian thử thách được ấn định thế nào?","o":["01 năm 06 tháng, bằng hai lần mức phạt tù","05 năm, là mức thử thách cao nhất","06 tháng, bằng hai phần ba mức án","09 tháng, bằng mức hình phạt tù"],"a":0,"e":"Khoản 1 Điều 65 BLHS: khi cho hưởng án treo, Tòa án ấn định thời gian thử thách từ 01 năm đến 05 năm. Nghị quyết 02/2018/NQ-HĐTP hướng dẫn thời gian thử thách bằng hai lần mức hình phạt tù nhưng không được ít hơn 01 năm và không được quá 05 năm: 2 × 09 tháng = 18 tháng.","b":"Khoản 1 Điều 65 BLHS; Nghị quyết 02/2018/NQ-HĐTP","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Trong thời gian thử thách, Bình cố ý phạm tội mới và bị xử phạt 01 năm tù. Hình phạt được giải quyết thế nào?","o":["Kéo dài thời gian thử thách, không phải chấp hành 09 tháng tù","Bình chỉ chấp hành 01 năm tù của bản án mới","Buộc chấp hành 09 tháng tù và tổng hợp với bản án mới","Hủy quyết định cho hưởng án treo để xét xử lại vụ án trước"],"a":2,"e":"Khoản 5 Điều 65 BLHS: trong thời gian thử thách, nếu người được hưởng án treo cố ý vi phạm nghĩa vụ hai lần trở lên hoặc thực hiện hành vi phạm tội mới thì Tòa án quyết định buộc người đó phải chấp hành hình phạt của bản án đã cho hưởng án treo và tổng hợp với hình phạt của bản án mới theo Điều 56.","b":"Khoản 5 Điều 65 BLHS","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Hình phạt chung trong bản án thứ nhất là bao nhiêu?","o":["08 năm 02 tháng tù","10 năm tù","08 năm 08 tháng tù","08 năm tù và 02 năm cải tạo không giam giữ chấp hành riêng"],"a":2,"e":"Điểm c khoản 1 Điều 55 BLHS: nếu các hình phạt đã tuyên là cải tạo không giam giữ và tù có thời hạn thì cải tạo không giam giữ được chuyển đổi thành tù theo tỷ lệ cứ 03 ngày cải tạo không giam giữ được chuyển đổi thành 01 ngày tù. 02 năm (24 tháng) cải tạo không giam giữ = 08 tháng tù; hình phạt chung là 08 năm 08 tháng tù.","b":"Điểm c khoản 1 Điều 55 BLHS","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Thời gian 04 tháng tạm giam được xử lý thế nào?","o":["Chỉ được trừ nếu Dũng có đơn đề nghị Tòa án xem xét","Được trừ vào thời hạn tù, cứ 01 ngày tạm giam bằng 01 ngày tù","Không được trừ, vì tạm giam là biện pháp ngăn chặn chứ không phải hình phạt","Được trừ theo tỷ lệ 01 ngày tạm giam bằng 03 ngày tù"],"a":1,"e":"Khoản 1 Điều 38 BLHS: thời gian tạm giữ, tạm giam được trừ vào thời hạn chấp hành hình phạt tù, cứ 01 ngày tạm giữ, tạm giam bằng 01 ngày tù. Tỷ lệ 01 ngày tạm giam bằng 03 ngày áp dụng khi trừ vào hình phạt cải tạo không giam giữ.","b":"Khoản 1 Điều 38 BLHS","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Tội trộm cắp mới bị phát hiện được xét xử và tổng hợp hình phạt theo quy định nào?","o":["Điểm c khoản 1 Điều 55, vì Dũng phạm nhiều tội trong cùng một vụ án","Khoản 2 Điều 56, vì đây là tội phạm mới thực hiện khi đang chấp hành án","Không xét xử, vì Dũng đang chấp hành hình phạt của bản án trước","Khoản 1 Điều 56, tổng hợp với hình phạt của bản án trước"],"a":3,"e":"Khoản 1 Điều 56 BLHS: trường hợp một người đang phải chấp hành một bản án mà lại bị xét xử về tội đã phạm trước khi có bản án này, thì Tòa án quyết định hình phạt đối với tội đang bị xét xử, sau đó tổng hợp với hình phạt của bản án trước theo Điều 55. Khoản 2 Điều 56 áp dụng cho tội mới phạm sau khi đã có bản án.","b":"Khoản 1 Điều 56 BLHS","cid":"TH3.02"},{"id":"TH3.02.4","g":3,"lv":"VD","q":"Hình phạt chung Dũng phải chấp hành sau khi tổng hợp là bao nhiêu?","o":["09 năm 08 tháng tù, trừ thời gian đã chấp hành","08 năm 08 tháng tù, không cộng thêm hình phạt của tội mới","01 năm tù, chấp hành sau khi chấp hành xong bản án cũ","09 năm 08 tháng tù, không trừ thời gian đã chấp hành"],"a":0,"e":"Theo khoản 1 Điều 56 và điểm a khoản 1 Điều 55 BLHS, các hình phạt tù được cộng lại: 08 năm 08 tháng + 01 năm = 09 năm 08 tháng tù (không vượt quá 30 năm). Thời gian đã chấp hành hình phạt của bản án trước được trừ vào thời hạn chấp hành hình phạt chung.","b":"Khoản 1 Điều 56, điểm a khoản 1 Điều 55 BLHS","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Hành vi của Hùng thuộc tội danh và khung hình phạt nào?","o":["Cướp tài sản, điểm d khoản 2 Điều 168","Cướp tài sản, khoản 1 Điều 168","Cướp giật tài sản, khoản 2 Điều 171","Cưỡng đoạt tài sản, khoản 1 Điều 170"],"a":0,"e":"Hùng dùng dao đe dọa, khống chế làm chị Lan lâm vào tình trạng không thể chống cự để chiếm đoạt xe, nên phạm tội cướp tài sản (Điều 168). Việc dùng dao bấm là tình tiết định khung \"sử dụng vũ khí, phương tiện hoặc công cụ nguy hiểm khác\" tại điểm d khoản 2 Điều 168, phạt tù từ 07 năm đến 15 năm.","b":"Điểm d khoản 2 Điều 168 BLHS","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Chiếc xe máy đã thu hồi được xử lý thế nào?","o":["Tịch thu sung ngân sách nhà nước","Trả lại cho chị Lan là chủ sở hữu hợp pháp","Giữ lại đến khi Hùng chấp hành xong hình phạt","Bán đấu giá để bù chi phí tố tụng"],"a":1,"e":"Khoản 2 Điều 47 và Điều 48 BLHS: tài sản bị người phạm tội chiếm đoạt phải được trả lại cho chủ sở hữu hoặc người quản lý hợp pháp; không bị tịch thu.","b":"Khoản 2 Điều 47, Điều 48 BLHS","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Con dao bấm Hùng dùng để phạm tội được xử lý thế nào?","o":["Tịch thu theo hình phạt bổ sung tịch thu tài sản của người phạm tội","Giao cho chị Lan để khấu trừ vào khoản bồi thường thiệt hại","Trả lại cho Hùng sau khi xét xử vì là tài sản hợp pháp của Hùng","Tịch thu theo biện pháp tư pháp, vì là công cụ dùng vào việc phạm tội"],"a":3,"e":"Điểm a khoản 1 Điều 47 BLHS: công cụ, phương tiện dùng vào việc phạm tội bị tịch thu, sung vào ngân sách nhà nước hoặc tịch thu tiêu hủy. Đây là biện pháp tư pháp, khác hình phạt bổ sung tịch thu tài sản (Điều 45).","b":"Điểm a khoản 1 Điều 47 BLHS","cid":"TH3.03"},{"id":"TH3.03.4","g":3,"lv":"VD","q":"Hùng mắc bệnh tâm thần sau khi phạm tội, trước khi bị kết án. Hướng xử lý đúng là gì?","o":["Vẫn xét xử và tuyên hình phạt tù ngay để bảo đảm tính nghiêm minh","Hùng được miễn trách nhiệm hình sự vĩnh viễn về tội đã thực hiện","Bắt buộc chữa bệnh; khỏi bệnh có thể phải chịu TNHS","Đình chỉ vụ án vì Hùng không có năng lực trách nhiệm hình sự"],"a":2,"e":"Khoản 2 Điều 49 BLHS: người phạm tội trong khi có năng lực trách nhiệm hình sự nhưng trước khi bị kết án đã mắc bệnh tới mức mất khả năng nhận thức hoặc khả năng điều khiển hành vi thì căn cứ vào kết luận giám định, có thể bị áp dụng biện pháp bắt buộc chữa bệnh; sau khi khỏi bệnh, người đó có thể phải chịu trách nhiệm hình sự. Khác Điều 21 (mất năng lực ngay khi thực hiện hành vi).","b":"Khoản 2 Điều 49 BLHS","cid":"TH3.03"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Hành vi lần đầu của Khánh có thuộc diện được xem xét xử lý chuyển hướng không?","o":["Có, nhưng chỉ vì gia đình Khánh đã bồi thường đầy đủ cho bị hại","Có, vì phạm tội nghiêm trọng và không thuộc trường hợp loại trừ","Không, vì người đủ 16 tuổi chịu trách nhiệm hình sự như người thành niên","Không, vì tội trộm cắp tài sản không thuộc diện được xử lý chuyển hướng"],"a":1,"e":"Khoản 2 Điều 173 có mức cao nhất 07 năm tù nên là tội nghiêm trọng (điểm b khoản 1 Điều 9 BLHS). Điều 37 Luật Tư pháp người chưa thành niên cho phép xem xét xử lý chuyển hướng đối với người từ đủ 16 đến dưới 18 tuổi phạm tội nghiêm trọng; khoản 2 Điều 38 chỉ loại trừ tội nghiêm trọng thuộc nhóm hiếp dâm, ma túy, tái phạm, phạm tội nghiêm trọng do cố ý 02 lần trở lên… Khánh không thuộc các trường hợp đó. Việc bồi thường chỉ là tình tiết có lợi.","b":"Điểm b khoản 1 Điều 9 BLHS; Điều 37, Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Để áp dụng xử lý chuyển hướng cho Khánh, phải đáp ứng những điều kiện nào?","o":["Có chứng cứ, Khánh thừa nhận và đồng ý bằng văn bản","Khánh phải bị tạm giam ít nhất 01 tháng trước khi xem xét","Bị hại phải có đơn đề nghị và gia đình Khánh nộp tiền bảo lãnh","Chỉ cần Viện kiểm sát đồng ý, không phụ thuộc ý kiến của Khánh"],"a":0,"e":"Điều 39 Luật Tư pháp người chưa thành niên: phải có đủ ba điều kiện – có chứng cứ xác định người chưa thành niên đã thực hiện hành vi phạm tội; người đó thừa nhận mình đã thực hiện hành vi phạm tội; người đó đồng ý bằng văn bản về việc xử lý chuyển hướng. Trong vụ này, cả ba điều kiện đều có.","b":"Điều 39 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Biện pháp nào sau đây có thể được áp dụng cho Khánh với tư cách biện pháp xử lý chuyển hướng?","o":["Cải tạo không giam giữ 01 năm","Phạt tù cho hưởng án treo","Khiển trách, kết hợp học tập, dạy nghề","Phạt tiền 10.000.000 đồng"],"a":2,"e":"Điều 36 Luật Tư pháp người chưa thành niên liệt kê các biện pháp xử lý chuyển hướng tại cộng đồng (khiển trách, xin lỗi bị hại, bồi thường thiệt hại, giáo dục tại cấp xã, quản thúc tại gia đình, hạn chế khung giờ đi lại, tham gia chương trình học tập, dạy nghề, điều trị hoặc tư vấn tâm lý, lao động phục vụ cộng đồng…) và biện pháp giáo dục tại trường giáo dưỡng. Phạt tiền, cải tạo không giam giữ, án treo là hình phạt.","b":"Điều 36 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.01.4","g":4,"lv":"VD","q":"Với hành vi trộm cắp tháng 9/2026, Khánh có tiếp tục được xử lý chuyển hướng không?","o":["Có, vì Khánh vẫn chưa đủ 18 tuổi khi thực hiện hành vi mới","Có, nếu gia đình tiếp tục bồi thường đầy đủ cho bị hại","Không, vì Khánh đã đủ 16 tuổi nên phải chịu trách nhiệm như người lớn","Không, vì đã được xử lý chuyển hướng mà lại phạm tội mới"],"a":3,"e":"Khoản 3 Điều 38 Luật Tư pháp người chưa thành niên: không áp dụng biện pháp xử lý chuyển hướng đối với người chưa thành niên đã được áp dụng biện pháp xử lý chuyển hướng mà phạm tội mới. Khi đó Khánh có thể bị truy cứu trách nhiệm hình sự theo thủ tục chung dành cho người chưa thành niên.","b":"Khoản 3 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Hành vi của Nam thuộc loại tội phạm nào và Nam có phải chịu trách nhiệm hình sự không?","o":["Tội rất nghiêm trọng; Nam phải chịu trách nhiệm hình sự","Tội rất nghiêm trọng; Nam chỉ chịu trách nhiệm hình sự nếu cha mẹ đồng ý","Tội nghiêm trọng; Nam không chịu trách nhiệm hình sự vì chưa đủ 16 tuổi","Tội đặc biệt nghiêm trọng; Nam phải chịu trách nhiệm hình sự"],"a":0,"e":"Khoản 1 Điều 168 có mức cao nhất 10 năm tù nên là tội rất nghiêm trọng (điểm c khoản 1 Điều 9 BLHS). Ngày 05/6/2026 Nam đã đủ 15 tuổi; theo khoản 2 Điều 12, người từ đủ 14 đến dưới 16 tuổi chịu trách nhiệm hình sự về tội rất nghiêm trọng, đặc biệt nghiêm trọng thuộc các điều được liệt kê, trong đó có Điều 168.","b":"Khoản 2 Điều 12, điểm c khoản 1 Điều 9 BLHS","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Vụ án được khởi tố khi Nam đã đủ 16 tuổi. Tuổi của Nam được xác định theo thời điểm nào?","o":["Thời điểm xét xử sơ thẩm vụ án","Thời điểm khởi tố vụ án (tháng 3/2027)","Thời điểm bản án có hiệu lực pháp luật","Thời điểm thực hiện hành vi (05/6/2026)"],"a":3,"e":"Tuổi chịu trách nhiệm hình sự và chế độ xử lý đối với người chưa thành niên được xác định theo thời điểm thực hiện hành vi phạm tội (khoản 2 Điều 12 BLHS). Việc khởi tố muộn khi Nam đã đủ 16 tuổi không làm Nam bị xử lý như người từ đủ 16 tuổi.","b":"Khoản 2 Điều 12 BLHS","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Nam có thể được xem xét áp dụng biện pháp xử lý chuyển hướng không?","o":["Có, nhưng chỉ khi bị hại có đơn đề nghị áp dụng biện pháp này","Có, vì phạm tội lần đầu và không thuộc trường hợp loại trừ","Không, vì tội cướp tài sản bị loại trừ đích danh khỏi diện chuyển hướng","Không, vì người phạm tội rất nghiêm trọng không được xử lý chuyển hướng"],"a":1,"e":"Khoản 1 Điều 37 Luật Tư pháp người chưa thành niên cho phép xem xét xử lý chuyển hướng đối với người từ đủ 14 đến dưới 16 tuổi phạm tội rất nghiêm trọng. Khoản 1 Điều 38 chỉ loại trừ: tội rất nghiêm trọng là giết người, hiếp dâm, hiếp dâm người dưới 16 tuổi, cưỡng dâm người từ đủ 13 đến dưới 16 tuổi, sản xuất trái phép chất ma túy; phạm tội rất nghiêm trọng 02 lần trở lên hoặc nhiều tội rất nghiêm trọng; phạm tội đặc biệt nghiêm trọng. Nam không thuộc trường hợp nào; việc áp dụng còn phải đủ điều kiện tại Điều 39.","b":"Khoản 1 Điều 37, khoản 1 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.02"},{"id":"TH4.02.4","g":4,"lv":"VD","q":"Nếu Tòa án quyết định xử phạt tù có thời hạn, mức tù cao nhất có thể tuyên đối với Nam là bao nhiêu?","o":["06 năm, bằng ba phần năm mức 10 năm","05 năm, bằng một phần hai mức 10 năm","04 năm, bằng hai phần năm mức 10 năm","10 năm, bằng mức cao nhất của khung"],"a":2,"e":"Điều 119 Luật Tư pháp người chưa thành niên: đối với người từ đủ 14 đến dưới 16 tuổi, mức phạt tù cao nhất không quá hai phần năm mức phạt tù mà điều luật quy định; riêng 05 tội (giết người, hiếp dâm, hiếp dâm người dưới 16 tuổi, cưỡng dâm người từ đủ 13 đến dưới 16 tuổi, sản xuất trái phép chất ma túy) là một phần hai. Tội cướp không thuộc nhóm ngoại lệ: 2/5 × 10 năm = 04 năm.","b":"Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Tuấn phải chịu trách nhiệm hình sự như thế nào và hành vi thuộc loại tội phạm gì?","o":["Không chịu trách nhiệm hình sự vì chưa đủ 18 tuổi","Tội giết người; khoản 2 Điều 123 là tội đặc biệt nghiêm trọng","Chỉ chịu trách nhiệm hình sự về tội cố ý gây thương tích","Tội giết người; khoản 2 Điều 123 là tội rất nghiêm trọng"],"a":3,"e":"Khoản 1 Điều 12 BLHS: người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội mà Bộ luật có quy định khác. Khoản 2 Điều 123 có mức cao nhất 15 năm tù nên là tội rất nghiêm trọng (điểm c khoản 1 Điều 9).","b":"Khoản 1 Điều 12, điểm c khoản 1 Điều 9 BLHS","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"Đề nghị áp dụng biện pháp xử lý chuyển hướng của gia đình Tuấn được giải quyết thế nào?","o":["Chấp nhận, vì Tuấn đầu thú và thành khẩn khai báo","Chấp nhận, nếu gia đình bị hại đồng ý bằng văn bản","Không chấp nhận, vì đây là tội rất nghiêm trọng do cố ý","Chấp nhận, vì đây là lần đầu Tuấn phạm tội"],"a":2,"e":"Điểm d khoản 2 Điều 38 Luật Tư pháp người chưa thành niên: không áp dụng biện pháp xử lý chuyển hướng đối với người từ đủ 16 đến dưới 18 tuổi phạm tội rất nghiêm trọng do cố ý hoặc phạm tội đặc biệt nghiêm trọng. Đầu thú, thành khẩn khai báo là tình tiết giảm nhẹ khi quyết định hình phạt.","b":"Điểm d khoản 2 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Mức tù cao nhất có thể tuyên đối với Tuấn là bao nhiêu?","o":["11 năm 03 tháng (ba phần tư của 15 năm)","15 năm","09 năm (ba phần năm của 15 năm)","07 năm 06 tháng (một phần hai của 15 năm)"],"a":0,"e":"Điều 119 Luật Tư pháp người chưa thành niên: người từ đủ 16 đến dưới 18 tuổi bị phạt tù không quá ba phần năm mức phạt tù điều luật quy định; riêng tội giết người và một số tội ngoại lệ là không quá ba phần tư. Tội giết người thuộc ngoại lệ nên mức cao nhất là 3/4 × 15 năm = 11 năm 03 tháng.","b":"Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.03"},{"id":"TH4.03.4","g":4,"lv":"VD","q":"Khi quyết định hình phạt tù đối với Tuấn, Tòa án phải tuân thủ yêu cầu nào?","o":["Có thể kèm hình phạt bổ sung cấm cư trú như đối với người thành niên","Nhẹ hơn người thành niên và không áp dụng hình phạt bổ sung","Có thể tuyên tù chung thân nếu hậu quả của tội phạm nghiêm trọng","Phải tuyên mức thấp nhất của khung vì người phạm tội chưa thành niên"],"a":1,"e":"Điều 12 Luật Tư pháp người chưa thành niên: chỉ áp dụng tù có thời hạn khi các biện pháp, hình phạt khác không có tác dụng; mức phạt nhẹ hơn người đủ 18 tuổi phạm tội tương ứng và với thời hạn thích hợp ngắn nhất; không xử phạt tù chung thân, tử hình và không áp dụng hình phạt bổ sung đối với người chưa thành niên phạm tội.","b":"Điều 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.03"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Hành vi của E cấu thành tội gì?","o":["Trộm cắp tài sản (Điều 173), vì E lén lút mang xe đi nơi khác","Không phạm tội, vì đây chỉ là tranh chấp dân sự về hợp đồng mượn","Lạm dụng tín nhiệm chiếm đoạt tài sản (Điều 175)","Lừa đảo chiếm đoạt tài sản (Điều 174), vì E nói dối lý do mượn xe"],"a":2,"e":"Điểm a khoản 1 Điều 175 BLHS: vay, mượn, thuê tài sản của người khác rồi dùng thủ đoạn gian dối hoặc bỏ trốn để chiếm đoạt tài sản đó. Ý định chiếm đoạt nảy sinh sau khi E đã nhận xe; nếu E có ý định chiếm đoạt và dùng thủ đoạn gian dối ngay từ khi hỏi mượn thì mới là lừa đảo (Điều 174). Việc bỏ trốn để chiếm đoạt nên không chỉ là quan hệ dân sự.","b":"Điểm a khoản 1 Điều 175, Điều 174 BLHS","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Hành vi của E thuộc khung hình phạt nào?","o":["Khoản 1 Điều 175, tù từ 06 tháng đến 03 năm","Khoản 2 Điều 175, phạt tù từ 02 năm đến 07 năm","Khoản 1 Điều 175, phạt tù từ 02 năm đến 07 năm","Khoản 3 Điều 175, phạt tù từ 05 năm đến 12 năm"],"a":0,"e":"Khoản 1 Điều 175 BLHS áp dụng khi chiếm đoạt tài sản trị giá từ 4.000.000 đồng đến dưới 50.000.000 đồng, hình phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm. Giá trị tài sản tính theo giá trị chiếc xe (40.000.000 đồng), không theo số tiền E bán được.","b":"Khoản 1 Điều 175 BLHS","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Hành vi của G được đánh giá thế nào?","o":["G là đồng phạm của E về tội lạm dụng tín nhiệm chiếm đoạt tài sản","G không phạm tội vì đã trả tiền mua xe theo giá thỏa thuận","G phạm tội lừa đảo chiếm đoạt tài sản của chủ sở hữu xe","G phạm tội tiêu thụ tài sản do người khác phạm tội mà có (Điều 323)"],"a":3,"e":"Điều 323 BLHS: người nào không hứa hẹn trước mà chứa chấp, tiêu thụ tài sản biết rõ là do người khác phạm tội mà có thì phạm tội này. Nếu G hứa hẹn trước với E thì G có thể là đồng phạm; ở đây G không hứa hẹn trước nhưng biết rõ nguồn gốc xe.","b":"Điều 323 BLHS","cid":"TH5.01"},{"id":"TH5.01.4","g":5,"lv":"VD","q":"Chiếc xe thu hồi được từ G xử lý thế nào?","o":["Tịch thu sung ngân sách nhà nước vì là vật chứng","Trả lại cho F là chủ sở hữu hợp pháp","Trả lại cho G vì G đã trả tiền","Bán đấu giá, chia tiền cho F và G"],"a":1,"e":"Khoản 2 Điều 47 và Điều 48 BLHS: tài sản bị người phạm tội chiếm đoạt phải được trả lại cho chủ sở hữu hợp pháp. G biết rõ nguồn gốc xe nên không được bảo vệ như người mua ngay tình; G có thể yêu cầu E hoàn trả tiền theo thủ tục dân sự.","b":"Khoản 2 Điều 47, Điều 48 BLHS","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Hành vi của ông X cấu thành tội gì?","o":["Lừa đảo chiếm đoạt tài sản (Điều 174)","Lạm quyền trong khi thi hành công vụ (Điều 357)","Tham ô tài sản (Điều 353)","Nhận hối lộ (Điều 354), vì lợi dụng chức vụ nhận lợi ích để làm theo yêu cầu"],"a":3,"e":"Ông X là người có chức vụ, quyền hạn, đã lợi dụng chức vụ, quyền hạn trực tiếp nhận lợi ích vật chất (50.000.000 đồng) để làm một việc vì lợi ích hoặc theo yêu cầu của người đưa (cho qua hồ sơ). Tham ô là chiếm đoạt tài sản mà mình có trách nhiệm quản lý, không phải trường hợp này.","b":"Khoản 1 Điều 354 BLHS","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Để kết luận ông X phạm tội nhận hối lộ, cơ quan tiến hành tố tụng phải chứng minh những gì?","o":["Chỉ cần chứng minh ông X đã nhận tiền từ Công ty Y","Chức vụ, việc nhận lợi ích và mối liên hệ với việc làm theo yêu cầu","Chỉ cần chứng minh hồ sơ của Công ty Y đã được cấp phép","Chỉ cần lời khai thừa nhận của giám đốc Công ty Y"],"a":1,"e":"Các dấu hiệu bắt buộc của tội nhận hối lộ: chủ thể có chức vụ, quyền hạn; hành vi nhận lợi ích; mục đích làm hoặc không làm một việc vì lợi ích hoặc theo yêu cầu của người đưa. Trách nhiệm chứng minh thuộc cơ quan, người có thẩm quyền tiến hành tố tụng (Điều 15 BLTTHS); lời khai phải được đối chiếu với chứng cứ khác.","b":"Khoản 1 Điều 354 BLHS; Điều 15 BLTTHS","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Hành vi nhận 50.000.000 đồng của ông X (không có tình tiết định khung khác) thuộc khung hình phạt nào?","o":["Khoản 1 Điều 354, phạt tù từ 02 năm đến 07 năm","Chỉ bị xử lý kỷ luật vì dưới 100.000.000 đồng","Khoản 3 Điều 354, phạt tù từ 15 năm đến 20 năm","Khoản 2 Điều 354, phạt tù từ 07 năm đến 15 năm"],"a":0,"e":"Khoản 1 Điều 354 BLHS: nhận hối lộ có giá trị từ 2.000.000 đồng đến dưới 100.000.000 đồng thì bị phạt tù từ 02 năm đến 07 năm. 50.000.000 đồng thuộc khung này.","b":"Khoản 1 Điều 354 BLHS","cid":"TH5.02"},{"id":"TH5.02.4","g":5,"lv":"VD","q":"Giám đốc Công ty Y được xử lý thế nào?","o":["Đương nhiên được coi là không có tội và được trả lại toàn bộ 50.000.000 đồng","Bắt buộc chịu trách nhiệm hình sự ở khung hình phạt cao nhất","Có thể được miễn TNHS vì đã chủ động khai báo trước khi bị phát giác","Không phạm tội, vì chỉ đưa tiền để hồ sơ được giải quyết nhanh hơn"],"a":2,"e":"Điều 364 BLHS: người đưa hối lộ tuy không bị ép buộc nhưng đã chủ động khai báo trước khi bị phát giác thì có thể được miễn trách nhiệm hình sự và được trả lại một phần hoặc toàn bộ của hối lộ. Chỉ người bị ép buộc đưa hối lộ mà chủ động khai báo trước khi bị phát giác mới được coi là không có tội.","b":"Điều 364 BLHS","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"VD","q":"Thương tích 8% có đủ để truy cứu trách nhiệm hình sự Phong về tội cố ý gây thương tích không?","o":["Không, vì tỷ lệ tổn thương cơ thể dưới 11%","Chỉ khi anh Quân bị thương ở vùng nguy hiểm trên cơ thể","Có, vì dù dưới 11% nhưng Phong dùng hung khí nguy hiểm","Chỉ khi Phong đã có tiền án về tội phạm có tính chất bạo lực"],"a":2,"e":"Khoản 1 Điều 134 BLHS: cố ý gây thương tích cho người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30%, hoặc dưới 11% nhưng thuộc một trong các trường hợp như dùng vũ khí, vật liệu nổ, hung khí nguy hiểm (điểm a), thì phạm tội. Dao gọt hoa quả dùng để đâm người là hung khí nguy hiểm.","b":"Điểm a khoản 1 Điều 134 BLHS","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"VD","q":"Hành vi của Phong thuộc loại tội phạm nào?","o":["Tội ít nghiêm trọng, vì mức cao nhất của khung là 03 năm tù","Tội rất nghiêm trọng, vì xâm phạm sức khỏe của người khác","Tội nghiêm trọng, vì Phong dùng hung khí nguy hiểm","Vi phạm hành chính, vì tỷ lệ tổn thương cơ thể dưới 11%"],"a":0,"e":"Khoản 1 Điều 134 BLHS quy định phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm. Theo điểm a khoản 1 Điều 9, tội có mức cao nhất của khung đến 03 năm tù là tội ít nghiêm trọng.","b":"Điểm a khoản 1 Điều 9 BLHS","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Vụ án được khởi tố theo cơ chế nào?","o":["Cơ quan điều tra bắt buộc khởi tố, không phụ thuộc yêu cầu của bị hại","Chỉ được khởi tố khi Viện kiểm sát nhân dân tối cao đồng ý","Khởi tố theo đề nghị của Ủy ban nhân dân cấp xã nơi xảy ra vụ việc","Chỉ khởi tố theo yêu cầu của bị hại (khoản 1 Điều 134)"],"a":3,"e":"Khoản 1 Điều 155 BLTTHS: chỉ được khởi tố vụ án hình sự về tội phạm quy định tại khoản 1 các điều 134, 135, 136, 138, 139, 141, 143, 155, 156 và 226 BLHS khi có yêu cầu của bị hại hoặc người đại diện của bị hại. Anh Quân đã có đơn yêu cầu nên vụ án được khởi tố.","b":"Khoản 1 Điều 155 BLTTHS","cid":"TH5.03"},{"id":"TH5.03.4","g":5,"lv":"VD","q":"Anh Quân tự nguyện rút đơn yêu cầu khởi tố trong giai đoạn điều tra. Vụ án được giải quyết thế nào?","o":["Tạm đình chỉ điều tra trong 01 năm để anh Quân suy nghĩ lại","Đình chỉ vụ án; anh Quân không được yêu cầu khởi tố lại","Chuyển sang xử phạt vi phạm hành chính đối với Phong","Vẫn tiếp tục điều tra vì vụ án đã được khởi tố"],"a":1,"e":"Khoản 2 Điều 155 BLTTHS: trường hợp người đã yêu cầu khởi tố rút yêu cầu thì vụ án phải được đình chỉ, trừ trường hợp có căn cứ xác định người đã yêu cầu rút yêu cầu khởi tố trái với ý muốn của họ do bị ép buộc, cưỡng bức. Người đã rút yêu cầu khởi tố thì không có quyền yêu cầu lại, trừ trường hợp rút yêu cầu do bị ép buộc, cưỡng bức.","b":"Khoản 2 Điều 155 BLTTHS","cid":"TH5.03"},{"id":"TH6.01.1","g":6,"lv":"VD","q":"Có thể kết luận ngay tội phạm trộm cắp thực tế đã tăng đúng 20% không?","o":["Không, vì số liệu thống kê của một năm không có giá trị sử dụng","Có, vì số liệu ghi nhận chính thức luôn phản ánh đầy đủ thực tế","Không, vì phần tăng có thể do tội phạm ẩn được phát hiện nhiều hơn","Có, nếu số liệu do cơ quan công an có thẩm quyền cung cấp"],"a":2,"e":"Số liệu ghi nhận chỉ phản ánh tội phạm rõ. Khảo sát cho thấy tỷ lệ tội phạm ẩn cao; việc mở kênh báo tin trực tuyến và đợt cao điểm có thể làm tăng tỷ lệ trình báo, phát hiện mà không có nghĩa tội phạm thực tế tăng tương ứng.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"VD","q":"Trong các dữ kiện của tình huống, dữ kiện nào là chỉ báo trực tiếp về tội phạm ẩn?","o":["Khảo sát nạn nhân: khoảng một nửa số vụ không được trình báo","Số vụ trộm cắp được ghi nhận năm 2025 tăng 20% so với năm trước","Việc mở đợt cao điểm tấn công, trấn áp tội phạm trên địa bàn","Việc nhóm nghiên cứu được giao nhiệm vụ dự báo tình hình năm 2026"],"a":0,"e":"Tội phạm ẩn là tội phạm đã xảy ra nhưng không được phát hiện, ghi nhận trong thống kê chính thức. Khảo sát nạn nhân là phương pháp điển hình để ước lượng phần ẩn; số liệu thống kê chỉ phản ánh phần rõ.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Để dự báo năm 2026, nhóm nghiên cứu cần bổ sung dữ liệu nào là hữu ích nhất?","o":["Ý kiến cá nhân của một cán bộ có nhiều năm kinh nghiệm công tác","Một vụ trộm cắp nổi bật được báo chí đưa tin nhiều trong năm","Số cuộc họp đã tổ chức về phòng, chống trộm cắp trên địa bàn","Chuỗi số liệu nhiều năm và khảo sát nạn nhân lặp lại"],"a":3,"e":"Chuỗi thời gian dài giúp nhận diện xu hướng; khảo sát nạn nhân lặp lại giúp ước lượng biến động của tội phạm ẩn; dữ liệu về thay đổi cách ghi nhận giúp hiệu chỉnh số liệu; yếu tố kinh tế – xã hội giải thích nguyên nhân biến động.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.01.4","g":6,"lv":"VD","q":"Kết quả dự báo nên được trình bày như thế nào để phục vụ hoạch định phòng ngừa?","o":["Chỉ trình bày những số liệu có lợi cho thành tích của địa phương","Nêu rõ giả định, phương pháp, giới hạn dữ liệu và độ bất định","Một con số duy nhất, khẳng định chính xác tuyệt đối để dễ chỉ đạo","Chỉ nêu kết luận, không công bố phương pháp để tránh tranh cãi"],"a":1,"e":"Dự báo tội phạm là dự báo xác suất; để cơ quan hoạch định chính sách sử dụng đúng, kết quả phải minh bạch về giả định, phương pháp, giới hạn dữ liệu và khoảng bất định, đồng thời được cập nhật khi có dữ liệu mới.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"VD","q":"Yếu tố nào từ phía nạn nhân tạo điều kiện cho loại tội phạm này?","o":["Sinh viên sống tập trung trong ký túc xá của nhà trường","Sinh viên có thành tích học tập tốt nên dễ tin người","Thiếu kỹ năng nhận diện thủ đoạn, dễ chuyển tiền theo hướng dẫn","Sinh viên học các ngành không liên quan đến công nghệ thông tin"],"a":2,"e":"Nạn nhân học tội phạm chỉ ra đặc điểm, hành vi của nạn nhân có thể tạo điều kiện cho tội phạm. Ở đây, sinh viên mới đến thành phố, thiếu kinh nghiệm và kỹ năng nhận diện thủ đoạn, dễ làm theo hướng dẫn chuyển tiền là yếu tố mà người phạm tội khai thác.","b":"Giáo trình Tội phạm học","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"VD","q":"Biện pháp nào phù hợp với phòng ngừa xã hội trong trường hợp này?","o":["Nâng cao nhận thức, kỹ năng nhận diện, lập kênh báo tin","Cho phép sinh viên tự điều tra, truy tìm người bị nghi ngờ","Công khai dữ liệu cá nhân của người bị nghi ngờ trên mạng xã hội","Chỉ nhấn mạnh mức hình phạt nghiêm khắc trong thông điệp truyền thông"],"a":0,"e":"Phòng ngừa xã hội tác động vào nguyên nhân, điều kiện của tội phạm, trong đó có tính dễ bị tổn thương của nạn nhân tiềm năng, thông qua giáo dục, rèn kỹ năng, kênh báo tin. Công khai dữ liệu cá nhân hay để sinh viên tự điều tra là trái pháp luật.","b":"Giáo trình Tội phạm học","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Những chủ thể nào có trách nhiệm tham gia chương trình phòng ngừa này?","o":["Chỉ những sinh viên đã từng bị lừa đảo","Chỉ Tòa án và Viện kiểm sát cùng cấp","Chỉ cơ quan công an nơi trường đóng trụ sở","Nhà trường, sinh viên, gia đình, đoàn thể và công an"],"a":3,"e":"Điều 4 BLHS xác định trách nhiệm phòng ngừa và đấu tranh chống tội phạm thuộc về cơ quan, tổ chức và mọi công dân. Nhà trường tổ chức giáo dục, công an cung cấp thông tin và tiếp nhận tin báo, gia đình theo d
