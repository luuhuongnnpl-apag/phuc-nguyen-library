</head><body><script id="PNLIB_COURSE_GATE">
(function(){
  const courseId="luat-hinh-su";
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let access=false;
  try{
    const raw=localStorage.getItem("pnlib-ma-lop");
    const session=raw?JSON.parse(raw):null;
    const scopes=session&&Array.isArray(session.courses)?session.courses:null;
    access=!!(session&&session.code&&session.han&&today()<=session.han&&(!scopes||!scopes.length||scopes.includes("*")||scopes.includes(courseId)));
  }catch(e){access=false}
  if(!access){
    document.documentElement.style.visibility="hidden";
    if(window.top!==window.self){
      window.parent.postMessage({pn:"home",course:courseId},"*");
    }else{
      window.location.replace("../index.html#"+courseId);
    }
  }
})();
</script>

<script id="pn-data" type="application/json">{"meta":{"id":"luat-hinh-su","name":"Luật Hình sự","title":"Tài liệu Luật Hình sự","menuTitle":"Luật Hình sự","asof":"29/10/2026","laws":[{"re":"Tư pháp người chưa thành niên","base":"https://hethongphapluat.com/luat-tu-phap-nguoi-chua-thanh-nien-2024"},{"re":"BLTTHS|Tố tụng hình sự","doc":"https://thuvienphapluat.vn/van-ban/Trach-nhiem-hinh-su/Bo-luat-to-tung-hinh-su-2015-296884.aspx"},{"re":"BLHS|Bộ luật Hình sự","base":"https://hethongphapluat.com/bo-luat-hinh-su-2015"},{"re":"86/2025","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=86/2025/QH15&match=True"},{"re":"Hiến pháp","doc":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"re":"02/2018/NQ-HĐTP","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=02/2018/NQ-H%C4%90TP&match=True"},{"re":"04/2019/NQ-HĐTP","doc":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=04/2019/NQ-H%C4%90TP&match=True"}],"note":"Ngân hàng câu hỏi soạn theo pháp luật có hiệu lực tại ngày 29/10/2026: BLHS 2015 (VBHN 135/VBHN-VPQH), Luật 86/2025/QH15 (hiệu lực 01/7/2025) và Luật Tư pháp người chưa thành niên 59/2024/QH15 (hiệu lực 01/01/2026)."},"chapters":[{"n":1,"name":"Những vấn đề cơ bản về luật hình sự"},{"n":2,"name":"Tội phạm và trách nhiệm hình sự"},{"n":3,"name":"Hình phạt và các biện pháp tư pháp"},{"n":4,"name":"Xử lý hình sự đối với người chưa thành niên"},{"n":5,"name":"Giới thiệu một số nhóm tội phạm cụ thể"},{"n":6,"name":"Dự báo và phòng ngừa tội phạm"}],"q":[{"id":"1.01","g":1,"lv":"NB","q":"Luật hình sự điều chỉnh quan hệ xã hội nào?","o":["Quan hệ tài sản và quan hệ nhân thân giữa các chủ thể bình đẳng","Quan hệ giữa cơ quan tiến hành tố tụng với người tham gia tố tụng hình sự","Quan hệ giữa Nhà nước và người (pháp nhân thương mại) phạm tội, phát sinh khi tội phạm được thực hiện","Quan hệ quản lý hành chính giữa cơ quan nhà nước với cá nhân vi phạm hành chính"],"a":2,"e":"Đối tượng điều chỉnh của luật hình sự là quan hệ xã hội phát sinh giữa Nhà nước và người (hoặc pháp nhân thương mại) phạm tội khi họ thực hiện tội phạm (Điều 1, 2 BLHS). Quan hệ tài sản, nhân thân bình đẳng thuộc luật dân sự; quan hệ giữa cơ quan tố tụng và người tham gia tố tụng thuộc luật tố tụng hình sự; vi phạm hành chính thuộc luật xử lý vi phạm hành chính.","b":"Điều 1, Điều 2 BLHS"},{"id":"1.02","g":1,"lv":"TH","q":"Phương pháp điều chỉnh đặc trưng của luật hình sự là gì?","o":["Phương pháp khuyến nghị, để người phạm tội tự nguyện chấp hành","Phương pháp hòa giải bắt buộc giữa người phạm tội và bị hại","Phương pháp bình đẳng, thỏa thuận giữa Nhà nước và người phạm tội","Phương pháp quyền uy: Nhà nước áp dụng trách nhiệm hình sự đối với người phạm tội"],"a":3,"e":"Luật hình sự dùng phương pháp quyền uy: Nhà nước có quyền buộc người phạm tội chịu trách nhiệm hình sự mà không cần sự đồng ý của họ; hình phạt là biện pháp cưỡng chế nghiêm khắc nhất của Nhà nước (Điều 30 BLHS). Thỏa thuận, bình đẳng là phương pháp của luật dân sự; hòa giải chỉ có ý nghĩa ở một số chế định (như miễn TNHS khoản 3 Điều 29), không phải phương pháp điều chỉnh.","b":"Điều 2, Điều 30 BLHS"},{"id":"1.03","g":1,"lv":"TH","q":"Theo Điều 2 BLHS, cá nhân chỉ phải chịu trách nhiệm hình sự khi nào?","o":["Khi thực hiện hành vi bị nghị định của Chính phủ cấm","Khi hành vi gây thiệt hại và người bị hại yêu cầu xử lý hình sự","Khi thực hiện hành vi nguy hiểm cho xã hội bị dư luận lên án","Khi phạm một tội đã được Bộ luật Hình sự quy định"],"a":3,"e":"Khoản 1 Điều 2 BLHS: chỉ người nào phạm một tội đã được Bộ luật Hình sự quy định mới phải chịu trách nhiệm hình sự. Đây là nguyên tắc pháp chế (không có tội nếu luật không quy định). Dư luận, nghị định hay yêu cầu của bị hại không thể tạo ra căn cứ truy cứu TNHS.","b":"Khoản 1 Điều 2 BLHS"},{"id":"1.04","g":1,"lv":"NB","q":"Nhiệm vụ của Bộ luật Hình sự được quy định tại điều nào?","o":["Điều 1 BLHS","Điều 30 BLHS","Điều 8 BLHS","Điều 3 BLHS"],"a":0,"e":"Điều 1 BLHS quy định nhiệm vụ: bảo vệ chủ quyền quốc gia, an ninh của đất nước, chế độ, quyền con người, quyền công dân, lợi ích của Nhà nước, tổ chức, trật tự pháp luật, chống mọi hành vi phạm tội; giáo dục mọi người ý thức tuân theo pháp luật, phòng ngừa và đấu tranh chống tội phạm. Điều 3 là nguyên tắc xử lý, Điều 8 là khái niệm tội phạm, Điều 30 là khái niệm hình phạt.","b":"Điều 1 BLHS"},{"id":"1.05","g":1,"lv":"TH","q":"Nguyên tắc bình đẳng trong xử lý người phạm tội (Điều 3 BLHS) được hiểu đúng là gì?","o":["Tòa án không được xem xét nhân thân để bảo đảm đối xử như nhau","Mọi người phạm tội đều bình đẳng trước pháp luật, không phân biệt giới tính, dân tộc, tín ngưỡng, tôn giáo, thành phần, địa vị xã hội","Nguyên tắc chỉ áp dụng cho công dân Việt Nam, không áp dụng cho người nước ngoài","Mọi người phạm cùng một tội phải chịu cùng loại và mức hình phạt"],"a":1,"e":"Điểm b khoản 1 Điều 3 BLHS: mọi người phạm tội đều bình đẳng trước pháp luật, không phân biệt giới tính, dân tộc, tín ngưỡng, tôn giáo, thành phần, địa vị xã hội. Bình đẳng không có nghĩa là cào bằng mức hình phạt: Tòa án vẫn phải cá thể hóa theo tính chất, mức độ hành vi, nhân thân và tình tiết tăng nặng, giảm nhẹ (Điều 50).","b":"Điểm b khoản 1 Điều 3 BLHS"},{"id":"1.06","g":1,"lv":"TH","q":"Nội dung nào thể hiện nguyên tắc nhân đạo trong luật hình sự?","o":["Cho phép Tòa án tự quyết định miễn hình phạt theo cảm thông cá nhân","Miễn trách nhiệm hình sự cho mọi người phạm tội lần đầu","Không áp dụng hình phạt tù đối với bất kỳ người phạm tội nào","Khoan hồng đối với người tự thú, thành khẩn khai báo, tố giác đồng phạm, lập công chuộc tội, ăn năn hối cải, tự nguyện sửa chữa hoặc bồi thường"],"a":3,"e":"Điểm d khoản 1 Điều 3 BLHS: khoan hồng đối với người tự thú, đầu thú, thành khẩn khai báo, tố giác đồng phạm, lập công chuộc tội, ăn năn hối cải, tự nguyện sửa chữa hoặc bồi thường thiệt hại. Nhân đạo vẫn trong khuôn khổ luật: miễn TNHS, miễn hình phạt chỉ áp dụng khi đủ điều kiện (Điều 29, 59), không phải tùy nghi.","b":"Điểm d khoản 1 Điều 3 BLHS"},{"id":"1.07","g":1,"lv":"NB","q":"Văn bản nào là nguồn duy nhất quy định tội phạm và hình phạt?","o":["Nghị quyết của Hội đồng Thẩm phán TAND tối cao","Án lệ được Chánh án TAND tối cao công bố","Bộ luật Hình sự","Nghị định của Chính phủ về xử phạt vi phạm hành chính"],"a":2,"e":"Theo Điều 2 BLHS, chỉ Bộ luật Hình sự quy định tội phạm và hình phạt. Nghị quyết của Hội đồng Thẩm phán hướng dẫn áp dụng thống nhất pháp luật; án lệ được nghiên cứu, áp dụng trong xét xử nhưng không tạo ra tội phạm mới; nghị định chỉ quy định vi phạm hành chính.","b":"Khoản 1 Điều 2 BLHS"},{"id":"1.08","g":1,"lv":"VD","q":"Án lệ trong lĩnh vực hình sự có vai trò nào sau đây?","o":["Có giá trị cao hơn Bộ luật Hình sự khi giải thích cấu thành tội phạm","Được nghiên cứu, áp dụng để bảo đảm áp dụng thống nhất pháp luật nhưng không được tạo ra tội danh mới","Có thể quy định hình phạt nặng hơn khung của điều luật","Có thể bổ sung tội danh mới khi Bộ luật Hình sự chưa quy định"],"a":1,"e":"Án lệ là lập luận, phán quyết của Tòa án về một vụ việc cụ thể được Hội đồng Thẩm phán TAND tối cao lựa chọn, công bố để các Tòa án nghiên cứu, áp dụng (Nghị quyết 04/2019/NQ-HĐTP). Do nguyên tắc pháp chế tại Điều 2 BLHS, án lệ chỉ giúp giải thích, áp dụng thống nhất; không thể tạo tội danh mới hay mở rộng hình phạt.","b":"Điều 2 BLHS; Nghị quyết 04/2019/NQ-HĐTP"},{"id":"1.09","g":1,"lv":"TH","q":"Theo Điều 5 BLHS, tội phạm được coi là thực hiện trên lãnh thổ Việt Nam khi nào?","o":["Chỉ khi người bị hại là công dân Việt Nam","Chỉ khi cả hành vi và hậu quả đều xảy ra trên lãnh thổ Việt Nam","Chỉ khi người phạm tội là công dân Việt Nam","Khi hành vi phạm tội hoặc hậu quả của hành vi phạm tội xảy ra trên lãnh thổ Việt Nam"],"a":3,"e":"Khoản 1 Điều 5 BLHS: BLHS áp dụng đối với mọi hành vi phạm tội thực hiện trên lãnh thổ Việt Nam; tội phạm được coi là thực hiện trên lãnh thổ Việt Nam khi hành vi hoặc hậu quả của hành vi xảy ra trên lãnh thổ Việt Nam. Chỉ cần một trong hai yếu tố; quốc tịch người phạm tội hay bị hại không phải điều kiện.","b":"Khoản 1 Điều 5 BLHS"},{"id":"1.10","g":1,"lv":"TH","q":"Điều luật nào được áp dụng để xử lý một hành vi phạm tội theo Điều 7 BLHS?","o":["Điều luật mới nhất, kể cả khi bất lợi cho người phạm tội","Điều luật đang có hiệu lực tại thời điểm hành vi phạm tội được thực hiện","Điều luật có hiệu lực tại thời điểm Tòa án xét xử sơ thẩm","Điều luật có hiệu lực tại thời điểm cơ quan điều tra khởi tố vụ án"],"a":1,"e":"Khoản 1 Điều 7 BLHS: điều luật được áp dụng đối với một hành vi phạm tội là điều luật đang có hiệu lực thi hành tại thời điểm mà hành vi phạm tội được thực hiện. Ngoại lệ là điều luật có lợi được hồi tố (khoản 3); điều luật bất lợi không được hồi tố (khoản 2).","b":"Khoản 1 Điều 7 BLHS"},{"id":"1.11","g":1,"lv":"TH","q":"Người được hưởng quyền miễn trừ ngoại giao phạm tội trên lãnh thổ Việt Nam thì trách nhiệm hình sự của họ được giải quyết thế nào?","o":["Chỉ bị trục xuất mà không cần thủ tục nào","Giải quyết theo quy định của điều ước quốc tế hoặc theo tập quán quốc tế; nếu không có thì bằng con đường ngoại giao","Không bị xử lý dưới bất kỳ hình thức nào","Luôn bị truy cứu theo BLHS Việt Nam như công dân Việt Nam"],"a":1,"e":"Khoản 2 Điều 5 BLHS: đối với người nước ngoài phạm tội trên lãnh thổ Việt Nam thuộc đối tượng được hưởng quyền miễn trừ ngoại giao hoặc lãnh sự theo pháp luật Việt Nam, điều ước quốc tế hoặc tập quán quốc tế thì vấn đề TNHS được giải quyết theo điều ước, tập quán đó; trường hợp không có thì giải quyết bằng con đường ngoại giao. Không phải là 'không bị xử lý'.","b":"Khoản 2 Điều 5 BLHS"},{"id":"1.12","g":1,"lv":"TH","q":"Công dân Việt Nam thực hiện hành vi phạm tội ở ngoài lãnh thổ Việt Nam mà BLHS quy định là tội phạm thì:","o":["Có thể bị truy cứu trách nhiệm hình sự tại Việt Nam theo Bộ luật Hình sự","Chỉ bị truy cứu khi nước sở tại đồng ý","Không bao giờ bị truy cứu tại Việt Nam vì hành vi xảy ra ở nước ngoài","Chỉ bị truy cứu khi người bị hại là công dân Việt Nam"],"a":0,"e":"Khoản 1 Điều 6 BLHS: công dân Việt Nam hoặc pháp nhân thương mại Việt Nam có hành vi phạm tội ở ngoài lãnh thổ Việt Nam mà BLHS quy định là tội phạm thì có thể bị truy cứu TNHS tại Việt Nam theo quy định của Bộ luật này. Quốc tịch bị hại hay sự đồng ý của nước sở tại không phải điều kiện.","b":"Khoản 1 Điều 6 BLHS"},{"id":"1.13","g":1,"lv":"VD","q":"Điều luật mới quy định hình phạt nhẹ hơn có hiệu lực sau khi hành vi phạm tội đã được thực hiện nhưng trước khi xét xử. Tòa án áp dụng thế nào?","o":["Tạm đình chỉ vụ án chờ hướng dẫn của TAND tối cao","Áp dụng điều luật mới vì quy định có lợi cho người phạm tội được hồi tố","Áp dụng điều luật nào có hình phạt nặng hơn để bảo đảm răn đe","Áp dụng điều luật cũ vì đó là luật tại thời điểm thực hiện hành vi"],"a":1,"e":"Khoản 3 Điều 7 BLHS: điều luật xóa bỏ một tội phạm, một hình phạt, một tình tiết tăng nặng, quy định hình phạt nhẹ hơn, tình tiết giảm nhẹ mới hoặc mở rộng phạm vi áp dụng án treo, miễn TNHS… và các quy định khác có lợi cho người phạm tội thì được áp dụng đối với hành vi phạm tội đã thực hiện trước khi điều luật đó có hiệu lực thi hành.","b":"Khoản 3 Điều 7 BLHS"},{"id":"1.14","g":1,"lv":"TH","q":"Điểm khác nhau cơ bản giữa luật hình sự và luật tố tụng hình sự là:","o":["Luật hình sự quy định tội phạm và hình phạt; luật tố tụng hình sự quy định trình tự, thủ tục giải quyết vụ án hình sự","Luật tố tụng hình sự chỉ áp dụng cho pháp nhân thương mại","Luật hình sự quy định trình tự điều tra; luật tố tụng hình sự quy định hình phạt","Hai ngành luật có cùng đối tượng điều chỉnh nhưng khác phương pháp"],"a":0,"e":"Luật hình sự là luật nội dung: quy định tội phạm, hình phạt, các chế định về TNHS (Điều 1, 2 BLHS). Luật tố tụng hình sự là luật hình thức: quy định trình tự, thủ tục tiếp nhận, giải quyết nguồn tin, khởi tố, điều tra, truy tố, xét xử và thi hành án hình sự (Điều 1 BLTTHS).","b":"Điều 1, Điều 2 BLHS; Điều 1 BLTTHS"},{"id":"1.15","g":1,"lv":"VD","q":"Trong giải thích và áp dụng luật hình sự, việc nào bị cấm?","o":["Kiểm tra văn bản sửa đổi và điều khoản chuyển tiếp","Đối chiếu dấu hiệu cấu thành tội phạm với hành vi thực tế","Áp dụng tương tự pháp luật để truy cứu trách nhiệm hình sự một hành vi mà BLHS không quy định là tội phạm","Áp dụng quy định mới có lợi cho người phạm tội"],"a":2,"e":"Do nguyên tắc pháp chế (Điều 2 BLHS) và nguyên tắc suy đoán vô tội (khoản 1 Điều 31 Hiến pháp), luật hình sự không cho phép áp dụng tương tự để buộc tội. Đối chiếu cấu thành, kiểm tra sửa đổi và hồi tố quy định có lợi đều là thao tác đúng.","b":"Điều 2 BLHS; khoản 1 Điều 31 Hiến pháp"},{"id":"1.16","g":1,"lv":"NB","q":"Cấu trúc của Bộ luật Hình sự năm 2015 gồm:","o":["Phần thứ nhất – Những quy định chung; Phần thứ hai – Các tội phạm; Phần thứ ba – Điều khoản thi hành","Phần cá nhân phạm tội và phần pháp nhân phạm tội","Phần tội phạm và phần thủ tục tố tụng","Phần hình phạt và phần biện pháp xử lý hành chính"],"a":0,"e":"BLHS 2015 gồm ba phần: Phần thứ nhất – Những quy định chung (Điều 1–107: nhiệm vụ, nguyên tắc, tội phạm, hình phạt, pháp nhân thương mại, người dưới 18 tuổi…); Phần thứ hai – Các tội phạm (Chương XIII–XXVI); Phần thứ ba – Điều khoản thi hành.","b":"BLHS số 100/2015/QH13"},{"id":"1.17","g":1,"lv":"NB","q":"Điều 3 BLHS quy định nội dung gì?","o":["Hiệu lực của BLHS đối với hành vi phạm tội trên lãnh thổ Việt Nam","Trách nhiệm phòng ngừa, đấu tranh chống tội phạm","Nguyên tắc xử lý đối với người phạm tội và pháp nhân thương mại phạm tội","Khái niệm tội phạm và phân loại tội phạm"],"a":2,"e":"Điều 3 BLHS quy định các nguyên tắc xử lý: khoản 1 đối với người phạm tội (phát hiện kịp thời, bình đẳng, nghiêm trị, khoan hồng…), khoản 2 đối với pháp nhân thương mại phạm tội. Hiệu lực theo lãnh thổ là Điều 5, khái niệm tội phạm là Điều 8, trách nhiệm phòng chống tội phạm là Điều 4.","b":"Điều 3 BLHS"},{"id":"1.18","g":1,"lv":"VD","q":"Hành vi thực hiện ngày 15/6/2025; ngày 01/7/2025 Luật số 86/2025/QH15 có hiệu lực và bỏ hình phạt tử hình đối với tội danh tương ứng. Vụ án xét xử tháng 9/2025. Hướng xử lý đúng là:","o":["Không áp dụng hình phạt tử hình vì quy định có lợi được áp dụng hồi tố theo Điều 7 BLHS và điều khoản chuyển tiếp của Luật 86/2025/QH15","Vẫn có thể tuyên tử hình vì hành vi thực hiện trước ngày luật mới có hiệu lực","Phải tạm đình chỉ vụ án đến khi có văn bản hướng dẫn","Tòa án tự lựa chọn áp dụng luật cũ hoặc luật mới"],"a":0,"e":"Bỏ hình phạt tử hình là quy định có lợi cho người phạm tội; theo khoản 3 Điều 7 BLHS và điều khoản chuyển tiếp của Luật 86/2025/QH15, quy định này được áp dụng đối với hành vi thực hiện trước ngày 01/7/2025 mà sau ngày đó mới bị xét xử. Tòa án không được tùy ý chọn luật bất lợi.","b":"Khoản 3 Điều 7 BLHS; Điều 4 Luật 86/2025/QH15"},{"id":"1.19","g":1,"lv":"TH","q":"Chức năng phòng ngừa của luật hình sự thể hiện ở điểm nào?","o":["Quy định hành vi bị cấm và hậu quả pháp lý để răn đe chung, đồng thời giáo dục người phạm tội không phạm tội mới","Cho phép xử lý hình sự cả hành vi chưa được luật quy định nếu có nguy cơ cao","Chỉ xử lý sau khi tội phạm đã gây hậu quả thực tế","Thay thế hoàn toàn các biện pháp phòng ngừa xã hội"],"a":0,"e":"Điều 1 BLHS giao nhiệm vụ giáo dục mọi người ý thức tuân theo pháp luật, phòng ngừa và đấu tranh chống tội phạm; Điều 31 xác định mục đích hình phạt gồm ngăn ngừa người bị kết án phạm tội mới (phòng ngừa riêng) và giáo dục người khác (phòng ngừa chung). Phòng ngừa không cho phép xử lý hành vi chưa được luật quy định.","b":"Điều 1, Điều 31 BLHS"},{"id":"1.20","g":1,"lv":"VD","q":"Để xác định văn bản luật hình sự áp dụng cho một vụ việc tại thời điểm hiện nay, sinh viên nên làm gì?","o":["Tra cứu văn bản hợp nhất BLHS, các luật sửa đổi (Luật 12/2017/QH14, Luật 59/2024/QH15, Luật 86/2025/QH15) và điều khoản chuyển tiếp theo thời điểm hành vi","Chỉ dùng bản BLHS năm 2015 nguyên gốc","Chỉ dùng giáo trình xuất bản trước năm 2020","Chỉ dựa vào bài viết phổ biến pháp luật trên mạng"],"a":0,"e":"BLHS 2015 đã được sửa đổi nhiều lần: Luật 12/2017/QH14 (hiệu lực 01/01/2018), Luật Tư pháp người chưa thành niên 59/2024/QH15 (hiệu lực 01/01/2026), Luật 86/2025/QH15 (hiệu lực 01/7/2025). Phải dùng bản hợp nhất, đối chiếu điều khoản chuyển tiếp và áp dụng theo thời điểm thực hiện hành vi (Điều 7).","b":"Điều 7 BLHS; Luật 12/2017/QH14; Luật 59/2024/QH15; Luật 86/2025/QH15"},{"id":"1.21","g":1,"lv":"NB","q":"Nguyên tắc xử lý đối với pháp nhân thương mại phạm tội được quy định tại đâu?","o":["Khoản 2 Điều 3 BLHS","Khoản 1 Điều 3 BLHS","Điều 9 BLHS","Điều 8 BLHS"],"a":0,"e":"Điều 3 BLHS tách hai khoản: khoản 1 là nguyên tắc xử lý người phạm tội, khoản 2 là nguyên tắc xử lý pháp nhân thương mại phạm tội (phát hiện kịp thời, xử lý nhanh chóng, công minh; bình đẳng không phân biệt hình thức sở hữu, thành phần kinh tế; nghiêm trị pháp nhân chủ mưu, cầm đầu…; khoan hồng với pháp nhân tích cực hợp tác, tự nguyện khắc phục hậu quả).","b":"Khoản 2 Điều 3 BLHS"},{"id":"1.22","g":1,"lv":"TH","q":"Điều luật quy định một tội phạm mới có hiệu lực sau khi hành vi được thực hiện. Hành vi đó được xử lý thế nào?","o":["Bị truy cứu theo điều luật mới vì hành vi nguy hiểm cho xã hội","Bị truy cứu nếu người bị hại có yêu cầu","Không bị truy cứu theo điều luật mới vì điều luật quy định tội phạm mới không có hiệu lực hồi tố","Bị truy cứu nếu cơ quan điều tra phát hiện sau ngày luật mới có hiệu lực"],"a":2,"e":"Khoản 2 Điều 7 BLHS: điều luật quy định một tội phạm mới, một hình phạt nặng hơn, một tình tiết tăng nặng mới hoặc hạn chế phạm vi áp dụng án treo, miễn TNHS… thì không được áp dụng đối với hành vi phạm tội đã thực hiện trước khi điều luật đó có hiệu lực. Thời điểm phát hiện hay yêu cầu của bị hại không làm thay đổi.","b":"Khoản 2 Điều 7 BLHS"},{"id":"1.23","g":1,"lv":"TH","q":"Hành vi phạm tội xảy ra trên tàu bay mang quốc tịch Việt Nam đang bay trên vùng trời quốc tế. Nhận định nào đúng?","o":["Chỉ áp dụng BLHS Việt Nam khi người phạm tội là công dân Việt Nam","Chỉ áp dụng pháp luật của quốc gia nơi tàu bay hạ cánh","BLHS Việt Nam được áp dụng như đối với hành vi phạm tội trên lãnh thổ Việt Nam","BLHS Việt Nam không thể áp dụng vì hành vi xảy ra ngoài lãnh thổ Việt Nam"],"a":2,"e":"Khoản 1 Điều 5 BLHS: quy định về hiệu lực đối với hành vi phạm tội trên lãnh thổ Việt Nam cũng được áp dụng đối với hành vi phạm tội hoặc hậu quả xảy ra trên tàu bay, tàu biển mang quốc tịch Việt Nam hoặc tại vùng đặc quyền kinh tế, thềm lục địa của Việt Nam. Quốc tịch người phạm tội hay nơi hạ cánh không phải điều kiện. (Với tàu bay, tàu biển không mang quốc tịch Việt Nam ở biển cả, vùng trời quốc tế thì chỉ áp dụng khi điều ước quốc tế quy định – khoản 3 Điều 6.)","b":"Khoản 1 Điều 5 BLHS"},{"id":"1.24","g":1,"lv":"VD","q":"Một nghị định quy định hành vi X bị xử phạt vi phạm hành chính; BLHS không quy định X là tội phạm. Cơ quan điều tra đề nghị khởi tố vì X gây bức xúc dư luận. Đề nghị này:","o":["Không đúng, vì hành vi không được BLHS quy định là tội phạm thì không thể truy cứu TNHS","Đúng nếu hậu quả của hành vi lớn","Đúng, vì hành vi đã bị nghị định cấm","Đúng nếu Viện kiểm sát phê chuẩn"],"a":0,"e":"Theo khoản 1 Điều 2 và khoản 1 Điều 8 BLHS, tội phạm phải là hành vi được quy định trong BLHS. Hành vi chỉ bị nghị định cấm là vi phạm hành chính; mức hậu quả, phê chuẩn của Viện kiểm sát hay dư luận không thể thay thế căn cứ luật định.","b":"Khoản 1 Điều 2, khoản 1 Điều 8 BLHS"},{"id":"1.25","g":1,"lv":"TH","q":"Nguyên tắc 'nghiêm trị' theo điểm c khoản 1 Điều 3 BLHS hướng tới những đối tượng nào?","o":["Mọi người phạm tội không phân biệt vai trò","Người dưới 18 tuổi phạm tội","Người phạm tội lần đầu, ít nghiêm trọng","Người chủ mưu, cầm đầu, chỉ huy, ngoan cố chống đối, côn đồ, tái phạm nguy hiểm, lợi dụng chức vụ, quyền hạn để phạm tội"],"a":3,"e":"Điểm c khoản 1 Điều 3 BLHS: nghiêm trị người chủ mưu, cầm đầu, chỉ huy, ngoan cố chống đối, côn đồ, tái phạm nguy hiểm, lợi dụng chức vụ, quyền hạn để phạm tội. Nguyên tắc này kết hợp với khoan hồng (điểm d) để phân hóa TNHS; người dưới 18 tuổi được áp dụng chính sách xử lý riêng.","b":"Điểm c khoản 1 Điều 3 BLHS"},{"id":"2.01","g":2,"lv":"NB","q":"Theo Bộ luật Hình sự, tội phạm được hiểu là hành vi như thế nào?","o":["Hành vi trái pháp luật do cá nhân thực hiện, gây thiệt hại cho xã hội và bị cơ quan nhà nước áp dụng bất kỳ biện pháp cưỡng chế nào","Hành vi có lỗi do cá nhân thực hiện, trái với quy tắc đạo đức xã hội và có khả năng làm phát sinh trách nhiệm pháp lý","Hành vi nguy hiểm cho xã hội được quy định trong BLHS, do người có năng lực TNHS hoặc pháp nhân thương mại thực hiện một cách cố ý hoặc vô ý, xâm phạm các quan hệ được luật hình sự bảo vệ và phải bị xử lý hình sự","Hành vi vi phạm nghĩa vụ pháp lý gây thiệt hại về tài sản hoặc tinh thần, không phụ thuộc vào việc hành vi đó có được BLHS quy định hay không"],"a":2,"e":"Khoản 1 Điều 8 BLHS nêu đủ các dấu hiệu của tội phạm: tính nguy hiểm cho xã hội, tính được quy định trong BLHS (trái pháp luật hình sự), tính có lỗi (cố ý hoặc vô ý), do chủ thể có năng lực TNHS hoặc pháp nhân thương mại thực hiện và phải chịu hình phạt. Các phương án khác thiếu dấu hiệu 'được quy định trong BLHS' hoặc lẫn với vi phạm pháp luật nói chung, vi phạm đạo đức.","b":"Khoản 1 Điều 8 BLHS"},{"id":"2.02","g":2,"lv":"TH","q":"Căn cứ nào có ý nghĩa quyết định để xác định một hành vi là tội phạm theo nguyên tắc pháp chế hình sự?","o":["Hành vi vi phạm quy tắc quản lý nhà nước và gây thiệt hại thực tế cho một tổ chức hoặc cá nhân","Hành vi có đủ dấu hiệu của tội phạm được BLHS quy định và đáp ứng các điều kiện chịu trách nhiệm hình sự","Hành vi bị người bị thiệt hại yêu cầu cơ quan nhà nước xử lý bằng biện pháp nghiêm khắc","Hành vi gây ra phản ứng tiêu cực trong cộng đồng dân cư nơi xảy ra sự việc"],"a":1,"e":"Theo khoản 1 Điều 2 và khoản 1 Điều 8 BLHS, chỉ hành vi thỏa mãn đầy đủ dấu hiệu cấu thành của một tội được BLHS quy định, do chủ thể đủ điều kiện chịu TNHS thực hiện mới là tội phạm. Dư luận, yêu cầu của bị hại hay việc vi phạm quy tắc quản lý chưa đủ để kết luận có tội phạm.","b":"Khoản 1 Điều 2, khoản 1 Điều 8 BLHS"},{"id":"2.03","g":2,"lv":"NB","q":"Tội phạm ít nghiêm trọng là tội phạm có mức cao nhất của khung hình phạt do BLHS quy định như thế nào?","o":["Phạt tù đến 02 năm","Phạt tù đến 05 năm","Phạt tù đến 07 năm","Phạt tiền, cải tạo không giam giữ hoặc phạt tù đến 03 năm"],"a":3,"e":"Điểm a khoản 1 Điều 9 BLHS: tội phạm ít nghiêm trọng là tội phạm có tính chất và mức độ nguy hiểm cho xã hội không lớn mà mức cao nhất của khung hình phạt là phạt tiền, phạt cải tạo không giam giữ hoặc phạt tù đến 03 năm. Mức trên 03 đến 07 năm là tội nghiêm trọng.","b":"Điểm a khoản 1 Điều 9 BLHS"},{"id":"2.04","g":2,"lv":"TH","q":"Cấu thành tội phạm được sử dụng chủ yếu để xác định vấn đề nào khi giải quyết vụ án hình sự?","o":["Thẩm quyền giải quyết mọi tranh chấp phát sinh từ hành vi của người bị buộc tội","Điều kiện để người bị buộc tội được miễn mọi nghĩa vụ pháp lý","Mức bồi thường thiệt hại dân sự mà người bị hại có thể yêu cầu","Các dấu hiệu pháp lý đặc trưng cần xác định để đối chiếu hành vi thực tế với quy định về tội phạm (định tội)"],"a":3,"e":"Cấu thành tội phạm là tổng hợp các dấu hiệu chung có tính đặc trưng cho một loại tội phạm cụ thể được quy định trong BLHS (khách thể, mặt khách quan, chủ thể, mặt chủ quan). Đây là căn cứ pháp lý để định tội: hành vi thực tế chỉ là tội phạm khi thỏa mãn đầy đủ các dấu hiệu của cấu thành tương ứng.","b":"Điều 8 BLHS; Phần thứ hai BLHS"},{"id":"2.05","g":2,"lv":"TH","q":"Nội dung nào thuộc mặt khách quan của cấu thành tội phạm?","o":["Hành vi, hậu quả, mối quan hệ nhân quả và các dấu hiệu khách quan khác (công cụ, phương tiện, thời gian, địa điểm…)","Quan hệ xã hội được pháp luật hình sự bảo vệ bị xâm hại","Động cơ, mục đích và thái độ tâm lý của người thực hiện hành vi","Tuổi chịu trách nhiệm hình sự và khả năng nhận thức, điều khiển hành vi"],"a":0,"e":"Mặt khách quan là biểu hiện ra bên ngoài của tội phạm: hành vi nguy hiểm, hậu quả, quan hệ nhân quả và các dấu hiệu như công cụ, phương tiện, thủ đoạn, thời gian, địa điểm. Động cơ, mục đích, lỗi thuộc mặt chủ quan; tuổi, năng lực TNHS thuộc chủ thể; quan hệ xã hội bị xâm hại là khách thể.","b":"Điều 8 BLHS; Phần thứ hai BLHS"},{"id":"2.06","g":2,"lv":"NB","q":"Khách thể của tội phạm là gì?","o":["Đồ vật, tài sản được sử dụng để thực hiện hành vi phạm tội","Hậu quả vật chất hoặc tinh thần phát sinh sau khi hành vi được thực hiện","Quan hệ xã hội được luật hình sự bảo vệ bị tội phạm xâm hại hoặc đe dọa xâm hại","Người trực tiếp thực hiện hành vi bị cơ quan tiến hành tố tụng xem xét"],"a":2,"e":"Khách thể là quan hệ xã hội được luật hình sự bảo vệ (khoản 1 Điều 8 liệt kê: chủ quyền, an ninh quốc gia, chế độ, quyền con người, quyền công dân, sở hữu…) bị tội phạm xâm hại. Đồ vật dùng để phạm tội là công cụ, phương tiện; người thực hiện là chủ thể; hậu quả thuộc mặt khách quan.","b":"Khoản 1 Điều 8 BLHS"},{"id":"2.07","g":2,"lv":"NB","q":"Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về loại tội phạm nào?","o":["Chỉ những tội phạm xâm phạm tính mạng, sức khỏe và sở hữu","Mọi tội phạm, trừ những tội phạm mà BLHS có quy định khác","Chỉ tội phạm ít nghiêm trọng do cố ý","Chỉ tội phạm nghiêm trọng và rất nghiêm trọng"],"a":1,"e":"Khoản 1 Điều 12 BLHS: người từ đủ 16 tuổi trở lên phải chịu TNHS về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác (một số tội đòi hỏi chủ thể đủ 18 tuổi). Giới hạn theo loại tội chỉ áp dụng cho người từ đủ 14 đến dưới 16 tuổi (khoản 2).","b":"Khoản 1 Điều 12 BLHS"},{"id":"2.08","g":2,"lv":"TH","q":"Người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm hình sự trong trường hợp nào?","o":["Chỉ tội phạm đặc biệt nghiêm trọng xâm phạm tính mạng con người","Phạm tội rất nghiêm trọng, đặc biệt nghiêm trọng thuộc các điều luật được liệt kê tại khoản 2 Điều 12 BLHS","Mọi tội phạm có hình phạt tù được quy định trong điều luật","Mọi tội phạm do cố ý, không phụ thuộc mức độ nghiêm trọng"],"a":1,"e":"Khoản 2 Điều 12 BLHS (sửa đổi 2017): người từ đủ 14 đến dưới 16 tuổi chịu TNHS về tội phạm rất nghiêm trọng, đặc biệt nghiêm trọng quy định tại một danh mục điều luật cụ thể (như Điều 123, 134, 141, 142, 168, 169, 170, 171, 173, 178, 248–252…). Không phải mọi tội cố ý, cũng không chỉ giới hạn ở tội xâm phạm tính mạng.","b":"Khoản 2 Điều 12 BLHS"},{"id":"2.09","g":2,"lv":"TH","q":"Trường hợp nào thể hiện lỗi cố ý trực tiếp?","o":["Người phạm tội nhận thức rõ hành vi nguy hiểm cho xã hội, thấy trước hậu quả và mong muốn hậu quả xảy ra","Người phạm tội thấy trước hậu quả có thể xảy ra nhưng cho rằng hậu quả sẽ không xảy ra hoặc có thể ngăn ngừa được","Người phạm tội không thấy trước hậu quả mặc dù phải thấy trước và có thể thấy trước","Người phạm tội nhận thức hành vi nguy hiểm, thấy trước hậu quả, tuy không mong muốn nhưng có ý thức để mặc cho hậu quả xảy ra"],"a":0,"e":"Khoản 1 Điều 10 BLHS: cố ý trực tiếp là nhận thức rõ hành vi nguy hiểm, thấy trước hậu quả và mong muốn hậu quả xảy ra. Phương án 'để mặc cho hậu quả xảy ra' là cố ý gián tiếp (khoản 2 Điều 10); hai phương án còn lại là vô ý do cẩu thả và vô ý vì quá tự tin (Điều 11).","b":"Khoản 1 Điều 10 BLHS"},{"id":"2.10","g":2,"lv":"TH","q":"Điểm phân biệt cơ bản giữa lỗi vô ý vì quá tự tin và lỗi vô ý do cẩu thả là gì?","o":["Vô ý vì quá tự tin luôn gắn với hậu quả nghiêm trọng, còn vô ý do cẩu thả chỉ gắn với hậu quả nhỏ","Vô ý vì quá tự tin có thấy trước hậu quả nhưng cho rằng không xảy ra hoặc ngăn ngừa được; vô ý do cẩu thả là không thấy trước hậu quả dù phải thấy trước và có thể thấy trước","Vô ý vì quá tự tin không đòi hỏi thấy trước hậu quả, còn vô ý do cẩu thả đòi hỏi thấy trước hậu quả","Vô ý vì quá tự tin chỉ áp dụng với hành vi gây thiệt hại tài sản, vô ý do cẩu thả áp dụng với mọi hành vi khác"],"a":1,"e":"Điều 11 BLHS: vô ý vì quá tự tin (khoản 1) – người phạm tội thấy trước hành vi có thể gây hậu quả nhưng cho rằng hậu quả không xảy ra hoặc có thể ngăn ngừa được; vô ý do cẩu thả (khoản 2) – không thấy trước khả năng gây hậu quả, mặc dù phải thấy trước và có thể thấy trước. Tiêu chí phân biệt là yếu tố lý trí (thấy trước hay không), không phải mức hậu quả hay loại hành vi.","b":"Điều 11 BLHS"},{"id":"2.11","g":2,"lv":"NB","q":"Trường hợp nào được xem là phạm tội chưa đạt?","o":["Mới chuẩn bị công cụ, phương tiện nhưng chưa bắt đầu thực hiện hành vi được mô tả trong cấu thành","Đã hoàn thành hành vi phạm tội và hậu quả bắt buộc của cấu thành đã xảy ra","Tự mình không thực hiện tội phạm đến cùng, tuy không có gì ngăn cản","Cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì những nguyên nhân ngoài ý muốn của người phạm tội"],"a":3,"e":"Điều 15 BLHS: phạm tội chưa đạt là cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì những nguyên nhân ngoài ý muốn của người phạm tội. Chuẩn bị là giai đoạn trước (Điều 14); tự nguyện dừng lại là tự ý nửa chừng chấm dứt (Điều 16); đã thỏa mãn đủ dấu hiệu là tội phạm hoàn thành.","b":"Điều 15 BLHS"},{"id":"2.12","g":2,"lv":"TH","q":"Điều kiện cốt lõi để xác định tự ý nửa chừng chấm dứt việc phạm tội là gì?","o":["Người phạm tội tự mình không thực hiện tội phạm đến cùng, tuy không có gì ngăn cản","Người thực hiện không thể tiếp tục vì công cụ, phương tiện bị hỏng","Người thực hiện bị phát hiện trước khi hậu quả của tội phạm xảy ra","Người thực hiện dừng lại sau khi đã hoàn thành tội phạm và khắc phục toàn bộ hậu quả"],"a":0,"e":"Điều 16 BLHS: tự ý nửa chừng chấm dứt việc phạm tội là tự mình không thực hiện tội phạm đến cùng, tuy không có gì ngăn cản; người đó được miễn TNHS về tội định phạm (nếu hành vi đã thực hiện cấu thành tội khác thì chịu TNHS về tội đó). Bị phát hiện, công cụ hỏng là nguyên nhân khách quan (chưa đạt); tội phạm đã hoàn thành thì không còn tự ý nửa chừng.","b":"Điều 16 BLHS"},{"id":"2.13","g":2,"lv":"NB","q":"Theo BLHS, chuẩn bị phạm tội được hiểu như thế nào?","o":["Hoàn thành hành vi phạm tội rồi tự nguyện khắc phục toàn bộ thiệt hại","Bắt đầu thực hiện hành vi thuộc mặt khách quan của cấu thành nhưng chưa gây ra hậu quả","Tìm kiếm, sửa soạn công cụ, phương tiện hoặc tạo ra những điều kiện khác để thực hiện tội phạm, hoặc thành lập, tham gia nhóm tội phạm (trừ trường hợp luật quy định riêng)","Có ý định phạm tội nhưng chưa thực hiện bất kỳ hành vi nào"],"a":2,"e":"Khoản 1 Điều 14 BLHS: chuẩn bị phạm tội là tìm kiếm, sửa soạn công cụ, phương tiện hoặc tạo ra những điều kiện khác để thực hiện tội phạm hoặc thành lập, tham gia nhóm tội phạm (trừ trường hợp tại Điều 109, điểm a khoản 2 Điều 113, điểm a khoản 2 Điều 299). Bắt đầu thực hiện hành vi khách quan đã sang giai đoạn chưa đạt; ý định đơn thuần chưa phải là hành vi nên không bị xử lý.","b":"Khoản 1 Điều 14 BLHS"},{"id":"2.14","g":2,"lv":"NB","q":"Đồng phạm là trường hợp nào sau đây?","o":["Nhiều người cùng có mặt tại nơi xảy ra tội phạm nhưng không có sự cố ý cùng thực hiện","Có hai người trở lên cố ý cùng thực hiện một tội phạm","Một người thực hiện tội phạm, người khác chỉ biết sự việc sau khi tội phạm đã hoàn thành","Nhiều người thực hiện các hành vi vi phạm khác nhau, không có liên hệ ý chí"],"a":1,"e":"Khoản 1 Điều 17 BLHS: đồng phạm là trường hợp có hai người trở lên cố ý cùng thực hiện một tội phạm. Dấu hiệu bắt buộc là cùng cố ý và cùng thực hiện một tội phạm; sự có mặt ngẫu nhiên hay biết sau khi tội phạm hoàn thành (không hứa hẹn trước) không phải đồng phạm mà có thể là che giấu, không tố giác (Điều 18, 19).","b":"Khoản 1 Điều 17 BLHS"},{"id":"2.15","g":2,"lv":"TH","q":"Người giúp sức trong vụ án đồng phạm là ai?","o":["Người tạo những điều kiện tinh thần hoặc vật chất cho việc thực hiện tội phạm","Người trực tiếp thực hiện tội phạm","Người kích động, dụ dỗ, thúc đẩy người khác thực hiện tội phạm","Người chủ mưu, cầm đầu, chỉ huy việc thực hiện tội phạm"],"a":0,"e":"Khoản 3 Điều 17 BLHS phân loại người đồng phạm: người thực hành (trực tiếp thực hiện), người tổ chức (chủ mưu, cầm đầu, chỉ huy), người xúi giục (kích động, dụ dỗ, thúc đẩy), người giúp sức (tạo điều kiện tinh thần hoặc vật chất).","b":"Khoản 3 Điều 17 BLHS"},{"id":"2.16","g":2,"lv":"TH","q":"Nguyên tắc nào được áp dụng khi quyết định hình phạt đối với từng người đồng phạm?","o":["Xét tính chất của đồng phạm, tính chất và mức độ tham gia phạm tội của từng người, cùng các tình tiết tăng nặng, giảm nhẹ của người nào thì áp dụng đối với người đó","Tất cả người đồng phạm phải chịu cùng một loại và mức hình phạt","Người tổ chức luôn phải chịu mức hình phạt cao nhất của khung","Người giúp sức luôn phải chịu mức hình phạt thấp nhất của khung"],"a":0,"e":"Điều 58 BLHS: khi quyết định hình phạt đối với những người đồng phạm, Tòa án phải xét đến tính chất của đồng phạm, tính chất và mức độ tham gia phạm tội của từng người; các tình tiết tăng nặng, giảm nhẹ hoặc loại trừ TNHS thuộc người nào thì chỉ áp dụng đối với người đó. Đây là nguyên tắc cá thể hóa, không cào bằng hay áp đặt cứng mức hình phạt.","b":"Điều 58 BLHS"},{"id":"2.17","g":2,"lv":"TH","q":"Pháp nhân thương mại phải chịu trách nhiệm hình sự khi nào?","o":["Khi phạm tội thuộc danh mục tại Điều 76 và có đủ các điều kiện tại Điều 75 BLHS","Khi có thiệt hại tài sản xảy ra trong hoạt động của doanh nghiệp, không phụ thuộc lỗi","Khi bất kỳ người lao động nào thực hiện hành vi trái pháp luật","Khi người đại diện theo pháp luật thực hiện bất kỳ hành vi vi phạm nào trong hoạt động kinh doanh"],"a":0,"e":"Khoản 2 Điều 2 BLHS: chỉ pháp nhân thương mại nào phạm một tội đã được quy định tại Điều 76 mới phải chịu TNHS. Điều 75 đòi hỏi đủ bốn điều kiện: hành vi nhân danh pháp nhân; vì lợi ích của pháp nhân; có sự chỉ đạo, điều hành hoặc chấp thuận của pháp nhân; chưa hết thời hiệu truy cứu.","b":"Khoản 2 Điều 2, Điều 75, Điều 76 BLHS"},{"id":"2.18","g":2,"lv":"NB","q":"Trách nhiệm hình sự của pháp nhân thương mại không loại trừ trách nhiệm hình sự của ai?","o":["Người bị hại","Cá nhân","Người làm chứng","Cơ quan tiến hành tố tụng"],"a":1,"e":"Khoản 2 Điều 75 BLHS: việc pháp nhân thương mại chịu TNHS không loại trừ TNHS của cá nhân. Người có hành vi phạm tội (lãnh đạo, nhân viên) vẫn có thể bị truy cứu song song với pháp nhân.","b":"Khoản 2 Điều 75 BLHS"},{"id":"2.19","g":2,"lv":"NB","q":"Thời hiệu truy cứu trách nhiệm hình sự đối với tội phạm nghiêm trọng là bao lâu?","o":["15 năm","05 năm","10 năm","20 năm"],"a":2,"e":"Khoản 2 Điều 27 BLHS: thời hiệu là 05 năm (ít nghiêm trọng), 10 năm (nghiêm trọng), 15 năm (rất nghiêm trọng), 20 năm (đặc biệt nghiêm trọng), tính từ ngày tội phạm được thực hiện.","b":"Điểm b khoản 2 Điều 27 BLHS"},{"id":"2.20","g":2,"lv":"VD","q":"Trường hợp nào là căn cứ BẮT BUỘC miễn trách nhiệm hình sự?","o":["Người phạm tội lập công lớn nhưng tội phạm đã gây hậu quả đặc biệt nghiêm trọng","Người phạm tội không đồng ý với kết luận điều tra","Khi tiến hành điều tra, truy tố, xét xử, do có sự thay đổi chính sách, pháp luật làm cho hành vi phạm tội không còn nguy hiểm cho xã hội nữa","Người phạm tội đã chuyển nơi cư trú sang địa phương khác"],"a":2,"e":"Khoản 1 Điều 29 BLHS: người phạm tội được miễn TNHS (bắt buộc) khi do thay đổi chính sách, pháp luật làm cho hành vi phạm tội không còn nguy hiểm cho xã hội, hoặc khi có quyết định đại xá. Các trường hợp lập công, tự thú, mắc bệnh hiểm nghèo… thuộc khoản 2 (có thể miễn), do cơ quan có thẩm quyền cân nhắc.","b":"Khoản 1 Điều 29 BLHS"},{"id":"2.21","g":2,"lv":"NB","q":"Tội phạm có mức cao nhất của khung hình phạt là từ trên 07 năm đến 15 năm tù thuộc loại nào?","o":["Tội phạm đặc biệt nghiêm trọng","Tội phạm ít nghiêm trọng","Tội phạm nghiêm trọng","Tội phạm rất nghiêm trọng"],"a":3,"e":"Khoản 1 Điều 9 BLHS: ít nghiêm trọng – đến 03 năm tù; nghiêm trọng – trên 03 đến 07 năm; rất nghiêm trọng – trên 07 đến 15 năm; đặc biệt nghiêm trọng – trên 15 đến 20 năm, tù chung thân hoặc tử hình. Việc phân loại căn cứ vào mức cao nhất của khung hình phạt được áp dụng, không phải mức án Tòa tuyên.","b":"Khoản 1 Điều 9 BLHS"},{"id":"2.22","g":2,"lv":"TH","q":"Hành vi tuy có dấu hiệu của tội phạm nhưng tính chất nguy hiểm cho xã hội không đáng kể thì:","o":["Không phải là tội phạm và được xử lý bằng các biện pháp khác","Bị truy cứu TNHS nếu người bị hại yêu cầu","Vẫn là tội phạm nhưng được miễn hình phạt","Vẫn là tội phạm ít nghiêm trọng"],"a":0,"e":"Khoản 2 Điều 8 BLHS: những hành vi tuy có dấu hiệu của tội phạm nhưng tính chất nguy hiểm cho xã hội không đáng kể thì không phải là tội phạm và được xử lý bằng các biện pháp khác (hành chính, kỷ luật, dân sự). Đây không phải trường hợp miễn hình phạt hay miễn TNHS.","b":"Khoản 2 Điều 8 BLHS"},{"id":"2.23","g":2,"lv":"TH","q":"Người phạm tội trong tình trạng say do dùng rượu, bia một cách tự nguyện thì:","o":["Chỉ chịu TNHS nếu phạm tội đặc biệt nghiêm trọng","Vẫn phải chịu trách nhiệm hình sự","Được coi là tình trạng không có năng lực TNHS","Không phải chịu TNHS vì mất khả năng điều khiển hành vi"],"a":1,"e":"Điều 13 BLHS: người phạm tội trong tình trạng mất khả năng nhận thức hoặc khả năng điều khiển hành vi do dùng rượu, bia hoặc chất kích thích mạnh khác thì vẫn phải chịu TNHS. Khác với Điều 21 (tình trạng không có năng lực TNHS do bệnh), vì ở đây người phạm tội tự đặt mình vào tình trạng say.","b":"Điều 13 BLHS"},{"id":"2.24","g":2,"lv":"TH","q":"Người nào sau đây KHÔNG phải chịu trách nhiệm hình sự về tội che giấu tội phạm (trừ trường hợp che giấu tội xâm phạm an ninh quốc gia hoặc tội đặc biệt nghiêm trọng khác theo Điều 389)?","o":["Người thuê nhà cùng người phạm tội","Vợ của người phạm tội","Bạn thân của người phạm tội","Đồng nghiệp của người phạm tội"],"a":1,"e":"Khoản 2 Điều 18 BLHS: người che giấu tội phạm là ông, bà, cha, mẹ, con, cháu, anh chị em ruột, vợ hoặc chồng của người phạm tội không phải chịu TNHS, trừ trường hợp che giấu các tội xâm phạm an ninh quốc gia hoặc tội đặc biệt nghiêm trọng khác quy định tại Điều 389. Bạn bè, đồng nghiệp, người ở cùng không thuộc diện này.","b":"Khoản 2 Điều 18 BLHS"},{"id":"2.25","g":2,"lv":"TH","q":"Người thực hiện hành vi gây hậu quả nguy hại trong trường hợp không thể thấy trước hoặc không buộc phải thấy trước hậu quả thì:","o":["Chịu TNHS với lỗi vô ý do cẩu thả","Không phải chịu TNHS vì đó là sự kiện bất ngờ","Chịu TNHS nhưng được miễn hình phạt","Chịu TNHS với lỗi vô ý vì quá tự tin"],"a":1,"e":"Điều 20 BLHS: người thực hiện hành vi gây hậu quả nguy hại cho xã hội trong trường hợp không thể thấy trước hoặc không buộc phải thấy trước hậu quả thì không phải chịu TNHS (sự kiện bất ngờ – không có lỗi). Khác với vô ý do cẩu thả, nơi người đó phải thấy trước và có thể thấy trước hậu quả.","b":"Điều 20 BLHS"},{"id":"2.26","g":2,"lv":"TH","q":"Hành vi chống trả lại một cách cần thiết người đang có hành vi xâm phạm quyền, lợi ích chính đáng của mình hoặc của người khác được gọi là:","o":["Sự kiện bất ngờ","Tình thế cấp thiết","Phòng vệ chính đáng","Gây thiệt hại trong khi bắt giữ người phạm tội"],"a":2,"e":"Khoản 1 Điều 22 BLHS: phòng vệ chính đáng là hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên; không phải là tội phạm. Tình thế cấp thiết (Điều 23) là gây thiệt hại để tránh nguy cơ thực tế, không phải chống trả người tấn công.","b":"Khoản 1 Điều 22 BLHS"},{"id":"2.27","g":2,"lv":"VD","q":"A dùng dao chém B khi B chỉ dùng tay không đẩy A ngã, B đã bỏ chạy. Hành vi của A:","o":["Là phòng vệ chính đáng vì B tấn công trước","Là sự kiện bất ngờ nên A không có lỗi","Là tình thế cấp thiết nên A không phải chịu TNHS","Không được coi là phòng vệ chính đáng vì hành vi xâm phạm đã chấm dứt và việc chống trả rõ ràng không cần thiết"],"a":3,"e":"Phòng vệ chính đáng (Điều 22) đòi hỏi hành vi xâm phạm đang diễn ra và sự chống trả là cần thiết. Khi B đã bỏ chạy, hành vi xâm phạm đã chấm dứt; việc A dùng dao chém là tấn công, có thể cấu thành tội phạm thông thường (không phải vượt quá giới hạn phòng vệ vì không còn tình trạng phòng vệ).","b":"Điều 22 BLHS"},{"id":"2.28","g":2,"lv":"TH","q":"Trong tình thế cấp thiết, điều kiện để hành vi gây thiệt hại không phải là tội phạm là:","o":["Thiệt hại gây ra có thể lớn hơn thiệt hại cần ngăn ngừa","Chỉ áp dụng khi bảo vệ tài sản của Nhà nước","Thiệt hại gây ra phải nhỏ hơn thiệt hại cần ngăn ngừa và không còn cách nào khác","Chỉ cần người gây thiệt hại có động cơ tốt"],"a":2,"e":"Khoản 1 Điều 23 BLHS: tình thế cấp thiết là tình thế của người vì muốn tránh gây thiệt hại cho quyền, lợi ích hợp pháp của mình, của người khác hoặc lợi ích của Nhà nước mà không còn cách nào khác là phải gây một thiệt hại nhỏ hơn thiệt hại cần ngăn ngừa. Nếu thiệt hại gây ra rõ ràng vượt quá yêu cầu thì phải chịu TNHS (khoản 2).","b":"Khoản 1 Điều 23 BLHS"},{"id":"2.29","g":2,"lv":"TH","q":"Người phạm tội đã bỏ trốn và có quyết định truy nã thì thời hiệu truy cứu trách nhiệm hình sự được tính thế nào?","o":["Thời gian trốn tránh không được tính; thời hiệu tính lại kể từ khi người đó ra đầu thú hoặc bị bắt giữ","Không áp dụng thời hiệu đối với người bỏ trốn","Thời hiệu vẫn tiếp tục tính bình thường","Thời hiệu được nhân đôi"],"a":0,"e":"Khoản 3 Điều 27 BLHS: nếu trong thời hạn thời hiệu, người phạm tội cố tình trốn tránh và đã có quyết định truy nã thì thời hiệu tính lại kể từ khi người đó ra đầu thú hoặc bị bắt giữ. Nếu phạm tội mới mà BLHS quy định mức cao nhất của khung trên 01 năm tù thì thời hiệu đối với tội cũ tính lại từ ngày phạm tội mới.","b":"Khoản 3 Điều 27 BLHS"},{"id":"2.30","g":2,"lv":"TH","q":"Không áp dụng thời hiệu truy cứu trách nhiệm hình sự đối với tội nào sau đây?","o":["Tội trộm cắp tài sản","Tội tham ô tài sản thuộc khoản 3, khoản 4 Điều 353 BLHS","Tội cố ý gây thương tích","Tội lừa đảo chiếm đoạt tài sản"],"a":1,"e":"Điều 28 BLHS: không áp dụng thời hiệu truy cứu TNHS đối với các tội xâm phạm an ninh quốc gia (Chương XIII), tội phá hoại hòa bình, chống loài người và tội phạm chiến tranh (Chương XXVI), tội tham ô tài sản (khoản 3, 4 Điều 353) và tội nhận hối lộ (khoản 3, 4 Điều 354). Các tội còn lại áp dụng thời hiệu theo Điều 27.","b":"Điều 28 BLHS"},{"id":"2.31","g":2,"lv":"VD","q":"A vô ý gây thương tích cho B (tội ít nghiêm trọng). A tự nguyện bồi thường, B tự nguyện hòa giải và đề nghị miễn TNHS cho A. Cơ quan có thẩm quyền có thể:","o":["Đình chỉ vụ án vì người bị hại rút đơn trong mọi trường hợp","Bắt buộc phải truy cứu TNHS vì đã có hậu quả","Chỉ miễn hình phạt cho A sau khi kết án","Miễn trách nhiệm hình sự cho A theo khoản 3 Điều 29 BLHS"],"a":3,"e":"Khoản 3 Điều 29 BLHS: người thực hiện tội phạm ít nghiêm trọng hoặc tội nghiêm trọng do vô ý gây thiệt hại về tính mạng, sức khỏe, danh dự, nhân phẩm hoặc tài sản của người khác, đã tự nguyện sửa chữa, bồi thường, khắc phục hậu quả và được người bị hại hoặc người đại diện tự nguyện hòa giải và đề nghị miễn TNHS thì có thể được miễn TNHS.","b":"Khoản 3 Điều 29 BLHS"},{"id":"2.32","g":2,"lv":"TH","q":"Điều kiện nào KHÔNG thuộc các điều kiện để pháp nhân thương mại chịu trách nhiệm hình sự theo Điều 75 BLHS?","o":["Pháp nhân có từ 300 lao động trở lên","Hành vi phạm tội được thực hiện nhân danh pháp nhân thương mại","Hành vi phạm tội được thực hiện vì lợi ích của pháp nhân thương mại","Hành vi phạm tội có sự chỉ đạo, điều hành hoặc chấp thuận của pháp nhân thương mại"],"a":0,"e":"Khoản 1 Điều 75 BLHS: pháp nhân thương mại chỉ chịu TNHS khi có đủ: (a) hành vi nhân danh pháp nhân; (b) vì lợi ích của pháp nhân; (c) có sự chỉ đạo, điều hành hoặc chấp thuận của pháp nhân; (d) chưa hết thời hiệu truy cứu. Quy mô lao động không phải điều kiện.","b":"Khoản 1 Điều 75 BLHS"},{"id":"3.01","g":3,"lv":"NB","q":"Theo Điều 30 BLHS, hình phạt là gì?","o":["Khoản bồi thường người phạm tội phải trả cho người bị hại","Biện pháp cưỡng chế nghiêm khắc nhất của Nhà nước, được quy định trong BLHS, do Tòa án quyết định áp dụng đối với người hoặc pháp nhân thương mại phạm tội","Biện pháp do Viện kiểm sát quyết định để giáo dục người phạm tội","Biện pháp cưỡng chế hành chính do cơ quan có thẩm quyền áp dụng đối với người vi phạm"],"a":1,"e":"Điều 30 BLHS: hình phạt là biện pháp cưỡng chế nghiêm khắc nhất của Nhà nước được quy định trong Bộ luật này, do Tòa án quyết định áp dụng đối với người hoặc pháp nhân thương mại phạm tội nhằm tước bỏ hoặc hạn chế quyền, lợi ích của họ. Chỉ Tòa án có quyền quyết định hình phạt; bồi thường là trách nhiệm dân sự.","b":"Điều 30 BLHS"},{"id":"3.02","g":3,"lv":"NB","q":"Mục đích của hình phạt theo Điều 31 BLHS là:","o":["Chỉ nhằm bù đắp thiệt hại cho người bị hại","Trừng trị, giáo dục người phạm tội ý thức tuân theo pháp luật, ngăn ngừa họ phạm tội mới; giáo dục người khác tôn trọng pháp luật, phòng ngừa và đấu tranh chống tội phạm","Chỉ nhằm trả thù người phạm tội","Chỉ nhằm cách ly người phạm tội khỏi xã hội"],"a":1,"e":"Điều 31 BLHS: hình phạt không chỉ nhằm trừng trị mà còn giáo dục người phạm tội, ngăn ngừa họ phạm tội mới (phòng ngừa riêng) và giáo dục người khác, phòng ngừa tội phạm (phòng ngừa chung). Bù đắp thiệt hại là chức năng của trách nhiệm dân sự và biện pháp tư pháp.","b":"Điều 31 BLHS"},{"id":"3.03","g":3,"lv":"NB","q":"Hình phạt nào sau đây KHÔNG phải là hình phạt chính đối với người phạm tội?","o":["Quản chế","Cảnh cáo","Cải tạo không giam giữ","Trục xuất"],"a":0,"e":"Khoản 1 Điều 32 BLHS: hình phạt chính gồm cảnh cáo, phạt tiền, cải tạo không giam giữ, trục xuất, tù có thời hạn, tù chung thân, tử hình. Quản chế là hình phạt bổ sung (khoản 2), cùng với cấm đảm nhiệm chức vụ, cấm hành nghề, cấm cư trú, tước một số quyền công dân, tịch thu tài sản… Phạt tiền và trục xuất có thể là chính hoặc bổ sung.","b":"Khoản 1, khoản 2 Điều 32 BLHS"},{"id":"3.04","g":3,"lv":"TH","q":"Đối với mỗi tội phạm, người phạm tội bị áp dụng hình phạt như thế nào?","o":["Có thể bị áp dụng nhiều hình phạt chính nếu phạm tội nhiều lần","Chỉ bị áp dụng một hình phạt chính và có thể bị áp dụng một hoặc một số hình phạt bổ sung","Chỉ bị áp dụng hình phạt bổ sung nếu đã được miễn hình phạt chính","Bị áp dụng ít nhất hai hình phạt chính"],"a":1,"e":"Khoản 3 Điều 32 BLHS: đối với mỗi tội phạm, người phạm tội chỉ bị áp dụng một hình phạt chính và có thể bị áp dụng một hoặc một số hình phạt bổ sung. Khi phạm nhiều tội thì Tòa án quyết định hình phạt từng tội rồi tổng hợp theo Điều 55.","b":"Khoản 3 Điều 32 BLHS"},{"id":"3.05","g":3,"lv":"TH","q":"Hình phạt cảnh cáo được áp dụng trong trường hợp nào?","o":["Người phạm tội ít nghiêm trọng, có nhiều tình tiết giảm nhẹ nhưng chưa đến mức miễn hình phạt","Người phạm tội nghiêm trọng lần đầu","Chỉ áp dụng đối với pháp nhân thương mại","Người phạm mọi loại tội nếu có nhân thân tốt"],"a":0,"e":"Điều 34 BLHS: cảnh cáo được áp dụng đối với người phạm tội ít nghiêm trọng và có nhiều tình tiết giảm nhẹ, nhưng chưa đến mức miễn hình phạt. Cảnh cáo không áp dụng cho pháp nhân thương mại (Điều 33 không có cảnh cáo).","b":"Điều 34 BLHS"},{"id":"3.06","g":3,"lv":"TH","q":"Phạt tiền được áp dụng như thế nào trong hệ thống hình phạt?","o":["Chỉ áp dụng cho người dưới 18 tuổi","Chỉ là hình phạt bổ sung","Là biện pháp tư pháp, không phải hình phạt","Có thể là hình phạt chính hoặc hình phạt bổ sung; mức phạt không thấp hơn 1.000.000 đồng"],"a":3,"e":"Điều 35 BLHS: phạt tiền là hình phạt chính đối với tội ít nghiêm trọng, tội nghiêm trọng trong một số lĩnh vực (kinh tế, môi trường, trật tự, an toàn công cộng…) và là hình phạt bổ sung trong các trường hợp luật quy định; mức phạt không thấp hơn 1.000.000 đồng, được xác định theo tính chất, mức độ tội phạm và tình hình tài sản của người phạm tội.","b":"Điều 35 BLHS"},{"id":"3.07","g":3,"lv":"TH","q":"Thời hạn của hình phạt cải tạo không giam giữ là:","o":["Từ 06 tháng đến 03 năm","Từ 01 năm đến 05 năm","Từ 03 tháng đến 20 năm","Từ 03 tháng đến 02 năm"],"a":0,"e":"Khoản 1 Điều 36 BLHS: cải tạo không giam giữ được áp dụng từ 06 tháng đến 03 năm đối với người phạm tội ít nghiêm trọng, nghiêm trọng mà đang có nơi làm việc ổn định hoặc có nơi cư trú rõ ràng nếu xét thấy không cần cách ly họ khỏi xã hội; người bị kết án bị khấu trừ từ 05% đến 20% thu nhập (khoản 3).","b":"Khoản 1 Điều 36 BLHS"},{"id":"3.08","g":3,"lv":"NB","q":"Hình phạt trục xuất được áp dụng đối với ai?","o":["Người nước ngoài bị kết án","Người không có nơi cư trú rõ ràng","Công dân Việt Nam phạm tội ở nước ngoài","Pháp nhân thương mại nước ngoài"],"a":0,"e":"Điều 37 BLHS: trục xuất là buộc người nước ngoài bị kết án phải rời khỏi lãnh thổ Việt Nam; được Tòa án áp dụng là hình phạt chính hoặc hình phạt bổ sung trong từng trường hợp cụ thể. Không áp dụng cho công dân Việt Nam.","b":"Điều 37 BLHS"},{"id":"3.09","g":3,"lv":"TH","q":"Căn cứ quyết định hình phạt theo Điều 50 BLHS gồm:","o":["Chỉ đề nghị của Viện kiểm sát","Chỉ yêu cầu của người bị hại","Chỉ giá trị thiệt hại về tài sản","Quy định của BLHS, tính chất và mức độ nguy hiểm của hành vi, nhân thân người phạm tội, các tình tiết giảm nhẹ và tăng nặng"],"a":3,"e":"Khoản 1 Điều 50 BLHS: khi quyết định hình phạt, Tòa án căn cứ vào quy định của Bộ luật này, cân nhắc tính chất và mức độ nguy hiểm cho xã hội của hành vi phạm tội, nhân thân người phạm tội, các tình tiết giảm nhẹ và tăng nặng TNHS. Ý kiến bị hại, đề nghị của Viện kiểm sát chỉ được tham khảo.","b":"Khoản 1 Điều 50 BLHS"},{"id":"3.10","g":3,"lv":"VD","q":"Một tình tiết đã được điều luật sử dụng làm dấu hiệu định tội hoặc định khung thì khi quyết định hình phạt:","o":["Phải được tính thêm một lần là tình tiết tăng nặng","Chỉ tính lại nếu Viện kiểm sát đề nghị","Không được coi là tình tiết tăng nặng (hoặc giảm nhẹ) nữa","Tòa án tùy ý quyết định có tính lại hay không"],"a":2,"e":"Khoản 3 Điều 51 và khoản 2 Điều 52 BLHS: các tình tiết giảm nhẹ, tăng nặng đã được Bộ luật này quy định là dấu hiệu định tội hoặc định khung hình phạt thì không được coi là tình tiết giảm nhẹ, tăng nặng trong khi quyết định hình phạt, tránh việc sử dụng một tình tiết hai lần bất lợi (hoặc có lợi) cho người phạm tội.","b":"Khoản 3 Điều 51, khoản 2 Điều 52 BLHS"},{"id":"3.11","g":3,"lv":"TH","q":"Khi xét xử cùng một lần một người phạm nhiều tội, hình phạt chung là tù có thời hạn thì không được vượt quá:","o":["36 năm","25 năm","30 năm","20 năm"],"a":2,"e":"Điểm a khoản 1 Điều 55 BLHS: nếu các hình phạt đã tuyên cùng là cải tạo không giam giữ hoặc cùng là tù có thời hạn thì cộng lại thành hình phạt chung; hình phạt chung không vượt quá 03 năm cải tạo không giam giữ, 30 năm tù có thời hạn. Mức 20 năm là giới hạn tù có thời hạn cho một tội (Điều 38).","b":"Điểm a khoản 1 Điều 55 BLHS"},{"id":"3.12","g":3,"lv":"TH","q":"Một người đang chấp hành bản án mà lại bị xét xử về tội đã phạm trước khi có bản án này thì Tòa án:","o":["Quyết định hình phạt đối với tội đang bị xét xử, rồi tổng hợp với hình phạt của bản án trước theo Điều 56 BLHS","Hủy bản án trước để xét xử lại toàn bộ","Cộng không giới hạn hình phạt của hai bản án","Chỉ thi hành bản án trước, không xét xử tội mới phát hiện"],"a":0,"e":"Khoản 1 Điều 56 BLHS: trong trường hợp một người đang phải chấp hành một bản án mà lại bị xét xử về tội đã phạm trước khi có bản án này, Tòa án quyết định hình phạt đối với tội đang bị xét xử, sau đó quyết định hình phạt chung theo Điều 55; thời gian đã chấp hành hình phạt của bản án trước được trừ vào thời hạn chấp hành hình phạt chung.","b":"Khoản 1 Điều 56 BLHS"},{"id":"3.13","g":3,"lv":"VD","q":"Điểm khác nhau cơ bản giữa miễn hình phạt và miễn trách nhiệm hình sự là:","o":["Người được miễn hình phạt vẫn bị kết tội (có bản án) nhưng không phải chịu hình phạt; người được miễn TNHS không bị kết tội","Hai chế định có hậu quả pháp lý giống nhau","Miễn hình phạt do Viện kiểm sát quyết định, miễn TNHS chỉ do Tòa án quyết định","Miễn TNHS luôn kèm theo án tích"],"a":0,"e":"Miễn TNHS (Điều 29) loại bỏ hậu quả pháp lý của việc thực hiện tội phạm: người đó không bị kết tội, có thể được áp dụng ở giai đoạn điều tra, truy tố, xét xử. Miễn hình phạt (Điều 59) chỉ do Tòa án quyết định trong bản án kết tội: người đó vẫn bị coi là có tội nhưng không phải chấp hành hình phạt và không bị coi là có án tích (khoản 2 Điều 69).","b":"Điều 29, Điều 59 BLHS"},{"id":"3.14","g":3,"lv":"TH","q":"Biện pháp tư pháp khác hình phạt ở điểm nào?","o":["Biện pháp tư pháp là biện pháp hình sự hỗ trợ hoặc thay thế hình phạt, có thể do cơ quan tiến hành tố tụng áp dụng, không để lại án tích","Biện pháp tư pháp nghiêm khắc hơn hình phạt","Biện pháp tư pháp chỉ do cơ quan hành chính áp dụng","Biện pháp tư pháp chỉ áp dụng cho pháp nhân thương mại"],"a":0,"e":"Điều 46 BLHS liệt kê biện pháp tư pháp đối với người phạm tội (tịch thu vật, tiền trực tiếp liên quan; trả lại tài sản, sửa chữa, bồi thường, buộc công khai xin lỗi; bắt buộc chữa bệnh) và đối với pháp nhân. Khác hình phạt, biện pháp tư pháp không phải biện pháp nghiêm khắc nhất, có thể được Cơ quan điều tra, Viện kiểm sát, Tòa án áp dụng (ví dụ bắt buộc chữa bệnh) và không làm phát sinh án tích.","b":"Điều 46 BLHS"},{"id":"3.15","g":3,"lv":"VD","q":"Người thực hiện hành vi nguy hiểm cho xã hội trong khi mắc bệnh tâm thần làm mất khả năng nhận thức thì có thể bị áp dụng biện pháp nào?","o":["Cải tạo không giam giữ tại nơi cư trú","Cảnh cáo trước phiên tòa","Phạt tù có thời hạn nhưng cho hưởng án treo","Bắt buộc chữa bệnh theo quyết định của cơ quan có thẩm quyền căn cứ kết luận giám định pháp y tâm thần"],"a":3,"e":"Theo Điều 21 BLHS, người trong tình trạng không có năng lực TNHS không phải chịu TNHS; khoản 1 Điều 49 cho phép Viện kiểm sát hoặc Tòa án, căn cứ kết luận giám định pháp y tâm thần, quyết định đưa họ vào cơ sở khám bệnh, chữa bệnh để bắt buộc chữa bệnh. Không áp dụng hình phạt cho người không có năng lực TNHS.","b":"Điều 21, khoản 1 Điều 49 BLHS"},{"id":"3.16","g":3,"lv":"TH","q":"Biện pháp 'trả lại tài sản, sửa chữa hoặc bồi thường thiệt hại; buộc công khai xin lỗi' nhằm mục đích chủ yếu nào?","o":["Tăng nặng hình phạt tù cho người phạm tội","Công khai danh tính người phạm tội để răn đe","Khắc phục hậu quả, khôi phục quyền và lợi ích hợp pháp bị tội phạm xâm hại","Thay thế hoàn toàn hình phạt chính"],"a":2,"e":"Điều 48 BLHS: người phạm tội phải trả lại tài sản đã chiếm đoạt cho chủ sở hữu, sửa chữa hoặc bồi thường thiệt hại vật chất đã được xác định do hành vi phạm tội gây ra; Tòa án buộc công khai xin lỗi người bị hại. Biện pháp này mang tính khôi phục, không thay thế hình phạt.","b":"Điều 48 BLHS"},{"id":"3.17","g":3,"lv":"VD","q":"Tịch thu tài sản (hình phạt bổ sung) khác tịch thu vật, tiền trực tiếp liên quan đến tội phạm (biện pháp tư pháp) ở điểm nào?","o":["Tịch thu tài sản áp dụng với mọi tội phạm, tịch thu vật chỉ áp dụng với tội ít nghiêm trọng","Hai biện pháp có cùng đối tượng và căn cứ","Tịch thu tài sản là tước một phần hoặc toàn bộ tài sản thuộc sở hữu của người bị kết án; tịch thu vật, tiền liên quan chỉ áp dụng với công cụ, phương tiện, vật do phạm tội mà có","Tịch thu vật, tiền là hình phạt chính"],"a":2,"e":"Điều 45 BLHS: tịch thu tài sản là tước một phần hoặc toàn bộ tài sản thuộc sở hữu của người bị kết án sung vào ngân sách, chỉ áp dụng với tội rất nghiêm trọng, đặc biệt nghiêm trọng và một số tội do luật quy định. Điều 47: tịch thu vật, tiền trực tiếp liên quan đến tội phạm (công cụ, phương tiện phạm tội; vật, tiền do phạm tội mà có; vật cấm lưu hành).","b":"Điều 45, Điều 47 BLHS"},{"id":"3.18","g":3,"lv":"TH","q":"Hình phạt chính áp dụng đối với pháp nhân thương mại phạm tội gồm:","o":["Cảnh cáo, phạt tiền, cải tạo không giam giữ","Phạt tiền, cấm kinh doanh, cấm huy động vốn","Đình chỉ hoạt động, trục xuất, tịch thu tài sản","Phạt tiền, đình chỉ hoạt động có thời hạn, đình chỉ hoạt động vĩnh viễn"],"a":3,"e":"Khoản 1 Điều 33 BLHS: hình phạt chính đối với pháp nhân thương mại gồm phạt tiền, đình chỉ hoạt động có thời hạn, đình chỉ hoạt động vĩnh viễn. Cấm kinh doanh, cấm hoạt động trong một số lĩnh vực, cấm huy động vốn là hình phạt bổ sung (khoản 2); phạt tiền có thể là bổ sung khi không áp dụng là chính.","b":"Khoản 1 Điều 33 BLHS"},{"id":"3.19","g":3,"lv":"VD","q":"Theo Luật số 86/2025/QH15, hình phạt tử hình đã được bãi bỏ đối với tội nào sau đây?","o":["Tội sản xuất trái phép chất ma túy (Điều 248)","Tội tham ô tài sản (Điều 353)","Tội giết người (Điều 123)","Tội hiếp dâm người dưới 16 tuổi (Điều 142)"],"a":1,"e":"Luật 86/2025/QH15 (hiệu lực 01/7/2025) bỏ hình phạt tử hình đối với 8 tội: Điều 109, 110, 114, 194, 250, 353 (tham ô tài sản), 354 (nhận hối lộ) và 421. Tội giết người, hiếp dâm người dưới 16 tuổi, sản xuất trái phép chất ma túy vẫn có hình phạt tử hình.","b":"Luật số 86/2025/QH15"},{"id":"3.20","g":3,"lv":"VD","q":"Cá thể hóa hình phạt trong vụ án có nhiều bị cáo đòi hỏi Tòa án:","o":["Đánh giá riêng vai trò, mức độ tham gia, nhân thân và tình tiết tăng nặng, giảm nhẹ của từng bị cáo","Áp dụng một mức hình phạt chung cho tất cả bị cáo","Luôn chọn mức cao nhất của khung đối với người chủ mưu","Chỉ dựa vào lời nhận tội của bị cáo"],"a":0,"e":"Theo Điều 50 và Điều 58 BLHS, hình phạt phải tương xứng với tính chất, mức độ hành vi và nhân thân của từng người; tình tiết tăng nặng, giảm nhẹ thuộc người nào áp dụng cho người đó. Không có quy định buộc chọn mức cao nhất cho người chủ mưu.","b":"Điều 50–52, Điều 58 BLHS"},{"id":"3.21","g":3,"lv":"NB","q":"Thời hạn của hình phạt tù có thời hạn đối với người phạm một tội là:","o":["Từ 03 tháng đến 20 năm","Từ 01 năm đến 20 năm","Từ 03 tháng đến 15 năm","Từ 06 tháng đến 30 năm"],"a":0,"e":"Khoản 1 Điều 38 BLHS: tù có thời hạn là buộc người bị kết án phải chấp hành hình phạt tại cơ sở giam giữ trong một thời hạn nhất định; mức tối thiểu là 03 tháng và tối đa là 20 năm. Mức 30 năm chỉ là giới hạn khi tổng hợp hình phạt nhiều tội (Điều 55).","b":"Khoản 1 Điều 38 BLHS"},{"id":"3.22","g":3,"lv":"TH","q":"Hình phạt tử hình KHÔNG được áp dụng đối với đối tượng nào sau đây?","o":["Người đủ 75 tuổi trở lên khi phạm tội hoặc khi xét xử","Người từ đủ 18 tuổi phạm tội đặc biệt nghiêm trọng","Người phạm tội có tổ chức","Người tái phạm nguy hiểm"],"a":0,"e":"Khoản 2 Điều 40 BLHS: không áp dụng hình phạt tử hình đối với người dưới 18 tuổi khi phạm tội, phụ nữ có thai, phụ nữ đang nuôi con dưới 36 tháng tuổi, người đủ 75 tuổi trở lên khi phạm tội hoặc khi xét xử. Tái phạm nguy hiểm, phạm tội có tổ chức là tình tiết tăng nặng, không phải căn cứ loại trừ tử hình.","b":"Khoản 2 Điều 40 BLHS"},{"id":"3.23","g":3,"lv":"TH","q":"Theo Điều 40 BLHS (sửa đổi bởi Luật 86/2025/QH15), trường hợp nào KHÔNG thi hành án tử hình đối với người bị kết án?","o":["Người bị kết án đã chấp hành được 10 năm tạm giam","Người bị kết án mắc bệnh ung thư giai đoạn cuối","Người bị kết án có đơn xin ân giảm bị bác","Người bị kết án về tội tham ô tài sản đã nộp lại 3/4 tài sản"],"a":1,"e":"Khoản 3 Điều 40 BLHS (sửa đổi 2025): không thi hành án tử hình đối với phụ nữ có thai hoặc đang nuôi con dưới 36 tháng tuổi, người đủ 75 tuổi trở lên và (bổ sung mới) người mắc bệnh ung thư giai đoạn cuối; khi đó hình phạt tử hình chuyển thành tù chung thân. Trường hợp liên quan tội tham ô, nhận hối lộ đã bị bỏ vì hai tội này không còn hình phạt tử hình.","b":"Khoản 3 Điều 40 BLHS (sửa đổi bởi Luật 86/2025/QH15)"},{"id":"3.24","g":3,"lv":"TH","q":"Tòa án có thể quyết định một hình phạt dưới mức thấp nhất của khung hình phạt được áp dụng khi nào?","o":["Khi người phạm tội có ít nhất hai tình tiết giảm nhẹ tại khoản 1 Điều 51; Tòa án chỉ được quyết định trong khung liền kề nhẹ hơn của điều luật","Khi Viện kiểm sát đồng ý","Khi người phạm tội có một tình tiết giảm nhẹ bất kỳ","Khi người bị hại đề nghị"],"a":0,"e":"Khoản 1 Điều 54 BLHS: Tòa án có thể quyết định hình phạt dưới mức thấp nhất của khung nhưng phải trong khung hình phạt liền kề nhẹ hơn của điều luật khi người phạm tội có ít nhất hai tình tiết giảm nhẹ quy định tại khoản 1 Điều 51. Một tình tiết hay ý kiến của bị hại, Viện kiểm sát không đủ.","b":"Khoản 1 Điều 54 BLHS"},{"id":"3.25","g":3,"lv":"TH","q":"Người bị xử phạt tù có thể được hưởng án treo khi mức phạt tù:","o":["Không quá 07 năm nếu là người phạm tội lần đầu","Không quá 05 năm trong mọi trường hợp","Không quá 03 năm, căn cứ vào nhân thân và tình tiết giảm nhẹ, xét thấy không cần bắt chấp hành hình phạt tù","Bất kỳ mức nào nếu đã bồi thường đủ thiệt hại"],"a":2,"e":"Khoản 1 Điều 65 BLHS: khi xử phạt tù không quá 03 năm, căn cứ vào nhân thân người phạm tội và các tình tiết giảm nhẹ, nếu xét thấy không cần phải bắt chấp hành hình phạt tù thì Tòa án cho hưởng án treo và ấn định thời gian thử thách từ 01 năm đến 05 năm.","b":"Khoản 1 Điều 65 BLHS"},{"id":"3.26","g":3,"lv":"TH","q":"Người bị kết án phạt tù đến 05 năm đương nhiên được xóa án tích khi đã chấp hành xong hình phạt chính và không phạm tội mới trong thời hạn:","o":["05 năm","01 năm","03 năm","02 năm"],"a":3,"e":"Khoản 2 Điều 70 BLHS: người bị kết án đương nhiên được xóa án tích nếu từ khi chấp hành xong hình phạt chính hoặc hết thời gian thử thách án treo, không thực hiện hành vi phạm tội mới trong thời hạn: 01 năm (cảnh cáo, phạt tiền, cải tạo không giam giữ, phạt tù hưởng án treo); 02 năm (phạt tù đến 05 năm); 03 năm (phạt tù trên 05 đến 15 năm); 05 năm (trên 15 năm, chung thân hoặc tử hình đã được giảm).","b":"Điểm b khoản 2 Điều 70 BLHS"},{"id":"3.27","g":3,"lv":"TH","q":"Thời hạn của hình phạt đình chỉ hoạt động có thời hạn đối với pháp nhân thương mại là:","o":["Từ 06 tháng đến 03 năm","Từ 01 năm đến 03 năm","Từ 03 tháng đến 01 năm","Từ 01 năm đến 05 năm"],"a":0,"e":"Điều 78 BLHS: đình chỉ hoạt động có thời hạn là tạm dừng hoạt động của pháp nhân thương mại trong một hoặc một số lĩnh vực mà pháp nhân phạm tội gây thiệt hại đến tính mạng, sức khỏe con người, môi trường hoặc an ninh, trật tự…; thời hạn từ 06 tháng đến 03 năm.","b":"Khoản 2 Điều 78 BLHS"},{"id":"3.28","g":3,"lv":"VD","q":"A bị tuyên 2 năm cải tạo không giam giữ; trước khi xét xử A đã bị tạm giam 2 tháng. Thời gian tạm giam được trừ vào thời hạn cải tạo không giam giữ như thế nào?","o":["1 ngày tạm giam bằng 1 ngày cải tạo không giam giữ, tức được trừ 2 tháng","1 ngày tạm giam bằng 2 ngày cải tạo không giam giữ, tức được trừ 4 tháng","1 ngày tạm giam bằng 3 ngày cải tạo không giam giữ, tức được trừ 6 tháng","Không được trừ vì cải tạo không giam giữ không cách ly người bị kết án"],"a":2,"e":"Khoản 2 Điều 36 BLHS: nếu người bị kết án đã bị tạm giữ, tạm giam thì thời gian tạm giữ, tạm giam được trừ vào thời gian chấp hành hình phạt cải tạo không giam giữ, cứ 01 ngày tạm giữ, tạm giam bằng 03 ngày cải tạo không giam giữ. 2 tháng tạm giam tương đương 6 tháng cải tạo không giam giữ.","b":"Khoản 2 Điều 36 BLHS"},{"id":"3.29","g":3,"lv":"TH","q":"Tòa án có thể miễn hình phạt cho người phạm tội trong trường hợp nào?","o":["Có ít nhất hai tình tiết giảm nhẹ tại khoản 1 Điều 51, đáng được khoan hồng đặc biệt nhưng chưa đến mức được miễn TNHS","Người bị hại đề nghị miễn hình phạt","Người phạm tội lần đầu, không phụ thuộc tình tiết giảm nhẹ","Người phạm tội đã bồi thường một phần thiệt hại"],"a":0,"e":"Điều 59 BLHS: người phạm tội có thể được miễn hình phạt nếu thuộc trường hợp quy định tại khoản 1 hoặc khoản 2 Điều 54 (có ít nhất hai tình tiết giảm nhẹ tại khoản 1 Điều 51…), đáng được khoan hồng đặc biệt nhưng chưa đến mức được miễn TNHS.","b":"Điều 59 BLHS"},{"id":"3.30","g":3,"lv":"TH","q":"Thời hiệu thi hành bản án hình sự đối với người bị xử phạt tù đến 03 năm là:","o":["03 năm","10 năm","05 năm","Không áp dụng thời hiệu"],"a":2,"e":"Khoản 2 Điều 60 BLHS: thời hiệu thi hành bản án là 05 năm đối với trường hợp xử phạt tiền, cải tạo không giam giữ hoặc phạt tù đến 03 năm; 10 năm đối với tù từ trên 03 đến 15 năm; 15 năm đối với tù từ trên 15 đến 30 năm. Không áp dụng thời hiệu thi hành đối với tù chung thân, tử hình (Điều 61).","b":"Điểm a khoản 2 Điều 60 BLHS"},{"id":"4.01","g":4,"lv":"NB","q":"Luật Tư pháp người chưa thành niên số 59/2024/QH15 có hiệu lực thi hành từ ngày nào?","o":["01/7/2026","01/01/2026","01/7/2025","01/01/2025"],"a":1,"e":"Luật Tư pháp người chưa thành niên số 59/2024/QH15 được Quốc hội thông qua ngày 30/11/2024 và có hiệu lực từ ngày 01/01/2026. Luật được áp dụng cùng BLHS, BLTTHS, Luật Thi hành án hình sự; những vấn đề Luật này quy định riêng (xử lý chuyển hướng, hình phạt đối với người chưa thành niên…) thì áp dụng Luật này.","b":"Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.02","g":4,"lv":"TH","q":"Theo Luật Tư pháp người chưa thành niên, quan hệ giữa Luật này với BLHS được xác định thế nào?","o":["BLHS luôn được ưu tiên, Luật chỉ có giá trị tham khảo","Luật thay thế toàn bộ BLHS khi người phạm tội dưới 18 tuổi","Luật chỉ áp dụng ở giai đoạn thi hành án","Luật được áp dụng cùng BLHS, BLTTHS, Luật Thi hành án hình sự; nội dung Luật quy định riêng về người chưa thành niên thì áp dụng Luật này"],"a":3,"e":"Điều 2 Luật Tư pháp người chưa thành niên: Luật được áp dụng cùng với BLHS, BLTTHS, Luật Thi hành án hình sự và luật khác có liên quan không trái với Luật này. Các vấn đề về điều kiện chịu TNHS (như tuổi tại Điều 12, khái niệm tội phạm) vẫn theo BLHS; xử lý chuyển hướng, hình phạt, thủ tục đối với người chưa thành niên theo Luật này.","b":"Điều 2 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.03","g":4,"lv":"TH","q":"Nguyên tắc cốt lõi khi xử lý người chưa thành niên phạm tội là:","o":["Luôn miễn trách nhiệm hình sự cho người dưới 18 tuổi","Chỉ ưu tiên trừng trị để bảo vệ người bị hại","Bảo đảm lợi ích tốt nhất của người chưa thành niên, chủ yếu nhằm giáo dục, giúp họ sửa chữa sai lầm, phát triển lành mạnh và tái hòa nhập cộng đồng","Xử lý như người thành niên để bảo đảm tính răn đe"],"a":2,"e":"Luật Tư pháp người chưa thành niên (Điều 5, Điều 12) và Điều 91 BLHS đều xác định: việc xử lý phải bảo đảm lợi ích tốt nhất của người chưa thành niên, chủ yếu nhằm giáo dục, giúp họ sửa chữa sai lầm, phát triển lành mạnh, trở thành công dân có ích; ưu tiên xử lý chuyển hướng, hạn chế áp dụng hình phạt. Không phải mọi trường hợp đều được miễn TNHS.","b":"Điều 5, Điều 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 91 BLHS"},{"id":"4.04","g":4,"lv":"TH","q":"Khi xác định trách nhiệm hình sự của người chưa thành niên, độ tuổi được xác định tại thời điểm nào?","o":["Thời điểm bản án có hiệu lực pháp luật","Thời điểm Tòa án xét xử sơ thẩm","Thời điểm khởi tố vụ án","Thời điểm thực hiện hành vi phạm tội"],"a":3,"e":"Điều 12 BLHS gắn điều kiện chịu TNHS với tuổi của người khi thực hiện tội phạm. Vì vậy phải xác định chính xác ngày, tháng, năm sinh và thời điểm thực hiện từng hành vi; tuổi tại ngày khởi tố hay xét xử chỉ có ý nghĩa đối với một số biện pháp tố tụng, xử lý chuyển hướng (khi người đó đã đủ 18 tuổi).","b":"Điều 12 BLHS"},{"id":"4.05","g":4,"lv":"NB","q":"Biện pháp nào sau đây là biện pháp xử lý chuyển hướng theo Luật Tư pháp người chưa thành niên?","o":["Cải tạo không giam giữ","Quản thúc tại gia đình","Phạt tiền","Tù cho hưởng án treo"],"a":1,"e":"Điều 36 Luật Tư pháp người chưa thành niên liệt kê 12 biện pháp xử lý chuyển hướng: khiển trách; xin lỗi bị hại; bồi thường thiệt hại; giáo dục tại xã, phường, thị trấn; quản thúc tại gia đình; hạn chế khung giờ đi lại; cấm tiếp xúc…; cấm đến địa điểm…; tham gia chương trình học tập, dạy nghề; tham gia điều trị hoặc tư vấn tâm lý; thực hiện công việc phục vụ cộng đồng; giáo dục tại trường giáo dưỡng. Cải tạo không giam giữ, phạt tiền, án treo thuộc hệ thống hình phạt.","b":"Điều 36 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.06","g":4,"lv":"TH","q":"Biện pháp xử lý chuyển hướng nào được áp dụng ngoài cộng đồng?","o":["Quản thúc tại gia đình","Thực hiện công việc phục vụ cộng đồng","Giáo dục tại trường giáo dưỡng","Giáo dục tại xã, phường, thị trấn"],"a":2,"e":"Trong 12 biện pháp tại Điều 36, giáo dục tại trường giáo dưỡng là biện pháp duy nhất đưa người chưa thành niên ra khỏi môi trường cộng đồng; 11 biện pháp còn lại được thực hiện tại cộng đồng. Đây là biện pháp nghiêm khắc nhất trong nhóm xử lý chuyển hướng.","b":"Điều 36 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.07","g":4,"lv":"TH","q":"Điều kiện để áp dụng biện pháp xử lý chuyển hướng đối với người chưa thành niên gồm:","o":["Chỉ cần người chưa thành niên phạm tội lần đầu","Chỉ cần gia đình người chưa thành niên có đơn đề nghị","Chỉ cần người bị hại đồng ý","Có đủ chứng cứ xác định người đó đã thực hiện hành vi phạm tội, người đó thừa nhận hành vi và đồng ý bằng văn bản về việc xử lý chuyển hướng"],"a":3,"e":"Điều 39 Luật Tư pháp người chưa thành niên: xử lý chuyển hướng chỉ được áp dụng khi có đủ căn cứ xác định người chưa thành niên đã thực hiện hành vi phạm tội, người đó thừa nhận hành vi và đồng ý bằng văn bản việc áp dụng xử lý chuyển hướng. Đề nghị của gia đình hay bị hại không thay thế các điều kiện này.","b":"Điều 39 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.08","g":4,"lv":"TH","q":"Người từ đủ 14 tuổi đến dưới 16 tuổi KHÔNG được áp dụng biện pháp xử lý chuyển hướng trong trường hợp nào?","o":["Đã bồi thường một phần thiệt hại cho bị hại","Phạm tội đặc biệt nghiêm trọng","Có hoàn cảnh gia đình khó khăn","Phạm tội rất nghiêm trọng lần đầu thuộc tội trộm cắp tài sản"],"a":1,"e":"Khoản 1 Điều 38 Luật Tư pháp người chưa thành niên: người từ đủ 14 đến dưới 16 tuổi không được áp dụng xử lý chuyển hướng nếu phạm tội rất nghiêm trọng thuộc một số tội (giết người, hiếp dâm, hiếp dâm người dưới 16 tuổi, cưỡng dâm người từ đủ 13 đến dưới 16 tuổi, sản xuất trái phép chất ma túy); phạm tội rất nghiêm trọng từ 02 lần trở lên hoặc nhiều tội rất nghiêm trọng; hoặc phạm tội đặc biệt nghiêm trọng.","b":"Khoản 1 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.09","g":4,"lv":"TH","q":"Người từ đủ 16 tuổi đến dưới 18 tuổi KHÔNG được áp dụng biện pháp xử lý chuyển hướng trong trường hợp nào?","o":["Tái phạm hoặc tái phạm nguy hiểm","Là người đồng phạm có vai trò không đáng kể","Phạm tội ít nghiêm trọng lần đầu","Phạm tội nghiêm trọng do vô ý"],"a":0,"e":"Khoản 2 Điều 38 Luật Tư pháp người chưa thành niên loại trừ người từ đủ 16 đến dưới 18 tuổi khi: phạm tội nghiêm trọng thuộc một số tội (hiếp dâm, các tội về ma túy…); tái phạm hoặc tái phạm nguy hiểm; phạm tội nghiêm trọng do cố ý từ 02 lần trở lên hoặc nhiều tội nghiêm trọng do cố ý; phạm tội rất nghiêm trọng do cố ý hoặc đặc biệt nghiêm trọng.","b":"Khoản 2 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.10","g":4,"lv":"TH","q":"Người chưa thành niên đã được áp dụng biện pháp xử lý chuyển hướng mà phạm tội mới thì:","o":["Không được tiếp tục áp dụng biện pháp xử lý chuyển hướng","Đương nhiên bị áp dụng hình phạt tù","Được miễn trách nhiệm hình sự","Được áp dụng lại biện pháp xử lý chuyển hướng nhẹ hơn"],"a":0,"e":"Khoản 3 Điều 38 Luật Tư pháp người chưa thành niên: không áp dụng biện pháp xử lý chuyển hướng đối với người chưa thành niên đã được áp dụng biện pháp xử lý chuyển hướng mà phạm tội mới. Khi đó, cơ quan có thẩm quyền xem xét hình phạt theo quy định riêng đối với người chưa thành niên, không đương nhiên là tù.","b":"Khoản 3 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.11","g":4,"lv":"NB","q":"Hệ thống hình phạt áp dụng đối với người chưa thành niên phạm tội gồm:","o":["Cảnh cáo, phạt tiền, cải tạo không giam giữ, tù có thời hạn","Phạt tiền, quản chế, cấm cư trú, tù có thời hạn","Khiển trách, cảnh cáo, quản thúc tại gia đình, tù có thời hạn","Cảnh cáo, phạt tiền, trục xuất, tù chung thân"],"a":0,"e":"Điều 115 Luật Tư pháp người chưa thành niên (tương ứng Điều 98 BLHS): người chưa thành niên phạm tội chỉ bị áp dụng một trong các hình phạt chính: cảnh cáo, phạt tiền, cải tạo không giam giữ, tù có thời hạn đối với mỗi tội. Không áp dụng tù chung thân, tử hình (Điều 39, 40 BLHS); không áp dụng hình phạt bổ sung. Khiển trách, quản thúc là biện pháp xử lý chuyển hướng.","b":"Điều 115 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 98 BLHS"},{"id":"4.12","g":4,"lv":"TH","q":"Hình phạt tử hình và tù chung thân có được áp dụng đối với người dưới 18 tuổi khi phạm tội không?","o":["Không được áp dụng","Được áp dụng nếu phạm tội đặc biệt nghiêm trọng","Được áp dụng nếu đến khi xét xử đã đủ 18 tuổi","Chỉ áp dụng tù chung thân, không áp dụng tử hình"],"a":0,"e":"Điều 39 BLHS: tù chung thân không áp dụng đối với người dưới 18 tuổi phạm tội; khoản 2 Điều 40: không áp dụng tử hình đối với người dưới 18 tuổi khi phạm tội. Mốc là tuổi khi phạm tội, nên việc đã đủ 18 tuổi khi xét xử không làm thay đổi.","b":"Điều 39, khoản 2 Điều 40 BLHS"},{"id":"4.13","g":4,"lv":"TH","q":"Phạt tiền có thể áp dụng đối với người từ đủ 14 tuổi đến dưới 16 tuổi phạm tội không?","o":["Không bao giờ được áp dụng","Có, nếu người đó có thu nhập hoặc có tài sản riêng, với mức không quá một phần ba mức tiền phạt mà điều luật quy định","Có, với mức như người thành niên","Có, và cha mẹ phải nộp thay trong mọi trường hợp"],"a":1,"e":"Điều 117 Luật Tư pháp người chưa thành niên mở rộng phạt tiền cho người từ đủ 14 đến dưới 16 tuổi nếu có thu nhập hoặc tài sản riêng (BLHS trước đây chỉ cho phép với người từ đủ 16 tuổi). Mức phạt không quá một phần hai (đối với 16–18 tuổi) và một phần ba (đối với 14–16 tuổi) mức tiền phạt điều luật quy định.","b":"Điều 117 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.14","g":4,"lv":"TH","q":"Người từ đủ 16 tuổi đến dưới 18 tuổi phạm tội (không thuộc nhóm tội được giữ mức theo BLHS) mà điều luật quy định tù có thời hạn thì mức hình phạt cao nhất áp dụng là:","o":["Không quá ba phần tư mức phạt tù mà điều luật quy định","Không quá một phần hai mức phạt tù mà điều luật quy định","Bằng mức phạt tù mà điều luật quy định","Không quá ba phần năm mức phạt tù mà điều luật quy định"],"a":3,"e":"Điều 119 Luật Tư pháp người chưa thành niên giảm mức tù tối đa so với Điều 101 BLHS cũ: với người từ đủ 16 đến dưới 18 tuổi, nếu điều luật quy định tù chung thân hoặc tử hình thì mức cao nhất không quá 15 năm; nếu là tù có thời hạn thì không quá ba phần năm mức phạt tù điều luật quy định (riêng một số tội như giết người, hiếp dâm… vẫn giữ mức theo BLHS: 18 năm và ba phần tư). Với người từ đủ 14 đến dưới 16 tuổi tương ứng là 09 năm và hai phần năm.","b":"Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.15","g":4,"lv":"TH","q":"Vì sao cần phân biệt xử lý chuyển hướng với hình phạt?","o":["Vì xử lý chuyển hướng là biện pháp thay thế việc truy cứu, xét xử, áp dụng hình phạt, có căn cứ, điều kiện và hậu quả pháp lý khác hình phạt","Vì xử lý chuyển hướng chỉ do gia đình quyết định","Vì xử lý chuyển hướng luôn nặng hơn hình phạt","Vì hai chế định hoàn toàn giống nhau"],"a":0,"e":"Xử lý chuyển hướng (Phần thứ hai Luật Tư pháp người chưa thành niên) là cơ chế đưa người chưa thành niên ra khỏi quá trình tố tụng thông thường, áp dụng biện pháp giáo dục, phục hồi tại cộng đồng hoặc trường giáo dưỡng; không phải hình phạt nên không để lại án tích. Hình phạt chỉ áp dụng khi xử lý chuyển hướng không bảo đảm hiệu quả giáo dục, phòng ngừa.","b":"Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.16","g":4,"lv":"TH","q":"Khi lựa chọn hình phạt đối với người chưa thành niên, Tòa án ưu tiên theo thứ tự nào?","o":["Phạt tiền luôn được áp dụng trước tiên","Cảnh cáo, phạt tiền, cải tạo không giam giữ, tù cho hưởng án treo; tù có thời hạn chỉ áp dụng khi các biện pháp khác không có tác dụng","Tòa án tự do lựa chọn không theo thứ tự","Tù có thời hạn trước, sau đó xem xét các hình phạt nhẹ hơn"],"a":1,"e":"Theo Điều 12 Luật Tư pháp người chưa thành niên và khoản 5 Điều 91 BLHS, khi áp dụng hình phạt phải ưu tiên hình phạt nhẹ: cảnh cáo, phạt tiền, cải tạo không giam giữ, tù nhưng cho hưởng án treo; phạt tù có thời hạn chỉ áp dụng khi xét thấy các hình phạt và biện pháp khác không có tác dụng răn đe, phòng ngừa, và với thời hạn thích hợp ngắn nhất.","b":"Điều 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 91 BLHS"},{"id":"4.17","g":4,"lv":"VD","q":"Một người phạm tội khi 17 tuổi nhưng đến khi xem xét áp dụng xử lý chuyển hướng đã đủ 18 tuổi. Hướng xử lý đúng là:","o":["Vẫn bắt buộc áp dụng xử lý chuyển hướng","Miễn trách nhiệm hình sự vì đã quá tuổi chuyển hướng","Xử lý như người thành niên phạm tội về mọi mặt, kể cả tử hình","Không áp dụng biện pháp xử lý chuyển hướng; xem xét xử lý theo quy định về người chưa thành niên phạm tội ở giai đoạn tố tụng tương ứng"],"a":3,"e":"Luật Tư pháp người chưa thành niên không áp dụng biện pháp xử lý chuyển hướng nếu tại thời điểm xem xét, người phạm tội đã đủ 18 tuổi. Tuy nhiên, các quy định về hình phạt vẫn căn cứ tuổi khi phạm tội: người này vẫn không bị áp dụng tử hình, tù chung thân và được hưởng mức hình phạt dành cho người chưa thành niên.","b":"Điều 35 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 40 BLHS"},{"id":"4.18","g":4,"lv":"TH","q":"Hình phạt cảnh cáo theo Luật Tư pháp người chưa thành niên được mở rộng áp dụng cho trường hợp nào so với BLHS?","o":["Người từ đủ 16 tuổi đến dưới 18 tuổi phạm tội nghiêm trọng do vô ý; chỉ cần có tình tiết giảm nhẹ","Người tái phạm nguy hiểm","Người phạm tội rất nghiêm trọng do cố ý","Mọi tội đặc biệt nghiêm trọng"],"a":0,"e":"Điều 116 Luật Tư pháp người chưa thành niên mở rộng cảnh cáo: ngoài tội ít nghiêm trọng, cảnh cáo còn có thể áp dụng cho người từ đủ 16 đến dưới 18 tuổi phạm tội nghiêm trọng do vô ý; điều kiện về tình tiết giảm nhẹ cũng được nới (không đòi hỏi 'nhiều tình tiết giảm nhẹ' như Điều 34 BLHS).","b":"Điều 116 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.19","g":4,"lv":"TH","q":"Người phạm nhiều tội, có tội thực hiện trước khi đủ 16 tuổi, có tội sau khi đủ 16 tuổi thì hình phạt chung theo Luật Tư pháp người chưa thành niên không vượt quá:","o":["20 năm tù","30 năm tù","18 năm tù","12 năm tù"],"a":2,"e":"Khoản 2 Điều 121 Luật Tư pháp người chưa thành niên: trường hợp phạm nhiều tội, có tội trước khi đủ 16 tuổi, có tội sau khi đủ 16 tuổi, mức hình phạt chung không được vượt quá 18 năm tù. Mức 30 năm áp dụng khi tổng hợp đối với người thành niên (Điều 55 BLHS).","b":"Khoản 2 Điều 121 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.20","g":4,"lv":"VD","q":"Khi có nhiều người chưa thành niên cùng tham gia một vụ việc, cách xử lý đúng là:","o":["Chỉ căn cứ lời khai của người chủ mưu","Chỉ xử lý người lớn tuổi nhất","Áp dụng cùng một biện pháp cho cả nhóm","Xác định riêng vai trò, độ tuổi, lỗi, mức độ tham gia, điều kiện xử lý chuyển hướng và tình tiết của từng người"],"a":3,"e":"Điều kiện áp dụng xử lý chuyển hướng (Điều 37–39) và hình phạt đối với người chưa thà
