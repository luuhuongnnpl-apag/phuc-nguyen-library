õi, hỗ trợ, đoàn thể lan tỏa kỹ năng.","b":"Điều 4 BLHS; Giáo trình Tội phạm học","cid":"TH6.02"},{"id":"TH6.02.4","g":6,"lv":"VD","q":"Hiệu quả chương trình nên được đánh giá dựa trên cơ sở nào?","o":["Số buổi truyền thông mà nhà trường đã tổ chức trong năm","Chỉ báo rõ ràng và dữ liệu so sánh trước – sau chương trình","Cảm nhận chủ quan của những người tổ chức chương trình","Số người tham dự các buổi truyền thông, không cần đo kết quả"],"a":1,"e":"Đánh giá hiệu quả phòng ngừa phải đo thay đổi thực chất so với trước khi triển khai; số buổi, số người tham dự chỉ là chỉ báo đầu vào. Việc thu thập dữ liệu phải tuân thủ pháp luật về bảo vệ dữ liệu cá nhân.","b":"Giáo trình Tội phạm học","cid":"TH6.02"},{"id":"TH6.03.1","g":6,"lv":"VD","q":"Nhóm nguyên nhân, điều kiện nào thể hiện ở đặc điểm của người phạm tội trong tình huống?","o":["Xã K có nhiều công nhân đến thuê trọ","Xe bị để ngoài sân, không khóa cẩn thận","Thất nghiệp và nghiện ma túy, làm phát sinh nhu cầu tiền","Khu trọ không có đèn chiếu sáng vào ban đêm"],"a":2,"e":"Đặc điểm nhân thân người phạm tội (thất nghiệp, nghiện ma túy) là nhóm nguyên nhân bên trong thúc đẩy hành vi phạm tội. Thiếu đèn, thiếu camera, để xe không khóa là điều kiện bên ngoài, thuộc về hoàn cảnh và nạn nhân.","b":"Giáo trình Tội phạm học","cid":"TH6.03"},{"id":"TH6.03.2","g":6,"lv":"VD","q":"Biện pháp nào thuộc phòng ngừa tình huống (giảm cơ hội phạm tội)?","o":["Hỗ trợ cai nghiện cho người nghiện ma túy trên địa bàn","Tổ chức cuộc thi tìm hiểu pháp luật cho thanh niên","Tăng mức hình phạt đối với tội trộm cắp tài sản","Lắp đèn, camera, bố trí nơi để xe có người trông giữ"],"a":3,"e":"Phòng ngừa tình huống tác động trực tiếp vào môi trường cụ thể để làm việc phạm tội khó thực hiện, dễ bị phát hiện (chiếu sáng, camera, khóa, trông giữ). Hỗ trợ cai nghiện, giáo dục pháp luật thuộc phòng ngừa xã hội; tăng hình phạt thuộc biện pháp pháp lý.","b":"Giáo trình Tội phạm học","cid":"TH6.03"},{"id":"TH6.03.3","g":6,"lv":"VD","q":"Biện pháp nào tác động vào nguyên nhân từ phía người phạm tội?","o":["Hỗ trợ cai nghiện, dạy nghề, giới thiệu việc làm","Khuyến khích người thuê trọ mua bảo hiểm xe máy","Lắp thêm camera giám sát tại các khu trọ","Treo biển cảnh báo trộm cắp tại các khu trọ"],"a":0,"e":"Biện pháp phòng ngừa xã hội hướng vào việc khắc phục nguyên nhân từ phía người có nguy cơ phạm tội: hỗ trợ cai nghiện, dạy nghề, tạo việc làm. Camera, biển cảnh báo tác động vào điều kiện, cơ hội; bảo hiểm chỉ chuyển rủi ro, không phòng ngừa tội phạm.","b":"Giáo trình Tội phạm học","cid":"TH6.03"},{"id":"TH6.03.4","g":6,"lv":"VD","q":"Ủy ban nhân dân xã nên tổ chức phương án phòng ngừa theo hướng nào?","o":["Yêu cầu các chủ nhà trọ tự chịu trách nhiệm về an ninh khu trọ","Phối hợp nhiều chủ thể, kết hợp biện pháp tình huống và xã hội","Chỉ ban hành văn bản nhắc nhở người dân tự bảo vệ tài sản","Giao toàn bộ trách nhiệm cho Công an xã tự tổ chức thực hiện"],"a":1,"e":"Theo Điều 4 BLHS, phòng ngừa tội phạm là trách nhiệm chung của cơ quan, tổ chức và công dân. Phương án hiệu quả cần phối hợp nhiều chủ thể, kết hợp biện pháp giảm cơ hội phạm tội với biện pháp khắc phục nguyên nhân xã hội và đo lường kết quả định kỳ.","b":"Điều 4 BLHS; Giáo trình Tội phạm học","cid":"TH6.03"}],"th":[{"name":"Chương 1. Những vấn đề cơ bản về luật hình sự","items":[{"cid":"TH1.01","title":"Hành vi trước và sau khi bị tội phạm hóa","text":"Ngày 12/3/2026, Minh thực hiện hành vi X gây bức xúc trong dư luận. Khi đó, hành vi X chưa được Bộ luật Hình sự quy định là tội phạm; một nghị định của Chính phủ quy định hành vi X bị xử phạt vi phạm hành chính. Ngày 01/9/2026, một luật sửa đổi Bộ luật Hình sự có hiệu lực, bổ sung hành vi X là tội phạm. Ngày 15/9/2026, Minh tiếp tục thực hiện hành vi X.","ask":[],"guide":[],"basis":"Khoản 1 Điều 2 BLHS; Khoản 1, khoản 2 Điều 7 BLHS; Khoản 1 Điều 7 BLHS; Điều 2, Điều 8, điểm g khoản 1 Điều 52 BLHS","mcq":["TH1.01.1","TH1.01.2","TH1.01.3","TH1.01.4"]},{"cid":"TH1.02","title":"Luật mới bỏ hình phạt tử hình đối với tội tham ô","text":"Ngày 15/6/2025, An – kế toán trưởng một doanh nghiệp nhà nước – chiếm đoạt 2 tỷ đồng do mình quản lý. Tại thời điểm đó, khoản 4 Điều 353 BLHS (tội tham ô tài sản) có khung hình phạt tù 20 năm, tù chung thân hoặc tử hình. Luật số 86/2025/QH15 có hiệu lực từ 01/7/2025 bỏ hình phạt tử hình đối với tội tham ô tài sản. Tháng 3/2026, An bị đưa ra xét xử. Đồng phạm của An là Bình đã bị kết án tử hình về tội tham ô tài sản bằng bản án có hiệu lực từ tháng 5/2025 nhưng chưa thi hành.","ask":[],"guide":[],"basis":"Khoản 3 Điều 7 BLHS; Luật số 86/2025/QH15; Điều 28 BLHS; Điều 63 BLHS (sửa đổi bởi Luật 86/2025/QH15)","mcq":["TH1.02.1","TH1.02.2","TH1.02.3","TH1.02.4"]},{"cid":"TH1.03","title":"Trộm cắp trên chuyến bay quốc tế","text":"Ngày 10/5/2026, trên chuyến bay của một hãng hàng không Việt Nam (tàu bay mang quốc tịch Việt Nam) từ Frankfurt về Hà Nội, khi máy bay đang ở vùng trời quốc tế, Lê Hải (công dân Việt Nam, 30 tuổi) lén lấy chiếc túi của hành khách ngồi bên cạnh, bên trong có 50.000.000 đồng tiền mặt. Hải bị phát hiện và bàn giao cho cơ quan chức năng khi máy bay hạ cánh tại Nội Bài.","ask":[],"guide":[],"basis":"Khoản 3 Điều 6 BLHS; Điểm c khoản 2 Điều 173, điểm b khoản 1 Điều 9 BLHS; Điểm b khoản 2 Điều 27 BLHS","mcq":["TH1.03.1","TH1.03.2","TH1.03.3","TH1.03.4"]}]},{"name":"Chương 2. Tội phạm và trách nhiệm hình sự","items":[{"cid":"TH2.01","title":"Giết người chưa đạt","text":"Ngày 12/3/2026, tại Hà Nội, Nguyễn Minh An dùng thanh kim loại đánh nhiều nhát vào đầu Trần Quốc Bình. Trước đó An nhắn tin cho bạn: \"Tối nay tao sẽ cho nó chết\". Bình được người dân đưa đi cấp cứu kịp thời nên không tử vong; An bị khống chế ngay tại chỗ.","ask":[],"guide":[],"basis":"Điều 15, Điều 123 BLHS; Điều 10, Điều 123, Điều 134 BLHS; Khoản 3 Điều 57 BLHS; Điều 16 BLHS","mcq":["TH2.01.1","TH2.01.2","TH2.01.3","TH2.01.4"]},{"cid":"TH2.02","title":"Đồng phạm trộm cắp","text":"Ngày 18/4/2026, tại Bắc Ninh, Lê Văn Cường (đã có một tiền án về tội trộm cắp tài sản, chưa được xóa án tích) rủ Phạm Đức Dũng (chưa có tiền án) đi trộm tài sản của một cửa hàng. Cường vạch kế hoạch, phân công Dũng đứng ngoài cảnh giới; Cường vào trong lấy 30.000.000 đồng. Hai người chia nhau số tiền.","ask":[],"guide":[],"basis":"Khoản 1 Điều 17 BLHS; Khoản 3 Điều 17 BLHS; Khoản 3 Điều 17, khoản 1 Điều 53 BLHS; Điều 58 BLHS","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]},{"cid":"TH2.03","title":"Thời hiệu truy cứu trách nhiệm hình sự","text":"Ngày 01/3/2019, Hòa trộm cắp chiếc xe máy trị giá 30.000.000 đồng (khoản 1 Điều 173 BLHS: phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm). Vụ việc không bị phát hiện. Ngày 10/5/2022, Hòa phạm tội lừa đảo chiếm đoạt tài sản thuộc khoản 1 Điều 174 BLHS (mức cao nhất của khung là 03 năm tù). Tháng 9/2026, cả hai hành vi bị phát hiện.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 9; điểm a khoản 2 Điều 27 BLHS; Khoản 3 Điều 27 BLHS; Khoản 2, khoản 3 Điều 27 BLHS","mcq":["TH2.03.1","TH2.03.2","TH2.03.3","TH2.03.4"]}]},{"name":"Chương 3. Hình phạt và các biện pháp tư pháp","items":[{"cid":"TH3.01","title":"Quyết định hình phạt và án treo","text":"Bình (25 tuổi, nhân thân tốt, phạm tội lần đầu) trộm cắp tài sản trị giá 20.000.000 đồng, thuộc khoản 1 Điều 173 BLHS (phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm). Bình thành khẩn khai báo, ăn năn hối cải và tự nguyện bồi thường toàn bộ thiệt hại. Tòa án xử phạt Bình 09 tháng tù nhưng cho hưởng án treo.","ask":[],"guide":[],"basis":"Khoản 1, khoản 2 Điều 51 BLHS; Khoản 1, khoản 3 Điều 54 BLHS; Khoản 1 Điều 65 BLHS; Nghị quyết 02/2018/NQ-HĐTP; Khoản 5 Điều 65 BLHS","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]},{"cid":"TH3.02","title":"Tổng hợp hình phạt nhiều tội và nhiều bản án","text":"Trong cùng một bản án, Tòa án kết án Dũng về hai tội: tội thứ nhất 08 năm tù; tội thứ hai 02 năm cải tạo không giam giữ. Trước khi xét xử, Dũng bị tạm giam 04 tháng. Khi Dũng đang chấp hành hình phạt chung, cơ quan điều tra phát hiện Dũng còn phạm một tội trộm cắp trước khi có bản án nói trên; Tòa án xử phạt Dũng 01 năm tù về tội này.","ask":[],"guide":[],"basis":"Điểm c khoản 1 Điều 55 BLHS; Khoản 1 Điều 38 BLHS; Khoản 1 Điều 56 BLHS; Khoản 1 Điều 56, điểm a khoản 1 Điều 55 BLHS","mcq":["TH3.02.1","TH3.02.2","TH3.02.3","TH3.02.4"]},{"cid":"TH3.03","title":"Hình phạt và biện pháp tư pháp trong vụ cướp xe","text":"Hùng dùng con dao bấm đe dọa, khống chế chị Lan để cướp chiếc xe máy trị giá 35.000.000 đồng. Cơ quan điều tra đã thu hồi chiếc xe và con dao. Sau khi bị khởi tố, Hùng mắc bệnh tâm thần làm mất khả năng nhận thức; kết luận giám định xác định khi thực hiện hành vi Hùng có đủ năng lực trách nhiệm hình sự.","ask":[],"guide":[],"basis":"Điểm d khoản 2 Điều 168 BLHS; Khoản 2 Điều 47, Điều 48 BLHS; Điểm a khoản 1 Điều 47 BLHS; Khoản 2 Điều 49 BLHS","mcq":["TH3.03.1","TH3.03.2","TH3.03.3","TH3.03.4"]}]},{"name":"Chương 4. Xử lý hình sự đối với người chưa thành niên","items":[{"cid":"TH4.01","title":"Người 16 tuổi trộm cắp lần đầu","text":"Tháng 02/2026, Khánh (16 tuổi 3 tháng) lần đầu phạm tội, trộm cắp chiếc xe máy trị giá 60.000.000 đồng, thuộc điểm c khoản 2 Điều 173 BLHS (phạt tù từ 02 năm đến 07 năm). Có đủ chứng cứ về hành vi; Khánh thừa nhận hành vi, gia đình đã bồi thường cho bị hại. Khánh và người đại diện đồng ý bằng văn bản việc xử lý chuyển hướng. Tháng 9/2026, khi đang thực hiện biện pháp xử lý chuyển hướng, Khánh lại phạm tội trộm cắp khác.","ask":[],"guide":[],"basis":"Điểm b khoản 1 Điều 9 BLHS; Điều 37, Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 39 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 36 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Khoản 3 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","mcq":["TH4.01.1","TH4.01.2","TH4.01.3","TH4.01.4"]},{"cid":"TH4.02","title":"Người 15 tuổi cướp tài sản","text":"Ngày 05/6/2026, tại Hải Phòng, Nguyễn Hoàng Nam (sinh ngày 10/02/2011) dùng dao đe dọa một học sinh để lấy chiếc điện thoại trị giá 8.000.000 đồng; hành vi thuộc khoản 1 Điều 168 BLHS (phạt tù từ 03 năm đến 10 năm). Đây là lần đầu Nam vi phạm. Tháng 3/2027, khi Nam đã đủ 16 tuổi, vụ án mới được khởi tố.","ask":[],"guide":[],"basis":"Khoản 2 Điều 12, điểm c khoản 1 Điều 9 BLHS; Khoản 2 Điều 12 BLHS; Khoản 1 Điều 37, khoản 1 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15","mcq":["TH4.02.1","TH4.02.2","TH4.02.3","TH4.02.4"]},{"cid":"TH4.03","title":"Người 17 tuổi phạm tội giết người","text":"Tuấn (17 tuổi) do mâu thuẫn từ trước đã dùng dao đâm chết một người hàng xóm. Hành vi thuộc khoản 2 Điều 123 BLHS (phạt tù từ 07 năm đến 15 năm). Tuấn ra đầu thú và thành khẩn khai báo; gia đình Tuấn xin áp dụng biện pháp xử lý chuyển hướng.","ask":[],"guide":[],"basis":"Khoản 1 Điều 12, điểm c khoản 1 Điều 9 BLHS; Điểm d khoản 2 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15","mcq":["TH4.03.1","TH4.03.2","TH4.03.3","TH4.03.4"]}]},{"name":"Chương 5. Giới thiệu một số nhóm tội phạm cụ thể","items":[{"cid":"TH5.01","title":"Mượn xe rồi đem bán","text":"Ngày 05/3/2026, E mượn chiếc xe máy trị giá 40.000.000 đồng của F với lý do đi khám bệnh và hẹn trả trong ngày. Tin nhắn và lời khai cho thấy E chỉ nảy sinh ý định chiếm đoạt sau khi đã nhận xe, khi bị chủ nợ thúc ép. E đem xe bán cho G với giá 15.000.000 đồng rồi bỏ trốn khỏi địa phương. G không hứa hẹn trước với E, nhưng biết rõ chiếc xe do E chiếm đoạt mà có vẫn mua. Cơ quan điều tra thu hồi được chiếc xe từ G.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 175, Điều 174 BLHS; Khoản 1 Điều 175 BLHS; Điều 323 BLHS; Khoản 2 Điều 47, Điều 48 BLHS","mcq":["TH5.01.1","TH5.01.2","TH5.01.3","TH5.01.4"]},{"cid":"TH5.02","title":"Nhận tiền để cho qua hồ sơ cấp phép","text":"Ông X – Trưởng phòng của một cơ quan cấp tỉnh có thẩm quyền thẩm định hồ sơ cấp phép – nhận 50.000.000 đồng từ giám đốc Công ty Y để cho qua hồ sơ còn thiếu điều kiện. Giám đốc Công ty Y không bị ông X ép buộc; sau đó, trước khi vụ việc bị phát giác, ông này tự đến cơ quan công an khai báo.","ask":[],"guide":[],"basis":"Khoản 1 Điều 354 BLHS; Điều 15 BLTTHS; Khoản 1 Điều 354 BLHS; Điều 364 BLHS","mcq":["TH5.02.1","TH5.02.2","TH5.02.3","TH5.02.4"]},{"cid":"TH5.03","title":"Đâm người gây thương tích nhẹ rồi hòa giải","text":"Do va chạm giao thông, Phong dùng dao gọt hoa quả đâm vào tay anh Quân. Kết luận giám định xác định tỷ lệ tổn thương cơ thể của anh Quân là 8%. Anh Quân làm đơn yêu cầu khởi tố. Trong giai đoạn điều tra, hai bên hòa giải, Phong bồi thường đầy đủ; anh Quân tự nguyện rút đơn yêu cầu khởi tố, không bị ép buộc.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 134 BLHS; Điểm a khoản 1 Điều 9 BLHS; Khoản 1 Điều 155 BLTTHS; Khoản 2 Điều 155 BLTTHS","mcq":["TH5.03.1","TH5.03.2","TH5.03.3","TH5.03.4"]}]},{"name":"Chương 6. Dự báo và phòng ngừa tội phạm","items":[{"cid":"TH6.01","title":"Số liệu trộm cắp tăng 20%","text":"Một địa phương ghi nhận số vụ trộm cắp tài sản năm 2025 tăng 20% so với năm 2024. Trong năm 2025, địa phương bắt đầu tiếp nhận tin báo tội phạm qua ứng dụng trực tuyến và mở đợt cao điểm tấn công tội phạm. Khảo sát nạn nhân năm 2024 cho thấy khoảng một nửa số vụ trộm cắp tài sản giá trị nhỏ không được trình báo. Nhóm nghiên cứu được giao dự báo tình hình năm 2026.","ask":[],"guide":[],"basis":"Giáo trình Tội phạm học","mcq":["TH6.01.1","TH6.01.2","TH6.01.3","TH6.01.4"]},{"cid":"TH6.02","title":"Phòng ngừa lừa đảo trực tuyến nhắm vào sinh viên","text":"Một trường đại học ghi nhận nhiều sinh viên năm thứ nhất bị lừa đảo qua mạng với các thủ đoạn giả danh công an, tuyển cộng tác viên \"việc nhẹ lương cao\", học bổng giả. Phần lớn nạn nhân mới đến thành phố, ít kinh nghiệm, thường chuyển tiền theo hướng dẫn qua điện thoại. Nhà trường muốn phối hợp cơ quan công an, gia đình và đoàn thể sinh viên xây dựng chương trình phòng ngừa.","ask":[],"guide":[],"basis":"Giáo trình Tội phạm học; Điều 4 BLHS","mcq":["TH6.02.1","TH6.02.2","TH6.02.3","TH6.02.4"]},{"cid":"TH6.03","title":"Trộm cắp xe máy tại khu nhà trọ","text":"Trong năm 2025, tại một khu nhà trọ công nhân ở xã K xảy ra 15 vụ trộm cắp xe máy. Phần lớn xe bị mất được để ngoài sân không khóa cổ, khu trọ không có đèn chiếu sáng và camera. Người bị bắt giữ trong các vụ việc chủ yếu là thanh niên thất nghiệp, nghiện ma túy, sống ở khu vực lân cận. Ủy ban nhân dân xã muốn xây dựng phương án phòng ngừa.","ask":[],"guide":[],"basis":"Giáo trình Tội phạm học; Điều 4 BLHS","mcq":["TH6.03.1","TH6.03.2","TH6.03.3","TH6.03.4"]}]}],"vb":[{"name":"Hiến pháp, bộ luật và luật","rows":[{"t":"Hiến pháp nước CHXHCN Việt Nam năm 2013 (sửa đổi, bổ sung năm 2025)","d":"28/11/2013","org":"Quốc hội","note":"Nguyên tắc suy đoán vô tội (Điều 31); quyền con người chỉ bị hạn chế theo luật (Điều 14)","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"t":"Bộ luật Hình sự số 100/2015/QH13","d":"27/11/2015","org":"Quốc hội","note":"Hiệu lực 01/01/2018; tra cứu bản hợp nhất 135/VBHN-VPQH ngày 05/9/2025","url":"https://thuvienphapluat.vn/van-ban/Trach-nhiem-hinh-su/Bo-luat-hinh-su-2015-296661.aspx"},{"t":"Luật số 12/2017/QH14 sửa đổi, bổ sung một số điều của Bộ luật Hình sự","d":"20/06/2017","org":"Quốc hội","note":"Hiệu lực 01/01/2018; đã được hợp nhất","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=12/2017/QH14&match=True"},{"t":"Luật số 86/2025/QH15 sửa đổi, bổ sung một số điều của Bộ luật Hình sự","d":"25/06/2025","org":"Quốc hội","note":"Hiệu lực 01/7/2025; bỏ tử hình 8 tội, bổ sung Điều 256a, sửa Điều 40, 49, 63; có điều khoản chuyển tiếp","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=86/2025/QH15&match=True"},{"t":"Luật Tư pháp người chưa thành niên số 59/2024/QH15","d":"30/11/2024","org":"Quốc hội","note":"Hiệu lực 01/01/2026; xử lý chuyển hướng, hình phạt đối với người chưa thành niên (Chương 4)","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=59/2024/QH15&match=True"},{"t":"Bộ luật Tố tụng hình sự số 101/2015/QH13 (đã sửa đổi, bổ sung)","d":"27/11/2015","org":"Quốc hội","note":"Trách nhiệm chứng minh, thủ tục giải quyết vụ án hình sự","url":"https://thuvienphapluat.vn/van-ban/Trach-nhiem-hinh-su/Bo-luat-to-tung-hinh-su-2015-296884.aspx"}]},{"name":"Văn bản hợp nhất và văn bản hướng dẫn","rows":[{"t":"Văn bản hợp nhất số 135/VBHN-VPQH – Bộ luật Hình sự","d":"05/09/2025","org":"Văn phòng Quốc hội","note":"Dùng khi tra cứu nội dung BLHS sau các lần sửa đổi","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%20135/VBHN-VPQH%20%E2%80%93%20B%E1%BB%99%20lu%E1%BA%ADt%20H%C3%ACnh%20s%E1%BB%B1&match=True"},{"t":"Văn bản hợp nhất số 107/VBHN-VPQH – Luật Tư pháp người chưa thành niên","d":"27/08/2025","org":"Văn phòng Quốc hội","note":"Tra cứu Luật 59/2024/QH15","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%20107/VBHN-VPQH%20%E2%80%93%20Lu%E1%BA%ADt%20T%C6%B0%20ph%C3%A1p%20ng%C6%B0%E1%BB%9Di%20ch%C6%B0a%20th%C3%A0nh%20ni%C3%AAn&match=True"},{"t":"Nghị quyết 02/2018/NQ-HĐTP hướng dẫn áp dụng Điều 65 BLHS về án treo (sửa đổi bởi Nghị quyết 01/2022/NQ-HĐTP)","d":"15/05/2018","org":"Hội đồng Thẩm phán TANDTC","note":"Điều kiện cho hưởng án treo, thời gian thử thách","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=02/2018/NQ-H%C4%90TP&match=True"},{"t":"Nghị quyết 04/2019/NQ-HĐTP về quy trình lựa chọn, công bố và áp dụng án lệ","d":"18/06/2019","org":"Hội đồng Thẩm phán TANDTC","note":"Vai trò của án lệ (Chương 1)","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=04/2019/NQ-H%C4%90TP&match=True"}]},{"name":"Tài liệu học thuật","rows":[{"t":"Giáo trình Tội phạm học, Trường Đại học Nội vụ Hà Nội","d":"2024","org":"","note":"Tài liệu học thuật cho Chương 6; không phải văn bản quy phạm pháp luật","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=T%E1%BB%99i%20ph%E1%BA%A1m%20h%E1%BB%8Dc"}]}],"al":[],"ly":{"root":"Luật Hình sự","ch":[{"t":"Chương 1. Những vấn đề cơ bản về luật hình sự","cs":"Điều 1–7 BLHS; khoản 1 Điều 31 Hiến pháp","b":["Luật hình sự là ngành luật quy định tội phạm, hình phạt và các chế định liên quan đến trách nhiệm hình sự (TNHS).","Văn bản tra cứu: BLHS 2015 (VBHN 135/VBHN-VPQH ngày 05/9/2025), Luật 12/2017/QH14, Luật 86/2025/QH15, Luật Tư pháp người chưa thành niên 59/2024/QH15."],"c":[{"t":"Đối tượng và phương pháp điều chỉnh","cs":"Điều 1, 2 BLHS","b":["Đối tượng: quan hệ xã hội phát sinh giữa Nhà nước và người (pháp nhân thương mại) phạm tội khi tội phạm được thực hiện.","Phương pháp: quyền uy – Nhà nước buộc người phạm tội chịu TNHS, không cần sự đồng ý của họ.","Phân biệt: luật hình sự là luật nội dung (tội phạm, hình phạt); luật tố tụng hình sự là luật hình thức (trình tự, thủ tục)."]},{"t":"Nhiệm vụ và nguyên tắc","cs":"Điều 1, 2, 3, 4 BLHS","b":["Nhiệm vụ (Điều 1): bảo vệ chủ quyền, an ninh, chế độ, quyền con người, quyền công dân…; giáo dục ý thức tuân theo pháp luật, phòng ngừa tội phạm.","Nguyên tắc pháp chế (Điều 2): chỉ người phạm một tội đã được BLHS quy định mới chịu TNHS; pháp nhân thương mại chỉ chịu TNHS về các tội tại Điều 76.","Nguyên tắc xử lý (Điều 3): phát hiện kịp thời, xử lý nhanh chóng, công minh; bình đẳng; nghiêm trị người chủ mưu, cầm đầu, côn đồ, tái phạm nguy hiểm…; khoan hồng với người tự thú, thành khẩn, lập công, tự nguyện khắc phục.","Trách nhiệm phòng ngừa (Điều 4) thuộc về cơ quan nhà nước, tổ chức và mọi công dân."]},{"t":"Nguồn của luật hình sự","cs":"Điều 2 BLHS; Nghị quyết 04/2019/NQ-HĐTP","b":["BLHS là nguồn duy nhất quy định tội phạm và hình phạt; nghị định chỉ quy định vi phạm hành chính.","Nghị quyết của Hội đồng Thẩm phán TAND tối cao hướng dẫn áp dụng thống nhất; án lệ được nghiên cứu, áp dụng nhưng không tạo tội danh mới.","Cấm áp dụng tương tự pháp luật để buộc tội."]},{"t":"Hiệu lực theo không gian","cs":"Điều 5, 6 BLHS","b":["Mọi hành vi phạm tội thực hiện trên lãnh thổ Việt Nam (hành vi hoặc hậu quả xảy ra trên lãnh thổ) đều bị xử lý theo BLHS; áp dụng cả trên tàu bay, tàu biển mang quốc tịch Việt Nam, vùng đặc quyền kinh tế, thềm lục địa.","Người hưởng quyền miễn trừ ngoại giao, lãnh sự: giải quyết theo điều ước, tập quán quốc tế hoặc con đường ngoại giao.","Công dân, pháp nhân thương mại Việt Nam phạm tội ở nước ngoài có thể bị truy cứu theo BLHS (khoản 1 Điều 6); người nước ngoài phạm tội ở nước ngoài xâm hại lợi ích Việt Nam cũng có thể bị truy cứu (khoản 2)."]},{"t":"Hiệu lực theo thời gian","cs":"Điều 7 BLHS; Luật 86/2025/QH15","b":["Áp dụng điều luật có hiệu lực tại thời điểm thực hiện hành vi phạm tội.","Không hồi tố điều luật bất lợi: tội phạm mới, hình phạt nặng hơn, tình tiết tăng nặng mới, hạn chế án treo, miễn TNHS…","Hồi tố điều luật có lợi: xóa bỏ tội phạm, hình phạt; hình phạt nhẹ hơn; tình tiết giảm nhẹ mới; mở rộng miễn TNHS, án treo, xóa án tích…","Ví dụ: Luật 86/2025/QH15 (hiệu lực 01/7/2025) bỏ tử hình 8 tội – áp dụng cho cả hành vi trước ngày đó chưa xét xử."]}]},{"t":"Chương 2. Tội phạm và trách nhiệm hình sự","cs":"Điều 8–29, 74–76 BLHS","b":["Tội phạm là hành vi nguy hiểm cho xã hội, được quy định trong BLHS, có lỗi, do chủ thể có năng lực TNHS (hoặc pháp nhân thương mại) thực hiện, phải chịu hình phạt."],"c":[{"t":"Khái niệm và phân loại tội phạm","cs":"Điều 8, 9 BLHS","b":["Dấu hiệu: tính nguy hiểm cho xã hội; tính có lỗi; tính trái pháp luật hình sự; tính phải chịu hình phạt.","Hành vi có dấu hiệu tội phạm nhưng tính nguy hiểm không đáng kể thì không phải tội phạm (khoản 2 Điều 8).","Phân loại theo mức cao nhất của khung: ít nghiêm trọng (đến 03 năm tù), nghiêm trọng (trên 03–07 năm), rất nghiêm trọng (trên 07–15 năm), đặc biệt nghiêm trọng (trên 15–20 năm, chung thân, tử hình)."]},{"t":"Cấu thành tội phạm","cs":"Điều 8 BLHS; Phần các tội phạm","b":["Bốn yếu tố: khách thể (quan hệ xã hội bị xâm hại); mặt khách quan (hành vi, hậu quả, quan hệ nhân quả, công cụ, thủ đoạn, thời gian, địa điểm); chủ thể (năng lực TNHS, tuổi, chủ thể đặc biệt); mặt chủ quan (lỗi, động cơ, mục đích).","Cấu thành vật chất (hậu quả là dấu hiệu bắt buộc) và cấu thành hình thức (hoàn thành khi thực hiện hành vi, ví dụ tội cướp tài sản)."]},{"t":"Lỗi","cs":"Điều 10, 11, 20 BLHS","b":["Cố ý trực tiếp: thấy trước hậu quả và mong muốn; cố ý gián tiếp: thấy trước, không mong muốn nhưng để mặc.","Vô ý vì quá tự tin: thấy trước nhưng cho rằng không xảy ra hoặc ngăn ngừa được; vô ý do cẩu thả: không thấy trước dù phải thấy trước và có thể thấy trước.","Sự kiện bất ngờ (Điều 20): không thể hoặc không buộc phải thấy trước hậu quả – không có lỗi, không chịu TNHS."]},{"t":"Chủ thể của tội phạm","cs":"Điều 12, 13, 21, 75 BLHS","b":["Từ đủ 16 tuổi: chịu TNHS về mọi tội phạm (trừ luật quy định khác).","Từ đủ 14 đến dưới 16 tuổi: chỉ chịu TNHS về tội rất nghiêm trọng, đặc biệt nghiêm trọng tại danh mục khoản 2 Điều 12 (Điều 123, 134, 141, 142, 168, 169, 170, 171, 173, 178, 248–252…).","Tình trạng không có năng lực TNHS (Điều 21) – không chịu TNHS; say rượu, bia, chất kích thích (Điều 13) – vẫn chịu TNHS.","Pháp nhân thương mại chịu TNHS khi: nhân danh pháp nhân; vì lợi ích pháp nhân; có sự chỉ đạo, điều hành, chấp thuận; chưa hết thời hiệu (Điều 75); TNHS pháp nhân không loại trừ TNHS cá nhân."]},{"t":"Các giai đoạn thực hiện tội phạm","cs":"Điều 14, 15, 16, 57 BLHS","b":["Chuẩn bị phạm tội: tìm kiếm, sửa soạn công cụ, phương tiện, tạo điều kiện; chỉ chịu TNHS ở các tội tại khoản 2, 3 Điều 14 (người 14–16 tuổi: Điều 123, 168).","Phạm tội chưa đạt: không thực hiện được đến cùng vì nguyên nhân ngoài ý muốn; hình phạt theo Điều 57 (khung có tử hình, chung thân → không quá 20 năm tù; tù có thời hạn → không quá 3/4).","Tự ý nửa chừng chấm dứt (Điều 16): tự mình dừng lại dù không có gì ngăn cản → miễn TNHS về tội định phạm."]},{"t":"Đồng phạm","cs":"Điều 17, 18, 19, 58 BLHS","b":["Đồng phạm: hai người trở lên cố ý cùng thực hiện một tội phạm; phạm tội có tổ chức là hình thức đồng phạm có câu kết chặt chẽ.","Người tổ chức, người thực hành, người xúi giục, người giúp sức (khoản 3 Điều 17).","Che giấu tội phạm (Điều 18), không tố giác (Điều 19) không phải đồng phạm nếu không hứa hẹn trước; thân nhân (ông bà, cha mẹ, con, cháu, anh chị em ruột, vợ chồng) không chịu TNHS về che giấu, trừ tội xâm phạm ANQG và tội đặc biệt nghiêm trọng khác.","Quyết định hình phạt cá thể hóa theo vai trò, mức độ tham gia của từng người (Điều 58)."]},{"t":"Những trường hợp loại trừ TNHS","cs":"Điều 20–26 BLHS","b":["Sự kiện bất ngờ; tình trạng không có năng lực TNHS; phòng vệ chính đáng; tình thế cấp thiết; gây thiệt hại khi bắt giữ người phạm tội; rủi ro trong nghiên cứu, thử nghiệm; thi hành mệnh lệnh của người chỉ huy, cấp trên.","Phòng vệ chính đáng: chống trả cần thiết người đang xâm phạm; vượt quá giới hạn thì chịu TNHS (Điều 126, 136).","Tình thế cấp thiết: gây thiệt hại nhỏ hơn thiệt hại cần ngăn ngừa khi không còn cách nào khác."]},{"t":"Thời hiệu và miễn TNHS","cs":"Điều 27, 28, 29 BLHS","b":["Thời hiệu truy cứu: 05 – 10 – 15 – 20 năm theo bốn loại tội, tính từ ngày phạm tội; tính lại khi phạm tội mới có mức cao nhất trên 01 năm tù hoặc khi bỏ trốn có truy nã.","Không áp dụng thời hiệu: tội xâm phạm ANQG; tội phá hoại hòa bình, chống loài người, tội phạm chiến tranh; tham ô, nhận hối lộ khoản 3, 4.","Miễn TNHS bắt buộc (khoản 1 Điều 29): thay đổi chính sách, pháp luật; đại xá. Có thể miễn (khoản 2, 3): chuyển biến tình hình, bệnh hiểm nghèo, tự thú lập công; tội ít nghiêm trọng hoặc nghiêm trọng do vô ý được bị hại hòa giải, đề nghị miễn."]}]},{"t":"Chương 3. Hình phạt và các biện pháp tư pháp","cs":"Điều 30–73, 77–89 BLHS; Luật 86/2025/QH15","b":["Hình phạt là biện pháp cưỡng chế nghiêm khắc nhất của Nhà nước, chỉ do Tòa án quyết định (Điều 30); mục đích: trừng trị, giáo dục, phòng ngừa (Điều 31)."],"c":[{"t":"Hệ thống hình phạt","cs":"Điều 32, 33 BLHS","b":["Người phạm tội – hình phạt chính: cảnh cáo, phạt tiền, cải tạo không giam giữ, trục xuất, tù có thời hạn, tù chung thân, tử hình; bổ sung: cấm đảm nhiệm chức vụ, cấm hành nghề, cấm cư trú, quản chế, tước một số quyền công dân, tịch thu tài sản, phạt tiền, trục xuất.","Pháp nhân thương mại – chính: phạt tiền, đình chỉ hoạt động có thời hạn (06 tháng–03 năm), đình chỉ hoạt động vĩnh viễn; bổ sung: cấm kinh doanh, cấm hoạt động trong lĩnh vực nhất định, cấm huy động vốn, phạt tiền.","Mỗi tội chỉ một hình phạt chính, có thể kèm một hoặc nhiều hình phạt bổ sung."]},{"t":"Nội dung từng hình phạt chính","cs":"Điều 34–40 BLHS","b":["Cảnh cáo: tội ít nghiêm trọng, nhiều tình tiết giảm nhẹ, chưa đến mức miễn hình phạt.","Phạt tiền: không thấp hơn 1.000.000 đồng; Luật 86/2025/QH15 nâng gấp đôi mức phạt tiền ở 24 điều luật.","Cải tạo không giam giữ: 06 tháng – 03 năm; khấu trừ 05%–20% thu nhập; 01 ngày tạm giam = 03 ngày cải tạo không giam giữ.","Tù có thời hạn: 03 tháng – 20 năm; 01 ngày tạm giam = 01 ngày tù.","Tù chung thân và tử hình không áp dụng với người dưới 18 tuổi khi phạm tội; tử hình không áp dụng với phụ nữ có thai, nuôi con dưới 36 tháng, người đủ 75 tuổi; không thi hành với các đối tượng này và người mắc ung thư giai đoạn cuối (sửa đổi 2025).","Luật 86/2025/QH15 bỏ tử hình ở 8 tội: Điều 109, 110, 114, 194, 250, 353, 354, 421."]},{"t":"Biện pháp tư pháp","cs":"Điều 46–49 BLHS","b":["Tịch thu vật, tiền trực tiếp liên quan đến tội phạm (công cụ, phương tiện, vật do phạm tội mà có, vật cấm lưu hành).","Trả lại tài sản, sửa chữa, bồi thường thiệt hại; buộc công khai xin lỗi.","Bắt buộc chữa bệnh: người không có năng lực TNHS khi phạm tội (khoản 1 Điều 49) hoặc mắc bệnh sau khi phạm tội (khoản 2, 3).","Biện pháp tư pháp không phải hình phạt, không để lại án tích."]},{"t":"Quyết định hình phạt","cs":"Điều 50–59 BLHS","b":["Căn cứ: quy định của BLHS, tính chất, mức độ hành vi, nhân thân, tình tiết giảm nhẹ (Điều 51), tăng nặng (Điều 52); tình tiết đã định tội, định khung không được dùng lại.","Dưới mức thấp nhất của khung (Điều 54): có ít nhất hai tình tiết giảm nhẹ khoản 1 Điều 51 – trong khung liền kề nhẹ hơn; nếu khung nhẹ nhất thì có thể dưới mức thấp nhất hoặc chuyển hình phạt nhẹ hơn.","Tổng hợp nhiều tội (Điều 55): tù tổng hợp không quá 30 năm; cải tạo không giam giữ không quá 03 năm; 03 ngày cải tạo không giam giữ = 01 ngày tù khi tổng hợp.","Tổng hợp nhiều bản án (Điều 56); chuẩn bị, chưa đạt (Điều 57); đồng phạm (Điều 58); miễn hình phạt (Điều 59)."]},{"t":"Chấp hành, án treo, xóa án tích","cs":"Điều 60–73 BLHS","b":["Thời hiệu thi hành bản án: 05 năm (phạt tiền, CTKGG, tù đến 03 năm), 10 năm (tù trên 03–15 năm), 15 năm (tù trên 15–30 năm); không áp dụng với chung thân, tử hình.","Án treo: tù không quá 03 năm, thời gian thử thách 01–05 năm (Điều 65).","Đương nhiên xóa án tích (Điều 70): 01 năm (cảnh cáo, phạt tiền, CTKGG, án treo); 02 năm (tù đến 05 năm); 03 năm (tù trên 05–15 năm); 05 năm (tù trên 15 năm, chung thân, tử hình đã giảm)."]}]},{"t":"Chương 4. Xử lý hình sự đối với người chưa thành niên","cs":"Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 12, 39, 40 BLHS","b":["Từ 01/01/2026, Luật Tư pháp người chưa thành niên quy định xử lý chuyển hướng, hình phạt, thủ tục và tái hòa nhập đối với người dưới 18 tuổi; áp dụng cùng BLHS, BLTTHS."],"c":[{"t":"Nguyên tắc xử lý","cs":"Điều 5, 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15","b":["Bảo đảm lợi ích tốt nhất của người chưa thành niên; mục đích chủ yếu là giáo dục, phục hồi, tái hòa nhập.","Ưu tiên xử lý chuyển hướng; hình phạt chỉ áp dụng khi xử lý chuyển hướng không hiệu quả; ưu tiên cảnh cáo, phạt tiền, CTKGG, tù cho hưởng án treo.","Không áp dụng tù chung thân, tử hình; không áp dụng hình phạt bổ sung.","Bảo đảm bí mật cá nhân, đời sống riêng tư; hạn chế biện pháp ngăn chặn, cưỡng chế."]},{"t":"Xử lý chuyển hướng","cs":"Điều 35–39 Luật Tư pháp người chưa thành niên số 59/2024/QH15","b":["12 biện pháp: khiển trách; xin lỗi bị hại; bồi thường thiệt hại; giáo dục tại xã, phường, thị trấn; quản thúc tại gia đình; hạn chế khung giờ đi lại; cấm tiếp xúc; cấm đến địa điểm; tham gia chương trình học tập, dạy nghề; điều trị hoặc tư vấn tâm lý; công việc phục vụ cộng đồng; giáo dục tại trường giáo dưỡng.","Điều kiện (Điều 39): có căn cứ xác định hành vi phạm tội; người chưa thành niên thừa nhận; đồng ý bằng văn bản.","Không áp dụng (Điều 38): người 14–16 tuổi phạm tội rất nghiêm trọng thuộc giết người, hiếp dâm, sản xuất ma túy…, phạm tội rất nghiêm trọng từ 02 lần trở lên, phạm tội đặc biệt nghiêm trọng; người 16–18 tuổi tái phạm, phạm tội rất nghiêm trọng do cố ý, đặc biệt nghiêm trọng…; người đã được xử lý chuyển hướng mà phạm tội mới.","Không áp dụng nếu tại thời điểm xem xét người đó đã đủ 18 tuổi."]},{"t":"Hình phạt đối với người chưa thành niên","cs":"Điều 115–122 Luật Tư pháp người chưa thành niên số 59/2024/QH15","b":["Bốn hình phạt: cảnh cáo, phạt tiền, cải tạo không giam giữ, tù có thời hạn; mỗi tội một hình phạt chính.","Phạt tiền áp dụng cả người 14–16 tuổi có thu nhập, tài sản riêng; mức tối đa 1/2 (16–18 tuổi), 1/3 (14–16 tuổi) mức điều luật.","Tù có thời hạn (Điều 119): 16–18 tuổi – không quá 15 năm (khung chung thân, tử hình) hoặc 3/5 mức tù; 14–16 tuổi – không quá 09 năm hoặc 2/5. Riêng giết người, hiếp dâm, hiếp dâm người dưới 16 tuổi, cưỡng dâm người 13–16 tuổi, sản xuất ma túy: 18 năm, 3/4 (16–18) và 12 năm, 1/2 (14–16).","Tổng hợp nhiều tội (Điều 121): không quá 18 năm (16–18 tuổi), 12 năm (14–16 tuổi); có tội trước và sau 16 tuổi – không quá 18 năm."]}]},{"t":"Chương 5. Giới thiệu một số nhóm tội phạm cụ thể","cs":"Phần thứ hai BLHS","b":["Phương pháp học: so sánh khách thể, mặt khách quan, chủ thể, mặt chủ quan và tình tiết định khung giữa các tội gần nhau."],"c":[{"t":"Các tội xâm phạm an ninh quốc gia","cs":"Chương XIII BLHS (Điều 108–122)","b":["Khách thể: độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ, chế độ chính trị, chế độ kinh tế, nền văn hóa, quốc phòng, an ninh, đối ngoại.","Lỗi cố ý trực tiếp; nhiều tội có mục đích chống chính quyền nhân dân; chuẩn bị phạm tội cũng bị xử lý; không áp dụng thời hiệu.","Từ 01/7/2025, Điều 109, 110, 114 không còn hình phạt tử hình."]},{"t":"Các tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự","cs":"Chương XIV BLHS","b":["Giết người (Điều 123) – cố ý đối với hậu quả chết người; phân biệt cố ý gây thương tích dẫn đến chết người (khoản 4 Điều 134) – vô ý đối với cái chết.","Các tội giết người có tình tiết giảm nhẹ đặc biệt: trong trạng thái tinh thần bị kích động mạnh (Điều 125), do vượt quá giới hạn phòng vệ chính đáng (Điều 126).","Cố ý gây thương tích (Điều 134): tỷ lệ tổn thương cơ thể từ 11% hoặc dưới 11% thuộc các trường hợp luật định.","Làm nhục người khác (Điều 155), vu khống (Điều 156) xâm phạm danh dự, nhân phẩm."]},{"t":"Các tội xâm phạm sở hữu","cs":"Chương XVI BLHS","b":["Nhóm chiếm đoạt có dùng vũ lực: cướp (Điều 168 – vũ lực ngay tức khắc, cấu thành hình thức), bắt cóc nhằm chiếm đoạt (Điều 169), cưỡng đoạt (Điều 170 – uy hiếp tinh thần, không ngay tức khắc).","Nhóm chiếm đoạt không dùng vũ lực: cướp giật (171 – công khai, nhanh chóng), công nhiên chiếm đoạt (172), trộm cắp (173 – lén lút, từ 2 triệu), lừa đảo (174 – gian dối trước khi nhận tài sản, từ 2 triệu), lạm dụng tín nhiệm (175 – nhận hợp pháp rồi chiếm đoạt, từ 4 triệu).","Nhóm không chiếm đoạt: hủy hoại hoặc cố ý làm hư hỏng tài sản (178)…"]},{"t":"Các tội xâm phạm an toàn, trật tự công cộng và trật tự quản lý hành chính","cs":"Chương XXI, XXII BLHS; Luật 86/2025/QH15","b":["Vi phạm quy định về tham gia giao thông đường bộ (Điều 260): lỗi vô ý đối với hậu quả; cần chứng minh vi phạm, hậu quả, quan hệ nhân quả.","Tội phạm về ma túy (Chương XX): Luật 86/2025/QH15 bổ sung Điều 256a – sử dụng trái phép chất ma túy (chỉ trong các trường hợp đang cai nghiện, quản lý sau cai…), bổ sung Ketamine, Fentanyl; Điều 250 không còn tử hình.","Đánh bạc (Điều 321): từ 5 triệu đồng; gây rối trật tự công cộng (Điều 318); chống người thi hành công vụ (Điều 330)."]},{"t":"Các tội phạm về chức vụ","cs":"Chương XXIII BLHS (Điều 352–366)","b":["Khách thể: hoạt động đúng đắn của cơ quan, tổ chức; chủ thể đặc biệt – người có chức vụ, quyền hạn.","Tham ô (Điều 353): chiếm đoạt tài sản mình có trách nhiệm quản lý; nhận hối lộ (Điều 354): nhận lợi ích để làm/không làm theo yêu cầu người đưa; từ 01/7/2025 hai tội này không còn tử hình; người bị chung thân chỉ được xét giảm khi nộp lại ít nhất 3/4 tài sản và hợp tác tích cực.","Đưa hối lộ (Điều 364): bị ép buộc mà chủ động khai báo trước khi bị phát giác – không có tội; không bị ép buộc nhưng chủ động khai báo – có thể được miễn TNHS."]}]},{"t":"Chương 6. Dự báo và phòng ngừa tội phạm","cs":"Giáo trình Tội phạm học; Điều 4 BLHS","b":["Nội dung học thuật của tội phạm học, không phải quy phạm pháp luật; vận dụng để hiểu chính sách hình sự."],"c":[{"t":"Dự báo tội phạm","cs":"Giáo trình Tội phạm học","b":["Khái niệm: nhận định có căn cứ khoa học về trạng thái, xu hướng, cơ cấu tội phạm trong tương lai.","Căn cứ: số liệu tình hình tội phạm, nguyên nhân, điều kiện, yếu tố kinh tế – xã hội; lưu ý tội phạm ẩn và thay đổi cách ghi nhận.","Phương pháp: thống kê (ngoại suy, chuỗi thời gian), chuyên gia, mô hình hóa; dự báo ngắn hạn, trung hạn, dài hạn.","Kết quả phải nêu giả định, phương pháp, giới hạn và độ bất định."]},{"t":"Phòng ngừa tội phạm","cs":"Giáo trình Tội phạm học; Điều 4 BLHS","b":["Khái niệm: hệ thống biện pháp tác động vào nguyên nhân, điều kiện của tội phạm nhằm ngăn chặn, hạn chế tội phạm.","Nguyên tắc: pháp chế, tôn trọng quyền con người, khoa học, phối hợp đồng bộ, kết hợp phòng ngừa chung và riêng.","Biện pháp: phòng ngừa xã hội (kinh tế, giáo dục, văn hóa), phòng ngừa nghiệp vụ (cơ quan chuyên trách), phòng ngừa tình huống (giảm cơ hội phạm tội).","Chủ thể: Nhà nước, cơ quan chức năng, tổ chức, gia đình, nhà trường, công dân; đánh giá hiệu quả bằng chỉ báo, dữ liệu trước – sau."]}]}],"upd":{"t":"Điểm cập nhật cần lưu ý","cs":"Đối chiếu văn bản tại ngày 29/10/2026","b":["Luật 86/2025/QH15 (hiệu lực 01/7/2025): bỏ tử hình ở 8 tội (Điều 109, 110, 114, 194, 250, 353, 354, 421); bổ sung trường hợp không thi hành án tử hình với người mắc ung thư giai đoạn cuối; nâng gấp đôi phạt tiền ở 24 điều; bổ sung Điều 256a; sửa Điều 49, Điều 63.","Luật Tư pháp người chưa thành niên 59/2024/QH15 (hiệu lực 01/01/2026): thay thế cơ chế xử lý người dưới 18 tuổi phạm tội tại Chương XII BLHS bằng xử lý chuyển hướng và hệ thống hình phạt riêng (Điều 115–122).","Giáo trình xuất bản trước 2025 có thể còn trình bày quy định cũ về tử hình và người dưới 18 tuổi phạm tội; khi làm bài phải theo văn bản đang có hiệu lực tại thời điểm hành vi và quy định hồi tố có lợi.","Chưa ghi nhận luật sửa đổi BLHS nào được thông qua trong năm 2026 tính đến ngày cập nhật."]}}}</script>
