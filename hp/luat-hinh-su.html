HS về che giấu, trừ tội xâm phạm ANQG và tội đặc biệt nghiêm trọng khác.","Quyết định hình phạt cá thể hóa theo vai trò, mức độ tham gia của từng người (Điều 58)."]},{"t":"Những trường hợp loại trừ TNHS","cs":"Điều 20–26 BLHS","b":["Sự kiện bất ngờ; tình trạng không có năng lực TNHS; phòng vệ chính đáng; tình thế cấp thiết; gây thiệt hại khi bắt giữ người phạm tội; rủi ro trong nghiên cứu, thử nghiệm; thi hành mệnh lệnh của người chỉ huy, cấp trên.","Phòng vệ chính đáng: chống trả cần thiết người đang xâm phạm; vượt quá giới hạn thì chịu TNHS (Điều 126, 136).","Tình thế cấp thiết: gây thiệt hại nhỏ hơn thiệt hại cần ngăn ngừa khi không còn cách nào khác."]},{"t":"Thời hiệu và miễn TNHS","cs":"Điều 27, 28, 29 BLHS","b":["Thời hiệu truy cứu: 05 – 10 – 15 – 20 năm theo bốn loại tội, tính từ ngày phạm tội; tính lại khi phạm tội mới có mức cao nhất trên 01 năm tù hoặc khi bỏ trốn có truy nã.","Không áp dụng thời hiệu: tội xâm phạm ANQG; tội phá hoại hòa bình, chống loài người, tội phạm chiến tranh; tham ô, nhận hối lộ khoản 3, 4.","Miễn TNHS bắt buộc (khoản 1 Điều 29): thay đổi chính sách, pháp luật; đại xá. Có thể miễn (khoản 2, 3): chuyển biến tình hình, bệnh hiểm nghèo, tự thú lập công; tội ít nghiêm trọng hoặc nghiêm trọng do vô ý được bị hại hòa giải, đề nghị miễn."]}]},{"t":"Chương 3. Hình phạt và các biện pháp tư pháp","cs":"Điều 30–73, 77–89 BLHS; Luật 86/2025/QH15","b":["Hình phạt là biện pháp cưỡng chế nghiêm khắc nhất của Nhà nước, chỉ do Tòa án quyết định (Điều 30); mục đích: trừng trị, giáo dục, phòng ngừa (Điều 31)."],"c":[{"t":"Hệ thống hình phạt","cs":"Điều 32, 33 BLHS","b":["Người phạm tội – hình phạt chính: cảnh cáo, phạt tiền, cải tạo không giam giữ, trục xuất, tù có thời hạn, tù chung thân, tử hình; bổ sung: cấm đảm nhiệm chức vụ, cấm hành nghề, cấm cư trú, quản chế, tước một số quyền công dân, tịch thu tài sản, phạt tiền, trục xuất.","Pháp nhân thương mại – chính: phạt tiền, đình chỉ hoạt động có thời hạn (06 tháng–03 năm), đình chỉ hoạt động vĩnh viễn; bổ sung: cấm kinh doanh, cấm hoạt động trong lĩnh vực nhất định, cấm huy động vốn, phạt tiền.","Mỗi tội chỉ một hình phạt chính, có thể kèm một hoặc nhiều hình phạt bổ sung."]},{"t":"Nội dung từng hình phạt chính","cs":"Điều 34–40 BLHS","b":["Cảnh cáo: tội ít nghiêm trọng, nhiều tình tiết giảm nhẹ, chưa đến mức miễn hình phạt.","Phạt tiền: không thấp hơn 1.000.000 đồng; Luật 86/2025/QH15 nâng gấp đôi mức phạt tiền ở 24 điều luật.","Cải tạo không giam giữ: 06 tháng – 03 năm; khấu trừ 05%–20% thu nhập; 01 ngày tạm giam = 03 ngày cải tạo không giam giữ.","Tù có thời hạn: 03 tháng – 20 năm; 01 ngày tạm giam = 01 ngày tù.","Tù chung thân và tử hình không áp dụng với người dưới 18 tuổi khi phạm tội; tử hình không áp dụng với phụ nữ có thai, nuôi con dưới 36 tháng, người đủ 75 tuổi; không thi hành với các đối tượng này và người mắc ung thư giai đoạn cuối (sửa đổi 2025).","Luật 86/2025/QH15 bỏ tử hình ở 8 tội: Điều 109, 110, 114, 194, 250, 353, 354, 421."]},{"t":"Biện pháp tư pháp","cs":"Điều 46–49 BLHS","b":["Tịch thu vật, tiền trực tiếp liên quan đến tội phạm (công cụ, phương tiện, vật do phạm tội mà có, vật cấm lưu hành).","Trả lại tài sản, sửa chữa, bồi thường thiệt hại; buộc công khai xin lỗi.","Bắt buộc chữa bệnh: người không có năng lực TNHS khi phạm tội (khoản 1 Điều 49) hoặc mắc bệnh sau khi phạm tội (khoản 2, 3).","Biện pháp tư pháp không phải hình phạt, không để lại án tích."]},{"t":"Quyết định hình phạt","cs":"Điều 50–59 BLHS","b":["Căn cứ: quy định của BLHS, tính chất, mức độ hành vi, nhân thân, tình tiết giảm nhẹ (Điều 51), tăng nặng (Điều 52); tình tiết đã định tội, định khung không được dùng lại.","Dưới mức thấp nhất của khung (Điều 54): có ít nhất hai tình tiết giảm nhẹ khoản 1 Điều 51 – trong khung liền kề nhẹ hơn; nếu khung nhẹ nhất thì có thể dưới mức thấp nhất hoặc chuyển hình phạt nhẹ hơn.","Tổng hợp nhiều tội (Điều 55): tù tổng hợp không quá 30 năm; cải tạo không giam giữ không quá 03 năm; 03 ngày cải tạo không giam giữ = 01 ngày tù khi tổng hợp.","Tổng hợp nhiều bản án (Điều 56); chuẩn bị, chưa đạt (Điều 57); đồng phạm (Điều 58); miễn hình phạt (Điều 59)."]},{"t":"Chấp hành, án treo, xóa án tích","cs":"Điều 60–73 BLHS","b":["Thời hiệu thi hành bản án: 05 năm (phạt tiền, CTKGG, tù đến 03 năm), 10 năm (tù trên 03–15 năm), 15 năm (tù trên 15–30 năm); không áp dụng với chung thân, tử hình.","Án treo: tù không quá 03 năm, thời gian thử thách 01–05 năm (Điều 65).","Đương nhiên xóa án tích (Điều 70): 01 năm (cảnh cáo, phạt tiền, CTKGG, án treo); 02 năm (tù đến 05 năm); 03 năm (tù trên 05–15 năm); 05 năm (tù trên 15 năm, chung thân, tử hình đã giảm)."]}]},{"t":"Chương 4. Xử lý hình sự đối với người chưa thành niên","cs":"Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 12, 39, 40 BLHS","b":["Từ 01/01/2026, Luật Tư pháp người chưa thành niên quy định xử lý chuyển hướng, hình phạt, thủ tục và tái hòa nhập đối với người dưới 18 tuổi; áp dụng cùng BLHS, BLTTHS."],"c":[{"t":"Nguyên tắc xử lý","cs":"Điều 5, 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15","b":["Bảo đảm lợi ích tốt nhất của người chưa thành niên; mục đích chủ yếu là giáo dục, phục hồi, tái hòa nhập.","Ưu tiên xử lý chuyển hướng; hình phạt chỉ áp dụng khi xử lý chuyển hướng không hiệu quả; ưu tiên cảnh cáo, phạt tiền, CTKGG, tù cho hưởng án treo.","Không áp dụng tù chung thân, tử hình; không áp dụng hình phạt bổ sung.","Bảo đảm bí mật cá nhân, đời sống riêng tư; hạn chế biện pháp ngăn chặn, cưỡng chế."]},{"t":"Xử lý chuyển hướng","cs":"Điều 35–39 Luật Tư pháp người chưa thành niên số 59/2024/QH15","b":["12 biện pháp: khiển trách; xin lỗi bị hại; bồi thường thiệt hại; giáo dục tại xã, phường, thị trấn; quản thúc tại gia đình; hạn chế khung giờ đi lại; cấm tiếp xúc; cấm đến địa điểm; tham gia chương trình học tập, dạy nghề; điều trị hoặc tư vấn tâm lý; công việc phục vụ cộng đồng; giáo dục tại trường giáo dưỡng.","Điều kiện (Điều 39): có căn cứ xác định hành vi phạm tội; người chưa thành niên thừa nhận; đồng ý bằng văn bản.","Không áp dụng (Điều 38): người 14–16 tuổi phạm tội rất nghiêm trọng thuộc giết người, hiếp dâm, sản xuất ma túy…, phạm tội rất nghiêm trọng từ 02 lần trở lên, phạm tội đặc biệt nghiêm trọng; người 16–18 tuổi tái phạm, phạm tội rất nghiêm trọng do cố ý, đặc biệt nghiêm trọng…; người đã được xử lý chuyển hướng mà phạm tội mới.","Không áp dụng nếu tại thời điểm xem xét người đó đã đủ 18 tuổi."]},{"t":"Hình phạt đối với người chưa thành niên","cs":"Điều 115–122 Luật Tư pháp người chưa thành niên số 59/2024/QH15","b":["Bốn hình phạt: cảnh cáo, phạt tiền, cải tạo không giam giữ, tù có thời hạn; mỗi tội một hình phạt chính.","Phạt tiền áp dụng cả người 14–16 tuổi có thu nhập, tài sản riêng; mức tối đa 1/2 (16–18 tuổi), 1/3 (14–16 tuổi) mức điều luật.","Tù có thời hạn (Điều 119): 16–18 tuổi – không quá 15 năm (khung chung thân, tử hình) hoặc 3/5 mức tù; 14–16 tuổi – không quá 09 năm hoặc 2/5. Riêng giết người, hiếp dâm, hiếp dâm người dưới 16 tuổi, cưỡng dâm người 13–16 tuổi, sản xuất ma túy: 18 năm, 3/4 (16–18) và 12 năm, 1/2 (14–16).","Tổng hợp nhiều tội (Điều 121): không quá 18 năm (16–18 tuổi), 12 năm (14–16 tuổi); có tội trước và sau 16 tuổi – không quá 18 năm."]}]},{"t":"Chương 5. Giới thiệu một số nhóm tội phạm cụ thể","cs":"Phần thứ hai BLHS","b":["Phương pháp học: so sánh khách thể, mặt khách quan, chủ thể, mặt chủ quan và tình tiết định khung giữa các tội gần nhau."],"c":[{"t":"Các tội xâm phạm an ninh quốc gia","cs":"Chương XIII BLHS (Điều 108–122)","b":["Khách thể: độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ, chế độ chính trị, chế độ kinh tế, nền văn hóa, quốc phòng, an ninh, đối ngoại.","Lỗi cố ý trực tiếp; nhiều tội có mục đích chống chính quyền nhân dân; chuẩn bị phạm tội cũng bị xử lý; không áp dụng thời hiệu.","Từ 01/7/2025, Điều 109, 110, 114 không còn hình phạt tử hình."]},{"t":"Các tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự","cs":"Chương XIV BLHS","b":["Giết người (Điều 123) – cố ý đối với hậu quả chết người; phân biệt cố ý gây thương tích dẫn đến chết người (khoản 4 Điều 134) – vô ý đối với cái chết.","Các tội giết người có tình tiết giảm nhẹ đặc biệt: trong trạng thái tinh thần bị kích động mạnh (Điều 125), do vượt quá giới hạn phòng vệ chính đáng (Điều 126).","Cố ý gây thương tích (Điều 134): tỷ lệ tổn thương cơ thể từ 11% hoặc dưới 11% thuộc các trường hợp luật định.","Làm nhục người khác (Điều 155), vu khống (Điều 156) xâm phạm danh dự, nhân phẩm."]},{"t":"Các tội xâm phạm sở hữu","cs":"Chương XVI BLHS","b":["Nhóm chiếm đoạt có dùng vũ lực: cướp (Điều 168 – vũ lực ngay tức khắc, cấu thành hình thức), bắt cóc nhằm chiếm đoạt (Điều 169), cưỡng đoạt (Điều 170 – uy hiếp tinh thần, không ngay tức khắc).","Nhóm chiếm đoạt không dùng vũ lực: cướp giật (171 – công khai, nhanh chóng), công nhiên chiếm đoạt (172), trộm cắp (173 – lén lút, từ 2 triệu), lừa đảo (174 – gian dối trước khi nhận tài sản, từ 2 triệu), lạm dụng tín nhiệm (175 – nhận hợp pháp rồi chiếm đoạt, từ 4 triệu).","Nhóm không chiếm đoạt: hủy hoại hoặc cố ý làm hư hỏng tài sản (178)…"]},{"t":"Các tội xâm phạm an toàn, trật tự công cộng và trật tự quản lý hành chính","cs":"Chương XXI, XXII BLHS; Luật 86/2025/QH15","b":["Vi phạm quy định về tham gia giao thông đường bộ (Điều 260): lỗi vô ý đối với hậu quả; cần chứng minh vi phạm, hậu quả, quan hệ nhân quả.","Tội phạm về ma túy (Chương XX): Luật 86/2025/QH15 bổ sung Điều 256a – sử dụng trái phép chất ma túy (chỉ trong các trường hợp đang cai nghiện, quản lý sau cai…), bổ sung Ketamine, Fentanyl; Điều 250 không còn tử hình.","Đánh bạc (Điều 321): từ 5 triệu đồng; gây rối trật tự công cộng (Điều 318); chống người thi hành công vụ (Điều 330)."]},{"t":"Các tội phạm về chức vụ","cs":"Chương XXIII BLHS (Điều 352–366)","b":["Khách thể: hoạt động đúng đắn của cơ quan, tổ chức; chủ thể đặc biệt – người có chức vụ, quyền hạn.","Tham ô (Điều 353): chiếm đoạt tài sản mình có trách nhiệm quản lý; nhận hối lộ (Điều 354): nhận lợi ích để làm/không làm theo yêu cầu người đưa; từ 01/7/2025 hai tội này không còn tử hình; người bị chung thân chỉ được xét giảm khi nộp lại ít nhất 3/4 tài sản và hợp tác tích cực.","Đưa hối lộ (Điều 364): bị ép buộc mà chủ động khai báo trước khi bị phát giác – không có tội; không bị ép buộc nhưng chủ động khai báo – có thể được miễn TNHS."]}]},{"t":"Chương 6. Dự báo và phòng ngừa tội phạm","cs":"Giáo trình Tội phạm học; Điều 4 BLHS","b":["Nội dung học thuật của tội phạm học, không phải quy phạm pháp luật; vận dụng để hiểu chính sách hình sự."],"c":[{"t":"Dự báo tội phạm","cs":"Giáo trình Tội phạm học","b":["Khái niệm: nhận định có căn cứ khoa học về trạng thái, xu hướng, cơ cấu tội phạm trong tương lai.","Căn cứ: số liệu tình hình tội phạm, nguyên nhân, điều kiện, yếu tố kinh tế – xã hội; lưu ý tội phạm ẩn và thay đổi cách ghi nhận.","Phương pháp: thống kê (ngoại suy, chuỗi thời gian), chuyên gia, mô hình hóa; dự báo ngắn hạn, trung hạn, dài hạn.","Kết quả phải nêu giả định, phương pháp, giới hạn và độ bất định."]},{"t":"Phòng ngừa tội phạm","cs":"Giáo trình Tội phạm học; Điều 4 BLHS","b":["Khái niệm: hệ thống biện pháp tác động vào nguyên nhân, điều kiện của tội phạm nhằm ngăn chặn, hạn chế tội phạm.","Nguyên tắc: pháp chế, tôn trọng quyền con người, khoa học, phối hợp đồng bộ, kết hợp phòng ngừa chung và riêng.","Biện pháp: phòng ngừa xã hội (kinh tế, giáo dục, văn hóa), phòng ngừa nghiệp vụ (cơ quan chuyên trách), phòng ngừa tình huống (giảm cơ hội phạm tội).","Chủ thể: Nhà nước, cơ quan chức năng, tổ chức, gia đình, nhà trường, công dân; đánh giá hiệu quả bằng chỉ báo, dữ liệu trước – sau."]}]}],"upd":{"t":"Điểm cập nhật cần lưu ý","cs":"Đối chiếu văn bản tại ngày 29/10/2026","b":["Luật 86/2025/QH15 (hiệu lực 01/7/2025): bỏ tử hình ở 8 tội (Điều 109, 110, 114, 194, 250, 353, 354, 421); bổ sung trường hợp không thi hành án tử hình với người mắc ung thư giai đoạn cuối; nâng gấp đôi phạt tiền ở 24 điều; bổ sung Điều 256a; sửa Điều 49, Điều 63.","Luật Tư pháp người chưa thành niên 59/2024/QH15 (hiệu lực 01/01/2026): thay thế cơ chế xử lý người dưới 18 tuổi phạm tội tại Chương XII BLHS bằng xử lý chuyển hướng và hệ thống hình phạt riêng (Điều 115–122).","Giáo trình xuất bản trước 2025 có thể còn trình bày quy định cũ về tử hình và người dưới 18 tuổi phạm tội; khi làm bài phải theo văn bản đang có hiệu lực tại thời điểm hành vi và quy định hồi tố có lợi.","Chưa ghi nhận luật sửa đổi BLHS nào được thông qua trong năm 2026 tính đến ngày cập nhật."]}}}</script>
