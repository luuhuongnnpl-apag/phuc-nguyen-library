nh niên phụ thuộc tuổi, loại tội, số lần phạm tội, vai trò của từng người; nguyên tắc cá thể hóa trong đồng phạm (Điều 58 BLHS) cũng đòi hỏi đánh giá riêng. Không thể áp dụng chung một biện pháp cho cả nhóm.","b":"Điều 58 BLHS; Điều 37, 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.21","g":4,"lv":"TH","q":"Thông tin cá nhân của người chưa thành niên trong quá trình giải quyết vụ việc được xử lý thế nào?","o":["Phải được giữ bí mật, bảo vệ đời tư; không công bố thông tin làm lộ danh tính trừ trường hợp luật cho phép","Được công khai để răn đe","Chỉ giữ bí mật khi gia đình yêu cầu","Được cung cấp cho báo chí nếu vụ việc gây chú ý"],"a":0,"e":"Luật Tư pháp người chưa thành niên quy định nguyên tắc bảo đảm bí mật cá nhân, đời sống riêng tư của người chưa thành niên trong suốt quá trình xử lý chuyển hướng, tố tụng và thi hành án, nhằm bảo vệ nhân phẩm và tạo điều kiện tái hòa nhập. Việc công khai danh tính trái quy định là vi phạm.","b":"Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"4.22","g":4,"lv":"TH","q":"Người từ đủ 14 tuổi đến dưới 16 tuổi phạm tội mà điều luật quy định tù có thời hạn thì mức tù cao nhất (trừ nhóm tội giữ mức theo BLHS) là:","o":["Không quá một phần hai mức phạt tù mà điều luật quy định","Không quá hai phần năm mức phạt tù mà điều luật quy định","Không quá ba phần tư mức phạt tù mà điều luật quy định","Không quá ba phần năm mức phạt tù mà điều luật quy định"],"a":1,"e":"Điều 119 Luật Tư pháp người chưa thành niên: đối với người từ đủ 14 đến dưới 16 tuổi, điều luật quy định tù chung thân hoặc tử hình thì mức cao nhất không quá 09 năm; tù có thời hạn thì không quá hai phần năm mức phạt tù điều luật quy định (trừ một số tội vẫn giữ mức theo BLHS: 12 năm và một phần hai). Ba phần năm là mức cho người từ đủ 16 đến dưới 18 tuổi.","b":"Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15"},{"id":"5.01","g":5,"lv":"NB","q":"Các tội xâm phạm an ninh quốc gia được quy định tại chương nào của BLHS?","o":["Chương XVI","Chương XIII","Chương XIV","Chương XXIII"],"a":1,"e":"Phần các tội phạm của BLHS bắt đầu bằng Chương XIII – Các tội xâm phạm an ninh quốc gia (Điều 108–122). Chương XIV là các tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự; Chương XVI là các tội xâm phạm sở hữu; Chương XXIII là các tội phạm về chức vụ.","b":"Chương XIII BLHS"},{"id":"5.02","g":5,"lv":"TH","q":"Đặc điểm chung về mặt chủ quan của các tội xâm phạm an ninh quốc gia là:","o":["Được thực hiện với lỗi cố ý trực tiếp, nhiều tội đòi hỏi mục đích chống chính quyền nhân dân","Có thể thực hiện với lỗi vô ý","Không cần xác định mục đích trong mọi trường hợp","Chỉ cần hậu quả nghiêm trọng xảy ra là đủ"],"a":0,"e":"Các tội xâm phạm an ninh quốc gia được thực hiện với lỗi cố ý trực tiếp; nhiều tội (như Điều 109, 113, 117) đòi hỏi dấu hiệu mục đích 'nhằm chống chính quyền nhân dân' hoặc 'nhằm lật đổ chính quyền nhân dân'. Do đó không thể suy diễn tội danh chỉ từ quan điểm, quan hệ; phải chứng minh hành vi và mục đích theo cấu thành.","b":"Chương XIII BLHS"},{"id":"5.03","g":5,"lv":"TH","q":"Dấu hiệu quan trọng nhất để phân biệt tội giết người (Điều 123) với tội cố ý gây thương tích dẫn đến chết người (khoản 4 Điều 134) là:","o":["Số lần tấn công nạn nhân","Quan hệ quen biết giữa người phạm tội và nạn nhân","Loại hung khí được sử dụng","Thái độ tâm lý của người phạm tội đối với hậu quả chết người: mong muốn hoặc để mặc (giết người) hay vô ý (cố ý gây thương tích dẫn đến chết người)"],"a":3,"e":"Ở tội giết người, người phạm tội cố ý (trực tiếp hoặc gián tiếp) đối với hậu quả chết người. Ở tội cố ý gây thương tích dẫn đến chết người, người phạm tội chỉ cố ý gây thương tích, còn hậu quả chết người xảy ra ngoài ý muốn (lỗi vô ý). Hung khí, vị trí, số lần tấn công chỉ là căn cứ để đánh giá ý thức chủ quan.","b":"Điều 123, khoản 4 Điều 134 BLHS"},{"id":"5.04","g":5,"lv":"TH","q":"Theo khoản 1 Điều 134 BLHS, hành vi cố ý gây thương tích cấu thành tội phạm khi:","o":["Gây tỷ lệ tổn thương cơ thể từ 5% trở lên","Gây thương tích bất kỳ, không phụ thuộc tỷ lệ tổn thương","Gây tổn hại sức khỏe với tỷ lệ tổn thương cơ thể từ 11% đến 30%, hoặc dưới 11% nhưng thuộc các trường hợp luật liệt kê (dùng hung khí nguy hiểm, có tổ chức…)","Chỉ khi tỷ lệ tổn thương cơ thể từ 31% trở lên"],"a":2,"e":"Khoản 1 Điều 134 BLHS: người nào cố ý gây thương tích hoặc gây tổn hại sức khỏe của người khác mà tỷ lệ tổn thương cơ thể từ 11% đến 30% hoặc dưới 11% nhưng thuộc một trong các trường hợp (dùng vũ khí, vật liệu nổ, hung khí nguy hiểm; có tổ chức; phạm tội đối với người dưới 16 tuổi; có tính chất côn đồ…) thì phạm tội. Tỷ lệ từ 31% trở lên là tình tiết định khung tăng nặng.","b":"Khoản 1 Điều 134 BLHS"},{"id":"5.05","g":5,"lv":"TH","q":"Tội giết người trong trạng thái tinh thần bị kích động mạnh (Điều 125) đòi hỏi trạng thái đó phải do:","o":["Mâu thuẫn bình thường trong sinh hoạt","Hành vi trái pháp luật nghiêm trọng của nạn nhân đối với người đó hoặc người thân thích của người đó gây ra","Người phạm tội tự dùng rượu bia gây ra","Áp lực công việc kéo dài của người phạm tội"],"a":1,"e":"Điều 125 BLHS: người nào giết người trong trạng thái tinh thần bị kích động mạnh do hành vi ngược đãi nghiêm trọng hoặc xúc phạm nghiêm trọng của nạn nhân đối với người đó hoặc đối với người thân thích của người đó thì bị phạt tù từ 06 tháng đến 03 năm. Nguyên nhân phải xuất phát từ hành vi trái pháp luật nghiêm trọng của nạn nhân, không phải từ say rượu hay mâu thuẫn thông thường.","b":"Điều 125 BLHS"},{"id":"5.06","g":5,"lv":"TH","q":"A bị B dùng dao tấn công; A giật được dao và đâm B tử vong trong khi B đã bị khống chế, không còn nguy hiểm. Nếu xác định A đã vượt quá giới hạn phòng vệ chính đáng, A phạm tội gì?","o":["Tội vô ý làm chết người (Điều 128)","Tội giết người (Điều 123)","Không phạm tội vì là phòng vệ chính đáng","Tội giết người do vượt quá giới hạn phòng vệ chính đáng (Điều 126)"],"a":3,"e":"Khoản 2 Điều 22 BLHS: vượt quá giới hạn phòng vệ chính đáng là hành vi chống trả rõ ràng quá mức cần thiết, không phù hợp với tính chất, mức độ nguy hiểm của hành vi xâm hại; người đó phải chịu TNHS. Nếu gây chết người, BLHS có tội danh riêng – Điều 126 (phạt cải tạo không giam giữ đến 02 năm hoặc tù từ 03 tháng đến 02 năm) – nhẹ hơn nhiều so với Điều 123.","b":"Điều 22, Điều 126 BLHS"},{"id":"5.07","g":5,"lv":"TH","q":"Dấu hiệu đặc trưng về hành vi khách quan của tội cướp tài sản (Điều 168) là:","o":["Dùng thủ đoạn gian dối để người khác tự nguyện giao tài sản","Lén lút chiếm đoạt tài sản khi chủ sở hữu không biết","Công khai, nhanh chóng giật lấy tài sản rồi tẩu thoát","Dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản"],"a":3,"e":"Khoản 1 Điều 168 BLHS mô tả hành vi cướp: dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản. Lén lút là trộm cắp (Điều 173), gian dối là lừa đảo (Điều 174), giật lấy công khai nhanh chóng là cướp giật (Điều 171).","b":"Khoản 1 Điều 168 BLHS"},{"id":"5.08","g":5,"lv":"TH","q":"Tội cướp tài sản được coi là hoàn thành khi nào?","o":["Khi người phạm tội đã thực hiện hành vi dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc… nhằm chiếm đoạt, dù chưa chiếm đoạt được tài sản","Khi người phạm tội đã chiếm đoạt được tài sản","Khi tài sản bị chiếm đoạt có giá trị từ 2.000.000 đồng trở lên","Khi người phạm tội đã tiêu thụ tài sản"],"a":0,"e":"Tội cướp tài sản có cấu thành hình thức: chỉ cần thực hiện hành vi tấn công (dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc…) với mục đích chiếm đoạt là tội phạm hoàn thành, không phụ thuộc việc đã lấy được tài sản hay giá trị tài sản. Giá trị tài sản chỉ có ý nghĩa định khung.","b":"Khoản 1 Điều 168 BLHS"},{"id":"5.09","g":5,"lv":"TH","q":"Hành vi đe dọa sẽ dùng vũ lực (không ngay tức khắc) hoặc dùng thủ đoạn khác uy hiếp tinh thần người khác nhằm chiếm đoạt tài sản cấu thành tội gì?","o":["Tội cưỡng đoạt tài sản (Điều 170)","Tội công nhiên chiếm đoạt tài sản (Điều 172)","Tội cướp tài sản (Điều 168)","Tội cướp giật tài sản (Điều 171)"],"a":0,"e":"Khoản 1 Điều 170 BLHS: người nào đe dọa sẽ dùng vũ lực hoặc có thủ đoạn khác uy hiếp tinh thần người khác nhằm chiếm đoạt tài sản. Điểm khác với cướp tài sản là tính 'ngay tức khắc': ở tội cướp, vũ lực được đe dọa sử dụng ngay, khiến nạn nhân không thể chống cự; ở cưỡng đoạt, nạn nhân còn thời gian, điều kiện lựa chọn.","b":"Khoản 1 Điều 170 BLHS"},{"id":"5.10","g":5,"lv":"NB","q":"Giá trị tài sản tối thiểu để hành vi trộm cắp tài sản cấu thành tội phạm (khi không thuộc các trường hợp đặc biệt) là:","o":["Từ 4.000.000 đồng","Từ 2.000.000 đồng","Từ 500.000 đồng","Từ 5.000.000 đồng"],"a":1,"e":"Khoản 1 Điều 173 BLHS: người nào trộm cắp tài sản của người khác trị giá từ 2.000.000 đồng đến dưới 50.000.000 đồng hoặc dưới 2.000.000 đồng nhưng thuộc một trong các trường hợp (đã bị xử phạt vi phạm hành chính về hành vi chiếm đoạt; đã bị kết án về tội này hoặc các tội chiếm đoạt chưa được xóa án tích mà còn vi phạm; gây ảnh hưởng xấu đến an ninh, trật tự; tài sản là phương tiện kiếm sống chính…) thì phạm tội.","b":"Khoản 1 Điều 173 BLHS"},{"id":"5.11","g":5,"lv":"TH","q":"Điểm khác nhau cơ bản giữa tội lừa đảo chiếm đoạt tài sản (Điều 174) và tội lạm dụng tín nhiệm chiếm đoạt tài sản (Điều 175) là:","o":["Lừa đảo không đòi hỏi giá trị tài sản tối thiểu","Lạm dụng tín nhiệm luôn có hành vi dùng vũ lực","Ở lừa đảo, thủ đoạn gian dối có trước và là nguyên nhân khiến chủ tài sản giao tài sản; ở lạm dụng tín nhiệm, người phạm tội nhận tài sản hợp pháp qua hợp đồng rồi mới nảy sinh ý định chiếm đoạt","Lừa đảo chỉ áp dụng với tiền, lạm dụng tín nhiệm chỉ áp dụng với vật"],"a":2,"e":"Ở tội lừa đảo (Điều 174), thủ đoạn gian dối xuất hiện trước, khiến chủ tài sản tin và tự nguyện giao tài sản. Ở tội lạm dụng tín nhiệm (Điều 175), người phạm tội nhận được tài sản một cách hợp pháp qua hợp đồng vay, mượn, thuê, nhận giữ hộ… rồi mới dùng thủ đoạn gian dối, bỏ trốn hoặc sử dụng vào mục đích bất hợp pháp dẫn đến không trả lại. Thời điểm nảy sinh ý định chiếm đoạt là tiêu chí phân biệt.","b":"Điều 174, Điều 175 BLHS"},{"id":"5.12","g":5,"lv":"NB","q":"Giá trị tài sản tối thiểu để hành vi lạm dụng tín nhiệm chiếm đoạt tài sản cấu thành tội phạm (khi không thuộc trường hợp đặc biệt) là:","o":["Từ 2.000.000 đồng","Từ 1.000.000 đồng","Từ 4.000.000 đồng","Từ 10.000.000 đồng"],"a":2,"e":"Khoản 1 Điều 175 BLHS: người nào vay, mượn, thuê tài sản hoặc nhận được tài sản bằng hình thức hợp đồng rồi chiếm đoạt tài sản trị giá từ 4.000.000 đồng đến dưới 50.000.000 đồng hoặc dưới 4.000.000 đồng nhưng đã bị xử phạt vi phạm hành chính về hành vi chiếm đoạt… thì phạm tội. Ngưỡng 2.000.000 đồng áp dụng cho các tội trộm cắp, lừa đảo.","b":"Khoản 1 Điều 175 BLHS"},{"id":"5.13","g":5,"lv":"TH","q":"Hành vi công khai, nhanh chóng giật lấy tài sản của người khác rồi tẩu thoát cấu thành tội gì?","o":["Tội cướp giật tài sản (Điều 171)","Tội trộm cắp tài sản (Điều 173)","Tội cướp tài sản (Điều 168)","Tội công nhiên chiếm đoạt tài sản (Điều 172)"],"a":0,"e":"Tội cướp giật tài sản (Điều 171) đặc trưng bởi hành vi công khai và nhanh chóng giật lấy tài sản, lợi dụng sơ hở của chủ tài sản rồi tẩu thoát; không dùng vũ lực khống chế (khác cướp), không lén lút (khác trộm cắp), không lợi dụng việc chủ tài sản không có điều kiện ngăn cản (khác công nhiên chiếm đoạt).","b":"Khoản 1 Điều 171 BLHS"},{"id":"5.14","g":5,"lv":"TH","q":"Chủ thể của tội tham ô tài sản (Điều 353) là:","o":["Người có chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý","Người được thuê giữ tài sản theo hợp đồng dân sự","Chỉ công chức trong cơ quan nhà nước","Mọi người từ đủ 16 tuổi trở lên"],"a":0,"e":"Tội tham ô có chủ thể đặc biệt: người có chức vụ, quyền hạn (khái niệm tại Điều 352) lợi dụng chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý. Từ năm 2018, chủ thể còn bao gồm người có chức vụ, quyền hạn trong doanh nghiệp, tổ chức ngoài nhà nước (khoản 6 Điều 353). Người được thuê giữ tài sản theo hợp đồng chiếm đoạt có thể phạm tội lạm dụng tín nhiệm.","b":"Điều 352, Điều 353 BLHS"},{"id":"5.15","g":5,"lv":"TH","q":"Dấu hiệu bắt buộc của tội nhận hối lộ (Điều 354) là:","o":["Người nhận lợi ích phải là công chức cấp cao","Người có chức vụ, quyền hạn trực tiếp hoặc qua trung gian nhận lợi ích để làm hoặc không làm một việc vì lợi ích hoặc theo yêu cầu của người đưa hối lộ","Bất kỳ người nào nhận quà biếu","Lợi ích nhận được phải là tiền mặt"],"a":1,"e":"Khoản 1 Điều 354 BLHS: người nào lợi dụng chức vụ, quyền hạn trực tiếp hoặc qua trung gian nhận hoặc sẽ nhận bất kỳ lợi ích nào (tiền, tài sản, lợi ích vật chất từ 2.000.000 đồng; lợi ích phi vật chất) cho chính bản thân hoặc người khác để làm hoặc không làm một việc vì lợi ích hoặc theo yêu cầu của người đưa hối lộ. Mối liên hệ giữa lợi ích và việc làm/không làm thuộc chức vụ là dấu hiệu bắt buộc.","b":"Khoản 1 Điều 354 BLHS"},{"id":"5.16","g":5,"lv":"TH","q":"Người bị ép buộc đưa hối lộ mà chủ động khai báo trước khi bị phát giác thì:","o":["Được miễn hình phạt","Được coi là không có tội và được trả lại toàn bộ của đã dùng để đưa hối lộ","Bị tịch thu của hối lộ và phải chịu TNHS","Vẫn phải chịu TNHS nhưng được giảm nhẹ"],"a":1,"e":"Khoản 7 Điều 364 BLHS: người bị ép buộc đưa hối lộ mà chủ động khai báo trước khi bị phát giác thì được coi là không có tội và được trả lại toàn bộ của đã dùng để đưa hối lộ. Nếu không bị ép buộc nhưng chủ động khai báo trước khi bị phát giác thì có thể được miễn TNHS (khoản 6).","b":"Khoản 7 Điều 364 BLHS"},{"id":"5.17","g":5,"lv":"TH","q":"Hành vi dùng vũ lực, đe dọa dùng vũ lực hoặc dùng thủ đoạn khác cản trở người thi hành công vụ thực hiện công vụ cấu thành tội:","o":["Cố ý gây thương tích (Điều 134)","Làm nhục người khác (Điều 155)","Chống người thi hành công vụ (Điều 330)","Gây rối trật tự công cộng (Điều 318)"],"a":2,"e":"Khoản 1 Điều 330 BLHS: người nào dùng vũ lực, đe dọa dùng vũ lực hoặc dùng thủ đoạn khác cản trở người thi hành công vụ thực hiện công vụ của họ hoặc ép buộc họ thực hiện hành vi trái pháp luật thì phạm tội. Phải xác định người bị cản trở đang thi hành công vụ hợp pháp; nếu gây thương tích nặng có thể phạm thêm tội khác.","b":"Khoản 1 Điều 330 BLHS"},{"id":"5.18","g":5,"lv":"NB","q":"Hành vi đánh bạc trái phép bằng tiền hoặc hiện vật cấu thành tội phạm khi trị giá dùng đánh bạc từ:","o":["1.000.000 đồng trở lên","10.000.000 đồng trở lên","5.000.000 đồng trở lên","2.000.000 đồng trở lên"],"a":2,"e":"Khoản 1 Điều 321 BLHS: người nào đánh bạc trái phép dưới bất kỳ hình thức nào được thua bằng tiền hay hiện vật trị giá từ 5.000.000 đồng đến dưới 50.000.000 đồng hoặc dưới 5.000.000 đồng nhưng đã bị xử phạt vi phạm hành chính về hành vi này hoặc đã bị kết án về tội này hoặc tội tổ chức đánh bạc, chưa được xóa án tích mà còn vi phạm.","b":"Khoản 1 Điều 321 BLHS"},{"id":"5.19","g":5,"lv":"TH","q":"Theo Luật số 86/2025/QH15, tội sử dụng trái phép chất ma túy (Điều 256a) được bổ sung với đặc điểm nào?","o":["Áp dụng cho người từ đủ 14 tuổi","Mọi hành vi sử dụng ma túy lần đầu đều bị xử lý hình sự","Chỉ áp dụng với pháp nhân thương mại","Chỉ xử lý hình sự người sử dụng trái phép chất ma túy đang trong thời hạn cai nghiện, điều trị thay thế, quản lý sau cai… theo các trường hợp luật định; chủ thể từ đủ 16 tuổi"],"a":3,"e":"Luật 86/2025/QH15 bổ sung Điều 256a – Tội sử dụng trái phép chất ma túy, nhưng chỉ xử lý hình sự khi người đó đang trong thời hạn cai nghiện hoặc điều trị nghiện bằng thuốc thay thế; trong thời hạn quản lý sau cai nghiện; trong 02 năm sau khi hết thời hạn quản lý sau cai…; chủ thể là người từ đủ 16 tuổi. Sử dụng lần đầu không thuộc trường hợp trên vẫn xử lý hành chính.","b":"Điều 256a BLHS (bổ sung bởi Luật 86/2025/QH15)"},{"id":"5.20","g":5,"lv":"TH","q":"Các tội xâm phạm trật tự an toàn giao thông đường bộ (như Điều 260) được thực hiện với lỗi nào?","o":["Lỗi cố ý trực tiếp","Lỗi vô ý đối với hậu quả xảy ra","Không cần xác định lỗi","Lỗi cố ý gián tiếp"],"a":1,"e":"Tội vi phạm quy định về tham gia giao thông đường bộ (Điều 260) có lỗi vô ý đối với hậu quả (chết người, thương tích, thiệt hại tài sản); người phạm tội có thể cố ý vi phạm quy tắc giao thông nhưng không mong muốn hậu quả. Nếu cố ý dùng phương tiện để gây hậu quả thì có thể phạm tội giết người, cố ý gây thương tích.","b":"Điều 260 BLHS"},{"id":"5.21","g":5,"lv":"TH","q":"Khi định tội đối với vụ tai nạn giao thông, những vấn đề cần làm rõ là:","o":["Chỉ cần xác định mức bồi thường gia đình nạn nhân yêu cầu","Quy tắc an toàn giao thông bị vi phạm, hậu quả, mối quan hệ nhân quả giữa vi phạm và hậu quả, lỗi của người điều khiển","Chỉ cần xác định có tai nạn xảy ra","Chỉ cần xác định loại phương tiện"],"a":1,"e":"Cấu thành tội tại Điều 260 BLHS đòi hỏi: hành vi vi phạm quy định về an toàn giao thông, hậu quả thuộc các trường hợp luật định, quan hệ nhân quả giữa vi phạm và hậu quả, lỗi vô ý. Nếu tai nạn do lỗi hoàn toàn của nạn nhân hoặc sự kiện bất ngờ thì người điều khiển không phạm tội.","b":"Điều 260 BLHS"},{"id":"5.22","g":5,"lv":"TH","q":"Tội làm nhục người khác (Điều 155) xâm phạm khách thể nào?","o":["Trật tự quản lý hành chính","Quyền sở hữu","Nhân phẩm, danh dự của con người","An toàn công cộng"],"a":2,"e":"Điều 155 thuộc Chương XIV – Các tội xâm phạm tính mạng, sức khỏe, nhân phẩm, danh dự của con người. Hành vi xúc phạm nghiêm trọng nhân phẩm, danh dự của người khác bị xử lý hình sự. Khác với tội vu khống (Điều 156) ở chỗ vu khống là bịa đặt, loan truyền điều biết rõ là sai sự thật.","b":"Điều 155 BLHS"},{"id":"5.23","g":5,"lv":"TH","q":"Hành vi lợi dụng chủ tài sản không có điều kiện ngăn cản để công khai chiếm đoạt tài sản cấu thành tội:","o":["Cướp tài sản (Điều 168)","Trộm cắp tài sản (Điều 173)","Công nhiên chiếm đoạt tài sản (Điều 172)","Cướp giật tài sản (Điều 171)"],"a":2,"e":"Tội công nhiên chiếm đoạt tài sản (Điều 172): người phạm tội công khai chiếm đoạt tài sản, lợi dụng hoàn cảnh chủ tài sản không có điều kiện ngăn cản (như khi xảy ra thiên tai, tai nạn, chủ tài sản ở xa). Khác cướp giật ở chỗ không cần hành vi nhanh chóng giật lấy, tẩu thoát; khác trộm cắp ở tính công khai.","b":"Khoản 1 Điều 172 BLHS"},{"id":"5.24","g":5,"lv":"TH","q":"Các tội phạm về chức vụ (Chương XXIII) xâm phạm khách thể nào?","o":["Quyền tự do kinh doanh","Quyền sở hữu của cá nhân","Hoạt động đúng đắn của cơ quan, tổ chức do người có chức vụ, quyền hạn xâm phạm trong khi thực hiện công vụ, nhiệm vụ","An ninh quốc gia"],"a":2,"e":"Điều 352 BLHS: các tội phạm về chức vụ là những hành vi xâm phạm hoạt động đúng đắn của cơ quan, tổ chức do người có chức vụ thực hiện trong khi thực hiện công vụ, nhiệm vụ. Một số tội (tham ô, nhận hối lộ) đồng thời xâm phạm sở hữu nhưng khách thể chính là hoạt động đúng đắn của cơ quan, tổ chức.","b":"Điều 352 BLHS"},{"id":"5.25","g":5,"lv":"VD","q":"Một hành vi thỏa mãn dấu hiệu của tội cố ý gây thương tích và đồng thời là phương thức của tội cướp tài sản. Cách định tội đúng là:","o":["Để người bị hại lựa chọn tội danh","Định tội cướp tài sản; hậu quả thương tích được xem xét là tình tiết định khung của tội cướp (nếu luật quy định), không xử lý riêng tội cố ý gây thương tích","Luôn xử lý cả hai tội: cướp tài sản và cố ý gây thương tích","Chỉ xử lý tội cố ý gây thương tích"],"a":1,"e":"Vũ lực gây thương tích là phương thức của tội cướp tài sản; Điều 168 đã quy định các tình tiết định khung theo tỷ lệ tổn thương cơ thể (khoản 2, 3, 4). Vì vậy khi hành vi gây thương tích nằm trong cấu thành tội cướp, chỉ định một tội là cướp tài sản, trừ trường hợp hậu quả vượt quá phạm vi cấu thành (ví dụ cố ý giết người) mới xem xét thêm tội khác.","b":"Điều 168 BLHS"},{"id":"5.26","g":5,"lv":"TH","q":"Phân biệt dấu hiệu định tội với tình tiết định khung có ý nghĩa gì?","o":["Hai loại dấu hiệu giống nhau và có thể thay thế cho nhau","Dấu hiệu định tội xác định tội danh; tình tiết định khung xác định khung hình phạt áp dụng trong điều luật","Tình tiết định khung được dùng để định tội","Dấu hiệu định tội chỉ dùng khi quyết định hình phạt"],"a":1,"e":"Dấu hiệu định tội (mô tả ở khoản 1 của điều luật) quyết định hành vi phạm tội gì; tình tiết định khung (khoản 2, 3, 4…) quyết định khung hình phạt. Một tình tiết đã dùng để định khung thì không được dùng lại làm tình tiết tăng nặng (khoản 2 Điều 52).","b":"BLHS – Phần các tội phạm"},{"id":"6.01","g":6,"lv":"NB","q":"Dự báo tội phạm là gì?","o":["Khẳng định chắc chắn từng vụ phạm tội cụ thể sẽ xảy ra","Hoạt động điều tra để xác định người phạm tội","Hoạt động khoa học nhận định xu hướng, quy mô, cơ cấu, động thái của tình hình tội phạm trong tương lai dựa trên dữ liệu và phương pháp phù hợp","Thống kê các vụ án đã xét xử trong năm"],"a":2,"e":"Dự báo tội phạm là việc dựa trên số liệu về tình hình tội phạm, nguyên nhân, điều kiện và các yếu tố kinh tế – xã hội để đưa ra nhận định có căn cứ khoa học về trạng thái, xu hướng, cơ cấu của tội phạm trong tương lai. Dự báo mang tính xác suất, không khẳng định từng vụ việc; thống kê quá khứ chỉ là dữ liệu đầu vào; điều tra là hoạt động tố tụng.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.02","g":6,"lv":"TH","q":"Căn cứ quan trọng nhất của dự báo tội phạm là:","o":["Suy đoán cá nhân của người làm dự báo","Tin đồn trên mạng xã hội","Dữ liệu về tình hình tội phạm, nguyên nhân, điều kiện của tội phạm và các yếu tố kinh tế – xã hội liên quan","Số người bị bắt trong một ngày"],"a":2,"e":"Dự báo phải dựa trên chuỗi dữ liệu đủ dài, tin cậy về tình hình tội phạm (mức độ, cơ cấu, động thái) và các yếu tố tác động (kinh tế, xã hội, pháp luật, dân cư). Tin đồn, suy đoán hay số liệu một thời điểm không phản ánh xu hướng.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.03","g":6,"lv":"TH","q":"Vì sao dự báo tội phạm luôn có độ bất định?","o":["Vì dự báo không cần dữ liệu","Vì tội phạm tuân theo một quy luật cố định","Vì không có phương pháp khoa học nào để dự báo","Vì tội phạm là hiện tượng xã hội phức tạp, chịu tác động của nhiều yếu tố thay đổi, và số liệu ghi nhận không phản ánh đầy đủ tội phạm thực tế"],"a":3,"e":"Tội phạm chịu ảnh hưởng của nhiều yếu tố kinh tế, xã hội, chính sách, công nghệ; số liệu thống kê có 'tội phạm ẩn'. Do đó dự báo chỉ đưa ra xu hướng có xác suất và phải nêu rõ giả định, giới hạn; không phải là không có phương pháp khoa học.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.04","g":6,"lv":"TH","q":"Phương pháp thống kê trong dự báo tội phạm giúp gì?","o":["Xác định danh tính người phạm tội trong tương lai","Chứng minh chắc chắn nguyên nhân duy nhất của tội phạm","Nhận diện mức độ, cơ cấu, phân bố và xu hướng của tình hình tội phạm từ dữ liệu","Thay thế việc kiểm tra chất lượng dữ liệu"],"a":2,"e":"Phương pháp thống kê (ngoại suy xu hướng, phân tích chuỗi thời gian, tương quan) dùng để mô tả và ước lượng xu hướng của tình hình tội phạm. Thống kê không chứng minh quan hệ nhân quả duy nhất, không dự đoán cá nhân và đòi hỏi kiểm tra chất lượng dữ liệu.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.05","g":6,"lv":"TH","q":"Khi sử dụng số liệu thống kê tội phạm để dự báo, cần lưu ý vấn đề nào?","o":["Không cần xét sự thay đổi cách ghi nhận số liệu","Độ tin cậy, tính đầy đủ, khả năng so sánh của số liệu và tình trạng tội phạm ẩn","Mọi số liệu ghi nhận đều phản ánh đầy đủ tội phạm thực tế","Có thể bỏ qua đơn vị đo và phạm vi thống kê"],"a":1,"e":"Số liệu tội phạm chỉ phản ánh tội phạm rõ (đã được phát hiện, ghi nhận). Thay đổi cách tiếp nhận tin báo, chiến dịch trấn áp, sự sáp nhập đơn vị hành chính… làm số liệu biến động mà không phản ánh thay đổi thực tế. Do đó phải đánh giá độ tin cậy, tính so sánh được và ước lượng tội phạm ẩn.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.06","g":6,"lv":"TH","q":"Tội phạm ẩn ảnh hưởng thế nào đến dự báo tội phạm?","o":["Chỉ tồn tại trong nhóm tội phạm kinh tế","Làm số liệu ghi nhận thấp hơn hoặc khác với tình hình tội phạm thực tế","Không ảnh hưởng đến dữ liệu","Luôn làm số liệu ghi nhận cao hơn thực tế"],"a":1,"e":"Tội phạm ẩn là những tội phạm đã xảy ra nhưng không được phát hiện, không được ghi nhận trong thống kê chính thức (ẩn tự nhiên và ẩn nhân tạo). Nó khiến số liệu thấp hơn thực tế và tồn tại ở nhiều nhóm tội (xâm hại tình dục, ma túy, tham nhũng, bạo lực gia đình…).","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.07","g":6,"lv":"TH","q":"Dự báo ngắn hạn và dự báo dài hạn khác nhau chủ yếu ở điểm nào?","o":["Không có khác biệt","Dự báo dài hạn luôn chính xác hơn","Dự báo ngắn hạn không cần căn cứ","Khoảng thời gian dự báo, mục tiêu sử dụng, mức độ bất định và phương pháp, dữ liệu phù hợp"],"a":3,"e":"Dự báo ngắn hạn (thường 1–2 năm) phục vụ kế hoạch tác nghiệp, ít bất định hơn; dự báo trung hạn, dài hạn (5–10 năm trở lên) phục vụ hoạch định chính sách, chịu nhiều yếu tố biến động hơn nên độ bất định cao hơn và cần phương pháp khác (chuyên gia, kịch bản).","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.08","g":6,"lv":"TH","q":"Một kết quả dự báo tội phạm khoa học cần được trình bày như thế nào?","o":["Chỉ nêu một con số không giải thích","Khẳng định chắc chắn mà không nêu căn cứ","Ẩn các hạn chế để tăng tính thuyết phục","Nêu rõ giả định, dữ liệu, phương pháp, giới hạn và mức độ bất định"],"a":3,"e":"Tính khoa học của dự báo thể hiện ở việc người đọc có thể kiểm tra lại: cần công bố dữ liệu, phương pháp, giả định và khoảng sai số. Kết luận tuyệt đối hóa hoặc che giấu hạn chế làm sai lệch việc hoạch định biện pháp phòng ngừa.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.09","g":6,"lv":"NB","q":"Phòng ngừa tội phạm được hiểu là:","o":["Chỉ là việc tăng mức hình phạt","Hệ thống biện pháp tác động vào nguyên nhân, điều kiện của tội phạm nhằm ngăn chặn, hạn chế, tiến tới loại trừ tội phạm","Chỉ là việc xử lý hình sự sau khi tội phạm xảy ra","Thay thế hoàn toàn hoạt động tố tụng hình sự"],"a":1,"e":"Phòng ngừa tội phạm là tổng thể các biện pháp của Nhà nước và xã hội tác động vào nguyên nhân, điều kiện phát sinh tội phạm nhằm không để tội phạm xảy ra, hạn chế tác hại. Xử lý hình sự và hình phạt chỉ là một bộ phận (phòng ngừa thông qua răn đe), không thay thế biện pháp xã hội.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.10","g":6,"lv":"TH","q":"Hoạt động phòng ngừa tội phạm phải tuân thủ nguyên tắc nào?","o":["Tuân thủ pháp luật, tôn trọng quyền con người, có căn cứ khoa học, phối hợp đồng bộ và phù hợp thực tiễn","Cho phép giám sát không giới hạn mọi công dân","Xử lý tập thể theo địa bàn có nhiều tội phạm","Được sử dụng biện pháp trái pháp luật nếu hiệu quả"],"a":0,"e":"Phòng ngừa tội phạm là hoạt động của Nhà nước và xã hội nên phải tôn trọng Hiến pháp, pháp luật và quyền con người (Điều 14 Hiến pháp: quyền con người chỉ có thể bị hạn chế theo luật). Biện pháp trái pháp luật, giám sát tràn lan hay xử lý tập thể là vi phạm nguyên tắc pháp chế.","b":"Giáo trình Tội phạm học; đề cương Chương 6; Điều 14 Hiến pháp"},{"id":"6.11","g":6,"lv":"TH","q":"Phòng ngừa xã hội (phòng ngừa chung) tập trung chủ yếu vào:","o":["Điều tra sau khi tội phạm xảy ra","Tịch thu tài sản của người phạm tội","Áp dụng hình phạt tù","Cải thiện điều kiện kinh tế – xã hội, giáo dục, văn hóa, hỗ trợ cộng đồng nhằm loại bỏ, hạn chế nguyên nhân và điều kiện của tội phạm"],"a":3,"e":"Phòng ngừa xã hội hướng vào gốc rễ của tội phạm: phát triển kinh tế, việc làm, giáo dục, văn hóa, quản lý xã hội, hỗ trợ nhóm yếu thế. Đây là hướng phòng ngừa có tính căn bản, lâu dài, do nhiều chủ thể thực hiện.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.12","g":6,"lv":"TH","q":"Phòng ngừa nghiệp vụ (chuyên biệt) khác phòng ngừa xã hội ở điểm nào?","o":["Phòng ngừa nghiệp vụ không cần căn cứ pháp luật","Do cơ quan chuyên trách (Công an, Viện kiểm sát, Tòa án…) thực hiện bằng biện pháp nghiệp vụ theo pháp luật, hướng vào đối tượng, địa bàn, loại tội cụ thể","Hai loại hoàn toàn đồng nhất","Phòng ngừa xã hội chỉ do Tòa án thực hiện"],"a":1,"e":"Phòng ngừa nghiệp vụ là hoạt động của các cơ quan chuyên trách sử dụng biện pháp nghiệp vụ (quản lý đối tượng, địa bàn, tuần tra, điều tra cơ bản…) trong khuôn khổ pháp luật. Phòng ngừa xã hội có phạm vi rộng hơn, huy động mọi thiết chế xã hội.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.13","g":6,"lv":"NB","q":"Chủ thể phòng ngừa tội phạm gồm:","o":["Chỉ cơ quan điều tra","Chỉ Tòa án","Nhà nước, các cơ quan chức năng, tổ chức xã hội, gia đình, nhà trường và công dân theo chức năng, trách nhiệm","Chỉ người từng là nạn nhân của tội phạm"],"a":2,"e":"Điều 4 BLHS giao trách nhiệm phòng ngừa, đấu tranh chống tội phạm cho Công an, Viện kiểm sát, Tòa án, các cơ quan khác, tổ chức và mọi công dân. Tội phạm học coi phòng ngừa là hoạt động của toàn xã hội với nhiều chủ thể có vai trò khác nhau.","b":"Giáo trình Tội phạm học; đề cương Chương 6; Điều 4 BLHS"},{"id":"6.14","g":6,"lv":"TH","q":"Sự phối hợp giữa các chủ thể phòng ngừa tội phạm có tác dụng gì?","o":["Xóa bỏ trách nhiệm riêng của từng cơ quan","Cho phép chia sẻ mọi dữ liệu cá nhân không giới hạn","Kết nối thông tin, phân định trách nhiệm và triển khai biện pháp bổ trợ nhau trong khuôn khổ pháp luật","Thay thế cơ chế giám sát, kiểm tra"],"a":2,"e":"Phối hợp giúp tránh chồng chéo, bỏ sót, tận dụng thế mạnh từng chủ thể; tuy nhiên vẫn phải giữ trách nhiệm riêng và tuân thủ pháp luật về bảo vệ dữ liệu cá nhân, quyền riêng tư.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.15","g":6,"lv":"TH","q":"Đánh giá hiệu quả của biện pháp phòng ngừa tội phạm nên dựa trên:","o":["Chỉ số vụ bắt giữ mà không xét bối cảnh","Cảm nhận chủ quan của người tổ chức","Mục tiêu rõ ràng, chỉ báo phù hợp, dữ liệu trước và sau khi triển khai, đánh giá cả tác động ngoài dự kiến","Số lượng cuộc họp đã tổ chức"],"a":2,"e":"Hiệu quả phòng ngừa được đo bằng sự thay đổi của tình hình tội phạm và các yếu tố nguy cơ so với mục tiêu đặt ra, có so sánh trước – sau và xem xét tác động phụ (như dịch chuyển tội phạm sang địa bàn khác). Số cuộc họp hay cảm nhận không phải chỉ báo kết quả.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.16","g":6,"lv":"TH","q":"Vì sao phòng ngừa tội phạm không thể chỉ dựa vào tăng nặng hình phạt?","o":["Vì hình phạt không có vai trò phòng ngừa nào","Vì biện pháp xã hội luôn thay thế pháp luật","Vì tội phạm có nhiều nguyên nhân, điều kiện; phòng ngừa hiệu quả cần kết hợp biện pháp pháp lý, kinh tế – xã hội, giáo dục và hỗ trợ","Vì mọi tội phạm chỉ do một nguyên nhân"],"a":2,"e":"Hình phạt có chức năng phòng ngừa chung và riêng (Điều 31 BLHS) nhưng chỉ tác động vào người đã phạm tội và vào nhận thức của người khác. Nguyên nhân, điều kiện của tội phạm nằm ở nhiều lĩnh vực nên cần biện pháp tổng hợp.","b":"Giáo trình Tội phạm học; đề cương Chương 6; Điều 31 BLHS"},{"id":"6.17","g":6,"lv":"TH","q":"Khi dự báo một nhóm tội phạm cụ thể, cần làm gì?","o":["Xác định phạm vi, thời kỳ, dữ liệu, chỉ báo và các yếu tố tác động riêng của nhóm tội đó","Dựa vào một vụ án nổi bật","Bỏ qua thay đổi pháp luật và cách ghi nhận dữ liệu","Gộp mọi nhóm tội phạm không phân biệt"],"a":0,"e":"Mỗi nhóm tội (ma túy, xâm phạm sở hữu, công nghệ cao…) có quy luật, nguyên nhân và tỷ lệ ẩn khác nhau; thay đổi pháp luật (như bổ sung Điều 256a năm 2025) cũng làm thay đổi số liệu. Dự báo phải xác định rõ phạm vi và dữ liệu đặc thù.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.18","g":6,"lv":"TH","q":"Quan hệ giữa dự báo tội phạm và phòng ngừa tội phạm là:","o":["Phòng ngừa không cần thông tin dự báo","Hai hoạt động không liên quan","Dự báo thay thế hoàn toàn phòng ngừa","Dự báo cung cấp căn cứ để lựa chọn, phân bổ và điều chỉnh biện pháp phòng ngừa"],"a":3,"e":"Dự báo cho biết xu hướng, điểm nóng, nhóm nguy cơ để xây dựng kế hoạch phòng ngừa; kết quả phòng ngừa lại là dữ liệu để điều chỉnh dự báo. Hai hoạt động gắn bó nhưng không thay thế nhau.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.19","g":6,"lv":"TH","q":"Nếu kết quả dự báo không chính xác, cách ứng xử chuyên môn đúng là:","o":["Tiếp tục khẳng định dự báo đúng","Rà soát giả định, chất lượng dữ liệu, phương pháp và cập nhật dự báo một cách minh bạch","Che giấu sai số","Loại bỏ dữ liệu trái với kỳ vọng"],"a":1,"e":"Sai lệch dự báo là thông tin để cải tiến: cần kiểm tra lại giả định, dữ liệu, mô hình và công bố điều chỉnh. Che giấu hay loại bỏ dữ liệu bất lợi vi phạm chuẩn mực khoa học.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"6.20","g":6,"lv":"TH","q":"Biện pháp phòng ngừa tình huống (giảm cơ hội phạm tội) là:","o":["Tăng mức hình phạt trong BLHS","Công khai danh tính người bị nghi ngờ","Áp dụng hình phạt tù đối với mọi người có nguy cơ","Tác động vào môi trường cụ thể để làm tăng khó khăn, rủi ro cho việc phạm tội (lắp camera, chiếu sáng, khóa an toàn…)"],"a":3,"e":"Phòng ngừa tình huống hướng vào điều kiện, cơ hội phạm tội tại địa điểm, thời điểm cụ thể: tăng giám sát, tăng khó khăn tiếp cận mục tiêu, giảm lợi ích thu được. Biện pháp phải tuân thủ pháp luật, không xâm phạm quyền riêng tư hay suy đoán có tội.","b":"Giáo trình Tội phạm học; đề cương Chương 6"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Có thể truy cứu trách nhiệm hình sự Minh về hành vi X không?","o":["Có, nếu người bị thiệt hại yêu cầu","Có, nếu Cơ quan điều tra đề nghị và Viện kiểm sát phê chuẩn","Có, vì hành vi gây bức xúc trong dư luận","Không, vì tội phạm và hình phạt chỉ được quy định trong BLHS"],"a":3,"e":"Theo khoản 1 Điều 2 BLHS, chỉ người nào phạm một tội đã được BLHS quy định mới phải chịu TNHS. Hành vi X chỉ bị nghị định quy định xử phạt hành chính nên Minh chỉ có thể bị xử lý vi phạm hành chính. Dư luận, đề nghị của cơ quan tố tụng hay yêu cầu của bị hại không thể thay thế căn cứ luật định.","b":"Khoản 1 Điều 2, khoản 1 Điều 8 BLHS","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Nguyên tắc nào được đặt ra trực tiếp trong tình huống?","o":["Nguyên tắc tự do định đoạt của người bị hại","Nguyên tắc trách nhiệm tuyệt đối không cần lỗi","Nguyên tắc suy đoán có tội khi hành vi nguy hiểm","Nguyên tắc pháp chế: không có tội phạm, không có hình phạt nếu luật hình sự không quy định"],"a":3,"e":"Tình huống đặt ra nguyên tắc pháp chế hình sự (Điều 2 BLHS): chỉ BLHS mới quy định tội phạm và hình phạt. Nguyên tắc suy đoán vô tội (khoản 1 Điều 31 Hiến pháp) cũng bảo đảm không ai bị coi là có tội khi chưa có bản án kết tội của Tòa án.","b":"Điều 2 BLHS; khoản 1 Điều 31 Hiến pháp","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Giả sử ngày 01/9/2026 một điều luật mới quy định hành vi X là tội phạm. Hành vi Minh thực hiện ngày 12/3/2026 có bị xử lý theo điều luật mới không?","o":["Có, nếu Minh tiếp tục cư trú tại Hà Nội","Có, nếu Tòa án xét thấy cần thiết","Có, vì vụ việc được giải quyết sau ngày luật mới có hiệu lực","Không, vì điều luật quy định tội phạm mới không có hiệu lực hồi tố"],"a":3,"e":"Khoản 2 Điều 7 BLHS: điều luật quy định một tội phạm mới không được áp dụng đối với hành vi đã thực hiện trước khi điều luật đó có hiệu lực. Thời điểm giải quyết vụ việc không làm thay đổi; luật áp dụng là luật tại thời điểm thực hiện hành vi (khoản 1).","b":"Khoản 1, khoản 2 Điều 7 BLHS","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Tòa án có thể tuyên hình phạt tử hình đối với An không?","o":["Không, vì quy định bỏ hình phạt tử hình có lợi cho người phạm tội và được áp dụng hồi tố","Có, nếu Viện kiểm sát đề nghị","Có, vì hành vi thực hiện trước ngày 01/7/2025","Có, nếu số tiền chiếm đoạt chưa được khắc phục"],"a":0,"e":"Khoản 3 Điều 7 BLHS: điều luật xóa bỏ một hình phạt hoặc quy định hình phạt nhẹ hơn được áp dụng đối với hành vi phạm tội thực hiện trước khi điều luật có hiệu lực. Luật 86/2025/QH15 và điều khoản chuyển tiếp của Luật cũng xác định không áp dụng tử hình đối với các tội đã bỏ hình phạt này khi chưa xét xử.","b":"Khoản 3 Điều 7 BLHS; Luật số 86/2025/QH15","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"TH","q":"Thời hiệu truy cứu trách nhiệm hình sự đối với hành vi của An được xác định thế nào?","o":["15 năm vì là tội rất nghiêm trọng","20 năm vì là tội đặc biệt nghiêm trọng","10 năm kể từ ngày phát hiện hành vi","Không áp dụng thời hiệu vì đây là tội tham ô thuộc khoản 4 Điều 353"],"a":3,"e":"Điều 28 BLHS: không áp dụng thời hiệu truy cứu TNHS đối với tội tham ô tài sản thuộc khoản 3, khoản 4 Điều 353 và tội nhận hối lộ thuộc khoản 3, khoản 4 Điều 354. Đây là ngoại lệ so với quy tắc chung tại Điều 27.","b":"Điều 28 BLHS","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"TH","q":"Nếu An bị kết án tù chung thân về tội tham ô, điều kiện xét giảm thời hạn chấp hành hình phạt theo Luật 86/2025/QH15 là gì?","o":["Không có điều kiện riêng","Chỉ cần gia đình có đơn xin giảm án","Chỉ cần chấp hành tốt nội quy trại giam","Phải nộp lại ít nhất ba phần tư tài sản tham ô và hợp tác tích cực với cơ quan chức năng"],"a":3,"e":"Luật 86/2025/QH15 sửa đổi Điều 63 BLHS: người bị kết án tù chung thân về tội tham ô tài sản, nhận hối lộ chỉ được xét giảm thời hạn chấp hành hình phạt khi đã nộp lại ít nhất ba phần tư tài sản tham ô, nhận hối lộ và hợp tác tích cực với cơ quan chức năng trong việc phát hiện, điều tra, xử lý tội phạm.","b":"Điều 63 BLHS (sửa đổi bởi Luật 86/2025/QH15)","cid":"TH1.02"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Nếu chứng cứ xác định An có ý định tước đoạt tính mạng của Bình, nhận định nào phù hợp nhất?","o":["An chỉ bị xử phạt hành chính","An được miễn TNHS vì Bình đã được cứu sống","An chỉ phạm tội cố ý gây thương tích vì Bình không chết","An phạm tội giết người ở giai đoạn chưa đạt, vì hậu quả chết người không xảy ra do nguyên nhân ngoài ý muốn"],"a":3,"e":"Điều 15 BLHS: phạm tội chưa đạt là cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì nguyên nhân ngoài ý muốn. An mong muốn Bình chết nhưng Bình được cứu chữa nên An phạm tội giết người chưa đạt; hình phạt quyết định theo Điều 57 (khung có tử hình, chung thân thì mức cao nhất không quá 20 năm tù).","b":"Điều 15, Điều 57, Điều 123 BLHS","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Để phân biệt tội giết người chưa đạt với tội cố ý gây thương tích, cần làm rõ dấu hiệu nào?","o":["An có đề nghị hòa giải dân sự không","Ý thức chủ quan của An đối với hậu quả chết người, thể hiện qua công cụ, vị trí, cường độ tấn công và diễn biến hành vi","An có thường xuyên đến địa điểm xảy ra vụ việc không","Mức độ quen biết giữa An và Bình trước đó"],"a":1,"e":"Ranh giới giữa hai tội nằm ở mặt chủ quan: An mong muốn (hoặc để mặc) hậu quả chết người hay chỉ cố ý gây thương tích. Ý thức chủ quan được chứng minh qua các dấu hiệu khách quan như hung khí nguy hiểm, vị trí trọng yếu (đầu), số nhát, cường độ, lời nói, hành vi sau đó.","b":"Điều 10, Điều 15, Điều 123, Điều 134 BLHS","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Giả sử An mới chuẩn bị thanh kim loại, chưa tấn công thì bị phát hiện. An có phải chịu trách nhiệm hình sự không?","o":["Chỉ bị xử lý nếu hậu quả chết người xảy ra","Chỉ bị xử lý khi Bình có đơn yêu cầu","Không, vì hành vi chuẩn bị không bao giờ bị xử lý hình sự","Có, vì người chuẩn bị phạm tội giết người phải chịu TNHS theo khoản 2 Điều 14 BLHS"],"a":3,"e":"Khoản 2 Điều 14 BLHS: người chuẩn bị phạm một trong các tội quy định tại Điều 108–121, 123, 134, 168, 169, 207, 299, 300, 301, 302, 303 và 324 thì phải chịu TNHS. Tội giết người (Điều 123) thuộc danh mục này; khung hình phạt chuẩn bị được quy định ngay trong khoản cuối Điều 123.","b":"Khoản 2 Điều 14, Điều 57 BLHS","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Quan hệ giữa Cường và Dũng được xác định thế nào?","o":["Hai tội phạm độc lập không liên quan","Chỉ Cường phạm tội vì Dũng không trực tiếp lấy tài sản","Chỉ phát sinh trách nhiệm dân sự","Đồng phạm, vì hai người cố ý cùng thực hiện một tội phạm"],"a":3,"e":"Khoản 1 Điều 17 BLHS: đồng phạm là trường hợp có hai người trở lên cố ý cùng thực hiện một tội phạm. Cường và Dũng có bàn bạc, phân công, cùng hướng tới việc chiếm đoạt tài sản nên là đồng phạm tội trộm cắp tài sản; người không trực tiếp lấy tài sản vẫn là đồng phạm.","b":"Khoản 1 Điều 17 BLHS","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Vai trò của Dũng trong vụ án là:","o":["Người tổ chức vì biết trước kế hoạch","Người xúi giục vì đã đồng ý tham gia","Người giúp sức, vì cảnh giới là tạo điều kiện vật chất, tinh thần cho việc phạm tội","Người thực hành vì có mặt tại hiện trường"],"a":2,"e":"Khoản 3 Điều 17 BLHS: người giúp sức là người tạo điều kiện tinh thần hoặc vật chất cho việc thực hiện tội phạm. Việc cảnh giới giúp Cường yên tâm và an toàn khi lấy tài sản. Người thực hành là Cường; người tổ chức, xúi giục là Cường (rủ rê, phân công) chứ không phải Dũng.","b":"Khoản 3 Điều 17 BLHS","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Khi quyết định hình phạt đối với Cường và Dũng, Tòa án phải:","o":["Chỉ xem xét thái độ khai báo của Cường","Xét tính chất đồng phạm, tính chất và mức độ tham gia của từng người; tình tiết của ai áp dụng cho người đó","Chỉ căn cứ giá trị tài sản bị chiếm đoạt","Tuyên hai người cùng một mức hình phạt"],"a":1,"e":"Điều 58 BLHS yêu cầu cá thể hóa hình phạt trong đồng phạm. Cường vừa rủ rê, phân công vừa trực tiếp thực hiện nên vai trò lớn hơn Dũng; tình tiết tăng nặng, giảm nhẹ của người nào chỉ áp dụng cho người đó.","b":"Điều 50, Điều 58 BLHS","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Căn cứ đầu tiên cần xác định khi xem xét trách nhiệm hình sự của Nam là gì?","o":["Tuổi của Nam tại thời điểm thực hiện hành vi (từ đủ 15 tuổi), loại tội phạm và tội danh có thuộc danh mục tại khoản 2 Điều 12 BLHS không","Ý kiến của cha mẹ Nam","Tuổi của Nam tại thời điểm khởi tố","Nơi cư trú hiện tại của Nam"],"a":0,"e":"Nam sinh ngày 10/02/2011 nên ngày 05/6/2026 đã đủ 15 tuổi. Theo khoản 2 Điều 12 BLHS, người từ đủ 14 đến dưới 16 tuổi chỉ chịu TNHS về tội rất nghiêm trọng, đặc biệt nghiêm trọng thuộc danh mục điều luật được liệt kê. Tuổi xác định tại thời điểm thực hiện hành vi.","b":"Khoản 2 Điều 12 BLHS","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Giả sử hành vi của Nam là tội trộm cắp tài sản thuộc khoản 1 Điều 173 (tội ít nghiêm trọng). Nam có phải chịu trách nhiệm hình sự không?","o":["Không, vì người từ đủ 14 đến dưới 16 tuổi không chịu TNHS về tội ít nghiêm trọng","Có, nếu người bị hại yêu cầu","Có, vì khi khởi tố Nam đã đủ 16 tuổi","Có, vì Điều 173 có trong danh mục khoản 2 Điều 12"],"a":0,"e":"Điều 173 có trong danh mục khoản 2 Điều 12 nhưng chỉ ở mức tội rất nghiêm trọng, đặc biệt nghiêm trọng (khoản 3, 4 Điều 173). Tội thuộc khoản 1 là ít nghiêm trọng nên Nam không phải chịu TNHS; có thể áp dụng biện pháp xử lý hành chính, giáo dục theo quy định khác. Việc đủ 16 tuổi khi khởi tố không làm thay đổi.","b":"Khoản 2 Điều 12 BLHS","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Giả sử Nam phạm tội cướp tài sản thuộc khoản 2 Điều 168 (phạt tù từ 07 đến 15 năm). Nam có phải chịu TNHS không?","o":["Chỉ khi cha mẹ Nam đồng ý","Không, vì Nam chưa đủ 16 tuổi","Có, vì đây là tội rất nghiêm trọng thuộc danh mục khoản 2 Điều 12 BLHS","Chỉ khi tài sản bị cướp có giá trị lớn"],"a":2,"e":"Khung từ 07 đến 15 năm tù thuộc tội rất nghiêm trọng (điểm c khoản 1 Điều 9); Điều 168 nằm trong danh mục khoản 2 Điều 12 nên Nam phải chịu TNHS. Tuy nhiên, việc xử lý phải theo Luật Tư pháp người chưa thành niên (ưu tiên xử lý chuyển hướng nếu đủ điều kiện, hình phạt giảm nhẹ).","b":"Khoản 2 Điều 12, Điều 9, Điều 168 BLHS","cid":"TH2.03"},{"id":"TH2.04.1","g":2,"lv":"TH","q":"Tội trộm cắp của Hòa thuộc loại tội phạm nào và có thời hiệu truy cứu bao lâu?","o":["Tội rất nghiêm trọng; thời hiệu 15 năm","Tội ít nghiêm trọng; thời hiệu 03 năm","Tội ít nghiêm trọng; thời hiệu 05 năm","Tội nghiêm trọng; thời hiệu 10 năm"],"a":2,"e":"Mức cao nhất của khung là 03 năm tù nên tội trộm cắp tại khoản 1 Điều 173 là tội ít nghiêm trọng (điểm a khoản 1 Điều 9); thời hiệu truy cứu TNHS là 05 năm kể từ ngày tội phạm được thực hiện (điểm a khoản 2 Điều 27).","b":"Điểm a khoản 1 Điều 9; điểm a khoản 2 Điều 27 BLHS","cid":"TH2.04"},{"id":"TH2.04.2","g":2,"lv":"VD","q":"Việc Hòa phạm tội mới ngày 10/5/2022 ảnh hưởng thế nào đến thời hiệu đối với tội trộm cắp?","o":["Thời hiệu được cộng thêm 01 năm","Thời hiệu đối với tội trộm cắp được tính lại từ ngày 10/5/2022 vì tội mới có mức cao nhất của khung trên 01 năm tù","Không ảnh hưởng; thời hiệu hết vào ngày 01/3/2024","Làm thời hiệu đối với tội trộm cắp chấm dứt"],"a":1,"e":"Khoản 3 Điều 27 BLHS: nếu trong thời hạn thời hiệu, người phạm tội lại thực hiện hành vi phạm tội mới mà BLHS quy định mức cao nhất của khung hình phạt đối với tội ấy trên 01 năm tù, thì thời hiệu đối với tội cũ được tính lại kể từ ngày thực hiện hành vi phạm tội mới. Tội lừa đảo có mức cao nhất 03 năm tù nên thời hiệu tội trộm cắp tính lại từ 10/5/2022.","b":"Khoản 3 Điều 27 BLHS","cid":"TH2.04"},{"id":"TH2.04.3","g":2,"lv":"VD","q":"Nếu vụ trộm cắp bị phát hiện vào tháng 9/2026, Hòa còn bị truy cứu TNHS về tội trộm cắp không?","o":["Không, vì đã quá 05 năm kể từ ngày 01/3/2019","Còn, vì thời hiệu 05 năm tính lại từ 10/5/2022 chưa hết","Không, vì tội trộm cắp đã được xóa án tích","Chỉ còn nếu người bị hại yêu cầu"],"a":1,"e":"Thời hiệu 05 năm tính lại từ ngày 10/5/2022 sẽ hết vào tháng 5/2027; tháng 9/2026 vẫn trong thời hiệu nên Hòa vẫn bị truy cứu TNHS về tội trộm cắp. Nếu không có tội mới, thời hiệu đã hết từ tháng 3/2024.","b":"Khoản 2, khoản 3 Điều 27 BLHS","cid":"TH2.04"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Bình có những tình tiết giảm nhẹ nào theo khoản 1 Điều 51 BLHS?","o":["Chỉ có tình tiết nhân thân tốt","Chỉ có tình tiết tự nguyện bồi thường thiệt hại","Tự nguyện bồi thường thiệt hại (điểm b), phạm tội lần đầu và thuộc trường hợp ít nghiêm trọng (điểm i), thành khẩn khai báo, ăn năn hối cải (điểm s)","Không có tình tiết giảm nhẹ nào vì đã chiếm đoạt trên 2 triệu đồng"],"a":2,"e":"Khoản 1 Điều 51 BLHS: điểm b – người phạm tội tự nguyện sửa chữa, bồi thường thiệt hại hoặc khắc phục hậu quả; điểm s – người phạm tội thành khẩn khai báo hoặc ăn năn hối cải. điểm i – phạm tội lần đầu và thuộc trường hợp ít nghiêm trọng. Bình có ba tình tiết thuộc khoản 1; nhân thân tốt có thể được Tòa án xem xét thêm theo khoản 2.","b":"Khoản 1, khoản 2 Điều 51 BLHS","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Vì khoản 1 Điều 173 là khung nhẹ nhất, Tòa án có thể quyết định hình phạt thế nào khi Bình có ít nhất hai tình tiết giảm nhẹ tại khoản 1 Điều 51?","o":["Chỉ được tuyên hình phạt cảnh cáo","Quyết định hình phạt dưới mức thấp nhất của khung hoặc chuyển sang một hình phạt khác thuộc loại nhẹ hơn","Bắt buộc tuyên mức thấp nhất là 06 tháng tù","Bắt buộc miễn TNHS cho Bình"],"a":1,"e":"Khoản 3 Điều 54 BLHS: trường hợp có đủ điều kiện tại khoản 1 nhưng điều luật chỉ có một khung hình phạt hoặc khung hình phạt đó là khung nhẹ nhất, thì Tòa án có thể quyết định hình phạt dưới mức thấp nhất của khung hoặc chuyển sang một hình phạt khác thuộc loại nhẹ hơn; lý do phải được ghi rõ trong bản án.","b":"Khoản 3 Điều 54 BLHS","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Nếu Tòa án tuyên Bình 09 tháng tù, Bình có thể được hưởng án treo không?","o":["Không, vì án treo chỉ áp dụng cho tội nghiêm trọng","Không, vì Bình đã trộm cắp tài sản trên 2 triệu đồng","Có, với thời gian thử thách bằng mức án 09 tháng","Có thể, vì mức tù không quá 03 năm, Bình có nhân thân tốt và nhiều tình tiết giảm nhẹ; thời gian thử thách từ 01 đến 05 năm"],"a":3,"e":"Khoản 1 Điều 65 BLHS: khi xử phạt tù không quá 03 năm, căn cứ nhân thân và tình tiết giảm nhẹ, nếu xét thấy không cần bắt chấp hành hình phạt tù thì Tòa án cho hưởng án treo, ấn định thời gian thử thách từ 01 năm đến 05 năm (theo hướng dẫn, không ít hơn 01 năm và bằng hai lần mức án nhưng không vượt quá 05 năm).","b":"Khoản 1 Điều 65 BLHS; Nghị quyết 02/2018/NQ-HĐTP","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"TH","q":"Điều luật nào quy định việc tổng hợp hình phạt trong trường hợp này?","o":["Điều 55 BLHS – quyết định hình phạt trong trường hợp phạm nhiều tội","Điều 56 BLHS – tổng hợp hình phạt của nhiều bản án","Điều 58 BLHS – đồng phạm","Điều 57 BLHS – chuẩn bị phạm tội, phạm tội chưa đạt"],"a":0,"e":"Dũng bị xét xử cùng một lần về nhiều tội nên áp dụng Điều 55 BLHS: Tòa án quyết định hình phạt đối với từng tội rồi tổng hợp thành hình phạt chung. Điều 56 chỉ áp dụng khi tổng hợp hình phạt của nhiều bản án khác nhau.","b":"Điều 55 BLHS","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Hình phạt chung đối với Dũng là bao nhiêu?","o":["08 năm 08 tháng tù","08 năm tù và 02 năm cải tạo không giam giữ chấp hành riêng","10 năm tù","08 năm 02 tháng tù"],"a":0,"e":"Điểm c khoản 1 Điều 55 BLHS: nếu các hình phạt đã tuyên là cải tạo không giam giữ và tù có thời hạn thì cải tạo không giam giữ được chuyển đổi thành tù theo tỷ lệ 03 ngày cải tạo không giam giữ = 01 ngày tù. 02 năm (24 tháng) cải tạo không giam giữ = 08 tháng tù; hình phạt chung là 08 năm 08 tháng tù (không vượt quá 30 năm).","b":"Điểm c khoản 1 Điều 55 BLHS","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"TH","q":"Giả sử khi đang chấp hành hình phạt chung, Dũng bị phát hiện đã phạm một tội khác trước khi có bản án này. Tòa án xử lý thế nào?","o":["Quyết định hình phạt đối với tội mới phát hiện, rồi tổng hợp với hình phạt của bản án trước theo Điều 56 BLHS","Hủy bản án trước để xét xử lại toàn bộ","Không xét xử vì Dũng đang chấp hành án","Chỉ cộng thêm hình phạt mà không giới hạn"],"a":0,"e":"Khoản 1 Điều 56 BLHS: người đang chấp hành một bản án mà lại bị xét xử về tội đã phạm trước khi có bản án này thì Tòa án quyết định hình phạt đối với tội đang xét xử, sau đó tổng hợp với hình phạt của bản án trước theo Điều 55; thời gian đã chấp hành được trừ vào hình phạt chung.","b":"Khoản 1 Điều 56 BLHS","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Chiếc xe máy đã thu hồi được xử lý thế nào?","o":["Trả lại cho chị Lan theo biện pháp tư pháp tại Điều 47, Điều 48 BLHS","Bán đấu giá để bồi thường chi phí tố tụng","Giao cho Hùng sau khi chấp hành án","Tịch thu sung ngân sách nhà nước"],"a":0,"e":"Chiếc xe là tài sản bị chiếm đoạt của chị Lan; theo khoản 2 Điều 47 và khoản 1 Điều 48 BLHS, tài sản bị người phạm tội chiếm đoạt phải được trả lại cho chủ sở hữu hợp pháp, không bị tịch thu.","b":"Khoản 2 Điều 47, Điều 48 BLHS","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Con dao bấm Hùng dùng để phạm tội được xử lý thế nào?","o":["Trả lại cho Hùng","Tịch thu theo biện pháp tư pháp (công cụ, phương tiện dùng vào việc phạm tội)","Không cần xử lý vì không có giá trị","Giao cho chị Lan"],"a":1,"e":"Điểm a khoản 1 Điều 47 BLHS: công cụ, phương tiện dùng vào việc phạm tội bị tịch thu sung vào ngân sách nhà nước hoặc tịch thu tiêu hủy. Đây là biện pháp tư pháp, khác hình phạt bổ sung tịch thu tài sản (Điều 45).","b":"Điểm a khoản 1 Điều 47 BLHS","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Hùng mắc bệnh tâm thần sau khi phạm tội, trước khi bị kết án. Hướng xử lý đúng là:","o":["Có thể bị áp dụng biện pháp bắt buộc chữa bệnh; khi khỏi bệnh, Hùng có thể phải chịu TNHS","Hùng được miễn TNHS vĩnh viễn","Vẫn xét xử và tuyên hình phạt tù ngay","Đình chỉ vụ án vì Hùng không có năng lực TNHS"],"a":0,"e":"Khoản 2 Điều 49 BLHS: người phạm tội trong khi có năng lực TNHS nhưng trước khi bị kết án đã lâm vào tình trạng mắc bệnh làm mất khả năng nhận thức, khả năng điều khiển hành vi thì căn cứ kết luận giám định có thể bị áp dụng bắt buộc chữa bệnh; sau khi khỏi bệnh, người đó có thể phải chịu TNHS. Khác với Điều 21 (mất năng lực ngay khi thực hiện hành vi).","b":"Khoản 2 Điều 49 BLHS","cid":"TH3.03"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Khánh có thuộc diện có thể được xem xét áp dụng biện pháp xử lý chuyển hướng không?","o":["Không, vì Khánh đã đủ 16 tuổi","Có, vì Khánh từ đủ 16 đến dưới 18 tuổi phạm tội ít nghiêm trọng lần đầu, không thuộc trường hợp bị loại trừ tại Điều 38","Có, chỉ vì gia đình có đơn đề nghị","Không, vì tội trộm cắp không được xử lý chuyển hướng"],"a":1,"e":"Luật Tư pháp người chưa thành niên cho phép xem xét xử lý chuyển hướng với người từ đủ 16 đến dưới 18 tuổi phạm tội ít nghiêm trọng, nghiêm trọng (trừ các trường hợp loại trừ tại khoản 2 Điều 38: tái phạm, phạm nhiều lần tội nghiêm trọng do cố ý, tội rất nghiêm trọng do cố ý…). Khánh phạm tội ít nghiêm trọng lần đầu nên thuộc diện được xem xét; đơn của gia đình không phải căn cứ quyết định.","b":"Điều 37, Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Ngoài điều kiện về đối tượng, cần đáp ứng điều kiện nào để áp dụng xử lý chuyển hướng cho Khánh?","o":["Bị hại phải có đơn đề nghị","Gia đình Khánh phải nộp tiền bảo lãnh","Khánh phải bị tạm giam ít nhất 01 tháng","Có đủ căn cứ xác định Khánh thực hiện hành vi phạm tội, Khánh thừa nhận hành vi và đồng ý bằng văn bản về việc xử lý chuyển hướng"],"a":3,"e":"Điều 39 Luật Tư pháp người chưa thành niên đặt ba điều kiện: có đủ căn cứ xác định người chưa thành niên đã thực hiện hành vi phạm tội; người đó thừa nhận hành vi; người đó đồng ý bằng văn bản việc áp dụng xử lý chuyển hướng. Việc đồng ý bảo đảm tính tự nguyện và quyền của người chưa thành niên.","b":"Điều 39 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Biện pháp nào sau đây có thể được áp dụng cho Khánh như một biện pháp xử lý chuyển hướng?","o":["Phạt tù cho hưởng án treo","Phạt tiền 10 triệu đồng","Cải tạo không giam giữ 06 tháng","Khiển trách kết hợp tham gia chương trình học tập, dạy nghề"],"a":3,"e":"Điều 36 Luật Tư pháp người chưa thành niên liệt kê các biện pháp xử lý chuyển hướng (khiển trách, xin lỗi bị hại, bồi thường thiệt hại, giáo dục tại xã, quản thúc tại gia đình, hạn chế khung giờ đi lại, tham gia chương trình học tập, dạy nghề…). Phạt tiền, cải tạo không giam giữ, án treo là hình phạt, chỉ áp dụng khi không xử lý chuyển hướng.","b":"Điều 36 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Minh có thể được áp dụng biện pháp xử lý chuyển hướng không?","o":["Không, vì người từ đủ 14 đến dưới 16 tuổi phạm tội rất nghiêm trọng từ 02 lần trở lên thuộc trường hợp không được xử lý chuyển hướng","Có, vì tội cướp không thuộc nhóm tội bị loại trừ","Có, nếu gia đình bồi thường đủ","Có, vì Minh chưa đủ 16 tuổi"],"a":0,"e":"Khoản 1 Điều 38 Luật Tư pháp người chưa thành niên: người từ đủ 14 đến dưới 16 tuổi không được áp dụng xử lý chuyển hướng nếu phạm tội rất nghiêm trọng từ 02 lần trở lên hoặc phạm nhiều tội rất nghiêm trọng. Dù tội cướp không thuộc 5 tội bị loại trừ đích danh, Minh vẫn bị loại trừ vì đây là lần thứ hai.","b":"Khoản 1 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Nếu áp dụng hình phạt tù có thời hạn, mức tù cao nhất có thể tuyên đối với Minh là:","o":["Không quá 15 năm","Không quá 09 năm (ba phần năm của 15 năm)","Không quá 06 năm (hai phần năm của 15 năm)","Không quá 7 năm 6 tháng (một phần hai của 15 năm)"],"a":2,"e":"Điều 119 Luật Tư pháp người chưa thành niên: người từ đủ 14 đến dưới 16 tuổi, điều luật quy định tù có thời hạn thì mức cao nhất không quá hai phần năm mức phạt tù điều luật quy định (trừ 5 tội giữ mức một phần hai). Tội cướp không thuộc nhóm ngoại lệ nên mức cao nhất là 2/5 × 15 năm = 06 năm.","b":"Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"TH","q":"Khi quyết định hình phạt đối với Minh và hai người bạn cùng tham gia, Tòa án cần:","o":["Chỉ xử lý người lớn tuổi nhất","Áp dụng hình phạt bổ sung cho Minh","Áp dụng cùng một mức hình phạt cho cả ba người","Xác định riêng tuổi, vai trò, mức độ tham gia, tình tiết của từng người và áp dụng quy định tương ứng với độ tuổi"],"a":3,"e":"Mỗi người đồng phạm có độ tuổi, vai trò khác nhau nên Tòa án phải cá thể hóa (Điều 58 BLHS). Với người chưa thành niên, không áp dụng hình phạt bổ sung (Điều 12 Luật Tư pháp người chưa thành niên) và mức hình phạt phụ thuộc nhóm tuổi.","b":"Điều 58 BLHS; Điều 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15","cid":"TH4.02"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Hành vi của A cấu thành tội gì?","o":["Công nhiên chiếm đoạt tài sản (Điều 172)","Trộm cắp tài sản (Điều 173)","Không cấu thành tội phạm","Cướp giật tài sản (Điều 171)"],"a":1,"e":"A lén lút chiếm đoạt tài sản trị giá 8 triệu đồng (từ 2 triệu đồng trở lên) khi chủ tài sản không biết – thỏa mãn cấu thành tội trộm cắp tài sản (khoản 1 Điều 173).","b":"Khoản 1 Điều 173 BLHS","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Hành vi của C cấu thành tội gì?","o":["Cưỡng đoạt tài sản (Điều 170)","Trộm cắp tài sản (Điều 173)","Cướp tài sản (Điều 168)","Cướp giật tài sản (Điều 171)"],"a":3,"e":"C công khai, nhanh chóng giật lấy tài sản rồi tẩu thoát – dấu hiệu đặc trưng của tội cướp giật tài sản. Việc dùng xe máy để cướp giật còn là tình tiết định khung 'dùng thủ đoạn nguy hiểm' (khoản 2 Điều 171). C không dùng vũ lực khống chế nên không phải cướp tài sản.","b":"Điều 171 BLHS","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Hành vi của E cấu thành tội gì?","o":["Không phạm tội vì giao dịch dân sự","Lừa đảo chiếm đoạt tài sản (Điều 174)","Trộm cắp tài sản (Điều 173)","Lạm dụng tín nhiệm chiếm đoạt tài sản (Điều 175)"],"a":3,"e":"E nhận tài sản hợp pháp qua giao dịch mượn rồi dùng thủ đoạn gian dối, bỏ trốn để chiếm đoạt tài sản trị giá 8 triệu đồng (từ 4 triệu đồng trở lên) – thỏa mãn tội lạm dụng tín nhiệm chiếm đoạt tài sản. Nếu E có ý định chiếm đoạt và dùng thủ đoạn gian dối ngay từ khi hỏi mượn thì mới là lừa đảo.","b":"Điểm a khoản 1 Điều 175 BLHS","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Hành vi của ông X cấu thành tội gì?","o":["Tham ô tài sản (Điều 353)","Nhận hối lộ (Điều 354)","Lạm quyền trong khi thi hành công vụ (Điều 357)","Lừa đảo chiếm đoạt tài sản (Điều 174)"],"a":1,"e":"Ông X là người có chức vụ, quyền hạn, lợi dụng chức vụ nhận lợi ích vật chất (50 triệu đồng) để làm một việc theo yêu cầu của người đưa – đủ dấu hiệu tội nhận hối lộ. Tham ô là chiếm đoạt tài sản mình có trách nhiệm quản lý, không phải trường hợp này.","b":"Khoản 1 Điều 354 BLHS","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Giám đốc Công ty Y được xử lý thế nào?","o":["Bắt buộc phải chịu TNHS ở khung cao nhất","Đương nhiên được coi là không có tội và được trả lại 50 triệu đồng","Có thể được miễn TNHS về tội đưa hối lộ vì tuy không bị ép buộc nhưng đã chủ động khai báo trước khi bị phát giác","Không phạm tội vì chỉ đưa tiền để được giải quyết nhanh"],"a":2,"e":"Khoản 6 Điều 364 BLHS: người đưa hối lộ tuy không bị ép buộc nhưng đã chủ động khai báo trước khi bị phát giác thì có thể được miễn TNHS. Chỉ người bị ép buộc đưa hối lộ mà chủ động khai báo mới được coi là không có tội và được trả lại tài sản (khoản 7).","b":"Khoản 6, khoản 7 Điều 364 BLHS","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"TH","q":"Để kết luận ông X phạm tội nhận hối lộ, cơ quan tố tụng phải chứng minh:","o":["Chỉ cần chứng minh ông X nhận tiền","Chỉ cần chứng minh hồ sơ được cấp phép","Chức vụ, quyền hạn của ông X; việc nhận lợi ích; mối liên hệ giữa lợi ích và việc làm (không làm) theo yêu cầu người đưa","Chỉ cần lời khai của giám đốc Công ty Y"],"a":2,"e":"Các dấu hiệu bắt buộc của tội nhận hối lộ là chủ thể có chức vụ, quyền hạn; hành vi nhận lợi ích; mục đích làm hoặc không làm một việc vì lợi ích hoặc theo yêu cầu của người đưa. Trách nhiệm chứng minh thuộc cơ quan tiến hành tố tụng (Điều 15 BLTTHS); lời khai phải được đối chiếu với chứng cứ khác.","b":"Khoản 1 Điều 354 BLHS; Điều 15 BLTTHS","cid":"TH5.02"},{"id":"TH6.01.1","g":6,"lv":"TH","q":"Có thể kết luận ngay tội phạm trộm cắp thực tế tăng đúng 20% không?","o":["Không cần kiểm tra nguồn dữ liệu","Có, không cần so sánh cách ghi nhận","Có, vì số liệu ghi nhận luôn phản ánh đầy đủ thực tế","Không; cần xem xét tội phạm ẩn, sự thay đổi cách tiếp nhận tin báo và tác động của đợt cao điểm làm tăng số vụ được phát hiện"],"a":3,"e":"Số liệu ghi nhận chỉ phản ánh tội phạm rõ. Việc mở kênh báo tin trực tuyến và đợt cao điểm có thể làm tăng tỷ lệ phát hiện, ghi nhận (giảm tội phạm ẩn) mà không có nghĩa tội phạm thực tế tăng tương ứng.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"TH","q":"Dữ liệu bổ sung nào hữu ích nhất cho dự báo?","o":["Chuỗi số liệu nhiều năm, khảo sát nạn nhân, dữ liệu về thay đổi cách ghi nhận và các yếu tố kinh tế – xã hội","Một vụ trộm cắp nổi bật được báo chí đưa tin","Số cuộc họp đã tổ chức","Ý kiến của một cán bộ"],"a":0,"e":"Chuỗi thời gian dài giúp nhận diện xu hướng; khảo sát nạn nhân giúp ước lượng tội phạm ẩn; dữ liệu về thay đổi phương thức ghi nhận giúp hiệu chỉnh; yếu tố kinh tế – xã hội giải thích biến động.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"TH","q":"Kết quả dự báo nên được trình bày như thế nào?","o":["Không công bố phương pháp","Khẳng định chính xác tuyệt đối","Nêu giả định, phương pháp, giới hạn dữ liệu và khoảng bất định","Chỉ nêu một con số"],"a":2,"e":"Dự báo khoa học phải minh bạch về giả định, phương pháp và giới hạn để người sử dụng (cơ quan hoạch định phòng ngừa) hiểu mức độ tin cậy và điều chỉnh khi cần.","b":"Giáo trình Tội phạm học","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"TH","q":"Biện pháp nào phù hợp với phòng ngừa xã hội?","o":["Công khai dữ liệu cá nhân của người bị nghi ngờ","Chỉ tăng mức hình phạt trong thông điệp truyền thông","Nâng cao nhận thức, kỹ năng nhận diện thủ đoạn lừa đảo, lập kênh báo tin và hỗ trợ nạn nhân","Cho phép sinh viên tự điều tra người bị nghi ngờ"],"a":2,"e":"Phòng ngừa xã hội tác động vào điều kiện, cơ hội phạm tội: giảm tính dễ bị tổn thương của nạn nhân tiềm năng thông qua giáo dục, kỹ năng, kênh báo tin. Công khai dữ liệu cá nhân hay để sinh viên tự điều tra là trái pháp luật.","b":"Giáo trình Tội phạm học; Điều 4 BLHS","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"TH","q":"Chủ thể nào tham gia chương trình phòng ngừa này?","o":["Chỉ những sinh viên đã bị lừa","Nhà trường, sinh viên, gia đình, đoàn thể và cơ quan công an theo chức năng, trách nhiệm","Chỉ Tòa án","Chỉ một cá nhân phụ trách"],"a":1,"e":"Điều 4 BLHS xác định trách nhiệm phòng ngừa tội phạm thuộc về cơ quan, tổ chức và mọi công dân. Mỗi chủ thể tham gia theo vai trò: nhà trường tổ chức giáo dục, công an cung cấp thông tin và tiếp nhận tin báo, gia đình giám sát, hỗ trợ.","b":"Điều 4 BLHS; Giáo trình Tội phạm học","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"TH","q":"Hiệu quả chương trình nên được đánh giá dựa trên:","o":["Chỉ số buổi truyền thông","Cảm nhận của người tổ chức","Số người tham dự mà không đo kết quả","Chỉ báo rõ ràng, dữ liệu trước – sau, mức độ tiếp cận và thay đổi hành vi, đồng thời bảo vệ dữ liệu cá nhân"],"a":3,"e":"Đánh giá hiệu quả cần đo thay đổi thực chất (số vụ, tỷ lệ sinh viên nhận diện được thủ đoạn, số tin báo) so với trước khi triển khai; việc thu thập dữ liệu phải tuân thủ pháp luật về bảo vệ dữ liệu cá nhân.","b":"Giáo trình Tội phạm học","cid":"TH6.02"}],"th":[{"name":"Chương 1. Những vấn đề cơ bản về luật hình sự","items":[{"cid":"TH1.01","title":"Hành vi chỉ bị xử phạt hành chính","text":"Ngày 12/3/2026, tại Hà Nội, Minh thực hiện hành vi X gây bức xúc trong dư luận. Hành vi X chưa được Bộ luật Hình sự quy định là tội phạm; một nghị định của Chính phủ quy định hành vi X bị xử phạt vi phạm hành chính.","ask":[],"guide":[],"basis":"Khoản 1 Điều 2, khoản 1 Điều 8 BLHS; Điều 2 BLHS; khoản 1 Điều 31 Hiến pháp; Khoản 1, khoản 2 Điều 7 BLHS","mcq":["TH1.01.1","TH1.01.2","TH1.01.3"]},{"cid":"TH1.02","title":"Luật mới bỏ hình phạt tử hình","text":"Ngày 15/6/2025, An – kế toán trưởng một doanh nghiệp nhà nước – chiếm đoạt 2 tỷ đồng do mình quản lý. Tại thời điểm đó, khoản 4 Điều 353 BLHS (tội tham ô tài sản) có khung hình phạt tù 20 năm, tù chung thân hoặc tử hình. Luật số 86/2025/QH15 có hiệu lực từ 01/7/2025 bỏ hình phạt tử hình đối với tội tham ô tài sản. Tháng 3/2026, An bị đưa ra xét xử.","ask":[],"guide":[],"basis":"Khoản 3 Điều 7 BLHS; Luật số 86/2025/QH15; Điều 28 BLHS; Điều 63 BLHS (sửa đổi bởi Luật 86/2025/QH15)","mcq":["TH1.02.1","TH1.02.2","TH1.02.3"]}]},{"name":"Chương 2. Tội phạm và trách nhiệm hình sự","items":[{"cid":"TH2.01","title":"Giết người chưa đạt","text":"Ngày 12/3/2026, tại Hà Nội, Nguyễn Minh An dùng thanh kim loại đánh nhiều nhát vào đầu Trần Quốc Bình với mục đích tước đoạt tính mạng của Bình. Bình được người dân đưa đi cấp cứu kịp thời nên không tử vong. An bị khống chế ngay sau đó.","ask":[],"guide":[],"basis":"Điều 15, Điều 57, Điều 123 BLHS; Điều 10, Điều 15, Điều 123, Điều 134 BLHS; Khoản 2 Điều 14, Điều 57 BLHS","mcq":["TH2.01.1","TH2.01.2","TH2.01.3"]},{"cid":"TH2.02","title":"Đồng phạm trộm cắp","text":"Ngày 18/4/2026, tại Bắc Ninh, Lê Văn Cường rủ Phạm Đức Dũng đi trộm tài sản của một cửa hàng. Cường phân công Dũng đứng ngoài cảnh giới, còn Cường vào trong lấy 30 triệu đồng.","ask":[],"guide":[],"basis":"Khoản 1 Điều 17 BLHS; Khoản 3 Điều 17 BLHS; Điều 50, Điều 58 BLHS","mcq":["TH2.02.1","TH2.02.2","TH2.02.3"]},{"cid":"TH2.03","title":"Người 15 tuổi phạm tội","text":"Ngày 05/6/2026, tại Hải Phòng, Nguyễn Hoàng Nam (sinh ngày 10/02/2011) thực hiện một hành vi có dấu hiệu tội phạm. Tháng 3/2027 vụ án mới được khởi tố.","ask":[],"guide":[],"basis":"Khoản 2 Điều 12 BLHS; Khoản 2 Điều 12, Điều 9, Điều 168 BLHS","mcq":["TH2.03.1","TH2.03.2","TH2.03.3"]},{"cid":"TH2.04","title":"Thời hiệu truy cứu trách nhiệm hình sự","text":"Ngày 01/3/2019, Hòa trộm cắp chiếc xe máy trị giá 30 triệu đồng (khoản 1 Điều 173 BLHS: phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm). Vụ việc không bị phát hiện. Ngày 10/5/2022, Hòa phạm tội lừa đảo chiếm đoạt tài sản mà mức cao nhất của khung hình phạt là 03 năm tù.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 9; điểm a khoản 2 Điều 27 BLHS; Khoản 3 Điều 27 BLHS; Khoản 2, khoản 3 Điều 27 BLHS","mcq":["TH2.04.1","TH2.04.2","TH2.04.3"]}]},{"name":"Chương 3. Hình phạt và các biện pháp tư pháp","items":[{"cid":"TH3.01","title":"Quyết định hình phạt dưới mức thấp nhất của khung","text":"Bình (25 tuổi, nhân thân tốt, phạm tội lần đầu) trộm cắp tài sản trị giá 20 triệu đồng, thuộc khoản 1 Điều 173 BLHS (phạt cải tạo không giam giữ đến 03 năm hoặc phạt tù từ 06 tháng đến 03 năm). Bình thành khẩn khai báo, ăn năn hối cải và tự nguyện bồi thường toàn bộ thiệt hại.","ask":[],"guide":[],"basis":"Khoản 1, khoản 2 Điều 51 BLHS; Khoản 3 Điều 54 BLHS; Khoản 1 Điều 65 BLHS; Nghị quyết 02/2018/NQ-HĐTP","mcq":["TH3.01.1","TH3.01.2","TH3.01.3"]},{"cid":"TH3.02","title":"Tổng hợp hình phạt nhiều tội","text":"Trong cùng một bản án, Tòa án kết án Dũng về hai tội: tội A – 08 năm tù; tội B – 02 năm cải tạo không giam giữ.","ask":[],"guide":[],"basis":"Điều 55 BLHS; Điểm c khoản 1 Điều 55 BLHS; Khoản 1 Điều 56 BLHS","mcq":["TH3.02.1","TH3.02.2","TH3.02.3"]},{"cid":"TH3.03","title":"Hình phạt và biện pháp tư pháp","text":"Hùng dùng con dao bấm đe dọa và cướp chiếc xe máy của chị Lan. Cơ quan điều tra đã thu hồi chiếc xe và con dao. Sau khi bị khởi tố, Hùng mắc bệnh tâm thần làm mất khả năng nhận thức; kết luận giám định xác định khi thực hiện hành vi Hùng có đủ năng lực trách nhiệm hình sự.","ask":[],"guide":[],"basis":"Khoản 2 Điều 47, Điều 48 BLHS; Điểm a khoản 1 Điều 47 BLHS; Khoản 2 Điều 49 BLHS","mcq":["TH3.03.1","TH3.03.2","TH3.03.3"]}]},{"name":"Chương 4. Xử lý hình sự đối với người chưa thành niên","items":[{"cid":"TH4.01","title":"Xử lý chuyển hướng người 16 tuổi","text":"Tháng 02/2026, Khánh (16 tuổi 3 tháng) lần đầu trộm cắp một chiếc điện thoại trị giá 15 triệu đồng (tội thuộc khoản 1 Điều 173 BLHS – tội ít nghiêm trọng). Khánh thừa nhận hành vi, gia đình đã bồi thường cho bị hại. Gia đình đề nghị áp dụng biện pháp xử lý chuyển hướng.","ask":[],"guide":[],"basis":"Điều 37, Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 39 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 36 Luật Tư pháp người chưa thành niên số 59/2024/QH15","mcq":["TH4.01.1","TH4.01.2","TH4.01.3"]},{"cid":"TH4.02","title":"Hình phạt đối với người 15 tuổi phạm tội cướp","text":"Minh (15 tuổi) cùng hai người bạn dùng dao đe dọa cướp tài sản của người đi đường; hành vi thuộc khoản 2 Điều 168 BLHS (phạt tù từ 07 năm đến 15 năm). Đây là lần thứ hai Minh phạm tội rất nghiêm trọng.","ask":[],"guide":[],"basis":"Khoản 1 Điều 38 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 119 Luật Tư pháp người chưa thành niên số 59/2024/QH15; Điều 58 BLHS; Điều 12 Luật Tư pháp người chưa thành niên số 59/2024/QH15","mcq":["TH4.02.1","TH4.02.2","TH4.02.3"]}]},{"name":"Chương 5. Giới thiệu một số nhóm tội phạm cụ thể","items":[{"cid":"TH5.01","title":"Phân biệt các tội chiếm đoạt","text":"Có ba tình huống độc lập: (1) A lén lút lấy chiếc điện thoại trị giá 8 triệu đồng của B để trên bàn khi B đi vắng; (2) C đi xe máy áp sát, giật chiếc điện thoại 8 triệu đồng trên tay D rồi tăng ga bỏ chạy; (3) E mượn chiếc điện thoại 8 triệu đồng của F rồi đem bán, bỏ trốn khỏi địa phương.","ask":[],"guide":[],"basis":"Khoản 1 Điều 173 BLHS; Điều 171 BLHS; Điểm a khoản 1 Điều 175 BLHS","mcq":["TH5.01.1","TH5.01.2","TH5.01.3"]},{"cid":"TH5.02","title":"Nhận lợi ích để ký giấy phép","text":"Ông X – Trưởng phòng một cơ quan cấp tỉnh có thẩm quyền thẩm định hồ sơ cấp phép – nhận 50 triệu đồng từ giám đốc Công ty Y để đẩy nhanh và cho qua hồ sơ còn thiếu điều kiện. Giám đốc Công ty Y không bị ông X ép buộc; sau đó ông này tự đến cơ quan công an khai báo trước khi vụ việc bị phát giác.","ask":[],"guide":[],"basis":"Khoản 1 Điều 354 BLHS; Khoản 6, khoản 7 Điều 364 BLHS; Điều 15 BLTTHS","mcq":["TH5.02.1","TH5.02.2","TH5.02.3"]}]},{"name":"Chương 6. Dự báo và phòng ngừa tội phạm","items":[{"cid":"TH6.01","title":"Số liệu trộm cắp tăng 20%","text":"Một địa phương ghi nhận số vụ trộm cắp tài sản năm 2025 tăng 20% so với năm 2024. Cùng năm, địa phương triển khai tiếp nhận tin báo qua ứng dụng trực tuyến và mở đợt cao điểm tấn công tội phạm. Nhóm nghiên cứu được giao dự báo tình hình năm 2026.","ask":[],"guide":[],"basis":"Giáo trình Tội phạm học","mcq":["TH6.01.1","TH6.01.2","TH6.01.3"]},{"cid":"TH6.02","title":"Phòng ngừa lừa đảo trực tuyến nhắm vào sinh viên","text":"Một trường đại học ghi nhận nhiều sinh viên bị lừa đảo qua mạng (giả danh công an, việc làm online, học bổng giả). Nhà trường muốn phối hợp cơ quan công an, gia đình và đoàn thể sinh viên xây dựng chương trình phòng ngừa.","ask":[],"guide":[],"basis":"Giáo trình Tội phạm học; Điều 4 BLHS","mcq":["TH6.02.1","TH6.02.2","TH6.02.3"]}]}],"vb":[{"name":"Hiến pháp, bộ luật và luật","rows":[{"t":"Hiến pháp nước CHXHCN Việt Nam năm 2013 (sửa đổi, bổ sung năm 2025)","d":"28/11/2013","org":"Quốc hội","note":"Nguyên tắc suy đoán vô tội (Điều 31); quyền con người chỉ bị hạn chế theo luật (Điều 14)","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"t":"Bộ luật Hình sự số 100/2015/QH13","d":"27/11/2015","org":"Quốc hội","note":"Hiệu lực 01/01/2018; tra cứu bản hợp nhất 135/VBHN-VPQH ngày 05/9/2025","url":"https://thuvienphapluat.vn/van-ban/Trach-nhiem-hinh-su/Bo-luat-hinh-su-2015-296661.aspx"},{"t":"Luật số 12/2017/QH14 sửa đổi, bổ sung một số điều của Bộ luật Hình sự","d":"20/06/2017","org":"Quốc hội","note":"Hiệu lực 01/01/2018; đã được hợp nhất","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=12/2017/QH14&match=True"},{"t":"Luật số 86/2025/QH15 sửa đổi, bổ sung một số điều của Bộ luật Hình sự","d":"25/06/2025","org":"Quốc hội","note":"Hiệu lực 01/7/2025; bỏ tử hình 8 tội, bổ sung Điều 256a, sửa Điều 40, 49, 63; có điều khoản chuyển tiếp","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=86/2025/QH15&match=True"},{"t":"Luật Tư pháp người chưa thành niên số 59/2024/QH15","d":"30/11/2024","org":"Quốc hội","note":"Hiệu lực 01/01/2026; xử lý chuyển hướng, hình phạt đối với người chưa thành niên (Chương 4)","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=59/2024/QH15&match=True"},{"t":"Bộ luật Tố tụng hình sự số 101/2015/QH13 (đã sửa đổi, bổ sung)","d":"27/11/2015","org":"Quốc hội","note":"Trách nhiệm chứng minh, thủ tục giải quyết vụ án hình sự","url":"https://thuvienphapluat.vn/van-ban/Trach-nhiem-hinh-su/Bo-luat-to-tung-hinh-su-2015-296884.aspx"}]},{"name":"Văn bản hợp nhất và văn bản hướng dẫn","rows":[{"t":"Văn bản hợp nhất số 135/VBHN-VPQH – Bộ luật Hình sự","d":"05/09/2025","org":"Văn phòng Quốc hội","note":"Dùng khi tra cứu nội dung BLHS sau các lần sửa đổi","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%20135/VBHN-VPQH%20%E2%80%93%20B%E1%BB%99%20lu%E1%BA%ADt%20H%C3%ACnh%20s%E1%BB%B1&match=True"},{"t":"Văn bản hợp nhất số 107/VBHN-VPQH – Luật Tư pháp người chưa thành niên","d":"27/08/2025","org":"Văn phòng Quốc hội","note":"Tra cứu Luật 59/2024/QH15","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%20107/VBHN-VPQH%20%E2%80%93%20Lu%E1%BA%ADt%20T%C6%B0%20ph%C3%A1p%20ng%C6%B0%E1%BB%9Di%20ch%C6%B0a%20th%C3%A0nh%20ni%C3%AAn&match=True"},{"t":"Nghị quyết 02/2018/NQ-HĐTP hướng dẫn áp dụng Điều 65 BLHS về án treo (sửa đổi bởi Nghị quyết 01/2022/NQ-HĐTP)","d":"15/05/2018","org":"Hội đồng Thẩm phán TANDTC","note":"Điều kiện cho hưởng án treo, thời gian thử thách","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=02/2018/NQ-H%C4%90TP&match=True"},{"t":"Nghị quyết 04/2019/NQ-HĐTP về quy trình lựa chọn, công bố và áp dụng án lệ","d":"18/06/2019","org":"Hội đồng Thẩm phán TANDTC","note":"Vai trò của án lệ (Chương 1)","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=04/2019/NQ-H%C4%90TP&match=True"}]},{"name":"Tài liệu học thuật","rows":[{"t":"Giáo trình Tội phạm học, Trường Đại học Nội vụ Hà Nội","d":"2024","org":"","note":"Tài liệu học thuật cho Chương 6; không phải văn bản quy phạm pháp luật","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=T%E1%BB%99i%20ph%E1%BA%A1m%20h%E1%BB%8Dc"}]}],"al":[],"ly":{"root":"Luật Hình sự","ch":[{"t":"Chương 1. Những vấn đề cơ bản về luật hình sự","cs":"Điều 1–7 BLHS; khoản 1 Điều 31 Hiến pháp","b":["Luật hình sự là ngành luật quy định tội phạm, hình phạt và các chế định liên quan đến trách nhiệm hình sự (TNHS).","Văn bản tra cứu: BLHS 2015 (VBHN 135/VBHN-VPQH ngày 05/9/2025), Luật 12/2017/QH14, Luật 86/2025/QH15, Luật Tư pháp người chưa thành niên 59/2024/QH15."],"c":[{"t":"Đối tượng và phương pháp điều chỉnh","cs":"Điều 1, 2 BLHS","b":["Đối tượng: quan hệ xã hội phát sinh giữa Nhà nước và người (pháp nhân thương mại) phạm tội khi tội phạm được thực hiện.","Phương pháp: quyền uy – Nhà nước buộc người phạm tội chịu TNHS, không cần sự đồng ý của họ.","Phân biệt: luật hình sự là luật nội dung (tội phạm, hình phạt); luật tố tụng hình sự là luật hình thức (trình tự, thủ tục)."]},{"t":"Nhiệm vụ và nguyên tắc","cs":"Điều 1, 2, 3, 4 BLHS","b":["Nhiệm vụ (Điều 1): bảo vệ chủ quyền, an ninh, chế độ, quyền con người, quyền công dân…; giáo dục ý thức tuân theo pháp luật, phòng ngừa tội phạm.","Nguyên tắc pháp chế (Điều 2): chỉ người phạm một tội đã được BLHS quy định mới chịu TNHS; pháp nhân thương mại chỉ chịu TNHS về các tội tại Điều 76.","Nguyên tắc xử lý (Điều 3): phát hiện kịp thời, xử lý nhanh chóng, công minh; bình đẳng; nghiêm trị người chủ mưu, cầm đầu, côn đồ, tái phạm nguy hiểm…; khoan hồng với người tự thú, thành khẩn, lập công, tự nguyện khắc phục.","Trách nhiệm phòng ngừa (Điều 4) thuộc về cơ quan nhà nước, tổ chức và mọi công dân."]},{"t":"Nguồn của luật hình sự","cs":"Điều 2 BLHS; Nghị quyết 04/2019/NQ-HĐTP","b":["BLHS là nguồn duy nhất quy định tội phạm và hình phạt; nghị định chỉ quy định vi phạm hành chính.","Nghị quyết của Hội đồng Thẩm phán TAND tối cao hướng dẫn áp dụng thống nhất; án lệ được nghiên cứu, áp dụng nhưng không tạo tội danh mới.","Cấm áp dụng tương tự pháp luật để buộc tội."]},{"t":"Hiệu lực theo không gian","cs":"Điều 5, 6 BLHS","b":["Mọi hành vi phạm tội thực hiện trên lãnh thổ Việt Nam (hành vi hoặc hậu quả xảy ra trên lãnh thổ) đều bị xử lý theo BLHS; áp dụng cả trên tàu bay, tàu biển mang quốc tịch Việt Nam, vùng đặc quyền kinh tế, thềm lục địa.","Người hưởng quyền miễn trừ ngoại giao, lãnh sự: giải quyết theo điều ước, tập quán quốc tế hoặc con đường ngoại giao.","Công dân, pháp nhân thương mại Việt Nam phạm tội ở nước ngoài có thể bị truy cứu theo BLHS (khoản 1 Điều 6); người nước ngoài phạm tội ở nước ngoài xâm hại lợi ích Việt Nam cũng có thể bị truy cứu (khoản 2)."]},{"t":"Hiệu lực theo thời gian","cs":"Điều 7 BLHS; Luật 86/2025/QH15","b":["Áp dụng điều luật có hiệu lực tại thời điểm thực hiện hành vi phạm tội.","Không hồi tố điều luật bất lợi: tội phạm mới, hình phạt nặng hơn, tình tiết tăng nặng mới, hạn chế án treo, miễn TNHS…","Hồi tố điều luật có lợi: xóa bỏ tội phạm, hình phạt; hình phạt nhẹ hơn; tình tiết giảm nhẹ mới; mở rộng miễn TNHS, án treo, xóa án tích…","Ví dụ: Luật 86/2025/QH15 (hiệu lực 01/7/2025) bỏ tử hình 8 tội – áp dụng cho cả hành vi trước ngày đó chưa xét xử."]}]},{"t":"Chương 2. Tội phạm và trách nhiệm hình sự","cs":"Điều 8–29, 74–76 BLHS","b":["Tội phạm là hành vi nguy hiểm cho xã hội, được quy định trong BLHS, có lỗi, do chủ thể có năng lực TNHS (hoặc pháp nhân thương mại) thực hiện, phải chịu hình phạt."],"c":[{"t":"Khái niệm và phân loại tội phạm","cs":"Điều 8, 9 BLHS","b":["Dấu hiệu: tính nguy hiểm cho xã hội; tính có lỗi; tính trái pháp luật hình sự; tính phải chịu hình phạt.","Hành vi có dấu hiệu tội phạm nhưng tính nguy hiểm không đáng kể thì không phải tội phạm (khoản 2 Điều 8).","Phân loại theo mức cao nhất của khung: ít nghiêm trọng (đến 03 năm tù), nghiêm trọng (trên 03–07 năm), rất nghiêm trọng (trên 07–15 năm), đặc biệt nghiêm trọng (trên 15–20 năm, chung thân, tử hình)."]},{"t":"Cấu thành tội phạm","cs":"Điều 8 BLHS; Phần các tội phạm","b":["Bốn yếu tố: khách thể (quan hệ xã hội bị xâm hại); mặt khách quan (hành vi, hậu quả, quan hệ nhân quả, công cụ, thủ đoạn, thời gian, địa điểm); chủ thể (năng lực TNHS, tuổi, chủ thể đặc biệt); mặt chủ quan (lỗi, động cơ, mục đích).","Cấu thành vật chất (hậu quả là dấu hiệu bắt buộc) và cấu thành hình thức (hoàn thành khi thực hiện hành vi, ví dụ tội cướp tài sản)."]},{"t":"Lỗi","cs":"Điều 10, 11, 20 BLHS","b":["Cố ý trực tiếp: thấy trước hậu quả và mong muốn; cố ý gián tiếp: thấy trước, không mong muốn nhưng để mặc.","Vô ý vì quá tự tin: thấy trước nhưng cho rằng không xảy ra hoặc ngăn ngừa được; vô ý do cẩu thả: không thấy trước dù phải thấy trước và có thể thấy trước.","Sự kiện bất ngờ (Điều 20): không thể hoặc không buộc phải thấy trước hậu quả – không có lỗi, không chịu TNHS."]},{"t":"Chủ thể của tội phạm","cs":"Điều 12, 13, 21, 75 BLHS","b":["Từ đủ 16 tuổi: chịu TNHS về mọi tội phạm (trừ luật quy định khác).","Từ đủ 14 đến dưới 16 tuổi: chỉ chịu TNHS về tội rất nghiêm trọng, đặc biệt nghiêm trọng tại danh mục khoản 2 Điều 12 (Điều 123, 134, 141, 142, 168, 169, 170, 171, 173, 178, 248–252…).","Tình trạng không có năng lực TNHS (Điều 21) – không chịu TNHS; say rượu, bia, chất kích thích (Điều 13) – vẫn chịu TNHS.","Pháp nhân thương mại chịu TNHS khi: nhân danh pháp nhân; vì lợi ích pháp nhân; có sự chỉ đạo, điều hành, chấp thuận; chưa hết thời hiệu (Điều 75); TNHS pháp nhân không loại trừ TNHS cá nhân."]},{"t":"Các giai đoạn thực hiện tội phạm","cs":"Điều 14, 15, 16, 57 BLHS","b":["Chuẩn bị phạm tội: tìm kiếm, sửa soạn công cụ, phương tiện, tạo điều kiện; chỉ chịu TNHS ở các tội tại khoản 2, 3 Điều 14 (người 14–16 tuổi: Điều 123, 168).","Phạm tội chưa đạt: không thực hiện được đến cùng vì nguyên nhân ngoài ý muốn; hình phạt theo Điều 57 (khung có tử hình, chung thân → không quá 20 năm tù; tù có thời hạn → không quá 3/4).","Tự ý nửa chừng chấm dứt (Điều 16): tự mình dừng lại dù không có gì ngăn cản → miễn TNHS về tội định phạm."]},{"t":"Đồng phạm","cs":"Điều 17, 18, 19, 58 BLHS","b":["Đồng phạm: hai người trở lên cố ý cùng thực hiện một tội phạm; phạm tội có tổ chức là hình thức đồng phạm có câu kết chặt chẽ.","Người tổ chức, người thực hành, người xúi giục, người giúp sức (khoản 3 Điều 17).","Che giấu tội phạm (Điều 18), không tố giác (Điều 19) không phải đồng phạm nếu không hứa hẹn trước; thân nhân (ông bà, cha mẹ, con, cháu, anh chị em ruột, vợ chồng) không chịu TN
