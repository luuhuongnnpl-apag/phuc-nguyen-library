quyết; quyết định giải quyết khiếu nại của Chánh án là quyết định cuối cùng. Không có cơ chế khiếu nại tiếp hay kháng cáo.","b":"Khoản 1 Điều 141 BLTTDS"},{"id":"5.12","g":5,"lv":"VD","q":"Trường hợp nào Tòa án phải ra quyết định hủy bỏ biện pháp khẩn cấp tạm thời đang áp dụng?","o":["Vụ án bị tạm đình chỉ giải quyết","Người bị áp dụng gửi đơn khiếu nại","Phiên tòa bị hoãn","Người yêu cầu áp dụng đề nghị hủy bỏ"],"a":3,"e":"Điểm a khoản 1 Điều 138 BLTTDS: Tòa án ra quyết định hủy bỏ biện pháp khẩn cấp tạm thời đã được áp dụng khi người yêu cầu áp dụng đề nghị hủy bỏ. Việc hoãn phiên tòa, tạm đình chỉ vụ án hay đơn khiếu nại của người bị áp dụng không phải căn cứ hủy bỏ.","b":"Điểm a khoản 1 Điều 138 BLTTDS"},{"id":"5.13","g":5,"lv":"TH","q":"Tòa án tự mình áp dụng biện pháp khẩn cấp tạm thời không đúng, gây thiệt hại cho người bị áp dụng. Ai chịu trách nhiệm bồi thường?","o":["Viện kiểm sát đã kiểm sát việc áp dụng biện pháp","Tòa án, theo pháp luật về trách nhiệm bồi thường của Nhà nước","Người bị áp dụng tự chịu vì đã không khiếu nại","Nguyên đơn trong vụ án, dù không có yêu cầu"],"a":1,"e":"Khoản 2 Điều 113 BLTTDS: trường hợp Tòa án tự mình áp dụng biện pháp khẩn cấp tạm thời mà gây thiệt hại thì Tòa án phải bồi thường theo quy định của pháp luật về trách nhiệm bồi thường của Nhà nước. Nếu biện pháp được áp dụng theo yêu cầu không đúng thì người yêu cầu phải bồi thường (khoản 1).","b":"Khoản 2 Điều 113 BLTTDS"},{"id":"5.14","g":5,"lv":"TH","q":"Thời hạn niêm yết công khai văn bản tố tụng là bao lâu?","o":["30 ngày kể từ ngày niêm yết","03 ngày làm việc kể từ ngày niêm yết","15 ngày kể từ ngày niêm yết","07 ngày kể từ ngày niêm yết"],"a":2,"e":"Khoản 3 Điều 179 BLTTDS: việc niêm yết công khai văn bản tố tụng được thực hiện trong thời hạn 15 ngày kể từ ngày niêm yết, tại trụ sở Tòa án, nơi cư trú hoặc nơi cư trú cuối cùng của người được niêm yết và trụ sở Ủy ban nhân dân cấp xã.","b":"Khoản 3 Điều 179 BLTTDS"},{"id":"5.15","g":5,"lv":"TH","q":"Niêm yết công khai văn bản tố tụng được thực hiện khi nào?","o":["Khi không thể cấp, tống đạt, thông báo trực tiếp cho người nhận","Bất cứ khi nào Tòa án thấy thuận tiện hơn tống đạt","Chỉ đối với bản án, quyết định phúc thẩm","Chỉ khi đương sự yêu cầu và nộp lệ phí niêm yết"],"a":0,"e":"Khoản 1 Điều 179 BLTTDS: niêm yết công khai chỉ được thực hiện khi không thể cấp, tống đạt, thông báo trực tiếp hoặc qua bưu điện cho người được cấp, tống đạt, thông báo. Đây là phương thức thay thế, không phải lựa chọn tùy ý của Tòa án.","b":"Khoản 1 Điều 179 BLTTDS"},{"id":"5.16","g":5,"lv":"TH","q":"Thông báo văn bản tố tụng trên báo hàng ngày của trung ương phải được đăng như thế nào?","o":["Hai số cách nhau 07 ngày","Ba số liên tiếp","Một số duy nhất","Năm số liên tiếp"],"a":1,"e":"Điều 180 BLTTDS: việc thông báo trên phương tiện thông tin đại chúng được thực hiện trên báo hàng ngày của trung ương trong ba số liên tiếp và trên đài phát thanh hoặc đài truyền hình của trung ương ba lần trong 03 ngày liên tiếp. Một số duy nhất hoặc hai số cách nhau không đáp ứng yêu cầu luật định.","b":"Khoản 3 Điều 180 BLTTDS"},{"id":"5.17","g":5,"lv":"TH","q":"Người thực hiện tống đạt đến nơi cư trú nhưng đương sự vắng mặt. Văn bản tố tụng có thể giao cho ai?","o":["Người thân thích đủ năng lực hành vi cùng nơi cư trú, cam kết giao lại","Bất kỳ người hàng xóm nào đang có mặt và đồng ý ký nhận thay","Để vào hộp thư tại nơi cư trú mà không cần lập biên bản","Con 12 tuổi của đương sự đang ở nhà, có ký nhận thay"],"a":0,"e":"Khoản 5 Điều 177 BLTTDS: trường hợp người được tống đạt vắng mặt, văn bản có thể giao cho người thân thích có đủ năng lực hành vi dân sự cùng cư trú với họ (hoặc tổ trưởng tổ dân phố, Ủy ban nhân dân, Công an cấp xã) và người nhận phải ký nhận, cam kết giao lại tận tay. Hàng xóm bất kỳ, trẻ 12 tuổi hay việc bỏ vào hộp thư không đáp ứng điều kiện này.","b":"Khoản 5 Điều 177 BLTTDS"},{"id":"5.18","g":5,"lv":"TH","q":"Văn bản tố tụng được gửi qua dịch vụ bưu chính bằng thư bảo đảm. Thời điểm để tính thời hạn tố tụng là khi nào?","o":["Ngày thứ 15 kể từ ngày gửi thư bảo đảm","Ngày người nhận xác nhận đã nhận văn bản","Ngày Tòa án gửi thư bảo đảm tại bưu cục","Ngày Thẩm phán ký ban hành văn bản tố tụng"],"a":1,"e":"Khoản 2 Điều 175 BLTTDS: trường hợp cấp, tống đạt, thông báo qua dịch vụ bưu chính thì ngày được cấp, tống đạt, thông báo là ngày người được cấp, tống đạt, thông báo nhận được văn bản do tổ chức dịch vụ bưu chính chuyển đến. Thời hạn tố tụng tính từ ngày nhận, không tính từ ngày ký hay ngày gửi.","b":"Khoản 2 Điều 175 BLTTDS"},{"id":"5.19","g":5,"lv":"TH","q":"Yêu cầu áp dụng thời hiệu phải được đương sự đưa ra trước thời điểm nào?","o":["Trước khi Tòa án cấp phúc thẩm ra bản án, quyết định","Trước khi Tòa án cấp sơ thẩm ra bản án, quyết định","Trước khi Tòa án thụ lý vụ án, ghi trong bản tự khai","Không cần, vì Tòa án có trách nhiệm tự áp dụng thời hiệu"],"a":1,"e":"Khoản 2 Điều 184 BLTTDS: Tòa án chỉ áp dụng quy định về thời hiệu theo yêu cầu áp dụng thời hiệu của một bên hoặc các bên với điều kiện yêu cầu này phải được đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định giải quyết vụ việc. Tòa án không tự áp dụng thời hiệu.","b":"Khoản 2 Điều 184 BLTTDS"},{"id":"5.20","g":5,"lv":"TH","q":"Tranh chấp nào sau đây không áp dụng thời hiệu khởi kiện?","o":["Yêu cầu bồi thường thiệt hại ngoài hợp đồng do tài sản gây ra","Tranh chấp về quyền sử dụng đất theo quy định của Luật Đất đai","Tranh chấp hợp đồng vay tài sản có lãi suất","Tranh chấp hợp đồng mua bán hàng hóa giữa hai cá nhân"],"a":1,"e":"Điều 185 BLTTDS dẫn chiếu BLDS và luật khác; khoản 3 Điều 155 BLDS quy định không áp dụng thời hiệu khởi kiện đối với tranh chấp về quyền sử dụng đất theo quy định của Luật Đất đai. Các tranh chấp hợp đồng và bồi thường ngoài hợp đồng còn lại đều có thời hiệu (Điều 429, Điều 588 BLDS).","b":"Điều 185 BLTTDS; khoản 3 Điều 155 BLDS"},{"id":"5.21","g":5,"lv":"VD","q":"Thời hạn kháng cáo 15 ngày kết thúc vào một ngày Chủ nhật. Thời hạn này được tính thế nào?","o":["Kết thúc đúng vào ngày Chủ nhật đó, không lùi lại","Được kéo dài thêm 03 ngày làm việc kể từ Chủ nhật","Kết thúc vào cuối ngày làm việc tiếp theo ngày Chủ nhật đó","Kết thúc vào cuối ngày thứ Bảy liền trước ngày Chủ nhật"],"a":2,"e":"Điều 183 BLTTDS dẫn chiếu cách tính thời hạn của BLDS; khoản 5 Điều 148 BLDS: khi ngày cuối cùng của thời hạn là ngày nghỉ cuối tuần hoặc ngày nghỉ lễ thì thời hạn kết thúc tại thời điểm kết thúc ngày làm việc tiếp theo ngày nghỉ đó. Thời hạn không bị rút ngắn về thứ Bảy và cũng không được cộng thêm 03 ngày.","b":"Điều 183 BLTTDS; khoản 5 Điều 148 BLDS"},{"id":"TH5.01.1","g":5,"lv":"VD","q":"Để ngăn anh Dũng bán căn nhà riêng, chị Lan nên yêu cầu áp dụng biện pháp khẩn cấp tạm thời nào?","o":["Phong tỏa tài sản của người có nghĩa vụ","Cho thu hoạch, cho bán hoa màu, sản phẩm, hàng hóa","Kê biên tài sản đang tranh chấp","Cấm thay đổi hiện trạng tài sản đang tranh chấp"],"a":0,"e":"Căn nhà riêng của anh Dũng không phải đối tượng tranh chấp nên không thể kê biên tài sản đang tranh chấp hay cấm thay đổi hiện trạng tài sản tranh chấp. Biện pháp phù hợp là phong tỏa tài sản của người có nghĩa vụ (Điều 126 BLTTDS), áp dụng khi có căn cứ cho thấy người có nghĩa vụ có tài sản và việc phong tỏa là cần thiết để bảo đảm giải quyết vụ án, thi hành án.","b":"Khoản 11 Điều 114, Điều 126 BLTTDS","cid":"TH5.01"},{"id":"TH5.01.2","g":5,"lv":"VD","q":"Nếu Tòa án chấp nhận phong tỏa căn nhà, giá trị tài sản bị phong tỏa được xác định thế nào?","o":["Tương đương nghĩa vụ tài sản mà anh Dũng phải thực hiện","Do Viện kiểm sát cùng cấp ấn định","Toàn bộ giá trị căn nhà, kể cả phần vượt quá yêu cầu","Gấp đôi số tiền chị Lan yêu cầu"],"a":0,"e":"BLTTDS giới hạn việc phong tỏa tài sản của người có nghĩa vụ ở phần giá trị tương đương với nghĩa vụ tài sản mà người đó phải thực hiện (ở đây là khoản 2 tỷ đồng chị Lan yêu cầu), nhằm không xâm phạm quá mức quyền tài sản của bị đơn. Viện kiểm sát không ấn định giá trị phong tỏa.","b":"Điều 126 BLTTDS","cid":"TH5.01"},{"id":"TH5.01.3","g":5,"lv":"VD","q":"Để ngăn anh Dũng xuất cảnh, chị Lan có thể yêu cầu biện pháp nào và có phải thực hiện biện pháp bảo đảm không?","o":["Cấm xuất cảnh đối với người có nghĩa vụ; phải nộp khoản bảo đảm bằng 2 tỷ đồng","Cấm xuất cảnh đối với người có nghĩa vụ; không phải thực hiện biện pháp bảo đảm","Cấm hoặc buộc thực hiện hành vi nhất định; phải nộp khoản bảo đảm","Tạm giữ hộ chiếu theo quyết định của Viện kiểm sát; không phải bảo đảm"],"a":1,"e":"Khoản 13 Điều 114 và Điều 128 BLTTDS: cấm xuất cảnh đối với người có nghĩa vụ được áp dụng khi việc giải quyết vụ án liên quan đến nghĩa vụ của họ và việc xuất cảnh ảnh hưởng đến lợi ích của Nhà nước, quyền lợi của người khác. Khoản 1 Điều 136 không liệt kê biện pháp này trong nhóm phải thực hiện biện pháp bảo đảm, nên chị Lan không phải nộp khoản bảo đảm.","b":"Khoản 13 Điều 114, Điều 128, khoản 1 Điều 136 BLTTDS","cid":"TH5.01"},{"id":"TH5.02.1","g":5,"lv":"VD","q":"Ở lần thứ nhất, việc giao giấy triệu tập cho vợ ông Khoa đúng pháp luật khi nào?","o":["Khi có biên bản, vợ ông ký nhận và cam kết giao lại tận tay","Khi có Kiểm sát viên chứng kiến việc giao nhận","Trong mọi trường hợp, không cần lập biên bản giao nhận","Khi vợ ông Khoa có đơn xin nhận thay gửi Tòa án"],"a":0,"e":"Khoản 5 Điều 177 BLTTDS: khi người được tống đạt vắng mặt, văn bản có thể giao cho người thân thích có đủ năng lực hành vi dân sự cùng cư trú; người nhận phải ký nhận vào biên bản và cam kết giao lại tận tay ngay cho người được tống đạt. Không cần Kiểm sát viên chứng kiến hay đơn xin nhận thay.","b":"Khoản 5 Điều 177 BLTTDS","cid":"TH5.02"},{"id":"TH5.02.2","g":5,"lv":"VD","q":"Ở lần thứ hai, ông Khoa từ chối nhận. Người thực hiện tống đạt phải làm gì?","o":["Mang giấy triệu tập về và chờ ông Khoa tự đến Tòa án nhận","Đề nghị Tòa án đình chỉ giải quyết vụ án vì bị đơn bất hợp tác","Giao giấy triệu tập cho nguyên đơn để chuyển hộ cho ông Khoa","Lập biên bản nêu lý do, có xác nhận của tổ dân phố hoặc Công an cấp xã"],"a":3,"e":"Khoản 4 Điều 177 BLTTDS: trường hợp người được tống đạt từ chối nhận văn bản, người thực hiện phải lập biên bản nêu rõ lý do, có xác nhận của tổ trưởng tổ dân phố hoặc trưởng thôn, Ủy ban nhân dân, Công an cấp xã về việc từ chối nhận. Việc từ chối không phải căn cứ đình chỉ vụ án.","b":"Khoản 4 Điều 177 BLTTDS","cid":"TH5.02"},{"id":"TH5.02.3","g":5,"lv":"VD","q":"Ở lần thứ ba, không rõ nơi ở mới của ông Khoa. Tòa án tiến hành thủ tục nào?","o":["Đình chỉ giải quyết vụ án vì không xác định được bị đơn","Trả lại đơn khởi kiện cho nguyên đơn","Niêm yết công khai văn bản tố tụng trong thời hạn 15 ngày","Tạm đình chỉ giải quyết vụ án"],"a":2,"e":"Khoản 5 Điều 177 và Điều 179 BLTTDS: trường hợp người được tống đạt đã chuyển đi nơi khác mà không rõ địa chỉ, người thực hiện lập biên bản và Tòa án thực hiện thủ tục niêm yết công khai trong thời hạn 15 ngày. Ông Khoa đã được ghi đúng địa chỉ trong đơn nên không phải căn cứ trả lại đơn hay đình chỉ.","b":"Khoản 5 Điều 177, Điều 179 BLTTDS","cid":"TH5.02"},{"id":"TH5.03.1","g":5,"lv":"VD","q":"Thời hiệu khởi kiện tranh chấp hợp đồng mua bán này là bao lâu?","o":["03 năm kể từ ngày ông Sơn biết quyền lợi bị xâm phạm","01 năm kể từ ngày giao lô hàng cho bà Thu","02 năm kể từ ngày hai bên giao kết hợp đồng","10 năm kể từ ngày đến hạn thanh toán tiền hàng"],"a":0,"e":"Điều 429 BLDS: thời hiệu khởi kiện yêu cầu Tòa án giải quyết tranh chấp hợp đồng là 03 năm kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm. Hai bên không phải thương nhân nên không áp dụng Luật Thương mại; quyền lợi bị xâm phạm từ ngày bà Thu không thanh toán khi đến hạn.","b":"Điều 429, Điều 154 BLDS; Điều 184 BLTTDS","cid":"TH5.03"},{"id":"TH5.03.2","g":5,"lv":"VD","q":"Tin nhắn ngày 10/01/2025 của bà Thu ảnh hưởng thế nào đến thời hiệu khởi kiện?","o":["Chỉ có giá trị nếu tin nhắn được công chứng, chứng thực","Làm chấm dứt thời hiệu, ông Sơn mất quyền khởi kiện","Thời hiệu bắt đầu lại từ ngày 11/01/2025, nên ông Sơn vẫn còn thời hiệu","Không ảnh hưởng, thời hiệu vẫn tính từ ngày 02/6/2022 và đã hết"],"a":2,"e":"Khoản 1 Điều 157 BLDS: thời hiệu khởi kiện bắt đầu lại khi bên có nghĩa vụ thừa nhận một phần hoặc toàn bộ nghĩa vụ của mình đối với người khởi kiện; theo khoản 2, thời hiệu bắt đầu lại kể từ ngày tiếp theo sau ngày xảy ra sự kiện đó. Tin nhắn ngày 10/01/2025 (còn trong thời hiệu tính từ 02/6/2022) làm thời hiệu bắt đầu lại từ 11/01/2025, nên tháng 9/2026 ông Sơn vẫn còn thời hiệu. Pháp luật không đòi hỏi việc thừa nhận phải được công chứng.","b":"Điều 157 BLDS","cid":"TH5.03"},{"id":"TH5.03.3","g":5,"lv":"VD","q":"Giả sử không có tin nhắn trên và bà Thu chỉ yêu cầu áp dụng thời hiệu lần đầu tại phiên tòa phúc thẩm. Tòa án cấp phúc thẩm xử lý thế nào?","o":["Không chấp nhận, vì yêu cầu này phải đưa ra trước khi cấp sơ thẩm ra bản án","Hủy bản án sơ thẩm, giao hồ sơ để xét xử sơ thẩm lại","Chấp nhận, hủy bản án sơ thẩm và đình chỉ giải quyết vụ án","Tạm đình chỉ để Tòa án cấp sơ thẩm xem xét lại thời hiệu"],"a":0,"e":"Khoản 2 Điều 184 BLTTDS: yêu cầu áp dụng thời hiệu chỉ được Tòa án chấp nhận khi được đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định. Yêu cầu đưa ra lần đầu ở phiên tòa phúc thẩm không được chấp nhận, nên không có căn cứ hủy án hay đình chỉ.","b":"Khoản 2 Điều 184 BLTTDS","cid":"TH5.03"},{"id":"6.01","g":6,"lv":"TH","q":"Theo Danh mục án phí, lệ phí Tòa án, mức án phí dân sự sơ thẩm đối với tranh chấp dân sự không có giá ngạch là bao nhiêu?","o":["200.000 đồng","300.000 đồng","500.000 đồng","3.000.000 đồng"],"a":1,"e":"Danh mục án phí, lệ phí Tòa án ban hành kèm Nghị quyết 326/2016/UBTVQH14: án phí dân sự sơ thẩm đối với tranh chấp về dân sự, hôn nhân và gia đình, lao động không có giá ngạch là 300.000 đồng. Mức 3.000.000 đồng áp dụng cho tranh chấp kinh doanh, thương mại không có giá ngạch.","b":"Danh mục án phí, lệ phí Tòa án kèm Nghị quyết 326/2016/UBTVQH14"},{"id":"6.02","g":6,"lv":"TH","q":"Mức tạm ứng án phí dân sự sơ thẩm trong vụ án có giá ngạch được xác định như thế nào?","o":["Do Thẩm phán ấn định theo khả năng kinh tế của người khởi kiện","Bằng mức án phí sơ thẩm không có giá ngạch là 300.000 đồng","Bằng toàn bộ mức án phí tính trên giá trị tài sản tranh chấp","Bằng 50% mức án phí dự tính, không thấp hơn mức không có giá ngạch"],"a":3,"e":"Khoản 2 Điều 7 Nghị quyết 326/2016/UBTVQH14: mức tạm ứng án phí dân sự sơ thẩm trong vụ án có giá ngạch bằng 50% mức án phí dân sự sơ thẩm mà Tòa án dự tính theo giá trị tài sản có tranh chấp do đương sự yêu cầu giải quyết, nhưng không thấp hơn mức án phí sơ thẩm trong vụ án không có giá ngạch.","b":"Điều 7 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.03","g":6,"lv":"TH","q":"Chủ thể nào phải nộp tiền tạm ứng án phí sơ thẩm?","o":["Chỉ nguyên đơn, kể cả phần yêu cầu phản tố của bị đơn","Bị đơn, vì là bên bị Tòa án triệu tập giải quyết","Nguyên đơn, bị đơn có phản tố, người có yêu cầu độc lập","Mọi đương sự trong vụ án, chia đều theo số người"],"a":2,"e":"Khoản 1 Điều 146 BLTTDS: nguyên đơn, bị đơn có yêu cầu phản tố đối với nguyên đơn, người có quyền lợi, nghĩa vụ liên quan có yêu cầu độc lập trong vụ án dân sự phải nộp tiền tạm ứng án phí sơ thẩm, trừ trường hợp được miễn hoặc không phải nộp. Mỗi bên nộp cho phần yêu cầu của mình, không chia đều.","b":"Khoản 1 Điều 146 BLTTDS"},{"id":"6.04","g":6,"lv":"TH","q":"Người khởi kiện phải nộp tiền tạm ứng án phí sơ thẩm trong thời hạn bao lâu kể từ ngày nhận thông báo của Tòa án?","o":["10 ngày","03 ngày làm việc","15 ngày","07 ngày"],"a":3,"e":"Khoản 1 Điều 195 BLTTDS: Thẩm phán thông báo cho người khởi kiện nộp tạm ứng án phí; trong thời hạn 07 ngày kể từ ngày nhận được thông báo, người khởi kiện phải nộp tiền và nộp biên lai cho Tòa án (Điều 17 Nghị quyết 326/2016/UBTVQH14 quy định tương tự).","b":"Điều 195 BLTTDS; Điều 17 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.05","g":6,"lv":"TH","q":"Trước khi mở phiên tòa, các đương sự hòa giải thành về việc giải quyết vụ án. Họ phải chịu án phí sơ thẩm như thế nào?","o":["Chịu toàn bộ mức án phí sơ thẩm","Chịu 25% mức án phí sơ thẩm","Không phải chịu án phí sơ thẩm","Chịu 50% mức án phí sơ thẩm"],"a":3,"e":"Khoản 3 Điều 147 BLTTDS và Điều 26 Nghị quyết 326/2016/UBTVQH14: trường hợp các đương sự thỏa thuận được với nhau về việc giải quyết vụ án trong quá trình chuẩn bị xét xử (trước khi mở phiên tòa) thì các đương sự phải chịu 50% mức án phí sơ thẩm. Việc hòa giải thành không miễn hoàn toàn án phí.","b":"Khoản 3 Điều 147 BLTTDS; Điều 26 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.06","g":6,"lv":"VD","q":"Trong vụ án ly hôn, Tòa án không chấp nhận yêu cầu ly hôn của nguyên đơn. Ai phải chịu án phí sơ thẩm?","o":["Bị đơn, vì yêu cầu của bị đơn được chấp nhận","Mỗi bên chịu một nửa mức án phí","Nguyên đơn","Không ai phải chịu vì hôn nhân vẫn tồn tại"],"a":2,"e":"Khoản 4 Điều 147 BLTTDS: trong vụ án ly hôn, nguyên đơn phải chịu án phí sơ thẩm, không phụ thuộc vào việc Tòa án chấp nhận hay không chấp nhận yêu cầu của nguyên đơn; các đương sự có thể thỏa thuận về việc chịu án phí (Điều 27 Nghị quyết 326/2016/UBTVQH14).","b":"Khoản 4 Điều 147 BLTTDS; Điều 27 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.07","g":6,"lv":"TH","q":"Tòa án cấp phúc thẩm sửa bản án sơ thẩm bị kháng cáo. Nghĩa vụ chịu án phí phúc thẩm của người kháng cáo được giải quyết thế nào?","o":["Chịu án phí phúc thẩm cùng với bị đơn","Phải chịu toàn bộ án phí phúc thẩm","Không phải chịu; án phí sơ thẩm được xác định lại","Phải chịu một nửa án phí phúc thẩm"],"a":2,"e":"Khoản 2 Điều 148 BLTTDS và Điều 29 Nghị quyết 326/2016/UBTVQH14: trường hợp Tòa án cấp phúc thẩm sửa bản án sơ thẩm bị kháng cáo thì đương sự kháng cáo không phải chịu án phí phúc thẩm; Tòa án cấp phúc thẩm phải xác định lại nghĩa vụ chịu án phí sơ thẩm.","b":"Điều 148 BLTTDS; Điều 29 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.08","g":6,"lv":"TH","q":"Trường hợp nào thuộc diện không phải nộp tiền tạm ứng án phí, không phải chịu án phí (khác với được miễn)?","o":["Người yêu cầu cấp dưỡng cho con chưa thành niên","Cá nhân thuộc hộ nghèo khởi kiện đòi nợ","Người lao động khởi kiện đòi tiền lương bị nợ","Viện kiểm sát kháng nghị theo thủ tục phúc thẩm"],"a":3,"e":"Khoản 1 Điều 11 và khoản 1 Điều 12 Nghị quyết 326/2016/UBTVQH14 phân biệt: Viện kiểm sát kháng nghị phúc thẩm thuộc diện không phải nộp tạm ứng án phí, không phải chịu án phí (do tính chất chủ thể). Người lao động đòi tiền lương, người yêu cầu cấp dưỡng, cá nhân thuộc hộ nghèo thuộc diện được miễn án phí (Điều 12) — tức là có nghĩa vụ nhưng được miễn.","b":"Khoản 1 Điều 11, khoản 1 Điều 12 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.09","g":6,"lv":"TH","q":"Đương sự được giảm 50% tạm ứng án phí, án phí trong trường hợp nào?","o":["Được bị đơn đồng ý chịu một nửa án phí","Gặp bất khả kháng, không đủ tài sản nộp, có xác nhận cấp xã","Là người cao tuổi khởi kiện đòi tài sản của mình","Có thu nhập thấp hơn mức lương tối thiểu vùng"],"a":1,"e":"Điều 13 Nghị quyết 326/2016/UBTVQH14: người gặp sự kiện bất khả kháng dẫn đến không có đủ tài sản để nộp tạm ứng án phí, án phí, có xác nhận của Ủy ban nhân dân cấp xã nơi cư trú, thì được Tòa án giảm 50% mức tạm ứng án phí, án phí. Thu nhập thấp hay sự đồng ý của bị đơn không phải căn cứ giảm.","b":"Điều 13 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.10","g":6,"lv":"TH","q":"Đơn khởi kiện chưa được thụ lý, người khởi kiện đề nghị miễn tạm ứng án phí. Ai có thẩm quyền xem xét?","o":["Thẩm phán được Chánh án phân công xem xét đơn","Thủ trưởng cơ quan thi hành án dân sự","Chánh án Tòa án nhân dân cấp tỉnh","Viện trưởng Viện kiểm sát cùng cấp"],"a":0,"e":"Khoản 1 Điều 15 Nghị quyết 326/2016/UBTVQH14: Thẩm phán được Chánh án Tòa án phân công xem xét đơn khởi kiện, đơn yêu cầu có thẩm quyền xét miễn, giảm tạm ứng án phí, lệ phí trước khi thụ lý. Sau khi thụ lý thì do Thẩm phán được phân công giải quyết hoặc Hội đồng xét xử.","b":"Điều 15 Nghị quyết 326/2016/UBTVQH14"},{"id":"6.11","g":6,"lv":"TH","q":"Nguyên đơn và bị đơn cùng yêu cầu Tòa án trưng cầu giám định một đối tượng. Tiền tạm ứng chi phí giám định do ai nộp?","o":["Nguyên đơn nộp toàn bộ","Tòa án chi trả từ ngân sách","Bị đơn nộp toàn bộ","Mỗi bên nộp một nửa"],"a":3,"e":"Khoản 1 Điều 160 BLTTDS: người yêu cầu trưng cầu giám định phải nộp tiền tạm ứng chi phí giám định; trường hợp các đương sự cùng yêu cầu thì mỗi bên phải nộp một nửa số tiền tạm ứng chi phí giám định, trừ trường hợp có thỏa thuận khác.","b":"Khoản 1 Điều 160 BLTTDS"},{"id":"6.12","g":6,"lv":"TH","q":"Người yêu cầu Tòa án trưng cầu giám định phải chịu chi phí giám định khi nào?","o":["Trong mọi trường hợp, vì họ là người yêu cầu","Khi họ kháng cáo bản án sơ thẩm của Tòa án","Chỉ khi Tòa án tự quyết định trưng cầu giám định","Kết quả giám định chứng minh yêu cầu của họ không có căn cứ"],"a":3,"e":"Khoản 1 Điều 161 BLTTDS: người yêu cầu giám định phải chịu chi phí giám định nếu kết quả giám định chứng minh yêu cầu của người đó là không có căn cứ; nếu kết quả chứng minh yêu cầu có căn cứ thì người có nghĩa vụ bị phát hiện qua giám định phải chịu.","b":"Khoản 1 Điều 161 BLTTDS"},{"id":"6.13","g":6,"lv":"TH","q":"Tòa án yêu cầu người phiên dịch tham gia tố tụng. Chi phí cho người phiên dịch do ai trả?","o":["Tòa án","Nguyên đơn","Đương sự không biết tiếng Việt","Đương sự thua kiện"],"a":0,"e":"Khoản 4 Điều 168 BLTTDS: trường hợp Tòa án yêu cầu người phiên dịch thì chi phí cho người phiên dịch do Tòa án trả. Nếu đương sự yêu cầu người phiên dịch thì đương sự đó chịu chi phí, trừ trường hợp pháp luật có quy định khác.","b":"Khoản 4 Điều 168 BLTTDS"},{"id":"6.14","g":6,"lv":"VD","q":"Người làm chứng do bị đơn đề nghị triệu tập khai đúng sự thật nhưng không đúng với yêu cầu của bị đơn. Ai chịu chi phí cho người làm chứng?","o":["Người làm chứng tự chịu","Tòa án","Nguyên đơn","Bị đơn"],"a":3,"e":"Khoản 2 Điều 167 BLTTDS: người đề nghị Tòa án triệu tập người làm chứng phải chịu chi phí cho người làm chứng nếu lời làm chứng đúng sự thật nhưng không đúng với yêu cầu của người đề nghị. Nếu lời khai đúng với yêu cầu thì đương sự có yêu cầu độc lập với người đề nghị phải chịu.","b":"Khoản 2 Điều 167 BLTTDS"},{"id":"TH6.01.1","g":6,"lv":"VD","q":"Tiền tạm ứng án phí sơ thẩm ông An phải nộp khi khởi kiện là bao nhiêu?","o":["300.000 đồng","42.000.000 đồng","50.000.000 đồng","21.000.000 đồng"],"a":3,"e":"Yêu cầu 1.000.000.000 đồng thuộc khung từ trên 800 triệu đến 2 tỷ đồng: án phí = 36.000.000 đồng + 3% của phần vượt 800.000.000 đồng = 36.000.000 + 6.000.000 = 42.000.000 đồng. Theo khoản 2 Điều 7 Nghị quyết 326/2016/UBTVQH14, tạm ứng án phí bằng 50% mức dự tính, tức 21.000.000 đồng.","b":"Điều 7 Nghị quyết 326/2016/UBTVQH14; Danh mục án phí, lệ phí Tòa án","cid":"TH6.01"},{"id":"TH6.01.2","g":6,"lv":"VD","q":"Án phí sơ thẩm đối với yêu cầu của ông An do ai chịu và bao nhiêu?","o":["Bà Bình chịu 21.000.000 đồng","Bà Bình chịu 42.000.000 đồng","Ông An chịu 42.000.000 đồng","Mỗi bên chịu 21.000.000 đồng"],"a":1,"e":"Khoản 1 Điều 147 BLTTDS: đương sự phải chịu án phí sơ thẩm nếu yêu cầu của họ không được Tòa án chấp nhận. Tòa án chấp nhận toàn bộ yêu cầu của ông An nên bà Bình (bị đơn thua kiện) chịu án phí tính trên 1 tỷ đồng, tức 42.000.000 đồng; ông An được trả lại tạm ứng án phí.","b":"Khoản 1 Điều 147 BLTTDS; Điều 26 Nghị quyết 326/2016/UBTVQH14; Danh mục án phí, lệ phí Tòa án","cid":"TH6.01"},{"id":"TH6.01.3","g":6,"lv":"VD","q":"Án phí sơ thẩm đối với yêu cầu phản tố không được chấp nhận được giải quyết thế nào?","o":["Không ai chịu vì phản tố chỉ để bù trừ","Bà Bình chịu 5.000.000 đồng","Bà Bình chịu 300.000 đồng","Ông An chịu 5.000.000 đồng"],"a":1,"e":"Khoản 1 Điều 147 BLTTDS: bị đơn có yêu cầu phản tố không được chấp nhận phải chịu án phí đối với phần yêu cầu đó. Yêu cầu 100.000.000 đồng thuộc khung từ trên 6 triệu đến 400 triệu đồng, án phí bằng 5% giá trị, tức 5.000.000 đồng, do bà Bình chịu.","b":"Khoản 1 Điều 147 BLTTDS; Danh mục án phí, lệ phí Tòa án","cid":"TH6.01"},{"id":"TH6.02.1","g":6,"lv":"VD","q":"Án phí sơ thẩm về yêu cầu ly hôn do ai chịu?","o":["Anh Tuấn chịu 300.000 đồng","Mỗi bên chịu 150.000 đồng","Không ai chịu vì đã chia tài sản","Chị Hoa chịu 300.000 đồng"],"a":3,"e":"Khoản 4 Điều 147 BLTTDS và Điều 27 Nghị quyết 326/2016/UBTVQH14: trong vụ án ly hôn, nguyên đơn chịu án phí sơ thẩm về yêu cầu ly hôn (không có giá ngạch, 300.000 đồng), không phụ thuộc kết quả. Chị Hoa là nguyên đơn nên chịu 300.000 đồng.","b":"Khoản 4 Điều 147 BLTTDS; Điều 27 Nghị quyết 326/2016/UBTVQH14","cid":"TH6.02"},{"id":"TH6.02.2","g":6,"lv":"VD","q":"Án phí sơ thẩm đối với phần chia tài sản chung được tính thế nào?","o":["Chị Hoa chịu 72.000.000 đồng","Mỗi người chịu 36.000.000 đồng","Anh Tuấn chịu toàn bộ 72.000.000 đồng","Mỗi người chịu 42.000.000 đồng"],"a":3,"e":"Khoản 2 Điều 147 BLTTDS và Điều 27 Nghị quyết 326/2016/UBTVQH14: khi chia tài sản chung, mỗi bên chịu án phí tương ứng với giá trị phần tài sản mình được chia. Mỗi người được 1.000.000.000 đồng, án phí = 36.000.000 + 3% × 200.000.000 = 42.000.000 đồng/người. Không tính một lần trên tổng 2 tỷ rồi chia đôi (sẽ ra 36.000.000 đồng/người).","b":"Khoản 2 Điều 147 BLTTDS; Điều 27 Nghị quyết 326/2016/UBTVQH14; Danh mục án phí, lệ phí Tòa án","cid":"TH6.02"},{"id":"TH6.02.3","g":6,"lv":"VD","q":"Chi phí định giá căn nhà do ai chịu?","o":["Tòa án chịu vì đã ra quyết định định giá","Chị Hoa chịu vì là nguyên đơn khởi kiện","Anh Tuấn chịu vì là người yêu cầu định giá","Mỗi người chịu theo tỷ lệ phần tài sản được chia"],"a":3,"e":"Khoản 2 Điều 165 BLTTDS: trường hợp các bên có tài sản chung yêu cầu chia tài sản chung thì mỗi bên phải chịu chi phí định giá tài sản tương ứng với tỷ lệ giá trị phần tài sản mà họ được chia. Không áp dụng nguyên tắc người yêu cầu định giá chịu chi phí trong trường hợp này.","b":"Khoản 2 Điều 165 BLTTDS","cid":"TH6.02"},{"id":"7.01","g":7,"lv":"TH","q":"Chủ thể nào sau đây có quyền khởi kiện vụ án dân sự để bảo vệ quyền, lợi ích hợp pháp của người khác?","o":["Tòa án nơi xảy ra hành vi vi phạm","Người làm chứng biết rõ sự việc","Hàng xóm của người bị xâm phạm quyền lợi","Công đoàn cấp trên của công đoàn cơ sở"],"a":3,"e":"Điều 187 BLTTDS: công đoàn cấp trên của công đoàn cơ sở có quyền khởi kiện vụ án lao động khi cần bảo vệ quyền, lợi ích hợp pháp của tập thể người lao động; cơ quan, tổ chức khác cũng có quyền khởi kiện để bảo vệ người khác trong phạm vi nhiệm vụ của mình. Cá nhân bất kỳ, Tòa án hay người làm chứng không có quyền này.","b":"Điều 187 BLTTDS"},{"id":"7.02","g":7,"lv":"TH","q":"Người khởi kiện gửi đơn qua dịch vụ bưu chính. Ngày khởi kiện được xác định là ngày nào?","o":["Ngày Tòa án nhận được đơn khởi kiện qua đường bưu chính","Ngày Tòa án ra thông báo thụ lý vụ án","Ngày có dấu của tổ chức bưu chính nơi gửi","Ngày người khởi kiện ghi trên đơn"],"a":2,"e":"Khoản 2 Điều 190 BLTTDS: trường hợp gửi đơn qua dịch vụ bưu chính thì ngày khởi kiện là ngày có dấu của tổ chức dịch vụ bưu chính nơi gửi. Không lấy ngày Tòa án nhận đơn hay ngày ghi trên đơn.","b":"Khoản 2 Điều 190 BLTTDS"},{"id":"7.03","g":7,"lv":"TH","q":"Kể từ ngày được phân công, Thẩm phán phải xem xét đơn khởi kiện trong thời hạn bao lâu?","o":["07 ngày","15 ngày","05 ngày làm việc","03 ngày làm việc"],"a":2,"e":"Khoản 3 Điều 191 BLTTDS: trong thời hạn 05 ngày làm việc kể từ ngày được phân công, Thẩm phán phải xem xét đơn khởi kiện và ra một trong các quyết định: yêu cầu sửa đổi, bổ sung đơn; thụ lý vụ án; chuyển đơn cho Tòa án có thẩm quyền; trả lại đơn.","b":"Khoản 3 Điều 191 BLTTDS"},{"id":"7.04","g":7,"lv":"TH","q":"Trường hợp người khởi kiện phải nộp tiền tạm ứng án phí, Thẩm phán thụ lý vụ án khi nào?","o":["Khi Chánh án ký quyết định phân công Thẩm phán","Khi Tòa án nhận được đơn khởi kiện hợp lệ kèm đủ tài liệu, chứng cứ","Khi bị đơn nộp văn bản ghi ý kiến cho Tòa án","Khi người khởi kiện nộp biên lai thu tiền tạm ứng án phí"],"a":3,"e":"Khoản 3 Điều 195 BLTTDS: Thẩm phán thụ lý vụ án khi người khởi kiện nộp cho Tòa án biên lai thu tiền tạm ứng án phí. Đơn hợp lệ là điều kiện cần nhưng chưa đủ khi người khởi kiện phải nộp tạm ứng án phí.","b":"Điều 195 BLTTDS"},{"id":"7.05","g":7,"lv":"TH","q":"Trường hợp nào sau đây là căn cứ để Thẩm phán trả lại đơn khởi kiện?","o":["Tài liệu kèm theo chưa đủ chứng minh toàn bộ yêu cầu","Người khởi kiện không có luật sư bảo vệ quyền lợi khi nộp đơn","Không nộp tạm ứng án phí đúng hạn, không có lý do chính đáng","Bị đơn đang cư trú, làm việc ở nước ngoài trong thời gian dài"],"a":2,"e":"Khoản 1 Điều 192 BLTTDS: Thẩm phán trả lại đơn khởi kiện khi người khởi kiện không nộp tiền tạm ứng án phí trong thời hạn quy định, trừ trường hợp được miễn, không phải nộp hoặc có lý do chính đáng. Bị đơn ở nước ngoài, không có luật sư hay chứng cứ chưa đầy đủ không phải căn cứ trả lại đơn.","b":"Khoản 1 Điều 192 BLTTDS"},{"id":"7.06","g":7,"lv":"TH","q":"Người khởi kiện có quyền khiếu nại việc trả lại đơn khởi kiện trong thời hạn bao lâu kể từ ngày nhận văn bản trả lại đơn?","o":["01 tháng","05 ngày làm việc","10 ngày","03 ngày làm việc"],"a":2,"e":"Khoản 1 Điều 194 BLTTDS: trong thời hạn 10 ngày kể từ ngày nhận được văn bản trả lại đơn khởi kiện, người khởi kiện có quyền khiếu nại, Viện kiểm sát có quyền kiến nghị với Tòa án đã trả lại đơn.","b":"Khoản 1 Điều 194 BLTTDS"},{"id":"7.07","g":7,"lv":"TH","q":"Theo khoản 6 Điều 194 BLTTDS sửa đổi năm 2025, quyết định giải quyết khiếu nại việc trả lại đơn của Chánh án Tòa án trên một cấp trực tiếp có tính chất gì?","o":["Phải được Viện trưởng Viện kiểm sát cấp tỉnh chấp thuận","Có thể bị kháng nghị theo thủ tục phúc thẩm","Là quyết định cuối cùng, có hiệu lực thi hành","Có thể bị khiếu nại lên Chánh án Tòa án nhân dân tối cao"],"a":2,"e":"Khoản 6 Điều 194 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): quyết định giải quyết khiếu nại, kiến nghị về việc trả lại đơn của Chánh án Tòa án trên một cấp trực tiếp là quyết định cuối cùng và có hiệu lực thi hành. Không bị khiếu nại tiếp lên Chánh án TAND tối cao, không bị kháng nghị phúc thẩm.","b":"Khoản 6 Điều 194 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"7.08","g":7,"lv":"TH","q":"Bị đơn phải nộp văn bản ghi ý kiến đối với yêu cầu của người khởi kiện trong thời hạn bao lâu kể từ ngày nhận thông báo thụ lý?","o":["15 ngày, có thể được gia hạn không quá 15 ngày","07 ngày, không được gia hạn","01 tháng, có thể được gia hạn không quá 01 tháng","10 ngày, có thể được gia hạn không quá 10 ngày"],"a":0,"e":"Khoản 1 Điều 199 BLTTDS: trong thời hạn 15 ngày kể từ ngày nhận được thông báo thụ lý, người được thông báo phải nộp cho Tòa án văn bản ghi ý kiến đối với yêu cầu của người khởi kiện; trường hợp cần gia hạn thì phải có đơn và được gia hạn nhưng không quá 15 ngày.","b":"Khoản 1 Điều 199 BLTTDS"},{"id":"7.09","g":7,"lv":"TH","q":"Bị đơn có quyền đưa ra yêu cầu phản tố đến thời điểm nào?","o":["Trong thời hạn kháng cáo bản án sơ thẩm","Trước khi mở phiên họp kiểm tra chứng cứ và hòa giải","Tại phiên tòa sơ thẩm, trước khi bắt đầu tranh tụng","Bất kỳ lúc nào trước khi Hội đồng xét xử vào nghị án"],"a":1,"e":"Khoản 3 Điều 200 BLTTDS: bị đơn có quyền đưa ra yêu cầu phản tố trước thời điểm mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải. Sau thời điểm này, phản tố không được giải quyết trong cùng vụ án mà bị đơn có thể khởi kiện vụ án khác.","b":"Khoản 3 Điều 200 BLTTDS"},{"id":"7.10","g":7,"lv":"TH","q":"Yêu cầu phản tố của bị đơn được chấp nhận trong trường hợp nào?","o":["Yêu cầu không liên quan nhưng giải quyết chung cho tiện","Yêu cầu phản tố để bù trừ nghĩa vụ với yêu cầu của nguyên đơn","Yêu cầu phản tố hướng vào người không phải là đương sự trong vụ án","Bị đơn có ít nhất hai chứng cứ chứng minh yêu cầu"],"a":1,"e":"Khoản 2 Điều 200 BLTTDS: yêu cầu phản tố được chấp nhận khi thuộc một trong các trường hợp: phản tố để bù trừ nghĩa vụ với yêu cầu của nguyên đơn; việc chấp nhận phản tố dẫn đến loại trừ việc chấp nhận một phần hoặc toàn bộ yêu cầu của nguyên đơn; giữa yêu cầu phản tố và yêu cầu của nguyên đơn có sự liên quan và giải quyết trong cùng vụ án làm cho việc giải quyết nhanh, chính xác hơn. Phản tố hướng vào người ngoài vụ án không thỏa mãn.","b":"Khoản 2 Điều 200 BLTTDS"},{"id":"7.11","g":7,"lv":"TH","q":"Thời hạn chuẩn bị xét xử vụ án tranh chấp dân sự theo thủ tục thông thường (không có yếu tố nước ngoài) là bao lâu?","o":["04 tháng, có thể gia hạn không quá 02 tháng","03 tháng, có thể gia hạn không quá 01 tháng","06 tháng, không được gia hạn","02 tháng, có thể gia hạn không quá 01 tháng"],"a":0,"e":"Điểm a khoản 1 Điều 203 BLTTDS: thời hạn chuẩn bị xét xử đối với vụ án tranh chấp dân sự, hôn nhân và gia đình theo Điều 26, Điều 28 là 04 tháng kể từ ngày thụ lý; vụ án phức tạp hoặc có trở ngại khách quan có thể được gia hạn nhưng không quá 02 tháng.","b":"Điểm a khoản 1 Điều 203 BLTTDS"},{"id":"7.12","g":7,"lv":"TH","q":"Hòa giải theo Luật Hòa giải, đối thoại tại Tòa án được tiến hành vào giai đoạn nào?","o":["Trước khi Tòa án thụ lý vụ việc","Tại phiên tòa sơ thẩm, trước phần tranh tụng","Sau khi bản án sơ thẩm có hiệu lực pháp luật","Sau khi thụ lý, tại phiên họp kiểm tra chứng cứ"],"a":0,"e":"Luật Hòa giải, đối thoại tại Tòa án 2020 điều chỉnh hoạt động hòa giải, đối thoại trước khi Tòa án thụ lý vụ việc dân sự, vụ án hành chính, do Hòa giải viên tiến hành. Hòa giải sau thụ lý (tại phiên họp kiểm tra chứng cứ và hòa giải) do Thẩm phán thực hiện theo BLTTDS.","b":"Khoản 1 Điều 2 Luật Hòa giải, đối thoại tại Tòa án 2020"},{"id":"7.13","g":7,"lv":"TH","q":"Vụ án nào sau đây không được hòa giải?","o":["Tranh chấp quyền sử dụng đất giữa các hộ gia đình liền kề","Tranh chấp hợp đồng mua bán hàng hóa có yếu tố nước ngoài","Tranh chấp ly hôn giữa vợ chồng có con chung chưa thành niên","Đòi bồi thường vì gây thiệt hại đến tài sản của Nhà nước"],"a":3,"e":"Khoản 1 Điều 206 BLTTDS: không được hòa giải đối với yêu cầu đòi bồi thường vì lý do gây thiệt hại đến tài sản của Nhà nước; ngoài ra còn vụ án phát sinh từ giao dịch vi phạm điều cấm của luật, trái đạo đức xã hội. Tranh chấp ly hôn, thương mại có yếu tố nước ngoài, đất đai vẫn được hòa giải.","b":"Khoản 1 Điều 206 BLTTDS"},{"id":"7.14","g":7,"lv":"TH","q":"Trường hợp nào sau đây thuộc vụ án không tiến hành hòa giải được?","o":["Giá trị tài sản tranh chấp trên 4.000.000.000 đồng","Vụ án phát sinh từ giao dịch vi phạm điều cấm của luật","Một trong các đương sự đề nghị không tiến hành hòa giải","Bị đơn vắng mặt tại phiên họp hòa giải lần thứ nhất"],"a":2,"e":"Khoản 4 Điều 207 BLTTDS: vụ án không tiến hành hòa giải được khi đương sự đề nghị không tiến hành hòa giải. Phân biệt với vụ án không được hòa giải (Điều 206) như giao dịch vi phạm điều cấm. Bị đơn vắng mặt lần thứ nhất chưa đủ căn cứ; phải là cố tình vắng mặt sau hai lần triệu tập hợp lệ (khoản 1 Điều 207).","b":"Khoản 4 Điều 207 BLTTDS"},{"id":"7.15","g":7,"lv":"TH","q":"Sau khi lập biên bản hòa giải thành, Thẩm phán ra quyết định công nhận sự thỏa thuận khi nào?","o":["Hết 07 ngày mà không đương sự nào thay đổi ý kiến","Hết 15 ngày kể từ ngày lập biên bản hòa giải","Ngay tại phiên họp, khi các bên ký biên bản","Khi Viện kiểm sát đồng ý với nội dung thỏa thuận"],"a":0,"e":"Khoản 1 Điều 212 BLTTDS: hết thời hạn 07 ngày kể từ ngày lập biên bản hòa giải thành mà không có đương sự nào thay đổi ý kiến về sự thỏa thuận đó thì Thẩm phán chủ trì phiên hòa giải hoặc Thẩm phán được Chánh án phân công ra quyết định công nhận sự thỏa thuận.","b":"Khoản 1 Điều 212 BLTTDS"},{"id":"7.16","g":7,"lv":"TH","q":"Quyết định công nhận sự thỏa thuận của các đương sự có hiệu lực như thế nào?","o":["Có hiệu lực ngay, không bị kháng cáo, kháng nghị phúc thẩm","Có hiệu lực sau 15 ngày kể từ ngày ra quyết định nếu không bị kháng cáo","Có hiệu lực sau khi Viện kiểm sát hết thời hạn kháng nghị","Chỉ có hiệu lực khi được Chánh án phê duyệt"],"a":0,"e":"Khoản 1 Điều 213 BLTTDS: quyết định công nhận sự thỏa thuận của các đương sự có hiệu lực pháp luật ngay sau khi được ban hành và không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm; chỉ có thể bị kháng nghị giám đốc thẩm nếu có căn cứ thỏa thuận do nhầm lẫn, lừa dối, đe dọa, cưỡng ép hoặc vi phạm điều cấm (khoản 2).","b":"Khoản 1 Điều 213 BLTTDS"},{"id":"7.17","g":7,"lv":"TH","q":"Căn cứ nào sau đây dẫn đến tạm đình chỉ (không phải đình chỉ) giải quyết vụ án?","o":["Người khởi kiện rút toàn bộ yêu cầu khởi kiện","Nguyên đơn là cá nhân chết, quyền và nghĩa vụ không được thừa kế","Đương sự yêu cầu áp dụng thời hiệu và thời hiệu đã hết","Đương sự là cá nhân chết, chưa có người kế thừa tố tụng"],"a":3,"e":"Điểm a khoản 1 Điều 214 BLTTDS: Tòa án ra quyết định tạm đình chỉ khi đương sự là cá nhân đã chết mà chưa có cá nhân, cơ quan, tổ chức kế thừa quyền và nghĩa vụ tố tụng. Các phương án còn lại (rút toàn bộ yêu cầu, thời hiệu đã hết, nguyên đơn chết mà quyền nghĩa vụ không được thừa kế) là căn cứ đình chỉ theo khoản 1 Điều 217.","b":"Điểm a khoản 1 Điều 214; khoản 1 Điều 217 BLTTDS"},{"id":"7.18","g":7,"lv":"TH","q":"Tòa án đình chỉ giải quyết vụ án vì nguyên đơn được triệu tập hợp lệ lần thứ hai vẫn vắng mặt, không đề nghị xét xử vắng mặt. Tiền tạm ứng án phí nguyên đơn đã nộp được xử lý thế nào?","o":["Sung vào công quỹ nhà nước","Trả lại cho nguyên đơn","Giữ lại chờ nguyên đơn khởi kiện lại","Chuyển thành án phí của bị đơn"],"a":0,"e":"Điều 218 BLTTDS: trường hợp Tòa án đình chỉ vì nguyên đơn đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt (điểm c khoản 1 Điều 217) thì tiền tạm ứng án phí mà đương sự đã nộp được sung vào công quỹ nhà nước. Hậu quả này nhằm chế tài việc nguyên đơn không thiện chí theo đuổi vụ kiện.","b":"Điều 218; điểm c khoản 1 Điều 217 BLTTDS"},{"id":"7.19","g":7,"lv":"TH","q":"Tại phiên tòa sơ thẩm, việc thay đổi, bổ sung yêu cầu của đương sự được Hội đồng xét xử chấp nhận khi nào?","o":["Được tất cả các đương sự khác đồng ý bằng văn bản","Kiểm sát viên đồng ý với việc thay đổi, bổ sung","Không vượt quá phạm vi các yêu cầu ban đầu","Đương sự nộp thêm tiền tạm ứng án phí tại phiên tòa"],"a":2,"e":"Điều 244 BLTTDS: Hội đồng xét xử chấp nhận việc thay đổi, bổ sung yêu cầu của đương sự nếu việc thay đổi, bổ sung yêu cầu của họ không vượt quá phạm vi yêu cầu khởi kiện, yêu cầu phản tố hoặc yêu cầu độc lập ban đầu. Không đòi hỏi sự đồng ý của các đương sự khác hay của Kiểm sát viên.","b":"Điều 244 BLTTDS"},{"id":"7.20","g":7,"lv":"TH","q":"Kiểm sát viên được phân công vắng mặt tại phiên tòa sơ thẩm. Hội đồng xét xử xử lý thế nào?","o":["Tạm ngừng phiên tòa không quá 05 ngày làm việc","Vẫn tiến hành xét xử, không hoãn phiên tòa","Hoãn phiên tòa và báo Viện kiểm sát cử người khác","Tạm đình chỉ giải quyết vụ án dân sự"],"a":1,"e":"Điều 232 BLTTDS: Kiểm sát viên được Viện trưởng phân công có nhiệm vụ tham gia phiên tòa; trường hợp Kiểm sát viên vắng mặt thì Tòa án vẫn tiến hành xét xử, không hoãn phiên tòa, trừ trường hợp phải thay đổi Kiểm sát viên.","b":"Điều 232 BLTTDS"},{"id":"7.21","g":7,"lv":"TH","q":"Theo Nghị quyết 205/2025/QH15, Viện kiểm sát khởi kiện vụ án dân sự để bảo vệ nhóm dễ bị tổn thương, lợi ích công khi nào?","o":["Song song với nguyên đơn trong mọi vụ án dân sự có giá trị tranh chấp lớn","Khi đương sự ủy quyền cho Viện kiểm sát khởi kiện thay","Không có chủ thể khởi kiện hoặc chủ thể có quyền không khởi kiện","Khi Tòa án đề nghị Viện kiểm sát tham gia vụ án"],"a":2,"e":"Nghị quyết 205/2025/QH15 cho phép thí điểm Viện kiểm sát nhân dân khởi kiện vụ án dân sự để bảo vệ quyền dân sự của nhóm dễ bị tổn thương hoặc bảo vệ lợi ích công, trong trường hợp không có chủ thể có quyền khởi kiện hoặc có nhưng chủ thể đó không khởi kiện. Viện kiểm sát không khởi kiện song song hay theo ủy quyền của đương sự.","b":"Nghị quyết 205/2025/QH15"},{"id":"TH7.01.1","g":7,"lv":"VD","q":"Tòa án thụ lý vụ án vào ngày nào?","o":["Ngày 05/3","Ngày 01/3","Ngày 09/3","Ngày ông Phong nhận thông báo thụ lý"],"a":2,"e":"Khoản 3 Điều 195 BLTTDS: Thẩm phán thụ lý vụ án khi người khởi kiện nộp biên lai thu tiền tạm ứng án phí. Bà Mai nộp biên lai ngày 09/3, nên ngày 09/3 là ngày thụ lý; ngày 01/3 là ngày nộp đơn (ngày khởi kiện), ngày 05/3 là ngày nhận thông báo nộp tạm ứng án phí.","b":"Điều 195 BLTTDS","cid":"TH7.01"},{"id":"TH7.01.2","g":7,"lv":"VD","q":"Bà Mai phải nộp bao nhiêu tiền tạm ứng án phí sơ thẩm?","o":["7.500.000 đồng","1.875.000 đồng","3.750.000 đồng","300.000 đồng"],"a":2,"e":"Tranh chấp 150.000.000 đồng thuộc khung từ trên 6 triệu đến 400 triệu đồng, án phí bằng 5% = 7.500.000 đồng. Theo khoản 2 Điều 7 Nghị quyết 326/2016/UBTVQH14, tạm ứng án phí bằng 50% mức án phí dự tính, tức 3.750.000 đồng.","b":"Điều 7 Nghị quyết 326/2016/UBTVQH14; Danh mục án phí, lệ phí Tòa án","cid":"TH7.01"},{"id":"TH7.01.3","g":7,"lv":"VD","q":"Yêu cầu của ông Phong là gì và phải đưa ra khi nào?","o":["Yêu cầu độc lập; trước khi Hội đồng xét xử nghị án","Phản tố; trước phiên họp kiểm tra chứng cứ và hòa giải","Khởi kiện vụ án khác; không giải quyết chung","Phản tố; tại phiên tòa trước khi tranh luận"],"a":1,"e":"Ông Phong là bị đơn, yêu cầu bà Mai trả 50 triệu đồng để bù trừ nghĩa vụ là yêu cầu phản tố (điểm a khoản 2 Điều 200 BLTTDS). Theo khoản 3 Điều 200, yêu cầu này phải đưa ra trước thời điểm mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải.","b":"Khoản 2, khoản 3 Điều 200 BLTTDS","cid":"TH7.01"},{"id":"TH7.02.1","g":7,"lv":"VD","q":"Sau văn bản ngày 14/5 của chị Thu, Tòa án xử lý thế nào?","o":["Đình chỉ vì hòa giải không thành","Phạt chị Thu vì vi phạm cam kết","Vẫn ra quyết định công nhận vì biên bản đã có đủ chữ ký các bên","Không công nhận thỏa thuận, tiếp tục giải quyết vụ án"],"a":3,"e":"Khoản 1 Điều 212 BLTTDS: Thẩm phán chỉ ra quyết định công nhận sự thỏa thuận khi hết 07 ngày kể từ ngày lập biên bản hòa giải thành mà không có đương sự nào thay đổi ý kiến. Chị Thu thay đổi ý kiến ngày 14/5 (trong thời hạn 07 ngày từ 10/5), nên Tòa án không công nhận thỏa thuận và tiếp tục giải quyết vụ án theo thủ tục chung.","b":"Khoản 1 Điều 212 BLTTDS","cid":"TH7.02"},{"id":"TH7.02.2","g":7,"lv":"VD","q":"Tại phiên tòa, Hội đồng xét xử giải quyết việc anh Nam vắng mặt thế nào?","o":["Tạm đình chỉ giải quyết vụ án","Xét xử vắng mặt anh Nam","Hoãn phiên tòa và triệu tập anh Nam thêm một lần nữa","Coi như từ bỏ yêu cầu, đình chỉ giải quyết vụ án"],"a":3,"e":"Điều 227 và điểm c khoản 1 Điều 217 BLTTDS: nguyên đơn đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt, không có đề nghị xét xử vắng mặt, không vì sự kiện bất khả kháng thì bị coi là từ bỏ việc khởi kiện; Tòa án đình chỉ giải quyết vụ án. Chị Thu không có phản tố nên không có yêu cầu nào khác cần xét xử.","b":"Khoản 2 Điều 227; điểm c khoản 1 Điều 217 BLTTDS","cid":"TH7.02"},{"id":"TH7.02.3","g":7,"lv":"VD","q":"Sau khi vụ án bị đình chỉ, anh Nam có quyền khởi kiện lại không?","o":["Có, nếu thời hiệu khởi kiện vẫn còn","Không, vì quyết định đình chỉ đã có hiệu lực","Có, nhưng chỉ sau 01 năm kể từ ngày đình chỉ","Chỉ được khi chị Thu đồng ý bằng văn bản"],"a":0,"e":"Khoản 1 Điều 218 BLTTDS: sau khi có quyết định đình chỉ, đương sự không có quyền khởi kiện lại, trừ một số trường hợp, trong đó có trường hợp đình chỉ theo điểm c khoản 1 Điều 217 (nguyên đơn vắng mặt lần thứ hai), nếu thời hiệu khởi kiện vẫn còn. Không cần sự đồng ý của chị Thu hay chờ 01 năm.","b":"Khoản 1 Điều 218 BLTTDS","cid":"TH7.02"},{"id":"TH7.03.1","g":7,"lv":"VD","q":"Tại phiên tòa, Công ty X rút toàn bộ yêu cầu khởi kiện, bà Y vẫn giữ yêu cầu phản tố. Hội đồng xét xử giải quyết thế nào?","o":["Vẫn xét xử yêu cầu của Công ty X như ban đầu","Hoãn phiên tòa để bà Y làm thủ tục khởi kiện thành vụ án mới","Đình chỉ yêu cầu của Công ty X; bà Y trở thành nguyên đơn","Đình chỉ giải quyết toàn bộ vụ án"],"a":2,"e":"Điều 245 và điểm b khoản 2 Điều 217 BLTTDS: nguyên đơn rút toàn bộ yêu cầu khởi kiện mà bị đơn vẫn giữ yêu cầu phản tố thì Tòa án đình chỉ phần yêu cầu của nguyên đơn; bị đơn trở thành nguyên đơn và nguyên đơn trở thành bị đơn. Vụ án không bị đình chỉ toàn bộ và bà Y không phải khởi kiện vụ án mới.","b":"Điều 245; điểm b khoản 2 Điều 217 BLTTDS","cid":"TH7.03"},{"id":"TH7.03.2","g":7,"lv":"VD","q":"Khi hỏi tại phiên tòa, chủ thể nào hỏi sau cùng?","o":["Kiểm sát viên","Chủ tọa phiên tòa","Người bảo vệ quyền lợi của nguyên đơn","Hội thẩm nhân dân"],"a":0,"e":"Điều 249 BLTTDS: thứ tự hỏi tại phiên tòa là người bảo vệ quyền lợi của nguyên đơn, nguyên đơn; người bảo vệ quyền lợi của bị đơn, bị đơn; người bảo vệ quyền lợi của người có quyền lợi, nghĩa vụ liên quan, người có quyền lợi, nghĩa vụ liên quan; sau đó là Chủ tọa, Hội thẩm và cuối cùng là Kiểm sát viên tham gia phiên tòa.","b":"Điều 249 BLTTDS","cid":"TH7.03"},{"id":"TH7.03.3","g":7,"lv":"VD","q":"Vụ án phức tạp, Hội đồng xét xử quyết định thời gian nghị án. Thời gian này tối đa là bao lâu?","o":["05 ngày làm việc kể từ khi kết thúc tranh luận","03 ngày làm việc kể từ khi kết thúc tranh luận","07 ngày kể từ ngày khai mạc phiên tòa","10 ngày kể từ ngày khai mạc phiên tòa"],"a":0,"e":"Điều 264 BLTTDS: trường hợp vụ án có nhiều tình tiết phức tạp, việc nghị án đòi hỏi phải có thời gian dài thì Hội đồng xét xử có thể quyết định thời gian nghị án nhưng không quá 05 ngày làm việc kể từ khi kết thúc tranh luận tại phiên tòa.","b":"Điều 264 BLTTDS","cid":"TH7.03"},{"id":"8.01","g":8,"lv":"TH","q":"Xét xử phúc thẩm vụ án dân sự là gì?","o":["Tòa án cấp trên trực tiếp xét xử lại bản án sơ thẩm chưa có hiệu lực bị kháng cáo, kháng nghị","Tòa án xem xét lại bản án đã có hiệu lực pháp luật khi phát hiện tình tiết mới làm thay đổi nội dung","Tòa án cấp sơ thẩm xét xử lại toàn bộ vụ án khi một bên đương sự có đơn đề nghị","Tòa án xem xét lại bản án đã có hiệu lực pháp luật khi phát hiện vi phạm pháp luật nghiêm trọng"],"a":0,"e":"Điều 270 BLTTDS: xét xử phúc thẩm là việc Tòa án cấp phúc thẩm trực tiếp xét xử lại vụ án mà bản án, quyết định của Tòa án cấp sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị. Xem xét lại bản án đã có hiệu lực do vi phạm pháp luật là giám đốc thẩm, do tình tiết mới là tái thẩm.","b":"Điều 270 BLTTDS"},{"id":"8.02","g":8,"lv":"TH","q":"Từ ngày 01/7/2025, Tòa án nào xét xử phúc thẩm bản án sơ thẩm của Tòa án nhân dân khu vực bị kháng cáo?","o":["Tòa án nhân dân tối cao","Tòa án nhân dân cấp cao","Tòa án nhân dân khu vực khác trong tỉnh","Tòa án nhân dân cấp tỉnh"],"a":3,"e":"Điều 37, 38 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): từ ngày 01/7/2025, hệ thống Tòa án gồm TAND tối cao, TAND cấp tỉnh và TAND khu vực; Tòa án nhân dân cấp tỉnh xét xử phúc thẩm bản án, quyết định sơ thẩm của Tòa án nhân dân khu vực bị kháng cáo, kháng nghị. Tòa án nhân dân cấp cao không còn.","b":"Điều 37, 38 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"8.03","g":8,"lv":"TH","q":"Chủ thể nào có quyền kháng cáo bản án sơ thẩm?","o":["Người có quyền lợi, nghĩa vụ liên quan","Kiểm sát viên đã tham gia phiên tòa sơ thẩm","Người làm chứng không đồng ý với nhận định của Tòa án","Người giám định có kết luận không được chấp nhận"],"a":0,"e":"Điều 271 BLTTDS: đương sự (nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan), người đại diện hợp pháp của đương sự, cơ quan, tổ chức, cá nhân khởi kiện có quyền kháng cáo. Người làm chứng, người giám định không có quyền kháng cáo; Viện kiểm sát thực hiện quyền kháng nghị, không phải kháng cáo.","b":"Điều 271 BLTTDS"},{"id":"8.04","g":8,"lv":"TH","q":"Thời hạn kháng cáo bản án sơ thẩm đối với đương sự có mặt khi tuyên án là bao lâu?","o":["10 ngày kể từ ngày nhận bản án","07 ngày kể từ ngày tuyên án","15 ngày kể từ ngày tuyên án","01 tháng kể từ ngày tuyên án"],"a":2,"e":"Khoản 1 Điều 273 BLTTDS: thời hạn kháng cáo đối với bản án sơ thẩm là 15 ngày kể từ ngày tuyên án; đối với đương sự không có mặt tại phiên tòa hoặc không có mặt khi tuyên án mà có lý do chính đáng thì tính từ ngày họ nhận được bản án hoặc bản án được niêm yết.","b":"Khoản 1 Điều 273 BLTTDS"},{"id":"8.05","g":8,"lv":"TH","q":"Thời hạn kháng cáo quyết định đình chỉ giải quyết vụ án của Tòa án cấp sơ thẩm là bao lâu?","o":["10 ngày kể từ ngày nhận quyết định","15 ngày kể từ ngày ra quyết định","07 ngày kể từ ngày nhận quyết định hoặc ngày niêm yết","03 ngày làm việc kể từ ngày ra quyết định"],"a":2,"e":"Khoản 2 Điều 273 BLTTDS: thời hạn kháng cáo đối với quyết định tạm đình chỉ, đình chỉ giải quyết vụ án của Tòa án cấp sơ thẩm là 07 ngày kể từ ngày người có quyền kháng cáo nhận được quyết định hoặc kể từ ngày quyết định được niêm yết.","b":"Khoản 2 Điều 273 BLTTDS"},{"id":"8.06","g":8,"lv":"TH","q":"Văn bản nào của Tòa án cấp sơ thẩm không bị kháng cáo theo thủ tục phúc thẩm?","o":["Bản án sơ thẩm giải quyết toàn bộ yêu cầu của các đương sự","Quyết định công nhận sự thỏa thuận của các đương sự","Quyết định đình chỉ giải quyết vụ án dân sự","Quyết định tạm đình chỉ giải quyết vụ án dân sự"],"a":1,"e":"Khoản 1 Điều 213 BLTTDS: quyết định công nhận sự thỏa thuận của các đương sự có hiệu lực ngay và không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm. Bản án sơ thẩm, quyết định tạm đình chỉ, đình chỉ giải quyết vụ án đều có thể bị kháng cáo (Điều 271).","b":"Điều 213, 271 BLTTDS"},{"id":"8.07","g":8,"lv":"TH","q":"Kháng cáo quá hạn do ai xem xét, quyết định?","o":["Chánh án Tòa án đã xét xử sơ thẩm","Viện trưởng Viện kiểm sát nhân dân cấp trên trực tiếp","Thẩm phán chủ tọa phiên tòa sơ thẩm","Hội đồng gồm 03 Thẩm phán của Tòa án cấp phúc thẩm"],"a":3,"e":"Điều 275 BLTTDS: trong thời hạn 10 ngày kể từ ngày nhận được đơn kháng cáo quá hạn và tài liệu kèm theo, Tòa án cấp phúc thẩm thành lập Hội đồng gồm 03 Thẩm phán để xem xét kháng cáo quá hạn; Hội đồng có quyền chấp nhận hoặc không chấp nhận và phải ghi rõ lý do.","b":"Điều 275 BLTTDS"},{"id":"8.08","g":8,"lv":"TH","q":"Người kháng cáo không nộp tiền tạm ứng án phí phúc thẩm trong thời hạn, không có lý do chính đáng. Hậu quả là gì?","o":["Coi như từ bỏ việc kháng cáo","Tòa án vẫn xét xử phúc thẩm và truy thu sau","Tòa án gia hạn nộp thêm 10 ngày","Viện kiểm sát nộp thay cho người kháng cáo"],"a":0,"e":"Khoản 2 Điều 276 BLTTDS: người kháng cáo phải nộp tiền tạm ứng án phí phúc thẩm trong thời hạn 10 ngày kể từ ngày nhận được thông báo; hết thời hạn mà không nộp, không có lý do chính đáng thì được coi là từ bỏ việc kháng cáo. Tòa án không gia hạn hay truy thu.","b":"Điều 276 BLTTDS"},{"id":"8.09","g":8,"lv":"TH","q":"Thời hạn kháng nghị bản án sơ thẩm của Viện kiểm sát cấp trên trực tiếp là bao lâu?","o":["10 ngày kể từ ngày nhận bản án","15 ngày kể từ ngày tuyên án","02 tháng kể từ ngày tuyên án","01 tháng kể từ ngày tuyên án"],"a":3,"e":"Khoản 1 Điều 280 BLTTDS: thời hạn kháng nghị bản án sơ thẩm của Viện kiểm sát cùng cấp là 15 ngày, của Viện kiểm sát cấp trên trực tiếp là 01 tháng, kể từ ngày tuyên án. Viện kiểm sát cấp trên có thời hạn dài hơn vì phải nhận và nghiên cứu bản án.","b":"Khoản 1 Điều 280 BLTTDS"},{"id":"8.10","g":8,"lv":"TH","q":"Phần bản án sơ thẩm bị kháng cáo, kháng nghị có hậu quả pháp lý gì?","o":["Chưa được thi hành, trừ trường hợp luật cho thi hành ngay","Có hiệu lực ngay nhưng bị tạm dừng thi hành 15 ngày","Được thi hành ngay để bảo đảm quyền của người thắng kiện","Bị hủy và chuyển hồ sơ cho Tòa án cấp sơ thẩm"],"a":0,"e":"Điều 282 BLTTDS: bản án, quyết định sơ thẩm hoặc phần bản án, quyết định sơ thẩm bị kháng cáo, kháng nghị thì chưa được đưa ra thi hành, trừ trường hợp pháp luật quy định cho thi hành ngay. Phần không bị kháng cáo, kháng nghị có hiệu lực pháp luật.","b":"Điều 282 BLTTDS"},{"id":"8.11","g":8,"lv":"TH","q":"Thời hạn kháng cáo đã hết, người kháng cáo muốn bổ sung kháng cáo trước phiên tòa phúc thẩm. Việc bổ sung bị giới hạn thế nào?","o":["Không được bổ sung dưới bất kỳ hình thức nào","Chỉ được bổ sung khi bị đơn đồng ý","Không được vượt quá phạm vi kháng cáo ban đầu","Không bị giới hạn nếu người kháng cáo nộp thêm tạm ứng án phí"],"a":2,"e":"Điều 284 BLTTDS: trước khi bắt đầu phiên tòa hoặc tại phiên tòa phúc thẩm, người kháng cáo có quyền thay đổi, bổ sung kháng cáo; nếu thời hạn kháng cáo đã hết thì chỉ được thay đổi, bổ sung nếu không vượt quá phạm vi kháng cáo ban đầu.","b":"Điều 284 BLTTDS"},{"id":"8.12","g":8,"lv":"TH","q":"Thời hạn chuẩn bị xét xử phúc thẩm vụ án dân sự là bao lâu?","o":["04 tháng, có thể gia hạn thêm không quá 02 tháng","03 tháng, không được gia hạn","01 tháng, có thể gia hạn không quá 15 ngày","02 tháng, có thể gia hạn không quá 01 tháng"],"a":3,"e":"Khoản 1 Điều 286 BLTTDS: trong thời hạn 02 tháng kể từ ngày thụ lý vụ án, tùy từng trường hợp, Thẩm phán chủ tọa phiên tòa ra một trong các quyết định (tạm đình chỉ, đình chỉ xét xử phúc thẩm, đưa vụ án ra xét xử phúc thẩm); vụ án phức tạp có thể kéo dài nhưng không quá 01 tháng.","b":"Điều 286 BLTTDS"},{"id":"8.13","g":8,"lv":"TH","q":"Tòa án cấp phúc thẩm xem xét lại những phần nào của bản án sơ thẩm?","o":["Chỉ phần có sai sót về thủ tục tố tụng","Chỉ phần quyết định về án phí sơ thẩm","Toàn bộ bản án, kể cả phần không bị kháng cáo, kháng nghị","Phần bị kháng cáo, kháng nghị hoặc có liên quan"],"a":3,"e":"Điều 293 BLTTDS: Tòa án cấp phúc thẩm chỉ xem xét lại phần của bản án sơ thẩm, quyết định của Tòa án cấp sơ thẩm có kháng cáo, kháng nghị hoặc có liên quan đến việc xem xét nội dung kháng cáo, kháng nghị. Phần không bị kháng cáo, kháng nghị và không liên quan đã có hiệu lực.","b":"Điều 293 BLTTDS"},{"id":"8.14","g":8,"lv":"TH","q":"Hội đồng xét xử phúc thẩm hủy bản án sơ thẩm, chuyển hồ sơ cho cấp sơ thẩm giải quyết lại trong trường hợp nào?","o":["Các đương sự thỏa thuận được tại phiên tòa phúc thẩm","Cấp sơ thẩm áp dụng sai luật, chứng cứ đã đầy đủ","Người kháng cáo rút toàn bộ kháng cáo tại phiên tòa","Thành phần Hội đồng xét xử sơ thẩm không đúng quy định"],"a":3,"e":"Khoản 1 Điều 310 BLTTDS: Hội đồng xét xử phúc thẩm hủy bản án sơ thẩm và chuyển hồ sơ cho cấp sơ thẩm giải quyết lại khi thành phần Hội đồng xét xử sơ thẩm không đúng quy định, có vi phạm nghiêm trọng khác về thủ tục tố tụng, hoặc việc thu thập chứng cứ chưa đầy đủ mà cấp phúc thẩm không thể bổ sung được. Áp dụng sai luật khi chứng cứ đầy đủ thì cấp phúc thẩm sửa án (Điều 309).","b":"Điều 310 BLTTDS"},{"id":"TH8.01.1","g":8,"lv":"VD","q":"Đơn kháng cáo ngày 20/6 của ông Hải được đánh giá thế nào?","o":["Chưa quá hạn vì tính từ ngày ông ra viện","Chưa quá hạn vì thời hạn kháng cáo là 01 tháng","Quá hạn; thời hạn kháng cáo kết thúc ngày 17/6","Chưa quá hạn vì tính từ ngày ông nhận bản án"],"a":2,"e":"Khoản 1 Điều 273 BLTTDS: ông Hải có mặt khi tuyên án nên thời hạn kháng cáo 15 ngày tính từ ngày tuyên án 02/6; theo Điều 147 BLDS, ngày bắt đầu là 03/6 và thời hạn kết thúc vào cuối ngày 17/6. Đơn ngày 20/6 là quá hạn; việc nằm viện chỉ là lý do để xem xét chấp nhận kháng cáo quá hạn, không làm thay đổi cách tính.","b":"Khoản 1 Điều 273 BLTTDS; Điều 147 BLDS","cid":"TH8.01"},{"id":"TH8.01.2","g":8,"lv":"VD","q":"Ai xem xét lý do kháng cáo quá hạn của ông Hải?","o":["Chánh án Tòa án nhân dân khu vực 3 đã xét xử sơ thẩm","Hội đồng 03 Thẩm phán của Tòa án nhân dân cấp tỉnh","Viện trưởng Viện kiểm sát nhân dân cấp tỉnh","Thẩm phán chủ tọa phiên tòa sơ thẩm"],"a":1,"e":"Điều 275 BLTTDS và Điều 37 BLTTDS (sửa đổi 2025): kháng cáo quá hạn do Tòa án cấp phúc thẩm xem xét bằng Hội đồng gồm 03 Thẩm phán. Bản án sơ thẩm của TAND khu vực 3 nên cấp phúc thẩm là Tòa án nhân dân cấp tỉnh. Thẩm phán hay Chánh án cấp sơ thẩm không có thẩm quyền này.","b":"Điều 275 BLTTDS; Điều 37 BLTTDS (sửa đổi 2025)","cid":"TH8.01"},{"id":"TH8.01.3","g":8,"lv":"VD","q":"Giả sử kháng cáo được chấp nhận và Hội đồng xét xử phúc thẩm giữ nguyên bản án sơ thẩm. Ông Hải chịu án phí phúc thẩm thế nào?","o":["Phải chịu 300.000 đồng","Không phải chịu vì kháng cáo đã được chấp nhận","Phải chịu 50% án phí sơ thẩm","Phải chịu 2.000.000 đồng"],"a":0,"e":"Khoản 1 Điều 148 BLTTDS: đương sự kháng cáo phải chịu án phí phúc thẩm nếu Tòa án cấp phúc thẩm giữ nguyên bản án sơ thẩm bị kháng cáo. Theo Danh mục án phí, lệ phí Tòa án, án phí dân sự phúc thẩm là 300.000 đồng (mức 2.000.000 đồng áp dụng cho kinh doanh, thương mại).","b":"Điều 148 BLTTDS; Danh mục án phí, lệ phí Tòa án","cid":"TH8.01"},{"id":"TH8.02.1","g":8,"lv":"VD","q":"Hội đồng xét xử phúc thẩm phải làm gì trước tiên?","o":["Chuyển hồ sơ về Tòa án cấp sơ thẩm","Đình chỉ xét xử phúc thẩm ngay khi nhận đơn rút của bà Hương","Hỏi ông Kiên có đồng ý việc rút đơn hay không","Giữ nguyên bản án sơ thẩm"],"a":2,"e":"Khoản 1 Điều 299 BLTTDS: trước khi mở phiên tòa hoặc tại phiên tòa phúc thẩm mà nguyên đơn rút đơn khởi kiện thì Hội đồng xét xử phúc thẩm phải hỏi bị đơn có đồng ý hay không. Việc đình chỉ phụ thuộc vào ý kiến của bị đơn, không thể đình chỉ ngay.","b":"Khoản 1 Điều 299 BLTTDS","cid":"TH8.02"},{"id":"TH8.02.2","g":8,"lv":"VD","q":"Ông Kiên đồng ý. Hội đồng xét xử phúc thẩm giải quyết thế nào?","o":["Tạm đình chỉ xét xử phúc thẩm vụ án","Đình chỉ xét xử phúc thẩm, giữ nguyên bản án","Sửa bản án sơ thẩm theo nội dung kháng cáo của ông Kiên","Hủy bản án sơ thẩm và đình chỉ giải quyết vụ án"],"a":3,"e":"Khoản 1 Điều 299 và Điều 311 BLTTDS: bị đơn đồng ý việc rút đơn khởi kiện thì Hội đồng xét xử phúc thẩm ra quyết định hủy bản án sơ thẩm và đình chỉ giải quyết vụ án. Nếu bị đơn không đồng ý thì không chấp nhận việc rút đơn và tiếp tục xét xử phúc thẩm.","b":"Điểm b khoản 1 Điều 299; Điều 311 BLTTDS","cid":"TH8.02"},{"id":"TH8.02.3","g":8,"lv":"VD","q":"Trong trường hợp đó, án phí được giải quyết thế nào?","o":["Ông Kiên chịu toàn bộ án phí vì là người đã kháng cáo bản án","Không ai phải chịu án phí sơ thẩm và án phí phúc thẩm","Bà Hương chịu toàn bộ án phí sơ thẩm và toàn bộ án phí phúc thẩm","Chịu án phí sơ thẩm theo quyết định sơ thẩm và một nửa án phí phúc thẩm"],"a":3,"e":"Khoản 2 Điều 299 BLTTDS: trường hợp hủy bản án sơ thẩm và đình chỉ giải quyết vụ án do nguyên đơn rút đơn được bị đơn đồng ý, các đương sự vẫn phải chịu án phí sơ thẩm theo quyết định của Tòa án cấp sơ thẩm và phải chịu một nửa án phí phúc thẩm theo quy định.","b":"Điểm b khoản 1 Điều 299 BLTTDS","cid":"TH8.02"},{"id":"9.01","g":9,"lv":"TH","q":"Thủ tục rút gọn trong tố tụng dân sự được áp dụng để giải quyết loại việc nào?","o":["Mọi vụ án dân sự có giá trị tranh chấp dưới 100 triệu đồng","Vụ án dân sự có đủ điều kiện do Bộ luật Tố tụng dân sự quy định","Mọi việc dân sự không có tranh chấp","Vụ án dân sự đã được hòa giải thành tại cơ sở"],"a":1,"e":"Khoản 1 Điều 316 BLTTDS: thủ tục rút gọn là thủ tục áp dụng để giải quyết vụ án dân sự có đủ điều kiện theo quy định của Bộ luật này với trình tự đơn giản so với thủ tục giải quyết vụ án dân sự thông thường. Điều kiện cụ thể tại Điều 317, không dựa đơn thuần vào giá trị tranh chấp.","b":"Khoản 1 Điều 316 BLTTDS"},{"id":"9.02","g":9,"lv":"TH","q":"Điều kiện về chứng cứ để giải quyết vụ án theo thủ tục rút gọn là gì?","o":["Tòa án đã tổ chức phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ","Đương sự đã thừa nhận nghĩa vụ; tài liệu, chứng cứ đầy đủ và Tòa án không phải thu thập tài liệu, chứng cứ","Đương sự đã giao nộp chứng cứ trước ngày thụ lý ít nhất 15 ngày","Toàn bộ chứng cứ đã được công chứng hoặc chứng thực"],"a":1,"e":"Điểm a khoản 1 Điều 317 BLTTDS: vụ án có tình tiết đơn giản, quan hệ pháp luật rõ ràng, đương sự đã thừa nhận nghĩa vụ; tài liệu, chứng cứ đầy đủ, bảo đảm đủ căn cứ để giải quyết vụ án và Tòa án không phải thu thập tài liệu, chứng cứ. Thủ tục rút gọn không có phiên họp kiểm tra chứng cứ.","b":"Điểm a khoản 1 Điều 317 BLTTDS"},{"id":"9.03","g":9,"lv":"TH","q":"Việc xét xử sơ thẩm vụ án dân sự theo thủ tục rút gọn do ai tiến hành?","o":["Một Thẩm phán","Hội đồng gồm ba Thẩm phán","Một Thẩm phán và hai Hội thẩm nhân dân","Hai Thẩm phán và một Hội thẩm nhân dân"],"a":0,"e":"Điều 65 BLTTDS: xét xử sơ thẩm theo thủ tục rút gọn do một Thẩm phán tiến hành; xét xử phúc thẩm theo thủ tục rút gọn cũng do một Thẩm phán tiến hành. Không có Hội thẩm nhân dân tham gia.","b":"Điều 65 BLTTDS"},{"id":"9.04","g":9,"lv":"TH","q":"Thời hạn ra quyết định đưa vụ án ra xét xử theo thủ tục rút gọn và thời hạn mở phiên tòa là:","o":["Không quá 01 tháng kể từ ngày thụ lý; mở phiên tòa trong 10 ngày kể từ ngày ra quyết định","02 tháng kể từ ngày thụ lý; mở phiên tòa trong 01 tháng kể từ ngày ra quyết định","Không quá 01 tháng kể từ ngày thụ lý; mở phiên tòa trong 15 ngày kể từ ngày ra quyết định","15 ngày kể từ ngày thụ lý; mở phiên tòa trong 07 ngày kể từ ngày ra quyết định"],"a":0,"e":"Khoản 1 Điều 318 BLTTDS: trong thời hạn 01 tháng kể từ ngày thụ lý vụ án theo thủ tục rút gọn, Thẩm phán ra quyết định đưa vụ án ra xét xử; Tòa án phải mở phiên tòa trong thời hạn 10 ngày kể từ ngày ra quyết định.","b":"Khoản 1 Điều 318 BLTTDS"},{"id":"9.05","g":9,"lv":"TH","q":"Đương sự không đồng ý với quyết định đưa vụ án ra xét xử theo thủ tục rút gọn thì có quyền gì?","o":["Đề nghị Viện kiểm sát kháng nghị giám đốc thẩm quyết định đó","Kháng cáo lên Tòa án cấp trên trực tiếp trong 07 ngày","Khởi kiện quyết định đó ra Tòa án theo thủ tục tố tụng hành chính","Khiếu nại với Chánh án Tòa án đã ra quyết định trong 03 ngày làm việc kể từ ngày nhận quyết định"],"a":3,"e":"Khoản 1 Điều 319 BLTTDS: trong thời hạn 03 ngày làm việc kể từ ngày nhận được quyết định đưa vụ án ra xét xử theo thủ tục rút gọn, đương sự có quyền khiếu nại, Viện kiểm sát có quyền kiến nghị với Chánh án Tòa án đã ra quyết định. Quyết định này không bị kháng cáo.","b":"Khoản 1 Điều 319 BLTTDS"},{"id":"9.06","g":9,"lv":"TH","q":"Quyết định của Chánh án giải quyết khiếu nại, kiến nghị về quyết định đưa vụ án ra xét xử theo thủ tục rút gọn có giá trị như thế nào?","o":["Là quyết định cuối cùng","Có thể bị khiếu nại lên Chánh án Tòa án cấp trên trực tiếp","Có thể bị kháng cáo cùng với bản án sơ thẩm","Chỉ có hiệu lực khi Viện kiểm sát cùng cấp đồng ý"],"a":0,"e":"Khoản 3 Điều 319 BLTTDS: trong thời hạn 03 ngày làm việc kể từ ngày nhận được khiếu nại, kiến nghị, Chánh án phải xem xét, giải quyết; quyết định giải quyết khiếu nại, kiến nghị của Chánh án là quyết định cuối cùng.","b":"Khoản 3 Điều 319 BLTTDS"},{"id":"9.07","g":9,"lv":"TH","q":"Trường hợp nào sau đây KHÔNG phải là căn cứ để chuyển vụ án đang giải quyết theo thủ tục rút gọn sang thủ tục thông thường?","o":["Cần phải áp dụng biện pháp khẩn cấp tạm thời","Bị đơn đã được triệu tập hợp lệ nhưng vắng mặt không có lý do chính đáng","Bị đơn có yêu cầu phản tố","Cần định giá tài sản tranh chấp mà các đương sự không thống nhất về giá"],"a":1,"e":"Khoản 3 Điều 317 BLTTDS liệt kê căn cứ chuyển sang thủ tục thông thường: phát sinh tình tiết mới cần xác minh, thu thập chứng cứ; cần tiến hành giám định, định giá mà các bên không thống nhất về giá; cần áp dụng biện pháp khẩn cấp tạm thời; phát sinh người có quyền lợi, nghĩa vụ liên quan; phát sinh yêu cầu phản tố hoặc yêu cầu độc lập… Bị đơn vắng mặt không có lý do chính đáng thì Tòa án vẫn tiến hành xét xử (Điều 320), không phải căn cứ chuyển thủ tục.","b":"Khoản 3 Điều 317; khoản 1 Điều 320 BLTTDS"},{"id":"9.08","g":9,"lv":"TH","q":"Khi vụ án được chuyển từ thủ tục rút gọn sang thủ tục thông thường, thời hạn chuẩn bị xét xử được tính như thế nào?","o":["Tiếp tục tính từ ngày thụ lý vụ án","Tính từ ngày đương sự nộp đơn khởi kiện","Tính lại kể từ ngày ra quyết định chuyển vụ án sang thủ tục thông thường","Tính từ ngày Chánh án giải quyết khiếu nại"],"a":2,"e":"Khoản 4 Điều 317 BLTTDS: trường hợp chuyển vụ án sang giải quyết theo thủ tục thông thường thì thời hạn chuẩn bị xét xử được tính lại kể từ ngày ra quyết định chuyển vụ án sang giải quyết theo thủ tục thông thường.","b":"Khoản 4 Điều 317 BLTTDS"},{"id":"9.09","g":9,"lv":"TH","q":"Tại phiên tòa xét xử theo thủ tục rút gọn, sau khi khai mạc phiên tòa, Thẩm phán tiến hành việc gì trước?","o":["Hỏi đương sự về tài liệu, chứng cứ mới phát sinh","Hòa giải, trừ trường hợp không được hòa giải hoặc không tiến hành hòa giải được","Công bố toàn bộ tài liệu, chứng cứ có trong hồ sơ","Nghe Kiểm sát viên phát biểu ý kiến về việc giải quyết vụ án"],"a":1,"e":"Khoản 3 Điều 320 BLTTDS: sau khi khai mạc phiên tòa xét xử theo thủ tục rút gọn, Thẩm phán tiến hành hòa giải, trừ trường hợp không được hòa giải hoặc không tiến hành hòa giải được; hòa giải thành thì ra quyết định công nhận sự thỏa thuận, không thành thì tiến hành xét xử.","b":"Khoản 3 Điều 320 BLTTDS"},{"id":"9.10","g":9,"lv":"TH","q":"Thời hạn kháng cáo bản án sơ thẩm giải quyết theo thủ tục rút gọn đối với đương sự có mặt tại phiên tòa là:","o":["01 tháng kể từ ngày tuyên án","07 ngày kể từ ngày tuyên án","10 ngày kể từ ngày nhận được bản án","15 ngày kể từ ngày tuyên án"],"a":1,"e":"Khoản 1 Điều 322 BLTTDS: thời hạn kháng cáo bản án sơ thẩm theo thủ tục rút gọn là 07 ngày kể từ ngày tuyên án; đương sự vắng mặt tại phiên tòa thì tính từ ngày nhận được bản án hoặc ngày niêm yết. Ngắn hơn thời hạn 15 ngày theo thủ tục thông thường.","b":"Khoản 1 Điều 322 BLTTDS"},{"id":"9.11","g":9,"lv":"TH","q":"Viện kiểm sát cấp trên trực tiếp có quyền kháng nghị bản án sơ thẩm giải quyết theo thủ tục rút gọn trong thời hạn:","o":["10 ngày kể từ ngày nhận được bản án","15 ngày kể từ ngày nhận được bản án","01 tháng kể từ ngày tuyên án","07 ngày kể từ ngày tuyên án"],"a":0,"e":"Khoản 2 Điều 322 BLTTDS: thời hạn kháng nghị của Viện kiểm sát cùng cấp là 07 ngày, của Viện kiểm sát cấp trên trực tiếp là 10 ngày, kể từ ngày nhận được bản án.","b":"Khoản 2 Điều 322 BLTTDS"},{"id":"9.12","g":9,"lv":"TH","q":"Bản án phúc thẩm giải quyết theo thủ tục rút gọn có hiệu lực pháp luật từ thời điểm nào?","o":["Kể từ ngày bản án được giao cho đương sự","Sau 15 ngày kể từ ngày tuyên án","Sau khi hết thời hạn kháng nghị giám đốc thẩm","Kể từ ngày ra bản án"],"a":3,"e":"Khoản 7 Điều 324 BLTTDS: bản án, quyết định phúc thẩm theo thủ tục rút gọn có hiệu lực pháp luật kể từ ngày ra bản án, quyết định.","b":"Khoản 7 Điều 324 BLTTDS"},{"id":"10.01","g":10,"lv":"TH","q":"Giám đốc thẩm là:","o":["Cấp xét xử thứ ba sau sơ thẩm và phúc thẩm, phát sinh khi đương sự kháng cáo","Xét lại bản án, quyết định đã có hiệu lực pháp luật nhưng bị kháng nghị khi có căn cứ do Bộ luật quy định","Xét xử lại bản án sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị","Xét lại bản án đã có hiệu lực khi có đơn kháng cáo quá hạn được chấp nhận"],"a":1,"e":"Điều 325 BLTTDS: giám đốc thẩm là xét lại bản án, quyết định của Tòa án đã có hiệu lực pháp luật nhưng bị kháng nghị giám đốc thẩm khi có căn cứ quy định tại Điều 326. Giám đốc thẩm không phải cấp xét xử thứ ba và chỉ phát sinh do kháng nghị, không do kháng cáo.","b":"Điều 325 BLTTDS"},{"id":"10.02","g":10,"lv":"TH","q":"Trường hợp nào sau đây là căn cứ kháng nghị theo thủ tục giám đốc thẩm?","o":["Mới phát hiện tình tiết quan trọng mà đương sự không thể biết được trong quá trình giải quyết vụ án","Quyết định của cơ quan nhà nước mà Tòa án căn cứ vào đó để giải quyết vụ án đã bị hủy bỏ","Đương sự không đồng ý với mức bồi thường Tòa án đã tuyên","Có sai lầm trong việc áp dụng pháp luật dẫn đến bản án không đúng, gây thiệt hại đến quyền, lợi ích hợp pháp của đương sự"],"a":3,"e":"Điểm c khoản 1 Điều 326 BLTTDS: có sai lầm trong việc áp dụng pháp luật dẫn đến việc ra bản án, quyết định không đúng, gây thiệt hại đến quyền, lợi ích hợp pháp của đương sự là căn cứ giám đốc thẩm. Tình tiết mới phát hiện, quyết định của cơ quan nhà nước làm căn cứ bị hủy là căn cứ tái thẩm (Điều 352); sự không đồng ý của đương sự không phải căn cứ.","b":"Điểm c khoản 1 Điều 326 BLTTDS"},{"id":"10.03","g":10,"lv":"TH","q":"Đương sự có quyền đề nghị người có thẩm quyền xem xét kháng nghị giám đốc thẩm trong thời hạn nào?","o":["01 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật","06 tháng kể từ ngày tuyên án phúc thẩm","02 năm kể từ ngày nhận được bản án","03 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật"],"a":0,"e":"Khoản 1 Điều 327 BLTTDS: trong thời hạn 01 năm kể từ ngày bản án, quyết định của Tòa án có hiệu lực pháp luật, nếu phát hiện có vi phạm pháp luật theo Điều 326 thì đương sự có quyền đề nghị bằng văn bản với người có thẩm quyền kháng nghị giám đốc thẩm.","b":"Khoản 1 Điều 327 BLTTDS"},{"id":"10.04","g":10,"lv":"TH","q":"Từ ngày 01/7/2025, ai có thẩm quyền kháng nghị giám đốc thẩm bản án đã có hiệu lực pháp luật của Tòa án nhân dân khu vực trong phạm vi thẩm quyền theo lãnh thổ?","o":["Chánh án Tòa án nhân dân cấp cao, Viện trưởng Viện kiểm sát nhân dân cấp cao","Chánh án Tòa án nhân dân khu vực, Viện trưởng Viện kiểm sát nhân dân khu vực","Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh","Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh"],"a":2,"e":"Khoản 2 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh có quyền kháng nghị giám đốc thẩm bản án, quyết định đã có hiệu lực pháp luật của Tòa án nhân dân khu vực trong phạm vi thẩm quyền theo lãnh thổ. TAND cấp cao không còn trong hệ thống từ 01/7/2025.","b":"Khoản 2 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"10.05","g":10,"lv":"TH","q":"Chánh án Tòa án nhân dân tối cao KHÔNG có thẩm quyền kháng nghị giám đốc thẩm đối với:","o":["Quyết định đã có hiệu lực pháp luật của Tòa án nhân dân cấp tỉnh","Bản án đã có hiệu lực pháp luật của Tòa án nhân dân cấp tỉnh","Bản án đã có hiệu lực pháp luật của Tòa án nhân dân khu vực khi xét thấy cần thiết","Quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao"],"a":3,"e":"Khoản 1 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): Chánh án TAND tối cao kháng nghị bản án, quyết định đã có hiệu lực của TAND cấp tỉnh và của TAND khu vực khi xét thấy cần thiết, trừ quyết định giám đốc thẩm của Hội đồng Thẩm phán TAND tối cao. Quyết định của Hội đồng Thẩm phán chỉ được xem xét lại theo thủ tục đặc biệt (Điều 358).","b":"Khoản 1 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"10.06","g":10,"lv":"TH","q":"Thời hạn kháng nghị theo thủ tục giám đốc thẩm là:","o":["03 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật; có thể kéo dài thêm 02 năm khi có đủ điều kiện luật định","01 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật","05 năm kể từ ngày tuyên án sơ thẩm","01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ kháng nghị"],"a":0,"e":"Điều 334 BLTTDS: thời hạn kháng nghị giám đốc thẩm là 03 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật; trường hợp đã hết thời hạn nhưng có đủ các điều kiện luật định (đương sự đã có đơn đề nghị trong thời hạn và tiếp tục khiếu nại, bản án vi phạm pháp luật nghiêm trọng…) thì thời hạn được kéo dài thêm 02 năm.","b":"Điều 334 BLTTDS"},{"id":"10.07","g":10,"lv":"TH","q":"Từ ngày 01/7/2025, chủ thể nào giám đốc thẩm bản án đã có hiệu lực pháp luật của Tòa án nhân dân khu vực bị kháng nghị?","o":["Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Ủy ban Thẩm phán Tòa án nhân dân cấp cao","Hội đồng xét xử gồm ba Thẩm phán Tòa án nhân dân cấp tỉnh","Hội đồng xét xử gồm năm Thẩm phán Tòa án nhân dân tối cao"],"a":0,"e":"Khoản 1 Điều 337 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh giám đốc thẩm bản án, quyết định đã có hiệu lực pháp luật của Tòa án nhân dân khu vực bị kháng nghị.","b":"Khoản 1 Điều 337 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"10.08","g":10,"lv":"TH","q":"Khi Hội đồng Thẩm phán Tòa án nhân dân tối cao xét xử giám đốc thẩm bằng Hội đồng xét xử gồm năm Thẩm phán, quyết định phải được thông qua như thế nào?","o":["Quá nửa số thành viên Hội đồng biểu quyết tán thành","Ít nhất hai phần ba số thành viên biểu quyết tán thành","Tất cả thành viên Hội đồng biểu quyết tán thành","Ít nhất ba phần tư số thành viên biểu quyết tán thành"],"a":2,"e":"Khoản 6 Điều 341 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): khi giám đốc thẩm bằng Hội đồng xét xử gồm năm Thẩm phán TAND tối cao, quyết định phải được tất cả thành viên Hội đồng biểu quyết tán thành; nếu không đạt được thì vụ án được chuyển cho toàn thể Hội đồng Thẩm phán xét xử.","b":"Khoản 6 Điều 341 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"10.09","g":10,"lv":"TH","q":"Kể từ ngày nhận được kháng nghị kèm theo hồ sơ vụ án, Tòa án có thẩm quyền phải mở phiên tòa giám đốc thẩm trong thời hạn:","o":["04 tháng","06 tháng","02 tháng","01 tháng"],"a":0,"e":"Điều 339 BLTTDS: trong thời hạn 04 tháng kể từ ngày nhận được kháng nghị kèm theo hồ sơ vụ án, Tòa án có thẩm quyền giám đốc thẩm phải mở phiên tòa để xét xử vụ án.","b":"Điều 339 BLTTDS"},{"id":"10.10","g":10,"lv":"TH","q":"Hội đồng xét xử giám đốc thẩm được sửa bản án, quyết định đã có hiệu lực pháp luật khi nào?","o":["Tài liệu, chứng cứ đã đầy đủ, rõ ràng và việc sửa không ảnh hưởng đến quyền, nghĩa vụ của cơ quan, tổ chức, cá nhân khác","Bản án bị kháng nghị được xét xử theo thủ tục rút gọn","Đương sự có đơn đề nghị sửa bản án và Viện kiểm sát đồng ý","Hội đồng xét thấy cần thu thập thêm chứng cứ để làm rõ vụ án"],"a":0,"e":"Điều 343 và khoản 1 Điều 347 BLTTDS: Hội đồng xét xử giám đốc thẩm sửa một phần hoặc toàn bộ bản án, quyết định đã có hiệu lực khi tài liệu, chứng cứ trong hồ sơ đã đầy đủ, rõ ràng, có đủ căn cứ và việc sửa không ảnh hưởng đến quyền, nghĩa vụ của cơ quan, tổ chức, cá nhân khác. Nếu cần thu thập thêm chứng cứ thì phải hủy để xét xử lại.","b":"Khoản 1 Điều 347 BLTTDS"},{"id":"10.11","g":10,"lv":"TH","q":"Tái thẩm là:","o":["Xét lại bản án, quyết định đã có hiệu lực pháp luật bị kháng nghị vì có tình tiết mới được phát hiện có thể làm thay đổi cơ bản nội dung bản án, quyết định","Xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao","Xét lại bản án, quyết định đã có hiệu lực pháp luật vì có sai lầm nghiêm trọng trong việc áp dụng pháp luật","Xét xử lại vụ án sau khi bản án sơ thẩm bị Tòa án cấp phúc thẩm hủy"],"a":0,"e":"Điều 351 BLTTDS: tái thẩm là xét lại bản án, quyết định đã có hiệu lực pháp luật nhưng bị kháng nghị vì có tình tiết mới được phát hiện có thể làm thay đổi cơ bản nội dung của bản án, quyết định mà Tòa án, các đương sự không biết được khi Tòa án ra bản án, quyết định đó. Sai lầm áp dụng pháp luật là căn cứ giám đốc thẩm.","b":"Điều 351 BLTTDS"},{"id":"10.12","g":10,"lv":"TH","q":"Thời hạn kháng nghị theo thủ tục tái thẩm là:","o":["01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ kháng nghị","01 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật","02 năm kể từ ngày đương sự phát hiện tình tiết mới","03 năm kể từ ngày bản án, quyết định có hiệu lực pháp luật"],"a":0,"e":"Điều 355 BLTTDS: thời hạn kháng nghị theo thủ tục tái thẩm là 01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ để kháng nghị tái thẩm. Mốc tính khác với giám đốc thẩm (03 năm kể từ ngày bản án có hiệu lực).","b":"Điều 355 BLTTDS"},{"id":"10.13","g":10,"lv":"TH","q":"Hội đồng xét xử tái thẩm KHÔNG có thẩm quyền nào sau đây?","o":["Hủy bản án, quyết định và đình chỉ giải quyết vụ án","Hủy bản án, quyết định để xét xử sơ thẩm lại","Không chấp nhận kháng nghị và giữ nguyên bản án, quyết định","Sửa bản án, quyết định đã có hiệu lực pháp luật"],"a":3,"e":"Điều 356 BLTTDS: Hội đồng xét xử tái thẩm có quyền không chấp nhận kháng nghị và giữ nguyên bản án; hủy bản án, quyết định để xét xử sơ thẩm lại; hủy bản án, quyết định và đình chỉ giải quyết vụ án. Không có quyền sửa bản án vì tình tiết mới cần được đánh giá lại từ đầu.","b":"Điều 356 BLTTDS"},{"id":"10.14","g":10,"lv":"TH","q":"Chủ thể nào có quyền YÊU CẦU Hội đồng Thẩm phán Tòa án nhân dân tối cao xem xét lại quyết định của Hội đồng Thẩm phán?","o":["Chánh án Tòa án nhân dân tối cao","Ủy ban Thường vụ Quốc hội","Viện trưởng Viện kiểm sát nhân dân tối cao","Ủy ban Pháp luật và Tư pháp của Quốc hội"],"a":1,"e":"Điều 358 BLTTDS phân biệt hình thức tác động: Ủy ban Thường vụ Quốc hội có quyền YÊU CẦU; Ủy ban của Quốc hội phụ trách tư pháp, Viện trưởng VKSND tối cao có quyền KIẾN NGHỊ; Chánh án TAND tối cao có quyền ĐỀ NGHỊ Hội đồng Thẩm phán xem xét lại quyết định của Hội đồng Thẩm phán.","b":"Khoản 1, 2 Điều 358 BLTTDS"},{"id":"10.15","g":10,"lv":"TH","q":"Quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao khi xem xét lại quyết định của chính Hội đồng Thẩm phán theo thủ tục đặc biệt phải được:","o":["Quá nửa tổng số thành viên Hội đồng Thẩm phán biểu quyết tán thành","Ít nhất ba phần tư tổng số thành viên Hội đồng Thẩm phán biểu quyết tán thành","Ủy ban Thường vụ Quốc hội phê chuẩn","Ít nhất hai phần ba số thành viên tham gia phiên họp biểu quyết tán thành"],"a":1,"e":"Khoản 2 Điều 360 BLTTDS: quyết định của Hội đồng Thẩm phán TAND tối cao theo thủ tục đặc biệt phải được ít nhất ba phần tư tổng số thành viên Hội đồng Thẩm phán biểu quyết tán thành. Đây là tỷ lệ cao hơn biểu quyết giám đốc thẩm thông thường của toàn thể Hội đồng Thẩm phán (quá nửa).","b":"Khoản 2 Điều 360 BLTTDS"},{"id":"11.01","g":11,"lv":"TH","q":"Việc dân sự khác vụ án dân sự ở điểm cơ bản nào?","o":["Không có tranh chấp; người yêu cầu đề nghị Tòa án công nhận hoặc không công nhận một sự kiện pháp lý, hoặc công nhận cho mình một quyền","Chỉ phát sinh từ quan hệ hôn nhân và gia đình","Tòa án giải quyết bằng phiên tòa có Hội thẩm nhân dân tham gia","Viện kiểm sát không tham gia giải quyết"],"a":0,"e":"Điều 361 BLTTDS: việc dân sự là việc cơ quan, tổ chức, cá nhân không có tranh chấp nhưng có yêu cầu Tòa án công nhận hoặc không công nhận một sự kiện pháp lý là căn cứ làm phát sinh quyền, nghĩa vụ; hoặc yêu cầu công nhận cho mình quyền về dân sự, hôn nhân và gia đình, kinh doanh, thương mại, lao động. Vụ án có tranh chấp, việc dân sự thì không.","b":"Điều 361 BLTTDS"},{"id":"11.02","g":11,"lv":"TH","q":"Yêu cầu tuyên bố một người mất tích do ai giải quyết ở cấp sơ thẩm?","o":["Một Thẩm phán và hai Hội thẩm nhân dân","Tập thể gồm ba Thẩm phán","Chánh án Tòa án nhân dân khu vực","Một Thẩm phán"],"a":3,"e":"Điều 67 BLTTDS: việc giải quyết việc dân sự (như tuyên bố một người mất tích) do một Thẩm phán thực hiện ở cấp sơ thẩm; không có Hội thẩm nhân dân và không mở phiên tòa mà mở phiên họp.","b":"Điều 67 BLTTDS"},{"id":"11.03","g":11,"lv":"TH","q":"Việc xét kháng cáo, kháng nghị đối với quyết định giải quyết việc dân sự do ai thực hiện?","o":["Tập thể gồm ba Thẩm phán","Một Thẩm phán","Một Thẩm phán và hai Hội thẩm nhân dân","Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh"],"a":0,"e":"Điều 67 BLTTDS: việc xét kháng cáo, kháng nghị quyết định giải quyết việc dân sự do tập thể gồm ba Thẩm phán thực hiện, trừ trường hợp luật quy định khác. Ủy ban Thẩm phán là chủ thể giám đốc thẩm, không xét kháng cáo.","b":"Điều 67 BLTTDS"},{"id":"11.04","g":11,"lv":"TH","q":"Nếu Bộ luật Tố tụng dân sự không có quy định khác, thời hạn chuẩn bị xét đơn yêu cầu giải quyết việc dân sự là:","o":["15 ngày kể từ ngày thụ lý đơn yêu cầu","01 tháng kể từ ngày Tòa án thụ lý đơn yêu cầu","04 tháng kể từ ngày thụ lý đơn yêu cầu","02 tháng kể từ ngày nhận đơn yêu cầu"],"a":1,"e":"Khoản 1 Điều 366 BLTTDS: thời hạn chuẩn bị xét đơn yêu cầu là 01 tháng kể từ ngày Tòa án thụ lý đơn yêu cầu, trừ trường hợp Bộ luật có quy định khác (như tuyên bố mất tích, tuyên bố chết có thời hạn riêng).","b":"Khoản 1 Điều 366 BLTTDS"},{"id":"11.05","g":11,"lv":"TH","q":"Tòa án phải mở phiên họp giải quyết việc dân sự trong thời hạn:","o":["07 ngày kể từ ngày Viện kiểm sát trả hồ sơ","15 ngày kể từ ngày ra quyết định mở phiên họp","10 ngày kể từ ngày ra quyết định mở phiên họp","01 tháng kể từ ngày ra quyết định mở phiên họp"],"a":1,"e":"Khoản 4 Điều 366 BLTTDS: Tòa án phải mở phiên họp để giải quyết việc dân sự trong thời hạn 15 ngày kể từ ngày ra quyết định mở phiên họp.","b":"Khoản 4 Điều 366 BLTTDS"},{"id":"11.06","g":11,"lv":"VD","q":"Người yêu cầu giải quyết việc dân sự đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt, không có đề nghị giải quyết vắng mặt. Tòa án xử lý thế nào?","o":["Đình chỉ giải quyết và người yêu cầu mất quyền yêu cầu lại đối với việc đó","Coi như từ bỏ yêu cầu, đình chỉ giải quyết việc dân sự; người yêu cầu vẫn có quyền yêu cầu lại theo thủ tục luật định","Hoãn phiên họp và triệu tập lần thứ ba","Vẫn tiến hành phiên họp và bác yêu cầu"],"a":1,"e":"Khoản 2 Điều 367 BLTTDS: người yêu cầu đã được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt thì bị coi là từ bỏ yêu cầu và Tòa án đình chỉ giải quyết việc dân sự, trừ trường hợp có đề nghị giải quyết vắng mặt; người yêu cầu có quyền yêu cầu lại theo quy định của pháp luật.","b":"Khoản 2 Điều 367 BLTTDS"},{"id":"11.07","g":11,"lv":"TH","q":"Kiểm sát viên được phân công tham gia phiên họp sơ thẩm giải quyết việc dân sự vắng mặt thì:","o":["Tòa án vẫn tiến hành phiên họp","Tòa án tạm đình chỉ giải quyết việc dân sự","Tòa án đình chỉ giải quyết việc dân sự","Tòa án phải hoãn phiên họp"],"a":0,"e":"Khoản 1 Điều 367
