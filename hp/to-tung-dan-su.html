huận tình ly hôn có thể thỏa thuận, không thỏa thuận được thì mỗi bên chịu một nửa"]},{"t":"6.1.4. Không phải nộp, miễn, giảm án phí, lệ phí (Điều 11–16 Nghị quyết 326/2016/UBTVQH14)","cs":"","b":["Không phải nộp tạm ứng, không phải chịu án phí: cơ quan, tổ chức khởi kiện để bảo vệ quyền lợi của người khác, lợi ích công cộng, lợi ích của Nhà nước; Viện kiểm sát kháng nghị phúc thẩm; người khiếu kiện danh sách cử tri; các trường hợp khác tại khoản 1 Điều 11","Được miễn: người lao động khởi kiện đòi tiền lương, trợ cấp, bảo hiểm xã hội, bồi thường tai nạn lao động, bị sa thải, chấm dứt hợp đồng lao động trái pháp luật; người yêu cầu cấp dưỡng, xác định cha, mẹ cho con; người yêu cầu bồi thường về tính mạng, sức khỏe, danh dự, nhân phẩm, uy tín; trẻ em, cá nhân thuộc hộ nghèo, cận nghèo, người cao tuổi, người khuyết tật, người có công với cách mạng, đồng bào dân tộc thiểu số ở xã có điều kiện kinh tế – xã hội đặc biệt khó khăn, thân nhân liệt sĩ (khoản 1 Điều 12)","Được giảm 50%: người gặp sự kiện bất khả kháng dẫn đến không có đủ tài sản để nộp, có xác nhận của Ủy ban nhân dân cấp xã (Điều 13)","Hồ sơ: đơn đề nghị kèm tài liệu chứng minh thuộc trường hợp được miễn, giảm (Điều 14)","Thẩm quyền: Thẩm phán được phân công xem xét đơn khởi kiện, giải quyết vụ án; tại phiên tòa là Hội đồng xét xử; Tòa án trả lời bằng văn bản trong 03 ngày làm việc, không chấp nhận thì nêu lý do (Điều 15, 16)","Viện kiểm sát khởi kiện vụ án dân sự theo Nghị quyết 205/2025/QH15: không phải nộp tạm ứng án phí, không phải chịu án phí"],"c":[{"t":"Bảng so sánh: không phải nộp – miễn – giảm","cs":"","b":["Bản chất: không phải nộp là không phát sinh nghĩa vụ; miễn là có nghĩa vụ nhưng được Tòa án cho không nộp; giảm là chỉ nộp 50%","Thủ tục: không phải nộp không cần đơn; miễn, giảm phải có đơn và tài liệu chứng minh","Đối tượng điển hình: cơ quan, tổ chức khởi kiện vì lợi ích người khác, Viện kiểm sát kháng nghị – người lao động, người yêu cầu cấp dưỡng, hộ nghèo – người gặp bất khả kháng"]}]}]},{"t":"6.2. Chi phí tố tụng","cs":"Điều 151–169 BLTTDS","b":["Mỗi loại chi phí đọc theo ba câu hỏi: ai nộp tạm ứng; ai chịu; thừa thì hoàn trả, thiếu thì nộp thêm."],"c":[{"t":"6.2.1. Chi phí ủy thác tư pháp ra nước ngoài (Điều 151–154)","cs":"","b":["Nộp tạm ứng: nguyên đơn, người kháng cáo hoặc đương sự khác có yêu cầu làm phát sinh việc ủy thác; trong việc dân sự là người yêu cầu","Chịu: đương sự có yêu cầu không được Tòa án chấp nhận, trừ trường hợp có thỏa thuận khác; chia tài sản chung theo tỷ lệ phần được chia; ly hôn thì nguyên đơn chịu","Xử lý tạm ứng: thừa thì hoàn trả, thiếu thì nộp thêm theo quyết định của Tòa án"]},{"t":"6.2.2. Chi phí xem xét, thẩm định tại chỗ (Điều 155–158)","cs":"","b":["Nộp tạm ứng: người yêu cầu xem xét, thẩm định tại chỗ; Tòa án tự quyết định thì nguyên đơn, người yêu cầu giải quyết việc dân sự, người kháng cáo nộp","Chịu: đương sự có yêu cầu không được chấp nhận; chia tài sản chung theo tỷ lệ; ly hôn thì nguyên đơn chịu, thuận tình thì mỗi bên một nửa; đình chỉ do rút yêu cầu hoặc vắng mặt lần thứ hai thì nguyên đơn chịu","Xử lý tạm ứng: thừa thì hoàn trả, thiếu thì nộp thêm"]},{"t":"6.2.3. Chi phí giám định (Điều 159–162)","cs":"","b":["Nộp tạm ứng: người yêu cầu Tòa án trưng cầu giám định; các bên cùng yêu cầu giám định một đối tượng thì mỗi bên nộp một nửa; Tòa án tự trưng cầu thì nguyên đơn, người yêu cầu, người kháng cáo nộp; tự yêu cầu giám định thì theo Luật Giám định tư pháp","Chịu: người yêu cầu nếu kết quả giám định chứng minh yêu cầu không có căn cứ; người không chấp nhận yêu cầu trưng cầu nếu kết quả chứng minh yêu cầu có căn cứ; có căn cứ một phần thì chịu phần tương ứng","Xử lý tạm ứng: thừa thì hoàn trả, thiếu thì nộp thêm"]},{"t":"6.2.4. Chi phí định giá tài sản, thẩm định giá (Điều 163–166)","cs":"","b":["Nộp tạm ứng: người yêu cầu định giá; các bên không thống nhất được giá và cùng yêu cầu thì mỗi bên nộp một nửa; Tòa án quyết định định giá theo khoản 3 Điều 104 thì nguyên đơn, người kháng cáo nộp","Chịu: đương sự có yêu cầu không được chấp nhận; chia tài sản chung theo tỷ lệ phần được chia; Tòa án quyết định định giá mà kết quả chứng minh quyết định đó không có căn cứ thì Tòa án trả","Chi phí thẩm định giá do đương sự thuê: áp dụng tương tự quy định về nghĩa vụ chịu chi phí định giá (khoản 6 Điều 165)"]},{"t":"6.2.5. Chi phí cho người làm chứng, người phiên dịch, luật sư (Điều 167–169)","cs":"","b":["Người làm chứng: chi phí hợp lý, thực tế do đương sự chịu; người đề nghị triệu tập chịu nếu lời làm chứng đúng sự thật nhưng không đúng với yêu cầu của mình; lời làm chứng đúng sự thật và đúng yêu cầu thì đương sự có yêu cầu độc lập với người đề nghị chịu","Người phiên dịch, luật sư: người có yêu cầu chịu, trừ trường hợp các bên có thỏa thuận khác; Tòa án yêu cầu người phiên dịch thì Tòa án trả","Ủy ban Thường vụ Quốc hội quy định chi tiết về chi phí tố tụng (Điều 169)"]}]}]},{"t":"7. Thủ tục giải quyết vụ án tại Tòa án cấp sơ thẩm","cs":"Điều 186–269 BLTTDS (khoản 6 Điều 194 sửa đổi bởi Luật 85/2025/QH15); Nghị quyết 205/2025/QH15; Luật Hòa giải, đối thoại tại Tòa án 2020; Nghị quyết 04/2017/NQ-HĐTP; Nghị quyết 01/2026/NQ-HĐTP","b":["Bốn giai đoạn nối tiếp: khởi kiện → thụ lý → chuẩn bị xét xử (có hòa giải) → phiên tòa sơ thẩm.","Điểm cập nhật: khiếu nại việc trả lại đơn khởi kiện do Chánh án Tòa án trên một cấp trực tiếp giải quyết trong 10 ngày, quyết định là quyết định cuối cùng; khoản 7 Điều 194 bị bãi bỏ."],"c":[{"t":"7.1. Khởi kiện vụ án dân sự","cs":"Điều 186–190 BLTTDS; Nghị quyết 205/2025/QH15; Nghị quyết 04/2017/NQ-HĐTP; Nghị quyết 01/2026/NQ-HĐTP","b":[],"c":[{"t":"7.1.1. Khái niệm, ý nghĩa (Điều 5, 186)","cs":"","b":["Khởi kiện là việc chủ thể có quyền yêu cầu Tòa án có thẩm quyền giải quyết tranh chấp, bảo vệ quyền, lợi ích hợp pháp của mình hoặc của người khác, lợi ích công cộng, lợi ích của Nhà nước","Là hành vi làm phát sinh vụ án: không có đơn khởi kiện thì Tòa án không tự giải quyết (nguyên tắc quyền quyết định và tự định đoạt)","Tòa án chỉ giải quyết trong phạm vi đơn khởi kiện"]},{"t":"7.1.2. Điều kiện, phạm vi và hình thức khởi kiện (Điều 186–190)","cs":"","b":["b) Điều kiện khác: tranh chấp thuộc thẩm quyền của Tòa án; sự việc chưa được giải quyết bằng bản án, quyết định đã có hiệu lực; đã đủ điều kiện khởi kiện theo luật nội dung (ví dụ hòa giải tranh chấp đất đai tại Ủy ban nhân dân cấp xã theo pháp luật đất đai; nghĩa vụ đã đến hạn) – Nghị quyết 04/2017/NQ-HĐTP","c) Phạm vi (Điều 188): một hoặc nhiều chủ thể khởi kiện một hoặc nhiều chủ thể; nhiều quan hệ pháp luật có liên quan với nhau được giải quyết trong cùng một vụ án","d) Hình thức (Điều 189, 190): đơn khởi kiện bằng văn bản theo nội dung luật định, kèm tài liệu, chứng cứ; gửi trực tiếp, qua dịch vụ bưu chính hoặc trực tuyến qua Cổng thông tin điện tử của Tòa án (Nghị quyết 01/2026/NQ-HĐTP – chờ đối chiếu toàn văn); ngày khởi kiện là ngày nộp đơn hoặc ngày có dấu bưu chính nơi gửi"],"c":[{"t":"a) Chủ thể có quyền khởi kiện","cs":"","b":["Cơ quan, tổ chức, cá nhân tự mình hoặc thông qua người đại diện hợp pháp khởi kiện để bảo vệ quyền, lợi ích của mình (Điều 186)","Khởi kiện vì người khác, lợi ích công cộng, lợi ích Nhà nước: cơ quan quản lý nhà nước về gia đình, trẻ em, Hội Liên hiệp phụ nữ; công đoàn cấp trên của công đoàn cơ sở; tổ chức xã hội tham gia bảo vệ quyền lợi người tiêu dùng; cơ quan, tổ chức trong lĩnh vực mình phụ trách; cá nhân trong vụ án hôn nhân và gia đình theo Luật Hôn nhân và gia đình (Điều 187)"]},{"t":"đ) (thêm) Viện kiểm sát khởi kiện vụ án dân sự công ích (Nghị quyết 205/2025/QH15)","cs":"","b":["Đối tượng: 6 nhóm dễ bị tổn thương (trẻ em; người cao tuổi; người khuyết tật; phụ nữ mang thai hoặc nuôi con dưới 36 tháng tuổi; người khó khăn trong nhận thức, làm chủ hành vi hoặc mất, hạn chế năng lực hành vi dân sự; đồng bào dân tộc thiểu số ở vùng đặc biệt khó khăn) và 6 lĩnh vực lợi ích công (đầu tư công; đất đai, tài nguyên, tài sản công; môi trường; di sản văn hóa; an toàn thực phẩm, dược phẩm; bảo vệ người tiêu dùng)","Điều kiện: không có chủ thể khởi kiện hoặc chủ thể có quyền không khởi kiện sau khi Viện kiểm sát đã thông báo, kiến nghị","Thẩm quyền sơ thẩm: Tòa án nhân dân khu vực; vụ án bảo vệ lợi ích công không được hòa giải, bị đơn không được phản tố","Thí điểm 3 năm từ 01/01/2026 tại Hà Nội, TP. Hồ Chí Minh, Đà Nẵng, Cần Thơ, Quảng Ninh, Đắk Lắk"]}]}]},{"t":"7.2. Thụ lý vụ án dân sự và trả lại đơn khởi kiện","cs":"Điều 191–202 BLTTDS (khoản 6 Điều 194 sửa đổi 2025); Nghị quyết 04/2017/NQ-HĐTP","b":[],"c":[{"t":"7.2.1. Thụ lý vụ án dân sự","cs":"","b":["a) Nhận, xử lý đơn (Điều 191, 193): Chánh án phân công Thẩm phán trong 03 ngày làm việc; Thẩm phán xem xét trong 05 ngày làm việc và ra một trong bốn quyết định: yêu cầu sửa đổi, bổ sung đơn; thụ lý theo thủ tục thông thường hoặc rút gọn; chuyển đơn cho Tòa án có thẩm quyền; trả lại đơn. Thời hạn sửa đổi, bổ sung đơn do Thẩm phán ấn định, không quá 01 tháng (trường hợp đặc biệt gia hạn không quá 15 ngày)","b) Thụ lý (Điều 195–197): thông báo nộp tạm ứng án phí; người khởi kiện nộp trong 07 ngày; Tòa án thụ lý khi người khởi kiện nộp biên lai; được miễn hoặc không phải nộp thì thụ lý khi nhận đủ đơn và tài liệu; thông báo thụ lý trong 03 ngày làm việc cho nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan và Viện kiểm sát cùng cấp; Chánh án phân công Thẩm phán giải quyết trong 03 ngày làm việc","c) Quyền của bị đơn, người có quyền lợi, nghĩa vụ liên quan (Điều 199–202): nộp văn bản ghi ý kiến trong 15 ngày kể từ ngày nhận thông báo, được gia hạn không quá 15 ngày; phản tố khi để bù trừ nghĩa vụ, khi được chấp nhận sẽ loại trừ một phần hoặc toàn bộ yêu cầu của nguyên đơn, hoặc có liên quan mà giải quyết cùng thì chính xác và nhanh hơn; yêu cầu độc lập khi việc giải quyết vụ án liên quan đến quyền, nghĩa vụ của họ; thời điểm: trước khi mở phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải; thủ tục như thủ tục khởi kiện của nguyên đơn"]},{"t":"7.2.2. Trả lại đơn khởi kiện (Điều 192, 194; Nghị quyết 04/2017/NQ-HĐTP)","cs":"","b":["a) Căn cứ (khoản 1 Điều 192): người khởi kiện không có quyền khởi kiện hoặc không có đủ năng lực hành vi tố tụng dân sự; chưa có đủ điều kiện khởi kiện; sự việc đã được giải quyết bằng bản án, quyết định đã có hiệu lực (trừ trường hợp luật cho khởi kiện lại); hết thời hạn mà không nộp tạm ứng án phí (trừ trường hợp được miễn, không phải nộp hoặc có lý do chính đáng); vụ án không thuộc thẩm quyền giải quyết của Tòa án; không sửa đổi, bổ sung đơn theo yêu cầu; người khởi kiện rút đơn","b) Khiếu nại, kiến nghị (Điều 194): trong 10 ngày kể từ ngày nhận văn bản trả lại đơn, người khởi kiện khiếu nại, Viện kiểm sát kiến nghị với Tòa án đã trả lại đơn; Chánh án phân công Thẩm phán khác; phiên họp trong 05 ngày làm việc có Viện kiểm sát và người khiếu nại; không đồng ý thì trong 10 ngày khiếu nại, kiến nghị lên Chánh án Tòa án trên một cấp trực tiếp, người này giải quyết trong 10 ngày và quyết định là quyết định cuối cùng (khoản 6 sửa đổi 2025)","c) Quyền nộp đơn khởi kiện lại (khoản 3 Điều 192): người khởi kiện đã có đủ năng lực hành vi tố tụng dân sự; yêu cầu ly hôn, thay đổi nuôi con, mức cấp dưỡng… mà trước đó Tòa án chưa chấp nhận và pháp luật cho khởi kiện lại; đã có đủ điều kiện khởi kiện; các trường hợp khác luật định"]}]},{"t":"7.3. Chuẩn bị xét xử, hòa giải, tạm đình chỉ và đình chỉ giải quyết vụ án dân sự","cs":"Điều 203–221 BLTTDS; Luật Hòa giải, đối thoại tại Tòa án 2020","b":[],"c":[{"t":"7.3.1. Chuẩn bị xét xử (Điều 203, 204, 220, 221)","cs":"","b":["a) Thời hạn: tranh chấp dân sự, hôn nhân và gia đình 04 tháng kể từ ngày thụ lý, gia hạn không quá 02 tháng; kinh doanh, thương mại, lao động 02 tháng, gia hạn không quá 01 tháng; tạm đình chỉ thì thời hạn tính lại từ ngày quyết định tiếp tục giải quyết có hiệu lực","Nhiệm vụ của Thẩm phán: lập hồ sơ vụ án; xác định tư cách đương sự, quan hệ tranh chấp, pháp luật áp dụng; xác minh, thu thập chứng cứ; áp dụng biện pháp khẩn cấp tạm thời; tổ chức phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải","b) Kết thúc giai đoạn bằng một trong bốn quyết định: công nhận sự thỏa thuận của các đương sự; tạm đình chỉ; đình chỉ; đưa vụ án ra xét xử. Mở phiên tòa trong 01 tháng kể từ ngày có quyết định đưa vụ án ra xét xử (có lý do chính đáng thì 02 tháng); gửi hồ sơ cho Viện kiểm sát nghiên cứu (Điều 220, 221)"]},{"t":"7.3.2. Hòa giải (Điều 10, 205–213)","cs":"","b":["a) Nguyên tắc: tôn trọng sự tự nguyện thỏa thuận; không dùng vũ lực, đe dọa, ép buộc; nội dung thỏa thuận không vi phạm điều cấm của luật, không trái đạo đức xã hội. Vụ án không được hòa giải (Điều 206): yêu cầu bồi thường vì gây thiệt hại đến tài sản của Nhà nước; vụ án phát sinh từ giao dịch vi phạm điều cấm của luật, trái đạo đức xã hội. Vụ án không tiến hành hòa giải được (Điều 207): bị đơn, người có quyền lợi, nghĩa vụ liên quan được triệu tập hợp lệ lần thứ hai mà cố tình vắng mặt; đương sự không thể tham gia vì lý do chính đáng; vợ hoặc chồng trong vụ án ly hôn mất năng lực hành vi dân sự; một trong các đương sự đề nghị không tiến hành hòa giải","b) Phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ và hòa giải (Điều 208–211): thông báo cho đương sự; thành phần; trình tự; lập biên bản","c) Công nhận sự thỏa thuận (Điều 212, 213): hết 07 ngày kể từ ngày lập biên bản hòa giải thành mà không đương sự nào thay đổi ý kiến thì Thẩm phán ra quyết định công nhận; chỉ công nhận khi thỏa thuận được toàn bộ vụ án; quyết định có hiệu lực ngay, không bị kháng cáo, kháng nghị phúc thẩm; chỉ bị kháng nghị giám đốc thẩm nếu có căn cứ cho rằng thỏa thuận do nhầm lẫn, lừa dối, đe dọa, cưỡng ép hoặc vi phạm điều cấm, trái đạo đức xã hội","d) (thêm) Phân biệt với hòa giải, đối thoại tại Tòa án theo Luật 58/2020/QH14: tiến hành trước khi Tòa án thụ lý, do Hòa giải viên thực hiện, các bên tự nguyện tham gia; hòa giải thành thì Tòa án xem xét ra quyết định công nhận; không thành thì Tòa án thụ lý theo BLTTDS. Từ 01/7/2025 việc hòa giải, đối thoại này gắn với Tòa án nhân dân khu vực"]},{"t":"7.3.3. Tạm đình chỉ và đình chỉ giải quyết vụ án dân sự (Điều 214–219)","cs":"","b":["a) Tạm đình chỉ (Điều 214–216): đương sự là cá nhân chết, cơ quan, tổ chức hợp nhất, sáp nhập, chia, tách, giải thể mà chưa có người kế thừa; đương sự mất năng lực hành vi dân sự hoặc là người chưa thành niên mà chưa xác định được người đại diện; chấm dứt đại diện hợp pháp mà chưa có người thay thế; cần đợi kết quả giải quyết vụ án khác hoặc việc phải do cơ quan khác giải quyết trước; cần đợi kết quả ủy thác tư pháp, ủy thác thu thập chứng cứ; cần đợi kết quả xử lý văn bản quy phạm pháp luật có dấu hiệu trái Hiến pháp, luật; trường hợp theo pháp luật về phá sản; trường hợp khác. Hậu quả: không xóa tên vụ án khỏi sổ thụ lý; Tòa án tiếp tục giải quyết khi lý do tạm đình chỉ không còn","b) Đình chỉ (Điều 217, 218): nguyên đơn hoặc bị đơn là cá nhân chết mà quyền, nghĩa vụ không được thừa kế; cơ quan, tổ chức giải thể, phá sản mà không có người kế thừa; người khởi kiện rút toàn bộ yêu cầu hoặc nguyên đơn được triệu tập hợp lệ lần thứ hai vẫn vắng mặt (trừ đề nghị xét xử vắng mặt, sự kiện bất khả kháng); đã mở thủ tục phá sản đối với doanh nghiệp, hợp tác xã là đương sự; nguyên đơn không nộp tạm ứng chi phí định giá và chi phí tố tụng khác; đương sự yêu cầu áp dụng thời hiệu trước khi Tòa án cấp sơ thẩm ra bản án và thời hiệu đã hết; trường hợp phải trả lại đơn mà Tòa án đã thụ lý. Hậu quả: xóa tên vụ án; không được khởi kiện lại nếu không có gì khác về nguyên đơn, bị đơn, quan hệ tranh chấp (trừ khoản 3 Điều 192, điểm c khoản 1 Điều 217); tiền tạm ứng án phí sung công quỹ khi đình chỉ do đương sự chết, giải thể hoặc nguyên đơn vắng mặt lần thứ hai, được trả lại khi người khởi kiện rút yêu cầu và các trường hợp khác (khoản 2, 3 Điều 218)","Nguyên đơn rút toàn bộ yêu cầu hoặc vắng mặt lần thứ hai mà bị đơn vẫn giữ yêu cầu phản tố: đình chỉ yêu cầu của nguyên đơn, bị đơn trở thành nguyên đơn và ngược lại (khoản 2 Điều 217)","Thẩm quyền ra quyết định: trước khi mở phiên tòa là Thẩm phán; tại phiên tòa là Hội đồng xét xử; quyết định tạm đình chỉ, đình chỉ có thể bị kháng cáo, kháng nghị phúc thẩm (Điều 219)"],"c":[{"t":"c) Bảng so sánh tạm đình chỉ – đình chỉ","cs":"","b":["Bản chất: tạm đình chỉ là tạm dừng; đình chỉ là chấm dứt việc giải quyết vụ án","Sổ thụ lý: tạm đình chỉ giữ tên vụ án; đình chỉ xóa tên vụ án","Tiền tạm ứng án phí: tạm đình chỉ thì gửi giữ, xử lý khi tiếp tục; đình chỉ thì sung công quỹ hoặc trả lại tùy căn cứ","Hậu quả tiếp theo: tạm đình chỉ thì Tòa án tiếp tục giải quyết khi lý do không còn; đình chỉ thì về nguyên tắc không được khởi kiện lại"]}]}]},{"t":"7.4. Phiên tòa sơ thẩm vụ án dân sự","cs":"Điều 222–269 BLTTDS; Nghị quyết 01/2017/NQ-HĐTP (biểu mẫu)","b":[],"c":[{"t":"7.4.1. Khái niệm, ý nghĩa (Điều 222, 225)","cs":"","b":["Phiên tòa sơ thẩm là hình thức hoạt động xét xử tập trung nhất, nơi Hội đồng xét xử xem xét toàn bộ vụ án và ra bản án","Xét xử trực tiếp, bằng lời nói; công khai, trừ trường hợp xét xử kín theo luật","Hội đồng xét xử sơ thẩm gồm 01 Thẩm phán và 02 Hội thẩm nhân dân; trường hợp đặc biệt gồm 02 Thẩm phán và 03 Hội thẩm nhân dân (Điều 63)"]},{"t":"7.4.2. Quy định chung về phiên tòa (Điều 222–238)","cs":"","b":["a) Sự có mặt (Điều 227, 229–232): đương sự vắng mặt lần thứ nhất thì hoãn phiên tòa, trừ khi có đơn đề nghị xét xử vắng mặt; lần thứ hai: nguyên đơn vắng mặt bị coi là từ bỏ yêu cầu khởi kiện và bị đình chỉ, bị đơn không có yêu cầu phản tố thì xét xử vắng mặt, bị đơn có phản tố vắng mặt bị coi là từ bỏ phản tố, người có yêu cầu độc lập vắng mặt bị coi là từ bỏ yêu cầu; Kiểm sát viên vắng mặt thì vẫn xét xử, không hoãn phiên tòa","b) Xét xử vắng mặt (Điều 228, 238): khi đương sự có đơn đề nghị xét xử vắng mặt hoặc thuộc trường hợp luật quy định; tất cả người tham gia tố tụng đều có đơn đề nghị xét xử vắng mặt thì xét xử theo thủ tục riêng","c) Hoãn phiên tòa (Điều 233): thời hạn hoãn không quá 01 tháng kể từ ngày ra quyết định hoãn; theo thủ tục rút gọn không quá 15 ngày"]},{"t":"7.4.3. Trình tự, thủ tục tiến hành phiên tòa","cs":"","b":["a) Thủ tục bắt đầu (Điều 237–246): chuẩn bị khai mạc; khai mạc; giải quyết yêu cầu thay đổi người tiến hành tố tụng, người giám định, người phiên dịch; xem xét hoãn khi có người vắng mặt; hỏi đương sự về việc thay đổi, bổ sung, rút yêu cầu – chấp nhận thay đổi, bổ sung nếu không vượt quá phạm vi yêu cầu khởi kiện, phản tố, yêu cầu độc lập ban đầu, rút yêu cầu tự nguyện thì đình chỉ phần đã rút; thay đổi địa vị tố tụng khi nguyên đơn rút toàn bộ yêu cầu mà bị đơn giữ phản tố; công nhận sự thỏa thuận tại phiên tòa","b) Tranh tụng (Điều 247–263): gồm trình bày chứng cứ, hỏi, đối đáp, phát biểu quan điểm; chủ tọa không được hạn chế thời gian tranh tụng; thứ tự hỏi: nguyên đơn và người bảo vệ, bị đơn và người bảo vệ, người có quyền lợi, nghĩa vụ liên quan và người bảo vệ, người tham gia tố tụng khác, sau đó Chủ tọa, Hội thẩm nhân dân, cuối cùng là Kiểm sát viên; tranh luận, đối đáp; Kiểm sát viên phát biểu về việc tuân theo pháp luật tố tụng và việc giải quyết vụ án","c) Nghị án, tuyên án, bản án (Điều 264–269): chỉ thành viên Hội đồng xét xử được nghị án; biểu quyết theo đa số, Hội thẩm nhân dân biểu quyết trước, Thẩm phán biểu quyết sau cùng; vụ án phức tạp thời gian nghị án không quá 05 ngày làm việc; bản án gồm phần mở đầu, phần nội dung vụ án và nhận định, phần quyết định; chỉ sửa chữa, bổ sung lỗi chính tả, số liệu, tính toán; cấp trích lục bản án trong 03 ngày làm việc, giao, gửi bản án trong 10 ngày kể từ ngày tuyên án","d) Kỹ năng: sơ đồ diễn trình phiên tòa; soạn đơn khởi kiện, quyết định, bản án theo biểu mẫu Nghị quyết 01/2017/NQ-HĐTP"]}]}]},{"t":"8. Thủ tục phúc thẩm","cs":"Điều 17, 270–315 BLTTDS (khoản 1 Điều 315 sửa đổi bởi Luật 85/2025/QH15); Điều 37, 38 BLTTDS sửa đổi 2025","b":["Tòa án cấp phúc thẩm theo mô hình từ 01/7/2025: Tòa án nhân dân cấp tỉnh (các Tòa chuyên trách) xét xử phúc thẩm bản án, quyết định sơ thẩm chưa có hiệu lực của Tòa án nhân dân khu vực.","Điểm cập nhật: giáo trình còn mô tả Tòa án nhân dân cấp cao xét xử phúc thẩm; từ 01/7/2025 không còn Tòa án cấp cao."],"c":[{"t":"8.1. Khái niệm và ý nghĩa phúc thẩm dân sự","cs":"Điều 17, 64, 270 BLTTDS","b":[],"c":[{"t":"8.1.1. Khái niệm phúc thẩm dân sự (Điều 17, 270)","cs":"","b":["Xét xử phúc thẩm là việc Tòa án cấp trên trực tiếp xét xử lại vụ án mà bản án, quyết định sơ thẩm chưa có hiệu lực pháp luật bị kháng cáo, kháng nghị","Thể hiện chế độ hai cấp xét xử: bản án sơ thẩm không bị kháng cáo, kháng nghị thì có hiệu lực pháp luật","Đặc điểm: chỉ phát sinh khi có kháng cáo, kháng nghị hợp lệ; chỉ xem xét phần bị kháng cáo, kháng nghị hoặc có liên quan; Hội đồng xét xử gồm 03 Thẩm phán; bản án phúc thẩm có hiệu lực từ ngày tuyên án"]},{"t":"8.1.2. Ý nghĩa phúc thẩm dân sự","cs":"","b":["Sửa chữa sai lầm của Tòa án cấp sơ thẩm, bảo vệ quyền, lợi ích hợp pháp của đương sự","Bảo đảm áp dụng pháp luật thống nhất; Tòa án cấp trên kiểm tra, hướng dẫn hoạt động xét xử của Tòa án cấp dưới","Nâng cao trách nhiệm của Tòa án cấp sơ thẩm và niềm tin của người dân vào công lý"]}]},{"t":"8.2. Kháng cáo, kháng nghị theo thủ tục phúc thẩm","cs":"Điều 271–284 BLTTDS","b":[],"c":[{"t":"8.2.1. Kháng cáo theo thủ tục phúc thẩm (Điều 271–277)","cs":"","b":["a) Người có quyền kháng cáo: đương sự, người đại diện hợp pháp của đương sự, cơ quan, tổ chức, cá nhân khởi kiện; đối tượng: bản án sơ thẩm, quyết định tạm đình chỉ, đình chỉ giải quyết vụ án của Tòa án cấp sơ thẩm (Điều 271); quyết định công nhận sự thỏa thuận không bị kháng cáo (Điều 213); đơn kháng cáo gửi Tòa án cấp sơ thẩm đã ra bản án, quyết định (Điều 272)","b) Thời hạn (Điều 273): bản án 15 ngày kể từ ngày tuyên án; vắng mặt có lý do chính đáng thì tính từ ngày nhận bản án hoặc ngày niêm yết; quyết định tạm đình chỉ, đình chỉ 07 ngày kể từ ngày nhận quyết định hoặc ngày niêm yết; gửi qua bưu chính thì ngày kháng cáo là ngày có dấu bưu chính nơi gửi. Kháng cáo quá hạn (Điều 275): Tòa án cấp phúc thẩm thành lập Hội đồng gồm 03 Thẩm phán xem xét tại phiên họp có Kiểm sát viên và người kháng cáo quá hạn","c) Kiểm tra đơn, tạm ứng án phí phúc thẩm (Điều 274, 276): người kháng cáo nộp tạm ứng trong 10 ngày kể từ ngày nhận thông báo; không nộp thì coi như từ bỏ kháng cáo, trừ trường hợp có lý do chính đáng"]},{"t":"8.2.2. Kháng nghị theo thủ tục phúc thẩm (Điều 278–284)","cs":"","b":["a) Chủ thể: Viện trưởng Viện kiểm sát cùng cấp và cấp trên trực tiếp, bằng quyết định kháng nghị (Điều 278, 279); thời hạn (Điều 280): bản án – cùng cấp 15 ngày, cấp trên trực tiếp 01 tháng kể từ ngày tuyên án (Kiểm sát viên không tham gia phiên tòa thì tính từ ngày Viện kiểm sát cùng cấp nhận bản án); quyết định tạm đình chỉ, đình chỉ – 07 ngày và 10 ngày kể từ ngày Viện kiểm sát cùng cấp nhận quyết định","b) Thông báo kháng cáo, kháng nghị cho đương sự có liên quan (Điều 277, 281); hậu quả (Điều 282): phần bản án, quyết định bị kháng cáo, kháng nghị chưa được đưa ra thi hành, trừ trường hợp luật quy định thi hành ngay; thay đổi, bổ sung, rút (Điều 284): trước khi bắt đầu hoặc tại phiên tòa phúc thẩm, nhưng nếu thời hạn kháng cáo, kháng nghị đã hết thì không được vượt quá phạm vi ban đầu; rút toàn bộ thì đình chỉ xét xử phúc thẩm"],"c":[{"t":"c) Bảng so sánh kháng cáo – kháng nghị","cs":"","b":["Chủ thể: kháng cáo là đương sự, người đại diện, người khởi kiện; kháng nghị là Viện trưởng Viện kiểm sát cùng cấp, cấp trên trực tiếp","Hình thức: đơn kháng cáo – quyết định kháng nghị","Thời hạn với bản án: 15 ngày – 15 ngày (cùng cấp) hoặc 01 tháng (cấp trên trực tiếp)","Án phí: người kháng cáo nộp tạm ứng án phí phúc thẩm – Viện kiểm sát không phải nộp","Bản chất: bảo vệ quyền lợi của người kháng cáo – thực hiện chức năng kiểm sát việc tuân theo pháp luật"]}]}]},{"t":"8.3. Xét xử phúc thẩm vụ án dân sự","cs":"Điều 285–315 BLTTDS","b":[],"c":[{"t":"8.3.1. (thêm) Thụ lý và chuẩn bị xét xử phúc thẩm (Điều 285–292)","cs":"","b":["Tòa án cấp phúc thẩm thụ lý ngay khi nhận hồ sơ vụ án, kháng cáo, kháng nghị; Chánh án phân công Hội đồng xét xử gồm 03 Thẩm phán","Thời hạn chuẩn bị xét xử: 02 tháng kể từ ngày thụ lý, vụ án phức tạp hoặc có trở ngại khách quan được gia hạn không quá 01 tháng; mở phiên tòa trong 01 tháng kể từ ngày có quyết định đưa vụ án ra xét xử (có lý do chính đáng thì 02 tháng)","Đương sự có quyền cung cấp tài liệu, chứng cứ bổ sung (Điều 287); Tòa án có thể áp dụng, thay đổi, hủy bỏ biện pháp khẩn cấp tạm thời (Điều 291)","Đình chỉ xét xử phúc thẩm (Điều 289): người kháng cáo rút toàn bộ kháng cáo, Viện kiểm sát rút toàn bộ kháng nghị, các trường hợp đương sự chết, giải thể không có người kế thừa; bản án sơ thẩm có hiệu lực từ ngày ra quyết định đình chỉ"]},{"t":"8.3.2. (thêm) Phạm vi xét xử phúc thẩm và phiên tòa phúc thẩm (Điều 293–307)","cs":"","b":["Phạm vi: chỉ xem xét lại phần bản án, quyết định sơ thẩm có kháng cáo, kháng nghị hoặc có liên quan đến việc xem xét nội dung kháng cáo, kháng nghị (Điều 293)","Vắng mặt (Điều 296): Kiểm sát viên vắng mặt thì vẫn xét xử, trừ trường hợp Viện kiểm sát có kháng nghị; người kháng cáo vắng mặt lần thứ nhất thì hoãn phiên tòa; lần thứ hai không có đơn đề nghị xét xử vắng mặt thì coi như từ bỏ kháng cáo, đình chỉ xét xử phúc thẩm đối với kháng cáo đó; thời hạn hoãn theo Điều 233","Nguyên đơn rút đơn khởi kiện trước hoặc tại phiên tòa phúc thẩm (Điều 299): hỏi bị đơn; bị đơn không đồng ý thì không chấp nhận; đồng ý thì hủy bản án sơ thẩm, đình chỉ giải quyết vụ án, các đương sự chịu án phí sơ thẩm theo quyết định của cấp sơ thẩm và một nửa án phí phúc thẩm; nguyên đơn có quyền khởi kiện lại","Thỏa thuận tại phiên tòa phúc thẩm (Điều 300): Hội đồng xét xử ra bản án phúc thẩm sửa bản án sơ thẩm, công nhận sự thỏa thuận","Tranh tụng, nghị án, tuyên án (Điều 301–307): người kháng cáo trình bày nội dung kháng cáo trước; Kiểm sát viên trình bày kháng nghị (nếu có) và phát biểu ý kiến"]},{"t":"8.3.3. (thêm) Thẩm quyền của Hội đồng xét xử phúc thẩm (Điều 308–313)","cs":"","b":["Giữ nguyên bản án sơ thẩm: kháng cáo, kháng nghị không có căn cứ","Sửa bản án sơ thẩm (Điều 309): Tòa án cấp sơ thẩm quyết định không đúng pháp luật, khi chứng cứ đã đầy đủ hoặc việc thu thập, bổ sung chứng cứ đã thực hiện đầy đủ","Hủy bản án sơ thẩm, chuyển hồ sơ cho Tòa án cấp sơ thẩm giải quyết lại (Điều 310): việc thu thập chứng cứ, chứng minh chưa thực hiện đầy đủ mà cấp phúc thẩm không thể bổ sung; thành phần Hội đồng xét xử sơ thẩm không đúng; vi phạm nghiêm trọng thủ tục tố tụng","Hủy bản án sơ thẩm và đình chỉ giải quyết vụ án (Điều 311): vụ án thuộc trường hợp đình chỉ theo Điều 217 hoặc nguyên đơn rút đơn được bị đơn đồng ý","Đình chỉ xét xử phúc thẩm (Điều 312): rút toàn bộ kháng cáo, kháng nghị; người kháng cáo vắng mặt lần thứ hai","Bản án phúc thẩm có hiệu lực pháp luật kể từ ngày tuyên án (Điều 313); Tòa án cấp phúc thẩm gửi bản án, quyết định trong 15 ngày kể từ ngày ra bản án, quyết định (khoản 1 Điều 315 sửa đổi 2025)"]},{"t":"8.3.4. (thêm) Phúc thẩm đối với quyết định của Tòa án cấp sơ thẩm bị kháng cáo, kháng nghị (Điều 314)","cs":"","b":["Không mở phiên tòa, không triệu tập đương sự (trừ trường hợp cần nghe ý kiến); mở phiên họp trong 01 tháng kể từ ngày thụ lý (lý do chính đáng 02 tháng); Kiểm sát viên tham gia và phát biểu ý kiến","Hội đồng phúc thẩm: giữ nguyên; sửa; hủy quyết định và chuyển hồ sơ cho Tòa án cấp sơ thẩm tiếp tục giải quyết","Quyết định phúc thẩm có hiệu lực pháp luật kể từ ngày ra quyết định"]}]}]},{"t":"9. Thủ tục rút gọn giải quyết vụ án dân sự","cs":"Điều 65, 316–324 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); khoản 5 Điều 317 bổ sung bởi Luật Bảo vệ quyền lợi người tiêu dùng số 19/2023/QH15; khoản 2 Điều 70 Luật Bảo vệ quyền lợi người tiêu dùng","b":["Hai trọng tâm: điều kiện áp dụng và các trường hợp chuyển sang thủ tục thông thường; các thời hạn rút ngắn (sơ thẩm 01 tháng – 10 ngày; kháng cáo 07 ngày; phúc thẩm 01 tháng – 15 ngày).","Điểm cập nhật: phúc thẩm theo thủ tục rút gọn do một Thẩm phán Tòa án nhân dân cấp tỉnh tiến hành; vụ án bảo vệ quyền lợi người tiêu dùng có giá trị giao dịch dưới 100 triệu đồng được giải quyết theo thủ tục rút gọn mà không phải đáp ứng các điều kiện tại khoản 1 Điều 317."],"c":[{"t":"9.1. Khái niệm, ý nghĩa và điều kiện áp dụng thủ tục rút gọn","cs":"Điều 11, 65, 316, 317 BLTTDS","b":[],"c":[{"t":"9.1.1. Khái niệm (Điều 316)","cs":"","b":["Thủ tục rút gọn là thủ tục tố tụng áp dụng để giải quyết vụ án dân sự có đủ điều kiện luật định, với trình tự đơn giản hơn thủ tục giải quyết vụ án thông thường, nhằm giải quyết nhanh chóng nhưng vẫn bảo đảm đúng pháp luật (khoản 1 Điều 316)","Chỉ áp dụng cho vụ án dân sự (có tranh chấp), ở cả cấp sơ thẩm và cấp phúc thẩm; quy định riêng về thủ tục rút gọn được áp dụng trước, chỗ nào không quy định thì áp dụng quy định chung của BLTTDS (khoản 2 Điều 316)","Luật khác quy định tranh chấp được giải quyết theo thủ tục rút gọn thì thực hiện theo các quy định về thủ tục rút gọn của BLTTDS (khoản 3 Điều 316)","Đặc điểm: một Thẩm phán xét xử cả sơ thẩm và phúc thẩm, không có Hội thẩm nhân dân (Điều 65, khoản 1 Điều 11); thời hạn ngắn; hòa giải tiến hành ngay tại phiên tòa sau khi khai mạc (khoản 3 Điều 320)"]},{"t":"9.1.2. Ý nghĩa áp dụng thủ tục rút gọn","cs":"","b":["Giải quyết nhanh những vụ án đơn giản, chứng cứ rõ ràng; tiết kiệm thời gian, chi phí cho đương sự và Tòa án","Giảm tải công việc cho Tòa án, để tập trung nguồn lực vào các vụ án phức tạp","Vẫn bảo đảm quyền kháng cáo, kháng nghị phúc thẩm và cơ chế giám đốc thẩm, tái thẩm (Điều 321)"]},{"t":"9.1.3. Điều kiện áp dụng thủ tục rút gọn (Điều 317)","cs":"","b":["a) Vụ án có tình tiết đơn giản, quan hệ pháp luật rõ ràng, đương sự đã thừa nhận nghĩa vụ; tài liệu, chứng cứ đầy đủ, bảo đảm đủ căn cứ để giải quyết và Tòa án không phải thu thập tài liệu, chứng cứ","b) Các đương sự đều có địa chỉ nơi cư trú, trụ sở rõ ràng","c) Không có đương sự cư trú ở nước ngoài, tài sản tranh chấp ở nước ngoài; ngoại lệ: đương sự ở nước ngoài và đương sự ở Việt Nam thỏa thuận đề nghị giải quyết theo thủ tục rút gọn, hoặc các đương sự đã xuất trình chứng cứ về quyền sở hữu hợp pháp tài sản và thỏa thuận thống nhất việc xử lý tài sản","Phải có đủ cả ba điều kiện trên (khoản 1 Điều 317)","Vụ án lao động đã thụ lý theo thủ tục rút gọn mà người sử dụng lao động có quốc tịch nước ngoài hoặc người đại diện theo pháp luật của họ rời khỏi địa chỉ không thông báo: bị coi là cố tình giấu địa chỉ, Tòa án vẫn giải quyết theo thủ tục rút gọn (khoản 2 Điều 317)","Vụ án bảo vệ quyền lợi người tiêu dùng có giá trị giao dịch dưới 100 triệu đồng: giải quyết theo thủ tục rút gọn, không phải đáp ứng các điều kiện tại khoản 1 Điều 317 (khoản 5 Điều 317; khoản 2 Điều 70 Luật Bảo vệ quyền lợi người tiêu dùng)"]}]},{"t":"9.2. Giải quyết vụ án dân sự theo thủ tục rút gọn tại Tòa án cấp sơ thẩm","cs":"Điều 317–321 BLTTDS","b":[],"c":[{"t":"9.2.1. (thêm) Quyết định đưa vụ án ra xét xử theo thủ tục rút gọn (Điều 318)","cs":"","b":["Trong 01 tháng kể từ ngày thụ lý, Thẩm phán ra quyết định đưa vụ án ra xét xử theo thủ tục rút gọn và mở phiên tòa trong 10 ngày kể từ ngày ra quyết định","Quyết định gửi ngay cho đương sự, Viện kiểm sát cùng cấp; trường hợp Viện kiểm sát tham gia phiên tòa theo khoản 2 Điều 21 thì gửi kèm hồ sơ, Viện kiểm sát nghiên cứu trong 03 ngày làm việc và trả hồ sơ"]},{"t":"9.2.2. (thêm) Khiếu nại, kiến nghị về quyết định đưa vụ án ra xét xử (Điều 319)","cs":"","b":["Trong 03 ngày làm việc kể từ ngày nhận quyết định: đương sự khiếu nại, Viện kiểm sát cùng cấp kiến nghị với Chánh án Tòa án đã ra quyết định","Trong 03 ngày làm việc kể từ ngày nhận khiếu nại, kiến nghị, Chánh án giữ nguyên quyết định hoặc hủy quyết định và chuyển vụ án sang thủ tục thông thường","Quyết định của Chánh án là quyết định cuối cùng, gửi ngay cho đương sự, Viện kiểm sát cùng cấp"]},{"t":"9.2.3. (thêm) Chuyển vụ án sang thủ tục thông thường (khoản 3, 4 Điều 317; khoản 4 Điều 320)","cs":"","b":["Căn cứ chuyển: phát sinh tình tiết mới các đương sự không thống nhất, cần xác minh, thu thập thêm chứng cứ hoặc giám định; cần định giá, thẩm định giá mà các đương sự không thống nhất về giá; cần áp dụng biện pháp khẩn cấp tạm thời; phát sinh người có quyền lợi, nghĩa vụ liên quan; phát sinh yêu cầu phản tố, yêu cầu độc lập; phát sinh đương sự, tài sản ở nước ngoài phải ủy thác tư pháp","Thời hạn chuẩn bị xét xử được tính lại kể từ ngày ra quyết định chuyển sang thủ tục thông thường","Tình tiết mới phát sinh ngay tại phiên tòa: Thẩm phán xem xét, ra quyết định chuyển sang thủ tục thông thường"]},{"t":"9.2.4. (thêm) Phiên tòa sơ thẩm theo thủ tục rút gọn (Điều 320)","cs":"","b":["Đương sự, Kiểm sát viên phải có mặt; Kiểm sát viên vắng mặt thì vẫn xét xử; đương sự có quyền đề nghị xét xử vắng mặt","Bị đơn, người có quyền lợi, nghĩa vụ liên quan đã được triệu tập hợp lệ mà vắng mặt không có lý do chính đáng thì Thẩm phán vẫn tiến hành phiên tòa","Khai mạc theo Điều 239; tiến hành hòa giải (trừ trường hợp không được hòa giải, không tiến hành hòa giải được); thỏa thuận được thì ra quyết định công nhận sự thỏa thuận theo Điều 212; không thỏa thuận được thì xét xử","Trình bày, tranh luận, đối đáp, đề xuất quan điểm theo Mục 3 Chương XIV"]},{"t":"9.2.5. (thêm) Hiệu lực của bản án, quyết định theo thủ tục rút gọn (Điều 321)","cs":"","b":["Bản án, quyết định sơ thẩm có thể bị kháng cáo, kháng nghị để Tòa án cấp phúc thẩm giải quyết theo thủ tục phúc thẩm rút gọn","Bản án, quyết định theo thủ tục rút gọn có thể bị kháng nghị giám đốc thẩm, tái thẩm"]}]},{"t":"9.3. Giải quyết vụ án dân sự theo thủ tục rút gọn tại Tòa án cấp phúc thẩm","cs":"Điều 322–324 BLTTDS; khoản 1 Điều 37 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)","b":[],"c":[{"t":"9.3.1. (thêm) Thời hạn kháng cáo, kháng nghị (Điều 322)","cs":"","b":["Kháng cáo: 07 ngày kể từ ngày tuyên án; đương sự không có mặt tại phiên tòa thì tính từ ngày bản án, quyết định được giao cho họ hoặc được niêm yết","Kháng nghị: Viện kiểm sát cùng cấp 07 ngày, Viện kiểm sát cấp trên trực tiếp 10 ngày, kể từ ngày nhận được bản án, quyết định"]},{"t":"9.3.2. (thêm) Chuẩn bị xét xử phúc thẩm (Điều 323)","cs":"","b":["Trong 01 tháng kể từ ngày thụ lý, Thẩm phán ra một trong các quyết định: tạm đình chỉ xét xử phúc thẩm; đình chỉ xét xử phúc thẩm; đưa vụ án ra xét xử phúc thẩm","Quyết định đưa vụ án ra xét xử gửi ngay kèm hồ sơ cho Viện kiểm sát cùng cấp, nghiên cứu trong 05 ngày làm việc","Xuất hiện tình tiết mới theo khoản 3 Điều 317 thì chuyển sang thủ tục thông thường"]},{"t":"9.3.3. (thêm) Phiên tòa phúc thẩm theo thủ tục rút gọn (Điều 324)","cs":"","b":["Mở phiên tòa trong 15 ngày kể từ ngày có quyết định đưa vụ án ra xét xử phúc thẩm; một Thẩm phán Tòa án nhân dân cấp tỉnh xét xử","Kiểm sát viên vắng mặt vẫn xét xử, trừ trường hợp Viện kiểm sát có kháng nghị; đương sự không kháng cáo đã được triệu tập hợp lệ mà vắng mặt không có lý do chính đáng thì vẫn tiến hành","Thẩm phán có quyền: giữ nguyên; sửa; hủy và chuyển hồ sơ cho Tòa án cấp sơ thẩm giải quyết lại theo thủ tục rút gọn hoặc theo thủ tục thông thường nếu không còn đủ điều kiện; hủy bản án sơ thẩm và đình chỉ giải quyết vụ án; đình chỉ xét xử phúc thẩm và giữ nguyên bản án sơ thẩm","Bản án, quyết định phúc thẩm có hiệu lực pháp luật kể từ ngày ra bản án, quyết định"]},{"t":"9.3.4. (thêm) So sánh thủ tục rút gọn với thủ tục thông thường","cs":"","b":["Thành phần xét xử sơ thẩm: một Thẩm phán – Hội đồng gồm một Thẩm phán và hai Hội thẩm nhân dân (Điều 63, 65)","Chuẩn bị xét xử sơ thẩm: 01 tháng, mở phiên tòa trong 10 ngày – 04 tháng đối với tranh chấp dân sự, hôn nhân và gia đình, mở phiên tòa trong 01 tháng (Điều 203, 318)","Thời hạn kháng cáo bản án: 07 ngày – 15 ngày kể từ ngày tuyên án (Điều 273, 322)","Phúc thẩm: một Thẩm phán, chuẩn bị 01 tháng, mở phiên tòa trong 15 ngày – Hội đồng ba Thẩm phán, chuẩn bị 02 tháng (Điều 64, 286, 323, 324)"]}]}]},{"t":"10. Thủ tục xem xét lại bản án, quyết định đã có hiệu lực pháp luật","cs":"Điều 66, 325–360 BLTTDS; khoản 1 Điều 66, khoản 3 Điều 327, Điều 331, 336, 337, khoản 5, 6 Điều 341, điểm b khoản 2 Điều 348, khoản 1, 2 Điều 354 sửa đổi bởi Luật 85/2025/QH15","b":["Hai trọng tâm: phân biệt giám đốc thẩm (sai lầm, vi phạm trong bản án) với tái thẩm (tình tiết mới); thẩm quyền kháng nghị và thẩm quyền xét xử theo mô hình Tòa án ba cấp từ 01/7/2025.","Điểm cập nhật: giáo trình còn mô tả Tòa án nhân dân cấp cao và Ủy ban Thẩm phán Tòa án nhân dân cấp cao; từ 01/7/2025, Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh xét xử bằng toàn thể Ủy ban, Hội đồng Thẩm phán Tòa án nhân dân tối cao xét xử bằng Hội đồng năm Thẩm phán hoặc toàn thể Hội đồng Thẩm phán."],"c":[{"t":"10.1. Thủ tục giám đốc thẩm","cs":"Điều 66, 325–350 BLTTDS (sửa đổi 2025)","b":[],"c":[{"t":"10.1.1. Khái niệm, ý nghĩa của giám đốc thẩm","cs":"","b":["Giám đốc thẩm là xét lại bản án, quyết định của Tòa án đã có hiệu lực pháp luật nhưng bị kháng nghị giám đốc thẩm khi có căn cứ tại Điều 326 (Điều 325)","Không phải một cấp xét xử: chỉ phát sinh khi có kháng nghị của người có thẩm quyền; đương sự không có quyền kháng cáo mà chỉ có quyền đề nghị xem xét kháng nghị (Điều 327, 328)","Ý nghĩa: khắc phục sai lầm, vi phạm trong bản án, quyết định đã có hiệu lực; bảo đảm áp dụng pháp luật thống nhất; quyết định giám đốc thẩm của Hội đồng Thẩm phán Tòa án nhân dân tối cao phải có lập luận làm rõ quy định còn có cách hiểu khác nhau (khoản 3 Điều 348)"]},{"t":"10.1.2. Kháng nghị theo thủ tục giám đốc thẩm","cs":"","b":["a) Căn cứ (khoản 1 Điều 326): kết luận trong bản án không phù hợp tình tiết khách quan, gây thiệt hại cho đương sự; vi phạm nghiêm trọng thủ tục tố tụng làm đương sự không thực hiện được quyền, nghĩa vụ tố tụng; sai lầm trong áp dụng pháp luật dẫn đến bản án, quyết định không đúng. Điều kiện (khoản 2 Điều 326): có căn cứ và có đơn đề nghị hoặc thông báo, kiến nghị; xâm phạm lợi ích công cộng, lợi ích Nhà nước, quyền, lợi ích của người thứ ba thì không cần đơn","b) Phát hiện bản án cần xem xét lại (Điều 327): đương sự đề nghị bằng văn bản trong 01 năm kể từ ngày bản án, quyết định có hiệu lực; Tòa án, Viện kiểm sát, cơ quan, tổ chức, cá nhân phát hiện vi phạm thì thông báo; Chánh án Tòa án nhân dân khu vực kiến nghị Chánh án Tòa án nhân dân cấp tỉnh hoặc Chánh án Tòa án nhân dân tối cao, Chánh án Tòa án nhân dân cấp tỉnh kiến nghị Chánh án Tòa án nhân dân tối cao (khoản 3 Điều 327 sửa đổi 2025)","c) Người có thẩm quyền kháng nghị (Điều 331 sửa đổi 2025): Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao đối với bản án, quyết định của Tòa án nhân dân cấp tỉnh, của Tòa án khác khi xét thấy cần thiết, trừ quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao; Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh đối với bản án, quyết định của Tòa án nhân dân khu vực trong phạm vi thẩm quyền theo lãnh thổ","d) Thời hạn kháng nghị (Điều 334): 03 năm kể từ ngày bản án, quyết định có hiệu lực; kéo dài thêm 02 năm khi đương sự đã có đơn trong thời hạn và tiếp tục có đơn sau đó, đồng thời bản án có vi phạm xâm phạm nghiêm trọng quyền, lợi ích của đương sự, người thứ ba, lợi ích cộng đồng, Nhà nước","đ) Người có thẩm quyền kháng nghị được yêu cầu hoãn thi hành án; người đã kháng nghị có quyền tạm đình chỉ thi hành bản án đến khi có quyết định giám đốc thẩm (Điều 332); thay đổi, bổ sung kháng nghị khi chưa hết thời hạn, rút kháng nghị trước hoặc tại phiên tòa (Điều 335); Chánh án kháng nghị thì gửi hồ sơ cho Viện kiểm sát cùng cấp nghiên cứu trong 15 ngày (khoản 2 Điều 336 sửa đổi 2025)"]},{"t":"10.1.3. Xét xử giám đốc thẩm","cs":"","b":["a) Thẩm quyền (Điều 337 sửa đổi 2025): Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh giám đốc thẩm bản án, quyết định của Tòa án nhân dân khu vực; Hội đồng Thẩm phán Tòa án nhân dân tối cao giám đốc thẩm bản án, quyết định của Tòa án nhân dân cấp tỉnh bằng Hội đồng năm Thẩm phán, hoặc toàn thể Hội đồng Thẩm phán khi vụ án phức tạp hoặc Hội đồng năm Thẩm phán không thống nhất; bản án về cùng một vụ án thuộc thẩm quyền của cả hai cấp thì Tòa án nhân dân tối cao giám đốc thẩm toàn bộ","b) Thành phần, biểu quyết (Điều 66, 341 sửa đổi 2025): Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh và toàn thể Hội đồng Thẩm phán – có mặt ít nhất hai phần ba, quá nửa tổng số thành viên tán thành; Hội đồng năm Thẩm phán – tất cả thành viên tán thành","c) Phiên tòa (Điều 338–341): bắt buộc có Viện kiểm sát cùng cấp; đương sự chỉ được triệu tập khi cần thiết, vắng mặt vẫn tiến hành; mở phiên tòa trong 04 tháng kể từ ngày nhận kháng nghị kèm hồ sơ; bản thuyết trình gửi thành viên Hội đồng chậm nhất 07 ngày trước phiên tòa","d) Phạm vi (Điều 342): phần bị kháng nghị hoặc có liên quan; được xem xét phần không bị kháng nghị nếu xâm phạm lợi ích công cộng, lợi ích Nhà nước, lợi ích của người thứ ba không phải là đương sự","đ) Thẩm quyền của Hội đồng (Điều 343–347): không chấp nhận kháng nghị, giữ nguyên bản án; hủy và giữ nguyên bản án đúng pháp luật của Tòa án cấp dưới đã bị hủy, sửa; hủy một phần hoặc toàn bộ để xét xử lại sơ thẩm hoặc phúc thẩm; hủy và đình chỉ giải quyết vụ án; sửa một phần hoặc toàn bộ khi chứng cứ đầy đủ, rõ ràng và không ảnh hưởng quyền, nghĩa vụ của người khác","e) Quyết định giám đốc thẩm có hiệu lực kể từ ngày Hội đồng ra quyết định (Điều 349), gửi cho đương sự, Tòa án đã ra bản án, Viện kiểm sát, cơ quan thi hành án trong 05 ngày làm việc (Điều 350)"]}]},{"t":"10.2. Thủ tục tái thẩm","cs":"Điều 351–357 BLTTDS (khoản 1, 2 Điều 354 sửa đổi 2025)","b":[],"c":[{"t":"10.2.1. Khái niệm, ý nghĩa của tái thẩm (Điều 351)","cs":"","b":["Tái thẩm là xét lại bản án, quyết định đã có hiệu lực pháp luật nhưng bị kháng nghị vì có tình tiết mới được phát hiện có thể làm thay đổi cơ bản nội dung của bản án, quyết định mà Tòa án, các đương sự không biết được khi Tòa án ra bản án, quyết định đó","Khác giám đốc thẩm ở chỗ căn cứ nằm ở tình tiết mới phát hiện sau khi bản án có hiệu lực, không phải ở việc đánh giá chứng cứ, áp dụng pháp luật trên hồ sơ đã có","Ý nghĩa: bảo đảm bản án phản ánh đúng sự thật khách quan của vụ án, bảo vệ quyền, lợi ích hợp pháp của đương sự"]},{"t":"10.2.2. Kháng nghị theo thủ tục tái thẩm","cs":"","b":["a) Căn cứ (Điều 352): mới phát hiện tình tiết quan trọng mà đương sự không thể biết trong quá trình giải quyết vụ án; có cơ sở chứng minh kết luận giám định, lời dịch không đúng sự thật hoặc có giả mạo chứng cứ; Thẩm phán, Hội thẩm nhân dân, Kiểm sát viên cố ý làm sai lệch hồ sơ hoặc cố ý kết luận trái pháp luật; bản án, quyết định của Tòa án hoặc quyết định của cơ quan nhà nước làm căn cứ giải quyết vụ án đã bị hủy bỏ","b) Phát hiện tình tiết mới (Điều 353): đương sự, cơ quan, tổ chức, cá nhân có quyền thông báo bằng văn bản; Tòa án, Viện kiểm sát phát hiện thì phải thông báo cho người có thẩm quyền kháng nghị","c) Người có thẩm quyền kháng nghị (Điều 354 sửa đổi 2025): như giám đốc thẩm – Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao; Chánh án Tòa án nhân dân cấp tỉnh, Viện trưởng Viện kiểm sát nhân dân cấp tỉnh; người đã kháng nghị có quyền tạm đình chỉ thi hành bản án","d) Thời hạn (Điều 355): 01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ kháng nghị"]},{"t":"10.2.3. Xét xử tái thẩm","cs":"","b":["Thẩm quyền, thành phần, trình tự phiên tòa, biểu quyết thực hiện như giám đốc thẩm (Điều 66, 357)","Hội đồng tái thẩm có quyền (Điều 356): không chấp nhận kháng nghị, giữ nguyên bản án, quyết định; hủy bản án, quyết định để xét xử sơ thẩm lại; hủy bản án, quyết định và đình chỉ giải quyết vụ án","Hội đồng tái thẩm không có quyền sửa bản án, quyết định và không hủy để xét xử phúc thẩm lại"]},{"t":"10.2.4. (thêm) So sánh giám đốc thẩm với tái thẩm","cs":"vi phạm, sai lầm trong bản án – tình tiết mới được phát hiện","b":["Thời hạn kháng nghị: 03 năm (có thể thêm 02 năm) kể từ ngày bản án có hiệu lực – 01 năm kể từ ngày người có thẩm quyền biết căn cứ","Thẩm quyền của Hội đồng: có quyền sửa, có quyền hủy để xét xử lại sơ thẩm hoặc phúc thẩm – không có quyền sửa, chỉ hủy để xét xử sơ thẩm lại","Giống nhau: đối tượng là bản án, quyết định đã có hiệu lực; chỉ phát sinh khi có kháng nghị; cùng người có thẩm quyền kháng nghị, cùng Tòa án xét xử"]}]},{"t":"10.3. Thủ tục đặc biệt xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao","cs":"Điều 358–360 BLTTDS (tên Ủy ban Pháp luật và Tư pháp của Quốc hội theo Luật 85/2025/QH15)","b":[],"c":[{"t":"10.3.1. Khái niệm, ý nghĩa","cs":"","b":["Thủ tục xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao khi có căn cứ xác định quyết định có vi phạm pháp luật nghiêm trọng hoặc phát hiện tình tiết quan trọng mới có thể làm thay đổi cơ bản nội dung quyết định mà Hội đồng Thẩm phán, đương sự không thể biết được khi ra quyết định đó (khoản 1 Điều 358)","Là cơ chế cuối cùng khắc phục sai lầm của cấp xét xử cao nhất, bảo đảm công lý và quyền, lợi ích hợp pháp của đương sự"]},{"t":"10.3.2. Thủ tục xem xét lại (Điều 358, 359)","cs":"","b":["Chủ thể: Ủy ban Thường vụ Quốc hội yêu cầu; Ủy ban Pháp luật và Tư pháp của Quốc hội kiến nghị; Viện trưởng Viện kiểm sát nhân dân tối cao kiến nghị; Chánh án Tòa án nhân dân tối cao đề nghị","Có yêu cầu của Ủy ban Thường vụ Quốc hội: Chánh án Tòa án nhân dân tối cao báo cáo Hội đồng Thẩm phán để xem xét lại quyết định","Có kiến nghị, đề nghị: trong 01 tháng, Hội đồng Thẩm phán mở phiên họp xem xét kiến nghị, đề nghị (có Viện trưởng Viện kiểm sát nhân dân tối cao tham dự), thảo luận và biểu quyết theo đa số; không nhất trí thì thông báo bằng văn bản, nêu rõ lý do","Trong 04 tháng kể từ ngày nhận yêu cầu của Ủy ban Thường vụ Quốc hội hoặc từ ngày Hội đồng Thẩm phán quyết định mở phiên họp, Hội đồng Thẩm phán họp với sự tham gia của toàn thể Thẩm phán Tòa án nhân dân tối cao để xem xét lại; Viện trưởng Viện kiểm sát nhân dân tối cao phải tham dự và phát biểu quan điểm"]},{"t":"10.3.3. Thẩm quyền xem xét lại (Điều 360)","cs":"","b":["Hủy quyết định của Hội đồng Thẩm phán, hủy bản án, quyết định đã có hiệu lực pháp luật và quyết định về nội dung vụ án","Hủy quyết định của Hội đồng Thẩm phán, hủy bản án, quyết định và xác định trách nhiệm bồi thường thiệt hại hoặc trách nhiệm bồi hoàn","Hủy quyết định của Hội đồng Thẩm phán, hủy bản án, quyết định để giao hồ sơ cho Tòa án cấp dưới giải quyết theo quy định của pháp luật","Quyết định phải được ít nhất ba phần tư tổng số thành viên Hội đồng Thẩm phán Tòa án nhân dân tối cao biểu quyết tán thành (khoản 2 Điều 360)"]}]}]},{"t":"11. Thủ tục giải quyết việc dân sự","cs":"Điều 21, 27, 29, 31, 33, 67, 361–400 BLTTDS (khoản 1 Điều 398 đã được sửa đổi, bổ sung); Điều 22–24, 64–73 Bộ luật Dân sự 2015; Luật Hôn nhân và gia đình 2014; Luật Công chứng 2024","b":["Hai trọng tâm: những điểm khác biệt giữa thủ tục giải quyết việc dân sự (phiên họp, không có tranh chấp) với vụ án dân sự; thời hạn, quyền kháng cáo, kháng nghị quyết định giải quyết việc dân sự và các trường hợp không được kháng cáo.","Điểm cập nhật: Tòa án nhân dân khu vực giải quyết sơ thẩm các việc dân sự; tập thể ba Thẩm phán Tòa án nhân dân cấp tỉnh xét kháng cáo, kháng nghị quyết định giải quyết việc dân sự (Điều 35, 37 sửa đổi 2025; Điều 67)."],"c":[{"t":"11.1. Những quy định chung về thủ tục giải quyết việc dân sự","cs":"Điều 21, 67, 361–375 BLTTDS","b":[],"c":[{"t":"11.1.1. Nguyên tắc giải quyết việc dân sự","cs":"","b":["Việc dân sự là việc không có tranh chấp, có yêu cầu Tòa án công nhận hoặc không công nhận một sự kiện pháp lý làm phát sinh quyền, nghĩa vụ, hoặc công nhận cho mình quyền về dân sự, hôn nhân và gia đình, kinh doanh, thương mại, lao động (Điều 361)","Áp dụng các quy định riêng về thủ tục giải quyết việc dân sự; chỗ không quy định thì áp dụng các quy định khác của BLTTDS (đoạn 2 Điều 361)","Giải quyết bằng phiên họp, không mở phiên tòa; không có nguyên đơn, bị đơn mà có người yêu cầu và người có quyền lợi, nghĩa vụ liên quan","Viện kiểm sát tham gia tất cả các phiên họp sơ thẩm đối với việc dân sự và phiên họp phúc thẩm (khoản 2, 3 Điều 21)"]},{"t":"11.1.2. Thành phần giải quyết việc dân sự (Điều 67, 368)","cs":"","b":["Một Thẩm phán giải quyết, trừ các trường hợp do tập thể ba Thẩm phán giải quyết","Tập thể ba Thẩm phán: yêu cầu công nhận, cho thi hành hoặc không công nhận bản án, quyết định của Tòa án nước ngoài, phán quyết của Trọng tài nước ngoài; yêu cầu xét tính hợp pháp của cuộc đình công (khoản 5 Điều 27, khoản 9 Điều 29, khoản 4, 5 Điều 31, các khoản 2, 3, 4 Điều 33); việc xét kháng cáo, kháng nghị quyết định giải quyết việc dân sự","Yêu cầu liên quan đến Trọng tài thương mại Việt Nam (khoản 2 Điều 31): thành phần theo pháp luật về trọng tài thương mại","Thay đổi Thẩm phán, Thư ký phiên họp (Điều 368): trước phiên họp do Chánh án quyết định; tại phiên họp, việc do một Thẩm phán giải quyết thì Chánh án quyết định, do tập thể ba Thẩm phán giải quyết thì Hội đồng quyết định"]},{"t":"11.1.3. Người tham gia phiên họp giải quyết việc dân sự (Điều 367)","cs":"","b":["Kiểm sát viên Viện kiểm sát cùng cấp phải tham gia; vắng mặt thì Tòa án vẫn tiến hành phiên họp","Người yêu cầu phải tham gia theo giấy triệu tập; vắng mặt lần thứ nhất thì hoãn phiên họp, trừ khi đề nghị giải quyết vắng mặt; được triệu tập hợp lệ lần thứ hai mà vẫn vắng mặt thì coi như từ bỏ yêu cầu, Tòa án đình chỉ giải quyết việc dân sự nhưng quyền yêu cầu lại vẫn được bảo đảm","Người có quyền lợi, nghĩa vụ liên quan, người làm chứng, người giám định, người phiên dịch vắng mặt thì Tòa án quyết định hoãn hoặc vẫn tiến hành phiên họp"]},{"t":"11.1.4. Thủ tục giải quyết việc dân sự (Điều 362–369)","cs":"","b":["Đơn yêu cầu gửi Tòa án có thẩm quyền, kèm tài liệu, chứng cứ (Điều 362); Chánh án phân công Thẩm phán trong 03 ngày làm việc; sửa đổi, bổ sung đơn trong 07 ngày; nộp lệ phí trong 05 ngày làm việc kể từ ngày nhận thông báo (Điều 363)","Trả lại đơn yêu cầu (Điều 364): người yêu cầu không có quyền yêu cầu hoặc không đủ năng lực hành vi tố tụng; sự việc đã được giải quyết; không thuộc thẩm quyền Tòa án; không sửa đổi, bổ sung đơn; không nộp lệ phí; rút đơn","Thông báo thụ lý trong 03 ngày làm việc (Điều 365); chuẩn bị xét đơn 01 tháng, kéo dài không quá 01 tháng khi chờ kết quả giám định, định giá; Viện kiểm sát nghiên cứu hồ sơ 07 ngày; mở phiên họp trong 15 ngày kể từ ngày ra quyết định mở phiên họp (Điều 366)","Trình tự phiên họp (Điều 369): người yêu cầu trình bày; người có quyền lợi, nghĩa vụ liên quan trình bày; người làm chứng, người giám định trình bày; xem xét tài liệu, chứng cứ; Kiểm sát viên phát biểu; Thẩm phán quyết định chấp nhận hoặc không chấp nhận yêu cầu"]},{"t":"11.1.5. Quyết định giải quyết việc dân sự (Điều 370)","cs":"","b":["Nội dung gồm nhận định, căn cứ chấp nhận hoặc không chấp nhận đơn yêu cầu, căn cứ pháp luật, quyết định và lệ phí phải nộp","Gửi cho Viện kiểm sát cùng cấp, người yêu cầu, người có quyền lợi, nghĩa vụ liên quan trong 05 ngày làm việc kể từ ngày ra quyết định","Quyết định có hiệu lực liên quan đến thay đổi hộ tịch phải gửi cho Ủy ban nhân dân nơi đã đăng ký hộ tịch; quyết định có hiệu lực được công bố trên Cổng thông tin điện tử của Tòa án (trừ thông tin phải giữ bí mật)"]},{"t":"11.1.6. Thủ tục phúc thẩm quyết định giải quyết việc dân sự (Điều 371–375)","cs":"","b":["Kháng cáo: người yêu cầu, người có quyền lợi, nghĩa vụ liên quan; kháng nghị: Viện kiểm sát cùng cấp, cấp trên trực tiếp; không được kháng cáo, kháng nghị quyết định công nhận kết quả hòa giải thành ngoài Tòa án, công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn, công nhận thỏa thuận thay đổi người trực tiếp nuôi con sau khi ly hôn (Điều 371)","Thời hạn (Điều 372): kháng cáo 10 ngày kể từ ngày Tòa án ra quyết định (vắng mặt thì tính từ ngày nhận, được thông báo, niêm yết); kháng nghị: Viện kiểm sát cùng cấp 10 ngày, cấp trên trực tiếp 15 ngày kể từ ngày Tòa án ra quyết định","Chuẩn bị xét kháng cáo, kháng nghị 15 ngày kể từ ngày nhận (kéo dài không quá 15 ngày); Viện kiểm sát nghiên cứu hồ sơ 07 ngày; mở phiên họp phúc thẩm trong 15 ngày (Điều 373); Kiểm sát viên vắng mặt vẫn tiến hành, trừ trường hợp Viện kiểm sát kháng nghị (Điều 374)","Hội đồng phúc thẩm (khoản 3 Điều 375): giữ nguyên; sửa; hủy và chuyển hồ sơ cho Tòa án cấp sơ thẩm giải quyết lại; hủy và đình chỉ giải quyết việc dân sự; đình chỉ việc xét đơn yêu cầu theo thủ tục phúc thẩm khi tất cả người kháng cáo rút đơn, Viện kiểm sát rút kháng nghị","Quyết định phúc thẩm có hiệu lực pháp luật kể từ ngày ra quyết định (khoản 4 Điều 375)"]}]},{"t":"11.2. Thủ tục giải quyết một số việc dân sự","cs":"Điều 29, 376–400 BLTTDS; Bộ luật Dân sự 2015","b":[],"c":[{"t":"11.2.1. Thủ tục xác định năng lực hành vi dân sự của cá nhân (Điều 376–380)","cs":"","b":["Người có quyền, lợi ích liên quan, cơ quan, tổ chức hữu quan yêu cầu tuyên bố một người mất năng lực hành vi dân sự, bị hạn chế năng lực hành vi dân sự hoặc có khó khăn trong nhận thức, làm chủ hành vi; người thành niên có quyền tự yêu cầu tuyên bố mình có khó khăn trong nhận thức, làm chủ hành vi (Điều 376)","Theo đề nghị của người yêu cầu, Tòa án có thể trưng cầu giám định pháp y tâm thần (mất năng lực hành vi, khó khăn trong nhận thức) hoặc giám định sức khỏe, bệnh tật (hạn chế năng lực hành vi) (Điều 377)","Quyết định tuyên bố hạn chế năng lực hành vi dân sự phải xác định người đại diện theo pháp luật và phạm vi đại diện; quyết định tuyên bố có khó khăn trong nhận thức, làm chủ hành vi phải chỉ định người giám hộ, xác định quyền, nghĩa vụ của người giám hộ (Điều 378)","Hủy bỏ quyết định khi người đó không còn ở tình trạng đã bị tuyên bố, theo yêu cầu của chính người đó, người có quyền, lợi ích liên quan, cơ quan, tổ chức hữu quan (Điều 379, 380)"]},{"t":"11.2.2. Thủ tục giải quyết yêu cầu thông báo tìm kiếm người vắng mặt, tuyên bố một người mất tích hoặc đã chết (Điều 381–395)","cs":"","b":["Thông báo tìm kiếm người vắng mặt tại nơi cư trú: người đó biệt tích 06 tháng liền trở lên, có thể kèm yêu cầu áp dụng biện pháp quản lý tài sản; trong 01 tháng kể từ ngày ra quyết định, thông báo được đăng trên báo hằng ngày của trung ương ba số liên tiếp, Cổng thông tin điện tử của Tòa án và phát sóng ba lần trong 03 ngày liên tiếp; quyết định đương nhiên hết hiệu lực khi người đó trở về (Điều 381–386)","Tuyên bố mất tích: chứng minh người đó biệt tích 02 năm liền trở lên, không có tin tức xác thực còn sống hay đã chết và đã áp dụng đầy đủ biện pháp thông báo tìm kiếm; trong 20 ngày kể từ ngày thụ lý ra quyết định thông báo tìm kiếm; thời hạn thông báo 04 tháng kể từ ngày đăng, phát lần đầu; mở phiên họp trong 10 ngày kể từ ngày kết thúc thời hạn thông báo (Điều 387–389)","Tuyên bố đã chết: theo các trường hợp tại Điều 71 Bộ luật Dân sự; thủ tục thông báo như tuyên bố mất tích; quyết định phải xác định ngày chết và hậu quả pháp lý (Điều 391–393)","Hủy bỏ quyết định tuyên bố mất tích, đã chết khi người đó trở về hoặc có tin tức xác thực còn sống; Tòa án quyết định hậu quả pháp lý của việc hủy bỏ theo Bộ luật Dân sự (Điều 390, 394, 395)"]},{"t":"11.2.3. Thủ tục giải quyết các yêu cầu về hôn nhân và gia đình (Điều 29, 396, 397)","cs":"","b":["Yêu cầu công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn: vợ, chồng cùng ký tên hoặc điểm chỉ vào đơn và cùng là người yêu cầu (Điều 396)","Thẩm phán phải hòa giải để vợ chồng đoàn tụ; trước đó có thể tham khảo ý kiến cơ quan quản lý nhà nước về gia đình, về trẻ em; vợ chồng đoàn tụ thì đình chỉ giải quyết yêu cầu (khoản 1–3 Điều 397)","Hòa giải đoàn tụ không thành: công nhận thuận tình ly hôn và sự thỏa thuận khi hai bên thực sự tự nguyện ly hôn, đã thỏa thuận về tài sản và con, thỏa thuận bảo đảm quyền lợi chính đáng của vợ, con (khoản 4 Điều 397)","Không thỏa thuận được về tài sản hoặc con: đình chỉ việc dân sự và thụ lý vụ án để giải quyết theo thủ tục chung; không phải thông báo thụ lý, không phải phân công lại Thẩm phán (khoản 5 Điều 397)","Các yêu cầu khác về hôn nhân và gia đình (hủy kết hôn trái pháp luật, chấm dứt việc nuôi con nuôi, xác định cha, mẹ, con…) giải quyết theo quy định chung về thủ tục giải quyết việc dân sự (Điều 29, 361)"]},{"t":"11.2.4. Thủ tục giải quyết yêu cầu tuyên bố văn bản công chứng vô hiệu (Điều 398–400)","cs":"","b":["Người có quyền yêu cầu: Công chứng viên đã thực hiện việc công chứng, người yêu cầu công chứng, người làm chứng, người phiên dịch, người có quyền lợi, nghĩa vụ liên quan, cơ quan nhà nước có thẩm quyền, khi có căn cứ cho rằng việc công chứng vi phạm pháp luật về công chứng (khoản 1 Điều 398)","Chuẩn bị xét đơn 01 tháng kể từ ngày thụ lý; thông báo ngay cho tổ chức hành nghề công chứng, Công chứng viên, người yêu cầu công chứng, người có quyền, lợi ích liên quan, cơ quan nhà nước có thẩm quyền, Viện kiểm sát cùng cấp; mở phiên họp trong 15 ngày kể từ ngày ra quyết định mở phiên họp (Điều 399)","Chấp nhận yêu cầu thì tuyên bố văn bản công chứng vô hiệu và quyết định hậu quả pháp lý (Điều 400)","Có tranh chấp về giao dịch đã được công chứng thì giải quyết theo thủ tục vụ án dân sự"]}]}]}],"upd":{"t":"Điểm cập nhật so với giáo trình","cs":"Hệ thống văn bản tại ngày 27/10/2026: BLTTDS 2015 (VBHN 21/VBHN-VPQH ngày 12/02/2026), Luật 85/2025/QH15, Nghị quyết 81/2025/UBTVQH15 và mô hình Tòa án ba cấp từ 01/7/2025","b":["Giáo trình (bản 2019, 2022) viết theo mô hình TAND cấp huyện; từ 01/7/2025 thay bằng TAND khu vực","TAND khu vực sơ thẩm cả vụ việc có yếu tố nước ngoài và yêu cầu hủy quyết định cá biệt; TAND cấp tỉnh không còn xét xử sơ thẩm vụ án dân sự thông thường","Thẩm quyền sở hữu trí tuệ tập trung tại TAND khu vực 2 – Hà Nội và TAND khu vực 1 – TP.HCM","Yêu cầu hủy, đăng ký phán quyết trọng tài vụ việc chỉ do TAND Hà Nội, Đà Nẵng, TP.HCM giải quyết","Tranh chấp thẩm quyền: Chánh án TAND cấp tỉnh (trong tỉnh) và Chánh án TANDTC (khác tỉnh) theo Điều 41 sửa đổi","Ủy ban Thẩm phán TAND cấp tỉnh giám đốc thẩm, tái thẩm bản án của TAND khu vực; Hội đồng Thẩm phán TANDTC giám đốc thẩm bản án của TAND cấp tỉnh","Viện kiểm sát thí điểm khởi kiện vụ án dân sự công ích từ 01/01/2026 (Nghị quyết 205/2025/QH15)","Thủ tục tố tụng trên môi trường số theo Nghị quyết 01/2026/NQ-HĐTP","Thay đổi người tiến hành tố tụng: Chánh án TAND cấp tỉnh quyết định khi Thẩm phán là Chánh án TAND khu vực; Chánh án TANDTC khi là Chánh án TAND cấp tỉnh (Điều 56 sửa đổi); ngoại lệ khoản 3 Điều 53 áp dụng cho Ủy ban Thẩm phán TAND cấp tỉnh","Biện pháp khẩn cấp tạm thời: yêu cầu trong tình thế khẩn cấp phải nộp đồng thời với đơn khởi kiện (khoản 2 Điều 111); BLTTDS 2015 không còn cho yêu cầu trước khi khởi kiện như BLTTDS 2004","Điều 135 sửa đổi bởi Luật Phòng, chống bạo lực gia đình 2022: Tòa án tự mình áp dụng biện pháp tại khoản 1–5 và khoản 14 (cấm tiếp xúc) Điều 114","Viện kiểm sát khởi kiện vụ án dân sự công ích được miễn thực hiện biện pháp bảo đảm khi yêu cầu áp dụng biện pháp khẩn cấp tạm thời (Nghị quyết 205/2025/QH15)","Khiếu nại việc trả lại đơn khởi kiện: Chánh án Tòa án trên một cấp trực tiếp giải quyết trong 10 ngày, quyết định là quyết định cuối cùng; bãi bỏ khoản 7 Điều 194 (Luật 85/2025/QH15)","Viện kiểm sát khởi kiện vụ án dân sự công ích: vụ án bảo vệ lợi ích công không được hòa giải, bị đơn không được phản tố; Viện kiểm sát không phải nộp tạm ứng án phí, không phải chịu án phí (Nghị quyết 205/2025/QH15)","Phúc thẩm: Tòa án nhân dân cấp tỉnh xét xử phúc thẩm bản án, quyết định sơ thẩm của Tòa án nhân dân khu vực; không còn Tòa án nhân dân cấp cao","Tòa án cấp phúc thẩm gửi bản án, quyết định phúc thẩm trong 15 ngày kể từ ngày ra bản án, quyết định (khoản 1 Điều 315 sửa đổi 2025)","Thẩm quyền kháng nghị giám đốc thẩm, tái thẩm: Chánh án TANDTC, Viện trưởng VKSNDTC (bản án của TAND cấp tỉnh); Chánh án TAND cấp tỉnh, Viện trưởng VKSND cấp tỉnh (bản án của TAND khu vực) – Điều 331, 354 sửa đổi","Ủy ban Thẩm phán TAND cấp tỉnh xét xử giám đốc thẩm, tái thẩm bằng toàn thể Ủy ban (ít nhất hai phần ba có mặt, quá nửa tán thành); Hội đồng năm Thẩm phán TANDTC phải được tất cả thành viên tán thành (Điều 66, 341 sửa đổi)","Ủy ban Pháp luật và Tư pháp của Quốc hội thay Ủy ban Tư pháp trong thủ tục đặc biệt xem xét lại quyết định của Hội đồng Thẩm phán TANDTC (Điều 358, 359)","Vụ án bảo vệ quyền lợi người tiêu dùng có giá trị giao dịch dưới 100 triệu đồng giải quyết theo thủ tục rút gọn mà không phải đáp ứng điều kiện khoản 1 Điều 317 (khoản 5 Điều 317; Luật Bảo vệ quyền lợi người tiêu dùng 2023)","Người làm chứng, người phiên dịch, cơ quan nhà nước có thẩm quyền cũng có quyền yêu cầu tuyên bố văn bản công chứng vô hiệu (khoản 1 Điều 398 sửa đổi)"]}}}</script>
