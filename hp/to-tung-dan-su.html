BLTTDS: Kiểm sát viên được phân công tham gia phiên họp sơ thẩm; trường hợp Kiểm sát viên vắng mặt thì Tòa án vẫn tiến hành phiên họp. Nguyên tắc này giống phiên tòa sơ thẩm vụ án dân sự.","b":"Khoản 1 Điều 367 BLTTDS"},{"id":"11.08","g":11,"lv":"TH","q":"Thời hạn kháng cáo quyết định giải quyết việc dân sự của người yêu cầu có mặt tại phiên họp là:","o":["10 ngày kể từ ngày Tòa án ra quyết định","15 ngày kể từ ngày Tòa án ra quyết định","01 tháng kể từ ngày Tòa án ra quyết định","07 ngày kể từ ngày nhận được quyết định"],"a":0,"e":"Khoản 1 Điều 372 BLTTDS: người yêu cầu giải quyết việc dân sự, người có quyền lợi, nghĩa vụ liên quan có quyền kháng cáo quyết định trong thời hạn 10 ngày kể từ ngày Tòa án ra quyết định; trường hợp không có mặt tại phiên họp thì tính từ ngày nhận được hoặc ngày niêm yết quyết định.","b":"Khoản 1 Điều 372 BLTTDS"},{"id":"11.09","g":11,"lv":"TH","q":"Viện kiểm sát cấp trên trực tiếp có quyền kháng nghị quyết định giải quyết việc dân sự trong thời hạn:","o":["07 ngày kể từ ngày nhận được quyết định","15 ngày kể từ ngày Tòa án ra quyết định","01 tháng kể từ ngày Tòa án ra quyết định","10 ngày kể từ ngày Tòa án ra quyết định"],"a":1,"e":"Khoản 2 Điều 372 BLTTDS: Viện kiểm sát cùng cấp có quyền kháng nghị trong thời hạn 10 ngày, Viện kiểm sát cấp trên trực tiếp trong thời hạn 15 ngày, kể từ ngày Tòa án ra quyết định.","b":"Khoản 2 Điều 372 BLTTDS"},{"id":"11.10","g":11,"lv":"TH","q":"Quyết định nào sau đây KHÔNG bị kháng cáo, kháng nghị theo thủ tục phúc thẩm?","o":["Quyết định tuyên bố văn bản công chứng vô hiệu","Quyết định tuyên bố một người mất tích","Quyết định công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn","Quyết định tuyên bố một người bị hạn chế năng lực hành vi dân sự"],"a":2,"e":"Điều 371 BLTTDS: quyết định công nhận thuận tình ly hôn, thỏa thuận về nuôi con, chia tài sản khi ly hôn (khoản 2 Điều 29) không bị kháng cáo, kháng nghị theo thủ tục phúc thẩm; chỉ có thể bị kháng nghị giám đốc thẩm, tái thẩm. Các quyết định tuyên bố mất tích, hạn chế năng lực hành vi, văn bản công chứng vô hiệu vẫn có thể bị kháng cáo.","b":"Điều 371; khoản 2 Điều 29 BLTTDS"},{"id":"11.11","g":11,"lv":"TH","q":"Trong quyết định tuyên bố một người có khó khăn trong nhận thức, làm chủ hành vi, Tòa án phải:","o":["Xác định người đại diện theo pháp luật và phạm vi đại diện","Chỉ định người giám hộ, xác định quyền, nghĩa vụ của người giám hộ","Xác định ngày người đó mất năng lực hành vi dân sự","Áp dụng biện pháp quản lý tài sản của người đó"],"a":1,"e":"Điều 378 BLTTDS: trong quyết định tuyên bố một người có khó khăn trong nhận thức, làm chủ hành vi, Tòa án phải chỉ định người giám hộ và xác định quyền, nghĩa vụ của người giám hộ (phù hợp Điều 23 BLDS). Xác định người đại diện theo pháp luật là nội dung của quyết định tuyên bố hạn chế năng lực hành vi dân sự.","b":"Điều 378 BLTTDS"},{"id":"11.12","g":11,"lv":"TH","q":"Người có quyền, lợi ích liên quan có quyền yêu cầu Tòa án thông báo tìm kiếm người vắng mặt tại nơi cư trú khi người đó biệt tích:","o":["01 năm liền trở lên","02 năm liền trở lên","06 tháng liền trở lên","03 tháng liền trở lên"],"a":2,"e":"Điều 381 BLTTDS và Điều 65 BLDS: khi một người biệt tích 06 tháng liền trở lên thì người có quyền, lợi ích liên quan có quyền yêu cầu Tòa án thông báo tìm kiếm người vắng mặt tại nơi cư trú và yêu cầu áp dụng biện pháp quản lý tài sản. Mốc 02 năm là điều kiện tuyên bố mất tích.","b":"Khoản 1 Điều 381 BLTTDS"},{"id":"11.13","g":11,"lv":"TH","q":"Thời hạn thông báo tìm kiếm người bị yêu cầu tuyên bố mất tích là:","o":["06 tháng kể từ ngày thụ lý đơn yêu cầu","01 tháng kể từ ngày đăng, phát thông báo lần cuối","04 tháng kể từ ngày đăng, phát thông báo lần đầu tiên","02 tháng kể từ ngày ra quyết định thông báo tìm kiếm"],"a":2,"e":"Khoản 2 Điều 388 BLTTDS: thời hạn thông báo tìm kiếm người bị yêu cầu tuyên bố mất tích là 04 tháng kể từ ngày đăng, phát thông báo lần đầu tiên.","b":"Khoản 2 Điều 388 BLTTDS"},{"id":"11.14","g":11,"lv":"TH","q":"Chủ thể nào sau đây có quyền yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu?","o":["Công chứng viên đã thực hiện việc công chứng đó","Chỉ Viện kiểm sát nhân dân cùng cấp","Bất kỳ cá nhân nào biết về việc công chứng","Chỉ Sở Tư pháp nơi tổ chức hành nghề công chứng đặt trụ sở"],"a":0,"e":"Khoản 1 Điều 398 BLTTDS: công chứng viên đã thực hiện việc công chứng, người yêu cầu công chứng, người làm chứng, người có quyền, lợi ích liên quan, cơ quan nhà nước có thẩm quyền có quyền yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu khi cho rằng việc công chứng vi phạm pháp luật. Không giới hạn ở Viện kiểm sát hay Sở Tư pháp, cũng không phải bất kỳ ai.","b":"Khoản 1 Điều 398 BLTTDS"},{"id":"TH9.01.1","g":9,"lv":"VD","q":"Thời hạn tối đa để Thẩm phán ra quyết định đưa vụ án ra xét xử theo thủ tục rút gọn là bao lâu?","o":["04 tháng kể từ ngày thụ lý vụ án","10 ngày kể từ ngày thụ lý vụ án","01 tháng kể từ ngày thụ lý vụ án","02 tháng kể từ ngày thụ lý vụ án"],"a":2,"e":"Khoản 1 Điều 318 BLTTDS: trong thời hạn 01 tháng kể từ ngày thụ lý vụ án theo thủ tục rút gọn, Thẩm phán phải ra quyết định đưa vụ án ra xét xử. Vụ án của bà Thu thỏa mãn điều kiện rút gọn: tình tiết đơn giản, bị đơn thừa nhận nghĩa vụ, chứng cứ đầy đủ, các bên có địa chỉ rõ ràng (khoản 1 Điều 317).","b":"Khoản 1 Điều 318 BLTTDS","cid":"TH9.01"},{"id":"TH9.01.2","g":9,"lv":"VD","q":"Trong giai đoạn chuẩn bị xét xử, ông Bình có yêu cầu phản tố đòi bà Thu trả 30.000.000 đồng tiền hàng. Tòa án xử lý thế nào?","o":["Giải quyết cả yêu cầu phản tố theo thủ tục rút gọn","Tạm đình chỉ giải quyết vụ án để ông Bình khởi kiện vụ án khác","Không thụ lý yêu cầu phản tố vì vụ án đang giải quyết theo thủ tục rút gọn","Ra quyết định chuyển vụ án sang giải quyết theo thủ tục thông thường"],"a":3,"e":"Khoản 3 Điều 317 BLTTDS: trong quá trình giải quyết theo thủ tục rút gọn mà phát sinh yêu cầu phản tố của bị đơn thì Tòa án ra quyết định chuyển vụ án sang giải quyết theo thủ tục thông thường. Tòa án không từ chối thụ lý phản tố và không giải quyết phản tố theo thủ tục rút gọn.","b":"Điểm đ khoản 3 Điều 317 BLTTDS","cid":"TH9.01"},{"id":"TH9.01.3","g":9,"lv":"VD","q":"Giả sử không có phản tố, vụ án được xét xử theo thủ tục rút gọn và ông Bình kháng cáo đúng hạn. Ai xét xử phúc thẩm?","o":["Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Hội đồng gồm ba Thẩm phán của Tòa án nhân dân cấp tỉnh","Một Thẩm phán của Tòa án nhân dân khu vực khác trong tỉnh","Một Thẩm phán của Tòa án nhân dân cấp tỉnh"],"a":3,"e":"Điều 65 BLTTDS: xét xử phúc thẩm theo thủ tục rút gọn do một Thẩm phán tiến hành. Theo Điều 37, 38 BLTTDS (sửa đổi bởi Luật 85/2025/QH15), cấp phúc thẩm của TAND khu vực là TAND cấp tỉnh; vì vậy một Thẩm phán của TAND cấp tỉnh xét xử phúc thẩm.","b":"Điều 65; khoản 1 Điều 37 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)","cid":"TH9.01"},{"id":"TH9.02.1","g":9,"lv":"VD","q":"Vụ án có được giải quyết theo thủ tục rút gọn không?","o":["Có, nếu Viện kiểm sát cùng cấp đồng ý bằng văn bản","Có, vì là vụ án bảo vệ quyền lợi người tiêu dùng có giá trị giao dịch dưới 100 triệu đồng","Không, vì vụ án bảo vệ quyền lợi người tiêu dùng chỉ giải quyết theo thủ tục thông thường","Không, vì công ty chưa thừa nhận nghĩa vụ"],"a":1,"e":"Luật Bảo vệ quyền lợi người tiêu dùng 2023 cho phép giải quyết theo thủ tục rút gọn vụ án bảo vệ quyền lợi người tiêu dùng do cá nhân người tiêu dùng khởi kiện, có giá trị giao dịch dưới 100 triệu đồng, kể cả khi không đáp ứng điều kiện bị đơn thừa nhận nghĩa vụ của BLTTDS. Giao dịch 18 triệu đồng nên có thể giải quyết theo thủ tục rút gọn; không cần Viện kiểm sát đồng ý.","b":"Khoản 5 Điều 317 BLTTDS; khoản 2 Điều 70 Luật Bảo vệ quyền lợi người tiêu dùng","cid":"TH9.02"},{"id":"TH9.02.2","g":9,"lv":"VD","q":"Thẩm phán ra quyết định đưa vụ án ra xét xử theo thủ tục rút gọn; công ty khiếu nại quyết định này. Ai giải quyết khiếu nại?","o":["Chánh án Tòa án nhân dân cấp tỉnh","Viện trưởng Viện kiểm sát cùng cấp","Chánh án Tòa án đã ra quyết định","Thẩm phán được phân công giải quyết vụ án"],"a":2,"e":"Khoản 1, 2 Điều 319 BLTTDS: đương sự có quyền khiếu nại quyết định đưa vụ án ra xét xử theo thủ tục rút gọn với Chánh án Tòa án đã ra quyết định, trong thời hạn 03 ngày làm việc; Chánh án giải quyết trong 03 ngày làm việc và quyết định đó là quyết định cuối cùng.","b":"Khoản 1, 2 Điều 319 BLTTDS","cid":"TH9.02"},{"id":"TH9.02.3","g":9,"lv":"VD","q":"Tại phiên tòa, người đại diện của công ty đã được triệu tập hợp lệ nhưng vắng mặt không có lý do chính đáng. Thẩm phán xử lý thế nào?","o":["Hoãn phiên tòa và triệu tập lại lần thứ hai","Đình chỉ giải quyết vụ án","Vẫn tiến hành phiên tòa","Chuyển vụ án sang thủ tục thông thường"],"a":2,"e":"Điều 320 BLTTDS: phiên tòa rút gọn có sự tham gia của đương sự; đương sự đã được triệu tập hợp lệ mà vắng mặt không có lý do chính đáng thì Thẩm phán vẫn tiến hành xét xử. Vắng mặt của bị đơn không phải căn cứ chuyển sang thủ tục thông thường.","b":"Khoản 1 Điều 320 BLTTDS","cid":"TH9.02"},{"id":"TH10.01.1","g":10,"lv":"VD","q":"Bà Mai muốn bản án được xem xét lại. Bà có quyền gì?","o":["Gửi đơn đề nghị người có thẩm quyền xem xét kháng nghị giám đốc thẩm trong 01 năm kể từ ngày bản án có hiệu lực","Đề nghị Tòa án nhân dân tỉnh H tự hủy bản án phúc thẩm","Khởi kiện lại vụ án tại Tòa án nhân dân khu vực","Kháng cáo bản án phúc thẩm lên Tòa án nhân dân tối cao trong 15 ngày"],"a":0,"e":"Khoản 1 Điều 327 và Điều 328 BLTTDS: trong thời hạn 01 năm kể từ ngày bản án có hiệu lực pháp luật, đương sự có quyền gửi đơn đề nghị người có thẩm quyền xem xét kháng nghị giám đốc thẩm. Bản án phúc thẩm đã có hiệu lực ngay nên không thể kháng cáo hay khởi kiện lại cùng sự việc. Bà Mai có căn cứ: yêu cầu đòi lại tài sản thuộc sở hữu không áp dụng thời hiệu (khoản 2 Điều 155 BLDS).","b":"Khoản 1 Điều 327; Điều 328 BLTTDS","cid":"TH10.01"},{"id":"TH10.01.2","g":10,"lv":"VD","q":"Ai có thẩm quyền kháng nghị giám đốc thẩm bản án phúc thẩm của Tòa án nhân dân tỉnh H?","o":["Chánh án Tòa án nhân dân khu vực đã xét xử sơ thẩm","Chánh án Tòa án nhân dân tỉnh H, Viện trưởng Viện kiểm sát nhân dân tỉnh H","Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao","Ủy ban Thẩm phán Tòa án nhân dân tỉnh H"],"a":2,"e":"Khoản 1 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): Chánh án TAND tối cao, Viện trưởng VKSND tối cao có quyền kháng nghị giám đốc thẩm bản án, quyết định đã có hiệu lực của TAND cấp tỉnh. Chánh án TAND cấp tỉnh chỉ kháng nghị bản án của TAND khu vực.","b":"Khoản 1 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)","cid":"TH10.01"},{"id":"TH10.01.3","g":10,"lv":"VD","q":"Bản án bị kháng nghị. Chủ thể nào xét xử giám đốc thẩm?","o":["Hội đồng gồm ba Thẩm phán Tòa án nhân dân tỉnh H","Ủy ban Thẩm phán Tòa án nhân dân tỉnh H","Ủy ban Thẩm phán Tòa án nhân dân cấp cao","Hội đồng Thẩm phán Tòa án nhân dân tối cao, bằng Hội đồng năm Thẩm phán hoặc toàn thể Hội đồng Thẩm phán nếu vụ án phức tạp"],"a":3,"e":"Khoản 2 Điều 337 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): Hội đồng Thẩm phán TAND tối cao giám đốc thẩm bản án, quyết định đã có hiệu lực của TAND cấp tỉnh bị kháng nghị, bằng Hội đồng xét xử năm Thẩm phán hoặc toàn thể Hội đồng Thẩm phán đối với vụ án có tính chất phức tạp.","b":"Khoản 2 Điều 337 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)","cid":"TH10.01"},{"id":"TH10.02.1","g":10,"lv":"VD","q":"Bản án có thể được xem xét lại theo thủ tục nào?","o":["Tái thẩm","Thủ tục đặc biệt xem xét lại quyết định của Hội đồng Thẩm phán Tòa án nhân dân tối cao","Phúc thẩm","Giám đốc thẩm vì Tòa án đánh giá sai chứng cứ"],"a":0,"e":"Khoản 2 Điều 352 BLTTDS: có cơ sở chứng minh kết luận của người giám định, lời dịch của người phiên dịch không đúng sự thật hoặc có giả mạo chứng cứ là căn cứ kháng nghị tái thẩm. Giấy vay tiền giả mạo là tình tiết mới mà Tòa án không biết khi xét xử, nên thủ tục phù hợp là tái thẩm, không phải giám đốc thẩm.","b":"Khoản 2 Điều 352 BLTTDS","cid":"TH10.02"},{"id":"TH10.02.2","g":10,"lv":"VD","q":"Thời hạn kháng nghị trong trường hợp này được tính như thế nào?","o":["03 năm kể từ ngày bản án có hiệu lực pháp luật","01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ kháng nghị","01 năm kể từ ngày bản án có hiệu lực pháp luật","15 ngày kể từ ngày có kết luận giám định"],"a":1,"e":"Điều 355 BLTTDS: thời hạn kháng nghị tái thẩm là 01 năm kể từ ngày người có thẩm quyền kháng nghị biết được căn cứ để kháng nghị. Không tính từ ngày bản án có hiệu lực như giám đốc thẩm.","b":"Điều 355 BLTTDS","cid":"TH10.02"},{"id":"TH10.02.3","g":10,"lv":"VD","q":"Nếu chấp nhận kháng nghị, Hội đồng xét xử tái thẩm có thể quyết định thế nào?","o":["Hủy bản án để xét xử sơ thẩm lại","Sửa bản án, bác yêu cầu của ông Sơn","Hủy bản án và giao hồ sơ cho Tòa án nhân dân cấp tỉnh xét xử phúc thẩm","Giữ nguyên bản án và chuyển hồ sơ cho cơ quan điều tra"],"a":0,"e":"Khoản 2 Điều 356 BLTTDS: Hội đồng xét xử tái thẩm có quyền hủy bản án, quyết định đã có hiệu lực pháp luật để xét xử sơ thẩm lại. Hội đồng tái thẩm không có quyền sửa bản án và không giao hồ sơ xét xử phúc thẩm.","b":"Khoản 2 Điều 356 BLTTDS","cid":"TH10.02"},{"id":"TH11.01.1","g":11,"lv":"VD","q":"Trước khi xem xét công nhận thuận tình ly hôn, Thẩm phán phải làm gì?","o":["Tiến hành hòa giải để vợ chồng đoàn tụ","Yêu cầu Ủy ban nhân dân cấp xã xác nhận mâu thuẫn vợ chồng","Trưng cầu giám định giá trị căn nhà","Mở phiên tòa có Hội thẩm nhân dân tham gia"],"a":0,"e":"Điều 397 BLTTDS: khi giải quyết yêu cầu công nhận thuận tình ly hôn, Thẩm phán phải tiến hành hòa giải để vợ chồng đoàn tụ; chỉ khi hòa giải đoàn tụ không thành mới xem xét công nhận thuận tình ly hôn và sự thỏa thuận. Không mở phiên tòa và không cần xác nhận mâu thuẫn của Ủy ban nhân dân cấp xã.","b":"Khoản 2 Điều 397 BLTTDS","cid":"TH11.01"},{"id":"TH11.01.2","g":11,"lv":"VD","q":"Hòa giải đoàn tụ không thành, hai bên vẫn không thỏa thuận được về căn nhà. Tòa án xử lý thế nào?","o":["Trả lại đơn yêu cầu và hướng dẫn mỗi bên nộp đơn khởi kiện riêng","Tạm đình chỉ giải quyết việc dân sự chờ hai bên tự thỏa thuận","Đình chỉ giải quyết việc dân sự và thụ lý vụ án để giải quyết theo thủ tục chung","Công nhận thuận tình ly hôn, việc nuôi con và bác phần yêu cầu về căn nhà"],"a":2,"e":"Điều 397 BLTTDS: hòa giải đoàn tụ không thành mà các đương sự không thỏa thuận được về việc chia tài sản (hoặc nuôi con) thì Tòa án đình chỉ giải quyết việc dân sự về công nhận thuận tình ly hôn và thụ lý vụ án để giải quyết theo thủ tục chung. Tòa án không công nhận một phần, không trả lại đơn.","b":"Khoản 5 Điều 397 BLTTDS","cid":"TH11.01"},{"id":"TH11.01.3","g":11,"lv":"VD","q":"Khi chuyển sang giải quyết vụ án, Tòa án có phải thông báo thụ lý vụ án và phân công lại Thẩm phán không?","o":["Phải thông báo thụ lý nhưng giữ nguyên Thẩm phán","Phải thông báo thụ lý và phân công Thẩm phán khác","Không phải thông báo thụ lý, không phải phân công lại Thẩm phán","Không thông báo thụ lý nhưng phải phân công Thẩm phán khác"],"a":2,"e":"Điều 397 BLTTDS: khi chuyển từ việc dân sự sang giải quyết vụ án trong trường hợp này, Tòa án không phải thông báo về việc thụ lý vụ án và không phải phân công lại Thẩm phán giải quyết vụ án, nhằm bảo đảm tính liên tục, tiết kiệm thời gian.","b":"Khoản 5 Điều 397 BLTTDS","cid":"TH11.01"},{"id":"TH11.02.1","g":11,"lv":"VD","q":"Kèm theo đơn yêu cầu, bà Nga phải chứng minh điều gì?","o":["Ông Hưng đã biệt tích 06 tháng liền trở lên","Ông Hưng đã biệt tích 02 năm liền trở lên, không có tin tức xác thực còn sống hay đã chết và bà đã áp dụng đầy đủ biện pháp thông báo tìm kiếm","Ông Hưng còn tài sản cần người quản lý","Ông Hưng đã chết trong một tai nạn"],"a":1,"e":"Khoản 2 Điều 387 BLTTDS và Điều 68 BLDS: kèm theo đơn yêu cầu tuyên bố mất tích phải có tài liệu, chứng cứ chứng minh người bị yêu cầu đã biệt tích 02 năm liền trở lên mà không có tin tức xác thực còn sống hay đã chết và người yêu cầu đã áp dụng đầy đủ biện pháp thông báo, tìm kiếm. Ông Hưng biệt tích từ 3/2023 đến 9/2025 đã trên 02 năm.","b":"Khoản 2 Điều 387 BLTTDS","cid":"TH11.02"},{"id":"TH11.02.2","g":11,"lv":"VD","q":"Trong thời hạn bao lâu kể từ ngày thụ lý, Tòa án phải ra quyết định thông báo tìm kiếm người bị yêu cầu tuyên bố mất tích?","o":["10 ngày","20 ngày","01 tháng","03 ngày làm việc"],"a":1,"e":"Khoản 1 Điều 388 BLTTDS: trong thời hạn 20 ngày kể từ ngày thụ lý đơn yêu cầu tuyên bố một người mất tích, Tòa án ra quyết định thông báo tìm kiếm người bị yêu cầu tuyên bố mất tích.","b":"Khoản 1 Điều 388 BLTTDS","cid":"TH11.02"},{"id":"TH11.02.3","g":11,"lv":"VD","q":"Đang trong thời hạn thông báo, ông Hưng trở về và yêu cầu Tòa án đình chỉ việc xét đơn. Tòa án quyết định thế nào?","o":["Vẫn mở phiên họp rồi bác yêu cầu của bà Nga","Ra quyết định đình chỉ việc xét đơn yêu cầu tuyên bố mất tích","Tạm đình chỉ việc xét đơn trong 01 tháng","Ra quyết định tuyên bố mất tích rồi hủy bỏ ngay quyết định đó"],"a":1,"e":"Khoản 3 Điều 388 BLTTDS: trường hợp trong thời hạn thông báo mà người bị yêu cầu tuyên bố mất tích trở về và yêu cầu Tòa án đình chỉ việc xét đơn thì Tòa án ra quyết định đình chỉ việc xét đơn yêu cầu.","b":"Khoản 3 Điều 388 BLTTDS","cid":"TH11.02"}],"th":[{"name":"Chương 1. Những vấn đề lý luận cơ bản về luật tố tụng dân sự","items":[{"cid":"TH1.01","title":"Rút một phần yêu cầu khởi kiện","text":"Ông An khởi kiện bà Bình đòi trả 300 triệu đồng tiền vay gốc và 50 triệu đồng tiền lãi. Hợp đồng vay còn có điều khoản phạt vi phạm nếu trả chậm, nhưng ông An không yêu cầu khoản tiền phạt này. Tòa án nhân dân khu vực đã thụ lý vụ án.","ask":[],"guide":[],"basis":"Khoản 2 Điều 5 BLTTDS; Khoản 1 Điều 5 BLTTDS; Điều 5, khoản 2 Điều 244 BLTTDS","mcq":["TH1.01.1","TH1.01.2","TH1.01.3"]},{"cid":"TH1.02","title":"Tranh chấp đất có người chưa thành niên","text":"Bà Hoa khởi kiện ông Tùng tranh chấp quyền sử dụng 200 m² đất. Cháu Minh, 15 tuổi, con ông Tùng, đang sinh sống trên đất nên được Tòa án đưa vào tham gia tố tụng với tư cách người có quyền lợi, nghĩa vụ liên quan. Bà Hoa là người dân tộc Tày, không thông thạo tiếng Việt. Ông Tùng muốn phiên tòa không công khai vì liên quan đến chuyện riêng của gia đình.","ask":[],"guide":[],"basis":"Khoản 2 Điều 21 BLTTDS; Điều 20 BLTTDS; Khoản 2 Điều 15 BLTTDS","mcq":["TH1.02.1","TH1.02.2","TH1.02.3"]}]},{"name":"Chương 2. Thẩm quyền của Tòa án nhân dân","items":[{"cid":"TH2.01","title":"Đòi nợ giữa hai thành phố","text":"Tháng 3/2024, bà Lan (cư trú tại phường Ba Đình, Hà Nội) cho ông Minh (cư trú tại phường Hải Châu, thành phố Đà Nẵng) vay 500 triệu đồng, thời hạn 12 tháng. Hợp đồng vay lập bằng văn bản, ghi rõ địa điểm thực hiện hợp đồng (giao tiền vay và trả nợ) là nhà bà Lan ở Hà Nội. Hai bên không có thỏa thuận nào về Tòa án giải quyết tranh chấp. Đến hạn, ông Minh không trả nợ nên tháng 9/2026 bà Lan muốn khởi kiện.","ask":[],"guide":[],"basis":"Điểm a khoản 1 Điều 39, điểm g khoản 1 Điều 40 BLTTDS; Khoản 3 Điều 39 BLTTDS; Khoản 1 Điều 41 BLTTDS","mcq":["TH2.01.1","TH2.01.2","TH2.01.3"]},{"cid":"TH2.02","title":"Tranh chấp nhãn hiệu giữa hai doanh nghiệp","text":"Công ty TNHH Hoa Sen (trụ sở tại tỉnh Thái Nguyên) là chủ sở hữu nhãn hiệu \"Sen Vàng\" đã được cấp văn bằng bảo hộ. Năm 2026, Công ty cổ phần Phú An (trụ sở tại tỉnh Bắc Ninh) sản xuất và bán sản phẩm mang nhãn hiệu \"Sen Vàng Phú An\". Hai công ty đều kinh doanh vì mục đích lợi nhuận. Công ty Hoa Sen khởi kiện yêu cầu Công ty Phú An chấm dứt hành vi xâm phạm và bồi thường 800 triệu đồng.","ask":[],"guide":[],"basis":"Khoản 2 Điều 30, khoản 4 Điều 26 BLTTDS; Khoản 3 Điều 36 BLTTDS; khoản 3 Điều 4 Nghị quyết 81/2025/UBTVQH15; Điều 38 BLTTDS (sửa đổi 2025); Khoản 2 Điều 337 BLTTDS (sửa đổi 2025)","mcq":["TH2.02.1","TH2.02.2","TH2.02.3","TH2.02.4"]},{"cid":"TH2.03","title":"Thuận tình ly hôn","text":"Chị Hoa (cư trú tại thành phố Hải Phòng) và anh Nam (cư trú tại tỉnh Quảng Ninh) đăng ký kết hôn năm 2018 tại Hải Phòng, có một con chung 6 tuổi. Năm 2026, do mâu thuẫn kéo dài, hai người cùng muốn ly hôn và đã tự thỏa thuận xong về việc nuôi con và chia tài sản chung. Họ cùng làm đơn gửi Tòa án.","ask":[],"guide":[],"basis":"Khoản 2 Điều 29, khoản 1 Điều 28 BLTTDS; Khoản 4 Điều 36 BLTTDS; Khoản 2 Điều 39 BLTTDS","mcq":["TH2.03.1","TH2.03.2","TH2.03.3"]}]},{"name":"Chương 3. Cơ quan tiến hành tố tụng, người tiến hành tố tụng và người tham gia tố tụng dân sự","items":[{"cid":"TH3.01","title":"Chia thừa kế có người chưa thành niên","text":"Ông Bình chết năm 2025, không để lại di chúc. Di sản là một căn nhà và quyền sử dụng đất. Hàng thừa kế thứ nhất gồm vợ là bà Hạnh và hai con là anh Tuấn (30 tuổi) và cháu Mai (14 tuổi). Năm 2026, anh Tuấn khởi kiện bà Hạnh, yêu cầu chia di sản; bà Hạnh không đồng ý chia. Anh Tuấn nhờ Luật sư C bảo vệ quyền lợi cho mình. Thẩm phán được phân công giải quyết vụ án là em ruột của bà Hạnh.","ask":[],"guide":[],"basis":"Khoản 4 Điều 68 BLTTDS; Khoản 5 Điều 69 BLTTDS; Khoản 3 Điều 75 BLTTDS; Khoản 1 Điều 52, khoản 1 Điều 53 BLTTDS","mcq":["TH3.01.1","TH3.01.2","TH3.01.3","TH3.01.4"]},{"cid":"TH3.02","title":"Nguyên đơn chết khi vụ án đang giải quyết","text":"Bà Thu khởi kiện ông Phong đòi 300 triệu đồng tiền vay. Tòa án nhân dân khu vực đã thụ lý vụ án. Ông Phong định ủy quyền cho anh K, công chức đang công tác tại Viện kiểm sát nhân dân khu vực (không được phân công kiểm sát vụ án), làm người đại diện tham gia tố tụng thay mình. Trong thời gian chuẩn bị xét xử, bà Thu chết; người thừa kế theo pháp luật của bà gồm chồng và con trai 19 tuổi đang là sinh viên.","ask":[],"guide":[],"basis":"Điều 87 BLTTDS; Khoản 1 Điều 74 BLTTDS; Khoản 3 Điều 69 BLTTDS","mcq":["TH3.02.1","TH3.02.2","TH3.02.3"]},{"cid":"TH3.03","title":"Phiên tòa tranh chấp mua bán xe","text":"Ông Lâm khởi kiện bà Nga đòi trả tiền mua xe ô tô. Bà Nga là người khuyết tật nghe, nói. Người duy nhất chứng kiến việc giao xe là anh Hưng, con trai ông Lâm. Tại phiên tòa sơ thẩm, bà Nga đề nghị thay đổi Hội thẩm X vì Hội thẩm X là bạn thân thường xuyên qua lại với ông Lâm và trước phiên tòa đã nói với nhiều người rằng ông Lâm chắc chắn thắng kiện.","ask":[],"guide":[],"basis":"Điều 77, Điều 78 BLTTDS; Điều 20, Điều 81 BLTTDS; Khoản 3 Điều 52, khoản 2 Điều 56 BLTTDS","mcq":["TH3.03.1","TH3.03.2","TH3.03.3"]}]},{"name":"Chương 4. Chứng minh và chứng cứ trong tố tụng dân sự","items":[{"cid":"TH4.01","title":"Cho vay không có giấy tờ","text":"Anh Hải khởi kiện chị Ngọc đòi 200 triệu đồng tiền vay. Hai bên không lập hợp đồng. Anh Hải nộp cho Tòa án một đoạn ghi âm do anh tự thu, trong đó chị Ngọc thừa nhận có vay tiền, cùng ảnh chụp các tin nhắn Zalo chị Ngọc hẹn ngày trả. Chị Ngọc thừa nhận có vay nhưng cho rằng đã trả đủ bằng tiền mặt.","ask":[],"guide":[],"basis":"Khoản 2 Điều 95 BLTTDS; Khoản 1 Điều 94, khoản 3 Điều 95 BLTTDS; Khoản 2 Điều 91 BLTTDS","mcq":["TH4.01.1","TH4.01.2","TH4.01.3"]},{"cid":"TH4.02","title":"Chứng cứ nằm trong tay người khác","text":"Ông Phong khởi kiện Công ty X vì cho rằng công ty đơn phương chấm dứt hợp đồng lao động trái pháp luật. Bảng chấm công và hồ sơ xử lý kỷ luật do Công ty X quản lý. Ông Phong còn cần sao kê tài khoản nhận lương tại Ngân hàng Y, nhưng Ngân hàng Y từ chối cung cấp cho ông.","ask":[],"guide":[],"basis":"Điểm b khoản 1 Điều 91 BLTTDS; Khoản 2 Điều 106, điểm e khoản 1 Điều 97 BLTTDS; Khoản 3 Điều 106 BLTTDS","mcq":["TH4.02.1","TH4.02.2","TH4.02.3"]},{"cid":"TH4.03","title":"Tranh chấp ranh giới đất","text":"Bà Mai khởi kiện ông Đức, cho rằng ông Đức xây tường rào lấn sang thửa đất của bà khoảng 15 m². Hai bên trình bày khác nhau về ranh giới thực tế và đưa ra hai mức giá đất chênh lệch lớn. Bà Mai đề nghị Tòa án xuống đo đạc hiện trạng.","ask":[],"guide":[],"basis":"Điểm đ khoản 2 Điều 97, Điều 101 BLTTDS; Điểm b khoản 3 Điều 104 BLTTDS; Khoản 3, khoản 4 Điều 101 BLTTDS","mcq":["TH4.03.1","TH4.03.2","TH4.03.3"]}]},{"name":"Chương 5. Biện pháp khẩn cấp tạm thời; cấp, tống đạt, thông báo văn bản tố tụng; thời hạn tố tụng, thời hiệu","items":[{"cid":"TH5.01","title":"Ngăn tẩu tán tài sản","text":"Chị Lan khởi kiện anh Dũng đòi lại 2 tỷ đồng đã đặt cọc mua căn hộ. Chị Lan được biết anh Dũng đang rao bán căn nhà riêng đứng tên anh (căn nhà này không phải là đối tượng tranh chấp) và đang làm thủ tục xuất cảnh để định cư ở nước ngoài.","ask":[],"guide":[],"basis":"Khoản 11 Điều 114, Điều 126 BLTTDS; Điều 126 BLTTDS; Khoản 13 Điều 114, Điều 128, khoản 1 Điều 136 BLTTDS","mcq":["TH5.01.1","TH5.01.2","TH5.01.3"]},{"cid":"TH5.02","title":"Giấy triệu tập không đến tay bị đơn","text":"Tòa án nhân dân khu vực gửi giấy triệu tập cho ông Khoa (bị đơn) tại địa chỉ ghi trong đơn khởi kiện. Lần thứ nhất, ông Khoa đi vắng, vợ ông (đã thành niên, cùng chung sống) nhận thay. Lần thứ hai, ông Khoa có mặt nhưng từ chối nhận. Lần thứ ba, ông Khoa đã chuyển đi, không ai biết địa chỉ mới.","ask":[],"guide":[],"basis":"Khoản 5 Điều 177 BLTTDS; Khoản 4 Điều 177 BLTTDS; Khoản 5 Điều 177, Điều 179 BLTTDS","mcq":["TH5.02.1","TH5.02.2","TH5.02.3"]},{"cid":"TH5.03","title":"Đòi tiền hàng sau nhiều năm","text":"Ngày 01/3/2022, ông Sơn bán cho bà Thu một lô hàng, bà Thu cam kết thanh toán vào ngày 01/6/2022 nhưng đến hạn không trả. Ngày 10/01/2025, bà Thu nhắn tin cho ông Sơn thừa nhận còn nợ và xin khất. Tháng 9/2026, ông Sơn khởi kiện. Hai bên không phải là thương nhân.","ask":[],"guide":[],"basis":"Điều 429, Điều 154 BLDS; Điều 184 BLTTDS; Điều 157 BLDS; Khoản 2 Điều 184 BLTTDS","mcq":["TH5.03.1","TH5.03.2","TH5.03.3"]}]},{"name":"Chương 6. Án phí, lệ phí và chi phí tố tụng","items":[{"cid":"TH6.01","title":"Đòi tiền vay và yêu cầu phản tố","text":"Ông An khởi kiện bà Bình tại Tòa án nhân dân khu vực, đòi trả 1.000.000.000 đồng tiền vay. Bà Bình có yêu cầu phản tố, đòi ông An trả 100.000.000 đồng tiền hàng để bù trừ nghĩa vụ. Tòa án chấp nhận toàn bộ yêu cầu của ông An và không chấp nhận yêu cầu phản tố của bà Bình.","ask":[],"guide":[],"basis":"Điều 7 Nghị quyết 326/2016/UBTVQH14; Danh mục án phí, lệ phí Tòa án; Khoản 1 Điều 147 BLTTDS; Điều 26 Nghị quyết 326/2016/UBTVQH14","mcq":["TH6.01.1","TH6.01.2","TH6.01.3"]},{"cid":"TH6.02","title":"Ly hôn và chia tài sản chung","text":"Chị Hoa khởi kiện xin ly hôn anh Tuấn và yêu cầu chia căn nhà là tài sản chung; anh Tuấn không đồng ý ly hôn. Anh Tuấn không chấp nhận giá căn nhà chị Hoa đưa ra nên yêu cầu Tòa án định giá; Hội đồng định giá xác định căn nhà trị giá 2.000.000.000 đồng. Tòa án xử cho ly hôn và chia cho mỗi người một nửa giá trị căn nhà.","ask":[],"guide":[],"basis":"Khoản 4 Điều 147 BLTTDS; Điều 27 Nghị quyết 326/2016/UBTVQH14; Khoản 2 Điều 147 BLTTDS; Danh mục án phí, lệ phí Tòa án; Khoản 2 Điều 165 BLTTDS","mcq":["TH6.02.1","TH6.02.2","TH6.02.3"]}]},{"name":"Chương 7. Thủ tục giải quyết vụ án dân sự tại Tòa án cấp sơ thẩm","items":[{"cid":"TH7.01","title":"Đòi tiền thuê nhà","text":"Ngày 01/3, bà Mai nộp đơn tại Tòa án nhân dân khu vực khởi kiện ông Phong đòi 150.000.000 đồng tiền thuê nhà. Ngày 05/3, bà Mai nhận thông báo nộp tiền tạm ứng án phí; ngày 09/3, bà nộp biên lai cho Tòa án. Sau khi nhận thông báo thụ lý, ông Phong cho rằng bà Mai còn nợ ông 50.000.000 đồng tiền sửa chữa nhà và muốn được bù trừ.","ask":[],"guide":[],"basis":"Điều 195 BLTTDS; Điều 7 Nghị quyết 326/2016/UBTVQH14; Danh mục án phí, lệ phí Tòa án; Khoản 2, khoản 3 Điều 200 BLTTDS","mcq":["TH7.01.1","TH7.01.2","TH7.01.3"]},{"cid":"TH7.02","title":"Hòa giải rồi đổi ý","text":"Anh Nam khởi kiện chị Thu đòi 300.000.000 đồng tiền góp vốn. Tại phiên họp hòa giải, hai bên thỏa thuận chị Thu trả 250.000.000 đồng; biên bản hòa giải thành lập ngày 10/5. Ngày 14/5, chị Thu gửi văn bản cho Tòa án nói không đồng ý với thỏa thuận. Vụ án được đưa ra xét xử; anh Nam được triệu tập hợp lệ lần thứ hai nhưng vẫn vắng mặt, không có đơn đề nghị xét xử vắng mặt, không có lý do bất khả kháng. Chị Thu không có yêu cầu phản tố.","ask":[],"guide":[],"basis":"Khoản 1 Điều 212 BLTTDS; Khoản 2 Điều 227; điểm c khoản 1 Điều 217 BLTTDS; Khoản 1 Điều 218 BLTTDS","mcq":["TH7.02.1","TH7.02.2","TH7.02.3"]},{"cid":"TH7.03","title":"Phiên tòa sơ thẩm tranh chấp mua bán hàng hóa","text":"Công ty X khởi kiện bà Y đòi 500.000.000 đồng tiền hàng. Bà Y có yêu cầu phản tố, đòi Công ty X bồi thường 100.000.000 đồng do hàng kém chất lượng. Phiên tòa sơ thẩm có Kiểm sát viên tham gia.","ask":[],"guide":[],"basis":"Điều 245; điểm b khoản 2 Điều 217 BLTTDS; Điều 249 BLTTDS; Điều 264 BLTTDS","mcq":["TH7.03.1","TH7.03.2","TH7.03.3"]}]},{"name":"Chương 8. Thủ tục giải quyết vụ án dân sự tại Tòa án cấp phúc thẩm","items":[{"cid":"TH8.01","title":"Kháng cáo sau khi nằm viện","text":"Ngày 02/6, Tòa án nhân dân khu vực 3 tuyên án buộc ông Hải trả bà Lan 400.000.000 đồng; ông Hải có mặt khi tuyên án. Từ ngày 05/6 đến ngày 18/6, ông Hải nằm viện điều trị (có giấy ra viện). Ngày 20/6, ông nộp đơn kháng cáo.","ask":[],"guide":[],"basis":"Khoản 1 Điều 273 BLTTDS; Điều 147 BLDS; Điều 275 BLTTDS; Điều 37 BLTTDS (sửa đổi 2025); Điều 148 BLTTDS; Danh mục án phí, lệ phí Tòa án","mcq":["TH8.01.1","TH8.01.2","TH8.01.3"]},{"cid":"TH8.02","title":"Rút đơn khởi kiện ở cấp phúc thẩm","text":"Bà Hương khởi kiện ông Kiên đòi tài sản và được Tòa án cấp sơ thẩm chấp nhận một phần yêu cầu. Ông Kiên kháng cáo. Trước khi mở phiên tòa phúc thẩm, bà Hương nộp đơn rút đơn khởi kiện.","ask":[],"guide":[],"basis":"Khoản 1 Điều 299 BLTTDS; Điểm b khoản 1 Điều 299; Điều 311 BLTTDS; Điểm b khoản 1 Điều 299 BLTTDS","mcq":["TH8.02.1","TH8.02.2","TH8.02.3"]}]},{"name":"Chương 9. Thủ tục rút gọn giải quyết vụ án dân sự","items":[{"cid":"TH9.01","title":"Đòi nợ theo thủ tục rút gọn","text":"Tòa án nhân dân khu vực 2 thụ lý vụ án bà Thu khởi kiện ông Bình đòi 150.000.000 đồng tiền vay. Giấy vay tiền có chữ ký của ông Bình; ông Bình có văn bản thừa nhận khoản nợ, chỉ xin trả dần. Hai bên đều có địa chỉ cư trú rõ ràng tại địa phương. Thẩm phán dự kiến giải quyết vụ án theo thủ tục rút gọn.","ask":[],"guide":[],"basis":"Khoản 1 Điều 318 BLTTDS; Điểm đ khoản 3 Điều 317 BLTTDS; Điều 65; khoản 1 Điều 37 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)","mcq":["TH9.01.1","TH9.01.2","TH9.01.3"]},{"cid":"TH9.02","title":"Tranh chấp tiêu dùng giá trị nhỏ","text":"Anh Khoa mua của Công ty Minh Phát một chiếc điện thoại giá 18.000.000 đồng. Điện thoại hỏng sau một tuần, công ty từ chối đổi hoặc trả lại tiền vì cho rằng anh Khoa làm rơi máy. Anh Khoa khởi kiện yêu cầu công ty hoàn trả 18.000.000 đồng; công ty không thừa nhận nghĩa vụ.","ask":[],"guide":[],"basis":"Khoản 5 Điều 317 BLTTDS; khoản 2 Điều 70 Luật Bảo vệ quyền lợi người tiêu dùng; Khoản 1, 2 Điều 319 BLTTDS; Khoản 1 Điều 320 BLTTDS","mcq":["TH9.02.1","TH9.02.2","TH9.02.3"]}]},{"name":"Chương 10. Thủ tục xem xét lại bản án, quyết định đã có hiệu lực pháp luật","items":[{"cid":"TH10.01","title":"Áp dụng sai thời hiệu khởi kiện","text":"Bản án phúc thẩm của Tòa án nhân dân tỉnh H, có hiệu lực pháp luật từ ngày 10/9/2025, bác yêu cầu đòi lại tài sản của bà Mai với lý do đã hết thời hiệu khởi kiện. Bà Mai cho rằng yêu cầu đòi lại tài sản thuộc quyền sở hữu của mình không bị áp dụng thời hiệu nên Tòa án đã áp dụng sai pháp luật.","ask":[],"guide":[],"basis":"Khoản 1 Điều 327; Điều 328 BLTTDS; Khoản 1 Điều 331 BLTTDS (sửa đổi bởi Luật 85/2025/QH15); Khoản 2 Điều 337 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)","mcq":["TH10.01.1","TH10.01.2","TH10.01.3"]},{"cid":"TH10.02","title":"Phát hiện giấy vay tiền giả mạo","text":"Bản án sơ thẩm của Tòa án nhân dân khu vực 4 (không bị kháng cáo, kháng nghị) buộc ông Quang trả cho ông Sơn 500.000.000 đồng dựa trên giấy vay tiền do ông Sơn xuất trình. Tám tháng sau khi bản án có hiệu lực, kết luận giám định trong một vụ án hình sự xác định chữ ký của ông Quang trên giấy vay tiền là giả mạo.","ask":[],"guide":[],"basis":"Khoản 2 Điều 352 BLTTDS; Điều 355 BLTTDS; Khoản 2 Điều 356 BLTTDS","mcq":["TH10.02.1","TH10.02.2","TH10.02.3"]}]},{"name":"Chương 11. Thủ tục giải quyết việc dân sự","items":[{"cid":"TH11.01","title":"Thuận tình ly hôn chưa thống nhất về nhà","text":"Anh Tuấn và chị Lan cùng ký đơn yêu cầu Tòa án nhân dân khu vực 1 công nhận thuận tình ly hôn. Hai người đã thỏa thuận chị Lan nuôi con chung 5 tuổi, anh Tuấn cấp dưỡng 3.000.000 đồng mỗi tháng, nhưng chưa thống nhất được việc chia căn nhà là tài sản chung.","ask":[],"guide":[],"basis":"Khoản 2 Điều 397 BLTTDS; Khoản 5 Điều 397 BLTTDS","mcq":["TH11.01.1","TH11.01.2","TH11.01.3"]},{"cid":"TH11.02","title":"Yêu cầu tuyên bố chồng mất tích","text":"Ông Hưng rời nhà đi làm ăn xa từ tháng 3/2023 và từ đó không có tin tức. Năm 2024, theo yêu cầu của vợ ông là bà Nga, Tòa án đã ra quyết định thông báo tìm kiếm người vắng mặt tại nơi cư trú nhưng không có kết quả. Tháng 9/2025, bà Nga yêu cầu Tòa án nhân dân khu vực nơi ông Hưng cư trú cuối cùng tuyên bố ông Hưng mất tích.","ask":[],"guide":[],"basis":"Khoản 2 Điều 387 BLTTDS; Khoản 1 Điều 388 BLTTDS; Khoản 3 Điều 388 BLTTDS","mcq":["TH11.02.1","TH11.02.2","TH11.02.3"]}]}],"vb":[{"name":"Hiến pháp, bộ luật và luật","rows":[{"t":"Hiến pháp nước CHXHCN Việt Nam 2013 (sửa đổi, bổ sung theo Nghị quyết 203/2025/QH15)","d":"28/11/2013","org":"Quốc hội","note":"Nguyên tắc tổ chức, hoạt động của Tòa án, Viện kiểm sát","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Hien-phap-nam-2013-215627.aspx"},{"t":"Bộ luật Tố tụng dân sự số 92/2015/QH13","d":"25/11/2015","org":"Quốc hội","note":"Hiệu lực 01/7/2016; đã được sửa đổi, bổ sung 8 lần","url":"https://thuvienphapluat.vn/van-ban/Thu-tuc-To-tung/Bo-luat-to-tung-dan-su-2015-296861.aspx"},{"t":"Văn bản hợp nhất số 21/VBHN-VPQH – Bộ luật Tố tụng dân sự","d":"12/02/2026","org":"Văn phòng Quốc hội","note":"Dùng bản này khi tra cứu; hợp nhất đến Luật Phục hồi, phá sản số 142/2025/QH15 (hiệu lực 01/3/2026)","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=V%C4%83n%20b%E1%BA%A3n%20h%E1%BB%A3p%20nh%E1%BA%A5t%20s%E1%BB%91%2021/VBHN-VPQH%20%E2%80%93%20B%E1%BB%99%20lu%E1%BA%ADt%20T%E1%BB%91%20t%E1%BB%A5ng%20d%C3%A2n%20s%E1%BB%B1&match=True"},{"t":"Luật số 85/2025/QH15 sửa đổi BLTTDS, Luật TTHC, Luật Tư pháp người chưa thành niên, Luật Phá sản, Luật Hòa giải, đối thoại tại Tòa án","d":"25/06/2025","org":"Quốc hội","note":"Hiệu lực 01/7/2025; thẩm quyền TAND khu vực, TAND cấp tỉnh, giám đốc thẩm, tái thẩm","url":"h háp khẩn cấp tạm thời","d":"01/12/2020","org":"Hội đồng Thẩm phán TANDTC","note":"Chương 5","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=02/2020/NQ-H%C4%90TP&match=True"},{"t":"Nghị quyết 04/2017/NQ-HĐTP hướng dẫn khoản 1, khoản 3 Điều 192 BLTTDS về trả lại đơn khởi kiện, quyền nộp đơn khởi kiện lại","d":"05/05/2017","org":"Hội đồng Thẩm phán TANDTC","note":"Chương 7","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=04/2017/NQ-H%C4%90TP&match=True"},{"t":"Nghị quyết 01/2017/NQ-HĐTP ban hành một số biểu mẫu trong tố tụng dân sự","d":"13/01/2017","org":"Hội đồng Thẩm phán TANDTC","note":"Biểu mẫu đơn, quyết định, bản án","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=01/2017/NQ-H%C4%90TP&match=True"}]}],"al":[],"ly":{"root":"Luật Tố tụng dân sự","ch":[{"t":"1. Những vấn đề lý luận cơ bản về luật tố tụng dân sự","cs":"Điều 1–25 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); Điều 102, 103, 107 Hiến pháp 2013 (sửa đổi, bổ sung năm 2025)","b":["Hai trọng tâm: phân biệt vụ án dân sự với việc dân sự; nắm các nguyên tắc đặc thù của tố tụng dân sự (tự định đoạt, chứng minh, hòa giải, tranh tụng).","Phần lý luận bám Giáo trình Luật Tố tụng dân sự (Trường Đại học Luật Hà Nội)."],"c":[{"t":"1.1. Khái niệm, đối tượng, phương pháp điều chỉnh của luật tố tụng dân sự","cs":"Điều 1, 2, 361 BLTTDS","b":[],"c":[{"t":"1.1.1. Khái niệm","cs":"","b":["Phạm vi điều chỉnh của BLTTDS (Điều 1): nguyên tắc cơ bản; trình tự, thủ tục khởi kiện, yêu cầu và giải quyết vụ việc dân sự tại Tòa án; công nhận và cho thi hành bản án, phán quyết nước ngoài; thi hành án dân sự; nhiệm vụ, quyền hạn của cơ quan, người tiến hành tố tụng; quyền, nghĩa vụ của người tham gia tố tụng","Vụ việc dân sự gồm: vụ án dân sự (có tranh chấp, bắt đầu bằng đơn khởi kiện) và việc dân sự (không có tranh chấp, có yêu cầu Tòa án công nhận hoặc không công nhận một sự kiện pháp lý, quyền của mình – Điều 361)","Luật tố tụng dân sự là ngành luật hình thức, bảo đảm thực hiện luật nội dung: dân sự, hôn nhân và gia đình, kinh doanh, thương mại, lao động","Quan hệ pháp luật tố tụng dân sự: chủ thể (Tòa án, Viện kiểm sát, đương sự, người tham gia tố tụng khác); khách thể (việc giải quyết vụ việc dân sự); nội dung (quyền, nghĩa vụ tố tụng)","Nguồn: Hiến pháp; BLTTDS; các luật có quy định về tố tụng (Luật Tổ chức Tòa án nhân dân, Luật Hòa giải, đối thoại tại Tòa án…); nghị quyết của Quốc hội, Ủy ban Thường vụ Quốc hội; nghị quyết của Hội đồng Thẩm phán TANDTC; án lệ"],"c":[{"t":"Hiệu lực của BLTTDS (Điều 2)","cs":"","b":["Không gian: toàn lãnh thổ Việt Nam, gồm đất liền, hải đảo, vùng biển, vùng trời","Hoạt động tố tụng dân sự do cơ quan đại diện của Việt Nam ở nước ngoài tiến hành","Vụ việc có yếu tố nước ngoài: áp dụng BLTTDS; điều ước quốc tế mà Việt Nam là thành viên quy định khác thì áp dụng điều ước","Người được hưởng ưu đãi, miễn trừ ngoại giao hoặc lãnh sự: vụ việc liên quan được giải quyết qua đường ngoại giao"]}]},{"t":"1.1.2. Đối tượng điều chỉnh","cs":"","b":["Các quan hệ phát sinh giữa Tòa án, Viện kiểm sát, đương sự, người tham gia tố tụng khác và cơ quan, tổ chức, cá nhân có liên quan khi giải quyết vụ việc dân sự","Phạm vi: từ khi khởi kiện, yêu cầu cho đến khi giải quyết xong vụ việc và thi hành bản án, quyết định dân sự"]},{"t":"1.1.3. Phương pháp điều chỉnh","cs":"","b":["Mệnh lệnh: trong quan hệ giữa Tòa án, Viện kiểm sát với người tham gia tố tụng; quyết định của Tòa án có tính bắt buộc","Định đoạt: trong quan hệ giữa các đương sự; tự quyết định khởi kiện, rút, thay đổi yêu cầu, thỏa thuận","Kết hợp: đương sự định đoạt, Tòa án kiểm tra tính tự nguyện, hợp pháp trước khi công nhận (ví dụ: rút yêu cầu, công nhận sự thỏa thuận – Điều 5)"]}]},{"t":"1.2. Các nguyên tắc của luật tố tụng dân sự Việt Nam","cs":"Chương II, Điều 3–25 BLTTDS; Điều 103, 107 Hiến pháp 2013","b":[],"c":[{"t":"1.2.1. Khái niệm nguyên tắc","cs":"","b":["Tư tưởng chỉ đạo có tính bắt buộc, được pháp luật ghi nhận, chi phối toàn bộ hoặc nhiều giai đoạn của tố tụng dân sự","Phân loại: nguyên tắc có nguồn từ Hiến pháp (Điều 103: Hội thẩm tham gia xét xử, độc lập, công khai, tập thể, tranh tụng, hai cấp xét xử, bảo đảm quyền bảo vệ; Điều 107: kiểm sát hoạt động tư pháp) và nguyên tắc đặc thù của tố tụng dân sự","BLTTDS ghi nhận 23 nguyên tắc (Điều 3–25); bài giảng chia thành 4 nhóm"]},{"t":"1.2.2. Nội dung các nguyên tắc cơ bản","cs":"","b":[],"c":[{"t":"a) Nhóm nguyên tắc đặc thù","cs":"","b":["Quyền yêu cầu Tòa án bảo vệ (Điều 4): Tòa án không được từ chối giải quyết vì chưa có điều luật để áp dụng; khi đó áp dụng tập quán, tương tự pháp luật, nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng (Điều 45)","Quyền quyết định và tự định đoạt (Điều 5): Tòa án chỉ thụ lý khi có đơn và chỉ giải quyết trong phạm vi đơn; đương sự có quyền chấm dứt, thay đổi yêu cầu, thỏa thuận tự nguyện, không vi phạm điều cấm của luật, không trái đạo đức xã hội","Cung cấp chứng cứ và chứng minh (Điều 6, 7): đương sự chủ động thu thập, giao nộp; Tòa án hỗ trợ và chỉ thu thập chứng cứ trong trường hợp Bộ luật quy định; cơ quan, tổ chức, cá nhân phải cung cấp tài liệu đang lưu giữ","Hòa giải (Điều 10): Tòa án có trách nhiệm tiến hành hòa giải, tạo điều kiện để đương sự thỏa thuận; khác với hòa giải, đối thoại trước khi thụ lý theo Luật Hòa giải, đối thoại tại Tòa án","Bảo đảm tranh tụng (Điều 24): đương sự, người bảo vệ được thu thập, giao nộp, đưa ra chứng cứ, lập luận, đối đáp; Tòa án bảo đảm tranh tụng trong xét xử sơ thẩm, phúc thẩm, giám đốc thẩm, tái thẩm"]},{"t":"b) Nhóm bảo đảm quyền của người tham gia tố tụng","cs":"","b":["Bình đẳng về quyền và nghĩa vụ trong tố tụng (Điều 8)","Bảo đảm quyền bảo vệ quyền và lợi ích hợp pháp của đương sự (Điều 9)","Tiếng nói, chữ viết (Điều 20): tiếng Việt; người tham gia tố tụng được dùng tiếng nói, chữ viết của dân tộc mình, khi đó cần người phiên dịch","Quyền khiếu nại, tố cáo trong tố tụng dân sự (Điều 25)"]},{"t":"c) Nhóm tổ chức và hoạt động xét xử","cs":"","b":["Hội thẩm nhân dân tham gia xét xử sơ thẩm, trừ thủ tục rút gọn (Điều 11)","Thẩm phán, Hội thẩm xét xử độc lập, chỉ tuân theo pháp luật (Điều 12)","Tòa án xét xử tập thể, quyết định theo đa số, trừ thủ tục rút gọn (Điều 14)","Xét xử kịp thời, công bằng, công khai; xét xử kín khi cần giữ bí mật nhà nước, thuần phong mỹ tục, bảo vệ người chưa thành niên, giữ bí mật nghề nghiệp, kinh doanh, cá nhân, gia đình theo yêu cầu chính đáng của đương sự (Điều 15)","Bảo đảm sự vô tư, khách quan (Điều 16)","Hai cấp xét xử: sơ thẩm và phúc thẩm; giám đốc thẩm, tái thẩm không phải là một cấp xét xử (Điều 17)","Giám đốc việc xét xử: Tòa án cấp trên giám đốc việc xét xử của Tòa án cấp dưới (Điều 18)"]},{"t":"d) Nhóm pháp chế và trách nhiệm","cs":"","b":["Tuân thủ pháp luật trong tố tụng dân sự (Điều 3)","Trách nhiệm của cơ quan, người tiến hành tố tụng (Điều 13)","Bảo đảm hiệu lực của bản án, quyết định của Tòa án (Điều 19)","Kiểm sát việc tuân theo pháp luật (Điều 21): Viện kiểm sát tham gia phiên họp sơ thẩm việc dân sự; phiên tòa sơ thẩm khi Tòa án thu thập chứng cứ, đối tượng tranh chấp là tài sản công, lợi ích công cộng, quyền sử dụng đất, nhà ở, có đương sự là người chưa thành niên, mất hoặc hạn chế năng lực hành vi dân sự, có khó khăn trong nhận thức, làm chủ hành vi, hoặc trường hợp chưa có điều luật áp dụng","Trách nhiệm chuyển giao tài liệu, giấy tờ của Tòa án (Điều 22)","Việc tham gia tố tụng dân sự của cơ quan, tổ chức, cá nhân (Điều 23)"]}]}]}]},{"t":"2. Thẩm quyền của Tòa án nhân dân","cs":"Điều 26–45 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); Nghị quyết 81/2025/UBTVQH15","b":["Ba câu hỏi phải trả lời theo thứ tự: vụ việc có thuộc Tòa án không (theo loại việc), Tòa án cấp nào (theo cấp), Tòa án ở đâu (theo lãnh thổ).","Từ 01/7/2025, hệ thống Tòa án gồm TAND khu vực, TAND cấp tỉnh và TAND tối cao; Tòa án cấp huyện không còn."],"c":[{"t":"2.1.1. Khái niệm thẩm quyền dân sự","cs":"Điều 1, Điều 5 BLTTDS; Giáo trình ĐH Luật Hà Nội","b":["Thẩm quyền dân sự của Tòa án là quyền xem xét, giải quyết các vụ việc dân sự và quyền hạn ra các quyết định khi giải quyết các vụ việc đó theo thủ tục tố tụng dân sự."],"c":[{"t":"Đặc trưng","cs":"","b":["Tòa án nhân danh quyền lực nhà nước, độc lập giải quyết vụ việc phát sinh từ quan hệ bình đẳng, tự nguyện, tự định đoạt","Phạm vi giải quyết bị giới hạn bởi yêu cầu và thỏa thuận của đương sự (quyền quyết định và tự định đoạt)"]},{"t":"Ba cách xác định thẩm quyền","cs":"","b":["Theo loại việc: Điều 26–34","Theo cấp Tòa án: Điều 35–38","Theo lãnh thổ: Điều 39–40"]}]},{"t":"2.1.2. Ý nghĩa xác định thẩm quyền dân sự","cs":"Giáo trình ĐH Luật Hà Nội","b":["Tránh chồng chéo, bỏ sót giữa Tòa án với cơ quan khác và giữa các Tòa án với nhau","Tạo thuận lợi cho đương sự tham gia tố tụng, giảm chi phí, thời gian","Là cơ sở bố trí Thẩm phán, Tòa chuyên trách phù hợp chuyên môn","Giải quyết sai thẩm quyền là vi phạm thủ tục tố tụng, có thể dẫn đến bản án, quyết định bị hủy (xem Chương 8, Chương 10)"]},{"t":"2.2.1. Cơ sở xác định thẩm quyền theo loại việc","cs":"Điều 4, Điều 26–33, Điều 43–45 BLTTDS","b":["Căn cứ vào tính chất của quan hệ pháp luật nội dung: dân sự, hôn nhân và gia đình, kinh doanh thương mại, lao động đều là quan hệ bình đẳng, tự nguyện, tự định đoạt","Có tranh chấp: vụ án dân sự (Điều 26, 28, 30, 32). Không có tranh chấp, chỉ có yêu cầu: việc dân sự (Điều 27, 29, 31, 33)","Tòa án không được từ chối giải quyết vụ việc dân sự vì lý do chưa có điều luật để áp dụng (khoản 2 Điều 4)","Một số tranh chấp chỉ được khởi kiện sau thủ tục luật định, ví dụ tranh chấp lao động cá nhân phải qua hòa giải viên lao động, trừ các trường hợp luật loại trừ (khoản 1 Điều 32)"],"c":[{"t":"Khi chưa có điều luật để áp dụng (Điều 43–45)","cs":"","b":["Thụ lý theo thủ tục chung","Áp dụng tập quán, tương tự pháp luật, nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng (Điều 45 BLTTDS; Điều 5, 6 BLDS 2015)"]}]},{"t":"2.2.2.a. Tranh chấp và yêu cầu về dân sự","cs":"Điều 26, 27 BLTTDS","b":[],"c":[{"t":"Tranh chấp (Điều 26, 14 khoản)","cs":"","b":["Quốc tịch Việt Nam giữa cá nhân với cá nhân","Quyền sở hữu và quyền khác đối với tài sản","Giao dịch dân sự, hợp đồng dân sự","Sở hữu trí tuệ, chuyển giao công nghệ (trừ trường hợp các bên đều có mục đích lợi nhuận)","Thừa kế tài sản","Bồi thường thiệt hại ngoài hợp đồng","Đất đai; quyền sở hữu, quyền sử dụng rừng","Liên quan đến yêu cầu tuyên bố văn bản công chứng vô hiệu","Tài sản bị cưỡng chế thi hành án; kết quả bán đấu giá tài sản","Các tranh chấp dân sự khác"]},{"t":"Yêu cầu (Điều 27, 10 khoản)","cs":"","b":["Tuyên bố, hủy tuyên bố mất năng lực hành vi dân sự, có khó khăn trong nhận thức, làm chủ hành vi, hạn chế năng lực hành vi dân sự","Thông báo tìm kiếm người vắng mặt; tuyên bố, hủy tuyên bố mất tích, đã chết","Công nhận và cho thi hành bản án, quyết định dân sự của Tòa án nước ngoài","Tuyên bố văn bản công chứng vô hiệu","Công nhận kết quả hòa giải thành ngoài Tòa án","Công nhận tài sản vô chủ","Các yêu cầu theo Luật Thi hành án dân sự và yêu cầu dân sự khác"]}]},{"t":"2.2.2.b. Tranh chấp và yêu cầu về hôn nhân và gia đình","cs":"Điều 28, 29 BLTTDS","b":[],"c":[{"t":"Tranh chấp (Điều 28)","cs":"","b":["Ly hôn; nuôi con, chia tài sản khi ly hôn và sau ly hôn","Chia tài sản chung trong thời kỳ hôn nhân","Thay đổi người trực tiếp nuôi con sau ly hôn","Xác định cha, mẹ cho con hoặc con cho cha, mẹ","Cấp dưỡng","Sinh con bằng kỹ thuật hỗ trợ sinh sản, mang thai hộ vì mục đích nhân đạo","Nuôi con, chia tài sản khi chung sống như vợ chồng không đăng ký kết hôn hoặc khi hủy kết hôn trái pháp luật"]},{"t":"Yêu cầu (Điều 29)","cs":"","b":["Hủy việc kết hôn trái pháp luật","Công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn","Công nhận thỏa thuận thay đổi người trực tiếp nuôi con","Hạn chế quyền của cha, mẹ đối với con chưa thành niên hoặc quyền thăm nom con sau ly hôn","Chấm dứt việc nuôi con nuôi","Tuyên bố vô hiệu thỏa thuận về chế độ tài sản của vợ chồng","Xác định cha, mẹ cho con hoặc con cho cha, mẹ"]}]},{"t":"2.2.2.c. Tranh chấp và yêu cầu về kinh doanh, thương mại","cs":"Điều 30, 31 BLTTDS","b":["Dấu hiệu nhận biết: tranh chấp phát sinh trong hoạt động kinh doanh, thương mại giữa cá nhân, tổ chức có đăng ký kinh doanh và đều có mục đích lợi nhuận"],"c":[{"t":"Tranh chấp (Điều 30)","cs":"","b":["Hoạt động kinh doanh, thương mại giữa các bên có đăng ký kinh doanh, đều có mục đích lợi nhuận","Sở hữu trí tuệ, chuyển giao công nghệ giữa các bên đều có mục đích lợi nhuận","Chuyển nhượng phần vốn góp giữa người chưa là thành viên với công ty, thành viên công ty","Tranh chấp nội bộ công ty: thành lập, hoạt động, giải thể, sáp nhập, hợp nhất, chia, tách, chuyển đổi"]},{"t":"Yêu cầu (Điều 31)","cs":"","b":["Hủy bỏ nghị quyết của Đại hội đồng cổ đông, Hội đồng thành viên","Yêu cầu liên quan đến việc Trọng tài thương mại Việt Nam giải quyết tranh chấp","Bắt giữ tàu bay, tàu biển (trừ trường hợp bắt giữ để bảo đảm giải quyết vụ án)","Công nhận và cho thi hành bản án của Tòa án nước ngoài, phán quyết của Trọng tài nước ngoài"]}]},{"t":"2.2.2.d. Tranh chấp và yêu cầu về lao động","cs":"Điều 32, 33 BLTTDS","b":["Tranh chấp lao động cá nhân: phải qua hòa giải của hòa giải viên lao động mà không thành hoặc không được thực hiện, trừ những tranh chấp luật cho phép khởi kiện thẳng","Tranh chấp lao động tập thể về quyền; tranh chấp liên quan đến lao động (học nghề, cho thuê lại lao động, công đoàn, an toàn lao động, bồi thường do đình công bất hợp pháp)"],"c":[{"t":"Yêu cầu (Điều 33)","cs":"","b":["Tuyên bố hợp đồng lao động, thỏa ước lao động tập thể vô hiệu","Xét tính hợp pháp của cuộc đình công","Công nhận và cho thi hành bản án, phán quyết lao động của nước ngoài"]}]},{"t":"2.2.2.đ. Hủy quyết định cá biệt trái pháp luật","cs":"Điều 34 BLTTDS","b":["Khi giải quyết vụ việc dân sự, Tòa án có quyền hủy quyết định cá biệt rõ ràng trái pháp luật xâm phạm quyền, lợi ích hợp pháp của đương sự (khoản 1)","Quyết định cá biệt: quyết định đã được ban hành về một vấn đề cụ thể và được áp dụng một lần đối với một hoặc một số đối tượng cụ thể (khoản 2)","Cơ quan, tổ chức, người có thẩm quyền ban hành quyết định phải tham gia tố tụng với tư cách người có quyền lợi, nghĩa vụ liên quan (khoản 3)","Khoản 4 (thẩm quyền theo cấp) đã bị bãi bỏ; từ 01/7/2025 việc này thuộc TAND khu vực đang giải quyết vụ việc"]},{"t":"2.3.1.a. Thẩm quyền của TAND khu vực","cs":"Điều 35, 36 BLTTDS (sửa đổi 2025); Nghị quyết 81/2025/UBTVQH15","b":["Sơ thẩm các tranh chấp tại Điều 26, 28, 30, 32 và các yêu cầu tại Điều 27, 29, 31, 33","Kể cả vụ việc có đương sự hoặc tài sản ở nước ngoài, cần ủy thác tư pháp; kể cả yêu cầu hủy quyết định cá biệt trái pháp luật","Ngoại lệ: yêu cầu hủy, đăng ký phán quyết trọng tài vụ việc thuộc TAND cấp tỉnh","Một số việc khác: xét tính hợp pháp của cuộc đình công (Hội đồng 3 Thẩm phán); bắt giữ tàu bay, tàu biển; xét miễn, giảm nghĩa vụ thi hành án khoản thu nộp ngân sách"],"c":[{"t":"Các Tòa chuyên trách (Điều 36)","cs":"","b":["Tòa Dân sự: vụ việc dân sự, lao động","Tòa Kinh tế: vụ việc kinh doanh, thương mại","Tòa Sở hữu trí tuệ: vụ việc về sở hữu trí tuệ, chuyển giao công nghệ","Tòa Gia đình và người chưa thành niên: vụ việc hôn nhân và gia đình","Nơi chưa có Tòa chuyên trách: Chánh án phân công Thẩm phán"]},{"t":"Thẩm quyền tập trung về sở hữu trí tuệ","cs":"","b":["TAND khu vực 2 – Hà Nội: 20 tỉnh, thành phố từ Huế trở ra phía Bắc","TAND khu vực 1 – TP.HCM: 14 tỉnh, thành phố từ Đà Nẵng trở vào phía Nam"]}]},{"t":"2.3.1.b. Thẩm quyền của TAND cấp tỉnh và TAND tối cao","cs":"Điều 37, 38, 337 BLTTDS (sửa đổi 2025); Điều 2 Nghị quyết 81/2025/UBTVQH15","b":[],"c":[{"t":"TAND cấp tỉnh (Điều 37)","cs":"","b":["Phúc thẩm bản án, quyết định chưa có hiệu lực của TAND khu vực bị kháng cáo, kháng nghị","Giám đốc thẩm, tái thẩm bản án, quyết định đã có hiệu lực của TAND khu vực (Ủy ban Thẩm phán)","Hủy, đăng ký phán quyết trọng tài vụ việc: chỉ TAND Hà Nội (18 tỉnh), Đà Nẵng (7 tỉnh), TP.HCM (9 tỉnh)"]},{"t":"Tòa chuyên trách TAND cấp tỉnh (Điều 38)","cs":"","b":["Tòa Dân sự; Tòa Gia đình và người chưa thành niên; Tòa Kinh tế; Tòa Lao động: phúc thẩm theo lĩnh vực","Tòa Kinh tế TAND Hà Nội, TP.HCM: phúc thẩm vụ việc sở hữu trí tuệ, chuyển giao công nghệ của TAND khu vực 2 – Hà Nội và khu vực 1 – TP.HCM"]},{"t":"TAND tối cao","cs":"","b":["Hội đồng Thẩm phán giám đốc thẩm, tái thẩm bản án, quyết định đã có hiệu lực của TAND cấp tỉnh","Chánh án TANDTC giải quyết tranh chấp thẩm quyền giữa TAND khu vực khác tỉnh và giữa các TAND cấp tỉnh"]}]},{"t":"2.3.2.a. Thẩm quyền theo lãnh thổ","cs":"Điều 39 BLTTDS; Nghị quyết 81/2025/UBTVQH15","b":["Vụ án đã thụ lý đúng thẩm quyền thì Tòa án đó tiếp tục giải quyết dù đương sự thay đổi nơi cư trú, trụ sở (khoản 3)"],"c":[{"t":"Vụ án (khoản 1)","cs":"","b":["Nơi bị đơn cư trú, làm việc (cá nhân) hoặc có trụ sở (cơ quan, tổ chức)","Các đương sự tự thỏa thuận bằng văn bản chọn Tòa án nơi nguyên đơn cư trú, làm việc, có trụ sở","Tranh chấp về bất động sản: chỉ Tòa án nơi có bất động sản"]},{"t":"Việc dân sự (khoản 2)","cs":"","b":["Xác định theo nơi cư trú, làm việc của người bị yêu cầu hoặc người yêu cầu tùy loại việc","Ví dụ: công nhận thuận tình ly hôn do Tòa án nơi một trong các bên cư trú, làm việc giải quyết"]}]},{"t":"2.3.2.b. Thẩm quyền theo sự lựa chọn của nguyên đơn, người yêu cầu","cs":"Điều 40 BLTTDS","b":["Người yêu cầu cũng được lựa chọn Tòa án trong một số việc dân sự, hôn nhân và gia đình (khoản 2)"],"c":[{"t":"Nguyên đơn có thể chọn (khoản 1)","cs":"","b":["Không biết nơi cư trú của bị đơn: nơi cư trú, làm việc cuối cùng hoặc nơi bị đơn có tài sản","Tranh chấp từ hoạt động của chi nhánh: nơi tổ chức có trụ sở hoặc nơi có chi nhánh","Bị đơn không có nơi cư trú ở Việt Nam hoặc tranh chấp về cấp dưỡng: nơi nguyên đơn cư trú, làm việc","Bồi thường thiệt hại ngoài hợp đồng: nơi nguyên đơn cư trú, làm việc hoặc nơi xảy ra việc gây thiệt hại","Một số tranh chấp lao động: nơi nguyên đơn cư trú, làm việc","Tranh chấp phát sinh từ hợp đồng: nơi hợp đồng được thực hiện","Các bị đơn ở nhiều nơi: nơi một trong các bị đơn cư trú, làm việc, có trụ sở","Bất động sản ở nhiều nơi: nơi có một trong các bất động sản"]}]},{"t":"2.4. Chuyển vụ việc, tranh chấp thẩm quyền, nhập và tách vụ án","cs":"Điều 41, 42 BLTTDS (sửa đổi 2025)","b":[],"c":[{"t":"Chuyển vụ việc (khoản 1 Điều 41)","cs":"","b":["Sau khi thụ lý mà thấy không thuộc thẩm quyền: ra quyết định chuyển hồ sơ cho Tòa án có thẩm quyền, xóa tên vụ việc trong sổ thụ lý","Quyết định gửi ngay cho Viện kiểm sát cùng cấp, đương sự","Đương sự khiếu nại, Viện kiểm sát kiến nghị trong 03 ngày làm việc; Chánh án Tòa án đã ra quyết định giải quyết trong 03 ngày làm việc"]},{"t":"Tranh chấp về thẩm quyền (khoản 2, 3 Điều 41)","cs":"","b":["Giữa các TAND khu vực trong cùng tỉnh: Chánh án TAND cấp tỉnh giải quyết","Giữa các TAND khu vực khác tỉnh hoặc giữa các TAND cấp tỉnh: Chánh án TAND tối cao giải quyết"]},{"t":"Nhập, tách vụ án (Điều 42)","cs":"","b":["Nhập hai hoặc nhiều vụ án đã thụ lý riêng biệt nếu việc nhập và giải quyết trong cùng một vụ án bảo đảm đúng pháp luật","Tách vụ án có các yêu cầu khác nhau nếu việc tách và giải quyết bảo đảm đúng pháp luật","Ra quyết định và gửi ngay cho Viện kiểm sát cùng cấp, đương sự"]}]}]},{"t":"3. Cơ quan, người tiến hành tố tụng và người tham gia tố tụng","cs":"Điều 46–90 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); Luật 85/2025/QH15; Luật Tổ chức Tòa án nhân dân 2024","b":["Phân biệt hai nhóm chủ thể: bên tiến hành tố tụng (nhân danh quyền lực nhà nước) và bên tham gia tố tụng (bảo vệ quyền, lợi ích của mình hoặc hỗ trợ giải quyết vụ việc).","Điểm cập nhật 2025: khoản 3, khoản 4 Điều 53 và toàn bộ Điều 56 được sửa đổi theo mô hình TAND khu vực, cấp tỉnh, tối cao; gọi thống nhất là \"Thẩm tra viên Tòa án\"."],"c":[{"t":"3.1. Cơ quan tiến hành tố tụng","cs":"Điều 46, Điều 21, Điều 63–67 BLTTDS","b":["3.1.1. Khái niệm: cơ quan nhà nước có thẩm quyền giải quyết hoặc kiểm sát việc giải quyết vụ việc dân sự; gồm Tòa án nhân dân và Viện kiểm sát nhân dân (khoản 1 Điều 46)"],"c":[{"t":"3.1.2. Nhiệm vụ, quyền hạn","cs":"","b":["Tòa án: thụ lý, giải quyết vụ việc dân sự; xét xử tập thể, quyết định theo đa số (Hội đồng xét xử sơ thẩm thông thường gồm 01 Thẩm phán, 02 Hội thẩm nhân dân – Điều 63)","Viện kiểm sát: kiểm sát việc tuân theo pháp luật trong tố tụng dân sự; tham gia phiên họp sơ thẩm việc dân sự và phiên tòa sơ thẩm trong các trường hợp luật định; tham gia mọi phiên tòa, phiên họp phúc thẩm, giám đốc thẩm, tái thẩm (Điều 21)"]}]},{"t":"3.2. Người tiến hành tố tụng","cs":"Điều 46–62 BLTTDS","b":[],"c":[{"t":"3.2.1. Khái niệm, thành phần (khoản 2, khoản 3 Điều 46)","cs":"","b":["Bên Tòa án: Chánh án Tòa án, Thẩm phán, Hội thẩm nhân dân, Thẩm tra viên Tòa án, Thư ký Tòa án","Bên Viện kiểm sát: Viện trưởng Viện kiểm sát, Kiểm sát viên, Kiểm tra viên"]},{"t":"3.2.2. Nhiệm vụ, quyền hạn (Điều 47–51, 57–59)","cs":"","b":["Chánh án: tổ chức công tác giải quyết vụ việc; phân công Thẩm phán, Hội thẩm, Thẩm tra viên, Thư ký; quyết định thay đổi người tiến hành tố tụng trước phiên tòa","Thẩm phán: lập hồ sơ, thu thập chứng cứ, tiến hành hòa giải, chủ tọa hoặc tham gia xét xử","Hội thẩm: nghiên cứu hồ sơ, tham gia xét xử, ngang quyền Thẩm phán khi biểu quyết","Viện trưởng, Kiểm sát viên: kiểm sát, kháng nghị, tham gia phiên tòa, phiên họp"]},{"t":"3.2.3. Từ chối, thay đổi người tiến hành tố tụng","cs":"","b":["Căn cứ chung (Điều 52): đồng thời là đương sự, người đại diện, người thân thích của đương sự; đã tham gia với tư cách người bảo vệ, người làm chứng, người giám định, người phiên dịch; có căn cứ rõ ràng cho rằng họ có thể không vô tư","Thẩm phán, Hội thẩm (Điều 53): thêm trường hợp cùng Hội đồng xét xử mà là người thân thích với nhau; đã giải quyết vụ việc ở cấp khác và đã ra bản án, quyết định (trừ thành viên Hội đồng Thẩm phán TANDTC, Ủy ban Thẩm phán TAND cấp tỉnh); đã là Thẩm tra viên Tòa án, Thư ký, Kiểm sát viên, Kiểm tra viên trong vụ việc đó","Thủ tục (Điều 55): trước phiên tòa phải bằng văn bản nêu lý do; tại phiên tòa ghi vào biên bản","Thẩm quyền (Điều 56 sửa đổi 2025): trước phiên tòa – Chánh án (Thẩm phán là Chánh án TAND khu vực → Chánh án TAND cấp tỉnh; là Chánh án TAND cấp tỉnh → Chánh án TANDTC); tại phiên tòa – Hội đồng xét xử quyết định theo đa số, hoãn phiên tòa, Chánh án cử người thay thế trong 03 ngày làm việc","Kiểm sát viên, Kiểm tra viên (Điều 60–62): trước phiên tòa – Viện trưởng Viện kiểm sát cùng cấp (là Viện trưởng → Viện trưởng Viện kiểm sát cấp trên trực tiếp); tại phiên tòa – Hội đồng xét xử"]}]},{"t":"3.3. Người tham gia tố tụng","cs":"Điều 68–90 BLTTDS","b":["3.3.1. Khái niệm: người tham gia vào quá trình giải quyết vụ việc để bảo vệ quyền, lợi ích của mình, của người khác, hoặc hỗ trợ Tòa án giải quyết vụ việc"],"c":[{"t":"3.3.2. Đương sự (Điều 68–74)","cs":"","b":["Vụ án: nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan; việc dân sự: người yêu cầu, người có quyền lợi, nghĩa vụ liên quan","Năng lực pháp luật tố tụng dân sự: như nhau đối với mọi cá nhân, cơ quan, tổ chức (khoản 1 Điều 69)","Năng lực hành vi tố tụng dân sự: đủ 18 tuổi có đầy đủ; dưới 6 tuổi hoặc mất năng lực hành vi dân sự thì không có; từ đủ 6 đến dưới 15 tuổi do người đại diện thực hiện; từ đủ 15 đến dưới 18 tuổi đã lao động theo hợp đồng hoặc giao dịch bằng tài sản riêng được tự mình tham gia về việc đó (Điều 69)","Quyền riêng: nguyên đơn rút, thay đổi, bổ sung yêu cầu; bị đơn có yêu cầu phản tố; người có quyền lợi, nghĩa vụ liên quan có yêu cầu độc lập (Điều 71–73)","Kế thừa quyền, nghĩa vụ tố tụng khi cá nhân chết, tổ chức sáp nhập, hợp nhất, chia, tách, giải thể (Điều 74)"]},{"t":"3.3.3. Người đại diện (Điều 85–90)","cs":"","b":["Đại diện theo pháp luật và theo ủy quyền theo Bộ luật Dân sự","Ly hôn: không được ủy quyền tham gia tố tụng; cha, mẹ, người thân thích yêu cầu theo khoản 2 Điều 51 Luật Hôn nhân và gia đình là người đại diện (khoản 4 Điều 85)","Không được làm người đại diện: có quyền lợi đối lập với người được đại diện trong cùng vụ việc; cán bộ, công chức Tòa án, Viện kiểm sát, Công an, trừ trường hợp đại diện cho cơ quan mình hoặc là người đại diện theo pháp luật (Điều 87)"]},{"t":"3.3.4. Người bảo vệ quyền và lợi ích hợp pháp của đương sự (Điều 75, 76)","cs":"","b":["Luật sư; trợ giúp viên pháp lý hoặc người tham gia trợ giúp pháp lý; đại diện tổ chức đại diện tập thể lao động; công dân đủ điều kiện luật định","Bảo vệ được nhiều đương sự nếu quyền lợi không đối lập; Tòa án vào sổ đăng ký trong 03 ngày làm việc"]},{"t":"3.3.5. Người làm chứng (Điều 77, 78)","cs":"","b":["Người biết các tình tiết liên quan đến vụ việc; người mất năng lực hành vi dân sự không thể làm chứng","Được từ chối khai báo khi liên quan bí mật nhà nước, bí mật nghề nghiệp, kinh doanh, đời tư hoặc gây bất lợi cho đương sự là người thân thích của mình"]},{"t":"3.3.6. Người giám định, người phiên dịch (Điều 79–84)","cs":"","b":["Người giám định: có kiến thức, kinh nghiệm cần thiết, được trưng cầu hoặc được đương sự yêu cầu giám định","Người phiên dịch: biết tiếng Việt và ngôn ngữ của người không biết tiếng Việt; người biết chữ của người khuyết tật nhìn, ký hiệu ngôn ngữ của người khuyết tật nghe, nói cũng được coi là người phiên dịch","Từ chối, thay đổi người giám định, người phiên dịch theo Điều 84"]}]}]},{"t":"4. Chứng minh và chứng cứ trong tố tụng dân sự","cs":"Điều 6, 91–110 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); Nghị quyết 01/2026/NQ-HĐTP","b":["Ba trọng tâm: ai phải chứng minh; những tình tiết không phải chứng minh; khi nào Tòa án tự thu thập chứng cứ.","Nguyên tắc chung: đương sự có quyền và nghĩa vụ chứng minh; Tòa án chỉ hỗ trợ và thu thập chứng cứ trong trường hợp Bộ luật quy định (Điều 6)."],"c":[{"t":"4.1. Chứng minh trong tố tụng dân sự","cs":"Điều 6, 91, 92, 96–106 BLTTDS","b":[],"c":[{"t":"4.1.1. Khái niệm, ý nghĩa","cs":"","b":["Chứng minh là hoạt động của các chủ thể tố tụng nhằm xác định các tình tiết, sự kiện của vụ việc theo trình tự luật định","Ý nghĩa: là cơ sở để Tòa án giải quyết đúng vụ việc; là quyền, đồng thời là nghĩa vụ của đương sự"]},{"t":"4.1.2. Chủ thể chứng minh (Điều 91)","cs":"","b":["Đương sự có yêu cầu phải thu thập, giao nộp chứng cứ chứng minh yêu cầu có căn cứ, hợp pháp (khoản 1)","Đương sự phản đối yêu cầu của người khác phải thể hiện bằng văn bản và giao nộp chứng cứ (khoản 2)","Cơ quan, tổ chức, cá nhân khởi kiện bảo vệ quyền lợi người khác, lợi ích công cộng, lợi ích Nhà nước phải chứng minh (khoản 3)","Đảo nghĩa vụ chứng minh: người tiêu dùng khởi kiện không phải chứng minh lỗi, tổ chức, cá nhân kinh doanh phải chứng minh mình không có lỗi; người sử dụng lao động phải cung cấp tài liệu đang giữ và chứng minh trong tranh chấp đơn phương chấm dứt hợp đồng lao động, sa thải thuộc trường hợp luật cấm (khoản 1)","Hậu quả: không đưa ra đủ chứng cứ thì Tòa án giải quyết theo chứng cứ có trong hồ sơ (khoản 4)","Vai trò của Tòa án: hỗ trợ, xác minh, thu thập chứng cứ trong trường hợp luật định (Điều 6, 97)"]},{"t":"4.1.3. Đối tượng chứng minh và tình tiết không phải chứng minh (Điều 92)","cs":"","b":["Đối tượng chứng minh: các tình tiết, sự kiện làm căn cứ cho yêu cầu hoặc phản đối yêu cầu","Không phải chứng minh: tình tiết rõ ràng mà mọi người đều biết và được Tòa án thừa nhận; đã được xác định trong bản án, quyết định đã có hiệu lực của Tòa án hoặc quyết định đã có hiệu lực của cơ quan nhà nước có thẩm quyền; đã ghi trong văn bản được công chứng, chứng thực hợp pháp (khoản 1)","Nghi ngờ tính khách quan của tình tiết trong văn bản công chứng, chứng thực: Thẩm phán có thể yêu cầu xuất trình bản gốc, bản chính","Một bên thừa nhận hoặc không phản đối tình tiết do bên kia đưa ra thì bên kia không phải chứng minh (khoản 2)","Sự thừa nhận của người đại diện được coi là của đương sự nếu không vượt quá phạm vi đại diện (khoản 3)"]},{"t":"4.1.4. Phương tiện và các hoạt động chứng minh","cs":"","b":["Giao nộp tài liệu, chứng cứ (Điều 96): thời hạn do Thẩm phán ấn định, không quá thời hạn chuẩn bị xét xử sơ thẩm; giao nộp muộn phải chứng minh lý do; phải sao gửi cho đương sự khác","Đương sự tự thu thập (khoản 1 Điều 97): tài liệu, vật chứng, dữ liệu điện tử; xác định người làm chứng; yêu cầu Tòa án thu thập khi không tự thu thập được","Tòa án tiến hành (khoản 2 Điều 97): lấy lời khai, đối chất, trưng cầu giám định, định giá tài sản, xem xét thẩm định tại chỗ, ủy thác, yêu cầu cung cấp tài liệu, xác minh sự có mặt hoặc vắng mặt của đương sự tại nơi cư trú","Lấy lời khai đương sự, người làm chứng; đối chất khi lời khai mâu thuẫn (Điều 98–100)","Xem xét, thẩm định tại chỗ (Điều 101): có đại diện UBND cấp xã hoặc Công an cấp xã, cơ quan, tổ chức nơi có đối tượng; báo trước để đương sự chứng kiến","Trưng cầu giám định (Điều 102, 103): Tòa án từ chối thì đương sự tự yêu cầu giám định trước khi có quyết định đưa vụ án ra xét xử hoặc mở phiên họp; giám định chứng cứ bị tố cáo giả mạo","Định giá, thẩm định giá tài sản (Điều 104): Tòa án thành lập Hội đồng định giá khi đương sự yêu cầu, không thỏa thuận được giá hoặc thỏa thuận giá thấp để trốn tránh nghĩa vụ","Ủy thác thu thập chứng cứ (Điều 105): thực hiện trong 01 tháng kể từ ngày nhận quyết định ủy thác","Yêu cầu cung cấp tài liệu (Điều 106): cơ quan, tổ chức, cá nhân cung cấp trong 15 ngày kể từ ngày nhận yêu cầu","Phiên họp kiểm tra việc giao nộp, tiếp cận, công khai chứng cứ trong giai đoạn chuẩn bị xét xử (liên hệ Điều 208–211, Chương 7)"]}]},{"t":"4.2. Chứng cứ trong tố tụng dân sự","cs":"Điều 93–95, 107–110 BLTTDS","b":[],"c":[{"t":"4.2.1. Khái niệm, thuộc tính, phân loại","cs":"","b":["Chứng cứ là những gì có thật, được đương sự, cơ quan, tổ chức, cá nhân giao nộp, xuất trình cho Tòa án hoặc do Tòa án thu thập theo trình tự luật định, dùng làm căn cứ xác định tình tiết khách quan của vụ án (Điều 93)","Ba thuộc tính: khách quan, liên quan, hợp pháp","Phân loại: chứng cứ trực tiếp và gián tiếp; chứng cứ gốc và sao chép"]},{"t":"4.2.2. Nguồn chứng cứ và xác định chứng cứ (Điều 94, 95)","cs":"","b":["Mười nguồn: tài liệu đọc được, nghe được, nhìn được, dữ liệu điện tử; vật chứng; lời khai của đương sự; lời khai của người làm chứng; kết luận giám định; biên bản xem xét, thẩm định tại chỗ; kết quả định giá, thẩm định giá; văn bản ghi nhận sự kiện, hành vi pháp lý do người có chức năng lập; văn bản công chứng, chứng thực; nguồn khác luật quy định","Tài liệu đọc được: bản chính, bản sao có công chứng, chứng thực hoặc do cơ quan có thẩm quyền cung cấp, xác nhận","Tài liệu nghe được, nhìn được: kèm văn bản trình bày xuất xứ hoặc văn bản về việc thu âm, thu hình","Thông điệp dữ liệu điện tử (thư điện tử, tin nhắn, fax…): xác định theo pháp luật về giao dịch điện tử","Vật chứng phải là hiện vật gốc; kết luận giám định, biên bản thẩm định, kết quả định giá phải đúng thủ tục","(thêm) Chứng cứ điện tử và giao nộp trên môi trường số theo Nghị quyết 01/2026/NQ-HĐTP – chi tiết chờ đối chiếu toàn văn"]},{"t":"4.2.3. Bảo quản, đánh giá, công bố và bảo vệ chứng cứ (Điều 107–110)","cs":"","b":["Bảo quản: chứng cứ đã nộp do Tòa án bảo quản; không nộp được thì người đang lưu giữ bảo quản; nghiêm cấm hủy hoại (Điều 107)","Đánh giá: khách quan, toàn diện, đầy đủ, chính xác; đánh giá từng chứng cứ và mối liên quan giữa các chứng cứ (Điều 108)","Công bố, sử dụng công khai như nhau; trừ nội dung thuộc bí mật nhà nước, thuần phong mỹ tục, bí mật nghề nghiệp, kinh doanh, cá nhân, gia đình theo yêu cầu chính đáng (Điều 109)","Bảo vệ chứng cứ có nguy cơ bị tiêu hủy, khó thu thập: niêm phong, thu giữ, chụp ảnh, ghi âm, ghi hình, phục chế, khám nghiệm; ngăn chặn hành vi mua chuộc, đe dọa người làm chứng (Điều 110)"]}]}]},{"t":"5. Biện pháp khẩn cấp tạm thời; cấp, tống đạt, thông báo; thời hạn, thời hiệu","cs":"Điều 111–142, 170–185 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); Điều 144–157 BLDS 2015; Nghị quyết 02/2020/NQ-HĐTP","b":["Ba mảng độc lập: biện pháp khẩn cấp tạm thời (Chương VIII); cấp, tống đạt, thông báo văn bản tố tụng (Chương X); thời hạn tố tụng, thời hiệu (Chương XI).","Điểm cập nhật: Điều 135 sửa đổi bởi Luật Phòng, chống bạo lực gia đình 2022 – Tòa án được tự mình áp dụng thêm biện pháp cấm tiếp xúc (khoản 14 Điều 114)."],"c":[{"t":"5.1. Biện pháp khẩn cấp tạm thời","cs":"Điều 111–142 BLTTDS; Nghị quyết 02/2020/NQ-HĐTP","b":[],"c":[{"t":"5.1.1. Khái niệm, ý nghĩa (Điều 111)","cs":"","b":["Biện pháp Tòa án quyết định áp dụng để tạm thời giải quyết yêu cầu cấp bách, bảo vệ tính mạng, sức khỏe, tài sản, thu thập chứng cứ, bảo toàn tình trạng hiện có, bảo đảm việc giải quyết vụ án hoặc thi hành án","Tính chất: tạm thời, khẩn cấp, có hiệu lực thi hành ngay"]},{"t":"5.1.2. Các biện pháp khẩn cấp tạm thời (Điều 114, 115–132)","cs":"","b":["Nhân thân, đời sống: giao người chưa thành niên, người mất năng lực hành vi dân sự cho người khác trông nom; buộc thực hiện trước một phần nghĩa vụ cấp dưỡng; buộc thực hiện trước một phần nghĩa vụ bồi thường do tính mạng, sức khỏe bị xâm phạm; cấm tiếp xúc với nạn nhân bạo lực gia đình","Lao động: buộc người sử dụng lao động tạm ứng tiền lương, tiền bảo hiểm, chi phí cứu chữa, trợ cấp; tạm đình chỉ thi hành quyết định đơn phương chấm dứt hợp đồng lao động, sa thải","Tài sản đang tranh chấp: kê biên; cấm chuyển dịch quyền về tài sản; cấm thay đổi hiện trạng; cho thu hoạch, cho bán hoa màu, sản phẩm, hàng hóa","Tài sản của người có nghĩa vụ: phong tỏa tài khoản tại ngân hàng, tổ chức tín dụng, kho bạc; phong tỏa tài sản ở nơi gửi giữ; phong tỏa tài sản của người có nghĩa vụ","Hành vi: cấm hoặc buộc thực hiện hành vi nhất định; cấm xuất cảnh đối với người có nghĩa vụ; tạm dừng việc đóng thầu và hoạt động liên quan đến đấu thầu; bắt giữ tàu bay, tàu biển","Các biện pháp khác do luật quy định (khoản 17 Điều 114)"]},{"t":"5.1.3. Quyền yêu cầu áp dụng (Điều 111, 134, 135)","cs":"","b":["Trong quá trình giải quyết vụ án: đương sự, người đại diện hợp pháp, cơ quan, tổ chức khởi kiện theo Điều 187","Tình thế khẩn cấp (cần bảo vệ ngay chứng cứ, ngăn chặn hậu quả nghiêm trọng): yêu cầu đồng thời với việc nộp đơn khởi kiện (khoản 2 Điều 111)","Cơ quan, tổ chức khởi kiện vì lợi ích người khác, lợi ích công cộng: kiến nghị áp dụng (Điều 134)","Tòa án tự mình áp dụng khi đương sự không yêu cầu, chỉ với các biện pháp tại khoản 1, 2, 3, 4, 5 và 14 Điều 114 (Điều 135 sửa đổi 2022)"]},{"t":"5.1.4. Buộc thực hiện biện pháp bảo đảm (Điều 136)","cs":"","b":["Áp dụng khi yêu cầu các biện pháp tại khoản 6, 7, 8, 10, 11, 15, 16 Điều 114 (kê biên, cấm chuyển dịch, cấm thay đổi hiện trạng, phong tỏa, tạm dừng đấu thầu, bắt giữ tàu bay, tàu biển)","Hình thức: chứng từ bảo lãnh hoặc gửi khoản tiền, kim khí quý, đá quý, giấy tờ có giá do Tòa án ấn định","Giá trị tương đương tổn thất, thiệt hại có thể phát sinh do áp dụng không đúng","Viện kiểm sát khởi kiện vụ án dân sự công ích được miễn thực hiện biện pháp bảo đảm (Nghị quyết 205/2025/QH15)"]},{"t":"5.1.5. Thẩm quyền, thủ tục, thay đổi, hủy bỏ, hiệu lực (Điều 112, 133, 137–139)","cs":"","b":["Thẩm quyền: trước phiên tòa – một Thẩm phán; tại phiên tòa – Hội đồng xét xử (Điều 112)","Thời hạn ra quyết định: 48 giờ kể từ khi nhận đơn nếu yêu cầu cùng đơn khởi kiện trong tình thế khẩn cấp; 03 ngày làm việc nếu yêu cầu trước phiên tòa; ngay tại phiên tòa (Điều 133)","Phong tỏa tài khoản, tài sản chỉ trong phạm vi giá trị tương đương nghĩa vụ tài sản của người bị áp dụng (Điều 133)","Thay đổi, áp dụng bổ sung khi biện pháp đang áp dụng không còn phù hợp (Điều 137)","Hủy bỏ khi: người yêu cầu đề nghị; người phải thi hành đã nộp tài sản hoặc có người bảo đảm; nghĩa vụ chấm dứt; vụ án bị đình chỉ; quyết định áp dụng không đúng; căn cứ áp dụng không còn; vụ án đã giải quyết bằng bản án, quyết định có hiệu lực; Tòa án trả lại đơn khởi kiện (Điều 138)","Quyết định áp dụng, thay đổi, hủy bỏ có hiệu lực thi hành ngay (Điều 139)"]},{"t":"5.1.6. Khiếu nại, kiến nghị (Điều 140, 141)","cs":"","b":["Đương sự khiếu nại, Viện kiểm sát kiến nghị với Chánh án Tòa án đang giải quyết vụ án trong 03 ngày làm việc kể từ ngày nhận quyết định hoặc trả lời của Thẩm phán","Chánh án giải quyết trong 03 ngày làm việc; quyết định của Chánh án là quyết định cuối cùng","Tại phiên tòa: Hội đồng xét xử giải quyết, quyết định của Hội đồng xét xử là quyết định cuối cùng"]},{"t":"5.1.7. Trách nhiệm do áp dụng không đúng (Điều 113)","cs":"","b":["Người yêu cầu áp dụng không đúng gây thiệt hại cho người bị áp dụng hoặc người thứ ba thì phải bồi thường","Tòa án bồi thường theo pháp luật về trách nhiệm bồi thường của Nhà nước khi: tự mình áp dụng không đúng; áp dụng khác hoặc vượt quá yêu cầu; không áp dụng hoặc áp dụng không đúng thời hạn mà không có lý do chính đáng"]}]},{"t":"5.2. Cấp, tống đạt, thông báo văn bản tố tụng","cs":"Chương X, Điều 170–181 BLTTDS; Nghị quyết 01/2026/NQ-HĐTP","b":[],"c":[{"t":"5.2.1. Khái niệm, ý nghĩa","cs":"","b":["Hoạt động chuyển giao văn bản tố tụng để người nhận biết và thực hiện quyền, nghĩa vụ; là căn cứ tính thời hạn tố tụng","Tòa án, Viện kiểm sát, cơ quan thi hành án dân sự có nghĩa vụ cấp, tống đạt, thông báo (Điều 170)"]},{"t":"5.2.2. Văn bản phải cấp, tống đạt, thông báo (Điều 171)","cs":"","b":["Thông báo, giấy báo, giấy triệu tập, giấy mời","Bản án, quyết định của Tòa án","Quyết định kháng nghị của Viện kiểm sát; văn bản của cơ quan thi hành án dân sự","Văn bản tố tụng khác do pháp luật quy định"]},{"t":"5.2.3. Người thực hiện và tính hợp lệ (Điều 172, 174)","cs":"","b":["Người tiến hành tố tụng, người của cơ quan ban hành văn bản; UBND cấp xã hoặc cơ quan, tổ chức nơi người nhận làm việc khi Tòa án yêu cầu; nhân viên bưu chính; người có chức năng tống đạt; đương sự, người đại diện, người bảo vệ trong trường hợp luật định","Cấp, tống đạt, thông báo đúng quy định thì được coi là hợp lệ; người nhận phải nghiêm chỉnh chấp hành"]},{"t":"5.2.4. Phương thức và thủ tục (Điều 173, 175–181)","cs":"","b":["Phương thức: trực tiếp, qua bưu chính hoặc người thứ ba được ủy quyền; phương tiện điện tử theo yêu cầu của đương sự; niêm yết công khai; thông báo trên phương tiện thông tin đại chúng; phương thức khác (Điều 173)","Thời điểm tính thời hạn: ngày người nhận ký nhận hoặc xác nhận đã nhận (Điều 175)","Người nhận từ chối: lập biên bản ghi rõ lý do, có xác nhận của tổ trưởng tổ dân phố hoặc Công an cấp xã (khoản 4 Điều 177)","Người nhận vắng mặt: giao cho người thân thích có đủ năng lực hành vi dân sự cùng nơi cư trú hoặc tổ trưởng tổ dân phố, trưởng thôn, ký nhận và cam kết giao lại tận tay (khoản 5 Điều 177)","Niêm yết công khai khi không thể cấp, tống đạt trực tiếp: tại trụ sở Tòa án, UBND cấp xã nơi cư trú hoặc nơi cư trú cuối cùng, và nơi cư trú của người nhận; thời hạn 15 ngày kể từ ngày niêm yết (Điều 179)","Thông báo trên phương tiện thông tin đại chúng khi luật quy định hoặc niêm yết không bảo đảm người nhận biết: Cổng thông tin điện tử của Tòa án và báo hàng ngày trung ương ba số liên tiếp; đài phát thanh hoặc truyền hình trung ương ba lần trong 03 ngày liên tiếp (Điều 180)","Thông báo kết quả cấp, tống đạt cho Tòa án (Điều 181)","(thêm) Cấp, tống đạt, thông báo trên môi trường số theo Nghị quyết 01/2026/NQ-HĐTP – chi tiết chờ đối chiếu toàn văn"]}]},{"t":"5.3. Thời hạn tố tụng, thời hiệu khởi kiện và thời hiệu yêu cầu","cs":"Chương XI, Điều 182–185 BLTTDS; Điều 144–157 BLDS 2015","b":[],"c":[{"t":"5.3.1. Thời hạn tố tụng (Điều 182, 183)","cs":"","b":["Khoảng thời gian xác định từ thời điểm này đến thời điểm khác để người tiến hành tố tụng, người tham gia tố tụng thực hiện hành vi tố tụng; tính bằng giờ, ngày, tuần, tháng, năm hoặc bằng sự kiện có thể xảy ra","Cách tính áp dụng BLDS: thời hạn tính bằng ngày bắt đầu từ ngày tiếp theo của ngày xảy ra sự kiện (Điều 147 BLDS); ngày cuối cùng là ngày nghỉ cuối tuần, nghỉ lễ thì kết thúc vào ngày làm việc tiếp theo (Điều 148 BLDS)"],"c":[{"t":"Một số thời hạn hay gặp","cs":"","b":["Niêm yết công khai: 15 ngày (Điều 179)","Ủy thác thu thập chứng cứ: 01 tháng; cung cấp tài liệu theo yêu cầu: 15 ngày (Điều 105, 106)","Ra quyết định áp dụng biện pháp khẩn cấp tạm thời: 48 giờ hoặc 03 ngày làm việc; khiếu nại: 03 ngày làm việc (Điều 133, 140)","Các thời hạn khởi kiện, chuẩn bị xét xử, kháng cáo, kháng nghị: học tại Chương 7, 8, 10"]}]},{"t":"5.3.2. Thời hiệu khởi kiện, thời hiệu yêu cầu (Điều 184, 185)","cs":"","b":["Áp dụng quy định của BLDS về thời hiệu (Điều 184 khoản 1, Điều 185); thời hiệu khởi kiện tính từ ngày người có quyền yêu cầu biết hoặc phải biết quyền, lợi ích bị xâm phạm (Điều 154 BLDS)","Tòa án chỉ áp dụng thời hiệu theo yêu cầu của một bên hoặc các bên, đưa ra trước khi Tòa án cấp sơ thẩm ra bản án, quyết định; người được hưởng lợi có quyền từ chối áp dụng, trừ khi nhằm trốn tránh nghĩa vụ (khoản 2 Điều 184)","Không áp dụng thời hiệu khởi kiện: bảo vệ quyền nhân thân không gắn với tài sản; bảo vệ quyền sở hữu (trừ luật có quy định khác); tranh chấp quyền sử dụng đất theo Luật Đất đai; trường hợp khác luật quy định (Điều 155 BLDS)","Thời gian không tính vào thời hiệu: sự kiện bất khả kháng, trở ngại khách quan; người có quyền là người chưa thành niên, mất năng lực hành vi dân sự… chưa có người đại diện (Điều 156 BLDS)","Bắt đầu lại thời hiệu khởi kiện từ ngày tiếp theo khi bên có nghĩa vụ thừa nhận hoặc thực hiện xong một phần nghĩa vụ, hoặc các bên tự hòa giải (Điều 157 BLDS)","Một số thời hiệu cụ thể: hợp đồng 03 năm (Điều 429 BLDS); bồi thường thiệt hại 03 năm (Điều 588 BLDS); chia di sản 30 năm với bất động sản, 10 năm với động sản (Điều 623 BLDS)"]}]}]},{"t":"6. Án phí, lệ phí và chi phí tố tụng","cs":"Điều 143–169 BLTTDS (VBHN 21/VBHN-VPQH ngày 12/02/2026); Nghị quyết 326/2016/UBTVQH14 và Danh mục án phí, lệ phí Tòa án kèm theo","b":["Hai căn cứ song song: BLTTDS quy định ai nộp tạm ứng, ai chịu; Nghị quyết 326/2016/UBTVQH14 quy định mức thu, thời hạn nộp, các trường hợp không phải nộp, miễn, giảm.","Điểm cập nhật: Viện kiểm sát khởi kiện vụ án dân sự để bảo vệ nhóm dễ bị tổn thương, lợi ích công không phải nộp tạm ứng án phí, không phải chịu án phí (Nghị quyết 205/2025/QH15)."],"c":[{"t":"6.1. Án phí và lệ phí","cs":"Điều 143–150 BLTTDS; Nghị quyết 326/2016/UBTVQH14","b":[],"c":[{"t":"6.1.1. Khái niệm, ý nghĩa, các loại án phí, lệ phí (Điều 143 BLTTDS; Điều 3, 4, 24 Nghị quyết 326/2016/UBTVQH14)","cs":"","b":["Án phí: khoản tiền đương sự phải nộp vào ngân sách nhà nước khi vụ án được Tòa án giải quyết","Lệ phí: khoản tiền phải nộp khi được Tòa án giải quyết việc dân sự hoặc thực hiện công việc khác theo luật (cấp bản sao bản án, quyết định…)","Tiền tạm ứng án phí, tạm ứng lệ phí: khoản tiền nộp trước theo mức Tòa án báo, được xử lý khi có bản án, quyết định giải quyết","Ý nghĩa: bù đắp một phần chi phí xét xử cho ngân sách; nâng cao trách nhiệm của đương sự, hạn chế khởi kiện, kháng cáo thiếu căn cứ; khuyến khích hòa giải (hòa giải thành chỉ chịu 50% án phí)","Án phí sơ thẩm và án phí phúc thẩm","Vụ án không có giá ngạch: yêu cầu không phải là một số tiền hoặc không xác định được giá trị bằng tiền (ví dụ ly hôn không tranh chấp tài sản); vụ án có giá ngạch: yêu cầu xác định được giá trị bằng một số tiền cụ thể","Lệ phí giải quyết việc dân sự (sơ thẩm, phúc thẩm) và các lệ phí khác"]},{"t":"6.1.2. Mức án phí, lệ phí (Danh mục kèm Nghị quyết 326/2016/UBTVQH14)","cs":"","b":["Án phí sơ thẩm không có giá ngạch: tranh chấp dân sự, hôn nhân và gia đình, lao động 300.000 đồng; kinh doanh, thương mại 3.000.000 đồng","Kinh doanh, thương mại có giá ngạch: đến 60.000.000 đồng là 3.000.000 đồng; trên 60.000.000 đến 400.000.000 đồng là 5%; từ trên 400.000.000 đồng tính như tranh chấp dân sự","Lao động có giá ngạch: đến 6.000.000 đồng là 300.000 đồng; trên 6.000.000 đến 400.000.000 đồng là 3%; trên 400.000.000 đến 2.000.000.000 đồng là 12.000.000 đồng + 2% phần vượt; trên 2.000.000.000 đồng là 44.000.000 đồng + 0,1% phần vượt","Án phí phúc thẩm: dân sự, hôn nhân và gia đình, lao động 300.000 đồng; kinh doanh, thương mại 2.000.000 đồng","Lệ phí giải quyết việc dân sự: sơ thẩm 300.000 đồng; phúc thẩm 300.000 đồng","Ví dụ tính: tranh chấp 1.000.000.000 đồng → 36.000.000 + 3% × 200.000.000 = 42.000.000 đồng; tạm ứng án phí bằng 50% là 21.000.000 đồng"],"c":[{"t":"Án phí sơ thẩm có giá ngạch – tranh chấp dân sự, hôn nhân và gia đình","cs":"","b":["Đến 6.000.000 đồng: 300.000 đồng","Trên 6.000.000 đến 400.000.000 đồng: 5% giá trị tài sản có tranh chấp","Trên 400.000.000 đến 800.000.000 đồng: 20.000.000 đồng + 4% phần vượt quá 400.000.000 đồng","Trên 800.000.000 đến 2.000.000.000 đồng: 36.000.000 đồng + 3% phần vượt quá 800.000.000 đồng","Trên 2.000.000.000 đến 4.000.000.000 đồng: 72.000.000 đồng + 2% phần vượt quá 2.000.000.000 đồng","Trên 4.000.000.000 đồng: 112.000.000 đồng + 0,1% phần vượt quá 4.000.000.000 đồng"]}]},{"t":"6.1.3. Tạm ứng án phí; nghĩa vụ nộp tạm ứng, nghĩa vụ chịu án phí, lệ phí (Điều 146–149, 195, 276 BLTTDS; Điều 7, 17, 25–29 Nghị quyết 326/2016/UBTVQH14)","cs":"","b":["Mức tạm ứng án phí sơ thẩm: vụ án không có giá ngạch bằng mức án phí; vụ án có giá ngạch bằng 50% mức án phí tính trên giá trị tài sản tranh chấp do đương sự yêu cầu, không thấp hơn mức không có giá ngạch; tạm ứng án phí phúc thẩm bằng mức án phí phúc thẩm","Người nộp tạm ứng án phí sơ thẩm: nguyên đơn, bị đơn có yêu cầu phản tố, người có quyền lợi, nghĩa vụ liên quan có yêu cầu độc lập; người kháng cáo nộp tạm ứng án phí phúc thẩm, trừ trường hợp được miễn hoặc không phải nộp","Thời hạn nộp: tạm ứng án phí sơ thẩm 07 ngày kể từ ngày nhận thông báo; tạm ứng án phí phúc thẩm 10 ngày; tạm ứng lệ phí giải quyết việc dân sự 05 ngày làm việc","Chịu án phí sơ thẩm: đương sự có yêu cầu không được Tòa án chấp nhận; chấp nhận một phần thì mỗi bên chịu phần tương ứng","Chia tài sản chung: mỗi người chịu án phí tương ứng với giá trị phần tài sản được chia","Hòa giải thành trước khi mở phiên tòa: các đương sự chỉ chịu 50% mức án phí sơ thẩm","Ly hôn: nguyên đơn chịu án phí sơ thẩm, không phụ thuộc vào việc Tòa án chấp nhận hay không chấp nhận yêu cầu; thuận tình ly hôn thì mỗi bên chịu một nửa","Án phí phúc thẩm: người kháng cáo chịu nếu bản án, quyết định sơ thẩm bị kháng cáo được giữ nguyên; bị sửa thì không phải chịu và Tòa án cấp phúc thẩm xác định lại án phí sơ thẩm; bị hủy để giải quyết lại thì không phải chịu","Lệ phí: người yêu cầu giải quyết việc dân sự chịu; t
