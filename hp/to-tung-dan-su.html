</head><body><script id="PNLIB_COURSE_GATE">
(function(){
  const courseId="to-tung-dan-su";
  function today(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let access=false;
  try{
    const raw=localStorage.getItem("pnlib-ma-lop");
    const session=raw?JSON.parse(raw):null;
    const scopes=session&&Array.isArray(session.courses)?session.courses:null;
    access=!!(session&&session.code&&session.han&&today()<=session.han&&(!scopes||!scopes.length||scopes.includes("*")||scopes.includes(courseId)));
  }catch(e){access=false}
  if(!access){
    document.documentElement.style.visibility="hidden";
    if(window.top!==window.self){
      window.parent.postMessage({pn:"home",course:courseId},"*");
    }else{
      window.location.replace("../index.html#"+courseId);
    }
  }
})();
</script>

sự, vụ việc dân sự bao gồm những loại nào?","o":["Vụ án dân sự và vụ án hành chính","Việc dân sự và việc thi hành án hình sự","Vụ án dân sự và việc dân sự","Tranh chấp dân sự và khiếu nại hành chính"],"a":2,"e":"Điều 1 BLTTDS phân biệt hai loại: vụ án dân sự (có tranh chấp) và việc dân sự (yêu cầu không có tranh chấp, Điều 361). Khiếu nại hành chính, vụ án hành chính thuộc tố tụng hành chính; thi hành án hình sự không phải vụ việc dân sự.","b":"Điều 1, Điều 361 BLTTDS"},{"id":"1.02","g":1,"lv":"TH","q":"Đặc điểm nào phân biệt việc dân sự với vụ án dân sự?","o":["Luôn có yếu tố nước ngoài nên thuộc thẩm quyền của Tòa án nhân dân cấp tỉnh","Chỉ được khởi động khi Viện kiểm sát kiến nghị Tòa án xem xét, giải quyết","Có tranh chấp giữa nguyên đơn và bị đơn về quyền, nghĩa vụ dân sự, phải được giải quyết bằng bản án","Không có tranh chấp, chỉ có yêu cầu Tòa án công nhận hoặc không công nhận một sự kiện pháp lý, quyền của mình"],"a":3,"e":"Việc dân sự là trường hợp không có tranh chấp, cá nhân, cơ quan, tổ chức chỉ yêu cầu Tòa án công nhận hoặc không công nhận một sự kiện pháp lý hay quyền dân sự của mình (Điều 361). Có tranh chấp giữa nguyên đơn và bị đơn là đặc điểm của vụ án; việc dân sự không phụ thuộc kiến nghị của Viện kiểm sát hay yếu tố nước ngoài.","b":"Điều 361 BLTTDS"},{"id":"1.03","g":1,"lv":"TH","q":"Hoạt động tố tụng dân sự do cơ quan đại diện của Việt Nam ở nước ngoài tiến hành được áp dụng pháp luật tố tụng nào?","o":["Pháp luật tố tụng của nước nơi cơ quan đại diện đóng trụ sở","Pháp luật tố tụng do các đương sự lựa chọn","Bộ luật Tố tụng dân sự Việt Nam","Tập quán ngoại giao giữa hai nước"],"a":2,"e":"Khoản 2 Điều 2 BLTTDS: BLTTDS được áp dụng đối với hoạt động tố tụng dân sự do cơ quan đại diện nước Cộng hòa xã hội chủ nghĩa Việt Nam ở nước ngoài tiến hành. Các bên không được tự chọn pháp luật tố tụng; pháp luật nước sở tại hay tập quán ngoại giao không thay thế BLTTDS.","b":"Khoản 2 Điều 2 BLTTDS"},{"id":"1.04","g":1,"lv":"TH","q":"Khi giải quyết vụ việc dân sự có yếu tố nước ngoài, nếu điều ước quốc tế mà Việt Nam là thành viên có quy định khác với BLTTDS thì Tòa án áp dụng quy định nào?","o":["Quy định do Chánh án Tòa án nhân dân tối cao hướng dẫn riêng cho vụ việc","Quy định của điều ước quốc tế đó","Quy định của BLTTDS vì là luật trong nước","Quy định có lợi hơn cho nguyên đơn"],"a":1,"e":"Khoản 3 Điều 2 BLTTDS ghi nhận nguyên tắc ưu tiên áp dụng điều ước quốc tế mà Việt Nam là thành viên khi điều ước có quy định khác BLTTDS. Không có quy tắc chọn quy định có lợi cho nguyên đơn hay hướng dẫn riêng của Chánh án cho từng vụ việc.","b":"Khoản 3 Điều 2 BLTTDS"},{"id":"1.05","g":1,"lv":"TH","q":"Vụ việc dân sự liên quan đến người nước ngoài được hưởng quyền ưu đãi, miễn trừ ngoại giao được giải quyết bằng cách nào?","o":["Chuyển cho Tòa án nước mà người đó mang quốc tịch giải quyết","Tòa án nhân dân cấp tỉnh xét xử kín","Tòa án nhân dân khu vực nơi người đó cư trú thụ lý như vụ việc thông thường","Giải quyết bằng con đường ngoại giao"],"a":3,"e":"Khoản 4 Điều 2 BLTTDS: vụ việc dân sự có liên quan đến cá nhân, cơ quan, tổ chức nước ngoài thuộc đối tượng được hưởng quyền ưu đãi, miễn trừ ngoại giao hoặc lãnh sự thì được giải quyết bằng con đường ngoại giao. Tòa án Việt Nam không thụ lý như vụ việc thông thường.","b":"Khoản 4 Điều 2 BLTTDS"},{"id":"1.06","g":1,"lv":"TH","q":"Quyền rút đơn khởi kiện và quyền thỏa thuận về việc giải quyết vụ án của đương sự là biểu hiện của phương pháp điều chỉnh nào?","o":["Phương pháp định đoạt","Phương pháp kiểm sát","Phương pháp mệnh lệnh","Phương pháp giám đốc"],"a":0,"e":"Đương sự có quyền quyết định việc khởi kiện, phạm vi yêu cầu, quyền rút yêu cầu, thỏa thuận với nhau (Điều 5 BLTTDS). Đây là biểu hiện của phương pháp định đoạt, đặc trưng của tố tụng dân sự; phương pháp mệnh lệnh đặc trưng cho quan hệ giữa cơ quan tiến hành tố tụng với người tham gia tố tụng.","b":"Điều 5 BLTTDS (Giáo trình Luật TTDS)"},{"id":"1.07","g":1,"lv":"TH","q":"Tòa án nhận được đơn yêu cầu giải quyết một vụ việc dân sự mà chưa có điều luật để áp dụng. Tòa án phải xử lý thế nào?","o":["Không được từ chối; áp dụng tập quán, tương tự pháp luật, nguyên tắc cơ bản, án lệ, lẽ công bằng","Đình chỉ giải quyết và kiến nghị cơ quan có thẩm quyền ban hành luật","Chuyển hồ sơ để Ủy ban Thường vụ Quốc hội giải thích pháp luật trước khi thụ lý","Trả lại đơn và hướng dẫn đương sự chờ đến khi có văn bản pháp luật điều chỉnh"],"a":0,"e":"Khoản 2 Điều 4 BLTTDS: Tòa án không được từ chối giải quyết vụ việc dân sự vì lý do chưa có điều luật để áp dụng. Theo Điều 45, Tòa án áp dụng tập quán, tương tự pháp luật, các nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng. Trả lại đơn, đình chỉ hay chờ giải thích luật đều trái nguyên tắc này.","b":"Khoản 2 Điều 4, Điều 45 BLTTDS"},{"id":"1.08","g":1,"lv":"TH","q":"Theo nguyên tắc quyền quyết định và tự định đoạt của đương sự, Tòa án giải quyết vụ việc dân sự trong phạm vi nào?","o":["Toàn bộ các quan hệ pháp luật mà Tòa án phát hiện trong hồ sơ","Theo chỉ đạo của Chánh án Tòa án cấp trên trực tiếp","Trong phạm vi đơn khởi kiện, đơn yêu cầu của đương sự","Theo đề nghị của Viện kiểm sát cùng cấp"],"a":2,"e":"Khoản 1 Điều 5 BLTTDS: Tòa án chỉ thụ lý, giải quyết vụ việc dân sự khi có đơn khởi kiện, đơn yêu cầu và chỉ giải quyết trong phạm vi đơn khởi kiện, đơn yêu cầu đó. Tòa án không tự mở rộng sang các quan hệ phát hiện trong hồ sơ, cũng không giải quyết theo đề nghị của Viện kiểm sát hay chỉ đạo cấp trên.","b":"Khoản 1 Điều 5 BLTTDS"},{"id":"1.09","g":1,"lv":"TH","q":"Nhận định nào đúng với nguyên tắc cung cấp chứng cứ và chứng minh trong tố tụng dân sự?","o":["Chỉ nguyên đơn có nghĩa vụ cung cấp chứng cứ, bị đơn chỉ có quyền phản đối","Tòa án có nghĩa vụ thu thập toàn bộ chứng cứ thay cho đương sự để bảo đảm khách quan","Viện kiểm sát thu thập chứng cứ cho mọi đương sự là cá nhân ngay từ khi Tòa án thụ lý","Đương sự chủ động thu thập, giao nộp chứng cứ; Tòa án chỉ thu thập chứng cứ trong trường hợp BLTTDS quy định"],"a":3,"e":"Điều 6 BLTTDS: đương sự có quyền và nghĩa vụ chủ động thu thập, giao nộp chứng cứ và chứng minh yêu cầu của mình là có căn cứ; Tòa án chỉ thu thập chứng cứ trong những trường hợp BLTTDS quy định. Nghĩa vụ chứng minh thuộc về mọi đương sự có yêu cầu hoặc phản đối yêu cầu, không chỉ nguyên đơn.","b":"Điều 6 BLTTDS"},{"id":"1.10","g":1,"lv":"TH","q":"Theo BLTTDS, trách nhiệm tiến hành hòa giải trong quá trình giải quyết vụ án dân sự thuộc về chủ thể nào?","o":["Viện kiểm sát","Ủy ban nhân dân cấp xã nơi bị đơn cư trú","Tòa án","Hòa giải viên theo Luật Hòa giải, đối thoại tại Tòa án"],"a":2,"e":"Điều 10 BLTTDS: Tòa án có trách nhiệm tiến hành hòa giải và tạo điều kiện thuận lợi để các đương sự thỏa thuận với nhau. Hòa giải viên theo Luật Hòa giải, đối thoại tại Tòa án hoạt động trước khi thụ lý; Viện kiểm sát và Ủy ban nhân dân xã không có trách nhiệm hòa giải trong tố tụng.","b":"Điều 10 BLTTDS"},{"id":"1.11","g":1,"lv":"TH","q":"Trường hợp nào việc xét xử sơ thẩm vụ án dân sự không có Hội thẩm nhân dân tham gia?","o":["Vụ án tranh chấp về kinh doanh, thương mại","Vụ án có giá trị tranh chấp dưới 100 triệu đồng","Xét xử theo thủ tục rút gọn","Vụ án có yếu tố nước ngoài"],"a":2,"e":"Khoản 1 Điều 11 BLTTDS: việc xét xử sơ thẩm vụ án dân sự có Hội thẩm nhân dân tham gia, trừ trường hợp xét xử theo thủ tục rút gọn (một Thẩm phán). Tính chất kinh doanh thương mại, yếu tố nước ngoài hay giá trị tranh chấp không loại trừ Hội thẩm.","b":"Khoản 1 Điều 11 BLTTDS"},{"id":"1.12","g":1,"lv":"TH","q":"Tòa án có thể xét xử kín vụ án dân sự trong trường hợp nào sau đây?","o":["Cần bảo vệ người chưa thành niên","Bị đơn vắng mặt tại phiên tòa lần thứ hai","Đương sự là cán bộ, công chức nhà nước","Vụ án có giá trị tranh chấp lớn"],"a":0,"e":"Khoản 2 Điều 15 BLTTDS: Tòa án có thể xét xử kín khi cần giữ bí mật nhà nước, giữ gìn thuần phong mỹ tục, bảo vệ người chưa thành niên hoặc giữ bí mật nghề nghiệp, bí mật kinh doanh, bí mật cá nhân, bí mật gia đình theo yêu cầu chính đáng. Việc bị đơn vắng mặt, tư cách công chức hay giá trị tranh chấp lớn không phải căn cứ.","b":"Khoản 2 Điều 15 BLTTDS"},{"id":"1.13","g":1,"lv":"TH","q":"Nhận định nào đúng với nguyên tắc chế độ hai cấp xét xử?","o":["Mọi bản án sơ thẩm đều phải được xét xử phúc thẩm","Giám đốc thẩm, tái thẩm không phải là một cấp xét xử","Tòa án nhân dân tối cao là cấp xét xử thứ ba","Bản án phúc thẩm có thể bị kháng cáo lên Tòa án nhân dân tối cao"],"a":1,"e":"Điều 17 BLTTDS: chế độ xét xử sơ thẩm, phúc thẩm được bảo đảm; giám đốc thẩm, tái thẩm là thủ tục xem xét lại bản án đã có hiệu lực, không phải một cấp xét xử. Bản án sơ thẩm chỉ bị phúc thẩm khi có kháng cáo, kháng nghị; bản án phúc thẩm có hiệu lực ngay, không bị kháng cáo tiếp.","b":"Điều 17 BLTTDS"},{"id":"1.14","g":1,"lv":"VD","q":"Viện kiểm sát phải tham gia phiên tòa sơ thẩm vụ án dân sự nào sau đây?","o":["Tranh chấp hợp đồng vay giữa hai cá nhân đã thành niên, đương sự tự nộp đủ chứng cứ","Tranh chấp tiền thuê xe giữa hai cá nhân đã thành niên, đương sự tự nộp đủ chứng cứ","Tranh chấp hợp đồng mua bán hàng hóa giữa hai công ty, đương sự tự nộp đủ chứng cứ","Tranh chấp quyền sử dụng đất giữa hai hộ gia đình liền kề"],"a":3,"e":"Khoản 2 Điều 21 BLTTDS: Viện kiểm sát tham gia phiên tòa sơ thẩm đối với vụ việc do Tòa án tiến hành thu thập chứng cứ, vụ việc có đối tượng tranh chấp là tài sản công, lợi ích công cộng, quyền sử dụng đất, nhà ở, hoặc có đương sự là người chưa thành niên, người mất năng lực hành vi dân sự… Tranh chấp quyền sử dụng đất thuộc trường hợp này; các tranh chấp hợp đồng giữa đương sự thành niên tự nộp đủ chứng cứ thì không.","b":"Khoản 2 Điều 21 BLTTDS"},{"id":"TH1.01.1","g":1,"lv":"VD","q":"Trước khi xét xử, ông An và bà Bình thỏa thuận: bà Bình trả 300 triệu đồng trong 3 tháng, ông An không đòi tiền lãi. Thỏa thuận này được Tòa án công nhận khi đáp ứng điều kiện nào?","o":["Được Viện kiểm sát cùng cấp phê chuẩn trước khi Tòa án công nhận","Có lợi cho nguyên đơn hơn so với nội dung yêu cầu khởi kiện ban đầu","Các bên tự nguyện, nội dung không vi phạm điều cấm của luật và không trái đạo đức xã hội","Được lập thành văn bản có công chứng tại tổ chức hành nghề công chứng"],"a":2,"e":"Khoản 2 Điều 5 BLTTDS: đương sự có quyền tự thỏa thuận với nhau; Tòa án công nhận thỏa thuận khi các bên tự nguyện và nội dung không vi phạm điều cấm của luật, không trái đạo đức xã hội. Không cần Viện kiểm sát phê chuẩn hay công chứng; thỏa thuận cũng không đòi hỏi phải có lợi hơn cho nguyên đơn.","b":"Khoản 2 Điều 5 BLTTDS","cid":"TH1.01"},{"id":"TH1.01.2","g":1,"lv":"VD","q":"Tại phiên tòa, Thẩm phán nhận thấy ông An có quyền đòi thêm tiền phạt vi phạm theo hợp đồng. Hội đồng xét xử có giải quyết khoản tiền phạt này không?","o":["Không, vì Tòa án chỉ giải quyết trong phạm vi yêu cầu của đương sự","Có, nếu bà Bình không phản đối","Có, nếu Kiểm sát viên đề nghị tại phiên tòa","Có, vì Tòa án phải bảo vệ triệt để quyền lợi của nguyên đơn"],"a":0,"e":"Khoản 1 Điều 5 BLTTDS: Tòa án chỉ giải quyết trong phạm vi đơn khởi kiện. Ông An không yêu cầu tiền phạt nên Hội đồng xét xử không được tự giải quyết khoản này, dù Kiểm sát viên đề nghị hay bị đơn không phản đối.","b":"Khoản 1 Điều 5 BLTTDS","cid":"TH1.01"},{"id":"TH1.01.3","g":1,"lv":"VD","q":"Giả sử hai bên không thỏa thuận được. Tại phiên tòa sơ thẩm, ông An tự nguyện rút yêu cầu đòi tiền lãi. Hội đồng xét xử xử lý thế nào?","o":["Vẫn xét xử yêu cầu tiền lãi để bảo vệ quyền lợi của nguyên đơn","Chấp nhận và đình chỉ xét xử đối với phần yêu cầu tiền lãi đã rút","Không chấp nhận vì đã mở phiên tòa","Tạm đình chỉ giải quyết toàn bộ vụ án"],"a":1,"e":"Đương sự có quyền rút yêu cầu (Điều 5). Khoản 2 Điều 244 BLTTDS: trường hợp có đương sự rút một phần yêu cầu và việc rút là tự nguyện thì Hội đồng xét xử chấp nhận và đình chỉ xét xử đối với phần yêu cầu đã rút; phần còn lại vẫn được xét xử, không tạm đình chỉ toàn bộ vụ án.","b":"Điều 5, khoản 2 Điều 244 BLTTDS","cid":"TH1.01"},{"id":"TH1.02.1","g":1,"lv":"VD","q":"Viện kiểm sát có phải tham gia phiên tòa sơ thẩm vụ án này không?","o":["Không, vì Viện kiểm sát chỉ tham gia phiên tòa phúc thẩm vụ án dân sự","Có, vì đối tượng tranh chấp là quyền sử dụng đất và có đương sự là người chưa thành niên","Chỉ tham gia khi bà Hoa có đơn yêu cầu Viện kiểm sát tham gia phiên tòa","Chỉ tham gia nếu Tòa án đã tự mình thu thập chứng cứ trong vụ án"],"a":1,"e":"Khoản 2 Điều 21 BLTTDS: Viện kiểm sát tham gia phiên tòa sơ thẩm đối với vụ việc có đối tượng tranh chấp là quyền sử dụng đất hoặc có đương sự là người chưa thành niên. Tình huống có cả hai yếu tố nên Viện kiểm sát bắt buộc tham gia, không phụ thuộc yêu cầu của đương sự.","b":"Khoản 2 Điều 21 BLTTDS","cid":"TH1.02"},{"id":"TH1.02.2","g":1,"lv":"VD","q":"Bà Hoa muốn trình bày bằng tiếng Tày tại phiên tòa. Yêu cầu này được giải quyết thế nào?","o":["Không được, mọi lời trình bày tại phiên tòa phải bằng tiếng Việt","Được, nhưng bà Hoa phải tự nộp bản dịch có công chứng trước phiên tòa","Bà Hoa được dùng tiếng Tày; khi đó cần có người phiên dịch","Được, và Hội đồng xét xử phải tiến hành phiên tòa bằng tiếng Tày"],"a":2,"e":"Điều 20 BLTTDS: tiếng nói và chữ viết dùng trong tố tụng dân sự là tiếng Việt; người tham gia tố tụng có quyền dùng tiếng nói và chữ viết của dân tộc mình, trường hợp này phải có người phiên dịch. Phiên tòa vẫn tiến hành bằng tiếng Việt; bà Hoa không phải tự nộp bản dịch công chứng.","b":"Điều 20 BLTTDS","cid":"TH1.02"},{"id":"TH1.02.3","g":1,"lv":"VD","q":"Đề nghị không xét xử công khai của ông Tùng được giải quyết thế nào?","o":["Chỉ được xét xử kín khi Viện kiểm sát đồng ý bằng văn bản","Phải hoãn phiên tòa để xin ý kiến Chánh án Tòa án nhân dân tối cao","Không được, mọi phiên tòa dân sự đều phải xét xử công khai","Tòa án có thể xét xử kín nếu đây là yêu cầu chính đáng nhằm giữ bí mật gia đình"],"a":3,"e":"Khoản 2 Điều 15 BLTTDS cho phép xét xử kín khi có yêu cầu chính đáng của đương sự nhằm giữ bí mật cá nhân, bí mật gia đình. Không cần Viện kiểm sát đồng ý hay xin ý kiến Chánh án Tòa án nhân dân tối cao; bản án vẫn phải tuyên công khai.","b":"Khoản 2 Điều 15 BLTTDS","cid":"TH1.02"},{"id":"2.01","g":2,"lv":"TH","q":"Tranh chấp hợp đồng vay tài sản giữa hai cá nhân cư trú tại Việt Nam, không có yếu tố nước ngoài, thuộc thẩm quyền giải quyết sơ thẩm của Tòa án nào?","o":["Tòa án nhân dân khu vực","Tòa án nhân dân cấp tỉnh","Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Tòa Phúc thẩm Tòa án nhân dân tối cao"],"a":0,"e":"Tranh chấp hợp đồng dân sự giữa hai cá nhân là tranh chấp về dân sự (khoản 3 Điều 26). Theo khoản 1 Điều 35 BLTTDS (sửa đổi bởi Luật 85/2025/QH15), Tòa án nhân dân khu vực giải quyết theo thủ tục sơ thẩm. Tòa án cấp tỉnh không còn xét xử sơ thẩm vụ án dân sự thông thường; Tòa Phúc thẩm và Ủy ban Thẩm phán không có thẩm quyền sơ thẩm.","b":"Khoản 3 Điều 26, khoản 1 Điều 35 BLTTDS"},{"id":"2.02","g":2,"lv":"TH","q":"Từ ngày 01/7/2025, tranh chấp dân sự có đương sự ở nước ngoài thuộc thẩm quyền giải quyết sơ thẩm của Tòa án nhân dân cấp nào?","o":["Cấp tỉnh do nguyên đơn lựa chọn","Cấp tỉnh nơi bị đơn cư trú","Cấp khu vực","Cấp tối cao"],"a":2,"e":"Luật 85/2025/QH15 sửa Điều 35 BLTTDS theo mô hình Tòa án ba cấp từ 01/7/2025: Tòa án nhân dân khu vực giải quyết sơ thẩm cả vụ việc có đương sự hoặc tài sản ở nước ngoài. Tòa án cấp tỉnh chủ yếu xét xử phúc thẩm; không có cơ chế nguyên đơn chọn Tòa án cấp tỉnh.","b":"Điều 35 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"2.03","g":2,"lv":"TH","q":"Yêu cầu hủy phán quyết trọng tài vụ việc thuộc thẩm quyền giải quyết của Tòa án nào?","o":["Tòa án nhân dân khu vực nơi Hội đồng trọng tài ra phán quyết","Ba Tòa án nhân dân thành phố Hà Nội, Đà Nẵng, Thành phố Hồ Chí Minh, mỗi Tòa theo phạm vi lãnh thổ được giao","Tòa án cấp tỉnh ở bất kỳ địa phương nào mà các bên lựa chọn","Hội đồng Thẩm phán Tòa án nhân dân tối cao"],"a":1,"e":"Yêu cầu hủy phán quyết trọng tài thuộc thẩm quyền của một số Tòa án nhân dân cấp tỉnh được giao. Theo Nghị quyết 81/2025/UBTVQH15, thẩm quyền này giao cho Tòa án nhân dân thành phố Hà Nội, Đà Nẵng và Thành phố Hồ Chí Minh theo phạm vi lãnh thổ. Các bên không được tự chọn Tòa án cấp tỉnh bất kỳ; Tòa án nhân dân khu vực và Hội đồng Thẩm phán không có thẩm quyền này.","b":"Điều 35, Điều 37 BLTTDS; Điều 2 Nghị quyết 81/2025/UBTVQH15"},{"id":"2.04","g":2,"lv":"TH","q":"Tranh chấp hợp đồng mua bán hàng hóa giữa hai công ty thương mại do Tòa chuyên trách nào của Tòa án nhân dân khu vực giải quyết theo thủ tục sơ thẩm?","o":["Tòa Kinh tế","Tòa Dân sự","Tòa Gia đình và người chưa thành niên","Tòa Sở hữu trí tuệ"],"a":0,"e":"Tranh chấp phát sinh trong hoạt động kinh doanh, thương mại giữa hai công ty có mục đích lợi nhuận thuộc khoản 1 Điều 30 BLTTDS. Theo khoản 2 Điều 36, Tòa Kinh tế Tòa án nhân dân khu vực giải quyết sơ thẩm. Tòa Sở hữu trí tuệ chỉ giải quyết tranh chấp về sở hữu trí tuệ, chuyển giao công nghệ.","b":"Khoản 1 Điều 30, khoản 2 Điều 36 BLTTDS"},{"id":"2.05","g":2,"lv":"TH","q":"Tại Tòa án nhân dân khu vực, vụ việc về lao động do Tòa chuyên trách nào giải quyết theo thủ tục sơ thẩm?","o":["Tòa Kinh tế","Tòa Dân sự","Tòa Hành chính","Tòa Lao động"],"a":1,"e":"Khoản 1 Điều 36 BLTTDS (sửa đổi 2025): Tòa Dân sự Tòa án nhân dân khu vực giải quyết theo thủ tục sơ thẩm vụ việc về dân sự và vụ việc về lao động. Tại cấp khu vực không còn Tòa Lao động riêng; Tòa Kinh tế giải quyết kinh doanh, thương mại.","b":"Khoản 1 Điều 36 BLTTDS"},{"id":"2.06","g":2,"lv":"TH","q":"Việc xét tính hợp pháp của cuộc đình công thuộc thẩm quyền của Tòa án nào?","o":["Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Hội đồng trọng tài lao động cấp tỉnh","Tòa án nơi doanh nghiệp đăng ký trụ sở chính","Tòa án nhân dân khu vực nơi xảy ra đình công"],"a":3,"e":"Xét tính hợp pháp của cuộc đình công là yêu cầu về lao động (Điều 33). Khoản 1 Điều 405 BLTTDS: Tòa án nhân dân khu vực nơi xảy ra đình công có thẩm quyền giải quyết. Hội đồng trọng tài lao động không phải Tòa án; nơi đăng ký trụ sở doanh nghiệp không phải tiêu chí.","b":"Điều 33, khoản 1 Điều 405 BLTTDS"},{"id":"2.07","g":2,"lv":"TH","q":"Đương sự có quyền khiếu nại quyết định chuyển vụ việc dân sự cho Tòa án khác trong thời hạn bao lâu kể từ ngày nhận được quyết định?","o":["07 ngày","03 ngày làm việc","01 tháng","15 ngày"],"a":1,"e":"Khoản 1 Điều 41 BLTTDS: đương sự có quyền khiếu nại quyết định chuyển vụ việc dân sự trong thời hạn 03 ngày làm việc kể từ ngày nhận được quyết định; Chánh án Tòa án đã ra quyết định giải quyết khiếu nại trong 03 ngày làm việc.","b":"Khoản 1 Điều 41 BLTTDS"},{"id":"2.08","g":2,"lv":"TH","q":"Tranh chấp về thẩm quyền giữa hai Tòa án nhân dân khu vực trong cùng một tỉnh do ai giải quyết?","o":["Chánh án Tòa án nhân dân cấp tỉnh","Viện trưởng Viện kiểm sát nhân dân cấp tỉnh","Hai Tòa án tự thỏa thuận; không thống nhất thì Tòa thụ lý trước giải quyết","Hội đồng Thẩm phán Tòa án nhân dân tối cao"],"a":0,"e":"Khoản 2 Điều 41 BLTTDS (sửa đổi 2025): tranh chấp về thẩm quyền giữa các Tòa án nhân dân khu vực trong cùng một tỉnh do Chánh án Tòa án nhân dân cấp tỉnh giải quyết. Các Tòa không tự thỏa thuận theo thứ tự thụ lý; Viện trưởng Viện kiểm sát không có thẩm quyền này.","b":"Khoản 2 Điều 41 BLTTDS (sửa đổi 2025)"},{"id":"2.09","g":2,"lv":"TH","q":"Tranh chấp về quyền sử dụng đất thuộc thẩm quyền theo lãnh thổ của Tòa án ở đâu?","o":["Nơi có bất động sản","Nơi nguyên đơn cư trú, nếu các bên thỏa thuận bằng văn bản","Nơi bị đơn cư trú","Nơi giao kết hợp đồng về quyền sử dụng đất"],"a":0,"e":"Điểm c khoản 1 Điều 39 BLTTDS: đối tượng tranh chấp là bất động sản thì chỉ Tòa án nơi có bất động sản có thẩm quyền giải quyết. Đây là thẩm quyền riêng biệt, các bên không được thỏa thuận chọn Tòa án nơi nguyên đơn cư trú hay nơi giao kết hợp đồng.","b":"Điểm c khoản 1 Điều 39 BLTTDS"},{"id":"2.10","g":2,"lv":"TH","q":"Thỏa thuận yêu cầu Tòa án nơi nguyên đơn cư trú giải quyết tranh chấp theo điểm b khoản 1 Điều 39 BLTTDS phải được thể hiện dưới hình thức nào?","o":["Đơn chung gửi Tòa án và được Tòa án chấp thuận trước","Thỏa thuận miệng là đủ","Văn bản bắt buộc có công chứng","Văn bản, không bắt buộc công chứng, chứng thực"],"a":3,"e":"Điểm b khoản 1 Điều 39 BLTTDS: các đương sự có quyền tự thỏa thuận với nhau bằng văn bản yêu cầu Tòa án nơi cư trú, làm việc của nguyên đơn giải quyết. Luật chỉ yêu cầu hình thức văn bản, không bắt buộc công chứng, chứng thực; thỏa thuận miệng không đủ.","b":"Điểm b khoản 1 Điều 39 BLTTDS"},{"id":"2.11","g":2,"lv":"VD","q":"Trong tranh chấp về cấp dưỡng, ngoài Tòa án nơi bị đơn cư trú, nguyên đơn có thể yêu cầu Tòa án ở đâu giải quyết?","o":["Nơi hai bên đăng ký kết hôn","Nơi nguyên đơn cư trú, làm việc","Nơi người được cấp dưỡng đăng ký khai sinh","Nơi bị đơn mở tài khoản ngân hàng"],"a":1,"e":"Điểm c khoản 1 Điều 40 BLTTDS: nếu tranh chấp về cấp dưỡng thì nguyên đơn có thể yêu cầu Tòa án nơi mình cư trú, làm việc giải quyết. Đây là thẩm quyền theo sự lựa chọn của nguyên đơn, nhằm thuận lợi cho người được cấp dưỡng.","b":"Điểm c khoản 1 Điều 40 BLTTDS"},{"id":"2.12","g":2,"lv":"VD","q":"Trong tranh chấp bồi thường thiệt hại ngoài hợp đồng, nguyên đơn có thể lựa chọn Tòa án ở đâu?","o":["Nơi người bị thiệt hại được điều trị","Nơi nguyên đơn cư trú, làm việc hoặc nơi xảy ra việc gây thiệt hại","Chỉ nơi bị đơn cư trú","Nơi doanh nghiệp bảo hiểm của bị đơn có trụ sở"],"a":1,"e":"Điểm d khoản 1 Điều 40 BLTTDS: tranh chấp bồi thường thiệt hại ngoài hợp đồng thì nguyên đơn có thể yêu cầu Tòa án nơi mình cư trú, làm việc hoặc nơi xảy ra việc gây thiệt hại giải quyết, ngoài Tòa án nơi bị đơn cư trú. Nơi điều trị hay trụ sở doanh nghiệp bảo hiểm không phải căn cứ.","b":"Điểm d khoản 1 Điều 40 BLTTDS"},{"id":"2.13","g":2,"lv":"VD","q":"Tranh chấp phát sinh từ hoạt động của chi nhánh một công ty. Ngoài Tòa án nơi công ty có trụ sở, nguyên đơn có thể yêu cầu Tòa án ở đâu giải quyết?","o":["Nơi nguyên đơn cư trú, làm việc","Nơi người đứng đầu chi nhánh đăng ký thường trú","Nơi chi nhánh đó hoạt động","Nơi công ty đăng ký mã số thuế lần đầu"],"a":2,"e":"Điểm b khoản 1 Điều 40 BLTTDS: nếu tranh chấp phát sinh từ hoạt động của chi nhánh tổ chức thì nguyên đơn có thể yêu cầu Tòa án nơi tổ chức có trụ sở hoặc nơi có chi nhánh giải quyết.","b":"Điểm b khoản 1 Điều 40 BLTTDS"},{"id":"2.14","g":2,"lv":"TH","q":"Khi Tòa án xem xét hủy quyết định cá biệt trái pháp luật trong vụ việc dân sự, cơ quan ban hành quyết định đó tham gia tố tụng với tư cách gì?","o":["Người có quyền lợi, nghĩa vụ liên quan","Người làm chứng","Bị đơn","Người bảo vệ quyền và lợi ích hợp pháp của đương sự"],"a":0,"e":"Khoản 3 Điều 34 BLTTDS: khi xem xét hủy quyết định cá biệt trái pháp luật, cơ quan, tổ chức, người có thẩm quyền đã ban hành quyết định phải được Tòa án đưa vào tham gia tố tụng với tư cách người có quyền lợi, nghĩa vụ liên quan.","b":"Khoản 3 Điều 34 BLTTDS"},{"id":"2.15","g":2,"lv":"TH","q":"Theo BLTTDS, quyết định cá biệt là gì?","o":["Quyết định được áp dụng nhiều lần đối với mọi đối tượng trong phạm vi một địa phương","Quyết định nội bộ về tổ chức bộ máy của cơ quan hành chính","Quyết định đã được ban hành về một vấn đề cụ thể và được áp dụng một lần đối với một hoặc một số đối tượng cụ thể","Văn bản quy phạm pháp luật do Ủy ban nhân dân cấp tỉnh ban hành"],"a":2,"e":"Khoản 2 Điều 34 BLTTDS: quyết định cá biệt là quyết định đã được ban hành về một vấn đề cụ thể và được áp dụng một lần đối với một hoặc một số đối tượng cụ thể. Văn bản áp dụng nhiều lần cho mọi đối tượng là văn bản quy phạm; quyết định nội bộ về tổ chức bộ máy không thuộc khái niệm này.","b":"Khoản 2 Điều 34 BLTTDS"},{"id":"2.16","g":2,"lv":"VD","q":"Không có tranh chấp giữa các bên, công chứng viên yêu cầu Tòa án tuyên bố văn bản công chứng vô hiệu. Yêu cầu này được xác định là gì?","o":["Yêu cầu về kinh doanh, thương mại","Việc dân sự (yêu cầu về dân sự)","Vụ án dân sự (tranh chấp về dân sự)","Vụ án hành chính"],"a":1,"e":"Yêu cầu tuyên bố văn bản công chứng vô hiệu là yêu cầu về dân sự (khoản 6 Điều 27 BLTTDS) khi không có tranh chấp, nên là việc dân sự. Nếu có tranh chấp về giao dịch đã công chứng thì mới là vụ án dân sự (khoản 11 Điều 26).","b":"Khoản 6 Điều 27, khoản 11 Điều 26 BLTTDS"},{"id":"2.17","g":2,"lv":"VD","q":"Thành viên công ty trách nhiệm hữu hạn tranh chấp với công ty về việc góp vốn thành lập công ty. Đây là loại tranh chấp nào?","o":["Vụ án hành chính","Tranh chấp về kinh doanh, thương mại","Tranh chấp dân sự thông thường","Quan hệ lao động giữa thành viên và công ty"],"a":1,"e":"Khoản 4 Điều 30 BLTTDS: tranh chấp giữa công ty với các thành viên của công ty liên quan đến việc thành lập, hoạt động, giải thể… của công ty là tranh chấp về kinh doanh, thương mại, không phụ thuộc mục đích lợi nhuận của từng bên.","b":"Khoản 4 Điều 30 BLTTDS"},{"id":"2.18","g":2,"lv":"VD","q":"Hai cá nhân không đăng ký kinh doanh tranh chấp về hợp đồng mua bán một chiếc xe máy đã qua sử dụng. Đây là loại tranh chấp nào?","o":["Yêu cầu về dân sự","Tranh chấp về kinh doanh, thương mại","Tranh chấp về dân sự","Tranh chấp hành chính"],"a":2,"e":"Mua bán xe giữa hai cá nhân không đăng ký kinh doanh, không vì mục đích lợi nhuận là tranh chấp hợp đồng dân sự (khoản 3 Điều 26). Không thỏa mãn điều kiện của khoản 1 Điều 30 nên không phải tranh chấp kinh doanh, thương mại; có tranh chấp nên không phải yêu cầu (việc) dân sự.","b":"Khoản 3 Điều 26, khoản 1 Điều 30 BLTTDS"},{"id":"2.19","g":2,"lv":"TH","q":"Tòa án được nhập hai hoặc nhiều vụ án đã thụ lý riêng biệt thành một vụ án khi nào?","o":["Chỉ khi các vụ án có cùng nguyên đơn và cùng bị đơn","Chỉ khi tất cả đương sự đồng ý bằng văn bản","Khi việc nhập và giải quyết trong cùng một vụ án bảo đảm đúng pháp luật","Chỉ khi Viện kiểm sát có kiến nghị"],"a":2,"e":"Khoản 1 Điều 42 BLTTDS: Tòa án có thể nhập hai hoặc nhiều vụ án đã thụ lý riêng biệt thành một vụ án nếu việc nhập và việc giải quyết trong cùng một vụ án bảo đảm đúng pháp luật. Không bắt buộc các đương sự đồng ý hay Viện kiểm sát kiến nghị.","b":"Khoản 1 Điều 42 BLTTDS"},{"id":"2.20","g":2,"lv":"TH","q":"Khi giải quyết vụ việc dân sự mà chưa có điều luật để áp dụng, Tòa án áp dụng các căn cứ theo trình tự nào?","o":["Án lệ, sau đó tập quán, sau đó lẽ công bằng","Tập quán, sau đó tương tự pháp luật, sau đó các nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng","Lẽ công bằng, sau đó án lệ, sau đó tương tự pháp luật","Ý kiến của Viện kiểm sát, sau đó tập quán, sau đó án lệ"],"a":1,"e":"Khoản 2 Điều 4 và Điều 45 BLTTDS, Điều 5, 6 BLDS 2015: khi chưa có điều luật áp dụng, Tòa án lần lượt áp dụng tập quán; tương tự pháp luật; các nguyên tắc cơ bản của pháp luật dân sự, án lệ, lẽ công bằng. Ý kiến Viện kiểm sát không phải nguồn áp dụng.","b":"Khoản 2 Điều 4, Điều 45 BLTTDS; Điều 5, 6 BLDS 2015"},{"id":"TH2.01.1","g":2,"lv":"VD","q":"Bà Lan có thể nộp đơn khởi kiện tại Tòa án nào?","o":["Chỉ Tòa án nơi bà Lan cư trú","Tòa án nơi ông Minh cư trú hoặc Tòa án nơi hợp đồng được thực hiện (Hà Nội)","Bất kỳ Tòa án nhân dân khu vực nào bà Lan chọn","Chỉ Tòa án nơi ông Minh cư trú"],"a":1,"e":"Theo điểm a khoản 1 Điều 39, Tòa án nơi bị đơn (ông Minh) cư trú có thẩm quyền. Điểm g khoản 1 Điều 40 BLTTDS cho phép nguyên đơn chọn Tòa án nơi hợp đồng được thực hiện nếu tranh chấp phát sinh từ quan hệ hợp đồng. Bà Lan không được chọn Tòa án bất kỳ; Tòa án nơi bà cư trú chỉ có thẩm quyền khi hai bên thỏa thuận bằng văn bản.","b":"Điểm a khoản 1 Điều 39, điểm g khoản 1 Điều 40 BLTTDS","cid":"TH2.01"},{"id":"TH2.01.2","g":2,"lv":"VD","q":"Giả sử bà Lan nộp đơn tại Tòa án có thẩm quyền ở Đà Nẵng. Sau khi Tòa án thụ lý, ông Minh chuyển về sống ở Huế. Tòa án nào tiếp tục giải quyết?","o":["Tòa án nhân dân thành phố Đà Nẵng","Tòa án nhân dân khu vực nơi ông Minh mới cư trú ở Huế","Tòa án đã thụ lý ở Đà Nẵng","Tòa án do bà Lan lựa chọn lại"],"a":2,"e":"Khoản 3 Điều 39 BLTTDS: Tòa án đã thụ lý vụ án đúng quy định thì tiếp tục giải quyết dù trong quá trình giải quyết có sự thay đổi nơi cư trú của đương sự. Việc ông Minh chuyển về Huế không làm thay đổi thẩm quyền.","b":"Khoản 3 Điều 39 BLTTDS","cid":"TH2.01"},{"id":"TH2.01.3","g":2,"lv":"VD","q":"Giả sử sau khi thụ lý, Tòa án nhận thấy vụ án không thuộc thẩm quyền của mình. Tòa án phải xử lý thế nào?","o":["Chuyển hồ sơ cho Tòa án có thẩm quyền và xóa tên vụ án trong sổ thụ lý","Đình chỉ giải quyết vụ án","Tạm đình chỉ để chờ Chánh án Tòa án nhân dân tối cao quyết định","Trả lại đơn khởi kiện cho bà Lan"],"a":0,"e":"Khoản 1 Điều 41 BLTTDS: vụ việc đã thụ lý mà không thuộc thẩm quyền thì Tòa án ra quyết định chuyển hồ sơ vụ việc cho Tòa án có thẩm quyền và xóa tên vụ việc trong sổ thụ lý. Không đình chỉ, không tạm đình chỉ, không trả lại đơn khi đã thụ lý.","b":"Khoản 1 Điều 41 BLTTDS","cid":"TH2.01"},{"id":"TH2.02.1","g":2,"lv":"VD","q":"Tranh chấp giữa Công ty Hoa Sen và Công ty Phú An thuộc loại nào?","o":["Tranh chấp về dân sự","Việc dân sự về sở hữu trí tuệ","Vụ án hành chính","Tranh chấp về kinh doanh, thương mại"],"a":3,"e":"Tranh chấp về nhãn hiệu giữa hai công ty có mục đích lợi nhuận là tranh chấp về quyền sở hữu trí tuệ giữa các tổ chức đều có mục đích lợi nhuận, thuộc khoản 2 Điều 30 BLTTDS, tức tranh chấp về kinh doanh, thương mại. Tranh chấp sở hữu trí tuệ giữa các chủ thể không vì lợi nhuận mới là tranh chấp dân sự (khoản 4 Điều 26).","b":"Khoản 2 Điều 30, khoản 4 Điều 26 BLTTDS","cid":"TH2.02"},{"id":"TH2.02.2","g":2,"lv":"VD","q":"Tòa án nào có thẩm quyền giải quyết sơ thẩm tranh chấp giữa Công ty Hoa Sen và Công ty Phú An?","o":["Tòa Sở hữu trí tuệ Tòa án nhân dân khu vực 2 – Hà Nội","Tòa Kinh tế Tòa án nhân dân tỉnh Bắc Ninh","Tòa Kinh tế Tòa án nhân dân khu vực nơi Công ty Phú An có trụ sở","Tòa án nhân dân tỉnh Thái Nguyên, nơi nguyên đơn có trụ sở"],"a":0,"e":"Khoản 3 Điều 36 BLTTDS và khoản 3 Điều 4 Nghị quyết 81/2025/UBTVQH15: tranh chấp sở hữu trí tuệ, chuyển giao công nghệ được tập trung giải quyết sơ thẩm tại Tòa Sở hữu trí tuệ của Tòa án nhân dân khu vực được giao (khu vực 2 – Hà Nội đối với các tỉnh phía Bắc). Tòa án cấp tỉnh không xét xử sơ thẩm; Tòa Kinh tế khu vực không giải quyết tranh chấp sở hữu trí tuệ.","b":"Khoản 3 Điều 36 BLTTDS; khoản 3 Điều 4 Nghị quyết 81/2025/UBTVQH15","cid":"TH2.02"},{"id":"TH2.02.3","g":2,"lv":"VD","q":"Bản án sơ thẩm trong vụ tranh chấp nhãn hiệu giữa Công ty Hoa Sen và Công ty Phú An bị kháng cáo. Tòa án nào xét xử phúc thẩm?","o":["Tòa án nhân dân tỉnh Bắc Ninh, nơi bị đơn có trụ sở","Tòa Kinh tế Tòa án nhân dân thành phố Hà Nội","Tòa Phúc thẩm Tòa án nhân dân tối cao tại Hà Nội","Tòa Sở hữu trí tuệ Tòa án nhân dân khu vực 2 – Hà Nội"],"a":1,"e":"Theo Điều 38 BLTTDS (sửa đổi 2025), Tòa án nhân dân cấp tỉnh xét xử phúc thẩm bản án sơ thẩm của Tòa án nhân dân khu vực bị kháng cáo, kháng nghị; vụ án sở hữu trí tuệ do Tòa Kinh tế Tòa án nhân dân thành phố Hà Nội xét xử phúc thẩm. Tòa Phúc thẩm Tòa án nhân dân tối cao không còn xét xử phúc thẩm loại bản án này.","b":"Điều 38 BLTTDS (sửa đổi 2025)","cid":"TH2.02"},{"id":"TH2.02.4","g":2,"lv":"VD","q":"Bản án phúc thẩm của Tòa án nhân dân thành phố Hà Nội trong vụ tranh chấp nhãn hiệu giữa Công ty Hoa Sen và Công ty Phú An đã có hiệu lực pháp luật và bị kháng nghị giám đốc thẩm. Cơ quan nào xét xử giám đốc thẩm?","o":["Ủy ban Thẩm phán Tòa án nhân dân thành phố Hà Nội","Chánh án Tòa án nhân dân tối cao","Hội đồng Thẩm phán Tòa án nhân dân tối cao","Tòa Kinh tế Tòa án nhân dân thành phố Hà Nội với Hội đồng 3 Thẩm phán"],"a":2,"e":"Khoản 2 Điều 337 BLTTDS (sửa đổi 2025): Hội đồng Thẩm phán Tòa án nhân dân tối cao giám đốc thẩm bản án, quyết định đã có hiệu lực của Tòa án nhân dân cấp tỉnh bị kháng nghị. Ủy ban Thẩm phán Tòa án cấp tỉnh không giám đốc thẩm bản án của chính Tòa án cấp mình; Chánh án chỉ có quyền kháng nghị.","b":"Khoản 2 Điều 337 BLTTDS (sửa đổi 2025)","cid":"TH2.02"},{"id":"TH2.03.1","g":2,"lv":"VD","q":"Đơn của chị Hoa và anh Nam được Tòa án giải quyết theo loại vụ việc nào?","o":["Yêu cầu hủy việc kết hôn trái pháp luật","Việc dân sự: yêu cầu công nhận thuận tình ly hôn, thỏa thuận nuôi con, chia tài sản khi ly hôn","Vụ án ly hôn có tranh chấp","Tranh chấp về chia tài sản chung trong thời kỳ hôn nhân"],"a":1,"e":"Thuận tình ly hôn, thỏa thuận được về nuôi con, chia tài sản là yêu cầu về hôn nhân và gia đình (khoản 2 Điều 29 BLTTDS), được giải quyết theo thủ tục việc dân sự. Chỉ khi có tranh chấp mới là vụ án ly hôn (khoản 1 Điều 28).","b":"Khoản 2 Điều 29, khoản 1 Điều 28 BLTTDS","cid":"TH2.03"},{"id":"TH2.03.2","g":2,"lv":"VD","q":"Tòa chuyên trách nào của Tòa án nhân dân khu vực giải quyết đơn của chị Hoa và anh Nam?","o":["Tòa Hành chính","Tòa Dân sự","Tòa Gia đình và người chưa thành niên","Tòa Kinh tế"],"a":2,"e":"Khoản 4 Điều 36 BLTTDS: Tòa Gia đình và người chưa thành niên Tòa án nhân dân khu vực giải quyết theo thủ tục sơ thẩm vụ việc về hôn nhân và gia đình, trong đó có yêu cầu công nhận thuận tình ly hôn.","b":"Khoản 4 Điều 36 BLTTDS","cid":"TH2.03"},{"id":"TH2.03.3","g":2,"lv":"VD","q":"Chị Hoa và anh Nam có thể gửi đơn đến Tòa án ở đâu?","o":["Tòa án nơi chị Hoa hoặc anh Nam cư trú, làm việc","Chỉ Tòa án nơi anh Nam cư trú","Tòa án nơi người con đang học tập","Chỉ Tòa án nơi hai người đăng ký kết hôn"],"a":0,"e":"Khoản 2 Điều 39 BLTTDS: đối với yêu cầu công nhận thuận tình ly hôn, nuôi con, chia tài sản khi ly hôn thì Tòa án nơi một trong các bên thuận tình ly hôn cư trú, làm việc có thẩm quyền giải quyết. Nơi đăng ký kết hôn hay nơi con học tập không phải căn cứ.","b":"Khoản 2 Điều 39 BLTTDS","cid":"TH2.03"},{"id":"3.01","g":3,"lv":"TH","q":"Theo Bộ luật Tố tụng dân sự, cơ quan tiến hành tố tụng dân sự gồm:","o":["Tòa án nhân dân, Viện kiểm sát nhân dân và cơ quan thi hành án dân sự","Tòa án nhân dân và Viện kiểm sát nhân dân","Chỉ Tòa án nhân dân","Tòa án nhân dân, Viện kiểm sát nhân dân và cơ quan công an"],"a":1,"e":"Khoản 1 Điều 46 BLTTDS: cơ quan tiến hành tố tụng dân sự gồm Tòa án nhân dân và Viện kiểm sát nhân dân. Cơ quan công an, cơ quan thi hành án dân sự không phải cơ quan tiến hành tố tụng dân sự.","b":"Khoản 1 Điều 46 BLTTDS"},{"id":"3.02","g":3,"lv":"TH","q":"Người nào sau đây KHÔNG phải là người tiến hành tố tụng dân sự?","o":["Thư ký Tòa án","Thẩm tra viên Tòa án","Luật sư bảo vệ quyền và lợi ích hợp pháp của đương sự","Kiểm tra viên Viện kiểm sát"],"a":2,"e":"Người tiến hành tố tụng gồm Chánh án, Thẩm phán, Hội thẩm nhân dân, Thẩm tra viên, Thư ký Tòa án, Viện trưởng Viện kiểm sát, Kiểm sát viên, Kiểm tra viên (khoản 2, 3 Điều 46). Luật sư bảo vệ quyền và lợi ích của đương sự là người tham gia tố tụng (Điều 75).","b":"Khoản 2, khoản 3 Điều 46; Điều 75 BLTTDS"},{"id":"3.03","g":3,"lv":"TH","q":"Trước khi mở phiên tòa, việc thay đổi Thẩm phán (không phải là Chánh án) do ai quyết định?","o":["Hội đồng xét xử","Chánh án Tòa án cấp trên trực tiếp","Chánh án Tòa án","Viện trưởng Viện kiểm sát cùng cấp"],"a":2,"e":"Khoản 1 Điều 56 BLTTDS (sửa đổi bởi Luật 85/2025/QH15): trước khi mở phiên tòa, việc thay đổi Thẩm phán do Chánh án Tòa án quyết định; nếu Thẩm phán bị thay đổi là Chánh án thì do Chánh án Tòa án trên một cấp quyết định. Viện trưởng Viện kiểm sát không có thẩm quyền này.","b":"Khoản 1 Điều 56 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"3.04","g":3,"lv":"TH","q":"Trước khi mở phiên tòa, nếu Thẩm phán bị đề nghị thay đổi là Chánh án Tòa án nhân dân khu vực thì ai quyết định việc thay đổi?","o":["Phó Chánh án Tòa án nhân dân khu vực đó","Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Chánh án Tòa án nhân dân cấp tỉnh","Chánh án Tòa án nhân dân tối cao"],"a":2,"e":"Khoản 1 Điều 56 BLTTDS (sửa đổi 2025): nếu Thẩm phán bị thay đổi là Chánh án Tòa án thì do Chánh án Tòa án trên một cấp quyết định. Cấp trên trực tiếp của Tòa án nhân dân khu vực là Tòa án nhân dân cấp tỉnh.","b":"Khoản 1 Điều 56 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"3.05","g":3,"lv":"TH","q":"Tại phiên tòa, việc thay đổi Thẩm phán, Hội thẩm nhân dân được quyết định như thế nào?","o":["Kiểm sát viên tham gia phiên tòa quyết định","Hội đồng xét xử quyết định theo đa số sau khi nghe ý kiến của người bị yêu cầu thay đổi","Chủ tọa phiên tòa tự quyết định, không cần thảo luận","Chánh án Tòa án quyết định bằng văn bản gửi cho Hội đồng xét xử"],"a":1,"e":"Khoản 2 Điều 56 BLTTDS: tại phiên tòa, việc thay đổi Thẩm phán, Hội thẩm nhân dân do Hội đồng xét xử quyết định sau khi nghe ý kiến của người bị yêu cầu thay đổi; Hội đồng xét xử thảo luận tại phòng nghị án và quyết định theo đa số.","b":"Khoản 2 Điều 56 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"3.06","g":3,"lv":"TH","q":"Trường hợp phải hoãn phiên tòa do thay đổi thành viên Hội đồng xét xử, Chánh án Tòa án phải cử người khác thay thế trong thời hạn:","o":["03 ngày làm việc, kể từ ngày hoãn phiên tòa","07 ngày, kể từ ngày hoãn phiên tòa","05 ngày làm việc, kể từ ngày hoãn phiên tòa","15 ngày, kể từ ngày hoãn phiên tòa"],"a":0,"e":"Điều 56 BLTTDS (sửa đổi 2025): trường hợp phải hoãn phiên tòa do thay đổi thành viên Hội đồng xét xử, Chánh án Tòa án phải cử người khác thay thế trong thời hạn 03 ngày làm việc kể từ ngày hoãn phiên tòa.","b":"Điều 56 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"3.07","g":3,"lv":"TH","q":"Trường hợp nào sau đây Thẩm phán phải từ chối tiến hành tố tụng hoặc bị thay đổi?","o":["Thẩm phán đã từng xét xử một vụ án khác có cùng nguyên đơn","Thẩm phán là người thân thích của bị đơn","Thẩm phán cư trú cùng tỉnh với nguyên đơn","Thẩm phán từng học cùng khóa đại học với luật sư của nguyên đơn"],"a":1,"e":"Khoản 1 Điều 52 BLTTDS: người tiến hành tố tụng phải từ chối hoặc bị thay đổi nếu đồng thời là đương sự, người đại diện, người thân thích của đương sự. Điều 53 áp dụng cho Thẩm phán. Đã xét xử vụ án khác có cùng nguyên đơn, học cùng khóa với luật sư hay cư trú cùng tỉnh không phải căn cứ luật định.","b":"Khoản 1 Điều 52, khoản 1 Điều 53 BLTTDS"},{"id":"3.08","g":3,"lv":"VD","q":"Thẩm phán X đã xét xử sơ thẩm và ra bản án trong một vụ án. Bản án bị kháng cáo; X vừa được điều động về Tòa án nhân dân cấp tỉnh. X có được tham gia Hội đồng xét xử phúc thẩm vụ án đó không?","o":["Có, nếu được Chánh án Tòa án nhân dân cấp tỉnh phân công","Có, vì X đã chuyển sang công tác ở Tòa án khác","Có, nếu các đương sự đồng ý bằng văn bản","Không, vì X đã tham gia giải quyết vụ án theo thủ tục sơ thẩm và đã ra bản án"],"a":3,"e":"Khoản 3 Điều 53 BLTTDS: Thẩm phán đã tham gia giải quyết vụ việc theo thủ tục sơ thẩm và đã ra bản án, quyết định thì không được tham gia giải quyết vụ việc đó theo thủ tục phúc thẩm. Việc chuyển công tác hay sự đồng ý của đương sự không làm thay đổi quy định này.","b":"Khoản 3 Điều 53 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"3.09","g":3,"lv":"TH","q":"Người đã tham gia giải quyết vụ việc dân sự theo thủ tục sơ thẩm, phúc thẩm, giám đốc thẩm hoặc tái thẩm vẫn được tham gia xét xử giám đốc thẩm, tái thẩm vụ việc đó trong trường hợp nào?","o":["Họ là thành viên Hội đồng Thẩm phán Tòa án nhân dân tối cao hoặc Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh","Họ là Hội thẩm nhân dân","Họ là Chánh án Tòa án nhân dân khu vực đã xét xử sơ thẩm","Họ là Thẩm phán đã chuyển công tác sang Tòa án khác"],"a":0,"e":"Khoản 3 Điều 53 BLTTDS: người đã tham gia giải quyết vụ việc vẫn được tham gia xét xử giám đốc thẩm, tái thẩm nếu họ là thành viên Hội đồng Thẩm phán Tòa án nhân dân tối cao hoặc Ủy ban Thẩm phán Tòa án nhân dân cấp tỉnh. Ngoại lệ này không áp dụng cho Hội thẩm hay Thẩm phán chuyển công tác.","b":"Khoản 3 Điều 53 BLTTDS (sửa đổi bởi Luật 85/2025/QH15)"},{"id":"3.10","g":3,"lv":"TH","q":"Đương sự trong vụ án dân sự gồm:","o":["Nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan","Nguyên đơn, bị đơn, người bảo vệ quyền và lợi ích hợp pháp của đương sự","Nguyên đơn, bị đơn, người làm chứng","Nguyên đơn, bị đơn, người đại diện của các bên"],"a":0,"e":"Khoản 1 Điều 68 BLTTDS: đương sự trong vụ án dân sự là cơ quan, tổ chức, cá nhân bao gồm nguyên đơn, bị đơn, người có quyền lợi, nghĩa vụ liên quan. Người làm chứng, người đại diện, người bảo vệ quyền lợi của đương sự là người tham gia tố tụng khác, không phải đương sự.","b":"Khoản 1 Điều 68 BLTTDS"},{"id":"3.11","g":3,"lv":"TH","q":"Năng lực pháp luật tố tụng dân sự được hiểu là:","o":["Khả năng chỉ có ở cá nhân từ đủ mười tám tuổi trở lên","Khả năng có các quyền, nghĩa vụ trong tố tụng dân sự do pháp luật quy định; mọi cá nhân, cơ quan, tổ chức có năng lực này như nhau","Khả năng chỉ phát sinh từ khi Tòa án thụ lý vụ việc dân sự","Khả năng tự mình thực hiện quyền, nghĩa vụ tố tụng dân sự hoặc ủy quyền cho người đại diện"],"a":1,"e":"Khoản 1 Điều 69 BLTTDS: năng lực pháp luật tố tụng dân sự là khả năng có các quyền, nghĩa vụ trong tố tụng dân sự do pháp luật quy định; mọi cá nhân, cơ quan, tổ chức có năng lực này như nhau. Khả năng tự mình thực hiện quyền, nghĩa vụ hoặc ủy quyền là năng lực hành vi tố tụng (khoản 2), phụ thuộc độ tuổi.","b":"Khoản 1 Điều 69 BLTTDS"},{"id":"3.12","g":3,"lv":"VD","q":"Anh T (16 tuổi) làm việc theo hợp đồng lao động và bị người sử dụng lao động nợ lương. Về năng lực hành vi tố tụng dân sự trong tranh chấp này, nhận định nào đúng?","o":["Anh T chỉ được tham gia tố tụng khi được Tòa án tuyên bố có năng lực hành vi dân sự đầy đủ","Anh T không có năng lực hành vi tố tụng dân sự; chỉ cha mẹ được thực hiện thay toàn bộ quyền, nghĩa vụ tố tụng","Anh T chỉ được tham gia tố tụng khi có luật sư bảo vệ","Anh T được tự mình tham gia tố tụng về việc liên quan đến quan hệ lao động đó; Tòa án có quyền triệu tập người đại diện hợp pháp của anh T tham gia tố tụng"],"a":3,"e":"Khoản 6 Điều 69 BLTTDS: đương sự từ đủ 15 đến chưa đủ 18 tuổi đã tham gia lao động theo hợp đồng lao động được tự mình tham gia tố tụng về những việc liên quan đến quan hệ lao động đó; Tòa án có quyền triệu tập người đại diện hợp pháp của họ tham gia tố tụng. Không cần tuyên bố năng lực hành vi đầy đủ hay có luật sư.","b":"Khoản 6 Điều 69 BLTTDS"},{"id":"3.13","g":3,"lv":"TH","q":"Trước khi mở phiên tòa, việc thay đổi Kiểm sát viên (không phải là Viện trưởng) do ai quyết định?","o":["Chánh án Tòa án đang giải quyết vụ việc","Viện trưởng Viện kiểm sát cấp trên trực tiếp","Viện trưởng Viện kiểm sát cùng cấp","Hội đồng xét xử"],"a":2,"e":"Khoản 1 Điều 62 BLTTDS: trước khi mở phiên tòa, việc thay đổi Kiểm sát viên do Viện trưởng Viện kiểm sát cùng cấp quyết định; nếu Kiểm sát viên bị thay đổi là Viện trưởng thì do Viện trưởng Viện kiểm sát cấp trên trực tiếp quyết định. Chánh án Tòa án không quyết định việc thay đổi Kiểm sát viên.","b":"Khoản 1 Điều 62 BLTTDS"},{"id":"3.14","g":3,"lv":"TH","q":"Trong vụ án dân sự, bị đơn có quyền nào sau đây mà nguyên đơn KHÔNG có?","o":["Đưa ra yêu cầu phản tố đối với nguyên đơn","Đề nghị thay đổi người tiến hành tố tụng","Cung cấp tài liệu, chứng cứ để bảo vệ quyền và lợi ích hợp pháp của mình","Kháng cáo bản án sơ thẩm"],"a":0,"e":"Điều 72 BLTTDS: bị đơn có quyền đưa ra yêu cầu phản tố đối với nguyên đơn. Nguyên đơn không có quyền phản tố mà có quyền thay đổi, bổ sung, rút yêu cầu khởi kiện (Điều 71). Cung cấp chứng cứ, đề nghị thay đổi người tiến hành tố tụng, kháng cáo là quyền chung của đương sự (Điều 70).","b":"Điều 70, Điều 72 BLTTDS"},{"id":"3.15","g":3,"lv":"TH","q":"Người có quyền lợi, nghĩa vụ liên quan trong vụ án dân sự có thể tham gia tố tụng theo cách nào?","o":["Bắt buộc phải tham gia tố tụng cùng bên nguyên đơn","Chỉ tham gia khi Tòa án đưa vào và không được đưa ra yêu cầu riêng","Có yêu cầu độc lập, hoặc tham gia tố tụng với bên nguyên đơn hoặc với bên bị đơn","Chỉ tham gia với tư cách người làm chứng"],"a":2,"e":"Khoản 4 Điều 68 và Điều 73 BLTTDS: người có quyền lợi, nghĩa vụ liên quan có thể tự mình đề nghị hoặc được đương sự khác đề nghị, Tòa án chấp nhận đưa vào tham gia tố tụng; họ có thể có yêu cầu độc lập hoặc tham gia tố tụng với bên nguyên đơn hoặc bên bị đơn. Họ không phải người làm chứng và không bắt buộc đứng về phía nguyên đơn.","b":"Khoản 4 Điều 68, Điều 73 BLTTDS"},{"id":"3.16","g":3,"lv":"TH","q":"Nguyên đơn là cá nhân chết trong khi Tòa án đang giải quyết vụ án đòi tài sản, quyền và nghĩa vụ về tài sản của người đó được thừa kế. Ai tham gia tố tụng thay nguyên đơn?","o":["Viện kiểm sát nhân dân cùng cấp","Luật sư do Tòa án chỉ định","Người thừa kế của nguyên đơn","Ủy ban nhân dân cấp xã nơi nguyên đơn cư trú cuối cùng"],"a":2,"e":"Khoản 1 Điều 74 BLTTDS: trường hợp đương sự là cá nhân đang tham gia tố tụng chết mà quyền, nghĩa vụ về tài sản của họ được thừa kế thì người thừa kế tham gia tố tụng. Luật sư, Viện kiểm sát, Ủy ban nhân dân không kế thừa quyền, nghĩa vụ tố tụng của đương sự.","b":"Khoản 1 Điều 74 BLTTDS"},{"id":"3.17","g":3,"lv":"TH","q":"Người nào sau đây có thể được Tòa án đăng ký làm người bảo vệ quyền và lợi ích hợp pháp của đương sự?","o":["Công chức đang công tác tại Tòa án nhân dân khu vực","Công dân đang bị áp dụng biện pháp xử lý hành chính","Trợ giúp viên pháp lý","Sĩ quan đang công tác trong ngành Công an"],"a":2,"e":"Khoản 2 Điều 75 BLTTDS: người bảo vệ quyền và lợi ích hợp pháp của đương sự gồm luật sư, trợ giúp viên pháp lý hoặc người tham gia trợ giúp pháp lý, đại diện tổ chức đại diện tập thể lao động, công dân Việt Nam có năng lực hành vi dân sự đầy đủ, không có án tích, không bị áp dụng biện pháp xử lý hành chính, không phải cán bộ, công chức trong các cơ quan Tòa án, Viện kiểm sát và công chức, sĩ quan… trong ngành Công an.","b":"Khoản 2 Điều 75 BLTTDS"},{"id":"3.18","g":3,"lv":"TH","q":"Khi người đề nghị đăng ký làm người bảo vệ quyền và lợi ích hợp pháp của đương sự đã xuất trình đủ giấy tờ, Tòa án phải vào sổ đăng ký và xác nhận trong thời hạn:","o":["05 ngày làm việc, kể từ ngày nhận đủ giấy tờ","03 ngày làm việc, kể từ ngày nhận đủ giấy tờ","10 ngày, kể từ ngày nhận đủ giấy tờ","07 ngày, kể từ ngày nhận đủ giấy tờ"],"a":1,"e":"Khoản 4 Điều 75 BLTTDS: trong thời hạn 03 ngày làm việc kể từ ngày nhận đủ giấy tờ, Tòa án phải vào sổ đăng ký người bảo vệ quyền và lợi ích hợp pháp của đương sự và xác nhận vào giấy yêu cầu; trường hợp từ chối phải thông báo bằng văn bản và nêu rõ lý do.","b":"Khoản 4 Điều 75 BLTTDS"},{"id":"3.19","g":3,"lv":"VD","q":"Chị A khởi kiện xin ly hôn nhưng đang công tác dài hạn ở nước ngoài. Chị lập văn bản ủy quyền có công chứng cho anh trai thay mặt mình tham gia tố tụng. Nhận định nào đúng?","o":["Không được, vì đối với việc ly hôn, đương sự không được ủy quyền cho người khác thay mặt mình tham gia tố tụng","Được, vì văn bản ủy quyền đã được công chứng","Được, nếu anh trai chị A là luật sư","Được, nếu chồng chị A đồng ý"],"a":0,"e":"Khoản 4 Điều 85 BLTTDS: đối với việc ly hôn, đương sự không được ủy quyền cho người khác thay mặt mình tham gia tố tụng (trừ trường hợp người thân thích yêu cầu ly hôn thay theo khoản 2 Điều 51 Luật HNGĐ). Hình thức công chứng hay tư cách luật sư của người được ủy quyền không làm thay đổi quy định này.","b":"Khoản 4 Điều 85 BLTTDS"},{"id":"3.20","g":3,"lv":"TH","q":"Người nào sau đây KHÔNG thể là người làm chứng trong tố tụng dân sự?","o":["Người nước ngoài","Người chưa thành niên","Người mất năng lực hành vi dân sự","Người thân thích của đương sự"],"a":2,"e":"Điều 77 BLTTDS: người làm chứng là người biết các tình tiết có liên quan đến vụ việc; người mất năng lực hành vi dân sự không thể là người làm chứng. Người chưa thành niên, người thân thích của đương sự, người nước ngoài vẫn có thể làm chứng.","b":"Điều 77 BLTTDS"},{"id":"TH3.01.1","g":3,"lv":"VD","q":"Cháu Mai tham gia vụ án với tư cách tố tụng nào?","o":["Người có quyền lợi, nghĩa vụ liên quan","Bị đơn","Người làm chứng","Nguyên đơn"],"a":0,"e":"Cháu Mai không khởi kiện, không bị kiện nhưng việc giải quyết vụ án liên quan đến quyền lợi, nghĩa vụ của cháu nên cháu tham gia với tư cách người có quyền lợi, nghĩa vụ liên quan (khoản 4 Điều 68 BLTTDS).","b":"Khoản 4 Điều 68 BLTTDS","cid":"TH3.01"},{"id":"TH3.01.2","g":3,"lv":"VD","q":"Cháu Mai có tự mình thực hiện quyền, nghĩa vụ tố tụng được không?","o":["Có, vì cháu đã đủ 14 tuổi","Có, nếu cháu có luật sư bảo vệ","Không; việc thực hiện quyền, nghĩa vụ tố tụng của cháu do người đại diện hợp pháp thực hiện","Có, nếu Tòa án đồng ý bằng quyết định"],"a":2,"e":"Khoản 5 Điều 69 BLTTDS: đương sự là người chưa đủ 6 tuổi hoặc từ đủ 6 tuổi đến chưa đủ 15 tuổi (trừ trường hợp luật quy định khác) thì việc thực hiện quyền, nghĩa vụ tố tụng do người đại diện hợp pháp thực hiện. Có luật sư hay quyết định của Tòa án không làm phát sinh năng lực hành vi tố tụng cho cháu.","b":"Khoản 5 Điều 69 BLTTDS","cid":"TH3.01"},{"id":"TH3.01.3","g":3,"lv":"VD","q":"Bà Hạnh cũng muốn nhờ Luật sư C bảo vệ quyền lợi cho mình. Nhận định nào đúng?","o":["Không được, vì quyền và lợi ích của anh Tuấn và bà Hạnh trong vụ án đối lập nhau","Được, nếu Tòa án chấp thuận khi đăng ký người bảo vệ","Được, vì một người bảo vệ có thể bảo vệ nhiều đương sự trong cùng một vụ án","Được, nếu anh Tuấn đồng ý bằng văn bản"],"a":0,"e":"Khoản 3 Điều 75 BLTTDS: một người bảo vệ có thể bảo vệ quyền lợi cho nhiều đương sự trong cùng vụ án nếu quyền và lợi ích hợp pháp của những người đó không đối lập nhau. Anh Tuấn và bà Hạnh có lợi ích đối lập nên Luật sư C không thể bảo vệ cả hai, kể cả khi một bên đồng ý.","b":"Khoản 3 Điều 75 BLTTDS","cid":"TH3.01"},{"id":"TH3.01.4","g":3,"lv":"VD","q":"Về Thẩm phán được phân công (em ruột bà Hạnh), nhận định nào đúng?","o":["Thẩm phán chỉ không được làm chủ tọa phiên tòa","Thẩm phán được tiếp tục vì không phải là đương sự trong vụ án","Thẩm phán phải từ chối tiến hành tố tụng hoặc bị thay đổi vì là người thân thích của đương sự","Thẩm phán được tiếp tục giải quyết nếu anh Tuấn không phản đối"],"a":2,"e":"Khoản 1 Điều 52 và khoản 1 Điều 53 BLTTDS: Thẩm phán là người thân thích của đương sự (em ruột bà Hạnh) phải từ chối tiến hành tố tụng hoặc bị thay đổi. Đây là căn cứ bắt buộc, không phụ thuộc ý kiến của bên kia và không chỉ giới hạn ở vai trò chủ tọa.","b":"Khoản 1 Điều 52, khoản 1 Điều 53 BLTTDS","cid":"TH3.01"},{"id":"TH3.02.1","g":3,"lv":"VD","q":"Anh K có được làm người đại diện theo ủy quyền của ông Phong không?","o":["Được, nếu Viện trưởng Viện kiểm sát nhân dân khu vực đồng ý","Được, nếu văn bản ủy quyền có công chứng","Không, vì công chức trong cơ quan Viện kiểm sát không được làm người đại diện, trừ khi đại diện cho cơ quan mình hoặc là người đại diện theo pháp luật","Được, vì anh K không được phân công kiểm sát vụ án"],"a":2,"e":"Điều 87 BLTTDS: cán bộ, công chức trong các cơ quan Tòa án, Viện kiểm sát, Thanh tra, Thi hành án, công chức, sĩ quan… ngành Công an không được làm người đại diện theo ủy quyền, trừ trường hợp họ tham gia tố tụng với tư cách người đại diện cho cơ quan của họ hoặc với tư cách là người đại diện theo pháp luật. Việc không được phân công kiểm sát vụ án hay công chứng văn bản ủy quyền không làm thay đổi điều cấm.","b":"Điều 87 BLTTDS","cid":"TH3.02"},{"id":"TH3.02.2","g":3,"lv":"VD","q":"Sau khi bà Thu chết, ai tham gia tố tụng ở vị trí của bà?","o":["Luật sư do Tòa án chỉ định","Không ai; vụ án đương nhiên chấm dứt","Viện kiểm sát tham gia tố tụng thay bà Thu","Người thừa kế của bà Thu kế thừa quyền, nghĩa vụ tố tụng"],"a":3,"e":"Khoản 1 Điều 74 BLTTDS: đương sự là cá nhân chết mà quyền, nghĩa vụ về tài sản được thừa kế thì người thừa kế tham gia tố tụng. Vụ án không đương nhiên chấm dứt; Tòa án có thể tạm đình chỉ để chờ xác định người kế thừa (Điều 214).","b":"Khoản 1 Điều 74 BLTTDS","cid":"TH3.02"},{"id":"TH3.02.3","g":3,"lv":"VD","q":"Con trai bà Thu (19 tuổi, không thuộc trường hợp mất hay hạn chế năng lực hành vi dân sự) có tự mình tham gia tố tụng được không?","o":["Không, vì chưa có thu nhập độc lập","Có, nhưng chỉ khi được người cha đồng ý","Có, vì đã đủ 18 tuổi nên có đầy đủ năng lực hành vi tố tụng dân sự","Không, người cha phải tham gia thay"],"a":2,"e":"Khoản 3 Điều 69 BLTTDS: đương sự là người từ đủ 18 tuổi trở lên có đầy đủ năng lực hành vi tố tụng dân sự, trừ người mất năng lực hành vi, hạn chế năng lực hành vi hoặc có khó khăn trong nhận thức. Con trai bà Thu 19 tuổi, không thuộc các trường hợp đó, nên tự mình tham gia tố tụng; thu nhập hay sự đồng ý của cha không phải điều kiện.","b":"Khoản 3 Điều 69 BLTTDS","cid":"TH3.02"},{"id":"TH3.03.1","g":3,"lv":"VD","q":"Anh Hưng có thể là người làm chứng trong vụ án không?","o":["Không, chỉ người không quen biết các đương sự mới được làm chứng","Có; nhưng anh Hưng có quyền từ chối khai báo nếu việc khai báo ảnh hưởng xấu, bất lợi cho đương sự là người thân thích của mình","Chỉ được nếu bà Nga đồng ý","Không, vì là người thân thích của nguyên đơn"],"a":1,"e":"Điều 77 BLTTDS không loại trừ người thân thích của đương sự khỏi tư cách người làm chứng. Điểm d khoản 1 Điều 78 cho phép người làm chứng từ chối khai báo nếu lời khai liên quan đến bí mật hoặc có thể ảnh hưởng xấu, bất lợi cho đương sự là người có quan hệ thân thích với mình.","b":"Điều 77, Điều 78 BLTTDS","cid":"TH3.03"},{"id":"TH3.03.2","g":3,"lv":"VD","q":"Để bà Nga trình bày ý kiến tại phiên tòa, ai được tham gia tố tụng?","o":["Người biết ký hiệu ngôn ngữ của người khuyết tật nghe, nói, được coi là người phiên dịch","Bắt buộc phải có luật sư trình bày thay bà Nga","Thư ký Tòa án trình bày thay bà Nga","Không cần ai; Tòa án chỉ căn cứ bản tự khai của bà Nga"],"a":0,"e":"Điều 20 và Điều 81 BLTTDS: người khuyết tật nghe, nói có quyền dùng ngôn ngữ của người khuyết tật; người biết ký hiệu ngôn ngữ của người khuyết tật được coi là người phiên dịch. Luật sư hay Thư ký không trình bày thay; Tòa án không được bỏ qua quyền trình bày của bà Nga.","b":"Điều 20, Điều 81 BLTTDS","cid":"TH3.03"},{"id":"TH3.03.3","g":3,"lv":"VD","q":"Đề nghị thay đổi Hội thẩm X được giải quyết như thế nào?","o":["Không có căn cứ, vì Hội thẩm X không phải là người thân thích của ông Lâm","Có căn cứ rõ ràng cho rằng Hội thẩm X có thể không vô tư; Hội đồng xét xử quyết định theo đa số sau khi nghe ý kiến của Hội thẩm X","Chủ tọa phiên tòa tự quyết định, không cần nghe ý kiến của Hội thẩm X","Chánh án Tòa án quyết định ngay tại phiên tòa"],"a":1,"e":"Khoản 3 Điều 52 BLTTDS: người tiến hành tố tụng phải từ chối hoặc bị thay đổi nếu có căn cứ rõ ràng khác cho rằng họ có thể không vô tư trong khi làm nhiệm vụ. Theo khoản 2 Điều 56, tại phiên tòa việc thay đổi Hội thẩm do Hội đồng xét xử quyết định theo đa số sau khi nghe ý kiến của người bị yêu cầu thay đổi.","b":"Khoản 3 Điều 52, khoản 2 Điều 56 BLTTDS","cid":"TH3.03"},{"id":"4.01","g":4,"lv":"TH","q":"Chứng cứ trong tố tụng dân sự có những thuộc tính nào?","o":["Tính chính xác, tính đầy đủ, tính có hiệu lực thi hành","Tính khách quan, tính kịp thời, tính bảo mật","Tính khách quan, tính liên quan, tính hợp pháp","Tính bắt buộc, tính phổ biến, tính công khai"],"a":2,"e":"Điều 93 BLTTDS: chứng cứ là những gì có thật được đương sự, cơ quan, tổ chức, cá nhân giao nộp hoặc Tòa án thu thập theo trình tự luật định và được dùng làm căn cứ xác định tình tiết khách quan của vụ án. Từ đó, chứng cứ có ba thuộc tính: khách quan, liên quan, hợp pháp.","b":"Điều 93 BLTTDS"},{"id":"4.02","g":4,"lv":"TH","q":"Theo Điều 94 BLTTDS, đâu không phải là nguồn chứng cứ?","o":["Nhận định của Thẩm phán về vụ án","Lời khai của người làm chứng","Kết quả định giá tài sản","Dữ liệu điện tử"],"a":0,"e":"Điều 94 BLTTDS liệt kê nguồn chứng cứ: tài liệu đọc, nghe, nhìn được, dữ liệu điện tử; vật chứng; lời khai của đương sự, người làm chứng; kết luận giám định; biên bản thẩm định tại chỗ; kết quả định giá, thẩm định giá; văn bản ghi nhận sự kiện do người có chức năng lập; văn bản công chứng, chứng thực; nguồn khác. Nhận định của Thẩm phán là kết quả đánh giá chứng cứ, không phải nguồn chứng cứ.","b":"Điều 94 BLTTDS"},{"id":"4.03","g":4,"lv":"TH","q":"Tài liệu đọc được được coi là chứng cứ khi đáp ứng điều kiện nào?","o":["Là bản chính, bản sao có công chứng, chứng thực hoặc do cơ quan có thẩm quyền cung cấp, xác nhận","Được lập trong thời hạn 03 năm trước ngày khởi kiện và có chữ ký của các bên","Là bản phô tô có chữ ký xác nhận của ít nhất hai người làm chứng không phải người thân thích","Được đương sự giao nộp và đọc công khai toàn bộ nội dung tại phiên tòa sơ thẩm"],"a":0,"e":"Khoản 1 Điều 95 BLTTDS: tài liệu đọc được nội dung được coi là chứng cứ nếu là bản chính hoặc bản sao có công chứng, chứng thực hợp pháp hoặc do cơ quan, tổ chức có thẩm quyền cung cấp, xác nhận. Bản phô tô có người làm chứng ký hay việc đọc công khai tại phiên tòa không làm tài liệu trở thành chứng cứ hợp lệ.","b":"Khoản 1 Điều 95 BLTTDS"},{"id":"4.04","g":4,"lv":"TH","q":"Bản ghi âm do đương sự tự thu được coi là chứng cứ khi nào?","o":["Khi được Công an cấp xã nơi đương sự cư trú xác nhận nội dung","Khi đã được giám định tính nguyên vẹn trong mọi trường hợp","Khi người bị ghi âm đồng ý bằng văn bản trước thời điểm ghi âm","Khi kèm văn bản trình bày về xuất xứ của bản ghi âm"],"a":3,"e":"Khoản 2 Điều 95 BLTTDS: tài liệu nghe được, nhìn được được coi là chứng cứ nếu được xuất trình kèm theo văn bản trình bày của người có tài liệu đó về xuất xứ, hoặc văn bản xác nhận xuất xứ, hoặc văn bản về sự việc liên quan tới việc thu âm, thu hình. Không cần sự đồng ý của người bị ghi âm hay xác nhận của Công an; giám định chỉ đặt ra khi có tranh chấp về tính xác thực.","b":"Khoản 2 Điều 95 BLTTDS"},{"id":"4.05","g":4,"lv":"TH","q":"Tình tiết nào sau đây không phải chứng minh?","o":["Tình tiết ghi trong giấy viết tay có chữ ký của bị đơn","Tình tiết đã được xác định trong bản án của Tòa án đã có hiệu lực pháp luật","Tình tiết do người làm chứng là người thân thích của nguyên đơn xác nhận","Tình tiết do nguyên đơn trình bày trong đơn khởi kiện"],"a":1,"e":"Điểm b khoản 1 Điều 92 BLTTDS: những tình tiết đã được xác định trong bản án, quyết định của Tòa án đã có hiệu lực pháp luật hoặc quyết định của cơ quan nhà nước có thẩm quyền đã có hiệu lực thì không phải chứng minh. Tình tiết trong đơn khởi kiện, lời người làm chứng hay giấy viết tay vẫn phải được đánh giá, chứng minh.","b":"Điểm b khoản 1 Điều 92 BLTTDS"},{"id":"4.06","g":4,"lv":"TH","q":"Sự thừa nhận của người đại diện hợp pháp của đương sự về tình tiết của vụ án có giá trị thế nào?","o":["Chỉ có giá trị khi đương sự có mặt tại phiên tòa và không phản đối","Được coi là sự thừa nhận của đương sự nếu không vượt quá phạm vi đại diện","Chỉ có giá trị khi văn bản thừa nhận được công chứng","Không có giá trị vì chỉ đương sự mới được thừa nhận tình tiết"],"a":1,"e":"Khoản 3 Điều 92 BLTTDS: sự thừa nhận của người đại diện hợp pháp của đương sự được coi là sự thừa nhận của đương sự nếu không vượt quá phạm vi đại diện. Không đòi hỏi đương sự có mặt hay công chứng văn bản thừa nhận.","b":"Khoản 3 Điều 92 BLTTDS"},{"id":"4.07","g":4,"lv":"TH","q":"Đương sự có yêu cầu nhưng không đưa ra được hoặc đưa ra không đủ chứng cứ thì Tòa án xử lý thế nào?","o":["Tạm đình chỉ cho đến khi đương sự bổ sung đủ chứng cứ","Giải quyết vụ việc theo những chứng cứ đã thu thập được có trong hồ sơ","Tự thu thập toàn bộ chứng cứ còn thiếu thay cho đương sự","Đình chỉ giải quyết vụ án và trả lại tạm ứng án phí"],"a":1,"e":"Khoản 4 Điều 91 BLTTDS: đương sự có nghĩa vụ đưa ra chứng cứ để chứng minh mà không đưa ra được hoặc đưa ra không đủ thì Tòa án giải quyết vụ việc theo những chứng cứ đã thu thập được có trong hồ sơ. Tòa án không thu thập thay toàn bộ, không đình chỉ hay tạm đình chỉ vì lý do này.","b":"Khoản 4 Điều 91 BLTTDS"},{"id":"4.08","g":4,"lv":"VD","q":"Người tiêu dùng khởi kiện tổ chức kinh doanh hàng hóa đòi bồi thường thiệt hại. Nghĩa vụ chứng minh về lỗi thuộc về ai?","o":["Tòa án phải tự thu thập chứng cứ về lỗi","Tổ chức kinh doanh phải chứng minh mình không có lỗi","Cơ quan quản lý nhà nước về bảo vệ người tiêu dùng","Người tiêu dùng phải chứng minh lỗi của tổ chức kinh doanh"],"a":1,"e":"Điểm a khoản 1 Điều 91 BLTTDS: người tiêu dùng khởi kiện không có nghĩa vụ chứng minh lỗi của tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ; bên kinh doanh bị kiện có nghĩa vụ chứng minh mình không có lỗi gây ra thiệt hại theo Luật Bảo vệ quyền lợi người tiêu dùng. Đây là ngoại lệ đảo nghĩa vụ chứng minh.","b":"Điểm a khoản 1 Điều 91 BLTTDS"},{"id":"4.09","g":4,"lv":"TH","q":"Bị đơn phản đối yêu cầu của nguyên đơn có nghĩa vụ gì?","o":["Thể hiện sự phản đối bằng văn bản và giao nộp chứng cứ để chứng minh","Không có nghĩa vụ chứng minh vì nghĩa vụ đó chỉ thuộc về nguyên đơn","Chỉ cần trình bày miệng tại phiên tòa","Nộp khoản tiền bảo đảm bằng giá trị yêu cầu khởi kiện"],"a":0,"e":"Khoản 2 Điều 91 BLTTDS: đương sự phản đối yêu cầu của người khác đối với mình phải thể hiện sự phản đối đó bằng văn bản và phải thu thập, cung cấp, giao nộp cho Tòa án tài liệu, chứng cứ để chứng minh cho sự phản đối. Nghĩa vụ chứng minh không chỉ thuộc về nguyên đơn.","b":"Khoản 2 Điều 91 BLTTDS"},{"id":"4.10","g":4,"lv":"TH","q":"Thời hạn giao nộp tài liệu, chứng cứ trong vụ án dân sự được xác định thế nào?","o":["Chỉ trước khi Tòa án thụ lý vụ án","Do Thẩm phán ấn định nhưng không vượt quá thời hạn chuẩn bị xét xử sơ thẩm","Trong 15 ngày kể từ ngày nộp đơn khởi kiện","Bất cứ lúc nào trước khi tuyên án sơ thẩm, không cần nêu lý do"],"a":1,"e":"Khoản 4 Điều 96 BLTTDS: thời hạn giao nộp tài liệu, chứng cứ do Thẩm phán được phân công giải quyết vụ việc ấn định nhưng không được vượt quá thời hạn chuẩn bị xét xử theo thủ tục sơ thẩm. Giao nộp sau thời hạn chỉ được chấp nhận khi có lý do chính đáng hoặc chứng cứ mà trước đó Tòa án không yêu cầu.","b":"Khoản 4 Điều 96 BLTTDS"},{"id":"4.11","g":4,"lv":"TH","q":"Cơ quan, tổ chức nhận ủy thác thu thập chứng cứ phải thực hiện trong thời hạn nào?","o":["15 ngày kể từ ngày nhận được quyết định ủy thác","07 ngày làm việc kể từ ngày nhận được quyết định ủy thác","01 tháng kể từ ngày nhận được quyết định ủy thác","03 tháng kể từ ngày nhận được quyết định ủy thác"],"a":2,"e":"Khoản 3 Điều 105 BLTTDS: cơ quan, tổ chức nhận được quyết định ủy thác có trách nhiệm thực hiện trong thời hạn 01 tháng kể từ ngày nhận được và thông báo kết quả bằng văn bản cho Tòa án đã ủy thác; không thực hiện được phải thông báo nêu rõ lý do.","b":"Khoản 3 Điều 105 BLTTDS"},{"id":"4.12","g":4,"lv":"TH","q":"Cơ quan, tổ chức đang lưu giữ tài liệu phải cung cấp cho Tòa án trong thời hạn nào kể từ ngày nhận được yêu cầu của Tòa án?","o":["03 ngày làm việc","30 ngày làm việc","01 tháng","15 ngày"],"a":3,"e":"Khoản 3 Điều 106 BLTTDS: cơ quan, tổ chức, cá nhân đang lưu giữ tài liệu, chứng cứ có trách nhiệm cung cấp đầy đủ cho Tòa án trong thời hạn 15 ngày kể từ ngày nhận được yêu cầu; hết thời hạn mà không cung cấp phải thông báo bằng văn bản nêu rõ lý do.","b":"Khoản 3 Điều 106 BLTTDS"},{"id":"4.13","g":4,"lv":"TH","q":"Khi xem xét, thẩm định tại chỗ thửa đất đang tranh chấp, Thẩm phán phải bảo đảm điều kiện nào?","o":["Có mặt đầy đủ các thành viên Hội đồng xét xử và Kiểm sát viên","Có văn bản đồng ý của tất cả đương sự trong vụ án","Có đại diện UBND hoặc Công an cấp xã nơi có đất, báo trước cho đương sự","Có Thừa phát lại lập vi bằng ghi nhận toàn bộ hiện trạng thửa đất"],"a":2,"e":"Khoản 1 Điều 101 BLTTDS: việc xem xét, thẩm định tại chỗ phải được báo trước cho Ủy ban nhân dân cấp xã hoặc cơ quan, tổ chức nơi có đối tượng cần xem xét và phải có đại diện của họ tham gia; đương sự phải được báo trước để chứng kiến. Không đòi hỏi đủ Hội đồng xét xử, Kiểm sát viên, Thừa phát lại hay sự đồng ý của mọi đương sự.","b":"Khoản 1 Điều 101 BLTTDS"},{"id":"4.14","g":4,"lv":"VD","q":"Tòa án từ chối yêu cầu trưng cầu giám định của đương sự. Đương sự có quyền gì?","o":["Không có quyền gì thêm vì việc từ chối là quyết định cuối cùng","Tự mình yêu cầu giám định trước khi Tòa án ra quyết định đưa vụ án ra xét xử sơ thẩm","Đề nghị Viện kiểm sát ra quyết định trưng cầu giám định thay Tòa án","Khởi kiện Tòa án về hành vi từ chối trưng cầu giám định"],"a":1,"e":"Khoản 1 Điều 102 BLTTDS: trường hợp Tòa án từ chối yêu cầu trưng cầu giám định thì đương sự có quyền tự mình yêu cầu giám định sau khi đã đề nghị Tòa án trưng cầu mà bị từ chối, và phải thực hiện trước khi Tòa án ra quyết định đưa vụ án ra xét xử sơ thẩm.","b":"Khoản 1 Điều 102 BLTTDS"},{"id":"4.15","g":4,"lv":"TH","q":"Trường hợp nào Tòa án ra quyết định định giá tài sản và thành lập Hội đồng định giá?","o":["Các đương sự đã cùng chọn tổ chức thẩm định giá và thống nhất kết quả","Các đương sự không thỏa thuận được về giá tài sản tranh chấp","Các đương sự đã thỏa thuận giá phù hợp với giá thị trường","Tài sản tranh chấp là động sản có giá trị nhỏ"],"a":1,"e":"Điểm b khoản 3 Điều 104 BLTTDS: Tòa án ra quyết định định giá tài sản và thành lập Hội đồng định giá khi các đương sự không thỏa thuận được với nhau về giá và cũng không thỏa thuận lựa chọn được tổ chức thẩm định giá, hoặc theo yêu cầu của một bên hoặc các bên. Khi các bên đã thống nhất giá, Tòa án không phải định giá.","b":"Điểm b khoản 3 Điều 104 BLTTDS"},{"id":"4.16","g":4,"lv":"TH","q":"Ngoại lệ của nguyên tắc mọi tài liệu, chứng cứ được công bố và sử dụng công khai như nhau là gì?","o":["Nội dung thuộc bí mật nhà nước, kinh doanh, cá nhân… theo yêu cầu chính đáng","Tài liệu do bị đơn giao nộp sau khi Tòa án đã thụ lý vụ án","Tài liệu bằng tiếng nước ngoài đã có bản dịch tiếng Việt","Tài liệu do Tòa án tự thu thập trong giai đoạn chuẩn bị xét xử"],"a":0,"e":"Khoản 2 Điều 109 BLTTDS: Tòa án không công khai tài liệu, chứng cứ có nội dung liên quan đến bí mật nhà nước, thuần phong mỹ tục, bí mật nghề nghiệp, bí mật kinh doanh, bí mật cá nhân, bí mật gia đình theo yêu cầu chính đáng của đương sự. Nguồn gốc hay thời điểm giao nộp tài liệu không phải căn cứ hạn chế công khai.","b":"Khoản 2 Điều 109 BLTTDS"},{"id":"TH4.01.1","g":4,"lv":"VD","q":"Đoạn ghi âm anh Hải tự thu được coi là chứng cứ khi nào?","o":["Khi kèm văn bản trình bày về xuất xứ của đoạn ghi âm","Khi được Ủy ban nhân dân cấp xã chứng thực nội dung","Khi chị Ngọc đồng ý bằng văn bản cho sử dụng","Khi được phát công khai tại phiên hòa giải có biên bản"],"a":0,"e":"Khoản 2 Điều 95 BLTTDS: bản ghi âm do đương sự tự thu được coi là chứng cứ khi xuất trình kèm văn bản trình bày về xuất xứ của bản ghi âm. Sự đồng ý của chị Ngọc hay chứng thực của Ủy ban nhân dân xã không phải điều kiện.","b":"Khoản 2 Điều 95 BLTTDS","cid":"TH4.01"},{"id":"TH4.01.2","g":4,"lv":"VD","q":"Các tin nhắn Zalo thuộc nguồn chứng cứ nào?","o":["Vật chứng","Văn bản ghi nhận sự kiện, hành vi pháp lý do người có chức năng lập","Dữ liệu điện tử","Lời khai của đương sự"],"a":2,"e":"Tin nhắn Zalo là thông điệp dữ liệu, tức dữ liệu điện tử (khoản 1 Điều 94). Khoản 3 Điều 95 BLTTDS: thông điệp dữ liệu điện tử được thể hiện dưới hình thức trao đổi dữ liệu, chứng từ điện tử, thư điện tử, tin nhắn… và được coi là chứng cứ theo pháp luật về giao dịch điện tử.","b":"Khoản 1 Điều 94, khoản 3 Điều 95 BLTTDS","cid":"TH4.01"},{"id":"TH4.01.3","g":4,"lv":"VD","q":"Ai có nghĩa vụ chứng minh việc chị Ngọc đã trả nợ?","o":["Anh Hải, vì anh là nguyên đơn","Chị Ngọc, vì chị phản đối yêu cầu của anh Hải bằng một tình tiết mới","Không ai phải chứng minh vì chị Ngọc đã thừa nhận có vay","Tòa án, vì giao dịch không lập thành văn bản"],"a":1,"e":"Khoản 2 Điều 91 BLTTDS: đương sự phản đối yêu cầu của người khác phải chứng minh cho sự phản đối. Chị Ngọc thừa nhận có vay nhưng cho rằng đã trả, đây là tình tiết mới do chị đưa ra nên chị có nghĩa vụ chứng minh việc trả nợ.","b":"Khoản 2 Điều 91 BLTTDS","cid":"TH4.01"},{"id":"TH4.02.1","g":4,"lv":"VD","q":"Ông Phong không có bảng chấm công do Công ty X quản lý. Ai phải cung cấp tài liệu này cho Tòa án?","o":["Thanh tra lao động cấp tỉnh nơi Công ty X đặt trụ sở","Ông Phong, vì người khởi kiện phải tự thu thập chứng cứ","Công đoàn cơ sở nơi ông Phong làm việc trước đây","Công ty X, vì đây là tài liệu người sử dụng lao động đang giữ"],"a":3,"e":"Điểm b khoản 1 Điều 91 BLTTDS: đương sự khởi kiện vụ án lao động mà không cung cấp được tài liệu vì tài liệu đó đang do người sử dụng lao động quản lý, lưu giữ thì người sử dụng lao động có trách nhiệm cung cấp cho Tòa án. Đây là ngoại lệ về nghĩa vụ chứng minh nhằm bảo vệ người lao động.","b":"Điểm b khoản 1 Điều 91 BLTTDS","cid":"TH4.02"},{"id":"TH4.02.2","g":4,"lv":"VD","q":"Ngân hàng Y từ chối cung cấp sao kê. Ông Phong có thể làm gì?","o":["Rút đơn khởi kiện vì không có chứng cứ","Đề nghị Viện kiểm sát xử phạt Ngân hàng Y trước khi Tòa án xét xử","Đề nghị Tòa án ra quyết định yêu cầu Ngân hàng Y cung cấp sao kê","Khởi kiện Ngân hàng Y thành một vụ án riêng trước"],"a":2,"e":"Khoản 2 Điều 106 BLTTDS: trường hợp đương sự đã áp dụng các biện pháp cần thiết mà không thể tự mình thu thập được tài liệu thì có thể đề nghị Tòa án ra quyết định yêu cầu cơ quan, tổ chức, cá nhân cung cấp (điểm e khoản 1 Điều 97). Không cần khởi kiện riêng ngân hàng; Viện kiểm sát không xử phạt trong trường hợp này.","b":"Khoản 2 Điều 106, điểm e khoản 1 Điều 97 BLTTDS","cid":"TH4.02"},{"id":"TH4.02.3","g":4,"lv":"VD","q":"Sau khi nhận quyết định yêu cầu cung cấp tài liệu của Tòa án, Ngân hàng Y phải cung cấp trong thời hạn nào?","o":["01 tháng kể từ ngày nhận được yêu cầu","15 ngày kể từ ngày nhận được yêu cầu","03 ngày làm việc kể từ ngày nhận được yêu cầu","Trước ngày mở phiên tòa sơ thẩm, không giới hạn"],"a":1,"e":"Khoản 3 Điều 106 BLTTDS: cơ quan, tổ chức, cá nhân đang lưu giữ tài liệu phải cung cấp đầy đủ trong thời hạn 15 ngày kể từ ngày nhận được yêu cầu của Tòa án.","b":"Khoản 3 Điều 106 BLTTDS","cid":"TH4.02"},{"id":"TH4.03.1","g":4,"lv":"VD","q":"Biện pháp thu thập chứng cứ nào phù hợp nhất để xác định hiện trạng phần đất bị lấn?","o":["Trưng cầu giám định chữ ký","Xem xét, thẩm định tại chỗ","Đối chất giữa bà Mai và ông Đức","Ủy thác cho Tòa án khác thu thập chứng cứ"],"a":1,"e":"Điểm đ khoản 2 Điều 97 và Điều 101 BLTTDS: xem xét, thẩm định tại chỗ là biện pháp Tòa án dùng để xác định hiện trạng đối tượng tranh chấp như thửa đất bị lấn chiếm. Đối chất, ủy thác hay giám định chữ ký không giúp xác định hiện trạng đất.","b":"Điểm đ khoản 2 Điều 97, Điều 101 BLTTDS","cid":"TH4.03"},{"id":"TH4.03.2","g":4,"lv":"VD","q":"Hai bên đưa ra hai mức giá khác nhau và không thỏa thuận được. Tòa án xử lý thế nào?","o":["Ra quyết định định giá tài sản và thành lập Hội đồng định giá","Lấy mức giá do nguyên đơn đưa ra","Lấy mức giá thấp hơn để bảo vệ bị đơn","Tạm đình chỉ giải quyết vụ án cho đến khi hai bên thống nhất giá"],"a":0,"e":"Điểm b khoản 3 Điều 104 BLTTDS: khi các đương sự không thỏa thuận được về giá tài sản, Tòa án ra quyết định định giá và thành lập Hội đồng định giá. Tòa án không tự lấy mức giá của một bên, không tạm đình chỉ chờ các bên thống nhất.","b":"Điểm b khoản 3 Điều 104 BLTTDS","cid":"TH4.03"},{"id":"TH4.03.3","g":4,"lv":"VD","q":"Khi Tòa án tiến hành thẩm định tại chỗ, ông Đức khóa cổng, không cho đoàn vào đo đạc. Thẩm phán có quyền gì?","o":["Đình chỉ giải quyết vụ án vì không thu thập được chứng cứ","Bác ngay yêu cầu của ông Đức trong bản án","Yêu cầu Ủy ban nhân dân cấp xã, Công an nơi có đất hỗ trợ","Tuyên ông Đức thua kiện ngay tại buổi thẩm định"],"a":2,"e":"Khoản 3, 4 Điều 101 BLTTDS: mọi người không được cản trở việc xem xét, thẩm định tại chỗ; trường hợp có người cản trở, Thẩm phán có quyền yêu cầu cơ quan có thẩm quyền (Ủy ban nhân dân cấp xã, Công an) hỗ trợ. Hành vi cản trở có thể bị xử lý nhưng không làm Tòa án tuyên ngay kết quả vụ án.","b":"Khoản 3, khoản 4 Điều 101 BLTTDS","cid":"TH4.03"},{"id":"5.01","g":5,"lv":"TH","q":"Trong quá trình giải quyết vụ án, chủ thể nào có quyền yêu cầu Tòa án áp dụng biện pháp khẩn cấp tạm thời?","o":["Đương sự, người đại diện hợp pháp, cơ quan, tổ chức khởi kiện theo Điều 187","Chỉ nguyên đơn hoặc người đại diện theo ủy quyền của nguyên đơn","Chỉ Viện kiểm sát cùng cấp khi kiểm sát việc giải quyết vụ án","Cơ quan thi hành án dân sự nơi có tài sản tranh chấp"],"a":0,"e":"Khoản 1 Điều 111 BLTTDS: đương sự, người đại diện hợp pháp của đương sự hoặc cơ quan, tổ chức khởi kiện vụ án quy định tại Điều 187 có quyền yêu cầu Tòa án áp dụng biện pháp khẩn cấp tạm thời. Quyền này không chỉ của nguyên đơn; Viện kiểm sát và cơ quan thi hành án không có quyền yêu cầu.","b":"Khoản 1 Điều 111 BLTTDS"},{"id":"5.02","g":5,"lv":"TH","q":"Trong tình thế khẩn cấp cần bảo vệ ngay chứng cứ, cá nhân được yêu cầu Tòa án áp dụng biện pháp khẩn cấp tạm thời vào thời điểm nào?","o":["Đồng thời với việc nộp đơn khởi kiện","Chỉ tại phiên tòa sơ thẩm","Sau khi Tòa án thụ lý và hòa giải không thành","Trước khi nộp đơn khởi kiện tối đa 30 ngày"],"a":0,"e":"Khoản 2 Điều 111 BLTTDS: trong trường hợp do tình thế khẩn cấp cần phải bảo vệ ngay chứng cứ, ngăn chặn hậu quả nghiêm trọng có thể xảy ra, cá nhân có quyền yêu cầu áp dụng biện pháp khẩn cấp tạm thời đồng thời với việc nộp đơn khởi kiện.","b":"Khoản 2 Điều 111 BLTTDS"},{"id":"5.03","g":5,"lv":"TH","q":"Biện pháp khẩn cấp tạm thời nào sau đây Tòa án được tự mình áp dụng khi đương sự không yêu cầu?","o":["Kê biên tài sản đang tranh chấp","Cấm xuất cảnh đối với người có nghĩa vụ","Phong tỏa tài khoản tại ngân hàng","Buộc thực hiện trước một phần nghĩa vụ cấp dưỡng"],"a":3,"e":"Điều 135 BLTTDS: Tòa án tự mình áp dụng các biện pháp tại khoản 1, 2, 3, 4, 5 Điều 114 (giao người chưa thành niên cho người trông nom; buộc thực hiện trước một phần nghĩa vụ cấp dưỡng; buộc thực hiện trước một phần nghĩa vụ bồi thường do tính mạng, sức khỏe bị xâm phạm; buộc tạm ứng tiền lương, tiền bảo hiểm…; tạm đình chỉ thi hành quyết định đơn phương chấm dứt hợp đồng lao động) và biện pháp cấm tiếp xúc theo Luật Phòng, chống bạo lực gia đình. Kê biên, phong tỏa, cấm xuất cảnh chỉ áp dụng khi có yêu cầu.","b":"Điều 135 BLTTDS (sửa đổi bởi Luật Phòng, chống bạo lực gia đình 2022)"},{"id":"5.04","g":5,"lv":"TH","q":"Người yêu cầu áp dụng biện pháp khẩn cấp tạm thời nào sau đây phải thực hiện biện pháp bảo đảm?","o":["Buộc người sử dụng lao động tạm ứng tiền lương","Cấm xuất cảnh đối với người có nghĩa vụ","Phong tỏa tài sản của người có nghĩa vụ","Giao người chưa thành niên cho cá nhân trông nom, nuôi dưỡng"],"a":2,"e":"Khoản 1 Điều 136 BLTTDS: người yêu cầu áp dụng các biện pháp như kê biên tài sản, cấm chuyển dịch quyền về tài sản, phong tỏa tài khoản, phong tỏa tài sản… phải nộp một khoản tiền, kim khí quý, đá quý hoặc giấy tờ có giá để bảo đảm. Các biện pháp vì nhu cầu thiết yếu của người yếu thế như tạm ứng tiền lương, giao người chưa thành niên không đòi hỏi bảo đảm.","b":"Khoản 1 Điều 136 BLTTDS"},{"id":"5.05","g":5,"lv":"TH","q":"Khoản tiền bảo đảm khi yêu cầu áp dụng biện pháp khẩn cấp tạm thời được xác định thế nào?","o":["Bằng toàn bộ giá trị yêu cầu khởi kiện của người yêu cầu áp dụng","Tương đương thiệt hại có thể phát sinh do áp dụng không đúng","Bằng mức tạm ứng án phí sơ thẩm mà nguyên đơn phải nộp","Bằng 50% giá trị tài sản bị áp dụng biện pháp khẩn cấp tạm thời"],"a":1,"e":"Khoản 1 Điều 136 BLTTDS: khoản bảo đảm do Tòa án ấn định nhưng phải tương đương với tổn thất hoặc thiệt hại có thể phát sinh do hậu quả của việc áp dụng biện pháp khẩn cấp tạm thời không đúng, nhằm bảo vệ lợi ích của người bị áp dụng. Không tính theo giá trị tài sản hay giá trị yêu cầu khởi kiện.","b":"Khoản 1 Điều 136 BLTTDS"},{"id":"5.06","g":5,"lv":"TH","q":"Yêu cầu áp dụng biện pháp khẩn cấp tạm thời nộp đồng thời với đơn khởi kiện trong tình thế khẩn cấp thì Thẩm phán phải xem xét, ra quyết định trong thời hạn nào?","o":["07 ngày kể từ ngày nhận đơn","15 ngày kể từ ngày nhận đơn","03 ngày làm việc kể từ ngày nhận đơn","48 giờ kể từ thời điểm nhận đơn"],"a":3,"e":"Khoản 3 Điều 133 BLTTDS: trường hợp nhận được đơn yêu cầu áp dụng biện pháp khẩn cấp tạm thời theo khoản 2 Điều 111 (nộp kèm đơn khởi kiện trong tình thế khẩn cấp), Thẩm phán phải xem xét, ra quyết định áp dụng trong thời hạn 48 giờ kể từ thời điểm nhận đơn.","b":"Điều 133 BLTTDS"},{"id":"5.07","g":5,"lv":"TH","q":"Đơn yêu cầu áp dụng biện pháp khẩn cấp tạm thời nộp trong quá trình giải quyết vụ án, trước khi mở phiên tòa, được Thẩm phán xem xét trong thời hạn nào?","o":["48 giờ kể từ thời điểm nhận đơn","07 ngày làm việc kể từ ngày nhận đơn","03 ngày làm việc kể từ ngày nhận đơn","01 tháng kể từ ngày nhận đơn"],"a":2,"e":"Khoản 1 Điều 133 BLTTDS: trường hợp đơn yêu cầu được nộp trước khi mở phiên tòa thì Thẩm phán phải xem xét, giải quyết trong thời hạn 03 ngày làm việc kể từ ngày nhận đơn. Thời hạn 48 giờ áp dụng cho yêu cầu nộp kèm đơn khởi kiện trong tình thế khẩn cấp.","b":"Điều 133 BLTTDS"},{"id":"5.08","g":5,"lv":"TH","q":"Tại phiên tòa, chủ thể nào có thẩm quyền quyết định áp dụng, thay đổi, hủy bỏ biện pháp khẩn cấp tạm thời?","o":["Chánh án Tòa án","Kiểm sát viên tham gia phiên tòa","Hội đồng xét xử","Thư ký phiên tòa"],"a":2,"e":"Khoản 2 Điều 112 BLTTDS: việc áp dụng, thay đổi, hủy bỏ biện pháp khẩn cấp tạm thời tại phiên tòa do Hội đồng xét xử quyết định. Trước khi mở phiên tòa thì do một Thẩm phán quyết định (khoản 1).","b":"Khoản 2 Điều 112 BLTTDS"},{"id":"5.09","g":5,"lv":"TH","q":"Quyết định áp dụng biện pháp khẩn cấp tạm thời có hiệu lực từ khi nào?","o":["Sau 03 ngày làm việc nếu không bị khiếu nại","Có hiệu lực thi hành ngay","Khi bản án sơ thẩm có hiệu lực pháp luật","Sau 15 ngày kể từ ngày ra quyết định"],"a":1,"e":"Điều 139 BLTTDS: quyết định áp dụng, thay đổi, hủy bỏ biện pháp khẩn cấp tạm thời có hiệu lực thi hành ngay; Tòa án phải cấp, gửi ngay cho người có yêu cầu, người bị áp dụng và các cơ quan liên quan. Việc khiếu nại không làm tạm dừng hiệu lực.","b":"Điều 139 BLTTDS"},{"id":"5.10","g":5,"lv":"TH","q":"Đương sự không đồng ý với quyết định áp dụng biện pháp khẩn cấp tạm thời của Thẩm phán trước phiên tòa thì khiếu nại với ai, trong thời hạn nào?","o":["Tòa án cấp trên trực tiếp, trong 15 ngày kể từ ngày nhận quyết định","Viện kiểm sát cùng cấp, trong 07 ngày kể từ ngày nhận quyết định","Chánh án Tòa án cấp trên trực tiếp, trong 01 tháng kể từ ngày nhận quyết định","Chánh án Tòa án đang giải quyết vụ án, trong 03 ngày làm việc kể từ ngày nhận quyết định"],"a":3,"e":"Điều 140 BLTTDS: đương sự có quyền khiếu nại với Chánh án Tòa án đang giải quyết vụ án về quyết định áp dụng, thay đổi, hủy bỏ hoặc không áp dụng biện pháp khẩn cấp tạm thời của Thẩm phán; thời hạn khiếu nại là 03 ngày làm việc kể từ ngày nhận được quyết định.","b":"Điều 140 BLTTDS"},{"id":"5.11","g":5,"lv":"TH","q":"Quyết định giải quyết khiếu nại về biện pháp khẩn cấp tạm thời của Chánh án có giá trị thế nào?","o":["Có thể bị kháng cáo lên Tòa án cấp trên","Là quyết định cuối cùng","Có thể bị khiếu nại tiếp lên Chánh án Tòa án nhân dân tối cao","Chỉ có hiệu lực khi Viện kiểm sát cùng cấp đồng ý"],"a":1,"e":"Khoản 1 Điều 141 BLTTDS: trong thời hạn 03 ngày làm việc kể từ ngày nhận được khiếu nại, Chánh án phải xem xét, giải
