            "Đối với phần mềm và dữ liệu chưa đủ điều kiện ghi nhận giá trị tài sản trong sổ kế toán, công ty phải thực hiện biện pháp quản trị nào?",

          "guide": [
            "Phải phân loại nhãn hiệu, sáng chế, quyền tác giả đối với phần mềm, bí mật kinh doanh đối với dữ liệu và quyền sử dụng giống cây trồng. Cần xác minh chủ thể quyền, căn cứ xác lập, phạm vi, hiệu lực, hợp đồng, nghĩa vụ, tranh chấp và quyền của bên thứ ba.",
