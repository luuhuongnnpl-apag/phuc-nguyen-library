trọng tâm","rows":[{"t":"Nghị định số 96/2024/NĐ-CP","d":"24/07/2024","org":"Chính phủ","note":"Quy định chi tiết một số điều của Luật Kinh doanh bất động sản; tra cứu bản hợp nhất 124/2026/VBHN-NĐ-BXD ngày 30/09/2026.","url":"https://thuvienphapluat.vn/van-ban/bat-dong-san/Van-ban-hop-nhat-124-2026-VBHN-ND-BXD-Nghi-dinh-huong-dan-Luat-Kinh-doanh-bat-dong-san-727620.aspx"},{"t":"Nghị định số 95/2024/NĐ-CP","d":"24/07/2024","org":"Chính phủ","note":"Quy định chi tiết một số điều của Luật Nhà ở.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=95%2F2024%2FN%C4%90-CP&match=True"}]}],"al":[],"ly":{"root":"Pháp luật về tài nguyên đất và bất động sản","ch":[{"t":"Chương 1. Tổng quan pháp luật về tài nguyên đất và bất động sản","cs":"Đề cương chi tiết học phần, Mục 9.1; Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025); Luật Đất đai số 31/2024/QH15 (Văn bản hợp nhất 44/VBHN-VPQH ngày 16/03/2026); Bộ luật Dân sự số 91/2015/QH13; Luật Kinh doanh bất động sản số 29/2023/QH15; Luật Nhà ở số 27/2023/QH15.","c":[{"t":"Khái quát chung về pháp luật về tài nguyên đất","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024, Điều 3, Điều 4 và Điều 9.","c":[{"t":"Khái niệm, đặc điểm đất đai","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024, Điều 3, Điều 4, Điều 9.","b":["Đất đai là bộ phận lãnh thổ quốc gia, tài nguyên thiên nhiên đặc biệt, tư liệu sản xuất quan trọng và không gian cho các hoạt động kinh tế, văn hóa, xã hội, quốc phòng, an ninh.","Đất đai thuộc sở hữu toàn dân; Nhà nước là đại diện chủ sở hữu và thống nhất quản lý. Tổ chức, cá nhân không có quyền sở hữu tư nhân đối với đất đai mà có thể được Nhà nước trao quyền sử dụng đất hoặc nhận quyền sử dụng đất theo quy định.","Đất đai có vị trí cố định, không thể di dời; hoạt động quản lý, khai thác và giao dịch phải gắn với vị trí, ranh giới, địa giới hành chính, quy hoạch và hiện trạng thửa đất.","Đất đai có diện tích hữu hạn, không thể tự mở rộng theo nhu cầu sử dụng; chất lượng và khả năng sinh lợi không đồng nhất do điều kiện tự nhiên, vị trí, hạ tầng và mục đích sử dụng.","Đất đai có tính đa công năng; việc sử dụng cho nông nghiệp, phi nông nghiệp hoặc mục đích khác phải phù hợp phân loại đất và tuân thủ điều kiện, thẩm quyền, trình tự chuyển mục đích.","Đất đai có liên hệ chặt chẽ với môi trường và hệ sinh thái; việc sử dụng tại một khu vực có thể ảnh hưởng nguồn nước, môi trường và quyền, lợi ích của người sử dụng đất liền kề.","Cần phân biệt đất đai với quyền sử dụng đất: đất đai thuộc sở hữu toàn dân; quyền sử dụng đất là quyền tài sản được pháp luật ghi nhận, bảo hộ và cho phép thực hiện trong phạm vi, điều kiện luật định."]},{"t":"Vai trò pháp luật về đất đai","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024; Nghị quyết 18-NQ/TW ngày 16/06/2022.","b":["Xác lập và bảo đảm thực hiện chế độ sở hữu toàn dân về đất đai; xác định vị trí của Nhà nước với tư cách đại diện chủ sở hữu và chủ thể thống nhất quản lý.","Thiết lập khuôn khổ pháp lý để phân bổ nguồn lực đất đai thông qua quy hoạch, kế hoạch sử dụng đất, giao đất, cho thuê đất, công nhận quyền sử dụng đất và cho phép chuyển mục đích sử dụng đất.","Xác định quyền, nghĩa vụ và trách nhiệm của người sử dụng đất; bảo vệ quyền, lợi ích hợp pháp của người sử dụng đất và chủ thể có liên quan.","Điều tiết quan hệ lợi ích giữa Nhà nước, người sử dụng đất, nhà đầu tư và cộng đồng; tạo cơ sở pháp lý cho thu hồi đất, bồi thường, hỗ trợ, tái định cư và nghĩa vụ tài chính.","Bảo vệ tài nguyên đất, kiểm soát ô nhiễm, suy thoái, lãng phí và hành vi sử dụng đất trái pháp luật; hướng tới sử dụng đất tiết kiệm, hiệu quả, bền vững.","Tạo lập môi trường pháp lý cho thị trường quyền sử dụng đất và hoạt động đầu tư, kinh doanh bất động sản; góp phần công khai thông tin, minh bạch giao dịch.","Là công cụ để kiểm tra, thanh tra, xử lý vi phạm và giải quyết tranh chấp, khiếu nại, tố cáo trong quản lý, sử dụng đất."]},{"t":"Nội dung điều chỉnh của pháp luật về tài nguyên đất","cs":"Luật Đất đai 2024; Bộ luật Dân sự 2015 và pháp luật về quy hoạch, đầu tư, xây dựng, tài chính, môi trường có liên quan.","b":["Chế độ sở hữu và đại diện chủ sở hữu: đất đai thuộc sở hữu toàn dân; Nhà nước đại diện chủ sở hữu và thống nhất quản lý.","Quản lý nhà nước về đất đai: điều tra, đo đạc, lập bản đồ; quy hoạch, kế hoạch sử dụng đất; giao đất, cho thuê đất, chuyển mục đích; đăng ký, cấp Giấy chứng nhận; xây dựng cơ sở dữ liệu và hệ thống thông tin đất đai.","Chế độ sử dụng đất: phân loại đất; căn cứ, thời hạn, hạn mức sử dụng; điều kiện, hình thức sử dụng; bảo vệ, cải tạo và phục hồi đất.","Địa vị pháp lý của người sử dụng đất: chủ thể sử dụng đất; quyền chung, nghĩa vụ chung; quyền và nghĩa vụ theo hình thức, nguồn gốc và thời hạn sử dụng đất.","Tài chính và giá đất: tiền sử dụng đất, tiền thuê đất, thuế, phí, lệ phí; giá đất, bảng giá đất, giá đất cụ thể và cơ chế tài chính theo pháp luật hiện hành.","Thu hồi đất, trưng dụng đất, bồi thường, hỗ trợ và tái định cư; bảo đảm điều kiện, trình tự, thẩm quyền và quyền của người có đất bị thu hồi.","Giám sát, kiểm tra, thanh tra, xử lý vi phạm; giải quyết tranh chấp đất đai, khiếu nại, tố cáo và khởi kiện theo thẩm quyền, thủ tục luật định.","Quan hệ giữa pháp luật đất đai với pháp luật dân sự, đầu tư, xây dựng, quy hoạch, nhà ở, kinh doanh bất động sản, thuế, môi trường và tố tụng."]}]},{"t":"Khái quát chung về pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015, Điều 105 và Điều 107; Luật Kinh doanh bất động sản 2023, Điều 1 và Điều 3; Luật Nhà ở 2023, Điều 2.","c":[{"t":"Khái niệm, đặc điểm bất động sản","cs":"Bộ luật Dân sự 2015, Điều 105 và Điều 107; Luật Kinh doanh bất động sản 2023, Điều 3.","b":["Theo Điều 107 Bộ luật Dân sự năm 2015, bất động sản bao gồm đất đai; nhà, công trình xây dựng gắn liền với đất đai; tài sản khác gắn liền với đất đai, nhà, công trình xây dựng; và tài sản khác theo quy định của pháp luật.","Bất động sản là một loại tài sản; cần phân biệt khái niệm bất động sản trong pháp luật dân sự với phạm vi bất động sản, dự án bất động sản và hoạt động kinh doanh bất động sản được điều chỉnh chuyên biệt bởi Luật Kinh doanh bất động sản.","Quyền sử dụng đất không đồng nhất với quyền sở hữu đất đai. Đối tượng giao dịch có thể là quyền sử dụng đất, tài sản gắn liền với đất hoặc dự án bất động sản theo điều kiện luật định.","Bất động sản có tính bất động về vị trí; giá trị và khả năng khai thác chịu ảnh hưởng của vị trí, kết nối hạ tầng, quy hoạch, môi trường và điều kiện kinh tế - xã hội.","Bất động sản có tính cá biệt, không đồng nhất; các tài sản khác nhau về diện tích, kết cấu, mục đích sử dụng, tình trạng pháp lý, chất lượng công trình và khả năng sinh lợi.","Bất động sản thường có giá trị lớn, thời gian khai thác dài và chịu sự điều chỉnh của nhiều lĩnh vực pháp luật; giao dịch đòi hỏi kiểm tra chủ thể, quyền đối với tài sản, quy hoạch, nghĩa vụ tài chính và điều kiện giao dịch.","Bất động sản có tính khan hiếm tương đối và chịu tác động của chu kỳ thị trường; nguồn cung, nhu cầu, tín dụng, chính sách đất đai, quy hoạch và đầu tư hạ tầng có thể làm thay đổi giá trị.","Quyền đối với bất động sản phải được thực hiện trong giới hạn pháp luật, bảo đảm lợi ích công cộng, trật tự đô thị, an sinh xã hội và bảo vệ môi trường."]},{"t":"Vai trò pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Kinh doanh bất động sản 2023.","b":["Xác định địa vị pháp lý của bất động sản và quyền của chủ sở hữu, người sử dụng đất, chủ đầu tư, bên mua, bên thuê và các chủ thể liên quan.","Thiết lập điều kiện pháp lý để tạo lập, phát triển, đưa bất động sản vào kinh doanh và thực hiện giao dịch trên thị trường.","Bảo đảm an toàn pháp lý cho giao dịch thông qua yêu cầu về thông tin, hồ sơ, điều kiện của bất động sản, hình thức hợp đồng, công chứng, chứng thực và đăng ký khi pháp luật quy định.","Bảo vệ người mua, người thuê, người thuê mua và nhà đầu tư; kiểm soát việc huy động vốn, kinh doanh nhà ở và công trình xây dựng hình thành trong tương lai.","Tạo môi trường cạnh tranh, công khai, minh bạch; phòng ngừa gian lận, cung cấp thông tin sai lệch và kinh doanh bất động sản không đủ điều kiện.","Điều tiết thị trường gắn với quy hoạch, kế hoạch sử dụng đất, chương trình phát triển nhà ở, phát triển đô thị và mục tiêu ổn định kinh tế - xã hội.","Hài hòa lợi ích giữa Nhà nước, nhà đầu tư, người sử dụng bất động sản và cộng đồng; góp phần sử dụng hiệu quả nguồn lực đất đai và tài sản gắn liền với đất."]},{"t":"Nội dung điều chỉnh của pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Kinh doanh bất động sản 2023; pháp luật về đầu tư, xây dựng, quy hoạch, thuế và bảo vệ người tiêu dùng.","b":["Xác lập, thực hiện và bảo vệ quyền đối với bất động sản: quyền sở hữu nhà ở, công trình xây dựng; quyền sử dụng đất; quyền khác đối với tài sản và các biện pháp bảo đảm.","Tạo lập bất động sản và phát triển dự án: chấp thuận đầu tư, quy hoạch, đất đai, xây dựng, nghiệm thu và điều kiện đưa sản phẩm vào kinh doanh.","Quản lý nhà ở và công trình xây dựng: phát triển nhà ở, sở hữu, quản lý sử dụng, giao dịch, nhà ở xã hội và các loại hình nhà ở theo luật chuyên ngành.","Kinh doanh bất động sản: điều kiện đối với tổ chức, cá nhân kinh doanh; điều kiện đối với nhà ở, công trình xây dựng và quyền sử dụng đất đưa vào kinh doanh; công khai thông tin; kinh doanh và chuyển nhượng dự án.","Các hình thức kinh doanh: mua bán, cho thuê, cho thuê lại, thuê mua nhà ở, công trình xây dựng; chuyển nhượng, cho thuê, cho thuê lại quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản.","Kinh doanh dịch vụ bất động sản: sàn giao dịch, môi giới, tư vấn và quản lý bất động sản; điều kiện hành nghề, quyền, nghĩa vụ và trách nhiệm của chủ thể cung ứng dịch vụ.","Hợp đồng và giao dịch bất động sản: giao kết, thực hiện, sửa đổi, chuyển nhượng hợp đồng; thanh toán; bàn giao; bảo hành; đăng ký quyền và xử lý vi phạm hợp đồng.","Quản lý nhà nước đối với thị trường bất động sản: hệ thống thông tin, cơ sở dữ liệu; điều tiết thị trường; kiểm tra, thanh tra và xử lý vi phạm.","Giải quyết tranh chấp và bảo vệ quyền lợi: thương lượng, hòa giải, trọng tài hoặc Tòa án theo thỏa thuận và quy định pháp luật."]}]}]},{"t":"Chương 2. Quản lý nhà nước trong lĩnh vực đất đai","cs":"Đề cương chi tiết học phần, Mục 9.2; Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025); Luật Đất đai số 31/2024/QH15, Văn bản hợp nhất 44/VBHN-VPQH ngày 16/03/2026; Nghị định 102/2024/NĐ-CP (được sửa đổi, bổ sung); Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT ngày 02/04/2026; Nghị quyết 254/2025/QH15 và các Nghị định 49/2026/NĐ-CP, 50/2026/NĐ-CP.","c":[{"t":"Hệ thống cơ quan quản lý nhà nước về đất đai","cs":"Luật Đất đai 2024, các quy định về trách nhiệm quản lý nhà nước về đất đai; Nghị định 151/2025/NĐ-CP, được sửa đổi, bổ sung và hợp nhất tại 41/VBHN-BNNMT ngày 02/04/2026.","b":["Quản lý nhà nước về đất đai được tổ chức trong hệ thống cơ quan hành chính nhà nước từ trung ương đến địa phương; cơ quan có thẩm quyền thực hiện nhiệm vụ theo phân công, phân cấp, phân quyền và quy định chuyên ngành.","Chính phủ thống nhất quản lý nhà nước về đất đai trên phạm vi cả nước; tổ chức thi hành pháp luật, ban hành văn bản theo thẩm quyền, chỉ đạo các bộ, ngành và chính quyền địa phương.","Bộ Nông nghiệp và Môi trường là cơ quan đầu mối giúp Chính phủ thực hiện quản lý nhà nước về đất đai; tham mưu chính sách, hướng dẫn chuyên môn, tổ chức điều tra cơ bản, xây dựng hệ thống thông tin và theo dõi việc thi hành pháp luật theo chức năng được giao.","Các bộ, cơ quan ngang bộ thực hiện quản lý nhà nước về đất đai trong phạm vi ngành, lĩnh vực được phân công; phối hợp với cơ quan quản lý đất đai trong quy hoạch, đầu tư, xây dựng, tài chính, thuế, môi trường, quốc phòng và an ninh.","Chính quyền địa phương thực hiện quản lý đất đai trên địa bàn theo thẩm quyền; tổ chức thực hiện quy hoạch, kế hoạch sử dụng đất, thủ tục hành chính, giao đất, cho thuê đất, thu hồi đất, đăng ký đất đai và các nhiệm vụ khác được pháp luật giao.","Trong mô hình chính quyền địa phương 02 cấp, thẩm quyền của cấp tỉnh và cấp xã được xác định theo Luật Đất đai và văn bản phân định, phân quyền, phân cấp; không mặc nhiên áp dụng quy định về thẩm quyền của cấp huyện trước khi tổ chức lại chính quyền địa phương.","Nghị định 151/2025/NĐ-CP, được sửa đổi, bổ sung và hợp nhất tại Văn bản hợp nhất 41/VBHN-BNNMT, là căn cứ quan trọng để xác định nhiệm vụ, quyền hạn được chuyển giao hoặc phân định giữa cơ quan cấp tỉnh, cấp xã và cơ quan chuyên môn.","Cơ quan chuyên môn về đất đai, tổ chức đăng ký đất đai và đơn vị có chức năng phát triển quỹ đất thực hiện nhiệm vụ chuyên môn, nghiệp vụ, dịch vụ công theo quy định; không đồng nhất chức năng tham mưu, đăng ký, cung cấp dịch vụ với thẩm quyền quyết định hành chính của cơ quan nhà nước.","Việc xác định đúng cơ quan có thẩm quyền phải căn cứ đồng thời vào loại việc, chủ thể sử dụng đất, đối tượng và địa bàn, cấp hành chính, quy định phân cấp và quy định chuyển tiếp tại thời điểm giải quyết hồ sơ."]},{"t":"Nội dung quản lý nhà nước về đất đai","cs":"Luật Đất đai 2024; Nghị định 102/2024/NĐ-CP (được sửa đổi, bổ sung); Nghị định 101/2024/NĐ-CP (được sửa đổi, bổ sung); Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT.","c":[{"t":"Quy hoạch và kế hoạch sử dụng đất","cs":"Luật Đất đai 2024, các quy định về nguyên tắc, hệ thống, nội dung, lập, điều chỉnh, thẩm định, phê duyệt và tổ chức thực hiện quy hoạch, kế hoạch sử dụng đất.","b":["Quy hoạch sử dụng đất là việc phân bổ, khoanh vùng đất đai theo không gian sử dụng cho các mục tiêu phát triển kinh tế - xã hội, quốc phòng, an ninh, bảo vệ môi trường và thích ứng biến đổi khí hậu trên cơ sở tiềm năng đất đai, nhu cầu sử dụng của ngành, lĩnh vực và địa phương.","Kế hoạch sử dụng đất cụ thể hóa quy hoạch theo kỳ và theo thời gian thực hiện; là căn cứ tổ chức thực hiện các chỉ tiêu, nhiệm vụ sử dụng đất và xem xét một số quyết định hành chính về đất đai theo luật định.","Nguyên tắc lập quy hoạch, kế hoạch: phù hợp chiến lược, quy hoạch tổng thể và quy hoạch có liên quan; bảo đảm thống nhất, đồng bộ; khai thác hợp lý tài nguyên; sử dụng tiết kiệm, hiệu quả; bảo vệ môi trường, di sản và lợi ích công cộng.","Hệ thống quy hoạch, kế hoạch sử dụng đất được tổ chức theo cấp và phạm vi lãnh thổ do Luật Đất đai quy định; phải phân biệt quy hoạch sử dụng đất cấp quốc gia, cấp tỉnh, quy hoạch sử dụng đất quốc phòng, an ninh và các nội dung kế hoạch có liên quan.","Nội dung quy hoạch xác định quan điểm, mục tiêu, chỉ tiêu, định hướng phân bổ không gian sử dụng đất, diện tích các loại đất và giải pháp tổ chức thực hiện; kế hoạch xác định tiến độ, diện tích và danh mục nhiệm vụ cần triển khai trong kỳ.","Việc lập quy hoạch, kế hoạch phải dựa trên điều tra, đánh giá tài nguyên đất, hiện trạng sử dụng, nhu cầu của ngành và địa phương, dự báo biến động, khả năng đầu tư hạ tầng và yêu cầu bảo vệ môi trường.","Trình tự cơ bản gồm: thu thập thông tin, xác định nhu cầu và chỉ tiêu; lập phương án; lấy ý kiến theo quy định; thẩm định; quyết định hoặc phê duyệt; công bố công khai; tổ chức thực hiện, theo dõi và đánh giá.","Quy hoạch, kế hoạch sử dụng đất là căn cứ quan trọng nhưng không tự thân làm phát sinh quyền sử dụng đất cho một chủ thể; việc giao đất, cho thuê đất, chuyển mục đích hoặc thu hồi đất vẫn phải đáp ứng điều kiện, thẩm quyền và trình tự riêng.","Người sử dụng đất và tổ chức, cá nhân có liên quan cần tra cứu quy hoạch, kế hoạch đã được cơ quan có thẩm quyền phê duyệt, công bố; thông tin quy hoạch phải được xem xét cùng hồ sơ pháp lý cụ thể của thửa đất."]},{"t":"Giao đất, cho thuê đất, chuyển mục đích sử dụng đất","cs":"Luật Đất đai 2024, các quy định về căn cứ, thẩm quyền, đối tượng, điều kiện và trình tự giao đất, cho thuê đất, chuyển mục đích sử dụng đất; Nghị định 102/2024/NĐ-CP và Văn bản hợp nhất 46/VBHN-BNNMT ngày 03/04/2026; Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT.","b":["Giao đất là việc Nhà nước ban hành quyết định trao quyền sử dụng đất cho đối tượng có nhu cầu, theo hình thức có thu tiền sử dụng đất hoặc không thu tiền sử dụng đất trong trường hợp luật định.","Cho thuê đất là việc Nhà nước quyết định trao quyền sử dụng đất có thời hạn thông qua hợp đồng thuê đất; tiền thuê đất có thể được trả hằng năm hoặc trả một lần cho cả thời gian thuê trong trường hợp pháp luật cho phép.","Chuyển mục đích sử dụng đất là việc thay đổi mục đích sử dụng từ loại đất này sang loại đất khác; tùy trường hợp phải được cơ quan có thẩm quyền cho phép, phải đăng ký biến động hoặc không phải thực hiện thủ tục xin phép theo luật.","Căn cứ xem xét giao đất, cho thuê đất và cho phép chuyển mục đích gồm quy hoạch, kế hoạch sử dụng đất hoặc căn cứ quy hoạch được luật quy định; nhu cầu sử dụng đất; hồ sơ dự án, năng lực và điều kiện của chủ thể; các điều kiện chuyên ngành tương ứng.","Đối tượng được giao đất, thuê đất và hình thức sử dụng đất được xác định theo chủ thể, mục đích, nguồn gốc và trường hợp cụ thể; không thể suy luận một hình thức áp dụng chung cho mọi tổ chức, hộ gia đình, cá nhân.","Thẩm quyền quyết định được xác định theo loại chủ thể, loại đất và quy định phân định thẩm quyền trong mô hình chính quyền địa phương 02 cấp; phải tra cứu văn bản hiện hành thay vì sử dụng máy móc tên cơ quan hoặc thẩm quyền trước ngày 01/07/2025.","Trình tự cơ bản có thể bao gồm: chuẩn bị hồ sơ; tiếp nhận và kiểm tra; xác định nhu cầu, điều kiện; thẩm định; ban hành quyết định; xác định nghĩa vụ tài chính; ký hợp đồng thuê đất nếu có; bàn giao đất trên thực địa và cập nhật hồ sơ địa chính.","Người được giao đất, thuê đất hoặc chuyển mục đích phải thực hiện nghĩa vụ tài chính, sử dụng đất đúng mục đích, đúng ranh giới, đúng thời hạn và tuân thủ nghĩa vụ khác theo quyết định, hợp đồng và pháp luật.","Trường hợp chuyển mục đích phải xin phép, người sử dụng đất chỉ được thực hiện mục đích mới sau khi có quyết định cho phép và hoàn thành nghĩa vụ theo quy định; việc tự ý chuyển mục đích có thể bị xử lý và buộc khôi phục tình trạng hoặc thực hiện biện pháp khắc phục theo pháp luật.","Cần phân biệt quyết định giao đất, cho thuê đất, cho phép chuyển mục đích với thủ tục đăng ký đất đai, cấp Giấy chứng nhận; đây là các khâu pháp lý liên quan nhưng có đối tượng và ý nghĩa pháp lý khác nhau."]},{"t":"Cấp Giấy chứng nhận","cs":"Luật Đất đai 2024, các quy định về đăng ký đất đai, tài sản gắn liền với đất và cấp Giấy chứng nhận; Nghị định 101/2024/NĐ-CP được sửa đổi, bổ sung; Văn bản hợp nhất 83/VBHN-BNNMT ngày 09/12/2025.","b":["Đăng ký đất đai là việc kê khai, ghi nhận tình trạng pháp lý về quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất và các thông tin liên quan trong hồ sơ địa chính, cơ sở dữ liệu đất đai.","Đăng ký đất đai có tính bắt buộc đối với người sử dụng đất và người được giao đất để quản lý theo quy định; đăng ký tài sản gắn liền với đất được thực hiện theo điều kiện và nhu cầu, trường hợp pháp luật quy định.","Giấy chứng nhận là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền; nội dung ghi nhận phải phù hợp hồ sơ và điều kiện pháp luật.","Cần phân biệt cấp Giấy chứng nhận lần đầu với đăng ký biến động, cấp đổi, cấp lại; mỗi thủ tục có căn cứ, hồ sơ và hệ quả pháp lý khác nhau.","Điều kiện cấp Giấy chứng nhận phụ thuộc nguồn gốc và quá trình sử dụng đất, giấy tờ về quyền, thời điểm sử dụng, tình trạng tranh chấp, vi phạm, quy hoạch và việc thực hiện nghĩa vụ tài chính theo từng trường hợp luật định.","Đối với tài sản gắn liền với đất, việc chứng nhận còn phụ thuộc quyền sở hữu hợp pháp, tình trạng xây dựng, điều kiện tồn tại của tài sản và quy định chuyên ngành về nhà ở, công trình xây dựng.","Hồ sơ thường có đơn đăng ký, giấy tờ về quyền sử dụng đất hoặc tài sản nếu có, giấy tờ nhân thân hoặc pháp nhân, tài liệu về nghĩa vụ tài chính và tài liệu khác tương ứng với trường hợp cụ thể.","Quy trình xử lý gồm tiếp nhận hồ sơ; kiểm tra, xác minh và trích đo khi cần; xác định điều kiện; thực hiện nghĩa vụ tài chính; ký cấp hoặc cập nhật thông tin; trao Giấy chứng nhận và chỉnh lý hồ sơ địa chính.","Cơ quan tiếp nhận, cơ quan giải quyết và người có thẩm quyền ký cấp được xác định theo pháp luật đất đai hiện hành và quy định phân định thẩm quyền của chính quyền địa phương 02 cấp.","Giấy chứng nhận là chứng cứ pháp lý quan trọng nhưng không loại trừ việc xem xét, xử lý khi có căn cứ xác định việc cấp không đúng đối tượng, không đúng diện tích, sai nguồn gốc hoặc vi phạm pháp luật; việc đính chính, thu hồi, hủy hoặc cấp lại phải theo đúng căn cứ và thủ tục luật định."]},{"t":"Thu hồi đất, bồi thường, hỗ trợ, tái định cư","cs":"Luật Đất đai 2024, các quy định về thu hồi đất, bồi thường, hỗ trợ, tái định cư; Nghị định 88/2024/NĐ-CP được sửa đổi, bổ sung bởi Nghị định 226/2025/NĐ-CP; Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT.","b":["Thu hồi đất là việc Nhà nước quyết định thu lại quyền sử dụng đất của người được Nhà nước trao quyền hoặc thu lại đất của người sử dụng đất vi phạm pháp luật theo căn cứ luật định.","Các nhóm căn cứ thu hồi đất gồm thu hồi vì mục đích quốc phòng, an ninh; phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng; vi phạm pháp luật đất đai; chấm dứt việc sử dụng đất theo pháp luật, tự nguyện trả lại đất hoặc trường hợp khác do luật quy định.","Mỗi nhóm thu hồi có điều kiện, căn cứ và trình tự riêng; không phải mọi trường hợp Nhà nước thu hồi đất đều phát sinh quyền được bồi thường về đất.","Bồi thường về đất được xem xét khi đáp ứng điều kiện luật định; hình thức có thể là giao đất có cùng mục đích, bằng tiền hoặc hình thức khác theo trường hợp cụ thể.","Bồi thường thiệt hại về tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại được xác định riêng theo loại tài sản, điều kiện tạo lập, hồ sơ chứng minh và quy định pháp luật.","Hỗ trợ là chính sách của Nhà nước nhằm ổn định đời sống, sản xuất, chuyển đổi nghề nghiệp, tìm kiếm việc làm và các nhu cầu cần thiết khác cho người có đất thu hồi, chủ sở hữu tài sản hoặc đối tượng liên quan theo điều kiện luật định.","Tái định cư là việc Nhà nước bố trí chỗ ở mới cho người có đất ở bị thu hồi phải di chuyển chỗ ở và đủ điều kiện; phương án phải bảo đảm các yêu cầu về điều kiện sống, hạ tầng và chính sách áp dụng.","Trình tự cơ bản gồm thông báo thu hồi; điều tra, khảo sát, đo đạc, kiểm đếm; lập và lấy ý kiến về phương án bồi thường, hỗ trợ, tái định cư; thẩm định, phê duyệt; công khai và tổ chức chi trả, bố trí tái định cư; ban hành và thực hiện quyết định thu hồi theo trình tự luật định.","Người có đất thu hồi có quyền được thông tin, tham gia ý kiến, nhận bồi thường và hỗ trợ nếu đủ điều kiện; đồng thời có trách nhiệm phối hợp kiểm đếm, bàn giao đất và thực hiện quyết định có hiệu lực theo quy định.","Cần phân biệt thu hồi đất với trưng dụng đất: thu hồi làm chấm dứt quyền sử dụng đất theo căn cứ luật định; trưng dụng là biện pháp sử dụng đất trong trường hợp thật cần thiết theo điều kiện, thời hạn và thẩm quyền riêng."]},{"t":"Tài chính về đất đai, giá đất","cs":"Luật Đất đai 2024, các quy định về tài chính đất đai và giá đất; Nghị định 71/2024/NĐ-CP được sửa đổi, bổ sung; Nghị quyết 254/2025/QH15; Nghị định 49/2026/NĐ-CP và Nghị định 50/2026/NĐ-CP.","b":["Tài chính về đất đai là hệ thống các khoản thu, chi và cơ chế điều tiết giá trị đất đai giữa Nhà nước, người sử dụng đất và chủ thể có liên quan theo quy định pháp luật.","Các khoản thu từ đất có thể gồm tiền sử dụng đất, tiền thuê đất, thuế liên quan đến đất, thuế thu nhập từ chuyển quyền, lệ phí trước bạ, phí và lệ phí khác theo pháp luật thuế, phí và đất đai.","Các khoản chi và chính sách tài chính liên quan gồm kinh phí bồi thường, hỗ trợ, tái định cư; chi đầu tư, quản lý, phát triển quỹ đất và các khoản chi hợp pháp khác.","Giá đất là giá trị bằng tiền của quyền sử dụng đất tính trên một đơn vị diện tích; việc xác định giá phải tuân thủ nguyên tắc, phương pháp, dữ liệu và trình tự do pháp luật quy định.","Bảng giá đất do cơ quan có thẩm quyền ở địa phương xây dựng, trình quyết định theo quy định; được sử dụng trong các trường hợp luật định và phải được cập nhật, điều chỉnh theo cơ chế pháp luật hiện hành.","Giá đất cụ thể được xác định cho các trường hợp cần xác định giá riêng theo luật; cần phân biệt giá đất cụ thể với bảng giá đất và giá giao dịch trên thị trường.","Các phương pháp định giá đất được pháp luật quy định có thể bao gồm so sánh, thu nhập, thặng dư và hệ số điều chỉnh giá đất; việc lựa chọn phương pháp phải căn cứ điều kiện dữ liệu, đặc điểm thửa đất và quy định áp dụng.","Nghĩa vụ tài chính về đất phụ thuộc vào nguồn gốc, hình thức sử dụng, mục đích, diện tích, thời hạn, giá đất và chính sách miễn, giảm hoặc ghi nợ được áp dụng.","Nghị quyết 254/2025/QH15 và các Nghị định 49/2026/NĐ-CP, 50/2026/NĐ-CP bổ sung cơ chế tháo gỡ khó khăn trong tổ chức thi hành Luật Đất đai, trong đó có nội dung về tiền sử dụng đất, tiền thuê đất; khi xử lý hồ sơ phải đối chiếu quy định chuyên biệt và điều khoản chuyển tiếp.","Không đồng nhất giá đất do Nhà nước xác định với giá mua bán do các bên thỏa thuận; giá giao dịch chịu tác động thị trường nhưng không thay thế giá, căn cứ tính nghĩa vụ tài chính trong các trường hợp luật định."]},{"t":"Cơ sở dữ liệu về đất đai","cs":"Luật Đất đai 2024, các quy định về hệ thống thông tin, cơ sở dữ liệu đất đai; Nghị định 101/2024/NĐ-CP được sửa đổi, bổ sung; Văn bản hợp nhất 83/VBHN-BNNMT ngày 09/12/2025; Thông tư 19/2026/TT-BNNMT ngày 30/03/2026.","b":["Cơ sở dữ liệu đất đai là tập hợp dữ liệu được tổ chức, quản lý và cập nhật để phản ánh thông tin về thửa đất, người sử dụng đất, người được giao quản lý đất, quyền và nghĩa vụ, tài sản gắn liền với đất và các thông tin quản lý có liên quan.","Hệ thống thông tin đất đai phục vụ quản lý nhà nước, giải quyết thủ tục hành chính, cung cấp thông tin cho tổ chức, cá nhân và hỗ trợ hoạch định chính sách, quy hoạch, đầu tư.","Các nhóm dữ liệu cơ bản gồm dữ liệu địa chính; dữ liệu điều tra, đánh giá, bảo vệ, cải tạo và phục hồi đất; dữ liệu quy hoạch, kế hoạch sử dụng đất; dữ liệu giá đất; dữ liệu thống kê, kiểm kê; dữ liệu thanh tra, kiểm tra và các dữ liệu chuyên ngành liên quan.","Hồ sơ địa chính ghi nhận thông tin pháp lý và kỹ thuật về thửa đất, người sử dụng đất, người được giao quản lý đất và tài sản gắn liền với đất; là cơ sở để đăng ký, cấp Giấy chứng nhận và quản lý biến động.","Dữ liệu phải được thu thập, chuẩn hóa, kiểm tra, cập nhật kịp thời, bảo đảm tính đầy đủ, chính xác, thống nhất, có khả năng kết nối và chia sẻ theo tiêu chuẩn kỹ thuật.","Biến động về người sử dụng đất, diện tích, ranh giới, mục đích, thời hạn, quyền và tài sản gắn liền với đất phải được đăng ký, cập nhật, chỉnh lý theo quy định.","Cơ quan quản lý đất đai và tổ chức đăng ký đất đai thực hiện xây dựng, vận hành, quản lý và khai thác dữ liệu theo chức năng; trách nhiệm cập nhật, cung cấp và khai thác dữ liệu được phân định theo pháp luật.","Việc khai thác thông tin phải đúng mục đích, phạm vi và thẩm quyền; bảo đảm quyền tiếp cận thông tin của tổ chức, cá nhân đồng thời bảo vệ dữ liệu cá nhân, bí mật nhà nước và thông tin thuộc phạm vi hạn chế tiếp cận.","Số hóa hồ sơ, kết nối dữ liệu và cung cấp dịch vụ công trực tuyến góp phần giảm giấy tờ, rút ngắn thời gian xử lý, tăng minh bạch và hỗ trợ giám sát việc quản lý, sử dụng đất.","Chỉ thị 05/CT-TTg ngày 13/02/2026 nhấn mạnh việc tập trung nguồn lực đẩy nhanh đo đạc, đăng ký đất đai, lập hồ sơ địa chính và xây dựng cơ sở dữ liệu quốc gia về đất đai; đây là định hướng tổ chức thực hiện, không thay thế quy định pháp luật về đăng ký và cập nhật dữ liệu."]}]}]},{"t":"Chương 3. Địa vị pháp lý của người sử dụng đất","cs":"Đề cương chi tiết học phần, Mục 9.3; Luật Đất đai số 31/2024/QH15, Văn bản hợp nhất 44/VBHN-VPQH ngày 16/03/2026; Bộ luật Dân sự số 91/2015/QH13; Nghị định 102/2024/NĐ-CP và các văn bản sửa đổi, bổ sung; Nghị định 151/2025/NĐ-CP, Văn bản hợp nhất 41/VBHN-BNNMT ngày 02/04/2026.","c":[{"t":"Địa vị pháp lý của người sử dụng đất","cs":"Luật Đất đai 2024, Điều 3, Điều 4, Điều 26, Điều 28 và các quy định về người sử dụng đất.","c":[{"t":"Khái niệm người sử dụng đất","cs":"Luật Đất đai 2024, Điều 3 và Điều 4.","b":["Người sử dụng đất là chủ thể được Nhà nước giao đất, cho thuê đất, công nhận quyền sử dụng đất; nhận chuyển quyền sử dụng đất hoặc sử dụng đất theo căn cứ khác được Luật Đất đai thừa nhận.","Người sử dụng đất không phải là chủ sở hữu đất đai. Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý; người sử dụng đất có quyền sử dụng đất trong phạm vi, thời hạn, mục đích và điều kiện pháp luật quy định.","Quyền sử dụng đất là quyền tài sản được pháp luật ghi nhận; nội dung quyền phụ thuộc vào chủ thể sử dụng, loại đất, nguồn gốc sử dụng, hình thức Nhà nước giao hoặc cho thuê, thời hạn và việc thực hiện nghĩa vụ tài chính.","Địa vị pháp lý của người sử dụng đất bao gồm tổng thể quyền, nghĩa vụ, trách nhiệm và bảo đảm pháp lý của chủ thể trong quan hệ đất đai; được xác định bởi Luật Đất đai và các quy định dân sự, đầu tư, nhà ở, kinh doanh bất động sản có liên quan.","Người sử dụng đất có thể đồng thời là chủ sở hữu tài sản gắn liền với đất; quyền đối với đất và quyền sở hữu tài sản gắn liền với đất là các quyền pháp lý có đối tượng khác nhau, dù thường được ghi nhận trong cùng Giấy chứng nhận.","Quyền của người sử dụng đất được thực hiện trên cơ sở có căn cứ pháp lý hợp lệ, đúng mục đích và thời hạn; việc thực hiện quyền định đoạt như chuyển nhượng, tặng cho, thế chấp, góp vốn phải đáp ứng điều kiện và thủ tục luật định.","Địa vị pháp lý của người sử dụng đất phải được xem xét theo thời điểm phát sinh quan hệ và văn bản pháp luật áp dụng; các quy định chuyển tiếp có thể ảnh hưởng đến hồ sơ, giao dịch được xác lập trước khi luật mới có hiệu lực."]},{"t":"Phân loại người sử dụng đất","cs":"Luật Đất đai 2024, Điều 4 và các quy định về giao đất, cho thuê đất, công nhận quyền sử dụng đất.","b":["Nhóm chủ thể gồm cá nhân trong nước; người Việt Nam định cư ở nước ngoài là công dân Việt Nam; cộng đồng dân cư; tổ chức trong nước; tổ chức tôn giáo, tổ chức tôn giáo trực thuộc; tổ chức kinh tế có vốn đầu tư nước ngoài; tổ chức nước ngoài có chức năng ngoại giao và các chủ thể khác được Luật Đất đai quy định.","Tổ chức trong nước bao gồm cơ quan nhà nước, đơn vị sự nghiệp công lập, tổ chức chính trị, tổ chức chính trị - xã hội, tổ chức xã hội, tổ chức xã hội - nghề nghiệp và tổ chức kinh tế theo điều kiện luật định.","Hộ gia đình không còn được xác định như một nhóm chủ thể độc lập theo cách tiếp cận của Luật Đất đai 2024; quyền sử dụng đất của hộ gia đình có trước ngày luật có hiệu lực được xử lý theo quy định chuyển tiếp, xác định các thành viên có chung quyền sử dụng đất.","Cộng đồng dân cư sử dụng đất là cộng đồng người Việt Nam sinh sống trên cùng địa bàn dân cư, có chung phong tục, tập quán hoặc có chung dòng họ theo quy định; quyền và nghĩa vụ gắn với mục đích, hình thức sử dụng đất được luật cho phép.","Tổ chức kinh tế có vốn đầu tư nước ngoài được xác định theo pháp luật về đầu tư và đất đai; phạm vi tiếp cận đất, hình thức sử dụng và quyền giao dịch có những giới hạn, điều kiện riêng.","Có thể phân loại người sử dụng đất theo nguồn gốc quyền: được Nhà nước giao đất; được Nhà nước cho thuê đất; được Nhà nước công nhận quyền sử dụng đất; nhận chuyển quyền; nhận quyền theo bản án, quyết định, kết quả đấu giá hoặc căn cứ pháp lý khác.","Có thể phân loại theo hình thức sử dụng: sử dụng đất ổn định lâu dài; sử dụng đất có thời hạn; sử dụng đất trả tiền sử dụng đất; thuê đất trả tiền hằng năm hoặc trả tiền một lần cho cả thời gian thuê.","Có thể phân loại theo loại đất và mục đích sử dụng: người sử dụng đất nông nghiệp; đất ở; đất thương mại, dịch vụ; đất sản xuất, kinh doanh phi nông nghiệp; đất xây dựng công trình sự nghiệp và các loại đất khác.","Việc phân loại có ý nghĩa xác định điều kiện giao đất, cho thuê đất, thời hạn, nghĩa vụ tài chính, quyền chuyển quyền, điều kiện bồi thường khi thu hồi đất và thẩm quyền giải quyết thủ tục hành chính."]}]},{"t":"Các quyền và nghĩa vụ của người sử dụng đất","cs":"Luật Đất đai 2024, Chương III; Bộ luật Dân sự 2015; pháp luật về công chứng, chứng thực, đăng ký đất đai, thuế và kinh doanh bất động sản.","c":[{"t":"Quyền của người sử dụng đất","cs":"Luật Đất đai 2024, Điều 26, Điều 27, Điều 28 và các quy định về quyền theo từng hình thức sử dụng đất.","b":["Quyền chung gồm được cấp Giấy chứng nhận khi đủ điều kiện; hưởng thành quả lao động và kết quả đầu tư trên đất hợp pháp; được Nhà nước bảo hộ; được hướng dẫn cải tạo, phục hồi đất nông nghiệp; được bồi thường, hỗ trợ, tái định cư khi đủ điều kiện và thực hiện quyền khiếu nại, tố cáo, khởi kiện theo luật.","Người sử dụng đất được thực hiện quyền chuyển đổi, chuyển nhượng, cho thuê, cho thuê lại, thừa kế, tặng cho quyền sử dụng đất; thế chấp và góp vốn bằng quyền sử dụng đất trong phạm vi và điều kiện Luật Đất đai quy định.","Quyền chuyển nhượng là quyền chuyển giao quyền sử dụng đất cho chủ thể đủ điều kiện nhận chuyển quyền; việc chuyển nhượng phải đáp ứng điều kiện về chủ thể, tình trạng pháp lý thửa đất, hình thức hợp đồng và đăng ký biến động.","Quyền cho thuê, cho thuê lại cho phép người sử dụng đất chuyển giao quyền khai thác, sử dụng đất trong thời hạn thỏa thuận; phải phù hợp hình thức sử dụng đất, mục đích, thời hạn và điều kiện của luật.","Quyền thừa kế, tặng cho được thực hiện theo pháp luật đất đai và pháp luật dân sự; phải xác định người có quyền, di sản, người nhận, điều kiện nhận quyền và thủ tục đăng ký.","Quyền thế chấp và góp vốn bằng quyền sử dụng đất là phương thức khai thác giá trị quyền sử dụng đất để bảo đảm nghĩa vụ hoặc tham gia hoạt động đầu tư, kinh doanh; việc thực hiện phải tuân thủ điều kiện giao dịch, hình thức và đăng ký theo quy định.","Quyền của người sử dụng đất khác nhau tùy nguồn gốc và hình thức sử dụng. Ví dụ, quyền của người được Nhà nước giao đất có thu tiền, người được giao đất không thu tiền, người thuê đất trả tiền hằng năm và người thuê đất trả tiền một lần không hoàn toàn giống nhau.","Nhóm người có chung quyền sử dụng đất thực hiện quyền theo nguyên tắc và cơ chế luật định; trường hợp quyền phân chia được theo phần phải thực hiện đăng ký, tách thửa và cấp Giấy chứng nhận khi đủ điều kiện; trường hợp không phân chia được thì cùng thực hiện hoặc ủy quyền cho người đại diện.","Hợp đồng chuyển nhượng, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất về nguyên tắc phải công chứng hoặc chứng thực, trừ trường hợp luật quy định khác; giao dịch chỉ hoàn tất về mặt đăng ký quyền khi thực hiện thủ tục đăng ký biến động theo quy định.","Quyền sử dụng đất có thể bị hạn chế bởi quy hoạch, hành lang bảo vệ công trình, quyền của người sử dụng đất liền kề, nghĩa vụ bảo vệ môi trường, điều kiện chuyển mục đích và các giới hạn khác do luật định."]},{"t":"Nghĩa vụ của người sử dụng đất","cs":"Luật Đất đai 2024, Điều 31 và các quy định về nghĩa vụ theo từng hình thức sử dụng đất.","b":["Sử dụng đất đúng mục đích, đúng ranh giới thửa đất, đúng quy định về độ sâu trong lòng đất và chiều cao trên không; tuân thủ quy định về bảo vệ công trình công cộng và các giới hạn sử dụng đất.","Thực hiện kê khai, đăng ký đất đai; đăng ký biến động khi có thay đổi về người sử dụng, diện tích, ranh giới, mục đích, thời hạn, quyền và tài sản gắn liền với đất theo quy định.","Thực hiện đầy đủ nghĩa vụ tài chính về đất đai như tiền sử dụng đất, tiền thuê đất, thuế, phí, lệ phí và các khoản phải nộp khác; được miễn, giảm hoặc ghi nợ chỉ khi đáp ứng điều kiện luật định.","Thực hiện các biện pháp bảo vệ đất, xử lý, cải tạo và phục hồi đất khi gây ô nhiễm, thoái hóa hoặc làm tổn hại chất lượng đất; không hủy hoại đất, không gây cản trở hoặc thiệt hại bất hợp pháp đến người sử dụng đất khác.","Tuân thủ quy định về bảo vệ môi trường, tài nguyên nước, di sản văn hóa, quốc phòng, an ninh, phòng chống thiên tai và các quy định chuyên ngành có liên quan.","Khi thực hiện quyền giao dịch, người sử dụng đất phải cung cấp thông tin trung thực, bảo đảm điều kiện của thửa đất, thực hiện đúng hình thức hợp đồng, đăng ký và nghĩa vụ thuế, phí theo quy định.","Khi Nhà nước thu hồi đất hoặc trưng dụng đất theo căn cứ, thẩm quyền và trình tự luật định, người sử dụng đất có trách nhiệm phối hợp kiểm đếm, chấp hành quyết định có hiệu lực và bàn giao đất; quyền được bồi thường, hỗ trợ được xác định riêng theo điều kiện pháp luật.","Người sử dụng đất phải chấp hành việc kiểm tra, thanh tra, giám sát của cơ quan có thẩm quyền; cung cấp hồ sơ, tài liệu và thực hiện quyết định xử lý vi phạm hoặc quyết định giải quyết tranh chấp đã có hiệu lực.","Nghĩa vụ cụ thể phụ thuộc loại đất, chủ thể, nguồn gốc, hình thức và thời hạn sử dụng; không áp dụng đồng nhất nghĩa vụ của người thuê đất trả tiền hằng năm với người được giao đất hoặc thuê đất trả tiền một lần.","Vi phạm nghĩa vụ có thể dẫn đến xử phạt hành chính, buộc khắc phục hậu quả, bồi thường thiệt hại, thu hồi đất hoặc trách nhiệm pháp lý khác nếu có đủ căn cứ theo quy định."]}]}]},{"t":"Chương 4. Pháp luật về kinh doanh bất động sản","cs":"Đề cương chi tiết học phần, Mục 9.4; Luật Kinh doanh bất động sản số 29/2023/QH15 (có hiệu lực từ 01/01/2025), được sửa đổi, bổ sung bởi Luật số 43/2024/QH15; Văn bản hợp nhất 124/2026/VBHN-NĐ-BXD ngày 30/09/2026; Luật Đất đai số 31/2024/QH15; Luật Nhà ở số 27/2023/QH15; Bộ luật Dân sự số 91/2015/QH13.","c":[{"t":"Khái niệm, phân loại bất động sản","cs":"Bộ luật Dân sự 2015, Điều 107; Luật Kinh doanh bất động sản 2023, Điều 3 và các quy định về phạm vi kinh doanh.","c":[{"t":"Khái niệm, phân loại bất động sản","cs":"Bộ luật Dân sự 2015, Điều 107; Luật Kinh doanh bất động sản 2023, Điều 3, Điều 5.","b":["Theo Bộ luật Dân sự, bất động sản gồm đất đai; nhà, công trình xây dựng gắn liền với đất; tài sản khác gắn liền với đất, nhà, công trình xây dựng; và tài sản khác theo quy định pháp luật.","Trong pháp luật kinh doanh bất động sản, đối tượng kinh doanh được xác định theo phạm vi luật chuyên ngành, gồm nhà ở, công trình xây dựng có sẵn hoặc hình thành trong tương lai; quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản và các loại bất động sản, dự án được luật quy định.","Cần phân biệt bất động sản với dự án bất động sản: bất động sản là tài sản hoặc quyền tài sản cụ thể; dự án bất động sản là tập hợp hoạt động đầu tư có mục tiêu, quy mô, địa điểm, tiến độ và điều kiện pháp lý được cơ quan có thẩm quyền chấp thuận.","Có thể phân loại theo tình trạng hình thành: bất động sản có sẵn là công trình xây dựng đã được nghiệm thu, đưa vào sử dụng theo quy định; bất động sản hình thành trong tương lai là nhà ở, công trình xây dựng đang trong quá trình đầu tư xây dựng hoặc chưa được nghiệm thu đưa vào sử dụng theo điều kiện luật định.","Có thể phân loại theo công năng: nhà ở; công trình xây dựng có công năng giáo dục, y tế, thương mại, dịch vụ, du lịch, lưu trú, công nghiệp, văn phòng và công trình có công năng khác.","Có thể phân loại theo đối tượng quyền được giao dịch: quyền sở hữu nhà, công trình; quyền sử dụng đất; quyền thuê, thuê mua; quyền khai thác hoặc quyền phát sinh từ hợp đồng, dự án theo phạm vi luật cho phép.","Việc phân loại có ý nghĩa xác định luật áp dụng, điều kiện đưa vào kinh doanh, chủ thể được kinh doanh, loại hợp đồng, nghĩa vụ công khai thông tin và cơ chế bảo vệ khách hàng."]},{"t":"Thị trường bất động sản","cs":"Luật Kinh doanh bất động sản 2023; Luật Đất đai 2024; Luật Nhà ở 2023; pháp luật về đầu tư, xây dựng, quy hoạch, tín dụng và thuế.","b":["Thị trường bất động sản là tổng thể các quan hệ giao dịch, cung cầu, đầu tư, kinh doanh và dịch vụ liên quan đến bất động sản, quyền sử dụng đất và dự án bất động sản.","Chủ thể tham gia gồm Nhà nước; doanh nghiệp kinh doanh bất động sản; chủ đầu tư dự án; tổ chức, cá nhân môi giới, vận hành sàn giao dịch; người mua, thuê, thuê mua; nhà đầu tư và chủ thể cung cấp dịch vụ liên quan.","Hàng hóa trên thị trường gồm nhà ở, công trình xây dựng, quyền sử dụng đất trong dự án đủ điều kiện, dự án bất động sản và dịch vụ kinh doanh bất động sản theo luật.","Thị trường có tính địa phương và tính không đồng nhất cao do bất động sản gắn với vị trí, quy hoạch, hạ tầng, điều kiện tự nhiên và pháp lý của từng tài sản.","Cung và cầu chịu tác động của thu nhập, dân số, đô thị hóa, tín dụng, lãi suất, đầu tư công, quy hoạch, chính sách đất đai, nguồn cung nhà ở và kỳ vọng của nhà đầu tư.","Thị trường bất động sản liên thông với thị trường tài chính, xây dựng, vật liệu, lao động và hàng hóa; biến động có thể tác động đến tăng trưởng, ổn định kinh tế và an sinh xã hội.","Thông tin về quy hoạch, pháp lý dự án, tình trạng thế chấp, điều kiện giao dịch, giá và tiến độ có ý nghĩa quyết định đối với tính minh bạch và an toàn của thị trường.","Nhà nước quản lý thị trường thông qua quy hoạch, chính sách đất đai, đầu tư, nhà ở, kinh doanh bất động sản, thuế, tín dụng, công khai thông tin, thanh tra và xử lý vi phạm."]},{"t":"Pháp luật điều chỉnh hoạt động kinh doanh bất động sản","cs":"Luật Kinh doanh bất động sản 2023; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Đầu tư 2020 và văn bản sửa đổi; Luật Xây dựng 2014, sửa đổi 2020; Bộ luật Dân sự 2015.","b":["Luật Kinh doanh bất động sản là luật chuyên ngành điều chỉnh hoạt động kinh doanh bất động sản, kinh doanh dịch vụ bất động sản, quyền và nghĩa vụ của tổ chức, cá nhân kinh doanh và quản lý nhà nước trong lĩnh vực này.","Luật Đất đai điều chỉnh căn cứ tiếp cận đất, hình thức sử dụng đất, quyền chuyển nhượng và kinh doanh quyền sử dụng đất trong dự án, nghĩa vụ tài chính và đăng ký quyền.","Luật Nhà ở điều chỉnh phát triển, sở hữu, quản lý sử dụng và giao dịch nhà ở; trường hợp kinh doanh nhà ở phải đồng thời tuân thủ pháp luật kinh doanh bất động sản và quy định chuyên ngành về nhà ở.","Pháp luật đầu tư, xây dựng, quy hoạch, môi trường và phòng cháy, chữa cháy điều chỉnh quá trình hình thành, triển khai, nghiệm thu và đưa dự án, công trình vào khai thác.","Bộ luật Dân sự điều chỉnh nguyên tắc giao kết, hiệu lực, thực hiện, sửa đổi, chấm dứt hợp đồng, trách nhiệm do vi phạm và bồi thường thiệt hại trong phạm vi không trái quy định chuyên ngành.","Pháp luật bảo vệ quyền lợi người tiêu dùng, cạnh tranh, thuế, tín dụng và phòng chống rửa tiền có thể được áp dụng tùy chủ thể, loại giao dịch và hoạt động kinh doanh.","Khi xác định luật áp dụng phải kiểm tra thời điểm giao dịch, loại bất động sản, tư cách chủ thể, nguồn gốc quyền, tính chất hoạt động và quy định chuyển tiếp; không áp dụng một đạo luật riêng lẻ cho toàn bộ vòng đời dự án."]}]},{"t":"Điều kiện kinh doanh bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về tổ chức, cá nhân kinh doanh và điều kiện của bất động sản, dự án đưa vào kinh doanh; Nghị định 96/2024/NĐ-CP được hợp nhất tại 124/2026/VBHN-NĐ-BXD.","c":[{"t":"Điều kiện đối với tổ chức, cá nhân kinh doanh bất động sản","cs":"Luật Kinh doanh bất động sản 2023, Điều 9 và các quy định liên quan; Văn bản hợp nhất 124/2026/VBHN-NĐ-BXD.","b":["Tổ chức, cá nhân kinh doanh bất động sản phải thành lập doanh nghiệp hoặc hợp tác xã, liên hiệp hợp tác xã theo quy định, trừ trường hợp cá nhân kinh doanh bất động sản quy mô nhỏ và trường hợp luật quy định không nhằm mục đích kinh doanh.","Doanh nghiệp kinh doanh bất động sản phải đáp ứng điều kiện về ngành nghề, công khai thông tin, năng lực và điều kiện pháp lý trong hoạt động; từng dự án còn phải đáp ứng điều kiện của pháp luật đầu tư, đất đai, xây dựng và nhà ở.","Doanh nghiệp kinh doanh bất động sản phải có vốn chủ sở hữu đáp ứng yêu cầu theo quy mô dự án và quy định pháp luật có liên quan; việc xác định năng lực tài chính phải căn cứ hồ sơ, báo cáo tài chính và điều kiện pháp luật tại thời điểm thực hiện dự án.","Tổ chức, cá nhân kinh doanh bất động sản phải công khai đầy đủ, trung thực thông tin về doanh nghiệp, dự án, bất động sản đưa vào kinh doanh, tình trạng pháp lý, thế chấp, hạn chế quyền và tiến độ thực hiện theo quy định.","Chủ đầu tư dự án bất động sản phải đáp ứng điều kiện về tư cách pháp lý, năng lực tài chính, quyền sử dụng đất, chấp thuận đầu tư, quy hoạch, xây dựng và điều kiện triển khai dự án.","Cá nhân kinh doanh bất động sản quy mô nhỏ được áp dụng cơ chế riêng theo quy định của Chính phủ; không được suy rộng ngoại lệ này cho hoạt động kinh doanh thường xuyên, có tổ chức hoặc dự án thuộc diện phải thành lập doanh nghiệp.","Tổ chức, cá nhân cung cấp dịch vụ môi giới, sàn giao dịch, tư vấn và quản lý bất động sản phải đáp ứng điều kiện chuyên ngành tương ứng, bao gồm điều kiện về doanh nghiệp, nhân sự, chứng chỉ, cơ sở vật chất và đăng ký hoạt động nếu pháp luật yêu cầu.","Việc đáp ứng điều kiện kinh doanh không đồng nghĩa mọi bất động sản của doanh nghiệp đương nhiên đủ điều kiện giao dịch; điều kiện của chủ thể và điều kiện của từng sản phẩm, dự án phải được kiểm tra độc lập."]},{"t":"Điều kiện đối với bất động sản đưa vào kinh doanh","cs":"Luật Kinh doanh bất động sản 2023, các quy định về điều kiện của nhà ở, công trình xây dựng có sẵn, hình thành trong tương lai và quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án.","b":["Bất động sản đưa vào kinh doanh phải thuộc đối tượng được phép kinh doanh; có hồ sơ pháp lý, thông tin công khai và đáp ứng điều kiện tương ứng với loại tài sản, tình trạng hình thành và hình thức giao dịch.","Nhà ở, công trình xây dựng có sẵn phải có giấy tờ về quyền sở hữu hoặc quyền sử dụng hợp pháp theo quy định; không thuộc trường hợp đang có tranh chấp, bị kê biên, bị cấm hoặc đình chỉ giao dịch, trừ trường hợp pháp luật có quy định khác.","Nhà ở, công trình xây dựng hình thành trong tương lai phải đáp ứng điều kiện về hồ sơ dự án, thiết kế, giấy phép xây dựng hoặc căn cứ miễn giấy phép, nghiệm thu hạ tầng và tiến độ xây dựng theo trường hợp; chủ đầu tư phải thực hiện nghĩa vụ thông báo, công khai và điều kiện bảo đảm giao dịch.","Chủ đầu tư chỉ được thu tiền đặt cọc, thanh toán và huy động vốn theo hình thức, giới hạn, thời điểm và điều kiện do Luật Kinh doanh bất động sản và luật có liên quan quy định; không được huy động vốn trái phép hoặc sử dụng hợp đồng trá hình để bán sản phẩm chưa đủ điều kiện.","Quyền sử dụng đất đưa vào kinh doanh trong dự án phải đáp ứng điều kiện về giấy tờ quyền sử dụng đất, tình trạng pháp lý, thời hạn, mục đích, quy hoạch, hoàn thành nghĩa vụ tài chính và hạ tầng kỹ thuật theo quy định.","Bất động sản không được đưa vào kinh doanh nếu đang bị tranh chấp về quyền sở hữu, quyền sử dụng mà chưa được giải quyết; đang bị kê biên, áp dụng biện pháp ngăn chặn hoặc thuộc trường hợp pháp luật cấm giao dịch.","Trường hợp bất động sản đang thế chấp, việc kinh doanh phải tuân thủ điều kiện công khai và xử lý thế chấp theo luật; phải có sự đồng ý hoặc giải chấp khi pháp luật hoặc giao dịch bảo đảm yêu cầu.","Trước khi giao dịch, bên kinh doanh phải cung cấp thông tin, hồ sơ cần thiết để khách hàng kiểm tra; khách hàng cần đối chiếu thông tin công khai với hồ sơ gốc và tình trạng đăng ký thực tế.","Điều kiện đưa vào kinh doanh phải được đánh giá tại thời điểm xác lập giao dịch; việc dự án từng được chấp thuận đầu tư hoặc đã có giấy phép xây dựng không tự động chứng minh sản phẩm đã đủ điều kiện bán, cho thuê mua."]}]},{"t":"Các hình thức kinh doanh bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về kinh doanh nhà ở, công trình xây dựng và quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án.","c":[{"t":"Mua bán nhà ở, công trình xây dựng","cs":"Luật Kinh doanh bất động sản 2023; Luật Nhà ở 2023; Bộ luật Dân sự 2015.","b":["Mua bán nhà ở, công trình xây dựng là hoạt động bên bán chuyển giao quyền sở hữu nhà ở, công trình xây dựng hoặc quyền tương ứng theo luật cho bên mua; bên mua thanh toán theo hợp đồng.","Đối tượng mua bán phải thuộc loại được phép giao dịch, đáp ứng điều kiện về chủ thể, quyền sở hữu, tình trạng pháp lý, hồ sơ và điều kiện kinh doanh.","Chủ đầu tư bán nhà ở, công trình xây dựng hình thành trong tương lai phải đáp ứng điều kiện riêng về dự án, tiến độ, hồ sơ, công khai thông tin và bảo đảm giao dịch; không được đồng nhất với mua bán tài sản đã hoàn thành.","Hợp đồng cần xác định rõ đối tượng, diện tích, đặc điểm, giá, phương thức và tiến độ thanh toán, thời hạn bàn giao, bảo hành, quyền và nghĩa vụ, phạt vi phạm, bồi thường và phương thức giải quyết tranh chấp.","Thời điểm chuyển quyền sở hữu và thời điểm bàn giao được xác định theo luật chuyên ngành, hợp đồng và thủ tục đăng ký; cần phân biệt việc giao nhà, công trình với việc hoàn tất đăng ký quyền.","Bên bán có nghĩa vụ cung cấp thông tin trung thực, bàn giao đúng thỏa thuận, bảo đảm chất lượng và thực hiện nghĩa vụ bảo hành khi thuộc trường hợp luật định; bên mua có nghĩa vụ thanh toán và tiếp nhận tài sản.","Giao dịch phải tuân thủ quy định về công chứng, chứng thực và đăng ký nếu thuộc trường hợp pháp luật yêu cầu; không mặc nhiên coi mọi hợp đồng kinh doanh bất động sản đều bắt buộc công chứng."]},{"t":"Cho thuê nhà ở, công trình xây dựng","cs":"Luật Kinh doanh bất động sản 2023; Luật Nhà ở 2023; Bộ luật Dân sự 2015.","b":["Cho thuê nhà ở, công trình xây dựng là việc bên cho thuê giao tài sản để bên thuê sử dụng trong thời hạn nhất định và bên thuê trả tiền thuê theo thỏa thuận.","Tài sản cho thuê phải thuộc quyền cho thuê hợp pháp của bên cho thuê; bảo đảm điều kiện an toàn, công năng, chất lượng và điều kiện sử dụng theo pháp luật chuyên ngành.","Hợp đồng xác định tài sản thuê, mục đích sử dụng, thời hạn, giá và kỳ hạn thanh toán, tiền đặt cọc nếu có, quyền và nghĩa vụ, chi phí vận hành, bảo trì, sửa chữa, chấm dứt và xử lý vi phạm.","Bên cho thuê có nghĩa vụ giao tài sản đúng tình trạng và thời điểm, bảo đảm quyền sử dụng ổn định trong phạm vi cam kết, sửa chữa hư hỏng thuộc trách nhiệm và cung cấp thông tin cần thiết.","Bên thuê có nghĩa vụ sử dụng đúng công năng, bảo quản tài sản, thanh toán đúng hạn, không tự ý thay đổi kết cấu hoặc cho thuê lại nếu không có căn cứ hoặc sự đồng ý theo hợp đồng và pháp luật.","Việc cho thuê nhà ở phải tuân thủ điều kiện, quyền và nghĩa vụ riêng của pháp luật nhà ở; việc cho thuê công trình thương mại, dịch vụ hoặc công trình khác còn phải đáp ứng điều kiện chuyên ngành tương ứng."]},{"t":"Thuê mua nhà ở, công trình xây dựng","cs":"Luật Kinh doanh bất động sản 2023; Luật Nhà ở 2023; Bộ luật Dân sự 2015.","b":["Thuê mua là hình thức giao dịch kết hợp giữa thuê và mua; bên thuê mua thanh toán trước một phần giá trị theo thỏa thuận, sau đó thanh toán phần còn lại theo kỳ hạn và được xác lập quyền sở hữu khi đáp ứng điều kiện luật định.","Đối tượng thuê mua phải đáp ứng điều kiện đưa vào kinh doanh; đối với nhà ở, cần đối chiếu thêm quy định về thuê mua nhà ở và chính sách nhà ở có liên quan.","Hợp đồng phải xác định giá trị tài sản, khoản tiền thanh toán lần đầu, lịch thanh toán, thời hạn thuê mua, thời điểm chuyển quyền sở hữu, việc bàn giao, bảo trì, bảo hành và xử lý khi vi phạm.","Bên thuê mua có quyền sử dụng tài sản theo hợp đồng, được nhận chuyển quyền sở hữu khi hoàn thành nghĩa vụ và đáp ứng điều kiện; không được mặc nhiên coi đã là chủ sở hữu ngay từ thời điểm nhận bàn giao.","Bên cho thuê mua phải bảo đảm quyền của bên thuê mua theo hợp đồng, thực hiện nghĩa vụ bàn giao, bảo hành và hoàn tất thủ tục chuyển quyền khi đủ điều kiện.","Khi hợp đồng chấm dứt trước thời hạn, việc xử lý khoản tiền đã thanh toán, tài sản, chi phí và bồi thường được xác định theo luật, hợp đồng và nguyên nhân chấm dứt."]},{"t":"Kinh doanh quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản","cs":"Luật Kinh doanh bất động sản 2023; Luật Đất đai 2024; pháp luật về đầu tư, quy hoạch, xây dựng và hạ tầng kỹ thuật.","b":["Hoạt động này là việc chuyển nhượng, cho thuê hoặc cho thuê lại quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản theo phạm vi, điều kiện luật định.","Chủ đầu tư phải có quyền sử dụng đất hợp pháp, dự án được chấp thuận và triển khai đúng quy hoạch, mục tiêu, tiến độ; hoàn thành đầu tư hạ tầng kỹ thuật theo yêu cầu trước khi chuyển quyền hoặc cho thuê.","Khu vực, loại đất và đối tượng nhận chuyển nhượng phải thuộc trường hợp được phép kinh doanh; có thể có giới hạn riêng đối với địa bàn, loại đô thị, loại dự án và chủ thể nhận quyền.","Hạ tầng kỹ thuật phải được đầu tư đồng bộ theo quy hoạch chi tiết và thiết kế được phê duyệt; việc nghiệm thu, bàn giao và kết nối hạ tầng phải đáp ứng quy định chuyên ngành.","Chủ đầu tư phải công khai thông tin về quyền sử dụng đất, quy hoạch, hạ tầng, nghĩa vụ tài chính, tình trạng thế chấp và điều kiện chuyển nhượng, cho thuê hoặc cho thuê lại.","Bên nhận quyền có trách nhiệm sử dụng đất đúng mục đích, tuân thủ quy hoạch, thực hiện nghĩa vụ tài chính và nghĩa vụ đầu tư xây dựng theo tiến độ, quy chế quản lý dự án và pháp luật đất đai.","Cần phân biệt chuyển nhượng quyền sử dụng đất trong dự án với chuyển nhượng toàn bộ hoặc một phần dự án bất động sản; hai hoạt động có đối tượng, điều kiện và thủ tục khác nhau."]}]},{"t":"Dịch vụ bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về sàn giao dịch, môi giới, tư vấn và quản lý bất động sản; Nghị định 96/2024/NĐ-CP được hợp nhất tại 124/2026/VBHN-NĐ-BXD.","c":[{"t":"Hoạt động môi giới bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về điều kiện, nội dung, quyền và nghĩa vụ của doanh nghiệp, cá nhân môi giới.","b":["Môi giới bất động sản là hoạt động trung gian cho các bên trong mua bán, chuyển nhượng, cho thuê, cho thuê lại, thuê mua bất động sản; hỗ trợ đàm phán, giao kết hợp đồng và thực hiện công việc theo phạm vi luật định.","Cá nhân hành nghề môi giới phải có chứng chỉ hành nghề môi giới bất động sản và hành nghề trong doanh nghiệp kinh doanh dịch vụ môi giới hoặc doanh nghiệp kinh doanh dịch vụ sàn giao dịch bất động sản theo quy định.","Doanh nghiệp kinh doanh dịch vụ môi giới phải đáp ứng điều kiện thành lập, hoạt động, công khai thông tin và bố trí nhân sự có chứng chỉ theo luật; không được để cá nhân hành nghề độc lập trái quy định.","Nội dung môi giới có thể gồm tìm kiếm đối tác, cung cấp thông tin, hỗ trợ đàm phán, hướng dẫn hồ sơ và hỗ trợ các bên giao kết hợp đồng; phạm vi công việc phải được xác định rõ.","Doanh nghiệp, cá nhân môi giới phải cung cấp thông tin trung thực, bảo mật thông tin khách hàng theo quy định, thực hiện nghĩa vụ hợp đồng và không được làm sai lệch hồ sơ, tình trạng pháp lý hoặc giá trị bất động sản.","Thù lao, hoa hồng môi giới do các bên thỏa thuận trong hợp đồng dịch vụ; phải làm rõ căn cứ tính, thời điểm thanh toán, điều kiện phát sinh và trách nhiệm khi giao dịch không hoàn thành.","Môi giới không thay thế hoạt động công chứng, chứng thực, tư vấn pháp lý, thẩm định giá hoặc quyết định hành chính; người môi giới không có quyền cam kết thay cơ quan nhà nước về quy hoạch, cấp phép hay tình trạng pháp lý.","Người sử dụng dịch vụ cần kiểm tra chứng chỉ, doanh nghiệp, phạm vi ủy quyền và thông tin bất động sản trước khi giao dịch; không giao tiền chỉ dựa trên quảng cáo hoặc lời giới thiệu của môi giới."]},{"t":"Sàn giao dịch bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về thành lập, đăng ký, điều kiện hoạt động và trách nhiệm của sàn giao dịch bất động sản.","b":["Sàn giao dịch bất động sản là nơi diễn ra hoạt động giao dịch và cung cấp dịch vụ hỗ trợ giao dịch bất động sản theo mô hình, điều kiện và phạm vi luật định.","Doanh nghiệp kinh doanh dịch vụ sàn giao dịch phải thành lập theo quy định, có địa điểm hoạt động, cơ sở vật chất, quy chế hoạt động, người quản lý và nhân sự đáp ứng điều kiện pháp luật.","Sàn giao dịch phải thực hiện đăng ký hoạt động hoặc thủ tục tương ứng với cơ quan có thẩm quyền theo quy định hiện hành; việc đáp ứng điều kiện hoạt động phải được duy trì trong suốt quá trình cung cấp dịch vụ.","Sàn có trách nhiệm kiểm tra hồ sơ, điều kiện của bất động sản đưa lên sàn trong phạm vi luật định; niêm yết, cung cấp thông tin chính xác; lưu trữ hồ sơ và thực hiện chế độ báo cáo, kết nối dữ liệu theo yêu cầu.","Sàn có thể hỗ trợ việc giao dịch, đàm phán, lập và ký kết hợp đồng, thanh toán, bàn giao hoặc thủ tục khác theo thỏa thuận và quy định pháp luật; không được vượt quá phạm vi chức năng.","Doanh nghiệp vận hành sàn và người quản lý phải bảo đảm tính độc lập, minh bạch, phòng ngừa xung đột lợi ích, không thông đồng hoặc làm sai lệch thông tin giao dịch.","Việc giao dịch qua sàn không làm thay thế điều kiện pháp lý của bất động sản, nghĩa vụ công chứng, chứng thực, đăng ký hoặc trách nhiệm của các bên theo hợp đồng.","Người tham gia cần kiểm tra tư cách pháp lý của sàn, thông tin niêm yết, hồ sơ gốc của tài sản, chủ thể giao dịch và cơ chế tiếp nhận, giải quyết phản ánh."]},{"t":"Tư vấn và quản lý bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về kinh doanh dịch vụ tư vấn và quản lý bất động sản; pháp luật dân sự và pháp luật chuyên ngành.","b":["Tư vấn bất động sản là hoạt động cung cấp ý kiến, thông tin, phân tích hoặc khuyến nghị cho khách hàng về các vấn đề liên quan đến đầu tư, kinh doanh, giao dịch, quản lý và khai thác bất động sản trong phạm vi dịch vụ được phép.","Nội dung tư vấn có thể gồm tư vấn pháp lý và thủ tục trong phạm vi được phép, đầu tư, tài chính, giá, thị trường, phương án kinh doanh, quản lý khai thác và hiệu quả sử dụng bất động sản.","Doanh nghiệp cung cấp dịch vụ tư vấn phải đáp ứng điều kiện về tư cách pháp lý, phạm vi hoạt động, nhân sự và nghĩa vụ hợp đồng; tư vấn chuyên ngành có điều kiện phải do chủ thể đủ điều kiện thực hiện.","Quản lý bất động sản là hoạt động tổ chức quản lý, vận hành, khai thác tài sản theo ủy quyền hoặc hợp đồng; có thể bao gồm quản lý khách thuê, vận hành kỹ thuật, bảo trì, thu chi và quản lý dịch vụ.","Hợp đồng tư vấn, quản lý phải xác định rõ đối tượng, phạm vi công việc, tiêu chuẩn dịch vụ, quyền quyết định, cơ chế báo cáo, phí dịch vụ, thời hạn, trách nhiệm và xử lý rủi ro.","Bên cung cấp dịch vụ phải thực hiện đúng phạm vi ủy quyền, bảo quản hồ sơ và tài sản, báo cáo trung thực, bảo mật thông tin và chịu trách nhiệm khi vi phạm nghĩa vụ.","Chủ sở hữu hoặc chủ thể có quyền đối với bất động sản cần kiểm soát giới hạn ủy quyền, dòng tiền, giao dịch với bên thứ ba và cơ chế kiểm tra hoạt động của đơn vị quản lý."]}]},{"t":"Hợp đồng kinh doanh bất động sản","cs":"Luật Kinh doanh bất động sản 2023, các quy định về hợp đồng kinh doanh bất động sản và hợp đồng kinh doanh dịch vụ bất động sản; Bộ luật Dân sự 2015; Văn bản hợp nhất 124/2026/VBHN-NĐ-BXD.","c":[{"t":"Khái niệm, phân loại","cs":"Luật Kinh doanh bất động sản 2023; Bộ luật Dân sự 2015, các quy định về giao kết và thực hiện hợp đồng.","b":["Hợp đồng kinh doanh bất động sản là sự thỏa thuận giữa các bên về việc mua bán, chuyển nhượng, cho thuê, cho thuê lại, thuê mua bất động sản hoặc quyền sử dụng đất thuộc phạm vi luật điều chỉnh, làm phát sinh, thay đổi hoặc chấm dứt quyền và nghĩa vụ.","Hợp đồng kinh doanh dịch vụ bất động sản là sự thỏa thuận về việc cung cấp dịch vụ môi giới, sàn giao dịch, tư vấn hoặc quản lý bất động sản theo quy định.","Phân loại theo đối tượng gồm hợp đồng mua bán nhà ở, công trình xây dựng; hợp đồng thuê; hợp đồng thuê mua; hợp đồng chuyển nhượng, cho thuê hoặc cho thuê lại quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án; hợp đồng chuyển nhượng dự án và hợp đồng dịch vụ bất động sản.","Phân loại theo thời điểm hình thành tài sản gồm hợp đồng đối với bất động sản có sẵn và hợp đồng đối với bất động sản hình thành trong tương lai; mỗi loại có điều kiện, nghĩa vụ cung cấp hồ sơ và cơ chế thanh toán riêng.","Phân loại theo tính chất dịch vụ gồm hợp đồng môi giới, hợp đồng dịch vụ sàn giao dịch, hợp đồng tư vấn và hợp đồng quản lý bất động sản.","Hợp đồng phải tuân thủ điều kiện chủ thể, đối tượng, mục đích, hình thức, nội dung bắt buộc và các giới hạn của luật chuyên ngành; thỏa thuận trái điều cấm hoặc nhằm che giấu giao dịch khác có thể bị xử lý theo pháp luật.","Hợp đồng mẫu và việc công khai hợp đồng được thực hiện theo Luật Kinh doanh bất động sản, nghị định hướng dẫn và quy định bảo vệ người tiêu dùng; doanh nghiệp phải sử dụng đúng mẫu và không được tùy tiện sửa nội dung bắt buộc."]},{"t":"Các loại hợp đồng kinh doanh bất động sản thông dụng","cs":"Luật Kinh doanh bất động sản 2023; Bộ luật Dân sự 2015; Luật Nhà ở 2023; Văn bản hợp nhất 124/2026/VBHN-NĐ-BXD.","b":["Hợp đồng mua bán nhà ở, công trình xây dựng ghi nhận việc chuyển quyền sở hữu và nghĩa vụ thanh toán; cần làm rõ tài sản, diện tích, chất lượng, giá, tiến độ thanh toán, bàn giao, bảo hành và đăng ký.","Hợp đồng thuê nhà ở, công trình xây dựng xác định quyền sử dụng có thời hạn; cần quy định tiền thuê, đặt cọc, mục đích sử dụng, sửa chữa, bảo trì, chi phí, cho thuê lại và chấm dứt.","Hợp đồng thuê mua nhà ở, công trình xây dựng kết hợp yếu tố thuê và mua; cần xác định khoản trả trước, kỳ hạn thanh toán, thời điểm chuyển quyền sở hữu, bàn giao và xử lý khi vi phạm.","Hợp đồng chuyển nhượng quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án xác định thửa đất, diện tích, mục đích, thời hạn, hạ tầng, giá, nghĩa vụ tài chính và trách nhiệm đăng ký.","Hợp đồng cho thuê, cho thuê lại quyền sử dụng đất trong dự án xác định quyền khai thác, thời hạn, mục đích, tiền thuê, hạ tầng và nghĩa vụ của các bên.","Hợp đồng chuyển nhượng toàn bộ hoặc một phần dự án bất động sản phải đáp ứng điều kiện, thẩm quyền chấp thuận và thủ tục chuyển nhượng dự án; không đồng nhất với hợp đồng chuyển nhượng từng sản phẩm bất động sản.","Hợp đồng môi giới bất động sản quy định đối tượng môi giới, phạm vi công việc, nghĩa vụ cung cấp thông tin, thù lao, hoa hồng, thời điểm thanh toán và trách nhiệm.","Hợp đồng dịch vụ sàn giao dịch, tư vấn và quản lý bất động sản xác định tiêu chuẩn dịch vụ, phạm vi quyền hạn, phí, cơ chế báo cáo, bảo mật, trách nhiệm và xử lý tranh chấp.","Khi rà soát hợp đồng cần kiểm tra tư cách và thẩm quyền đại diện; quyền đối với bất động sản; điều kiện đưa vào kinh doanh; hình thức, nội dung bắt buộc; tiến độ thanh toán; thuế, phí; đăng ký; điều khoản phạt, bồi thường, bất khả kháng và giải quyết tranh chấp.","Việc ký hợp đồng không thay thế thủ tục đăng ký quyền, cấp phép hoặc chấp thuận hành chính nếu pháp luật quy định; cần xác định rõ thời điểm phát sinh hiệu lực hợp đồng và thời điểm chuyển quyền đối với từng loại giao dịch."]}]}]}]}}</script>
