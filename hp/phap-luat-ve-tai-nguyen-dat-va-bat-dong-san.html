trọng tâm","rows":[{"t":"Nghị định số 96/2024/NĐ-CP","d":"24/07/2024","org":"Chính phủ","note":"Quy định chi tiết một số điều của Luật Kinh doanh bất động sản; tra cứu bản hợp nhất 124/2026/VBHN-NĐ-BXD ngày 30/09/2026.","url":"https://thuvienphapluat.vn/van-ban/bat-dong-san/Van-ban-hop-nhat-124-2026-VBHN-ND-BXD-Nghi-dinh-huong-dan-Luat-Kinh-doanh-bat-dong-san-727620.aspx"},{"t":"Nghị định số 95/2024/NĐ-CP","d":"24/07/2024","org":"Chính phủ","note":"Quy định chi tiết một số điều của Luật Nhà ở.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=95%2F2024%2FN%C4%90-CP&match=True"}]}],"al":[],"ly":{"root":"Pháp luật về tài nguyên đất và bất động sản","ch":[{"t":"Chương 1. Tổng quan pháp luật về tài nguyên đất và bất động sản","cs":"Đề cương chi tiết học phần, Mục 9.1; Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025); Luật Đất đai số 31/2024/QH15 (Văn bản hợp nhất 44/VBHN-VPQH ngày 16/03/2026); Bộ luật Dân sự số 91/2015/QH13; Luật Kinh doanh bất động sản số 29/2023/QH15; Luật Nhà ở số 27/2023/QH15.","c":[{"t":"Khái quát chung về pháp luật về tài nguyên đất","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024, Điều 3, Điều 4 và Điều 9.","c":[{"t":"Khái niệm, đặc điểm đất đai","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024, Điều 3, Điều 4, Điều 9.","b":["Đất đai là bộ phận lãnh thổ quốc gia, tài nguyên thiên nhiên đặc biệt, tư liệu sản xuất quan trọng và không gian cho các hoạt động kinh tế, văn hóa, xã hội, quốc phòng, an ninh.","Đất đai thuộc sở hữu toàn dân; Nhà nước là đại diện chủ sở hữu và thống nhất quản lý. Tổ chức, cá nhân không có quyền sở hữu tư nhân đối với đất đai mà có thể được Nhà nước trao quyền sử dụng đất hoặc nhận quyền sử dụng đất theo quy định.","Đất đai có vị trí cố định, không thể di dời; hoạt động quản lý, khai thác và giao dịch phải gắn với vị trí, ranh giới, địa giới hành chính, quy hoạch và hiện trạng thửa đất.","Đất đai có diện tích hữu hạn, không thể tự mở rộng theo nhu cầu sử dụng; chất lượng và khả năng sinh lợi không đồng nhất do điều kiện tự nhiên, vị trí, hạ tầng và mục đích sử dụng.","Đất đai có tính đa công năng; việc sử dụng cho nông nghiệp, phi nông nghiệp hoặc mục đích khác phải phù hợp phân loại đất và tuân thủ điều kiện, thẩm quyền, trình tự chuyển mục đích.","Đất đai có liên hệ chặt chẽ với môi trường và hệ sinh thái; việc sử dụng tại một khu vực có thể ảnh hưởng nguồn nước, môi trường và quyền, lợi ích của người sử dụng đất liền kề.","Cần phân biệt đất đai với quyền sử dụng đất: đất đai thuộc sở hữu toàn dân; quyền sử dụng đất là quyền tài sản được pháp luật ghi nhận, bảo hộ và cho phép thực hiện trong phạm vi, điều kiện luật định."]},{"t":"Vai trò pháp luật về đất đai","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024; Nghị quyết 18-NQ/TW ngày 16/06/2022.","b":["Xác lập và bảo đảm thực hiện chế độ sở hữu toàn dân về đất đai; xác định vị trí của Nhà nước với tư cách đại diện chủ sở hữu và chủ thể thống nhất quản lý.","Thiết lập khuôn khổ pháp lý để phân bổ nguồn lực đất đai thông qua quy hoạch, kế hoạch sử dụng đất, giao đất, cho thuê đất, công nhận quyền sử dụng đất và cho phép chuyển mục đích sử dụng đất.","Xác định quyền, nghĩa vụ và trách nhiệm của người sử dụng đất; bảo vệ quyền, lợi ích hợp pháp của người sử dụng đất và chủ thể có liên quan.","Điều tiết quan hệ lợi ích giữa Nhà nước, người sử dụng đất, nhà đầu tư và cộng đồng; tạo cơ sở pháp lý cho thu hồi đất, bồi thường, hỗ trợ, tái định cư và nghĩa vụ tài chính.","Bảo vệ tài nguyên đất, kiểm soát ô nhiễm, suy thoái, lãng phí và hành vi sử dụng đất trái pháp luật; hướng tới sử dụng đất tiết kiệm, hiệu quả, bền vững.","Tạo lập môi trường pháp lý cho thị trường quyền sử dụng đất và hoạt động đầu tư, kinh doanh bất động sản; góp phần công khai thông tin, minh bạch giao dịch.","Là công cụ để kiểm tra, thanh tra, xử lý vi phạm và giải quyết tranh chấp, khiếu nại, tố cáo trong quản lý, sử dụng đất."]},{"t":"Nội dung điều chỉnh của pháp luật về tài nguyên đất","cs":"Luật Đất đai 2024; Bộ luật Dân sự 2015 và pháp luật về quy hoạch, đầu tư, xây dựng, tài chính, môi trường có liên quan.","b":["Chế độ sở hữu và đại diện chủ sở hữu: đất đai thuộc sở hữu toàn dân; Nhà nước đại diện chủ sở hữu và thống nhất quản lý.","Quản lý nhà nước về đất đai: điều tra, đo đạc, lập bản đồ; quy hoạch, kế hoạch sử dụng đất; giao đất, cho thuê đất, chuyển mục đích; đăng ký, cấp Giấy chứng nhận; xây dựng cơ sở dữ liệu và hệ thống thông tin đất đai.","Chế độ sử dụng đất: phân loại đất; căn cứ, thời hạn, hạn mức sử dụng; điều kiện, hình thức sử dụng; bảo vệ, cải tạo và phục hồi đất.","Địa vị pháp lý của người sử dụng đất: chủ thể sử dụng đất; quyền chung, nghĩa vụ chung; quyền và nghĩa vụ theo hình thức, nguồn gốc và thời hạn sử dụng đất.","Tài chính và giá đất: tiền sử dụng đất, tiền thuê đất, thuế, phí, lệ phí; giá đất, bảng giá đất, giá đất cụ thể và cơ chế tài chính theo pháp luật hiện hành.","Thu hồi đất, trưng dụng đất, bồi thường, hỗ trợ và tái định cư; bảo đảm điều kiện, trình tự, thẩm quyền và quyền của người có đất bị thu hồi.","Giám sát, kiểm tra, thanh tra, xử lý vi phạm; giải quyết tranh chấp đất đai, khiếu nại, tố cáo và khởi kiện theo thẩm quyền, thủ tục luật định.","Quan hệ giữa pháp luật đất đai với pháp luật dân sự, đầu tư, xây dựng, quy hoạch, nhà ở, kinh doanh bất động sản, thuế, môi trường và tố tụng."]}]},{"t":"Khái quát chung về pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015, Điều 105 và Điều 107; Luật Kinh doanh bất động sản 2023, Điều 1 và Điều 3; Luật Nhà ở 2023, Điều 2.","c":[{"t":"Khái niệm, đặc điểm bất động sản","cs":"Bộ luật Dân sự 2015, Điều 105 và Điều 107; Luật Kinh doanh bất động sản 2023, Điều 3.","b":["Theo Điều 107 Bộ luật Dân sự năm 2015, bất động sản bao gồm đất đai; nhà, công trình xây dựng gắn liền với đất đai; tài sản khác gắn liền với đất đai, nhà, công trình xây dựng; và tài sản khác theo quy định của pháp luật.","Bất động sản là một loại tài sản; cần phân biệt khái niệm bất động sản trong pháp luật dân sự với phạm vi bất động sản, dự án bất động sản và hoạt động kinh doanh bất động sản được điều chỉnh chuyên biệt bởi Luật Kinh doanh bất động sản.","Quyền sử dụng đất không đồng nhất với quyền sở hữu đất đai. Đối tượng giao dịch có thể là quyền sử dụng đất, tài sản gắn liền với đất hoặc dự án bất động sản theo điều kiện luật định.","Bất động sản có tính bất động về vị trí; giá trị và khả năng khai thác chịu ảnh hưởng của vị trí, kết nối hạ tầng, quy hoạch, môi trường và điều kiện kinh tế - xã hội.","Bất động sản có tính cá biệt, không đồng nhất; các tài sản khác nhau về diện tích, kết cấu, mục đích sử dụng, tình trạng pháp lý, chất lượng công trình và khả năng sinh lợi.","Bất động sản thường có giá trị lớn, thời gian khai thác dài và chịu sự điều chỉnh của nhiều lĩnh vực pháp luật; giao dịch đòi hỏi kiểm tra chủ thể, quyền đối với tài sản, quy hoạch, nghĩa vụ tài chính và điều kiện giao dịch.","Bất động sản có tính khan hiếm tương đối và chịu tác động của chu kỳ thị trường; nguồn cung, nhu cầu, tín dụng, chính sách đất đai, quy hoạch và đầu tư hạ tầng có thể làm thay đổi giá trị.","Quyền đối với bất động sản phải được thực hiện trong giới hạn pháp luật, bảo đảm lợi ích công cộng, trật tự đô thị, an sinh xã hội và bảo vệ môi trường."]},{"t":"Vai trò pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Kinh doanh bất động sản 2023.","b":["Xác định địa vị pháp lý của bất động sản và quyền của chủ sở hữu, người sử dụng đất, chủ đầu tư, bên mua, bên thuê và các chủ thể liên quan.","Thiết lập điều kiện pháp lý để tạo lập, phát triển, đưa bất động sản vào kinh doanh và thực hiện giao dịch trên thị trường.","Bảo đảm an toàn pháp lý cho giao dịch thông qua yêu cầu về thông tin, hồ sơ, điều kiện của bất động sản, hình thức hợp đồng, công chứng, chứng thực và đăng ký khi pháp luật quy định.","Bảo vệ người mua, người thuê, người thuê mua và nhà đầu tư; kiểm soát việc huy động vốn, kinh doanh nhà ở và công trình xây dựng hình thành trong tương lai.","Tạo môi trường cạnh tranh, công khai, minh bạch; phòng ngừa gian lận, cung cấp thông tin sai lệch và kinh doanh bất động sản không đủ điều kiện.","Điều tiết thị trường gắn với quy hoạch, kế hoạch sử dụng đất, chương trình phát triển nhà ở, phát triển đô thị và mục tiêu ổn định kinh tế - xã hội.","Hài hòa lợi ích giữa Nhà nước, nhà đầu tư, người sử dụng bất động sản và cộng đồng; góp phần sử dụng hiệu quả nguồn lực đất đai và tài sản gắn liền với đất."]},{"t":"Nội dung điều chỉnh của pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Kinh doanh bất động sản 2023; pháp luật về đầu tư, xây dựng, quy hoạch, thuế và bảo vệ người tiêu dùng.","b":["Xác lập, thực hiện và bảo vệ quyền đối với bất động sản: quyền sở hữu nhà ở, công trình xây dựng; quyền sử dụng đất; quyền khác đối với tài sản và các biện pháp bảo đảm.","Tạo lập bất động sản và phát triển dự án: chấp thuận đầu tư, quy hoạch, đất đai, xây dựng, nghiệm thu và điều kiện đưa sản phẩm vào kinh doanh.","Quản lý nhà ở và công trình xây dựng: phát triển nhà ở, sở hữu, quản lý sử dụng, giao dịch, nhà ở xã hội và các loại hình nhà ở theo luật chuyên ngành.","Kinh doanh bất động sản: điều kiện đối với tổ chức, cá nhân kinh doanh; điều kiện đối với nhà ở, công trình xây dựng và quyền sử dụng đất đưa vào kinh doanh; công khai thông tin; kinh doanh và chuyển nhượng dự án.","Các hình thức kinh doanh: mua bán, cho thuê, cho thuê lại, thuê mua nhà ở, công trình xây dựng; chuyển nhượng, cho thuê, cho thuê lại quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản.","Kinh doanh dịch vụ bất động sản: sàn giao dịch, môi giới, tư vấn và quản lý bất động sản; điều kiện hành nghề, quyền, nghĩa vụ và trách nhiệm của chủ thể cung ứng dịch vụ.","Hợp đồng và giao dịch bất động sản: giao kết, thực hiện, sửa đổi, chuyển nhượng hợp đồng; thanh toán; bàn giao; bảo hành; đăng ký quyền và xử lý vi phạm hợp đồng.","Quản lý nhà nước đối với thị trường bất động sản: hệ thống thông tin, cơ sở dữ liệu; điều tiết thị trường; kiểm tra, thanh tra và xử lý vi phạm.","Giải quyết tranh chấp và bảo vệ quyền lợi: thương lượng, hòa giải, trọng tài hoặc Tòa án theo thỏa thuận và quy định pháp luật."]}]}]}]}}</script>
