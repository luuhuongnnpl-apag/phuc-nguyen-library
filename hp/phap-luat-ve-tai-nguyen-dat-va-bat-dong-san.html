trọng tâm","rows":[{"t":"Nghị định số 96/2024/NĐ-CP","d":"24/07/2024","org":"Chính phủ","note":"Quy định chi tiết một số điều của Luật Kinh doanh bất động sản; tra cứu bản hợp nhất 124/2026/VBHN-NĐ-BXD ngày 30/09/2026.","url":"https://thuvienphapluat.vn/van-ban/bat-dong-san/Van-ban-hop-nhat-124-2026-VBHN-ND-BXD-Nghi-dinh-huong-dan-Luat-Kinh-doanh-bat-dong-san-727620.aspx"},{"t":"Nghị định số 95/2024/NĐ-CP","d":"24/07/2024","org":"Chính phủ","note":"Quy định chi tiết một số điều của Luật Nhà ở.","url":"https://thuvienphapluat.vn/page/tim-van-ban.aspx?keyword=95%2F2024%2FN%C4%90-CP&match=True"}]}],"al":[],"ly":{"root":"Pháp luật về tài nguyên đất và bất động sản","ch":[{"t":"Chương 1. Tổng quan pháp luật về tài nguyên đất và bất động sản","cs":"Đề cương chi tiết học phần, Mục 9.1; Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025); Luật Đất đai số 31/2024/QH15 (Văn bản hợp nhất 44/VBHN-VPQH ngày 16/03/2026); Bộ luật Dân sự số 91/2015/QH13; Luật Kinh doanh bất động sản số 29/2023/QH15; Luật Nhà ở số 27/2023/QH15.","c":[{"t":"Khái quát chung về pháp luật về tài nguyên đất","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024, Điều 3, Điều 4 và Điều 9.","c":[{"t":"Khái niệm, đặc điểm đất đai","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024, Điều 3, Điều 4, Điều 9.","b":["Đất đai là bộ phận lãnh thổ quốc gia, tài nguyên thiên nhiên đặc biệt, tư liệu sản xuất quan trọng và không gian cho các hoạt động kinh tế, văn hóa, xã hội, quốc phòng, an ninh.","Đất đai thuộc sở hữu toàn dân; Nhà nước là đại diện chủ sở hữu và thống nhất quản lý. Tổ chức, cá nhân không có quyền sở hữu tư nhân đối với đất đai mà có thể được Nhà nước trao quyền sử dụng đất hoặc nhận quyền sử dụng đất theo quy định.","Đất đai có vị trí cố định, không thể di dời; hoạt động quản lý, khai thác và giao dịch phải gắn với vị trí, ranh giới, địa giới hành chính, quy hoạch và hiện trạng thửa đất.","Đất đai có diện tích hữu hạn, không thể tự mở rộng theo nhu cầu sử dụng; chất lượng và khả năng sinh lợi không đồng nhất do điều kiện tự nhiên, vị trí, hạ tầng và mục đích sử dụng.","Đất đai có tính đa công năng; việc sử dụng cho nông nghiệp, phi nông nghiệp hoặc mục đích khác phải phù hợp phân loại đất và tuân thủ điều kiện, thẩm quyền, trình tự chuyển mục đích.","Đất đai có liên hệ chặt chẽ với môi trường và hệ sinh thái; việc sử dụng tại một khu vực có thể ảnh hưởng nguồn nước, môi trường và quyền, lợi ích của người sử dụng đất liền kề.","Cần phân biệt đất đai với quyền sử dụng đất: đất đai thuộc sở hữu toàn dân; quyền sử dụng đất là quyền tài sản được pháp luật ghi nhận, bảo hộ và cho phép thực hiện trong phạm vi, điều kiện luật định."]},{"t":"Vai trò pháp luật về đất đai","cs":"Hiến pháp năm 2013, Điều 53; Luật Đất đai 2024; Nghị quyết 18-NQ/TW ngày 16/06/2022.","b":["Xác lập và bảo đảm thực hiện chế độ sở hữu toàn dân về đất đai; xác định vị trí của Nhà nước với tư cách đại diện chủ sở hữu và chủ thể thống nhất quản lý.","Thiết lập khuôn khổ pháp lý để phân bổ nguồn lực đất đai thông qua quy hoạch, kế hoạch sử dụng đất, giao đất, cho thuê đất, công nhận quyền sử dụng đất và cho phép chuyển mục đích sử dụng đất.","Xác định quyền, nghĩa vụ và trách nhiệm của người sử dụng đất; bảo vệ quyền, lợi ích hợp pháp của người sử dụng đất và chủ thể có liên quan.","Điều tiết quan hệ lợi ích giữa Nhà nước, người sử dụng đất, nhà đầu tư và cộng đồng; tạo cơ sở pháp lý cho thu hồi đất, bồi thường, hỗ trợ, tái định cư và nghĩa vụ tài chính.","Bảo vệ tài nguyên đất, kiểm soát ô nhiễm, suy thoái, lãng phí và hành vi sử dụng đất trái pháp luật; hướng tới sử dụng đất tiết kiệm, hiệu quả, bền vững.","Tạo lập môi trường pháp lý cho thị trường quyền sử dụng đất và hoạt động đầu tư, kinh doanh bất động sản; góp phần công khai thông tin, minh bạch giao dịch.","Là công cụ để kiểm tra, thanh tra, xử lý vi phạm và giải quyết tranh chấp, khiếu nại, tố cáo trong quản lý, sử dụng đất."]},{"t":"Nội dung điều chỉnh của pháp luật về tài nguyên đất","cs":"Luật Đất đai 2024; Bộ luật Dân sự 2015 và pháp luật về quy hoạch, đầu tư, xây dựng, tài chính, môi trường có liên quan.","b":["Chế độ sở hữu và đại diện chủ sở hữu: đất đai thuộc sở hữu toàn dân; Nhà nước đại diện chủ sở hữu và thống nhất quản lý.","Quản lý nhà nước về đất đai: điều tra, đo đạc, lập bản đồ; quy hoạch, kế hoạch sử dụng đất; giao đất, cho thuê đất, chuyển mục đích; đăng ký, cấp Giấy chứng nhận; xây dựng cơ sở dữ liệu và hệ thống thông tin đất đai.","Chế độ sử dụng đất: phân loại đất; căn cứ, thời hạn, hạn mức sử dụng; điều kiện, hình thức sử dụng; bảo vệ, cải tạo và phục hồi đất.","Địa vị pháp lý của người sử dụng đất: chủ thể sử dụng đất; quyền chung, nghĩa vụ chung; quyền và nghĩa vụ theo hình thức, nguồn gốc và thời hạn sử dụng đất.","Tài chính và giá đất: tiền sử dụng đất, tiền thuê đất, thuế, phí, lệ phí; giá đất, bảng giá đất, giá đất cụ thể và cơ chế tài chính theo pháp luật hiện hành.","Thu hồi đất, trưng dụng đất, bồi thường, hỗ trợ và tái định cư; bảo đảm điều kiện, trình tự, thẩm quyền và quyền của người có đất bị thu hồi.","Giám sát, kiểm tra, thanh tra, xử lý vi phạm; giải quyết tranh chấp đất đai, khiếu nại, tố cáo và khởi kiện theo thẩm quyền, thủ tục luật định.","Quan hệ giữa pháp luật đất đai với pháp luật dân sự, đầu tư, xây dựng, quy hoạch, nhà ở, kinh doanh bất động sản, thuế, môi trường và tố tụng."]}]},{"t":"Khái quát chung về pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015, Điều 105 và Điều 107; Luật Kinh doanh bất động sản 2023, Điều 1 và Điều 3; Luật Nhà ở 2023, Điều 2.","c":[{"t":"Khái niệm, đặc điểm bất động sản","cs":"Bộ luật Dân sự 2015, Điều 105 và Điều 107; Luật Kinh doanh bất động sản 2023, Điều 3.","b":["Theo Điều 107 Bộ luật Dân sự năm 2015, bất động sản bao gồm đất đai; nhà, công trình xây dựng gắn liền với đất đai; tài sản khác gắn liền với đất đai, nhà, công trình xây dựng; và tài sản khác theo quy định của pháp luật.","Bất động sản là một loại tài sản; cần phân biệt khái niệm bất động sản trong pháp luật dân sự với phạm vi bất động sản, dự án bất động sản và hoạt động kinh doanh bất động sản được điều chỉnh chuyên biệt bởi Luật Kinh doanh bất động sản.","Quyền sử dụng đất không đồng nhất với quyền sở hữu đất đai. Đối tượng giao dịch có thể là quyền sử dụng đất, tài sản gắn liền với đất hoặc dự án bất động sản theo điều kiện luật định.","Bất động sản có tính bất động về vị trí; giá trị và khả năng khai thác chịu ảnh hưởng của vị trí, kết nối hạ tầng, quy hoạch, môi trường và điều kiện kinh tế - xã hội.","Bất động sản có tính cá biệt, không đồng nhất; các tài sản khác nhau về diện tích, kết cấu, mục đích sử dụng, tình trạng pháp lý, chất lượng công trình và khả năng sinh lợi.","Bất động sản thường có giá trị lớn, thời gian khai thác dài và chịu sự điều chỉnh của nhiều lĩnh vực pháp luật; giao dịch đòi hỏi kiểm tra chủ thể, quyền đối với tài sản, quy hoạch, nghĩa vụ tài chính và điều kiện giao dịch.","Bất động sản có tính khan hiếm tương đối và chịu tác động của chu kỳ thị trường; nguồn cung, nhu cầu, tín dụng, chính sách đất đai, quy hoạch và đầu tư hạ tầng có thể làm thay đổi giá trị.","Quyền đối với bất động sản phải được thực hiện trong giới hạn pháp luật, bảo đảm lợi ích công cộng, trật tự đô thị, an sinh xã hội và bảo vệ môi trường."]},{"t":"Vai trò pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Kinh doanh bất động sản 2023.","b":["Xác định địa vị pháp lý của bất động sản và quyền của chủ sở hữu, người sử dụng đất, chủ đầu tư, bên mua, bên thuê và các chủ thể liên quan.","Thiết lập điều kiện pháp lý để tạo lập, phát triển, đưa bất động sản vào kinh doanh và thực hiện giao dịch trên thị trường.","Bảo đảm an toàn pháp lý cho giao dịch thông qua yêu cầu về thông tin, hồ sơ, điều kiện của bất động sản, hình thức hợp đồng, công chứng, chứng thực và đăng ký khi pháp luật quy định.","Bảo vệ người mua, người thuê, người thuê mua và nhà đầu tư; kiểm soát việc huy động vốn, kinh doanh nhà ở và công trình xây dựng hình thành trong tương lai.","Tạo môi trường cạnh tranh, công khai, minh bạch; phòng ngừa gian lận, cung cấp thông tin sai lệch và kinh doanh bất động sản không đủ điều kiện.","Điều tiết thị trường gắn với quy hoạch, kế hoạch sử dụng đất, chương trình phát triển nhà ở, phát triển đô thị và mục tiêu ổn định kinh tế - xã hội.","Hài hòa lợi ích giữa Nhà nước, nhà đầu tư, người sử dụng bất động sản và cộng đồng; góp phần sử dụng hiệu quả nguồn lực đất đai và tài sản gắn liền với đất."]},{"t":"Nội dung điều chỉnh của pháp luật về bất động sản","cs":"Bộ luật Dân sự 2015; Luật Đất đai 2024; Luật Nhà ở 2023; Luật Kinh doanh bất động sản 2023; pháp luật về đầu tư, xây dựng, quy hoạch, thuế và bảo vệ người tiêu dùng.","b":["Xác lập, thực hiện và bảo vệ quyền đối với bất động sản: quyền sở hữu nhà ở, công trình xây dựng; quyền sử dụng đất; quyền khác đối với tài sản và các biện pháp bảo đảm.","Tạo lập bất động sản và phát triển dự án: chấp thuận đầu tư, quy hoạch, đất đai, xây dựng, nghiệm thu và điều kiện đưa sản phẩm vào kinh doanh.","Quản lý nhà ở và công trình xây dựng: phát triển nhà ở, sở hữu, quản lý sử dụng, giao dịch, nhà ở xã hội và các loại hình nhà ở theo luật chuyên ngành.","Kinh doanh bất động sản: điều kiện đối với tổ chức, cá nhân kinh doanh; điều kiện đối với nhà ở, công trình xây dựng và quyền sử dụng đất đưa vào kinh doanh; công khai thông tin; kinh doanh và chuyển nhượng dự án.","Các hình thức kinh doanh: mua bán, cho thuê, cho thuê lại, thuê mua nhà ở, công trình xây dựng; chuyển nhượng, cho thuê, cho thuê lại quyền sử dụng đất đã có hạ tầng kỹ thuật trong dự án bất động sản.","Kinh doanh dịch vụ bất động sản: sàn giao dịch, môi giới, tư vấn và quản lý bất động sản; điều kiện hành nghề, quyền, nghĩa vụ và trách nhiệm của chủ thể cung ứng dịch vụ.","Hợp đồng và giao dịch bất động sản: giao kết, thực hiện, sửa đổi, chuyển nhượng hợp đồng; thanh toán; bàn giao; bảo hành; đăng ký quyền và xử lý vi phạm hợp đồng.","Quản lý nhà nước đối với thị trường bất động sản: hệ thống thông tin, cơ sở dữ liệu; điều tiết thị trường; kiểm tra, thanh tra và xử lý vi phạm.","Giải quyết tranh chấp và bảo vệ quyền lợi: thương lượng, hòa giải, trọng tài hoặc Tòa án theo thỏa thuận và quy định pháp luật."]}]}]},{"t":"Chương 2. Quản lý nhà nước trong lĩnh vực đất đai","cs":"Đề cương chi tiết học phần, Mục 9.2; Hiến pháp năm 2013 (sửa đổi, bổ sung năm 2025); Luật Đất đai số 31/2024/QH15, Văn bản hợp nhất 44/VBHN-VPQH ngày 16/03/2026; Nghị định 102/2024/NĐ-CP (được sửa đổi, bổ sung); Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT ngày 02/04/2026; Nghị quyết 254/2025/QH15 và các Nghị định 49/2026/NĐ-CP, 50/2026/NĐ-CP.","c":[{"t":"Hệ thống cơ quan quản lý nhà nước về đất đai","cs":"Luật Đất đai 2024, các quy định về trách nhiệm quản lý nhà nước về đất đai; Nghị định 151/2025/NĐ-CP, được sửa đổi, bổ sung và hợp nhất tại 41/VBHN-BNNMT ngày 02/04/2026.","b":["Quản lý nhà nước về đất đai được tổ chức trong hệ thống cơ quan hành chính nhà nước từ trung ương đến địa phương; cơ quan có thẩm quyền thực hiện nhiệm vụ theo phân công, phân cấp, phân quyền và quy định chuyên ngành.","Chính phủ thống nhất quản lý nhà nước về đất đai trên phạm vi cả nước; tổ chức thi hành pháp luật, ban hành văn bản theo thẩm quyền, chỉ đạo các bộ, ngành và chính quyền địa phương.","Bộ Nông nghiệp và Môi trường là cơ quan đầu mối giúp Chính phủ thực hiện quản lý nhà nước về đất đai; tham mưu chính sách, hướng dẫn chuyên môn, tổ chức điều tra cơ bản, xây dựng hệ thống thông tin và theo dõi việc thi hành pháp luật theo chức năng được giao.","Các bộ, cơ quan ngang bộ thực hiện quản lý nhà nước về đất đai trong phạm vi ngành, lĩnh vực được phân công; phối hợp với cơ quan quản lý đất đai trong quy hoạch, đầu tư, xây dựng, tài chính, thuế, môi trường, quốc phòng và an ninh.","Chính quyền địa phương thực hiện quản lý đất đai trên địa bàn theo thẩm quyền; tổ chức thực hiện quy hoạch, kế hoạch sử dụng đất, thủ tục hành chính, giao đất, cho thuê đất, thu hồi đất, đăng ký đất đai và các nhiệm vụ khác được pháp luật giao.","Trong mô hình chính quyền địa phương 02 cấp, thẩm quyền của cấp tỉnh và cấp xã được xác định theo Luật Đất đai và văn bản phân định, phân quyền, phân cấp; không mặc nhiên áp dụng quy định về thẩm quyền của cấp huyện trước khi tổ chức lại chính quyền địa phương.","Nghị định 151/2025/NĐ-CP, được sửa đổi, bổ sung và hợp nhất tại Văn bản hợp nhất 41/VBHN-BNNMT, là căn cứ quan trọng để xác định nhiệm vụ, quyền hạn được chuyển giao hoặc phân định giữa cơ quan cấp tỉnh, cấp xã và cơ quan chuyên môn.","Cơ quan chuyên môn về đất đai, tổ chức đăng ký đất đai và đơn vị có chức năng phát triển quỹ đất thực hiện nhiệm vụ chuyên môn, nghiệp vụ, dịch vụ công theo quy định; không đồng nhất chức năng tham mưu, đăng ký, cung cấp dịch vụ với thẩm quyền quyết định hành chính của cơ quan nhà nước.","Việc xác định đúng cơ quan có thẩm quyền phải căn cứ đồng thời vào loại việc, chủ thể sử dụng đất, đối tượng và địa bàn, cấp hành chính, quy định phân cấp và quy định chuyển tiếp tại thời điểm giải quyết hồ sơ."]},{"t":"Nội dung quản lý nhà nước về đất đai","cs":"Luật Đất đai 2024; Nghị định 102/2024/NĐ-CP (được sửa đổi, bổ sung); Nghị định 101/2024/NĐ-CP (được sửa đổi, bổ sung); Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT.","c":[{"t":"Quy hoạch và kế hoạch sử dụng đất","cs":"Luật Đất đai 2024, các quy định về nguyên tắc, hệ thống, nội dung, lập, điều chỉnh, thẩm định, phê duyệt và tổ chức thực hiện quy hoạch, kế hoạch sử dụng đất.","b":["Quy hoạch sử dụng đất là việc phân bổ, khoanh vùng đất đai theo không gian sử dụng cho các mục tiêu phát triển kinh tế - xã hội, quốc phòng, an ninh, bảo vệ môi trường và thích ứng biến đổi khí hậu trên cơ sở tiềm năng đất đai, nhu cầu sử dụng của ngành, lĩnh vực và địa phương.","Kế hoạch sử dụng đất cụ thể hóa quy hoạch theo kỳ và theo thời gian thực hiện; là căn cứ tổ chức thực hiện các chỉ tiêu, nhiệm vụ sử dụng đất và xem xét một số quyết định hành chính về đất đai theo luật định.","Nguyên tắc lập quy hoạch, kế hoạch: phù hợp chiến lược, quy hoạch tổng thể và quy hoạch có liên quan; bảo đảm thống nhất, đồng bộ; khai thác hợp lý tài nguyên; sử dụng tiết kiệm, hiệu quả; bảo vệ môi trường, di sản và lợi ích công cộng.","Hệ thống quy hoạch, kế hoạch sử dụng đất được tổ chức theo cấp và phạm vi lãnh thổ do Luật Đất đai quy định; phải phân biệt quy hoạch sử dụng đất cấp quốc gia, cấp tỉnh, quy hoạch sử dụng đất quốc phòng, an ninh và các nội dung kế hoạch có liên quan.","Nội dung quy hoạch xác định quan điểm, mục tiêu, chỉ tiêu, định hướng phân bổ không gian sử dụng đất, diện tích các loại đất và giải pháp tổ chức thực hiện; kế hoạch xác định tiến độ, diện tích và danh mục nhiệm vụ cần triển khai trong kỳ.","Việc lập quy hoạch, kế hoạch phải dựa trên điều tra, đánh giá tài nguyên đất, hiện trạng sử dụng, nhu cầu của ngành và địa phương, dự báo biến động, khả năng đầu tư hạ tầng và yêu cầu bảo vệ môi trường.","Trình tự cơ bản gồm: thu thập thông tin, xác định nhu cầu và chỉ tiêu; lập phương án; lấy ý kiến theo quy định; thẩm định; quyết định hoặc phê duyệt; công bố công khai; tổ chức thực hiện, theo dõi và đánh giá.","Quy hoạch, kế hoạch sử dụng đất là căn cứ quan trọng nhưng không tự thân làm phát sinh quyền sử dụng đất cho một chủ thể; việc giao đất, cho thuê đất, chuyển mục đích hoặc thu hồi đất vẫn phải đáp ứng điều kiện, thẩm quyền và trình tự riêng.","Người sử dụng đất và tổ chức, cá nhân có liên quan cần tra cứu quy hoạch, kế hoạch đã được cơ quan có thẩm quyền phê duyệt, công bố; thông tin quy hoạch phải được xem xét cùng hồ sơ pháp lý cụ thể của thửa đất."]},{"t":"Giao đất, cho thuê đất, chuyển mục đích sử dụng đất","cs":"Luật Đất đai 2024, các quy định về căn cứ, thẩm quyền, đối tượng, điều kiện và trình tự giao đất, cho thuê đất, chuyển mục đích sử dụng đất; Nghị định 102/2024/NĐ-CP và Văn bản hợp nhất 46/VBHN-BNNMT ngày 03/04/2026; Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT.","b":["Giao đất là việc Nhà nước ban hành quyết định trao quyền sử dụng đất cho đối tượng có nhu cầu, theo hình thức có thu tiền sử dụng đất hoặc không thu tiền sử dụng đất trong trường hợp luật định.","Cho thuê đất là việc Nhà nước quyết định trao quyền sử dụng đất có thời hạn thông qua hợp đồng thuê đất; tiền thuê đất có thể được trả hằng năm hoặc trả một lần cho cả thời gian thuê trong trường hợp pháp luật cho phép.","Chuyển mục đích sử dụng đất là việc thay đổi mục đích sử dụng từ loại đất này sang loại đất khác; tùy trường hợp phải được cơ quan có thẩm quyền cho phép, phải đăng ký biến động hoặc không phải thực hiện thủ tục xin phép theo luật.","Căn cứ xem xét giao đất, cho thuê đất và cho phép chuyển mục đích gồm quy hoạch, kế hoạch sử dụng đất hoặc căn cứ quy hoạch được luật quy định; nhu cầu sử dụng đất; hồ sơ dự án, năng lực và điều kiện của chủ thể; các điều kiện chuyên ngành tương ứng.","Đối tượng được giao đất, thuê đất và hình thức sử dụng đất được xác định theo chủ thể, mục đích, nguồn gốc và trường hợp cụ thể; không thể suy luận một hình thức áp dụng chung cho mọi tổ chức, hộ gia đình, cá nhân.","Thẩm quyền quyết định được xác định theo loại chủ thể, loại đất và quy định phân định thẩm quyền trong mô hình chính quyền địa phương 02 cấp; phải tra cứu văn bản hiện hành thay vì sử dụng máy móc tên cơ quan hoặc thẩm quyền trước ngày 01/07/2025.","Trình tự cơ bản có thể bao gồm: chuẩn bị hồ sơ; tiếp nhận và kiểm tra; xác định nhu cầu, điều kiện; thẩm định; ban hành quyết định; xác định nghĩa vụ tài chính; ký hợp đồng thuê đất nếu có; bàn giao đất trên thực địa và cập nhật hồ sơ địa chính.","Người được giao đất, thuê đất hoặc chuyển mục đích phải thực hiện nghĩa vụ tài chính, sử dụng đất đúng mục đích, đúng ranh giới, đúng thời hạn và tuân thủ nghĩa vụ khác theo quyết định, hợp đồng và pháp luật.","Trường hợp chuyển mục đích phải xin phép, người sử dụng đất chỉ được thực hiện mục đích mới sau khi có quyết định cho phép và hoàn thành nghĩa vụ theo quy định; việc tự ý chuyển mục đích có thể bị xử lý và buộc khôi phục tình trạng hoặc thực hiện biện pháp khắc phục theo pháp luật.","Cần phân biệt quyết định giao đất, cho thuê đất, cho phép chuyển mục đích với thủ tục đăng ký đất đai, cấp Giấy chứng nhận; đây là các khâu pháp lý liên quan nhưng có đối tượng và ý nghĩa pháp lý khác nhau."]},{"t":"Cấp Giấy chứng nhận quyền sử dụng đất và quyền sở hữu tài sản gắn liền với đất","cs":"Luật Đất đai 2024, các quy định về đăng ký đất đai, tài sản gắn liền với đất và cấp Giấy chứng nhận; Nghị định 101/2024/NĐ-CP được sửa đổi, bổ sung; Văn bản hợp nhất 83/VBHN-BNNMT ngày 09/12/2025.","b":["Đăng ký đất đai là việc kê khai, ghi nhận tình trạng pháp lý về quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất và các thông tin liên quan trong hồ sơ địa chính, cơ sở dữ liệu đất đai.","Đăng ký đất đai có tính bắt buộc đối với người sử dụng đất và người được giao đất để quản lý theo quy định; đăng ký tài sản gắn liền với đất được thực hiện theo điều kiện và nhu cầu, trường hợp pháp luật quy định.","Giấy chứng nhận là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền; nội dung ghi nhận phải phù hợp hồ sơ và điều kiện pháp luật.","Cần phân biệt cấp Giấy chứng nhận lần đầu với đăng ký biến động, cấp đổi, cấp lại; mỗi thủ tục có căn cứ, hồ sơ và hệ quả pháp lý khác nhau.","Điều kiện cấp Giấy chứng nhận phụ thuộc nguồn gốc và quá trình sử dụng đất, giấy tờ về quyền, thời điểm sử dụng, tình trạng tranh chấp, vi phạm, quy hoạch và việc thực hiện nghĩa vụ tài chính theo từng trường hợp luật định.","Đối với tài sản gắn liền với đất, việc chứng nhận còn phụ thuộc quyền sở hữu hợp pháp, tình trạng xây dựng, điều kiện tồn tại của tài sản và quy định chuyên ngành về nhà ở, công trình xây dựng.","Hồ sơ thường có đơn đăng ký, giấy tờ về quyền sử dụng đất hoặc tài sản nếu có, giấy tờ nhân thân hoặc pháp nhân, tài liệu về nghĩa vụ tài chính và tài liệu khác tương ứng với trường hợp cụ thể.","Quy trình xử lý gồm tiếp nhận hồ sơ; kiểm tra, xác minh và trích đo khi cần; xác định điều kiện; thực hiện nghĩa vụ tài chính; ký cấp hoặc cập nhật thông tin; trao Giấy chứng nhận và chỉnh lý hồ sơ địa chính.","Cơ quan tiếp nhận, cơ quan giải quyết và người có thẩm quyền ký cấp được xác định theo pháp luật đất đai hiện hành và quy định phân định thẩm quyền của chính quyền địa phương 02 cấp.","Giấy chứng nhận là chứng cứ pháp lý quan trọng nhưng không loại trừ việc xem xét, xử lý khi có căn cứ xác định việc cấp không đúng đối tượng, không đúng diện tích, sai nguồn gốc hoặc vi phạm pháp luật; việc đính chính, thu hồi, hủy hoặc cấp lại phải theo đúng căn cứ và thủ tục luật định."]},{"t":"Thu hồi đất, bồi thường, hỗ trợ, tái định cư","cs":"Luật Đất đai 2024, các quy định về thu hồi đất, bồi thường, hỗ trợ, tái định cư; Nghị định 88/2024/NĐ-CP được sửa đổi, bổ sung bởi Nghị định 226/2025/NĐ-CP; Nghị định 151/2025/NĐ-CP và Văn bản hợp nhất 41/VBHN-BNNMT.","b":["Thu hồi đất là việc Nhà nước quyết định thu lại quyền sử dụng đất của người được Nhà nước trao quyền hoặc thu lại đất của người sử dụng đất vi phạm pháp luật theo căn cứ luật định.","Các nhóm căn cứ thu hồi đất gồm thu hồi vì mục đích quốc phòng, an ninh; phát triển kinh tế - xã hội vì lợi ích quốc gia, công cộng; vi phạm pháp luật đất đai; chấm dứt việc sử dụng đất theo pháp luật, tự nguyện trả lại đất hoặc trường hợp khác do luật quy định.","Mỗi nhóm thu hồi có điều kiện, căn cứ và trình tự riêng; không phải mọi trường hợp Nhà nước thu hồi đất đều phát sinh quyền được bồi thường về đất.","Bồi thường về đất được xem xét khi đáp ứng điều kiện luật định; hình thức có thể là giao đất có cùng mục đích, bằng tiền hoặc hình thức khác theo trường hợp cụ thể.","Bồi thường thiệt hại về tài sản gắn liền với đất và chi phí đầu tư vào đất còn lại được xác định riêng theo loại tài sản, điều kiện tạo lập, hồ sơ chứng minh và quy định pháp luật.","Hỗ trợ là chính sách của Nhà nước nhằm ổn định đời sống, sản xuất, chuyển đổi nghề nghiệp, tìm kiếm việc làm và các nhu cầu cần thiết khác cho người có đất thu hồi, chủ sở hữu tài sản hoặc đối tượng liên quan theo điều kiện luật định.","Tái định cư là việc Nhà nước bố trí chỗ ở mới cho người có đất ở bị thu hồi phải di chuyển chỗ ở và đủ điều kiện; phương án phải bảo đảm các yêu cầu về điều kiện sống, hạ tầng và chính sách áp dụng.","Trình tự cơ bản gồm thông báo thu hồi; điều tra, khảo sát, đo đạc, kiểm đếm; lập và lấy ý kiến về phương án bồi thường, hỗ trợ, tái định cư; thẩm định, phê duyệt; công khai và tổ chức chi trả, bố trí tái định cư; ban hành và thực hiện quyết định thu hồi theo trình tự luật định.","Người có đất thu hồi có quyền được thông tin, tham gia ý kiến, nhận bồi thường và hỗ trợ nếu đủ điều kiện; đồng thời có trách nhiệm phối hợp kiểm đếm, bàn giao đất và thực hiện quyết định có hiệu lực theo quy định.","Cần phân biệt thu hồi đất với trưng dụng đất: thu hồi làm chấm dứt quyền sử dụng đất theo căn cứ luật định; trưng dụng là biện pháp sử dụng đất trong trường hợp thật cần thiết theo điều kiện, thời hạn và thẩm quyền riêng."]},{"t":"Tài chính về đất đai, giá đất","cs":"Luật Đất đai 2024, các quy định về tài chính đất đai và giá đất; Nghị định 71/2024/NĐ-CP được sửa đổi, bổ sung; Nghị quyết 254/2025/QH15; Nghị định 49/2026/NĐ-CP và Nghị định 50/2026/NĐ-CP.","b":["Tài chính về đất đai là hệ thống các khoản thu, chi và cơ chế điều tiết giá trị đất đai giữa Nhà nước, người sử dụng đất và chủ thể có liên quan theo quy định pháp luật.","Các khoản thu từ đất có thể gồm tiền sử dụng đất, tiền thuê đất, thuế liên quan đến đất, thuế thu nhập từ chuyển quyền, lệ phí trước bạ, phí và lệ phí khác theo pháp luật thuế, phí và đất đai.","Các khoản chi và chính sách tài chính liên quan gồm kinh phí bồi thường, hỗ trợ, tái định cư; chi đầu tư, quản lý, phát triển quỹ đất và các khoản chi hợp pháp khác.","Giá đất là giá trị bằng tiền của quyền sử dụng đất tính trên một đơn vị diện tích; việc xác định giá phải tuân thủ nguyên tắc, phương pháp, dữ liệu và trình tự do pháp luật quy định.","Bảng giá đất do cơ quan có thẩm quyền ở địa phương xây dựng, trình quyết định theo quy định; được sử dụng trong các trường hợp luật định và phải được cập nhật, điều chỉnh theo cơ chế pháp luật hiện hành.","Giá đất cụ thể được xác định cho các trường hợp cần xác định giá riêng theo luật; cần phân biệt giá đất cụ thể với bảng giá đất và giá giao dịch trên thị trường.","Các phương pháp định giá đất được pháp luật quy định có thể bao gồm so sánh, thu nhập, thặng dư và hệ số điều chỉnh giá đất; việc lựa chọn phương pháp phải căn cứ điều kiện dữ liệu, đặc điểm thửa đất và quy định áp dụng.","Nghĩa vụ tài chính về đất phụ thuộc vào nguồn gốc, hình thức sử dụng, mục đích, diện tích, thời hạn, giá đất và chính sách miễn, giảm hoặc ghi nợ được áp dụng.","Nghị quyết 254/2025/QH15 và các Nghị định 49/2026/NĐ-CP, 50/2026/NĐ-CP bổ sung cơ chế tháo gỡ khó khăn trong tổ chức thi hành Luật Đất đai, trong đó có nội dung về tiền sử dụng đất, tiền thuê đất; khi xử lý hồ sơ phải đối chiếu quy định chuyên biệt và điều khoản chuyển tiếp.","Không đồng nhất giá đất do Nhà nước xác định với giá mua bán do các bên thỏa thuận; giá giao dịch chịu tác động thị trường nhưng không thay thế giá, căn cứ tính nghĩa vụ tài chính trong các trường hợp luật định."]},{"t":"Cơ sở dữ liệu về đất đai","cs":"Luật Đất đai 2024, các quy định về hệ thống thông tin, cơ sở dữ liệu đất đai; Nghị định 101/2024/NĐ-CP được sửa đổi, bổ sung; Văn bản hợp nhất 83/VBHN-BNNMT ngày 09/12/2025; Thông tư 19/2026/TT-BNNMT ngày 30/03/2026.","b":["Cơ sở dữ liệu đất đai là tập hợp dữ liệu được tổ chức, quản lý và cập nhật để phản ánh thông tin về thửa đất, người sử dụng đất, người được giao quản lý đất, quyền và nghĩa vụ, tài sản gắn liền với đất và các thông tin quản lý có liên quan.","Hệ thống thông tin đất đai phục vụ quản lý nhà nước, giải quyết thủ tục hành chính, cung cấp thông tin cho tổ chức, cá nhân và hỗ trợ hoạch định chính sách, quy hoạch, đầu tư.","Các nhóm dữ liệu cơ bản gồm dữ liệu địa chính; dữ liệu điều tra, đánh giá, bảo vệ, cải tạo và phục hồi đất; dữ liệu quy hoạch, kế hoạch sử dụng đất; dữ liệu giá đất; dữ liệu thống kê, kiểm kê; dữ liệu thanh tra, kiểm tra và các dữ liệu chuyên ngành liên quan.","Hồ sơ địa chính ghi nhận thông tin pháp lý và kỹ thuật về thửa đất, người sử dụng đất, người được giao quản lý đất và tài sản gắn liền với đất; là cơ sở để đăng ký, cấp Giấy chứng nhận và quản lý biến động.","Dữ liệu phải được thu thập, chuẩn hóa, kiểm tra, cập nhật kịp thời, bảo đảm tính đầy đủ, chính xác, thống nhất, có khả năng kết nối và chia sẻ theo tiêu chuẩn kỹ thuật.","Biến động về người sử dụng đất, diện tích, ranh giới, mục đích, thời hạn, quyền và tài sản gắn liền với đất phải được đăng ký, cập nhật, chỉnh lý theo quy định.","Cơ quan quản lý đất đai và tổ chức đăng ký đất đai thực hiện xây dựng, vận hành, quản lý và khai thác dữ liệu theo chức năng; trách nhiệm cập nhật, cung cấp và khai thác dữ liệu được phân định theo pháp luật.","Việc khai thác thông tin phải đúng mục đích, phạm vi và thẩm quyền; bảo đảm quyền tiếp cận thông tin của tổ chức, cá nhân đồng thời bảo vệ dữ liệu cá nhân, bí mật nhà nước và thông tin thuộc phạm vi hạn chế tiếp cận.","Số hóa hồ sơ, kết nối dữ liệu và cung cấp dịch vụ công trực tuyến góp phần giảm giấy tờ, rút ngắn thời gian xử lý, tăng minh bạch và hỗ trợ giám sát việc quản lý, sử dụng đất.","Chỉ thị 05/CT-TTg ngày 13/02/2026 nhấn mạnh việc tập trung nguồn lực đẩy nhanh đo đạc, đăng ký đất đai, lập hồ sơ địa chính và xây dựng cơ sở dữ liệu quốc gia về đất đai; đây là định hướng tổ chức thực hiện, không thay thế quy định pháp luật về đăng ký và cập nhật dữ liệu."]}]}]}]}}</script>
